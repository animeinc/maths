"problems":[
{"id":R`x10-p1`,"lv":R`真题`,"src":R`2021电子系期末答案计算2(3)（PDF第2页）`,"stmt":R`证明∫₀^(π/2)ln(sin x)dx收敛并求值。`,"hints":[R`收敛：唯一的问题在 $x=0$（$\ln\sin x\to-\infty$）。把 $\ln\sin x$ 拆成 $\ln x+\ln\frac{\sin x}x$。求值：用对称换元 $x\mapsto\frac\pi2-x$ 把 $\sin$ 变成 $\cos$。`,R`$\ln\frac{\sin x}x\to0$ 有界，$\int_0^1\ln x\,dx=-1$ 收敛，所以积分收敛。记 $J=\int_0^{\pi/2}\ln\sin x\,dx$，换元得 $J=\int_0^{\pi/2}\ln\cos x\,dx$，所以 $2J=\int_0^{\pi/2}\ln(\sin x\cos x)dx$。`,R`$\sin x\cos x=\frac{\sin2x}2$，$2J=\int_0^{\pi/2}\ln\sin2x\,dx-\frac\pi2\ln2$。令 $u=2x$：$\int_0^{\pi/2}\ln\sin2x\,dx=\frac12\int_0^\pi\ln\sin u\,du=\frac12\cdot2J=J$。`],"method":R`m-x10-audit`,"sol":R`<p><b>目标</b>：证 $J=\int_0^{\pi/2}\ln(\sin x)dx$ 收敛并求值。</p><p><b>第 1 步：收敛。</b>$x\in(0,\frac\pi2]$ 时 $\sin x\gt0$，只有 $x\to0^+$ 处 $\ln\sin x\to-\infty$。写</p>$$\ln\sin x=\ln x+\ln\frac{\sin x}x.$$<p>第二项 $\to\ln1=0$，在 $(0,\frac\pi2]$ 上有界（补值后连续）；第一项 $\int_0^{\pi/2}\ln x\,dx=[x\ln x-x]_0^{\pi/2}$ 有限（$x\ln x\to0$）。所以 $J$ 收敛。</p><p><b>第 2 步：对称换元。</b>令 $x=\frac\pi2-t$：</p>$$J=\int_0^{\pi/2}\ln\sin\left(\frac\pi2-t\right)dt=\int_0^{\pi/2}\ln\cos t\,dt.$$<p>（$\ln\cos t$ 的积分因此也收敛。）</p><p><b>第 3 步：相加。</b>两个收敛积分可以相加：</p>$$2J=\int_0^{\pi/2}\ln(\sin x\cos x)dx=\int_0^{\pi/2}\ln\frac{\sin2x}2dx=\int_0^{\pi/2}\ln\sin2x\,dx-\frac\pi2\ln2.$$<p><b>第 4 步：化回 $J$。</b>令 $u=2x$：$\int_0^{\pi/2}\ln\sin2x\,dx=\frac12\int_0^{\pi}\ln\sin u\,du$。由于 $\sin(\pi-u)=\sin u$，$\int_{\pi/2}^\pi\ln\sin u\,du=\int_0^{\pi/2}\ln\sin u\,du=J$，所以 $\frac12\int_0^\pi\ln\sin u\,du=\frac12\cdot2J=J$。</p><p><b>第 5 步：</b>$2J=J-\frac\pi2\ln2$，所以</p>$$J=-\frac\pi2\ln2.$$<p><b>答案：积分收敛，值为 $-\frac\pi2\ln2\approx-1.0888$。</b></p>`},
{"id":R`x10-p2`,"lv":R`核验题`,"src":R`2023电子系A卷2的条件核验与修正版（答案PDF第1页）`,"stmt":R`<p>连续f定义在[2,∞)。讨论 $I=\int_0^\infty f(x^{2024}+x^{-2024})\ln x/(1+x^2)dx$：</p><p>(1) 用f(s)=s说明仅连续不能保证I存在。</p><p>(2) 若进一步已知绝对收敛，证明I=0；若f有界，说明该前提成立。</p>`,"hints":[R`(1) 取 $f(s)=s$，看 $x\to\infty$ 时被积函数的大小。(2) 换元 $x=\frac1t$，注意 $x^{2024}+x^{-2024}$ 不变，$\ln x$ 变号，$\frac{dx}{1+x^2}$ 不变。`,R`(1) 被积函数 $=\frac{(x^{2024}+x^{-2024})\ln x}{1+x^2}\ge\frac{x^{2024}\ln x}{2x^2}=\frac12x^{2022}\ln x$（$x\ge1$），积分发散。(2) $x=\frac1t$：$dx=-\frac{dt}{t^2}$，$1+x^2=\frac{1+t^2}{t^2}$，所以 $\frac{dx}{1+x^2}=-\frac{dt}{1+t^2}$。`,R`(2) 代入并交换上下限：$I=\int_0^\infty f(t^{-2024}+t^{2024})\frac{-\ln t}{1+t^2}dt=-I$，又 $I$ 有限，所以 $I=0$。$f$ 有界时：$|\text{被积函数}|\le M\frac{|\ln x|}{1+x^2}$，两端可积。`],"method":R`m-x10-audit`,"sol":R`<p><b>说明</b>：$x\gt0$ 时 $x^{2024}+x^{-2024}\ge2$（均值不等式），所以 $f$ 只需在 $[2,\infty)$ 上有定义。</p><p><b>(1) 仅连续不够。</b>取 $f(s)=s$（连续）。$x\ge1$ 时 $\ln x\ge0$，$1+x^2\le2x^2$，被积函数</p>$$\frac{(x^{2024}+x^{-2024})\ln x}{1+x^2}\ge\frac{x^{2024}\ln x}{2x^2}=\frac12x^{2022}\ln x,$$<p>而 $\int_e^\infty\frac12x^{2022}\ln x\,dx\ge\int_e^\infty\frac12dx=\infty$，由比较判别法积分发散。所以 $I$ 不存在，不能说 $I=0$。</p><p><b>(2) 绝对收敛时 $I=0$。</b></p><p>第 1 步：在 $[\frac1R,R]$ 上令 $x=\frac1t$，$dx=-\frac{dt}{t^2}$，$\ln x=-\ln t$，$1+x^2=\frac{1+t^2}{t^2}$，$x^{2024}+x^{-2024}=t^{-2024}+t^{2024}$：</p>$$\int_{1/R}^Rf(x^{2024}+x^{-2024})\frac{\ln x}{1+x^2}dx=\int_{R}^{1/R}f(t^{2024}+t^{-2024})\frac{-\ln t}{\frac{1+t^2}{t^2}}\cdot\frac{-dt}{t^2}=-\int_{1/R}^{R}f(\cdots)\frac{\ln t}{1+t^2}dt.$$<p>第 2 步：已知 $I$ 绝对收敛，从而收敛，$\int_{1/R}^R\to I$（$R\to\infty$）。上式两边取极限得 $I=-I$，$I$ 是有限数，所以 $I=0$。</p><p>第 3 步：$f$ 有界时前提成立。设 $|f|\le M$，则 $|\text{被积函数}|\le M\frac{|\ln x|}{1+x^2}$。</p><ul><li>$0\lt x\le1$：$\le M|\ln x|$，$\int_0^1|\ln x|dx=1$；</li><li>$x\ge1$：$\le M\frac{\ln x}{x^2}$，$\int_1^\infty\frac{\ln x}{x^2}dx=\left[-\frac{\ln x+1}{x}\right]_1^\infty=1$。</li></ul><p>由比较判别法 $I$ 绝对收敛，因此 $I=0$。</p><p><b>结论：(1) $f(s)=s$ 时积分发散；(2) 绝对收敛（例如 $f$ 有界）时 $I=0$。</b></p>`}
],
"variants":[
{"id":R`x10-v1`,"lv":R`真题`,"src":R`无年份微积分A期末样题 证明1（PDF第2页）`,"stmt":R`对f∈C[0,1]，证明 $\int_0^1[\int_{x^2}^{\sqrt x}f(t)dt]dx=\int_0^1(\sqrt x-x^2)f(x)dx$。`,"hints":[R`令 $F(u)=\int_0^uf(t)dt$，左边 $=\int_0^1\left[F(\sqrt x)-F(x^2)\right]dx$。分别对两项换元再分部积分。`,R`第一项令 $x=t^2$（$dx=2t\,dt$）：$\int_0^1F(t)\cdot2t\,dt=\left[t^2F(t)\right]_0^1-\int_0^1t^2f(t)dt=F(1)-\int_0^1t^2f(t)dt$。`,R`第二项令 $x=\sqrt t$（$dx=\frac{dt}{2\sqrt t}$）：$\int_0^1\frac{F(t)}{2\sqrt t}dt=\left[\sqrt tF(t)\right]_0^1-\int_0^1\sqrt tf(t)dt=F(1)-\int_0^1\sqrt tf(t)dt$。两式相减。`],"method":R`m-x10-audit`,"sol":R`<p><b>要证</b>：$f\in C[0,1]$ 时，$\int_0^1\left[\int_{x^2}^{\sqrt x}f(t)dt\right]dx=\int_0^1(\sqrt x-x^2)f(x)dx$。</p><p><b>第 1 步：</b>令 $F(u)=\int_0^uf(t)dt$，$F'=f$，$F(0)=0$，且 $|F(u)|\le Mu$（$M=\max|f|$）。内层积分 $=F(\sqrt x)-F(x^2)$，所以</p>$$\text{左边}=\int_0^1F(\sqrt x)dx-\int_0^1F(x^2)dx.$$<p><b>第 2 步：第一项。</b>令 $x=t^2$，$dx=2t\,dt$，$t$ 从 0 到 1：</p>$$\int_0^1F(\sqrt x)dx=\int_0^12tF(t)dt=\left[t^2F(t)\right]_0^1-\int_0^1t^2f(t)dt=F(1)-\int_0^1t^2f(t)dt.$$<p>（分部积分：$u=F(t)$，$dv=2t\,dt$，$v=t^2$。）</p><p><b>第 3 步：第二项。</b>令 $x=\sqrt t$，$dx=\frac{dt}{2\sqrt t}$：</p>$$\int_0^1F(x^2)dx=\int_0^1\frac{F(t)}{2\sqrt t}dt.$$<p>被积函数在 $t\to0$ 时 $\left|\frac{F(t)}{2\sqrt t}\right|\le\frac{M\sqrt t}2\to0$，没有真正的瑕点。在 $[\varepsilon,1]$ 上分部（$u=F$，$dv=\frac{dt}{2\sqrt t}$，$v=\sqrt t$）：</p>$$\int_\varepsilon^1\frac{F(t)}{2\sqrt t}dt=F(1)-\sqrt\varepsilon F(\varepsilon)-\int_\varepsilon^1\sqrt tf(t)dt,$$<p>$|\sqrt\varepsilon F(\varepsilon)|\le M\varepsilon^{3/2}\to0$，令 $\varepsilon\to0$：$\int_0^1F(x^2)dx=F(1)-\int_0^1\sqrt tf(t)dt$。</p><p><b>第 4 步：相减。</b></p>$$\text{左边}=\left[F(1)-\int_0^1t^2f\right]-\left[F(1)-\int_0^1\sqrt tf\right]=\int_0^1(\sqrt t-t^2)f(t)dt.$$<p><b>证毕。</b>（验算 $f\equiv1$：左边 $\int_0^1(\sqrt x-x^2)dx=\frac23-\frac13=\frac13$，右边相同。）</p>`}

{"id":R`x10-e1`,"lv":R`真题`,"src":R`2020秋期末6（原卷第2页）`,"stmt":R`证明任意实有理函数的不定积分，可写成一个有理函数加上ln|x−a|、ln((x−a)²+c)、arctan(ax+b)三类函数的有限线性组合（c>0），在避开实极点的各连通区间成立。`,"hints":[R`按第 2 节的一般步骤：长除法 + 实数范围的部分分式，把被积函数拆成三类：多项式、$\frac{A}{(x-a)^k}$、$\frac{Bx+D}{((x-p)^2+c)^k}$。逐类说明积分结果属于“有理函数 / $\ln$ / $\arctan$”。`,R`二次类：令 $u=x-p$，$Bx+D=Bu+(Bp+D)$。$\int\frac{u\,du}{(u^2+c)^k}$：$k=1$ 得 $\frac12\ln(u^2+c)$，$k\ge2$ 得 $\frac{(u^2+c)^{1-k}}{2(1-k)}$（有理函数）。剩下 $J_k=\int\frac{du}{(u^2+c)^k}$。`,R`降幂递推（$m\ge2$）：$J_m=\frac{u}{2c(m-1)(u^2+c)^{m-1}}+\frac{2m-3}{2c(m-1)}J_{m-1}$，$J_1=\frac1{\sqrt c}\arctan\frac u{\sqrt c}$。可以通过对右边第一项求导来验证递推。`],"method":R`m-x10-audit`,"sol":R`<p><b>要证</b>：实有理函数 $\frac{P}{Q}$ 的不定积分是一个有理函数加上若干个 $\ln|x-a|$、$\ln((x-a)^2+c)$、$\arctan(\alpha x+\beta)$ 的线性组合（$c\gt0$），在不含实极点的每个区间上成立。</p><p><b>第 1 步：分解。</b>长除法得 $\frac PQ=S(x)+\frac{P_1}{Q}$，$S$ 是多项式、$\deg P_1\lt\deg Q$。实系数多项式 $Q$ 分解为一次因子 $(x-a)^k$ 和不可约二次因子 $((x-p)^2+c)^k$（$c\gt0$）之积，由部分分式定理，$\frac{P_1}Q$ 是若干项 $\frac{A}{(x-a)^j}$ 与 $\frac{Bx+D}{((x-p)^2+c)^j}$ 之和。多项式 $S$ 的积分是多项式（有理函数）。</p><p><b>第 2 步：一次类。</b>$\int\frac{A}{x-a}dx=A\ln|x-a|$；$j\ge2$ 时 $\int\frac{A}{(x-a)^j}dx=\frac{A(x-a)^{1-j}}{1-j}$，是有理函数。</p><p><b>第 3 步：二次类。</b>令 $u=x-p$，$Bx+D=Bu+E$（$E=Bp+D$）。</p><ul><li>$\int\frac{u\,du}{(u^2+c)^j}$：令 $w=u^2+c$，$j=1$ 得 $\frac12\ln((x-p)^2+c)$；$j\ge2$ 得 $\frac{w^{1-j}}{2(1-j)}$，有理函数。</li><li>$E\int\frac{du}{(u^2+c)^j}=EJ_j$。</li></ul><p><b>第 4 步：降幂递推。</b>对 $m\ge2$，求导可验证</p>$$\frac{d}{du}\frac{u}{(u^2+c)^{m-1}}=\frac{1}{(u^2+c)^{m-1}}-\frac{2(m-1)u^2}{(u^2+c)^m}=\frac{1}{(u^2+c)^{m-1}}-\frac{2(m-1)\left[(u^2+c)-c\right]}{(u^2+c)^m},$$<p>即 $\frac{d}{du}\frac{u}{(u^2+c)^{m-1}}=-\frac{2m-3}{(u^2+c)^{m-1}}+\frac{2c(m-1)}{(u^2+c)^m}$。两边积分并整理：</p>$$J_m=\frac{u}{2c(m-1)(u^2+c)^{m-1}}+\frac{2m-3}{2c(m-1)}J_{m-1},\qquad J_1=\frac1{\sqrt c}\arctan\frac u{\sqrt c}.$$<p>反复使用，$J_m$ = 有理函数 + 常数 $\times\arctan\frac{x-p}{\sqrt c}$。</p><p><b>第 5 步：</b>把各部分加起来，即得结论。由于 $\frac PQ$ 在实极点处无定义，原函数只在不含极点的每个区间上成立，不同区间的积分常数可以不同。<b>证毕。</b></p>`},
{"id":R`x10-e2`,"lv":R`核验延伸`,"src":R`2023秋电子系A卷6、9（按排版答案所载题面；回忆T11已辨正）`,"stmt":R`<p>(1) 连续递减 $f$ 在 $[0,\infty)$ 上，证明 $0\lt a\le b$ 时 $a\int_0^bf\le b\int_0^af$。</p><p>(2) $f\in C[0,1]$，对所有 $x\in[0,1]$ 有 $$\int_{x^2}^{x}f(t)\,dt\ge\frac{x^2-x^4}{2}.$$证明：对任意 $0\lt\beta\lt1$，$\int_0^\beta f\ge\beta^2/2$，并得 $\int_0^1f^2\ge1/4$。</p><p>说明：(2) 按一份排版答案中的题面收录；另一份手写回忆稿把条件的方向写反了，解答末尾用反例说明那个写法下结论不成立。</p>`,"hints":[R`(1) 令 $F(x)=\int_0^xf$，证明 $\frac{F(x)}x$ 递减（求导，用 $f$ 递减得 $F(x)\ge xf(x)$）。(2) 取 $x=\beta,\beta^2,\beta^4,\dots$，相邻区间 $[\beta^{2^{k+1}},\beta^{2^k}]$ 首尾相接。`,R`(2) 把 $x=\beta^{2^k}$（$k=0,\dots,N-1$）代入条件并相加：左边拼成 $\int_{\beta^{2^N}}^{\beta}f$，右边 $\frac12\sum_{k=0}^{N-1}\left(\beta^{2^{k+1}}-\beta^{2^{k+2}}\right)$ 相邻项抵消，等于 $\frac12\left(\beta^2-\beta^{2^{N+1}}\right)$。`,R`令 $N\to\infty$（$\beta^{2^N}\to0$）得 $\int_0^\beta f\ge\frac{\beta^2}2$；再令 $\beta\to1^-$ 得 $\int_0^1f\ge\frac12$；Cauchy 不等式 $\left(\int_0^1f\right)^2\le\int_0^11\cdot\int_0^1f^2$。`],"method":R`m-x10-audit`,"sol":R`<p><b>(1)</b> 令 $F(x)=\int_0^xf(t)dt$。因为 $f$ 递减，$0\le t\le x$ 时 $f(t)\ge f(x)$，所以 $F(x)\ge xf(x)$。于是 $x\gt0$ 时</p>$$\left(\frac{F(x)}x\right)'=\frac{xf(x)-F(x)}{x^2}\le0,$$<p>$\frac{F(x)}x$ 在 $(0,\infty)$ 上递减。$0\lt a\le b$ 时 $\frac{F(b)}b\le\frac{F(a)}a$，两边乘 $ab\gt0$：$aF(b)\le bF(a)$，即 $a\int_0^bf\le b\int_0^af$。<b>证毕</b>（不需要 $f\ge0$）。</p><p><b>(2)</b> 固定 $0\lt\beta\lt1$。</p><p>第 1 步：对 $k=0,1,\dots,N-1$，把 $x=\beta^{2^k}$ 代入条件（此时 $x^2=\beta^{2^{k+1}}$，$x^4=\beta^{2^{k+2}}$）：</p>$$\int_{\beta^{2^{k+1}}}^{\beta^{2^k}}f(t)dt\ge\frac{\beta^{2^{k+1}}-\beta^{2^{k+2}}}2.$$<p>第 2 步：相加。左边的区间 $[\beta^{2},\beta]$、$[\beta^4,\beta^2]$、…、$[\beta^{2^N},\beta^{2^{N-1}}]$ 首尾相接，合起来是 $[\beta^{2^N},\beta]$；右边相邻项抵消：</p>$$\int_{\beta^{2^N}}^{\beta}f(t)dt\ge\frac12\left(\beta^2-\beta^{2^{N+1}}\right).$$<p>第 3 步：令 $N\to\infty$。$\beta^{2^N}\to0$，$f$ 连续（从而 $F$ 连续），左边 $\to\int_0^\beta f$，右边 $\to\frac{\beta^2}2$。所以 $\int_0^\beta f\ge\frac{\beta^2}2$。</p><p>第 4 步：令 $\beta\to1^-$，由 $F$ 连续得 $\int_0^1f\ge\frac12\gt0$。</p><p>第 5 步：由 Cauchy 不等式 $\left(\int_0^1f\cdot1\right)^2\le\int_0^1f^2\cdot\int_0^11^2$：</p>$$\int_0^1f(t)^2dt\ge\left(\int_0^1f\right)^2\ge\frac14.$$<p>（因为 $\int_0^1f\ge\frac12\gt0$，两边平方保持不等号。）<b>证毕。</b>验证条件相容：$f(t)=t$ 时 $\int_{x^2}^xt\,dt=\frac{x^2-x^4}2$，恰好取等。</p><p><b>回忆稿版本辨正</b>：手写回忆稿写的是 $\int_x^{x^2}f\ge\frac{x^4-x^2}2$，两边乘 $-1$ 等价于 $\int_{x^2}^xf\le\frac{x^2-x^4}2$，方向与上面相反。取 $f\equiv0$：这个条件对所有 $x\in[0,1]$ 成立（$0\le\frac{x^2-x^4}2$），但 $\int_0^\beta f=0\lt\frac{\beta^2}2$，$\int_0^1f^2=0\lt\frac14$，结论不成立。所以回忆稿的条件写错了，应以排版版本为准。</p>`},
{"id":R`x10-e3`,"lv":R`选做`,"src":R`2021秋电子系答案 证明2（PDF第5页，C¹版本）`,"stmt":R`若f∈C¹[a,b]且a&lt;b，证明 $\max_{[a,b]}|f|\le\frac1{b-a}\int_a^b|f|+\int_a^b|f′|$。`,"hints":[R`思路：先找一个点 $\xi$，使 $|f(\xi)|$ 恰好等于 $|f|$ 的平均值 $\frac1{b-a}\int_a^b|f|$（积分中值定理）；再从 $\xi$ 出发，用 $f(x)=f(\xi)+\int_\xi^xf'$ 走到任意点 $x$。`,R`$|f|$ 连续，由积分中值定理，存在 $\xi\in[a,b]$ 使 $\int_a^b|f|=(b-a)|f(\xi)|$。由微积分基本定理，$f(x)=f(\xi)+\int_\xi^xf'(t)dt$。`,R`$|f(x)|\le|f(\xi)|+\left|\int_\xi^xf'\right|\le\frac1{b-a}\int_a^b|f|+\int_a^b|f'|$（$[\xi,x]$ 或 $[x,\xi]$ 包含在 $[a,b]$ 中）。右边与 $x$ 无关，对 $x$ 取最大值。`],"method":R`m-x10-audit`,"sol":R`<p><b>已知</b>：$f\in C^1[a,b]$，$a\lt b$。<b>要证</b>：$\max_{[a,b]}|f|\le\frac1{b-a}\int_a^b|f|+\int_a^b|f'|$。</p><p><b>第 1 步：找平均值点。</b>$|f|$ 在 $[a,b]$ 上连续，由积分中值定理，存在 $\xi\in[a,b]$ 使</p>$$|f(\xi)|=\frac1{b-a}\int_a^b|f(x)|dx.$$<p><b>第 2 步：从 $\xi$ 走到任意点 $x$。</b>$f'$ 连续，由 Newton–Leibniz 公式 $f(x)=f(\xi)+\int_\xi^xf'(t)dt$。取绝对值，三角不等式：</p>$$|f(x)|\le|f(\xi)|+\left|\int_\xi^xf'(t)dt\right|\le|f(\xi)|+\int_a^b|f'(t)|dt.$$<p>（$\xi$ 与 $x$ 之间的区间包含在 $[a,b]$ 中，被积函数 $|f'|\ge0$，扩大到整个区间只会变大。）</p><p><b>第 3 步：</b>代入第 1 步：对每个 $x\in[a,b]$，</p>$$|f(x)|\le\frac1{b-a}\int_a^b|f|+\int_a^b|f'|.$$<p>右边与 $x$ 无关，取 $x$ 为 $|f|$ 的最大值点即得结论。<b>证毕。</b></p><p>例：$f\equiv1$ 在 $[0,1]$ 上，左边 1，右边 $1+0=1$，取等。</p>`}
]
}

Object.assign(LESSONS, {"ir1":{"unit":"current-int","n":1,"title":"Week 9–10｜黎曼积分与 Darboux 判据","goal":"学会两件事：①判断一个函数在闭区间上能不能积分（可积性）；②能积分时，用黎曼和或牛顿–莱布尼兹公式算出值。对应课堂 Week 9 第 4 章与 Week 10 习题课 §1.4–1.6。","sections":[{"id":"ir1-s1","h":"1. 上和、下和与 Darboux 判据：怎样判断“能积分”","html":"<p><b>这节解决什么<\/b>：积分 $\\int_a^b f$ 的想法是“切成很多窄条，每条用矩形面积近似，再加起来”。问题是：每条里矩形的高取哪个函数值？如果不管怎么取、切得越来越细时总和都趋于同一个数，$f$ 就叫<b>黎曼可积<\/b>。下面把这件事变成一个好检验的条件。<\/p>\n<p><b>记号<\/b>（以下总假设 $f$ 在 $[a,b]$ 上有界）：<\/p>\n<ul>\n<li><b>分割<\/b> $P$：$a=x_0\\lt x_1\\lt\\cdots\\lt x_n=b$，把区间切成 $n$ 个小区间 $I_i=[x_{i-1},x_i]$，长度 $\\Delta x_i=x_i-x_{i-1}$。<\/li>\n<li><b>网格（模）<\/b> $\\|P\\|=\\max_i\\Delta x_i$：最宽那一段的宽度。“切得越来越细”就是 $\\|P\\|\\to0$。<\/li>\n<li><b>黎曼和<\/b>：在每段任取一点 $\\xi_i\\in I_i$（取样点），$S=\\sum_i f(\\xi_i)\\Delta x_i$。<\/li>\n<li>$\\sup$（上确界）可理解为“最小的上界”，$\\inf$（下确界）是“最大的下界”；函数在闭区间上取得最大值时 $\\sup$ 就是最大值。记 $M_i=\\sup_{I_i}f$，$m_i=\\inf_{I_i}f$。<\/li>\n<li><b>上和<\/b> $U(f,P)=\\sum_iM_i\\Delta x_i$，<b>下和<\/b> $L(f,P)=\\sum_i m_i\\Delta x_i$。<\/li>\n<li><b>振幅<\/b> $\\omega_i=M_i-m_i$：$f$ 在第 $i$ 段上“最高减最低”。<\/li>\n<\/ul>\n<p><b>三个基本事实<\/b>：<\/p>\n<ol>\n<li>不管取样点怎么选，都有 $L(f,P)\\le S\\le U(f,P)$（因为 $m_i\\le f(\\xi_i)\\le M_i$）。<\/li>\n<li>往分割里加分点（叫<b>细化<\/b>），$U$ 不会变大、$L$ 不会变小（因为小区间上的最大值不超过大区间上的最大值）。<\/li>\n<li>因此只要上下和之差能做得任意小，所有黎曼和就被“夹”向同一个数。<\/li>\n<\/ol>\n<p><b>Darboux 判据<\/b>：有界函数 $f$ 在 $[a,b]$ 上可积 $\\iff$ 对任意 $\\varepsilon\\gt0$，存在分割 $P$ 使 $$U(f,P)-L(f,P)=\\sum_i\\omega_i\\Delta x_i\\lt\\varepsilon.$$ 也就是：<b>“振幅 × 长度”的总和能压到任意小<\/b>。证明可积时，几乎都是在构造这样的分割。<\/p>\n<p><b>小例子<\/b>：$f(x)=x$ 在 $[0,1]$ 上，取 4 等分。每段振幅都是 $\\frac14$（递增函数的振幅 = 右端值 − 左端值），所以 $U-L=4\\times\\frac14\\times\\frac14=\\frac14$。取 $n$ 等分则 $U-L=\\frac1n\\to0$，故可积。<\/p>\n<p class=\"small muted\">补充（为什么“存在一个好分割”就够了）：把好分割的有限个分点加进任何一个很细的分割里，每加一个点，上和、下和的变化不超过“那一小段的长度 × $f$ 在全区间的振幅”。分点个数固定，网格趋零时这点误差也趋零，所以所有足够细的黎曼和都靠近同一个值。<\/p>"},{"id":"ir1-s2","h":"2. 三类一定可积的函数，和一个不可积的反例","html":"<p><b>这节解决什么<\/b>：考试中最常见的是直接引用“连续 ⇒ 可积”“单调 ⇒ 可积”“有限个间断点 ⇒ 可积”。这里说明每个结论用 Darboux 判据是怎么证的，证明题会让你写其中一个。<\/p>\n<p><b>① 连续函数可积<\/b>。闭区间上的连续函数是<b>一致连续<\/b>的：对任意 $\\varepsilon\\gt0$，有一个统一的 $\\delta\\gt0$，只要两点距离 $\\lt\\delta$，函数值之差就 $\\lt\\varepsilon$（“统一”指这个 $\\delta$ 不依赖于点的位置）。<\/p>\n<ol>\n<li>取分割使 $\\|P\\|\\lt\\delta$，则每段内任两点函数值差 $\\lt\\varepsilon$，所以每段振幅 $\\omega_i\\le\\varepsilon$。<\/li>\n<li>$$U-L=\\sum\\omega_i\\Delta x_i\\le\\varepsilon\\sum\\Delta x_i=\\varepsilon(b-a)$$。<\/li>\n<li>$\\varepsilon$ 任意小，所以 $U-L$ 可任意小，可积。<\/li>\n<\/ol>\n<p><b>② 单调函数可积<\/b>。设 $f$ 递增，则第 $i$ 段振幅就是 $f(x_i)-f(x_{i-1})$。于是 $$U-L=\\sum_i\\bigl(f(x_i)-f(x_{i-1})\\bigr)\\Delta x_i\\le\\|P\\|\\sum_i\\bigl(f(x_i)-f(x_{i-1})\\bigr)=\\|P\\|\\bigl(f(b)-f(a)\\bigr).$$ 最后一步是<b>求和相消<\/b>：$(f(x_1)-f(x_0))+(f(x_2)-f(x_1))+\\cdots$ 中间项全部抵消，只剩 $f(b)-f(a)$。网格趋零时右边趋零。<\/p>\n<p><b>③ 有界且只有有限个间断点<\/b>。设 $|f|\\le K$，间断点为 $c_1,\\dots,c_k$。<\/p>\n<ol>\n<li>用 $k$ 个小区间把这些点包住，每个长度 $\\le\\eta$（端点处的间断点只用单侧小区间）。这些“坏段”的振幅 $\\le2K$，贡献 $\\le 2K\\cdot k\\eta$。<\/li>\n<li>剩下的部分是有限个闭区间，$f$ 在上面连续，按 ① 可让它们的贡献 $\\le\\varepsilon$。<\/li>\n<li>先取 $\\eta$ 使 $2Kk\\eta\\lt\\varepsilon$，总和 $\\lt2\\varepsilon$，可积。<\/li>\n<\/ol>\n<p><b>反例（Dirichlet 函数）<\/b>：$D(x)=1$（$x$ 有理），$D(x)=0$（$x$ 无理）。任何长度为正的小区间里都既有有理数也有无理数，所以每段 $M_i=1,\\ m_i=0$，振幅恒为 1。于是对任何分割都有 $U-L=1\\cdot(b-a)$，无法变小，不可积。<\/p>\n<p><b>要证明不可积<\/b>：找一个正数 $c$，说明<b>对所有分割<\/b>都有 $U-L\\ge c$。<\/p>"},{"id":"ir1-s3","h":"3. 可积以后：性质、牛顿–莱布尼兹、把和式认成积分","html":"<p><b>这节解决什么<\/b>：知道可积后，怎样运算（线性、保序、拆区间），怎样算出数值，以及怎样把一个“$\\frac1n\\sum$”型的数列极限认成积分。<\/p>\n<p><b>基本性质<\/b>（都可在同一个分割上比较黎曼和得到）：<\/p>\n<ul>\n<li>线性：$\\int(\\alpha f+\\beta g)=\\alpha\\int f+\\beta\\int g$。<\/li>\n<li>保序：若 $f\\le g$，则 $\\int_a^bf\\le\\int_a^bg$；特别地 $\\bigl|\\int_a^bf\\bigr|\\le\\int_a^b|f|$。<\/li>\n<li>区间可加：$\\int_a^bf=\\int_a^cf+\\int_c^bf$。证明时把 $c$ 加进分割当分点，左右两段的 $U-L$ 可以分开或拼起来。<\/li>\n<\/ul>\n<p><b>牛顿–莱布尼兹公式<\/b>：若 $f$ 在 $[a,b]$ 上可积，$F$ 在 $[a,b]$ 上连续、在 $(a,b)$ 内 $F'=f$，则 $\\int_a^bf=F(b)-F(a)$。证明步骤：<\/p>\n<ol>\n<li>任取分割 $P$。在每一段 $[x_{i-1},x_i]$ 上对 $F$ 用拉格朗日中值定理：存在 $\\xi_i$ 使 $$F(x_i)-F(x_{i-1})=F'(\\xi_i)\\Delta x_i=f(\\xi_i)\\Delta x_i$$。<\/li>\n<li>对 $i$ 求和，左边相消成 $F(b)-F(a)$；右边恰好是一个黎曼和：$$F(b)-F(a)=\\sum_if(\\xi_i)\\Delta x_i$$。<\/li>\n<li>令 $\\|P\\|\\to0$，右边趋于 $\\int_a^bf$（因为 $f$ 可积），左边不变，所以两者相等。<\/li>\n<\/ol>\n<p><b>把和式认成积分<\/b>：看到 $\\frac{c}{n}\\sum_{k=1}^n g\\bigl(\\frac{ck}{n}\\bigr)$，它是 $g$ 在 $[0,c]$ 上 $n$ 等分、步长 $\\frac cn$、取右端点的黎曼和。步骤：①找出取样点 $x_k$；②算相邻取样点的距离，这才是真正的步长 $\\Delta x$；③把题里的系数凑成 $\\Delta x$，多出来的常数提到外面。<\/p>\n<p><b>小例子<\/b>：$\\frac1n\\sum_{k=1}^n\\sin\\frac{k\\pi}n$。取样点 $x_k=\\frac{k\\pi}n$，步长 $\\Delta x=\\frac\\pi n$。而题里乘的是 $\\frac1n=\\frac1\\pi\\cdot\\frac\\pi n$，所以 $$\\frac1n\\sum_{k=1}^n\\sin\\frac{k\\pi}n=\\frac1\\pi\\sum_{k=1}^n\\sin(x_k)\\Delta x\\to\\frac1\\pi\\int_0^\\pi\\sin x\\,dx=\\frac2\\pi.$$ 这个 $\\frac1\\pi\\int_0^\\pi$ 正是 $\\sin$ 在 $[0,\\pi]$ 上的平均值。<\/p>"}],"widget":null,"concepts":[{"id":"ir1-c1","sec":"ir1-s1","q":"把一个分割细化以后，上下和如何变？","opts":["上和不减，下和不增","上和不增，下和不减","都不减","都保持不变"],"a":1,"ex":"把一段 $I$ 拆成两段后，每一小段上的最大值都 $\\le$ $I$ 上的最大值，所以上和不会变大；同理每一小段上的最小值都 $\\ge$ $I$ 上的最小值，下和不会变小。最容易误选“上和不减，下和不增”——方向记反了。记法：细化让上下和互相靠拢，夹得更紧。"},{"id":"ir1-c2","sec":"ir1-s2","q":"在 $[0,1]$ 上哪个判断成立？","opts":["有界即可积","一个间断点就会破坏可积","有界且只有有限个间断点足够","有理点指示函数可积"],"a":2,"ex":"有界且只有有限个间断点时，把间断点用总长度很小的区间包起来，坏段贡献 $\\le$ 振幅 × 小长度，其余部分连续，所以可积。“一个间断点就会破坏可积”是常见误解：例如 $f=0$ 但 $f(1/2)=5$ 仍可积，积分为 0。“有界即可积”错，Dirichlet 函数有界但不可积；它也正是选项 D 里的“有理点指示函数”。"},{"id":"ir1-c3","sec":"ir1-s3","q":"从点 $k\\pi/n$ 和权重 $1/n$ 识别出什么？","opts":["在 $[0,1]$ 积分原函数","$[0,\\pi]$ 上积分再乘 $1/\\pi$","$[0,\\pi]$ 上直接积分","网格为 $1/n$"],"a":1,"ex":"取样点 $k\\pi/n$ 从 0 走到 $\\pi$，相邻两点相距 $\\pi/n$，这才是真正的步长。题里乘的是 $1/n=\\frac1\\pi\\cdot\\frac\\pi n$，所以极限是 $\\frac1\\pi\\int_0^\\pi f$。最容易误选“$[0,\\pi]$ 上直接积分”：那要求乘的权重是 $\\pi/n$，这里少了一个因子 $\\pi$。"},{"id":"ir1-c4","sec":"ir1-s3","q":"证明可积函数版牛顿–莱布尼兹时，分段中值定理用在谁上？","opts":["被积函数 $f$","原函数 $F$","任取的分割端点","上和 $U$"],"a":1,"ex":"在每段上对原函数 $F$ 用拉格朗日中值定理：$F(x_i)-F(x_{i-1})=f(\\xi_i)\\Delta x_i$，加起来左边相消成 $F(b)-F(a)$，右边是黎曼和。容易误选“被积函数 $f$”：$f$ 只假设可积，不一定连续、可导，无法对它用中值定理。"}],"methods":[{"id":"m-ir1","title":"把可积性证明化成“振幅 × 长度”","steps":["第 1 步：先确认 $f$ 有界（无界函数一定不黎曼可积），写出 $|f|\\le K$。","第 2 步：写出分割 $P$ 和每段振幅 $\\omega_i=M_i-m_i$，目标是 $U-L=\\sum\\omega_i\\Delta x_i\\lt\\varepsilon$。","第 3 步：函数“好”的段（连续或单调）用一致连续或求和相消控制振幅；“坏”的点（间断点）用很短的小区间包住，贡献 $\\le 2K\\times$ 总长度。","第 4 步：要证<b>不可积<\/b>，找一个正数 $c$，证明对<b>所有<\/b>分割都有 $U-L\\ge c$。易错：只举一个分割说明 $U-L$ 大，不能证明不可积。"]}],"problems":[{"id":"ir1-p1","lv":"练习","src":"自编同类练习","stmt":"<p>令 $f(x)=3$ 当 $x$ 为有理数，$f(x)=-1$ 当 $x$ 为无理数。求 $[-1,2]$ 上任意分割的上下和差，并判断可积性。<\/p>","hints":["用 Darboux 判据：看每个小区间上的最大值 $M_i$ 和最小值 $m_i$。","任何长度为正的小区间里既有有理数也有无理数，所以 $M_i=3$，$m_i=-1$，振幅 $\\omega_i=4$。","$U-L=\\sum_i 4\\Delta x_i=4\\times(\\text{区间总长})=4\\times3$，与分割无关。"],"method":"m-ir1","sol":"<p><b>已知<\/b>：$f$ 在有理点取 3、无理点取 $-1$，区间 $[-1,2]$，总长 3。<b>目标<\/b>：求 $U-L$，判断可积性。<\/p>\n<p>任取分割 $P:-1=x_0\\lt x_1\\lt\\cdots\\lt x_n=2$。每个小区间 $[x_{i-1},x_i]$ 长度为正，里面既有有理数又有无理数（有理数、无理数都在实数中稠密），所以<\/p>\n$$M_i=\\sup_{[x_{i-1},x_i]}f=3,\\qquad m_i=\\inf_{[x_{i-1},x_i]}f=-1.$$\n<p>于是 $$U(f,P)=\\sum_i3\\Delta x_i=3\\times3=9,\\quad L(f,P)=\\sum_i(-1)\\Delta x_i=-3,$$ $$U-L=9-(-3)=12.$$<\/p>\n<p>这对<b>每一个<\/b>分割都成立，无论怎么细化 $U-L$ 都是 12，不能小于（比如）$\\varepsilon=1$。由 Darboux 判据，<b>$U-L\\equiv12$，$f$ 在 $[-1,2]$ 上不黎曼可积<\/b>。<\/p>"},{"id":"ir1-p2","lv":"练习","src":"自编同类练习","stmt":"<p>对 $f(x)=x^2$，用 $[0,1]$ 上的 $n$ 等分求 $U-L$，再由黎曼和求 $\\int_0^1 x^2\\,dx$。<\/p>","hints":["$x^2$ 在 $[0,1]$ 上递增：每段最大值在右端点，最小值在左端点。$n$ 等分的分点是 $x_k=k/n$，每段长 $1/n$。","$U=\\frac1n\\sum_{k=1}^n(k/n)^2$，$L=\\frac1n\\sum_{k=0}^{n-1}(k/n)^2$。两者相减，中间项全部抵消。","$U-L=\\frac1n\\bigl(f(1)-f(0)\\bigr)$；再用 $\\sum_{k=1}^nk^2=\\frac{n(n+1)(2n+1)}6$ 算 $U$。"],"method":"m-ir1","sol":"<p><b>已知<\/b>：$f(x)=x^2$，$n$ 等分 $[0,1]$，分点 $x_k=\\frac kn$（$k=0,1,\\dots,n$），每段长 $\\Delta x=\\frac1n$。<\/p>\n<p><b>第 1 步：上下和<\/b>。$f$ 在 $[0,1]$ 上递增，所以第 $k$ 段 $[\\frac{k-1}n,\\frac kn]$ 上 $M_k=(\\frac kn)^2$，$m_k=(\\frac{k-1}n)^2$。<\/p>\n$$U=\\sum_{k=1}^n\\Big(\\frac kn\\Big)^2\\frac1n=\\frac1{n^3}\\sum_{k=1}^nk^2,\\qquad L=\\sum_{k=1}^n\\Big(\\frac{k-1}n\\Big)^2\\frac1n=\\frac1{n^3}\\sum_{k=0}^{n-1}k^2.$$\n<p><b>第 2 步：差<\/b>。两个和只差首尾两项（中间的 $1^2,\\dots,(n-1)^2$ 相同而抵消）：<\/p>\n$$U-L=\\frac1{n^3}\\bigl(n^2-0^2\\bigr)=\\frac1n.$$\n<p>所以 $U-L=\\frac1n\\to0$，$f$ 可积。<\/p>\n<p><b>第 3 步：求值<\/b>。用 $\\sum_{k=1}^nk^2=\\frac{n(n+1)(2n+1)}6$：<\/p>\n$$U=\\frac{n(n+1)(2n+1)}{6n^3}=\\frac{(n+1)(2n+1)}{6n^2}=\\frac{2n^2+3n+1}{6n^2}\\to\\frac13,\\qquad L=U-\\frac1n\\to\\frac13.$$\n<p>积分值被夹在 $L$ 与 $U$ 之间，二者极限都是 $\\frac13$，所以 <b>$U-L=\\frac1n$，$\\int_0^1x^2\\,dx=\\frac13$<\/b>。（例如 $n=2$：$U=\\frac58$，$L=\\frac18$，差 $\\frac12$。）<\/p>"},{"id":"ir1-p3","lv":"练习","src":"自编同类练习","stmt":"<p>令 $f(x)=x$（$0\\le x\\lt1$）、$f(x)=2-x$（$1\\le x\\le2$），另外把 $f(2)$ 改成 50。说明可积并计算积分。<\/p>","hints":["先找间断点：$x=1$ 处左右两式的值都是 1，连续；只有 $x=2$ 这一个点被改了值。","引用“有界且只有有限个间断点 ⇒ 可积”。再比较 $f$ 与没改值的函数 $g$：两者只在一个点不同，积分相同。","$g$ 的积分按区间可加性拆成 $\\int_0^1x\\,dx+\\int_1^2(2-x)\\,dx$，各是一个面积为 $\\frac12$ 的三角形。"],"method":"m-ir1","sol":"<p><b>第 1 步：可积<\/b>。$f$ 在 $[0,1)$ 与 $(1,2)$ 上是一次函数，连续；在 $x=1$ 处左极限 $\\lim_{x\\to1^-}x=1$，右侧值 $2-1=1$，所以连续。只有 $x=2$ 处，$\\lim_{x\\to2^-}(2-x)=0\\ne50=f(2)$，是唯一的间断点。又 $|f|\\le50$ 有界。<b>有界且只有一个间断点，所以 $f$ 在 $[0,2]$ 上可积。<\/b><\/p>\n<p><b>第 2 步：改一个点不影响积分<\/b>。令 $g$ 与 $f$ 相同、但 $g(2)=0$，则 $g$ 连续。$h=f-g$ 只在 $x=2$ 处等于 50，其余为 0。对任一分割，只有含 2 的最后一段上 $h$ 的上确界为 50、下确界为 0，所以 $$0=L(h,P)\\le U(h,P)=50\\,\\Delta x_n\\le50\\|P\\|\\to0,$$ 故 $\\int_0^2h=0$，$\\int_0^2f=\\int_0^2g$。<\/p>\n<p><b>第 3 步：计算<\/b>。<\/p>\n$$\\int_0^2g=\\int_0^1x\\,dx+\\int_1^2(2-x)\\,dx=\\Big[\\frac{x^2}2\\Big]_0^1+\\Big[2x-\\frac{x^2}2\\Big]_1^2=\\frac12+\\Big(2-\\frac32\\Big)=1.$$\n<p><b>结论：$f$ 可积，$\\int_0^2f(x)\\,dx=1$。<\/b><\/p>"}],"variants":[{"id":"ir1-v1","lv":"练习","src":"自编同类练习","stmt":"<p>用黎曼和求 $\\lim_{n\\to\\infty}\\frac1n\\sum_{k=1}^n\\frac{1}{1+(2k/n)^2}$。<\/p>","hints":["把它看成 $g(x)=\\frac1{1+x^2}$ 的黎曼和：取样点是 $x_k=\\frac{2k}n$，从 $\\frac2n$ 走到 2，所以区间是 $[0,2]$。","相邻取样点相距 $\\Delta x=\\frac2n$，而题中乘的是 $\\frac1n=\\frac12\\cdot\\frac2n$。","原式 $=\\frac12\\sum_{k=1}^n g(x_k)\\Delta x\\to\\frac12\\int_0^2\\frac{dx}{1+x^2}$，再用 $(\\arctan x)'=\\frac1{1+x^2}$。"],"method":"m-ir1","sol":"<p>令 $g(x)=\\frac1{1+x^2}$，它在 $[0,2]$ 上连续，故可积。<\/p>\n<p><b>认出黎曼和<\/b>：把 $[0,2]$ $n$ 等分，分点 $x_k=\\frac{2k}n$，步长 $\\Delta x=\\frac2n$，取每段右端点。则<\/p>\n$$\\frac1n\\sum_{k=1}^n\\frac1{1+(2k/n)^2}=\\frac12\\sum_{k=1}^n g(x_k)\\cdot\\frac2n=\\frac12\\sum_{k=1}^n g(x_k)\\Delta x.$$\n<p>当 $n\\to\\infty$ 时 $\\|P\\|=\\frac2n\\to0$，因为 $g$ 可积，黎曼和趋于积分：<\/p>\n$$\\lim_{n\\to\\infty}\\frac1n\\sum_{k=1}^n\\frac{1}{1+(2k/n)^2}=\\frac12\\int_0^2\\frac{dx}{1+x^2}=\\frac12\\bigl[\\arctan x\\bigr]_0^2=\\frac12\\arctan2.$$\n<p><b>答案：$\\frac12\\arctan2\\approx0.5536$。<\/b>（易错：漏掉 $\\frac12$，误写成 $\\arctan 2$。）<\/p>"}],"extensions":[{"id":"ir1-e1","lv":"练习","src":"自编同类练习","stmt":"<p>设 $f(1/k)=1$（$k$ 为正整数），$[0,1]$ 上其余点取 0。证明积分为零。解释有无穷多个间断点为何与这结论相容。<\/p>","hints":["用 Darboux 判据：$f\\ge0$ 且每个小区间都含 $f=0$ 的点，所以下和恒为 0，只需让上和 $\\lt\\varepsilon$。","给定 $\\varepsilon$，先用 $[0,\\varepsilon/2]$ 把 0 附近整段盖住：$k\\gt2/\\varepsilon$ 的点 $1/k$ 全在里面。外面只剩有限个点 $1/k$（$k\\le 2/\\varepsilon$）。","剩下的 $N$ 个点各用一个长度 $\\lt\\frac{\\varepsilon}{2N}$ 的小区间盖住。上和只在这些段上可能非零，每段上确界为 1，总贡献 $\\lt\\frac\\varepsilon2+\\frac\\varepsilon2$。"],"method":"m-ir1","sol":"<p><b>要证<\/b>：对任意 $\\varepsilon\\gt0$，存在分割 $P$ 使 $U(f,P)-L(f,P)\\lt\\varepsilon$，且积分为 0。<\/p>\n<p><b>第 1 步：下和为 0<\/b>。任何长度为正的小区间都含不是 $1/k$ 形式的点，那里 $f=0$；又 $f\\ge0$，所以每段 $m_i=0$，$L(f,P)=0$ 对所有分割成立。<\/p>\n<p><b>第 2 步：盖住 0 附近<\/b>。取 $[0,\\varepsilon/2]$ 作为第一段。凡 $k\\gt2/\\varepsilon$ 都有 $1/k\\lt\\varepsilon/2$，所以这些点全在这段里。此段 $M=1$（或 0），贡献 $\\le1\\cdot\\frac\\varepsilon2$。<\/p>\n<p><b>第 3 步：盖住剩下有限个点<\/b>。在 $(\\varepsilon/2,1]$ 里只剩有限个点 $1/k$，设共 $N$ 个。给每个点取一个包含它、长度 $\\lt\\frac{\\varepsilon}{2N}$ 的小闭区间（互不重叠，点 $1$ 用 $[1-\\delta,1]$ 这种单侧区间）。这些段 $M_i=1$，总贡献 $\\lt N\\cdot\\frac\\varepsilon{2N}=\\frac\\varepsilon2$。<\/p>\n<p><b>第 4 步：其余段<\/b>。把上面所有小区间的端点作为分点，其余各段里没有任何 $1/k$，$f\\equiv0$，$M_i=0$，贡献 0。<\/p>\n<p>所以 $U(f,P)\\lt\\frac\\varepsilon2+\\frac\\varepsilon2=\\varepsilon$，$U-L\\lt\\varepsilon$，<b>$f$ 可积<\/b>。又 $0=L\\le\\int_0^1f\\le U\\lt\\varepsilon$ 对任意 $\\varepsilon$ 成立，<b>$\\int_0^1f=0$<\/b>。<\/p>\n<p><b>为什么无穷多个间断点也不矛盾<\/b>：Darboux 判据只要求“坏点附近的总长度”能做得很小，并不要求坏点个数有限。这里的间断点（所有 $1/k$ 和 0）都挤向 0，一个短区间就能盖住其中无穷多个，剩下的只有有限个。<\/p>"}]},"ir2":{"unit":"current-int","n":3,"title":"Week 10 同类练习｜积分估计与“权重集中”型极限","goal":"五类常考题：①可积函数做运算后仍可积；②用“逐点不等式”估计积分大小；③含 $n$ 次幂的积分极限（权重越来越集中到一点）；④$(\\int f^n)^{1/n}$ 趋于最大值。每类都有固定写法，学会套路即可。","sections":[{"id":"ir2-s1","h":"1. 可积函数的运算：加减、绝对值、取最大","html":"<p><b>这节解决什么<\/b>：题目常给“$f,g$ 可积”，问 $\\max(f,g)$、正部、负部是否可积。办法是<b>把新函数写成已知可积函数的组合<\/b>。<\/p>\n<p><b>已知可用的结论<\/b>：<\/p>\n<ol>\n<li>$f,g$ 可积 ⇒ $f\\pm g$、$cf$ 可积（线性性）。<\/li>\n<li>$f$ 可积 ⇒ $|f|$ 可积。理由：对任意两点有 $\\bigl||f(x)|-|f(y)|\\bigr|\\le|f(x)-f(y)|$，所以 $|f|$ 在每段上的振幅不超过 $f$ 的振幅，$U-L$ 也不超过 $f$ 的。<\/li>\n<\/ol>\n<p><b>关键公式<\/b>：$$\\max(f,g)=\\frac{f+g+|f-g|}2,\\qquad\\min(f,g)=\\frac{f+g-|f-g|}2.$$ 验证：若 $f\\ge g$，右边 $=\\frac{f+g+f-g}2=f$ ✓；若 $f\\lt g$，右边 $=\\frac{f+g+g-f}2=g$ ✓。<\/p>\n<p><b>小例子<\/b>：$f=x$，$g=1-x$ 在 $[0,1]$ 上，$\\max(f,g)=\\frac{1+|2x-1|}2$，它由可积的 $1$ 和 $|2x-1|$ 组合而成，所以可积。<\/p>\n<p><b>易错<\/b>：不要写“$\\max(f,g)$ 的上和等于 $f,g$ 上和的较大者”——这一般不成立，取最大和求上确界不能随便交换。<\/p>"},{"id":"ir2-s2","h":"2. 积分估计：先写逐点不等式，再积分","html":"<p><b>这节解决什么<\/b>：不求原函数，也能给积分一个上下界。<\/p>\n<p><b>基本工具（保序性）<\/b>：若在 $[a,b]$ 上处处有 $m\\le h(x)\\le M$，则 $$m(b-a)\\le\\int_a^bh(x)\\,dx\\le M(b-a).$$ 更一般地，若 $g_1(x)\\le h(x)\\le g_2(x)$，则 $\\int g_1\\le\\int h\\le\\int g_2$。<\/p>\n<p><b>写法三步<\/b>：①在区间上找被积函数的最大、最小值（或找两个好积的函数夹住它）；②写出逐点不等式；③两边积分。有绝对值时用 $\\bigl|\\int h\\bigr|\\le\\int|h|$。<\/p>\n<p><b>小例子<\/b>：$x\\in[0,1]$ 时 $1\\le1+x^2\\le2$，所以 $\\frac12\\le\\frac1{1+x^2}\\le1$，积分得 $\\frac12\\le\\int_0^1\\frac{dx}{1+x^2}\\le1$。（真值 $\\frac\\pi4\\approx0.785$，确实在中间。）<\/p>\n<p><b>含 $n$ 次幂时要拆区间<\/b>：比如 $\\int_0^{\\pi/2}f(x)\\sin^nx\\,dx$，$\\sin^nx$ 只在右端点 $\\frac\\pi2$ 附近接近 1，其余地方随 $n$ 增大迅速变小。做法是取一个固定的短段 $[\\frac\\pi2-\\delta,\\frac\\pi2]$ 单独估计（靠长度 $\\delta$ 小），其余部分 $\\sin x\\le\\sin(\\frac\\pi2-\\delta)\\lt1$，它的 $n$ 次方趋于 0。<\/p>"},{"id":"ir2-s3","h":"3. 权重集中型极限与 $(\\int f^n)^{1/n}$","html":"<p><b>这节解决什么<\/b>：形如 $\\lim_n\\int K_n(x)f(x)\\,dx$ 的极限。$K_n$ 叫<b>权重（核）<\/b>：它非负、总积分为 1，而且 $n$ 越大越集中在某一点 $x_0$ 附近。结论通常是极限等于 $f(x_0)$。<\/p>\n<p><b>直观<\/b>：$\\int K_nf$ 是 $f$ 的“加权平均”。权重几乎全压在 $x_0$ 附近，平均值就趋于 $f(x_0)$。<\/p>\n<p><b>标准证明四步<\/b>（设 $\\int K_n=1$，$|f|\\le M$，$f$ 在 $x_0$ 连续）：<\/p>\n<ol>\n<li><b>写误差<\/b>：$\\int K_nf-f(x_0)=\\int K_n(x)\\bigl(f(x)-f(x_0)\\bigr)dx$（因为 $f(x_0)=f(x_0)\\int K_n$）。<\/li>\n<li><b>近处<\/b>：给定 $\\varepsilon$，由连续性取 $\\delta$，使 $|x-x_0|\\lt\\delta$ 时 $|f(x)-f(x_0)|\\le\\varepsilon$。这部分 $\\le\\varepsilon\\int K_n\\le\\varepsilon$。<\/li>\n<li><b>远处<\/b>：$|f(x)-f(x_0)|\\le2M$，这部分 $\\le2M\\times(\\text{远处的权重})$，而远处权重随 $n\\to\\infty$ 趋于 0。<\/li>\n<li><b>顺序<\/b>：先固定 $\\delta$，令 $n\\to\\infty$ 得 $\\limsup|\\text{误差}|\\le\\varepsilon$；再因 $\\varepsilon$ 任意，误差 → 0。<\/li>\n<\/ol>\n<p><b>小例子<\/b>：$K_n(x)=(n+1)x^n$ 在 $[0,1]$ 上，$\\int_0^1K_n=1$，在 $[0,1-\\delta]$ 上的权重为 $(1-\\delta)^{n+1}\\to0$，所以权重集中在 $x_0=1$，$\\int_0^1(n+1)x^nf(x)\\,dx\\to f(1)$。<\/p>\n<p><b>$(\\int f^n)^{1/n}$ 型<\/b>：设 $f\\ge0$ 连续，最大值 $M=f(x^*)$。<\/p>\n<ul>\n<li>上界：$f^n\\le M^n$，所以 $(\\int_a^bf^n)^{1/n}\\le M(b-a)^{1/n}\\to M$。<\/li>\n<li>下界：由连续性，在 $x^*$ 附近一段长度为 $\\ell\\gt0$ 的区间上 $f\\ge M-\\varepsilon$（$x^*$ 在端点时取单侧区间），所以 $(\\int f^n)^{1/n}\\ge(M-\\varepsilon)\\ell^{1/n}\\to M-\\varepsilon$。<\/li>\n<li>两边夹，$\\varepsilon$ 任意，极限为 $M$。关键：$c^{1/n}\\to1$ 对任何固定的 $c\\gt0$ 成立。<\/li>\n<\/ul>"}],"widget":null,"concepts":[{"id":"ir2-c1","sec":"ir2-s1","q":"$\\max(f,g)$ 的可积性最直接用哪个表达式？","opts":["$f+g$","$|f-g|$","$(f+g+|f-g|)/2$","$(f-g+|f-g|)/2$"],"a":2,"ex":"$\\max(f,g)=\\frac{f+g+|f-g|}2$（分 $f\\ge g$、$f\\lt g$ 两种情况代入即可验证），右边由可积函数加减、取绝对值得到，所以可积。易误选 $(f-g+|f-g|)/2$：它等于 $\\max(f-g,0)$，即 $f-g$ 的正部，不是 $\\max(f,g)$。"},{"id":"ir2-c2","sec":"ir2-s2","q":"拆分区间做积分极限时，哪个顺序通常稳妥？","opts":["先选短段长度，再让阶数增大","跳过短段，直接把极限写进积分","把右端点函数字面改成零","只算区间中点"],"a":0,"ex":"先固定短段长度 $\\delta$：短段的贡献 $\\le$ 常数 $\\times\\delta$；长段上底数 $\\le q\\lt1$（$q$ 由 $\\delta$ 决定），贡献 $\\le$ 常数 $\\times q^n\\to0$。易误选“直接把极限写进积分”：被积函数逐点趋于 0 不代表积分趋于 0，极限与积分交换需要理由，本课还没有这种定理。"},{"id":"ir2-c3","sec":"ir2-s3","q":"$\\int_0^1(2n+1)(1-x)^{2n}\\,dx$ 等于什么？","opts":["$1/n$","1","$n+1$","趋于 0"],"a":1,"ex":"令 $y=1-x$：$\\int_0^1(2n+1)y^{2n}\\,dy=\\bigl[y^{2n+1}\\bigr]_0^1=1$，对每个 $n$ 都等于 1，这正是“总权重为 1”。易误选“趋于 0”：被积函数在 $x\\gt0$ 处确实趋于 0，但系数 $2n+1$ 变大，把面积全挤到了 $x=0$ 附近。"},{"id":"ir2-c4","sec":"ir2-s3","q":"$\\lim_n(\\int f^n)^{1/n}$ 的下界需要什么？","opts":["最大值点的单点积分","一个固定正长度上的近最大值下界","必须全区间都取到最大值","必须最大点在内点"],"a":1,"ex":"下界要用一段长度 $\\ell\\gt0$ 的区间，在其上 $f\\ge M-\\varepsilon$，于是 $\\int f^n\\ge\\ell(M-\\varepsilon)^n$，开 $n$ 次方后 $\\ell^{1/n}\\to1$。易误选“单点积分”：一个点长度为 0，积分为 0，给不出下界。最大点在端点也行，用单侧区间即可。"}],"methods":[{"id":"m-ir2","title":"积分极限：先写误差，再分“近处/远处”控制","steps":["第 1 步：确认权重 $K_n\\ge0$ 且算出 $\\int K_n$（通常为 1），把目标值写成 $f(x_0)\\int K_n$，作差得到误差积分。","第 2 步：给定 $\\varepsilon$，用连续性取一个固定的近处区间（半径 $\\delta$），近处误差 $\\le\\varepsilon$。","第 3 步：远处用有界性：误差 $\\le2M\\times$ 远处权重，算出远处权重并说明它 $\\to0$（通常是 $q^n$，$0\\le q\\lt1$）。","第 4 步：写清顺序：先固定 $\\delta$，令 $n\\to\\infty$，最后令 $\\varepsilon\\to0$。易错：让 $\\delta$ 随 $n$ 变却不说明，会使远处估计失效。"]}],"problems":[{"id":"ir2-p1","lv":"练习","src":"自编同类练习","stmt":"<p>若 $h$ 黎曼可积，证明正部 $h^+=\\max(h,0)$ 与负部 $h^-=\\max(-h,0)$ 可积。以 $h(x)=x-1$、$x\\in[0,2]$ 为例求两部分的积分。<\/p>","hints":["把 $h^+$、$h^-$ 写成 $h$ 与 $|h|$ 的线性组合，然后引用“可积函数的绝对值、线性组合仍可积”。","$h^+=\\frac{|h|+h}2$，$h^-=\\frac{|h|-h}2$（分 $h\\ge0$、$h\\lt0$ 验证）。例子中 $h\\ge0\\iff x\\ge1$。","$h^+$ 在 $[0,1]$ 上为 0、在 $[1,2]$ 上为 $x-1$；$h^-$ 在 $[0,1]$ 上为 $1-x$、在 $[1,2]$ 上为 0。各算一个三角形面积。"],"method":"m-ir2","sol":"<p><b>第 1 步：写成组合<\/b>。$$h^+=\\frac{|h|+h}2,\\qquad h^-=\\frac{|h|-h}2.$$ 验证：$h(x)\\ge0$ 时，右边分别为 $h$ 与 $0$；$h(x)\\lt0$ 时，$|h|=-h$，右边分别为 $0$ 与 $-h$。与定义一致。<\/p>\n<p><b>第 2 步：可积<\/b>。$h$ 可积 ⇒ $|h|$ 可积（因为 $\\bigl||h(x)|-|h(y)|\\bigr|\\le|h(x)-h(y)|$，振幅不增）。可积函数的线性组合可积，所以 <b>$h^+,h^-$ 都可积<\/b>。<\/p>\n<p><b>第 3 步：例子<\/b>。$h(x)=x-1$，当 $x\\ge1$ 时 $h\\ge0$。<\/p>\n$$\\int_0^2h^+=\\int_1^2(x-1)\\,dx=\\Big[\\frac{(x-1)^2}2\\Big]_1^2=\\frac12,\\qquad\\int_0^2h^-=\\int_0^1(1-x)\\,dx=\\Big[x-\\frac{x^2}2\\Big]_0^1=\\frac12.$$\n<p><b>答案：$\\int_0^2h^+=\\int_0^2h^-=\\frac12$。<\/b>检查：$\\int h^+-\\int h^-=0=\\int_0^2(x-1)\\,dx$ ✓。<\/p>"},{"id":"ir2-p2","lv":"练习","src":"自编同类练习","stmt":"<p>用点态比较证明 $1/2\\le\\int_0^1(1+x^4)^{-1}dx\\le1$ 和 $1/4\\le\\int_0^1x/(1+x)\\,dx\\le1/2$。<\/p>","hints":["用保序性：先在 $[0,1]$ 上写出被积函数的逐点上下界，再积分。","$x\\in[0,1]$ 时 $1\\le1+x^4\\le2$，$1\\le1+x\\le2$。取倒数后不等号反向。","第一式：$\\frac12\\le\\frac1{1+x^4}\\le1$。第二式：分子 $x\\ge0$，乘上去得 $\\frac x2\\le\\frac x{1+x}\\le x$，再用 $\\int_0^1x\\,dx=\\frac12$。"],"method":"m-ir2","sol":"<p><b>第一式<\/b>。$x\\in[0,1]$ 时 $0\\le x^4\\le1$，所以 $1\\le1+x^4\\le2$，取倒数（正数取倒数不等号反向）：$$\\frac12\\le\\frac1{1+x^4}\\le1.$$ 在 $[0,1]$ 上积分（区间长 1）：$\\frac12\\le\\int_0^1\\frac{dx}{1+x^4}\\le1$。<\/p>\n<p><b>第二式<\/b>。$x\\in[0,1]$ 时 $1\\le1+x\\le2$，所以 $\\frac12\\le\\frac1{1+x}\\le1$。两边乘非负数 $x$：$$\\frac x2\\le\\frac x{1+x}\\le x.$$ 积分，并用 $\\int_0^1x\\,dx=\\frac12$：$$\\frac14\\le\\int_0^1\\frac x{1+x}\\,dx\\le\\frac12.$$<\/p>\n<p><b>结论成立。<\/b>这个方法不需要原函数。（核对：第二式真值 $1-\\ln2\\approx0.307$，确在 $[0.25,0.5]$ 内。）<\/p>"},{"id":"ir2-p3","lv":"练习","src":"自编同类练习","stmt":"<p>设 $h$ 在 $[0,2]$ 上黎曼可积。证明 $\\int_0^2h(x)(1-(x-1)^2)^n\\,dx\\to0$。<\/p>","hints":["可积 ⇒ 有界，设 $|h|\\le M$。底数 $1-(x-1)^2$ 在 $[0,2]$ 上介于 0 和 1 之间，只在中点 $x=1$ 处等于 1。","取 $\\delta\\in(0,1)$，把区间分成中段 $|x-1|\\lt\\delta$ 和外段 $|x-1|\\ge\\delta$。外段上 $0\\le1-(x-1)^2\\le1-\\delta^2$。","中段贡献 $\\le M\\cdot2\\delta$，外段贡献 $\\le M\\cdot2\\cdot(1-\\delta^2)^n$。先取 $\\delta=\\frac{\\varepsilon}{4M}$，再取 $n$ 大使第二项 $\\lt\\frac\\varepsilon2$。"],"method":"m-ir2","sol":"<p><b>要证<\/b>：对任意 $\\varepsilon\\gt0$，当 $n$ 充分大时 $\\bigl|\\int_0^2h(x)(1-(x-1)^2)^n\\,dx\\bigr|\\lt\\varepsilon$。<\/p>\n<p><b>准备<\/b>：$h$ 可积所以有界，设 $|h|\\le M$（$M\\gt0$）。记 $g(x)=1-(x-1)^2$，$x\\in[0,2]$ 时 $0\\le g(x)\\le1$。<\/p>\n<p><b>第 1 步：拆区间<\/b>。取 $\\delta\\in(0,1)$。中段 $A=\\{|x-1|\\lt\\delta\\}$，长度 $2\\delta$；外段 $B=\\{|x-1|\\ge\\delta\\}$，长度 $\\le2$，且在 $B$ 上 $g(x)\\le1-\\delta^2$。<\/p>\n<p><b>第 2 步：分别估计<\/b>。<\/p>\n$$\\Big|\\int_Ahg^n\\Big|\\le\\int_AM\\cdot1\\,dx=2M\\delta,\\qquad\\Big|\\int_Bhg^n\\Big|\\le\\int_BM(1-\\delta^2)^n\\,dx\\le2M(1-\\delta^2)^n.$$\n<p><b>第 3 步：选参数<\/b>。先取 $\\delta=\\min\\{\\frac{\\varepsilon}{4M},\\frac12\\}$，使 $2M\\delta\\le\\frac\\varepsilon2$。$\\delta$ 固定后 $0\\lt1-\\delta^2\\lt1$，所以 $(1-\\delta^2)^n\\to0$，存在 $N$ 使 $n\\gt N$ 时 $2M(1-\\delta^2)^n\\lt\\frac\\varepsilon2$。<\/p>\n<p>于是 $n\\gt N$ 时总和 $\\lt\\varepsilon$。<b>所以 $\\int_0^2h(x)(1-(x-1)^2)^n\\,dx\\to0$。<\/b><\/p>"}],"variants":[{"id":"ir2-v1","lv":"练习","src":"自编同类练习","stmt":"<p>若 $f$ 在 $[0,1]$ 可积且在 0 右连续，求 $\\lim_{n\\to\\infty}\\int_0^1(2n+1)(1-x)^{2n}f(x)\\,dx$。<\/p>","hints":["权重 $K_n(x)=(2n+1)(1-x)^{2n}$ 总积分为 1，集中在 $x=0$。猜答案 $f(0)$，按“近处/远处”四步证明。","远处权重：$\\int_\\delta^1(2n+1)(1-x)^{2n}dx=(1-\\delta)^{2n+1}\\to0$。误差写成 $\\int_0^1K_n(x)\\bigl(f(x)-f(0)\\bigr)dx$。","设 $|f(x)-f(0)|\\le M$。由右连续取 $\\delta$ 使 $[0,\\delta)$ 上 $|f(x)-f(0)|\\le\\varepsilon$，则误差 $\\le\\varepsilon\\cdot1+M(1-\\delta)^{2n+1}$。"],"method":"m-ir2","sol":"<p>记 $K_n(x)=(2n+1)(1-x)^{2n}\\ge0$。<\/p>\n<p><b>第 1 步：总权重<\/b>。令 $y=1-x$：$\\int_0^1K_n\\,dx=\\int_0^1(2n+1)y^{2n}\\,dy=1$。<b>远处权重<\/b>：$\\int_\\delta^1K_n\\,dx=\\int_0^{1-\\delta}(2n+1)y^{2n}\\,dy=(1-\\delta)^{2n+1}$。<\/p>\n<p><b>第 2 步：写误差<\/b>。因 $\\int K_n=1$，$f(0)=\\int_0^1K_nf(0)\\,dx$，所以 $$\\int_0^1K_nf\\,dx-f(0)=\\int_0^1K_n(x)\\bigl(f(x)-f(0)\\bigr)dx.$$<\/p>\n<p><b>第 3 步：分段估计<\/b>。$f$ 可积所以有界，设 $|f(x)-f(0)|\\le M$。给定 $\\varepsilon\\gt0$，由 $f$ 在 0 右连续，取 $\\delta\\in(0,1)$ 使 $0\\le x\\lt\\delta$ 时 $|f(x)-f(0)|\\le\\varepsilon$。则<\/p>\n$$\\Big|\\int_0^1K_n(f-f(0))\\Big|\\le\\int_0^\\delta K_n\\varepsilon\\,dx+\\int_\\delta^1K_nM\\,dx\\le\\varepsilon+M(1-\\delta)^{2n+1}.$$\n<p><b>第 4 步：取极限<\/b>。$\\delta$ 固定，$(1-\\delta)^{2n+1}\\to0$，所以 $\\limsup_n|\\text{误差}|\\le\\varepsilon$。$\\varepsilon$ 任意，误差 $\\to0$。<\/p>\n<p><b>答案：极限为 $f(0)$。<\/b>（例：$f\\equiv1$ 时积分恒为 1 ✓。）<\/p>"},{"id":"ir2-v2","lv":"练习","src":"自编同类练习","stmt":"<p>求 $\\lim_{n\\to\\infty}\\bigl(\\int_{-1}^{1}(2-x^2)^n\\,dx\\bigr)^{1/n}$。只用积分上下界。<\/p>","hints":["这是 $(\\int f^n)^{1/n}$ 型，$f(x)=2-x^2$ 在 $[-1,1]$ 上最大值为 $2$（在 $x=0$）。猜答案 2。","上界：$(2-x^2)^n\\le2^n$，积分 $\\le2\\cdot2^n$。下界：在 $|x|\\le\\delta$ 上 $2-x^2\\ge2-\\delta^2$，积分 $\\ge2\\delta(2-\\delta^2)^n$。","开 $n$ 次方：$(2\\delta)^{1/n}(2-\\delta^2)\\le(\\cdots)^{1/n}\\le2^{1/n}\\cdot2$。用 $c^{1/n}\\to1$，先令 $n\\to\\infty$，再令 $\\delta\\to0$。"],"method":"m-ir2","sol":"<p>记 $I_n=\\int_{-1}^1(2-x^2)^n\\,dx$。$x\\in[-1,1]$ 时 $1\\le2-x^2\\le2$。<\/p>\n<p><b>上界<\/b>：$(2-x^2)^n\\le2^n$，所以 $I_n\\le2\\cdot2^n$，$I_n^{1/n}\\le2^{1/n}\\cdot2\\to2$。<\/p>\n<p><b>下界<\/b>：固定 $\\delta\\in(0,1)$。在 $[-\\delta,\\delta]$ 上 $2-x^2\\ge2-\\delta^2\\gt0$，被积函数非负，所以 $$I_n\\ge\\int_{-\\delta}^\\delta(2-x^2)^n\\,dx\\ge2\\delta(2-\\delta^2)^n,\\qquad I_n^{1/n}\\ge(2\\delta)^{1/n}(2-\\delta^2)\\to2-\\delta^2.$$<\/p>\n<p><b>夹逼<\/b>：对每个固定 $\\delta$，$2-\\delta^2\\le\\liminf_nI_n^{1/n}\\le\\limsup_nI_n^{1/n}\\le2$。令 $\\delta\\to0^+$，得 $\\liminf=\\limsup=2$。<\/p>\n<p><b>答案：极限为 2<\/b>（即 $2-x^2$ 在 $[-1,1]$ 上的最大值）。<\/p>"}],"extensions":[{"id":"ir2-e1","lv":"练习","src":"自编同类练习","stmt":"<p>令 $H_n(x)=c_ne^{-n|x|}$，其中 $c_n$ 使得 $[-1,1]$ 上 $\\int H_n=1$。求 $c_n$。若 $f$ 连续，求 $\\lim_n\\int_{-1}^{1}fH_n$。<\/p>","hints":["$e^{-n|x|}$ 是偶函数，$\\int_{-1}^1e^{-n|x|}dx=2\\int_0^1e^{-nx}dx$。","$2\\int_0^1e^{-nx}dx=\\frac{2(1-e^{-n})}n$，所以 $c_n=\\frac n{2(1-e^{-n})}$。远处权重 $\\int_{\\delta\\le|x|\\le1}H_n=\\frac{e^{-n\\delta}-e^{-n}}{1-e^{-n}}$。","按权重集中四步：误差 $=\\int H_n(f-f(0))$；$|x|\\lt\\delta$ 上 $|f-f(0)|\\le\\varepsilon$；外面 $\\le2M\\times$ 远处权重 $\\to0$。答案 $f(0)$。"],"method":"m-ir2","sol":"<p><b>第 1 步：求 $c_n$<\/b>。被积函数是偶函数：$$\\int_{-1}^1e^{-n|x|}dx=2\\int_0^1e^{-nx}dx=2\\Big[-\\frac{e^{-nx}}n\\Big]_0^1=\\frac{2(1-e^{-n})}n.$$ 要使 $\\int H_n=1$，<b>$c_n=\\dfrac{n}{2(1-e^{-n})}$<\/b>。<\/p>\n<p><b>第 2 步：远处权重<\/b>。对 $\\delta\\in(0,1)$：$$\\int_{\\delta\\le|x|\\le1}H_n=c_n\\cdot2\\int_\\delta^1e^{-nx}dx=c_n\\cdot\\frac{2(e^{-n\\delta}-e^{-n})}n=\\frac{e^{-n\\delta}-e^{-n}}{1-e^{-n}}\\le\\frac{e^{-n\\delta}}{1-e^{-1}}\\to0.$$<\/p>\n<p><b>第 3 步：误差估计<\/b>。$f$ 在 $[-1,1]$ 连续，故有界，设 $|f(x)-f(0)|\\le2M$。给定 $\\varepsilon\\gt0$，取 $\\delta$ 使 $|x|\\lt\\delta$ 时 $|f(x)-f(0)|\\le\\varepsilon$。因 $\\int H_n=1$：<\/p>\n$$\\Big|\\int_{-1}^1fH_n-f(0)\\Big|=\\Big|\\int_{-1}^1H_n(f-f(0))\\Big|\\le\\varepsilon\\int_{|x|\\lt\\delta}H_n+2M\\int_{|x|\\ge\\delta}H_n\\le\\varepsilon+2M\\cdot\\frac{e^{-n\\delta}-e^{-n}}{1-e^{-n}}.$$\n<p><b>第 4 步<\/b>：固定 $\\delta$ 令 $n\\to\\infty$，第二项 $\\to0$，得 $\\limsup|\\cdots|\\le\\varepsilon$；$\\varepsilon$ 任意。<\/p>\n<p><b>答案：$c_n=\\frac{n}{2(1-e^{-n})}$，$\\lim_n\\int_{-1}^1fH_n=f(0)$。<\/b><\/p>"}]},"ip1":{"unit":"current-int","n":2,"title":"Week 10｜不定积分：原函数、换元与分部","goal":"对应课堂讲义第 3–6 页。学会“求原函数”的三件工具：凑微分（第一类换元）、主动代入（第二类换元）、分部积分（含循环分部和降幂递推），并养成最后求导验算的习惯。","sections":[{"id":"ip1-s1","h":"1. 原函数与不定积分：为什么要写 +C、要注意区间","html":"<p><b>这节解决什么<\/b>：求积分其实是“求导的逆运算”。先弄清“原函数”指什么、为什么结果总带一个常数 $C$。<\/p>\n<p><b>定义<\/b>：在区间 $I$ 上，如果 $F'(x)=f(x)$ 对每个 $x\\in I$ 成立，就说 $F$ 是 $f$ 在 $I$ 上的<b>原函数<\/b>。$f$ 的全体原函数记为 $\\int f(x)\\,dx$，叫<b>不定积分<\/b>。<\/p>\n<p><b>为什么是 $F+C$<\/b>：<\/p>\n<ol>\n<li>若 $F,G$ 都是 $f$ 在区间 $I$ 上的原函数，则 $(G-F)'=f-f=0$。<\/li>\n<li>导数恒为 0 的函数，在<b>一个区间<\/b>上是常数（对任意两点用拉格朗日中值定理：$G-F$ 在两点的差 = 导数 × 距离 = 0）。<\/li>\n<li>所以 $G=F+C$，写成 $\\int f(x)\\,dx=F(x)+C$。<\/li>\n<\/ol>\n<p><b>注意“一个区间”<\/b>：定义域断成两段时，两段的常数可以不同。例如 $\\int\\frac1x\\,dx=\\ln|x|+C$：在 $x\\gt0$ 上是 $\\ln x+C_1$，在 $x\\lt0$ 上是 $\\ln(-x)+C_2$，$C_1,C_2$ 可独立选（中值定理不能跨过断点 0 使用）。<\/p>\n<p><b>要背的基本公式<\/b>（每个都可以对右边求导验证）：<\/p>\n<ul>\n<li>$\\int x^p\\,dx=\\frac{x^{p+1}}{p+1}+C$（$p\\ne-1$，在 $x^p$ 有定义的区间上）；$\\int\\frac{dx}x=\\ln|x|+C$。<\/li>\n<li>$\\int e^x\\,dx=e^x+C$，$\\int\\sin x\\,dx=-\\cos x+C$，$\\int\\cos x\\,dx=\\sin x+C$。<\/li>\n<li>$\\int\\frac{dx}{1+x^2}=\\arctan x+C$，$\\int\\frac{dx}{\\sqrt{1-x^2}}=\\arcsin x+C$（$|x|\\lt1$）。<\/li>\n<\/ul>\n<p><b>小例子<\/b>：$\\int(3x^2+\\cos x)\\,dx=x^3+\\sin x+C$。验算：$(x^3+\\sin x)'=3x^2+\\cos x$ ✓。<\/p>"},{"id":"ip1-s2","h":"2. 换元：看见“内层的导数”就凑微分，看见根号就主动代入","html":"<p><b>这节解决什么<\/b>：被积函数是复合函数时，基本公式用不上，换元能把它变回基本公式。<\/p>\n<p><b>第一类换元（凑微分）<\/b>：如果被积式长成 $g(\\phi(x))\\,\\phi'(x)$，令 $u=\\phi(x)$，则 $du=\\phi'(x)\\,dx$，积分变成 $\\int g(u)\\,du$。口诀：<b>看见某个内层函数的导数也在被积式里，就把它凑成 $du$<\/b>。<\/p>\n<p><b>例<\/b>：$\\int\\tan x\\,dx=\\int\\frac{\\sin x}{\\cos x}\\,dx$。内层 $u=\\cos x$，$du=-\\sin x\\,dx$，所以 $$\\int\\frac{\\sin x}{\\cos x}\\,dx=-\\int\\frac{du}u=-\\ln|u|+C=-\\ln|\\cos x|+C.$$<\/p>\n<p><b>第二类换元（主动代入）<\/b>：被积式里没有现成的 $\\phi'$，但换一个变量能化简，就主动设 $x=\\phi(t)$，$dx=\\phi'(t)\\,dt$。算完要<b>反代<\/b>回 $x$，所以 $\\phi$ 要在所选的 $t$ 区间上一一对应（单调），这样才能写出 $t$ 关于 $x$ 的表达式。<\/p>\n<p><b>常见搭配<\/b>：<\/p>\n<ul>\n<li>$\\sqrt{a^2-x^2}$：令 $x=a\\sin t$，$t\\in(-\\frac\\pi2,\\frac\\pi2)$。此时 $\\cos t\\gt0$，所以 $\\sqrt{a^2-a^2\\sin^2t}=a|\\cos t|=a\\cos t$，绝对值可以直接去掉。<\/li>\n<li>$\\sqrt{a^2+x^2}$ 或 $(a^2+x^2)^{-k}$：令 $x=a\\tan t$，同样取 $t\\in(-\\frac\\pi2,\\frac\\pi2)$，则 $1+\\tan^2t=\\sec^2t$，$\\sec t=\\frac1{\\cos t}\\gt0$（$\\sec$ 读“正割”，就是 $\\frac1{\\cos}$）。<\/li>\n<\/ul>\n<p><b>易错<\/b>：开根号前先确定符号。$\\sqrt{\\cos^2t}=|\\cos t|$，只有在选定的区间里 $\\cos t\\gt0$ 时才等于 $\\cos t$。<\/p>"},{"id":"ip1-s3","h":"3. 分部积分：让一个因子求导变简单","html":"<p><b>这节解决什么<\/b>：被积式是两类函数的乘积（多项式 × 指数/三角/对数/反三角）时，用分部积分。<\/p>\n<p><b>公式<\/b>：由乘积求导 $(uv)'=u'v+uv'$ 两边积分，得 $$\\int u\\,dv=uv-\\int v\\,du.$$ 其中 $dv=v'(x)\\,dx$，$du=u'(x)\\,dx$。<b>选 $u$ 的原则<\/b>：选求导后变简单的那个（对数、反三角求导变成分式；多项式求导降次），$dv$ 选容易积分的那个。<\/p>\n<p><b>例<\/b>：$\\int x\\ln x\\,dx$（$x\\gt0$）。取 $u=\\ln x$，$dv=x\\,dx$，则 $du=\\frac1x\\,dx$，$v=\\frac{x^2}2$： $$\\int x\\ln x\\,dx=\\frac{x^2}2\\ln x-\\int\\frac{x^2}2\\cdot\\frac1x\\,dx=\\frac{x^2}2\\ln x-\\frac{x^2}4+C.$$<\/p>\n<p><b>循环分部<\/b>：像 $\\int e^{ax}\\sin bx\\,dx$，分部两次后原积分 $I$ 又出现在右边，得到形如 $I=(\\text{已知函数})-kI$ 的方程。这时<b>把 $I$ 移到左边解出来<\/b>：$I=\\frac{\\text{已知函数}}{1+k}$，最后补 $+C$。<\/p>\n<p><b>降幂递推<\/b>：令 $J_n=\\int\\cos^nx\\,dx$（$n\\ge2$）。把 $\\cos^nx$ 写成 $\\cos^{n-1}x\\cdot\\cos x$，取 $u=\\cos^{n-1}x$，$dv=\\cos x\\,dx$（$v=\\sin x$）：<\/p>\n$$J_n=\\sin x\\cos^{n-1}x+(n-1)\\int\\cos^{n-2}x\\sin^2x\\,dx.$$\n<p>把 $\\sin^2x=1-\\cos^2x$ 代入，最后一项变成 $(n-1)(J_{n-2}-J_n)$。移项得 $nJ_n=\\sin x\\cos^{n-1}x+(n-1)J_{n-2}$，即 $$J_n=\\frac1n\\sin x\\cos^{n-1}x+\\frac{n-1}nJ_{n-2}.$$ 从 $J_0=x+C$，$J_1=\\sin x+C$ 一步步往上算。<\/p>\n<p><b>小例子<\/b>：$n=2$ 时 $J_2=\\frac12\\sin x\\cos x+\\frac12x+C$。验算：求导得 $\\frac12(\\cos^2x-\\sin^2x)+\\frac12=\\frac12(\\cos^2x-\\sin^2x+\\cos^2x+\\sin^2x)=\\cos^2x$ ✓。<\/p>"}],"widget":null,"concepts":[{"id":"ip1-c1","sec":"ip1-s1","q":"$1/x$ 在两个定义域分支上的积分常数有什么关系？","opts":["必须相同","可独立选择","必须互为相反数","两个都约定为零"],"a":1,"ex":"“导数为 0 ⇒ 常数”靠中值定理，只能在一个连通的区间上用。$x\\gt0$ 和 $x\\lt0$ 被 0 隔开，所以两边的常数可以不同。最容易误选“必须相同”：比如 $F=\\ln x+1$（$x\\gt0$）、$F=\\ln(-x)+5$（$x\\lt0$），它在每一处的导数都是 $1/x$，同样是原函数。"},{"id":"ip1-c2","sec":"ip1-s2","q":"求 $\\int dx/\\sqrt{1+x^2}$ 时，令 $x=\\tan t$ 并取 $t\\in(-\\pi/2,\\pi/2)$，根号变成什么？","opts":["$-\\sec t$","$\\sec t$","$\\cos t$","$\\tan t$"],"a":1,"ex":"$1+\\tan^2t=\\frac1{\\cos^2t}=\\sec^2t$，所以 $\\sqrt{1+x^2}=|\\sec t|$。在 $(-\\frac\\pi2,\\frac\\pi2)$ 上 $\\cos t\\gt0$，故 $|\\sec t|=\\sec t$。易误选“$\\cos t$”：把 $\\sec t=\\frac1{\\cos t}$ 记成了 $\\cos t$；“$-\\sec t$”则是没看清区间里余弦为正。"},{"id":"ip1-c3","sec":"ip1-s3","q":"求 $\\int x\\ln x\\,dx$ 时怎样选 $u,dv$ 最简？","opts":["$u=x,dv=\\ln x\\,dx$","$u=\\ln x,dv=x\\,dx$","$u=x\\ln x,dv=0$","$u=1/x,dv=x\\,dx$"],"a":1,"ex":"取 $u=\\ln x$，求导变成 $\\frac1x$，和 $v=\\frac{x^2}2$ 相乘只剩 $\\frac x2$，一步积完。最容易误选 $u=x,dv=\\ln x\\,dx$：这需要先知道 $\\ln x$ 的原函数 $x\\ln x-x$，之后还要再积一次，绕远路。"},{"id":"ip1-c4","sec":"ip1-s3","q":"分部两次回到原积分时，下一步是什么？","opts":["立刻判断无原函数","再分部一次必然结束","移项解出原积分，再补常数","把原积分改写成定积分"],"a":2,"ex":"得到 $I=g(x)-kI$ 后，把 $I$ 当未知数：$(1+k)I=g(x)$，$I=\\frac{g(x)}{1+k}+C$（需 $1+k\\ne0$）。误选“再分部一次必然结束”：继续分部只会一直循环下去，永远消不掉。"}],"methods":[{"id":"m-ip1","title":"求不定积分的选法清单（最后求导验算）","steps":["第 1 步：能拆成基本公式的线性组合就直接拆。","第 2 步：看见“内层函数的导数”也在被积式里 → 凑微分 $u=\\phi(x)$。","第 3 步：看见 $\\sqrt{a^2-x^2}$、$\\sqrt{a^2+x^2}$ → 令 $x=a\\sin t$ 或 $x=a\\tan t$，先写明 $t\\in(-\\frac\\pi2,\\frac\\pi2)$ 再去根号。","第 4 步：多项式 × 指数/三角，或含对数、反三角 → 分部积分，让对数/反三角/多项式那一项当 $u$。","第 5 步：反代回 $x$，写 $+C$，对答案求导看是否等于被积函数。易错：换元后忘了把 $dx$ 也换掉。"]}],"problems":[{"id":"ip1-p1","lv":"练习","src":"自编同类练习","stmt":"<p>求 $\\int \\sin x/(2+\\cos x)\\,dx$ 与 $\\int x/(1+x^4)\\,dx$。<\/p>","hints":["两个都用凑微分：找“内层函数”，看它的导数是否也在被积式里。","第一式：$u=2+\\cos x$，$du=-\\sin x\\,dx$。第二式：$u=x^2$，$du=2x\\,dx$，且 $x^4=u^2$。","第一式化为 $-\\int\\frac{du}u$；第二式化为 $\\frac12\\int\\frac{du}{1+u^2}$。"],"method":"m-ip1","sol":"<p><b>第一式<\/b>。令 $u=2+\\cos x$，则 $du=-\\sin x\\,dx$，即 $\\sin x\\,dx=-du$。<\/p>\n$$\\int\\frac{\\sin x}{2+\\cos x}\\,dx=-\\int\\frac{du}u=-\\ln|u|+C=-\\ln(2+\\cos x)+C.$$\n<p>绝对值可去掉，因为 $\\cos x\\ge-1$，所以 $2+\\cos x\\ge1\\gt0$。<\/p>\n<p><b>第二式<\/b>。令 $u=x^2$，则 $du=2x\\,dx$，即 $x\\,dx=\\frac12du$，而 $1+x^4=1+u^2$。<\/p>\n$$\\int\\frac{x}{1+x^4}\\,dx=\\frac12\\int\\frac{du}{1+u^2}=\\frac12\\arctan u+C=\\frac12\\arctan(x^2)+C.$$\n<p><b>验算<\/b>：$\\bigl(-\\ln(2+\\cos x)\\bigr)'=-\\frac{-\\sin x}{2+\\cos x}=\\frac{\\sin x}{2+\\cos x}$ ✓；$\\bigl(\\frac12\\arctan x^2\\bigr)'=\\frac12\\cdot\\frac{2x}{1+x^4}=\\frac x{1+x^4}$ ✓。<\/p>\n<p><b>答案：$-\\ln(2+\\cos x)+C$；$\\frac12\\arctan(x^2)+C$。<\/b><\/p>"},{"id":"ip1-p2","lv":"练习","src":"自编同类练习","stmt":"<p>在 $-2\\lt x\\lt2$ 上求 $\\int\\sqrt{4-x^2}\\,dx$，并说明替换时为什么可以去掉余弦的绝对值。<\/p>","hints":["第二类换元：令 $x=2\\sin t$，限定 $t\\in(-\\frac\\pi2,\\frac\\pi2)$，这样 $x$ 与 $t$ 一一对应。","$\\sqrt{4-4\\sin^2t}=2|\\cos t|=2\\cos t$，$dx=2\\cos t\\,dt$，被积式化为 $4\\cos^2t$。","用 $\\cos^2t=\\frac{1+\\cos2t}2$ 降幂：$4\\int\\cos^2t\\,dt=2t+\\sin2t+C$。再用 $\\sin t=\\frac x2$，$\\cos t=\\frac{\\sqrt{4-x^2}}2$ 反代。"],"method":"m-ip1","sol":"<p><b>换元<\/b>：令 $x=2\\sin t$，$t\\in(-\\frac\\pi2,\\frac\\pi2)$。此区间上 $\\sin t$ 严格递增，$x$ 取遍 $(-2,2)$，且 $t=\\arcsin\\frac x2$。$dx=2\\cos t\\,dt$。<\/p>\n<p><b>去绝对值<\/b>：$\\sqrt{4-x^2}=\\sqrt{4(1-\\sin^2t)}=2|\\cos t|$。因为 $t\\in(-\\frac\\pi2,\\frac\\pi2)$ 时 $\\cos t\\gt0$，所以 $=2\\cos t$。<\/p>\n<p><b>计算<\/b>：<\/p>\n$$\\int\\sqrt{4-x^2}\\,dx=\\int2\\cos t\\cdot2\\cos t\\,dt=4\\int\\cos^2t\\,dt=4\\int\\frac{1+\\cos2t}2\\,dt=2t+\\sin2t+C.$$\n<p><b>反代<\/b>：$t=\\arcsin\\frac x2$；$\\sin2t=2\\sin t\\cos t=2\\cdot\\frac x2\\cdot\\frac{\\sqrt{4-x^2}}2=\\frac x2\\sqrt{4-x^2}$。<\/p>\n<p><b>答案：$\\int\\sqrt{4-x^2}\\,dx=2\\arcsin\\frac x2+\\frac x2\\sqrt{4-x^2}+C$。<\/b><\/p>\n<p>验算：求导得 $\\frac{2}{\\sqrt{4-x^2}}+\\frac12\\sqrt{4-x^2}-\\frac{x^2}{2\\sqrt{4-x^2}}=\\frac{4+(4-x^2)-x^2}{2\\sqrt{4-x^2}}=\\sqrt{4-x^2}$ ✓。<\/p>"},{"id":"ip1-p3","lv":"练习","src":"自编同类练习","stmt":"<p>用分部积分求 $\\int x\\arctan x\\,dx$ 及 $\\int e^{2x}\\sin x\\,dx$。<\/p>","hints":["第一式取 $u=\\arctan x$，$dv=x\\,dx$（反三角求导后变成分式）。第二式是循环分部。","第一式剩下 $\\frac12\\int\\frac{x^2}{1+x^2}dx$，把 $\\frac{x^2}{1+x^2}$ 写成 $1-\\frac1{1+x^2}$。第二式记 $I=\\int e^{2x}\\sin x\\,dx$，$J=\\int e^{2x}\\cos x\\,dx$，都取 $u=$ 三角函数、$dv=e^{2x}dx$。","得到 $I=\\frac12e^{2x}\\sin x-\\frac12J$，$J=\\frac12e^{2x}\\cos x+\\frac12I$；把第二式代入第一式，解 $I$。"],"method":"m-ip1","sol":"<p><b>第一式<\/b>。取 $u=\\arctan x$，$dv=x\\,dx$，则 $du=\\frac{dx}{1+x^2}$，$v=\\frac{x^2}2$。<\/p>\n$$\\int x\\arctan x\\,dx=\\frac{x^2}2\\arctan x-\\frac12\\int\\frac{x^2}{1+x^2}\\,dx.$$\n<p>又 $\\frac{x^2}{1+x^2}=1-\\frac1{1+x^2}$，所以 $\\int\\frac{x^2}{1+x^2}dx=x-\\arctan x+C$。代回：<\/p>\n$$\\int x\\arctan x\\,dx=\\frac{x^2}2\\arctan x-\\frac x2+\\frac12\\arctan x+C=\\frac{1+x^2}2\\arctan x-\\frac x2+C.$$\n<p><b>第二式<\/b>。记 $I=\\int e^{2x}\\sin x\\,dx$，$J=\\int e^{2x}\\cos x\\,dx$（等式按“相差常数”理解，最后补 $C$）。<\/p>\n<p>对 $I$：$u=\\sin x$，$dv=e^{2x}dx$，$v=\\frac12e^{2x}$：$I=\\frac12e^{2x}\\sin x-\\frac12\\int e^{2x}\\cos x\\,dx=\\frac12e^{2x}\\sin x-\\frac12J$。<\/p>\n<p>对 $J$：$u=\\cos x$，$dv=e^{2x}dx$：$J=\\frac12e^{2x}\\cos x-\\frac12\\int e^{2x}(-\\sin x)\\,dx=\\frac12e^{2x}\\cos x+\\frac12I$。<\/p>\n<p>代入：$I=\\frac12e^{2x}\\sin x-\\frac14e^{2x}\\cos x-\\frac14I$，移项 $\\frac54I=\\frac14e^{2x}(2\\sin x-\\cos x)$，所以<\/p>\n$$\\int e^{2x}\\sin x\\,dx=\\frac{e^{2x}(2\\sin x-\\cos x)}5+C.$$\n<p>验算：求导得 $\\frac{e^{2x}}5\\bigl[2(2\\sin x-\\cos x)+(2\\cos x+\\sin x)\\bigr]=\\frac{e^{2x}}5\\cdot5\\sin x=e^{2x}\\sin x$ ✓。<\/p>\n<p><b>答案：$\\frac{1+x^2}2\\arctan x-\\frac x2+C$；$\\frac15e^{2x}(2\\sin x-\\cos x)+C$。<\/b><\/p>"}],"variants":[{"id":"ip1-v1","lv":"练习","src":"自编同类练习","stmt":"<p>用降幂递推写出 $\\int\\cos^6 x\\,dx$，可保留正弦和余弦的乘积形式。<\/p>","hints":["用递推公式 $J_n=\\frac1n\\sin x\\cos^{n-1}x+\\frac{n-1}nJ_{n-2}$，其中 $J_n=\\int\\cos^nx\\,dx$。","依次写出 $J_2=\\frac12\\sin x\\cos x+\\frac12x$，$J_4=\\frac14\\sin x\\cos^3x+\\frac34J_2$，$J_6=\\frac16\\sin x\\cos^5x+\\frac56J_4$。","从下往上代：先算 $J_4$ 的展开，再乘 $\\frac56$ 代入 $J_6$。系数 $\\frac56\\cdot\\frac34=\\frac58$，$\\frac58\\cdot\\frac12=\\frac5{16}$。"],"method":"m-ip1","sol":"<p>记 $J_n=\\int\\cos^nx\\,dx$，递推公式（见讲解第 3 节）：$J_n=\\frac1n\\sin x\\cos^{n-1}x+\\frac{n-1}nJ_{n-2}$。常数最后统一补 $C$。<\/p>\n<p><b>第 1 步<\/b>（$n=2$，$J_0=x$）：$$J_2=\\frac12\\sin x\\cos x+\\frac12x.$$<\/p>\n<p><b>第 2 步<\/b>（$n=4$）：$$J_4=\\frac14\\sin x\\cos^3x+\\frac34J_2=\\frac14\\sin x\\cos^3x+\\frac38\\sin x\\cos x+\\frac38x.$$<\/p>\n<p><b>第 3 步<\/b>（$n=6$）：$$J_6=\\frac16\\sin x\\cos^5x+\\frac56J_4=\\frac16\\sin x\\cos^5x+\\frac5{24}\\sin x\\cos^3x+\\frac5{16}\\sin x\\cos x+\\frac5{16}x.$$ （其中 $\\frac56\\cdot\\frac14=\\frac5{24}$，$\\frac56\\cdot\\frac38=\\frac5{16}$。）<\/p>\n<p><b>答案：$\\int\\cos^6x\\,dx=\\frac16\\sin x\\cos^5x+\\frac5{24}\\sin x\\cos^3x+\\frac5{16}\\sin x\\cos x+\\frac5{16}x+C$。<\/b><\/p>\n<p>检查：$\\cos^6x$ 在一个周期 $[0,2\\pi]$ 上的平均值应是 $x$ 的系数。$\\frac5{16}$ 与公式 $\\frac{1\\cdot3\\cdot5}{2\\cdot4\\cdot6}=\\frac{15}{48}=\\frac5{16}$ 一致 ✓。<\/p>"}],"extensions":[{"id":"ip1-e1","lv":"练习","src":"自编同类练习","stmt":"<p>用换元把 $\\int (4+x^2)^{-2}\\,dx$ 化为正割或余弦的初等积分，求写回 x 的原函数。<\/p>","hints":["看到 $4+x^2$ 就令 $x=2\\tan t$，$t\\in(-\\frac\\pi2,\\frac\\pi2)$，用 $1+\\tan^2t=\\sec^2t$。","$dx=2\\sec^2t\\,dt$，$(4+x^2)^2=16\\sec^4t$，所以被积式变成 $\\frac{2\\sec^2t}{16\\sec^4t}=\\frac18\\cos^2t$。","$\\frac18\\int\\cos^2t\\,dt=\\frac1{16}(t+\\sin t\\cos t)+C$；再用 $\\sin t\\cos t=\\frac{\\tan t}{1+\\tan^2t}=\\frac{2x}{4+x^2}$ 反代。"],"method":"m-ip1","sol":"<p><b>换元<\/b>：令 $x=2\\tan t$，$t\\in(-\\frac\\pi2,\\frac\\pi2)$，则 $t=\\arctan\\frac x2$，$dx=2\\sec^2t\\,dt$，且 $$4+x^2=4(1+\\tan^2t)=4\\sec^2t,\\qquad(4+x^2)^2=16\\sec^4t.$$<\/p>\n<p><b>化简<\/b>：<\/p>\n$$\\int\\frac{dx}{(4+x^2)^2}=\\int\\frac{2\\sec^2t}{16\\sec^4t}\\,dt=\\frac18\\int\\cos^2t\\,dt=\\frac18\\int\\frac{1+\\cos2t}2\\,dt=\\frac1{16}\\Big(t+\\frac12\\sin2t\\Big)+C=\\frac1{16}(t+\\sin t\\cos t)+C.$$\n<p><b>反代<\/b>：$\\sin t\\cos t=\\frac{\\sin t}{\\cos t}\\cos^2t=\\frac{\\tan t}{\\sec^2t}=\\frac{\\tan t}{1+\\tan^2t}=\\frac{x/2}{1+x^2/4}=\\frac{2x}{4+x^2}$。所以<\/p>\n$$\\int\\frac{dx}{(4+x^2)^2}=\\frac1{16}\\arctan\\frac x2+\\frac1{16}\\cdot\\frac{2x}{4+x^2}+C=\\frac1{16}\\arctan\\frac x2+\\frac{x}{8(4+x^2)}+C.$$\n<p>验算：求导得 $\\frac1{16}\\cdot\\frac{2}{4+x^2}+\\frac{(4+x^2)-2x^2}{8(4+x^2)^2}=\\frac{(4+x^2)+(4-x^2)}{8(4+x^2)^2}=\\frac1{(4+x^2)^2}$ ✓。<\/p>\n<p><b>答案：$\\frac1{16}\\arctan\\frac x2+\\frac{x}{8(4+x^2)}+C$。<\/b><\/p>"}]}});

  "sections": [
    {
      "id": "ip2-s1",
      "h": "有理函数积分：先长除，再拆分母",
      "html": "<p><b>这节解决什么</b>：分子和分母都是多项式时，怎样把一个难积的分式拆成几项能直接积的式子。这样的分式叫有理函数。</p>\n<p><b>第 1 步：看次数。</b>如果分子的次数不低于分母，先做多项式除法，把分式写成“多项式 + 真分式”。真分式指分子次数低于分母。例如 $x^2/(x+1)=x-1+1/(x+1)$。</p>\n<p><b>第 2 步：分解分母。</b>分母拆成一次因子和不能再分解成实一次因子的二次因子。一次因子上放常数，二次因子上放一次式。如果因子重复，每次幂单独放一项。例如分母是 $(x-1)^2(x^2+1)$，拆成</p>\n$$\\frac A{x-1}+\\frac B{(x-1)^2}+\\frac{Cx+D}{x^2+1}.$$\n<p><b>第 3 步：通分求系数，再逐项积。</b>一次因子的一次幂给对数，更高次幂用幂函数公式。对于不能再分解的二次因子，先配方，再把分子拆成“分母导数乘一个常数，再加一个常数”。比如</p>\n$$\\int\\frac{2x+1}{x^2+1}\\,dx=\\ln(x^2+1)+\\arctan x+C.$$\n<p>二次因子有重复幂时，配方后会遇到 $\\int du/(1+u^2)^k$；可令 $u=\\tan t$，化为 $\\int\\cos^{2k-2}t\\,dt$。例如 $k=2$ 时，剩下 $\\int\\cos^2t\\,dt$，用 $\\cos^2t=(1+\\cos2t)/2$。</p>"
    },
    {
      "id": "ip2-s2",
      "h": "三角有理式和根式：挑能消掉额外因子的换元",
      "html": "<p><b>这节解决什么</b>：先试能直接凑微分的换元，通常能比通法少算几行。</p>\n<ul><li><b>三角有理式</b>以 $\\sin x,\\cos x$ 为变量作加减乘除。若把 $\\sin x$ 变号会让整个式子变号，可以提出一个 $\\sin x$，其余偶次正弦用 $1-\\cos^2x$ 化去，再令 $u=\\cos x$。对 $\\cos x$ 变号后的奇性同理，改令 $u=\\sin x$。若两者同时变号后式子不变，可以考虑 $u=\\tan x$。其他情况可用半角代换 $u=\\tan(x/2)$，在代换有效的区间内计算。</li>\n<li><b>根式</b>先看有没有“平方差”。例如 $\\sqrt{9-x^2}$ 令 $x=3\\sin t$；在 $-\\pi/2\\lt t\\lt\\pi/2$，根号正好变成 $3\\cos t$。看到 $\\sqrt{x^2+a^2}$ 可以试 $x=a\\tan t$（$a\\gt0$）；看到 $\\sqrt{x^2-a^2}$，在 $x\\gt a$ 可试 $x=a/\\cos t$，其余区间检查符号。分式里只有一个根式时，也可以直接把根式设为新变量。</li></ul>\n<p><b>数值例子</b>：$x=3/2$ 对应 $t=\\pi/6$，$\\sqrt{9-x^2}=3\\sqrt3/2=3\\cos(\\pi/6)$。一般写 $\\sqrt{\\cos^2t}=|\\cos t|$，选好区间后才能去掉绝对值。</p>"
    },
    {
      "id": "ip2-s3",
      "h": "定积分：换元要换上下限，先看对称性",
      "html": "<p><b>这节解决什么</b>：把变元和端点一并换掉。有时做两次简单换元相加，连原函数都不用先求。</p>\n<p><b>端点跟着变量走。</b>在 $\\int_0^1 2x(1+x^2)\\,dx$ 中令 $u=1+x^2$。$x=0$、$1$ 变成 $u=1$、$2$，所得是 $\\int_1^2u\\,du=3/2$。若新变量方向反过来，可保留倒序上下限；调成正序时记得改变符号。</p>\n<p><b>区间反射</b>把 $x$ 换成 $a+b-x$，会交换区间 $[a,b]$ 两端。如果 $g(a+b-x)=g(x)$，那么同一个定积分 $I=\\int_a^b xg(x)\\,dx$ 可写成 $\\int_a^b(a+b-x)g(x)\\,dx$。两式相加得到</p>\n$$I=\\frac{a+b}{2}\\int_a^b g(x)\\,dx.$$\n<p>例如在 $[0,2]$ 上取 $g=1$，公式给 $I=1\\times2=2$，与直接积分相同。若仍有适合分部的乘积，记得写清边界项 $[uv]_a^b$。</p>"
    },
    {
      "id": "ip2-s4",
      "h": "Taylor 的积分余项：用导数的范围估计误差",
      "html": "<p><b>这节解决什么</b>：用低次多项式近似函数时，想知道误差的正负和大小。误差 $R_n(x)$ 是原函数值减去 $n$ 次 Taylor 多项式的值。</p>\n<p>若 $f$ 在展开点 $a$ 与 $x$ 之间有 $n+1$ 阶连续导数，积分余项为</p>\n$$R_n(x)=\\frac1{n!}\\int_a^x (x-t)^n f^{(n+1)}(t)\\,dt.$$\n<p>当 $x\\ge a$，权重 $(x-t)^n$ 非负，所以把 $f^{(n+1)}(t)$ 换成其上下界就能估计余项。若只知道 $|f^{(n+1)}(t)|\\le M$，则</p>\n$$|R_n(x)|\\le \\frac{M|x-a|^{n+1}}{(n+1)!}.$$\n<p>平方项的大小从哪里来？当 $n=1$ 且 $x\\ge a$，权重 $(x-t)$ 积出的是 $(x-a)^2/2$。例如 $f(x)=x^2$、$a=0$，一次 Taylor 多项式为 $0$，$f''=2$，积分余项刚好等于 $x^2$。当 $x\\lt a$，估绝对值时先把区间方向调成正序。</p>"
    }

      hints: [R`半径恒为 2，所以 $ds=2\,d\theta$。`, R`绕 $x$ 轴取 $d=y=2\sin\theta$，绕 $y$ 轴取 $d=x=2\cos\theta$。`, R`两个面积分别为 $8\pi\int_0^{\pi/3}\sin\theta\,d\theta$ 和 $8\pi\int_0^{\pi/3}\cos\theta\,d\theta$。`],
      method: "m-ip3-measure",
      sol: R`<p>圆弧在第一象限，所得两个曲面都单次覆盖。极坐标速度为 $2$，所以 $ds=2\,d\theta$。到两轴的距离分别为 $2\sin\theta$ 和 $2\cos\theta$。</p>
$$S_x=8\pi(1-\cos(\pi/3))=4\pi,$$
$$S_y=8\pi\sin(\pi/3)=4\pi\sqrt3.$$
<p>验算时也可用半径为 2 的球带面积 $2\pi\cdot2\,h$。沿 $x$ 轴的带宽 $h=2-1=1$，沿 $y$ 轴的带宽 $h=\sqrt3-0=\sqrt3$。</p>`
    }
  ],
  variants: [
    {
      id: "ip3-v-area", lv: "变种", src: "自编 · 参数反向与平面面积",
      stmt: R`<p>参数曲线 $x=1-t^3$、$y=1-t$，$0\le t\le1$，从 $(1,1)$ 走到 $(0,0)$。求 $0\le x\le1$ 内曲线与 $x$ 轴之间的面积。</p>`,
      hints: [R`曲线从 $(1,1)$ 走到 $(0,0)$，确认 $x$ 变化的方向。`, R`因为 $x'=-3t^2$，竖条宽为 $3t^2dt$。`, R`积分为 $3\int_0^1(t^2-t^3)dt$。`],
      method: "m-ip3-measure",
      sol: R`<p>曲线在 $x$ 轴上方，而且 $x(t)$ 从 1 单调降到 0，同一竖条只扫一次。按参数正向取宽 $|x'|dt$，于是</p>
$$A=\int_0^1(1-t)\,3t^2\,dt=3\left(\frac13-\frac14\right)=\frac14.$$
<p>也可写成 $y=1-(1-x)^{1/3}$，从 $x=0$ 积到 $x=1$ 得到 $1-3/4=1/4$。</p>`
    },
    {
      id: "ip3-v-volume", lv: "变种", src: "自编 · 同一区域绕两轴",
      stmt: R`<p>第一象限内，直线 $y=3-\frac32x$ 与两坐标轴围成一个三角形。求它分别绕 $x$ 轴和 $y$ 轴旋转一周的体积。</p>`,
      hints: [R`截距分别为 $(2,0)$、$(0,3)$。两种切法都是圆盘。`, R`绕 $x$ 轴用半径 $3-\frac32x$，取 $0\le x\le2$。`, R`绕 $y$ 轴改写为 $x=2-\frac23y$，取 $0\le y\le3$。`],
      method: "m-ip3-measure",
      sol: R`<p>绕 $x$ 轴时，竖直截面半径为 $3-\frac32x$，厚度为 $dx$。绕 $y$ 轴时，水平截面半径为 $2-\frac23y$，厚度为 $dy$。分别积分：</p>
$$V_x=\pi\int_0^2(3-\tfrac32x)^2dx=6\pi,$$
$$V_y=\pi\int_0^3(2-\tfrac23y)^2dy=4\pi.$$
<p>两个结果也分别等于半径 3 高 2、半径 2 高 3 的圆锥体积。</p>`
    },
    {
      id: "ip3-v-curvature", lv: "变种", src: "自编 · 曲率中心与法线方向",
      stmt: R`<p>求曲线 $y=-x^2$ 在 $x=1$ 处的曲率、曲率半径与曲率中心，并核对中心位于所求点的哪一侧。</p>`,
      hints: [R`所求点为 $(1,-1)$，该处 $f'=-2$、$f''=-2$。`, R`曲率为 $2/5^{3/2}$，半径为 $5\sqrt5/2$。`, R`上方法向量是 $(2,1)$，中心应沿其反向。将 $(1,-1)$ 加上 $-\tfrac52(2,1)$。`],
      method: "m-ip3-bend",
      sol: R`<p>在 $P=(1,-1)$，$f'(1)=-2$，$f''(1)=-2$。由图像曲率公式，</p>
$$\kappa=\frac2{5\sqrt5},\qquad R=\frac{5\sqrt5}{2}.$$
<p>上方单位法线是 $(2,1)/\sqrt5$，但 $f''(1)\lt0$，曲线向下弯，所以取反向。曲率中心为</p>
$$C=(1,-1)-\frac{5\sqrt5}{2}\frac{(2,1)}{\sqrt5}=(-4,-7/2).$$
<p>验算：$C-P=(-5,-5/2)$ 与切向量 $(1,-2)$ 的点积为 0，长度等于 $R$，纵分量为负。</p>`
    }
  ],
  extensions: [
    {
      id: "ip3-e-endpoints", lv: "延伸", src: "自编 · 无穷远与有限端点的两种截断",
      stmt: R`<p>（1）单位质量物体在 $s\ge2$ 处受到大小为 $8/s^2$、指向原点的力。从 $s=2$ 向外缓慢移动到无穷远，求所需的功。</p><p>（2）在一个理想容器模型里，液面高度满足 $dh/dt=-2\sqrt h$（$h\gt0$），初始高度为 4。从 $h=4$ 降到 $0$ 需要多久？两问均写出截断极限。</p>`,
      hints: [R`功先积到 $s=R$；时间先算到液面降到 $h=\varepsilon\gt0$。`, R`第（2）问由 $dt=-dh/(2\sqrt h)$，把高度的积分方向反过来可得正时间。`, R`两式分别是 $\lim_{R\to\infty}(4-8/R)$ 和 $\lim_{\varepsilon\to0^+}(2-\sqrt\varepsilon)$。`],
      method: "m-ip3-limit",
      sol: R`<p>（1）向外缓慢移动时，外力抵消指向原点的力，故外力做正功。先算有限距离的功，再取无穷远极限：</p>
$$W=\lim_{R\to\infty}\int_2^R\frac8{s^2}\,ds=\lim_{R\to\infty}(4-8/R)=4.$$
<p>（2）在 $h\gt0$ 时分离变量。从 $4$ 降到 $\varepsilon$ 的时间为 $\int_\varepsilon^4 dh/(2\sqrt h)$，于是</p>
$$T=\lim_{\varepsilon\to0^+}\int_\varepsilon^4\frac{dh}{2\sqrt h}=\lim_{\varepsilon\to0^+}(2-\sqrt\varepsilon)=2.$$
<p>验算（2）：对 $h\gt0$ 有 $d(\sqrt h)/dt=-1$，所以从 $\sqrt h=2$ 降到 $0$ 正好需要 2 个时间单位。</p>`
    }
  ]
};

LESSONS.i4.variants.push(
  {"id":"i4-integrate-order","lv":"变种","src":"自编练习 · 积分升阶","stmt":"<p>设 $A(x)=\\int_0^x[\\ln(1+t^2)-t^2]\\,dt$。求 $A(x)$ 在 $0$ 处第一个非零项，证明余项估计，并计算 $\\lim_{x\\to0}A(x)/x^5$。<\/p>","hints":["先展开被积函数：$\\ln(1+u)=u-\\frac{u^2}2+o(u^2)$，令 $u=t^2$。被积式里的 $t^2$ 会被抵消。","被积式 $=-\\frac{t^4}2+r(t)$，$r(t)=o(t^4)$。$t^4$ 积分后变成 $\\frac{x^5}5$，所以首项是 $-\\frac{x^5}{10}$。","余项：给定 $\\varepsilon\\gt0$，$|t|$ 足够小时 $|r(t)|\\le\\varepsilon t^4$，于是 $\\bigl|\\int_0^xr(t)\\,dt\\bigr|\\le\\varepsilon\\frac{|x|^5}5$（正负 $x$ 都成立）。"],"method":"m-int-limit","sol":"<p><b>第 1 步：展开被积函数<\/b>。$\\ln(1+u)=u-\\frac{u^2}2+o(u^2)$，代 $u=t^2$：$$\\ln(1+t^2)-t^2=t^2-\\frac{t^4}2+o(t^4)-t^2=-\\frac{t^4}2+r(t),\\quad r(t)=o(t^4).$$<\/p>\n<p><b>第 2 步：余项估计<\/b>。$r(t)=o(t^4)$ 的意思是：对任意 $\\varepsilon\\gt0$，存在 $\\delta\\gt0$，当 $|t|\\lt\\delta$ 时 $|r(t)|\\le\\varepsilon t^4$。于是对 $|x|\\lt\\delta$（无论 $x$ 正负，$t$ 都在 0 与 $x$ 之间）：$$\\Big|\\int_0^xr(t)\\,dt\\Big|\\le\\Big|\\int_0^x\\varepsilon t^4\\,dt\\Big|=\\frac{\\varepsilon|x|^5}5.$$ 所以 $\\int_0^xr(t)\\,dt=o(x^5)$。<\/p>\n<p><b>第 3 步：积分<\/b>。$$A(x)=\\int_0^x\\Big(-\\frac{t^4}2\\Big)dt+\\int_0^xr(t)\\,dt=-\\frac{x^5}{10}+o(x^5).$$ 首个非零项为 $-\\frac{x^5}{10}$（四次项积分升为五次，系数 $-\\frac12$ 再除以 5）。<\/p>\n<p><b>第 4 步：极限<\/b>。$\\frac{A(x)}{x^5}=-\\frac1{10}+\\frac{o(x^5)}{x^5}\\to-\\frac1{10}$。<\/p>\n<p><b>答案：首项 $-\\frac{x^5}{10}$，$\\lim_{x\\to0}A(x)/x^5=-\\frac1{10}$。<\/b><\/p>"},
  {"id":"i4-moving-parts","lv":"变种","src":"自编练习 · 双变限与自由变量","stmt":"<p>设 $H(x)=\\int_{-2x}^{2x}(x+t)(1+t)\\,dt$。先用基本定理与乘积法则求 $H'(x)$，分开写出上下限和被积式里的 $x$ 带来的三项，再直接积分验算。<\/p>","hints":["被积式含 $x$，先拆：$(x+t)(1+t)=x(1+t)+t(1+t)$，得 $H=x\\int_{-2x}^{2x}(1+t)dt+\\int_{-2x}^{2x}t(1+t)dt$。","上限 $2x$ 的导数是 2，下限 $-2x$ 的导数是 $-2$。合起来，上限贡献 $=2\\cdot(x+2x)(1+2x)$，下限贡献 $=-(-2)\\cdot(x-2x)(1-2x)$。","上限贡献 $6x(1+2x)$，下限贡献 $-2x(1-2x)$，系数 $x$ 求导的贡献 $\\int_{-2x}^{2x}(1+t)\\,dt=4x$。三项相加。"],"method":"m-int-moving","sol":"<p><b>第 1 步：拆开<\/b>。记 $g(x,t)=(x+t)(1+t)$。$$H(x)=x\\int_{-2x}^{2x}(1+t)\\,dt+\\int_{-2x}^{2x}t(1+t)\\,dt.$$<\/p>\n<p><b>第 2 步：逐项求导<\/b>（乘积法则 + 变限求导公式），把结果按来源分成三项：<\/p>\n<ul>\n<li><b>上限项<\/b>：上限代入 × 上限导数 $=g(x,2x)\\cdot2=(3x)(1+2x)\\cdot2=6x(1+2x)=6x+12x^2$。<\/li>\n<li><b>下限项<\/b>：$-$下限代入 × 下限导数 $=-g(x,-2x)\\cdot(-2)=2\\cdot(-x)(1-2x)=-2x(1-2x)=-2x+4x^2$。<\/li>\n<li><b>被积式中 $x$ 的项<\/b>：乘积法则中对系数 $x$ 求导得 $\\int_{-2x}^{2x}(1+t)\\,dt=\\bigl[t+\\frac{t^2}2\\bigr]_{-2x}^{2x}=4x$。<\/li>\n<\/ul>\n<p>相加：$$H'(x)=(6x+12x^2)+(-2x+4x^2)+4x=8x+16x^2.$$<\/p>\n<p><b>第 3 步：直接积分验算<\/b>。$(x+t)(1+t)=x+(x+1)t+t^2$。在对称区间 $[-2x,2x]$ 上奇函数 $(x+1)t$ 积分为 0：$$H(x)=x\\cdot4x+0+\\Big[\\frac{t^3}3\\Big]_{-2x}^{2x}=4x^2+\\frac{16}3x^3,$$ 求导 $H'(x)=8x+16x^2$，一致 ✓。（$x\\lt0$ 时积分是反向区间，上述等式照样成立。）<\/p>\n<p><b>答案：$H'(x)=8x+16x^2$。<\/b><\/p>"},
  {"id":"i4-nl-proof","lv":"变种","src":"自编练习 · 牛顿–莱布尼兹证明","stmt":"<p>设 $f$ 在 $[-1,2]$ 连续，$P$ 在闭区间连续、在内部可导，并满足 $P'=-2f$。从差商出发证明 $\\int_{-1}^2 f(t)\\,dt=(P(-1)-P(2))/2$。证明中不直接引用牛顿–莱布尼兹。<\/p>","hints":["构造 $F(x)=\\int_{-1}^xf(t)\\,dt$。先用有界性说明 $F$ 连续，再从差商证明 $F'=f$。","差商减 $f(x)$：$\\frac{F(x+h)-F(x)}h-f(x)=\\frac1h\\int_x^{x+h}(f(t)-f(x))\\,dt$，绝对值 $\\le$ 该短区间上 $|f(t)-f(x)|$ 的上确界，由连续性趋于 0。","令 $\\Phi=P+2F$，则 $\\Phi'=-2f+2f=0$。对 $\\Phi$ 在 $[-1,2]$ 上用拉格朗日中值定理得 $\\Phi(2)=\\Phi(-1)$，再代 $F(-1)=0$。"],"method":"m-int-moving","sol":"<p><b>要证<\/b>：$\\int_{-1}^2f(t)\\,dt=\\frac{P(-1)-P(2)}2$。<\/p>\n<p><b>第 1 步：构造并证连续<\/b>。令 $F(x)=\\int_{-1}^xf(t)\\,dt$。$f$ 在闭区间连续，故有界，设 $|f|\\le M$。则 $|F(y)-F(x)|=\\bigl|\\int_x^yf\\bigr|\\le M|y-x|$，$F$ 在 $[-1,2]$ 上连续。<\/p>\n<p><b>第 2 步：从差商证 $F'=f$<\/b>。对内点 $x$ 与 $h\\ne0$：$$\\left|\\frac{F(x+h)-F(x)}h-f(x)\\right|=\\left|\\frac1h\\int_x^{x+h}\\bigl(f(t)-f(x)\\bigr)dt\\right|\\le\\sup_{t\\text{ 在 }x\\text{ 与 }x+h\\text{ 之间}}|f(t)-f(x)|.$$ 由 $f$ 在 $x$ 连续，$h\\to0$ 时右边 $\\to0$，所以 $F'(x)=f(x)$。<\/p>\n<p><b>第 3 步：辅助函数<\/b>。令 $\\Phi=P+2F$。它在 $[-1,2]$ 连续，在 $(-1,2)$ 可导，且 $\\Phi'=P'+2F'=-2f+2f=0$。由拉格朗日中值定理，存在 $\\xi$ 使 $\\Phi(2)-\\Phi(-1)=\\Phi'(\\xi)\\cdot3=0$。<\/p>\n<p><b>第 4 步：代入<\/b>。$P(2)+2F(2)=P(-1)+2F(-1)$。因 $F(-1)=0$，$F(2)=\\int_{-1}^2f$，得 $2\\int_{-1}^2f=P(-1)-P(2)$，即 <b>$\\int_{-1}^2f(t)\\,dt=\\frac{P(-1)-P(2)}2$<\/b>。∎<\/p>"}
);
LESSONS.t1.variants.push(
  {"id":"t1-oscillation","lv":"变种","src":"自编练习 · Peano 展开与二阶导存在性","stmt":"<p>设 $f(0)=0$，$x\\ne0$ 时 $f(x)=2x+x^2+x^4\\sin(1/x^2)$。写出二阶 Peano 展开，求 $f'(0)$，并用两列明确的点判断 $f''(0)$ 是否存在。</p>","hints":["先处理振荡项：$|x^4\\sin(1/x^2)|\\le x^4$，除以 $x^2$ 后 $\\le x^2\\to0$，所以它是 $o(x^2)$。这就得到二阶 Peano 展开。$f'(0)$ 用导数定义 $\\lim_{x\\to0}\\frac{f(x)-f(0)}{x}$ 求。","判断 $f''(0)$ 要用定义 $\\lim_{x\\to0}\\frac{f'(x)-f'(0)}{x}$。先在 $x\\ne0$ 处求 $f'(x)$：$\\big(x^4\\sin\\frac1{x^2}\\big)'=4x^3\\sin\\frac1{x^2}+x^4\\cos\\frac1{x^2}\\cdot\\big(-\\frac2{x^3}\\big)$。","得到 $\\frac{f'(x)-2}{x}=2+4x^2\\sin\\frac1{x^2}-2\\cos\\frac1{x^2}$。取两列点：$\\frac1{x^2}=2n\\pi$（$\\cos=1$）和 $\\frac1{x^2}=(2n+1)\\pi$（$\\cos=-1$），看差商的极限是否相同。"],"method":"m-which","sol":"<p><b>第 1 步（二阶展开）</b>：$|x^4\\sin(1/x^2)|\\le x^4$，所以 $\\Big|\\dfrac{x^4\\sin(1/x^2)}{x^2}\\Big|\\le x^2\\to0$，即 $x^4\\sin(1/x^2)=o(x^2)$。于是</p>$$f(x)=2x+x^2+o(x^2)\\quad(x\\to0).$$<p>（$x=0$ 时 $f(0)=0$ 也符合。）</p><p><b>第 2 步（求 $f'(0)$）</b>：由定义，</p>$$f'(0)=\\lim_{x\\to0}\\frac{f(x)-0}{x}=\\lim_{x\\to0}\\big(2+x+x^3\\sin(1/x^2)\\big)=2.$$<p><b>第 3 步（$x\\ne0$ 处的 $f'$）</b>：</p>$$f'(x)=2+2x+4x^3\\sin\\frac1{x^2}+x^4\\cos\\frac1{x^2}\\cdot\\Big(-\\frac{2}{x^3}\\Big)=2+2x+4x^3\\sin\\frac1{x^2}-2x\\cos\\frac1{x^2}.$$<p>所以 $f'$ 在 $0$ 附近处处存在，且</p>$$\\frac{f'(x)-f'(0)}{x}=2+4x^2\\sin\\frac1{x^2}-2\\cos\\frac1{x^2}.$$<p><b>第 4 步（两列点）</b>：</p><ul><li>$x_n=(2n\\pi)^{-1/2}\\to0$：$\\sin\\frac1{x_n^2}=0$，$\\cos\\frac1{x_n^2}=1$，差商 $=2+0-2=0$；</li><li>$y_n=((2n+1)\\pi)^{-1/2}\\to0$：$\\sin=0$，$\\cos=-1$，差商 $=2+0+2=4$。</li></ul><p>两列趋于 $0$ 的点给出不同的极限 $0$ 和 $4$，所以差商在 $x\\to0$ 时没有极限。</p><p><b>结论：$f(x)=2x+x^2+o(x^2)$，$f'(0)=2$，但 $f''(0)$ 不存在。</b>（注意：这里 $f'$ 在 $0$ 附近处处存在，失败的是二阶差商的极限；这再次说明“有二阶展开”推不出“$f''(0)$ 存在”。）</p>"}
);
LESSONS.t2.variants.push(
  {"id":"t2-quotient-drill","lv":"变种","src":"自编练习 · 商的延拓与求导","stmt":"<p>设 $g(x)=(\\sin x-x\\cos x)/x^3$（$x\\ne0$）。先求使 $g$ 连续的 $g(0)$，再用差商证明 $g'(0)$ 和 $g''(0)$ 存在并求值。若只知道分子是 $x^3/3+o(x^3)$，能完成哪一步？</p>","hints":["记分子 $N(x)=\\sin x-x\\cos x$。$g(0)$ 应取 $\\lim_{x\\to0}\\frac{N(x)}{x^3}$，所以 $N$ 至少要展开到 $x^3$。","求 $g'(0)$ 还要 $g(x)-g(0)$ 的下一项，所以 $N$ 要展开到 $x^5$：$\\sin x=x-\\frac{x^3}6+\\frac{x^5}{120}+o(x^5)$，$x\\cos x=x-\\frac{x^3}2+\\frac{x^5}{24}+o(x^5)$，相减得 $N(x)=\\frac{x^3}3-\\frac{x^5}{30}+o(x^5)$。","求 $g''(0)$：先对 $x\\ne0$ 用商的求导法则。$N'(x)=\\cos x-\\cos x+x\\sin x=x\\sin x$，所以 $g'(x)=\\frac{x^3\\cdot x\\sin x-3x^2N(x)}{x^6}=\\frac{x^2\\sin x-3N(x)}{x^4}$。再把分子展开到 $x^5$，算 $\\lim\\frac{g'(x)-g'(0)}{x}$。"],"method":"m-exist","sol":"<p><b>记号</b>：$N(x)=\\sin x-x\\cos x$，$g(x)=\\dfrac{N(x)}{x^3}$（$x\\ne0$）。</p><p><b>第 1 步（展开 $N$ 到五阶）</b>：$x\\to0$ 时</p>$$\\sin x=x-\\frac{x^3}6+\\frac{x^5}{120}+o(x^5),\\qquad x\\cos x=x-\\frac{x^3}2+\\frac{x^5}{24}+o(x^5).$$<p>相减：$x^3$ 系数 $-\\frac16+\\frac12=\\frac13$；$x^5$ 系数 $\\frac1{120}-\\frac1{24}=\\frac{1-5}{120}=-\\frac1{30}$。所以</p>$$N(x)=\\frac{x^3}3-\\frac{x^5}{30}+o(x^5).$$<p><b>第 2 步（$g(0)$）</b>：$g(x)=\\frac13-\\frac{x^2}{30}+o(x^2)\\to\\frac13$，所以取 <b>$g(0)=\\frac13$</b> 使 $g$ 连续。（这一步只需知道 $N=\\frac{x^3}3+o(x^3)$。）</p><p><b>第 3 步（$g'(0)$）</b>：由定义，</p>$$g'(0)=\\lim_{x\\to0}\\frac{g(x)-\\frac13}{x}=\\lim_{x\\to0}\\Big(-\\frac{x}{30}+o(x)\\Big)=0.$$<p>（这一步需要 $N$ 的五阶展开；只知道 $\\frac{x^3}3+o(x^3)$ 时，$\\frac{g(x)-g(0)}{x}=\\frac{o(1)}{x}$ 无法判断。）</p><p><b>第 4 步（$x\\ne0$ 处的 $g'$）</b>：$N'(x)=\\cos x-(\\cos x-x\\sin x)=x\\sin x$，由商的求导法则</p>$$g'(x)=\\frac{N'(x)x^3-3x^2N(x)}{x^6}=\\frac{x^2\\sin x-3N(x)}{x^4}.$$<p>展开分子：$x^2\\sin x=x^3-\\frac{x^5}6+o(x^5)$，$3N(x)=x^3-\\frac{x^5}{10}+o(x^5)$，相减得 $\\big(-\\frac16+\\frac1{10}\\big)x^5+o(x^5)=-\\frac{x^5}{15}+o(x^5)$。所以 $g'(x)=-\\frac{x}{15}+o(x)$。</p><p><b>第 5 步（$g''(0)$）</b>：</p>$$g''(0)=\\lim_{x\\to0}\\frac{g'(x)-g'(0)}{x}=\\lim_{x\\to0}\\Big(-\\frac1{15}+o(1)\\Big)=-\\frac1{15}.$$<p><b>结论：$g(0)=\\frac13$，$g'(0)=0$，$g''(0)=-\\frac1{15}$。只知道分子是 $\\frac{x^3}3+o(x^3)$ 时，只能完成第 2 步（求 $g(0)$）。</b></p><p class=\"small muted\">验算：由 $g(x)=\\frac13-\\frac{x^2}{30}+o(x^2)$ 读系数，$g''(0)=2\\cdot(-\\frac1{30})=-\\frac1{15}$，一致。这里先展开已求出的导数式再取极限，避免了对 Peano 余项直接求导。</p>"}

LESSONS.i4.sections.push(...[
  {
    "id": "i4-s4",
    "h": "单侧差商：区分跳跃、单点改值和端点",
    "html": "<p><b>这节解决什么</b>：当被积函数在某点不连续，或积分上、下限含有根号，怎样判断导数是否存在。</p>\n<p><b>单侧导数</b>把差商中的 $h$ 限制为只从左侧或只从右侧趋于 0。设 $F(x)=\\int_a^x f(t)\\,dt$，则 $\\frac{F(c+h)-F(c)}h$ 是 $c$ 与 $c+h$ 之间的平均值。$h\\lt0$ 时，积分和分母同时反号，仍然是同一段的平均值。单独改 $f(c)$ 不改变该积分。若该侧 $f(t)$ 趋于 $\\ell$，短区间平均值也趋于 $\\ell$：给定 $\\varepsilon\\gt0$，把该侧的 $f$ 夹在 $\\ell-\\varepsilon$ 与 $\\ell+\\varepsilon$ 之间，再积分除以长度。</p>\n<p><b>例子</b>：若 $f$ 在 $0$ 左右分别恒为 $2$ 和 $5$，则 $F$ 在 $0$ 的左、右导数分别为 $2$ 和 $5$，因此不可导。若左右都恒为 $2$，仅把 $f(0)$ 改为 $99$，$F'(0)$ 仍为 $2$。</p>\n<p>如果积分限本身在端点不可导，例如 $\\sqrt x$ 在 $0$，先在 $x\\gt0$ 用求导公式，再回到原定义求端点的右差商。比如 $\\int_0^{\\sqrt x}2\\,dt=2\\sqrt x$，在 $0$ 的右差商是 $2/\\sqrt x$，趋于 $+\\infty$，因此没有有限的右导数。</p>"
  },
  {
    "id": "i4-s5",
    "h": "从积分算斜率、短区间或增长率",
    "html": "<p><b>这节解决什么</b>：同样看到变限积分时，怎样根据所求的是斜率、短区间极限还是长区间增长率来决定第一步。</p>\n<ul><li><b>参数曲线</b>用同一个变量 $s$ 同时给出 $X(s)$ 和 $Y(s)$。若两者可微且 $X'(s_0)\\ne0$，在 $s_0$ 的斜率是 $Y'(s_0)/X'(s_0)$。例如 $X(s)=\\int_0^s2\\,du$、$Y(s)=\\int_0^s3u\\,du$，在 $s=2$ 的斜率为 $6/2=3$。</li>\n<li><b>短区间</b>：若两端同时趋于 $c$ 且 $f$ 在 $c$ 邻域连续，积分中值定理给出 $\\int_{u(x)}^{v(x)}f=f(\\xi_x)[v(x)-u(x)]$，其中 $\\xi_x$ 在两端之间。$f(\\xi_x)$ 趋于 $f(c)$；区间宽度保留 $v-u$ 的符号。比如 $\\int_h^{2h}3\\,dt=3h$，即使 $h\\lt0$ 也成立。</li>\n<li><b>长区间</b>：若分母趋于无穷，先证明分子也趋于无穷，再判断能否用洛必达。例如若 $f(t)\\ge 1/2$ 对 $t\\ge2$ 成立，则尾部积分至少有 $(x-2)/2$ 的增长量。</li></ul>"
  }
]);
LESSONS.i6.sections.push(...[
  {
    "id": "i6-s4",
    "h": "带权的积分中值：先问哪些位置更重要",
    "html": "<p><b>这节解决什么</b>：普通积分平均值把每段长度视为同样重要；带权时，非负函数 $g$ 决定各位置的影响大小。</p>\n<p>若 $f,g$ 黎曼可积、$m\\le f\\le M$ 且 $g\\ge0$，把不等式两边都乘 $g$ 再积分，得到</p>\n$$m\\int_a^b g\\le\\int_a^b fg\\le M\\int_a^b g.$$\n<p>当 $\\int_a^b g\\gt0$，中间除以 $\\int_a^b g$ 得到<b>加权平均值</b>，它介于 $m$ 与 $M$ 之间。若 $f$ 连续，取 $m,M$ 为 $f$ 的最小值与最大值，介值定理保证这个平均值等于某点的 $f(\\xi)$。若 $\\int_a^b g=0$，夹逼直接给出 $\\int_a^b fg=0$，这时无需除法。</p>\n<p><b>例子</b>：在 $[0,1]$ 上取 $f(t)=g(t)=t$。带权平均值为 $(1/3)/(1/2)=2/3$，因此可取 $\\xi=2/3$。普通平均值为 $1/2$，因为普通平均的权重恒为 $1$。</p>"
  }
]);

    "sol": "<p><b>这题在做什么</b>：原积分区间越来越长。先确定分子有足够的增长量，才能使用无穷比无穷型的洛必达法则。</p>\n<p>记 $N(x)=\\int_0^x t/(1+t)\\,dt$、$D(x)=\\sqrt{x^2+4}$。当 $x\\ge1$ 时，被积函数在 $[0,1]$ 非负，在 $[1,x]$ 至少为 $1/2$，所以 $N(x)\\ge (x-1)/2\\to+\\infty$。同时 $D(x)\\to+\\infty$。</p>\n<p>两个函数在 $x\\gt0$ 时可导，$D'(x)=x/\\sqrt{x^2+4}\\gt0$。由基本定理 $N'(x)=x/(1+x)$，故</p>\n$$\\frac{N'(x)}{D'(x)}=\\frac{\\sqrt{x^2+4}}{1+x}=\\frac{\\sqrt{1+4/x^2}}{1+1/x}\\longrightarrow1.$$\n<p>由洛必达法则，原极限为 $1$。</p>\n<p><b>易错</b>：积分上限趋于无穷时，仍要证明分子发散。积分区间越来越长本身不能保证这一点。</p>"
  }
]);

    "h": "同次分式与奇次幂：先把可化简的部分分出来",
    "html": "<p>遇到同次有理式，先用最高次项比出商，再把“分子减去商乘分母”作为余式。例：$(x^4+6x^2+7)/(x^4+5x^2+6)$ 的商是 $1$，余式是 $x^2+1$。分母为 $(x^2+2)(x^2+3)$。余式和分母都是偶函数，拆成两个常数分子即可：\n$$\\frac{x^2+1}{(x^2+2)(x^2+3)}=\\frac{-1}{x^2+2}+\\frac2{x^2+3}.$$\n用 $y=x^2$ 可以帮助分解分母；进入积分时仍是 $dx$。若真把 $x$ 换成 $y$，还要变换微分。</p>\n<p>遇到奇次幂 $x^{2k+1}dx$ 和一个只含 $x^2$ 的根式，先拆成 $(x^2)^k(x\\,dx)$。例如 $u=9-x^2$ 时，$x^3dx=(9-u)(-du/2)$。根号、幂和微分都改写完，才对 $u$ 积分。</p>\n<p>遇到 $g'(x)/g(x)$，原函数是 $\\ln|g(x)|$。先找 $g\\ne0$ 的区间，每个区间可有自己的积分常数。例如 $\\int dx/(x-3)=\\ln|x-3|+C$，在 $x\\lt3$ 时也成立。</p>"

    "id": "ip2-s6",
    "h": "二次根式：配方、拆分子与求导验算",
    "html": "<p>设 $t=x-b$，把根式化成 $R=\\sqrt{t^2+a^2}$（$a\\gt0$）。若分子是 $At+B$，拆成 $A(t/R)+B(1/R)$。第一项用 $R'=t/R$ 直接积。若同一个根号还在别处出现，并且能凑出 $t\\,dt$，也可直接设 $u=R$，用 $t\\,dt=u\\,du$。</p>\n<p>第二项的原函数可用 $\\ln|t+R|$。验算时先写出内层导数，分子通分后会出现与分母相同的因子：\n$$\\frac{d}{dt}\\ln|t+R|=\\frac{1+t/R}{t+R}=\\frac{(R+t)/R}{t+R}=\\frac1R.$$\n这里 $R\\gt|t|$，所以对数内 $t+R$ 始终为正。例：$\\int(t+2)/R\\,dt=R+2\\ln(t+R)+C$。</p>"
  }

const IN_CLAUDE = !!(window.claude && window.claude.use);
const LS_KEY = "gw1-progress-v1";
const RECORD_PREFIX = LS_KEY + ":";
let db = null;
const chains = Object.create(null);
const state = Object.create(null);
function readProgress(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value && typeof value === "object" && !Array.isArray(value) ? value : null;
  } catch (e) { return null; }
}
function progressTime(record) {
  const time = Number(record?.updatedAt);
  return Number.isFinite(time) ? time : 0;
}
function adoptProgress(id, record, preferStored = false) {
  if (!record || typeof record !== "object" || Array.isArray(record)) return;
  const old = state[id];
  const time = progressTime(record);
  if (!old || time > progressTime(old) || (preferStored && time === progressTime(old))) state[id] = record;
}
function readLocalRecord(id) {
  if (!IN_CLAUDE) adoptProgress(id, readProgress(RECORD_PREFIX + id), true);
}
function readLocalProgress() {
  for (const [id, record] of Object.entries(readProgress(LS_KEY) || {})) adoptProgress(id, record);
  if (IN_CLAUDE) return;
  // 原进度键作为兼容来源。每次只写自己的题，旧标签页不会盖掉其他题。
  try {
    for (const key of Object.keys(localStorage)) {
      if (key.startsWith(RECORD_PREFIX)) readLocalRecord(key.slice(RECORD_PREFIX.length));
    }
  } catch (e) {}
}
readLocalProgress();
function cacheLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function putRecord(id, record) {
  state[id] = record;
  if (!IN_CLAUDE) {
    try { localStorage.setItem(RECORD_PREFIX + id, JSON.stringify(record)); } catch (e) {}
  }
  if (db) {
    chains[id] = (chains[id] || Promise.resolve()).then(() => db.doc("progress/" + id).set(record)).catch(() => {});
  }
}
function save(id, patch) {
  readLocalRecord(id);
  const old = state[id];
  putRecord(id, { ...old, ...patch, updatedAt: Math.max(Date.now(), progressTime(old) + 1) });
  if (IN_CLAUDE) cacheLocal();
  if (!Object.hasOwn(patch, "answer")) refreshNavProgress();
}
function setSync(on, text) {
  const el = document.getElementById("sync");
  el.classList.toggle("on", on);
  el.querySelector("span").textContent = text;
}
(async () => {
  if (!window.claude || !window.claude.use) return;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) return;
  setSync(false, "正在连接云端…");
  const timer = setTimeout(() => setSync(false, "云端暂时连不上，先存在本浏览器"), 10000);
  db.collection("progress").onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync(true, "已同步到云端"); }
    for (const d of snap.docs) {
      const cur = state[d.id];
      const inc = d.data();
      if (!cur || (inc.updatedAt || 0) >= (cur.updatedAt || 0)) state[d.id] = JSON.parse(JSON.stringify(inc));
    }
    cacheLocal();
    refreshNavProgress();
    syncVisible();
  }, () => { clearTimeout(timer); db = null; setSync(false, "云端不可用，存在本浏览器"); });
})();

      <label for="mb">b = <b class="mono" id="mbv"></b> <input id="mb" type="range" min="-380" max="380" value="250"></label>

  </div>`;
