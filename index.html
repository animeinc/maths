      <p>分式极限 $\lim\frac{A(x)}{B(x)}$ 的关键是：分子、分母各自的<b>最低阶非零项</b>。先把容易的一边（通常是分母）化成 $c\,x^k$，那么另一边就展开到 $x^k$，余项留 $o(x^k)$，多展开是浪费，少展开会得到 $\frac{o(x)}{x^k}$ 这种无法判断的式子。</p>
      <p>复合函数的内层展开到几阶？看外层的最低阶：$e^{u}-1-u=\frac{u^2}{2}+o(u^2)$ 里外层从 $u^2$ 起，若 $u\sim\lambda x$，内层只要展开到一阶就够了。</p>
      <p class="callout">洛必达也能做这些题，但对 $\frac{\int_0^x\cdots}{\sin x-x}$ 这类要求导两三次的题，Taylor 更快也更不容易算错；而且 Taylor 能顺手给出“阶”，这正是反常积分判敛散需要的。</p>` }
  ],

  problems: [
    { id: "t2-p1", lv: "基础", src: "热身", stmt: R`求 $\displaystyle\lim_{x\to0}\frac{\tan x-\sin x}{x^3}$。`,
      hints: [R`分母已经是 $x^3$，分子展开到 $x^3$。`, R`$\tan x=x+\frac{x^3}{3}+o(x^3)$，$\sin x=x-\frac{x^3}{6}+o(x^3)$。`, R`分子 $=\left(\frac13+\frac16\right)x^3+o(x^3)$。`],
      method: "m-limit", sol: R`$$\tan x-\sin x=\Big(x+\frac{x^3}{3}\Big)-\Big(x-\frac{x^3}{6}\Big)+o(x^3)=\frac{x^3}{2}+o(x^3),$$ 所以极限为 $\frac12$。` },
    { id: "t2-p2", lv: "真题", src: "2023 秋期末 2(1)", stmt: R`计算 $\displaystyle\lim_{x\to0^+}\frac{\left(\int_0^x e^{-t^2}\,dt\right)-x}{\sin x-x}$。`,
      hints: [R`分母 $\sin x-x$ 是几阶？`, R`分母 $=-\frac{x^3}{6}+o(x^3)$，所以分子要展开到 $x^3$。先展开被积函数 $e^{-t^2}=1-t^2+o(t^2)$。`, R`把展开式逐项积分：$\int_0^x(1-t^2)\,dt=x-\frac{x^3}{3}$；还要说明 $\int_0^x o(t^2)\,dt=o(x^3)$。也可以直接用洛必达。`],
      method: "m-limit",
      sol: R`<p><b>方法一（Taylor）</b>：$e^{-t^2}=1-t^2+r(t)$，$r(t)=o(t^2)$。对任意 $\varepsilon>0$，$t$ 充分小时 $|r(t)|\le\varepsilon t^2$，于是 $\left|\int_0^x r(t)\,dt\right|\le\frac{\varepsilon x^3}{3}$，即 $\int_0^x r=o(x^3)$。故分子 $=-\frac{x^3}{3}+o(x^3)$，分母 $=-\frac{x^3}{6}+o(x^3)$，极限为 $2$。</p>
      <p><b>方法二（洛必达）</b>：分子分母在 $0$ 处都趋于 $0$，求导得 $\lim\frac{e^{-x^2}-1}{\cos x-1}=\lim\frac{-x^2}{-x^2/2}=2$。</p>` },
    { id: "t2-p3", lv: "真题", src: "2023 秋期末 2(2)", stmt: R`求 $f(x)=\ln(1+x)-\sin x$ 在 $x=0$ 处带 Peano 余项的 Taylor 公式，余项为 $o(x^3)$。`,
      hints: [R`两项分别展开到 $x^3$。`, R`$\ln(1+x)=x-\frac{x^2}{2}+\frac{x^3}{3}+o(x^3)$。`, R`$\sin x=x-\frac{x^3}{6}+o(x^3)$，相减。`],
      method: "m-limit", sol: R`$$f(x)=-\frac{x^2}{2}+\Big(\frac13+\frac16\Big)x^3+o(x^3)=-\frac{x^2}{2}+\frac{x^3}{2}+o(x^3).$$` },
    { id: "t2-p4", lv: "真题", src: "2025 秋期中 1(1)", stmt: R`计算 $\displaystyle\lim_{x\to0}\left(\frac{\ln(1+x)}{x}\right)^{\frac{1}{e^x-1}}$。`,
      hints: [R`$1^\infty$ 型：先取对数。`, R`$K=\lim\frac{\ln\left(\frac{\ln(1+x)}{x}\right)}{e^x-1}$，分母 $\sim x$，分子展开到一阶。`, R`$\frac{\ln(1+x)}{x}=1-\frac x2+o(x)$，再用 $\ln(1+u)=u+o(u)$。`],
      method: "m-limit", sol: R`<p>$\frac{\ln(1+x)}{x}=1-\frac x2+o(x)$，所以 $\ln\frac{\ln(1+x)}{x}=-\frac x2+o(x)$；又 $e^x-1=x+o(x)$，故 $K=-\frac12$。</p><p>由 $e^u$ 的连续性，原极限 $=e^{-1/2}$。</p>` },
    { id: "t2-p5", lv: "真题", src: "2026 秋期中 5(1)（本学期）", stmt: R`已知 $f(0)=0$，$f(1)=1$，$f'(0)=\lambda$，且 $f'$ 连续。求 $\displaystyle\lim_{x\to0^+}\frac{e^{f(x)}-1-f(x)}{e^x-1-x}$。`,
      hints: [R`分子分母结构一样：都是 $e^{u}-1-u$。`, R`$e^u-1-u=\frac{u^2}{2}+o(u^2)\ (u\to0)$。分子里 $u=f(x)\to0$。`, R`把分子、分母都除以 $x^2$：分子变成 $\left(\frac{f(x)}{x}\right)^2\cdot\big(\frac12+o(1)\big)$，而 $\frac{f(x)}{x}\to\lambda$。注意 $\lambda=0$ 时也要成立。`],
      method: "m-limit",
      sol: R`<p>记 $\varphi(u)=\frac{e^u-1-u}{u^2}\ (u\ne0)$，$\varphi(0)=\frac12$，则 $\varphi$ 在 $0$ 处连续，且 $e^u-1-u=u^2\varphi(u)$ 对所有 $u$ 成立（$u=0$ 时两边都是 $0$）。</p>
      <p>于是 $$\frac{e^{f(x)}-1-f(x)}{e^x-1-x}=\frac{f(x)^2\,\varphi(f(x))}{x^2\,\varphi(x)}=\Big(\frac{f(x)}{x}\Big)^2\frac{\varphi(f(x))}{\varphi(x)}.$$</p>
      <p>$f$ 可导 ⇒ $f(x)\to0$，$\frac{f(x)}{x}\to f'(0)=\lambda$；$\varphi$ 连续 ⇒ $\varphi(f(x))\to\frac12$。故极限 $=\lambda^2$。（这样写对 $\lambda=0$ 也成立，不需要分类。）</p>` },
    { id: "t2-p6", lv: "真题", src: "2025 秋期末 5(1)", stmt: R`设 $f:\mathbb R\to\mathbb R$ 处处有 3 阶导数，$f(0)=0$。求实数 $a$，使 $g(x)=\begin{cases}\frac{f(x)}{x},&x\ne0\\ a,&x=0\end{cases}$ 在 $\mathbb R$ 上连续，并求 $g''(0)$。`,
      hints: [R`连续性：$a=\lim_{x\to0}\frac{f(x)}{x}$，这是哪个导数的定义？`, R`$g'(0)$ 用定义：$\lim\frac{f(x)/x-f'(0)}{x}=\lim\frac{f(x)-f'(0)x}{x^2}$，用二阶 Peano 展开。$x\ne0$ 时 $g'(x)=\frac{xf'(x)-f(x)}{x^2}$。`, R`$g''(0)=\lim\frac{g'(x)-g'(0)}{x}=\lim\frac{xf'(x)-f(x)-\frac{f''(0)}2x^2}{x^3}$。把 $f$ 展开到 $x^3$、$f'$ 展开到 $x^2$。`],
      method: "m-exist",
      sol: R`<p>(1) $a=\lim_{x\to0}\frac{f(x)-f(0)}{x}=f'(0)$；$x\ne0$ 处 $g$ 显然连续。</p>
      <p>(2) Peano 展开：$f(x)=f'(0)x+\frac{f''(0)}2x^2+\frac{f'''(0)}6x^3+o(x^3)$；$f'$ 在 $0$ 处有 2 阶导数，故 $f'(x)=f'(0)+f''(0)x+\frac{f'''(0)}2x^2+o(x^2)$。</p>
      <p>$g'(0)=\lim\frac{f(x)-f'(0)x}{x^2}=\frac{f''(0)}2$。$x\ne0$ 时 $g'(x)=\frac{xf'(x)-f(x)}{x^2}$，而 $$xf'(x)-f(x)=\frac{f''(0)}2x^2+\Big(\frac12-\frac16\Big)f'''(0)x^3+o(x^3).$$</p>
      <p>所以 $g''(0)=\lim\frac{g'(x)-\frac{f''(0)}2}{x}=\lim\frac{\frac{f'''(0)}3x^3+o(x^3)}{x^3}=\frac{f'''(0)}3$。</p>
      <p class="small muted">验算：$g(x)=f'(0)+\frac{f''(0)}2x+\frac{f'''(0)}6x^2+o(x^2)$，读系数得 $2\cdot\frac{f'''(0)}6=\frac{f'''(0)}3$，一致。但这一步本身不能当证明，因为没先说明 $g''(0)$ 存在。</p>` }
  ],

t3: {
  unit: "taylor", n: 3, title: "Lagrange 余项：证明题与误差估计",
  goal: "学会“选展开点 → 代入已知点 → 相加或相减 → 介值定理或取最大值”这套证明模板，能独立写完期末第 5 题这一类。",
  sections: [
    { id: "t3-s1", h: R`1. $\xi$ 到底在哪里？`, html: R`
      <p>Lagrange 余项说：对固定的 $x$，存在 $\xi$ 介于 $x_0$ 和 $x$ 之间，使 $f(x)=T_n(x)+\frac{f^{(n+1)}(\xi)}{(n+1)!}(x-x_0)^{n+1}$。下面以 $f=e^x$、$x_0=0$ 为例，把这个 $\xi$ 真的算出来（$e^\xi=\frac{(n+1)!\,R_n(x)}{x^{n+1}}$）。</p>
      <p>拖动 $x$ 和 $n$：$\xi$ 一直落在 $0$ 与 $x$ 之间，并且随 $x$ 移动。还能看到一个有趣的事实：$x\to0$ 时比值 $\theta=\xi/x\to\frac1{n+2}$。</p>` },
    { id: "t3-s2", h: "2. 证明题的套路", html: R`
      <p>期末的 Taylor 证明题几乎都长这样：给你 $f$ 在几个点的值或导数，要你证“存在 $\xi$ 使 $|f''(\xi)|\ge$ 某个数”或“$f''(\xi)=$ 某个式子”。思路固定：</p>
      <ol>
        <li><b>选展开中心</b>：选导数信息最多的点（已知 $f'=0$ 的点、极值点、对称中心）。中心处的 $f'$ 已知，展开式里就少一个未知数。</li>
        <li><b>选代入点</b>：选函数值已知的点（端点、题目给的点），对每个点各写一个 Lagrange 展开，得到不同的 $\xi_1,\xi_2$。</li>
        <li><b>消元</b>：两式相加消掉 $f'$（对称点 $\pm a$），或相减消掉 $f$（同一个点从两边展开）。</li>
        <li><b>收尾</b>：要等式 → $f''$ 连续时用介值定理（$\frac{f''(\xi_1)+f''(\xi_2)}2$ 介于两者之间）；要不等式 → 取 $\max\{|f''(\xi_1)|,|f''(\xi_2)|\}$。</li>
      </ol>
      <p class="callout warn">常见扣分点：介值定理要在<b>自变量区间</b>上使用，不能在函数值区间上用。收尾时要说清楚：$f''$ 在 $[\xi_1,\xi_2]$ 上连续，而 $\frac{f''(\xi_1)+f''(\xi_2)}2$ 介于 $f''(\xi_1)$ 与 $f''(\xi_2)$ 之间，所以存在 $\xi\in[\xi_1,\xi_2]$。</p>` }
  ],
  widget: "lagrangeXi",
  concepts: [
    { id: "t3-c1", sec: "t3-s2", q: R`已知 $f(0)=0$，要证 $\exists\xi$ 使 $f''(\xi)=\frac{f(a)+f(-a)}{a^2}$。展开中心和代入点应选：`,
      opts: [R`中心 $a$，代入 $-a$`, R`中心 $0$，代入 $a$ 和 $-a$`, R`中心 $-a$，代入 $0$`, R`中心 $\frac a2$，代入 $0$`], a: 1,
      ex: R`$f(0)$ 已知，$\pm a$ 对称：两式相加正好消掉 $f'(0)$。` },
    { id: "t3-c2", sec: "t3-s2", q: R`得到 $f(a)+f(-a)=\frac{a^2}2\big(f''(\xi_1)+f''(\xi_2)\big)$ 后，要得到单个 $\xi$，还需要：`,
      opts: [R`什么都不需要`, R`$f''$ 连续，然后用介值定理`, R`$f'''$ 存在`, R`$\xi_1=\xi_2$`], a: 1,
      ex: R`导函数也有介值性（Darboux 定理），所以其实只要 $f''$ 存在就行；但考试里题目一般给“二阶导数连续”，直接用连续函数的介值定理最稳妥。` },
    { id: "t3-c3", sec: "t3-s1", q: R`用 $e=\sum_{k=0}^n\frac1{k!}+\frac{e^\theta}{(n+1)!}$（$0\lt\theta\lt1$）估计误差，为什么常用 $e^\theta\lt3$？`,
      opts: [R`因为 $e\lt3$ 且 $e^\theta\lt e$`, R`因为 $\theta\lt1$ 时 $e^\theta\lt1$`, R`因为 Lagrange 余项总小于 3`, R`为了凑整`], a: 0,
      ex: R`$0\lt\theta\lt1$，所以 $e^\theta\lt e\lt3$。估计时要用已知的上界，不能用正在估计的量 $e$ 的精确值。` }
  ],
  methods: [
    { id: "m-proof", title: "Lagrange 证明四步法", steps: [
      R`<b>选中心</b>：导数信息最多的点（$f'(x_0)=0$、极值点、对称中心）。`,
      R`<b>选代入点</b>：函数值已知的点，每个点写一个展开式，得到 $\xi_1,\xi_2$。`,
      R`<b>消元</b>：对称点相加消 $f'$，同一点两侧展开相减消 $f$。`,
      R`<b>收尾</b>：等式用介值定理（写明 $f''$ 连续及区间）；不等式取 $\max|f''(\xi_i)|$。`] },
    { id: "m-err", title: "误差估计", steps: [
      R`写出 $R_n=\frac{f^{(n+1)}(\xi)}{(n+1)!}x^{n+1}$，用已知量给 $|f^{(n+1)}|$ 一个上界 $M$。`,
      R`解不等式 $\frac{M|x|^{n+1}}{(n+1)!}\lt$ 允许误差，求最小的 $n$。`,
      R`不要用被估计的量本身做上界（如估计 $e$ 时用 $e^\theta\lt3$）。`] }

    { id: "t3-p1", lv: "基础", src: "作业 11/2", stmt: R`用 $e^x$ 在 $0$ 处的 Taylor 公式近似计算 $e$，使误差小于 $10^{-5}$。至少要取到哪一项？`,

      method: "m-err", sol: R`<p>误差 $=\frac{e^\theta}{(n+1)!}\lt\frac{3}{(n+1)!}$。要 $\frac3{(n+1)!}\lt10^{-5}$，即 $(n+1)!\gt3\times10^5$，最小取 $n+1=9$，$n=8$。</p><p>$\sum_{k=0}^{8}\frac1{k!}\approx2.7182788$，与 $e=2.7182818\ldots$ 相差约 $3\times10^{-6}$。</p>` },
    { id: "t3-p2", lv: "真题", src: "2023 秋期末 5(1)", stmt: R`设 $f$ 在 $[-a,a]$ 上有连续的二阶导数，$f(0)=0$。证明：存在 $\xi\in(-a,a)$，使 $f''(\xi)=\frac{f(a)+f(-a)}{a^2}$。`,

      method: "m-proof", sol: R`<p>在 $0$ 处带 Lagrange 余项展开：存在 $\xi_1\in(0,a)$，$\xi_2\in(-a,0)$，使 $$f(a)=f'(0)a+\frac{f''(\xi_1)}2a^2,\qquad f(-a)=-f'(0)a+\frac{f''(\xi_2)}2a^2.$$</p><p>相加：$\frac{f(a)+f(-a)}{a^2}=\frac{f''(\xi_1)+f''(\xi_2)}2$。</p><p>右边介于 $f''(\xi_2)$ 与 $f''(\xi_1)$ 之间，而 $f''$ 在闭区间 $[\xi_2,\xi_1]$ 上连续，由介值定理存在 $\xi\in[\xi_2,\xi_1]\subset(-a,a)$ 使 $f''(\xi)=\frac{f(a)+f(-a)}{a^2}$。</p>` },
    { id: "t3-p3", lv: "真题", src: "2023 秋期末 5(2)", stmt: R`设 $f$ 在 $[-a,a]$ 上有连续的二阶导数，且在 $(-a,a)$ 内有极值点。证明：存在 $\eta\in(-a,a)$，使 $|f''(\eta)|\ge\frac1{2a^2}|f(a)-f(-a)|$。`,
      hints: [R`极值点 $x_0$ 处 $f'(x_0)=0$（Fermat），所以中心选 $x_0$。`, R`分别代入 $a$ 和 $-a$，两式相减消掉 $f(x_0)$。`, R`$(a-x_0)^2+(a+x_0)^2=2a^2+2x_0^2\le4a^2$。`],
      method: "m-proof", sol: R`<p>设极值点为 $x_0\in(-a,a)$，由 Fermat 定理 $f'(x_0)=0$。在 $x_0$ 处展开：存在 $\eta_1,\eta_2\in(-a,a)$，$$f(a)=f(x_0)+\frac{f''(\eta_1)}2(a-x_0)^2,\quad f(-a)=f(x_0)+\frac{f''(\eta_2)}2(a+x_0)^2.$$</p><p>记 $M=\max\{|f''(\eta_1)|,|f''(\eta_2)|\}$，相减得 $$|f(a)-f(-a)|\le\frac M2\big[(a-x_0)^2+(a+x_0)^2\big]=\frac M2(2a^2+2x_0^2)\le2a^2M.$$</p><p>取 $\eta$ 为 $\eta_1,\eta_2$ 中使 $|f''|$ 较大的那个即可。</p>` },
    { id: "t3-p4", lv: "真题", src: "2025 秋期末 5(2)", stmt: R`设 $h:\mathbb R\to\mathbb R$ 处处有 2 阶导数，$h(0)=h'(0)=h'(1)=0$，$h(1)=1$。证明：存在 $\xi\in[0,1]$，使 $|h''(\xi)|\ge4$。`,
      hints: [R`$0$ 和 $1$ 两点的导数都已知，分别以它们为中心。`, R`代入哪个点？选两边“一样远”的中点 $\frac12$。`, R`$h(\frac12)=\frac{h''(\xi_1)}8$，$h(\frac12)=1+\frac{h''(\xi_2)}8$，相减。`],
      method: "m-proof", sol: R`<p>分别在 $0$ 和 $1$ 处展开并代入 $x=\frac12$：存在 $\xi_1\in(0,\frac12)$，$\xi_2\in(\frac12,1)$，$$h\Big(\frac12\Big)=h(0)+h'(0)\cdot\frac12+\frac{h''(\xi_1)}2\cdot\frac14=\frac{h''(\xi_1)}8,$$ $$h\Big(\frac12\Big)=h(1)-h'(1)\cdot\frac12+\frac{h''(\xi_2)}2\cdot\frac14=1+\frac{h''(\xi_2)}8.$$</p><p>相减：$h''(\xi_1)-h''(\xi_2)=8$，所以 $|h''(\xi_1)|+|h''(\xi_2)|\ge8$，二者中至少一个 $\ge4$。</p><p class="small muted">注意这里只要求 $h''$ 存在，不需要连续：不等式结论不用介值定理。</p>` },
    { id: "t3-p5", lv: "真题", src: "2021 秋期末 7(2)", stmt: R`设 $f$ 是 $\mathbb R$ 上的 $C^2$ 函数，$f(x)\ge0$，$f(0)=f'(0)=0$。给定 $h\gt0$，令 $M=\max_{x\in[-2h,2h]}|f''(x)|$。证明：对 $x\in[-h,h]$，有 $f'(x)^2\le2Mf(x)$。`,
      hints: [R`对固定的 $x\in[-h,h]$ 和 $|t|\le h$，在 $x$ 处展开到 $x+t$：$0\le f(x+t)\le f(x)+f'(x)t+\frac M2t^2$。`, R`右边是 $t$ 的二次函数，对 $|t|\le h$ 都非负。想取 $t=-\frac{f'(x)}M$ 让它最小，但要保证 $|t|\le h$。`, R`用 $f'(0)=0$：$|f'(x)|=|f'(x)-f'(0)|\le M|x|\le Mh$，所以 $\big|\frac{f'(x)}M\big|\le h$。别忘了 $M=0$ 的情形。`],
      method: "m-proof", sol: R`<p>固定 $x\in[-h,h]$。若 $M=0$，则 $f''\equiv0$ 于 $[-2h,2h]$，$f'(x)=f'(0)=0$，结论成立。下设 $M\gt0$。</p><p>对 $|t|\le h$ 有 $x+t\in[-2h,2h]$，由 Lagrange 余项与 $f\ge0$：$$0\le f(x+t)=f(x)+f'(x)t+\frac{f''(\xi)}2t^2\le f(x)+f'(x)t+\frac M2t^2.$$</p><p>由中值定理 $|f'(x)|=|f'(x)-f'(0)|\le M|x|\le Mh$，故 $t_0=-\frac{f'(x)}M$ 满足 $|t_0|\le h$。代入得 $0\le f(x)-\frac{f'(x)^2}{2M}$，即 $f'(x)^2\le2Mf(x)$。</p>` }

    { id: "t3-v2", lv: "变种", src: "仿 2025 期末 5(2)", stmt: R`设 $f$ 在 $[0,1]$ 上二阶可导，$f(0)=f(1)=0$，$\min_{[0,1]}f=-1$。证明：存在 $\xi\in(0,1)$，使 $f''(\xi)\ge8$。`,

  extensions: [
    { id: "t3-e1", lv: "延伸", src: "2021 秋期末 7(1)", stmt: R`设 $f$ 是 $\mathbb R$ 上的 $C^2$ 函数，$f\ge0$。在哪些点 $x_0$ 处 $\sqrt{f(x)}$ 可导？`,

m1: {
  unit: "mvt", n: 1, title: "构造辅助函数：Rolle、Lagrange、Cauchy",
  goal: "看到“存在 $\\xi$ 使某个含 $f,f'$ 的式子成立”，能倒推出该对哪个辅助函数用 Rolle；分清三个中值定理各自管什么。",
  sections: [
    { id: "m1-s1", h: "1. 三个定理其实是一个", html: R`
      <p>三个定理的条件都是“$[a,b]$ 上连续，$(a,b)$ 内可导”，结论里的 $\xi$ 都在<b>开区间</b> $(a,b)$ 里。</p>
      <ul>
        <li><b>Rolle</b>：$f(a)=f(b)$ ⇒ $\exists\xi$，$f'(\xi)=0$。几何上是“有一处切线水平”。</li>
        <li><b>Lagrange</b>：$f'(\xi)=\frac{f(b)-f(a)}{b-a}$。证明就是对 $F(x)=f(x)-\frac{f(b)-f(a)}{b-a}(x-a)$ 用 Rolle，也就是把弦“扳平”。</li>
        <li><b>Cauchy</b>：$\frac{f'(\xi)}{g'(\xi)}=\frac{f(b)-f(a)}{g(b)-g(a)}$（$g'\ne0$）。对 $F=f-kg$ 用 Rolle，$k$ 取弦的斜率。几何上是参数曲线 $(g(t),f(t))$ 有一处切线平行于弦（讲义第 7 周例 8）。</li>
      </ul>
      <p>下图拖动 $a,b$（或直接在图上左右拖），看满足 $f'(\xi)=\frac{f(b)-f(a)}{b-a}$ 的点：可能不止一个，定理只保证至少有一个。</p>` },
    { id: "m1-s2", h: "2. 反推辅助函数：把结论“积回去”", html: R`
      <p>证明题最难的一步是想到对谁用 Rolle。方法：把结论里的 $\xi$ 换成 $x$，看左边是哪个函数的导数（或差一个非零因子）。</p>
      <div class="table-wrap"><table class="pattern"><thead><tr><th>要证 $\exists\xi$ 使……$=0$</th><th>辅助函数 $F(x)$</th><th>因为 $F'(x)=$</th></tr></thead><tbody>
        <tr><td>$f'(\xi)+\lambda f(\xi)$</td><td>$e^{\lambda x}f(x)$</td><td>$e^{\lambda x}\big(f'+\lambda f\big)$</td></tr>
        <tr><td>$f'(\xi)+g'(\xi)f(\xi)$</td><td>$e^{g(x)}f(x)$</td><td>$e^{g}\big(f'+g'f\big)$</td></tr>
        <tr><td>$\xi f'(\xi)+kf(\xi)$</td><td>$x^kf(x)$</td><td>$x^{k-1}\big(xf'+kf\big)$</td></tr>
        <tr><td>$\xi f'(\xi)-f(\xi)$</td><td>$\frac{f(x)}{x}$</td><td>$\frac{xf'-f}{x^2}$</td></tr>
        <tr><td>$f'(\xi)g(\xi)+f(\xi)g'(\xi)$</td><td>$f(x)g(x)$</td><td>$f'g+fg'$</td></tr>
        <tr><td>$f'(\xi)-c$（常数）</td><td>$f(x)-cx$</td><td>$f'-c$</td></tr>
      </tbody></table></div>
      <p>找到 $F$ 后还要检查 $F(a)=F(b)$，这一步通常正好用上题目给的条件。如果结论是“比值等于弦的斜率”，就直接用 Lagrange 或 Cauchy，并把要比较的两个函数选对。2022 秋期中那题选的是 $\frac{f(x)}x$ 和 $\frac1x$。</p>` }
  ],
  widget: "mvtPlot",
  concepts: [
    { id: "m1-c1", sec: "m1-s1", q: R`Rolle 定理的条件里，下面哪一条<b>不需要</b>？`,
      opts: [R`$f$ 在 $[a,b]$ 上连续`, R`$f$ 在 $(a,b)$ 内可导`, R`$f(a)=f(b)$`, R`$f'$ 在 $(a,b)$ 内连续`], a: 3,
      ex: R`只要求可导，不要求导函数连续。反过来，前三条缺一不可：$|x|$ 在 $[-1,1]$ 上缺“可导”，结论就不成立。` },
    { id: "m1-c2", sec: "m1-s2", q: R`要证 $\exists\xi$ 使 $f'(\xi)+2f(\xi)=0$，应对哪个函数用 Rolle？`,
      opts: [R`$e^{2x}f(x)$`, R`$e^{-2x}f(x)$`, R`$x^2f(x)$`, R`$f(x)^2$`], a: 0,

    { id: "m1-c4", sec: "m1-s1", q: R`为什么 Cauchy 中值定理不能“对 $f$、$g$ 分别用 Lagrange 再相除”来证明？`,
      opts: [R`因为 $g$ 可能不可导`, R`因为两次得到的 $\xi$ 一般不是同一个点`, R`因为 Lagrange 只对多项式成立`, R`其实可以`], a: 1,

      ex: R`$f$ 在 $0$ 处不可导，条件不满足；而 $f'(x)\in\{-1,1\}$，取不到 $\frac{2-1}{3}=\frac13$。` }
  ],
  methods: [
    { id: "m-aux", title: "反推辅助函数", steps: [
      R`把结论里的 $\xi$ 换成 $x$，得到要证为零的式子 $E(x)$。`,
      R`认形：$f'+\lambda f\to e^{\lambda x}f$；$f'+g'f\to e^{g}f$；$xf'+kf\to x^kf$；$xf'-f\to\frac fx$；$f'g+fg'\to fg$。`,

  problems: [
    { id: "m1-p1", lv: "基础", src: "讲义第 7 周例 5", stmt: R`设 $\lambda$ 为实数，$f\in C[a,b]$，$f(a)=f(b)=0$，$f$ 在 $(a,b)$ 内可导。证明：$\exists\xi\in(a,b)$，使 $\lambda f(\xi)+f'(\xi)=0$。`,
      hints: [R`$f'+\lambda f$ 是哪个函数的导数除以一个非零因子？`, R`$F(x)=e^{\lambda x}f(x)$，$F'(x)=e^{\lambda x}\big(f'(x)+\lambda f(x)\big)$。`, R`$F(a)=F(b)=0$，对 $F$ 用 Rolle。`],
      method: "m-aux", sol: R`<p>令 $F(x)=e^{\lambda x}f(x)$，则 $F\in C[a,b]$，在 $(a,b)$ 内可导，$F(a)=F(b)=0$。由 Rolle 定理，$\exists\xi\in(a,b)$ 使 $F'(\xi)=e^{\lambda\xi}\big(f'(\xi)+\lambda f(\xi)\big)=0$。因 $e^{\lambda\xi}\ne0$，得 $\lambda f(\xi)+f'(\xi)=0$。</p>` },
    { id: "m1-p2", lv: "真题", src: "2022 秋期中 证明题 2", stmt: R`设 $f$ 在 $[a,b]$ 上连续（$ab\gt0$），在 $(a,b)$ 内可导。证明：存在 $\xi\in(a,b)$，使 $\dfrac{af(b)-bf(a)}{b-a}=\xi f'(\xi)-f(\xi)$。`,
      hints: [R`右边 $xf'-f$ 让人想到 $\big(\frac fx\big)'=\frac{xf'-f}{x^2}$，但多了一个 $x^2$。`, R`再找一个函数，它的导数是 $-\frac1{x^2}$：就是 $\frac1x$。对 $\frac{f(x)}x$ 和 $\frac1x$ 用 Cauchy。`, R`$ab\gt0$ 保证 $0\notin[a,b]$，两个函数都在 $[a,b]$ 上有定义且可导，$\big(\frac1x\big)'\ne0$。`],
      method: "m-aux", sol: R`<p>令 $F(x)=\frac{f(x)}x$，$G(x)=\frac1x$。由 $ab\gt0$，$0\notin[a,b]$，$F,G$ 在 $[a,b]$ 上连续、$(a,b)$ 内可导，且 $G'(x)=-\frac1{x^2}\ne0$。由 Cauchy 中值定理，$\exists\xi\in(a,b)$：</p>
      $$\frac{\frac{f(b)}b-\frac{f(a)}a}{\frac1b-\frac1a}=\frac{\frac{\xi f'(\xi)-f(\xi)}{\xi^2}}{-\frac1{\xi^2}}=f(\xi)-\xi f'(\xi).$$
      <p>左边分子分母同乘 $ab$：$\frac{af(b)-bf(a)}{a-b}$。所以 $\frac{af(b)-bf(a)}{b-a}=\xi f'(\xi)-f(\xi)$。</p>` },
    { id: "m1-p3", lv: "真题", src: "2023 秋期末 4", stmt: R`设 $f$ 在 $[a,b]$ 上连续，在 $(a,b)$ 内处处可导，$f(b)\gt f(a)$，记 $c=\frac{f(b)-f(a)}{b-a}$。证明下面两个断言必有一个成立：(1) 对任何 $x\in[a,b]$，$f(x)-f(a)=c(x-a)$；(2) 存在 $\xi\in(a,b)$，使 $f'(\xi)\gt c$。`,
      hints: [R`把弦减掉：$g(x)=f(x)-f(a)-c(x-a)$，$g(a)=g(b)=0$。(1) 就是 $g\equiv0$。`, R`若 $g\not\equiv0$，有某点 $x_0$ 使 $g(x_0)\ne0$。分 $g(x_0)\gt0$ 和 $g(x_0)\lt0$ 两种情况。`, R`$g(x_0)\gt0$：在 $[a,x_0]$ 上对 $g$ 用 Lagrange；$g(x_0)\lt0$：在 $[x_0,b]$ 上用。两种情况都得到 $g'(\xi)\gt0$。`],
      method: "m-aux", sol: R`<p>令 $g(x)=f(x)-f(a)-c(x-a)$，则 $g$ 在 $[a,b]$ 上连续、$(a,b)$ 内可导，$g(a)=g(b)=0$，$g'(x)=f'(x)-c$。</p>

      <p>设 $c$ 是 $f''$ 唯一的零点，$f'''(c)\ne0$。$f''$ 连续且只在 $c$ 处为零，所以在 $(-\infty,c)$、$(c,\infty)$ 上各自不变号；又 $f'''(c)\ne0$，$f''$ 在 $c$ 两侧异号。必要时把 $f$ 换成 $-f$（不改变 (a)(b)(c)），不妨设 $f''\lt0$ 于 $(-\infty,c)$，$f''\gt0$ 于 $(c,\infty)$：$f'$ 在 $(-\infty,c]$ 严格减，在 $[c,\infty)$ 严格增。</p>
      <p>每一侧 $f'$ 至多一个零点，而 $f'$ 恰有两个零点，所以 $b_1\lt c\lt b_2$，且 $f'(c)\lt f'(b_2)=0$。于是 $f'\gt0$ 于 $(-\infty,b_1)$，$f'\lt0$ 于 $(b_1,b_2)$，$f'\gt0$ 于 $(b_2,\infty)$：$f$ 依次严格增、减、增。</p>
      <p><b>尾部</b>：$x\le b_1-1$ 时 $f'(x)\ge\delta:=f'(b_1-1)\gt0$，故 $f(x)\le f(b_1-1)-\delta(b_1-1-x)\to-\infty$；同理 $x\to+\infty$ 时 $f\to+\infty$。</p>
      <p><b>数零点</b>（每个单调段至多一个）：若 $f(b_1)\gt0$ 且 $f(b_2)\lt0$，三段各有一个零点，共 3 个；若 $f(b_1)\lt0$，则 $f(b_2)\lt f(b_1)\lt0$，只在 $(b_2,\infty)$ 有 1 个；若 $f(b_2)\gt0$，只在 $(-\infty,b_1)$ 有 1 个；若 $f(b_1)=0$ 或 $f(b_2)=0$，该零点处 $f'=0$，不是简单零点。都不可能恰有 2 个简单零点，所以这样的 $f$ 不存在。</p>` }

  sections: [
    { id: "c1-s1", h: "1. 下凸的定义与斜率不等式", html: R`
      <p>本课程说的<b>下凸</b>（convex）是指图像上任意两点连成的弦都在图像上方：对任何 $x,y$ 和 $t\in[0,1]$，</p>
      $$f\big(tx+(1-t)y\big)\le tf(x)+(1-t)f(y).$$
      <p>考试里更好用的是等价的<b>斜率不等式</b>：任取 $x_1\lt x_2\lt x_3$，记 $k_{ij}=\frac{f(x_j)-f(x_i)}{x_j-x_i}$，则</p>
      $$k_{12}\le k_{13}\le k_{23}.$$
      <p>记法：三点从左到右，“左弦 ≤ 长弦 ≤ 右弦”。下面的图里拖动三个点，可以看到三点都在同一下凸区间内时，这个不等式总成立；跨过拐点后不再保证成立，但某些三点仍可能恰好满足。</p>
      <p>由斜率不等式直接推出的几个结论（证明题常用）：</p>
      <ul>
        <li>固定一个端点，弦斜率随另一端点<b>单调递增</b>：$x\mapsto\frac{f(x)-f(a)}{x-a}$ 在 $x\gt a$、$x\lt a$ 上都递增。</li>
        <li>可导时 $f'$ 单调递增；<b>切线在图像下方</b>：$f(x)\ge f(a)+f'(a)(x-a)$。</li>
        <li>开区间上的下凸函数连续，且处处有单侧导数 $f'_-(x)\le f'_+(x)$（见延伸题）。</li>
      </ul>` },
    { id: "c1-s2", h: "2. 二阶导判别与拐点", html: R`
      <ul>
        <li><b>判别</b>：$f$ 在区间 $I$ 上二阶可导，则 $f$ 在 $I$ 上下凸 $\Leftrightarrow$ $f''\ge0$ 于 $I$。若 $f''\gt0$，则严格下凸（弦严格在上，切线不等式在 $x\ne a$ 时取严格号）。</li>
        <li><b>拐点</b>：凹凸性在 $x_0$ 两侧改变的点 $(x_0,f(x_0))$。</li>
        <li><b>必要条件</b>：$x_0$ 是拐点且 $f''(x_0)$ 存在 ⇒ $f''(x_0)=0$。但反过来不对：$x^4$ 在 $0$ 处 $f''=0$，两侧都下凸，不是拐点。</li>
        <li><b>充分条件</b>：$f''$ 在 $x_0$ 两侧异号；或 $f''(x_0)=0$ 且 $f'''(x_0)\ne0$。</li>
        <li>$f''$ 不存在的点也可能是拐点，例如 $x^{1/3}$ 在 $0$ 处。求拐点要把 $f''=0$ 的点和 $f''$ 不存在的点都列出来，再逐个看两侧符号。</li>
      </ul>
      <p><b>求凹凸区间的格式</b>：算 $f''$ → 化成因式乘积 → 列符号表 → 写“在……上下凸，在……上上凸，拐点为……”。题目问“最大区间”时端点要包含进去（闭区间）。</p>` },
    { id: "c1-s3", h: "3. 常考的三类证明", html: R`
      <ul>
        <li><b>局部即全局</b>（2021 期末 4）：下凸函数的极小值点就是最小值点；可导时驻点就是最小值点。工具是斜率不等式，或切线不等式。</li>
        <li><b>切线不等式</b>（2025 期中 5）：$f''\gt0$ ⇒ $f(x)\gt f(a)+f'(a)(x-a)$。用带 Lagrange 余项的一阶 Taylor 公式一行证完，再用它控制 $f$ 在无穷远处的行为。</li>
        <li><b>和积分平均比较</b>（2023 期末 7）：$f''\ge0$ ⇔ 对任何 $a\lt b$，$f\big(\frac{a+b}2\big)\le\frac1{b-a}\int_a^bf$。必要性：在中点处的切线下方积分；充分性：反证，在 $f''\lt0$ 的小区间上用 Taylor 公式得到反向严格不等式。</li>
        <li><b>Jensen 证不等式</b>：要证的不等式能写成 $f\big(\frac{x+y}2\big)\le\frac{f(x)+f(y)}2$，就找出 $f$ 并验证 $f''\ge0$。</li>
      </ul>` }

      hints: [R`(1) 反证：若某个 $x_1$ 使 $f(x_1)\lt f(x_0)$，在 $x_0$ 和 $x_1$ 之间、离 $x_0$ 很近的地方取一点 $x_2$，用斜率不等式。`, R`(2) 对 $x\gt a$，取 $a\lt t\lt x$，有 $\frac{f(t)-f(a)}{t-a}\le\frac{f(x)-f(a)}{x-a}$，令 $t\to a^+$。$x\lt a$ 时类似。`, R`(3) 存在：对 $f'$ 用 Lagrange，$f'(x)\ge f'(0)+mx$（$x\gt0$），$f'(x)\le f'(0)+mx$（$x\lt0$），再用介值定理找 $f'$ 的零点。唯一：$f'$ 严格递增，加 Fermat 引理。`],
      method: "m-slope", sol: R`<p><b>(1)</b> 设 $|x-x_0|\lt\delta$ 时 $f(x)\ge f(x_0)$。反设存在 $x_1$ 使 $f(x_1)\lt f(x_0)$。</p>

      method: "m-tangent", sol: R`<p><b>(1)</b> 由 Taylor 公式，存在 $\xi$ 介于 $a,x$ 之间，$f(x)=f(a)+f'(a)(x-a)+\frac{f''(\xi)}2(x-a)^2$。因 $f''(\xi)\gt0$ 且 $x\ne a$，最后一项为正。</p>

    { id: "c1-p4", lv: "真题", src: "2023 秋期末 7", stmt: R`设 $f$ 在 $(-\infty,+\infty)$ 上有连续的二阶导数。证明：$f''(x)$ 处处非负的充分必要条件是，对任何 $a\lt b$ 有 $$f\Big(\frac{a+b}2\Big)\le\frac1{b-a}\int_a^bf(x)\,dx.$$`,
      hints: [R`必要性：记 $m=\frac{a+b}2$，用切线不等式 $f(x)\ge f(m)+f'(m)(x-m)$。`, R`对切线不等式在 $[a,b]$ 上积分，注意 $\int_a^b(x-m)\,dx=0$。`, R`充分性反证：若 $f''(x_0)\lt0$，由连续性取 $h$ 使 $f''\lt0$ 于 $[x_0-h,x_0+h]$，在 $x_0$ 处 Taylor 展开得 $f(x)\lt f(x_0)+f'(x_0)(x-x_0)$（$x\ne x_0$），积分得反向的严格不等式。`],
      method: "m-tangent", sol: R`<p><b>必要性</b>：设 $f''\ge0$，任取 $a\lt b$，记 $m=\frac{a+b}2$。由 Taylor 公式，$f(x)=f(m)+f'(m)(x-m)+\frac{f''(\xi)}2(x-m)^2\ge f(m)+f'(m)(x-m)$。在 $[a,b]$ 上积分：</p>

      method: "m-slope", sol: R`<p>任取 $0\lt x\lt y$。对任意 $t\in(0,x)$，三点 $t\lt x\lt y$ 满足斜率不等式 $k_{12}\le k_{13}$：</p>
      $$\frac{f(x)-f(t)}{x-t}\le\frac{f(y)-f(t)}{y-t}.$$
      <p>令 $t\to0^+$，由 $f(t)\to0$，得 $\frac{f(x)}x\le\frac{f(y)}y$。所以 $\frac{f(x)}x$ 单调递增。</p>` },
    { id: "c1-v3", lv: "变种", src: "Jensen 型", stmt: R`证明：对任意 $x,y\gt0$，有 $x\ln x+y\ln y\ge(x+y)\ln\dfrac{x+y}2$。`,
      hints: [R`两边除以 2，右边是 $\frac{x+y}2\ln\frac{x+y}2$。`, R`令 $f(t)=t\ln t$，要证 $f\big(\frac{x+y}2\big)\le\frac{f(x)+f(y)}2$。`, R`$f''(t)=\frac1t\gt0$。`],
      method: "m-tangent", sol: R`<p>令 $f(t)=t\ln t$（$t\gt0$），$f'(t)=\ln t+1$，$f''(t)=\frac1t\gt0$，$f$ 在 $(0,+\infty)$ 上下凸。由定义（取 $t=\frac12$）：</p>
      $$\frac{x+y}2\ln\frac{x+y}2=f\Big(\frac{x+y}2\Big)\le\frac{f(x)+f(y)}2=\frac{x\ln x+y\ln y}2.$$
      <p>两边乘 2 即得。等号当且仅当 $x=y$。</p>` }
  ],
  extensions: [
    { id: "c1-e1", lv: "延伸", src: "经典结论", stmt: R`设 $f$ 是 $\mathbb R$ 上的下凸函数，且有上界。证明：$f$ 是常数。`,
      hints: [R`反设 $f(x_1)\ne f(x_2)$，$x_1\lt x_2$，记 $k=\frac{f(x_2)-f(x_1)}{x_2-x_1}\ne0$。`, R`若 $k\gt0$：对 $x\gt x_2$，三点 $x_1\lt x_2\lt x$ 用 $k_{12}\le k_{23}$，得 $f(x)\ge f(x_2)+k(x-x_2)$。`, R`若 $k\lt0$：对 $x\lt x_1$，三点 $x\lt x_1\lt x_2$ 用 $k_{12}\le k_{23}$，得 $f(x)\ge f(x_1)+|k|(x_1-x)$。两种情况都无上界。`],
      method: "m-slope", sol: R`<p>反设存在 $x_1\lt x_2$ 使 $f(x_1)\ne f(x_2)$，记 $k=\frac{f(x_2)-f(x_1)}{x_2-x_1}$。</p>
      <p>若 $k\gt0$：对 $x\gt x_2$，三点 $x_1\lt x_2\lt x$ 满足 $k\le\frac{f(x)-f(x_2)}{x-x_2}$，所以 $f(x)\ge f(x_2)+k(x-x_2)\to+\infty$（$x\to+\infty$）。</p>
      <p>若 $k\lt0$：对 $x\lt x_1$，三点 $x\lt x_1\lt x_2$ 满足 $\frac{f(x_1)-f(x)}{x_1-x}\le k$，所以 $f(x)\ge f(x_1)-k(x_1-x)\to+\infty$（$x\to-\infty$）。</p>
      <p>两种情况都与有上界矛盾，所以 $f$ 是常数。</p>` },
    { id: "c1-e2", lv: "延伸", src: "经典结论", stmt: R`设 $f$ 在开区间 $(a,b)$ 上下凸。证明：$f$ 在 $(a,b)$ 上连续。`,
      hints: [R`固定 $x_0\in(a,b)$，取 $a\lt u\lt x_0\lt v\lt b$。想证明 $x$ 靠近 $x_0$ 时 $\big|\frac{f(x)-f(x_0)}{x-x_0}\big|$ 有界。`, R`$x_0\lt x\lt v$ 时，三点 $u\lt x_0\lt x$ 和 $x_0\lt x\lt v$ 给出 $k(u,x_0)\le k(x_0,x)\le k(x_0,v)$。`, R`$u\lt x\lt x_0$ 时，三点 $u\lt x\lt x_0$ 和 $x\lt x_0\lt v$ 给出 $k(u,x_0)\le k(x,x_0)\le k(x_0,v)$。于是 $|f(x)-f(x_0)|\le M|x-x_0|$。`],
      method: "m-slope", sol: R`<p>固定 $x_0\in(a,b)$，取 $u,v$ 使 $a\lt u\lt x_0\lt v\lt b$。记 $k(p,q)=\frac{f(q)-f(p)}{q-p}$。</p>
      <p>当 $x_0\lt x\lt v$：三点 $u\lt x_0\lt x$ 给出 $k(u,x_0)\le k(x_0,x)$（$k_{12}\le k_{23}$）；三点 $x_0\lt x\lt v$ 给出 $k(x_0,x)\le k(x_0,v)$（$k_{12}\le k_{13}$）。</p>
      <p>当 $u\lt x\lt x_0$：三点 $u\lt x\lt x_0$ 给出 $k(u,x_0)\le k(x,x_0)$（$k_{13}\le k_{23}$）；三点 $x\lt x_0\lt v$ 给出 $k(x,x_0)\le k(x_0,v)$（$k_{12}\le k_{23}$）。</p>
      <p>记 $M=\max\{|k(u,x_0)|,|k(x_0,v)|\}$，则对 $x\in(u,v)$ 有 $|f(x)-f(x_0)|\le M|x-x_0|$，所以 $f$ 在 $x_0$ 处连续。</p>
      <p class="small muted">同样的夹逼说明 $k(x_0,x)$ 在 $x\to x_0^\pm$ 时单调有界，所以单侧导数存在，且 $f'_-(x_0)\le f'_+(x_0)$。闭区间端点处结论不成立：例如 $[0,1]$ 上 $f(0)=1$、其余 $f=0$ 是下凸的。</p>` }
  ]

i1: {
  unit: "int", n: 1, title: "定积分：换元与分部",
  goal: "会在换元时同步更换微分与上下限，会选择分部积分的 u、dv；掌握半角代换，并能写出换元公式的证明。30 分钟先完成概念题和三道核心题，延伸选做。",
  sections: [
    { id: "i1-s1", h: "1. 换元是在同时换变量、微分与端点", html: R`
      <p>先记<b>牛顿–莱布尼兹公式</b>：$f$ 在 $[a,b]$ 连续，$F'=f$，则 $\int_a^bf(x)\,dx=F(b)-F(a)$。定积分的答案是数，<b>不写 $+C$</b>。$\int_b^af=-\int_a^bf$，端点可以反向。</p>
      <p><b>第一类换元</b>：$f$ 在区间 $I$ 连续，$\varphi\in C^1([\alpha,\beta])$ 且取值在 $I$，则</p>
      $$\int_\alpha^\beta f(\varphi(t))\varphi'(t)\,dt
      =\int_{\varphi(\alpha)}^{\varphi(\beta)}f(u)\,du.$$
      <p>证明的核心是 $(F\circ\varphi)'=f(\varphi)\varphi'$，再两边代端点；这个公式<b>不要求 $\varphi$ 单调</b>。但把 $x=\varphi(t)$ 当作反向代换时，要选择合适分支，保证原积分区间被正确覆盖。</p>
      <p>操作固定为：写新变量 → 求微分 → 列端点对应 → 整体换掉。例：$u=x^2$，$du=2x\,dx$，所以</p>
      $$\int_0^s\frac{2x}{1+x^2}\,dx=\int_0^{s^2}\frac{du}{1+u}=\ln(1+s^2),\qquad 0\le s\le1.$$
      <p>下面拖动上端点，同时看原变量与新变量下的面积；图的横轴不同，面积值相同。</p>` },
    { id: "i1-s2", h: "2. 分部积分：让下一次积分变简单", html: R`
      <p>乘积求导 $(uv)'=u'v+uv'$ 给出：若 $u,v\in C^1([a,b])$，则</p>
      $$\int_a^bu(x)v'(x)\,dx=[u(x)v(x)]_a^b-\int_a^bu'(x)v(x)\,dx.$$
      <p>也写作 $\int u\,dv=uv-\int v\,du$。优先把<b>求导后变简单</b>的部分选为 $u$（如 $\ln x,\arctan x$、多项式），把<b>容易积分</b>的部分选为 $dv$（如 $e^x\,dx,\sin x\,dx$）。这是选择线索，要以剩余积分是否更简单为准。</p>
      <p>例如 $\int_0^1xe^x\,dx$：取 $u=x,dv=e^x\,dx$，得 $[xe^x]_0^1-\int_0^1e^x\,dx=e-(e-1)=1$。</p>
      <p><b>边界项必须保留到代值完成</b>。若端点处函数或原函数有奇性，先在内部截断再取极限，不直接把无意义的 $0\cdot\infty$ 当作零。Wallis 型递推放在下一课专练。</p>` },
    { id: "i1-s3", h: "3. 三角有理式：半角代换与对称换元", html: R`
      <p>出现 $\sin x,\cos x$ 的有理式，可试 $t=\tan(x/2)$：</p>
      $$\sin x=\frac{2t}{1+t^2},\qquad\cos x=\frac{1-t^2}{1+t^2},\qquad dx=\frac{2\,dt}{1+t^2}.$$
      <p>它把三角函数变成有理函数。$x\in[0,\pi)$ 对应 $t\in[0,+\infty)$；若原上端点为 $\pi$，先令 $x\le r\lt\pi$，最后 $r\to\pi^-$，新端点才趋于 $+\infty$。</p>
      <p>别漏掉更省事的<b>对称换元</b>：令 $x=a+b-t$ 得</p>
      $$\int_a^bf(x)\,dx=\int_a^bf(a+b-x)\,dx.$$
      <p>上下限会颠倒，但 $dx=-dt$ 会再给一个负号。例如 $\int_0^{\pi/2}\frac{\sin x}{\sin x+\cos x}\,dx$，与反射后的余弦版本相加，分式和为 1，答案为 $\pi/4$。</p>` }
  ],
  widget: "substitutionPlot",
  concepts: [
    { id: "i1-c1", sec: "i1-s1", q: R`$u=x^2$ 时，$\int_0^2 2x\cos(x^2)\,dx$ 应变成：`,
      opts: [R`$\int_0^2\cos u\,du$`, R`$\int_0^4\cos u\,du$`, R`$\int_0^4 2u\cos u\,du$`, R`$\int_0^4\cos u\,du+C$`], a: 1,
      ex: R`$du=2x\,dx$，端点 $x=0,2$ 对应 $u=0,4$；定积分不写任意常数。` },
    { id: "i1-c2", sec: "i1-s2", q: R`计算 $\int_0^1x\ln(1+x)\,dx$，最合适的首步是：`,
      opts: [R`$u=x,\ dv=\ln(1+x)\,dx$`, R`$u=\ln(1+x),\ dv=x\,dx$`, R`把被积函数拆成两项积分相乘`, R`直接代入上下限到被积函数`], a: 1,
      ex: R`对数求导后成为 $1/(1+x)$，$x\,dx$ 易积分；剩余的是有理函数。` },

      ex: R`$x=0,1$ 对应 $t=1,0$，且 $dx=-dt$；反向上下限与微分负号抵消。这里假定 $f$ 连续。` },
    { id: "i1-c4", sec: "i1-s1", q: R`在讲解给定的连续与 $C^1$ 条件下，第一类换元公式还必须要求 $\varphi$ 单调吗？`,
      opts: [R`必须严格递增`, R`必须严格递减`, R`不必，链式法则和代端点即可`, R`必须满足 $\varphi'(t)\ne0$`], a: 2,
      ex: R`原函数 $F$ 存在时，$F(\varphi(t))$ 的导数就是被积函数。即使变量往返，带方向的积分会自动抵消。反向选参数分支时另须检查覆盖。` }
  ],
  methods: [
    { id: "m-int-sub", title: "定积分换元：变量、微分、端点一起换", steps: [
      R`看复合结构与内层导数，试 $u=g(x)$；根式或三角有理式则考虑反向代换并选好分支。`,

      R`按新变量算出数值；若新端点无穷或变换在端点奇异，先截断、后取极限。`] },

      R`对剩余有理函数做除法；多项式乘指数可反复分部，直到多项式次数降为零。`,
      R`独立代入边界，检查结果符号、大小；不定积分则可求导验算并补 $+C$。`] }
  ],
  problems: [
    { id: "i1-p1", lv: "基础", src: "自编", stmt: R`计算：(1) $\displaystyle\int_0^1 2xe^{x^2}\,dx$；(2) $\displaystyle\int_0^1x\ln(1+x)\,dx$。`,
      hints: [R`(1) 令 $u=x^2$；(2) 取 $u=\ln(1+x),dv=x\,dx$。`, R`(2) 得 $\frac12\ln2-\frac12\int_0^1\frac{x^2}{1+x}\,dx$。`, R`$\frac{x^2}{1+x}=x-1+\frac1{1+x}$。`],
      method: "m-int-parts", sol: R`<p>(1) 令 $u=x^2,du=2x\,dx$，端点仍为 0、1，得 $\int_0^1e^u\,du=e-1$。</p><p>(2) 取 $u=\ln(1+x),dv=x\,dx$，于是 $du=dx/(1+x),v=x^2/2$：</p>
      $$\int_0^1x\ln(1+x)\,dx=\frac12\ln2-\frac12\int_0^1\left(x-1+\frac1{1+x}\right)dx
      =\frac12\ln2-\frac12\left(\frac12-1+\ln2\right)=\frac14.$$
      <p>自检：被积函数非负，答案为正；换元题的原函数为 $e^{x^2}$，求导恢复 $2xe^{x^2}$。</p>` },
    { id: "i1-p2", lv: "真题", src: "2023 秋期末 1(2)", stmt: R`叙述定积分的换元公式，并给出证明。可选择讲解中的连续函数与 $C^1$ 换元版本。`,
      hints: [R`不要只写 $u=\varphi(t)$，先给出 $f$ 连续、$\varphi$ 为 $C^1$ 及取值范围条件。`, R`取 $f$ 的一个原函数 $F$，用链式法则求 $(F\circ\varphi)'$。`, R`两边用牛顿–莱布尼兹公式，得到相同的端点差。`],
      method: "m-int-sub", sol: R`<p>设 $f$ 在区间 $I$ 上连续，$\varphi\in C^1([\alpha,\beta])$，且 $\varphi([\alpha,\beta])\subseteq I$。则</p>
      $$\int_\alpha^\beta f(\varphi(t))\varphi'(t)\,dt=\int_{\varphi(\alpha)}^{\varphi(\beta)}f(u)\,du.$$
      <p>证明：连续函数 $f$ 有原函数 $F$（可用 $F(u)=\int_{u_0}^uf(v)\,dv$ 构造）。链式法则给 $(F\circ\varphi)'(t)=f(\varphi(t))\varphi'(t)$，故左边等于 $F(\varphi(\beta))-F(\varphi(\alpha))$，右边由牛顿–莱布尼兹公式也等于这个数，证毕。</p><p>端点反向时按定向积分定义理解，$\varphi$ 不需单调。</p>` },
    { id: "i1-p3", lv: "真题", src: "2021 秋期末 5(1)", stmt: R`给定实数 $a\gt b\gt0$，计算 $\displaystyle I=\int_0^\pi\frac{d\theta}{a-b\cos\theta}$。`,
      hints: [R`令 $t=\tan(\theta/2)$，把 $\cos\theta$ 与 $d\theta$ 一起代换。`, R`分母化为 $(a-b)+(a+b)t^2$，分子为 $2\,dt$；新端点为 0 与 $+\infty$。`, R`再令 $s=t\sqrt{(a+b)/(a-b)}$，使用 $\int_0^{+\infty}ds/(1+s^2)=\pi/2$。`],
      method: "m-int-sub", sol: R`<p>先把上限换成 $r\lt\pi$，令 $t=\tan(\theta/2)$，有 $\cos\theta=(1-t^2)/(1+t^2)$、$d\theta=2dt/(1+t^2)$。再令 $r\to\pi^-$，原被积函数连续且分母至少为 $a-b\gt0$，所以</p>
      $$I=2\int_0^{+\infty}\frac{dt}{(a-b)+(a+b)t^2}.$$
      <p>令 $s=t\sqrt{(a+b)/(a-b)}$，得到</p>
      $$I=\frac{2}{\sqrt{(a-b)(a+b)}}\int_0^{+\infty}\frac{ds}{1+s^2}
      =\frac{\pi}{\sqrt{a^2-b^2}}.$$
      <p>自检：当 $b\to0^+$ 时答案趋于 $\pi/a$，与常数被积函数的情形一致；而 $\pi/(a+b)\le I\le\pi/(a-b)$，答案满足这个界。</p>` }
  ],
  variants: [
    { id: "i1-v1", lv: "变种", src: "自编：换元后再分部", stmt: R`计算 $\displaystyle\int_0^1x\ln(1+x^2)\,dx$，并指出它与基础题 $\int_0^1x\ln(1+x)\,dx$ 的答案是否相同。`,
      hints: [R`先令 $u=1+x^2$，$du=2x\,dx$，上下限变为 1、2。`, R`积分化为 $\frac12\int_1^2\ln u\,du$，对 $\ln u$ 分部。`, R`$\int\ln u\,du=u\ln u-u+C$。`],
      method: "m-int-sub", sol: R`<p>令 $u=1+x^2$，得</p>
      $$\int_0^1x\ln(1+x^2)\,dx=\frac12\int_1^2\ln u\,du

      <p>这不等于基础题的 $1/4$。在 $0\lt x\lt1$ 上有 $x^2\lt x$，所以本题被积函数更小；数值 $\ln2-1/2\approx0.1931\lt0.25$，符号和大小都符合预期。</p>` }
  ],
  extensions: [
    { id: "i1-e1", lv: "延伸", src: "2023 秋期末 6(1)", stmt: R`求不定积分 $\displaystyle\int e^{2x}\arctan\sqrt{e^x-1}\,dx$（在 $x\gt0$ 上计算；原函数可连续延至 $x=0$）。`,
      hints: [R`令 $t=\sqrt{e^x-1}$，则 $e^x=1+t^2$，$dx=2t\,dt/(1+t^2)$。`, R`积分变为 $\int2t(1+t^2)\arctan t\,dt$。分部时可取 $v=(1+t^2)^2/2$。`, R`$\int\frac{(1+t^2)^2/2}{1+t^2}\,dt=\frac12\int(1+t^2)\,dt$。`],
      method: "m-int-parts", sol: R`<p>令 $t=\sqrt{e^x-1}$，$e^x=1+t^2$，$dx=2t\,dt/(1+t^2)$，则原积分为 $\int2t(1+t^2)\arctan t\,dt$。</p><p>分部取 $u=\arctan t$、$dv=2t(1+t^2)\,dt$，可取 $v=(1+t^2)^2/2$，于是</p>
      $$\int2t(1+t^2)\arctan t\,dt=\frac{(1+t^2)^2}{2}\arctan t-\frac12\int(1+t^2)\,dt
      =\frac{(1+t^2)^2}{2}\arctan t-\frac t2-\frac{t^3}{6}+C.$$
      <p>换回原变量：</p>
      $$\frac{e^{2x}}2\arctan\sqrt{e^x-1}-\frac12\sqrt{e^x-1}-\frac16(e^x-1)^{3/2}+C.$$
      <p>验算：在 $t$ 变量求导时，第一项多出的 $(1+t^2)/2$，恰由后两项导数抵消，剩下 $2t(1+t^2)\arctan t$；再乘 $dt/dx$ 即恢复原被积函数。</p>` }
  ]

i2: {
  unit: "int", n: 2, title: "Wallis 型递推：分部、奇偶与夹逼",
  goal: "会推导 Wallis 递推并分奇偶计算；把带根号的积分化为同一族；用单调性夹逼相邻项比值。30 分钟先做概念题和三道核心题，级数求和放在延伸。",
  sections: [
    { id: "i2-s1", h: "1. Wallis 积分：把 n 阶降为 n−2 阶", html: R`
      <p>对整数 $n\ge0$，定义 $W_n=\int_0^{\pi/2}\sin^n x\,dx$。先算初值：</p>
      $$W_0=\frac\pi2,\qquad W_1=1.$$
      <p>$n\ge2$ 时，把 $\sin^n x$ 写成 $\sin^{n-1}x\cdot\sin x$，分部取 $u=\sin^{n-1}x,dv=\sin x\,dx$，边界项 $[-\sin^{n-1}x\cos x]_0^{\pi/2}=0$，所以</p>
      $$W_n=(n-1)\int_0^{\pi/2}\sin^{n-2}x\cos^2x\,dx
      =(n-1)(W_{n-2}-W_n).$$
      <p>把右侧 $W_n$ 移到左侧，得到</p>
      $$W_n=\frac{n-1}{n}W_{n-2}\qquad(n\ge2).$$
      <p><b>不能漏掉移项</b>，也不能把递推用于 $n=1$：那时边界项不为零。递推跨两阶，必须分别从 $W_0,W_1$ 出发。</p>` },
    { id: "i2-s2", h: "2. 奇偶通式与带根号的真题", html: R`
      <p>记双阶乘 $k!!=k(k-2)(k-4)\cdots$，约定 $0!!=(-1)!!=1$。连续递推得</p>
      $$W_{2m}=\frac{(2m-1)!!}{(2m)!!}\frac\pi2,\qquad
      W_{2m+1}=\frac{(2m)!!}{(2m+1)!!}\qquad(m\ge0).$$
      <p>2023 期末的积分族是 $a_n=\int_0^1x^n\sqrt{1-x^2}\,dx$。令 $x=\sin t$，$dx=\cos t\,dt$，根号在 $0\le t\le\pi/2$ 上等于 $\cos t$，得到</p>
      $$a_n=\int_0^{\pi/2}\sin^nt\cos^2t\,dt=W_n-W_{n+2}=\frac{W_n}{n+2}.$$
      <p>因此 $a_0=\pi/4,a_1=1/3$，并且</p>
      $$a_n=\frac{n-1}{n+2}a_{n-2}\qquad(n\ge2).$$
      <p>若积分区间改成 $[-1,1]$，先看奇偶：$I_n=\int_{-1}^1x^n\sqrt{1-x^2}\,dx$ 在 $n$ 为奇数时为零，偶数时等于 $2a_n$。不要把只适用于偶数的“乘 2”套到所有 $n$。</p>` },
    { id: "i2-s3", h: "3. 比值极限：先找单调性，再用递推夹逼", html: R`
      <p>在 $0\le x\le1$ 上，$x^n\sqrt{1-x^2}$ 随 $n$ 增大而减小，且积分为正，所以 $0\lt a_n\le a_{n-1}\le a_{n-2}$。结合递推：</p>
      $$\frac{n-1}{n+2}=\frac{a_n}{a_{n-2}}\le\frac{a_n}{a_{n-1}}\le1\qquad(n\ge2).$$
      <p>两端都趋于 1，故 $a_n/a_{n-1}\to1$。这完成 2023 期末第 3 题的极限，<b>不需要 Stirling 公式</b>。仅凭 $a_n\to0$ 不能推出相邻项比值趋于 1，例如 $2^{-n}$ 就不成立。</p>
      <p>同样地 $W_n$ 随 $n$ 增大而减小，结合 $W_{n+2}/W_n=(n+1)/(n+2)$，可夹出 $W_{n+1}/W_n\to1$。想证明 $W_n\to0$，可把积分区间分成 $[0,\pi/2-\delta]$ 和最后一小段：前者按几何速度衰减，后者长度只有 $\delta$。</p>` }
  ],

    { id: "i2-p3", lv: "真题", src: "2022 秋期末 6(1)", stmt: R`对非负整数 $n$，计算 $\displaystyle I_n=\int_{-1}^1x^n\sqrt{1-x^2}\,dx$。`,

i3: {
  unit: "int", n: 3, title: "积分计算综合复盘：分诊、有理函数与原函数的连续性",
  goal: "拿到积分先看结构再选方法；会拆有理函数并用配对技巧；会检查牛顿–莱布尼兹公式的前提（原函数在整个区间上连续），避开半角代换的跳跃陷阱。30 分钟先做概念题、基础题和两道真题，区间再现与 2020 期末 4 选做。",
  sections: [
    { id: "i3-s1", h: "1. 先分诊：看被积函数的结构", html: R`
      <p>前两课分别练了换元、分部和递推。考场上难的往往不是计算，而是<b>第一步选哪条路</b>。按下面的顺序过一遍：</p>
      <ul>
        <li><b>复合函数且旁边有内层导数</b> → 凑微分。例：$\frac{x}{1+x^4}=\frac12\cdot\frac{(x^2)'}{1+(x^2)^2}$。</li>
        <li><b>根式</b> $\sqrt{a^2-x^2}$、$\sqrt{(x-p)(q-x)}$ → 先配方，再令 $x-\frac{p+q}2=-\frac{q-p}2\cos\theta$ 之类的三角代换，根号变成 $\sin\theta$。</li>
        <li><b>多项式乘 $e^x,\sin x$，或含 $\ln x,\arctan x$</b> → 分部：求导变简单的当 $u$。</li>
        <li><b>有理函数</b> → 部分分式；<b>三角有理式</b> → 半角代换 $t=\tan\frac\theta2$（注意第 3 节的陷阱）。</li>
        <li><b>题目给出“$F$ 是 $f$ 的原函数”而要积 $f'$</b> → 分部，把导数推回去：$\int xf'(x)\,dx=xf(x)-\int f(x)\,dx$。</li>
        <li><b>对称区间或 $[0,\pi]$</b> → 先试奇偶性、区间再现 $x\mapsto a+b-x$，常能消掉难缠的因子。</li>
        <li><b>带参数 $n$ 的一族积分</b> → 递推（上一课）。</li>
      </ul>
      <p>算完必做三项<b>自检</b>：不定积分求导还原；定积分看符号和粗略大小（被积函数的上下界乘区间长）；检查原函数在整个区间上是否连续。</p>` },
    { id: "i3-s2", h: "2. 有理函数：部分分式、配方与配对", html: R`
      <p>真分式先把分母分解成一次因子和不可约二次因子，再按形式设待定系数。例如 $1+x^3=(1+x)(x^2-x+1)$：</p>
      $$\frac1{1+x^3}=\frac{1/3}{1+x}+\frac{-\frac13x+\frac23}{x^2-x+1}.$$
      <p>二次因子那一项拆成“分母导数的倍数 + 常数”：$-\frac13x+\frac23=-\frac16(2x-1)+\frac12$。前者积出 $\ln$，后者配方积出 $\arctan$：</p>
      $$\int\frac{dx}{x^2-x+1}=\int\frac{dx}{(x-\frac12)^2+\frac34}=\frac2{\sqrt3}\arctan\frac{2x-1}{\sqrt3}+C.$$
      <p><b>配对技巧</b>（2022 电子系期末 1(2)）：$I=\int\frac{dx}{1+x^3}$ 与 $J=\int\frac{x\,dx}{1+x^3}$ 一起算。$I+J$ 的分子 $1+x$ 正好约掉一次因子，只剩配方；$I-J$ 的分子 $1-x$ 不能约分，但它恰好是 $\ln|1+x|$ 与 $\ln|1+x^3|$ 适当组合的导数的分子，可以直接验证：</p>
      $$\frac{d}{dx}\Big(\ln|1+x|-\tfrac13\ln|1+x^3|\Big)=\frac1{1+x}-\frac{x^2}{1+x^3}=\frac{1-x}{1+x^3}.$$
      <p>两式相加、相减再除以 2，就得到 $I,J$。<b>答案的区间</b>：被积函数在 $x=-1$ 无定义，原函数分别在 $(-\infty,-1)$ 与 $(-1,+\infty)$ 上成立，常数 $C$ 可以在两段上不同。</p>` },
    { id: "i3-s3", h: "3. 牛顿–莱布尼兹的前提：原函数在整个区间上连续", html: R`
      <p>公式 $\int_a^bf=F(b)-F(a)$ 要求 $F$ 在 $[a,b]$ 上<b>连续</b>，且在 $(a,b)$ 内 $F'=f$。半角代换给出的原函数常常违反这一点：$a\gt b\gt0$ 时</p>
      $$F(\theta)=\frac2{\sqrt{a^2-b^2}}\arctan\Big(\sqrt{\tfrac{a+b}{a-b}}\tan\frac\theta2\Big)$$
      <p>在 $\theta=\pi$ 处没有定义：左极限为 $\frac{\pi}{\sqrt{a^2-b^2}}$，右极限为 $-\frac{\pi}{\sqrt{a^2-b^2}}$。2021 期末 5(1) 的标准答案正是先把 $F$ 用左极限延拓到 $\theta=\pi$，再用公式。</p>
      <p>若积分区间是 $[0,2\pi]$ 却直接写 $F(2\pi)-F(0)=0$，就错了：被积函数恒正，积分不可能为 0。正确做法是在 $\pi$ 处分段，或者给 $\theta\gt\pi$ 的那段加上跳跃量，让原函数连续。下面的工具可以看到跳跃，以及“数值积分”和“$F(b)-F(a)$”在跨过 $\pi$ 后分道扬镳。</p>
      <p><b>区间再现</b>：令 $x=a+b-t$，$\int_a^bf(x)\,dx=\int_a^bf(a+b-x)\,dx$。在 $[0,\pi]$ 上，若 $h(\pi-x)=h(x)$，则 $\int_0^\pi xh(x)\,dx=\frac\pi2\int_0^\pi h(x)\,dx$：两式相加，$x+(\pi-x)=\pi$ 把讨厌的 $x$ 消掉。</p>
      <p><b>认出反函数</b>：在 $(-1,1)$ 上 $\arctan\frac{x}{\sqrt{1-x^2}}=\arcsin x$；在 $(-1,1]$ 上 $\arctan\frac{1-x}{\sqrt{1-x^2}}=\frac12\arccos x$（用半角公式 $\tan\frac\varphi2=\sqrt{\frac{1-\cos\varphi}{1+\cos\varphi}}$，$\varphi=\arccos x$）。认出来后求导、积分都只剩一步。</p>` }
  ],

  problems: [
    { id: "i3-p1", lv: "基础", src: "自编：三种结构各一题", stmt: R`计算：(1) $\displaystyle\int_0^1\frac{x}{1+x^4}\,dx$；(2) $\displaystyle\int_0^\pi x\sin x\,dx$；(3) $\displaystyle\int_1^e\ln^2x\,dx$。`,
      hints: [R`(1) 凑微分 $u=x^2$；(2) 分部 $u=x$；(3) 分部 $u=\ln^2x$，$dv=dx$。`, R`(3) 一次分部后剩 $2\int_1^e\ln x\,dx$，再分部一次。`, R`$\int\ln x\,dx=x\ln x-x+C$。`],
      method: "m-int-triage", sol: R`<p>(1) $u=x^2$，$du=2x\,dx$：$\frac12\int_0^1\frac{du}{1+u^2}=\frac12\cdot\frac\pi4=\frac\pi8$。</p><p>(2) $\int_0^\pi x\sin x\,dx=[-x\cos x]_0^\pi+\int_0^\pi\cos x\,dx=\pi+0=\pi$。</p><p>(3) $\int\ln^2x\,dx=x\ln^2x-2\int\ln x\,dx=x\ln^2x-2x\ln x+2x+C$。代入：$(e-2e+2e)-(0-0+2)=e-2$。</p><p>自检：(3) 被积函数在 $[1,e]$ 上介于 0 与 1 之间，区间长 $e-1\approx1.72$，答案 $\approx0.718$ 合理。</p>` },
    { id: "i3-p2", lv: "真题", src: "2022 秋期末 1（电子系卷）", stmt: R`<p>(1) 设 $\frac{\sin x}{x}$ 是 $f(x)$ 的一个原函数，求 $\int xf'(x)\,dx$。</p><p>(2) 求不定积分 $I=\int\frac{dx}{1+x^3}$ 与 $J=\int\frac{x\,dx}{1+x^3}$。</p>`,
      hints: [R`(1) 分部：$\int xf'(x)\,dx=xf(x)-\int f(x)\,dx$；$f$ 是 $\frac{\sin x}x$ 的导数。`, R`(2) $I+J=\int\frac{dx}{x^2-x+1}$，配方。`, R`$I-J=\int\frac{1-x}{1+x^3}\,dx$：验证 $\ln|1+x|-\frac13\ln|1+x^3|$ 的导数。`],
      method: "m-int-rational", sol: R`<p><b>(1)</b> $f(x)=\left(\frac{\sin x}x\right)'=\frac{x\cos x-\sin x}{x^2}$。分部：</p>
      $$\int xf'(x)\,dx=xf(x)-\int f(x)\,dx=\frac{x\cos x-\sin x}{x}-\frac{\sin x}x+C=\cos x-\frac{2\sin x}x+C.$$
      <p><b>(2)</b> $1+x^3=(1+x)(x^2-x+1)$。</p>
      $$I+J=\int\frac{dx}{x^2-x+1}=\frac2{\sqrt3}\arctan\frac{2x-1}{\sqrt3}+C_1,\qquad I-J=\ln|1+x|-\frac13\ln|1+x^3|+C_2.$$
      <p>后者求导验证：$\frac1{1+x}-\frac{x^2}{1+x^3}=\frac{x^2-x+1-x^2}{1+x^3}=\frac{1-x}{1+x^3}$。由 $\ln|1+x^3|=\ln|1+x|+\ln(x^2-x+1)$，得</p>
      $$I=\frac1{\sqrt3}\arctan\frac{2x-1}{\sqrt3}+\frac13\ln|1+x|-\frac16\ln(x^2-x+1)+C,$$
      $$J=\frac1{\sqrt3}\arctan\frac{2x-1}{\sqrt3}-\frac13\ln|1+x|+\frac16\ln(x^2-x+1)+C.$$
      <p>两式在 $x\lt-1$ 与 $x\gt-1$ 两段上分别成立，常数可以不同。</p>` },
    { id: "i3-p3", lv: "真题", src: "2021 秋期末 5(2)（5(1) 见 i1）", stmt: R`给定正数 $p\lt q$，计算 $\displaystyle I=\int_p^q\frac1x\sqrt{(x-p)(q-x)}\,dx$。可以使用 5(1) 的结论：$a\gt b\gt0$ 时 $\int_0^\pi\frac{d\theta}{a-b\cos\theta}=\frac\pi{\sqrt{a^2-b^2}}$。`,
      hints: [R`配方：记 $A=\frac{p+q}2$，$B=\frac{q-p}2$，则 $(x-p)(q-x)=B^2-(x-A)^2$。令 $x=A-B\cos\theta$，$\theta\in[0,\pi]$。`, R`根号变成 $B\sin\theta$，$dx=B\sin\theta\,d\theta$，$I=\int_0^\pi\frac{B^2\sin^2\theta}{A-B\cos\theta}\,d\theta$。`, R`把分子写成 $(A-B\cos\theta)(A+B\cos\theta)+(B^2-A^2)$。注意 $A^2-B^2=pq$。`],
      method: "m-int-sub", sol: R`<p>记 $A=\frac{p+q}2$，$B=\frac{q-p}2$，$A\gt B\gt0$。令 $x=A-B\cos\theta$，$\theta:0\to\pi$ 时 $x:p\to q$。此时 $x-p=B(1-\cos\theta)$，$q-x=B(1+\cos\theta)$，根号为 $B\sin\theta\ge0$，$dx=B\sin\theta\,d\theta$：</p>
      $$I=\int_0^\pi\frac{B^2\sin^2\theta}{A-B\cos\theta}\,d\theta.$$
      <p>因为 $B^2\sin^2\theta=B^2-B^2\cos^2\theta=(A-B\cos\theta)(A+B\cos\theta)+(B^2-A^2)$，</p>
      $$I=\int_0^\pi(A+B\cos\theta)\,d\theta+(B^2-A^2)\int_0^\pi\frac{d\theta}{A-B\cos\theta}=A\pi-(A^2-B^2)\frac{\pi}{\sqrt{A^2-B^2}}.$$
      <p>又 $A^2-B^2=pq$，所以 $I=\pi\left(\frac{p+q}2-\sqrt{pq}\right)$。</p><p>自检：由均值不等式结果为正；$p=1,q=4$ 时为 $\pi/2$，与数值积分一致。</p>` }

  variants: [

      hints: [R`半角代换给 $F(\theta)=\frac2{\sqrt3}\arctan\big(\sqrt3\tan\frac\theta2\big)$，看它在 $\theta=\pi$ 两侧的极限。`, R`在 $\pi$ 处分段；后一段令 $\theta=2\pi-s$，化回 $[0,\pi]$。`, R`$[0,\pi]$ 上的积分用 2021 期末 5(1) 的结果，$a=2,b=1$。`],
      method: "m-int-nl", sol: R`<p>由 2021 期末 5(1)，$\int_0^\pi\frac{d\theta}{2-\cos\theta}=\frac\pi{\sqrt3}$。后半段令 $\theta=2\pi-s$，$\cos\theta=\cos s$，得 $\int_\pi^{2\pi}=\int_0^\pi\frac{ds}{2-\cos s}=\frac\pi{\sqrt3}$。所以积分为 $\frac{2\pi}{\sqrt3}$。</p><p>错误原因：$F(\theta)=\frac2{\sqrt3}\arctan\big(\sqrt3\tan\frac\theta2\big)$ 在 $\pi$ 处无定义，左右极限为 $\pm\frac\pi{\sqrt3}$，跳了 $\frac{2\pi}{\sqrt3}$。它只是 $(0,\pi)$ 与 $(\pi,2\pi)$ 上各自的原函数，不是 $[0,2\pi]$ 上的连续原函数，牛顿–莱布尼兹公式不适用。给后一段加上跳跃量 $\frac{2\pi}{\sqrt3}$ 就得到连续原函数，结果相同。</p>` },
    { id: "i3-v2", lv: "变种", src: "经典例题：区间再现", stmt: R`计算 $\displaystyle\int_0^\pi\frac{x\sin x}{1+\cos^2x}\,dx$。`,
      hints: [R`$x\sin x$ 的原函数无法与分母配合；先想办法去掉 $x$。`, R`令 $x=\pi-t$：$\sin$ 不变，$\cos^2$ 不变，$x$ 变成 $\pi-t$。`, R`两式相加得 $2I=\pi\int_0^\pi\frac{\sin x}{1+\cos^2x}\,dx$，再令 $u=\cos x$。`],
      method: "m-int-triage", sol: R`<p>令 $x=\pi-t$，得 $I=\int_0^\pi\frac{(\pi-t)\sin t}{1+\cos^2t}\,dt$。与原式相加：</p>
      $$2I=\pi\int_0^\pi\frac{\sin x}{1+\cos^2x}\,dx=\pi\big[-\arctan(\cos x)\big]_0^\pi=\pi\Big(\frac\pi4+\frac\pi4\Big).$$
      <p>所以 $I=\frac{\pi^2}4$。自检：被积函数在 $(0,\pi)$ 上为正，$\frac{\pi^2}4\approx2.47$，与数值积分一致。</p>` }
  ],
  extensions: [
    { id: "i3-e1", lv: "延伸", src: "2020 秋期末 4（艾颖华整理）", stmt: R`<p>(1) 求 $\arctan\frac{1-x}{\sqrt{1-x^2}}$ 的导函数。</p><p>(2) 计算不定积分 $\displaystyle\int\frac1{\sqrt{1-x^2}}\arctan\frac{1-x}{\sqrt{1-x^2}}\,dx$。</p><p>(3) 计算 $\displaystyle I=\int_0^{1/2}\frac1{\sqrt{1-x^2}}\arctan\frac{x}{\sqrt{1-x^2}}\,dx+\int_{1/2}^1\frac1{\sqrt{1-x^2}}\arctan\frac{1-x}{\sqrt{1-x^2}}\,dx$。</p>`,

      method: "m-int-nl", sol: R`<p><b>(1)</b> 在 $(-1,1)$ 上，令 $\varphi=\arccos x\in(0,\pi)$，则 $\frac{1-x}{\sqrt{1-x^2}}=\sqrt{\frac{1-\cos\varphi}{1+\cos\varphi}}=\tan\frac\varphi2$，所以函数等于 $\frac12\arccos x$，导数为 $-\frac1{2\sqrt{1-x^2}}$。</p>
      <p><b>(2)</b> 由 (1)，原积分 $=\int\frac12\arccos x\cdot\frac{dx}{\sqrt{1-x^2}}=-\frac14\arccos^2x+C=-\arctan^2\frac{1-x}{\sqrt{1-x^2}}+C$。</p>
      <p><b>(3)</b> 第一项：$\arctan\frac x{\sqrt{1-x^2}}=\arcsin x$，积分为 $\big[\frac12\arcsin^2x\big]_0^{1/2}=\frac{\pi^2}{72}$。</p>
      <p>第二项：被积函数在 $x\to1^-$ 时有界（$\arctan$ 部分与 $\sqrt{1-x}$ 同阶），原函数 $-\frac14\arccos^2x$ 在 $[\frac12,1]$ 上连续，$x=1$ 处取值 0。所以第二项为 $0-\big(-\frac14\cdot\frac{\pi^2}9\big)=\frac{\pi^2}{36}$。</p>
      $$I=\frac{\pi^2}{72}+\frac{\pi^2}{36}=\frac{\pi^2}{24}.$$` }

i4: {
  unit: "int", n: 4, title: "变上限积分：求导与极限",
  goal: "会把积分当作函数：先检查连续性，再做上下限的链式求导；遇到极限先判断首个非零阶。30 分钟完成概念、基础与 2023 秋期末 2(1)，变种和证明选做。",
  sections: [
    { id: "i4-s1", h: "1. 从小区间的平均值到微积分基本定理", html: R`
      <p>设 $f$ 在 $[a,b]$ 上 Riemann 可积，令 $F(x)=\int_a^x f(t)\,dt$。有界性给 $|F(y)-F(x)|\le M|y-x|$，所以 $F$ 连续。若 $f$ 在内点 $x$ 连续，则</p>
      $$\frac{F(x+h)-F(x)}h-f(x)=\frac1h\int_x^{x+h}\bigl(f(t)-f(x)\bigr)\,dt\longrightarrow0,$$
      <p>因为其绝对值不超过 $x$ 与 $x+h$ 之间 $|f(t)-f(x)|$ 的上界，对正负 $h$ 都成立。因此 $F'(x)=f(x)$。<b>可积保证 $F$ 连续；在该点连续时，可保证导数等于该点函数值（充分条件）。</b>端点只谈单侧导数。</p>
      <p>在跳跃点不能直接套：令 $f(t)=-1$（$t\lt0$）、$f(t)=1$（$t\ge0$），则 $\int_0^x f(t)\,dt=|x|$，在 0 不可导。积分函数连续不代表可导。工具中的左右差商能直接看到这个区别。</p>` },
    { id: "i4-s2", h: "2. 双变限：上限乘导数，减去下限乘导数", html: R`
      <p>若 $f$ 在包含上下限取值的区间上连续，$u,v$ 可导，把积分拆成 $F(v(x))-F(u(x))$，再用链式法则：</p>
      $$\frac d{dx}\int_{u(x)}^{v(x)}f(t)\,dt=f(v(x))v'(x)-f(u(x))u'(x).$$
      <p>例：$\frac d{dx}\int_x^{x^2}(1+t^2)\,dt=2x(1+x^4)-(1+x^2)$。即使 $x^2\lt x$，也不用分段改公式，定积分已有方向。</p>
      <p><b>先分清自由变量 $x$ 与积分变量 $t$</b>：若被积式还含 $x$，就不能只求上下限。比如 $H(x)=\int_0^x(x-t)e^t\,dt$，先拆成 $x\int_0^x e^t\,dt-\int_0^x te^t\,dt$，再用乘积法则和基本定理，得 $H'(x)=\int_0^x e^t\,dt=e^x-1$。</p>` },
    { id: "i4-s3", h: "3. 极限：先看阶，再选求导或积分展开", html: R`
      <p>若 $f$ 在 0 连续，则 $\int_0^x f(t)\,dt=f(0)x+o(x)$。若有更精细的展开 $f(t)=a_0+a_1t+\cdots+a_mt^m+o(t^m)$，则</p>
      $$\int_0^x f(t)\,dt=a_0x+\frac{a_1}2x^2+\cdots+\frac{a_m}{m+1}x^{m+1}+o(x^{m+1}).$$
      <p>余项可积分的理由：充分小时 $|r(t)|\le\varepsilon|t|^m$，从而 $|\int_0^x r(t)\,dt|\le\varepsilon|x|^{m+1}/(m+1)$。<b>要先减去已抵消的低阶项</b>，不能把被积函数换成首项后就忽略消去。</p>
      <p>2023 秋期末 2(1) 的分子 $\int_0^x e^{-t^2}\,dt-x$ 首阶 $x$ 抵消，留下 $-x^3/3$；分母 $\sin x-x$ 也从三阶开始。可用一次洛必达，或先展开再积分；不需要求出 $e^{-t^2}$ 的初等原函数。</p>` }
  ],
  widget: "movingIntegral",
  concepts: [
    { id: "i4-c1", sec: "i4-s1", q: R`$f$ 在 $[a,b]$ 上可积，$F(x)=\int_a^x f(t)\,dt$。一定成立的是：`, opts: [R`$F$ 处处可导`, R`$F$ 连续，且在 $f$ 的内连续点有 $F'=f$`, R`$f$ 连续`, R`$F$ 单调递增`], a: 1, ex: R`可积函数有界，故 $F$ 满足 $|F(y)-F(x)|\le M|y-x|$；基本定理在 $f$ 连续的点给出导数。没有 $f\ge0$ 就不保证递增。` },
    { id: "i4-c2", sec: "i4-s2", q: R`$f$ 连续时，$\frac d{dx}\int_x^{x^2}f(t)\,dt$ 等于：`, opts: [R`$f(x^2)-f(x)$`, R`$2xf(x^2)-f(x)$`, R`$f(x^2)-2xf(x)$`, R`$2xf(x^2)+f(x)$`], a: 1, ex: R`先写成 $F(x^2)-F(x)$。上限的链式导数是 $2x$，下限项要减去。` },
    { id: "i4-c3", sec: "i4-s3", q: R`$\int_0^x e^{-t^2}\,dt-x$ 在 $x\to0$ 时的首个非零项是：`, opts: [R`$-x^2$`, R`$-x^3/3$`, R`$x^3/3$`, R`$-x^3$`], a: 1, ex: R`$e^{-t^2}=1-t^2+o(t^2)$，积分后是 $x-x^3/3+o(x^3)$，再减去 $x$。积分幂次升一阶，系数还要除以新幂次。` },
    { id: "i4-c4", sec: "i4-s2", q: R`求 $H(x)=\int_0^x(x-t)e^t\,dt$ 的导数，哪项正确？`, opts: [R`$H'(x)=0$，因为上限代入得到 0`, R`$H'(x)=xe^x$`, R`$H'(x)=e^x-1$`, R`$H'(x)=e^x$`], a: 2, ex: R`被积式中的 $x$ 也在变化。拆成 $x\int_0^xe^t\,dt-\int_0^xte^t\,dt$ 后求导，上限项相消，剩 $\int_0^xe^t\,dt=e^x-1$。` }
  ],
  methods: [
    { id: "m-int-moving", title: "变限求导：先拆成原函数的复合", steps: [R`检查被积函数在所需区间的连续性，确认 $x$ 是自由变量、$t$ 是积分变量。`, R`被积式仅含 $t$：拆成 $F(v(x))-F(u(x))$，得上限项减下限项，各乘链式导数。`, R`被积式还含 $x$：先用线性性、乘积拆分等初等操作处理，再求导；在拼接点单独核对。`] },

  ],
  problems: [
    { id: "i4-p1", lv: "基础", src: "自编：基本定理与双变限", stmt: R`设 $G(x)=\int_0^{x^2}e^{-t^2}\,dt$，$J(x)=\int_x^{x^2}(1+t^2)\,dt$。求 $G'(x),J'(x)$，并求 $G'(0)$、$J'(0)$。`, hints: [R`两者被积函数都连续，可直接用基本定理与链式法则。`, R`$G$ 的上限导数是 $2x$；$J$ 还有下限 $x$，不能漏减。`, R`$e^{-(x^2)^2}=e^{-x^4}$。`], method: "m-int-moving", sol: R`<p>$G'(x)=2xe^{-x^4}$，$J'(x)=2x(1+x^4)-(1+x^2)$。代入得 $G'(0)=0$，$J'(0)=-1$。</p><p>独立核对：$J(x)=x^2+x^6/3-x-x^3/3$，直接求导同上。$G(x)$ 是偶函数，0 处导数为 0 也符合对称性。</p>` },
    { id: "i4-p2", lv: "真题", src: "2023 秋期末 2(1)（mathsdream 试卷）", stmt: R`计算极限 $$\lim_{x\to0^+}\frac{\displaystyle\int_0^x e^{-t^2}\,dt-x}{\sin x-x}.$$`, hints: [R`分子、分母均趋于 0；分子可由基本定理求导。`, R`对 $x\gt0$ 充分小，分母导数 $\cos x-1\ne0$，洛必达得 $(e^{-x^2}-1)/(\cos x-1)$。`, R`$e^{-x^2}-1\sim-x^2$，$\cos x-1\sim-x^2/2$。或直接积分 $1-t^2+o(t^2)$。`], method: "m-int-limit", sol: R`<p><b>一次洛必达</b>：$e^{-t^2}$ 连续，分子导数为 $e^{-x^2}-1$。在 $0\lt x\lt\pi$ 上 $\cos x-1\ne0$，且导数比极限存在：</p>$$\lim_{x\to0^+}\frac{e^{-x^2}-1}{\cos x-1}=\lim_{x\to0^+}\frac{-x^2+o(x^2)}{-x^2/2+o(x^2)}=2.$$
      <p>故由洛必达原极限为 2。<b>积分展开复核</b>：$e^{-t^2}=1-t^2+o(t^2)$，分子为 $-x^3/3+o(x^3)$，分母为 $-x^3/6+o(x^3)$，比值仍为 2。分子分母在充分小的正 $x$ 时都为负，结果为正。</p>` }
  ],
  variants: [
    { id: "i4-v1", lv: "变种", src: "自编：可去间断与导数", stmt: R`令 $Q(x)=\frac1x\int_0^x\cos(t^2)\,dt$（$x\ne0$）。怎样定义 $Q(0)$ 才连续？延拓后求 $Q'(0)$，并算 $\lim_{x\to0}(Q(x)-1)/x^4$。`, hints: [R`平均值趋于 $\cos0=1$，所以先取 $Q(0)=1$。`, R`$\cos(t^2)=1-t^4/2+o(t^4)$，积分后为 $x-x^5/10+o(x^5)$。`, R`$Q(x)=1-x^4/10+o(x^4)$；在 0 处用导数定义。`], method: "m-int-limit", sol: R`<p>连续性要求 $Q(0)=1$。由积分余项估计，对正负 $x$ 都有 $\int_0^x\cos(t^2)\,dt=x-x^5/10+o(x^5)$，故 $Q(x)=1-x^4/10+o(x^4)$。</p><p>因此 $Q'(0)=\lim_{x\to0}(Q(x)-Q(0))/x=0$，且所求极限为 $-1/10$。不能把仅对 $x\ne0$ 成立的商式求导公式直接代 $x=0$。</p>` },
    { id: "i4-v2", lv: "变种", src: "自编：被积式含自由变量", stmt: R`设 $H(x)=\int_0^x(x-t)e^t\,dt$。不用含参积分求导定理，求 $H'(x),H''(x)$ 及 $H(x)$ 的显式表达式。`, hints: [R`先拆成 $x\int_0^x e^t\,dt-\int_0^xte^t\,dt$。`, R`对第一项用乘积法则；两项各有一个 $xe^x$，会相消。`, R`$H'=e^x-1$，$H(0)=0$。`], method: "m-int-moving", sol: R`<p>由拆分与乘积法则，$H'(x)=\int_0^xe^t\,dt+xe^x-xe^x=e^x-1$，进而 $H''(x)=e^x$。</p><p>由 $H(0)=0$，积分得 $H(x)=e^x-1-x$。也可用 $\int te^t\,dt=(t-1)e^t+C$ 代入拆分式核对。这里上下限代入的边界项虽为 0，被积式随 $x$ 变化的贡献仍不为 0。</p>` }
  ],
  extensions: [
    { id: "i4-e1", lv: "延伸", src: "2023 秋期末 1(1)（选连续函数版本）", stmt: R`叙述任意一个版本的 Newton–Leibniz 公式并证明。这里选：若 $f$ 在 $[a,b]$ 连续，$P$ 在 $[a,b]$ 连续且在 $(a,b)$ 可导，$P'=f$，则 $\int_a^bf(x)\,dx=P(b)-P(a)$。`, hints: [R`构造 $F(x)=\int_a^x f(t)\,dt$，用本课基本定理。`, R`$P-F$ 在内部导数为 0，在闭区间连续，应用中值定理。`, R`$P-F$ 为常数，比较端点，且 $F(a)=0$。`], method: "m-int-moving", sol: R`<p>令 $F(x)=\int_a^x f(t)\,dt$。由有界性 $F$ 连续，由 $f$ 连续及差商估计，$F'(x)=f(x)$（$a\lt x\lt b$）。因此 $P-F$ 在 $[a,b]$ 连续、在 $(a,b)$ 可导且导数恒为 0。</p><p>由拉格朗日中值定理，$P-F$ 在 $[a,b]$ 为常数。所以 $P(b)-F(b)=P(a)-F(a)$。又 $F(a)=0$、$F(b)=\int_a^bf$，移项即得所述公式。证明没有预先拿 Newton–Leibniz 来证明 $F'=f$，避免循环论证。</p>` }
  ]
},

i5: {
  unit: "int", n: 5, title: "积分不等式：Cauchy–Schwarz 与分部估计",
  goal: "30 分钟掌握“平方非负 → Cauchy–Schwarz → 分部后估计”的链条，完整练习 2021 秋期末 6。先做概念与两道真题；倒数型变种、最佳常数延伸留作回炉。",
  sections: [
    { id: "i5-s1", h: "1. Cauchy–Schwarz：平方积分非负，等号要写条件", html: R`
      <p>连续实函数 $f,g$ 在 $[a,b]$ 上满足</p>
      $$\left|\int_a^bfg\,dx\right|\le\left(\int_a^bf^2\,dx\right)^{1/2}\left(\int_a^bg^2\,dx\right)^{1/2}.$$
      <p>若 $B=\int g^2=0$，连续性给 $g\equiv0$，结论直接成立。否则令 $\lambda=\int fg/B$，由 $0\le\int(f-\lambda g)^2=\int f^2-(\int fg)^2/B$ 即得。<b>等号当且仅当 $f,g$ 线性相关</b>：存在不全为零的常数 $u,v$ 使 $uf+vg\equiv0$。这也包括其中一个恒零的情况。</p>
      <p>2021 秋期末 6(2) 原题只要求不带绝对值的上界；上式是更强版本。使用时先认出两因子：例如 $\int f=\int f\cdot1$ 给 $(\int f)^2\le(b-a)\int f^2$；取 $\sqrt f$ 与 $1/\sqrt f$ 可处理正函数的倒数。</p>` },
    { id: "i5-s2", h: "2. 奇点前先检查：F(x)/x 可以连续延拓", html: R`
      <p>令 $F(x)=\int_0^xf(t)\,dt$，$f$ 在 $[0,1]$ 连续。由基本定理或积分平均值：</p>
      $$\lim_{x\to0^+}\frac{F(x)}x=f(0),\qquad\lim_{x\to0^+}\frac{F(x)^2}x=\lim_{x\to0^+}x\left(\frac{F(x)}x\right)^2=0.$$
      <p>所以 $F(x)/x$ 在 0 处补上 $f(0)$ 后连续，$F^2/x^2$ 也可连续延拓，下面的积分确实有限。<b>不能先对尚未证明收敛的积分直接移项或开方。</b></p>
      <p>先在 $[\varepsilon,1]$ 分部，把 $x^{-2}$ 看成 $(-x^{-1})'$：</p>
      $$\int_\varepsilon^1\frac{F^2}{x^2}\,dx=-F(1)^2+\frac{F(\varepsilon)^2}\varepsilon+2\int_\varepsilon^1\frac{Ff}{x}\,dx.$$
      <p>再让 $\varepsilon\to0^+$，上面的边界项为 0。分部时 $F'=f$，因此导数 $2Ff$ 把问题接回 Cauchy–Schwarz。</p>` },
    { id: "i5-s3", h: "3. 从分部恒等式解出 Hardy 型估计", html: R`
      <p>记 $I=\int_0^1F^2/x^2$，$E=\int_0^1f^2$，均有限。由上一节：</p>
      $$I=-F(1)^2+2\int_0^1\frac{F}x f\,dx\le2\sqrt I\sqrt E.$$
      <p>若 $I=0$，所求显然；若 $I\gt0$，除以 $\sqrt I$，得到 $\sqrt I\le2\sqrt E$，即 $I\le4E$。<b>先说明可积、处理边界，再做 Cauchy，最后讨论零值再相除。</b></p>
      <p>工具对照普通 Cauchy 与常数 4 的紧性：后者选一族在 0 附近很陡、但每个都连续的函数。它们可让比值接近 4，却不是靠某个非零连续函数取到等号。</p>` }
  ],
  widget: "integralBoundPlay",
  concepts: [
    { id: "i5-c1", sec: "i5-s1", q: R`用 Cauchy 估计 $\int_0^1f(x)\,dx$，应该选哪一对函数？`, opts: [R`$f$ 与 $f'$`, R`$f$ 与 $1$`, R`$f^2$ 与 $1$`, R`$f$ 与 $x$`], a: 1, ex: R`把被估计的积分写成 $\int f\cdot1$，便得到 $(\int f)^2\le\int f^2$。` },
    { id: "i5-c2", sec: "i5-s1", q: R`连续实函数的积分 Cauchy–Schwarz 取等号的准确条件是：`, opts: [R`$f=g$`, R`$f,g$ 线性相关（包括零函数）`, R`$f,g$ 都恒正`, R`$\int fg=0$`], a: 1, ex: R`不仅限于 $f=g$；非零常数倍也取等号，其中一个恒为 0 时同样取等号。` },
    { id: "i5-c3", sec: "i5-s2", q: R`连续 $f$ 的变上限积分 $F(x)$ 满足 $F(x)^2/x\to$ 什么？`, opts: [R`$f(0)^2$`, R`$0$`, R`$1$`, R`不一定存在`], a: 1, ex: R`$F(x)/x\to f(0)$，所以 $F(x)^2/x=x(F(x)/x)^2\to0$。注意分母只有一次方。` },
    { id: "i5-c4", sec: "i5-s3", q: R`由 $I\le2\sqrt I\sqrt E$ 推出 $I\le4E$ 时，应先做什么？`, opts: [R`直接两边除以 $I$`, R`直接令 $I=1$`, R`分开处理 $I=0$ 与 $I\gt0$`, R`假设 $F(1)=0$`], a: 2, ex: R`$I=0$ 直接成立；$I\gt0$ 才可除以 $\sqrt I$。原题没有要求 $F(1)=0$，丢掉的是非正边界项。` }
  ],
  methods: [
    { id: "m-int-cauchy", title: "积分 Cauchy：认因子、平方非负、核对等号", steps: [R`把目标写成 $\int uv$，检查 $u,v$ 的平方可积；常见补法是乘 1 或拆成平方根。`, R`套 $(\int uv)^2\le\int u^2\int v^2$；证明时用 $\int(u-\lambda v)^2\ge0$，先处理零范数。`, R`等号检查两函数线性相关；连续函数由积分为零推出恒零，不能漏掉零函数。`] },
    { id: "m-int-hardy", title: "分部后 Cauchy：先截断，再估计，再解不等式", steps: [R`遇到 $1/x$ 或 $1/x^2$，先核对 0 附近的极限与可积性。`, R`在 $[\varepsilon,1]$ 分部，保留全部边界项；证明边界极限后再让 $\varepsilon\to0$。`, R`把剩余积分写成两个因子的乘积，用 Cauchy；零值单独处理，再相除或开方。`] }
  ],
  problems: [
    { id: "i5-p1", lv: "基础", src: "自编：固定平均值的平方积分", stmt: R`连续实函数 $f$ 在 $[0,1]$ 上满足 $\int_0^1f(x)\,dx=2$。证明 $\int_0^1f(x)^2\,dx\ge4$，并确定等号条件。`, hints: [R`把已知积分写成 $\int f\cdot1$。`, R`Cauchy 给 $4\le\int f^2\int1^2$。`, R`等号时 $f$ 是常数，再用积分值确定该常数。`], method: "m-int-cauchy", sol: R`<p>由 Cauchy，$4=(\int_0^1f\cdot1)^2\le\int_0^1f^2\int_0^11^2=\int_0^1f^2$。等号当且仅当 $f$ 与 1 线性相关，即 $f$ 为常数；由积分为 2 得 $f\equiv2$。</p><p>也可直接核对：$0\le\int_0^1(f-2)^2=\int_0^1f^2-4$，等号时连续非负函数 $(f-2)^2$ 恒为 0。</p>` },
    { id: "i5-p2", lv: "真题", src: "2021 秋期末 6(1)(2)（mathsdream 试卷）", stmt: R`<p>$f,g$ 是 $[0,1]$ 上的连续实函数，$F(x)=\int_0^xf(t)\,dt$。</p><p>(1) 计算 $\lim_{x\to0^+}F(x)/x$ 与 $\lim_{x\to0^+}F(x)^2/x$。</p><p>(2) 证明 $\int_0^1fg\le(\int_0^1f^2)^{1/2}(\int_0^1g^2)^{1/2}$。</p>`, hints: [R`(1) $F(x)/x$ 是小区间上的积分平均值，趋于 $f(0)$。`, R`(1) 第二个比值写成 $x(F(x)/x)^2$。`, R`(2) 若 $\int g^2\gt0$，展开 $\int(f-\lambda g)^2\ge0$ 并取 $\lambda=\int fg/\int g^2$；零范数另论。`], method: "m-int-cauchy", sol: R`<p>(1) 连续性给 $|F(x)/x-f(0)|\le\sup_{0\le t\le x}|f(t)-f(0)|\to0$，故两个极限依次为 $f(0)$ 与 0。</p><p>(2) 记 $A=\int f^2,B=\int g^2,C=\int fg$。若 $B=0$，连续性给 $g\equiv0$，结论成立；若 $B\gt0$，$0\le\int(f-Cg/B)^2=A-C^2/B$，得 $|C|\le\sqrt{AB}$，从而 $C\le\sqrt{AB}$。这还证明了带绝对值的更强结论。</p>` },
    { id: "i5-p3", lv: "真题", src: "2021 秋期末 6(3)（mathsdream 试卷）", stmt: R`沿用上一题记号，利用分部积分及 (1)(2)，证明 $$\int_0^1\frac{F(x)^2}{x^2}\,dx\le4\int_0^1f(x)^2\,dx.$$`, hints: [R`$F(x)/x$ 可在 0 处连续延拓，因此目标积分有限。先从 $\varepsilon\gt0$ 积分。`, R`取 $dv=x^{-2}dx$、$u=F^2$，$v=-1/x$、$du=2Ff\,dx$；边界项是 $-F(1)^2+F(\varepsilon)^2/\varepsilon$。`, R`令 $\varepsilon\to0$ 后记目标积分为 $I$，由 Cauchy 得 $I\le2\sqrt I\sqrt{\int f^2}$。`], method: "m-int-hardy", sol: R`<p>由上一题，$F(x)/x$ 在 0 处补值 $f(0)$ 后连续，故 $I=\int_0^1F^2/x^2$ 有限，$Ff/x$ 也可连续延拓。先在 $[\varepsilon,1]$ 分部：</p>$$\int_\varepsilon^1\frac{F^2}{x^2}\,dx=-F(1)^2+\frac{F(\varepsilon)^2}\varepsilon+2\int_\varepsilon^1\frac{Ff}{x}\,dx.$$
      <p>由 (1) 中第二个极限，让 $\varepsilon\to0^+$，得到 $I=-F(1)^2+2\int_0^1(F/x)f\le2\sqrt I\sqrt{\int_0^1f^2}$。若 $I=0$，结论直接成立；否则除以 $\sqrt I$ 再平方，得 $I\le4\int_0^1f^2$。</p>` }
  ],
  variants: [
    { id: "i5-v1", lv: "变种", src: "自编：正函数与倒数", stmt: R`连续函数 $f$ 在 $[1,2]$ 恒正。证明 $\left(\int_1^2f\,dx\right)\left(\int_1^2\frac1f\,dx\right)\ge1$，并给出等号条件。`, hints: [R`$f$ 在紧区间恒正，所以 $1/f$ 连续。`, R`$1=\sqrt f\cdot1/\sqrt f$，对这两个因子用 Cauchy。`, R`等号要求 $\sqrt f$ 与 $1/\sqrt f$ 成比例。`], method: "m-int-cauchy", sol: R`<p>$1=(\int_1^21\,dx)^2=(\int_1^2\sqrt f\cdot1/\sqrt f\,dx)^2\le\int_1^2f\int_1^2(1/f)$。等号时存在常数 $c\gt0$ 使 $\sqrt f=c/\sqrt f$，故 $f\equiv c$；反之任意正常数都取等号。</p>` }
  ],
  extensions: [
    { id: "i5-e1", lv: "延伸", src: "2022 秋期末 7(2)(3)（mathsdream 试卷）", stmt: R`<p>(1) 计算 $\frac1{36}\int_0^1(1-3x^2)^2dx$。</p><p>(2) 设 $f\in C^1([0,1])$，$f(0)=f(1)=0$，证明 $\left(\int_0^1xf(x)dx\right)^2\le\frac1{45}\int_0^1f'(x)^2dx$，且等号当且仅当 $f(x)=A(x-x^3)$，$A$ 为常数。</p>`, hints: [R`(1) 展开 $1-6x^2+9x^4$，积分得 $1-2+9/5=4/5$。`, R`(2) 令 $q(x)=(1-3x^2)/6$，则 $q'=-x$；分部把 $\int xf$ 写成 $\int qf'$，端点项因 $f(0)=f(1)=0$ 消失。`, R`套 Cauchy，$\int q^2=1/45$；等号条件为 $f'=cq$，再由 $f(0)=0$ 积分。`], method: "m-int-cauchy", sol: R`<p>(1) $\frac1{36}\int_0^1(1-6x^2+9x^4)dx=\frac1{36}(1-2+9/5)=1/45$。</p><p>(2) 取 $q=(1-3x^2)/6$，$q'=-x$。分部得 $\int_0^1xf=-[qf]_0^1+\int_0^1qf'=\int_0^1qf'$，从而</p>$$\left(\int_0^1xf\right)^2\le\int_0^1q^2\int_0^1f'^2=\frac1{45}\int_0^1f'^2.$$
      <p>等号当且仅当 $f'=cq$，积分并用 $f(0)=0$ 得 $f=(c/6)(x-x^3)=A(x-x^3)$；这类函数也满足 $f(1)=0$，代入确实取等号，包含 $A=0$。</p>` }
  ]
},

i6: {
  unit: "int", n: 6, title: "积分周复盘：识别结构、控制误差与边界",
  goal: "30 分钟用新题回顾 i1–i5：先判断方法，再落笔计算，最后查上下限、余项和等号条件。主线做两道基础与 2022 秋期末 5，变种用于错题回炉；不重复既有题目。",
  sections: [
    { id: "i6-s1", h: "1. 先用 20 秒分诊，不急着找原函数", html: R`
      <p><b>计算题</b>：复合函数伴内导数先换元；有 $\ln$ 或多项式乘指数先试分部；有理式先约分或长除法；对称区间先看奇偶、区间再现；参数幂次先找递推。</p>
      <p><b>积分函数题</b>：被积式只有 $t$，先基本定理与链式；还含自由变量 $x$，先拆分。<b>极限题</b>：先看低阶相消，再选一次求导消积分，或把被积式展开后积分。</p>
      <p><b>证明题</b>：目标是积的平方时找 Cauchy 的两个因子；带 $f'$ 时想分部；带 $F(x)/x$ 时先查 0 附近边界。不要把“积分恒正”“端点恰好为 0”“原函数整段连续”当成默认条件。</p>` },
    { id: "i6-s2", h: "2. 精度账本：积分平均值不等于取中点", html: R`
      <p>若 $f$ 在 $a$ 可导，$f(a+h)=f(a)+Lh+o(h)$，则</p>
      $$\frac1h\int_a^{a+h}f(t)dt=f(a)+\frac L2h+o(h).$$
      <p>若 $f(\xi)=\frac1h\int_a^{a+h}f$，$\xi\in[a,a+h]$，仅由积分中值定理不能说 $\xi=a+h/2$。但当 $L\ne0$ 时，将 $f(\xi)=f(a)+L(\xi-a)+o(h)$ 代入，可推出 $(\xi-a)/h\to1/2$。</p>
      <p>这里 $o(h)$ 的控制来自 $0\le\xi-a\le h$，不要求选择出的 $\xi$ 随 $h$ 连续，也不要求 $f'$ 在邻域连续。真题会用斜率的上下界写成完全严格的夹逼。</p>` },
    { id: "i6-s3", h: "3. 最后一行验收：符号、尺度、端点与等号", html: R`
      <p>计算后至少做一个独立检查：被积函数非负时积分不能为负；上限变化的导数应有链式因子；换元区间方向须一致；展开后首项阶数应与消去情况相符。</p>
      <p>不等式的常数要能代入简单函数核对。声称最佳常数时，要给取等函数或逼近序列；声称等号成立时，应把所有估计步骤的等号条件同时满足。</p>
      <p>本课先做主线三题，卡住时逐层看提示；记录“第一步方法选错”“计算出错”“边界遗漏”三种原因，下次复盘只重做错因对应的变种。</p>` }
  ],
  widget: "integralTriage",
  concepts: [
    { id: "i6-c1", sec: "i6-s1", q: R`$\int_0^1x^3/(1+x^2)\,dx$ 最直接的开局是：`, opts: [R`令 $u=x^2$ 后做除法`, R`对 $x^3$ 连续分部三次`, R`使用 Cauchy 求精确值`, R`忽略分母`], a: 0, ex: R`$x^3dx=x^2(xdx)$，令 $u=x^2$ 得 $\frac12\int_0^1u/(1+u)\,du$，再写 $u/(1+u)=1-1/(1+u)$。` },
    { id: "i6-c2", sec: "i6-s2", q: R`积分中值点 $\xi\in[a,a+h]$ 一定等于 $a+h/2$ 吗？`, opts: [R`对所有连续函数都等于`, R`对所有可导函数都等于`, R`一般不等于；非零端点导数时可得到相对位置趋于 1/2`, R`一般不存在`], a: 2, ex: R`例如 $f(t)=t^2$、$a=0$ 时 $\xi=h/\sqrt3$。非零一阶导数条件很关键，不能删去。` },
    { id: "i6-c3", sec: "i6-s1", q: R`$K(x)=\int_0^{\sin x}e^{t^2}\,dt$，则 $K'(x)$ 是：`, opts: [R`$e^{x^2}$`, R`$e^{\sin^2x}$`, R`$e^{\sin^2x}\cos x$`, R`$2\sin x\cos x\,e^{\sin^2x}$`], a: 2, ex: R`原函数的导数是被积函数，不再对被积函数内部的平方求导；只乘上限 $\sin x$ 的导数。` },
    { id: "i6-c4", sec: "i6-s3", q: R`为了证明 $\int_0^1 f^2\ge1$，只知道 $\int_0^1f=1$，哪项是有效核对？`, opts: [R`取 $f\equiv1$ 应达到等号`, R`假设 $f\ge0$ 不用说明`, R`随意把 $f$ 换成 $f'$`, R`只检验一个函数就算证明`], a: 0, ex: R`常数函数可核对常数的尺度和等号，但一般结论仍须用 Cauchy 或平方积分证明。` }
  ],
  methods: [
    { id: "m-int-review", title: "积分复盘四步：分类、执行、查边界、验尺度", steps: [R`标出结构：复合/乘积/有理/对称/参数/变上限/不等式，先写一个方法名。`, R`写清换元微分与端点，或分部的 u、dv；极限注明需要保留到几阶。`, R`查原函数整段连续、奇点边界、链式因子、零值与等号条件。`, R`用符号、简单函数、另一种计算或数值近似复核；把错因记成一句话。`] },
    { id: "m-int-meanpoint", title: "积分中值点极限：用端点斜率夹住相对位置", steps: [R`设 h=x-a；由 f'(a)=L 给 (L−ε)t 与 (L+ε)t 对增量的上下界。`, R`对整段积分，得到平均值增量介于 (L−ε)h/2 与 (L+ε)h/2。`, R`再把同样的斜率界用在 ξ−a，与平均值恒等式联立，夹住 (ξ−a)/h。`, R`先让 h→0，再让 ε→0；不假设 ξ 是唯一的或随 h 连续。`] }
  ],
  problems: [
    { id: "i6-p1", lv: "基础", src: "自编：换元后除法与分部对照", stmt: R`先各写出首选方法，再计算 $A=\int_0^1\frac{x^3}{1+x^2}dx$ 与 $B=\int_0^1x\ln(1+x^2)dx$。`, hints: [R`两题都先令 $u=x^2$，但换元后一个要除法，一个要分部。`, R`$A=\frac12\int_0^1u/(1+u)du$；$B=\frac12\int_0^1\ln(1+u)du$。`, R`$u/(1+u)=1-1/(1+u)$；$\int\ln(1+u)du=(1+u)\ln(1+u)-(1+u)$。`], method: "m-int-review", sol: R`<p>由 $u=x^2,du=2x\,dx$，$A=\frac12\int_0^1(1-1/(1+u))du=(1-\ln2)/2$。</p><p>$B=\frac12[(1+u)\ln(1+u)-(1+u)]_0^1=\ln2-1/2$。两者都为正，近似 $0.1534$ 与 $0.1931$。也可对原 $B$ 分部：取 $u=\ln(1+x^2),dv=x\,dx$，得 $B=\frac12\ln2-A$，与结果一致。</p>` },
    { id: "i6-p2", lv: "基础", src: "自编：变上限与抵消阶数", stmt: R`设 $K(x)=\int_0^{\sin x}e^{t^2}dt$。求 $K'(x)$，并计算 $\lim_{x\to0}(K(x)-x)/x^3$。`, hints: [R`求导只乘上限的导数：$K'=e^{\sin^2x}\cos x$。`, R`$e^{t^2}=1+t^2+o(t^2)$，故积分至 u 等于 $u+u^3/3+o(u^3)$。`, R`$u=\sin x=x-x^3/6+o(x^3)$；两项都对三阶系数有贡献。`], method: "m-int-review", sol: R`<p>$K'(x)=e^{\sin^2x}\cos x$。由 $\int_0^u e^{t^2}dt=u+u^3/3+o(u^3)$，代入 $u=\sin x$，得 $K(x)=x-x^3/6+x^3/3+o(x^3)=x+x^3/6+o(x^3)$，所以极限为 $1/6$。</p><p>复核：$K'=1+x^2/2+o(x^2)$，对 $K(x)-x$ 和 $x^3$ 用一次洛必达，导数比趋于 $1/6$。</p>` },
    { id: "i6-p3", lv: "真题", src: "2022 秋期末 5(1)(2)（mathsdream 试卷）", stmt: R`<p>$f$ 在 $[a,b]$ 可导，$f'(a)=L\gt0$。对 $a\lt x\le b$，积分中值定理给出 $\xi(x)\in[a,x]$，满足 $\int_a^xf(t)dt=f(\xi(x))(x-a)$。</p><p>(1) 证明：对每个 $\varepsilon\in(0,L)$，存在 $\delta\gt0$，当 $a\lt x\lt a+\delta$ 时有</p>$$\frac{L-\varepsilon}{2(L+\varepsilon)}\lt\frac{\xi(x)-a}{x-a}\lt\frac{L+\varepsilon}{2(L-\varepsilon)}.$$
      <p>(2) 求 $\lim_{x\to a^+}(\xi(x)-a)/(x-a)$。</p>`, hints: [R`由端点导数定义，充分小的 $s\gt0$ 满足 $(L-\varepsilon)s\lt f(a+s)-f(a)\lt(L+\varepsilon)s$。`, R`对 s 从 0 到 h=x−a 积分，再除以 h，得到平均值增量的上下界。`, R`先由平均值严格大于 f(a) 排除 ξ=a，再对 s=ξ−a 用同一斜率界；联立即可。`], method: "m-int-meanpoint", sol: R`<p>由 $f'(a)=L$，可取 $\delta\gt0$，使 $0\lt s\lt\delta$ 时 $(L-\varepsilon)s\lt f(a+s)-f(a)\lt(L+\varepsilon)s$。设 $h=x-a\in(0,\delta)$，积分得</p>$$\frac{L-\varepsilon}{2}h\lt\frac1h\int_a^{a+h}(f(t)-f(a))dt\lt\frac{L+\varepsilon}{2}h.$$
      <p>中间项等于 $f(\xi)-f(a)$ 且严格为正，所以 $\xi\ne a$。又 $0\lt\xi-a\le h\lt\delta$，同一斜率界给 $(L-\varepsilon)(\xi-a)\lt f(\xi)-f(a)\lt(L+\varepsilon)(\xi-a)$。联立上面两组界，分别得 $(L+\varepsilon)(\xi-a)\gt(L-\varepsilon)h/2$ 与 $(L-\varepsilon)(\xi-a)\lt(L+\varepsilon)h/2$，即 (1)。</p><p>(2) 对任意 $\varepsilon\in(0,L)$ 均有此夹逼，两端随 $\varepsilon\to0$ 都趋于 $1/2$，故所求极限为 $1/2$。结论对每一种中值点选择都成立。</p>` }
  ],
  variants: [
    { id: "i6-v1", lv: "变种", src: "自编：先减去相消项，再积分", stmt: R`计算 $\lim_{x\to0}\frac{\int_0^x\ln(1+t^2)dt-x^3/3}{x^5}$。`, hints: [R`低阶 x³/3 已减去，必须保留被积函数的 t⁴ 项。`, R`$\ln(1+t^2)=t^2-t^4/2+o(t^4)$。`, R`积分后为 $x^3/3-x^5/10+o(x^5)$。`], method: "m-int-review", sol: R`<p>由所给展开及积分余项估计，$\int_0^x\ln(1+t^2)dt=x^3/3-x^5/10+o(x^5)$。减去 $x^3/3$ 后除以 $x^5$，得到 $-1/10$。原式对正负 $x$ 的结论相同。</p>` },
    { id: "i6-v2", lv: "变种", src: "自编：不等式从归一化到最小值", stmt: R`连续实函数 $f$ 在 $[0,1]$ 上满足 $\int_0^1xf(x)dx=1$。求 $\int_0^1f(x)^2dx$ 的最小值及所有取等函数。`, hints: [R`对 x 与 f 用 Cauchy，不要用 1 与 f。`, R`$1\le(\int_0^1x^2dx)(\int_0^1f^2dx)=\frac13\int_0^1f^2$。`, R`等号要求 f=cx，再用已知积分求 c。`], method: "m-int-cauchy", sol: R`<p>由 Cauchy，$1=(\int_0^1xf)^2\le\frac13\int_0^1f^2$，故最小值至少为 3。等号要求 $f=cx$；代入约束 $c\int_0^1x^2=c/3=1$，得 $f(x)=3x$。它确实满足约束且平方积分为 3，所以最小值为 3，取等函数唯一。</p>` }
  ],
  extensions: [
    { id: "i6-e1", lv: "延伸", src: "自编：中值点极限的条件不能省", stmt: R`<p>对 $f(t)=t^m$（整数 $m\ge2$）及区间 $[0,h]$，$h\gt0$，求满足 $\int_0^hf(t)dt=f(\xi)h$ 的中值点 $\xi$，并算 $\xi/h$。</p><p>这与真题中相对位置趋于 $1/2$ 矛盾吗？</p>`, hints: [R`积分平均值是 h^m/(m+1)。`, R`在 [0,h] 上 t^m 严格递增，因此 ξ 唯一。`, R`$\xi=h(m+1)^{-1/m}$；本题 f′(0)=0，而真题要求 L>0。`], method: "m-int-meanpoint", sol: R`<p>$\xi^m=h^m/(m+1)$，所以 $\xi=h(m+1)^{-1/m}$，$\xi/h=(m+1)^{-1/m}$，例如 $m=2$ 时为 $1/\sqrt3$。</p><p>没有矛盾：此时 $f'(0)=0$，不满足真题的 $L\gt0$。首个非零项从 $m$ 阶开始，积分后的系数是 $1/(m+1)$，中值点相对位置随该阶数改变。积分中值定理本身并不指定几何中点。</p>` }
  ]
},

im1: {
  unit: "improper", n: 1, title: "反常积分：分清端点，再判阶",
  goal: "会把每个反常点单独拆开；记住无穷远与有限端点的 p 型判别方向相反。30 分钟做概念、基础与 2022 秋期末 4(2)，振荡真题留作延伸。",
  sections: [
    { id: "im1-s1", h: "1. 反常积分是极限，多个坏点分别处理", html: R`<p>无穷区间定义为 $\int_a^\infty f=\lim_{R\to\infty}\int_a^R f$；若 $f$ 在有限端点 $a$ 附近无界，定义为 $\int_a^b f=\lim_{\varepsilon\to0^+}\int_{a+\varepsilon}^b f$。只有极限为有限实数才叫收敛。</p><p>若两端都反常，必须选内点 $c$，分别要求 $\int_a^c f$ 与 $\int_c^b f$ 收敛；内部有奇点也要左右分开。<b>不能把两个发散量同步截断后相消。</b>例如 $\int_{-1}^1dx/x$ 不收敛，尽管对称挖去 $(-\varepsilon,\varepsilon)$ 后积分为 0；后者只是主值。</p>` },
    { id: "im1-s2", h: "2. 两张 p 型判别表，不能背反", html: R`<p>直接计算截断积分可得：</p>$$\int_1^\infty x^{-p}\,dx\text{ 收敛}\iff p\gt1,\qquad \int_0^1 x^{-p}\,dx\text{ 收敛}\iff p\lt1.$$
      <p>$p=1$ 两处都以对数发散。更一般地，有限端点若 $f(x)\sim C(x-a)^q$（$C\ne0$），绝对可积的条件是 $q\gt-1$；无穷远若 $|f(x)|\sim Cx^{-p}$（$C\gt0$），条件是 $p\gt1$。</p><p>比较判别用在非负函数上。若比较的是有符号函数，先对绝对值比较可证明绝对收敛；<b>绝对值发散不能直接推出原积分发散</b>，因为正负振荡可能抵消。</p>` },
    { id: "im1-s3", h: "3. Taylor 判阶：先消去，再比较", html: R`<p>在有限反常点，把函数展开到首个非零项；在无穷远，常令 $t=1/x$ 看小量。比如 $1-\cos x\sim x^2/2$，因此 $(1-\cos x)/x^p\sim x^{2-p}/2$，在 0 附近可积当且仅当 $p\lt3$。</p><p>若要证明发散，写出一个<b>下界</b>；要证明绝对收敛，写出绝对值的<b>上界</b>。写“相当于”之后还要说明比较对象在哪个端点可积。工具中截断积分越长，并不能仅凭几个数值断定收敛。</p>` }
  ],
  widget: "improperCutoff",
  concepts: [
    { id: "im1-c1", sec: "im1-s2", q: R`$\int_1^\infty x^{-3/4}dx$ 与 $\int_0^1x^{-3/4}dx$ 的结论依次是：`, opts: [R`收敛、收敛`,R`发散、收敛`,R`收敛、发散`,R`发散、发散`], a: 1, ex: R`同一个指数，在无穷远需 $p\gt1$，在 0 附近需 $p\lt1$；两者不能交换。` },
    { id: "im1-c2", sec: "im1-s1", q: R`因为 $\int_{-1}^{-\varepsilon}dx/x+\int_\varepsilon^1dx/x=0$，所以：`, opts: [R`原反常积分收敛为 0`,R`原积分绝对收敛`,R`只证明对称主值为 0，原积分不收敛`,R`两侧积分都收敛`], a: 2, ex: R`左侧趋于 $-\infty$，右侧趋于 $+\infty$，不满足两侧分别收敛的定义。` },
    { id: "im1-c3", sec: "im1-s3", q: R`$\int_0^1(1-\cos x)x^{-p}dx$ 的收敛条件是：`, opts: [R`$p\lt1$`,R`$p\gt1$`,R`$p\lt3$`,R`$p\gt3$`], a: 2, ex: R`被积函数与 $x^{2-p}/2$ 等价，有限端点可积要求 $2-p\gt-1$，即 $p\lt3$。` },
    { id: "im1-c4", sec: "im1-s2", q: R`已知 $\int_a^\infty |f|$ 发散，可以立即断言：`, opts: [R`$\int_a^\infty f$ 发散`,R`$\int_a^\infty f$ 收敛`,R`$\int_a^\infty f$ 不绝对收敛，但仍可能条件收敛`,R`$f$ 必恒正`], a: 2, ex: R`例如振荡积分可能收敛，而绝对值积分发散。必须进一步检查符号与抵消。` }
  ],
  methods: [{ id: "m-im-endpoints", title: "反常积分判别：拆点、首项、比较", steps: [R`列出全部反常点：无穷远、无界端点、内部奇点。多个坏点分别截断。`,R`在每个坏点求首个非零等价项；正函数比较，符号变化时先检查绝对值。`,R`无穷远与 $x^{-p}$ 比较需 $p\gt1$；有限端点与 $(x-a)^q$ 比较需 $q\gt-1$。`,R`只有每个坏点都通过，整体才收敛；临界指数不能略过。`] }],
  problems: [
    { id: "im1-p1", lv: "基础", src: "自编：同一积分的两个端点", stmt: R`判断 $\displaystyle\int_0^\infty\frac{dx}{\sqrt{x}(1+x)}$ 是否收敛，不要求计算。`, hints: [R`在 1 处分成两段，分别检查 0 与无穷远。`,R`$x\to0^+$ 时与 $x^{-1/2}$ 等价。`,R`$x\to\infty$ 时与 $x^{-3/2}$ 等价。`], method: "m-im-endpoints", sol: R`<p>在 0 附近指数为 $-1/2\gt-1$，所以 $\int_0^1$ 收敛；在无穷远为 $x^{-3/2}$，其幂指数 $p=3/2\gt1$，所以 $\int_1^\infty$ 收敛。因此原积分收敛（且为正函数，等于绝对收敛）。</p><p>也可直接给上界：在 $(0,1]$ 上被积函数 $\le x^{-1/2}$；在 $[1,\infty)$ 上 $\le x^{-3/2}$。</p>` },
    { id: "im1-p2", lv: "真题", src: "2022 秋期末 4(2)（mathsdream 试卷）", stmt: R`判断瑕积分 $\displaystyle\int_0^{\pi/4}\frac{dx}{1-\tan x}$ 的收敛发散性。`, hints: [R`唯一坏点是 $x\to(\pi/4)^-$，分母趋于 0。`,R`令 $h=\pi/4-x$，$\tan(\pi/4-h)=1-2h+o(h)$。`,R`被积函数与 $1/[2(\pi/4-x)]$ 等价，这是有限端点的临界指数。`], method: "m-im-endpoints", sol: R`<p>$\tan$ 在 $\pi/4$ 处的导数为 $\sec^2(\pi/4)=2$，故 $1-\tan x=2(\pi/4-x)+o(\pi/4-x)$。因此</p>$$\lim_{x\to(\pi/4)^-}\frac{1/(1-\tan x)}{1/(\pi/4-x)}=\frac12.$$
      <p>被积函数在 $[0,\pi/4)$ 为正，比较对象的积分对数发散。由正函数极限比较，原瑕积分发散到 $+\infty$。端点公式 $F(b)-F(a)$ 不能绕过这个极限。</p>` }
  ],
  variants: [
    { id: "im1-v1", lv: "变种", src: "自编：抵消改变临界指数", stmt: R`对实数 $p$，判断 $\displaystyle\int_0^1\frac{\ln(1+x)-x+x^2/2}{x^p}\,dx$ 何时收敛。`, hints: [R`先展开到三阶，前两阶已相消。`,R`分子 $=x^3/3+o(x^3)$。`,R`有限端点比较 $x^{3-p}$，临界值是 $3-p=-1$。`], method: "m-im-endpoints", sol: R`<p>由 $\ln(1+x)=x-x^2/2+x^3/3+o(x^3)$，被积函数与 $x^{3-p}/3$ 等价，在 0 的某邻域恒正。因此当且仅当 $3-p\gt-1$，即 $p\lt4$ 时收敛；$p=4$ 对数发散，$p\gt4$ 也发散。</p><p>分子在 $(0,1]$ 上为正亦可由其导数 $1/(1+x)-1+x=x^2/(1+x)\gt0$ 核对。</p>` },
    { id: "im1-v2", lv: "变种", src: "自编：对数临界修正", stmt: R`对实数 $q$，判断 $\displaystyle\int_e^\infty\frac{dx}{x(\ln x)^q}$ 何时收敛，并求收敛时的值。`, hints: [R`令 $u=\ln x$。`,R`积分化为 $\int_1^\infty u^{-q}du$。`,R`无穷远 p 型判别，$q=1$ 要单独处理。`], method: "m-im-endpoints", sol: R`<p>先在有限上限 $R$ 上换元 $u=\ln x$，再令 $R\to\infty$，得到 $\int_1^\infty u^{-q}du$。它当且仅当 $q\gt1$ 收敛，值为 $1/(q-1)$。$q=1$ 是 $\ln u$ 发散；$q\lt1$ 为幂次发散。</p>` }
  ],
  extensions: [
    { id: "im1-e1", lv: "延伸", src: "2025 秋期末 A 卷 2(2)（mathsdream 扫描原卷）", stmt: R`判断反常积分 $\displaystyle\int_0^\infty\sin(x^2)\,dx$ 的敛散性：发散、绝对收敛、条件收敛三者之一，并证明。`, hints: [R`0 处连续，不是反常点；令 $u=x^2$，尾积分化为 $\frac12\int \sin u/\sqrt{u}\,du$。`,R`对尾积分分部：$\int_A^B\sin u/\sqrt{u}\,du=[-\cos u/\sqrt{u}]_A^B-\frac12\int_A^B\cos u/u^{3/2}\,du$。`,R`绝对值在每段 $[k\pi+\pi/6,k\pi+5\pi/6]$ 上，$|\sin u|\ge1/2$，贡献至少常数倍 $1/\sqrt{k+1}$；前 N 段的和无界。`], method: "m-im-endpoints", sol: R`<p>在 0 附近函数连续，只需处理无穷远。换元 $u=x^2$ 后为 $\frac12\int_0^\infty\sin u/\sqrt u\,du$；0 附近 $\sin u/\sqrt u\sim\sqrt u$ 可积。</p><p>在 $[1,R]$ 上分部：</p>$$\int_1^R\frac{\sin u}{\sqrt u}\,du=\left[-\frac{\cos u}{\sqrt u}\right]_1^R-\frac12\int_1^R\frac{\cos u}{u^{3/2}}\,du.$$
      <p>边界项有有限极限，余下积分由 $|\cos u|u^{-3/2}\le u^{-3/2}$ 绝对收敛，所以原积分收敛。</p><p>对绝对值，取 $k\ge1$，在 $I_k=[k\pi+\pi/6,k\pi+5\pi/6]$ 上有 $|\sin u|\ge1/2$，故 $\int_{I_k}|\sin u|/\sqrt u\,du\ge\pi/[3\sqrt{(k+1)\pi}]$。前 N 段的下界至少为 $\sqrt\pi N/[3\sqrt{N+1}]\to\infty$，所以绝对值积分发散。结论是<b>条件收敛</b>，不要求计算其值。</p>` }
  ]
},
/* ---------------- IM2 ---------------- */
im2: {
  unit: "improper", n: 2, title: "反常积分计算：Beta 型与截断换元",
  goal: "先确定参数范围，再在有限区间上换元或分部，最后核对边界项。以 2021 秋期末 2 的 Beta 型为主线，避免把无穷端点直接代进公式。",
  sections: [
    { id: "im2-s1", h: "1. 参数范围先行：Beta 的两个端点", html: R`<p>2021 秋期末 2 定义</p>$$B(\alpha,\beta)=\int_0^\infty\frac{y^{\alpha-1}}{(1+y)^{\alpha+\beta}}\,dy.$$
      <p>实参数下被积式在 $y\gt0$ 恒正。$y\to0^+$ 时与 $y^{\alpha-1}$ 等价，要求 $\alpha\gt0$；$y\to\infty$ 时与 $y^{-\beta-1}$ 等价，要求 $\beta\gt0$。因此<b>收敛当且仅当 $\alpha,\beta\gt0$</b>，边界 0 不能包含。</p><p>“先求值、再看公式是否有意义”会漏掉发散参数。后续等式都在已确认的收敛范围内使用。</p>` },
    { id: "im2-s2", h: "2. 换元把无穷区间压到 (0,1)", html: R`<p>令 $x=y/(1+y)$，则 $y=x/(1-x)$、$dy=dx/(1-x)^2$，得到</p>$$B(\alpha,\beta)=\int_0^1x^{\alpha-1}(1-x)^{\beta-1}\,dx.$$
      <p>严谨写法：先把 $y$ 限在 $[\varepsilon,R]$，其对应端点是 $\varepsilon/(1+\varepsilon)$ 与 $R/(1+R)$，用普通换元公式；再分别取极限。由 $x\mapsto1-x$ 立即得对称性 $B(\alpha,\beta)=B(\beta,\alpha)$。</p>` },
    { id: "im2-s3", h: "3. 分部递推：边界为零要说明", html: R`<p>在 $\alpha,\beta\gt0$ 时，令 $u=y^\alpha$、$dv=(1+y)^{-\alpha-\beta-1}dy$，可得</p>$$B(\alpha+1,\beta)=\frac\alpha{\alpha+\beta}B(\alpha,\beta).$$
      <p>分部边界为 $y^\alpha(1+y)^{-\alpha-\beta}$：在 0 处趋于 0，在无穷远与 $y^{-\beta}$ 同阶也趋于 0。<b>边界项趋零用到了两个参数严格为正。</b></p><p>若 $m,n$ 为正整数，$B(1,n)=1/n$，反复递推得 $B(m,n)=(m-1)!(n-1)!/(m+n-1)!$。这是由积分推出来的公式，不需要 Gamma 函数。</p>` }
  ],
  widget: null,
  concepts: [
    { id: "im2-c1", sec: "im2-s1", q: R`$B(\alpha,\beta)$ 的收敛范围是：`, opts: [R`$\alpha,\beta\ge0$`,R`$\alpha\gt0,\beta\gt0$`,R`$\alpha+\beta\gt0$`,R`$\alpha\gt1,\beta\gt1$`], a: 1, ex: R`0 与无穷远分别控制 $\alpha$、$\beta$；任一参数为 0 都出现对数发散。` },
    { id: "im2-c2", sec: "im2-s2", q: R`令 $x=y/(1+y)$ 后，$dy$ 是：`, opts: [R`$(1-x)^{-1}dx$`,R`$(1-x)^{-2}dx$`,R`$(1+x)^{-2}dx$`,R`$(1-x)^2dx$`], a: 1, ex: R`由 $y=x/(1-x)$ 求导，$dy/dx=1/(1-x)^2$，不能漏掉这一平方。` },
    { id: "im2-c3", sec: "im2-s3", q: R`递推中的分部边界 $y^\alpha/(1+y)^{\alpha+\beta}$ 在无穷远与什么同阶？`, opts: [R`$y^\alpha$`,R`$y^{-\alpha}$`,R`$y^{-\beta}$`,R`$y^{-\alpha-\beta}$`], a: 2, ex: R`分子分母的幂次相减，剩下 $-\beta$。所以 $\beta\gt0$ 才能让这一边界趋零。` },
    { id: "im2-c4", sec: "im2-s3", q: R`$\int_0^1x^2(1-x)^2dx=B(3,3)$ 等于：`, opts: [R`$1/6$`,R`$1/12$`,R`$1/30$`,R`$1/60$`], a: 2, ex: R`$2!2!/5!=4/120=1/30$；直接展开 $x^2-2x^3+x^4$ 也可核对。` }
  ],
  methods: [{ id: "m-im-beta", title: "Beta 型：参数、换元、递推", steps: [R`先检查 0 与无穷远的指数，写出 $\alpha,\beta\gt0$。`,R`匹配 $y^{\alpha-1}/(1+y)^{\alpha+\beta}$，必要时先做缩放；或换元 $x=y/(1+y)$。`,R`分部在有限截断区间做，逐项确认边界极限，再用递推。`,R`正整数参数可化为阶乘；用对称性和直接多项式积分复核小例。`] }],
  problems: [
    { id: "im2-p1", lv: "真题", src: "2021 秋期末 2(1)–(3)（mathsdream 试卷）", stmt: R`<p>设实数 $\alpha,\beta$，令 $B(\alpha,\beta)=\int_0^\infty y^{\alpha-1}(1+y)^{-\alpha-\beta}dy$。</p><p>(1) 判断何时收敛。(2) 在收敛时用分部积分证明 $B(\alpha+1,\beta)=\alpha B(\alpha,\beta)/(\alpha+\beta)$。(3) 用换元证明 $B(\alpha,\beta)=\int_0^1x^{\alpha-1}(1-x)^{\beta-1}dx$。</p>`, hints: [R`(1) 两端等价于 $y^{\alpha-1}$ 与 $y^{-\beta-1}$。`,R`(2) 取 $u=y^\alpha$，$dv=(1+y)^{-\alpha-\beta-1}dy$，先在 $[\varepsilon,R]$ 上分部。`,R`(3) 令 $y=x/(1-x)$，逐项合并 $(1-x)$ 的幂次。`], method: "m-im-beta", sol: R`<p>(1) 由两端 p 型判别，收敛当且仅当 $\alpha\gt0$ 且 $\beta\gt0$。</p><p>(2) 在有限截断区间分部，再取极限：</p>$$B(\alpha+1,\beta)=\left[-\frac{y^\alpha}{(\alpha+\beta)(1+y)^{\alpha+\beta}}\right]_0^\infty+\frac\alpha{\alpha+\beta}\int_0^\infty\frac{y^{\alpha-1}}{(1+y)^{\alpha+\beta}}dy.$$
      <p>0 端因 $\alpha\gt0$、无穷端因 $\beta\gt0$，边界均为 0，故得递推。</p><p>(3) $y=x/(1-x)$ 时，$y^{\alpha-1}(1+y)^{-\alpha-\beta}dy=x^{\alpha-1}(1-x)^{\beta-1}dx$。截断端点分别趋于 0、1，得所求公式。所有取极限都由 (1) 的收敛性保证。</p>` },
    { id: "im2-p2", lv: "基础", src: "自编：参数识别与缩放", stmt: R`计算 $\displaystyle\int_0^\infty\frac{x^2}{(1+x)^5}dx$ 与 $\displaystyle\int_0^\infty\frac{dx}{\sqrt{x}(1+x)}$。`, hints: [R`第一题是 $B(3,2)$。`,R`第二题令 $x=t^2$，$dx=2t\,dt$。`,R`第一题 $2!1!/4!$；第二题 $2\int_0^\infty dt/(1+t^2)$。`], method: "m-im-beta", sol: R`<p>第一题 $=B(3,2)=2!1!/4!=1/12$。两端分别与 $x^2$、$x^{-3}$ 等价，均可积。</p><p>第二题已在 im1 判定收敛。令 $x=t^2$，积分为 $2\int_0^\infty dt/(1+t^2)=2[\arctan t]_0^\infty=\pi$。这也给出 $B(1/2,1/2)=\pi$。</p>` }
  ],
  variants: [
    { id: "im2-v1", lv: "变种", src: "自编：一般有理幂参数", stmt: R`设 $a\gt0$，判断并计算 $\displaystyle\int_0^\infty\frac{x^2}{(a+x)^5}dx$。`, hints: [R`令 $x=ay$。`,R`分子给 $a^2$、微分给 $a$、分母给 $a^5$。`,R`剩下 $a^{-2}B(3,2)$。`], method: "m-im-beta", sol: R`<p>因 $a\gt0$，0 附近是有界函数，无穷远为 $x^{-3}$，所以收敛。换元 $x=ay$ 得 $a^{-2}\int_0^\infty y^2/(1+y)^5dy=1/(12a^2)$。缩放因子是 $a^{-2}$，可以用量纲幂次再次核对。</p>` },
    { id: "im2-v2", lv: "变种", src: "自编：对称性与分拆", stmt: R`对 $\alpha,\beta\gt0$，证明 $B(\alpha+1,\beta)+B(\alpha,\beta+1)=B(\alpha,\beta)$，并由此求 $B(2,4)$。`, hints: [R`用 (0,1) 上的表示，把两个被积式提取公因子。`,R`多出来的因子是 $x+(1-x)=1$。`,R`$B(2,4)=1!3!/5!$。`], method: "m-im-beta", sol: R`<p>两项在 $(0,1)$ 的被积式相加为 $x^{\alpha-1}(1-x)^{\beta-1}[x+(1-x)]$，所以积分和等于 $B(\alpha,\beta)$。所有积分均收敛，线性性可合法取极限。</p><p>$B(2,4)=1!3!/5!=1/20$。亦由递推 $B(2,4)=\frac15B(1,4)=\frac15\cdot\frac14$ 核对。</p>` }
  ],
  extensions: [
    { id: "im2-e1", lv: "延伸", src: "自编：推广到 x 的幂", stmt: R`设 $r\gt0$、$m,n$ 为实数，判断 $I=\int_0^\infty x^{m-1}/(1+x^r)^n\,dx$ 何时收敛，并在收敛时用 Beta 表示。`, hints: [R`0 端的幂是 $m-1$，无穷远的幂是 $m-1-rn$。`,R`令 $y=x^r$，$dx=(1/r)y^{1/r-1}dy$。`,R`对应参数 $\alpha=m/r$、$\beta=n-m/r$。`], method: "m-im-beta", sol: R`<p>0 端可积要求 $m\gt0$；无穷端可积要求 $m-1-rn\lt-1$，即 $m\lt rn$。所以收敛当且仅当 $0\lt m\lt rn$（这也迫使 $n\gt0$）。</p><p>令 $y=x^r$ 得 $I=\frac1r\int_0^\infty y^{m/r-1}(1+y)^{-n}dy=\frac1rB(m/r,n-m/r)$。临界 $m=0$ 或 $m=rn$ 均对数发散，不能由 Beta 的形式延拓为积分值。</p>` }
  ]
},
/* ---------------- AP1 ---------------- */
ap1: {
  unit: "applications", n: 1, title: "积分求面积：直角坐标与极坐标",
  goal: "先画清区域、确定边界与扫过次数，再列面积积分。主线做两曲线面积与 2025 秋期末 A 卷 4 的第一象限环；极坐标中始终记住扇形面积的 1/2。",
  sections: [
    { id: "ap1-s1", h: "1. 面积是非负的：先求交点，再分上减下", html: R`<p>若区域在 $a\le x\le b$ 上由上边界 $f$、下边界 $g$ 围成，则面积为 $\int_a^b[f(x)-g(x)]dx$。若上下顺序改变，先按交点分段，或写 $\int_a^b|f-g|dx$。</p><p>不必总沿 $x$ 切片：若能写成右边界 $x=\phi(y)$、左边界 $x=\psi(y)$，则用 $\int_c^d[\phi(y)-\psi(y)]dy$。<b>曲线交点只确定积分范围；谁在上、谁在右还要另行判断。</b></p>` },
    { id: "ap1-s2", h: "2. 极坐标面积：每一小块是扇形", html: R`<p>在一段角区间中，若射线从原点到边界 $r=r(\theta)\ge0$ 恰扫过区域一次，则</p>$$A=\frac12\int_\alpha^\beta r(\theta)^2\,d\theta.$$
      <p>两条极坐标曲线之间的面积为 $\frac12\int(r_{\mathrm{外}}^2-r_{\mathrm{内}}^2)d\theta$，前提是该角区间中内外关系已确定。若曲线用负半径表示或重复描迹，不能不加检查地把一整周期都积分。</p><p>代入 $x=r\cos\theta,y=r\sin\theta$ 后，若约去 $r$，要单独保留原点。零半径的边界点虽不贡献面积，却可能是闭合环的接点。</p>` },
    { id: "ap1-s3", h: "3. 2025 真题：先证明第一象限形成一条有界环", html: R`<p>对 $x^3+y^3=3xy$，第一象限非原点处有</p>$$r(\theta)=\frac{3\cos\theta\sin\theta}{\cos^3\theta+\sin^3\theta},\qquad0\lt\theta\lt\frac\pi2.$$
      <p>分母在闭角区间上严格正，$r$ 连续且有界，内部严格正，两端极限都为 0。因此每条第一象限射线恰与非零边界相交一次，曲线从原点出发再回到原点，围出有界区域。</p><p>令 $t=\tan\theta$，得到边界参数 $x=3t/(1+t^3)$、$y=3t^2/(1+t^3)$。在面积式中有</p>$$r^2d\theta=\frac{9t^2}{(1+t^3)^2}\,dt,$$
      <p>于是复杂的极坐标面积化成一元有理函数积分。交互工具按角度逐步扫过，读数显示尚未扫完时的部分面积。</p>` }
  ],
  widget: "polarAreaPlay",
  concepts: [
    { id: "ap1-c1", sec: "ap1-s1", q: R`曲线 $y=x$ 与 $y=x^2$ 在 $[0,1]$ 围成的面积应写为：`, opts: [R`$\int_0^1(x^2-x)dx$`,R`$\int_0^1(x-x^2)dx$`,R`$\int_0^1x^3dx$`,R`$\frac12\int_0^1(x-x^2)dx$`], a: 1, ex: R`在 $0\le x\le1$ 上 $x\ge x^2$，面积是上边界减下边界，不多乘 1/2。` },
    { id: "ap1-c2", sec: "ap1-s2", q: R`极坐标面积式的基本小量是：`, opts: [R`$r\,d\theta$`,R`$r^2d\theta$`,R`$\frac12r^2d\theta$`,R`$\frac12r\,d\theta$`], a: 2, ex: R`半径 $r$、小圆心角 $d\theta$ 的扇形面积为 $r^2d\theta/2$。` },
    { id: "ap1-c3", sec: "ap1-s3", q: R`第一象限环的角区间应取：`, opts: [R`$[0,\pi/2]$`,R`$[0,\pi]$`,R`$[0,2\pi]$`,R`任意长度为 $2\pi$ 的区间`], a: 0, ex: R`第一象限非零点的极角在 $(0,\pi/2)$，两端半径趋零。此区间已恰好描一次环。` },
    { id: "ap1-c4", sec: "ap1-s2", q: R`套 $A=\frac12\int r^2$ 之前，最需要核对的是：`, opts: [R`$r$ 是否有初等原函数`,R`角区间是否恰好扫过目标区域一次`,R`$r$ 必须单调`,R`曲线必须关于原点对称`], a: 1, ex: R`重复描迹会把面积重复计算，单调性与对称性都不是必要条件。` }
  ],
  methods: [{ id: "m-ap-area", title: "求面积：区域、边界、一次扫过", steps: [R`先找交点、端点和原点，说明目标是哪块区域。`,R`选竖条的上减下、横条的右减左，或极坐标的扇形面积。`,R`核对分段、内外边界和描迹次数；极坐标公式带 1/2。`,R`算完用非负性、对称性、包围矩形作粗检。`] }],
  problems: [
    { id: "ap1-p1", lv: "基础", src: "自编：上下边界交换", stmt: R`求 $y=x$ 与 $y=x^3$ 围成的全部有限区域的总面积。`, hints: [R`交点由 $x=x^3$ 得 $x=-1,0,1$。`,R`两部分关于原点对称，面积相等；在 $(0,1)$ 上 $x\gt x^3$。`,R`总面积为 $2\int_0^1(x-x^3)dx$。`], method: "m-ap-area", sol: R`<p>三交点将有界区域分成两块。右边一块面积 $\int_0^1(x-x^3)dx=1/2-1/4=1/4$。左边一块由中心对称具有相同面积，因此总面积为 $1/2$。</p><p>直接算 $\int_{-1}^1(x-x^3)dx=0$ 是带符号相消，不能表示两块的总面积。</p>` },
    { id: "ap1-p2", lv: "真题", src: "2025 秋期末 A 卷 4(1)–(3)（mathsdream 扫描原卷）", stmt: R`<p>(1) 写出平面曲线 $x^3+y^3=3xy$ 的极坐标方程。</p><p>(2) 证明它在第一象限围成一个有界区域 $D$。</p><p>(3) 求 $D$ 的面积。（提示：令 $t=\tan\theta$ 换元，其中 $\theta$ 是极角。）</p>`, hints: [R`代入 $x=r\cos\theta,y=r\sin\theta$，先保留 $r=0$，非零点再约去 $r^2$。`,R`第一象限分母 $\cos^3\theta+\sin^3\theta$ 始终正；半径内部为正、两端趋零。`,R`$A=\frac92\int_0^\infty t^2/(1+t^3)^2dt$，再令 $u=1+t^3$。`], method: "m-ap-area", sol: R`<p>(1) 原点 $r=0$ 在曲线上；非零点满足 $r(\cos^3\theta+\sin^3\theta)=3\cos\theta\sin\theta$。在第一象限，$r=3\cos\theta\sin\theta/(\cos^3\theta+\sin^3\theta)$。</p><p>(2) 在 $[0,\pi/2]$ 上分母严格正，半径连续有界，内部正、两端为 0。不同内部角度对应不同射线，故非零边界点互不重复，曲线只在两端回到原点，围成 $D=\{(r,\theta):0\le\theta\le\pi/2,0\le r\le r(\theta)\}$，该区域有界。</p><p>(3) 令 $t=\tan\theta$，有 $r=3t\sqrt{1+t^2}/(1+t^3)$、$d\theta=dt/(1+t^2)$，所以</p>$$A=\frac12\int_0^{\pi/2}r^2d\theta=\frac92\int_0^\infty\frac{t^2}{(1+t^3)^2}dt=\frac32\int_1^\infty u^{-2}du=\frac32.$$
      <p>换元的无穷上限取极限处理；新积分收敛，答案为正。</p>` }
  ],
  variants: [
    { id: "ap1-v1", lv: "变种", src: "自编：曲线的尺度变化", stmt: R`设 $a\gt0$，求 $x^3+y^3=3axy$ 在第一象限围成的有界环面积。`, hints: [R`令 $x=aX,y=aY$。`,R`新曲线是 $X^3+Y^3=3XY$。`,R`面积随长度尺度的平方变化。`], method: "m-ap-area", sol: R`<p>缩放后回到真题曲线，$dx\,dy=a^2dX\,dY$，因此面积为 $a^2\cdot3/2=3a^2/2$。</p><p>也可直接用半径 $r_a(\theta)=a r_1(\theta)$，代入极坐标面积式得到同一结论。</p>` },
    { id: "ap1-v2", lv: "变种", src: "自编：两圆的公共面积", stmt: R`求圆盘 $x^2+y^2\le1$ 与 $(x-1)^2+y^2\le1$ 的公共面积。`, hints: [R`第二个圆盘在极坐标中是 $0\le r\le2\cos\theta$，需 $\cos\theta\ge0$。`,R`公共部分半径为 $\min(1,2\cos\theta)$，对称于 x 轴；切换角为 $\pi/3$。`,R`面积 $=\int_0^{\pi/3}1\,d\theta+\int_{\pi/3}^{\pi/2}4\cos^2\theta\,d\theta$。`], method: "m-ap-area", sol: R`<p>由 $r^2-2r\cos\theta\le0$ 得第二圆盘的非零半径范围 $r\le2\cos\theta$。利用上下对称与面积式中的 1/2，公共面积为</p>$$A=\int_0^{\pi/3}d\theta+4\int_{\pi/3}^{\pi/2}\cos^2\theta\,d\theta=\frac\pi3+\left[2\theta+\sin2\theta\right]_{\pi/3}^{\pi/2}=\frac{2\pi}3-\frac{\sqrt3}2.$$
      <p>约为 1.228，小于任一圆盘面积 $\pi$，数量级合理。</p>` }
  ],
  extensions: [
    { id: "ap1-e1", lv: "延伸", src: "自编：描迹次数陷阱", stmt: R`曲线 $r=\cos\theta$ 表示哪个圆？为什么把 $\frac12\int_0^{2\pi}\cos^2\theta\,d\theta=\pi/2$ 当作面积会多一倍？给出正确积分区间与面积。`, hints: [R`由 $r^2=r\cos\theta$ 得 $x^2+y^2=x$。`,R`圆心 $(1/2,0)$，半径 $1/2$；$\theta\in[-\pi/2,\pi/2]$ 时半径非负，描一次。`,R`长度 $2\pi$ 的角区间中，负半径对应另一方向，整个圆被重复描了两次。`], method: "m-ap-area", sol: R`<p>曲线为 $(x-1/2)^2+y^2=1/4$，几何面积是 $\pi/4$。取 $-\pi/2\le\theta\le\pi/2$，$r\ge0$ 且恰描一次，面积为 $\frac12\int_{-\pi/2}^{\pi/2}\cos^2\theta\,d\theta=\pi/4$。</p><p>若取 $[0,2\pi]$，含负半径的半段又把同一圆重描了一遍，扇形积分累计了两遍，所以得到 $\pi/2$。极坐标面积必须先检查一次扫过的范围。</p>` }
  ]
},
