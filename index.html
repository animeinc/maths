    {
      id: R`i3-s2`,
      h: R`2. 有理函数：部分分式、配方与配对`,
      html: R`
<p><b>这节解决什么</b>：被积函数是两个多项式相除（<b>有理函数</b>）时，把它拆成几个简单分式的和，每一项都能直接积分。</p>
<p><b>步骤</b>：①若分子次数 $\ge$ 分母次数（假分式），先做多项式除法；②把分母分解成一次因子和<b>不可约二次因子</b>（判别式 $\lt0$，不能再分解的二次式）；③一次因子上面设常数，不可约二次因子上面设一次式 $Bx+C$；④求待定系数。</p>
<p><b>例</b>：$1+x^3=(1+x)(x^2-x+1)$（$x^2-x+1$ 的判别式 $1-4\lt0$，不可约）。设 $\frac1{1+x^3}=\frac{A}{1+x}+\frac{Bx+C}{x^2-x+1}$，通分得 $1=A(x^2-x+1)+(Bx+C)(1+x)$。代 $x=-1$：$1=3A$，$A=\frac13$；比较 $x^2$ 系数：$0=A+B$，$B=-\frac13$；比较常数项：$1=A+C$，$C=\frac23$。所以</p>
$$\frac1{1+x^3}=\frac{1/3}{1+x}+\frac{-\frac13x+\frac23}{x^2-x+1}.$$
<p><b>二次因子那一项怎么积</b>：把分子拆成“分母导数的倍数 + 常数”。分母导数是 $2x-1$，$-\frac13x+\frac23=-\frac16(2x-1)+\frac12$。前一部分积出 $\ln$，后一部分配方积出 $\arctan$：</p>
$$\int\frac{dx}{x^2-x+1}=\int\frac{dx}{(x-\frac12)^2+\frac34}=\frac2{\sqrt3}\arctan\frac{2x-1}{\sqrt3}+C.$$
<p><b>配对技巧</b>（2022 电子系期末 1(2)）：$I=\int\frac{dx}{1+x^3}$ 与 $J=\int\frac{x\,dx}{1+x^3}$ 分母相同，先算和与差：</p>
<ul>
<li>$I+J$ 的分子 $1+x$ 正好约掉一次因子：$I+J=\int\frac{dx}{x^2-x+1}$，配方即可。</li>
<li>$I-J=\int\frac{1-x}{1+x^3}dx$，可以直接验证 $$\frac{d}{dx}\Big(\ln|1+x|-\tfrac13\ln|1+x^3|\Big)=\frac1{1+x}-\frac{x^2}{1+x^3}=\frac{(x^2-x+1)-x^2}{1+x^3}=\frac{1-x}{1+x^3}.$$</li>
</ul>
<p>然后 $I=\frac{(I+J)+(I-J)}2$，$J=\frac{(I+J)-(I-J)}2$。</p>
<p><b>答案的区间</b>：被积函数在 $x=-1$ 无定义，原函数分别在 $(-\infty,-1)$ 与 $(-1,+\infty)$ 上成立，两段的常数 $C$ 可以不同。</p>`
    },
    {
      id: R`i3-s3`,
      h: R`3. 牛顿–莱布尼兹的前提：原函数在整个区间上连续`,
      html: R`
<p><b>这节解决什么</b>：用牛顿–莱布尼兹公式 $\int_a^bf=F(b)-F(a)$ 之前，要确认 $F$ 是“整个区间上的”原函数。半角代换得到的原函数经常在区间中间断开，直接代端点会算错。</p>
<p><b>公式的前提</b>：$F$ 在 $[a,b]$ 上<b>连续</b>，且在 $(a,b)$ 内每一点 $F'=f$。</p>
<p><b>反面例子</b>：$a\gt b\gt0$ 时，半角代换给出</p>
$$F(\theta)=\frac2{\sqrt{a^2-b^2}}\arctan\Big(\sqrt{\tfrac{a+b}{a-b}}\tan\frac\theta2\Big).$$
<p>$\theta\to\pi^-$ 时 $\tan\frac\theta2\to+\infty$，$F\to\frac{\pi}{\sqrt{a^2-b^2}}$；$\theta\to\pi^+$ 时 $\tan\frac\theta2\to-\infty$，$F\to-\frac{\pi}{\sqrt{a^2-b^2}}$。$F$ 在 $\pi$ 处<b>跳了一下</b>。</p>
<ul>
<li>积分区间 $[0,\pi]$：$\pi$ 是端点，用左极限把 $F$ 补成连续的，再用公式即可（2021 期末 5(1) 就是这样做的）。</li>
<li>积分区间 $[0,2\pi]$：若直接写 $F(2\pi)-F(0)=0-0=0$ 就错了——被积函数恒正，积分不可能为 0。正确做法：在 $\pi$ 处分两段算，或给 $\theta\gt\pi$ 的部分加上跳跃量让原函数连续。</li>
</ul>
<p>下面的工具可以看到这个跳跃，以及“数值积分”和“$F(b)-F(a)$”在跨过 $\pi$ 后不再相等。</p>
<p><b>区间再现</b>：令 $x=a+b-t$，有 $\int_a^bf(x)\,dx=\int_a^bf(a+b-x)\,dx$。在 $[0,\pi]$ 上，若 $h(\pi-x)=h(x)$（如 $h$ 只含 $\sin x$ 和 $\cos^2x$），则把 $\int_0^\pi xh(x)\,dx$ 与换元后的 $\int_0^\pi(\pi-x)h(x)\,dx$ 相加，$x+(\pi-x)=\pi$，得 $\int_0^\pi xh(x)\,dx=\frac\pi2\int_0^\pi h(x)\,dx$。</p>
<p><b>认出反三角函数</b>：在 $(-1,1)$ 上 $\arctan\frac{x}{\sqrt{1-x^2}}=\arcsin x$（令 $x=\sin\varphi$ 即见）；在 $(-1,1)$ 上 $\arctan\frac{1-x}{\sqrt{1-x^2}}=\frac12\arccos x$（令 $\varphi=\arccos x$，用半角公式 $\tan\frac\varphi2=\sqrt{\frac{1-\cos\varphi}{1+\cos\varphi}}$）。认出来后，求导、积分都只剩一步。</p>`
    }
  ],

<p>$x-p=B(1-\cos\theta)$，$q-x=B(1+\cos\theta)$，所以 $(x-p)(q-x)=B^2\sin^2\theta$，根号 $=B\sin\theta$（$\sin\theta\ge0$）。$dx=B\sin\theta\,d\theta$。</p>
$$I=\int_0^\pi\frac{B\sin\theta}{A-B\cos\theta}\cdot B\sin\theta\,d\theta=\int_0^\pi\frac{B^2\sin^2\theta}{A-B\cos\theta}\,d\theta.$$
<p><b>第 2 步：拆分子</b>。$B^2\sin^2\theta=B^2-B^2\cos^2\theta=(A^2-B^2\cos^2\theta)+(B^2-A^2)=(A-B\cos\theta)(A+B\cos\theta)+(B^2-A^2)$。所以</p>

<p><b>第 3 步：计算</b>。$\int_0^\pi(A+B\cos\theta)d\theta=A\pi+B[\sin\theta]_0^\pi=A\pi$。由 5(1)（$a=A$，$b=B$）：$\int_0^\pi\frac{d\theta}{A-B\cos\theta}=\frac\pi{\sqrt{A^2-B^2}}$。又 $A^2-B^2=(A-B)(A+B)=pq$：</p>
$$I=A\pi-pq\cdot\frac{\pi}{\sqrt{pq}}=\pi\Big(\frac{p+q}2-\sqrt{pq}\Big).$$
<p><b>答案：$I=\pi\Big(\dfrac{p+q}2-\sqrt{pq}\Big)$。</b>自检：由均值不等式 $\frac{p+q}2\gt\sqrt{pq}$，结果为正；$p=1,q=4$ 时为 $\frac\pi2$，与数值积分一致。</p>`

  goal: R`把积分 $\int_a^xf(t)\,dt$ 看成 $x$ 的函数：会求它的导数（包括上下限都是函数的情形），会算含积分的 $\frac00$ 型极限。30 分钟：概念题 + 基础题 + 2023 秋期末 2(1)，变种和证明选做。`,
  sections: [
    {
      id: R`i4-s1`,
      h: R`1. 微积分基本定理：$\int_a^xf$ 的导数就是 $f(x)$`,
      html: R`<p><b>这节解决什么</b>：把积分的上限换成变量 $x$，得到一个新函数 $F(x)=\int_a^xf(t)\,dt$（叫<b>变上限积分</b>，几何上是从 $a$ 到 $x$ 的曲边面积）。我们想知道：$F$ 连续吗？可导吗？导数是什么？</p>
<p><b>记号</b>：$x$ 是<b>自由变量</b>（$F$ 的自变量），$t$ 是<b>积分变量</b>（只在积分内部用，换成别的字母不影响结果）。</p>
<p><b>结论 1（连续）</b>：$f$ 在 $[a,b]$ 上可积 ⇒ $F$ 在 $[a,b]$ 上连续。理由：可积函数有界，设 $|f|\le M$，则 $$|F(y)-F(x)|=\Big|\int_x^yf(t)\,dt\Big|\le M|y-x|.$$</p>
<p><b>结论 2（微积分基本定理）</b>：若 $f$ 在内点 $x$ 处连续，则 $F'(x)=f(x)$。证明思路：</p>
<ol>
<li>差商写成积分：$\frac{F(x+h)-F(x)}h=\frac1h\int_x^{x+h}f(t)\,dt$，即 $f$ 在 $x$ 与 $x+h$ 之间的平均值。</li>
<li>减去 $f(x)=\frac1h\int_x^{x+h}f(x)\,dt$：$$\frac{F(x+h)-F(x)}h-f(x)=\frac1h\int_x^{x+h}\bigl(f(t)-f(x)\bigr)\,dt.$$</li>
<li>右边绝对值 $\le\sup\{|f(t)-f(x)|:t\text{ 在 }x\text{ 与 }x+h\text{ 之间}\}$，由 $f$ 在 $x$ 连续，$h\to0$（正负都行）时趋于 0。</li>
</ol>
<p><b>小例子</b>：$F(x)=\int_0^x\cos t\,dt=\sin x$，确实 $F'(x)=\cos x$，就是把被积函数的 $t$ 换成 $x$。</p>
<p><b>反例（$f$ 不连续时可能不可导）</b>：$f(t)=-1$（$t\lt0$），$f(t)=1$（$t\ge0$）。则 $\int_0^xf(t)\,dt=|x|$，连续但在 0 处不可导（左导数 $-1$，右导数 $1$）。所以：<b>可积 ⇒ $F$ 连续；在 $f$ 的连续点，$F'=f$</b>。端点处只谈单侧导数。工具中的左右差商可以直接看到这个区别。</p>`
    },
    {
      id: R`i4-s2`,
      h: R`2. 上下限都是函数：上限项减下限项，各乘链式导数`,
      html: R`<p><b>这节解决什么</b>：考试常见 $\int_{u(x)}^{v(x)}f(t)\,dt$ 求导。思路是把它拆成两个“变上限积分”的复合，再用链式法则。</p>
<p><b>推导</b>（设 $f$ 连续，$u,v$ 可导）：取 $F(y)=\int_c^yf(t)\,dt$（$c$ 是任一固定点），则 $F'=f$，且 $\int_{u(x)}^{v(x)}f=F(v(x))-F(u(x))$。对 $x$ 求导（链式法则）：</p>
$$\frac d{dx}\int_{u(x)}^{v(x)}f(t)\,dt=f(v(x))\,v'(x)-f(u(x))\,u'(x).$$
<p>口诀：<b>上限代入 × 上限的导数，减去下限代入 × 下限的导数</b>。</p>
<p><b>小例子</b>：$\frac d{dx}\int_x^{x^2}(1+t^2)\,dt$。上限 $v=x^2$，$v'=2x$，$f(v)=1+x^4$；下限 $u=x$，$u'=1$，$f(u)=1+x^2$。结果 $=2x(1+x^4)-(1+x^2)$。即使 $x^2\lt x$（比如 $x=\frac12$）也不用改公式，因为定积分本身带方向：$\int_a^b=-\int_b^a$。</p>
<p><b>被积式里也有 $x$ 时，要先把 $x$ 提出来</b>：$x$ 不是积分变量，对 $t$ 积分时它是常数，可以提到积分号外。例 $H(x)=\int_0^x(x-t)e^t\,dt$：</p>
<ol>
<li>拆开：$H(x)=x\int_0^xe^t\,dt-\int_0^xte^t\,dt$。</li>
<li>第一项用乘积法则：$\bigl(x\int_0^xe^t\,dt\bigr)'=\int_0^xe^t\,dt+x\cdot e^x$；第二项导数为 $xe^x$。</li>
<li>相减：$H'(x)=\int_0^xe^t\,dt+xe^x-xe^x=e^x-1$。</li>
</ol>
<p><b>易错</b>：直接把上限 $x$ 代入被积式得 $(x-x)e^x=0$，就以为 $H'=0$。这样漏掉了被积式随 $x$ 变化的部分。</p>`
    },
    {
      id: R`i4-s3`,
      h: R`3. 含积分的极限：先找“第一个不为零的项”`,
      html: R`<p><b>这节解决什么</b>：$\lim_{x\to0}\frac{\int_0^x(\cdots)dt}{(\cdots)}$ 这类 $\frac00$ 极限。被积函数往往没有初等原函数（如 $e^{-t^2}$），但不需要求出来。两种办法：<b>洛必达</b>（求导把积分号去掉），或<b>先展开被积函数再逐项积分</b>。</p>
<p><b>“阶”和首个非零项</b>：$x\to0$ 时，若 $g(x)=cx^k+o(x^k)$ 且 $c\ne0$，就说 $g$ 是 $k$ 阶无穷小，$cx^k$ 是它的首个非零项。$o(x^k)$ 表示“比 $x^k$ 更高阶的小量”，即除以 $x^k$ 后趋于 0。两个无穷小相除，只需比较首个非零项。</p>
<p><b>逐项积分规则</b>：若 $f(t)=a_0+a_1t+\cdots+a_mt^m+o(t^m)$，则 $$\int_0^xf(t)\,dt=a_0x+\frac{a_1}2x^2+\cdots+\frac{a_m}{m+1}x^{m+1}+o(x^{m+1}).$$ 即<b>每项幂次加 1，系数除以新幂次</b>。余项能这样积分的理由：$x$ 足够小时 $|r(t)|\le\varepsilon|t|^m$，所以 $\bigl|\int_0^xr(t)\,dt\bigr|\le\varepsilon\frac{|x|^{m+1}}{m+1}$。</p>
<p><b>小例子</b>：$e^{-t^2}=1-t^2+o(t^2)$，积分得 $\int_0^xe^{-t^2}dt=x-\frac{x^3}3+o(x^3)$。于是 $\int_0^xe^{-t^2}dt-x=-\frac{x^3}3+o(x^3)$：一次项抵消，首个非零项是 $-\frac{x^3}3$。</p>
<p><b>易错</b>：不能把被积函数只换成首项 1 就算，那样 $\int_0^x1\,dt-x=0$，丢掉了真正起作用的三次项。<b>有抵消时，要展开到抵消后还剩非零项的那一阶</b>。</p>
<p>2023 秋期末 2(1)：分子 $\int_0^xe^{-t^2}dt-x\approx-\frac{x^3}3$，分母 $\sin x-x\approx-\frac{x^3}6$，比值 $\to2$。</p>`
    }
  ],

      src: R`2023 秋期末 1(1)（选连续函数版本）`,
      stmt: R`叙述任意一个版本的 Newton–Leibniz 公式并证明。这里选：若 $f$ 在 $[a,b]$ 连续，$P$ 在 $[a,b]$ 连续且在 $(a,b)$ 可导，$P'=f$，则 $\int_a^bf(x)\,dx=P(b)-P(a)$。`,

        R`构造辅助函数 $F(x)=\int_a^xf(t)\,dt$，由基本定理（本课第 1 节）$F'=f$。`,
        R`令 $\Phi=P-F$：在 $[a,b]$ 连续，在 $(a,b)$ 内 $\Phi'=f-f=0$。`,
        R`对 $\Phi$ 在 $[a,b]$ 上用拉格朗日中值定理：$\Phi(b)-\Phi(a)=\Phi'(\xi)(b-a)=0$。再用 $F(a)=0$，$F(b)=\int_a^bf$。`

      method: R`m-int-moving`,
      sol: R`<p><b>叙述</b>：若 $f$ 在 $[a,b]$ 连续，$P$ 在 $[a,b]$ 连续、在 $(a,b)$ 可导且 $P'=f$，则 $\int_a^bf(x)\,dx=P(b)-P(a)$。</p>
<p><b>证明</b>。令 $F(x)=\int_a^xf(t)\,dt$，$x\in[a,b]$。</p>
<p>① $F$ 连续：$f$ 连续故有界 $|f|\le M$，$|F(y)-F(x)|\le M|y-x|$。</p>
<p>② $F'=f$：对 $x\in(a,b)$，$\Bigl|\frac{F(x+h)-F(x)}h-f(x)\Bigr|=\Bigl|\frac1h\int_x^{x+h}(f(t)-f(x))dt\Bigr|\le\sup_{t\text{ 在 }x,x+h\text{ 之间}}|f(t)-f(x)|\to0$（$f$ 在 $x$ 连续）。</p>
<p>③ 令 $\Phi=P-F$，则 $\Phi$ 在 $[a,b]$ 连续，在 $(a,b)$ 可导，且 $\Phi'=P'-F'=f-f=0$。由拉格朗日中值定理，存在 $\xi\in(a,b)$ 使 $\Phi(b)-\Phi(a)=\Phi'(\xi)(b-a)=0$。</p>
<p>④ 所以 $P(b)-F(b)=P(a)-F(a)$。又 $F(a)=0$，$F(b)=\int_a^bf$，移项得 <b>$\int_a^bf(x)\,dx=P(b)-P(a)$</b>。∎</p>
<p>说明：第②步是直接由差商证的，没有用 Newton–Leibniz 公式本身，避免了循环论证。</p>`

  sections: [
    {
      id: R`i5-s1`,
      h: R`1. Cauchy–Schwarz 不等式：从“平方积分非负”推出`,
      html: R`
<p><b>这节解决什么</b>：要证明“某个积分 $\le$ 另一个积分”，最常用的工具是积分形式的 Cauchy–Schwarz 不等式（简称 Cauchy 不等式）。它把“乘积的积分”控制在“两个平方积分”之下。</p>
<p><b>结论</b>：$f,g$ 在 $[a,b]$ 上连续，则</p>
$$\left|\int_a^bfg\,dx\right|\le\left(\int_a^bf^2\,dx\right)^{1/2}\left(\int_a^bg^2\,dx\right)^{1/2}.$$
<p><b>证明</b>（记 $A=\int f^2$，$B=\int g^2$，$C=\int fg$）：</p>
<ol>
<li>若 $B=0$：$g^2$ 连续、非负、积分为 0，只能 $g\equiv0$，于是 $C=0$，不等式成立。</li>
<li>若 $B\gt0$：对任意常数 $\lambda$，$(f-\lambda g)^2\ge0$，积分得 $0\le A-2\lambda C+\lambda^2B$。</li>
<li>取 $\lambda=\frac CB$（使右边最小）：$0\le A-\frac{2C^2}B+\frac{C^2}B=A-\frac{C^2}B$，即 $C^2\le AB$。</li>
</ol>
<p><b>等号条件</b>：$f,g$ <b>线性相关</b>，即存在不全为零的常数 $u,v$ 使 $uf+vg\equiv0$（例如 $f=3g$，或其中一个恒为 0）。</p>
<p><b>怎样用</b>：关键是把要估计的积分写成“两个因子相乘”。</p>
<ul>
<li>$\int_a^bf=\int_a^bf\cdot1$，得 $\bigl(\int_a^bf\bigr)^2\le(b-a)\int_a^bf^2$。</li>
<li>$f\gt0$ 时，$1=\sqrt f\cdot\frac1{\sqrt f}$，可得 $\int f\cdot\int\frac1f\ge(b-a)^2$。</li>
</ul>
<p><b>小例子</b>：$f(x)=x$ 在 $[0,1]$ 上：$\bigl(\int_0^1x\,dx\bigr)^2=\frac14$，而 $\int_0^1x^2\,dx=\frac13$，确实 $\frac14\le\frac13$；不相等是因为 $x$ 不是常数（与 1 不成比例）。</p>`
    },
    {
      id: R`i5-s2`,
      h: R`2. 分母有 $x$ 时先检查：$F(x)/x$ 在 0 附近有极限`,
      html: R`
<p><b>这节解决什么</b>：真题要估计 $\int_0^1\frac{F(x)^2}{x^2}dx$，被积函数在 $x=0$ 处分母为 0。动手前必须先确认这个积分是有限的，否则后面的移项、相除都没有意义。</p>
<p><b>记号</b>：$F(x)=\int_0^xf(t)\,dt$，$f$ 在 $[0,1]$ 连续。</p>
<p><b>关键极限</b>：$\frac{F(x)}x$ 是 $f$ 在 $[0,x]$ 上的平均值，所以 $$\Big|\frac{F(x)}x-f(0)\Big|=\Big|\frac1x\int_0^x(f(t)-f(0))dt\Big|\le\max_{0\le t\le x}|f(t)-f(0)|\to0.$$ 于是 $$\lim_{x\to0^+}\frac{F(x)}x=f(0),\qquad\lim_{x\to0^+}\frac{F(x)^2}x=\lim_{x\to0^+}x\cdot\Big(\frac{F(x)}x\Big)^2=0\cdot f(0)^2=0.$$</p>
<p>所以 $\frac{F(x)^2}{x^2}=\bigl(\frac{F(x)}x\bigr)^2$ 在 0 附近有界（补值 $f(0)^2$ 后连续），积分有限。</p>
<p><b>先截断再分部</b>：在 $[\varepsilon,1]$ 上取 $u=F^2$，$dv=\frac{dx}{x^2}$，则 $du=2F(x)f(x)\,dx$（因 $F'=f$），$v=-\frac1x$：</p>
$$\int_\varepsilon^1\frac{F^2}{x^2}\,dx=\Big[-\frac{F(x)^2}x\Big]_\varepsilon^1+2\int_\varepsilon^1\frac{F(x)f(x)}{x}\,dx=-F(1)^2+\frac{F(\varepsilon)^2}\varepsilon+2\int_\varepsilon^1\frac{Ff}{x}\,dx.$$
<p>令 $\varepsilon\to0^+$，由上面的极限 $\frac{F(\varepsilon)^2}\varepsilon\to0$。剩下的 $\int\frac{F}{x}\cdot f$ 正是两个因子的乘积，可以接 Cauchy。</p>`
    },
    {
      id: R`i5-s3`,
      h: R`3. 从分部恒等式解出 Hardy 型不等式`,
      html: R`
<p><b>这节解决什么</b>：把第 2 节的恒等式和 Cauchy 不等式结合，解出 $\int_0^1\frac{F^2}{x^2}\le4\int_0^1f^2$（这类不等式叫 Hardy 型不等式）。</p>
<p><b>步骤</b>：记 $I=\int_0^1\frac{F^2}{x^2}dx$，$E=\int_0^1f^2dx$（都有限）。</p>
<ol>
<li>由第 2 节：$$I=-F(1)^2+2\int_0^1\frac{F}{x}\cdot f\,dx\le2\int_0^1\frac Fx\cdot f\,dx$$（丢掉非正项 $-F(1)^2$）。</li>
<li>Cauchy：$$\int_0^1\frac Fx\cdot f\le\Bigl(\int_0^1\frac{F^2}{x^2}\Bigr)^{1/2}\Bigl(\int_0^1f^2\Bigr)^{1/2}=\sqrt I\sqrt E$$。所以 $I\le2\sqrt I\sqrt E$。</li>
<li>若 $I=0$，结论 $I\le4E$ 显然。若 $I\gt0$，两边除以 $\sqrt I$：$\sqrt I\le2\sqrt E$，平方得 $I\le4E$。</li>
</ol>
<p><b>口诀</b>：先说明积分有限、处理边界项，再用 Cauchy，最后把 $I=0$ 单独讨论后再相除。</p>
<p><b>小例子</b>：$f\equiv1$，$F(x)=x$，$I=\int_0^11\,dx=1$，$4E=4$，确实 $1\le4$。</p>
<p>工具对照普通 Cauchy 与常数 4：常数 4 是“最好的”，可以找一族在 0 附近越来越陡的连续函数，使比值 $I/E$ 越来越接近 4，但没有哪个非零连续函数恰好取到等号。</p>`
    }

<p><b>这节解决什么</b>：积分中值定理说，连续函数在 $[a,a+h]$ 上的平均值 $\frac1h\int_a^{a+h}f$ 等于某点 $\xi$ 处的函数值 $f(\xi)$。真题（2022 秋期末 5）问：$h\to0$ 时 $\xi$ 位于区间的什么相对位置？</p>

<p><b>中值点的位置</b>：另一方面 $f(\xi)=f(a)+L(\xi-a)+o(h)$（因为 $0\le\xi-a\le h$）。两式相等，得 $L(\xi-a)=\frac L2h+o(h)$。若 $L\ne0$，两边除以 $Lh$：$\frac{\xi-a}h\to\frac12$。</p>

<p><b>第 2 步：平均值的界</b>。设 $h=x-a\in(0,\delta)$。对 $(*)$ 在 $s\in[0,h]$ 上积分（$f$ 可导故连续，严格不等式积分后仍严格），再除以 $h$：$$\frac{L-\varepsilon}2h\lt\frac1h\int_a^{a+h}\bigl(f(t)-f(a)\bigr)dt\lt\frac{L+\varepsilon}2h.$$ 由题设中间项 $=f(\xi)-f(a)$。</p>
<p><b>第 3 步：排除 $\xi=a$</b>。左端 $\gt0$，所以 $f(\xi)\ne f(a)$，$\xi\ne a$，故 $0\lt\xi-a\le h\lt\delta$。对 $s=\xi-a$ 用 $(*)$：$$(L-\varepsilon)(\xi-a)\lt f(\xi)-f(a)\lt(L+\varepsilon)(\xi-a).$$</p>
<p><b>第 4 步：交叉比较</b>。</p>
<ul>
<li>$\frac{L-\varepsilon}2h\lt f(\xi)-f(a)\lt(L+\varepsilon)(\xi-a)$，得 $\frac{\xi-a}h\gt\frac{L-\varepsilon}{2(L+\varepsilon)}$。</li>
<li>$(L-\varepsilon)(\xi-a)\lt f(\xi)-f(a)\lt\frac{L+\varepsilon}2h$，得 $\frac{\xi-a}h\lt\frac{L+\varepsilon}{2(L-\varepsilon)}$。</li>
</ul>
<p>这就是 (1) 的不等式。</p>
<p><b>(2)</b> 由 (1)，$\frac{L-\varepsilon}{2(L+\varepsilon)}\le\liminf_{x\to a^+}\frac{\xi-a}{x-a}\le\limsup_{x\to a^+}\frac{\xi-a}{x-a}\le\frac{L+\varepsilon}{2(L-\varepsilon)}$。令 $\varepsilon\to0^+$，两端都 $\to\frac12$。</p>
<p><b>答案：$\lim_{x\to a^+}\frac{\xi(x)-a}{x-a}=\frac12$</b>。论证对每一种中值点的取法都成立，不需要 $\xi$ 唯一。</p>`

im1: {
  unit: R`improper`,
  n: 1,
  title: R`反常积分：分清端点，再判阶`,
  goal: R`学会判断反常积分（积分区间无穷长，或被积函数在某点无界）是否收敛：把每个“坏点”单独拆开，在坏点附近找被积函数的主要部分，再和 $x^{-p}$ 比较。特别记住：无穷远处与有限端点处 $p$ 的判别方向相反。30 分钟做概念、基础与 2022 秋期末 4(2)，振荡真题留作延伸。`,
  sections: [
    {
      id: R`im1-s1`,
      h: R`1. 反常积分是一个极限；有几个坏点就拆几段`,
      html: R`<p><b>这节解决什么</b>：普通定积分要求区间有限、函数有界。若区间伸到无穷远，或函数在某点附近趋于无穷，就叫<b>反常积分</b>（后者也叫瑕积分，那个点叫瑕点）。它的值定义为一个极限。</p>
<p><b>定义</b>：</p>
<ul>
<li>无穷区间：$\int_a^\infty f=\lim_{R\to\infty}\int_a^Rf$。</li>
<li>在有限端点 $a$ 附近无界：$\int_a^bf=\lim_{\varepsilon\to0^+}\int_{a+\varepsilon}^bf$。</li>
</ul>
<p>极限存在且为<b>有限数</b>，叫<b>收敛</b>；否则叫发散。</p>
<p><b>小例子</b>：$\int_1^\infty\frac{dx}{x^2}=\lim_{R\to\infty}\bigl[-\frac1x\bigr]_1^R=\lim_{R\to\infty}\bigl(1-\frac1R\bigr)=1$，收敛。</p>
<p><b>多个坏点</b>：两端都反常（如 $\int_0^\infty\frac{dx}{\sqrt x(1+x)}$，0 处无界、上限无穷），就选一个中间点 $c$ 拆成两段，<b>两段都收敛</b>，整个积分才收敛。区间内部有瑕点也要左右分开。</p>
<p><b>易错</b>：不能让两边“同步截断”后互相抵消。例 $\int_{-1}^1\frac{dx}x$：对称挖掉 $(-\varepsilon,\varepsilon)$ 后积分恰为 0，但单看右段 $\int_\varepsilon^1\frac{dx}x=-\ln\varepsilon\to+\infty$ 已经发散，所以原积分发散。对称挖去得到的 0 只叫“柯西主值”，不是积分值。</p>`
    },
    {
      id: R`im1-s2`,
      h: R`2. 两张 $p$ 型判别表，方向相反，不能背反`,
      html: R`<p><b>这节解决什么</b>：判断收敛最常用的“标尺”是幂函数 $x^{-p}$。先把它们的结论记牢。</p>
<p><b>直接计算</b>（$p\ne1$）：$\int_1^Rx^{-p}dx=\frac{R^{1-p}-1}{1-p}$，$\int_\varepsilon^1x^{-p}dx=\frac{1-\varepsilon^{1-p}}{1-p}$。看 $R\to\infty$、$\varepsilon\to0^+$ 时的极限：</p>
$$\int_1^\infty x^{-p}\,dx\text{ 收敛}\iff p\gt1,\qquad \int_0^1 x^{-p}\,dx\text{ 收敛}\iff p\lt1.$$
<p>$p=1$ 时两者都是 $\ln$，都发散。</p>
<p><b>直观记法</b>：无穷远处，函数要<b>衰减得够快</b>（$p\gt1$）；0 附近，函数要<b>爆炸得够慢</b>（$p\lt1$）。例：$x^{-1/2}$ 在 0 附近可积，在无穷远不可积；$x^{-2}$ 恰好相反。</p>
<p><b>比较判别法</b>（对非负函数）：若 $0\le f\le g$，则 $\int g$ 收敛 ⇒ $\int f$ 收敛；$\int f$ 发散 ⇒ $\int g$ 发散。<b>极限形式</b>：若在坏点处 $\frac fg\to C$，$0\lt C\lt\infty$（记作 $f\sim Cg$，“等价”），则两者同敛散。</p>
<p><b>一般结论</b>：有限端点 $a$ 处若 $|f(x)|\sim C|x-a|^q$（$C\gt0$），可积当且仅当 $q\gt-1$；无穷远处若 $|f(x)|\sim Cx^{-p}$，可积当且仅当 $p\gt1$。</p>
<p><b>有正有负的函数</b>：先看 $\int|f|$。$\int|f|$ 收敛叫<b>绝对收敛</b>，此时 $\int f$ 一定收敛。但 $\int|f|$ 发散<b>不能</b>推出 $\int f$ 发散——正负部分可能互相抵消使 $\int f$ 收敛，这叫<b>条件收敛</b>（见延伸题）。</p>`
    },
    {
      id: R`im1-s3`,
      h: R`3. 用 Taylor 展开找坏点处的主要部分`,
      html: R`<p><b>这节解决什么</b>：被积函数常常不是单纯的幂函数，要先找出它在坏点附近“长得像哪个幂函数”。</p>
<p><b>做法</b>：在有限坏点处，把函数 Taylor 展开到<b>第一个不为零的项</b>（前面的项可能互相抵消）；在无穷远处，常令 $t=\frac1x$ 变成小量再展开。</p>
<p><b>例</b>：$\int_0^1\frac{1-\cos x}{x^p}dx$。$1-\cos x=\frac{x^2}2+o(x^2)$，所以被积函数 $\sim\frac12x^{2-p}$（$x\to0^+$）。有限端点要求指数 $2-p\gt-1$，即 <b>$p\lt3$ 时收敛</b>。例如 $p=2$ 时被积函数趋于 $\frac12$，根本不是瑕积分；$p=3$ 时 $\sim\frac1{2x}$，对数发散。</p>
<p><b>写法要求</b>：要证发散，写出被积函数的一个<b>下界</b>（发散的正函数）；要证绝对收敛，写出 $|f|$ 的一个<b>上界</b>（可积函数）。写“等价于”时要说明是在哪个端点、和谁比。</p>
<p>工具中可以看截断积分随截断点的变化；但只看几个数值不能断定收敛，例如 $\int_1^R\frac{dx}x=\ln R$ 增长得非常慢，看起来像“稳定”了。</p>`
    }

<p><b>结论：原瑕积分发散</b>（到 $+\infty$）。注意不能用原函数直接代端点 $F(\frac\pi4)-F(0)$，因为原函数在 $\frac\pi4$ 处趋于无穷。</p>`

  n: 2,
  title: R`反常积分计算：Beta 型与截断换元`,
  goal: R`算反常积分的值：①先确定参数在什么范围内积分收敛；②在有限区间 $[\varepsilon,R]$ 上做换元或分部；③最后取极限并检查边界项。以 2021 秋期末 2 的 Beta 积分为主线。易错：把 $\infty$ 直接当数代进公式。`,
  sections: [
    {
      id: R`im2-s1`,
      h: R`1. 先定参数范围：Beta 积分的两个坏点`,
      html: R`<p><b>这节解决什么</b>：含参数的反常积分，先要知道参数取哪些值时积分收敛，后面的所有等式都只在这个范围内成立。</p>
<p><b>定义</b>（2021 秋期末 2）：$$B(\alpha,\beta)=\int_0^\infty\frac{y^{\alpha-1}}{(1+y)^{\alpha+\beta}}\,dy.$$ 叫 <b>Beta 积分</b>。$y\gt0$ 时被积函数恒正。</p>
<p><b>两个坏点分别看</b>：</p>
<ul>
<li>$y\to0^+$：$(1+y)^{\alpha+\beta}\to1$，被积函数 $\sim y^{\alpha-1}$。有限端点要求指数 $\alpha-1\gt-1$，即 <b>$\alpha\gt0$</b>。</li>
<li>$y\to\infty$：$(1+y)^{\alpha+\beta}\sim y^{\alpha+\beta}$，被积函数 $\sim y^{\alpha-1-\alpha-\beta}=y^{-\beta-1}$。无穷远要求 $\beta+1\gt1$，即 <b>$\beta\gt0$</b>。</li>
</ul>
<p>所以 <b>$B(\alpha,\beta)$ 收敛当且仅当 $\alpha\gt0$ 且 $\beta\gt0$</b>。取等号（如 $\alpha=0$）时出现 $\frac1y$ 型，对数发散。</p>
<p><b>小例子</b>：$B(1,1)=\int_0^\infty\frac{dy}{(1+y)^2}=\bigl[-\frac1{1+y}\bigr]_0^\infty=1$。</p>`
    },
    {
      id: R`im2-s2`,
      h: R`2. 换元把无穷区间 $(0,\infty)$ 压到 $(0,1)$`,
      html: R`<p><b>这节解决什么</b>：无穷区间上的积分不方便，换元 $x=\frac y{1+y}$ 把 $y\in(0,\infty)$ 一一对应到 $x\in(0,1)$。</p>
<p><b>计算</b>：由 $x=\frac{y}{1+y}$ 解出 $y=\frac x{1-x}$，于是 $1+y=\frac1{1-x}$，$dy=\frac{dx}{(1-x)^2}$。代入：</p>
$$\frac{y^{\alpha-1}}{(1+y)^{\alpha+\beta}}dy=\frac{x^{\alpha-1}}{(1-x)^{\alpha-1}}\cdot(1-x)^{\alpha+\beta}\cdot\frac{dx}{(1-x)^2}=x^{\alpha-1}(1-x)^{\beta-1}dx.$$
<p>所以 $$B(\alpha,\beta)=\int_0^1x^{\alpha-1}(1-x)^{\beta-1}\,dx.$$</p>
<p><b>严谨写法</b>：先把 $y$ 限在 $[\varepsilon,R]$（普通定积分），对应 $x\in[\frac\varepsilon{1+\varepsilon},\frac R{1+R}]$，用普通换元公式；再令 $\varepsilon\to0^+$、$R\to\infty$，两端分别趋于 0、1。</p>
<p><b>推论（对称性）</b>：在 $(0,1)$ 上令 $x\mapsto1-x$，得 $B(\alpha,\beta)=B(\beta,\alpha)$。</p>
<p><b>小例子</b>：$B(2,2)=\int_0^1x(1-x)dx=\frac12-\frac13=\frac16$。</p>`
    },
    {
      id: R`im2-s3`,
      h: R`3. 分部递推：边界项为零要说明理由`,
      html: R`<p><b>这节解决什么</b>：用分部积分把 $B(\alpha+1,\beta)$ 和 $B(\alpha,\beta)$ 联系起来，进而在参数为正整数时算出具体值。</p>
<p><b>推导</b>（$\alpha,\beta\gt0$）：$B(\alpha+1,\beta)=\int_0^\infty y^\alpha(1+y)^{-\alpha-\beta-1}dy$。取 $u=y^\alpha$，$dv=(1+y)^{-\alpha-\beta-1}dy$，则 $du=\alpha y^{\alpha-1}dy$，$v=-\frac{(1+y)^{-\alpha-\beta}}{\alpha+\beta}$：</p>
$$B(\alpha+1,\beta)=\Big[-\frac{y^\alpha}{(\alpha+\beta)(1+y)^{\alpha+\beta}}\Big]_0^\infty+\frac{\alpha}{\alpha+\beta}\int_0^\infty\frac{y^{\alpha-1}}{(1+y)^{\alpha+\beta}}dy.$$
<p><b>边界项</b>：$y\to0^+$ 时 $y^\alpha\to0$（需 $\alpha\gt0$）；$y\to\infty$ 时 $\frac{y^\alpha}{(1+y)^{\alpha+\beta}}\sim y^{-\beta}\to0$（需 $\beta\gt0$）。所以边界项为 0：</p>
$$B(\alpha+1,\beta)=\frac\alpha{\alpha+\beta}B(\alpha,\beta).$$
<p><b>正整数情形</b>：$B(1,n)=\int_0^1(1-x)^{n-1}dx=\frac1n$。反复用递推（$\alpha=1,2,\dots,m-1$）：$$B(m,n)=\frac{m-1}{m+n-1}\cdot\frac{m-2}{m+n-2}\cdots\frac{1}{n+1}\cdot\frac1n=\frac{(m-1)!\,(n-1)!}{(m+n-1)!}.$$</p>
<p><b>小例子</b>：$B(2,2)=\frac{1!\,1!}{3!}=\frac16$，与上一节直接积分一致。</p>`
    }

ap1: {

  title: R`积分求面积：直角坐标与极坐标`,
  goal: R`用积分求平面区域面积：先画出区域、找交点、确定谁在上谁在下（或射线扫过几次），再列积分。主线做两曲线围成的面积与 2025 秋期末 A 卷 4（第一象限的环）；极坐标面积公式里始终有一个 $\frac12$。`,
  sections: [
    {
      id: R`ap1-s1`,
      h: R`1. 直角坐标：先求交点，再“上减下”`,
      html: R`<p><b>这节解决什么</b>：两条曲线围成的区域面积怎么列积分。</p>
<p><b>竖条切片</b>：在 $a\le x\le b$ 上，区域上边界是 $y=f(x)$，下边界是 $y=g(x)$（即 $f\ge g$），把区域切成宽 $dx$、高 $f(x)-g(x)$ 的竖条，面积为 $$A=\int_a^b\bigl[f(x)-g(x)\bigr]dx.$$</p>
<p><b>上下会交换时</b>：先解方程 $f=g$ 求出交点，按交点分段，每段用“上减下”；或者写成 $\int_a^b|f-g|\,dx$。</p>
<p><b>横条切片</b>：如果用 $y$ 描述更方便（右边界 $x=\phi(y)$，左边界 $x=\psi(y)$），面积为 $\int_c^d[\phi(y)-\psi(y)]\,dy$。</p>
<p><b>小例子</b>：$y=x$ 与 $y=x^2$。交点：$x=x^2\Rightarrow x=0,1$。在 $(0,1)$ 上取 $x=\frac12$ 试一下：$\frac12\gt\frac14$，所以 $y=x$ 在上。面积 $=\int_0^1(x-x^2)dx=\frac12-\frac13=\frac16$。</p>
<p><b>易错</b>：交点只给出积分上下限，谁在上还要代一个点判断；直接 $\int(f-g)$ 而不分段，正负部分会互相抵消。</p>`
    },
    {
      id: R`ap1-s2`,
      h: R`2. 极坐标面积：每一小块是一个细扇形`,
      html: R`<p><b>这节解决什么</b>：边界用极坐标 $r=r(\theta)$ 给出的区域（如心形线、绕原点的环），用扇形切片求面积。</p>
<p><b>记号</b>：点 $(x,y)$ 的极坐标：$r$ 是到原点的距离，$\theta$ 是与 $x$ 轴正向的夹角（极角），$x=r\cos\theta$，$y=r\sin\theta$。</p>
<p><b>公式</b>：半径 $r$、圆心角 $d\theta$ 的细扇形面积是 $\frac12r^2\,d\theta$（整圆 $\pi r^2$ 对应角 $2\pi$，按比例）。若在角区间 $[\alpha,\beta]$ 上，每条从原点出发的射线恰好穿过区域一次，从 $0$ 走到边界 $r(\theta)\ge0$，则</p>
$$A=\frac12\int_\alpha^\beta r(\theta)^2\,d\theta.$$
<p><b>小例子</b>：半径为 $a$ 的圆 $r\equiv a$，$A=\frac12\int_0^{2\pi}a^2d\theta=\pi a^2$ ✓。</p>
<p><b>两曲线之间</b>：$A=\frac12\int(r_{\text{外}}^2-r_{\text{内}}^2)\,d\theta$，前提是在这段角度内谁在外已经确定。</p>
<p><b>易错</b>：①漏掉 $\frac12$；②有的曲线在某些角度 $r\lt0$（表示往反方向画点）或会重复描同一段，若不检查就积一整圈，面积会算重（见延伸题）。③把 $x=r\cos\theta,y=r\sin\theta$ 代入方程后约去 $r$ 时，要单独记下原点 $r=0$ 也在曲线上。</p>`
    },
    {
      id: R`ap1-s3`,
      h: R`3. 2025 真题：笛卡尔叶形线在第一象限的环`,
      html: R`<p><b>这节解决什么</b>：真题曲线 $x^3+y^3=3xy$（笛卡尔叶形线）在第一象限形成一个封闭的环，求环内面积。直角坐标很难解出 $y$，用极坐标。</p>
<p><b>第 1 步：极坐标方程</b>。代入 $x=r\cos\theta$，$y=r\sin\theta$：$r^3(\cos^3\theta+\sin^3\theta)=3r^2\cos\theta\sin\theta$。原点 $r=0$ 满足；$r\ne0$ 时约去 $r^2$：</p>
$$r(\theta)=\frac{3\cos\theta\sin\theta}{\cos^3\theta+\sin^3\theta},\qquad0\lt\theta\lt\frac\pi2.$$
<p><b>第 2 步：为什么围成一个有界环</b>。在 $[0,\frac\pi2]$ 上 $\cos\theta,\sin\theta\ge0$ 且不同时为 0，所以分母 $\cos^3\theta+\sin^3\theta\gt0$，$r$ 连续、有界；在 $(0,\frac\pi2)$ 内分子 $\gt0$，所以 $r\gt0$；在 $\theta=0$ 与 $\frac\pi2$ 处 $r=0$。因此每条第一象限的射线恰好碰到边界一次，曲线从原点出发、绕一圈回到原点。</p>
<p><b>第 3 步：换元</b>。令 $t=\tan\theta$（$\theta:0\to\frac\pi2$ 对应 $t:0\to\infty$），$d\theta=\frac{dt}{1+t^2}$。分子分母同除以 $\cos^3\theta$：$r=\frac{3t\sec\theta}{1+t^3}$，$r^2=\frac{9t^2(1+t^2)}{(1+t^3)^2}$。于是</p>
$$r^2\,d\theta=\frac{9t^2(1+t^2)}{(1+t^3)^2}\cdot\frac{dt}{1+t^2}=\frac{9t^2}{(1+t^3)^2}\,dt.$$
<p>复杂的三角积分变成了一个可以凑微分的有理函数积分（$t^2\,dt$ 是 $\frac13d(1+t^3)$）。交互工具按角度逐步扫过，读数显示尚未扫完时的部分面积。</p>`
    }

      sol: R`<p><b>(1)</b> 代入 $x=r\cos\theta$，$y=r\sin\theta$：$$r^3(\cos^3\theta+\sin^3\theta)=3r^2\cos\theta\sin\theta.$$ 原点（$r=0$）在曲线上；$r\ne0$ 时约去 $r^2$，得极坐标方程 $$r(\cos^3\theta+\sin^3\theta)=3\cos\theta\sin\theta.$$ 在第一象限（$0\le\theta\le\frac\pi2$）分母为正，可写成 $r(\theta)=\dfrac{3\cos\theta\sin\theta}{\cos^3\theta+\sin^3\theta}$。</p>
<p><b>(2)</b> 在 $[0,\frac\pi2]$ 上，$\cos\theta,\sin\theta\ge0$ 且不同时为 0，所以分母 $\cos^3\theta+\sin^3\theta\gt0$。因此 $r(\theta)$ 在闭区间上连续，从而有界；在 $(0,\frac\pi2)$ 内分子 $\gt0$，$r\gt0$；且 $r(0)=r(\frac\pi2)=0$。</p>
<p>每个 $\theta\in(0,\frac\pi2)$ 对应一条射线，它与曲线（除原点外）恰好交于一点 $r(\theta)$。所以第一象限的曲线是一条从原点出发、随 $\theta$ 增大绕回原点的闭曲线，它围成 $$D=\Big\{(r,\theta):0\le\theta\le\frac\pi2,\ 0\le r\le r(\theta)\Big\},$$ 由 $r$ 有界知 <b>$D$ 是有界区域</b>。</p>
<p><b>(3)</b> 由极坐标面积公式 $A=\frac12\int_0^{\pi/2}r(\theta)^2d\theta$。令 $t=\tan\theta$，$\theta:0\to\frac\pi2$ 对应 $t:0\to+\infty$，$d\theta=\frac{dt}{1+t^2}$。分子分母同除 $\cos^3\theta$：$r=\frac{3\tan\theta\cdot\frac1{\cos\theta}}{1+\tan^3\theta}$，所以 $r^2=\frac{9t^2(1+t^2)}{(1+t^3)^2}$（用 $\frac1{\cos^2\theta}=1+t^2$）。</p>
$$A=\frac12\int_0^{\infty}\frac{9t^2(1+t^2)}{(1+t^3)^2}\cdot\frac{dt}{1+t^2}=\frac92\int_0^\infty\frac{t^2}{(1+t^3)^2}\,dt.$$
<p>令 $u=1+t^3$，$du=3t^2dt$，$t:0\to\infty$ 对应 $u:1\to\infty$：$$A=\frac92\cdot\frac13\int_1^\infty u^{-2}\,du=\frac32\lim_{U\to\infty}\Big[-\frac1u\Big]_1^U=\frac32.$$</p>
<p><b>答案：(3) $D$ 的面积为 $\frac32$。</b>（上限无穷按反常积分取极限，积分收敛；答案为正。）</p>`
    }

<p><b>第 2 步：公共部分</b>。角度 $\theta\in[-\frac\pi2,\frac\pi2]$ 时，公共部分的半径上限是 $\min(1,2\cos\theta)$。$2\cos\theta\ge1\iff|\theta|\le\frac\pi3$。所以 $|\theta|\le\frac\pi3$ 时外边界是 $r=1$，$\frac\pi3\le|\theta|\le\frac\pi2$ 时外边界是 $r=2\cos\theta$。</p>

<p><b>正确区间</b>：$\theta\in[-\frac\pi2,\frac\pi2]$ 时 $r=\cos\theta\ge0$，$\theta$ 从 $-\frac\pi2$ 走到 $\frac\pi2$ 恰好把圆描一次：$$A=\frac12\int_{-\pi/2}^{\pi/2}\cos^2\theta\,d\theta=\frac12\cdot\frac\pi2=\frac\pi4.$$</p>

  title: R`旋转体体积：截面、圆盘与圆环`,
  goal: R`求旋转体体积：用垂直于旋转轴的平面去切，截面是圆盘或圆环，把截面面积积起来。分清“半径”（到旋转轴的距离）和“高度”。主线完成 2025 秋期末 A 卷 1：体积的极限和体积函数的拐点；圆环与换轴题用于举一反三。`,
  sections: [
    {
      id: R`ap2-s1`,
      h: R`1. 体积 = 截面面积的积分；旋转体的截面是圆盘或圆环`,
      html: R`<p><b>这节解决什么</b>：平面区域绕一条直线转一圈得到一个立体（旋转体），怎样求它的体积。</p>
<p><b>基本思想</b>：用垂直于 $x$ 轴的平面把立体切成厚 $dx$ 的薄片，第 $x$ 处的截面面积记为 $A(x)$，薄片体积约 $A(x)\,dx$，加起来：$V=\int_a^bA(x)\,dx$。</p>
<p><b>圆盘</b>：区域 $0\le y\le f(x)$（$a\le x\le b$）绕 $x$ 轴转一圈，$x$ 处的截面是半径 $f(x)$ 的圆盘，面积 $\pi f(x)^2$：</p>
$$V=\pi\int_a^bf(x)^2\,dx.$$
<p><b>圆环</b>：区域夹在 $0\le g(x)\le y\le f(x)$ 之间，截面是外半径 $f$、内半径 $g$ 的圆环（“垫圈”），面积 $\pi f^2-\pi g^2=\pi(f^2-g^2)$。<b>不是 $\pi(f-g)^2$</b>。</p>
<p><b>小例子</b>：$y=x$（$0\le x\le1$）下方绕 $x$ 轴：$V=\pi\int_0^1x^2dx=\frac\pi3$，正是底半径 1、高 1 的圆锥体积 $\frac13\pi r^2h$ ✓。</p>
<p><b>易错</b>：绕的不是 $x$ 轴时（例如绕 $y=2$），半径要用“点到新旋转轴的距离”重新计算。</p>`
    },
    {
      id: R`ap2-s2`,
      h: R`2. 2025 真题：体积函数 $V(t)$ 与无穷长的立体`,
      html: R`<p><b>这节解决什么</b>：真题把体积写成上限 $t$ 的函数 $V(t)$，问 $t\to\infty$ 时的极限。</p>
<p><b>列式</b>：$y=xe^{-x}$（$0\le x\le t$）下方区域绕 $x$ 轴，截面半径 $xe^{-x}$，面积 $\pi x^2e^{-2x}$：$$V(t)=\pi\int_0^tx^2e^{-2x}\,dx.$$</p>
<p><b>求原函数</b>（分部两次，每次让多项式求导降一次）：</p>
<ol>
<li>$\int x^2e^{-2x}dx=-\frac{x^2}2e^{-2x}+\int xe^{-2x}dx$。</li>
<li>$$\int xe^{-2x}dx=-\frac x2e^{-2x}+\frac12\int e^{-2x}dx=-\frac x2e^{-2x}-\frac14e^{-2x}$$。</li>
<li>合起来：$$\int x^2e^{-2x}dx=-e^{-2x}\Big(\frac{x^2}2+\frac x2+\frac14\Big)+C$$。</li>
</ol>
<p>代入 $0$ 与 $t$：$$V(t)=\pi\Big[\frac14-e^{-2t}\Big(\frac{t^2}2+\frac t2+\frac14\Big)\Big]=\frac\pi4\Big[1-e^{-2t}(2t^2+2t+1)\Big].$$</p>
<p><b>极限</b>：指数衰减比任何多项式增长都快，$t^ke^{-2t}\to0$，所以 $V(t)\to\frac\pi4$。<b>无限长的立体体积可以有限</b>，关键看截面面积的反常积分是否收敛。</p>`
    },
    {
      id: R`ap2-s3`,
      h: R`3. 拐点问的是 $V(t)$ 的拐点，不是原曲线的`,
      html: R`<p><b>这节解决什么</b>：真题第 (2) 问求 $V(t)$ 的拐点。<b>拐点</b>：函数在该点两侧凹凸性相反（二阶导数变号）的点。</p>
<p><b>求导</b>：$V(t)$ 是变上限积分，由微积分基本定理，导数就是 $t$ 处的截面面积：</p>
$$V'(t)=\pi t^2e^{-2t},\qquad V''(t)=\pi\bigl(2te^{-2t}-2t^2e^{-2t}\bigr)=2\pi t(1-t)e^{-2t}.$$
<p><b>看符号</b>（$t\gt0$）：$2\pi te^{-2t}\gt0$，所以 $V''$ 的符号由 $1-t$ 决定：$0\lt t\lt1$ 时 $V''\gt0$（下凸），$t\gt1$ 时 $V''\lt0$（上凸）。唯一拐点在 $t=1$，$V(1)=\frac\pi4(1-5e^{-2})$。</p>
<p><b>易错</b>：$V''(0)=0$，但 $t=0$ 不在定义域 $t\gt0$ 内部，左边没有点，谈不上“两侧变号”，不是拐点。</p>
<p><b>直观意义</b>：$V'\gt0$ 说明体积一直增大；$V''$ 先正后负，说明“每多一小段长度增加的体积”（即截面面积 $\pi t^2e^{-2t}$）先增后减，在 $t=1$ 截面最大。</p>`
    }
  ],

        R`(2) 基本定理 $V'(t)=\pi t^2e^{-2t}$，再求导 $V''(t)=2\pi t(1-t)e^{-2t}$。在 $t\gt0$ 上看 $1-t$ 的符号。`
      ],
      method: R`m-ap-volume`,
      sol: R`<p><b>列式</b>：$x$ 处截面是半径 $xe^{-x}$ 的圆盘，面积 $\pi x^2e^{-2x}$，所以 $V(t)=\pi\int_0^tx^2e^{-2x}\,dx$。</p>
<p><b>(1)</b> 分部两次：$$\int x^2e^{-2x}dx=-\frac{x^2}2e^{-2x}+\int xe^{-2x}dx,\qquad\int xe^{-2x}dx=-\frac x2e^{-2x}+\frac12\int e^{-2x}dx=-\frac x2e^{-2x}-\frac14e^{-2x}.$$ 所以 $\int x^2e^{-2x}dx=-e^{-2x}\bigl(\frac{x^2}2+\frac x2+\frac14\bigr)+C$。代入上下限：</p>
$$V(t)=\pi\Big[\frac14-e^{-2t}\Big(\frac{t^2}2+\frac t2+\frac14\Big)\Big]=\frac\pi4\Big[1-e^{-2t}(2t^2+2t+1)\Big].$$
<p>因 $t^ke^{-2t}\to0$（$k=0,1,2$，指数比多项式快），<b>$\lim_{t\to\infty}V(t)=\frac\pi4$</b>。</p>
<p><b>(2)</b> 由微积分基本定理，$V'(t)=\pi t^2e^{-2t}$，再求导：$$V''(t)=\pi\bigl(2t\,e^{-2t}-2t^2e^{-2t}\bigr)=2\pi t(1-t)e^{-2t}.$$ $t\gt0$ 时 $2\pi te^{-2t}\gt0$：$0\lt t\lt1$ 时 $V''\gt0$（下凸），$t\gt1$ 时 $V''\lt0$（上凸），所以 $t=1$ 两侧凹凸相反。$V(1)=\frac\pi4\bigl[1-e^{-2}\cdot5\bigr]$。</p>
<p><b>答案：(1) $\frac\pi4$；(2) 唯一拐点 $\Big(1,\ \dfrac\pi4(1-5e^{-2})\Big)$。</b>注意 $t=0$ 不在定义域内部，不算拐点；题目问的是 $V$ 的拐点，不是曲线 $y=xe^{-x}$ 的拐点（那在 $x=2$）。</p>`
    }
  ],

      stmt: R`区域 $0\le x\le1$、$0\le y\le x$ 绕直线 $y=2$ 转一周，求体积。`,

<p><b>截面面积</b>：$\pi\bigl[2^2-(2-x)^2\bigr]=\pi\bigl[4-(4-4x+x^2)\bigr]=\pi(4x-x^2)$。</p>
<p><b>体积</b>：$$V=\pi\int_0^1(4x-x^2)\,dx=\pi\Big(2-\frac13\Big)=\frac{5\pi}3.$$</p>
<p><b>答案：$\frac{5\pi}3$。</b>易错：直接用 $\pi\int x^2dx$，那是绕 $x$ 轴，题目已经换了轴。</p>`

    {

      src: R`自编：同一区域换旋转轴`,
      stmt: R`区域 $0\le x\le1$、$x^2\le y\le x$ 绕 y 轴转一周，求体积。`,

        R`从 $x^2\le y\le x$ 解出 $x$ 的范围：$y\le x\le\sqrt y$。到 $y$ 轴的距离就是 $x$，所以外半径 $\sqrt y$，内半径 $y$。`,

      sol: R`<p><b>换切法</b>：绕 $y$ 轴，用垂直于 $y$ 轴的水平切片。区域中 $y$ 从 0 到 1；固定 $y$，由 $y\le x$ 和 $x^2\le y$（$x\ge0$）得 $y\le x\le\sqrt y$。</p>
<p><b>半径</b>：点 $(x,y)$ 到 $y$ 轴的距离是 $x$，所以外半径 $\sqrt y$，内半径 $y$。截面面积 $\pi\bigl[(\sqrt y)^2-y^2\bigr]=\pi(y-y^2)$。</p>
<p><b>体积</b>：$$V=\pi\int_0^1(y-y^2)\,dy=\pi\Big(\frac12-\frac13\Big)=\frac\pi6.$$</p>
<p><b>答案：$\frac\pi6$。</b>与 ap2-p1(2) 同一区域绕 $x$ 轴的 $\frac{2\pi}{15}$ 不同：换轴必须重新确定半径和积分变量。</p>`

    {
      id: R`ap2-e1`,
      lv: R`延伸`,
      src: R`自编：无穷长喇叭的收敛阈值`,
      stmt: R`对实数 $p$，把 $x\ge1$、$0\le y\le x^{-p}$ 的区域绕 x 轴转一周。体积何时有限？有限时求值。`,
      hints: [
        R`截面是半径 $x^{-p}$ 的圆盘，面积 $\pi x^{-2p}$，体积 $V=\pi\int_1^\infty x^{-2p}dx$。`,
        R`这是无穷远的 $p$ 型积分，指数为 $2p$：收敛 $\iff2p\gt1$。`,
        R`$2p\gt1$ 时 $\int_1^\infty x^{-2p}dx=\Big[\frac{x^{1-2p}}{1-2p}\Big]_1^\infty=\frac1{2p-1}$。`

      method: R`m-ap-volume`,
      sol: R`<p><b>列式</b>：$x$ 处截面半径 $x^{-p}$，面积 $\pi x^{-2p}$：$$V=\pi\int_1^\infty x^{-2p}\,dx=\lim_{R\to\infty}\pi\int_1^Rx^{-2p}dx.$$</p>
<p><b>判别</b>：无穷远 $p$ 型积分，指数 $2p$，收敛当且仅当 $2p\gt1$，即 $p\gt\frac12$。</p>
<p><b>求值</b>（$p\gt\frac12$）：$\pi\int_1^Rx^{-2p}dx=\pi\frac{1-R^{1-2p}}{2p-1}\to\frac{\pi}{2p-1}$。$p=\frac12$ 时 $=\pi\ln R\to\infty$；$p\lt\frac12$ 时 $R^{1-2p}\to\infty$。</p>
<p><b>答案：当且仅当 $p\gt\frac12$ 时体积有限，$V=\dfrac{\pi}{2p-1}$。</b>例：$p=1$（“加百利号角”）$V=\pi$。</p>
<p>注意：半径趋于 0 只需 $p\gt0$，但体积有限需要 $p\gt\frac12$；“趋于零”不能代替“可积”。</p>`

r1: {
  unit: "applications", n: 3, title: "综合复习：先认出方法，再动笔",
  goal: "30 分钟做三道综合新题：积分里用 Taylor 展开求极限、用 Rolle 定理连续找零点、无限区域的面积与旋转体积。每题动笔前先写一句“我为什么选这个方法”，再看提示；做错的把原因记在自己的作答区。",
  sections: [
    { id: "r1-s1", h: "1. 先诊断：题目把哪两种方法叠在一起？", html: R`<p><b>这节解决什么</b>：综合题难在“认不出该用什么方法”。下面是三种常见的“题目信号 → 方法”对应：</p><ul><li><b>信号</b>：变上限积分减去几项低次项，再除以 $x^k$（如 $\frac{\int_0^x(\cdots)dt}{x^3}$）。<b>方法</b>：把被积函数 Taylor 展开到第一个不抵消的项，再逐项积分（积分后次数加一、系数除以新次数）。</li><li><b>信号</b>：给了几个函数值为零的条件，要证某个高阶导数有零点。<b>方法</b>：先数出 $f$ 有几个零点，再一层层用 Rolle 往下传（$k$ 个零点 ⇒ $f'$ 至少 $k-1$ 个）。</li><li><b>信号</b>：区域延伸到无穷远，问面积或体积。<b>方法</b>：先写出面积 $\int y\,dx$ 或体积 $\pi\int y^2\,dx$，变成反常积分，再判断敛散、计算。</li></ul><p>每题第一行写出“方法 + 看到的信号”，例如“分子的常数项和一次项抵消了，所以被积函数要展开到二阶”。第一步选错，后面算得再熟也会失分。</p>` },
    { id: "r1-s2", h: "2. 验算不要只重算一遍", html: R`<p><b>这节解决什么</b>：重算一遍常常会重复同一个错误。换一个角度检查更有效：</p><ul><li><b>极限</b>：看符号和次数是否合理。例：被积函数在 $0$ 附近是负的，积分后的极限就不该是正的。</li><li><b>存在性证明</b>：把每次用 Rolle 的闭区间和得到的点所在的开区间都列出来，检查点确实不同。</li><li><b>几何积分</b>：体积公式里半径要<b>平方</b>；被积函数要非负。</li></ul><p><b>三个常见的错误推断</b>（本课主线题分别给出反例）：</p><ol><li>“被积函数没有初等原函数，所以不能求极限”——错，用 Taylor 展开即可（r1-p1）。</li><li>“$f$ 有两个零点就能推出 $f''$ 有零点”——错，两个零点只给 $f'$ 一个零点；$f=(x-a)(x-b)$ 的 $f''\equiv2$。需要第三个零点（r1-p2）。</li><li>“无限区域面积无穷大，所以旋转体体积也无穷大”——错，平方会让函数衰减得更快（r1-p3）。</li></ol>` },
    { id: "r1-s3", h: "3. 做错的题要改一个条件再做", html: R`<p><b>这节解决什么</b>：怎样确认自己真的会了，而不是“看懂了答案”。</p><p>做错后先给错因分类：<b>条件</b>（漏用或误用条件）、<b>方法</b>（选错工具）、<b>运算</b>（算错）、<b>表达</b>（步骤没写清）。隔一段时间只看题面重做一次。最后把一个条件改掉再做，例如：积分上限 $x$ 换成 $x^2$；旋转轴换一条；有限端点换成无穷远。如果你能说出“改了这个条件，答案为什么变/不变”，才算真正掌握了这类题。</p><p>延伸题同时讨论面积和体积何时有限，属于加练，不是 30 分钟主线必须完成的。</p>` }
  ],
  widget: null,
  concepts: [
    { id: "r1-c1", sec: "r1-s1", q: R`被积函数在 0 附近首个非零项为 $ct^2$，从 0 积到 x 后的首项是：`, opts: [R`$cx^2$`,R`$cx^3$`,R`$cx^3/3$`,R`$cx^2/2$`], a: 2, ex: R`<b>对的</b>：$\int_0^x ct^2\,dt=\frac{c x^3}{3}$，次数加一、系数除以新次数 $3$；余项 $\int_0^x o(t^2)dt$ 是 $o(x^3)$。<span class="ex"></span><b>最容易误选 B</b>：忘了除以 $3$。A、D 是没给次数加一。` },
    { id: "r1-c2", sec: "r1-s2", q: R`$f\in C^2[a,b]$ 且只知 $f(a)=f(b)=0$，能否保证某个内部点 $f''=0$？`, opts: [R`能，Rolle 用两次即可`,R`不能，例如 $f(x)=(x-a)(x-b)$ 的二阶导恒为 2`,R`能，因为 f′ 必单调`,R`只能保证端点 f″=0`], a: 1, ex: R`<b>对的</b>：$f=(x-a)(x-b)$ 满足条件，但 $f''\equiv2\ne0$。<span class="ex"></span><b>最容易误选 A</b>：两个零点用一次 Rolle 只得到 $f'$ 的<b>一个</b>零点；要对 $f'$ 再用 Rolle，需要 $f'$ 有两个不同零点，也就是 $f$ 要有三个零点。` },
    { id: "r1-c3", sec: "r1-s2", q: R`某无限区域面积为无穷大，绕轴旋转后的体积：`, opts: [R`一定为无穷大`,R`一定有限`,R`需要重新列截面面积积分判断`,R`等于原面积乘 π`], a: 2, ex: R`<b>对的</b>：面积是 $\int y\,dx$，体积是 $\pi\int y^2\,dx$，两者收敛的条件不同，要分别判断。例：$y=\frac1x$（$x\ge1$）面积 $\int_1^\infty\frac{dx}x=\infty$，体积 $\pi\int_1^\infty\frac{dx}{x^2}=\pi$ 有限。<span class="ex"></span><b>最容易误选 A</b>：上面的例子就是反例。B 也错：$y=\frac1{\sqrt x}$ 时体积 $\pi\int\frac{dx}x$ 也发散。D 忘了半径要平方。` },
    { id: "r1-c4", sec: "r1-s3", q: R`最能验证你是否掌握一道错题的方法是：`, opts: [R`立刻对照解答抄一遍`,R`只记最后数值`,R`独立重做后改动一个条件，并说明方法或阈值怎样变化`,R`把所有提示一次点开`], a: 2, ex: R`<b>对的</b>：能独立重做，并且能说清改条件后答案为什么变，说明你掌握的是方法而不是这一道题。<span class="ex"></span><b>最容易误选 A</b>：抄一遍只是“看懂”，考场上没有答案可抄。D 让提示失去了分层引导的作用。` }
  ],
  methods: [{ id: "m-review-route", title: "综合题四行自检", steps: [R`第一行：列出已知条件、目标，以及可能出问题的地方（无穷远、分母为零、端点）。`,R`第二行：写出选用的方法和看到的信号，必要时注明定理的适用条件。`,R`第三行起：完整计算，或逐次应用定理并写明每次用的区间和条件，不跳步。`,R`最后一行：用符号、次数、边界或另一种算法检查答案；再想一个“改一个条件”的变式。易错：几何体积忘了把半径平方。`] }],
  problems: [
    { id: "r1-p1", lv: "基础", src: "自编：Taylor 与积分叠加", stmt: R`不用求初等原函数，计算 $$\lim_{x\to0}\frac{\displaystyle\int_0^x\left(\sqrt{1+t}-1-\frac t2\right)dt}{x^3}.$$`, hints: [R`分母是 $x^3$，积分会把次数加一，所以被积函数只需展开到 $t^2$。被积函数里常数项和一次项已经抵消，要看 $t^2$ 项。`,R`$\sqrt{1+t}=(1+t)^{1/2}=1+\frac t2+\frac{\frac12\cdot(-\frac12)}{2}t^2+o(t^2)=1+\frac t2-\frac{t^2}8+o(t^2)$。`,R`被积函数 $=-\frac{t^2}8+r(t)$，$r(t)=o(t^2)$。积分：$\int_0^x-\frac{t^2}8dt=-\frac{x^3}{24}$；余项用 $|r(t)|\le\varepsilon t^2$ 说明积分是 $o(x^3)$（$x$ 正负都要成立）。`], method: "m-review-route", sol: R`<p><b>方法</b>：被积函数没有好算的原函数要求，但只需要它在 $0$ 附近的首项，所以用 Taylor 展开后逐项积分。</p>
      <p><b>第 1 步（展开被积函数）</b>：由 $(1+t)^{1/2}=1+\frac12t+\frac{\frac12(\frac12-1)}{2!}t^2+o(t^2)=1+\frac t2-\frac{t^2}8+o(t^2)$，</p>
      $$\sqrt{1+t}-1-\frac t2=-\frac{t^2}8+r(t),\qquad r(t)=o(t^2)\ (t\to0).$$
      <p><b>第 2 步（余项积分是 $o(x^3)$）</b>：对任意 $\varepsilon\gt0$，存在 $\delta\gt0$，当 $|t|\lt\delta$ 时 $|r(t)|\le\varepsilon t^2$。于是当 $0\lt|x|\lt\delta$ 时（$x$ 为负时积分方向反过来，取绝对值不影响）</p>
      $$\Big|\int_0^x r(t)\,dt\Big|\le\Big|\int_0^x\varepsilon t^2\,dt\Big|=\frac{\varepsilon|x|^3}{3},$$
      <p>所以 $\int_0^x r(t)\,dt=o(x^3)$。</p>
      <p><b>第 3 步（主项积分）</b>：$\int_0^x\Big(-\dfrac{t^2}8\Big)dt=-\dfrac{x^3}{24}$。所以分子 $=-\dfrac{x^3}{24}+o(x^3)$。</p>
      <p><b>第 4 步（极限）</b>：</p>
      $$\frac{-\frac{x^3}{24}+o(x^3)}{x^3}\to-\frac1{24}.$$
      <p><b>检查符号</b>：被积函数 $\approx-\frac{t^2}8\le0$；$x\gt0$ 时分子为负、分母为正；$x\lt0$ 时积分方向反转使分子为正、分母 $x^3$ 为负。两种情况比值都是负的，与 $-\frac1{24}$ 一致。</p>
      <p><b>答：极限为 $-\dfrac1{24}$。</b></p>` },
    { id: "r1-p2", lv: "基础", src: "自编：积分条件制造第三个零点", stmt: R`设 $f\in C^2[0,1]$，$f(0)=f(1)=0$，且 $\int_0^1f(x)dx=0$。证明存在 $\xi\in(0,1)$ 使 $f''(\xi)=0$。`, hints: [R`（$C^2[0,1]$：二阶导数在 $[0,1]$ 上存在且连续。）两个零点只能给 $f'$ 一个零点，不够。要从“积分为 $0$”这个条件再造出一个内部零点 $c$。若 $f\equiv0$，结论直接成立。`,R`反证：若 $f$ 在 $(0,1)$ 内没有零点，由介值定理 $f$ 在 $(0,1)$ 上不变号，比如恒正。那么积分 $\gt0$（在某个小区间上有正的下界），与积分为 $0$ 矛盾。`,R`有了 $0\lt c\lt1$，$f(0)=f(c)=f(1)=0$：在 $[0,c]$、$[c,1]$ 上各用 Rolle，得 $f'(u)=f'(v)=0$，$u\lt c\lt v$；再对 $f'$ 在 $[u,v]$ 上用 Rolle。`], method: "m-review-route", sol: R`<p><b>思路</b>：要 $f''$ 的零点，需要 $f'$ 的两个零点，即需要 $f$ 的三个零点。端点给了两个，第三个由积分条件得到。</p>
      <p><b>第 0 步</b>：若 $f\equiv0$，则 $f''\equiv0$，任取 $\xi\in(0,1)$ 即可。下设 $f$ 不恒为零。</p>
      <p><b>第 1 步（找内部零点 $c$）</b>：反设 $f$ 在 $(0,1)$ 内无零点。$f$ 连续，由介值定理，$f$ 在 $(0,1)$ 上恒正或恒负。若恒正：取 $x_1\in(0,1)$，$f(x_1)\gt0$，由连续性存在 $\eta\gt0$ 使 $[x_1-\eta,x_1+\eta]\subset(0,1)$ 且其上 $f\ge\frac{f(x_1)}2$，于是</p>
      $$\int_0^1f\,dx\ge\int_{x_1-\eta}^{x_1+\eta}f\,dx\ge2\eta\cdot\frac{f(x_1)}2\gt0,$$
      <p>与 $\int_0^1f=0$ 矛盾。恒负同理（积分 $\lt0$）。所以存在 $c\in(0,1)$ 使 $f(c)=0$。</p>
      <p><b>第 2 步（Rolle 两次）</b>：$f(0)=f(c)=0$，在 $[0,c]$ 上用 Rolle，得 $u\in(0,c)$，$f'(u)=0$；$f(c)=f(1)=0$，在 $[c,1]$ 上用 Rolle，得 $v\in(c,1)$，$f'(v)=0$。且 $u\lt c\lt v$。</p>
      <p><b>第 3 步（对 $f'$ 用 Rolle）</b>：$f\in C^2$，所以 $f'$ 在 $[u,v]$ 上连续、在 $(u,v)$ 内可导，$f'(u)=f'(v)=0$。由 Rolle，存在 $\xi\in(u,v)\subset(0,1)$ 使 $f''(\xi)=0$。</p>
      <p><b>结论：存在 $\xi\in(0,1)$ 使 $f''(\xi)=0$。</b></p>` },
    { id: "r1-p3", lv: "基础", src: "自编：无限区域与有限体积", stmt: R`区域由 $x\ge1$、$0\le y\le(\ln x)/x$ 给出。判断其平面面积是否有限，并求绕 x 轴旋转一周所得实体的体积（若有限）。`, hints: [R`面积 $=\int_1^\infty\frac{\ln x}{x}dx$；绕 $x$ 轴旋转，每个截面是半径 $y$ 的圆盘，体积 $=\pi\int_1^\infty y^2dx=\pi\int_1^\infty\frac{(\ln x)^2}{x^2}dx$。都是反常积分，先积到 $R$ 再令 $R\to\infty$。`,R`面积：$\frac{\ln x}{x}$ 的原函数是 $\frac{(\ln x)^2}2$（令 $u=\ln x$，$du=\frac{dx}x$）。体积：令 $u=\ln x$，$x=e^u$，$dx=e^udu$，化为 $\pi\int_0^\infty u^2e^{-u}du$。`,R`$\int_0^\infty u^2e^{-u}du$ 分部两次：$=\big[-u^2e^{-u}\big]_0^\infty+2\int_0^\infty ue^{-u}du$，边界项因 $u^ke^{-u}\to0$ 为零；$\int_0^\infty ue^{-u}du=1$。`], method: "m-review-route", sol: R`<p><b>(1) 面积</b>：在 $[1,R]$ 上，令 $u=\ln x$，$du=\frac{dx}x$：</p>
      $$A(R)=\int_1^R\frac{\ln x}{x}dx=\int_0^{\ln R}u\,du=\frac{(\ln R)^2}2\to+\infty\quad(R\to\infty).$$
      <p><b>面积无限。</b></p>
      <p><b>(2) 体积</b>：圆盘法，截面半径 $y=\frac{\ln x}x$，</p>
      $$V=\pi\int_1^\infty\frac{(\ln x)^2}{x^2}dx.$$
      <p>令 $u=\ln x$，则 $x=e^u$，$dx=e^u\,du$，$x$ 从 $1$ 到 $\infty$ 对应 $u$ 从 $0$ 到 $\infty$，$\frac{(\ln x)^2}{x^2}dx=\frac{u^2}{e^{2u}}e^u\,du=u^2e^{-u}du$：</p>
      $$V=\pi\int_0^\infty u^2e^{-u}\,du.$$
      <p><b>计算</b>（在 $[0,R]$ 上分部，再令 $R\to\infty$）：</p>
      $$\int_0^R u^2e^{-u}du=\big[-u^2e^{-u}\big]_0^R+2\int_0^R ue^{-u}du,\qquad \int_0^R ue^{-u}du=\big[-ue^{-u}\big]_0^R+\int_0^Re^{-u}du.$$
      <p>因为 $R^2e^{-R}\to0$，$Re^{-R}\to0$，$\int_0^Re^{-u}du=1-e^{-R}\to1$，所以 $\int_0^\infty ue^{-u}du=1$，$\int_0^\infty u^2e^{-u}du=2$。</p>
      <p><b>答：平面面积无限；旋转体体积有限，$V=2\pi$。</b></p>` }
  ],
  variants: [
    { id: "r1-v1", lv: "变种", src: "自编：积分上限改变尺度", stmt: R`计算 $$\lim_{x\to0}\frac{\displaystyle\int_0^{x^2}(e^t-1-t)dt}{x^6}.$$`, hints: [R`先把积分上限看成一个新变量 $s=x^2$，分两步：先求 $\int_0^s(\cdots)dt$ 关于 $s$ 的首项，再代 $s=x^2$。`,R`$e^t-1-t=\frac{t^2}2+o(t^2)$，积分得 $\int_0^s(e^t-1-t)dt=\frac{s^3}6+o(s^3)$。`,R`代 $s=x^2$：分子 $=\frac{x^6}6+o(x^6)$。注意是把<b>上限</b>换成 $x^2$，不是把被积函数里的 $t$ 换成 $x$。`], method: "m-review-route", sol: R`<p><b>第 1 步</b>：令 $s=x^2\ge0$，$x\to0$ 时 $s\to0^+$。</p>
      <p><b>第 2 步</b>：$e^t-1-t=\frac{t^2}2+r(t)$，$r(t)=o(t^2)$。同 r1-p1 的估计，$\int_0^sr(t)dt=o(s^3)$，所以</p>
      $$\int_0^s(e^t-1-t)dt=\frac{s^3}{6}+o(s^3).$$
      <p><b>第 3 步</b>：代 $s=x^2$，$s^3=x^6$，$o(s^3)=o(x^6)$：分子 $=\frac{x^6}6+o(x^6)$。</p>
      <p><b>答：极限为 $\dfrac16$。</b></p>
      <p class="small muted">另法：洛必达，分子求导用链式法则 $\frac{d}{dx}\int_0^{x^2}g(t)dt=g(x^2)\cdot2x$，这个因子 $2x$ 不能漏。</p>` },
    { id: "r1-v2", lv: "变种", src: "自编：几何积分的参数阈值", stmt: R`设 $p\gt0$。由 $x\ge1$、$0\le y\le x^{-p}$ 围成的无限区域，平面面积有限与绕 x 轴旋转后的体积有限，分别要求什么条件？找出面积无限而体积有限的全部 p。`, hints: [R`面积 $=\int_1^\infty x^{-p}dx$，体积 $=\pi\int_1^\infty(x^{-p})^2dx=\pi\int_1^\infty x^{-2p}dx$。`,R`基本结论：$\int_1^\infty x^{-q}dx$ 收敛 $\Leftrightarrow q\gt1$（$q=1$ 时是 $\ln R\to\infty$）。`,R`面积有限 $\Leftrightarrow p\gt1$；体积有限 $\Leftrightarrow 2p\gt1$。面积无限且体积有限：$p\le1$ 且 $p\gt\frac12$。`], method: "m-review-route", sol: R`<p><b>基本结论</b>：$\int_1^R x^{-q}dx=\frac{R^{1-q}-1}{1-q}$（$q\ne1$），$=\ln R$（$q=1$）。所以 $\int_1^\infty x^{-q}dx$ 收敛当且仅当 $q\gt1$。</p>
      <p><b>面积</b>：$A=\int_1^\infty x^{-p}dx$，有限 $\Leftrightarrow p\gt1$。</p>
      <p><b>体积</b>：$V=\pi\int_1^\infty x^{-2p}dx$，有限 $\Leftrightarrow 2p\gt1\Leftrightarrow p\gt\frac12$。</p>
      <p><b>答：面积有限当且仅当 $p\gt1$；体积有限当且仅当 $p\gt\frac12$；面积无限而体积有限的全部 $p$ 为 $\frac12\lt p\le1$。</b></p>
      <p class="small muted">端点检查：$p=1$ 时面积 $\int\frac{dx}x$ 发散、体积 $\pi\int\frac{dx}{x^2}=\pi$ 有限，符合；$p=\frac12$ 时体积 $\pi\int\frac{dx}x$ 发散，不符合。</p>` }
  ],
  extensions: [
    { id: "r1-e1", lv: "延伸", src: "自编：对数临界与几何结合", stmt: R`设 $q$ 为实数，考虑 $x\ge e$、$0\le y\le[x(\ln x)^q]^{-1/2}$ 的区域。判断绕 x 轴所得体积何时有限，有限时求值；平面面积是否可能有限？`, hints: [R`体积 $=\pi\int_e^\infty y^2dx=\pi\int_e^\infty\frac{dx}{x(\ln x)^q}$。令 $u=\ln x$，$du=\frac{dx}x$，$x=e$ 对应 $u=1$。`,R`化为 $\pi\int_1^\infty u^{-q}du$：有限 $\Leftrightarrow q\gt1$，值为 $\frac{\pi}{q-1}$。`,R`面积 $=\int_e^\infty\frac{dx}{\sqrt{x}(\ln x)^{q/2}}$，令 $x=e^u$，$dx=e^udu$，化为 $\int_1^\infty e^{u/2}u^{-q/2}du$。被积函数趋于无穷（指数增长压过任何幂），积分发散。`], method: "m-review-route", sol: R`<p><b>(1) 体积</b>：$y^2=\frac{1}{x(\ln x)^q}$，</p>
      $$V=\pi\int_e^\infty\frac{dx}{x(\ln x)^q}\ \overset{u=\ln x}{=}\ \pi\int_1^\infty u^{-q}\,du.$$
      <p>由 $\int_1^\infty u^{-q}du$ 收敛 $\Leftrightarrow q\gt1$，且此时 $\int_1^\infty u^{-q}du=\Big[\frac{u^{1-q}}{1-q}\Big]_1^\infty=\frac{1}{q-1}$。</p>
      <p><b>体积有限 $\Leftrightarrow q\gt1$，此时 $V=\dfrac{\pi}{q-1}$。</b></p>
      <p><b>(2) 面积</b>：$y=x^{-1/2}(\ln x)^{-q/2}$，令 $x=e^u$，$dx=e^u\,du$：</p>
      $$A=\int_e^\infty\frac{dx}{\sqrt x(\ln x)^{q/2}}=\int_1^\infty e^{-u/2}u^{-q/2}e^u\,du=\int_1^\infty e^{u/2}u^{-q/2}\,du.$$
      <p>对任意固定的 $q$，$\ln\big(e^{u/2}u^{-q/2}\big)=\frac u2-\frac q2\ln u\to+\infty$（$\ln u$ 增长比 $u$ 慢），所以被积函数 $\to+\infty$；当 $u$ 充分大（$u\ge U$）时被积函数 $\ge1$，$\int_U^R1\,du=R-U\to\infty$，积分发散。</p>
      <p><b>答：体积当且仅当 $q\gt1$ 时有限，值为 $\dfrac\pi{q-1}$；平面面积对所有实数 $q$ 都无限。</b></p>` }
  ]
},
l1: {
 unit:'review',n:1,title:'极限证明回顾：ε–N、单调有界与 Cauchy',
 goal:'把“越来越接近”写成能检查的不等式：会按定义选 N，会证明递推数列收敛，会用 Cauchy 准则判断收敛。约 30 分钟：先做概念题和两道基础题，变种与延伸选做。',
 sections:[
 {id:'l1-s1',h:'1. ε先给，N后选，最后才对所有n成立',html:R`<p><b>这节解决什么</b>：“$a_n$ 趋于 $A$”在证明题里不能只凭感觉，要写成一个可以检查的不等式。这就是 ε–N 定义。</p><p><b>定义</b>：$a_n\to A$ 指：对每个 $\varepsilon\gt0$（允许的误差，任意小），都存在正整数 $N$，使所有 $n\ge N$ 都满足 $|a_n-A|\lt\varepsilon$。</p><p>读法：“不管你要求多精确（$\varepsilon$），我都能找到一个位置 $N$，从那以后每一项都满足这个精度。”$N$ 可以依赖 $\varepsilon$（$\varepsilon$ 越小，$N$ 通常越大），但不能依赖后面的 $n$。</p><p><b>例</b>：$a_n=\frac{3n+1}{n+2}$，$A=3$。</p><ol><li>化简误差：$|a_n-3|=\Big|\frac{3n+1-3(n+2)}{n+2}\Big|=\frac{5}{n+2}$。</li><li>倒推：要 $\frac5{n+2}\lt\varepsilon$，只要 $n\gt\frac5\varepsilon$ 就够了（因为 $\frac5{n+2}\lt\frac5n$）。</li><li>取 $N=\lfloor5/\varepsilon\rfloor+1$（$\lfloor\cdot\rfloor$ 表示向下取整，保证 $N\gt\frac5\varepsilon$ 且是正整数）。例如 $\varepsilon=0.01$ 时 $N=501$。</li></ol><p>草稿上倒推“$n$ 要多大”，正式证明再正着写：“给定 $\varepsilon\gt0$，取 $N=\cdots$，则当 $n\ge N$ 时……”。</p>`},
 {id:'l1-s2',h:'2. 递推数列：先证明界与单调，再对极限代入',html:R`<p><b>这节解决什么</b>：$x_{n+1}=g(x_n)$ 这样一项接一项定义的数列，通项写不出来，怎么证明它收敛并求极限？标准做法是“单调有界定理”：<b>单调且有界的数列一定收敛</b>。</p><p><b>例</b>：$x_1=1$，$x_{n+1}=\sqrt{2+x_n}$。前几项：$1,\ \sqrt3\approx1.732,\ \approx1.932,\ \approx1.983,\dots$，看起来递增趋于 $2$。</p><ol><li><b>有界</b>：用归纳法证 $1\le x_n\lt2$。若 $1\le x_n\lt2$，则 $3\le2+x_n\lt4$，开方得 $\sqrt3\le x_{n+1}\lt2$。</li><li><b>单调</b>：对 $1\le x\lt2$，$(2+x)-x^2=(2-x)(x+1)\gt0$，所以 $\sqrt{2+x}\gt x$，即 $x_{n+1}\gt x_n$。</li><li><b>求极限</b>：单调有界，所以极限 $L$ 存在。在 $x_{n+1}=\sqrt{2+x_n}$ 两边令 $n\to\infty$（$\sqrt{\cdot}$ 连续）得 $L=\sqrt{2+L}$，即 $L^2-L-2=0$，$L=2$ 或 $L=-1$；由 $L\ge1$ 取 $L=2$。</li></ol><p class="callout warn">不能只解“不动点方程”$L=g(L)$ 就宣布极限。它只告诉你“<b>如果</b>收敛，极限可能是谁”。反例：$a_{n+1}=-a_n$，$a_1=1$，不动点方程 $L=-L$ 给出 $L=0$，但数列 $1,-1,1,-1,\dots$ 根本不收敛。</p>`},
 {id:'l1-s3',h:'3. Cauchy：两下标都要大，尾差先取绝对值',html:R`<p><b>这节解决什么</b>：有时我们不知道极限是多少（比如 $\sum\frac1{k^2}$），还想证明数列收敛。Cauchy 准则只看数列<b>自身各项之间</b>的距离，不需要知道极限。</p><p><b>定义</b>：$(a_n)$ 是 Cauchy 列，指对每个 $\varepsilon\gt0$，存在 $N$，使所有 $m,n\ge N$ 都有 $|a_m-a_n|\lt\varepsilon$。直观上：“足够靠后的任意两项都挨得很近。”实数的完备性保证：<b>实数列收敛 ⇔ 它是 Cauchy 列</b>。</p><p><b>例</b>：$s_n=\sum_{k=1}^n\frac1{k^2}$。不妨设 $m\gt n$。对 $k\ge2$ 有 $\frac1{k^2}\lt\frac1{k(k-1)}=\frac1{k-1}-\frac1k$，所以</p>$$|s_m-s_n|=\sum_{k=n+1}^m\frac1{k^2}\le\sum_{k=n+1}^m\left(\frac1{k-1}-\frac1k\right)=\frac1n-\frac1m\lt\frac1n.$$
 <p>（中间的和相邻项互相抵消：$(\frac1n-\frac1{n+1})+(\frac1{n+1}-\frac1{n+2})+\cdots$，只剩首尾。）所以只要取 $N\gt\frac1\varepsilon$，$m,n\ge N$ 时差就 $\lt\varepsilon$。</p><p class="callout warn">两个易错点：①一定要用绝对值 $|a_m-a_n|$，只写 $a_m-a_n\lt\varepsilon$ 不够（差可能是很大的负数）；②只有“相邻两项之差 $\to0$”不够。反例：调和数列 $h_n=\sum_{k=1}^n\frac1k$，相邻差 $\frac1{n+1}\to0$，但 $h_n\to\infty$。</p>`}],
 widget:'epsilonLab',
 concepts:[
 {id:'l1-c1',sec:'l1-s1',q:R`ε–N定义里，N允许依赖谁？`,opts:[R`ε`,R`后面量化的n`,R`同时依赖每个n`,R`必须是固定常数，与ε无关`],a:0,ex:R`<b>对的</b>：定义的顺序是“对每个 $\varepsilon$，存在 $N$，对所有 $n\ge N$”。选 $N$ 时只知道 $\varepsilon$，所以 $N$ 可以依赖 $\varepsilon$。<span class="ex"></span><b>最容易误选 B</b>：$n$ 是在 $N$ 选好之后才任意取的，$N$ 不能随 $n$ 变，否则“取 $N=n$”就什么都能证了。D 也错：$\varepsilon$ 越小通常需要越大的 $N$。`},
 {id:'l1-c2',sec:'l1-s2',q:R`解出递推的不动点以后，还缺哪一步才能据此求数列极限？`,opts:[R`再多算十项`,R`先证明数列确实收敛`,R`去掉所有负根即可`,R`不缺，必然收敛`],a:1,ex:R`<b>对的</b>：不动点方程只说明“如果收敛，极限只能是这些值之一”。必须先用单调有界或 Cauchy 准则证明极限存在。<span class="ex"></span><b>最容易误选 D</b>：反例 $a_{n+1}=-a_n$，$a_1=1$，不动点是 $0$，但数列在 $\pm1$ 间跳，不收敛。A 只是数值观察，不是证明。`},
 {id:'l1-c3',sec:'l1-s3',q:R`$a_{n+1}-a_n\to0$ 能否推出收敛？`,opts:[R`能`,R`有界时一定能`,R`不能，例如调和部分和`,R`若差为正就能`],a:2,ex:R`<b>对的</b>：调和部分和 $h_n=\sum_{k=1}^n\frac1k$ 的相邻差 $\frac1{n+1}\to0$，但 $h_{2n}-h_n\ge n\cdot\frac1{2n}=\frac12$，不是 Cauchy 列，发散。<span class="ex"></span><b>最容易误选 D</b>：调和部分和的差恰好全为正，仍发散。B 也错：$\sin\sqrt n$ 有界、相邻差趋零，但不收敛。`},
 {id:'l1-c4',sec:'l1-s3',q:R`Cauchy定义控制的是：`,opts:[R`只控制相邻两项`,R`一个固定n与所有m的差`,R`所有足够大的m、n之间的绝对差`,R`数列各项的绝对值必须小于ε`],a:2,ex:R`<b>对的</b>：$m,n$ 都要 $\ge N$，两个下标都可以任意取，并且看的是绝对值 $|a_m-a_n|$。<span class="ex"></span><b>最容易误选 A</b>：只控制相邻两项不够（调和数列反例）。D 是“趋于 $0$”的要求，Cauchy 列不必趋于 $0$。`}],
 methods:[{id:'m-epsilon-tail',title:'ε–N：把误差压进ε',steps:[R`写出误差 $|a_n-A|$ 并化简，找一个随 $n$ 趋于 $0$ 的简单上界（如 $\frac5n$）。`,R`草稿上反解“上界 $\lt\varepsilon$”需要的 $n$，取正整数 $N$（常用 $\lfloor\cdot\rfloor+1$）。`,R`正式证明正着写：“给定 $\varepsilon\gt0$，取 $N=\cdots$，则对任意 $n\ge N$，$|a_n-A|\le\cdots\lt\varepsilon$。”`,R`Cauchy 版本：估计 $|a_m-a_n|$（不妨 $m\gt n$），上界只含 $n$，再同样选 $N$。易错：别忘了绝对值。`]},{id:'m-sequence-rec',title:'递推收敛：界、单调、极限',steps:[R`先算几项，猜出界和单调方向。`,R`用归纳法证明每一项都留在同一区间（有界）。`,R`证明单调（比较 $x_{n+1}$ 与 $x_n$，或看 $x_{n+1}-x_n$ 的符号），由单调有界定理得极限存在。`,R`在递推式两边取极限（需 $g$ 连续），解方程，按区间筛掉不合适的根。易错：没证收敛就解方程。`]}],
 problems:[
 {id:'l1-p1',lv:'基础',src:'自编：ε–N定量练习',stmt:R`用定义证明 $(3n+1)/(n+2)\to3$，并给出 ε=0.01 时可用的N。`,hints:[R`先化简误差：$\left|\frac{3n+1}{n+2}-3\right|=\frac{|3n+1-3n-6|}{n+2}=\ ?$`,R`误差 $=\frac5{n+2}\lt\frac5n$。只要 $n\gt\frac5\varepsilon$，就有误差 $\lt\varepsilon$。`,R`取 $N=\lfloor5/\varepsilon\rfloor+1$（保证 $N\gt5/\varepsilon$）。$\varepsilon=0.01$ 时 $5/\varepsilon=500$，$N=501$。`],method:'m-epsilon-tail',sol:R`<p><b>第 1 步（化简误差）</b>：</p>$$\left|\frac{3n+1}{n+2}-3\right|=\left|\frac{3n+1-3n-6}{n+2}\right|=\frac{5}{n+2}\lt\frac5n.$$<p><b>第 2 步（正式证明）</b>：给定 $\varepsilon\gt0$，取 $N=\lfloor5/\varepsilon\rfloor+1$，则 $N$ 是正整数且 $N\gt\frac5\varepsilon$。对任意 $n\ge N$，有 $n\gt\frac5\varepsilon$，即 $\frac5n\lt\varepsilon$，所以</p>$$\left|\frac{3n+1}{n+2}-3\right|=\frac5{n+2}\lt\frac5n\lt\varepsilon.$$<p>由定义，$\dfrac{3n+1}{n+2}\to3$。</p><p><b>第 3 步（$\varepsilon=0.01$）</b>：$N=\lfloor500\rfloor+1=501$。检验：$n=501$ 时误差 $\frac5{503}\approx0.00994\lt0.01$ ✓。</p><p><b>答：极限为 3；$\varepsilon=0.01$ 时可取 $N=501$</b>（这个 $N$ 可用，但不一定最小，最小的是 $N=499$，因为 $\frac5{501}\lt0.01$。题目只要“可用的”即可）。</p>`},
 {id:'l1-p2',lv:'基础',src:'自编：根式递推与误差',stmt:R`$x_1=1$，$x_{n+1}=\sqrt{2+x_n}$。证明收敛并求极限，再证明 $0\lt2-x_n\le3^{1-n}$。`,hints:[R`按方法卡：先用归纳法证 $1\le x_n\lt2$，再比较 $x_{n+1}$ 与 $x_n$（比较 $2+x_n$ 与 $x_n^2$）。`,R`单调有界 ⇒ 极限 $L$ 存在，且 $L\in[1,2]$。两边取极限得 $L=\sqrt{2+L}$，即 $L^2-L-2=0$。`,R`误差：分子有理化 $2-\sqrt{2+x_n}=\frac{4-(2+x_n)}{2+\sqrt{2+x_n}}=\frac{2-x_n}{2+\sqrt{2+x_n}}$，分母 $\ge2+\sqrt3\gt3$，所以 $2-x_{n+1}\le\frac{2-x_n}3$，反复使用。`],method:'m-sequence-rec',sol:R`<p><b>第 1 步（有界，归纳）</b>：$x_1=1$ 满足 $1\le x_1\lt2$。若 $1\le x_n\lt2$，则 $3\le2+x_n\lt4$，开方得 $1\lt\sqrt3\le x_{n+1}\lt2$。所以对所有 $n$，$1\le x_n\lt2$。</p><p><b>第 2 步（递增）</b>：由 $1\le x_n\lt2$，</p>$$x_{n+1}^2-x_n^2=2+x_n-x_n^2=(2-x_n)(x_n+1)\gt0,$$<p>两边都正，所以 $x_{n+1}\gt x_n$。</p><p><b>第 3 步（求极限）</b>：单调递增且有上界 $2$，由单调有界定理，$x_n\to L$，且 $1\le L\le2$。在 $x_{n+1}=\sqrt{2+x_n}$ 两边令 $n\to\infty$（$\sqrt{\cdot}$ 连续）：$L=\sqrt{2+L}$，平方得 $L^2-L-2=(L-2)(L+1)=0$。由 $L\ge1$，<b>$L=2$</b>。</p><p><b>第 4 步（误差估计）</b>：由第 1 步 $2-x_n\gt0$。分子有理化：</p>$$2-x_{n+1}=2-\sqrt{2+x_n}=\frac{4-(2+x_n)}{2+\sqrt{2+x_n}}=\frac{2-x_n}{2+\sqrt{2+x_n}}\le\frac{2-x_n}{3},$$<p>因为 $\sqrt{2+x_n}\ge\sqrt3\gt1$，分母 $\gt3$。反复使用：$2-x_n\le\frac{2-x_{n-1}}3\le\cdots\le\frac{2-x_1}{3^{n-1}}=3^{1-n}$。</p><p><b>结论：$x_n\to2$，且 $0\lt2-x_n\le3^{1-n}$。</b></p>`}],
 variants:[
 {id:'l1-v1',lv:'变种',src:'自编：不求和也能证收敛',stmt:R`用Cauchy准则证明 $s_n=\sum_{k=1}^n1/k^2$ 收敛；无需求极限值。`,hints:[R`不妨设 $m\gt n$，则 $s_m-s_n=\sum_{k=n+1}^m\frac1{k^2}$（只剩“尾巴”）。`,R`放大成可以相消的形式：对 $k\ge2$，$\frac1{k^2}\lt\frac1{k(k-1)}=\frac1{k-1}-\frac1k$。`,R`求和后相邻项抵消，尾和 $\lt\frac1n-\frac1m\lt\frac1n$。取 $N\gt\frac1\varepsilon$。`],method:'m-epsilon-tail',sol:R`<p><b>第 1 步（估计尾和）</b>：设 $m\gt n\ge1$。对 $k\ge2$，$\frac1{k^2}\lt\frac1{k(k-1)}=\frac1{k-1}-\frac1k$，所以</p>$$|s_m-s_n|=\sum_{k=n+1}^m\frac1{k^2}\le\sum_{k=n+1}^m\Big(\frac1{k-1}-\frac1k\Big)=\frac1n-\frac1m\lt\frac1n.$$<p>（中间各项正负抵消，只剩 $\frac1n$ 和 $-\frac1m$。）</p><p><b>第 2 步（选 $N$）</b>：给定 $\varepsilon\gt0$，取正整数 $N\gt\frac1\varepsilon$。对任意 $m,n\ge N$：若 $m\gt n$，由第 1 步 $|s_m-s_n|\lt\frac1n\le\frac1N\lt\varepsilon$；若 $m\lt n$，交换 $m,n$ 同理；若 $m=n$，差为 $0$。</p><p><b>结论：$(s_n)$ 是 Cauchy 列，所以收敛。</b>（极限其实是 $\frac{\pi^2}6$，但证明不需要知道它。）</p>`},
 {id:'l1-v2',lv:'变种',src:'自编：相邻差反例',stmt:R`用Cauchy准则证明调和部分和 $h_n=\sum_{k=1}^n1/k$ 不收敛，并说明相邻差趋零为什么不能代替Cauchy准则。`,hints:[R`要证“不是 Cauchy 列”，写出它的否定：存在某个 $\varepsilon_0\gt0$，对任意 $N$，都能找到 $m,n\ge N$ 使 $|h_m-h_n|\ge\varepsilon_0$。试比较 $h_{2n}$ 与 $h_n$。`,R`$h_{2n}-h_n=\frac1{n+1}+\cdots+\frac1{2n}$，共 $n$ 项，每一项都 $\ge\frac1{2n}$。`,R`所以 $h_{2n}-h_n\ge n\cdot\frac1{2n}=\frac12$。取 $\varepsilon_0=\frac12$，对任意 $N$，选 $n=N$、$m=2N$。`],method:'m-epsilon-tail',sol:R`<p><b>第 1 步（关键估计）</b>：</p>$$h_{2n}-h_n=\sum_{k=n+1}^{2n}\frac1k\ge\underbrace{\frac1{2n}+\cdots+\frac1{2n}}_{n\text{ 项}}=\frac12,$$<p>因为每个 $k\le2n$，$\frac1k\ge\frac1{2n}$。</p><p><b>第 2 步（否定 Cauchy）</b>：取 $\varepsilon_0=\frac12$。对任意 $N$，取 $n=N$，$m=2N$，都 $\ge N$，但 $|h_m-h_n|\ge\frac12=\varepsilon_0$。所以 $(h_n)$ 不是 Cauchy 列，<b>不收敛</b>（实际上 $h_n\to+\infty$）。</p><p><b>第 3 步（解释）</b>：虽然相邻差 $h_{n+1}-h_n=\frac1{n+1}\to0$，但 Cauchy 准则要求<b>任意两个</b>足够靠后的项都接近。$n$ 到 $2n$ 之间有 $n$ 个小差，每个很小，加起来却至少 $\frac12$。</p><p><b>结论：调和部分和发散；“相邻差趋零”不能代替 Cauchy 准则。</b></p>`}],
 extensions:[{id:'l1-e1',lv:'延伸',src:'自编：Cauchy列的子列判定',stmt:R`设实数列a_n为Cauchy列，且有子列a_{n_k}→A。直接用定义证明a_n→A。`,hints:[R`（子列 $a_{n_k}$：从原数列中按下标 $n_1\lt n_2\lt\cdots$ 挑出的项，$n_k\ge k$。）三角不等式拆开：$|a_n-A|\le|a_n-a_{n_k}|+|a_{n_k}-A|$，两项各控制到 $\frac\varepsilon2$。`,R`第一项用 Cauchy 性：选 $N$ 使 $m,n\ge N$ 时 $|a_m-a_n|\lt\frac\varepsilon2$。第二项用子列收敛：$k$ 足够大时 $|a_{n_k}-A|\lt\frac\varepsilon2$。`,R`先固定<b>一个</b>足够大的 $k$，使 $n_k\ge N$ 且 $|a_{n_k}-A|\lt\frac\varepsilon2$；然后对所有 $n\ge N$ 估计 $|a_n-A|$。`],method:'m-epsilon-tail',sol:R`<p><b>要证</b>：对任意 $\varepsilon\gt0$，存在 $N$，使 $n\ge N$ 时 $|a_n-A|\lt\varepsilon$。</p><p><b>第 1 步（Cauchy 性）</b>：给定 $\varepsilon\gt0$，由 $(a_n)$ 是 Cauchy 列，存在 $N$，使 $m,n\ge N$ 时 $|a_m-a_n|\lt\frac\varepsilon2$。</p><p><b>第 2 步（固定一个子列项）</b>：由 $a_{n_k}\to A$，存在 $K$，使 $k\ge K$ 时 $|a_{n_k}-A|\lt\frac\varepsilon2$。取一个 $k\ge\max\{K,N\}$，则 $n_k\ge k\ge N$，且 $|a_{n_k}-A|\lt\frac\varepsilon2$。</p><p><b>第 3 步（估计）</b>：对任意 $n\ge N$，由于 $n,n_k\ge N$，</p>$$|a_n-A|\le|a_n-a_{n_k}|+|a_{n_k}-A|\lt\frac\varepsilon2+\frac\varepsilon2=\varepsilon.$$<p><b>结论：$a_n\to A$。</b></p>`}]
},
l2: {
 unit:'review',n:2,title:'一致连续回顾：统一δ与明确的反例点对',goal:'会分辨“连续”和“一致连续”的区别；会用导数有界、平方根估计、闭区间定理证明一致连续；否定时会给出一个固定的 ε₀ 和具体的点对。约 30 分钟，延伸选做。',
 sections:[
 {id:'l2-s1',h:'1. 一致的意思：δ不随位置移动',html:R`<p><b>这节解决什么</b>：普通连续说的是“每一点附近”函数变化小，但不同点需要的 $\delta$ 可能不同。一致连续要求<b>一个</b> $\delta$ 对整个定义域都管用。</p><p><b>定义</b>：$f$ 在集合 $D$ 上<b>一致连续</b>，指：对每个 $\varepsilon\gt0$，存在 $\delta\gt0$，使得对<b>所有</b> $x,y\in D$，只要 $|x-y|\lt\delta$，就有 $|f(x)-f(y)|\lt\varepsilon$。$\delta$ 只能依赖 $\varepsilon$（和固定的 $f$、$D$），不能依赖 $x$ 或 $y$。</p><p><b>例</b>：$f(x)=2x$ 在 $\mathbb R$ 上，$|f(x)-f(y)|=2|x-y|$，取 $\delta=\frac\varepsilon2$，与位置无关，一致连续。而 $x^2$ 在 $\mathbb R$ 上：$|x^2-y^2|=|x+y|\,|x-y|$，$x,y$ 越大，同样的距离造成越大的差，找不到统一的 $\delta$。</p><p><b>否定（不一致连续）</b>：存在一个 $\varepsilon_0\gt0$，使对每个 $\delta\gt0$，都能在 $D$ 内找到 $x,y$，满足 $|x-y|\lt\delta$ 但 $|f(x)-f(y)|\ge\varepsilon_0$。用数列写更方便：找两列点 $x_n,y_n\in D$，使 $|x_n-y_n|\to0$，而 $|f(x_n)-f(y_n)|\ge\varepsilon_0$ 始终成立。</p><p class="callout warn">不要只说“导数无界所以不一致连续”。反例：$\sqrt x$ 在 $0$ 附近导数无界，但在 $[0,\infty)$ 上一致连续（见下一节）。</p>`},
 {id:'l2-s2',h:'2. 两种统一估计与紧区间定理',html:R`<p><b>这节解决什么</b>：证明一致连续，最常用的是找一个“与位置无关”的不等式，或者直接用闭区间上的定理。</p><p><b>工具 1：导数有界</b>。若 $D$ 是区间且 $|f'|\le M$，由 Lagrange 中值定理 $|f(x)-f(y)|=|f'(\xi)|\,|x-y|\le M|x-y|$。$M\gt0$ 时取 $\delta=\frac\varepsilon M$（$M=0$ 时 $f$ 是常数）。例：$|\sin x-\sin y|\le|x-y|$，取 $\delta=\varepsilon$。</p><p><b>工具 2：平方根估计</b>：</p>$$|\sqrt x-\sqrt y|\le\sqrt{|x-y|}\qquad(x,y\ge0).$$
 <p>所以 $\sqrt x$ 在 $[0,\infty)$ 上一致连续，取 $\delta=\varepsilon^2$。例：$\varepsilon=0.1$，$\delta=0.01$：距离小于 $0.01$ 的两点，平方根之差小于 $0.1$，不管在哪里。</p><p><b>工具 3：Cantor 定理</b>：连续函数在<b>闭且有界</b>的区间 $[a,b]$ 上一定一致连续。“闭”和“有界”缺一不可：$\frac1x$ 在 $(0,1)$（不闭）上、$x^2$ 在 $[0,\infty)$（无界）上都不一致连续。</p>`},
 {id:'l2-s3',h:'3. 反例点对：越往危险区域，距离越近',html:R`<p><b>这节解决什么</b>：证明不一致连续，关键是选出“距离越来越近、函数值差却不变小”的两列点。点要往函数变化最剧烈的地方取（无穷远处，或定义域的开端点附近）。</p><p><b>例 1</b>：$x^2$ 在 $\mathbb R$ 上。取 $x_n=n$，$y_n=n+\frac1n$，距离 $\frac1n\to0$，但 $y_n^2-x_n^2=2+\frac1{n^2}\ge2$。取 $\varepsilon_0=1$ 即可否定。</p><p><b>例 2</b>：$\frac1x$ 在 $(0,1)$ 上。取 $x_n=\frac1n$，$y_n=\frac1{n+1}$（$n\ge2$，都在 $(0,1)$ 内），距离 $\frac1n-\frac1{n+1}=\frac1{n(n+1)}\to0$，但函数值差 $(n+1)-n=1$。</p><p>同一个函数换定义域，答案可能变：$\frac1x$ 在 $[1,\infty)$ 上，$\big|\frac1x-\frac1y\big|=\frac{|x-y|}{xy}\le|x-y|$（因为 $xy\ge1$），取 $\delta=\varepsilon$，一致连续。</p><p>下方工具把输入距离与输出距离并排显示。图形只作提示，证明仍要写出统一估计或明确的点对。</p>`}],
 widget:'uniformLab',
 concepts:[
 {id:'l2-c1',sec:'l2-s1',q:R`一致连续的δ不能依赖于：`,opts:[R`ε`,R`固定的定义域D`,R`当前点x`,R`预先给定的函数f`],a:2,ex:R`<b>对的</b>：“一致”的意思就是同一个 $\delta$ 对 $D$ 中所有点都管用，所以不能随 $x$ 变。<span class="ex"></span><b>最容易误选 A</b>：$\delta$ 当然可以依赖 $\varepsilon$（$\varepsilon$ 越小，$\delta$ 一般越小）。B、D 是题目一开始就固定的，也可以依赖。依赖 $x$ 的只是普通的“逐点连续”。`},
 {id:'l2-c2',sec:'l2-s2',q:R`导数无界是否一定不一致连续？`,opts:[R`是`,R`否，√x在[0,∞)上一致连续`,R`只有闭区间上是`,R`仅递增函数时是`],a:1,ex:R`<b>对的</b>：$\sqrt x$ 在 $0$ 附近导数 $\frac1{2\sqrt x}\to\infty$，但 $|\sqrt x-\sqrt y|\le\sqrt{|x-y|}$ 给出统一的 $\delta=\varepsilon^2$。<span class="ex"></span><b>最容易误选 A</b>：“导数有界 ⇒ 一致连续”是充分条件，反过来不成立。C 也错：$\sqrt x$ 在闭区间 $[0,1]$ 上导数无界，却由 Cantor 定理一致连续。`},
 {id:'l2-c3',sec:'l2-s3',q:R`要否定一致连续，以下哪种证据足够？`,opts:[R`函数值很大`,R`找到一个很陡的点`,R`点对距离趋零，函数值差始终至少一个固定正数`,R`每个δ都有一对函数值不相等`],a:2,ex:R`<b>对的</b>：这正是否定式：固定 $\varepsilon_0$，对任意小的距离都能找到“坏”点对。<span class="ex"></span><b>最容易误选 D</b>：函数值“不相等”太弱，差可以随距离一起趋于 $0$（如 $2x$）。A、B 也不够：$\sqrt x$ 在 $0$ 处很陡、$x$ 在 $\mathbb R$ 上值可以很大，但都一致连续。`},
 {id:'l2-c4',sec:'l2-s2',q:R`连续函数一定在哪类区间上一致连续？`,opts:[R`任意有界开区间`,R`任意闭区间，包括无界的`,R`闭有界区间`,R`任意区间`],a:2,ex:R`<b>对的</b>：Cantor 定理要求区间既闭又有界（紧区间）。<span class="ex"></span><b>误选 A</b>：$\frac1x$ 在 $(0,1)$ 上连续但不一致连续。<b>误选 B</b>：$x^2$ 在 $[0,\infty)$ 上连续但不一致连续。`}],
 methods:[{id:'m-uniform-bound',title:'证一致连续：统一估计',steps:[R`先写清定义域 $D$。`,R`优先找形如 $|f(x)-f(y)|\le M|x-y|$（导数有界）或 $\le C\sqrt{|x-y|}$ 的不等式。`,R`由不等式解出只依赖 $\varepsilon$ 的 $\delta$（如 $\delta=\frac\varepsilon M$、$\delta=\varepsilon^2$），检查 $\delta$ 里没有 $x,y$。`,R`若用 Cantor 定理，要写明三个条件：区间闭、有界、$f$ 连续。`]},{id:'m-uniform-counter',title:'否定一致连续：固定ε₀和点对',steps:[R`找“危险区域”：无穷远处增长太快，或开端点附近变化太剧烈。`,R`在 $D$ 内选两列点 $x_n,y_n$，证明 $|x_n-y_n|\to0$。`,R`算出 $|f(x_n)-f(y_n)|$，证明它始终 $\ge$ 某个固定正数，取 $\varepsilon_0$ 为这个数（或更小）。`,R`收尾写：“取 $\varepsilon_0=\cdots$，对任意 $\delta\gt0$，取 $n$ 足够大使 $|x_n-y_n|\lt\delta$，但 $|f(x_n)-f(y_n)|\ge\varepsilon_0$，故不一致连续。”易错：点必须在定义域内。`]}],
 problems:[
 {id:'l2-p1',lv:'基础',src:'自编：平方根的统一估计',stmt:R`证明f(x)=√x在[0,∞)上一致连续，并给出可用的δ(ε)。`,hints:[R`目标是不等式 $|\sqrt x-\sqrt y|\le\sqrt{|x-y|}$。不妨设 $x\ge y\ge0$，两边平方后比较 $(\sqrt x-\sqrt y)^2$ 与 $x-y$。`,R`$x-y=(\sqrt x-\sqrt y)(\sqrt x+\sqrt y)$，而 $\sqrt x+\sqrt y\ge\sqrt x-\sqrt y\ge0$，所以 $x-y\ge(\sqrt x-\sqrt y)^2$。`,R`于是函数值差 $\le\sqrt{|x-y|}$。要它 $\lt\varepsilon$，只需 $|x-y|\lt\varepsilon^2$，取 $\delta=\varepsilon^2$。`],method:'m-uniform-bound',sol:R`<p><b>第 1 步（建立不等式）</b>：设 $x\ge y\ge0$。因为 $\sqrt x+\sqrt y\ge\sqrt x-\sqrt y\ge0$，</p>$$x-y=(\sqrt x-\sqrt y)(\sqrt x+\sqrt y)\ge(\sqrt x-\sqrt y)^2.$$<p>开方得 $\sqrt x-\sqrt y\le\sqrt{x-y}$。$x\lt y$ 时交换两者，同理。所以对所有 $x,y\ge0$：</p>$$|\sqrt x-\sqrt y|\le\sqrt{|x-y|}.$$<p><b>第 2 步（选 $\delta$）</b>：给定 $\varepsilon\gt0$，取 $\delta=\varepsilon^2$。对任意 $x,y\ge0$，若 $|x-y|\lt\delta$，则 $|\sqrt x-\sqrt y|\le\sqrt{|x-y|}\lt\sqrt{\varepsilon^2}=\varepsilon$。$\delta$ 不依赖 $x,y$。</p><p><b>结论：$\sqrt x$ 在 $[0,\infty)$ 上一致连续，可取 $\delta=\varepsilon^2$。</b></p>`},
 {id:'l2-p2',lv:'基础',src:'自编：同函数不同定义域',stmt:R`分别判断f(x)=1/x在(0,1)和[1,∞)上是否一致连续，给出证明。`,hints:[R`$(0,1)$ 的危险区域在 $0$ 附近（$\frac1x$ 急剧变大）。试 $x_n=\frac1n$，$y_n=\frac1{n+1}$，$n\ge2$。`,R`这两点的距离 $\frac1{n(n+1)}\to0$，函数值差 $(n+1)-n=1$。`,R`$[1,\infty)$ 上 $xy\ge1$，直接估计 $\big|\frac1x-\frac1y\big|=\frac{|x-y|}{xy}\le|x-y|$。`],method:'m-uniform-counter',sol:R`<p><b>(1) 在 $(0,1)$ 上：不一致连续。</b></p><p>取 $x_n=\frac1n$，$y_n=\frac1{n+1}$（$n\ge2$，都在 $(0,1)$ 内）。则</p>$$|x_n-y_n|=\frac1n-\frac1{n+1}=\frac{1}{n(n+1)}\to0,\qquad |f(x_n)-f(y_n)|=|n-(n+1)|=1.$$<p>取 $\varepsilon_0=\frac12$。对任意 $\delta\gt0$，取 $n$ 足够大使 $\frac1{n(n+1)}\lt\delta$，则这对点距离 $\lt\delta$，但函数值差 $=1\ge\varepsilon_0$。所以不一致连续。</p><p><b>(2) 在 $[1,\infty)$ 上：一致连续。</b></p><p>对 $x,y\ge1$，$xy\ge1$，所以</p>$$\Big|\frac1x-\frac1y\Big|=\frac{|y-x|}{xy}\le|x-y|.$$<p>给定 $\varepsilon\gt0$，取 $\delta=\varepsilon$，则 $|x-y|\lt\delta$ 时函数值差 $\lt\varepsilon$。</p><p><b>结论：$\frac1x$ 在 $(0,1)$ 上不一致连续，在 $[1,\infty)$ 上一致连续。</b>可见定义域无界不一定破坏一致连续。</p>`}],
