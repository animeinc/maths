  unit: "taylor", n: 1, title: "从切线到多项式：Taylor 公式是什么",

  sections: [
    { id: "t1-s1", h: "1. 切线只是第一步", html: R`
      <p><b>这节解决什么</b>：复杂函数（$\ln x$、$e^x$、$\sin x$）不好直接算，我们想在某点附近用一个<b>多项式</b>去近似它。多项式只用加减乘，好算、好比较大小。</p>
      <p>最简单的近似是切线：在 $x_0$ 附近用直线 $f(x_0)+f'(x_0)(x-x_0)$ 代替 $f(x)$。误差是 $o(x-x_0)$。</p>
      <p class="small">记号 $o(\cdot)$（读作“小 o”）：$g(x)=o\big((x-x_0)^n\big)$ 表示 $\dfrac{g(x)}{(x-x_0)^n}\to0\ (x\to x_0)$，也就是“$g$ 比 $(x-x_0)^n$ 还小得多”。</p>
      <p>切线只让函数值和一阶导数对上。想更准，就让二阶、三阶……导数也对上，得到 $n$ 次 <b>Taylor 多项式</b>：</p>
      $$T_n(x)=f(x_0)+f'(x_0)(x-x_0)+\frac{f''(x_0)}{2!}(x-x_0)^2+\cdots+\frac{f^{(n)}(x_0)}{n!}(x-x_0)^n.$$
      <p><b>系数为什么是 $\frac{f^{(k)}(x_0)}{k!}$</b>：$(x-x_0)^k$ 求 $k$ 次导数得到常数 $k!$。除掉 $k!$ 以后，$T_n$ 在 $x_0$ 处的第 $k$ 阶导数恰好等于 $f^{(k)}(x_0)$（$k=0,1,\dots,n$）。</p>
      <p><b>小例子</b>：$f(x)=e^x$，$x_0=0$。所有导数在 $0$ 处都是 $1$，所以 $T_2(x)=1+x+\frac{x^2}{2}$。取 $x=0.1$：$T_2(0.1)=1.105$，而 $e^{0.1}=1.10517\ldots$，误差只有约 $0.00017$。</p>
      <p>下面拖动滑块：$n$ 越大，多项式贴住曲线的范围越宽；但对 $\ln(1+x)$ 和 $\frac1{1-x}$，越过某个边界之后，多加项反而越来越离谱。</p>` },
    { id: "t1-s2", h: "2. 两种余项：一个说“多小”，一个说“具体是多少”", html: R`
      <p><b>这节解决什么</b>：用 $T_n$ 代替 $f$ 总有误差。误差叫<b>余项</b>，记 $R_n(x)=f(x)-T_n(x)$。课上给了两种写法，条件不同，用途也不同。</p>
      <div class="cmp">
        <div><b>Peano 余项</b><span>$R_n(x)=o\big((x-x_0)^n\big)\ (x\to x_0)$</span><span class="small muted">条件：$f$ 在 <u>$x_0$ 这一点</u> 有 $n$ 阶导数。</span><span class="small">只告诉你：$x\to x_0$ 时余项比 $(x-x_0)^n$ 小得多，不告诉你具体多大。用途：<b>求极限、判断阶、展开到指定阶</b>。</span></div>
        <div><b>Lagrange 余项</b><span>$R_n(x)=\frac{f^{(n+1)}(\xi)}{(n+1)!}(x-x_0)^{n+1}$</span><span class="small muted">条件：$f$ 在 <u>$x_0$ 与 $x$ 之间的整个区间上</u> 有 $n+1$ 阶导数。$\xi$ 是介于 $x_0$ 与 $x$ 之间的某个点，随 $x$ 变化。</span><span class="small">给出一个精确等式，对固定的 $x$ 就成立，不需要 $x\to x_0$。用途：<b>证明不等式、误差估计、证明“存在 $\xi$ 使……”</b>。</span></div>
      </div>
      <p><b>小例子</b>：$e^x$ 在 $0$ 处展开到 $n=2$。Peano 写法：$e^x=1+x+\frac{x^2}2+o(x^2)$。Lagrange 写法：$e^x=1+x+\frac{x^2}2+\frac{e^{\xi}}{6}x^3$，$\xi$ 在 $0$ 与 $x$ 之间。取 $x=0.1$，由 $e^\xi\lt e^{0.1}\lt2$ 得误差 $\lt\frac{2}{6}\times0.001\approx0.00033$，与上一节实际误差 $0.00017$ 相符。</p>
      <p class="callout">怎么选：题目里有 $\lim$，或要求“展开到 $o(x^3)$” → 用 Peano。题目要你证“存在 $\xi$”、“对所有 $x$ 成立的不等式”、“误差小于 $10^{-5}$” → 用 Lagrange。</p>` },
    { id: "t1-s3", h: "3. 必背的 8 个展开（$x_0=0$）", html: "__MUST__" },
    { id: "t1-s4", h: "4. 唯一性定理和一个陷阱", html: R`
      <p><b>这节解决什么</b>：复杂函数逐个求导很累。唯一性定理允许我们“拼”出展开式，再直接读出导数。</p>
      <p><b>唯一性（讲义第 7 周定理 3）</b>：若</p>$$f(x)=a_0+a_1(x-x_0)+\cdots+a_n(x-x_0)^n+o\big((x-x_0)^n\big),$$<p><u>并且已知 $f$ 在 $x_0$ 处有 $n$ 阶导数</u>，那么系数一定是 $a_k=\frac{f^{(k)}(x_0)}{k!}$。</p>
      <p><b>小例子</b>：求 $\ln x$ 在 $x_0=3$ 处的展开。先改写 $\ln x=\ln3+\ln\big(1+\frac{x-3}{3}\big)$，再把 $u=\frac{x-3}3$ 代入 $\ln(1+u)=u-\frac{u^2}2+\cdots$，就得到 $\ln x=\ln3+\frac{x-3}{3}-\frac{(x-3)^2}{18}+\cdots$。读系数：$(\ln x)''\big|_{x=3}=2!\times\big(-\frac1{18}\big)=-\frac19$，和直接求导 $-\frac1{x^2}\big|_{x=3}=-\frac19$ 一致。</p>
      <p class="callout warn"><b>陷阱</b>：反过来不成立。“$f$ 能写成 $n$ 阶展开式”推不出“$f^{(n)}(x_0)$ 存在”（$n\ge2$ 时）。<span class="ex"></span>反例：$f(x)=x^3D(x)$，其中 $D$ 是 Dirichlet 函数（有理数处取 $1$，无理数处取 $0$）。因为 $|f(x)|\le|x|^3$，有 $f(x)=0+0\cdot x+0\cdot x^2+o(x^2)$；但 $f$ 在每个 $x\ne0$ 处都不连续，所以 $0$ 附近 $f'$ 不存在，更谈不上 $f''(0)$。<span class="ex"></span>所以题目问“求 $g''(0)$”时，<u>先证明 $g''(0)$ 存在</u>，不能直接读系数。第二课的 2025 期末第 5 题就考这一点。</p>` }

  problems: [
    { id: "t1-p1", lv: "基础", src: "讲义第 7 周例 6", stmt: R`写出 $\ln x$ 在 $x_0=3$ 处带 Peano 余项的 $n$ 阶 Taylor 公式。`,
      hints: [R`不要逐个求导。想办法把 $\ln x$ 化成 $\ln3+\ln(1+u)$ 的样子，借用 $\ln(1+u)$ 的已知展开。`, R`$\ln x=\ln\big(3\cdot\frac x3\big)=\ln3+\ln\big(1+\frac{x-3}{3}\big)$。令 $u=\frac{x-3}{3}$，当 $x\to3$ 时 $u\to0$。`, R`套公式 $\ln(1+u)=\sum_{k=1}^n\frac{(-1)^{k-1}}{k}u^k+o(u^n)$，把 $u=\frac{x-3}3$ 代回，$u^k=\frac{(x-3)^k}{3^k}$；并且 $o(u^n)=o\big((x-3)^n\big)$，因为两者只差常数倍 $3^n$。`],
      method: "m-which",
      sol: R`<p><b>目标</b>：把 $\ln x$ 写成 $(x-3)$ 的多项式加 $o\big((x-3)^n\big)$。</p>
      <p><b>第 1 步（改写）</b>：$\ln x=\ln3+\ln\Big(1+\dfrac{x-3}{3}\Big)$。令 $u=\dfrac{x-3}{3}$，则 $x\to3$ 时 $u\to0$。</p>
      <p><b>第 2 步（套已知展开）</b>：$u\to0$ 时</p>
      $$\ln(1+u)=u-\frac{u^2}{2}+\frac{u^3}{3}-\cdots+\frac{(-1)^{n-1}}{n}u^n+o(u^n).$$
      <p><b>第 3 步（代回）</b>：$u^k=\dfrac{(x-3)^k}{3^k}$，且 $o(u^n)=o\big((x-3)^n\big)$（因为 $u^n$ 与 $(x-3)^n$ 只差常数因子 $3^{-n}$）。所以</p>
      $$\ln x=\ln3+\frac{x-3}{3}-\frac{(x-3)^2}{2\cdot9}+\frac{(x-3)^3}{3\cdot27}-\cdots$$
      <p><b>结论</b>：</p>
      $$\boxed{\ln x=\ln3+\sum_{k=1}^{n}\frac{(-1)^{k-1}}{k\cdot3^k}(x-3)^k+o\big((x-3)^n\big)\quad(x\to3).}$$
      <p><b>补充</b>：$\ln x$ 在 $x=3$ 处任意阶可导，所以由唯一性定理，上式就是它的 Taylor 公式；读系数还能得到 $\ln^{(k)}(3)=k!\cdot\frac{(-1)^{k-1}}{k\cdot3^k}=\frac{(-1)^{k-1}(k-1)!}{3^k}$。验算 $k=1$：$\frac1x\big|_{3}=\frac13$ ✓。</p>` },
    { id: "t1-p2", lv: "基础", src: "作业 11/2", stmt: R`举一个例子说明：$f(x)=a_0+a_1x+a_2x^2+o(x^2)\ (x\to0)$ 成立，但 $f''(0)$ 不存在。`,
      hints: [R`思路：让 $f$ 在 $0$ 附近非常小（这样展开式成立），但在 $0$ 以外的点很不光滑（这样连 $f'$ 都不存在）。`, R`试试“$x^3$ 乘一个有界但处处不连续的函数”，例如 Dirichlet 函数 $D(x)$（有理数取 $1$，无理数取 $0$）。`, R`取 $f(x)=x^3D(x)$。第一步：$|f(x)|\le|x|^3$，所以 $\frac{f(x)}{x^2}\to0$。第二步：在 $x_1\ne0$ 处，沿有理点和无理点趋近 $x_1$，$f$ 的极限分别是 $x_1^3$ 和 $0$。`],
      method: "m-which",
      sol: R`<p><b>构造</b>：取 $f(x)=x^3D(x)$，其中 $D(x)=1\ (x\in\mathbb Q)$，$D(x)=0\ (x\notin\mathbb Q)$。</p>
      <p><b>(1) 展开式成立</b>：因为 $0\le D(x)\le1$，有 $|f(x)|\le|x|^3$，所以</p>
      $$\Big|\frac{f(x)}{x^2}\Big|\le|x|\to0\quad(x\to0),$$
      <p>即 $f(x)=o(x^2)$，也就是 $f(x)=0+0\cdot x+0\cdot x^2+o(x^2)$（$a_0=a_1=a_2=0$）。</p>
      <p><b>(2) $f''(0)$ 不存在</b>：任取 $x_1\ne0$。沿有理数列 $r_k\to x_1$，$f(r_k)=r_k^3\to x_1^3\ne0$；沿无理数列 $s_k\to x_1$，$f(s_k)=0\to0$。两个极限不同，所以 $f$ 在 $x_1$ 处不连续，因而在 $x_1$ 处不可导。</p>
      <p>于是 $f'$ 只在 $x=0$ 一点有定义（由定义 $f'(0)=\lim\frac{f(x)}{x}=0$），在 $0$ 的任何邻域里都不存在。$f''(0)=\lim\frac{f'(x)-f'(0)}{x}$ 需要 $f'$ 在 $0$ 附近有定义，所以<b>$f''(0)$ 不存在</b>。</p>
      <p><b>结论</b>：<b>$f(x)=x^3D(x)$ 满足二阶展开式，但 $f''(0)$ 不存在。</b></p>` }

t2: {
  unit: "taylor", n: 2, title: "用 Peano 余项求极限与展开",
  goal: R`掌握“阶数匹配”四步法求极限，会展开复合函数，并能严格回答“求 $g''(0)$”这类题（先证存在，再求值）。`,
  sections: [
    { id: "t2-s1", h: R`1. $o(\cdot)$ 的运算规则（$x\to0$）`, html: R`
      <p><b>这节解决什么</b>：用展开式算极限时，会有一堆 $o(\cdot)$ 要加减乘除。这里是它们的运算规则。回忆：$o(x^n)$ 表示“除以 $x^n$ 后趋于 $0$ 的某个函数”。</p>
      <ul>
        <li><b>加减</b>：$o(x^m)\pm o(x^n)=o(x^{\min(m,n)})$。例：$o(x^2)+o(x^3)=o(x^2)$，低阶的那个“吞掉”高阶的。</li>
        <li><b>乘</b>：$x^k\cdot o(x^n)=o(x^{n+k})$，$o(x^m)\cdot o(x^n)=o(x^{m+n})$。例：$x\cdot o(x)=o(x^2)$。</li>
        <li><b>除</b>：$\frac{o(x^n)}{x^k}=o(x^{n-k})$（$k\le n$）。例：$\frac{o(x^3)}{x^2}=o(x)$。</li>
        <li><b>没有</b> $o(x^n)-o(x^n)=0$：两个 $o(x^n)$ 往往是两个不同的未知函数，相减还是 $o(x^n)$，不是 $0$。</li>
        <li><b>复合</b>：若 $u(x)\to0$，且 $\frac{u(x)}{x}$ 有界（记作 $u=O(x)$），则 $o(u^n)=o(x^n)$。所以 $e^{u}$、$\ln(1+u)$ 可以先按 $u$ 展开，再把 $u$ 的展开式代进去。例：$e^{\sin x}=1+\sin x+\frac{\sin^2x}{2}+o(x^2)=1+x+\frac{x^2}2+o(x^2)$。</li>
      </ul>` },
    { id: "t2-s2", h: "2. 阶数匹配：展开到几阶？", html: R`
      <p><b>这节解决什么</b>：展开太少会算不出来，展开太多又浪费时间。规则是“看分母的阶”。</p>
      <p>求分式极限 $\lim\frac{A(x)}{B(x)}$ 时，关键是分子、分母各自的<b>最低次非零项</b>。先把容易的一边（通常是分母）化成 $c\,x^k$，那么另一边就展开到 $x^k$ 项，余项写 $o(x^k)$。</p>
      <p><b>小例子</b>：$\lim\limits_{x\to0}\frac{e^x-1-x}{x^2}$。分母是 $x^2$，所以 $e^x$ 展开到 $x^2$：$e^x-1-x=\frac{x^2}{2}+o(x^2)$，极限是 $\frac12$。若只展开到一阶，分子只剩 $o(x)$，$\frac{o(x)}{x^2}$ 无法判断。</p>
      <p><b>复合函数的内层展开到几阶</b>：看外层从几次开始。例如 $e^{u}-1-u=\frac{u^2}{2}+o(u^2)$ 从 $u^2$ 开始；若 $u=\lambda x+o(x)$，那么 $u^2=\lambda^2x^2+o(x^2)$，内层展开到一阶就够得到 $x^2$ 项。</p>
      <p class="callout">洛必达法则也能做这些题。但对 $\frac{\int_0^x\cdots}{\sin x-x}$ 这类要求导两三次的题，Taylor 更快、更不容易算错；而且 Taylor 顺手给出“函数是几阶小量”，这正是后面判断反常积分敛散要用的。</p>` }
  ],

    { id: "t2-c2", sec: "t2-s2", q: R`求 $\lim_{x\to0}\frac{e^{x^2}-1-x^2}{x^4}$，$e^{u}$ 需要展开到：`,

    { id: "t2-p1", lv: "基础", src: "热身", stmt: R`求 $\displaystyle\lim_{x\to0}\frac{\tan x-\sin x}{x^3}$。`,
      hints: [R`用四步法：分母已经是 $x^3$（$k=3$），所以分子每一项都展开到 $x^3$。`, R`需要两个展开：$\tan x=x+\frac{x^3}{3}+o(x^3)$，$\sin x=x-\frac{x^3}{6}+o(x^3)$。`, R`相减：分子 $=\Big(x+\frac{x^3}3\Big)-\Big(x-\frac{x^3}6\Big)+o(x^3)=\Big(\frac13+\frac16\Big)x^3+o(x^3)$。`],
      method: "m-limit", sol: R`<p><b>定阶</b>：分母是 $x^3$，分子展开到 $x^3$。</p>
      <p><b>展开</b>：$x\to0$ 时</p>

      <p><b>读结果</b>：</p>

    { id: "t2-p2", lv: "真题", src: "2023 秋期末 2(1)", stmt: R`计算 $\displaystyle\lim_{x\to0^+}\frac{\left(\int_0^x e^{-t^2}\,dt\right)-x}{\sin x-x}$。`,
      hints: [R`先定阶：分母 $\sin x-x$ 是几阶无穷小？用 $\sin x$ 的展开。`, R`分母 $=-\frac{x^3}{6}+o(x^3)$，所以分子要展开到 $x^3$。先展开被积函数：$e^{-t^2}=1-t^2+o(t^2)$（$e^u$ 中令 $u=-t^2$）。`, R`逐项积分：$\int_0^x(1-t^2)\,dt=x-\frac{x^3}{3}$；还要说明余项积分 $\int_0^x o(t^2)\,dt=o(x^3)$（对任意 $\varepsilon\gt0$，$t$ 小时 $|o(t^2)|\le\varepsilon t^2$）。也可以直接用洛必达。`],
      method: "m-limit",
      sol: R`<p><b>方法一（Taylor）</b></p>
      <p><b>分母</b>：$\sin x-x=-\dfrac{x^3}{6}+o(x^3)$，所以分子要展开到 $x^3$。</p>
      <p><b>被积函数</b>：在 $e^u=1+u+o(u)$ 中令 $u=-t^2$，得 $e^{-t^2}=1-t^2+r(t)$，其中 $r(t)=o(t^2)$。</p>
      <p><b>余项积分是 $o(x^3)$</b>：对任意 $\varepsilon\gt0$，存在 $\delta\gt0$，当 $0\lt t\lt\delta$ 时 $|r(t)|\le\varepsilon t^2$（因为 $r(t)/t^2\to0$）。于是当 $0\lt x\lt\delta$ 时</p>
      $$\Big|\int_0^x r(t)\,dt\Big|\le\int_0^x\varepsilon t^2\,dt=\frac{\varepsilon x^3}{3},$$
      <p>即 $\dfrac{1}{x^3}\int_0^x r(t)\,dt\to0$，也就是 $\int_0^x r(t)\,dt=o(x^3)$。</p>
      <p><b>分子</b>：</p>
      $$\int_0^x e^{-t^2}dt-x=\Big(x-\frac{x^3}{3}\Big)+o(x^3)-x=-\frac{x^3}{3}+o(x^3).$$
      <p><b>求极限</b>：</p>
      $$\frac{-\frac{x^3}3+o(x^3)}{-\frac{x^3}6+o(x^3)}=\frac{-\frac13+o(1)}{-\frac16+o(1)}\to\frac{-1/3}{-1/6}=2.$$
      <p><b>方法二（洛必达）</b>：分子、分母在 $x\to0^+$ 时都趋于 $0$，且都可导（分子用变上限积分求导：$\frac{d}{dx}\int_0^xe^{-t^2}dt=e^{-x^2}$）。求导后</p>
      $$\lim_{x\to0^+}\frac{e^{-x^2}-1}{\cos x-1}=\lim\frac{-x^2+o(x^2)}{-\frac{x^2}{2}+o(x^2)}=2.$$
      <p><b>答：极限为 $2$。</b></p>` },
    { id: "t2-p3", lv: "真题", src: "2023 秋期末 2(2)", stmt: R`求 $f(x)=\ln(1+x)-\sin x$ 在 $x=0$ 处带 Peano 余项的 Taylor 公式，余项为 $o(x^3)$。`,
      hints: [R`余项要 $o(x^3)$，所以两项都展开到 $x^3$，再相减。`, R`$\ln(1+x)=x-\frac{x^2}{2}+\frac{x^3}{3}+o(x^3)$。`, R`$\sin x=x-\frac{x^3}{6}+o(x^3)$。相减时 $x$ 抵消，$x^3$ 的系数是 $\frac13-\big(-\frac16\big)$。`],
      method: "m-limit", sol: R`<p><b>第 1 步（分别展开到 $x^3$）</b>：$x\to0$ 时</p>
      $$\ln(1+x)=x-\frac{x^2}{2}+\frac{x^3}{3}+o(x^3),\qquad \sin x=x-\frac{x^3}{6}+o(x^3).$$
      <p><b>第 2 步（逐项相减）</b>：</p>
      <ul><li>$x$ 项：$1-1=0$；</li><li>$x^2$ 项：$-\frac12-0=-\frac12$；</li><li>$x^3$ 项：$\frac13-\big(-\frac16\big)=\frac12$；</li><li>余项：$o(x^3)-o(x^3)=o(x^3)$。</li></ul>
      <p><b>结论</b>：</p>
      $$f(x)=-\frac{x^2}{2}+\frac{x^3}{2}+o(x^3)\quad(x\to0).$$` },
    { id: "t2-p4", lv: "真题", src: "2025 秋期中 1(1)", stmt: R`计算 $\displaystyle\lim_{x\to0}\left(\frac{\ln(1+x)}{x}\right)^{\frac{1}{e^x-1}}$。`,
      hints: [R`底数 $\to1$，指数 $\to\infty$，是 $1^\infty$ 型。先取对数：$y=\big(\cdots\big)^{\cdots}$，$\ln y=\frac{1}{e^x-1}\ln\frac{\ln(1+x)}{x}$。`, R`求 $K=\lim\dfrac{\ln\frac{\ln(1+x)}{x}}{e^x-1}$。分母 $e^x-1=x+o(x)$ 是一阶，所以分子展开到一阶就够。`, R`$\frac{\ln(1+x)}{x}=\frac{x-\frac{x^2}2+o(x^2)}{x}=1-\frac x2+o(x)$；再用 $\ln(1+u)=u+o(u)$，$u=-\frac x2+o(x)$。`],
      method: "m-limit", sol: R`<p><b>第 1 步（取对数）</b>：记原式为 $y$，则 $\ln y=\dfrac{\ln\frac{\ln(1+x)}{x}}{e^x-1}$。先求它的极限 $K$。</p>
      <p><b>第 2 步（展开底数）</b>：$\ln(1+x)=x-\frac{x^2}{2}+o(x^2)$，除以 $x$：</p>
      $$\frac{\ln(1+x)}{x}=1-\frac x2+o(x).$$
      <p><b>第 3 步（再取对数）</b>：令 $u=-\frac x2+o(x)\to0$，$\ln(1+u)=u+o(u)$，而 $o(u)=o(x)$，所以</p>
      $$\ln\frac{\ln(1+x)}{x}=-\frac x2+o(x).$$
      <p><b>第 4 步（除以分母）</b>：$e^x-1=x+o(x)$，故</p>
      $$K=\lim_{x\to0}\frac{-\frac x2+o(x)}{x+o(x)}=-\frac12.$$
      <p><b>第 5 步（还原）</b>：$y=e^{\ln y}$，$e^u$ 连续，所以原极限 $=e^{K}$。</p>
      <p><b>答：原极限 $=e^{-1/2}=\frac{1}{\sqrt e}$。</b></p>` },
    { id: "t2-p5", lv: "真题", src: "2026 秋期中 5(1)（本学期）", stmt: R`已知 $f(0)=0$，$f(1)=1$，$f'(0)=\lambda$，且 $f'$ 连续。求 $\displaystyle\lim_{x\to0^+}\frac{e^{f(x)}-1-f(x)}{e^x-1-x}$。`,
      hints: [R`观察：分子、分母结构一样，都是 $e^{u}-1-u$，分子里 $u=f(x)$，分母里 $u=x$。而 $e^u-1-u=\frac{u^2}{2}+o(u^2)$。`, R`为了不用分 $\lambda=0$ 和 $\lambda\ne0$ 讨论，定义 $\varphi(u)=\frac{e^u-1-u}{u^2}$（$u\ne0$），$\varphi(0)=\frac12$。它在 $0$ 处连续，并且 $e^u-1-u=u^2\varphi(u)$ 对所有 $u$ 成立。`, R`原式 $=\Big(\frac{f(x)}{x}\Big)^2\cdot\frac{\varphi(f(x))}{\varphi(x)}$。由导数定义 $\frac{f(x)}{x}=\frac{f(x)-f(0)}{x-0}\to\lambda$；$f$ 连续使 $f(x)\to0$，所以 $\varphi(f(x))\to\frac12$。`],
      method: "m-limit",
      sol: R`<p><b>已知</b>：$f(0)=0$，$f'(0)=\lambda$。<b>目标</b>：求 $\lim\limits_{x\to0^+}\dfrac{e^{f(x)}-1-f(x)}{e^x-1-x}$。（条件 $f(1)=1$ 本小问用不到，是给第 (2) 小问的。）</p>
      <p><b>第 1 步（引入辅助函数）</b>：令</p>
      $$\varphi(u)=\begin{cases}\dfrac{e^u-1-u}{u^2},&u\ne0,\\[2mm] \dfrac12,&u=0.\end{cases}$$
      <p>由 $e^u=1+u+\frac{u^2}2+o(u^2)$ 得 $\lim\limits_{u\to0}\varphi(u)=\frac12=\varphi(0)$，所以 $\varphi$ 在 $0$ 处连续。并且对所有 $u$ 都有 $e^u-1-u=u^2\varphi(u)$（$u=0$ 时两边都是 $0$）。另外 $\varphi(x)\gt0$（$x\ne0$ 时 $e^x\gt1+x$），分母不为零。</p>
      <p><b>第 2 步（改写）</b>：对 $x\gt0$，</p>
      $$\frac{e^{f(x)}-1-f(x)}{e^x-1-x}=\frac{f(x)^2\,\varphi(f(x))}{x^2\,\varphi(x)}=\Big(\frac{f(x)}{x}\Big)^2\cdot\frac{\varphi(f(x))}{\varphi(x)}.$$
      <p><b>第 3 步（分别求极限）</b></p>
      <ul><li>$\dfrac{f(x)}{x}=\dfrac{f(x)-f(0)}{x-0}\to f'(0)=\lambda$（导数定义）；</li>
      <li>$f$ 在 $0$ 处可导，所以连续，$f(x)\to f(0)=0$；又 $\varphi$ 在 $0$ 处连续，故 $\varphi(f(x))\to\varphi(0)=\frac12$；</li>
      <li>$\varphi(x)\to\frac12$。</li></ul>
      <p><b>第 4 步（合并）</b>：极限 $=\lambda^2\cdot\dfrac{1/2}{1/2}=\lambda^2$。</p>
      <p><b>答：极限为 $\lambda^2$。</b>（这种写法对 $\lambda=0$ 也成立，不需要分类讨论。若直接写“分子 $\sim\frac{f(x)^2}{2}\sim\frac{\lambda^2x^2}{2}$”，在 $\lambda=0$ 时等价无穷小无意义，会被扣分。）</p>
      <p class="small muted">数值验算：取 $f(x)=\lambda x+x^2$，$\lambda=3$，$x=10^{-3}$，比值约为 $9.01$，接近 $\lambda^2=9$。</p>` },
    { id: "t2-p6", lv: "真题", src: "2025 秋期末 5(1)", stmt: R`设 $f:\mathbb R\to\mathbb R$ 处处有 3 阶导数，$f(0)=0$。求实数 $a$，使 $g(x)=\begin{cases}\frac{f(x)}{x},&x\ne0\\ a,&x=0\end{cases}$ 在 $\mathbb R$ 上连续，并求 $g''(0)$。`,
      hints: [R`连续性：$a$ 必须等于 $\lim_{x\to0}\frac{f(x)}{x}=\lim\frac{f(x)-f(0)}{x-0}$，这正是某个导数的定义。`, R`按“先证存在”的方法：先用定义算 $g'(0)=\lim\frac{f(x)/x-f'(0)}{x}=\lim\frac{f(x)-f'(0)x}{x^2}$（把 $f$ 展开到二阶）。再写出 $x\ne0$ 时 $g'(x)=\frac{xf'(x)-f(x)}{x^2}$。`, R`$g''(0)=\lim\frac{g'(x)-g'(0)}{x}=\lim\frac{xf'(x)-f(x)-\frac{f''(0)}2x^2}{x^3}$。把 $f$ 展开到 $x^3$、$f'$ 展开到 $x^2$（$f'$ 有 2 阶导数，可以这样展开）。`],
      method: "m-exist",
      sol: R`<p><b>已知</b>：$f$ 处处有 3 阶导数，$f(0)=0$。记 $A=f'(0)$，$B=f''(0)$，$C=f'''(0)$。</p>
      <p><b>(1) 求 $a$</b>：$x\ne0$ 时 $g$ 是连续函数之商，分母不为零，所以连续。在 $0$ 处要 $g$ 连续，必须</p>
      $$a=\lim_{x\to0}\frac{f(x)}{x}=\lim_{x\to0}\frac{f(x)-f(0)}{x-0}=f'(0).$$
      <p><b>所以 $a=f'(0)$。</b></p>
      <p><b>(2) 准备展开式</b>：$f$ 在 $0$ 处有 3 阶导数，$f'$ 在 $0$ 处有 2 阶导数，由 Peano 余项的 Taylor 公式：</p>
      $$f(x)=Ax+\frac B2x^2+\frac C6x^3+o(x^3),\qquad f'(x)=A+Bx+\frac C2x^2+o(x^2).$$
      <p><b>(3) 求 $g'(0)$（用定义）</b>：</p>
      $$g'(0)=\lim_{x\to0}\frac{\frac{f(x)}x-A}{x}=\lim_{x\to0}\frac{f(x)-Ax}{x^2}=\lim_{x\to0}\frac{\frac B2x^2+o(x^2)}{x^2}=\frac B2.$$
      <p><b>(4) 写出 $x\ne0$ 时的 $g'(x)$</b>：由商的求导法则，$g'(x)=\dfrac{xf'(x)-f(x)}{x^2}$。计算分子：</p>
      $$xf'(x)=Ax+Bx^2+\frac C2x^3+o(x^3),$$
      $$xf'(x)-f(x)=\Big(B-\frac B2\Big)x^2+\Big(\frac C2-\frac C6\Big)x^3+o(x^3)=\frac B2x^2+\frac C3x^3+o(x^3).$$
      <p><b>(5) 求 $g''(0)$（用定义）</b>：</p>
      $$g''(0)=\lim_{x\to0}\frac{g'(x)-\frac B2}{x}=\lim_{x\to0}\frac{xf'(x)-f(x)-\frac B2x^2}{x^3}=\lim_{x\to0}\frac{\frac C3x^3+o(x^3)}{x^3}=\frac C3.$$
      <p>这个极限存在，所以 $g''(0)$ 存在。</p>
      <p><b>答：$a=f'(0)$，$g''(0)=\dfrac{f'''(0)}{3}$。</b></p>
      <p class="small muted">验算：$g(x)=\frac{f(x)}x=A+\frac B2x+\frac C6x^2+o(x^2)$，读系数得 $g''(0)=2!\cdot\frac C6=\frac C3$，一致。但这一步本身不能当证明，因为它没先说明 $g''(0)$ 存在。</p>` }
  ],

t3: {
  unit: "taylor", n: 3, title: "Lagrange 余项：证明题与误差估计",
  goal: R`学会一套固定的证明模板：选展开点 → 代入已知点 → 两式相加或相减 → 用介值定理或取较大者收尾。目标是能独立写完期末第 5 题这一类。`,
  sections: [
    { id: "t3-s1", h: R`1. $\xi$ 到底在哪里？`, html: R`
      <p><b>这节解决什么</b>：Lagrange 余项里有个神秘的 $\xi$。先把它“看见”，后面做证明题才心里有数。</p>
      <p>Lagrange 余项说：对固定的 $x$，存在 $\xi$ 介于 $x_0$ 和 $x$ 之间，使</p>
      $$f(x)=T_n(x)+\frac{f^{(n+1)}(\xi)}{(n+1)!}(x-x_0)^{n+1}.$$
      <p><b>小例子</b>：$f=e^x$，$x_0=0$，$n=1$，$x=1$。$T_1(1)=1+1=2$，余项 $R_1=e-2\approx0.718$。由 $R_1=\frac{e^{\xi}}{2}\cdot1^2$ 解出 $e^\xi\approx1.437$，$\xi=\ln1.437\approx0.362$，确实落在 $0$ 与 $1$ 之间。</p>
      <p>下面的图对 $f=e^x$ 把 $\xi$ 真的算出来（公式 $e^\xi=\frac{(n+1)!\,R_n(x)}{x^{n+1}}$）。拖动 $x$ 和 $n$：$\xi$ 一直落在 $0$ 与 $x$ 之间，并且随 $x$ 移动。还能看到：$x\to0$ 时比值 $\theta=\xi/x\to\frac1{n+2}$。</p>` },
    { id: "t3-s2", h: "2. 证明题的套路", html: R`
      <p><b>这节解决什么</b>：期末的 Taylor 证明题几乎都长这样——给你 $f$ 在几个点的函数值或导数，要你证“存在 $\xi$ 使 $|f''(\xi)|\ge$ 某个数”或“$f''(\xi)=$ 某个式子”。思路是固定的四步：</p>
      <ol>
        <li><b>选展开中心</b>：选导数信息最多的点，例如已知 $f'=0$ 的点、极值点、对称中心。中心处的 $f'$ 已知，展开式里就少一个未知数。</li>
        <li><b>选代入点</b>：选函数值已知的点（端点、题目给的点）。每个代入点写一个 Lagrange 展开，各得到一个 $\xi_1,\xi_2$（一般不同）。</li>
        <li><b>消元</b>：两式相加，消掉 $f'$（适用于对称的两点 $\pm a$）；或两式相减，消掉中心处的 $f$。</li>
        <li><b>收尾</b>：要等式 → 若 $f''$ 连续，用介值定理（$\frac{f''(\xi_1)+f''(\xi_2)}2$ 介于两者之间）；要不等式 → 取 $|f''(\xi_1)|,|f''(\xi_2)|$ 中较大的那个。</li>
      </ol>
      <p><b>小例子</b>（看清“相加消 $f'$”）：中心 $0$，代入 $\pm1$：</p>
      $$f(1)=f(0)+f'(0)+\tfrac{f''(\xi_1)}2,\qquad f(-1)=f(0)-f'(0)+\tfrac{f''(\xi_2)}2.$$
      <p>两式相加，$f'(0)$ 一正一负正好抵消：$f(1)+f(-1)-2f(0)=\frac{f''(\xi_1)+f''(\xi_2)}2$。</p>
      <p class="callout warn">常见扣分点：介值定理要在<b>自变量的区间</b> $[\xi_2,\xi_1]$ 上对连续函数 $f''$ 使用。收尾要写清楚三件事：$f''$ 在 $[\xi_2,\xi_1]$ 上连续；目标值介于 $f''(\xi_1)$ 与 $f''(\xi_2)$ 之间；所以存在 $\xi\in[\xi_2,\xi_1]$。</p>` }
  ],
  widget: "lagrangeXi",
  concepts: [
    { id: "t3-c1", sec: "t3-s2", q: R`已知 $f(0)=0$，要证 $\exists\xi$ 使 $f''(\xi)=\frac{f(a)+f(-a)}{a^2}$。展开中心和代入点应选：`,
      opts: [R`中心 $a$，代入 $-a$`, R`中心 $0$，代入 $a$ 和 $-a$`, R`中心 $-a$，代入 $0$`, R`中心 $\frac a2$，代入 $0$`], a: 1,
      ex: R`<b>对的</b>：$f(0)$ 已知，$\pm a$ 关于 $0$ 对称，两式相加正好消掉未知的 $f'(0)$，剩下 $f(a)+f(-a)=\frac{a^2}2(f''(\xi_1)+f''(\xi_2))$。<span class="ex"></span><b>最容易误选 A</b>：以 $a$ 为中心只得到一个式子，里面有未知的 $f(a)$、$f'(a)$，消不掉。` },
    { id: "t3-c2", sec: "t3-s2", q: R`得到 $f(a)+f(-a)=\frac{a^2}2\big(f''(\xi_1)+f''(\xi_2)\big)$ 后，要得到单个 $\xi$，还需要：`,
      opts: [R`什么都不需要`, R`$f''$ 连续，然后用介值定理`, R`$f'''$ 存在`, R`$\xi_1=\xi_2$`], a: 1,
      ex: R`<b>对的</b>：平均值 $\frac{f''(\xi_1)+f''(\xi_2)}2$ 介于两者之间，$f''$ 连续时由介值定理可在 $\xi_1,\xi_2$ 之间取到它。（其实导函数也有介值性，即 Darboux 定理，所以只要 $f''$ 存在也行；但考试题一般给“二阶导数连续”，用连续函数的介值定理最稳妥。）<span class="ex"></span><b>最容易误选 A</b>：两个不同点的平均值，不会自动等于某一点的值，需要定理保证。D 一般不成立，也不需要。` },
    { id: "t3-c3", sec: "t3-s1", q: R`用 $e=\sum_{k=0}^n\frac1{k!}+\frac{e^\theta}{(n+1)!}$（$0\lt\theta\lt1$）估计误差，为什么常用 $e^\theta\lt3$？`,
      opts: [R`因为 $e\lt3$ 且 $e^\theta\lt e$`, R`因为 $\theta\lt1$ 时 $e^\theta\lt1$`, R`因为 Lagrange 余项总小于 3`, R`为了凑整`], a: 0,
      ex: R`<b>对的</b>：$0\lt\theta\lt1$，$e^x$ 递增，所以 $e^\theta\lt e^1=e\lt3$。我们正在估计 $e$，不能用 $e$ 的精确值，只能用一个已知的上界 $3$。<span class="ex"></span><b>最容易误选 B</b>：$\theta\gt0$ 时 $e^\theta\gt1$，B 的不等号方向反了。` }
  ],
  methods: [
    { id: "m-proof", title: "Lagrange 证明四步法", steps: [
      R`<b>选中心</b>：导数信息最多的点（$f'(x_0)=0$ 的点、极值点、对称中心）。`,
      R`<b>选代入点</b>：函数值已知的点。每个点写一个展开式，写清 $\xi_1,\xi_2$ 各在哪个区间。`,
      R`<b>消元</b>：对称点相加消 $f'$；以不同中心展开到同一点，或同一中心展开到两点再相减，消掉 $f$。`,
      R`<b>收尾</b>：要等式，用介值定理（写明 $f''$ 连续及区间）；要不等式，取 $|f''(\xi_1)|,|f''(\xi_2)|$ 中较大者。易错：不等式题不需要 $f''$ 连续，别多加条件。`] },
    { id: "m-err", title: "误差估计", steps: [
      R`写出余项 $R_n=\frac{f^{(n+1)}(\xi)}{(n+1)!}x^{n+1}$。`,
      R`用已知量给 $|f^{(n+1)}|$ 一个上界 $M$（例如 $e^\xi\lt3$）。`,
      R`解不等式 $\frac{M|x|^{n+1}}{(n+1)!}\lt$ 允许误差，求出最小的 $n$。`,
      R`易错：不能用被估计的量本身做上界（估计 $e$ 时不能写 $e^\theta\lt e=2.718\ldots$ 再代数值）。`] }
  ],
  problems: [
    { id: "t3-p1", lv: "基础", src: "作业 11/2", stmt: R`用 $e^x$ 在 $0$ 处的 Taylor 公式近似计算 $e$，使误差小于 $10^{-5}$。至少要取到哪一项？`,
      hints: [R`在 $e^x$ 的 Lagrange 形式 Taylor 公式里令 $x=1$：$e=\sum_{k=0}^n\frac1{k!}+\frac{e^\theta}{(n+1)!}$，$0\lt\theta\lt1$。`, R`误差 $=\frac{e^\theta}{(n+1)!}\lt\frac3{(n+1)!}$。只要 $\frac3{(n+1)!}\lt10^{-5}$ 即可。`, R`即 $(n+1)!\gt3\times10^5$。列阶乘：$8!=40320$，$9!=362880$。`],
      method: "m-err", sol: R`<p><b>第 1 步（写余项）</b>：$e^x$ 的各阶导数都是 $e^x$。在 $0$ 处展开到 $n$ 阶，令 $x=1$：</p>
      $$e=\sum_{k=0}^{n}\frac{1}{k!}+\frac{e^{\theta}}{(n+1)!},\qquad 0\lt\theta\lt1.$$
      <p><b>第 2 步（估计余项）</b>：$e^\theta\lt e\lt3$，所以误差 $\dfrac{e^\theta}{(n+1)!}\lt\dfrac{3}{(n+1)!}$。</p>
      <p><b>第 3 步（解不等式）</b>：要 $\dfrac{3}{(n+1)!}\lt10^{-5}$，即 $(n+1)!\gt300000$。而 $8!=40320\lt300000$，$9!=362880\gt300000$，所以 $n+1=9$，$n=8$。</p>
      <p><b>第 4 步（$n=7$ 不够）</b>：$n=7$ 时误差 $\frac{e^\theta}{8!}\gt\frac{1}{40320}\approx2.5\times10^{-5}\gt10^{-5}$。</p>
      <p><b>答：至少取到 $\frac{1}{8!}$ 这一项，即 $e\approx\sum_{k=0}^{8}\frac1{k!}$。</b></p>
      <p class="small muted">验算：$\sum_{k=0}^{8}\frac1{k!}\approx2.7182788$，与 $e=2.7182818\ldots$ 相差约 $3\times10^{-6}$。</p>` },
    { id: "t3-p2", lv: "真题", src: "2023 秋期末 5(1)", stmt: R`设 $f$ 在 $[-a,a]$ 上有连续的二阶导数，$f(0)=0$。证明：存在 $\xi\in(-a,a)$，使 $f''(\xi)=\frac{f(a)+f(-a)}{a^2}$。`,
      hints: [R`用证明四步法：中心选 $0$（$f(0)$ 已知），代入点选 $a$ 和 $-a$（对称，相加能消 $f'(0)$）。`, R`一阶 Lagrange 展开：$f(\pm a)=f(0)\pm f'(0)a+\frac{f''(\xi_{1,2})}2a^2$，其中 $\xi_1\in(0,a)$，$\xi_2\in(-a,0)$，$f(0)=0$。`, R`相加再除以 $a^2$：$\frac{f(a)+f(-a)}{a^2}=\frac{f''(\xi_1)+f''(\xi_2)}2$。右边是两数的平均值，用 $f''$ 的介值定理收尾。`],
      method: "m-proof", sol: R`<p><b>要证</b>：存在 $\xi\in(-a,a)$，$f''(\xi)=\dfrac{f(a)+f(-a)}{a^2}$。</p>
      <p><b>第 1 步（展开）</b>：以 $0$ 为中心，用带 Lagrange 余项的一阶 Taylor 公式，分别代入 $x=a$ 和 $x=-a$：存在 $\xi_1\in(0,a)$，$\xi_2\in(-a,0)$，使</p>
      $$f(a)=f(0)+f'(0)a+\frac{f''(\xi_1)}2a^2,\qquad f(-a)=f(0)-f'(0)a+\frac{f''(\xi_2)}2a^2.$$
      <p><b>第 2 步（相加）</b>：$f(0)=0$，$f'(0)a$ 一正一负抵消：</p>
      $$f(a)+f(-a)=\frac{a^2}{2}\big(f''(\xi_1)+f''(\xi_2)\big),\quad\text{即}\quad \frac{f(a)+f(-a)}{a^2}=\frac{f''(\xi_1)+f''(\xi_2)}2.$$
      <p><b>第 3 步（介值定理）</b>：记 $\mu=\frac{f''(\xi_1)+f''(\xi_2)}2$，它介于 $f''(\xi_2)$ 与 $f''(\xi_1)$ 之间（两数的平均值）。$f''$ 在闭区间 $[\xi_2,\xi_1]$ 上连续（题设），由介值定理，存在 $\xi\in[\xi_2,\xi_1]$ 使 $f''(\xi)=\mu$。</p>
      <p><b>第 4 步（位置）</b>：$[\xi_2,\xi_1]\subset(-a,a)$，所以 $\xi\in(-a,a)$。</p>
      <p><b>结论：存在 $\xi\in(-a,a)$，使 $f''(\xi)=\dfrac{f(a)+f(-a)}{a^2}$。</b></p>` },
    { id: "t3-p3", lv: "真题", src: "2023 秋期末 5(2)", stmt: R`设 $f$ 在 $[-a,a]$ 上有连续的二阶导数，且在 $(-a,a)$ 内有极值点。证明：存在 $\eta\in(-a,a)$，使 $|f''(\eta)|\ge\frac1{2a^2}|f(a)-f(-a)|$。`,
      hints: [R`中心选极值点 $x_0$：由 Fermat 定理（可导函数在内部极值点处导数为 $0$），$f'(x_0)=0$，展开式里一阶项消失。`, R`分别代入 $a$ 和 $-a$：$f(a)=f(x_0)+\frac{f''(\eta_1)}2(a-x_0)^2$，$f(-a)=f(x_0)+\frac{f''(\eta_2)}2(a+x_0)^2$。两式相减消掉 $f(x_0)$。`, R`记 $M=\max\{|f''(\eta_1)|,|f''(\eta_2)|\}$，用三角不等式；再用 $(a-x_0)^2+(a+x_0)^2=2a^2+2x_0^2\le4a^2$（因为 $|x_0|\lt a$）。`],
      method: "m-proof", sol: R`<p><b>第 1 步（中心）</b>：设极值点为 $x_0\in(-a,a)$。$f$ 在 $x_0$ 可导且 $x_0$ 是内点，由 Fermat 定理 $f'(x_0)=0$。</p>
      <p><b>第 2 步（展开）</b>：以 $x_0$ 为中心，分别代入 $a$、$-a$（一阶项为 $0$）：存在 $\eta_1$ 介于 $x_0$ 与 $a$ 之间，$\eta_2$ 介于 $-a$ 与 $x_0$ 之间（都在 $(-a,a)$ 内），使</p>
      $$f(a)=f(x_0)+\frac{f''(\eta_1)}2(a-x_0)^2,\qquad f(-a)=f(x_0)+\frac{f''(\eta_2)}2(a+x_0)^2.$$
      <p><b>第 3 步（相减）</b>：</p>
      $$f(a)-f(-a)=\frac{f''(\eta_1)}2(a-x_0)^2-\frac{f''(\eta_2)}2(a+x_0)^2.$$
      <p><b>第 4 步（估计）</b>：记 $M=\max\{|f''(\eta_1)|,|f''(\eta_2)|\}$。由三角不等式，</p>
      $$|f(a)-f(-a)|\le\frac M2\big[(a-x_0)^2+(a+x_0)^2\big]=\frac M2(2a^2+2x_0^2)\le\frac M2\cdot4a^2=2a^2M,$$
      <p>这里用了 $x_0^2\lt a^2$。所以 $M\ge\dfrac{|f(a)-f(-a)|}{2a^2}$。</p>
      <p><b>第 5 步（取点）</b>：取 $\eta$ 为 $\eta_1,\eta_2$ 中使 $|f''|$ 较大的那个，则 $|f''(\eta)|=M$。</p>
      <p><b>结论：存在 $\eta\in(-a,a)$，使 $|f''(\eta)|\ge\dfrac{1}{2a^2}|f(a)-f(-a)|$。</b></p>` },
    { id: "t3-p4", lv: "真题", src: "2025 秋期末 5(2)", stmt: R`设 $h:\mathbb R\to\mathbb R$ 处处有 2 阶导数，$h(0)=h'(0)=h'(1)=0$，$h(1)=1$。证明：存在 $\xi\in[0,1]$，使 $|h''(\xi)|\ge4$。`,
      hints: [R`$0$ 和 $1$ 两点的函数值和导数都已知，所以分别以 $0$ 和 $1$ 为中心各展开一次。`, R`代入哪个点？两个展开都代入同一个点，才能相减消掉那个未知的函数值。选离两边“一样远”的中点 $\frac12$，这样两个余项的系数相同。`, R`$h(\frac12)=h(0)+h'(0)\cdot\frac12+\frac{h''(\xi_1)}2\cdot\frac14=\frac{h''(\xi_1)}8$；$h(\frac12)=h(1)+h'(1)\cdot(-\frac12)+\frac{h''(\xi_2)}2\cdot\frac14=1+\frac{h''(\xi_2)}8$。两式相减。`],
      method: "m-proof", sol: R`<p><b>第 1 步（以 $0$ 为中心，代入 $\frac12$）</b>：存在 $\xi_1\in(0,\frac12)$，</p>
      $$h\Big(\frac12\Big)=h(0)+h'(0)\cdot\frac12+\frac{h''(\xi_1)}2\cdot\Big(\frac12\Big)^2=0+0+\frac{h''(\xi_1)}8.$$
      <p><b>第 2 步（以 $1$ 为中心，代入 $\frac12$）</b>：注意 $\frac12-1=-\frac12$，存在 $\xi_2\in(\frac12,1)$，</p>
      $$h\Big(\frac12\Big)=h(1)+h'(1)\cdot\Big(-\frac12\Big)+\frac{h''(\xi_2)}2\cdot\Big(-\frac12\Big)^2=1+0+\frac{h''(\xi_2)}8.$$
      <p><b>第 3 步（相减）</b>：两式左边相同，所以 $\dfrac{h''(\xi_1)}8=1+\dfrac{h''(\xi_2)}8$，即</p>
      $$h''(\xi_1)-h''(\xi_2)=8.$$
      <p><b>第 4 步（取较大者）</b>：由三角不等式 $|h''(\xi_1)|+|h''(\xi_2)|\ge|h''(\xi_1)-h''(\xi_2)|=8$。两个非负数之和 $\ge8$，其中较大的一个 $\ge4$。</p>
      <p><b>结论：取 $\xi$ 为 $\xi_1,\xi_2$ 中 $|h''|$ 较大的那个，则 $\xi\in(0,1)\subset[0,1]$，且 $|h''(\xi)|\ge4$。</b></p>
      <p class="small muted">注意这里只要求 $h''$ 存在，不需要连续：结论是不等式，不用介值定理。</p>` },
    { id: "t3-p5", lv: "真题", src: "2021 秋期末 7(2)", stmt: R`设 $f$ 是 $\mathbb R$ 上的 $C^2$ 函数，$f(x)\ge0$，$f(0)=f'(0)=0$。给定 $h\gt0$，令 $M=\max_{x\in[-2h,2h]}|f''(x)|$。证明：对 $x\in[-h,h]$，有 $f'(x)^2\le2Mf(x)$。`,
      hints: [R`（$C^2$ 表示二阶导数存在且连续。）固定 $x\in[-h,h]$，对 $|t|\le h$ 在 $x$ 处展开到 $x+t$。由于 $x+t\in[-2h,2h]$，$|f''(\xi)|\le M$，再加上 $f\ge0$，得 $0\le f(x+t)\le f(x)+f'(x)t+\frac M2t^2$。`, R`右边是 $t$ 的二次函数，它在 $t=-\frac{f'(x)}{M}$ 处最小。想代入这个 $t$，但必须先保证 $|t|\le h$（否则 $x+t$ 跑出 $[-2h,2h]$）。`, R`用 $f'(0)=0$ 和中值定理：$|f'(x)|=|f'(x)-f'(0)|=|f''(\zeta)|\,|x|\le M|x|\le Mh$，所以 $\big|\frac{f'(x)}M\big|\le h$。别忘了单独处理 $M=0$。`],
      method: "m-proof", sol: R`<p><b>固定</b> $x\in[-h,h]$。</p>
      <p><b>情形 $M=0$</b>：$f''\equiv0$ 于 $[-2h,2h]$，所以 $f'$ 在其上是常数，$f'(x)=f'(0)=0$。结论变成 $0\le0$，成立。</p>
      <p><b>情形 $M\gt0$</b>：</p>
      <p><b>第 1 步（展开）</b>：对任意 $|t|\le h$，有 $x+t\in[-2h,2h]$。由 Lagrange 余项，存在 $\xi$ 介于 $x$ 与 $x+t$ 之间，且 $f\ge0$，</p>
      $$0\le f(x+t)=f(x)+f'(x)t+\frac{f''(\xi)}2t^2\le f(x)+f'(x)t+\frac M2t^2.\qquad(*)$$
      <p><b>第 2 步（检查最佳 $t$ 可用）</b>：在 $[0,x]$（或 $[x,0]$）上对 $f'$ 用中值定理，存在 $\zeta$ 使</p>
      $$|f'(x)|=|f'(x)-f'(0)|=|f''(\zeta)|\cdot|x|\le M|x|\le Mh.$$
      <p>所以 $t_0=-\dfrac{f'(x)}{M}$ 满足 $|t_0|\le h$，可以代入 $(*)$。</p>
      <p><b>第 3 步（代入）</b>：</p>
      $$0\le f(x)-\frac{f'(x)^2}{M}+\frac M2\cdot\frac{f'(x)^2}{M^2}=f(x)-\frac{f'(x)^2}{2M}.$$
      <p><b>结论</b>：两边乘 $2M\gt0$，得 <b>$f'(x)^2\le2Mf(x)$，对所有 $x\in[-h,h]$ 成立。</b></p>` }
  ],
  variants: [
    { id: "t3-v1", lv: "变种", src: "经典题（Landau 不等式）", stmt: R`设 $f$ 在 $[0,1]$ 上二阶可导，$|f(x)|\le A$，$|f''(x)|\le B$。证明：对 $x\in[0,1]$，$|f'(x)|\le2A+\frac B2$。`,
      hints: [R`这次要估计的是 $f'(x)$，所以中心选 $x$ 本身，让 $f'(x)$ 出现在展开式里。`, R`代入两个端点 $0$ 和 $1$：$f(0)=f(x)+f'(x)(0-x)+\frac{f''(\xi_1)}2x^2$，$f(1)=f(x)+f'(x)(1-x)+\frac{f''(\xi_2)}2(1-x)^2$。两式相减消掉 $f(x)$。`, R`相减后解出 $f'(x)$，用三角不等式，再用 $x^2+(1-x)^2\le1$（$x\in[0,1]$ 时，因为 $x^2+(1-x)^2=1-2x(1-x)$）。`],
      method: "m-proof", sol: R`<p><b>第 1 步（以 $x$ 为中心展开到两个端点）</b>：存在 $\xi_1$ 介于 $0,x$ 之间，$\xi_2$ 介于 $x,1$ 之间，</p>
      $$f(0)=f(x)-f'(x)x+\frac{f''(\xi_1)}2x^2,\qquad f(1)=f(x)+f'(x)(1-x)+\frac{f''(\xi_2)}2(1-x)^2.$$
      <p><b>第 2 步（相减）</b>：第二式减第一式，$f(x)$ 抵消，$f'(x)$ 的系数是 $(1-x)+x=1$：</p>
      $$f(1)-f(0)=f'(x)+\frac{f''(\xi_2)}2(1-x)^2-\frac{f''(\xi_1)}2x^2.$$
      <p><b>第 3 步（解出并估计）</b>：</p>
      $$|f'(x)|\le|f(1)|+|f(0)|+\frac B2(1-x)^2+\frac B2x^2\le2A+\frac B2\big[(1-x)^2+x^2\big].$$
      <p>又 $(1-x)^2+x^2=1-2x(1-x)\le1$（$x\in[0,1]$）。</p>
      <p><b>结论：$|f'(x)|\le2A+\dfrac B2$，对所有 $x\in[0,1]$ 成立。</b></p>` },
    { id: "t3-v2", lv: "变种", src: "仿 2025 期末 5(2)", stmt: R`设 $f$ 在 $[0,1]$ 上二阶可导，$f(0)=f(1)=0$，$\min_{[0,1]}f=-1$。证明：存在 $\xi\in(0,1)$，使 $f''(\xi)\ge8$。`,
      hints: [R`最小值点 $c$ 在哪？端点处 $f=0\gt-1$，所以 $c$ 不是端点，$c\in(0,1)$。内部最小值点满足 $f'(c)=0$（Fermat）。`, R`以 $c$ 为中心（一阶项为 $0$），代入 $0$ 和 $1$：$0=-1+\frac{f''(\xi_1)}2c^2$，$0=-1+\frac{f''(\xi_2)}2(1-c)^2$。`, R`解出 $f''(\xi_1)=\frac2{c^2}$，$f''(\xi_2)=\frac2{(1-c)^2}$。$c$ 和 $1-c$ 之和为 $1$，总有一个 $\le\frac12$，它对应的 $f''\ge\frac{2}{1/4}=8$。`],
      method: "m-proof", sol: R`<p><b>第 1 步（最小值点）</b>：$f$ 可导从而连续，在 $[0,1]$ 上取到最小值 $-1$，设在 $c$ 处取到。因为 $f(0)=f(1)=0\ne-1$，所以 $c\in(0,1)$。由 Fermat 定理 $f'(c)=0$，且 $f(c)=-1$。</p>
      <p><b>第 2 步（以 $c$ 为中心展开）</b>：存在 $\xi_1\in(0,c)$，$\xi_2\in(c,1)$，</p>
      $$0=f(0)=-1+0+\frac{f''(\xi_1)}2c^2,\qquad 0=f(1)=-1+0+\frac{f''(\xi_2)}2(1-c)^2.$$
      <p>解得 $f''(\xi_1)=\dfrac{2}{c^2}$，$f''(\xi_2)=\dfrac{2}{(1-c)^2}$。</p>
      <p><b>第 3 步（分情况）</b>：若 $c\le\frac12$，则 $c^2\le\frac14$，$f''(\xi_1)\ge8$；若 $c\gt\frac12$，则 $1-c\lt\frac12$，$f''(\xi_2)\gt8$。</p>
      <p><b>结论：存在 $\xi\in(0,1)$ 使 $f''(\xi)\ge8$。</b></p>` }
  ],
  extensions: [
    { id: "t3-e1", lv: "延伸", src: "2021 秋期末 7(1)", stmt: R`设 $f$ 是 $\mathbb R$ 上的 $C^2$ 函数，$f\ge0$。在哪些点 $x_0$ 处 $\sqrt{f(x)}$ 可导？`,
      hints: [R`分两类点。$f(x_0)\gt0$ 的点很简单：$\sqrt u$ 在 $u\gt0$ 处可导，用复合函数求导。`, R`$f(x_0)=0$ 的点：因为 $f\ge0$，它是 $f$ 的最小值点，所以 $f'(x_0)=0$、$f''(x_0)\ge0$。用 Peano 展开 $f(x)=\frac{f''(x_0)}2(x-x_0)^2+o((x-x_0)^2)$。`, R`看差商 $\frac{\sqrt{f(x)}-0}{x-x_0}=\frac{|x-x_0|}{x-x_0}\sqrt{\frac{f''(x_0)}2+o(1)}$。右侧趋于 $+\sqrt{f''(x_0)/2}$，左侧趋于 $-\sqrt{f''(x_0)/2}$。什么时候两者相等？`],
      method: "m-which", sol: R`<p><b>(1) $f(x_0)\gt0$</b>：$u\mapsto\sqrt u$ 在 $u\gt0$ 处可导，$f$ 可导，由复合函数求导法则，$\sqrt f$ 在 $x_0$ 可导，导数为 $\frac{f'(x_0)}{2\sqrt{f(x_0)}}$。</p>
      <p><b>(2) $f(x_0)=0$</b>：</p>
      <p>第 1 步：$f\ge0=f(x_0)$，所以 $x_0$ 是最小值点。由 Fermat 定理 $f'(x_0)=0$；由二阶 Taylor 公式还知 $f''(x_0)\ge0$（否则 $x_0$ 附近 $f\lt0$）。</p>
      <p>第 2 步：Peano 展开 $f(x)=\dfrac{f''(x_0)}2(x-x_0)^2+o\big((x-x_0)^2\big)$，即 $\dfrac{f(x)}{(x-x_0)^2}\to\dfrac{f''(x_0)}2$。</p>
      <p>第 3 步：差商</p>
      $$\frac{\sqrt{f(x)}-\sqrt{f(x_0)}}{x-x_0}=\frac{|x-x_0|}{x-x_0}\sqrt{\frac{f(x)}{(x-x_0)^2}}\to\begin{cases}+\sqrt{f''(x_0)/2},&x\to x_0^+,\\ -\sqrt{f''(x_0)/2},&x\to x_0^-.\end{cases}$$
      <p>左右导数相等 $\Leftrightarrow\sqrt{f''(x_0)/2}=-\sqrt{f''(x_0)/2}\Leftrightarrow f''(x_0)=0$。</p>
      <p><b>结论：$\sqrt f$ 在 $x_0$ 可导 $\Leftrightarrow$ $f(x_0)\gt0$，或 $f(x_0)=0$ 且 $f''(x_0)=0$。</b></p>
      <p class="small muted">例：$f=x^2$，$\sqrt f=|x|$，$f''(0)=2\ne0$，在 $0$ 不可导；$f=x^4$，$\sqrt f=x^2$，$f''(0)=0$，可导。</p>` }
  ]

m1: {
  unit: "mvt", n: 1, title: "构造辅助函数：Rolle、Lagrange、Cauchy",
  goal: R`看到“证明存在 $\xi$ 使某个含 $f,f'$ 的式子成立”，能倒推出该对哪个辅助函数用 Rolle 定理；分清三个中值定理各自管什么。`,
  sections: [
    { id: "m1-s1", h: "1. 三个定理其实是一个", html: R`
      <p><b>这节解决什么</b>：中值定理把“两点间的平均变化率”和“某一点的导数”连起来，是证明“存在 $\xi$”这类题的基本工具。三个定理里，Rolle 是根本，另外两个都由它推出。</p>
      <p>三个定理的条件都是“$f$ 在闭区间 $[a,b]$ 上连续，在开区间 $(a,b)$ 内可导”，结论里的 $\xi$ 都在<b>开区间</b> $(a,b)$ 里。</p>
      <ul>
        <li><b>Rolle</b>：若再有 $f(a)=f(b)$，则存在 $\xi$ 使 $f'(\xi)=0$。几何意义：两端一样高的曲线，中间某处切线水平。；例：$f(x)=x^2-x$ 在 $[0,1]$ 上，$f(0)=f(1)=0$，$f'(x)=2x-1=0$ 得 $\xi=\frac12$。</li>
        <li><b>Lagrange</b>：存在 $\xi$ 使 $f'(\xi)=\frac{f(b)-f(a)}{b-a}$（某点切线平行于两端连线，即“弦”）。证明：对 $F(x)=f(x)-\frac{f(b)-f(a)}{b-a}(x-a)$ 用 Rolle（减去弦，让两端一样高）。；例：$f(x)=x^3$ 在 $[0,1]$ 上，弦斜率 $1$，$3\xi^2=1$ 得 $\xi=\frac1{\sqrt3}\approx0.577$。</li>
        <li><b>Cauchy</b>：若 $g'\ne0$，存在 $\xi$ 使 $\frac{f'(\xi)}{g'(\xi)}=\frac{f(b)-f(a)}{g(b)-g(a)}$。证明：对 $F=f-kg$ 用 Rolle，$k$ 取右边那个比值。几何意义：参数曲线 $(g(t),f(t))$ 某处切线平行于弦（讲义第 7 周例 8）。$g(x)=x$ 时就是 Lagrange。</li>
      </ul>
      <p>下图拖动 $a,b$（或直接在图上左右拖），看满足 $f'(\xi)=\frac{f(b)-f(a)}{b-a}$ 的点：可能不止一个，定理只保证至少有一个。</p>` },
    { id: "m1-s2", h: "2. 反推辅助函数：把结论“积回去”", html: R`
      <p><b>这节解决什么</b>：证明题最难的一步是想到“对哪个函数用 Rolle”。方法是倒着想：把结论里的 $\xi$ 换成 $x$，看要证为零的式子是哪个函数的导数（允许差一个不为零的因子）。</p>
      <div class="table-wrap"><table class="pattern"><thead><tr><th>要证 $\exists\xi$ 使……$=0$</th><th>辅助函数 $F(x)$</th><th>因为 $F'(x)=$</th></tr></thead><tbody>
        <tr><td>$f'(\xi)+\lambda f(\xi)$</td><td>$e^{\lambda x}f(x)$</td><td>$e^{\lambda x}\big(f'+\lambda f\big)$</td></tr>
        <tr><td>$f'(\xi)+g'(\xi)f(\xi)$</td><td>$e^{g(x)}f(x)$</td><td>$e^{g}\big(f'+g'f\big)$</td></tr>
        <tr><td>$\xi f'(\xi)+kf(\xi)$</td><td>$x^kf(x)$</td><td>$x^{k-1}\big(xf'+kf\big)$</td></tr>
        <tr><td>$\xi f'(\xi)-f(\xi)$</td><td>$\frac{f(x)}{x}$</td><td>$\frac{xf'-f}{x^2}$</td></tr>
        <tr><td>$f'(\xi)g(\xi)+f(\xi)g'(\xi)$</td><td>$f(x)g(x)$</td><td>$f'g+fg'$</td></tr>
        <tr><td>$f'(\xi)-c$（常数）</td><td>$f(x)-cx$</td><td>$f'-c$</td></tr>
      </tbody></table></div>
      <p><b>小例子</b>：要证 $f'(\xi)+3f(\xi)=0$。查表第一行，$\lambda=3$，取 $F=e^{3x}f(x)$。验证：$F'=3e^{3x}f+e^{3x}f'=e^{3x}(f'+3f)$，而 $e^{3x}\ne0$，所以 $F'(\xi)=0$ 就等价于 $f'(\xi)+3f(\xi)=0$。</p>
      <p>找到 $F$ 后还要检查 $F(a)=F(b)$，这一步通常正好用上题目给的条件。</p>
      <p>如果结论是“导数之比 = 函数差之比”，就直接用 Lagrange 或 Cauchy，关键是选对两个函数。例如 2022 秋期中那题选的是 $\frac{f(x)}x$ 和 $\frac1x$。</p>` }
  ],
  widget: "mvtPlot",
  concepts: [
    { id: "m1-c1", sec: "m1-s1", q: R`Rolle 定理的条件里，下面哪一条<b>不需要</b>？`,
      opts: [R`$f$ 在 $[a,b]$ 上连续`, R`$f$ 在 $(a,b)$ 内可导`, R`$f(a)=f(b)$`, R`$f'$ 在 $(a,b)$ 内连续`], a: 3,
      ex: R`<b>对的</b>：Rolle 只要求可导，不要求导函数连续。<span class="ex"></span><b>易错</b>：前三条缺一不可。缺“可导”：$|x|$ 在 $[-1,1]$ 上两端相等，但 $f'$ 只取 $\pm1$，没有零点。缺“端点连续”：$[0,1]$ 上 $f(x)=x$（$x\lt1$）、$f(1)=0$，导数恒为 $1$。缺“两端相等”就只剩 Lagrange 的结论。` },
    { id: "m1-c2", sec: "m1-s2", q: R`要证 $\exists\xi$ 使 $f'(\xi)+2f(\xi)=0$，应对哪个函数用 Rolle？`,

    { id: "m1-c3", sec: "m1-s2", q: R`要证 $\exists\xi$ 使 $\xi f'(\xi)+2f(\xi)=0$，应对哪个函数用 Rolle？`,
      opts: [R`$e^{2x}f(x)$`, R`$x^2f(x)$`, R`$\frac{f(x)}{x^2}$`, R`$xf(x)$`], a: 1,

    { id: "m1-c4", sec: "m1-s1", q: R`为什么 Cauchy 中值定理不能“对 $f$、$g$ 分别用 Lagrange 再相除”来证明？`,
      opts: [R`因为 $g$ 可能不可导`, R`因为两次得到的 $\xi$ 一般不是同一个点`, R`因为 Lagrange 只对多项式成立`, R`其实可以`], a: 1,
      ex: R`<b>对的</b>：分别用会得到 $f'(\xi_1)=\frac{f(b)-f(a)}{b-a}$ 和 $g'(\xi_2)=\frac{g(b)-g(a)}{b-a}$，相除得 $\frac{f'(\xi_1)}{g'(\xi_2)}$，而 Cauchy 要的是同一个 $\xi$。所以要对 $F=f-kg$ 只用一次 Rolle。<span class="ex"></span><b>易误选 D</b>：正是因为 $\xi_1\ne\xi_2$，这种做法不成立。` },
    { id: "m1-c5", sec: "m1-s1", q: R`$f(x)=|x|$ 在 $[-1,2]$ 上，Lagrange 中值定理的结论成立吗？`,
      opts: [R`成立，因为 $f$ 连续`, R`不成立：弦斜率 $\frac13$，而 $f'$ 只取 $\pm1$`, R`成立，取 $\xi=0$`, R`无法判断`], a: 1,
      ex: R`<b>对的</b>：弦斜率 $\frac{f(2)-f(-1)}{2-(-1)}=\frac{2-1}{3}=\frac13$；$f$ 在 $0$ 处不可导，其他地方 $f'=\pm1$，取不到 $\frac13$。<span class="ex"></span><b>最容易误选 A</b>：只连续不够，还要求在 $(a,b)$ 内处处可导。C 错：$f'(0)$ 不存在。` }
  ],
  methods: [
    { id: "m-aux", title: "反推辅助函数", steps: [
      R`把结论里的 $\xi$ 换成 $x$，得到要证为零的式子 $E(x)$。`,
      R`认形查表：$f'+\lambda f\to e^{\lambda x}f$；$f'+g'f\to e^{g}f$；$xf'+kf\to x^kf$；$xf'-f\to\frac fx$；$f'g+fg'\to fg$。`,
      R`求导验证：$F'(x)=(\text{非零因子})\times E(x)$。`,

      R`结论是“导数之比 = 函数差之比” → 直接用 Cauchy，关键是选对两个函数。易错：分母函数的导数要处处不为零。`] }

  problems: [
    { id: "m1-p1", lv: "基础", src: "讲义第 7 周例 5", stmt: R`设 $\lambda$ 为实数，$f\in C[a,b]$，$f(a)=f(b)=0$，$f$ 在 $(a,b)$ 内可导。证明：$\exists\xi\in(a,b)$，使 $\lambda f(\xi)+f'(\xi)=0$。`,
      hints: [R`（$f\in C[a,b]$ 表示 $f$ 在 $[a,b]$ 上连续。）把 $\xi$ 换成 $x$：要证 $f'(x)+\lambda f(x)$ 有零点。它是哪个函数的导数再除以一个非零因子？查表第一行。`, R`令 $F(x)=e^{\lambda x}f(x)$，则 $F'(x)=e^{\lambda x}\big(f'(x)+\lambda f(x)\big)$。`, R`检查：$F$ 在 $[a,b]$ 上连续，$(a,b)$ 内可导，$F(a)=e^{\lambda a}\cdot0=0$，$F(b)=0$。对 $F$ 用 Rolle，再约掉 $e^{\lambda\xi}$。`],
      method: "m-aux", sol: R`<p><b>构造</b>：令 $F(x)=e^{\lambda x}f(x)$，$x\in[a,b]$。</p>
      <p><b>验证 Rolle 条件</b>：</p>
      <ul><li>$e^{\lambda x}$ 与 $f$ 都在 $[a,b]$ 上连续，所以 $F$ 连续；</li>
      <li>两者都在 $(a,b)$ 内可导，所以 $F$ 可导，且 $F'(x)=\lambda e^{\lambda x}f(x)+e^{\lambda x}f'(x)=e^{\lambda x}\big(f'(x)+\lambda f(x)\big)$；</li>
      <li>$F(a)=e^{\lambda a}f(a)=0$，$F(b)=e^{\lambda b}f(b)=0$，所以 $F(a)=F(b)$。</li></ul>
      <p><b>用 Rolle</b>：存在 $\xi\in(a,b)$ 使 $F'(\xi)=e^{\lambda\xi}\big(f'(\xi)+\lambda f(\xi)\big)=0$。</p>
      <p><b>约去非零因子</b>：$e^{\lambda\xi}\gt0$，所以 $f'(\xi)+\lambda f(\xi)=0$。</p>
      <p><b>结论：存在 $\xi\in(a,b)$，使 $\lambda f(\xi)+f'(\xi)=0$。</b></p>` },
    { id: "m1-p2", lv: "真题", src: "2022 秋期中 证明题 2", stmt: R`设 $f$ 在 $[a,b]$ 上连续（$ab\gt0$），在 $(a,b)$ 内可导。证明：存在 $\xi\in(a,b)$，使 $\dfrac{af(b)-bf(a)}{b-a}=\xi f'(\xi)-f(\xi)$。`,
      hints: [R`右边 $xf'-f$ 让人想到 $\big(\frac fx\big)'=\frac{xf'-f}{x^2}$，但多了一个分母 $x^2$。要消掉它，需要另一个导数里也有 $\frac{1}{x^2}$ 的函数，然后两者相除。`, R`$\big(\frac1x\big)'=-\frac1{x^2}$。所以对 $F(x)=\frac{f(x)}x$ 和 $G(x)=\frac1x$ 用 Cauchy 中值定理，相除时 $x^2$ 正好约掉。`, R`$ab\gt0$ 说明 $a,b$ 同号，$0\notin[a,b]$，两个函数在 $[a,b]$ 上都有定义、连续、可导，且 $G'(x)=-\frac1{x^2}\ne0$。最后把左边分子分母同乘 $ab$ 化简。`],
      method: "m-aux", sol: R`<p><b>构造</b>：令 $F(x)=\dfrac{f(x)}{x}$，$G(x)=\dfrac1x$。</p>
      <p><b>验证 Cauchy 条件</b>：由 $ab\gt0$，$a,b$ 同号，$0\notin[a,b]$。所以 $F,G$ 在 $[a,b]$ 上连续、在 $(a,b)$ 内可导，且</p>
      $$F'(x)=\frac{xf'(x)-f(x)}{x^2},\qquad G'(x)=-\frac1{x^2}\ne0.$$
      <p><b>用 Cauchy</b>：存在 $\xi\in(a,b)$，使</p>
      $$\frac{F(b)-F(a)}{G(b)-G(a)}=\frac{F'(\xi)}{G'(\xi)}=\frac{\frac{\xi f'(\xi)-f(\xi)}{\xi^2}}{-\frac1{\xi^2}}=f(\xi)-\xi f'(\xi).$$
      <p><b>化简左边</b>：分子分母同乘 $ab$，</p>
      $$\frac{\frac{f(b)}b-\frac{f(a)}a}{\frac1b-\frac1a}=\frac{af(b)-bf(a)}{a-b}.$$
      <p><b>整理</b>：于是 $\dfrac{af(b)-bf(a)}{a-b}=f(\xi)-\xi f'(\xi)$，两边同乘 $-1$：</p>
      <p><b>结论：存在 $\xi\in(a,b)$，使 $\dfrac{af(b)-bf(a)}{b-a}=\xi f'(\xi)-f(\xi)$。</b></p>` },
    { id: "m1-p3", lv: "真题", src: "2023 秋期末 4", stmt: R`设 $f$ 在 $[a,b]$ 上连续，在 $(a,b)$ 内处处可导，$f(b)\gt f(a)$，记 $c=\frac{f(b)-f(a)}{b-a}$。证明下面两个断言必有一个成立：(1) 对任何 $x\in[a,b]$，$f(x)-f(a)=c(x-a)$；(2) 存在 $\xi\in(a,b)$，使 $f'(\xi)\gt c$。`,
      hints: [R`把弦减掉：令 $g(x)=f(x)-f(a)-c(x-a)$，则 $g(a)=g(b)=0$，$g'=f'-c$。断言 (1) 就是 $g\equiv0$，断言 (2) 就是存在 $g'(\xi)\gt0$。`, R`若 (1) 不成立，存在 $x_0\in(a,b)$ 使 $g(x_0)\ne0$。分 $g(x_0)\gt0$ 和 $g(x_0)\lt0$ 两种情况。`, R`$g(x_0)\gt0$：在 $[a,x_0]$ 上对 $g$ 用 Lagrange，斜率 $\frac{g(x_0)-0}{x_0-a}\gt0$；$g(x_0)\lt0$：在 $[x_0,b]$ 上用，斜率 $\frac{0-g(x_0)}{b-x_0}\gt0$。`],
      method: "m-aux", sol: R`<p><b>构造</b>：令 $g(x)=f(x)-f(a)-c(x-a)$。则 $g$ 在 $[a,b]$ 上连续、$(a,b)$ 内可导，$g'(x)=f'(x)-c$，且</p>
      $$g(a)=0,\qquad g(b)=f(b)-f(a)-c(b-a)=0.$$
      <p><b>情形一</b>：$g\equiv0$ 于 $[a,b]$，即对所有 $x$ 有 $f(x)-f(a)=c(x-a)$，断言 (1) 成立。</p>
      <p><b>情形二</b>：存在 $x_0\in(a,b)$ 使 $g(x_0)\ne0$（端点处 $g=0$，所以 $x_0$ 在内部）。</p>
      <ul><li>若 $g(x_0)\gt0$：在 $[a,x_0]$ 上对 $g$ 用 Lagrange，存在 $\xi\in(a,x_0)$，$g'(\xi)=\dfrac{g(x_0)-g(a)}{x_0-a}=\dfrac{g(x_0)}{x_0-a}\gt0$。</li>
      <li>若 $g(x_0)\lt0$：在 $[x_0,b]$ 上对 $g$ 用 Lagrange，存在 $\xi\in(x_0,b)$，$g'(\xi)=\dfrac{g(b)-g(x_0)}{b-x_0}=\dfrac{-g(x_0)}{b-x_0}\gt0$。</li></ul>
      <p>两种情况都有 $f'(\xi)=g'(\xi)+c\gt c$，断言 (2) 成立。</p>
      <p><b>结论：(1)、(2) 必有一个成立。</b></p>
      <p class="small muted">条件 $f(b)\gt f(a)$ 在证明里其实没用到。</p>` },
    { id: "m1-p4", lv: "真题", src: "2025 秋期中 6(2)", stmt: R`设 $f$ 在 $(a,b)$ 上有连续的导函数，$\lim_{x\to a^+}f(x)=+\infty$，$\lim_{x\to b^-}f(x)=-\infty$，且对任何 $x\in(a,b)$，$f'(x)+f^2(x)\ge-1$。证明：$b-a\ge\pi$。`,
      hints: [R`条件可写成 $f'+f^2+1\ge0$。$1+f^2$ 让人想到 $\arctan$：$\big(\arctan f\big)'=\frac{f'}{1+f^2}$。`, R`令 $g(x)=x+\arctan f(x)$，则 $g'=1+\frac{f'}{1+f^2}=\frac{f'+f^2+1}{1+f^2}\ge0$，所以 $g$ 单调不减。`, R`对 $a\lt x\lt y\lt b$ 有 $g(x)\le g(y)$。先令 $x\to a^+$（$\arctan f(x)\to\frac\pi2$），再令 $y\to b^-$（$\arctan f(y)\to-\frac\pi2$）。`],
      method: "m-aux", sol: R`<p><b>构造</b>：令 $g(x)=x+\arctan f(x)$，$x\in(a,b)$。</p>
      <p><b>第 1 步（$g$ 单调不减）</b>：</p>
      $$g'(x)=1+\frac{f'(x)}{1+f(x)^2}=\frac{f'(x)+f(x)^2+1}{1+f(x)^2}\ge0,$$
      <p>因为分子 $\ge0$（题设），分母 $\gt0$。所以 $g$ 在 $(a,b)$ 上单调不减（由 Lagrange 中值定理：$g(y)-g(x)=g'(\zeta)(y-x)\ge0$）。</p>
      <p><b>第 2 步（两端取极限）</b>：$\arctan$ 连续，且 $\arctan u\to\pm\frac\pi2\ (u\to\pm\infty)$，所以</p>
      $$\lim_{x\to a^+}g(x)=a+\frac\pi2,\qquad \lim_{y\to b^-}g(y)=b-\frac\pi2.$$
      <p><b>第 3 步</b>：固定 $y\in(a,b)$，对 $x\in(a,y)$ 有 $g(x)\le g(y)$；令 $x\to a^+$ 得 $a+\frac\pi2\le g(y)$。再令 $y\to b^-$ 得 $a+\frac\pi2\le b-\frac\pi2$。</p>
      <p><b>结论：$b-a\ge\pi$。</b></p>

m2: {

  goal: "两类题：①要找两个不同的中值点时，学会“切一刀、两段各用一次”；②数方程有几个根时，用介值定理证“有”，用单调性或 Rolle 证“至多几个”。",
  sections: [
    { id: "m2-s1", h: "1. 两个中值点：先切开，再各用一次", html: R`
      <p><b>这节解决什么</b>：有些题要证“存在 $\xi\lt\eta$（两个不同的点）使……”。如果在整个区间上用两次 Lagrange，定理只说“存在”，两次可能给出同一个点，无法保证 $\xi\ne\eta$。</p>
      <p><b>正确做法</b>：找一个分点 $c\in(a,b)$，把区间切成 $[a,c]$ 和 $[c,b]$，两段上各用一次 Lagrange。这样 $\xi\in(a,c)$，$\eta\in(c,b)$，自动有 $\xi\lt c\lt\eta$。</p>
      <p><b>小例子</b>：$f(x)=x^2$，$[0,1]$，切在 $c=\frac12$。左段：$f'(\xi)=\frac{1/4-0}{1/2}=\frac12$，得 $\xi=\frac14$；右段：$f'(\eta)=\frac{1-1/4}{1/2}=\frac32$，得 $\eta=\frac34$。两个点确实不同。</p>
      <p><b>分点 $c$ 怎么选</b>：</p>
      <ul>
        <li>结论只和导数有关，而且关于两段对称（如 $f'(\xi)+f'(\eta)=\cdots$）→ 取中点 $c=\frac{a+b}2$，两段长度相等。</li>
        <li>结论里出现 $\frac1{f'}$ 或 $f'(\xi)f'(\eta)$ → 按<b>函数值</b>选：用介值定理找 $c$，使 $f(c)$ 等于两端函数值的平均。这样两段的“函数增量”相等，$c$ 只出现在分母里，好处理。</li>
        <li>结论里有 $e^{f}f'$ 这样的组合 → 先令 $F=e^{f}$（因为 $F'=e^{f}f'$），再对 $F$ 做上面的事。本学期期中第 5(2) 题就是这样。</li>
      </ul>` },
    { id: "m2-s2", h: "2. 数零点：介值定理管“有”，单调和 Rolle 管“几个”", html: R`
      <p><b>这节解决什么</b>：题目问“方程恰有几个实根”。要拆成两半证明：<b>至少</b>有几个（存在性），<b>至多</b>有几个（唯一性/个数上限）。</p>
      <ul>
        <li><b>存在</b>：找两个函数值异号的点，用零点定理（连续函数在异号两点之间有零点）。</li>
        <li><b>至多一个</b>：若 $f'$ 恒正（或恒负），$f$ 严格单调，至多一个零点。或者反证：若有两个零点，由 Rolle，$f'$ 在它们之间有零点，矛盾。</li>
        <li><b>零点个数往导数传</b>：$f$ 有 $k$ 个不同零点 ⇒ $f'$ 至少有 $k-1$ 个（相邻两个零点之间各一个）。反过来说：$f'$ 至多 $m$ 个零点 ⇒ $f$ 至多 $m+1$ 个零点。</li>
        <li><b>按单调区间数零点</b>：$f'$ 的零点把定义域切成几段，$f$ 在每段上严格单调，每段至多一个零点；再看每段端点处的函数值（或 $x\to\pm\infty$ 时的极限）的符号，决定这段有没有零点。</li>
      </ul>
      <p><b>小例子</b>：$f(x)=x^3-3x+1$。$f'=3(x-1)(x+1)$，切成 $(-\infty,-1]$、$[-1,1]$、$[1,\infty)$ 三段，$f$ 依次增、减、增。端点值：$x\to-\infty$ 时 $f\to-\infty$，$f(-1)=3\gt0$，$f(1)=-1\lt0$，$x\to+\infty$ 时 $f\to+\infty$。每段两端异号，各有一个零点，所以恰有 3 个实根。</p>` }
  ],

      opts: [R`1 个`, R`2 个`, R`3 个`, R`不一定有`], a: 1,

  problems: [
    { id: "m2-p1", lv: "基础", src: "讲义第 7 周例 4", stmt: R`证明 $f(x)=x^3+x-1$ 有唯一的零点。`,
      hints: [R`分成“存在”和“唯一”两部分写。`, R`存在：算 $f(0)$ 和 $f(1)$，看符号，用零点定理。`, R`唯一：$f'(x)=3x^2+1$，它的符号说明什么？`],
      method: "m-roots", sol: R`<p><b>存在</b>：$f$ 是多项式，在 $[0,1]$ 上连续。$f(0)=-1\lt0$，$f(1)=1+1-1=1\gt0$。由零点定理，存在 $x_0\in(0,1)$ 使 $f(x_0)=0$。</p>
      <p><b>唯一</b>：$f'(x)=3x^2+1\ge1\gt0$ 对所有 $x$ 成立，所以 $f$ 在 $\mathbb R$ 上严格递增。严格递增函数至多取一次值 $0$，所以至多一个零点。</p>
      <p><b>结论：$f$ 恰有一个零点（且在 $(0,1)$ 内）。</b></p>` },
    { id: "m2-p2", lv: "真题", src: "2022 秋期中 证明题 5", stmt: R`设 $f$ 在 $[a,b]$ 上二阶可导，$f(a)=f(b)$，$f'_+(a)f'_-(b)\gt0$。证明：存在 $\xi\in(a,b)$，使 $f''(\xi)=0$。`,
      hints: [R`（$f'_+(a)$、$f'_-(b)$ 是端点处的右导数、左导数。）倒着想：要 $f''$ 有零点，就要 $f'$ 有两个不同零点，再对 $f'$ 用一次 Rolle。要 $f'$ 有两个零点，就要 $f$ 在三个点取相同的值。`, R`$f'_+(a)f'_-(b)\gt0$ 说明两者同号，不妨都 $\gt0$。由导数定义和保号性：$a$ 右侧附近有点 $x_1$ 使 $f(x_1)\gt f(a)$；$b$ 左侧附近有点 $x_2$ 使 $f(x_2)\lt f(b)$。`, R`$f(x_1)\gt f(a)=f(b)\gt f(x_2)$，由介值定理在 $(x_1,x_2)$ 内找 $c$ 使 $f(c)=f(a)$。于是 $f(a)=f(c)=f(b)$，在 $[a,c]$、$[c,b]$ 上各用 Rolle。`],
      method: "m-roots", sol: R`<p><b>思路</b>：找三个点 $a\lt c\lt b$ 使 $f(a)=f(c)=f(b)$，然后 Rolle 用两次得 $f'$ 的两个零点，再用一次得 $f''$ 的零点。</p>
      <p><b>第 1 步（不妨设）</b>：$f'_+(a)$ 与 $f'_-(b)$ 同号。不妨设都 $\gt0$（都 $\lt0$ 时对 $-f$ 讨论，结论一样）。</p>
      <p><b>第 2 步（找 $x_1,x_2$）</b>：$f'_+(a)=\lim\limits_{x\to a^+}\dfrac{f(x)-f(a)}{x-a}\gt0$，由保号性，存在靠近 $a$ 的 $x_1\in(a,b)$ 使 $f(x_1)\gt f(a)$。同理 $f'_-(b)=\lim\limits_{x\to b^-}\dfrac{f(x)-f(b)}{x-b}\gt0$，而 $x-b\lt0$，存在靠近 $b$ 的 $x_2\in(x_1,b)$ 使 $f(x_2)\lt f(b)$。</p>
      <p><b>第 3 步（介值定理找 $c$）</b>：$f(x_1)\gt f(a)=f(b)\gt f(x_2)$，$f$ 在 $[x_1,x_2]$ 上连续，所以存在 $c\in(x_1,x_2)$ 使 $f(c)=f(a)=f(b)$。</p>
      <p><b>第 4 步（Rolle 两次）</b>：在 $[a,c]$、$[c,b]$ 上分别对 $f$ 用 Rolle：存在 $\xi_1\in(a,c)$，$\xi_2\in(c,b)$，使 $f'(\xi_1)=f'(\xi_2)=0$。</p>
      <p><b>第 5 步（再用一次）</b>：$f$ 二阶可导，所以 $f'$ 在 $[\xi_1,\xi_2]$ 上可导（从而连续）。对 $f'$ 在 $[\xi_1,\xi_2]$ 上用 Rolle：存在 $\xi\in(\xi_1,\xi_2)\subset(a,b)$ 使 $f''(\xi)=0$。</p>
      <p><b>结论：存在 $\xi\in(a,b)$，使 $f''(\xi)=0$。</b></p>` },
    { id: "m2-p3", lv: "真题", src: "2026 秋期中 5(2)（本学期）", stmt: R`已知 $f(0)=0$，$f(1)=1$，$f'$ 连续。证明：存在 $0\lt\xi\lt\eta\lt1$，使 $e^{f(\xi)+f(\eta)}f'(\xi)f'(\eta)\ge(e-1)^2$。`,
      hints: [R`$e^{f(\xi)+f(\eta)}f'(\xi)f'(\eta)=\big(e^{f(\xi)}f'(\xi)\big)\big(e^{f(\eta)}f'(\eta)\big)$。$e^{f}f'$ 是谁的导数？令 $F=e^{f}$，则 $F'=e^{f}f'$，$F(0)=e^0=1$，$F(1)=e$。要证 $F'(\xi)F'(\eta)\ge(e-1)^2$。`, R`要两个不同的点 → 切一刀，在 $[0,c]$、$[c,1]$ 上对 $F$ 各用一次 Lagrange。结论是乘积，按函数值选 $c$：让两段的增量相等，取 $F(c)=\frac{1+e}2$（介值定理保证存在）。`, R`两段增量都是 $\frac{e-1}2$，所以 $F'(\xi)=\frac{e-1}{2c}$，$F'(\eta)=\frac{e-1}{2(1-c)}$，乘积 $=\frac{(e-1)^2}{4c(1-c)}$。再用 $c(1-c)\le\frac14$。`],
      method: "m-two", sol: R`<p><b>已知</b>：$f(0)=0$，$f(1)=1$，$f'$ 连续（所以 $f$ 在 $[0,1]$ 上可导、连续）。<b>要证</b>：存在 $0\lt\xi\lt\eta\lt1$ 使 $e^{f(\xi)+f(\eta)}f'(\xi)f'(\eta)\ge(e-1)^2$。</p>
      <p><b>第 1 步（换函数）</b>：令 $F(x)=e^{f(x)}$。则 $F$ 在 $[0,1]$ 上连续、可导，</p>
      $$F'(x)=e^{f(x)}f'(x),\qquad F(0)=e^{0}=1,\qquad F(1)=e^{1}=e.$$
      <p>而 $e^{f(\xi)+f(\eta)}f'(\xi)f'(\eta)=F'(\xi)F'(\eta)$，所以只需证 $F'(\xi)F'(\eta)\ge(e-1)^2$。</p>
      <p><b>第 2 步（选分点 $c$）</b>：$F$ 连续，$F(0)=1\lt\dfrac{1+e}{2}\lt e=F(1)$，由介值定理存在 $c\in(0,1)$ 使 $F(c)=\dfrac{1+e}{2}$。</p>
      <p><b>第 3 步（两段各用一次 Lagrange）</b>：存在 $\xi\in(0,c)$，$\eta\in(c,1)$，使</p>
      $$F'(\xi)=\frac{F(c)-F(0)}{c-0}=\frac{\frac{1+e}2-1}{c}=\frac{e-1}{2c},\qquad F'(\eta)=\frac{F(1)-F(c)}{1-c}=\frac{e-\frac{1+e}2}{1-c}=\frac{e-1}{2(1-c)}.$$
      <p>且 $0\lt\xi\lt c\lt\eta\lt1$。</p>
      <p><b>第 4 步（相乘并估计）</b>：</p>
      $$F'(\xi)F'(\eta)=\frac{(e-1)^2}{4c(1-c)}.$$
      <p>因为 $c(1-c)=\frac14-\big(c-\frac12\big)^2\le\frac14$，且 $c(1-c)\gt0$，所以 $\dfrac{1}{4c(1-c)}\ge1$，从而 $F'(\xi)F'(\eta)\ge(e-1)^2$。</p>
      <p><b>结论：存在 $0\lt\xi\lt\eta\lt1$，使 $e^{f(\xi)+f(\eta)}f'(\xi)f'(\eta)\ge(e-1)^2$。</b></p>
      <p class="small muted">检验：取 $f(x)=x$，$F=e^x$，$c=\ln\frac{1+e}2\approx0.620$，乘积 $\frac{(e-1)^2}{4c(1-c)}\approx1.061\,(e-1)^2$，确实 $\ge(e-1)^2$。</p>` },
    { id: "m2-p4", lv: "真题", src: "讲义第 7 周例 6", stmt: R`证明 $n$ 次 Legendre 多项式 $\dfrac{d^n}{dx^n}\big[(x^2-1)^n\big]$ 在 $(-1,1)$ 内恰有 $n$ 个不同的实零点。`,
      hints: [R`令 $P(x)=(x^2-1)^n=(x-1)^n(x+1)^n$。$\pm1$ 是 $P$ 的 $n$ 重零点，所以对 $k\lt n$，$P^{(k)}(\pm1)=0$（每求一次导，重数减一，还剩因子 $(x\mp1)$）。`, R`归纳：设 $P^{(k)}$ 在 $(-1,1)$ 内至少有 $k$ 个不同零点。再加上 $\pm1$（$k\lt n$ 时也是零点），一共 $k+2$ 个，相邻两点间用 Rolle，得 $P^{(k+1)}$ 至少 $k+1$ 个。`, R`于是 $P^{(n)}$ 在 $(-1,1)$ 内至少 $n$ 个零点；而它是 $n$ 次多项式（$P$ 是 $2n$ 次，求 $n$ 次导后是 $n$ 次），至多 $n$ 个零点。`],
      method: "m-roots", sol: R`<p><b>记号</b>：$P(x)=(x^2-1)^n=(x-1)^n(x+1)^n$，它是 $2n$ 次多项式。</p>
      <p><b>第 1 步（端点）</b>：$\pm1$ 都是 $P$ 的 $n$ 重零点。对 $0\le k\le n-1$，$P^{(k)}(x)$ 仍含因子 $(x-1)^{n-k}(x+1)^{n-k}$（乘积求导每次至多把某个因子次数减一），所以 $P^{(k)}(\pm1)=0$。</p>
      <p><b>第 2 步（归纳断言）</b>：对 $0\le k\le n$，$P^{(k)}$ 在 $(-1,1)$ 内至少有 $k$ 个不同零点。</p>
      <ul><li>$k=0$：“至少 0 个”显然成立。</li>
      <li>设对某个 $k\lt n$ 成立，零点为 $-1\lt x_1\lt\cdots\lt x_k\lt1$。由第 1 步，$P^{(k)}(\pm1)=0$，于是 $-1,x_1,\dots,x_k,1$ 共 $k+2$ 个不同零点，形成 $k+1$ 个相邻小区间。每个小区间上对 $P^{(k)}$ 用 Rolle，得 $P^{(k+1)}$ 在 $(-1,1)$ 内至少 $k+1$ 个不同零点。</li></ul>
      <p><b>第 3 步（上限）</b>：取 $k=n$，$P^{(n)}$ 在 $(-1,1)$ 内至少 $n$ 个不同零点。另一方面，$P$ 的首项是 $x^{2n}$，求 $n$ 次导后首项是 $\frac{(2n)!}{n!}x^n$，系数不为 $0$，所以 $P^{(n)}$ 是 $n$ 次多项式，至多 $n$ 个零点。</p>
      <p><b>结论：$\dfrac{d^n}{dx^n}(x^2-1)^n$ 在 $(-1,1)$ 内恰有 $n$ 个不同实零点。</b></p>
      <p class="small muted">例：$n=2$，$\frac{d^2}{dx^2}(x^2-1)^2=12x^2-4$，零点 $\pm\frac1{\sqrt3}\in(-1,1)$，恰 2 个。</p>` }
  ],

  extensions: [
    { id: "m2-e1", lv: "延伸", src: "2026 秋期中 6（本学期）", stmt: R`称 $x_0$ 为 $f$ 的简单零点，若 $f(x_0)=0$，$f'(x_0)\ne0$。是否存在三阶可微函数 $f:\mathbb R\to\mathbb R$ 同时满足：(a) $f$ 恰有 2 个零点，且都是简单零点；(b) $f'$ 恰有 2 个零点，且都是简单零点；(c) $f''$ 恰有 1 个零点，且是简单零点？若存在，给出构造；若不存在，给出证明。`,
      hints: [R`先试例子 $x^3-3x+k$：$f''=6x$ 满足 (c)，$f'=3(x^2-1)$ 满足 (b)，但零点数只能是 1 或 3（恰 2 个时有一个是重根，不简单）。猜测：不存在。`, R`由 (c)，设 $f''$ 唯一的零点是 $c$。$f''$ 连续，在 $c$ 两侧不为零，所以各自不变号；又 $f'''(c)\ne0$，两侧异号。必要时换成 $-f$，不妨设 $f''\lt0$ 于 $(-\infty,c)$、$f''\gt0$ 于 $(c,\infty)$，即 $f'$ 在 $c$ 左边严格减、右边严格增。由 (b)，$f'$ 的两个零点 $b_1\lt c\lt b_2$，且 $f'\gt0$ 于 $(-\infty,b_1)\cup(b_2,\infty)$，$f'\lt0$ 于 $(b_1,b_2)$。`, R`看尾部：$x\le b_1-1$ 时 $f'(x)\ge f'(b_1-1)\gt0$，所以 $x\to-\infty$ 时 $f\to-\infty$；同理 $x\to+\infty$ 时 $f\to+\infty$。$f$ 依次增、减、增，按 $f(b_1),f(b_2)$ 的符号分情况数零点。`],
      method: "m-roots", sol: R`<p><b>结论：不存在。</b>下面用反证：假设 $f$ 满足 (a)(b)(c)，推出矛盾。</p>
      <p><b>第 1 步（由 (c) 定 $f''$ 的符号）</b>：$f$ 三阶可微，所以 $f''$ 可导、连续。设 $c$ 是 $f''$ 唯一的零点，$f'''(c)\ne0$。$f''$ 在 $(-\infty,c)$ 上连续且无零点，由介值定理在其上不变号；$(c,\infty)$ 上同理。若 $f'''(c)\gt0$，则 $\frac{f''(x)}{x-c}\to f'''(c)\gt0$，所以 $c$ 左侧 $f''\lt0$、右侧 $f''\gt0$；若 $f'''(c)\lt0$ 则相反。把 $f$ 换成 $-f$ 不改变 (a)(b)(c)，所以<b>不妨设</b> $f''\lt0$ 于 $(-\infty,c)$，$f''\gt0$ 于 $(c,\infty)$。于是 $f'$ 在 $(-\infty,c]$ 上严格递减，在 $[c,\infty)$ 上严格递增，$f'(c)$ 是 $f'$ 的最小值。</p>
      <p><b>第 2 步（由 (b) 定 $f'$ 的符号）</b>：在每个严格单调段上 $f'$ 至多一个零点。若 $f'(c)\ge0$，则 $f'$ 只可能在 $c$ 处为零，至多 1 个零点，与 (b) 矛盾。所以 $f'(c)\lt0$，两个零点 $b_1\lt c\lt b_2$ 各在一侧，并且</p>
      <ul><li>$f'\gt0$ 于 $(-\infty,b_1)$，$f'\lt0$ 于 $(b_1,b_2)$，$f'\gt0$ 于 $(b_2,\infty)$；</li>
      <li>所以 $f$ 在 $(-\infty,b_1]$ 严格增，在 $[b_1,b_2]$ 严格减，在 $[b_2,\infty)$ 严格增，且 $f(b_1)\gt f(b_2)$。</li></ul>
      <p><b>第 3 步（尾部）</b>：令 $\delta=f'(b_1-1)\gt0$。$x\le b_1-1$ 时 $f'$ 递减，$f'(x)\ge\delta$，由 Lagrange 中值定理</p>
      $$f(x)=f(b_1-1)-f'(\zeta)\,(b_1-1-x)\le f(b_1-1)-\delta\,(b_1-1-x)\to-\infty\quad(x\to-\infty).$$
      <p>同理，$x\ge b_2+1$ 时 $f'(x)\ge f'(b_2+1)\gt0$，得 $f(x)\to+\infty\ (x\to+\infty)$。</p>
      <p><b>第 4 步（数零点）</b>：三个单调段上各至多一个零点。按 $f(b_1),f(b_2)$ 的符号分情况：</p>
      <ul><li>$f(b_1)\gt0$ 且 $f(b_2)\lt0$：三段两端都异号，各有一个零点，共 <b>3</b> 个；</li>
      <li>$f(b_1)\lt0$：则 $f(b_2)\lt f(b_1)\lt0$，前两段 $f\lt0$，只有第三段有 1 个零点，共 <b>1</b> 个；</li>
      <li>$f(b_2)\gt0$：则 $f(b_1)\gt f(b_2)\gt0$，后两段 $f\gt0$，只有第一段有 1 个零点，共 <b>1</b> 个；</li>
      <li>$f(b_1)=0$ 或 $f(b_2)=0$：这个零点处 $f'=0$，<b>不是简单零点</b>，违反 (a)。</li></ul>
      <p>每种情况都不可能“恰有 2 个简单零点”，与 (a) 矛盾。</p>
      <p><b>结论：满足 (a)(b)(c) 的三阶可微函数不存在。</b></p>` }
  ]

c1: {
  unit: "convex", n: 1, title: "凸函数与拐点",
  goal: "会用斜率不等式和切线不等式证明下凸函数的性质；会用二阶导数求凹凸区间和拐点。",
  sections: [
    { id: "c1-s1", h: "1. 下凸的定义与斜率不等式", html: R`
      <p><b>这节解决什么</b>：“下凸”描述曲线往上弯（像碗口朝上，如 $y=x^2$）。很多不等式和最值问题，本质上都是在用这个形状。</p>
      <p><b>定义</b>：本课程说的<b>下凸</b>（英文 convex）是指图像上任意两点连成的线段（弦）都不在图像下方：对任何 $x,y$ 和 $t\in[0,1]$，</p>
      $$f\big(tx+(1-t)y\big)\le tf(x)+(1-t)f(y).$$
      <p>左边是 $x,y$ 之间某点的函数值，右边是弦上同一位置的高度。<b>例</b>：$f=x^2$，$x=0,y=2,t=\frac12$：左边 $f(1)=1$，右边 $\frac{0+4}2=2$，$1\le2$ ✓。</p>
      <p>考试里更好用的是等价的<b>斜率不等式</b>：任取 $x_1\lt x_2\lt x_3$，记 $k_{ij}=\frac{f(x_j)-f(x_i)}{x_j-x_i}$（连接第 $i$、$j$ 两点的弦的斜率），则</p>
      $$k_{12}\le k_{13}\le k_{23}.$$
      <p>记法：三点从左到右，“左弦 ≤ 长弦 ≤ 右弦”。<b>例</b>：$f=x^2$，取 $0,1,3$：$k_{12}=\frac{1-0}{1}=1$，$k_{13}=\frac{9-0}{3}=3$，$k_{23}=\frac{9-1}{2}=4$，$1\le3\le4$ ✓。</p>
      <p>下面的图里拖动三个点：三点都在同一下凸区间内时，这个不等式总成立；跨过拐点后不再保证成立（个别位置仍可能碰巧满足）。</p>
      <p>由斜率不等式直接推出的几个结论（证明题常用）：</p>
      <ul>
        <li>固定一个端点 $a$，弦斜率 $\frac{f(x)-f(a)}{x-a}$ 随另一端点 $x$ <b>单调递增</b>（在 $x\gt a$ 和 $x\lt a$ 上都是）。</li>
        <li>若可导，$f'$ 单调递增；并且<b>切线在图像下方</b>：$f(x)\ge f(a)+f'(a)(x-a)$。</li>
        <li>开区间上的下凸函数一定连续，并且处处有左、右导数，$f'_-(x)\le f'_+(x)$（见延伸题）。</li>
      </ul>` },
    { id: "c1-s2", h: "2. 二阶导判别与拐点", html: R`
      <p><b>这节解决什么</b>：直接用定义判断凸性很麻烦。函数二阶可导时，只要看 $f''$ 的符号。</p>
      <ul>
        <li><b>判别</b>：$f$ 在区间 $I$ 上二阶可导，则 $f$ 在 $I$ 上下凸 $\Leftrightarrow$ $f''\ge0$ 于 $I$。若 $f''\gt0$，则严格下凸（弦严格在图像上方，切线不等式在 $x\ne a$ 时取严格号）。$f''\le0$ 对应<b>上凸</b>（曲线往下弯）。</li>
        <li><b>拐点</b>：凹凸性在 $x_0$ 两侧改变的点 $(x_0,f(x_0))$（注意写成坐标）。</li>
        <li><b>必要条件</b>：$x_0$ 是拐点且 $f''(x_0)$ 存在 ⇒ $f''(x_0)=0$。反过来不对：$x^4$ 在 $0$ 处 $f''=0$，但两侧 $f''=12x^2\gt0$ 都下凸，不是拐点。</li>
        <li><b>充分条件</b>：$f''$ 在 $x_0$ 两侧异号；或 $f''(x_0)=0$ 且 $f'''(x_0)\ne0$。</li>
        <li>$f''$ 不存在的点也可能是拐点，例如 $x^{1/3}$ 在 $0$ 处。所以求拐点时，要把 $f''=0$ 的点和 $f''$ 不存在的点都列出来，再逐个看两侧符号。</li>
      </ul>
      <p><b>小例子</b>：$f=x^3$，$f''=6x$。$x\lt0$ 时 $f''\lt0$（上凸），$x\gt0$ 时 $f''\gt0$（下凸），拐点 $(0,0)$。</p>
      <p><b>求凹凸区间的答题格式</b>：算 $f''$ → 化成因式乘积 → 列符号表 → 写“在……上下凸，在……上上凸，拐点为……”。题目问“最大区间”时，端点要包含进去（写闭区间）。</p>` },
    { id: "c1-s3", h: "3. 常考的三类证明", html: R`
      <p><b>这节解决什么</b>：凸函数证明题的套路不多，记住下面四种就能覆盖往年题。</p>
      <ul>
        <li><b>局部最小就是全局最小</b>（2021 期末 4）：下凸函数的极小值点就是最小值点；可导时，导数为零的点（驻点）就是最小值点。工具：斜率不等式，或切线不等式。</li>
        <li><b>切线不等式</b>（2025 期中 5）：$f''\gt0$ ⇒ $f(x)\gt f(a)+f'(a)(x-a)$（$x\ne a$）。用带 Lagrange 余项的一阶 Taylor 公式一行证完，再用它控制 $f$ 在无穷远处的行为。</li>
        <li><b>与积分平均比较</b>（2023 期末 7）：$f''\ge0$ ⇔ 对任何 $a\lt b$，$f\big(\frac{a+b}2\big)\le\frac1{b-a}\int_a^bf$（中点值不超过平均值）。必要性：对中点处的切线不等式积分；充分性：反证，在 $f''\lt0$ 的小区间上用 Taylor 公式得到反向的严格不等式。</li>
        <li><b>Jensen 型不等式</b>：要证的不等式若能写成 $f\big(\frac{x+y}2\big)\le\frac{f(x)+f(y)}2$，就找出 $f$，验证 $f''\ge0$。例：$f=x^2$ 给出 $\big(\frac{x+y}2\big)^2\le\frac{x^2+y^2}2$。</li>
      </ul>` }
  ],

  methods: [
    { id: "m-slope", title: "斜率不等式怎么用", steps: [
      R`先写清三个点的顺序 $x_1\lt x_2\lt x_3$，再写 $k_{12}\le k_{13}\le k_{23}$ 中需要的那一段。`,

    { id: "m-tangent", title: "二阶导与切线不等式", steps: [
      R`$f''\ge0$（或 $\gt0$）⇒ 用带 Lagrange 余项的一阶 Taylor：$f(x)=f(a)+f'(a)(x-a)+\frac{f''(\xi)}2(x-a)^2\ge f(a)+f'(a)(x-a)$。`,

    { id: "m-concave", title: "求凹凸区间与拐点", steps: [

      R`问“最大区间”时写闭区间（端点处 $f$ 连续即可包含）。易错：拐点要写成点的坐标，不能只写横坐标。`] }

  problems: [
    { id: "c1-p1", lv: "基础", src: "2022 秋期末 2(3)", stmt: R`令 $f(x)=\ln(x^2+1)$，求出使得 $f$ 在其上是下凸函数的最大区间 $I$，并求 $f$ 的拐点。`,
      hints: [R`按“求凹凸区间”方法卡：先算到二阶导，再看符号。`, R`$f'(x)=\frac{2x}{1+x^2}$，用商的求导法则 $\big(\frac uv\big)'=\frac{u'v-uv'}{v^2}$ 再求一次，$u=2x$，$v=1+x^2$。`, R`$f''(x)=\frac{2(1+x^2)-2x\cdot2x}{(1+x^2)^2}=\frac{2(1-x^2)}{(1+x^2)^2}$。分母恒正，只看分子 $1-x^2$ 的符号。`],
      method: "m-concave", sol: R`<p><b>第 1 步（求导）</b>：定义域为 $\mathbb R$。</p>
      $$f'(x)=\frac{2x}{1+x^2},\qquad f''(x)=\frac{2(1+x^2)-2x\cdot2x}{(1+x^2)^2}=\frac{2(1-x^2)}{(1+x^2)^2}=\frac{2(1-x)(1+x)}{(1+x^2)^2}.$$
      <p><b>第 2 步（符号表）</b>：分母恒正，$f''$ 的符号由 $(1-x)(1+x)$ 决定：</p>
      <div class="table-wrap"><table><thead><tr><th>$x$</th><th>$(-\infty,-1)$</th><th>$-1$</th><th>$(-1,1)$</th><th>$1$</th><th>$(1,+\infty)$</th></tr></thead><tbody><tr><td>$f''$</td><td>$-$</td><td>$0$</td><td>$+$</td><td>$0$</td><td>$-$</td></tr><tr><td>$f$</td><td>上凸</td><td></td><td>下凸</td><td></td><td>上凸</td></tr></tbody></table></div>
      <p><b>第 3 步（结论）</b>：$f$ 在 $[-1,1]$ 上下凸（端点处 $f$ 连续，可以包含），在 $(-\infty,-1]$ 和 $[1,+\infty)$ 上上凸。$f''$ 在 $x=\pm1$ 两侧异号，所以是拐点；$f(\pm1)=\ln2$。</p>
      <p><b>答：最大下凸区间 $I=[-1,1]$；拐点为 $(-1,\ln2)$ 和 $(1,\ln2)$。</b></p>` },
    { id: "c1-p2", lv: "真题", src: "2021 秋期末 4", stmt: R`<p>设 $f$ 是 $\mathbb R$ 上的下凸函数。</p><p>(1) 利用斜率不等式 $k_{12}\le k_{13}\le k_{23}$ 证明：若 $x_0$ 是 $f$ 的极小值点，则 $x_0$ 是 $f$ 在 $\mathbb R$ 上的最小值点。</p><p>(2) 假设 $f$ 处处可导，且 $f'(a)=0$。证明：$a$ 是 $f$ 在 $\mathbb R$ 上的最小值点。</p><p>(3) 假设 $f$ 处处二阶可导，且存在 $m\gt0$ 使得 $f''(x)\ge m$ 对所有 $x$ 成立。证明：$f$ 在 $\mathbb R$ 上有且仅有一个最小值点。</p>`,
      hints: [R`(1) 反证：若某个 $x_1$ 使 $f(x_1)\lt f(x_0)$，在 $x_0$ 和 $x_1$ 之间、离 $x_0$ 很近（在极小值的邻域内）的地方取一点 $x_2$，用斜率不等式推出 $f(x_2)\lt f(x_0)$，矛盾。`, R`(2) 对 $x\gt a$，取 $a\lt t\lt x$，三点 $a\lt t\lt x$ 用 $k_{12}\le k_{13}$：$\frac{f(t)-f(a)}{t-a}\le\frac{f(x)-f(a)}{x-a}$，令 $t\to a^+$，左边 $\to f'(a)=0$。$x\lt a$ 时用 $k_{13}\le k_{23}$ 类似。`, R`(3) 存在：对 $f'$ 用 Lagrange 得 $f'(x)\ge f'(0)+mx$（$x\gt0$）、$f'(x)\le f'(0)+mx$（$x\lt0$），所以 $f'$ 在远处异号，由介值定理有零点，再用 (2)。唯一：$f''\gt0$ 使 $f'$ 严格递增，至多一个零点；任何最小值点都满足 $f'=0$（Fermat）。`],
      method: "m-slope", sol: R`<p><b>(1)</b> 设 $x_0$ 是极小值点：存在 $\delta\gt0$，当 $|x-x_0|\lt\delta$ 时 $f(x)\ge f(x_0)$。<b>反设</b>存在 $x_1$ 使 $f(x_1)\lt f(x_0)$。</p>
      <p><b>情形 $x_1\gt x_0$</b>：取 $x_2\in\big(x_0,\min\{x_1,x_0+\delta\}\big)$，则 $x_0\lt x_2\lt x_1$。对这三点用 $k_{12}\le k_{13}$：</p>
      $$\frac{f(x_2)-f(x_0)}{x_2-x_0}\le\frac{f(x_1)-f(x_0)}{x_1-x_0}\lt0,$$
      <p>所以 $f(x_2)\lt f(x_0)$。但 $|x_2-x_0|\lt\delta$，应有 $f(x_2)\ge f(x_0)$，矛盾。</p>
      <p><b>情形 $x_1\lt x_0$</b>：取 $x_2\in\big(\max\{x_1,x_0-\delta\},x_0\big)$，则 $x_1\lt x_2\lt x_0$。用 $k_{13}\le k_{23}$：</p>
      $$\frac{f(x_0)-f(x_2)}{x_0-x_2}\ge\frac{f(x_0)-f(x_1)}{x_0-x_1}\gt0,$$
      <p>所以 $f(x_2)\lt f(x_0)$，同样矛盾。故 <b>$x_0$ 是最小值点</b>。</p>
      <p><b>(2)</b> <b>对 $x\gt a$</b>：任取 $t\in(a,x)$，三点 $a\lt t\lt x$，由 $k_{12}\le k_{13}$：</p>
      $$\frac{f(t)-f(a)}{t-a}\le\frac{f(x)-f(a)}{x-a}.$$
      <p>令 $t\to a^+$，左边 $\to f'(a)=0$，得 $\frac{f(x)-f(a)}{x-a}\ge0$，又 $x-a\gt0$，所以 $f(x)\ge f(a)$。</p>
      <p><b>对 $x\lt a$</b>：任取 $t\in(x,a)$，三点 $x\lt t\lt a$，由 $k_{13}\le k_{23}$：</p>
      $$\frac{f(a)-f(x)}{a-x}\le\frac{f(a)-f(t)}{a-t}.$$
      <p>令 $t\to a^-$，右边 $\to f'(a)=0$，得 $f(a)-f(x)\le0$。所以 <b>$a$ 是最小值点</b>。</p>
      <p><b>(3) 存在</b>：对 $x\gt0$，在 $[0,x]$ 上对 $f'$ 用 Lagrange：存在 $\theta\in(0,x)$，$f'(x)=f'(0)+f''(\theta)x\ge f'(0)+mx$。所以当 $x\gt\frac{|f'(0)|}{m}$ 时 $f'(x)\gt0$。同理 $x\lt0$ 时 $f'(x)=f'(0)+f''(\theta)x\le f'(0)+mx$（$x\lt0$ 乘 $f''\ge m$ 不等号反向），当 $x\lt-\frac{|f'(0)|}m$ 时 $f'(x)\lt0$。$f'$ 可导从而连续，由介值定理存在 $a$ 使 $f'(a)=0$。由 (2)，$a$ 是最小值点。</p>
      <p><b>(3) 唯一</b>：$f''\ge m\gt0$，$f'$ 严格递增，至多一个零点。若 $b$ 也是最小值点，它是 $\mathbb R$ 的内点处的极值点，由 Fermat 定理 $f'(b)=0$，所以 $b=a$。</p>
      <p><b>结论：$f$ 有且仅有一个最小值点。</b></p>` },
    { id: "c1-p3", lv: "真题", src: "2025 秋期中 5", stmt: R`<p>设 $f:(0,+\infty)\to\mathbb R$ 满足对任何 $x\gt0$ 都有 $f''(x)\gt0$。</p><p>(1) 证明：对不同的正数 $a,x$，有 $f(x)\gt f(a)+f'(a)(x-a)$。</p><p>(2) 假设 $\lim\limits_{x\to+\infty}f(x)=0$。证明：对任何 $x\gt0$ 都有 $f(x)\gt0$。</p>`,
      hints: [R`(1) 用带 Lagrange 余项的一阶 Taylor 公式，在 $a$ 处展开到 $x$，看余项的符号。`, R`(2) 先证 $f'$ 处处为负（即 $f$ 严格递减）。反证：若某点 $f'(a)\ge0$，取 $b=a+1$，由 $f'$ 严格递增得 $f'(b)\gt0$；由 (1)，$f(x)\gt f(b)+f'(b)(x-b)\to+\infty$，与 $\lim f=0$ 矛盾。`, R`$f$ 严格递减，所以对 $t\gt x+1$，$f(x)\gt f(x+1)\gt f(t)$；令 $t\to+\infty$，$f(x+1)\ge0$，从而 $f(x)\gt0$。`],
      method: "m-tangent", sol: R`<p><b>(1)</b> 设 $a\ne x$ 都是正数。由带 Lagrange 余项的一阶 Taylor 公式，存在 $\xi$ 介于 $a$ 与 $x$ 之间（所以 $\xi\gt0$），</p>
      $$f(x)=f(a)+f'(a)(x-a)+\frac{f''(\xi)}2(x-a)^2.$$
      <p>因为 $f''(\xi)\gt0$，$(x-a)^2\gt0$，最后一项为正。<b>所以 $f(x)\gt f(a)+f'(a)(x-a)$。</b></p>
      <p><b>(2) 第 1 步（$f'$ 处处为负）</b>：$f''\gt0$，所以 $f'$ 严格递增。反设存在 $a\gt0$ 使 $f'(a)\ge0$。取 $b=a+1$，则 $f'(b)\gt f'(a)\ge0$。由 (1)，对 $x\gt b$，</p>
      $$f(x)\gt f(b)+f'(b)(x-b)\to+\infty\quad(x\to+\infty),$$
      <p>与 $\lim\limits_{x\to+\infty}f(x)=0$ 矛盾。所以对所有 $a\gt0$，$f'(a)\lt0$，$f$ 在 $(0,+\infty)$ 上严格递减。</p>
      <p><b>第 2 步（$f\gt0$）</b>：任取 $x\gt0$。对任意 $t\gt x+1$，由严格递减 $f(x+1)\gt f(t)$。令 $t\to+\infty$，得 $f(x+1)\ge0$（极限保持非严格不等号）。再由严格递减，$f(x)\gt f(x+1)\ge0$。</p>
      <p><b>结论：对任何 $x\gt0$，$f(x)\gt0$。</b></p>` },
    { id: "c1-p4", lv: "真题", src: "2023 秋期末 7", stmt: R`设 $f$ 在 $(-\infty,+\infty)$ 上有连续的二阶导数。证明：$f''(x)$ 处处非负的充分必要条件是，对任何 $a\lt b$ 有 $$f\Big(\frac{a+b}2\Big)\le\frac1{b-a}\int_a^bf(x)\,dx.$$`,
      hints: [R`必要性（$f''\ge0$ ⇒ 不等式）：记中点 $m=\frac{a+b}2$，用切线不等式 $f(x)\ge f(m)+f'(m)(x-m)$。`, R`把切线不等式在 $[a,b]$ 上积分。关键：$\int_a^b(x-m)\,dx=0$（$m$ 是中点，左右正负抵消），所以 $f'(m)$ 那一项积分后消失。`, R`充分性（不等式 ⇒ $f''\ge0$）用反证：若 $f''(x_0)\lt0$，由连续性取 $h$ 使 $f''\lt0$ 于 $[x_0-h,x_0+h]$。在 $x_0$ 处 Taylor 展开得 $f(x)\lt f(x_0)+f'(x_0)(x-x_0)$（$x\ne x_0$），在 $[x_0-h,x_0+h]$ 上积分，得到方向相反的严格不等式。`],
      method: "m-tangent", sol: R`<p><b>必要性</b>：设 $f''\ge0$。任取 $a\lt b$，记 $m=\frac{a+b}2$。</p>
      <p>第 1 步：对 $x\in[a,b]$，由带 Lagrange 余项的 Taylor 公式，存在 $\xi$ 介于 $m,x$ 之间，</p>
      $$f(x)=f(m)+f'(m)(x-m)+\frac{f''(\xi)}2(x-m)^2\ge f(m)+f'(m)(x-m).$$
      <p>第 2 步：两边在 $[a,b]$ 上积分。由于 $\int_a^b(x-m)\,dx=\Big[\frac{(x-m)^2}{2}\Big]_a^b=\frac{(b-m)^2-(a-m)^2}{2}=0$（$b-m=m-a$），</p>
      $$\int_a^bf(x)\,dx\ge(b-a)f(m)+f'(m)\cdot0=(b-a)f(m).$$
      <p>两边除以 $b-a\gt0$，即得 $f\big(\frac{a+b}2\big)\le\frac1{b-a}\int_a^bf$。</p>
      <p><b>充分性</b>：设对任何 $a\lt b$ 不等式成立。<b>反设</b>存在 $x_0$ 使 $f''(x_0)\lt0$。</p>
      <p>第 1 步：$f''$ 连续，由保号性存在 $h\gt0$，使 $f''\lt0$ 于 $[x_0-h,x_0+h]$。</p>
      <p>第 2 步：对此区间内的 $x\ne x_0$，存在 $\xi$ 介于 $x_0,x$ 之间（也在区间内），</p>
      $$f(x)=f(x_0)+f'(x_0)(x-x_0)+\frac{f''(\xi)}2(x-x_0)^2\lt f(x_0)+f'(x_0)(x-x_0).$$
      <p>第 3 步：令 $g(x)=f(x_0)+f'(x_0)(x-x_0)-f(x)$。$g$ 连续，在 $[x_0-h,x_0+h]$ 上非负，且除 $x_0$ 外恒正，所以 $\int_{x_0-h}^{x_0+h}g\,dx\gt0$（例如在 $[x_0+\frac h2,x_0+h]$ 上 $g$ 有正的最小值）。又 $\int_{x_0-h}^{x_0+h}(x-x_0)\,dx=0$，所以</p>
      $$\int_{x_0-h}^{x_0+h}f(x)\,dx\lt2h\,f(x_0).$$
      <p>第 4 步：取 $a=x_0-h$，$b=x_0+h$，则 $\frac{a+b}2=x_0$，上式即 $f\big(\frac{a+b}2\big)\gt\frac1{b-a}\int_a^bf$，与条件矛盾。</p>
      <p><b>结论：$f''\ge0$ 处处成立 $\Leftrightarrow$ 对任何 $a\lt b$，$f\big(\frac{a+b}2\big)\le\frac1{b-a}\int_a^bf(x)\,dx$。</b></p>` }
  ],

    { id: "c1-v2", lv: "变种", src: "仿 2025 期中 5", stmt: R`设 $f$ 在 $(0,+\infty)$ 上下凸，且 $\lim\limits_{x\to0^+}f(x)=0$。证明：$\dfrac{f(x)}x$ 在 $(0,+\infty)$ 上单调递增。`,
      hints: [R`$\frac{f(x)}x=\frac{f(x)-0}{x-0}$ 像是“从原点 $(0,0)$ 出发的弦斜率”，但 $0$ 不在定义域里，所以先用一个靠近 $0$ 的点 $t$ 代替原点。`, R`对 $0\lt x\lt y$，取 $t\in(0,x)$，对三点 $t\lt x\lt y$ 用 $k_{12}\le k_{13}$。`, R`得到 $\frac{f(x)-f(t)}{x-t}\le\frac{f(y)-f(t)}{y-t}$，令 $t\to0^+$，用 $f(t)\to0$。`],
      method: "m-slope", sol: R`<p><b>要证</b>：对任意 $0\lt x\lt y$，$\dfrac{f(x)}x\le\dfrac{f(y)}y$。</p>
      <p><b>第 1 步</b>：任取 $t\in(0,x)$，三点 $t\lt x\lt y$ 都在定义域内。由斜率不等式 $k_{12}\le k_{13}$：</p>
      $$\frac{f(x)-f(t)}{x-t}\le\frac{f(y)-f(t)}{y-t}.$$
      <p><b>第 2 步</b>：令 $t\to0^+$。$f(t)\to0$，$x-t\to x$，$y-t\to y$，不等式取极限保持 $\le$：</p>

    { id: "c1-v3", lv: "变种", src: "Jensen 型", stmt: R`证明：对任意 $x,y\gt0$，有 $x\ln x+y\ln y\ge(x+y)\ln\dfrac{x+y}2$。`,
      hints: [R`两边除以 2，右边变成 $\frac{x+y}2\ln\frac{x+y}2$，左边是 $\frac{x\ln x+y\ln y}2$。`, R`令 $f(t)=t\ln t$，要证的就是 $f\big(\frac{x+y}2\big)\le\frac{f(x)+f(y)}2$。`, R`验证 $f$ 下凸：$f'(t)=\ln t+1$，$f''(t)=\frac1t\gt0$。再用下凸定义取 $t=\frac12$。`],
      method: "m-tangent", sol: R`<p><b>第 1 步（找函数）</b>：令 $f(t)=t\ln t$（$t\gt0$）。$f'(t)=\ln t+1$，$f''(t)=\frac1t\gt0$，所以 $f$ 在 $(0,+\infty)$ 上下凸。</p>

      $$\frac{x+y}2\ln\frac{x+y}2=f\Big(\frac{x+y}2\Big)\le\frac{f(x)+f(y)}2=\frac{x\ln x+y\ln y}2.$$
      <p><b>第 3 步</b>：两边乘 2。</p>
      <p><b>结论：$x\ln x+y\ln y\ge(x+y)\ln\dfrac{x+y}2$，等号当且仅当 $x=y$（$f$ 严格下凸）。</b></p>
      <p class="small muted">验算：$x=1,y=3$：左边 $3\ln3\approx3.296$，右边 $4\ln2\approx2.773$ ✓。</p>` }

    { id: "c1-e1", lv: "延伸", src: "经典结论", stmt: R`设 $f$ 是 $\mathbb R$ 上的下凸函数，且有上界。证明：$f$ 是常数。`,
      hints: [R`反证：设有 $x_1\lt x_2$ 使 $f(x_1)\ne f(x_2)$，记弦斜率 $k=\frac{f(x_2)-f(x_1)}{x_2-x_1}\ne0$。目标：证明 $f$ 在某一侧趋于 $+\infty$。`, R`若 $k\gt0$：对 $x\gt x_2$，三点 $x_1\lt x_2\lt x$ 用 $k_{12}\le k_{23}$，得 $f(x)\ge f(x_2)+k(x-x_2)$。`, R`若 $k\lt0$：对 $x\lt x_1$，三点 $x\lt x_1\lt x_2$ 用 $k_{12}\le k_{23}$，得 $f(x)\ge f(x_1)+|k|(x_1-x)$。两种情况都无上界。`],

      $$\frac{f(x_1)-f(x)}{x_1-x}\le k\ \Rightarrow\ f(x)\ge f(x_1)-k(x_1-x)\to+\infty\quad(x\to-\infty),$$

      hints: [R`固定 $x_0\in(a,b)$，在它两侧各取一个点 $a\lt u\lt x_0\lt v\lt b$（开区间才能取到）。目标：证明 $x$ 靠近 $x_0$ 时，弦斜率 $\frac{f(x)-f(x_0)}{x-x_0}$ 被两个固定的数夹住，从而 $|f(x)-f(x_0)|\le M|x-x_0|$。`, R`$x_0\lt x\lt v$ 时：三点 $u\lt x_0\lt x$ 给出 $k(u,x_0)\le k(x_0,x)$；三点 $x_0\lt x\lt v$ 给出 $k(x_0,x)\le k(x_0,v)$。`, R`$u\lt x\lt x_0$ 时：三点 $u\lt x\lt x_0$ 给出 $k(u,x_0)\le k(x,x_0)$；三点 $x\lt x_0\lt v$ 给出 $k(x,x_0)\le k(x_0,v)$。取 $M=\max\{|k(u,x_0)|,|k(x_0,v)|\}$。`],
      method: "m-slope", sol: R`<p><b>记号</b>：$k(p,q)=\dfrac{f(q)-f(p)}{q-p}$（$p\ne q$），注意 $k(p,q)=k(q,p)$。</p>
      <p><b>第 1 步</b>：固定 $x_0\in(a,b)$，取 $u,v$ 使 $a\lt u\lt x_0\lt v\lt b$。</p>
      <p><b>第 2 步（右侧 $x_0\lt x\lt v$）</b>：</p>
      <ul><li>三点 $u\lt x_0\lt x$，由 $k_{12}\le k_{23}$：$k(u,x_0)\le k(x_0,x)$；</li>
      <li>三点 $x_0\lt x\lt v$，由 $k_{12}\le k_{13}$：$k(x_0,x)\le k(x_0,v)$。</li></ul>
      <p><b>第 3 步（左侧 $u\lt x\lt x_0$）</b>：</p>
      <ul><li>三点 $u\lt x\lt x_0$，由 $k_{13}\le k_{23}$：$k(u,x_0)\le k(x,x_0)$；</li>
      <li>三点 $x\lt x_0\lt v$，由 $k_{12}\le k_{23}$：$k(x,x_0)\le k(x_0,v)$。</li></ul>

      $$|f(x)-f(x_0)|=|k(x,x_0)|\cdot|x-x_0|\le M|x-x_0|\to0\quad(x\to x_0).$$

i1: {
  unit: R`int`,
  n: 1,
  title: R`定积分：换元与分部`,
  goal: R`定积分的两大计算工具：换元（变量、微分、上下限三样一起换）和分部积分（选好 $u$、$dv$）。另外学会三角有理式的“半角代换”和对称换元，并能写出换元公式的证明（真题考过）。30 分钟先完成概念题和三道核心题，延伸选做。`,
  sections: [
    {
      id: R`i1-s1`,
      h: R`1. 定积分换元：变量、微分、端点三样一起换`,
      html: R`
<p><b>这节解决什么</b>：不定积分换元后要“反代回 $x$”；定积分换元可以省掉这一步——只要把上下限也一起换成新变量的值，直接算出数。</p>
<p><b>先复习牛顿–莱布尼兹公式</b>：$f$ 在 $[a,b]$ 连续，$F'=f$，则 $\int_a^bf(x)\,dx=F(b)-F(a)$。定积分的结果是一个数，<b>不写 $+C$</b>。另外约定 $\int_b^af=-\int_a^bf$（上下限交换要变号）。</p>
<p><b>换元公式</b>：设 $f$ 在区间 $I$ 上连续，$\varphi$ 在 $[\alpha,\beta]$ 上连续可导（记作 $\varphi\in C^1$，即导数存在且连续），并且 $\varphi$ 的取值都落在 $I$ 里。则</p>
$$\int_\alpha^\beta f(\varphi(t))\varphi'(t)\,dt=\int_{\varphi(\alpha)}^{\varphi(\beta)}f(u)\,du.$$
<p><b>为什么成立</b>（证明只有三步）：</p>
<ol>
<li>取 $f$ 的一个原函数 $F$（$f$ 连续，原函数存在）。</li>
<li>链式法则：$\bigl(F(\varphi(t))\bigr)'=f(\varphi(t))\varphi'(t)$，所以左边 $=F(\varphi(\beta))-F(\varphi(\alpha))$。</li>
<li>右边由牛顿–莱布尼兹公式也 $=F(\varphi(\beta))-F(\varphi(\alpha))$，两边相等。</li>
</ol>
<p>注意证明里没有用到 $\varphi$ 单调，所以<b>这个公式不要求 $\varphi$ 单调</b>。</p>
<p><b>操作四步</b>：①写新变量 $u=g(x)$；②求微分 $du=g'(x)\,dx$；③列端点对应：$x=a\mapsto u=g(a)$，$x=b\mapsto u=g(b)$；④把被积式、$dx$、上下限整体换掉。</p>
<p><b>小例子</b>：$\int_0^1\frac{2x}{1+x^2}\,dx$。令 $u=x^2$，$du=2x\,dx$；$x=0\mapsto u=0$，$x=1\mapsto u=1$。所以 $$\int_0^1\frac{2x}{1+x^2}\,dx=\int_0^1\frac{du}{1+u}=\bigl[\ln(1+u)\bigr]_0^1=\ln2.$$ 一般地上限为 $s$ 时结果是 $\ln(1+s^2)$。</p>
<p>下面拖动上端点，同时看原变量与新变量下的面积：两张图横轴不同，面积值相同。</p>`
    },
    {
      id: R`i1-s2`,
      h: R`2. 分部积分：让剩下的积分变简单`,
      html: R`
<p><b>这节解决什么</b>：被积函数是两类函数的乘积（如 $x e^x$、$x\ln x$）时，换元不好用，就用分部积分。</p>
<p><b>公式</b>：由乘积求导 $(uv)'=u'v+uv'$，两边在 $[a,b]$ 上积分并移项。若 $u,v$ 在 $[a,b]$ 上连续可导，则</p>
$$\int_a^bu(x)v'(x)\,dx=\bigl[u(x)v(x)\bigr]_a^b-\int_a^bu'(x)v(x)\,dx.$$
<p>简写为 $\int u\,dv=uv-\int v\,du$。其中 $[uv]_a^b=u(b)v(b)-u(a)v(a)$ 叫<b>边界项</b>。</p>
<p><b>怎样选 $u$</b>：选“求导后变简单”的那个（$\ln x$、$\arctan x$、多项式）；$dv$ 选“容易积分”的那个（$e^x\,dx$、$\sin x\,dx$、$x\,dx$）。判断标准只有一个：<b>换完后剩下的积分 $\int v\,du$ 是否更简单</b>。</p>
<p><b>小例子</b>：$\int_0^1xe^x\,dx$。取 $u=x$，$dv=e^x\,dx$，则 $du=dx$，$v=e^x$：</p>
$$\int_0^1xe^x\,dx=\bigl[xe^x\bigr]_0^1-\int_0^1e^x\,dx=(e-0)-(e-1)=1.$$
<p><b>易错</b>：边界项要代完值再化简，不要漏掉。若端点处函数没有定义（比如 $\ln x$ 在 0），先把端点换成 $\varepsilon$ 算，再令 $\varepsilon\to0^+$，不能把 $0\cdot\infty$ 直接当成 0。Wallis 型递推放在下一课专练。</p>`
    },
    {
      id: R`i1-s3`,
      h: R`3. 三角有理式：半角代换与对称换元`,
      html: R`
<p><b>这节解决什么</b>：被积函数是 $\sin x,\cos x$ 的分式（叫三角有理式，如 $\frac1{2+\cos x}$）时，有一个“万能”的代换把它变成普通的分式函数。</p>
<p><b>半角代换</b>：令 $t=\tan\frac x2$，则（由倍角公式）</p>
$$\sin x=\frac{2t}{1+t^2},\qquad\cos x=\frac{1-t^2}{1+t^2},\qquad dx=\frac{2\,dt}{1+t^2}.$$
<p>（$dx$ 来自 $x=2\arctan t$。）代入后全部变成 $t$ 的有理函数。</p>
<p><b>端点</b>：$x\in[0,\pi)$ 对应 $t\in[0,+\infty)$。$x=\pi$ 时 $\tan\frac\pi2$ 无定义，所以上限是 $\pi$ 时，先把上限写成 $r\lt\pi$，算完再令 $r\to\pi^-$，此时 $t$ 的上限 $\tan\frac r2\to+\infty$。</p>
<p><b>对称换元（常常更省事）</b>：令 $x=a+b-t$，则 $x=a\mapsto t=b$，$x=b\mapsto t=a$，$dx=-dt$，于是</p>
$$\int_a^bf(x)\,dx=\int_b^af(a+b-t)(-dt)=\int_a^bf(a+b-t)\,dt.$$
<p>上下限颠倒带来一个负号，$dx=-dt$ 又带来一个负号，两者抵消。</p>
<p><b>例</b>：$I=\int_0^{\pi/2}\frac{\sin x}{\sin x+\cos x}\,dx$。用 $x\mapsto\frac\pi2-x$（$\sin$ 与 $\cos$ 互换）得 $I=\int_0^{\pi/2}\frac{\cos x}{\cos x+\sin x}\,dx$。两式相加，被积函数变成 1：$2I=\int_0^{\pi/2}1\,dx=\frac\pi2$，所以 $I=\frac\pi4$。</p>`
    }

      sol: R`<p><b>(1)</b> 令 $u=x^2$，$du=2x\,dx$；端点 $x=0\mapsto u=0$，$x=1\mapsto u=1$。</p>
$$\int_0^12xe^{x^2}\,dx=\int_0^1e^u\,du=\bigl[e^u\bigr]_0^1=e-1.$$
<p><b>(2)</b> 取 $u=\ln(1+x)$，$dv=x\,dx$，则 $du=\frac{dx}{1+x}$，$v=\frac{x^2}2$。分部积分：</p>
$$\int_0^1x\ln(1+x)\,dx=\Big[\frac{x^2}2\ln(1+x)\Big]_0^1-\frac12\int_0^1\frac{x^2}{1+x}\,dx=\frac12\ln2-\frac12\int_0^1\frac{x^2}{1+x}\,dx.$$

<p>代回：$\frac12\ln2-\frac12\bigl(\ln2-\frac12\bigr)=\frac14$。</p>
<p><b>答案：(1) $e-1$；(2) $\frac14$。</b>自检：(2) 的被积函数在 $[0,1]$ 上非负且不超过 $\ln2\approx0.69$，答案 $0.25$ 合理。</p>`

    {
      id: R`i1-p2`,
      lv: R`真题`,
      src: R`2023 秋期末 1(2)`,
      stmt: R`叙述定积分的换元公式，并给出证明。可选择讲解中的连续函数与 $C^1$ 换元版本。`,
      hints: [
        R`先写条件：$f$ 在区间 $I$ 连续；$\varphi$ 在 $[\alpha,\beta]$ 上连续可导；$\varphi$ 的取值落在 $I$ 内。然后写出公式。`,
        R`证明：取 $f$ 的原函数 $F$（$f$ 连续保证存在），用链式法则算 $\frac{d}{dt}F(\varphi(t))$。`,
        R`$\frac{d}{dt}F(\varphi(t))=f(\varphi(t))\varphi'(t)$，所以左边 $=F(\varphi(\beta))-F(\varphi(\alpha))$；右边用牛顿–莱布尼兹也等于这个。`

      method: R`m-int-sub`,
      sol: R`<p><b>叙述</b>：设 $f$ 在区间 $I$ 上连续，$\varphi$ 在 $[\alpha,\beta]$ 上连续可导，且 $\varphi(t)\in I$ 对所有 $t\in[\alpha,\beta]$ 成立。则</p>
$$\int_\alpha^\beta f(\varphi(t))\varphi'(t)\,dt=\int_{\varphi(\alpha)}^{\varphi(\beta)}f(u)\,du.$$
<p><b>证明</b>：</p>
<p>① 取定 $u_0\in I$，令 $F(u)=\int_{u_0}^uf(v)\,dv$。因 $f$ 连续，由微积分基本定理 $F'(u)=f(u)$，即 $F$ 是 $f$ 的原函数。</p>
<p>② 令 $G(t)=F(\varphi(t))$。由链式法则，$G'(t)=F'(\varphi(t))\varphi'(t)=f(\varphi(t))\varphi'(t)$，它在 $[\alpha,\beta]$ 上连续。</p>
<p>③ 对左边用牛顿–莱布尼兹公式（$G$ 是被积函数的原函数）：左边 $=G(\beta)-G(\alpha)=F(\varphi(\beta))-F(\varphi(\alpha))$。</p>

<p><b>第 1 步：截断</b>。$\theta=\pi$ 处半角代换无定义，先算 $I(r)=\int_0^r\frac{d\theta}{a-b\cos\theta}$（$0\lt r\lt\pi$），最后令 $r\to\pi^-$（被积函数连续，$I(r)\to I$）。</p>
<p><b>第 2 步：半角代换</b>。令 $t=\tan\frac\theta2$，$\theta\in[0,r]\mapsto t\in[0,\tan\frac r2]$，$\cos\theta=\frac{1-t^2}{1+t^2}$，$d\theta=\frac{2\,dt}{1+t^2}$。分母：</p>
$$a-b\cdot\frac{1-t^2}{1+t^2}=\frac{a(1+t^2)-b(1-t^2)}{1+t^2}=\frac{(a-b)+(a+b)t^2}{1+t^2}.$$
<p>所以 $\frac{d\theta}{a-b\cos\theta}=\frac{1+t^2}{(a-b)+(a+b)t^2}\cdot\frac{2\,dt}{1+t^2}=\frac{2\,dt}{(a-b)+(a+b)t^2}$。令 $r\to\pi^-$，$\tan\frac r2\to+\infty$：</p>

<p><b>答案：$I=\dfrac{\pi}{\sqrt{a^2-b^2}}$。</b></p>

  sections: [
    {
      id: R`i2-s1`,
      h: R`1. Wallis 积分：分部积分把 $n$ 次降到 $n-2$ 次`,
      html: R`
<p><b>这节解决什么</b>：$\int_0^{\pi/2}\sin^5x\,dx$ 这类高次幂积分，直接求原函数很麻烦。办法是找出第 $n$ 个和第 $n-2$ 个积分之间的关系（<b>递推式</b>），一步步降下去。</p>
<p><b>定义</b>：对整数 $n\ge0$，$W_n=\int_0^{\pi/2}\sin^nx\,dx$。<b>初值</b>（直接算）：</p>
$$W_0=\int_0^{\pi/2}1\,dx=\frac\pi2,\qquad W_1=\int_0^{\pi/2}\sin x\,dx=\bigl[-\cos x\bigr]_0^{\pi/2}=1.$$
<p><b>推导递推式</b>（$n\ge2$）：</p>
<ol>
<li>拆一个因子出来：$\sin^nx=\sin^{n-1}x\cdot\sin x$。取 $u=\sin^{n-1}x$，$dv=\sin x\,dx$，则 $du=(n-1)\sin^{n-2}x\cos x\,dx$，$v=-\cos x$。</li>
<li>边界项：$\bigl[-\sin^{n-1}x\cos x\bigr]_0^{\pi/2}$。上端 $\cos\frac\pi2=0$；下端 $\sin0=0$ 且 $n-1\ge1$。所以边界项 $=0$。</li>
<li>剩余积分：$W_n=(n-1)\int_0^{\pi/2}\sin^{n-2}x\cos^2x\,dx$。用 $\cos^2x=1-\sin^2x$：$$W_n=(n-1)(W_{n-2}-W_n).$$</li>
<li>右边又出现了 $W_n$，<b>移项</b>：$nW_n=(n-1)W_{n-2}$，即 $$W_n=\frac{n-1}{n}W_{n-2}\qquad(n\ge2).$$</li>
</ol>
<p><b>小例子</b>：$W_2=\frac12W_0=\frac\pi4$，$W_3=\frac23W_1=\frac23$。</p>
<p><b>易错</b>：①忘了移项；②把递推用在 $n=1$ 上——此时 $\sin^0x=1$，下端边界项 $-\cos0=-1\ne0$。递推每次降两阶，所以偶数要从 $W_0$ 出发，奇数要从 $W_1$ 出发。</p>`
    },
    {
      id: R`i2-s2`,
      h: R`2. 奇偶通式，以及带根号的真题积分`,
      html: R`
<p><b>这节解决什么</b>：把递推一路展开，写出 $W_n$ 的通式；再说明考试中的 $\int_0^1x^n\sqrt{1-x^2}\,dx$ 其实是 Wallis 积分换了个样子。</p>
<p><b>双阶乘</b>：$k!!=k(k-2)(k-4)\cdots$，乘到 1 或 2 为止。例：$5!!=5\cdot3\cdot1=15$，$6!!=6\cdot4\cdot2=48$。约定 $0!!=(-1)!!=1$。</p>
<p><b>通式</b>（反复用递推）：</p>
$$W_{2m}=\frac{(2m-1)!!}{(2m)!!}\cdot\frac\pi2,\qquad W_{2m+1}=\frac{(2m)!!}{(2m+1)!!}\qquad(m\ge0).$$
<p>例：$W_4=\frac34\cdot\frac12\cdot\frac\pi2=\frac{3!!}{4!!}\cdot\frac\pi2=\frac{3\pi}{16}$；$W_5=\frac45\cdot\frac23\cdot1=\frac{4!!}{5!!}=\frac8{15}$。</p>
<p><b>真题积分族</b>（2023 期末）：$a_n=\int_0^1x^n\sqrt{1-x^2}\,dx$。令 $x=\sin t$，$t\in[0,\frac\pi2]$：$dx=\cos t\,dt$，$\sqrt{1-\sin^2t}=\cos t$（此区间 $\cos t\ge0$）。于是</p>
$$a_n=\int_0^{\pi/2}\sin^nt\cos^2t\,dt=\int_0^{\pi/2}\sin^nt\,(1-\sin^2t)\,dt=W_n-W_{n+2}.$$
<p>再用递推 $W_{n+2}=\frac{n+1}{n+2}W_n$：$a_n=W_n\bigl(1-\frac{n+1}{n+2}\bigr)=\frac{W_n}{n+2}$。所以 $a_0=\frac{W_0}2=\frac\pi4$，$a_1=\frac{W_1}3=\frac13$，并且</p>
$$a_n=\frac{n-1}{n+2}a_{n-2}\qquad(n\ge2).$$
<p><b>对称区间先看奇偶</b>：$I_n=\int_{-1}^1x^n\sqrt{1-x^2}\,dx$。$n$ 为奇数时被积函数是奇函数（$f(-x)=-f(x)$），积分为 0；$n$ 为偶数时是偶函数，积分 $=2a_n$。不要对所有 $n$ 都“乘 2”。</p>`

      html: R`
<p><b>这节解决什么</b>：真题第 (2) 问求 $\lim\frac{a_n}{a_{n-1}}$。递推只联系 $a_n$ 与 $a_{n-2}$（隔一项），相邻两项没有直接公式，要用夹逼定理。</p>
<p><b>第 1 步：单调</b>。$0\le x\le1$ 时 $x^n\le x^{n-1}\le x^{n-2}$，乘非负的 $\sqrt{1-x^2}$ 再积分，得 $$0\lt a_n\le a_{n-1}\le a_{n-2}.$$</p>
<p><b>第 2 步：夹逼</b>。分子都是 $a_n\gt0$，分母越大比值越小：$$\frac{n-1}{n+2}=\frac{a_n}{a_{n-2}}\le\frac{a_n}{a_{n-1}}\le\frac{a_n}{a_n}=1\qquad(n\ge2).$$</p>
<p><b>第 3 步</b>：左边 $\frac{n-1}{n+2}\to1$，右边 $=1$，所以 $\frac{a_n}{a_{n-1}}\to1$。<b>不需要 Stirling 公式</b>。</p>
<p><b>易错</b>：“$a_n\to0$ 且 $a_{n-1}\to0$，所以比值 $\to1$”是错误推理。反例 $a_n=2^{-n}$：两项都趋于 0，但比值恒为 $\frac12$。</p>
<p>同理 $W_n$ 递减，结合 $\frac{W_{n+2}}{W_n}=\frac{n+1}{n+2}$，可夹出 $\frac{W_{n+1}}{W_n}\to1$。要证 $W_n\to0$：取小 $\delta\gt0$，把 $[0,\frac\pi2]$ 分成 $[0,\frac\pi2-\delta]$（这里 $\sin x\le\cos\delta\lt1$，积分 $\le\frac\pi2(\cos\delta)^n\to0$）和最后长 $\delta$ 的一段（积分 $\le\delta$）。</p>`
    }

        R`边界项 $[-\sin^{n-1}x\cos x]_0^{\pi/2}=0$（$n\ge2$）。剩下 $(n-1)\int\sin^{n-2}x\cos^2x\,dx$，用 $\cos^2x=1-\sin^2x$ 得 $W_n=(n-1)(W_{n-2}-W_n)$，移项。`,
        R`$W_4=\frac34W_2=\frac34\cdot\frac12W_0$，$W_0=\frac\pi2$；$W_5=\frac45W_3=\frac45\cdot\frac23W_1$，$W_1=1$。`
      ],
      method: R`m-wallis`,
      sol: R`<p><b>推导</b>（$n\ge2$）。取 $u=\sin^{n-1}x$，$dv=\sin x\,dx$，则 $du=(n-1)\sin^{n-2}x\cos x\,dx$，$v=-\cos x$。</p>
$$W_n=\bigl[-\sin^{n-1}x\cos x\bigr]_0^{\pi/2}+(n-1)\int_0^{\pi/2}\sin^{n-2}x\cos^2x\,dx.$$
<p>边界项：$x=\frac\pi2$ 时 $\cos x=0$；$x=0$ 时 $\sin^{n-1}0=0$（因 $n-1\ge1$）。所以边界项为 0。用 $\cos^2x=1-\sin^2x$：</p>
$$W_n=(n-1)\int_0^{\pi/2}\bigl(\sin^{n-2}x-\sin^nx\bigr)dx=(n-1)(W_{n-2}-W_n).$$
<p>移项：$W_n+(n-1)W_n=(n-1)W_{n-2}$，即 $nW_n=(n-1)W_{n-2}$，<b>$W_n=\frac{n-1}nW_{n-2}$（$n\ge2$）</b>。</p>
<p><b>计算</b>：初值 $W_0=\frac\pi2$，$W_1=1$。</p>
$$W_2=\frac12W_0=\frac\pi4,\quad W_4=\frac34W_2=\frac{3\pi}{16};\qquad W_3=\frac23W_1=\frac23,\quad W_5=\frac45W_3=\frac8{15}.$$
<p><b>答案：$W_4=\frac{3\pi}{16}$，$W_5=\frac8{15}$。</b>自检：$W_4\approx0.589$，$W_5\approx0.533$，符合“$n$ 越大积分越小”。</p>`
    },
    {
      id: R`i2-p2`,
      lv: R`真题`,
      src: R`2023 秋期末 3(1)(2)`,
      stmt: R`<p>对正整数 $n$ 定义 $a_n=\int_0^1x^n\sqrt{1-x^2}\,dx$。</p><p>(1) 证明 $n\ge2$ 时 $a_n=\frac{n-1}{n+2}a_{n-2}$。</p><p>(2) 求 $\lim_{n\to\infty}a_n/a_{n-1}$。原题给出 Stirling 公式，也允许不使用它；这里用夹逼完成。</p>`,

        R`由 $W_{n+2}=\frac{n+1}{n+2}W_n$ 得 $a_n=\frac{W_n}{n+2}$，同理 $a_{n-2}=\frac{W_{n-2}}{n}$。两式相除，再用 $\frac{W_n}{W_{n-2}}=\frac{n-1}n$。`,
        R`(2) $0\le x\le1$ 时 $x^n\le x^{n-1}\le x^{n-2}$，所以 $0\lt a_n\le a_{n-1}\le a_{n-2}$，从而 $\frac{n-1}{n+2}=\frac{a_n}{a_{n-2}}\le\frac{a_n}{a_{n-1}}\le1$。`
      ],
      method: R`m-integral-ratio`,
      sol: R`<p><b>(1)</b> 对 $n\ge0$ 都用同一积分定义 $a_n$（包括 $a_0$）。令 $x=\sin t$，$t\in[0,\frac\pi2]$，则 $dx=\cos t\,dt$，$\sqrt{1-x^2}=\cos t$（因 $\cos t\ge0$）：</p>
$$a_n=\int_0^{\pi/2}\sin^nt\cos^2t\,dt=\int_0^{\pi/2}\sin^nt\,dt-\int_0^{\pi/2}\sin^{n+2}t\,dt=W_n-W_{n+2}.$$
<p>由 Wallis 递推 $W_{n+2}=\frac{n+1}{n+2}W_n$，得 $a_n=W_n\cdot\frac1{n+2}$。对 $n\ge2$，同理 $a_{n-2}=\frac{W_{n-2}}{n}$。所以</p>
$$\frac{a_n}{a_{n-2}}=\frac{W_n/(n+2)}{W_{n-2}/n}=\frac{n}{n+2}\cdot\frac{W_n}{W_{n-2}}=\frac{n}{n+2}\cdot\frac{n-1}{n}=\frac{n-1}{n+2}.$$
<p>即 <b>$a_n=\frac{n-1}{n+2}a_{n-2}$（$n\ge2$）</b>。</p>
<p><b>(2)</b> 当 $0\le x\le1$ 时 $x^n\le x^{n-1}\le x^{n-2}$，两边乘 $\sqrt{1-x^2}\ge0$ 并积分，且积分为正（被积函数在 $(0,1)$ 上为正且连续），得 $0\lt a_n\le a_{n-1}\le a_{n-2}$。因此</p>
$$\frac{n-1}{n+2}=\frac{a_n}{a_{n-2}}\le\frac{a_n}{a_{n-1}}\le\frac{a_n}{a_n}=1.$$
<p>$\lim_{n\to\infty}\frac{n-1}{n+2}=1$，由夹逼定理，<b>$\lim_{n\to\infty}\frac{a_n}{a_{n-1}}=1$</b>。</p>`
    },

      id: R`i2-p3`,
      lv: R`真题`,
      src: R`2022 秋期末 6(1)`,
      stmt: R`对非负整数 $n$，计算 $\displaystyle I_n=\int_{-1}^1x^n\sqrt{1-x^2}\,dx$。`,
      hints: [

      ],
      method: R`m-wallis`,
      sol: R`<p>记 $f(x)=x^n\sqrt{1-x^2}$，则 $f(-x)=(-1)^nf(x)$。</p>
<p><b>$n$ 为奇数</b>：$f$ 是奇函数，在对称区间上积分为 0，$I_n=0$。</p>
<p><b>$n=2m$ 为偶数</b>：$f$ 是偶函数，$I_{2m}=2\int_0^1x^{2m}\sqrt{1-x^2}\,dx=2a_{2m}$。由讲解第 2 节 $a_n=\frac{W_n}{n+2}$：</p>
$$I_{2m}=\frac{2W_{2m}}{2m+2}=\frac{W_{2m}}{m+1}=\frac{\pi}{2(m+1)}\cdot\frac{(2m-1)!!}{(2m)!!}=\frac{\pi}{2(m+1)}\cdot\frac{\binom{2m}{m}}{4^m}.$$
<p>（最后一步用 $\frac{(2m-1)!!}{(2m)!!}=\frac{(2m)!}{((2m)!!)^2}=\frac{(2m)!}{4^m(m!)^2}$。）</p>
<p><b>答案：$n$ 奇时 $I_n=0$；$n=2m$ 时 $I_{2m}=\dfrac{\pi}{2(m+1)}\cdot\dfrac{(2m-1)!!}{(2m)!!}$</b>（约定 $(-1)!!=0!!=1$）。</p>
<p>自检：$I_0=\frac\pi2$（单位圆上半部分面积）；$I_2=\frac{\pi}{4}\cdot\frac12=\frac\pi8$；$I_4=\frac\pi6\cdot\frac38=\frac\pi{16}$。</p>`

<p><b>第二式</b>：令 $x=\sin t$，$t\in[0,\frac\pi2]$，$\sqrt{1-x^2}=\cos t$，$dx=\cos t\,dt$，端点 $0\mapsto0$，$1\mapsto\frac\pi2$：$$\int_0^1x^6\sqrt{1-x^2}\,dx=\int_0^{\pi/2}\sin^6t\cos t\cdot\cos t\,dt,$$ 正好是第一式。</p>
<p><b>答案：两者都等于 $\frac{5\pi}{256}$</b>，因为第二式经 $x=\sin t$ 就变成第一式（它就是 $a_6=\frac{W_6}{8}$）。</p>`

      hints: [
        R`奇数项 $I_{2m+1}=0$，部分和只需算 $\sum_{m=0}^NI_{2m}$。有限项求和可以放进积分号：$\sum_{m=0}^Nx^{2m}=\frac{1-x^{2N+2}}{1-x^2}$（等比数列求和）。`,
        R`于是 $\sum_{m=0}^NI_{2m}=\int_{-1}^1\frac{1-x^{2N+2}}{\sqrt{1-x^2}}dx$（因 $\frac{\sqrt{1-x^2}}{1-x^2}=\frac1{\sqrt{1-x^2}}$）。令 $x=\sin t$ 得 $\pi-2W_{2N+2}$。`,
        R`证明 $W_k\to0$：取 $0\lt\delta\lt\frac\pi2$，在 $[0,\frac\pi2-\delta]$ 上 $\sin x\le\cos\delta$，积分 $\le\frac\pi2(\cos\delta)^k$；最后一段长 $\delta$，积分 $\le\delta$。`

      method: R`m-wallis`,
      sol: R`<p><b>第 1 步：只看偶数项</b>。$I_{2m+1}=0$，所以级数的部分和就是 $S_N=\sum_{m=0}^NI_{2m}$（加上若干个 0）。</p>
<p><b>第 2 步：有限和放进积分</b>。有限项求和与积分可以交换（线性性）。用等比求和 $\sum_{m=0}^Nx^{2m}=\frac{1-x^{2N+2}}{1-x^2}$（$|x|\lt1$）：</p>
$$S_N=\int_{-1}^1\sqrt{1-x^2}\sum_{m=0}^Nx^{2m}\,dx=\int_{-1}^1\frac{1-x^{2N+2}}{\sqrt{1-x^2}}\,dx.$$
<p>右边在 $x=\pm1$ 处分母为 0，按瑕积分理解：拆成 $\int\frac{dx}{\sqrt{1-x^2}}-\int\frac{x^{2N+2}}{\sqrt{1-x^2}}dx$，两部分都收敛（可先在 $[-r,r]$ 上算再令 $r\to1^-$）。</p>
<p><b>第 3 步：换元</b>。令 $x=\sin t$，$t\in[-\frac\pi2,\frac\pi2]$，$\frac{dx}{\sqrt{1-x^2}}=dt$：</p>
$$S_N=\int_{-\pi/2}^{\pi/2}\bigl(1-\sin^{2N+2}t\bigr)dt=\pi-2W_{2N+2}.$$
<p>（$\sin^{2N+2}t$ 是偶函数，在 $[-\frac\pi2,\frac\pi2]$ 上的积分 $=2W_{2N+2}$。）</p>
<p><b>第 4 步：证 $W_k\to0$</b>。任取 $\delta\in(0,\frac\pi2)$。在 $[0,\frac\pi2-\delta]$ 上 $0\le\sin x\le\sin(\frac\pi2-\delta)=\cos\delta\lt1$；在 $[\frac\pi2-\delta,\frac\pi2]$ 上 $\sin x\le1$。所以 $$0\le W_k\le\frac\pi2(\cos\delta)^k+\delta.$$ 令 $k\to\infty$ 得 $\limsup W_k\le\delta$；$\delta$ 任意，故 $W_k\to0$。</p>
<p><b>结论</b>：$S_N=\pi-2W_{2N+2}\to\pi$，<b>$\sum_{n=0}^\infty I_n=\pi$</b>。整个过程先算有限和再取极限，没有直接交换“无穷和”与积分。</p>`
    }

      html: R`
      <p>前两课分别练了换元、分部和递推。考场上难的往往不是计算，而是<b>第一步选哪条路</b>。按下面的顺序过一遍：</p>
      <ul>
        <li><b>复合函数且旁边有内层导数</b> → 凑微分。例：$\frac{x}{1+x^4}=\frac12\cdot\frac{(x^2)'}{1+(x^2)^2}$。</li>
        <li><b>根式</b> $\sqrt{a^2-x^2}$、$\sqrt{(x-p)(q-x)}$ → 先配方，再令 $x-\frac{p+q}2=-\frac{q-p}2\cos\theta$ 之类的三角代换，根号变成 $\sin\theta$。</li>
        <li><b>多项式乘 $e^x,\sin x$，或含 $\ln x,\arctan x$</b> → 分部：求导变简单的当 $u$。</li>

        <li><b>题目给出“$F$ 是 $f$ 的原函数”而要积 $f'$</b> → 分部，把导数推回去：$\int xf'(x)\,dx=xf(x)-\int f(x)\,dx$。</li>
        <li><b>对称区间或 $[0,\pi]$</b> → 先试奇偶性、区间再现 $x\mapsto a+b-x$，常能消掉难缠的因子。</li>
        <li><b>带参数 $n$ 的一族积分</b> → 递推（上一课）。</li>
      </ul>
      <p>算完必做三项<b>自检</b>：不定积分求导还原；定积分看符号和粗略大小（被积函数的上下界乘区间长）；检查原函数在整个区间上是否连续。</p>`
