      sol: R`<p><b>方法一（Taylor）</b>：$e^{-t^2}=1-t^2+r(t)$，$r(t)=o(t^2)$。对任意 $\varepsilon>0$，$t$ 充分小时 $|r(t)|\le\varepsilon t^2$，于是 $\left|\int_0^x r(t)\,dt\right|\le\frac{\varepsilon x^3}{3}$，即 $\int_0^x r=o(x^3)$。故分子 $=-\frac{x^3}{3}+o(x^3)$，分母 $=-\frac{x^3}{6}+o(x^3)$，极限为 $2$。</p>
      <p><b>方法二（洛必达）</b>：分子分母在 $0$ 处都趋于 $0$，求导得 $\lim\frac{e^{-x^2}-1}{\cos x-1}=\lim\frac{-x^2}{-x^2/2}=2$。</p>` },
    { id: "t2-p3", lv: "真题", src: "2023 秋期末 2(2)", stmt: R`求 $f(x)=\ln(1+x)-\sin x$ 在 $x=0$ 处带 Peano 余项的 Taylor 公式，余项为 $o(x^3)$。`,
      hints: [R`两项分别展开到 $x^3$。`, R`$\ln(1+x)=x-\frac{x^2}{2}+\frac{x^3}{3}+o(x^3)$。`, R`$\sin x=x-\frac{x^3}{6}+o(x^3)$，相减。`],
      method: "m-limit", sol: R`$$f(x)=-\frac{x^2}{2}+\Big(\frac13+\frac16\Big)x^3+o(x^3)=-\frac{x^2}{2}+\frac{x^3}{2}+o(x^3).$$` },
    { id: "t2-p4", lv: "真题", src: "2025 秋期中 1(1)", stmt: R`计算 $\displaystyle\lim_{x\to0}\left(\frac{\ln(1+x)}{x}\right)^{\frac{1}{e^x-1}}$。`,
      hints: [R`$1^\infty$ 型：先取对数。`, R`$K=\lim\frac{\ln\left(\frac{\ln(1+x)}{x}\right)}{e^x-1}$，分母 $\sim x$，分子展开到一阶。`, R`$\frac{\ln(1+x)}{x}=1-\frac x2+o(x)$，再用 $\ln(1+u)=u+o(u)$。`],
      method: "m-limit", sol: R`<p>$\frac{\ln(1+x)}{x}=1-\frac x2+o(x)$，所以 $\ln\frac{\ln(1+x)}{x}=-\frac x2+o(x)$；又 $e^x-1=x+o(x)$，故 $K=-\frac12$。</p><p>由 $e^u$ 的连续性，原极限 $=e^{-1/2}$。</p>` },
    { id: "t2-p5", lv: "真题", src: "2026 秋期中 5(1)（本学期）", stmt: R`已知 $f(0)=0$，$f(1)=1$，$f'(0)=\lambda$，且 $f'$ 连续。求 $\displaystyle\lim_{x\to0^+}\frac{e^{f(x)}-1-f(x)}{e^x-1-x}$。`,
      hints: [R`分子分母结构一样：都是 $e^{u}-1-u$。`, R`$e^u-1-u=\frac{u^2}{2}+o(u^2)\ (u\to0)$。分子里 $u=f(x)\to0$。`, R`把分子、分母都除以 $x^2$：分子变成 $\left(\frac{f(x)}{x}\right)^2\cdot\big(\frac12+o(1)\big)$，而 $\frac{f(x)}{x}\to\lambda$。注意 $\lambda=0$ 时也要成立。`],
      method: "m-limit",
      sol: R`<p>记 $\varphi(u)=\frac{e^u-1-u}{u^2}\ (u\ne0)$，$\varphi(0)=\frac12$，则 $\varphi$ 在 $0$ 处连续，且 $e^u-1-u=u^2\varphi(u)$ 对所有 $u$ 成立（$u=0$ 时两边都是 $0$）。</p>
      <p>于是 $$\frac{e^{f(x)}-1-f(x)}{e^x-1-x}=\frac{f(x)^2\,\varphi(f(x))}{x^2\,\varphi(x)}=\Big(\frac{f(x)}{x}\Big)^2\frac{\varphi(f(x))}{\varphi(x)}.$$</p>
      <p>$f$ 可导 ⇒ $f(x)\to0$，$\frac{f(x)}{x}\to f'(0)=\lambda$；$\varphi$ 连续 ⇒ $\varphi(f(x))\to\frac12$。故极限 $=\lambda^2$。（这样写对 $\lambda=0$ 也成立，不需要分类。）</p>` },
    { id: "t2-p6", lv: "真题", src: "2025 秋期末 5(1)", stmt: R`设 $f:\mathbb R\to\mathbb R$ 处处有 3 阶导数，$f(0)=0$。求实数 $a$，使 $g(x)=\begin{cases}\frac{f(x)}{x},&x\ne0\\ a,&x=0\end{cases}$ 在 $\mathbb R$ 上连续，并求 $g''(0)$。`,
      hints: [R`连续性：$a=\lim_{x\to0}\frac{f(x)}{x}$，这是哪个导数的定义？`, R`$g'(0)$ 用定义：$\lim\frac{f(x)/x-f'(0)}{x}=\lim\frac{f(x)-f'(0)x}{x^2}$，用二阶 Peano 展开。$x\ne0$ 时 $g'(x)=\frac{xf'(x)-f(x)}{x^2}$。`, R`$g''(0)=\lim\frac{g'(x)-g'(0)}{x}=\lim\frac{xf'(x)-f(x)-\frac{f''(0)}2x^2}{x^3}$。把 $f$ 展开到 $x^3$、$f'$ 展开到 $x^2$。`],
      method: "m-exist",
      sol: R`<p>(1) $a=\lim_{x\to0}\frac{f(x)-f(0)}{x}=f'(0)$；$x\ne0$ 处 $g$ 显然连续。</p>
      <p>(2) Peano 展开：$f(x)=f'(0)x+\frac{f''(0)}2x^2+\frac{f'''(0)}6x^3+o(x^3)$；$f'$ 在 $0$ 处有 2 阶导数，故 $f'(x)=f'(0)+f''(0)x+\frac{f'''(0)}2x^2+o(x^2)$。</p>
      <p>$g'(0)=\lim\frac{f(x)-f'(0)x}{x^2}=\frac{f''(0)}2$。$x\ne0$ 时 $g'(x)=\frac{xf'(x)-f(x)}{x^2}$，而 $$xf'(x)-f(x)=\frac{f''(0)}2x^2+\Big(\frac12-\frac16\Big)f'''(0)x^3+o(x^3).$$</p>
      <p>所以 $g''(0)=\lim\frac{g'(x)-\frac{f''(0)}2}{x}=\lim\frac{\frac{f'''(0)}3x^3+o(x^3)}{x^3}=\frac{f'''(0)}3$。</p>
      <p class="small muted">验算：$g(x)=f'(0)+\frac{f''(0)}2x+\frac{f'''(0)}6x^2+o(x^2)$，读系数得 $2\cdot\frac{f'''(0)}6=\frac{f'''(0)}3$，一致。但这一步本身不能当证明，因为没先说明 $g''(0)$ 存在。</p>` }
  ],
  variants: [
    { id: "t2-v1", lv: "变种", src: "仿 2023 期末 2(1)", stmt: R`求 $\displaystyle\lim_{x\to0}\frac{\cos x-e^{-x^2/2}}{x^4}$。`,
      hints: [R`分母 $x^4$，两项都展开到 $x^4$。`, R`$\cos x=1-\frac{x^2}2+\frac{x^4}{24}+o(x^4)$；$e^{u}$ 中 $u=-\frac{x^2}2$，展开到 $u^2$。`, R`$e^{-x^2/2}=1-\frac{x^2}2+\frac{x^4}8+o(x^4)$。`],

    { id: "t2-v2", lv: "变种", src: "仿 2026 期中 5(1)", stmt: R`设 $f(0)=0$，$f'(0)=\lambda$。求 $\displaystyle\lim_{x\to0}\frac{\ln(1+f(x))-f(x)}{\ln(1+x)-x}$。`,

      method: "m-limit", sol: R`令 $\psi(u)=\frac{\ln(1+u)-u}{u^2}$，$\psi(0)=-\frac12$。原式 $=\big(\frac{f(x)}x\big)^2\frac{\psi(f(x))}{\psi(x)}\to\lambda^2\cdot\frac{-1/2}{-1/2}=\lambda^2$。` },
    { id: "t2-v3", lv: "变种", src: "2022 秋期末 4(1)", stmt: R`求 $f(x)=\tan x$ 在 $x=\frac\pi4$ 处带 Peano 余项的 Taylor 公式，展开到二阶。`,

      method: "m-which", sol: R`$f(\frac\pi4)=1$，$f'(\frac\pi4)=2$，$f''(\frac\pi4)=4$，故 $$\tan x=1+2\Big(x-\frac\pi4\Big)+2\Big(x-\frac\pi4\Big)^2+o\Big(\big(x-\tfrac\pi4\big)^2\Big).$$` }
  ],

      hints: [R`令 $t=\frac1x\to0^+$。`, R`原式 $=\frac{t-\ln(1+t)}{t^2}$。`, R`$\ln(1+t)=t-\frac{t^2}2+o(t^2)$。`],
      method: "m-limit", sol: R`令 $t=\frac1x$，原式 $=\lim_{t\to0^+}\frac{t-\ln(1+t)}{t^2}=\lim\frac{\frac{t^2}2+o(t^2)}{t^2}=\frac12$。` },
    { id: "t2-e2", lv: "延伸", src: "2023 秋期末 2(3)，预告反常积分单元", stmt: R`判断 $\displaystyle\int_1^{+\infty}\Big(\ln\Big(1+\frac1x\Big)-\sin\frac1x\Big)dx$ 的敛散性。`,
      hints: [R`被积函数在 $[1,+\infty)$ 上连续，只需看 $x\to+\infty$。`, R`令 $t=\frac1x$，把 $\ln(1+t)-\sin t$ 展开到第一个非零项。`, R`被积函数 $=-\frac{1}{2x^2}+o\big(\frac1{x^2}\big)$，和 $\frac1{x^2}$ 比较。`],
      method: "m-limit", sol: R`<p>$t\to0$ 时 $\ln(1+t)-\sin t=-\frac{t^2}2+o(t^2)$，所以 $x\to+\infty$ 时被积函数 $h(x)=-\frac1{2x^2}+o\big(\frac1{x^2}\big)$。</p><p>于是存在 $X$，当 $x>X$ 时 $|h(x)|\le\frac1{x^2}$。$\int_1^{\infty}\frac{dx}{x^2}$ 收敛，由比较判别法原积分（绝对）收敛。</p><p class="small muted">这就是 Taylor 在反常积分里的用法：先判阶，再比较。</p>` }

t3: {
  unit: "taylor", n: 3, title: "Lagrange 余项：证明题与误差估计",
  goal: "学会“选展开点 → 代入已知点 → 相加或相减 → 介值定理或取最大值”这套证明模板，能独立写完期末第 5 题这一类。",
  sections: [
    { id: "t3-s1", h: R`1. $\xi$ 到底在哪里？`, html: R`
      <p>Lagrange 余项说：对固定的 $x$，存在 $\xi$ 介于 $x_0$ 和 $x$ 之间，使 $f(x)=T_n(x)+\frac{f^{(n+1)}(\xi)}{(n+1)!}(x-x_0)^{n+1}$。下面以 $f=e^x$、$x_0=0$ 为例，把这个 $\xi$ 真的算出来（$e^\xi=\frac{(n+1)!\,R_n(x)}{x^{n+1}}$）。</p>
      <p>拖动 $x$ 和 $n$：$\xi$ 一直落在 $0$ 与 $x$ 之间，并且随 $x$ 移动。还能看到一个有趣的事实：$x\to0$ 时比值 $\theta=\xi/x\to\frac1{n+2}$。</p>` },
    { id: "t3-s2", h: "2. 证明题的套路", html: R`
      <p>期末的 Taylor 证明题几乎都长这样：给你 $f$ 在几个点的值或导数，要你证“存在 $\xi$ 使 $|f''(\xi)|\ge$ 某个数”或“$f''(\xi)=$ 某个式子”。思路固定：</p>
      <ol>
        <li><b>选展开中心</b>：选导数信息最多的点（已知 $f'=0$ 的点、极值点、对称中心）。中心处的 $f'$ 已知，展开式里就少一个未知数。</li>
        <li><b>选代入点</b>：选函数值已知的点（端点、题目给的点），对每个点各写一个 Lagrange 展开，得到不同的 $\xi_1,\xi_2$。</li>
        <li><b>消元</b>：两式相加消掉 $f'$（对称点 $\pm a$），或相减消掉 $f$（同一个点从两边展开）。</li>
        <li><b>收尾</b>：要等式 → $f''$ 连续时用介值定理（$\frac{f''(\xi_1)+f''(\xi_2)}2$ 介于两者之间）；要不等式 → 取 $\max\{|f''(\xi_1)|,|f''(\xi_2)|\}$。</li>
      </ol>
      <p class="callout warn">常见扣分点：介值定理要在<b>自变量区间</b>上使用，不能在函数值区间上用。收尾时要说清楚：$f''$ 在 $[\xi_1,\xi_2]$ 上连续，而 $\frac{f''(\xi_1)+f''(\xi_2)}2$ 介于 $f''(\xi_1)$ 与 $f''(\xi_2)$ 之间，所以存在 $\xi\in[\xi_1,\xi_2]$。</p>` }
  ],
  widget: "lagrangeXi",
  concepts: [
    { id: "t3-c1", sec: "t3-s2", q: R`已知 $f(0)=0$，要证 $\exists\xi$ 使 $f''(\xi)=\frac{f(a)+f(-a)}{a^2}$。展开中心和代入点应选：`,
      opts: [R`中心 $a$，代入 $-a$`, R`中心 $0$，代入 $a$ 和 $-a$`, R`中心 $-a$，代入 $0$`, R`中心 $\frac a2$，代入 $0$`], a: 1,
      ex: R`$f(0)$ 已知，$\pm a$ 对称：两式相加正好消掉 $f'(0)$。` },
    { id: "t3-c2", sec: "t3-s2", q: R`得到 $f(a)+f(-a)=\frac{a^2}2\big(f''(\xi_1)+f''(\xi_2)\big)$ 后，要得到单个 $\xi$，还需要：`,
      opts: [R`什么都不需要`, R`$f''$ 连续，然后用介值定理`, R`$f'''$ 存在`, R`$\xi_1=\xi_2$`], a: 1,
      ex: R`导函数也有介值性（Darboux 定理），所以其实只要 $f''$ 存在就行；但考试里题目一般给“二阶导数连续”，直接用连续函数的介值定理最稳妥。` },
    { id: "t3-c3", sec: "t3-s1", q: R`用 $e=\sum_{k=0}^n\frac1{k!}+\frac{e^\theta}{(n+1)!}$（$0\lt\theta\lt1$）估计误差，为什么常用 $e^\theta\lt3$？`,
      opts: [R`因为 $e\lt3$ 且 $e^\theta\lt e$`, R`因为 $\theta\lt1$ 时 $e^\theta\lt1$`, R`因为 Lagrange 余项总小于 3`, R`为了凑整`], a: 0,
      ex: R`$0\lt\theta\lt1$，所以 $e^\theta\lt e\lt3$。估计时要用已知的上界，不能用正在估计的量 $e$ 的精确值。` }
  ],
  methods: [
    { id: "m-proof", title: "Lagrange 证明四步法", steps: [
      R`<b>选中心</b>：导数信息最多的点（$f'(x_0)=0$、极值点、对称中心）。`,
      R`<b>选代入点</b>：函数值已知的点，每个点写一个展开式，得到 $\xi_1,\xi_2$。`,
      R`<b>消元</b>：对称点相加消 $f'$，同一点两侧展开相减消 $f$。`,
      R`<b>收尾</b>：等式用介值定理（写明 $f''$ 连续及区间）；不等式取 $\max|f''(\xi_i)|$。`] },
    { id: "m-err", title: "误差估计", steps: [
      R`写出 $R_n=\frac{f^{(n+1)}(\xi)}{(n+1)!}x^{n+1}$，用已知量给 $|f^{(n+1)}|$ 一个上界 $M$。`,
      R`解不等式 $\frac{M|x|^{n+1}}{(n+1)!}\lt$ 允许误差，求最小的 $n$。`,
      R`不要用被估计的量本身做上界（如估计 $e$ 时用 $e^\theta\lt3$）。`] }
  ],
  problems: [
    { id: "t3-p1", lv: "基础", src: "作业 11/2", stmt: R`用 $e^x$ 在 $0$ 处的 Taylor 公式近似计算 $e$，使误差小于 $10^{-5}$。至少要取到哪一项？`,
      hints: [R`$e=\sum_{k=0}^n\frac1{k!}+\frac{e^\theta}{(n+1)!}$，$0\lt\theta\lt1$。`, R`误差 $\lt\frac3{(n+1)!}$，要它 $\lt10^{-5}$。`, R`$(n+1)!\gt3\times10^5$，查阶乘表：$8!=40320$，$9!=362880$。`],
      method: "m-err", sol: R`<p>误差 $=\frac{e^\theta}{(n+1)!}\lt\frac{3}{(n+1)!}$。要 $\frac3{(n+1)!}\lt10^{-5}$，即 $(n+1)!\gt3\times10^5$，最小取 $n+1=9$，$n=8$。</p><p>$\sum_{k=0}^{8}\frac1{k!}\approx2.7182788$，与 $e=2.7182818\ldots$ 相差约 $3\times10^{-6}$。</p>` },
    { id: "t3-p2", lv: "真题", src: "2023 秋期末 5(1)", stmt: R`设 $f$ 在 $[-a,a]$ 上有连续的二阶导数，$f(0)=0$。证明：存在 $\xi\in(-a,a)$，使 $f''(\xi)=\frac{f(a)+f(-a)}{a^2}$。`,
      hints: [R`中心选 $0$，代入 $\pm a$。`, R`$f(\pm a)=\pm f'(0)a+\frac{f''(\xi_{1,2})}2a^2$，$\xi_1\in(0,a)$，$\xi_2\in(-a,0)$。`, R`相加得 $\frac{f(a)+f(-a)}{a^2}=\frac{f''(\xi_1)+f''(\xi_2)}2$，再用介值定理。`],
      method: "m-proof", sol: R`<p>在 $0$ 处带 Lagrange 余项展开：存在 $\xi_1\in(0,a)$，$\xi_2\in(-a,0)$，使 $$f(a)=f'(0)a+\frac{f''(\xi_1)}2a^2,\qquad f(-a)=-f'(0)a+\frac{f''(\xi_2)}2a^2.$$</p><p>相加：$\frac{f(a)+f(-a)}{a^2}=\frac{f''(\xi_1)+f''(\xi_2)}2$。</p><p>右边介于 $f''(\xi_2)$ 与 $f''(\xi_1)$ 之间，而 $f''$ 在闭区间 $[\xi_2,\xi_1]$ 上连续，由介值定理存在 $\xi\in[\xi_2,\xi_1]\subset(-a,a)$ 使 $f''(\xi)=\frac{f(a)+f(-a)}{a^2}$。</p>` },
    { id: "t3-p3", lv: "真题", src: "2023 秋期末 5(2)", stmt: R`设 $f$ 在 $[-a,a]$ 上有连续的二阶导数，且在 $(-a,a)$ 内有极值点。证明：存在 $\eta\in(-a,a)$，使 $|f''(\eta)|\ge\frac1{2a^2}|f(a)-f(-a)|$。`,
      hints: [R`极值点 $x_0$ 处 $f'(x_0)=0$（Fermat），所以中心选 $x_0$。`, R`分别代入 $a$ 和 $-a$，两式相减消掉 $f(x_0)$。`, R`$(a-x_0)^2+(a+x_0)^2=2a^2+2x_0^2\le4a^2$。`],
      method: "m-proof", sol: R`<p>设极值点为 $x_0\in(-a,a)$，由 Fermat 定理 $f'(x_0)=0$。在 $x_0$ 处展开：存在 $\eta_1,\eta_2\in(-a,a)$，$$f(a)=f(x_0)+\frac{f''(\eta_1)}2(a-x_0)^2,\quad f(-a)=f(x_0)+\frac{f''(\eta_2)}2(a+x_0)^2.$$</p><p>记 $M=\max\{|f''(\eta_1)|,|f''(\eta_2)|\}$，相减得 $$|f(a)-f(-a)|\le\frac M2\big[(a-x_0)^2+(a+x_0)^2\big]=\frac M2(2a^2+2x_0^2)\le2a^2M.$$</p><p>取 $\eta$ 为 $\eta_1,\eta_2$ 中使 $|f''|$ 较大的那个即可。</p>` },
    { id: "t3-p4", lv: "真题", src: "2025 秋期末 5(2)", stmt: R`设 $h:\mathbb R\to\mathbb R$ 处处有 2 阶导数，$h(0)=h'(0)=h'(1)=0$，$h(1)=1$。证明：存在 $\xi\in[0,1]$，使 $|h''(\xi)|\ge4$。`,
      hints: [R`$0$ 和 $1$ 两点的导数都已知，分别以它们为中心。`, R`代入哪个点？选两边“一样远”的中点 $\frac12$。`, R`$h(\frac12)=\frac{h''(\xi_1)}8$，$h(\frac12)=1+\frac{h''(\xi_2)}8$，相减。`],
      method: "m-proof", sol: R`<p>分别在 $0$ 和 $1$ 处展开并代入 $x=\frac12$：存在 $\xi_1\in(0,\frac12)$，$\xi_2\in(\frac12,1)$，$$h\Big(\frac12\Big)=h(0)+h'(0)\cdot\frac12+\frac{h''(\xi_1)}2\cdot\frac14=\frac{h''(\xi_1)}8,$$ $$h\Big(\frac12\Big)=h(1)-h'(1)\cdot\frac12+\frac{h''(\xi_2)}2\cdot\frac14=1+\frac{h''(\xi_2)}8.$$</p><p>相减：$h''(\xi_1)-h''(\xi_2)=8$，所以 $|h''(\xi_1)|+|h''(\xi_2)|\ge8$，二者中至少一个 $\ge4$。</p><p class="small muted">注意这里只要求 $h''$ 存在，不需要连续：不等式结论不用介值定理。</p>` },
    { id: "t3-p5", lv: "真题", src: "2021 秋期末 7(2)", stmt: R`设 $f$ 是 $\mathbb R$ 上的 $C^2$ 函数，$f(x)\ge0$，$f(0)=f'(0)=0$。给定 $h\gt0$，令 $M=\max_{x\in[-2h,2h]}|f''(x)|$。证明：对 $x\in[-h,h]$，有 $f'(x)^2\le2Mf(x)$。`,

      method: "m-proof", sol: R`<p>固定 $x\in[-h,h]$。若 $M=0$，则 $f''\equiv0$ 于 $[-2h,2h]$，$f'(x)=f'(0)=0$，结论成立。下设 $M\gt0$。</p><p>对 $|t|\le h$ 有 $x+t\in[-2h,2h]$，由 Lagrange 余项与 $f\ge0$：$$0\le f(x+t)=f(x)+f'(x)t+\frac{f''(\xi)}2t^2\le f(x)+f'(x)t+\frac M2t^2.$$</p><p>由中值定理 $|f'(x)|=|f'(x)-f'(0)|\le M|x|\le Mh$，故 $t_0=-\frac{f'(x)}M$ 满足 $|t_0|\le h$。代入得 $0\le f(x)-\frac{f'(x)^2}{2M}$，即 $f'(x)^2\le2Mf(x)$。</p>` }

m1: {
  unit: "mvt", n: 1, title: "构造辅助函数：Rolle、Lagrange、Cauchy",
  goal: "看到“存在 $\\xi$ 使某个含 $f,f'$ 的式子成立”，能倒推出该对哪个辅助函数用 Rolle；分清三个中值定理各自管什么。",
  sections: [
    { id: "m1-s1", h: "1. 三个定理其实是一个", html: R`
      <p>三个定理的条件都是“$[a,b]$ 上连续，$(a,b)$ 内可导”，结论里的 $\xi$ 都在<b>开区间</b> $(a,b)$ 里。</p>
      <ul>
        <li><b>Rolle</b>：$f(a)=f(b)$ ⇒ $\exists\xi$，$f'(\xi)=0$。几何上是“有一处切线水平”。</li>
        <li><b>Lagrange</b>：$f'(\xi)=\frac{f(b)-f(a)}{b-a}$。证明就是对 $F(x)=f(x)-\frac{f(b)-f(a)}{b-a}(x-a)$ 用 Rolle，也就是把弦“扳平”。</li>
        <li><b>Cauchy</b>：$\frac{f'(\xi)}{g'(\xi)}=\frac{f(b)-f(a)}{g(b)-g(a)}$（$g'\ne0$）。对 $F=f-kg$ 用 Rolle，$k$ 取弦的斜率。几何上是参数曲线 $(g(t),f(t))$ 有一处切线平行于弦（讲义第 7 周例 8）。</li>
      </ul>
      <p>下图拖动 $a,b$（或直接在图上左右拖），看满足 $f'(\xi)=\frac{f(b)-f(a)}{b-a}$ 的点：可能不止一个，定理只保证至少有一个。</p>` },
    { id: "m1-s2", h: "2. 反推辅助函数：把结论“积回去”", html: R`
      <p>证明题最难的一步是想到对谁用 Rolle。方法：把结论里的 $\xi$ 换成 $x$，看左边是哪个函数的导数（或差一个非零因子）。</p>
      <div class="table-wrap"><table class="pattern"><thead><tr><th>要证 $\exists\xi$ 使……$=0$</th><th>辅助函数 $F(x)$</th><th>因为 $F'(x)=$</th></tr></thead><tbody>
        <tr><td>$f'(\xi)+\lambda f(\xi)$</td><td>$e^{\lambda x}f(x)$</td><td>$e^{\lambda x}\big(f'+\lambda f\big)$</td></tr>
        <tr><td>$f'(\xi)+g'(\xi)f(\xi)$</td><td>$e^{g(x)}f(x)$</td><td>$e^{g}\big(f'+g'f\big)$</td></tr>
        <tr><td>$\xi f'(\xi)+kf(\xi)$</td><td>$x^kf(x)$</td><td>$x^{k-1}\big(xf'+kf\big)$</td></tr>
        <tr><td>$\xi f'(\xi)-f(\xi)$</td><td>$\frac{f(x)}{x}$</td><td>$\frac{xf'-f}{x^2}$</td></tr>
        <tr><td>$f'(\xi)g(\xi)+f(\xi)g'(\xi)$</td><td>$f(x)g(x)$</td><td>$f'g+fg'$</td></tr>
        <tr><td>$f'(\xi)-c$（常数）</td><td>$f(x)-cx$</td><td>$f'-c$</td></tr>
      </tbody></table></div>
      <p>找到 $F$ 后还要检查 $F(a)=F(b)$，这一步通常正好用上题目给的条件。如果结论是“比值等于弦的斜率”，就直接用 Lagrange 或 Cauchy，并把要比较的两个函数选对。2022 秋期中那题选的是 $\frac{f(x)}x$ 和 $\frac1x$。</p>` }
  ],

      hints: [R`$f'+\lambda f$ 是哪个函数的导数除以一个非零因子？`, R`$F(x)=e^{\lambda x}f(x)$，$F'(x)=e^{\lambda x}\big(f'(x)+\lambda f(x)\big)$。`, R`$F(a)=F(b)=0$，对 $F$ 用 Rolle。`],
      method: "m-aux", sol: R`<p>令 $F(x)=e^{\lambda x}f(x)$，则 $F\in C[a,b]$，在 $(a,b)$ 内可导，$F(a)=F(b)=0$。由 Rolle 定理，$\exists\xi\in(a,b)$ 使 $F'(\xi)=e^{\lambda\xi}\big(f'(\xi)+\lambda f(\xi)\big)=0$。因 $e^{\lambda\xi}\ne0$，得 $\lambda f(\xi)+f'(\xi)=0$。</p>` },
    { id: "m1-p2", lv: "真题", src: "2022 秋期中 证明题 2", stmt: R`设 $f$ 在 $[a,b]$ 上连续（$ab\gt0$），在 $(a,b)$ 内可导。证明：存在 $\xi\in(a,b)$，使 $\dfrac{af(b)-bf(a)}{b-a}=\xi f'(\xi)-f(\xi)$。`,

      method: "m-aux", sol: R`<p>令 $F(x)=\frac{f(x)}x$，$G(x)=\frac1x$。由 $ab\gt0$，$0\notin[a,b]$，$F,G$ 在 $[a,b]$ 上连续、$(a,b)$ 内可导，且 $G'(x)=-\frac1{x^2}\ne0$。由 Cauchy 中值定理，$\exists\xi\in(a,b)$：</p>

    { id: "m1-p3", lv: "真题", src: "2023 秋期末 4", stmt: R`设 $f$ 在 $[a,b]$ 上连续，在 $(a,b)$ 内处处可导，$f(b)\gt f(a)$，记 $c=\frac{f(b)-f(a)}{b-a}$。证明下面两个断言必有一个成立：(1) 对任何 $x\in[a,b]$，$f(x)-f(a)=c(x-a)$；(2) 存在 $\xi\in(a,b)$，使 $f'(\xi)\gt c$。`,
      hints: [R`把弦减掉：$g(x)=f(x)-f(a)-c(x-a)$，$g(a)=g(b)=0$。(1) 就是 $g\equiv0$。`, R`若 $g\not\equiv0$，有某点 $x_0$ 使 $g(x_0)\ne0$。分 $g(x_0)\gt0$ 和 $g(x_0)\lt0$ 两种情况。`, R`$g(x_0)\gt0$：在 $[a,x_0]$ 上对 $g$ 用 Lagrange；$g(x_0)\lt0$：在 $[x_0,b]$ 上用。两种情况都得到 $g'(\xi)\gt0$。`],

    { id: "m1-p4", lv: "真题", src: "2025 秋期中 6(2)", stmt: R`设 $f$ 在 $(a,b)$ 上有连续的导函数，$\lim_{x\to a^+}f(x)=+\infty$，$\lim_{x\to b^-}f(x)=-\infty$，且对任何 $x\in(a,b)$，$f'(x)+f^2(x)\ge-1$。证明：$b-a\ge\pi$。`,

    { id: "m1-e1", lv: "延伸", src: "讲义第 7 周例 2(3)：导数介值定理", stmt: R`设 $f$ 在开区间 $I$ 上可导，$a\lt b$ 属于 $I$，$f'(a)\lt\mu\lt f'(b)$。证明：存在 $\xi\in(a,b)$ 使 $f'(\xi)=\mu$。（注意：没有假设 $f'$ 连续。）`,

      method: "m-aux", sol: R`<p>令 $g(x)=f(x)-\mu x$，$g'(a)=f'(a)-\mu\lt0$，$g'(b)\gt0$。$g$ 在 $[a,b]$ 上连续，取到最小值。</p>
      <p>由 $g'(a)=\lim_{x\to a^+}\frac{g(x)-g(a)}{x-a}\lt0$，由极限保号性，存在 $x\gt a$ 使 $g(x)\lt g(a)$，所以 $a$ 不是最小值点；同理由 $g'(b)\gt0$，存在 $x\lt b$ 使 $g(x)\lt g(b)$，$b$ 也不是。</p>
      <p>于是最小值点 $\xi\in(a,b)$，由 Fermat 定理 $g'(\xi)=0$，即 $f'(\xi)=\mu$。</p>
      <p class="small muted">推论：导函数没有第一类间断点（讲义例 7），所以“导函数有跳跃”的函数不存在原函数。</p>` }
  ]
},

    { id: "m2-p2", lv: "真题", src: "2022 秋期中 证明题 5", stmt: R`设 $f$ 在 $[a,b]$ 上二阶可导，$f(a)=f(b)$，$f'_+(a)f'_-(b)\gt0$。证明：存在 $\xi\in(a,b)$，使 $f''(\xi)=0$。`,

      method: "m-roots", sol: R`<p>不妨设 $f'_+(a)\gt0$，$f'_-(b)\gt0$（都小于 $0$ 时对 $-f$ 讨论）。由保号性，存在 $x_1\in(a,b)$ 靠近 $a$ 使 $f(x_1)\gt f(a)$，存在 $x_2\in(x_1,b)$ 靠近 $b$ 使 $f(x_2)\lt f(b)$。</p>
      <p>由 $f(x_1)\gt f(a)=f(b)\gt f(x_2)$ 和介值定理，$\exists c\in(x_1,x_2)$ 使 $f(c)=f(a)=f(b)$。</p>
      <p>在 $[a,c]$、$[c,b]$ 上分别用 Rolle：$\exists\xi_1\in(a,c)$，$\xi_2\in(c,b)$ 使 $f'(\xi_1)=f'(\xi_2)=0$。$f'$ 在 $[\xi_1,\xi_2]$ 上可导，再用 Rolle：$\exists\xi\in(\xi_1,\xi_2)$，$f''(\xi)=0$。</p>` },
    { id: "m2-p3", lv: "真题", src: "2026 秋期中 5(2)（本学期）", stmt: R`已知 $f(0)=0$，$f(1)=1$，$f'$ 连续。证明：存在 $0\lt\xi\lt\eta\lt1$，使 $e^{f(\xi)+f(\eta)}f'(\xi)f'(\eta)\ge(e-1)^2$。`,
      hints: [R`$e^{f(\xi)}f'(\xi)$ 是谁的导数？令 $F=e^{f}$，$F(0)=1$，$F(1)=e$。要证 $F'(\xi)F'(\eta)\ge(e-1)^2$。`, R`切一刀：在 $[0,c]$、$[c,1]$ 上对 $F$ 用 Lagrange。$c$ 按函数值选，让两段 $F$ 的增量相等：$F(c)=\frac{1+e}2$。`, R`得到 $F'(\xi)F'(\eta)=\frac{(e-1)^2/4}{c(1-c)}$，再用 $c(1-c)\le\frac14$。`],
      method: "m-two", sol: R`<p>令 $F(x)=e^{f(x)}$，则 $F$ 在 $[0,1]$ 上可导，$F(0)=1$，$F(1)=e$，$F'(x)=e^{f(x)}f'(x)$。</p>
      <p>$F$ 连续且 $1\lt\frac{1+e}2\lt e$，由介值定理 $\exists c\in(0,1)$ 使 $F(c)=\frac{1+e}2$。在 $[0,c]$ 与 $[c,1]$ 上分别用 Lagrange：$\exists\xi\in(0,c)$，$\eta\in(c,1)$，</p>

      <p>于是 $e^{f(\xi)+f(\eta)}f'(\xi)f'(\eta)=F'(\xi)F'(\eta)=\frac{(e-1)^2}{4c(1-c)}\ge(e-1)^2$，因为 $c(1-c)\le\frac14$。且 $\xi\lt c\lt\eta$。</p>` },
    { id: "m2-p4", lv: "真题", src: "讲义第 7 周例 6", stmt: R`证明 $n$ 次 Legendre 多项式 $\dfrac{d^n}{dx^n}\big[(x^2-1)^n\big]$ 在 $(-1,1)$ 内恰有 $n$ 个不同的实零点。`,
      hints: [R`$P(x)=(x^2-1)^n$ 以 $\pm1$ 为 $n$ 重零点，所以 $k\lt n$ 时 $P^{(k)}(\pm1)=0$。`, R`归纳：设 $P^{(k)}$ 在 $(-1,1)$ 内至少有 $k$ 个不同零点，再加上 $\pm1$，一共 $k+2$ 个，用 Rolle 往下传。`, R`$P^{(n)}$ 在 $(-1,1)$ 内至少 $n$ 个零点，而它是 $n$ 次多项式，至多 $n$ 个。`],
      method: "m-roots", sol: R`<p>令 $P(x)=(x^2-1)^n=(x-1)^n(x+1)^n$，则当 $0\le k\le n-1$ 时 $P^{(k)}(\pm1)=0$。</p>
      <p><b>断言</b>：对 $0\le k\le n$，$P^{(k)}$ 在 $(-1,1)$ 内至少有 $k$ 个不同零点。$k=0$ 显然。设对 $k\lt n$ 成立，零点为 $-1\lt x_1\lt\cdots\lt x_k\lt1$；连同 $\pm1$ 共 $k+2$ 个零点，相邻两点间用 Rolle，得 $P^{(k+1)}$ 在 $(-1,1)$ 内至少 $k+1$ 个不同零点。</p>
      <p>取 $k=n$：$P^{(n)}$ 在 $(-1,1)$ 内至少 $n$ 个不同零点。它是 $n$ 次多项式（首项系数 $\frac{(2n)!}{n!}\ne0$），至多 $n$ 个零点，故恰有 $n$ 个。</p>` }

      method: "m-two", sol: R`<p>由介值定理取 $c\in(0,1)$ 使 $f(c)=\frac12$。在 $[0,c]$、$[c,1]$ 上用 Lagrange：$f'(\xi)=\frac1{2c}$，$f'(\eta)=\frac1{2(1-c)}$，$\xi\lt c\lt\eta$，且二者都不为零。于是 $\frac1{f'(\xi)}+\frac1{f'(\eta)}=2c+2(1-c)=2$。</p>` },
    { id: "m2-v2", lv: "变种", src: "仿 2026 期中 5(2)", stmt: R`条件同上一题。证明：存在 $0\lt\xi\lt\eta\lt1$，使 $f'(\xi)+f'(\eta)=2$。`,

  extensions: [
    { id: "m2-e1", lv: "延伸", src: "2026 秋期中 6（本学期）", stmt: R`称 $x_0$ 为 $f$ 的简单零点，若 $f(x_0)=0$，$f'(x_0)\ne0$。是否存在三阶可微函数 $f:\mathbb R\to\mathbb R$ 同时满足：(a) $f$ 恰有 2 个零点，且都是简单零点；(b) $f'$ 恰有 2 个零点，且都是简单零点；(c) $f''$ 恰有 1 个零点，且是简单零点？若存在，给出构造；若不存在，给出证明。`,
      hints: [R`先试 $x^3-3x+k$：它满足 (b)(c)，但零点数只能是 1 或 3（2 个时是重根）。猜测不存在。`, R`由 (c)，$f''$ 在零点 $c$ 两侧异号且各自不变号，所以 $f'$ 在 $c$ 两侧分别严格单调；不妨设 $f'$ 在 $c$ 左减右增。由 (b)，两个零点 $b_1\lt c\lt b_2$，且 $f'\gt0$ 于 $(-\infty,b_1)\cup(b_2,\infty)$，$f'\lt0$ 于 $(b_1,b_2)$。`, R`看尾部：$x\lt b_1-1$ 时 $f'(x)\ge f'(b_1-1)\gt0$，所以 $f\to-\infty$（$x\to-\infty$）；同理 $f\to+\infty$（$x\to+\infty$）。按 $f(b_1),f(b_2)$ 的符号分情况数零点。`],
      method: "m-roots", sol: R`<p><b>结论：不存在。</b></p>
      <p>设 $c$ 是 $f''$ 唯一的零点，$f'''(c)\ne0$。$f''$ 连续且只在 $c$ 处为零，所以在 $(-\infty,c)$、$(c,\infty)$ 上各自不变号；又 $f'''(c)\ne0$，$f''$ 在 $c$ 两侧异号。必要时把 $f$ 换成 $-f$（不改变 (a)(b)(c)），不妨设 $f''\lt0$ 于 $(-\infty,c)$，$f''\gt0$ 于 $(c,\infty)$：$f'$ 在 $(-\infty,c]$ 严格减，在 $[c,\infty)$ 严格增。</p>
      <p>每一侧 $f'$ 至多一个零点，而 $f'$ 恰有两个零点，所以 $b_1\lt c\lt b_2$，且 $f'(c)\lt f'(b_2)=0$。于是 $f'\gt0$ 于 $(-\infty,b_1)$，$f'\lt0$ 于 $(b_1,b_2)$，$f'\gt0$ 于 $(b_2,\infty)$：$f$ 依次严格增、减、增。</p>
      <p><b>尾部</b>：$x\le b_1-1$ 时 $f'(x)\ge\delta:=f'(b_1-1)\gt0$，故 $f(x)\le f(b_1-1)-\delta(b_1-1-x)\to-\infty$；同理 $x\to+\infty$ 时 $f\to+\infty$。</p>
      <p><b>数零点</b>（每个单调段至多一个）：若 $f(b_1)\gt0$ 且 $f(b_2)\lt0$，三段各有一个零点，共 3 个；若 $f(b_1)\lt0$，则 $f(b_2)\lt f(b_1)\lt0$，只在 $(b_2,\infty)$ 有 1 个；若 $f(b_2)\gt0$，只在 $(-\infty,b_1)$ 有 1 个；若 $f(b_1)=0$ 或 $f(b_2)=0$，该零点处 $f'=0$，不是简单零点。都不可能恰有 2 个简单零点，所以这样的 $f$ 不存在。</p>` }
  ]

c1: {
  unit: "convex", n: 1, title: "凸函数与拐点",
  goal: "会用斜率不等式和切线不等式证明下凸函数的性质，会用二阶导求凹凸区间和拐点。",
  sections: [
    { id: "c1-s1", h: "1. 下凸的定义与斜率不等式", html: R`
      <p>本课程说的<b>下凸</b>（convex）是指图像上任意两点连成的弦都在图像上方：对任何 $x,y$ 和 $t\in[0,1]$，</p>
      $$f\big(tx+(1-t)y\big)\le tf(x)+(1-t)f(y).$$
      <p>考试里更好用的是等价的<b>斜率不等式</b>：任取 $x_1\lt x_2\lt x_3$，记 $k_{ij}=\frac{f(x_j)-f(x_i)}{x_j-x_i}$，则</p>
      $$k_{12}\le k_{13}\le k_{23}.$$
      <p>记法：三点从左到右，“左弦 ≤ 长弦 ≤ 右弦”。下面的图里拖动三个点，可以看到在下凸段上这个不等式总成立，跨过拐点就会被破坏。</p>
      <p>由斜率不等式直接推出的几个结论（证明题常用）：</p>
      <ul>
        <li>固定一个端点，弦斜率随另一端点<b>单调递增</b>：$x\mapsto\frac{f(x)-f(a)}{x-a}$ 在 $x\gt a$、$x\lt a$ 上都递增。</li>
        <li>可导时 $f'$ 单调递增；<b>切线在图像下方</b>：$f(x)\ge f(a)+f'(a)(x-a)$。</li>
        <li>开区间上的下凸函数连续，且处处有单侧导数 $f'_-(x)\le f'_+(x)$（见延伸题）。</li>
      </ul>` },
    { id: "c1-s2", h: "2. 二阶导判别与拐点", html: R`
      <ul>
        <li><b>判别</b>：$f$ 在区间 $I$ 上二阶可导，则 $f$ 在 $I$ 上下凸 $\Leftrightarrow$ $f''\ge0$ 于 $I$。若 $f''\gt0$，则严格下凸（弦严格在上，切线不等式在 $x\ne a$ 时取严格号）。</li>
        <li><b>拐点</b>：凹凸性在 $x_0$ 两侧改变的点 $(x_0,f(x_0))$。</li>
        <li><b>必要条件</b>：$x_0$ 是拐点且 $f''(x_0)$ 存在 ⇒ $f''(x_0)=0$。但反过来不对：$x^4$ 在 $0$ 处 $f''=0$，两侧都下凸，不是拐点。</li>
        <li><b>充分条件</b>：$f''$ 在 $x_0$ 两侧异号；或 $f''(x_0)=0$ 且 $f'''(x_0)\ne0$。</li>
        <li>$f''$ 不存在的点也可能是拐点，例如 $x^{1/3}$ 在 $0$ 处。求拐点要把 $f''=0$ 的点和 $f''$ 不存在的点都列出来，再逐个看两侧符号。</li>
      </ul>
      <p><b>求凹凸区间的格式</b>：算 $f''$ → 化成因式乘积 → 列符号表 → 写“在……上下凸，在……上上凸，拐点为……”。题目问“最大区间”时端点要包含进去（闭区间）。</p>` },
    { id: "c1-s3", h: "3. 常考的三类证明", html: R`
      <ul>
        <li><b>局部即全局</b>（2021 期末 4）：下凸函数的极小值点就是最小值点；可导时驻点就是最小值点。工具是斜率不等式，或切线不等式。</li>
        <li><b>切线不等式</b>（2025 期中 5）：$f''\gt0$ ⇒ $f(x)\gt f(a)+f'(a)(x-a)$。用带 Lagrange 余项的一阶 Taylor 公式一行证完，再用它控制 $f$ 在无穷远处的行为。</li>
        <li><b>和积分平均比较</b>（2023 期末 7）：$f''\ge0$ ⇔ 对任何 $a\lt b$，$f\big(\frac{a+b}2\big)\le\frac1{b-a}\int_a^bf$。必要性：在中点处的切线下方积分；充分性：反证，在 $f''\lt0$ 的小区间上用 Taylor 公式得到反向严格不等式。</li>
        <li><b>Jensen 证不等式</b>：要证的不等式能写成 $f\big(\frac{x+y}2\big)\le\frac{f(x)+f(y)}2$，就找出 $f$ 并验证 $f''\ge0$。</li>
      </ul>` }
  ],

  problems: [
    { id: "c1-p1", lv: "基础", src: "2022 秋期末 2(3)", stmt: R`令 $f(x)=\ln(x^2+1)$，求出使得 $f$ 在其上是下凸函数的最大区间 $I$，并求 $f$ 的拐点。`,
      hints: [R`算到二阶导。`, R`$f'(x)=\frac{2x}{1+x^2}$，用商的求导法则再求一次。`, R`$f''(x)=\frac{2(1-x^2)}{(1+x^2)^2}$，看分子符号。`],
      method: "m-concave", sol: R`<p>$f'(x)=\frac{2x}{1+x^2}$，$f''(x)=\frac{2(1+x^2)-2x\cdot2x}{(1+x^2)^2}=\frac{2(1-x^2)}{(1+x^2)^2}$。</p>
      <p>分母恒正，$f''(x)\ge0\Leftrightarrow|x|\le1$。所以 $f$ 在 $I=[-1,1]$ 上下凸，在 $(-\infty,-1]$ 和 $[1,+\infty)$ 上上凸，最大的下凸区间是 $[-1,1]$。</p>
      <p>$f''$ 在 $x=\pm1$ 两侧异号，拐点为 $(-1,\ln2)$ 和 $(1,\ln2)$。</p>` },
    { id: "c1-p2", lv: "真题", src: "2021 秋期末 4", stmt: R`<p>设 $f$ 是 $\mathbb R$ 上的下凸函数。</p><p>(1) 利用斜率不等式 $k_{12}\le k_{13}\le k_{23}$ 证明：若 $x_0$ 是 $f$ 的极小值点，则 $x_0$ 是 $f$ 在 $\mathbb R$ 上的最小值点。</p><p>(2) 假设 $f$ 处处可导，且 $f'(a)=0$。证明：$a$ 是 $f$ 在 $\mathbb R$ 上的最小值点。</p><p>(3) 假设 $f$ 处处二阶可导，且存在 $m\gt0$ 使得 $f''(x)\ge m$ 对所有 $x$ 成立。证明：$f$ 在 $\mathbb R$ 上有且仅有一个最小值点。</p>`,
      hints: [R`(1) 反证：若某个 $x_1$ 使 $f(x_1)\lt f(x_0)$，在 $x_0$ 和 $x_1$ 之间、离 $x_0$ 很近的地方取一点 $x_2$，用斜率不等式。`, R`(2) 对 $x\gt a$，取 $a\lt t\lt x$，有 $\frac{f(t)-f(a)}{t-a}\le\frac{f(x)-f(a)}{x-a}$，令 $t\to a^+$。$x\lt a$ 时类似。`, R`(3) 存在：对 $f'$ 用 Lagrange，$f'(x)\ge f'(0)+mx$（$x\gt0$），$f'(x)\le f'(0)+mx$（$x\lt0$），再用介值定理找 $f'$ 的零点。唯一：$f'$ 严格递增，加 Fermat 引理。`],
      method: "m-slope", sol: R`<p><b>(1)</b> 设 $|x-x_0|\lt\delta$ 时 $f(x)\ge f(x_0)$。反设存在 $x_1$ 使 $f(x_1)\lt f(x_0)$。</p>
      <p>若 $x_1\gt x_0$：取 $x_2\in(x_0,\min\{x_1,x_0+\delta\})$。对 $x_0\lt x_2\lt x_1$ 用 $k_{12}\le k_{13}$：$\frac{f(x_2)-f(x_0)}{x_2-x_0}\le\frac{f(x_1)-f(x_0)}{x_1-x_0}\lt0$，所以 $f(x_2)\lt f(x_0)$，与极小矛盾。</p>
      <p>若 $x_1\lt x_0$：取 $x_2\in(\max\{x_1,x_0-\delta\},x_0)$。对 $x_1\lt x_2\lt x_0$ 用 $k_{13}\le k_{23}$：$\frac{f(x_0)-f(x_2)}{x_0-x_2}\ge\frac{f(x_0)-f(x_1)}{x_0-x_1}\gt0$，所以 $f(x_2)\lt f(x_0)$，矛盾。</p>
      <p><b>(2)</b> 对 $x\gt a$ 和任意 $t\in(a,x)$，由 $k_{12}\le k_{13}$（三点 $a\lt t\lt x$）：$\frac{f(t)-f(a)}{t-a}\le\frac{f(x)-f(a)}{x-a}$。令 $t\to a^+$，左边 $\to f'(a)=0$，故 $f(x)\ge f(a)$。</p>
      <p>对 $x\lt a$ 和 $t\in(x,a)$，由 $k_{13}\le k_{23}$（三点 $x\lt t\lt a$）：$\frac{f(a)-f(x)}{a-x}\le\frac{f(a)-f(t)}{a-t}$。令 $t\to a^-$，右边 $\to f'(a)=0$，故 $f(x)\ge f(a)$。所以 $a$ 是最小值点。</p>
      <p><b>(3)</b> <b>存在</b>：对 $x\gt0$，在 $[0,x]$ 上对 $f'$ 用 Lagrange：$f'(x)=f'(0)+f''(\theta)x\ge f'(0)+mx$，所以 $x$ 充分大时 $f'(x)\gt0$；同理 $x\lt0$ 时 $f'(x)\le f'(0)+mx$，$x$ 充分小时 $f'(x)\lt0$。$f'$ 可导从而连续，由介值定理存在 $a$ 使 $f'(a)=0$，由 (2)，$a$ 是最小值点。</p>
      <p><b>唯一</b>：$f''\ge m\gt0$，$f'$ 严格递增，至多一个零点。若 $b$ 也是最小值点，它是内点处的极值点，由 Fermat 引理 $f'(b)=0$，所以 $b=a$。</p>` },
    { id: "c1-p3", lv: "真题", src: "2025 秋期中 5", stmt: R`<p>设 $f:(0,+\infty)\to\mathbb R$ 满足对任何 $x\gt0$ 都有 $f''(x)\gt0$。</p><p>(1) 证明：对不同的正数 $a,x$，有 $f(x)\gt f(a)+f'(a)(x-a)$。</p><p>(2) 假设 $\lim\limits_{x\to+\infty}f(x)=0$。证明：对任何 $x\gt0$ 都有 $f(x)\gt0$。</p>`,
      hints: [R`(1) 带 Lagrange 余项的一阶 Taylor 公式。`, R`(2) 先证 $f'$ 处处为负：若 $f'(a)\gt0$，由 (1)，$f(x)\gt f(a)+f'(a)(x-a)\to+\infty$。若 $f'(a)=0$，$f'$ 严格递增，换一个更大的点。`, R`$f$ 严格递减，$f(x)\gt f(x+1)\ge\lim_{t\to+\infty}f(t)=0$。`],
      method: "m-tangent", sol: R`<p><b>(1)</b> 由 Taylor 公式，存在 $\xi$ 介于 $a,x$ 之间，$f(x)=f(a)+f'(a)(x-a)+\frac{f''(\xi)}2(x-a)^2$。因 $f''(\xi)\gt0$ 且 $x\ne a$，最后一项为正。</p>
      <p><b>(2)</b> $f''\gt0$，所以 $f'$ 严格递增。断言 $f'(a)\lt0$ 对所有 $a\gt0$ 成立。否则存在 $a$ 使 $f'(a)\ge0$，取 $b=a+1$，则 $f'(b)\gt f'(a)\ge0$。由 (1)，$x\gt b$ 时 $f(x)\gt f(b)+f'(b)(x-b)\to+\infty$，与 $\lim f=0$ 矛盾。</p>
      <p>于是 $f$ 在 $(0,+\infty)$ 上严格递减。对任何 $x\gt0$，当 $t\gt x+1$ 时 $f(x+1)\gt f(t)$，令 $t\to+\infty$ 得 $f(x+1)\ge0$，所以 $f(x)\gt f(x+1)\ge0$。</p>` },
    { id: "c1-p4", lv: "真题", src: "2023 秋期末 7", stmt: R`设 $f$ 在 $(-\infty,+\infty)$ 上有连续的二阶导数。证明：$f''(x)$ 处处非负的充分必要条件是，对任何 $a\lt b$ 有 $$f\Big(\frac{a+b}2\Big)\le\frac1{b-a}\int_a^bf(x)\,dx.$$`,
      hints: [R`必要性：记 $m=\frac{a+b}2$，用切线不等式 $f(x)\ge f(m)+f'(m)(x-m)$。`, R`对切线不等式在 $[a,b]$ 上积分，注意 $\int_a^b(x-m)\,dx=0$。`, R`充分性反证：若 $f''(x_0)\lt0$，由连续性取 $h$ 使 $f''\lt0$ 于 $[x_0-h,x_0+h]$，在 $x_0$ 处 Taylor 展开得 $f(x)\lt f(x_0)+f'(x_0)(x-x_0)$（$x\ne x_0$），积分得反向的严格不等式。`],
      method: "m-tangent", sol: R`<p><b>必要性</b>：设 $f''\ge0$，任取 $a\lt b$，记 $m=\frac{a+b}2$。由 Taylor 公式，$f(x)=f(m)+f'(m)(x-m)+\frac{f''(\xi)}2(x-m)^2\ge f(m)+f'(m)(x-m)$。在 $[a,b]$ 上积分：</p>
      $$\int_a^bf(x)\,dx\ge(b-a)f(m)+f'(m)\int_a^b(x-m)\,dx=(b-a)f(m).$$
      <p><b>充分性</b>：反设存在 $x_0$ 使 $f''(x_0)\lt0$。$f''$ 连续，存在 $h\gt0$ 使 $f''\lt0$ 于 $[x_0-h,x_0+h]$。对这个区间内的 $x\ne x_0$，</p>
      $$f(x)=f(x_0)+f'(x_0)(x-x_0)+\frac{f''(\xi)}2(x-x_0)^2\lt f(x_0)+f'(x_0)(x-x_0).$$
      <p>令 $g(x)=f(x_0)+f'(x_0)(x-x_0)-f(x)$，$g$ 连续、非负，且除 $x_0$ 外恒正，所以 $\int_{x_0-h}^{x_0+h}g\gt0$，即 $\int_{x_0-h}^{x_0+h}f\lt2h\,f(x_0)$。取 $a=x_0-h$，$b=x_0+h$，得 $f\big(\frac{a+b}2\big)\gt\frac1{b-a}\int_a^bf$，与条件矛盾。</p>` }
  ],
  variants: [

    { id: "c1-v2", lv: "变种", src: "仿 2025 期中 5", stmt: R`设 $f$ 在 $(0,+\infty)$ 上下凸，且 $\lim\limits_{x\to0^+}f(x)=0$。证明：$\dfrac{f(x)}x$ 在 $(0,+\infty)$ 上单调递增。`,

    { id: "c1-v3", lv: "变种", src: "Jensen 型", stmt: R`证明：对任意 $x,y\gt0$，有 $x\ln x+y\ln y\ge(x+y)\ln\dfrac{x+y}2$。`,
      hints: [R`两边除以 2，右边是 $\frac{x+y}2\ln\frac{x+y}2$。`, R`令 $f(t)=t\ln t$，要证 $f\big(\frac{x+y}2\big)\le\frac{f(x)+f(y)}2$。`, R`$f''(t)=\frac1t\gt0$。`],
      method: "m-tangent", sol: R`<p>令 $f(t)=t\ln t$（$t\gt0$），$f'(t)=\ln t+1$，$f''(t)=\frac1t\gt0$，$f$ 在 $(0,+\infty)$ 上下凸。由定义（取 $t=\frac12$）：</p>

      <p>两边乘 2 即得。等号当且仅当 $x=y$。</p>` }

  extensions: [
    { id: "c1-e1", lv: "延伸", src: "经典结论", stmt: R`设 $f$ 是 $\mathbb R$ 上的下凸函数，且有上界。证明：$f$ 是常数。`,
      hints: [R`反设 $f(x_1)\ne f(x_2)$，$x_1\lt x_2$，记 $k=\frac{f(x_2)-f(x_1)}{x_2-x_1}\ne0$。`, R`若 $k\gt0$：对 $x\gt x_2$，三点 $x_1\lt x_2\lt x$ 用 $k_{12}\le k_{23}$，得 $f(x)\ge f(x_2)+k(x-x_2)$。`, R`若 $k\lt0$：对 $x\lt x_1$，三点 $x\lt x_1\lt x_2$ 用 $k_{12}\le k_{23}$，得 $f(x)\ge f(x_1)+|k|(x_1-x)$。两种情况都无上界。`],
      method: "m-slope", sol: R`<p>反设存在 $x_1\lt x_2$ 使 $f(x_1)\ne f(x_2)$，记 $k=\frac{f(x_2)-f(x_1)}{x_2-x_1}$。</p>
      <p>若 $k\gt0$：对 $x\gt x_2$，三点 $x_1\lt x_2\lt x$ 满足 $k\le\frac{f(x)-f(x_2)}{x-x_2}$，所以 $f(x)\ge f(x_2)+k(x-x_2)\to+\infty$（$x\to+\infty$）。</p>
      <p>若 $k\lt0$：对 $x\lt x_1$，三点 $x\lt x_1\lt x_2$ 满足 $\frac{f(x_1)-f(x)}{x_1-x}\le k$，所以 $f(x)\ge f(x_1)-k(x_1-x)\to+\infty$（$x\to-\infty$）。</p>
      <p>两种情况都与有上界矛盾，所以 $f$ 是常数。</p>` },
    { id: "c1-e2", lv: "延伸", src: "经典结论", stmt: R`设 $f$ 在开区间 $(a,b)$ 上下凸。证明：$f$ 在 $(a,b)$ 上连续。`,
      hints: [R`固定 $x_0\in(a,b)$，取 $a\lt u\lt x_0\lt v\lt b$。想证明 $x$ 靠近 $x_0$ 时 $\big|\frac{f(x)-f(x_0)}{x-x_0}\big|$ 有界。`, R`$x_0\lt x\lt v$ 时，三点 $u\lt x_0\lt x$ 和 $x_0\lt x\lt v$ 给出 $k(u,x_0)\le k(x_0,x)\le k(x_0,v)$。`, R`$u\lt x\lt x_0$ 时，三点 $u\lt x\lt x_0$ 和 $x\lt x_0\lt v$ 给出 $k(u,x_0)\le k(x,x_0)\le k(x_0,v)$。于是 $|f(x)-f(x_0)|\le M|x-x_0|$。`],
      method: "m-slope", sol: R`<p>固定 $x_0\in(a,b)$，取 $u,v$ 使 $a\lt u\lt x_0\lt v\lt b$。记 $k(p,q)=\frac{f(q)-f(p)}{q-p}$。</p>
      <p>当 $x_0\lt x\lt v$：三点 $u\lt x_0\lt x$ 给出 $k(u,x_0)\le k(x_0,x)$（$k_{12}\le k_{23}$）；三点 $x_0\lt x\lt v$ 给出 $k(x_0,x)\le k(x_0,v)$（$k_{12}\le k_{13}$）。</p>
      <p>当 $u\lt x\lt x_0$：三点 $u\lt x\lt x_0$ 给出 $k(u,x_0)\le k(x,x_0)$（$k_{13}\le k_{23}$）；三点 $x\lt x_0\lt v$ 给出 $k(x,x_0)\le k(x_0,v)$（$k_{12}\le k_{23}$）。</p>
      <p>记 $M=\max\{|k(u,x_0)|,|k(x_0,v)|\}$，则对 $x\in(u,v)$ 有 $|f(x)-f(x_0)|\le M|x-x_0|$，所以 $f$ 在 $x_0$ 处连续。</p>
      <p class="small muted">同样的夹逼说明 $k(x_0,x)$ 在 $x\to x_0^\pm$ 时单调有界，所以单侧导数存在，且 $f'_-(x_0)\le f'_+(x_0)$。闭区间端点处结论不成立：例如 $[0,1]$ 上 $f(0)=1$、其余 $f=0$ 是下凸的。</p>` }
  ]
}
};

  let out = "";

    save(id, { feedback: out, gradedAt: Date.now() });
    rerenderProb(id);
  } catch (err) {
    const code = err && err.code;
    if (code === "cancelled") { msg.textContent = ""; }

/* ================= 交互图：Taylor 多项式 ================= */
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function fact(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
const FUNCS = {
  exp: { tex: "e^x", f: Math.exp, c: k => 1 / fact(k), view: [-4, 3.2, -2, 10], probe: 2,
    term: k => k === 0 ? "1" : k === 1 ? "x" : `\\frac{x^{${k}}}{${k}!}`, sign: () => 1,
    note: "对任何 x，只要 n 足够大，误差都会趋于 0。把 x 拖到 −3 或 3 再加大 n 看看。" },
  sin: { tex: "\\sin x", f: Math.sin, c: k => k % 2 ? ((k - 1) / 2 % 2 ? -1 : 1) / fact(k) : 0, view: [-8, 8, -2.6, 2.6], probe: 4,
    term: k => k === 1 ? "x" : `\\frac{x^{${k}}}{${k}!}`, sign: k => ((k - 1) / 2 % 2 ? -1 : 1),
    note: "只有奇次项，所以 n 从偶数加到下一个奇数时曲线才变。n 越大，贴合的范围越宽。" },
  cos: { tex: "\\cos x", f: Math.cos, c: k => k % 2 ? 0 : ((k / 2) % 2 ? -1 : 1) / fact(k), view: [-8, 8, -2.6, 2.6], probe: 4,
    term: k => k === 0 ? "1" : `\\frac{x^{${k}}}{${k}!}`, sign: k => ((k / 2) % 2 ? -1 : 1),
    note: "只有偶次项。和 sin 一样，在整条实轴上都能越加越准。" },
  ln: { tex: "\\ln(1+x)", f: x => x > -1 ? Math.log1p(x) : NaN, c: k => k === 0 ? 0 : (k % 2 ? 1 : -1) / k, view: [-1.6, 3, -4, 3], probe: 1.6,
    term: k => k === 1 ? "x" : `\\frac{x^{${k}}}{${k}}`, sign: k => (k % 2 ? 1 : -1),
    note: "把 x 拖到 1 的右边，再加大 n：多项式反而越来越离谱。Taylor 多项式只在 |x| < 1 内越加越准，这是 Peano 余项“只管 x→0”的直观体现。" },
  geo: { tex: "\\frac{1}{1-x}", f: x => x < 1 ? 1 / (1 - x) : NaN, c: () => 1, view: [-2.2, 1.6, -3, 7], probe: -1.4,
    term: k => k === 0 ? "1" : k === 1 ? "x" : `x^{${k}}`, sign: () => 1,
    note: "x < −1 时多项式在正负之间来回剧烈摆动，同样只在 |x| < 1 内收敛。" }
};
function taylorPlot(mount) {
  mount.innerHTML = `<div class="widget">
    <div class="ctrl">
      <label for="tf">函数 <select id="tf">${Object.entries(FUNCS).map(([k, v]) => `<option value="${k}">${k === "geo" ? "1/(1−x)" : k === "ln" ? "ln(1+x)" : k === "exp" ? "e^x" : k === "sin" ? "sin x" : "cos x"}</option>`).join("")}</select></label>
      <label for="tn">阶数 n = <b class="mono" id="tnv">3</b> <input id="tn" type="range" min="0" max="14" value="3"></label>
      <label for="tx">观察点 x = <b class="mono" id="txv"></b> <input id="tx" type="range" min="0" max="1000" value="700"></label>
    </div>
    <canvas id="tc" role="img" aria-label="函数与其 Taylor 多项式的图像"></canvas>
    <div class="legend"><span><i style="background:var(--ink)"></i>f(x)</span><span><i style="background:var(--accent)"></i>Taylor 多项式 T<sub>n</sub>(x)</span><span><i style="background:var(--bad)"></i>观察点处的误差</span></div>
    <div class="readout" id="tr"></div>
    <div class="poly" id="tp"></div>
    <p class="small muted" id="tnote"></p>
  </div>`;
  const cv = $("#tc", mount), sel = $("#tf", mount), nIn = $("#tn", mount), xIn = $("#tx", mount);
  let polyTimer;
  function setProbe() { const F = FUNCS[sel.value]; const [a, b] = F.view; xIn.value = Math.round(1000 * (F.probe - a) / (b - a)); }
  function T(F, n, x) { let s = 0, p = 1; for (let k = 0; k <= n; k++) { s += F.c(k) * p; p *= x; } return s; }
  function draw() {
    const F = FUNCS[sel.value], n = +nIn.value;
    const [x0, x1, y0, y1] = F.view;
    const px = x0 + (x1 - x0) * (+xIn.value) / 1000;
    $("#tnv", mount).textContent = n; $("#txv", mount).textContent = px.toFixed(2);
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const X = x => (x - x0) / (x1 - x0) * W, Y = y => H - (y - y0) / (y1 - y0) * H;
    g.lineWidth = 1; g.strokeStyle = css("--grid");
    for (let i = Math.ceil(x0); i <= x1; i++) { g.beginPath(); g.moveTo(X(i), 0); g.lineTo(X(i), H); g.stroke(); }
    for (let j = Math.ceil(y0); j <= y1; j++) { g.beginPath(); g.moveTo(0, Y(j)); g.lineTo(W, Y(j)); g.stroke(); }
    g.strokeStyle = css("--muted"); g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(X(0), 0); g.lineTo(X(0), H); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke();

    for (let i = Math.ceil(x0); i <= x1; i++) if (i) g.fillText(i, X(i) + 3, Math.min(H - 4, Y(0) + 13));
    function curve(fn, color, w) {
      g.strokeStyle = color; g.lineWidth = w; g.beginPath(); let pen = false;
      for (let i = 0; i <= W; i++) {
        const x = x0 + (x1 - x0) * i / W, y = fn(x);

        if (!pen) { g.moveTo(i, Y(y)); pen = true; } else g.lineTo(i, Y(y));

    }

    $("#tr", mount).innerHTML = `<span>f(x) = <b>${fmt(fy)}</b></span><span>T<sub>${n}</sub>(x) = <b>${fmt(ty)}</b></span><span>误差 |f − T<sub>${n}</sub>| = <b>${isFinite(fy) ? fmt(Math.abs(fy - ty)) : "—"}</b></span>`;
    $("#tnote", mount).textContent = F.note;
    clearTimeout(polyTimer);
    polyTimer = setTimeout(() => {
      let s = ""; let first = true;
      for (let k = 0; k <= n; k++) { if (F.c(k) === 0) continue; const sg = F.sign(k); s += (first ? (sg < 0 ? "-" : "") : (sg < 0 ? "-" : "+")) + F.term(k); first = false; }
      if (!s) s = "0";
      const tp = $("#tp", mount); tp.innerHTML = `$$T_{${n}}(x)=${s}$$`; typeset(tp);
    }, 250);
  }
  sel.addEventListener("change", () => { setProbe(); draw(); });
  nIn.addEventListener("input", draw); xIn.addEventListener("input", draw);
  const dragTo = e => { const r = cv.getBoundingClientRect(); xIn.value = Math.round(1000 * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))); draw(); };
  cv.addEventListener("pointerdown", e => { try { cv.setPointerCapture(e.pointerId); } catch (_) {} dragTo(e); });

  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  setProbe(); requestAnimationFrame(draw);
}

function mvtPlot(mount) {

  const pad = (ymax - ymin) * 0.12; ymin -= pad; ymax += pad;
  mount.innerHTML = `<div class="widget">
    <div class="ctrl">
      <label for="ma">a = <b class="mono" id="mav"></b> <input id="ma" type="range" min="-380" max="380" value="-300"></label>
      <label for="mb">b = <b class="mono" id="mbv"></b> <input id="mb" type="range" min="-380" max="380" value="250"></label>
    </div>
    <canvas id="mc" role="img" aria-label="函数图像、弦与满足中值定理的切点"></canvas>
    <div class="legend"><span><i style="background:var(--ink)"></i>f(x)</span><span><i style="background:var(--accent)"></i>弦 AB</span><span><i style="background:var(--teal)"></i>切线平行于弦的点 ξ</span></div>
    <div class="readout" id="mr"></div>
    <p class="small muted">在图上左右拖动会移动离手指更近的那个端点。试着让 a、b 包住两个“弯”，满足条件的 ξ 会变成 3 个。</p>
  </div>`;
  const cv = $("#mc", mount), aIn = $("#ma", mount), bIn = $("#mb", mount);
  function roots(a, b, k) {
    const out = [], N = 600; let px = a, pv = df(a) - k;
    for (let i = 1; i <= N; i++) {
      const x = a + (b - a) * i / N, v = df(x) - k;
      if (pv === 0 && i > 1) out.push(px);
      else if (pv * v < 0) { let lo = px, hi = x; for (let j = 0; j < 40; j++) { const m = (lo + hi) / 2; if ((df(lo) - k) * (df(m) - k) <= 0) hi = m; else lo = m; } out.push((lo + hi) / 2); }
      px = x; pv = v;
    }
    return out.filter(x => x > a + 1e-6 && x < b - 1e-6);
  }
  function draw() {
    let a = +aIn.value / 100, b = +bIn.value / 100;
    if (b - a < 0.3) { if (document.activeElement === aIn) { a = b - 0.3; aIn.value = Math.round(a * 100); } else { b = a + 0.3; bIn.value = Math.round(b * 100); } }
    $("#mav", mount).textContent = a.toFixed(2); $("#mbv", mount).textContent = b.toFixed(2);
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const X = x => (x - X0) / (X1 - X0) * W, Y = y => H - (y - ymin) / (ymax - ymin) * H;
    g.strokeStyle = css("--grid"); g.lineWidth = 1;
    for (let i = Math.ceil(X0); i <= X1; i++) { g.beginPath(); g.moveTo(X(i), 0); g.lineTo(X(i), H); g.stroke(); }
    g.strokeStyle = css("--muted"); g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke();
    g.fillStyle = css("--accent-soft"); g.fillRect(X(a), 0, X(b) - X(a), H);
    g.strokeStyle = css("--ink"); g.lineWidth = 2.2; g.beginPath();
    for (let i = 0; i <= W; i++) { const x = X0 + (X1 - X0) * i / W; i ? g.lineTo(i, Y(f(x))) : g.moveTo(i, Y(f(x))); }
    g.stroke();
    const fa = f(a), fb = f(b), k = (fb - fa) / (b - a);
    g.strokeStyle = css("--accent"); g.lineWidth = 2; g.beginPath(); g.moveTo(X(a), Y(fa)); g.lineTo(X(b), Y(fb)); g.stroke();
    const xs = roots(a, b, k), half = (X1 - X0) * 0.09;
    g.setLineDash([6, 4]); g.strokeStyle = css("--teal"); g.lineWidth = 1.8;
    for (const x of xs) { const y = f(x); g.beginPath(); g.moveTo(X(x - half), Y(y - k * half)); g.lineTo(X(x + half), Y(y + k * half)); g.stroke(); }
    g.setLineDash([]);
    g.fillStyle = css("--teal"); for (const x of xs) { g.beginPath(); g.arc(X(x), Y(f(x)), 4.5, 0, 7); g.fill(); }
    g.fillStyle = css("--accent"); for (const [x, y] of [[a, fa], [b, fb]]) { g.beginPath(); g.arc(X(x), Y(y), 5, 0, 7); g.fill(); }
    g.font = "12px " + css("--f-mono"); g.fillStyle = css("--accent"); g.fillText("A", X(a) - 14, Y(fa) - 8); g.fillText("B", X(b) + 6, Y(fb) - 8);
    $("#mr", mount).innerHTML = `<span>弦斜率 k = <b>${k.toFixed(3)}</b></span><span>满足 f′(ξ) = k 的点：<b>${xs.length}</b> 个${xs.length ? "（ξ = " + xs.map(x => x.toFixed(2)).join("、") + "）" : ""}</span>`;
  }
  aIn.addEventListener("input", draw); bIn.addEventListener("input", draw);
  let drag = null;
  const xAt = e => { const r = cv.getBoundingClientRect(); return X0 + (X1 - X0) * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  cv.addEventListener("pointerdown", e => {
    const x = xAt(e); drag = Math.abs(x - aIn.value / 100) <= Math.abs(x - bIn.value / 100) ? aIn : bIn;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    drag.value = Math.round(Math.max(-3.8, Math.min(3.8, x)) * 100); drag.focus({ preventScroll: true }); draw();
  });
  cv.addEventListener("pointermove", e => { if (!drag || !(cv.hasPointerCapture && cv.hasPointerCapture(e.pointerId))) return; drag.value = Math.round(Math.max(-3.8, Math.min(3.8, xAt(e))) * 100); draw(); });
  cv.addEventListener("pointerup", () => { drag = null; });
  window.addEventListener("resize", draw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  requestAnimationFrame(draw);
}

/* ================= 交互图：斜率不等式与拐点 ================= */
function convexPlot(mount) {
  const FN = {
    ln: { label: "ln(1+x²)", f: x => Math.log(1 + x * x), d2: x => 2 * (1 - x * x) / Math.pow(1 + x * x, 2), X0: -3.5, X1: 3.5, p: [-0.8, 0, 0.7] },
    xe: { label: "x·e^(−x)", f: x => x * Math.exp(-x), d2: x => (x - 2) * Math.exp(-x), X0: -0.6, X1: 7, p: [2.8, 4, 5.5] },
    cu: { label: "x³ − 3x", f: x => x * x * x - 3 * x, d2: x => 6 * x, X0: -2.4, X1: 2.4, p: [0.3, 1, 1.8] }
  };
  mount.innerHTML = `<div class="widget">
    <div class="ctrl">
      <label for="cvf">函数 <select id="cvf">${Object.entries(FN).map(([k, o]) => `<option value="${k}">${o.label}</option>`).join("")}</select></label>
      <label for="cv1">x₁ <input id="cv1" type="range" min="0" max="1000"></label>
      <label for="cv2">x₂ <input id="cv2" type="range" min="0" max="1000"></label>
      <label for="cv3">x₃ <input id="cv3" type="range" min="0" max="1000"></label>
    </div>
    <canvas id="cvc" role="img" aria-label="函数图像、三点连成的三条弦与下凸区域"></canvas>
    <div class="legend"><span><i style="background:var(--accent-soft)"></i>f″ ≥ 0（下凸）</span><span><i style="background:var(--accent)"></i>弦</span><span><i style="background:var(--teal)"></i>拐点</span></div>
    <div class="readout" id="cvr"></div>
    <p class="small muted">在图上左右拖动会移动最近的那个点。三点都在涂色段里时，左弦 ≤ 长弦 ≤ 右弦总成立；让三点跨过拐点，试着把不等式弄坏。</p>
  </div>`;
  const cv = $("#cvc", mount), sel = $("#cvf", mount), ins = [1, 2, 3].map(i => $("#cv" + i, mount));
  let F, ymin, ymax, infl;
  const toX = v => F.X0 + (F.X1 - F.X0) * v / 1000, toV = x => Math.round((x - F.X0) / (F.X1 - F.X0) * 1000);
  function setFn() {
    F = FN[sel.value]; ymin = Infinity; ymax = -Infinity; infl = [];
    let pv = F.d2(F.X0);
    for (let i = 0; i <= 600; i++) {
      const x = F.X0 + (F.X1 - F.X0) * i / 600, y = F.f(x), v = F.d2(x);
      ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
      if (i && pv * v < 0) { let lo = x - (F.X1 - F.X0) / 600, hi = x; for (let j = 0; j < 40; j++) { const m = (lo + hi) / 2; if (F.d2(lo) * F.d2(m) <= 0) hi = m; else lo = m; } infl.push((lo + hi) / 2); }
      else if (v === 0 && i && i < 600 && F.d2(x - 1e-3) * F.d2(x + 1e-3) < 0) infl.push(x);
      pv = v;
    }
    const pad = (ymax - ymin) * 0.12; ymin -= pad; ymax += pad;
    F.p.forEach((x, i) => { ins[i].value = toV(x); });
    draw();
  }
  function fix(moved) {
    const gap = 25, v = ins.map(e => +e.value);
    const i = ins.indexOf(moved);
    if (i >= 0) {
      for (let j = i + 1; j < 3; j++) v[j] = Math.max(v[j], v[j - 1] + gap);
      for (let j = i - 1; j >= 0; j--) v[j] = Math.min(v[j], v[j + 1] - gap);
      if (v[0] < 0) { v[0] = 0; v[1] = Math.max(v[1], gap); v[2] = Math.max(v[2], 2 * gap); }
      if (v[2] > 1000) { v[2] = 1000; v[1] = Math.min(v[1], 1000 - gap); v[0] = Math.min(v[0], 1000 - 2 * gap); }
    }
    v.forEach((x, j) => { ins[j].value = x; });
  }
  function draw() {
    const xs = ins.map(e => toX(+e.value)), ys = xs.map(F.f);
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const X = x => (x - F.X0) / (F.X1 - F.X0) * W, Y = y => H - (y - ymin) / (ymax - ymin) * H;
    g.fillStyle = css("--accent-soft");
    for (let i = 0; i < W; i++) { const x = F.X0 + (F.X1 - F.X0) * (i + 0.5) / W; if (F.d2(x) >= 0) g.fillRect(i, 0, 1, H); }
    g.strokeStyle = css("--grid"); g.lineWidth = 1;
    for (let i = Math.ceil(F.X0); i <= F.X1; i++) { g.beginPath(); g.moveTo(X(i), 0); g.lineTo(X(i), H); g.stroke(); }
    g.strokeStyle = css("--muted");
    if (ymin < 0 && ymax > 0) { g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke(); }
    if (F.X0 < 0 && F.X1 > 0) { g.beginPath(); g.moveTo(X(0), 0); g.lineTo(X(0), H); g.stroke(); }
    g.strokeStyle = css("--ink"); g.lineWidth = 2.2; g.beginPath();
    for (let i = 0; i <= W; i++) { const x = F.X0 + (F.X1 - F.X0) * i / W; i ? g.lineTo(i, Y(F.f(x))) : g.moveTo(i, Y(F.f(x))); }
    g.stroke();
    g.strokeStyle = css("--accent"); g.lineWidth = 2;
    for (const [i, j, dash] of [[0, 1, []], [1, 2, []], [0, 2, [6, 4]]]) { g.setLineDash(dash); g.beginPath(); g.moveTo(X(xs[i]), Y(ys[i])); g.lineTo(X(xs[j]), Y(ys[j])); g.stroke(); }
    g.setLineDash([]);
    g.fillStyle = css("--teal"); for (const x of infl) { g.beginPath(); g.arc(X(x), Y(F.f(x)), 5, 0, 7); g.fill(); }
    g.fillStyle = css("--accent"); g.font = "12px " + css("--f-mono");
    xs.forEach((x, i) => { g.beginPath(); g.arc(X(x), Y(ys[i]), 5, 0, 7); g.fill(); g.fillText("x" + "₁₂₃"[i], X(x) - 6, Y(ys[i]) - 10); });
    const k = (i, j) => (ys[j] - ys[i]) / (xs[j] - xs[i]);
    const k12 = k(0, 1), k13 = k(0, 2), k23 = k(1, 2), eps = 1e-9, ok = k12 <= k13 + eps && k13 <= k23 + eps;
    const allConvex = (() => { for (let i = 0; i <= 200; i++) if (F.d2(xs[0] + (xs[2] - xs[0]) * i / 200) < -eps) return false; return true; })();
    $("#cvr", mount).innerHTML = `<span>k₁₂ = <b>${k12.toFixed(3)}</b></span><span>k₁₃ = <b>${k13.toFixed(3)}</b></span><span>k₂₃ = <b>${k23.toFixed(3)}</b></span>`
      + `<span>${ok ? "✓ k₁₂ ≤ k₁₃ ≤ k₂₃ 成立" : "✗ 斜率不等式不成立"}${allConvex ? "（[x₁, x₃] 全在下凸段）" : "（[x₁, x₃] 里有 f″ &lt; 0 的部分）"}</span>`
      + `<span>拐点：${infl.length ? infl.map(x => "x = " + x.toFixed(2)).join("、") : "无"}</span>`;
  }
  sel.addEventListener("change", setFn);
  ins.forEach(e => e.addEventListener("input", () => { fix(e); draw(); }));
  let drag = null;
  const vAt = e => { const r = cv.getBoundingClientRect(); return Math.round(1000 * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))); };
  cv.addEventListener("pointerdown", e => {
    const v = vAt(e); drag = ins.reduce((b, c) => Math.abs(+c.value - v) < Math.abs(+b.value - v) ? c : b);
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    drag.value = v; fix(drag); drag.focus({ preventScroll: true }); draw();
  });
  cv.addEventListener("pointermove", e => { if (!drag || !(cv.hasPointerCapture && cv.hasPointerCapture(e.pointerId))) return; drag.value = vAt(e); fix(drag); draw(); });
  cv.addEventListener("pointerup", () => { drag = null; });
  window.addEventListener("resize", draw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  requestAnimationFrame(setFn);
}

/* ================= 交互图：Lagrange 中值点 ================= */
function lagrangeXi(mount) {
  mount.innerHTML = `<div class="widget">
    <div class="ctrl">
      <label for="lx">x = <b class="mono" id="lxv"></b> <input id="lx" type="range" min="-30" max="30" value="20"></label>
      <label for="ln">n = <b class="mono" id="lnv"></b> <input id="ln" type="range" min="0" max="6" value="1"></label>
    </div>
    <div class="xi-line" id="ll"></div>
    <div class="readout" id="lr"></div>
    <p class="small muted">f(x) = eˣ，在 0 处展开：eˣ = Tₙ(x) + e^ξ · xⁿ⁺¹/(n+1)!。图中的点就是真正满足这个等式的 ξ。</p>
  </div>`;
  const xIn = $("#lx", mount), nIn = $("#ln", mount);
  function draw() {
    let x = (+xIn.value) / 10; if (Math.abs(x) < 0.1) x = x < 0 ? -0.1 : 0.1;
    const n = +nIn.value;
    let T = 0, p = 1; for (let k = 0; k <= n; k++) { T += p / fact(k); p *= x; }
    const Rn = Math.exp(x) - T;
    const xi = Math.log(Rn * fact(n + 1) / Math.pow(x, n + 1));
    $("#lxv", mount).textContent = x.toFixed(1); $("#lnv", mount).textContent = n;
    const lo = -3.2, hi = 3.2, P = v => (v - lo) / (hi - lo) * 100;
    const a = Math.min(0, x), b = Math.max(0, x);
    $("#ll", mount).innerHTML = `<div class="bar"></div><div class="seg" style="left:${P(a)}%;width:${P(b) - P(a)}%"></div>
      <div class="pt" style="left:${P(0)}%"><span>0</span></div><div class="pt" style="left:${P(x)}%"><span>x = ${x.toFixed(1)}</span></div>
      <div class="xi" style="left:${P(xi)}%"><span>ξ = ${xi.toFixed(3)}</span></div>`;
    $("#lr", mount).innerHTML = `<span>余项 Rₙ(x) = <b>${Rn.toExponential(3)}</b></span><span>θ = ξ/x = <b>${(xi / x).toFixed(4)}</b></span><span>1/(n+2) = <b>${(1 / (n + 2)).toFixed(4)}</b></span>`;
  }
  xIn.addEventListener("input", draw); nIn.addEventListener("input", draw);
  draw();
}

renderNav();
render();
</script>
