ap2: {
  unit: "applications", n: 2, title: "旋转体体积：截面、圆盘与圆环",
  goal: "用垂直于旋转轴的截面面积列体积，分清半径与高度。主线完成 2025 秋期末 A 卷 1：体积极限和体积函数的拐点；圆环与换轴题用于迁移。",
  sections: [
    { id: "ap2-s1", h: "1. 体积 = 截面面积的积分", html: R`<p>沿 $x$ 轴切片，若截面面积为 $A(x)$，则 $V=\int_a^bA(x)dx$。非负函数 $y=f(x)$ 与 x 轴之间的区域绕 x 轴转一周，截面是半径 $f(x)$ 的圆盘：</p>$$V=\pi\int_a^bf(x)^2dx.$$
      <p>若区域夹在 $0\le g(x)\le f(x)$ 之间，截面是圆环，面积为 $\pi(f^2-g^2)$，<b>不是 $\pi(f-g)^2$</b>。离开 x 轴旋转时，半径必须是到新旋转轴的距离。</p>` },
    { id: "ap2-s2", h: "2. 2025 真题：体积函数与无穷长实体", html: R`<p>对 $y=xe^{-x}$（$0\le x\le t$）下方区域绕 x 轴旋转，</p>$$V(t)=\pi\int_0^t x^2e^{-2x}dx=\frac\pi4\left[1-e^{-2t}(2t^2+2t+1)\right].$$
      <p>无穷长并不必然体积无穷大。因为指数衰减压过多项式，$t\to\infty$ 时括号中的尾项趋零，体积趋于 $\pi/4$。</p><p>求不定积分可连续分部两次，得到 $\int x^2e^{-2x}dx=-e^{-2x}(x^2/2+x/2+1/4)+C$。端点先在有限 t 处代入，再取极限。</p>` },
    { id: "ap2-s3", h: "3. 拐点问的是 V，不是原曲线", html: R`<p>由变上限积分基本定理：</p>$$V'(t)=\pi t^2e^{-2t},\qquad V''(t)=2\pi t(1-t)e^{-2t}.$$
      <p>在题目范围 $t\gt0$ 内，$V''$ 在 $(0,1)$ 为正、$(1,\infty)$ 为负，故唯一拐点的横坐标为 1，对应 $V(1)=\pi(1-5e^{-2})/4$。端点 0 没有定义域内的左右邻域，不能列作拐点。</p><p>$V'\gt0$ 说明体积一直增大；$V''$ 变号说明每增加一小段长度所增加的体积先增后减，恰由截面圆盘面积 $\pi t^2e^{-2t}$ 决定。</p>` }
  ],
  widget: "volumePlay",
  concepts: [
    { id: "ap2-c1", sec: "ap2-s1", q: R`$0\le g\le f$ 的区域绕 x 轴旋转，截面面积是：`, opts: [R`$\pi(f-g)^2$`,R`$\pi(f^2-g^2)$`,R`$2\pi(f-g)$`,R`$f-g$`], a: 1, ex: R`圆环面积 = 外圆面积 − 内圆面积。两半径都相对于旋转轴测量。` },
    { id: "ap2-c2", sec: "ap2-s2", q: R`对真题的 $V(t)$，$V'(t)$ 是：`, opts: [R`$\pi te^{-t}$`,R`$\pi t^2e^{-2t}$`,R`$2\pi te^{-2t}$`,R`$\pi t^2e^{-t}$`], a: 1, ex: R`积分上限是 t，直接取当前截面面积 $\pi[te^{-t}]^2$。` },
    { id: "ap2-c3", sec: "ap2-s3", q: R`$V''(0)=0$，所以 t=0 是拐点吗？`, opts: [R`一定是`,R`不是，0 是题目定义域 $t\gt0$ 的边界，不能检查内部两侧变号`,R`只要 V′(0)=0 就是`,R`无法判断任何内部拐点`], a: 1, ex: R`拐点须在定义域内具有两侧并发生凹凸改变。唯一内部变号点是 t=1。` },
    { id: "ap2-c4", sec: "ap2-s2", q: R`旋转体在 x 方向无限延伸，是否一定体积无限？`, opts: [R`一定`,R`不一定，要看截面面积的反常积分`,R`只要半径趋零就一定体积有限`,R`只要半径单调就一定有限`], a: 1, ex: R`例如半径 x^{-1/2} 的截面面积是 π/x，仍发散；半径 xe^{-x} 的截面面积可积。` }
  ],
  methods: [{ id: "m-ap-volume", title: "旋转体：先画截面，再平方半径", steps: [R`明确旋转轴，选垂直于轴的切片，标出内外半径。`,R`写截面面积：圆盘 $\pi R^2$，圆环 $\pi(R^2-r^2)$，再对轴向变量积分。`,R`无限端点先判敛散或有限截断；求体积函数导数可直接用基本定理。`,R`拐点需二阶导数变号，别把定义域端点或原曲线拐点混入。`] }],
  problems: [
    { id: "ap2-p1", lv: "基础", src: "自编：圆盘与圆环", stmt: R`<p>(1) 区域 $0\le x\le1$、$0\le y\le x$ 绕 x 轴转一周，求体积。</p><p>(2) 区域 $0\le x\le1$、$x^2\le y\le x$ 绕 x 轴转一周，求体积。</p>`, hints: [R`(1) 外半径 $x$，内半径 0。`,R`(2) 外半径 $x$，内半径 $x^2$。`,R`分别积分 $\pi x^2$ 与 $\pi(x^2-x^4)$，不要平方高度差。`], method: "m-ap-volume", sol: R`<p>(1) $V=\pi\int_0^1x^2dx=\pi/3$。</p><p>(2) $V=\pi\int_0^1(x^2-x^4)dx=\pi(1/3-1/5)=2\pi/15$。第二个实体在第一个内部，所以体积比 $\pi/3$ 小，符合几何关系。</p>` },
    { id: "ap2-p2", lv: "真题", src: "2025 秋期末 A 卷 1(1)(2)（mathsdream 扫描原卷）", stmt: R`对正数 $t$，定义 $V(t)$ 为平面曲线 $y=xe^{-x}$（$0\le x\le t$）绕 x 轴旋转一周所得旋转体的体积。<p>(1) 求 $\lim_{t\to\infty}V(t)$。</p><p>(2) 求出 $V(t)$ 的所有拐点（其两侧函数上下凸性相反的点）。</p>`, hints: [R`体积截面是半径 $xe^{-x}$ 的圆盘，$V(t)=\pi\int_0^t x^2e^{-2x}dx$。`,R`分部两次，或先求 $\int_0^\infty e^{-2x}dx$ 再递推矩积分。`,R`$V''(t)=2\pi t(1-t)e^{-2t}$，检查 $t\gt0$ 范围中的变号。`], method: "m-ap-volume", sol: R`<p>(1) $V(t)=\pi\int_0^t x^2e^{-2x}dx=\frac\pi4[1-e^{-2t}(2t^2+2t+1)]$。因为 $t^ke^{-2t}\to0$（$k=0,1,2$），极限为 $\pi/4$。</p><p>(2) $V'(t)=\pi t^2e^{-2t}$，$V''(t)=2\pi t(1-t)e^{-2t}$。在 $(0,1)$ 上二阶导正，在 $(1,\infty)$ 上负，故唯一拐点为</p>$$\left(1,\frac\pi4(1-5e^{-2})\right).$$
      <p>0 不是 $t\gt0$ 定义域的内部点，不能另列。题目问 V 的拐点，不是 $y=xe^{-x}$ 的拐点。</p>` }
  ],
  variants: [
    { id: "ap2-v1", lv: "变种", src: "自编：绕平行轴旋转", stmt: R`区域 $0\le x\le1$、$0\le y\le x$ 绕直线 $y=2$ 转一周，求体积。`, hints: [R`到轴 $y=2$ 的距离：外半径是 2，内半径是 $2-x$。`,R`截面圆环面积 $\pi[4-(2-x)^2]$。`,R`化简为 $\pi(4x-x^2)$ 再积分。`], method: "m-ap-volume", sol: R`<p>垂直 x 轴的线段 $0\le y\le x$ 到旋转轴的距离在 $[2-x,2]$。因此 $V=\pi\int_0^1[2^2-(2-x)^2]dx=\pi\int_0^1(4x-x^2)dx=5\pi/3$。</p><p>若直接用 $\pi x^2$，相当于仍绕 x 轴，已改变了题目。</p>` },
    { id: "ap2-v2", lv: "变种", src: "自编：同一区域换旋转轴", stmt: R`区域 $0\le x\le1$、$x^2\le y\le x$ 绕 y 轴转一周，求体积。`, hints: [R`改用 $y$ 切片，$0\le y\le1$。`,R`由 $y\le x$、$y\ge x^2$ 得 $y\le x\le\sqrt y$，外半径 $\sqrt y$，内半径 $y$。`,R`截面面积 $\pi(y-y^2)$。`], method: "m-ap-volume", sol: R`<p>横切片的左右边界为 $x=y$、$x=\sqrt y$，绕 y 轴转成圆环。因此 $V=\pi\int_0^1[(\sqrt y)^2-y^2]dy=\pi(1/2-1/3)=\pi/6$。</p><p>同一区域绕不同轴体积不同；这里必须重新确定半径和积分变量。</p>` }
  ],
  extensions: [
    { id: "ap2-e1", lv: "延伸", src: "自编：无穷长喇叭的收敛阈值", stmt: R`对实数 $p$，把 $x\ge1$、$0\le y\le x^{-p}$ 的区域绕 x 轴转一周。体积何时有限？有限时求值。`, hints: [R`截面面积 $\pi x^{-2p}$。`,R`与无穷远 p 型积分比较。`,R`要求 $2p\gt1$，积分值 $\pi/(2p-1)$。`], method: "m-ap-volume", sol: R`<p>$V=\pi\int_1^\infty x^{-2p}dx$，所以体积有限当且仅当 $2p\gt1$，即 $p\gt1/2$；有限时 $V=\pi/(2p-1)$。$p=1/2$ 对数发散。</p><p>半径趋零只要求 $p\gt0$，而体积有限要求 $p\gt1/2$；“趋零”不能替代可积性。此题将旋转体与 im1 的收敛阈值连在一起。</p>` }
  ]
},

r1: {
  unit: "applications", n: 3, title: "综合回炉：先识别方法，再动笔",
  goal: "30 分钟完成三道新题：积分中的 Taylor 抵消、中值定理的多零点链、无限区域的面积与体积。每题先写“为什么选这个方法”，再看提示；把错因记入自己的作答区。",
  sections: [
    { id: "r1-s1", h: "1. 先诊断：题目把哪两种方法叠在一起？", html: R`<p>看到“变上限积分减去低阶项”，优先想 Taylor 展开后积分；看到多个端点条件，先数零点，再安排 Rolle；看到无穷长几何区域，先列截面或面积表达式，再判反常积分。</p><p>本课不增加公式。每题第一行写出方法与触发线索，例如“分子相消到二阶，因此要保留被积函数的二阶项”。若第一步选错，后面计算再熟练也容易失分。</p>` },
    { id: "r1-s2", h: "2. 验算不要只重算一遍", html: R`<p>极限：用首项符号和幂次核对；存在性证明：逐次列出每次 Rolle 的闭区间与开区间；几何积分：检查被积量的单位与非负性，确认半径是否平方。</p><p><b>三个易错推断</b>：“积分函数无初等原函数，所以不能求极限”；“有两个零点就能得到二阶导零点”；“无限区域面积发散，所以旋转体体积也发散”。三句都不成立，主线题分别用一个例子修正。</p>` },
    { id: "r1-s3", h: "3. 错题回炉要改变一个条件", html: R`<p>做错后先标记错因：条件、方法、运算或表达。重做时只看题面，最后再把一个条件改掉：积分上限换成 $x^2$，几何图形换旋转轴，或把有限端点换无穷远。能说明改动为何影响答案，才算从一道题得到可迁移的方法。</p><p>延伸题把几何的面积与体积同时做参数判别；它不是 30 分钟主线的完成条件。</p>` }
  ],
  widget: null,
  concepts: [
    { id: "r1-c1", sec: "r1-s1", q: R`被积函数在 0 附近首个非零项为 $ct^2$，从 0 积到 x 后的首项是：`, opts: [R`$cx^2$`,R`$cx^3$`,R`$cx^3/3$`,R`$cx^2/2$`], a: 2, ex: R`幂次升一、系数除以新幂次，余项还要控制为 $o(x^3)$。` },
    { id: "r1-c2", sec: "r1-s2", q: R`$f\in C^2[a,b]$ 且只知 $f(a)=f(b)=0$，能否保证某个内部点 $f''=0$？`, opts: [R`能，Rolle 用两次即可`,R`不能，例如 $f(x)=(x-a)(x-b)$ 的二阶导恒为 2`,R`能，因为 f′ 必单调`,R`只能保证端点 f″=0`], a: 1, ex: R`两个 f 零点只先给一个 f′ 零点；再用 Rolle 需要两个不同的 f′ 零点。` },
    { id: "r1-c3", sec: "r1-s2", q: R`某无限区域面积为无穷大，绕轴旋转后的体积：`, opts: [R`一定为无穷大`,R`一定有限`,R`需要重新列截面面积积分判断`,R`等于原面积乘 π`], a: 2, ex: R`平面面积积分的是高度，圆盘体积积分的是 $\pi$ 乘半径的平方，两者的可积阈值不同。` },
    { id: "r1-c4", sec: "r1-s3", q: R`最能验证你是否掌握一道错题的方法是：`, opts: [R`立刻对照解答抄一遍`,R`只记最后数值`,R`独立重做后改动一个条件，并说明方法或阈值怎样变化`,R`把所有提示一次点开`], a: 2, ex: R`独立再现与条件迁移能区分“看懂了”和“能自己做”。提示层数可以记录，但不能替代主动检验。` }
  ],
  methods: [{ id: "m-review-route", title: "综合题四行自检", steps: [R`第一行：列已知条件、目标与可能的反常点。`,R`第二行：写选用的方法及触发线索，必要时注明适用范围。`,R`第三行：完整运算或逐次应用定理，不省略导致结论的条件。`,R`第四行：用符号、幂次、边界、几何关系或独立算法检查；写一个可迁移的改题。`] }],
  problems: [
    { id: "r1-p1", lv: "基础", src: "自编：Taylor 与积分叠加", stmt: R`不用求初等原函数，计算 $$\lim_{x\to0}\frac{\displaystyle\int_0^x\left(\sqrt{1+t}-1-\frac t2\right)dt}{x^3}.$$`, hints: [R`分子中的常数项与一次项已抵消，要展开平方根到二阶。`,R`$\sqrt{1+t}=1+t/2-t^2/8+o(t^2)$。`,R`积分后的首项是 $-x^3/24$；正负 x 都要成立。`], method: "m-review-route", sol: R`<p>在 0 的双侧邻域，$\sqrt{1+t}-1-t/2=-t^2/8+o(t^2)$。对余项用 $|r(t)|\le\varepsilon t^2$ 控制，可得从 0 到 x 的积分余项为 $o(x^3)$。</p><p>因此分子 $=-x^3/24+o(x^3)$，极限为 $-1/24$。核对符号：被积函数在 0 附近非正，$x\gt0$ 时分子负，结果为负。$x\lt0$ 时积分方向反转、$x^3$ 也变负，比例仍为负。</p>` },
    { id: "r1-p2", lv: "基础", src: "自编：积分条件制造第三个零点", stmt: R`设 $f\in C^2[0,1]$，$f(0)=f(1)=0$，且 $\int_0^1f(x)dx=0$。证明存在 $\xi\in(0,1)$ 使 $f''(\xi)=0$。`, hints: [R`先找一个内部零点 c；若 f 恒为 0，结论立即成立。`,R`若没有内部零点，连续性迫使 f 在 (0,1) 恒正或恒负，与积分为 0 矛盾。`,R`对 [0,c]、[c,1] 各用一次 Rolle 得两个不同的 f′ 零点，再在两者之间用 Rolle。`], method: "m-review-route", sol: R`<p>若 $f\equiv0$，任取内部点即可。否则假设 f 在 (0,1) 无零点，则连续性使其在该区间固定符号。若恒正，取某个正值点，连续性给一个正长度区间上的正下界，故积分严格正；恒负同理积分严格负，均矛盾。所以有 $c\in(0,1)$ 使 f(c)=0。</p><p>在 [0,c] 与 [c,1] 分别用 Rolle，得 $u\in(0,c)$、$v\in(c,1)$ 且 $f'(u)=f'(v)=0$。再对 f′ 在 [u,v] 上用 Rolle，得 $\xi\in(u,v)\subset(0,1)$ 满足 $f''(\xi)=0$。每次使用的连续性与可导性均由 C² 条件保证。</p>` },
    { id: "r1-p3", lv: "基础", src: "自编：无限区域与有限体积", stmt: R`区域由 $x\ge1$、$0\le y\le(\ln x)/x$ 给出。判断其平面面积是否有限，并求绕 x 轴旋转一周所得实体的体积（若有限）。`, hints: [R`平面面积积分是 $\int_1^\infty(\ln x)/x\,dx$；体积要平方半径。`,R`面积原函数是 $(\ln x)^2/2$。体积令 $u=\ln x$，化为 $\pi\int_0^\infty u^2e^{-u}du$。`,R`后一个积分分部两次，边界 $u^ke^{-u}$ 都趋零。`], method: "m-review-route", sol: R`<p>截断平面面积 $A(R)=\int_1^R(\ln x)/x\,dx=(\ln R)^2/2\to\infty$，所以平面面积无限。</p><p>旋转体体积为 $V=\pi\int_1^\infty(\ln x)^2/x^2\,dx$。令 $u=\ln x$，得到 $V=\pi\int_0^\infty u^2e^{-u}du$。在有限区间上分部并取极限：</p>$$\int_0^\infty u^2e^{-u}du=2\int_0^\infty ue^{-u}du=2\int_0^\infty e^{-u}du=2.$$
      <p>故体积有限，值为 $2\pi$。边界项 $u^2e^{-u}$ 与 $ue^{-u}$ 在无穷远都趋零，不能省略这项核对。</p>` }
  ],
  variants: [
    { id: "r1-v1", lv: "变种", src: "自编：积分上限改变尺度", stmt: R`计算 $$\lim_{x\to0}\frac{\displaystyle\int_0^{x^2}(e^t-1-t)dt}{x^6}.$$`, hints: [R`$e^t-1-t=t^2/2+o(t^2)$。`,R`先用上限 s 表示积分是 $s^3/6+o(s^3)$。`,R`最后代 $s=x^2$，不能把被积式直接代 x。`], method: "m-review-route", sol: R`<p>令 $s=x^2\ge0$，积分为 $s^3/6+o(s^3)$。因此原分子 $=x^6/6+o(x^6)$，极限为 $1/6$。也可以在 $x\ne0$ 的两侧用基本定理求导，但链式因子 $2x$ 不能遗漏。</p>` },
    { id: "r1-v2", lv: "变种", src: "自编：几何积分的参数阈值", stmt: R`设 $p\gt0$。由 $x\ge1$、$0\le y\le x^{-p}$ 围成的无限区域，平面面积有限与绕 x 轴旋转后的体积有限，分别要求什么条件？找出面积无限而体积有限的全部 p。`, hints: [R`平面面积用 $\int x^{-p}dx$，体积用 $\pi\int x^{-2p}dx$。`,R`无穷远指数必须严格大于 1。`,R`同时要求 $p\le1$ 与 $2p\gt1$。`], method: "m-review-route", sol: R`<p>面积有限当且仅当 $p\gt1$，体积有限当且仅当 $p\gt1/2$。因此面积无限、体积有限的全部参数是 $1/2\lt p\le1$。$p=1$ 时面积对数发散而体积有限，$p=1/2$ 时体积也对数发散。</p>` }
  ],
  extensions: [
    { id: "r1-e1", lv: "延伸", src: "自编：对数临界与几何结合", stmt: R`设 $q$ 为实数，考虑 $x\ge e$、$0\le y\le[x(\ln x)^q]^{-1/2}$ 的区域。判断绕 x 轴所得体积何时有限，有限时求值；平面面积是否可能有限？`, hints: [R`体积积分是 $\pi\int_e^\infty dx/[x(\ln x)^q]$，用 $u=\ln x$。`,R`体积有限条件 $q\gt1$，值 $\pi/(q-1)$。`,R`平面面积换元 $x=e^u$ 后为 $\int_1^\infty e^{u/2}u^{-q/2}du$，指数增长压过任意多项式。`], method: "m-review-route", sol: R`<p>体积 $V=\pi\int_e^\infty dx/[x(\ln x)^q]=\pi\int_1^\infty u^{-q}du$，故当且仅当 $q\gt1$ 有限，值为 $\pi/(q-1)$。</p><p>平面面积为 $\int_1^\infty e^{u/2}u^{-q/2}du$。任给固定 q，该被积函数随 $u\to\infty$ 趋于 $\infty$：取对数 $u/2-(q/2)\ln u\to\infty$。于是充分大时它至少为 1，面积积分发散。故对所有实 q，平面面积都无限。</p>` }
  ]
},
l1: {
 unit:'review',n:1,title:'极限证明回顾：ε–N、单调有界与 Cauchy',
 goal:'把“趋近”写成可检查的不等式；会选N、证明递推数列收敛，并用绝对值控制Cauchy尾差。约30分钟先做概念和两道基础，变种与延伸选做。',
 sections:[
 {id:'l1-s1',h:'1. ε先给，N后选，最后才对所有n成立',html:R`<p>$a_n\to A$ 指：对每个 $\varepsilon\gt0$，存在整数 $N$，使所有 $n\ge N$ 都满足 $|a_n-A|\lt\varepsilon$。$N$ 可依赖 $\varepsilon$，不能依赖后面才出现的 $n$。</p><p>例：$a_n=(3n+1)/(n+2)$，$|a_n-3|=5/(n+2)$。取 $N=\max\{1,\lfloor5/\varepsilon\rfloor+1\}$ 即足够。先倒推“要多大”，正式证明再正向写“给定、取、于是”。</p>`},
 {id:'l1-s2',h:'2. 递推数列：先证明界与单调，再对极限代入',html:R`<p>$x_1=1$，$x_{n+1}=\sqrt{2+x_n}$。归纳得 $1\le x_n\lt2$。且对 $1\le x\lt2$，$2+x-x^2=(2-x)(x+1)\gt0$，故 $\sqrt{2+x}\gt x$。单调有界给出极限 $L$，连续性才允许写 $L=\sqrt{2+L}$，取区间中的根 $L=2$。</p><p>不能只解不动点方程就宣布收敛：$a_n=(-1)^n$ 有界却不收敛；递推 $a_{n+1}=-a_n$ 的不动点为0，也不代表从任意初值会趋于0。</p>`},
 {id:'l1-s3',h:'3. Cauchy：两下标都要大，尾差先取绝对值',html:R`<p>实数列是 Cauchy 列，指对每个 $\varepsilon\gt0$，存在 $N$，使 $m,n\ge N$ 时 $|a_m-a_n|\lt\varepsilon$。实数完备性保证它等价于收敛。</p><p>若 $s_n=\sum_{k=1}^n1/k^2$，不妨 $m\gt n$，则</p>$$|s_m-s_n|=\sum_{k=n+1}^m\frac1{k^2}\le\sum_{k=n+1}^m\left(\frac1{k-1}-\frac1k\right)=\frac1n-\frac1m\lt\frac1n.$$
 <p>取 $N\gt1/\varepsilon$ 即得。切忌用 $a_m-a_n\lt\varepsilon$ 代替绝对值，负的大差值也可能满足那个不等式。相邻差趋零也远远不够，调和部分和就是反例。</p>`}],
 widget:'epsilonLab',
 concepts:[
 {id:'l1-c1',sec:'l1-s1',q:R`ε–N定义里，N允许依赖谁？`,opts:[R`ε`,R`后面量化的n`,R`同时依赖每个n`,R`必须是固定常数，与ε无关`],a:0,ex:R`量词顺序是每个ε，存在N，对所有n≥N；选N时尚未给定后面的n。`},
 {id:'l1-c2',sec:'l1-s2',q:R`解出递推的不动点以后，还缺哪一步才能据此求数列极限？`,opts:[R`再多算十项`,R`先证明数列确实收敛`,R`去掉所有负根即可`,R`不缺，必然收敛`],a:1,ex:R`不动点方程只是“若收敛，可能趋于谁”；通常先用单调有界或Cauchy证明存在极限。`},
 {id:'l1-c3',sec:'l1-s3',q:R`$a_{n+1}-a_n\to0$ 能否推出收敛？`,opts:[R`能`,R`有界时一定能`,R`不能，例如调和部分和`,R`若差为正就能`],a:2,ex:R`调和部分和相邻差为1/(n+1)→0，但对任意n，后n项之和至少1/2，故不是Cauchy列。`},
 {id:'l1-c4',sec:'l1-s3',q:R`Cauchy定义控制的是：`,opts:[R`只控制相邻两项`,R`一个固定n与所有m的差`,R`所有足够大的m、n之间的绝对差`,R`数列各项的绝对值必须小于ε`],a:2,ex:R`两下标都要进入同一个尾段，且必须用绝对值；它不要求数列趋于0。`}],
 methods:[{id:'m-epsilon-tail',title:'ε–N：把误差压进ε',steps:[R`写出绝对误差并化简，找随n趋零的统一上界。`,R`反解上界小于ε需要的n，取整数N并处理定义域。`,R`正向写给定ε、选择N、任意n≥N的估计。`]},{id:'m-sequence-rec',title:'递推收敛：界、单调、极限',steps:[R`归纳证明每一项留在同一区间。`,R`证明单调或直接给出Cauchy估计，先取得收敛性。`,R`由连续性代极限，按初值与区间筛根，再核对收敛速度。`]}],
 problems:[
 {id:'l1-p1',lv:'基础',src:'自编：ε–N定量练习',stmt:R`用定义证明 $(3n+1)/(n+2)\to3$，并给出 ε=0.01 时可用的N。`,hints:[R`误差化成5/(n+2)。`,R`只要n>5/ε，就有5/(n+2)<ε。`,R`取N=max{1,⌊5/ε⌋+1}；ε=0.01时N=501。`],method:'m-epsilon-tail',sol:R`<p>给定ε>0，取 $N=\max\{1,\lfloor5/\varepsilon\rfloor+1\}$。对任意 $n\ge N$，有 $n\gt5/\varepsilon$，故 $|(3n+1)/(n+2)-3|=5/(n+2)\lt\varepsilon$。ε=0.01时取N=501足够（不是最小N）。</p>`},
 {id:'l1-p2',lv:'基础',src:'自编：根式递推与误差',stmt:R`$x_1=1$，$x_{n+1}=\sqrt{2+x_n}$。证明收敛并求极限，再证明 $0\lt2-x_n\le3^{1-n}$。`,hints:[R`归纳得1≤x_n<2，再比较2+x_n与x_n²。`,R`单调有界后解L²-L-2=0，L≥1。`,R`有理化：2-x_{n+1}=(2-x_n)/(2+√(2+x_n))≤(2-x_n)/3。`],method:'m-sequence-rec',sol:R`<p>若1≤x_n<2，则1<√(2+x_n)<2，故界成立。又 $(2-x_n)(x_n+1)\gt0$，给 $x_{n+1}\gt x_n$。单调有界，存在L∈[1,2]，由连续性L=√(2+L)，故L=2。</p><p>有理化给 $0\lt2-x_{n+1}=(2-x_n)/(2+\sqrt{2+x_n})\le(2-x_n)/3$。从2-x_1=1迭代，得所求 $2-x_n\le3^{1-n}$。</p>`}],
 variants:[
 {id:'l1-v1',lv:'变种',src:'自编：不求和也能证收敛',stmt:R`用Cauchy准则证明 $s_n=\sum_{k=1}^n1/k^2$ 收敛；无需求极限值。`,hints:[R`不妨m>n，只估尾和。`,R`对k≥2，1/k²≤1/(k-1)-1/k。`,R`尾和<1/n；取N>1/ε。`],method:'m-epsilon-tail',sol:R`<p>给定ε>0，取N>1/ε。若m 大于 n≥N，则 $|s_m-s_n|\le\sum_{k=n+1}^m(1/(k-1)-1/k)=1/n-1/m\lt1/n\lt\varepsilon$。m=n 差为0，m 小于 n 时交换下标即可。故为实数Cauchy列，因而收敛。</p>`},
 {id:'l1-v2',lv:'变种',src:'自编：相邻差反例',stmt:R`用Cauchy准则证明调和部分和 $h_n=\sum_{k=1}^n1/k$ 不收敛，并说明相邻差趋零为什么不能代替Cauchy准则。`,hints:[R`比较h_{2n}与h_n。`,R`后n项每一项至少1/(2n)。`,R`对ε=1/2，无论N多大，选n≥N、m=2n。`],method:'m-epsilon-tail',sol:R`<p>$h_{2n}-h_n=\sum_{k=n+1}^{2n}1/k\ge n/(2n)=1/2$。取ε=1/2，任何N都能选n≥N和m=2n，使差不小于ε，所以不是Cauchy列，不收敛。尽管 $h_{n+1}-h_n=1/(n+1)\to0$，长尾段中许多小差仍能累积成固定大小。</p>`}],
 extensions:[{id:'l1-e1',lv:'延伸',src:'自编：Cauchy列的子列判定',stmt:R`设实数列a_n为Cauchy列，且有子列a_{n_k}→A。直接用定义证明a_n→A。`,hints:[R`把|a_n-A|拆成|a_n-a_{n_k}|+|a_{n_k}-A|。`,R`Cauchy尾差取ε/2；子列也取ε/2。`,R`先固定一个足够大的k，使n_k进入Cauchy尾段且子列误差足够小，再对所有n≥N估计。`],method:'m-epsilon-tail',sol:R`<p>给定ε>0，由Cauchy性选N，使m,n≥N 时差<ε/2。由子列趋A，固定一个足够大的k，使n_k≥N且|a_{n_k}-A|<ε/2。于是任意n≥N都有 $|a_n-A|\le|a_n-a_{n_k}|+|a_{n_k}-A|\lt\varepsilon$，即a_n→A。</p>`}]
},
l2: {
 unit:'review',n:2,title:'一致连续回顾：统一δ与明确的反例点对',goal:'会分辨连续与一致连续的量词，会用导数界、平方根估计和紧区间定理；写否定时给出同一ε₀及明确点对。约30分钟，延伸选做。',
 sections:[
 {id:'l2-s1',h:'1. 一致的意思：δ不随位置移动',html:R`<p>在集合D上一致连续指：每个ε>0都有δ>0，使所有x,y∈D只要|x-y|<δ，就有|f(x)-f(y)|<ε。δ可依赖ε与固定的D，不能依赖当前选的x或y。</p><p>否定：存在一个ε₀>0，使对每个δ>0都能在D内找x,y，满足|x-y|<δ但|f(x)-f(y)|≥ε₀。用序列可等价写成|x_n-y_n|→0而函数值差始终≥ε₀。不要只说“导数无界所以不一致连续”，平方根就是反例。</p>`},
 {id:'l2-s2',h:'2. 两种统一估计与紧区间定理',html:R`<p>若D是区间，且|f′|≤M，则中值定理给|f(x)-f(y)|≤M|x-y|。M>0时取δ=ε/M；M=0时函数常值。另一个常用估计是</p>$$|\sqrt x-\sqrt y|\le\sqrt{|x-y|}\qquad(x,y\ge0),$$
 <p>所以平方根在整个[0,∞)上一致连续，取δ=ε²；其在0附近导数无界仍不妨碍结论。连续函数在闭有界区间上一致连续；只有“有界”或“闭”任一条件都不能替代紧性。</p>`},
 {id:'l2-s3',h:'3. 反例点对：越往危险区域，距离越近',html:R`<p>x²在R上不一致连续：取x_n=n，y_n=n+1/n，则距离1/n→0，函数值差2+1/n²≥2。1/x在(0,1)上不一致连续：取x_n=1/n、y_n=1/(n+1)（n≥2），距离1/[n(n+1)]→0，函数值差恰为1。</p><p>同一个函数换定义域，答案可能改变：1/x在[1,∞)上有|1/x-1/y|=|x-y|/(xy)≤|x-y|，所以一致连续。下方工具把输入距离与输出距离并排显示，图形只作提示，证明仍要给出统一估计或明确点对。</p>`}],
 widget:'uniformLab',
 concepts:[
 {id:'l2-c1',sec:'l2-s1',q:R`一致连续的δ不能依赖于：`,opts:[R`ε`,R`固定的定义域D`,R`当前点x`,R`预先给定的函数f`],a:2,ex:R`δ必须统一适用于D中的所有点对；它可由f、D和ε确定。`},
 {id:'l2-c2',sec:'l2-s2',q:R`导数无界是否一定不一致连续？`,opts:[R`是`,R`否，√x在[0,∞)上一致连续`,R`只有闭区间上是`,R`仅递增函数时是`],a:1,ex:R`|√x−√y|≤√|x−y|提供统一δ。导数有界是常用充分条件，不能反过来当必要条件。`},
 {id:'l2-c3',sec:'l2-s3',q:R`要否定一致连续，以下哪种证据足够？`,opts:[R`函数值很大`,R`找到一个很陡的点`,R`点对距离趋零，函数值差始终至少一个固定正数`,R`每个δ都有一对函数值不相等`],a:2,ex:R`要固定同一个正ε₀，再对任意小距离找坏点对；仅仅函数值不相等并不能阻止差趋零。`},
 {id:'l2-c4',sec:'l2-s2',q:R`连续函数一定在哪类区间上一致连续？`,opts:[R`任意有界开区间`,R`任意闭区间，包括无界的`,R`闭有界区间`,R`任意区间`],a:2,ex:R`Heine–Cantor定理用的是紧区间。1/x在(0,1)与x²在[0,∞)分别说明缺端点或缺有界性时不能直接推出。`}],
 methods:[{id:'m-uniform-bound',title:'证一致连续：统一估计',steps:[R`先注明定义域；优先找Lipschitz或Hölder估计。`,R`解出只依赖ε的δ，不能留下当前x。`,R`若用紧区间定理，明确闭、有界、连续三项条件。`]},{id:'m-uniform-counter',title:'否定一致连续：固定ε₀和点对',steps:[R`找端点奇性或无穷远增长，选两列域内点。`,R`证明输入距离趋零，输出距离却有同一个正下界。`,R`写出固定ε₀，对任意δ选足够大的n完成反例。`]}],
 problems:[
 {id:'l2-p1',lv:'基础',src:'自编：平方根的统一估计',stmt:R`证明f(x)=√x在[0,∞)上一致连续，并给出可用的δ(ε)。`,hints:[R`不妨x≥y≥0。比较(√x−√y)²与x−y。`,R`x−y=(√x−√y)(√x+√y)≥(√x−√y)²。`,R`函数差≤√|x−y|，可取δ=ε²。`],method:'m-uniform-bound',sol:R`<p>对x≥y≥0，由√x+√y≥√x−√y≥0得 $(\sqrt x-\sqrt y)^2\le x-y$。交换点同样成立，故 $|\sqrt x-\sqrt y|\le\sqrt{|x-y|}$。给定ε>0，取δ=ε²，若距离<δ，函数差<ε，δ不依赖位置，故一致连续。</p>`},
 {id:'l2-p2',lv:'基础',src:'自编：同函数不同定义域',stmt:R`分别判断f(x)=1/x在(0,1)和[1,∞)上是否一致连续，给出证明。`,hints:[R`(0,1)内看x_n=1/n，y_n=1/(n+1)，n≥2。`,R`输出差恰为1。`,R`[1,∞)内，xy≥1，直接估计|1/x−1/y|。`],method:'m-uniform-counter',sol:R`<p>(0,1)上不一致连续：n≥2时两点在域内，距离1/[n(n+1)]→0，而输出差1。固定ε₀=1/2，对任意δ取足够大n即可。</p><p>[1,∞)上一致连续：|1/x−1/y|=|x−y|/(xy)≤|x−y|，取δ=ε即可。定义域无界并不必然否定一致连续。</p>`}],
 variants:[
 {id:'l2-v1',lv:'变种',src:'自编：无穷远的反例点对',stmt:R`证明x²在R上不一致连续；再判断sin x在R上是否一致连续。`,hints:[R`x²用n与n+1/n。`,R`输出差2+1/n²；固定ε₀=1。`,R`sin的导数绝对值≤1，应用中值定理。`],method:'m-uniform-counter',sol:R`<p>令x_n=n、y_n=n+1/n，输入差趋零，输出差2+1/n²≥2，取ε₀=1即否定x²的一致连续性。对sin x，由中值定理|sin x−sin y|≤|x−y|，取δ=ε，故在R上一致连续。</p>`},
 {id:'l2-v2',lv:'变种',src:'自编：复合后的振荡加速',stmt:R`证明sin(x²)在R上不一致连续。`,hints:[R`找函数值分别为0和1的正数点。`,R`取x_n=√(2πn)，y_n=√(2πn+π/2)。`,R`有理化距离为(π/2)/(√(2πn+π/2)+√(2πn))→0。`],method:'m-uniform-counter',sol:R`<p>按提示选点，则sin(x_n²)=0、sin(y_n²)=1。距离有理化后趋零，输出差恒为1。固定ε₀=1/2，对任意δ可取足够大n，故不一致连续。两个连续函数的复合仍连续，却不能据此推出在无界域上一致连续。</p>`}],
 extensions:[{id:'l2-e1',lv:'延伸',src:'自编：一致连续的Cauchy像',stmt:R`设f在D上一致连续，(x_n)是D内的Cauchy列，证明(f(x_n))为Cauchy列。说明x_n的极限不必属于D。`,hints:[R`给定ε后先由一致连续选δ。`,R`再由x_n为Cauchy列选N，使m,n≥N 时距离<δ。`,R`结论只用域内点对，不需要先求x_n的极限。`],method:'m-uniform-bound',sol:R`<p>给定ε>0，由一致连续性选δ>0，使域内两点距离<δ时输出差<ε。由x_n的Cauchy性选N，使m,n≥N 时|x_m−x_n|<δ。于是输出差<ε，故f(x_n)为Cauchy列。证明不要求x_n的极限在D内；若f仅逐点连续，则δ会依赖点，不能如此统一选N。</p>`}]
},
"mock1":{"unit":R`mock`,"n":1,"duration":120,"kind":R`mock`,"title":R`综合模拟卷 1（120 分钟 · 100 分）`,"goal":R`按当前已整理的核心范围自编，覆盖全程方法。建议先独立限时120分钟完成六大题，再打开提示和解答评分；微分方程与级数另列“可能不考”选做课，不将范围未确认的内容设为必答。`,"sections":[{"id":R`mock1-s1`,"h":R`考试安排`,"html":R`<p>六大题共100分，建议120分钟。先读完一遍，按把握分配时间；前90分钟完成主线，最后30分钟补证明、查符号与边界。计时器可暂停，不自动提交或改写答案。</p>`},{"id":R`mock1-s2`,"h":R`评分与回炉`,"html":R`<p>每题把分值大致按“建立方法约三分之一、有效推导约一半、结论与条件约六分之一”自评。结果错但关键方法正确时保留过程分；缺少收敛性、端点或等号说明时扣相应论证分。用作复盘参考，不冒充官方评分标准。</p>`}],"widget":R`examClock`,"concepts":[{"id":R`mock1-c1`,"sec":R`mock1-s1`,"q":R`本次模拟最合适的使用方式是：`,"opts":[R`开卷逐题照抄`,R`先限时独立作答，再开提示与解答`,R`只看最后答案`,R`遇到一题卡住就耗完全部时间`],"a":1,"ex":R`这样才能区分知识缺口与限时表达问题。`},{"id":R`mock1-c2`,"sec":R`mock1-s2`,"q":R`复盘发现答案数值相同，但证明漏了必要条件，应如何处理？`,"opts":[R`一律算满分`,R`只记下正确数字`,R`标出缺口并补齐条件与推导`,R`删除原作答`],"a":2,"ex":R`模拟的作用是发现可修复的失分点；保留原作答，再补写第一处缺口。`}],"methods":[{"id":R`m-mock1-audit`,"title":R`模拟卷复盘：按得分点定位第一处错误`,"steps":[R`限时先做能完整写出的题；计算题保留关键变换，证明题明确所用定理条件。`,R`结束后才打开提示和解答，逐题按分值核对；只写结论不算完成证明。`,R`把失分归为方法选择、计算、条件或边界遗漏，次日用同方法的新题重做。`]}],"problems":[{"id":R`mock1-p1`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`计算 $\displaystyle\lim_{x\to0}\frac{\int_0^xe^{t^2}dt-x}{x-\sin x}$。`,"hints":[R`$e^{t^2}=1+t^2+o(t^2)$。`,R`积分后分子为$x^3/3+o(x^3)$。`,R`分母为$x^3/6+o(x^3)$。`],"method":R`m-mock1-audit`,"sol":R`<p>由积分余项估计，分子为$x^3/3+o(x^3)$，分母为$x^3/6+o(x^3)$，比值趋于2。对负x同样成立。</p>`},{"id":R`mock1-p2`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`设 $f\in C^1([0,1])$，$f(0)=f(1)=0$ 且 $\int_0^1f=0$。证明存在两个不同的内点 $\xi,\eta$，使 $f′(\xi)=f′(\eta)=0$。`,"hints":[R`若f恒零直接成立；否则证明它既取正值也取负值。`,R`连续非负且不恒零会有正积分，所以必须变号。`,R`在两个异号点之间找内零点c，再在[0,c]与[c,1]用Rolle。`],"method":R`m-mock1-audit`,"sol":R`<p>若f恒零任选两个不同内点。否则，由连续性与积分为零，f不可能恒非负或恒非正：若恒非负且某点正，则一个小邻域上有正下界，积分为正，矛盾。故有两个异号内点，由介值定理在两者之间有c∈(0,1)使f(c)=0。分别在[0,c]、[c,1]用Rolle，得ξ∈(0,c)、η∈(c,1)，它们不同且导数为零。</p>`},{"id":R`mock1-p3`,"lv":R`模拟·20分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`<p>(1) 计算 $\int_0^1x^3\ln(1+x^2)dx$。</p><p>(2) 计算 $\int_0^{\infty}\frac{x}{(1+x^2)^2}dx$，须说明反常积分的极限过程。</p>`,"hints":[R`(1) u=x²，变成一半的∫u ln(1+u)。`,R`分部，或再令v=1+u。(2) u=1+x²。`,R`(1)值为1/8；(2)先积至R，得到(1−1/(1+R²))/2。`],"method":R`m-mock1-audit`,"sol":R`<p>(1) 令u=x²，原式为$\frac12\int_0^1u\ln(1+u)du$。再令v=1+u，原函数为$\frac12[(v^2/2-v)\ln v-v^2/4+v]$。代入v=1、2，得1/8。</p><p>(2) 截断上限R，换元得$\int_0^R x/(1+x^2)^2dx=\frac12[1-1/(1+R^2)]$。R→∞时趋于1/2，故收敛且值为1/2。</p>`},{"id":R`mock1-p4`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`判断 $\int_1^{\infty}(\sqrt{x^2+1}-x)dx$ 的敛散性，并说明理由。`,"hints":[R`有理化避免相消。`,R`被积函数等于1/(√(x²+1)+x)。`,R`与1/x的比趋于1/2，且被积函数为正。`],"method":R`m-mock1-audit`,"sol":R`<p>有理化后 $x(\sqrt{x^2+1}-x)=1/(\sqrt{1+1/x^2}+1)\to1/2$。由正函数的极限比较，原积分与$\int_1^\infty dx/x$同敛散，因此发散至正无穷。被积函数趋于0并不足以保证可积。</p>`},{"id":R`mock1-p5`,"lv":R`模拟·20分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`设 $f\in C^2([0,1])$，$f(0)=f(1)=0$，且 $2\le f″(x)\le6$。求 $\int_0^1 f(x)dx$ 的最佳上下界，并给取界函数。`,"hints":[R`令q=x(x−1)，q″=2。`,R`f−q凸且端点0，故f≤q；f−3q凹且端点0，故f≥3q。`,R`∫q=−1/6，得到−1/2≤∫f≤−1/6。`],"method":R`m-mock1-audit`,"sol":R`<p>令q=x(x−1)。由f″−2≥0，f−q凸且两端为0，故f−q≤0。由f″−6≤0，f−3q凹且两端为0，故f−3q≥0。因此3q≤f≤q。积分得$-1/2\le\int_0^1f\le-1/6$。下界由f=3q取到，上界由f=q取到，均满足所有条件，所以是最佳界。</p>`},{"id":R`mock1-p6`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`求极坐标曲线 $r=1+\cos\theta$（$0\le\theta\le2\pi$）围成区域的面积。`,"hints":[R`曲线r≥0，除原点外由一周期描一遍。`,R`面积为一半的∫(1+cosθ)²。`,R`∫cosθ=0，∫cos²θ=π。`],"method":R`m-mock1-audit`,"sol":R`<p>用极坐标面积公式，$A=\frac12\int_0^{2\pi}(1+\cos\theta)^2d\theta=\frac12(2\pi+0+\pi)=3\pi/2$。r非负且一周期描完整边界，不能再额外乘2。</p>`}],"variants":[],"extensions":[]},
"mock2":{"unit":R`mock`,"n":2,"duration":120,"kind":R`mock`,"title":R`综合模拟卷 2（120 分钟 · 100 分）`,"goal":R`按当前已整理的核心范围自编，覆盖全程方法。建议先独立限时120分钟完成六大题，再打开提示和解答评分；微分方程与级数另列“可能不考”选做课，不将范围未确认的内容设为必答。`,"sections":[{"id":R`mock2-s1`,"h":R`考试安排`,"html":R`<p>六大题共100分，建议120分钟。先读完一遍，按把握分配时间；前90分钟完成主线，最后30分钟补证明、查符号与边界。计时器可暂停，不自动提交或改写答案。</p>`},{"id":R`mock2-s2`,"h":R`评分与回炉`,"html":R`<p>每题把分值大致按“建立方法约三分之一、有效推导约一半、结论与条件约六分之一”自评。结果错但关键方法正确时保留过程分；缺少收敛性、端点或等号说明时扣相应论证分。用作复盘参考，不冒充官方评分标准。</p>`}],"widget":R`examClock`,"concepts":[{"id":R`mock2-c1`,"sec":R`mock2-s1`,"q":R`本次模拟最合适的使用方式是：`,"opts":[R`开卷逐题照抄`,R`先限时独立作答，再开提示与解答`,R`只看最后答案`,R`遇到一题卡住就耗完全部时间`],"a":1,"ex":R`这样才能区分知识缺口与限时表达问题。`},{"id":R`mock2-c2`,"sec":R`mock2-s2`,"q":R`复盘发现答案数值相同，但证明漏了必要条件，应如何处理？`,"opts":[R`一律算满分`,R`只记下正确数字`,R`标出缺口并补齐条件与推导`,R`删除原作答`],"a":2,"ex":R`模拟的作用是发现可修复的失分点；保留原作答，再补写第一处缺口。`}],"methods":[{"id":R`m-mock2-audit`,"title":R`模拟卷复盘：按得分点定位第一处错误`,"steps":[R`限时先做能完整写出的题；计算题保留关键变换，证明题明确所用定理条件。`,R`结束后才打开提示和解答，逐题按分值核对；只写结论不算完成证明。`,R`把失分归为方法选择、计算、条件或边界遗漏，次日用同方法的新题重做。`]}],"problems":[{"id":R`mock2-p1`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`计算 $\displaystyle\lim_{x\to0}\frac{\ln(1+x)-x+x^2/2}{\int_0^xt^2e^t dt}$。`,"hints":[R`分子已消去一、二阶。`,R`分子为x³/3+o(x³)。`,R`分母由t²e^t=t²+o(t²)，积分也是x³/3+o(x³)。`],"method":R`m-mock2-audit`,"sol":R`<p>分子由Taylor为$x^3/3+o(x^3)$；分母为$\int_0^x(t^2+o(t^2))dt=x^3/3+o(x^3)$。故极限为1，两侧成立。</p>`},{"id":R`mock2-p2`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`设 $a_1=1$，$a_{n+1}=(a_n+2/a_n)/2$。证明它收敛并求极限，给出 $a_{n+1}-\sqrt2$ 的误差恒等式。`,"hints":[R`a₂=3/2，从n≥2起用均值不等式证明a_n≥√2。`,R`对a≥√2，(a+2/a)/2≤a。`,R`有理化整理得a_{n+1}−√2=(a_n−√2)²/(2a_n)。`],"method":R`m-mock2-audit`,"sol":R`<p>全部项为正，a₂=3/2。由均值不等式，每次更新均至少为√2，故n≥2时a_n≥√2；此时a_{n+1}−a_n=(2−a_n²)/(2a_n)≤0。尾列单调有界，存在正极限L，代入L=(L+2/L)/2得L=√2。</p><p>直接展开得$a_{n+1}-\sqrt2=(a_n-\sqrt2)^2/(2a_n)$，说明误差在接近极限时按平方缩小。a₁不在√2上方，不可声称整列从第一项起递减。</p>`},{"id":R`mock2-p3`,"lv":R`模拟·20分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`求 $\int\frac{x^2}{(1+x^2)^2}dx$，并计算对应的 $[0,1]$ 定积分。`,"hints":[R`把x²写成(1+x²)−1。`,R`可验证原函数为(atan x−x/(1+x²))/2。`,R`用求导核验，再代0、1。`],"method":R`m-mock2-audit`,"sol":R`<p>设$P(x)=\frac12(\arctan x-x/(1+x^2))$，求导得$P′=\frac12[1/(1+x^2)-(1-x^2)/(1+x^2)^2]=x^2/(1+x^2)^2$。所以不定积分为P+C，全实轴成立。定积分为$\pi/8-1/4$。</p>`},{"id":R`mock2-p4`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`对实数p，讨论 $\int_e^{\infty}\frac{dx}{x(\ln x)^p}$ 的敛散性，并在收敛时求值。`,"hints":[R`令u=ln x，变成∫₁∞u^(−p)du。`,R`p=1要单独使用ln u。`,R`p>1收敛，值1/(p−1)；p≤1发散。`],"method":R`m-mock2-audit`,"sol":R`<p>对截断上限R令u=ln x，积分为$\int_1^{\ln R}u^{-p}du$。p≠1时为$[(\ln R)^{1-p}-1]/(1-p)$；p=1时为ln ln R。故p>1收敛且为1/(p−1)，p≤1发散至正无穷。临界p=1不能从一般幂公式直接代入。</p>`},{"id":R`mock2-p5`,"lv":R`模拟·20分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`连续实函数f满足 $\int_0^1x^2f(x)dx=1$。求 $\int_0^1f(x)^2dx$ 的最小值及全部取等函数。`,"hints":[R`对x²与f用Cauchy。`,R`∫₀¹x⁴=1/5，所以平方积分至少5。`,R`等号时f=cx²；约束给c=5。`],"method":R`m-mock2-audit`,"sol":R`<p>由Cauchy，$1=(\int_0^1x^2f)^2\le(\int_0^1x^4)(\int_0^1f^2)=\frac15\int_0^1f^2$，故下界5。等号要求f与x²线性相关，写f=cx²，约束给c/5=1，即f=5x²；它的平方积分为25/5=5，故最小值5且取等函数唯一。</p>`},{"id":R`mock2-p6`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`把 $0\le x\le1$、$0\le y\le x(1-x)$ 的区域绕x轴旋转，求体积。令V(t)为只旋转0≤x≤t部分的体积（0≤t≤1），求内点拐点。`,"hints":[R`圆盘法：V(t)=π∫₀ᵗx²(1−x)²dx。`,R`总量π(1/3−1/2+1/5)。`,R`V″(t)=2πt(1−t)(1−2t)，在1/2两侧变号。`],"method":R`m-mock2-audit`,"sol":R`<p>$V(t)=\pi(t^3/3-t^4/2+t^5/5)$，故总量V(1)=π/30。由$V″(t)=2\pi t(1-t)(1-2t)$，在(0,1/2)为正，在(1/2,1)为负，故内点拐点的横坐标是t=1/2，对应V=π/60。端点不是本题所问的内点拐点。</p>`}],"variants":[],"extensions":[]},
"mock3":{"unit":R`mock`,"n":3,"duration":120,"kind":R`mock`,"title":R`综合模拟卷 3（120 分钟 · 100 分）`,"goal":R`按当前已整理的核心范围自编，覆盖全程方法。建议先独立限时120分钟完成六大题，再打开提示和解答评分；微分方程与级数另列“可能不考”选做课，不将范围未确认的内容设为必答。`,"sections":[{"id":R`mock3-s1`,"h":R`考试安排`,"html":R`<p>六大题共100分，建议120分钟。先读完一遍，按把握分配时间；前90分钟完成主线，最后30分钟补证明、查符号与边界。计时器可暂停，不自动提交或改写答案。</p>`},{"id":R`mock3-s2`,"h":R`评分与回炉`,"html":R`<p>每题把分值大致按“建立方法约三分之一、有效推导约一半、结论与条件约六分之一”自评。结果错但关键方法正确时保留过程分；缺少收敛性、端点或等号说明时扣相应论证分。用作复盘参考，不冒充官方评分标准。</p>`}],"widget":R`examClock`,"concepts":[{"id":R`mock3-c1`,"sec":R`mock3-s1`,"q":R`本次模拟最合适的使用方式是：`,"opts":[R`开卷逐题照抄`,R`先限时独立作答，再开提示与解答`,R`只看最后答案`,R`遇到一题卡住就耗完全部时间`],"a":1,"ex":R`这样才能区分知识缺口与限时表达问题。`},{"id":R`mock3-c2`,"sec":R`mock3-s2`,"q":R`复盘发现答案数值相同，但证明漏了必要条件，应如何处理？`,"opts":[R`一律算满分`,R`只记下正确数字`,R`标出缺口并补齐条件与推导`,R`删除原作答`],"a":2,"ex":R`模拟的作用是发现可修复的失分点；保留原作答，再补写第一处缺口。`}],"methods":[{"id":R`m-mock3-audit`,"title":R`模拟卷复盘：按得分点定位第一处错误`,"steps":[R`限时先做能完整写出的题；计算题保留关键变换，证明题明确所用定理条件。`,R`结束后才打开提示和解答，逐题按分值核对；只写结论不算完成证明。`,R`把失分归为方法选择、计算、条件或边界遗漏，次日用同方法的新题重做。`]}],"problems":[{"id":R`mock3-p1`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`<p>(1) 求 $\lim_{x\to0}(\sin x-x+x^3/6)/x^5$。</p><p>(2) 求 $\lim_{x\to0}\int_0^x(\cos(t^2)-1)dt/x^5$。</p>`,"hints":[R`(1)sin保留到五阶；(2)cos(t²)保留到t⁴。`,R`两项的首项分别为x⁵/120与−x⁵/10。`,R`积分余项用|r(t)|≤ε|t|⁴控制。`],"method":R`m-mock3-audit`,"sol":R`<p>(1) sin展开给分子x⁵/120+o(x⁵)，极限1/120。(2) cos(t²)−1=−t⁴/2+o(t⁴)，积分为−x⁵/10+o(x⁵)，极限−1/10。注意积分使幂次升一，系数还要除以新幂次。</p>`},{"id":R`mock3-p2`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`分别判断 $f(x)=\sqrt{x+1}-\sqrt x$ 在[0,∞)上与 $g(x)=\sin(1/x)$ 在(0,1]上的一致连续性，给证明。`,"hints":[R`f的两项都满足平方根的统一估计。`,R`|f(x)−f(y)|≤2√|x−y|。`,R`g用x_n=1/(2πn+π/2)、y_n=1/(2πn+3π/2)，输出差2。`],"method":R`m-mock3-audit`,"sol":R`<p>对f，三角不等式与平方根估计给$|f(x)-f(y)|\le2\sqrt{|x-y|}$，取δ=ε²/4即得一致连续。</p><p>对g，按提示取n≥1的域内点，两点函数值为1与−1，差恒2；输入距离等于$\pi/[(2\pi n+\pi/2)(2\pi n+3\pi/2)]\to0$。固定ε₀=1，对任意δ都可取足够大的n，故g不一致连续。</p>`},{"id":R`mock3-p3`,"lv":R`模拟·20分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`<p>(1) 计算 $\int_0^1\frac{\arctan x}{1+x^2}dx$，并说明首选方法。</p><p>(2) 计算 $\int_0^1\frac{\arctan x}{(1+x^2)^2}dx$。</p>`,"hints":[R`(1) 外层atan，旁边恰有其导数；令u=atan x。`,R`(2) 同一换元后积分变为∫₀^(π/4)u cos²u du。`,R`用cos²u=(1+cos2u)/2，第二部分再分部。`],"method":R`m-mock3-audit`,"sol":R`<p>令u=arctan x，du=dx/(1+x²)，上下限为0、π/4，所以积分为$\int_0^{\pi/4}u\,du=\pi^2/32$。被积式是复合函数乘内导数，直接换元已完成，分部只会把它重新引回同型积分。</p><p>(2) 同样令u=arctan x，原积分为$\int_0^{\pi/4}u\cos^2u\,du$。用半角式并分部得原函数$u^2/4+u\sin2u/4+\cos2u/8$。代端点得$\pi^2/64+\pi/16-1/8$。</p>`},{"id":R`mock3-p4`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`已知 $\int_0^{\infty}\sin t/t\,dt=\pi/2$。证明 $\int_0^{\infty}(1-\cos2x)/x^2\,dx$ 收敛并求值。`,"hints":[R`0附近1−cos2x∼2x²；无穷处绝对值≤2/x²。`,R`先在[ε,R]分部，取dv=dx/x²。`,R`边界项−(1−cos2x)/x在两端极限均为0，剩2∫sin2x/x=π。`],"method":R`m-mock3-audit`,"sol":R`<p>0附近被积函数趋2，无穷处被2/x²控制，故绝对收敛。在[ε,R]分部得到$[-(1-\cos2x)/x]_\varepsilon^R+2\int_\varepsilon^R\sin2x/x\,dx$。两个边界项分别由Taylor与有界性趋0。令t=2x，剩余积分趋$2\int_0^\infty\sin t/t\,dt=\pi$。</p>`},{"id":R`mock3-p5`,"lv":R`模拟·20分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`设 $f\in C^2([0,1])$，$f(0)=f(1)=0$，$\int_0^1f=-1$。证明存在ξ∈(0,1)，使f″(ξ)=12。`,"hints":[R`用权函数w=x(1−x)，两次分部。`,R`∫w f″=−2∫f=2；而∫w=1/6。`,R`f″连续，w在内部恒正，用加权积分中值定理，并说明可取内点。`],"method":R`m-mock3-audit`,"sol":R`<p>令w=x(1−x)，则w端点为0、w″=−2。两次分部并用f端点为0，得$\int_0^1wf″=[wf′]_0^1-[w′f]_0^1+\int_0^1w″f=-2\int_0^1f=2$。又∫w=1/6，因此∫w(f″−12)=0。若内部没有f″=12的点，由连续性和区间连通性，f″−12在内部必恒正或恒负；w>0使积分同号，矛盾。故存在内点ξ使f″(ξ)=12。</p>`},{"id":R`mock3-p6`,"lv":R`模拟·15分`,"src":R`自编模拟题（非历年原卷）`,"stmt":R`求极坐标下同时满足 $0\le r\le2\cos\theta$ 与 $r\ge1$ 的区域面积（取右半平面的表示）。`,"hints":[R`要求2cosθ≥1，所以−π/3≤θ≤π/3。`,R`面积是一半的∫[(2cosθ)²−1]。`,R`被积式4cos²θ−1=1+2cos2θ。`],"method":R`m-mock3-audit`,"sol":R`<p>非空角域为$[-\pi/3,\pi/3]$，每条射线上r从1到2cosθ。因此$A=\frac12\int_{-\pi/3}^{\pi/3}(4\cos^2\theta-1)d\theta=\frac12[\theta+\sin2\theta]_{-\pi/3}^{\pi/3}=\pi/3+\sqrt3/2$。这是圆r=2cosθ内部且单位圆外部的交叠差区域，不应取整圆面积。</p>`}],"variants":[],"extensions":[]},
/* ---------------- O1 ---------------- */
o1: {
  unit: R`ode`,
  n: 1,
  scope: R`可能不考`,
  title: R`可能不考·选做准备：一阶微分方程`,
  goal: R`本学期考纲尚未确认，此课明确为可能不考的选做准备。30分钟主线识别可分离变量与一阶线性方程，练2025秋期末3；不挤占已确认考点的主线时间。`,
  sections: [{
      id: R`o1-s1`,
      h: R`1. 可分离变量：先查常值解，再分离`,
      html: R`<p>方程 $y'=a(x)b(y)$ 若 $b(y)\ne0$，可写成 $dy/b(y)=a(x)dx$，两边积分。<b>先求 $b(c)=0$ 给出的常值解 $y\equiv c$</b>，因为除以 $b(y)$ 会把它们丢掉。</p><p>例：$y'=y$ 的解是 $y=Ce^x$，含 $C=0$；若用 $\ln|y|=x+C_1$ 推导，只得到非零解，最后必须补上零解。积分常数可重命名，但表达式的定义域不能丢。</p>`
    }, {
      id: R`o1-s2`,
      h: R`2. 一阶线性：积分因子让左边成为乘积导数`,
      html: R`<p>标准形 $y'+p(x)y=q(x)$，在 $p,q$ 连续的区间上取正积分因子 $\mu(x)=e^{\int p(x)dx}$，则 $(\mu y)'=\mu q$，所以</p>$$y(x)=\frac1{\mu(x)}\left(C+\int\mu(x)q(x)dx\right).$$<p>例：$y'+y=x^2/2$，乘 $e^x$ 后积分，得 $y=x^2/2-x+1+Ce^{-x}$。最后把求出的函数代回方程核对；有初值时再定 $C$。</p>`
    }, {
      id: R`o1-s3`,
      h: R`3. 非线性也可能经换元变线性`,
      html: R`<p>$y'=xe^y+1$ 看起来既不线性也不可直接分离，但乘 $e^{-y}$ 后可试 $z=e^{-y}$。由于 $z'=-e^{-y}y'$，得到 $z'+z=-x$，这是线性方程。</p><p>解得 $z=1-x+Ce^{-x}$，所以 $y=-\ln(1-x+Ce^{-x})$。<b>仅在括号为正的连通区间上成立</b>。不能把 $-\ln|z|$ 当成同样的反代，因为 $e^{-y}$ 必须为正。工具会显示可分离例子中的有限时间发散边界。</p>`
    }],
  widget: R`odeFirstPlay`,
  concepts: [{
      id: R`o1-c1`,
      sec: R`o1-s1`,
      q: R`将 $y\prime=y(1-y)$ 除以 $y(1-y)$ 前，必须单独检查：`,
      opts: [R`$y\equiv0$ 与 $y\equiv1$`, R`只有 $y\equiv0$`, R`只有 $y\equiv1$`, R`不必检查`],
      a: 0,
      ex: R`这两条常值解都会使被除的因子为零，直接除法会漏解。`
    }, {
      id: R`o1-c2`,
      sec: R`o1-s2`,
      q: R`$y\prime+2y=e^{-x}$ 的积分因子可取：`,
      opts: [R`$e^{-2x}$`, R`$e^{2x}$`, R`$2x$`, R`$e^{-x}$`],
      a: 1,
      ex: R`积分因子满足 $\mu\prime=2\mu$，所以取 $e^{2x}$。`
    }, {
      id: R`o1-c3`,
      sec: R`o1-s3`,
      q: R`令 $z=e^{-y}$，则 $z\prime$ 是：`,
      opts: [R`$e^{-y}y\prime$`, R`$-e^{-y}y\prime$`, R`$-e^{-y}$`, R`$-y\prime$`],
      a: 1,
      ex: R`链式法则不可漏掉负号或 $y\prime$。`
    }, {
      id: R`o1-c4`,
      sec: R`o1-s1`,
      q: R`$y=-\ln(C-x^2/2)$ 作为实解时，必须满足：`,
      opts: [R`$C-x^2/2\ne0$`, R`$C-x^2/2\gt0$`, R`$C\ne0$ 即可`, R`对所有实数 x 都成立`],
      a: 1,
      ex: R`这里来自 $e^{-y}=C-x^2/2$，右端必须严格为正。`
    }],
  methods: [{
      id: R`m-ode-separate`,
      title: R`可分离：查常值解、分离、反代、写区间`,
      steps: [R`先查 $b(y)=0$ 的常值解；非零区域再写 $dy/b(y)=a(x)dx$。`, R`积分后用初值确定常数，反代时保持指数、对数等函数的值域限制。`, R`给出包含初始点的解区间，并把解代回原方程核对。`]
    }, {
      id: R`m-ode-linear`,

s1: {
  unit: R`series`,
  n: 1,
  scope: R`可能不考`,
  title: R`可能不考·选做准备：数项级数敛散`,
  goal: R`本学期级数范围尚未确认，明确作为可能不考的选做准备。30分钟分清通项趋零、正项比较、交错与绝对收敛；真题限数项级数，不扩展到复杂函数项级数。`,
  sections: [{
      id: R`s1-s1`,
      h: R`1. 收敛是部分和有极限，通项趋零只是必要条件`,
      html: R`<p>$\sum a_n$ 收敛是指部分和 $S_N=\sum_{n=1}^Na_n$ 趋于有限数。必要条件是 $a_n\to0$，因为 $a_n=S_n-S_{n-1}$；逆命题不成立，调和级数 $\sum1/n$ 发散。</p><p>基础模板：几何级数 $\sum_{n=0}^{\infty}q^n$ 在 $|q|\lt1$ 时和为 $1/(1-q)$；p级数 $\sum1/n^p$ 在 $p\gt1$ 时收敛、$p\le1$ 时发散。有限个首项不改变敛散性。</p><p>工具只能展示有限项部分和，<b>图像看似变平不能替代收敛证明</b>，尤其接近临界指数1时收敛或发散都可能很慢。</p>`
    }, {
      id: R`s1-s2`,
      h: R`2. 正项比较与对数临界：先找等价项`,
      html: R`<p>正项级数可用比较：$0\le a_n\le b_n$ 且 $\sum b_n$ 收敛，则 $\sum a_n$ 收敛；若 $a_n\ge b_n\ge0$ 且后者发散，则前者发散。若 $a_n/b_n\to c\in(0,+\infty)$，两者同敛散。</p><p>对 $\sum_{n=2}^{\infty}1/[n^\alpha(\ln n)^\beta]$，先看幂次 $\alpha$；只有临界 $\alpha=1$ 才由 $\beta$ 决定。此时函数正且递减，积分判别用 $u=\ln x$ 化为 $\int du/u^\beta$，所以恰在 $\beta\gt1$ 时收敛。</p><p>原理是单调函数图下的矩形与面积夹逼：$\int_2^{N+1}f\le\sum_{n=2}^Nf(n)\le f(2)+\int_2^Nf$。</p>`
    }, {
      id: R`s1-s3`,
      h: R`3. 交错与绝对收敛：先取绝对值再分类`,
      html: R`<p>若 $b_n\ge0$ 单调趋0，则交错级数 $\sum(-1)^{n-1}b_n$ 收敛，余项绝对值不超过下一项 $b_{N+1}$；可把偶部分和看作递增有上界、奇部分和看作递减，二者差趋0来证明。</p><p>$\sum|a_n|$ 收敛叫绝对收敛，保证原级数收敛；原级数收敛但绝对值级数发散叫条件收敛。仅看到“有正负号”不能直接套交错判别，还需振幅单调趋0。</p><p>延伸用一个更一般的工具：若 $\sum_{n=1}^Na_n$ 一致有界，$b_n$ 单调趋0，则 $\sum a_nb_n$ 收敛（Dirichlet判别）。分部求和可将从m开始的尾和控制在常数倍 $b_m$，给出Cauchy条件。</p>`
    }],

  btn.disabled = true;
  msg.textContent = "批改中，通常要 10–40 秒…";

  let out = "";
  try {

    out = text;
    save(id, { feedback: out, gradedAt: Date.now() });
    rerenderProb(id);
  } catch (err) {
    const code = err && err.code;
    if (code === "cancelled") { msg.textContent = ""; }

      <label for="tf">函数 <select id="tf">${Object.entries(FUNCS).map(([k, v]) => `<option value="${k}">${k === "geo" ? "1/(1−x)" : k === "ln" ? "ln(1+x)" : k === "exp" ? "e^x" : k === "sin" ? "sin x" : "cos x"}</option>`).join("")}</select></label>
      <label for="tn">阶数 n = <b class="mono" id="tnv">3</b> <input id="tn" type="range" min="0" max="14" value="3"></label>
      <label for="tx">观察点 x = <b class="mono" id="txv"></b> <input id="tx" type="range" min="0" max="1000" value="700"></label>
    </div>
    <canvas id="tc" role="img" aria-label="函数与其 Taylor 多项式的图像"></canvas>
    <div class="legend"><span><i style="background:var(--ink)"></i>f(x)</span><span><i style="background:var(--accent)"></i>Taylor 多项式 T<sub>n</sub>(x)</span><span><i style="background:var(--bad)"></i>观察点处的误差</span></div>
    <div class="readout" id="tr"></div>
    <div class="poly" id="tp"></div>
    <p class="small muted" id="tnote"></p>
  </div>`;
  const cv = $("#tc", mount), sel = $("#tf", mount), nIn = $("#tn", mount), xIn = $("#tx", mount);
  let polyTimer;
  function setProbe() { const F = FUNCS[sel.value]; const [a, b] = F.view; xIn.value = Math.round(1000 * (F.probe - a) / (b - a)); }
  function T(F, n, x) { let s = 0, p = 1; for (let k = 0; k <= n; k++) { s += F.c(k) * p; p *= x; } return s; }
  function draw() {
    const F = FUNCS[sel.value], n = +nIn.value;

    const px = x0 + (x1 - x0) * (+xIn.value) / 1000;

    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);

    for (let j = Math.ceil(y0); j <= y1; j++) { g.beginPath(); g.moveTo(0, Y(j)); g.lineTo(W, Y(j)); g.stroke(); }
    g.strokeStyle = css("--muted"); g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(X(0), 0); g.lineTo(X(0), H); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke();
    g.fillStyle = css("--muted"); g.font = "11px " + css("--f-mono");
    for (let i = Math.ceil(x0); i <= x1; i++) if (i) g.fillText(i, X(i) + 3, Math.min(H - 4, Y(0) + 13));
    function curve(fn, color, w) {
      g.strokeStyle = color; g.lineWidth = w; g.beginPath(); let pen = false;
      for (let i = 0; i <= W; i++) {
        const x = x0 + (x1 - x0) * i / W, y = fn(x);

      }

    }

    curve(F.f, css("--ink"), 2.2);
    curve(x => T(F, n, x), css("--accent"), 2.2);
    const fy = F.f(px), ty = T(F, n, px);
    if (isFinite(fy)) {

      g.fillStyle = css("--ink"); g.beginPath(); g.arc(X(px), Y(fy), 4, 0, 7); g.fill();
    }

    $("#tr", mount).innerHTML = `<span>f(x) = <b>${fmt(fy)}</b></span><span>T<sub>${n}</sub>(x) = <b>${fmt(ty)}</b></span><span>误差 |f − T<sub>${n}</sub>| = <b>${isFinite(fy) ? fmt(Math.abs(fy - ty)) : "—"}</b></span>`;

      if (!s) s = "0";

  }

  nIn.addEventListener("input", draw); xIn.addEventListener("input", draw);
  const dragTo = e => { const r = cv.getBoundingClientRect(); xIn.value = Math.round(1000 * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))); draw(); };
  cv.addEventListener("pointerdown", e => { try { cv.setPointerCapture(e.pointerId); } catch (_) {} dragTo(e); });
  cv.addEventListener("pointermove", e => { if (cv.hasPointerCapture && cv.hasPointerCapture(e.pointerId)) dragTo(e); });
  window.addEventListener("resize", draw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  setProbe(); requestAnimationFrame(draw);
}

/* ================= 交互图：Lagrange 中值定理 ================= */
function mvtPlot(mount) {

  const pad = (ymax - ymin) * 0.12; ymin -= pad; ymax += pad;
  mount.innerHTML = `<div class="widget">
    <div class="ctrl">
      <label for="ma">a = <b class="mono" id="mav"></b> <input id="ma" type="range" min="-380" max="380" value="-300"></label>
      <label for="mb">b = <b class="mono" id="mbv"></b> <input id="mb" type="range" min="-380" max="380" value="250"></label>
    </div>
    <canvas id="mc" role="img" aria-label="函数图像、弦与满足中值定理的切点"></canvas>
    <div class="legend"><span><i style="background:var(--ink)"></i>f(x)</span><span><i style="background:var(--accent)"></i>弦 AB</span><span><i style="background:var(--teal)"></i>切线平行于弦的点 ξ</span></div>
    <div class="readout" id="mr"></div>
    <p class="small muted">在图上左右拖动会移动离手指更近的那个端点。试着让 a、b 包住两个“弯”，满足条件的 ξ 会变成 3 个。</p>
  </div>`;
  const cv = $("#mc", mount), aIn = $("#ma", mount), bIn = $("#mb", mount);
  function roots(a, b, k) {
    const out = [], N = 600; let px = a, pv = df(a) - k;
    for (let i = 1; i <= N; i++) {
      const x = a + (b - a) * i / N, v = df(x) - k;
      if (pv === 0 && i > 1) out.push(px);
      else if (pv * v < 0) { let lo = px, hi = x; for (let j = 0; j < 40; j++) { const m = (lo + hi) / 2; if ((df(lo) - k) * (df(m) - k) <= 0) hi = m; else lo = m; } out.push((lo + hi) / 2); }

    }

  }
  function draw() {
    let a = +aIn.value / 100, b = +bIn.value / 100;
    if (b - a < 0.3) { if (document.activeElement === aIn) { a = b - 0.3; aIn.value = Math.round(a * 100); } else { b = a + 0.3; bIn.value = Math.round(b * 100); } }
    $("#mav", mount).textContent = a.toFixed(2); $("#mbv", mount).textContent = b.toFixed(2);
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const X = x => (x - X0) / (X1 - X0) * W, Y = y => H - (y - ymin) / (ymax - ymin) * H;
    g.strokeStyle = css("--grid"); g.lineWidth = 1;
    for (let i = Math.ceil(X0); i <= X1; i++) { g.beginPath(); g.moveTo(X(i), 0); g.lineTo(X(i), H); g.stroke(); }
    g.strokeStyle = css("--muted"); g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke();
    g.fillStyle = css("--accent-soft"); g.fillRect(X(a), 0, X(b) - X(a), H);
    g.strokeStyle = css("--ink"); g.lineWidth = 2.2; g.beginPath();
    for (let i = 0; i <= W; i++) { const x = X0 + (X1 - X0) * i / W; i ? g.lineTo(i, Y(f(x))) : g.moveTo(i, Y(f(x))); }
    g.stroke();
    const fa = f(a), fb = f(b), k = (fb - fa) / (b - a);
    g.strokeStyle = css("--accent"); g.lineWidth = 2; g.beginPath(); g.moveTo(X(a), Y(fa)); g.lineTo(X(b), Y(fb)); g.stroke();
    const xs = roots(a, b, k), half = (X1 - X0) * 0.09;
    g.setLineDash([6, 4]); g.strokeStyle = css("--teal"); g.lineWidth = 1.8;
    for (const x of xs) { const y = f(x); g.beginPath(); g.moveTo(X(x - half), Y(y - k * half)); g.lineTo(X(x + half), Y(y + k * half)); g.stroke(); }
    g.setLineDash([]);
    g.fillStyle = css("--teal"); for (const x of xs) { g.beginPath(); g.arc(X(x), Y(f(x)), 4.5, 0, 7); g.fill(); }
    g.fillStyle = css("--accent"); for (const [x, y] of [[a, fa], [b, fb]]) { g.beginPath(); g.arc(X(x), Y(y), 5, 0, 7); g.fill(); }
    g.font = "12px " + css("--f-mono"); g.fillStyle = css("--accent"); g.fillText("A", X(a) - 14, Y(fa) - 8); g.fillText("B", X(b) + 6, Y(fb) - 8);
    $("#mr", mount).innerHTML = `<span>弦斜率 k = <b>${k.toFixed(3)}</b></span><span>满足 f′(ξ) = k 的点：<b>${xs.length}</b> 个${xs.length ? "（ξ = " + xs.map(x => x.toFixed(2)).join("、") + "）" : ""}</span>`;
  }
  aIn.addEventListener("input", draw); bIn.addEventListener("input", draw);
  let drag = null;
  const xAt = e => { const r = cv.getBoundingClientRect(); return X0 + (X1 - X0) * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  cv.addEventListener("pointerdown", e => {
    const x = xAt(e); drag = Math.abs(x - aIn.value / 100) <= Math.abs(x - bIn.value / 100) ? aIn : bIn;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    drag.value = Math.round(Math.max(-3.8, Math.min(3.8, x)) * 100); drag.focus({ preventScroll: true }); draw();
  });
  cv.addEventListener("pointermove", e => { if (!drag || !(cv.hasPointerCapture && cv.hasPointerCapture(e.pointerId))) return; drag.value = Math.round(Math.max(-3.8, Math.min(3.8, xAt(e))) * 100); draw(); });
  cv.addEventListener("pointerup", () => { drag = null; });
  window.addEventListener("resize", draw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  requestAnimationFrame(draw);
}

/* ================= 交互图：斜率不等式与拐点 ================= */

    cu: { label: "x³ − 3x", f: x => x * x * x - 3 * x, d2: x => 6 * x, X0: -2.4, X1: 2.4, p: [0.3, 1, 1.8] }
  };
  mount.innerHTML = `<div class="widget">
    <div class="ctrl">
      <label for="cvf">函数 <select id="cvf">${Object.entries(FN).map(([k, o]) => `<option value="${k}">${o.label}</option>`).join("")}</select></label>
      <label for="cv1">x₁ <input id="cv1" type="range" min="0" max="1000"></label>
      <label for="cv2">x₂ <input id="cv2" type="range" min="0" max="1000"></label>

    <div class="legend"><span><i style="background:var(--accent-soft)"></i>f″ ≥ 0（下凸）</span><span><i style="background:var(--accent)"></i>弦</span><span><i style="background:var(--teal)"></i>拐点</span></div>
    <div class="readout" id="cvr"></div>
    <p class="small muted">在图上左右拖动会移动最近的那个点。三点都在涂色段里时，左弦 ≤ 长弦 ≤ 右弦总成立；让三点跨过拐点，试着把不等式弄坏。</p>
  </div>`;
  const cv = $("#cvc", mount), sel = $("#cvf", mount), ins = [1, 2, 3].map(i => $("#cv" + i, mount));
  let F, ymin, ymax, infl;
  const toX = v => F.X0 + (F.X1 - F.X0) * v / 1000, toV = x => Math.round((x - F.X0) / (F.X1 - F.X0) * 1000);
  function setFn() {
    F = FN[sel.value]; ymin = Infinity; ymax = -Infinity; infl = [];
    let pv = F.d2(F.X0);
    for (let i = 0; i <= 600; i++) {
      const x = F.X0 + (F.X1 - F.X0) * i / 600, y = F.f(x), v = F.d2(x);
      ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
      if (i && pv * v < 0) { let lo = x - (F.X1 - F.X0) / 600, hi = x; for (let j = 0; j < 40; j++) { const m = (lo + hi) / 2; if (F.d2(lo) * F.d2(m) <= 0) hi = m; else lo = m; } infl.push((lo + hi) / 2); }
      else if (v === 0 && i && i < 600 && F.d2(x - 1e-3) * F.d2(x + 1e-3) < 0) infl.push(x);
      pv = v;
    }
    const pad = (ymax - ymin) * 0.12; ymin -= pad; ymax += pad;
    F.p.forEach((x, i) => { ins[i].value = toV(x); });
    draw();
  }
  function fix(moved) {
    const gap = 25, v = ins.map(e => +e.value);
    const i = ins.indexOf(moved);
    if (i >= 0) {
      for (let j = i + 1; j < 3; j++) v[j] = Math.max(v[j], v[j - 1] + gap);
      for (let j = i - 1; j >= 0; j--) v[j] = Math.min(v[j], v[j + 1] - gap);
      if (v[0] < 0) { v[0] = 0; v[1] = Math.max(v[1], gap); v[2] = Math.max(v[2], 2 * gap); }
      if (v[2] > 1000) { v[2] = 1000; v[1] = Math.min(v[1], 1000 - gap); v[0] = Math.min(v[0], 1000 - 2 * gap); }
    }

    g.strokeStyle = css("--grid"); g.lineWidth = 1;
    for (let i = Math.ceil(F.X0); i <= F.X1; i++) { g.beginPath(); g.moveTo(X(i), 0); g.lineTo(X(i), H); g.stroke(); }

    if (F.X0 < 0 && F.X1 > 0) { g.beginPath(); g.moveTo(X(0), 0); g.lineTo(X(0), H); g.stroke(); }
    g.strokeStyle = css("--ink"); g.lineWidth = 2.2; g.beginPath();
    for (let i = 0; i <= W; i++) { const x = F.X0 + (F.X1 - F.X0) * i / W; i ? g.lineTo(i, Y(F.f(x))) : g.moveTo(i, Y(F.f(x))); }

    g.strokeStyle = css("--accent"); g.lineWidth = 2;

    g.setLineDash([]);
    g.fillStyle = css("--teal"); for (const x of infl) { g.beginPath(); g.arc(X(x), Y(F.f(x)), 5, 0, 7); g.fill(); }
    g.fillStyle = css("--accent"); g.font = "12px " + css("--f-mono");
    xs.forEach((x, i) => { g.beginPath(); g.arc(X(x), Y(ys[i]), 5, 0, 7); g.fill(); g.fillText("x" + "₁₂₃"[i], X(x) - 6, Y(ys[i]) - 10); });
    const k = (i, j) => (ys[j] - ys[i]) / (xs[j] - xs[i]);
    const k12 = k(0, 1), k13 = k(0, 2), k23 = k(1, 2), eps = 1e-9, ok = k12 <= k13 + eps && k13 <= k23 + eps;
    const allConvex = (() => { for (let i = 0; i <= 200; i++) if (F.d2(xs[0] + (xs[2] - xs[0]) * i / 200) < -eps) return false; return true; })();
    $("#cvr", mount).innerHTML = `<span>k₁₂ = <b>${k12.toFixed(3)}</b></span><span>k₁₃ = <b>${k13.toFixed(3)}</b></span><span>k₂₃ = <b>${k23.toFixed(3)}</b></span>`
      + `<span>${ok ? "✓ k₁₂ ≤ k₁₃ ≤ k₂₃ 成立" : "✗ 斜率不等式不成立"}${allConvex ? "（[x₁, x₃] 全在下凸段）" : "（[x₁, x₃] 里有 f″ &lt; 0 的部分）"}</span>`
      + `<span>拐点：${infl.length ? infl.map(x => "x = " + x.toFixed(2)).join("、") : "无"}</span>`;
  }
  sel.addEventListener("change", setFn);
  ins.forEach(e => e.addEventListener("input", () => { fix(e); draw(); }));
  let drag = null;
  const vAt = e => { const r = cv.getBoundingClientRect(); return Math.round(1000 * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))); };
  cv.addEventListener("pointerdown", e => {
    const v = vAt(e); drag = ins.reduce((b, c) => Math.abs(+c.value - v) < Math.abs(+b.value - v) ? c : b);
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    drag.value = v; fix(drag); drag.focus({ preventScroll: true }); draw();
  });
  cv.addEventListener("pointermove", e => { if (!drag || !(cv.hasPointerCapture && cv.hasPointerCapture(e.pointerId))) return; drag.value = vAt(e); fix(drag); draw(); });
  cv.addEventListener("pointerup", () => { drag = null; });
  window.addEventListener("resize", draw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  requestAnimationFrame(setFn);

/* ================= 交互图：Lagrange 中值点 ================= */
function lagrangeXi(mount) {
  mount.innerHTML = `<div class="widget">
    <div class="ctrl">
      <label for="lx">x = <b class="mono" id="lxv"></b> <input id="lx" type="range" min="-30" max="30" value="20"></label>

    </div>
    <div class="xi-line" id="ll"></div>
    <div class="readout" id="lr"></div>
    <p class="small muted">f(x) = eˣ，在 0 处展开：eˣ = Tₙ(x) + e^ξ · xⁿ⁺¹/(n+1)!。图中的点就是真正满足这个等式的 ξ。</p>

/* ================= 交互图：Wallis 递推与奇偶 ================= */
function wallisPlay(mount) {
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="wallis-family">积分族 <select id="wallis-family"><option value="W">Wₙ：0 到 π/2，sinⁿx</option><option value="a">aₙ：0 到 1，xⁿ√(1−x²)</option><option value="I">Iₙ：−1 到 1，xⁿ√(1−x²)</option></select></label></div>
    <div class="ctrl"><label for="wallis-n">阶数 n <input id="wallis-n" type="range" min="0" max="20" step="1" value="6"></label><b class="mono" id="wallis-nv"></b></div>
    <div id="wallis-graph"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>当前阶 n（阴影是带符号面积）</span><span><i style="background:var(--muted)"></i>虚线：n−2 阶</span></div>
    <div class="readout" id="wallis-out" aria-live="polite"></div><div class="table-wrap" id="wallis-table"></div>
    <p class="small muted">滑块可分奇偶追踪递推；n=0、1 用各自初值。Iₙ 在奇数阶时左负右正，积分相消，不可用“偶函数乘 2”。</p>
  </div>`;
  const family = $("#wallis-family", mount), input = $("#wallis-n", mount), W = [Math.PI / 2, 1];
  for (let n = 2; n <= 20; n++) W[n] = (n - 1) / n * W[n - 2];
  function val(kind, n) { return kind === "W" ? W[n] : kind === "a" ? W[n] / (n + 2) : n % 2 ? 0 : 2 * W[n] / (n + 2); }
  function draw() {
    const kind = family.value, n = +input.value, oddI = kind === "I" && n % 2 === 1;
    const left = kind === "I" ? -1 : 0, right = kind === "W" ? Math.PI / 2 : 1;
    const ymin = oddI ? -1.1 : 0, ymax = 1.1, X = x => 45 + 510 * (x - left) / (right - left), Y = y => 225 - 190 * (y - ymin) / (ymax - ymin);
    const fun = (x, k) => kind === "W" ? Math.sin(x) ** k : x ** k * Math.sqrt(Math.max(0, 1 - x * x));
    const path = k => Array.from({ length: 241 }, (_, i) => { const x = left + (right - left) * i / 240; return `${i ? "L" : "M"}${X(x).toFixed(2)},${Y(fun(x, k)).toFixed(2)}`; }).join(" ");
    function area(a, b, color) {
      const p = `M${X(a)},${Y(0)} ` + Array.from({ length: 121 }, (_, i) => { const x = a + (b - a) * i / 120; return `L${X(x).toFixed(2)},${Y(fun(x, n)).toFixed(2)}`; }).join(" ") + ` L${X(b)},${Y(0)} Z`;
      return `<path d="${p}" style="fill:var(${color});opacity:0.2"/>`;
    }
    const fills = oddI ? area(-1, 0, "--accent") + area(0, 1, "--teal") : area(left, right, "--accent");
    const prev = n >= 2 ? `<path d="${path(n - 2)}" style="fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4"/>` : "";
    $("#wallis-graph", mount).innerHTML = `<svg viewBox="0 0 600 260" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="${kind} 积分族第 ${n} 阶曲线与带符号面积${oddI ? "，左右相消" : ""}">${fills}<path d="M45,${Y(0)} H565 M${X(0)},25 V230" style="fill:none;stroke:var(--muted);stroke-width:1"/>${prev}<path d="${path(n)}" style="fill:none;stroke:var(--accent);stroke-width:2.5"/><text x="40" y="249" style="fill:var(--muted);font:12px var(--f-mono)">${left}</text><text x="545" y="249" style="fill:var(--muted);font:12px var(--f-mono)">${kind === "W" ? "π/2" : "1"}</text><text x="18" y="${Y(1) + 4}" style="fill:var(--muted);font:12px var(--f-mono)">1</text>${oddI ? `<text x="11" y="${Y(-1) + 4}" style="fill:var(--muted);font:12px var(--f-mono)">−1</text>` : ""}</svg>`;
    $("#wallis-nv", mount).textContent = String(n);
    let description = oddI ? "奇函数在对称区间上积分为 0。" : n < 2 ? "本阶直接使用初值，不套递推。" : `${kind}(${n}) = ${n - 1}/${kind === "W" ? n : n + 2} × ${kind}(${n - 2})。`;
    let ratio = "";
    if (kind === "a" && n >= 2) ratio = `相邻比值 a(${n})/a(${n - 1}) = ${(val(kind, n) / val(kind, n - 1)).toFixed(8)}，位于 [${((n - 1) / (n + 2)).toFixed(8)}, 1]。`;
    $("#wallis-out", mount).innerHTML = `<span>${kind}(${n}) = ${val(kind, n).toFixed(8)}。</span><span>${description}</span>${ratio ? `<span>${ratio}</span>` : ""}`;
    let rows = "";
    for (let k = n % 2; k <= n; k += 2) {
      const why = kind === "I" && k % 2 ? "奇函数相消" : k < 2 ? "初值" : `${k - 1}/${kind === "W" ? k : k + 2} × ${kind}(${k - 2})`;
      rows += `<tr><td>${kind}(${k})</td><td>${why}</td><td class="mono">${val(kind, k).toFixed(8)}</td></tr>`;
    }
    $("#wallis-table", mount).innerHTML = `<table><thead><tr><th>本阶</th><th>递推 / 理由</th><th>数值</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  family.addEventListener("change", draw);
  input.addEventListener("input", draw);

}


/* ================= 交互图：原函数是否连续 ================= */
function primitiveCheck(mount) {
  const r3 = Math.sqrt(3);
  const cases = {
    tan: { label: "1/(2−cos θ)，0 到 2π，半角代换", a: 0, b: 2 * Math.PI, f: t => 1 / (2 - Math.cos(t)),
      F: t => 2 / r3 * Math.atan(r3 * Math.tan(t / 2)), jump: Math.PI, size: 2 * Math.PI / r3, fname: "1/(2−cos θ)", Fname: "(2/√3)·arctan(√3·tan(θ/2))", var: "θ" },
    cubic: { label: "1/(1+x³)，0 到 3，部分分式", a: 0, b: 3, f: x => 1 / (1 + x ** 3),
      F: x => Math.atan((2 * x - 1) / r3) / r3 + Math.log(1 + x) / 3 - Math.log(x * x - x + 1) / 6, fname: "1/(1+x³)", Fname: "arctan((2x−1)/√3)/√3 + ln(1+x)/3 − ln(x²−x+1)/6", var: "x" },
    log: { label: "ln²x，1 到 e，两次分部", a: 1, b: Math.E, f: x => Math.log(x) ** 2,
      F: x => x * Math.log(x) ** 2 - 2 * x * Math.log(x) + 2 * x, fname: "ln²x", Fname: "x ln²x − 2x ln x + 2x", var: "x" }
  };
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="pc-case">例子 <select id="pc-case">${Object.entries(cases).map(([k, c]) => `<option value="${k}">${c.label}</option>`).join("")}</select></label></div>
    <div class="ctrl"><label for="pc-end">上限 b <input id="pc-end" type="range" min="1" max="200" step="1" value="200"></label><b class="mono" id="pc-bv"></b></div>
    <div class="ctrl" id="pc-fixrow"><label><input id="pc-fix" type="checkbox"> 修正：θ 过 π 后加上跳跃量 2π/√3</label></div>
    <div id="pc-graph"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>原函数 F（公式）</span><span><i style="background:var(--teal)"></i>虚线：F(a) + 数值积分</span></div>
    <div class="readout" id="pc-out" aria-live="polite"></div>
    <p class="small muted">上图是被积函数与积分区域，下图比较两条曲线。两条曲线重合，说明 F 在这一段上是连续原函数；一旦分开，F(b)−F(a) 就不再等于积分。</p>
  </div>`;
  const sel = $("#pc-case", mount), end = $("#pc-end", mount), fix = $("#pc-fix", mount);
  function draw() {
    const c = cases[sel.value], N = 600, a = c.a, B = c.b;
    $("#pc-fixrow", mount).style.display = c.jump ? "" : "none";
    const Fx = t => {
      if (c.jump && Math.abs(t - c.jump) < 1e-12) return fix.checked ? c.size / 2 : NaN;
      return c.F(t) + (c.jump && fix.checked && t > c.jump ? c.size : 0);
    };
    const xs = Array.from({ length: N + 1 }, (_, i) => a + (B - a) * i / N);
    const cum = [Fx(a)];
    for (let i = 1; i <= N; i++) {
      const l = xs[i - 1], r = xs[i], m = (l + r) / 2;
      cum.push(cum[i - 1] + (r - l) * (c.f(l) + 4 * c.f(m) + c.f(r)) / 6);
    }
    const k = Math.round(+end.value / 200 * N), b = xs[k];
    const fmax = Math.max(...xs.map(c.f)) * 1.1;
    const Fvals = xs.map(Fx).filter(Number.isFinite).concat(cum);
    const lo = Math.min(...Fvals), hi = Math.max(...Fvals), pad = (hi - lo) * 0.08 || 1;
    const X = x => 50 + 520 * (x - a) / (B - a);
    const Y1 = y => 125 - 105 * y / fmax, Y2 = y => 300 - 140 * (y - lo + pad) / (hi - lo + 2 * pad);
    const fPath = xs.map((x, i) => `${i ? "L" : "M"}${X(x).toFixed(1)},${Y1(c.f(x)).toFixed(1)}`).join(" ");
    const area = `M${X(a)},${Y1(0)} ` + xs.slice(0, k + 1).map(x => `L${X(x).toFixed(1)},${Y1(c.f(x)).toFixed(1)}`).join(" ") + ` L${X(b).toFixed(1)},${Y1(0)} Z`;
    let FPath = "", pen = false, prev = null;
    for (const x of xs) {
      const y = Fx(x);
      if (!Number.isFinite(y) || (prev !== null && Math.abs(y - prev) > (hi - lo) * 0.3)) { pen = false; prev = Number.isFinite(y) ? y : null; if (!Number.isFinite(y)) continue; }
      FPath += `${pen ? "L" : "M"}${X(x).toFixed(1)},${Y2(y).toFixed(1)} `; pen = true; prev = y;
    }
    const cumPath = xs.map((x, i) => `${i ? "L" : "M"}${X(x).toFixed(1)},${Y2(cum[i]).toFixed(1)}`).join(" ");
    const jumpLine = c.jump ? `<line x1="${X(c.jump)}" y1="160" x2="${X(c.jump)}" y2="305" style="stroke:var(--warn);stroke-dasharray:3 4"/><text x="${X(c.jump) + 5}" y="172" style="fill:var(--warn);font:12px var(--f-mono)">θ = π</text>` : "";
    $("#pc-graph", mount).innerHTML = `<svg viewBox="0 0 600 320" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="上图被积函数 ${c.fname}，阴影到 ${b.toFixed(3)}；下图原函数与数值积分曲线">
      <path d="${area}" style="fill:var(--accent);opacity:0.18"/><path d="${fPath}" style="fill:none;stroke:var(--accent);stroke-width:2.2"/>
      <path d="M50,20 V${Y1(0)} H575" style="fill:none;stroke:var(--muted);stroke-width:1"/>
      <line x1="${X(b).toFixed(1)}" y1="20" x2="${X(b).toFixed(1)}" y2="305" style="stroke:var(--ink);stroke-width:1;opacity:0.5"/>
      ${jumpLine}
      <path d="M50,160 V300 H575" style="fill:none;stroke:var(--muted);stroke-width:1"/>
      <path d="${cumPath}" style="fill:none;stroke:var(--teal);stroke-width:2.2;stroke-dasharray:6 4"/><path d="${FPath}" style="fill:none;stroke:var(--accent);stroke-width:2.5"/>
      <text x="56" y="16" style="fill:var(--ink);font:500 13px var(--f-sans)">被积函数</text><text x="56" y="156" style="fill:var(--ink);font:500 13px var(--f-sans)">原函数</text>
      <text x="44" y="${Y1(0) + 15}" style="fill:var(--muted);font:12px var(--f-mono)">${+a.toFixed(3)}</text><text x="545" y="${Y1(0) + 15}" style="fill:var(--muted);font:12px var(--f-mono)">${c.jump ? "2π" : +B.toFixed(3)}</text></svg>`;
    $("#pc-bv", mount).textContent = `${c.var} = ${b.toFixed(3)}`;
    const Fb = Fx(b), num = cum[k] - cum[0], diff = Fb - Fx(a);
    const ok = Number.isFinite(Fb) && Math.abs(diff - num) < 1e-6;
    $("#pc-out", mount).innerHTML = `<span>F = ${c.Fname}${c.jump && fix.checked ? "（过 π 后已加 2π/√3）" : ""}</span>`
      + `<span>数值积分 ∫ = <b>${num.toFixed(6)}</b></span>`
      + `<span>F(b) − F(a) = <b>${Number.isFinite(Fb) ? (Math.abs(diff) < 5e-7 ? 0 : diff).toFixed(6) : "F 在 π 处无定义"}</b></span>`
      + `<span>${ok ? "两者一致：F 在 [a, b] 上连续，可用牛顿–莱布尼兹。" : Number.isFinite(Fb) ? `相差 ${(num - diff).toFixed(6)}（= 2π/√3 ≈ ${(2 * Math.PI / r3).toFixed(6)}）：F 在 π 处跳跃，不能整段用公式。` : "端点处要用单侧极限延拓 F。"}</span>`;
  }
  sel.addEventListener("change", () => { end.value = 200; fix.checked = false; draw(); });
  end.addEventListener("input", draw);
  fix.addEventListener("change", draw);
  draw();
}


/* ================= 交互图：变限积分与差商 ================= */
function movingIntegral(mount) {
  mount.innerHTML = `<div class="widget"><div class="ctrl"><label for="mov-case">例子 <select id="mov-case"><option value="square">上限 x²：f(t)=exp(−t²)</option><option value="both">下限 x、上限 x²：f(t)=1+t²</option><option value="jump">跳跃反例：积分为 |x|</option></select></label><label for="mov-x">x <input id="mov-x" type="range" min="-1.5" max="1.5" step="0.05" value="0.5"></label><button type="button" class="btn" id="mov-zero">回到 x=0</button></div><div class="ctrl"><label for="mov-h">差商步长 <select id="mov-h"><option value="0.1">0.1</option><option value="0.01" selected>0.01</option><option value="0.001">0.001</option></select></label></div><p class="small muted">被积函数 f(t)：阴影表示两端之间的区域。</p><div id="mov-graph"></div><p class="small" id="mov-bounds"></p><div class="readout" id="mov-out" aria-live="polite"></div><p class="small muted" id="mov-note"></p></div>`;
  const mode = $("#mov-case", mount), slider = $("#mov-x", mount), hs = $("#mov-h", mount);
  function integral(f, a, b) {
    const steps = 240, h = (b - a) / steps;
    let s = f(a) + f(b);
    for (let i = 1; i < steps; i++) s += (i % 2 ? 4 : 2) * f(a + h * i);
    return s * h / 3;
  }
  const cases = {
    square: { f: t => Math.exp(-t * t), a: () => 0, b: x => x * x, F: x => integral(t => Math.exp(-t * t), 0, x * x), d: x => 2 * x * Math.exp(-(x ** 4)), note: "上限先代 x²，再乘链式导数 2x。即使 x 为负，上限仍非负；F 是偶函数，F′ 在 0 两侧变号。" },
    both: { f: t => 1 + t * t, a: x => x, b: x => x * x, F: x => x * x + x ** 6 / 3 - x - x ** 3 / 3, d: x => 2 * x * (1 + x ** 4) - (1 + x * x), note: "上限项 2x(1+x⁴) 减下限项 (1+x²)。阴影画在两端之间，积分按下限到上限取方向；两端重合时积分为 0，导数未必为 0。" },
    jump: { f: t => t < 0 ? -1 : 1, a: () => 0, b: x => x, F: Math.abs, d: x => x === 0 ? null : Math.sign(x), note: "f 在 0 跳跃，积分 F(x)=|x| 连续但不可导。在 x=0，右差商恒为 1、左差商恒为 −1；不能把 f(0)=1 当作 F′(0)。" }
  };
  function draw() {
    const c = cases[mode.value], x = +slider.value, h = +hs.value, a = c.a(x), b = c.b(x);
    const val = c.F(x), right = (c.F(x + h) - val) / h, left = (val - c.F(x - h)) / h, derivative = c.d(x);
    const X = t => 48 + (t + 1.6) / 4.1 * 500, Y = y => 208 - y * 24;
    const path = (f, lo, hi, n = 160) => Array.from({ length: n + 1 }, (_, i) => {
      const t = lo + (hi - lo) * i / n; return (i ? "L" : "M") + X(t).toFixed(2) + "," + Y(f(t)).toFixed(2);
    }).join(" ");
    const lo = Math.min(a, b), hi = Math.max(a, b);
    const curve = mode.value === "jump" ? path(c.f, -1.6, -0.00001) + " " + path(c.f, 0, 2.5) : path(c.f, -1.6, 2.5);

function improperCutoff(mount) {
  mount.innerHTML = `<div class="widget"><div class="ctrl"><label for="imp-side">反常点 <select id="imp-side"><option value="infinity">无穷远：从 1 到 R</option><option value="zero">有限端点：从 ε 到 1</option></select></label><label for="imp-p">指数 p <select id="imp-p"><option value="0.5">0.5</option><option value="1" selected>1（临界）</option><option value="1.5">1.5</option><option value="2">2</option></select></label><label for="imp-k">截断级别 <input id="imp-k" type="range" min="1" max="5" step="1" value="2"></label></div><div class="readout" id="imp-out" aria-live="polite"></div><div class="table-wrap" id="imp-table"></div><p class="small muted">这里只画截断数值表。数值增长缓慢不等于收敛；结论来自 p 型积分的解析公式。两种反常点的判别方向相反。</p></div>`;

/* ================= 交互图：一阶方程解与存在区间（可能不考） ================= */
function odeFirstPlay(mount) {
  mount.innerHTML=`<div class="widget"><p class="small muted">可能不考·选做准备。图示与数值只帮助理解，解的核对仍用代回方程。</p><div class="ctrl"><label for="of-mode">方程 <select id="of-mode"><option value="linear">y′=x−y</option><option value="separate">y′=x exp(y)</option></select></label><label for="of-y0">y(0) <input id="of-y0" type="range" min="-2" max="2" step="0.1" value="0"></label><label for="of-x">读数 x <input id="of-x" type="range" min="0" max="2" step="0.05" value="1"></label></div><div id="of-graph"></div><div class="readout" id="of-out" aria-live="polite"></div><p class="small muted" id="of-note"></p></div>`;
  const sel=$("#of-mode",mount),init=$("#of-y0",mount),pos=$("#of-x",mount);
  function draw(){
    const a=+init.value,x=+pos.value,separate=sel.value==="separate",X=t=>45+250*t,Y=y=>225-40*(y+2.5);
    const f=(t,y)=>separate?t*Math.exp(y):t-y;
    const sol=t=>separate?(Math.exp(-a)-t*t/2>0?-Math.log(Math.exp(-a)-t*t/2):null):t-1+(a+1)*Math.exp(-t);
    let field="";
    for(let i=0;i<=10;i++)for(let j=0;j<=10;j++){const t=i/5,y=-2.5+j/2,s=f(t,y),dx=7/Math.sqrt(1+s*s),dy=s*dx;field+=`<path d="M${X(t)-dx},${Y(y)+dy}L${X(t)+dx},${Y(y)-dy}" stroke="var(--muted)" opacity="0.35"/>`;}
    let p="",was=false;for(let i=0;i<=400;i++){const t=i/200,y=sol(t);if(y===null){was=false;continue;}p+=(was?"L":"M")+X(t).toFixed(2)+","+Y(y).toFixed(2)+" ";was=true;}
    const value=sol(x),star=separate?Math.sqrt(2*Math.exp(-a)):null;
    const boundary=separate&&star<=2?`<path d="M${X(star)},25V225" stroke="var(--bad)" stroke-dasharray="5 4"/>`:"";
    const dot=value!==null?`<circle cx="${X(x)}" cy="${Y(value)}" r="4" fill="var(--teal)"/>`:"";
    $("#of-graph",mount).innerHTML=`<svg viewBox="0 0 600 250" style="width:100%;height:auto;display:block" role="img" aria-label="一阶方程方向场与初值解"><defs><clipPath id="of-clip"><rect x="40" y="20" width="520" height="210"/></clipPath></defs><path d="M45,25V225H545" stroke="var(--line)" fill="none"/><g clip-path="url(#of-clip)">${field}${boundary}<path d="${p}" fill="none" stroke="var(--accent)" stroke-width="3"/>${dot}</g></svg>`;
    $("#of-out",mount).textContent="y(0)="+a.toFixed(1)+"；x="+x.toFixed(2)+"；"+(value===null?"当前点不在实解区间内":("y="+value.toFixed(6)+"；由方程给 y′="+f(x,value).toFixed(6)));
    $("#of-note",mount).textContent=separate?"解 y=−ln(e^(−y₀)−x²/2)。最大区间 |x|<"+star.toFixed(6)+"；红虚线若在视窗内，标出右侧发散边界。曲线超出纵向视窗后被裁切，不能误认作延续到边界之外。":"解 y=x−1+(y₀+1)e^(−x)，在整个实轴成立。视窗横轴0到2，纵轴−2.5到2.5；灰线是局部方向。";
  }
  sel.addEventListener("change",draw);init.addEventListener("input",draw);pos.addEventListener("input",draw);draw();
}
/* ================= 交互图：二阶方程三类特征根（可能不考） ================= */
function odeSecondPlay(mount){
  mount.innerHTML=`<div class="widget"><p class="small muted">可能不考·选做准备。实线 y，虚线 y′；纵轴随初值缩放。</p><div class="ctrl"><label for="os-mode">类型 <select id="os-mode"><option value="distinct">实异根2、3</option><option value="repeat">重根1</option><option value="complex">共轭根±2i</option></select></label><label for="os-a">y(0) <input id="os-a" type="range" min="-2" max="2" step="0.1" value="1"></label><label for="os-b">y′(0) <input id="os-b" type="range" min="-2" max="2" step="0.1" value="0"></label><label for="os-x">x <input id="os-x" type="range" min="0" max="1" step="0.05" value="0.5"></label><button class="btn" id="os-exam" type="button">恢复2025真题初值</button></div><div id="os-graph"></div><div id="os-out" class="readout" aria-live="polite"></div><p id="os-note" class="small muted"></p></div>`;
  const mode=$("#os-mode",mount),aa=$("#os-a",mount),bb=$("#os-b",mount),xx=$("#os-x",mount);
  function draw(){
    const a=+aa.value,b=+bb.value,x=+xx.value,k=mode.value;
    const y=t=>k==="distinct"?(3*a-b)*Math.exp(2*t)+(b-2*a)*Math.exp(3*t):k==="repeat"?(a+(b-a)*t)*Math.exp(t):a*Math.cos(2*t)+b/2*Math.sin(2*t);
    const dy=t=>k==="distinct"?2*(3*a-b)*Math.exp(2*t)+3*(b-2*a)*Math.exp(3*t):k==="repeat"?(b+(b-a)*t)*Math.exp(t):-2*a*Math.sin(2*t)+b*Math.cos(2*t);
    let scale=1;for(let i=0;i<=200;i++)scale=Math.max(scale,Math.abs(y(i/200)),Math.abs(dy(i/200)));
    const X=t=>45+510*t,Y=v=>130-100*v/scale;
    const path=f=>Array.from({length:201},(_,i)=>(i?"L":"M")+X(i/200).toFixed(2)+","+Y(f(i/200)).toFixed(2)).join(" ");
    $("#os-graph",mount).innerHTML=`<svg viewBox="0 0 600 260" style="width:100%;height:auto;display:block" role="img" aria-label="二阶方程的解与导数"><path d="M45,25V235 M45,130H555" stroke="var(--line)" fill="none"/><path d="${path(y)}" fill="none" stroke="var(--accent)" stroke-width="3"/><path d="${path(dy)}" fill="none" stroke="var(--teal)" stroke-width="2" stroke-dasharray="6 4"/><circle cx="${X(x)}" cy="${Y(y(x))}" r="4" fill="var(--accent)"/></svg>`;
    $("#os-out",mount).textContent="x="+x.toFixed(2)+"；y="+y(x).toFixed(6)+"；y′="+dy(x).toFixed(6)+"；核对初值 y(0)="+y(0).toFixed(6)+"，y′(0)="+dy(0).toFixed(6);
    $("#os-note",mount).textContent=(k==="distinct"?"方程 y″−5y′+6y=0；y=(3a−b)e^(2x)+(b−2a)e^(3x)。":k==="repeat"?"方程 y″−2y′+y=0；y=[a+(b−a)x]e^x。":"方程 y″+4y=0；y=a cos(2x)+(b/2)sin(2x)。")+"其中a=y(0)，b=y′(0)；横轴0到1，纵向范围约±"+scale.toFixed(3)+"。";
  }
  mode.addEventListener("change",draw);for(const e of[aa,bb,xx])e.addEventListener("input",draw);$("#os-exam",mount).addEventListener("click",()=>{mode.value="distinct";aa.value="1";bb.value="0";draw();});draw();
}
/* ================= 交互图：数项级数有限部分和（可能不考） ================= */
function seriesPlay(mount){
  mount.innerHTML=`<div class="widget"><p class="small muted">可能不考·选做准备。有限部分和曲线不能替代收敛证明；实线 Sₙ，虚线为绝对值部分和。</p><div class="ctrl"><label for="se-mode">级数 <select id="se-mode"><option value="power">Σ1/nᵖ</option><option value="log">Σ1/[n(ln n)ᵖ]</option><option value="alternating">Σ(−1)ⁿ⁻¹/nᵖ</option></select></label><label for="se-p">指数p <input id="se-p" type="range" min="0.25" max="2.5" step="0.05" value="1"></label><label for="se-n">截断N <select id="se-n"><option>10</option><option>100</option><option selected>1000</option><option>10000</option></select></label></div><div id="se-graph"></div><div class="readout" id="se-out" aria-live="polite"></div><p class="small muted" id="se-note"></p></div>`;
  const mode=$("#se-mode",mount),pp=$("#se-p",mount),nn=$("#se-n",mount);
  function draw(){
    const p=+pp.value,N=+nn.value,k=mode.value,start=k==="log"?2:1,points=[];let s=0,abs=0;
    const stride=Math.max(1,Math.floor(N/250));
    for(let n=start;n<=N;n++){const b=k==="log"?1/(n*Math.log(n)**p):1/n**p;const a=k==="alternating"?(n%2?b:-b):b;s+=a;abs+=b;if(n===start||n===N||n%stride===0)points.push([n,s,abs]);}
    const scale=Math.max(1,abs),X=n=>45+510*(n-start)/Math.max(1,N-start),Y=v=>225-190*v/scale;
    const path=j=>points.map((r,i)=>(i?"L":"M")+X(r[0]).toFixed(2)+","+Y(r[j]).toFixed(2)).join(" ");
    $("#se-graph",mount).innerHTML=`<svg viewBox="0 0 600 250" style="width:100%;height:auto;display:block" role="img" aria-label="数项级数与绝对值级数的有限部分和"><path d="M45,25V225H555" stroke="var(--line)" fill="none"/><path d="${path(2)}" fill="none" stroke="var(--teal)" stroke-width="3" stroke-dasharray="6 4"/><path d="${path(1)}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
    const category=k==="alternating"?(p>1?"绝对收敛":"条件收敛"):(p>1?"收敛":"发散");
    $("#se-out",mount).textContent="p="+p.toFixed(2)+"，N="+N+"；Sₙ="+s.toFixed(8)+"；Σ|aₙ|="+abs.toFixed(8)+"；理论分类："+category;
    $("#se-note",mount).textContent=(k==="alternating"?"p>0时交错振幅单调趋0。余项上界为下一项 "+((N+1)**(-p)).toExponential(4)+"；绝对值级数的阈值是p=1。":k==="log"?"从n=2开始。积分判别换元u=lnx，恰在p>1时收敛；p=1仍发散，部分和增长尤其慢。":"正项p级数恰在p>1时收敛；p≤1时发散。")+"图形横轴是项号，纵轴按当前绝对值部分和缩放。";
  }
  mode.addEventListener("change",draw);pp.addEventListener("input",draw);nn.addEventListener("change",draw);draw();
}

renderNav();
render();
</script>
