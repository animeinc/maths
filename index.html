{"id":R`x2-c1`,"sec":R`x2-s1`,"q":R`反函数二阶导的分母是：`,"opts":[R`$f′(g(y))$`,R`$f′(g(y))^2$`,R`$f′(g(y))^3$`,R`$f″(g(y))$`],"a":2,"ex":R`选 $f'(g(y))^3$。对 $g'(y)=\frac1{f'(g(y))}$ 再求导：分母 $f'(g(y))$ 求导时用链式法则还要乘 $g'(y)=\frac1{f'(g(y))}$，得 $g''=-\frac{f''(g)g'}{f'(g)^2}=-\frac{f''(g)}{f'(g)^3}$。容易误选平方：那是忘了乘链式法则里的 $g'$。`},
{"id":R`x2-c2`,"sec":R`x2-s1`,"q":R`建立局部反函数前，本课首先验证：`,"opts":[R`函数值为0`,R`邻域严格单调`,R`导数处处为0`,R`全局单射`],"a":1,"ex":R`选“邻域严格单调”。局部反函数只需要在 $a$ 附近一个小区间上单射，而“严格单调”是证明单射最常用的办法（由 $f'$ 连续且 $f'(a)\ne0$ 得到）。容易误选“全局单射”：题目只问局部，全局单射太强，很多函数（如 $\sin x$）全局不单射，但局部有反函数。`},
{"id":R`x2-c3`,"sec":R`x2-s2`,"q":R`中心对称相加首先消掉：`,"opts":[R`偶次项`,R`奇次项`,R`所有余项`,R`常数项`],"a":1,"ex":R`选“奇次项”。$(-h)^k=-h^k$ 当 $k$ 为奇数，所以 $f(x_0+h)$ 与 $f(x_0-h)$ 展开式中的 $h,h^3$ 项符号相反，相加抵消。容易误选“偶次项”：偶次项 $(-h)^2=h^2$ 符号相同，相加后翻倍而不是抵消。`},
{"id":R`x2-c4`,"sec":R`x2-s3`,"q":R`f≥0、f′≥0且f(0)=0时，x&lt;0必有：`,"opts":[R`f(x)>0`,R`f(x)&lt;0`,R`f(x)=0`,R`无法判断`],"a":2,"ex":R`选 $f(x)=0$。$f'\ge0$ 推出 $f$ 递增，$x\lt0$ 时 $f(x)\le f(0)=0$；又题设 $f\ge0$，两者合起来只能 $f(x)=0$。容易误选 $f(x)\lt0$：只用了单调性，忘了题设 $f\ge0$。`}
],
"methods":[
{"id":R`m-x2-audit`,"title":R`局部反函数与 Taylor 估计：做题清单`,"steps":[R`反函数题：(1) 算 $f'(a)$，由 $f'$ 连续说明 $[a-r,a+r]$ 上 $f'$ 同号，故严格单调、单射；(2) 求对应点 $b=f(a)$，即 $g(b)=a$；(3) 代公式 $g'(b)=\frac1{f'(a)}$，$g''(b)=-\frac{f''(a)}{f'(a)^3}$。`,R`误差估计题：写出 $x_0\pm h$ 两个 Taylor 展开，余项用比题目所需高一阶的 Lagrange 形式；相加或相减抵消不要的项，再用 $|f^{(k)}|\le M$ 估计余项。`,R`“对任意 $n$ 成立”型证明：先证 $0\le f(a)\le\frac Cn$（$C$ 与 $n$ 无关），再令 $n\to\infty$。易错：Lagrange 余项里的 $\xi$ 要写清在哪个区间。`]}
],
"problems":[
{"id":R`x2-p1`,"lv":R`真题`,"src":R`2024秋期末2(1)(2)（题解PDF第3页）`,"stmt":R`f(x)=sin x+x²+1。证明存在r>0，使f在[−r,r]单射；记其反函数为g，求g″(1)。`,"hints":[R`单射用“$f'$ 在 $0$ 附近恒正 → 严格递增”来证；反函数二阶导用公式 $g''(y)=-\frac{f''(g(y))}{f'(g(y))^3}$。`,R`$f'(x)=\cos x+2x$ 连续，$f'(0)=1\gt0$，所以存在 $r\gt0$ 使 $[-r,r]$ 上 $f'\gt0$。又 $f(0)=\sin0+0+1=1$，所以 $g(1)=0$。`,R`$f''(x)=-\sin x+2$，$f''(0)=2$。代入：$g''(1)=-\frac{f''(0)}{f'(0)^3}=-\frac{2}{1^3}$。`],"method":R`m-x2-audit`,"sol":R`<p><b>已知</b>：$f(x)=\sin x+x^2+1$。<b>要证</b>：存在 $r\gt0$ 使 $f$ 在 $[-r,r]$ 上单射；<b>求</b>反函数 $g$ 的 $g''(1)$。</p><p><b>第 1 步：单射。</b>$f'(x)=\cos x+2x$ 连续，且 $f'(0)=1\gt0$。由连续性（取 $\varepsilon=\frac12$），存在 $r\gt0$，使 $|x|\le r$ 时 $f'(x)\gt\frac12\gt0$。所以 $f$ 在 $[-r,r]$ 上严格递增，从而单射，存在反函数 $g:f([-r,r])\to[-r,r]$。</p><p><b>第 2 步：对应点。</b>$f(0)=\sin0+0+1=1$，所以 $g(1)=0$。</p><p><b>第 3 步：反函数二阶导公式。</b>由 $f(g(y))=y$ 求导得 $f'(g(y))g'(y)=1$，即 $g'(y)=\frac1{f'(g(y))}$。再求导：</p>$$g''(y)=-\frac{f''(g(y))\,g'(y)}{f'(g(y))^2}=-\frac{f''(g(y))}{f'(g(y))^3}.$$<p><b>第 4 步：代值。</b>$f'(0)=\cos0+0=1$，$f''(x)=-\sin x+2$，$f''(0)=2$。所以</p>$$g''(1)=-\frac{f''(0)}{f'(0)^3}=-\frac21=-2.$$<p><b>答案：$g''(1)=-2$</b>（顺带 $g'(1)=\frac1{f'(0)}=1$）。</p>`},
{"id":R`x2-p2`,"lv":R`真题`,"src":R`选做·第二次30分钟：2024秋期末5(1)–(3)（题解PDF第5–6页）`,"stmt":R`设f在R上有任意阶导数，f(0)=0，且f≥0、所有正阶导数均≥0。证明f恒为0。`,"hints":[R`三步走：(1) 负半轴上 $f\equiv0$，从而 $f^{(m)}(0)=0$ 对所有 $m$；(2) 对 $a\gt0$ 证 $f^{(m)}(a)\ge\frac{m!f(a)}{a^m}$；(3) 在 $a$ 处向 $2a$ 展开，得 $f(2a)\ge nf(a)$。`,R`(2)：在 $0$ 处展开到 $m-1$ 阶带 $m$ 阶 Lagrange 余项，因为 $0$ 处各阶导数为 0，得 $f(a)=\frac{f^{(m)}(\xi)}{m!}a^m$（$0\lt\xi\lt a$）；而 $f^{(m+1)}\ge0$ 说明 $f^{(m)}$ 递增，所以 $f^{(m)}(a)\ge f^{(m)}(\xi)=\frac{m!f(a)}{a^m}$。`,R`(3)：$f(2a)=\sum_{m=0}^{n-1}\frac{f^{(m)}(a)}{m!}a^m+\frac{f^{(n)}(\eta)}{n!}a^n$，余项 $\ge0$；由 (2) 每一项 $\frac{f^{(m)}(a)}{m!}a^m\ge f(a)$。所以 $f(2a)\ge nf(a)$，即 $0\le f(a)\le\frac{f(2a)}n$，令 $n\to\infty$。`],"method":R`m-x2-audit`,"sol":R`<p><b>已知</b>：$f$ 在 $\mathbb R$ 上有任意阶导数，$f(0)=0$，$f\ge0$，且 $f^{(m)}\ge0$ 对所有 $m\ge1$ 成立。<b>要证</b>：$f\equiv0$。</p><p><b>第 1 步：负半轴。</b>$f'\ge0$，所以 $f$ 单调不减；$x\lt0$ 时 $f(x)\le f(0)=0$，又 $f(x)\ge0$，故 $f(x)=0$。即 $f$ 在 $(-\infty,0]$ 上恒为 0。</p><p><b>第 2 步：$0$ 处各阶导数为 0。</b>归纳：设 $f^{(m-1)}$ 在 $(-\infty,0]$ 上恒为 0（$m=1$ 时即第 1 步）。$f^{(m)}(0)$ 存在，它等于左导数 $\lim_{h\to0^-}\frac{f^{(m-1)}(h)-f^{(m-1)}(0)}{h}=\lim\frac{0-0}h=0$；在 $(-\infty,0)$ 内 $f^{(m)}$ 是常数 0 的导数，也为 0。所以 $f^{(m)}$ 在 $(-\infty,0]$ 上恒为 0。从而 $f^{(m)}(0)=0$ 对所有 $m\ge0$ 成立。</p><p><b>第 3 步：关键不等式。</b>固定 $a\gt0$ 和 $m\ge1$。在 $0$ 处 Taylor 展开到 $m-1$ 阶、带 $m$ 阶 Lagrange 余项，由于 $0$ 处各阶导数都是 0：</p>$$f(a)=\frac{f^{(m)}(\xi)}{m!}a^m,\quad0\lt\xi\lt a.$$<p>因为 $f^{(m+1)}\ge0$，$f^{(m)}$ 单调不减，$f^{(m)}(a)\ge f^{(m)}(\xi)=\frac{m!f(a)}{a^m}$，即</p>$$\frac{f^{(m)}(a)}{m!}a^m\ge f(a)\quad(m\ge1).$$<p><b>第 4 步：在 $a$ 处展开到 $2a$。</b>对任意 $n\ge1$，存在 $\eta\in(a,2a)$：</p>$$f(2a)=\sum_{m=0}^{n-1}\frac{f^{(m)}(a)}{m!}a^m+\frac{f^{(n)}(\eta)}{n!}a^n.$$<p>余项 $\ge0$（因为 $f^{(n)}\ge0$）；$m=0$ 那项就是 $f(a)$；$m\ge1$ 的每项由第 3 步 $\ge f(a)$。共 $n$ 项，所以 $f(2a)\ge nf(a)$。</p><p><b>第 5 步：</b>$0\le f(a)\le\frac{f(2a)}n$ 对所有 $n$ 成立，令 $n\to\infty$ 得 $f(a)=0$。$a\gt0$ 任意，结合第 1 步，<b>$f$ 在 $\mathbb R$ 上恒为 0</b>。</p>`}
],
"variants":[
{"id":R`x2-v1`,"lv":R`真题`,"src":R`2022秋期末电子系A卷4（PDF第1页）`,"stmt":R`若邻域内|f⁽⁴⁾|≤M，证明对足够小h≠0，$\left|f″(x_0)-[f(x_0+h)-2f(x_0)+f(x_0-h)]/h^2\right|\le Mh^2/12$。`,"hints":[R`把 $f(x_0+h)$、$f(x_0-h)$ 在 $x_0$ 处都展开到 3 阶，余项用 4 阶 Lagrange 形式（因为题目给的是 $f^{(4)}$ 的界）。`,R`两式相加：$f(x_0+h)+f(x_0-h)=2f(x_0)+f''(x_0)h^2+\frac{f^{(4)}(\xi_+)+f^{(4)}(\xi_-)}{24}h^4$，一次、三次项抵消。`,R`移项：$\frac{f(x_0+h)-2f(x_0)+f(x_0-h)}{h^2}-f''(x_0)=\frac{f^{(4)}(\xi_+)+f^{(4)}(\xi_-)}{24}h^2$，绝对值 $\le\frac{2M}{24}h^2$。`],"method":R`m-x2-audit`,"sol":R`<p><b>已知</b>：在 $x_0$ 的某邻域内 $|f^{(4)}|\le M$。<b>要证</b>：$|h|$ 足够小（使 $x_0\pm h$ 在该邻域内）且 $h\ne0$ 时，</p>$$\left|f''(x_0)-\frac{f(x_0+h)-2f(x_0)+f(x_0-h)}{h^2}\right|\le\frac{Mh^2}{12}.$$<p><b>第 1 步：两个 Taylor 展开</b>（带 Lagrange 余项，$\xi_+$ 在 $x_0$ 与 $x_0+h$ 之间，$\xi_-$ 在 $x_0$ 与 $x_0-h$ 之间）：</p>$$f(x_0+h)=f(x_0)+f'(x_0)h+\frac{f''(x_0)}2h^2+\frac{f'''(x_0)}6h^3+\frac{f^{(4)}(\xi_+)}{24}h^4,$$<p>以及</p>$$f(x_0-h)=f(x_0)-f'(x_0)h+\frac{f''(x_0)}2h^2-\frac{f'''(x_0)}6h^3+\frac{f^{(4)}(\xi_-)}{24}h^4.$$<p><b>第 2 步：相加</b>，$h$ 与 $h^3$ 项抵消：</p>$$f(x_0+h)-2f(x_0)+f(x_0-h)=f''(x_0)h^2+\frac{f^{(4)}(\xi_+)+f^{(4)}(\xi_-)}{24}h^4.$$<p><b>第 3 步：除以 $h^2$ 并取绝对值。</b></p>$$\left|\frac{f(x_0+h)-2f(x_0)+f(x_0-h)}{h^2}-f''(x_0)\right|=\frac{|f^{(4)}(\xi_+)+f^{(4)}(\xi_-)|}{24}h^2\le\frac{M+M}{24}h^2=\frac{Mh^2}{12}.$$<p><b>结论得证。</b></p>`}
],
"extensions":[
{"id":R`x2-e1`,"lv":R`延伸`,"src":R`自编：反函数公式核验`,"stmt":R`f(x)=x+x³，在0附近求其反函数g的g′(0)、g″(0)、g‴(0)。`,"hints":[R`$f'(x)=1+3x^2\gt0$，$f$ 在全体实数上严格递增，有反函数 $g$，且 $g(0)=0$。可以用反函数求导公式，也可以设 $g(y)=y+ay^3+o(y^3)$ 待定系数。`,R`待定系数：把 $g$ 代入 $g+g^3=y$。由于 $f$ 是奇函数，$g$ 也是奇函数，没有 $y^2$ 项。`,R`$g+g^3=(y+ay^3)+y^3+o(y^3)=y+(a+1)y^3+o(y^3)=y$，所以 $a=-1$。对照 Taylor 系数：$g'(0)=1$，$\frac{g''(0)}{2}=0$，$\frac{g'''(0)}{6}=a$。`],"method":R`m-x2-audit`,"sol":R`<p><b>已知</b>：$f(x)=x+x^3$，求反函数 $g$ 在 $0$ 处的 $g'(0),g''(0),g'''(0)$。</p><p><b>第 1 步：反函数存在。</b>$f'(x)=1+3x^2\gt0$，$f$ 在 $\mathbb R$ 上严格递增且连续可导，所以有反函数 $g$，$g$ 也任意阶可导（因为 $f'\ne0$），且 $f(0)=0\Rightarrow g(0)=0$。</p><p><b>第 2 步：一阶、二阶。</b>$f'(0)=1$，$f''(x)=6x$，$f''(0)=0$。由公式</p>$$g'(0)=\frac1{f'(0)}=1,\qquad g''(0)=-\frac{f''(0)}{f'(0)^3}=0.$$<p><b>第 3 步：三阶（用待定系数）。</b>由 Taylor 公式写 $g(y)=y+by^2+ay^3+o(y^3)$，其中 $b=\frac{g''(0)}2=0$，$a=\frac{g'''(0)}6$。代入恒等式 $g(y)+g(y)^3=y$：</p>$$y+ay^3+y^3+o(y^3)=y\ \Rightarrow\ a+1=0\ \Rightarrow\ a=-1.$$<p>所以 $g'''(0)=6a=-6$。</p><p><b>验算</b>（直接求导）：对 $g+g^3=y$ 求三次导，在 $y=0$ 处 $g=0$、$g'=1$、$g''=0$，得 $g'''(0)+6g'(0)^3=0$，即 $g'''(0)=-6$，一致。</p><p><b>答案：$g'(0)=1$，$g''(0)=0$，$g'''(0)=-6$。</b></p>`},
{"id":R`x2-e2`,"lv":R`选做`,"src":R`补练：2022秋期末2(2)：Taylor系数与导数双证`,"stmt":R`证明对一切实数x，$\cosh x=(e^x+e^{-x})/2\le e^{x^2/2}$。主解按原题要求用Taylor系数比较，再用导数链交叉核验。`,"hints":[R`原题要求用 Taylor 系数比较：把 $\cosh x$ 和 $e^{x^2/2}$ 都写成幂级数（只含偶次项），然后逐项比较系数。`,R`$\cosh x=\sum_{k=0}^\infty\frac{x^{2k}}{(2k)!}$，$e^{x^2/2}=\sum_{k=0}^\infty\frac{(x^2/2)^k}{k!}=\sum_{k=0}^\infty\frac{x^{2k}}{2^kk!}$。只要证 $(2k)!\ge2^kk!$。`,R`$(2k)!=\prod_{j=1}^k(2j)(2j-1)$，而 $\prod_{j=1}^k(2j)=2^kk!$，$\prod(2j-1)\ge1$，所以 $(2k)!\ge2^kk!$。$x^{2k}\ge0$，逐项比较后相加。`],"method":R`m-x2-audit`,"sol":R`<p><b>要证</b>：对所有实数 $x$，$\cosh x=\frac{e^x+e^{-x}}2\le e^{x^2/2}$。</p><p><b>方法一（Taylor 系数比较，原题要求）</b></p><p>第 1 步：$\cosh x$ 的展开。$(\cosh x)'=\sinh x$，$(\cosh x)''=\cosh x$，所以 $0$ 处偶数阶导数为 1、奇数阶为 0。在 $0$ 处展开到 $2N+1$ 阶，Lagrange 余项满足</p>$$|R_N(x)|\le\frac{\cosh(|x|)\,|x|^{2N+2}}{(2N+2)!}\le\frac{e^{|x|}|x|^{2N+2}}{(2N+2)!}\to0\ (N\to\infty),$$<p>所以 $\cosh x=\sum_{k=0}^{\infty}\frac{x^{2k}}{(2k)!}$。</p><p>第 2 步：$e^{x^2/2}$ 的展开。由 $e^u=\sum_{k\ge0}\frac{u^k}{k!}$（同理余项趋于 0），令 $u=\frac{x^2}2$：$e^{x^2/2}=\sum_{k=0}^\infty\frac{x^{2k}}{2^kk!}$。</p><p>第 3 步：比较系数。$(2k)!=\prod_{j=1}^{k}(2j)(2j-1)=\left(\prod_{j=1}^k2j\right)\left(\prod_{j=1}^k(2j-1)\right)=2^kk!\cdot\prod_{j=1}^k(2j-1)\ge2^kk!$。所以 $\frac{x^{2k}}{(2k)!}\le\frac{x^{2k}}{2^kk!}$（因为 $x^{2k}\ge0$）。</p><p>第 4 步：对前 $N$ 项相加得部分和不等式，令 $N\to\infty$（两边级数都收敛）得 $\cosh x\le e^{x^2/2}$。</p><p><b>方法二（导数核验）</b>：令 $H(x)=\frac{x^2}2-\ln\cosh x$，则 $H(0)=0$，$H'(x)=x-\tanh x$。令 $D(x)=x-\tanh x$，$D(0)=0$，$D'(x)=1-\frac1{\cosh^2x}=\tanh^2x\ge0$，所以 $x\ge0$ 时 $D\ge0$，从而 $H$ 在 $[0,\infty)$ 上递增，$H(x)\ge0$。$H$ 是偶函数，所以对所有 $x$ 有 $H\ge0$，即 $\ln\cosh x\le\frac{x^2}2$，指数化即得。</p><p><b>结论：对一切实数 $x$，$\cosh x\le e^{x^2/2}$</b>（仅 $x=0$ 时取等）。</p>`}
]
},

"title":R`往年卷查漏：三角和式、振荡积分与差分递推`,
"goal":R`处理含 $\sin(nt)$、$\sin^2(nt)$ 的积分：(1) 先把被积函数化成有限个三角函数之和；(2) 或者对相邻的 $n$ 作差得到递推；(3) 判断 $\int\cos u/\sqrt{1+4u}$ 这类“振荡”反常积分收敛，先在有限区间 $[0,R]$ 上分部积分。主线约 30 分钟。`,
"sections":[
{"id":R`x3-s1`,"h":R`1. 有限个三角函数之和：乘 $2\sin t$ 后相邻项抵消`,"html":R`<p>这节解决：$\sin t+\sin3t+\dots+\sin(2n-1)t$ 这种和怎么化成一个简单式子。</p><p>关键恒等式（积化和差）：</p>$$2\sin t\sin((2j-1)t)=\cos((2j-2)t)-\cos(2jt).$$<p>对 $j=1,2,\dots,n$ 相加，右边前后相邻项互相抵消（这种求和叫“裂项相消”，也叫“望远镜求和”）：</p>$$\big(\cos0-\cos2t\big)+\big(\cos2t-\cos4t\big)+\dots+\big(\cos(2n-2)t-\cos2nt\big)=1-\cos2nt=2\sin^2(nt).$$<p>所以当 $\sin t\ne0$ 时</p>$$\sum_{j=1}^n\sin((2j-1)t)=\frac{\sin^2(nt)}{\sin t}.$$<p>例：$n=2$，$\sin t+\sin3t=\frac{\sin^22t}{\sin t}$；取 $t=\frac\pi2$：左边 $1+(-1)=0$，右边 $\frac{0}{1}=0$ ✓。</p><p>注意 $\sin t=0$（如 $t=0$）时右边分母为 0，等式只在 $\sin t\ne0$ 处成立；积分时这个单点不影响结果，因为右边在 $t\to0$ 时有极限，可以连续补值。</p>`},
{"id":R`x3-s2`,"h":R`2. 一族积分 $K_n$：相邻两个作差`,"html":R`<p>这节解决：$K_n=\int_0^{\pi/2}\frac{\sin(nt)}{\sin t}dt$ 不好直接算，但 $K_n$ 与 $K_{n-2}$ 的差很好算。</p><p>由和差化积 $\sin(nt)-\sin((n-2)t)=2\cos((n-1)t)\sin t$，分母的 $\sin t$ 被约掉：</p>$$K_n-K_{n-2}=\int_0^{\pi/2}2\cos((n-1)t)dt=\frac{2\sin\frac{(n-1)\pi}2}{n-1}\quad(n\ge2).$$<p>当 $n$ 为奇数时 $n-1$ 是偶数，$\sin\frac{(n-1)\pi}2=0$，所以 $K_3=K_1$，$K_5=K_3$……全部奇数项都等于 $K_1=\int_0^{\pi/2}1\,dt=\frac\pi2$。</p><p>偶数项例：$K_0=0$，$K_2=K_0+\frac{2\sin(\pi/2)}1=2$。</p>`},
{"id":R`x3-s3`,"h":R`3. 振荡积分：用分部积分证收敛`,"html":R`<p>这节解决：$\int_0^\infty\frac{\cos u}{\sqrt{1+4u}}du$ 这种积分，被积函数正负交替（叫“振荡”），用绝对值放大会得到 $\int\frac{1}{\sqrt{1+4u}}=\infty$，什么也说明不了。</p><p><b>办法</b>：设 $a(u)\to0$（$u\to\infty$），且 $\int^\infty|a'(u)|du$ 有限。先在有限区间 $[c,R]$ 上分部积分：</p>$$\int_c^Ra(u)\cos u\,du=\big[a(u)\sin u\big]_c^R-\int_c^Ra'(u)\sin u\,du.$$<p>右边第一项：$|a(R)\sin R|\le|a(R)|\to0$；第二项：$|a'\sin u|\le|a'|$，绝对可积，所以有极限。因此原积分收敛。注意 $a$ 本身不必可积（如 $a=\frac1{\sqrt{1+4u}}$）。</p><p>对 $\sin x\sin(x^2)$：先积化和差成 $\frac12[\cos(x^2-x)-\cos(x^2+x)]$，再令 $u=x^2\mp x$，就变成上面的形式。</p><p>易错：“$|\text{被积函数}|\le$ 某个积分发散的函数”推不出原积分发散——上界发散不提供任何信息。</p>`}
],

{"id":R`x3-c1`,"sec":R`x3-s1`,"q":R`有限三角和与积分交换是否需要无穷级数定理？`,"opts":[R`需要一致收敛`,R`不需要，只用有限线性性`,R`绝不允许`,R`仅各项非负可交换`],"a":1,"ex":R`选“不需要，只用有限线性性”。有限个函数之和的积分等于各自积分之和（积分的线性性），对任何有限 $n$ 都成立；只有交换“积分”与“无穷求和/极限”时才需要一致收敛之类的条件。容易误选“需要一致收敛”：那是无穷级数逐项积分的条件，这里每个 $n$ 都只有 $n$ 项。`},
{"id":R`x3-c2`,"sec":R`x3-s2`,"q":R`K₁与K₃的差为：`,"opts":[R`0`,R`1`,R`π/2`,R`不存在`],"a":0,"ex":R`选 0。由递推 $K_3-K_1=\frac{2\sin\frac{2\pi}2}{2}=\sin\pi=0$。容易误选 $\frac\pi2$：那是 $K_1$ 本身的值（也等于 $K_3$），不是它们的差。`},
{"id":R`x3-c3`,"sec":R`x3-s3`,"q":R`用于振荡判敛的分部应先在哪里做？`,"opts":[R`直接0到∞并丢端点`,R`有限截断区间`,R`任意去掉奇点`,R`只算原函数值`],"a":1,"ex":R`选“有限截断区间”。先在 $[0,R]$ 上分部积分，边界项 $[a(u)\sin u]_0^R$ 要写出来，然后再令 $R\to\infty$ 逐项取极限。容易误选“直接 0 到 ∞ 并丢端点”：还没证明收敛就在无穷区间上分部，边界项在 $\infty$ 处是否有极限也没检查，论证不完整。`},
{"id":R`x3-c4`,"sec":R`x3-s3`,"q":R`用不可积函数控制|被积函数|的上界，能证明原积分发散吗？`,"opts":[R`能`,R`不能`,R`若振荡就能`,R`若趋零就能`],"a":1,"ex":R`选“不能”。$|f|\le g$ 且 $\int g=\infty$ 不说明任何事：例如 $\left|\frac{\sin x}x\right|\le\frac1x$，$\int_1^\infty\frac{dx}x$ 发散，但 $\int_1^\infty\frac{\sin x}xdx$ 收敛。要证发散需要“下界发散”或其他方法。容易误选“若振荡就能”：振荡反而常常让积分收敛。`}
],

{"id":R`m-x3-audit`,"title":R`三角和、振荡积分与递推：做题清单`,"steps":[R`先认题型：(a) 被积函数是 $\frac{\sin^2(nt)}{\sin t}$ 一类 → 写成有限三角和；(b) 一族带参数 $n$ 的积分 → 算相邻差 $K_n-K_{n-2}$ 或 $I_{n+1}-I_n$；(c) $\int^\infty$ 里有 $\cos u$、$\sin u$ → 振荡积分。`,R`递推要写出初值（如 $K_0=0$，$K_1=\frac\pi2$）再逐步推；振荡积分在 $[c,R]$ 上分部，写出边界项，说明它趋于 0、剩余积分绝对收敛。`,R`求 $\frac{I_n}{\ln n}$ 这类极限：用 Stolz，先写“$\ln n$ 严格递增趋于 $+\infty$”。易错：$|$被积函数$|\le$ 发散函数，不能推出发散。`]}

"problems":[
{"id":R`x3-p1`,"lv":R`真题`,"src":R`2024秋期末4(1)–(3)（题解PDF第4–5页）`,"stmt":R`<p>定义 $K_n=\int_0^{\pi/2}\sin(nt)/\sin t\,dt$，n≥0。</p><p>求Kₙ与Kₙ₋₂的递推；化简∑ⱼ₌₁ⁿsin((2j−1)t)，并求 $L_n=\int_0^{\pi/2}\sin^2(nt)/\sin^2t\,dt$。</p>`,"hints":[R`三件事：(1) $K_n-K_{n-2}$ 用和差化积约掉 $\sin t$；(2) 有限和 $\sum\sin((2j-1)t)$ 乘 $2\sin t$ 后裂项；(3) $\frac{\sin^2(nt)}{\sin^2t}=\frac1{\sin t}\sum_{j=1}^n\sin((2j-1)t)$，所以 $L_n$ 是若干个 $K$ 之和。`,R`(1) $\sin(nt)-\sin((n-2)t)=2\cos((n-1)t)\sin t$，得 $K_n-K_{n-2}=\int_0^{\pi/2}2\cos((n-1)t)dt=\frac{2\sin((n-1)\pi/2)}{n-1}$。(2) $2\sin t\sin((2j-1)t)=\cos((2j-2)t)-\cos(2jt)$，求和得 $1-\cos2nt=2\sin^2(nt)$。`,R`(3) $L_n=\int_0^{\pi/2}\sum_{j=1}^n\frac{\sin((2j-1)t)}{\sin t}dt=\sum_{j=1}^nK_{2j-1}$；奇数项递推差为 0，$K_{2j-1}=K_1=\frac\pi2$，所以 $L_n=\frac{n\pi}2$。`],"method":R`m-x3-audit`,"sol":R`<p><b>已知</b>：$K_n=\int_0^{\pi/2}\frac{\sin(nt)}{\sin t}dt$（被积函数在 $t=0$ 处的极限是 $n$，补值后连续，所以是普通积分）。</p><p><b>(1) 递推。</b>$K_0=0$，$K_1=\int_0^{\pi/2}1dt=\frac\pi2$。$n\ge2$ 时由和差化积 $\sin A-\sin B=2\cos\frac{A+B}2\sin\frac{A-B}2$，取 $A=nt$，$B=(n-2)t$：</p>$$\sin(nt)-\sin((n-2)t)=2\cos((n-1)t)\sin t.$$<p>所以</p>$$K_n-K_{n-2}=\int_0^{\pi/2}2\cos((n-1)t)dt=\frac{2\sin\frac{(n-1)\pi}2}{n-1}.$$<p>$n$ 为奇数时右边为 0，于是 $K_1=K_3=K_5=\dots=\frac\pi2$。</p><p><b>(2) 化简有限和。</b>由积化和差 $2\sin A\sin B=\cos(A-B)-\cos(A+B)$：</p>$$2\sin t\sin((2j-1)t)=\cos((2j-2)t)-\cos(2jt).$$<p>对 $j=1,\dots,n$ 相加，中间项两两抵消：</p>$$2\sin t\sum_{j=1}^n\sin((2j-1)t)=\cos0-\cos(2nt)=1-\cos2nt=2\sin^2(nt).$$<p>所以 $\sin t\ne0$ 时 $\displaystyle\sum_{j=1}^n\sin((2j-1)t)=\frac{\sin^2(nt)}{\sin t}$。</p><p><b>(3) 求 $L_n$。</b>在 $(0,\frac\pi2]$ 上两边除以 $\sin t$：</p>$$\frac{\sin^2(nt)}{\sin^2t}=\sum_{j=1}^n\frac{\sin((2j-1)t)}{\sin t}.$$<p>（左边 $t\to0$ 时极限为 $n^2$，补值后连续，所以 $L_n$ 是普通积分，单点 $t=0$ 不影响积分值。）两边在 $[0,\frac\pi2]$ 上积分，有限和可以逐项积分：</p>$$L_n=\sum_{j=1}^nK_{2j-1}=n\cdot\frac\pi2.$$<p><b>答案：$K_n-K_{n-2}=\frac{2\sin((n-1)\pi/2)}{n-1}$（$n\ge2$）；$\sum_{j=1}^n\sin((2j-1)t)=\frac{\sin^2(nt)}{\sin t}$；$L_n=\frac{n\pi}2$。</b></p><p>验算 $n=1$：$L_1=\int_0^{\pi/2}1dt=\frac\pi2$ ✓。</p>`},
{"id":R`x3-p2`,"lv":R`真题`,"src":R`2024秋期末7(1)(2)（题解PDF第8–10页）`,"stmt":R`<p>(1) 用分部证明 $\int_0^\infty\cos u/\sqrt{1+4u}\,du$ 收敛。</p><p>(2) 证明 $\int_1^\infty\sin x\sin(x^2)dx$ 收敛。</p>`,"hints":[R`(1) 被积函数正负振荡，绝对值放大没用。在 $[0,R]$ 上分部：取 $a(u)=(1+4u)^{-1/2}$ 求导，$\cos u\,du=d(\sin u)$。(2) 先积化和差，再换元化成 (1) 的形式。`,R`(1) $a'(u)=-2(1+4u)^{-3/2}$，分部得 $\int_0^R\frac{\cos u}{\sqrt{1+4u}}du=\frac{\sin R}{\sqrt{1+4R}}+2\int_0^R\frac{\sin u}{(1+4u)^{3/2}}du$。(2) $\sin x\sin(x^2)=\frac12[\cos(x^2-x)-\cos(x^2+x)]$。`,R`(2) 令 $u=x^2-x$：$du=(2x-1)dx$，而 $(2x-1)^2=4u+1$，所以 $dx=\frac{du}{\sqrt{1+4u}}$，$x=1\Rightarrow u=0$。同理 $u=x^2+x$ 时 $dx=\frac{du}{\sqrt{1+4u}}$，$x=1\Rightarrow u=2$。`],"method":R`m-x3-audit`,"sol":R`<p><b>(1)</b> 证 $\int_0^\infty\frac{\cos u}{\sqrt{1+4u}}du$ 收敛。</p><p>第 1 步：在 $[0,R]$ 上分部积分。令 $a(u)=(1+4u)^{-1/2}$，$a'(u)=-2(1+4u)^{-3/2}$；$\cos u\,du=d(\sin u)$：</p>$$\int_0^R\frac{\cos u}{\sqrt{1+4u}}du=\left[\frac{\sin u}{\sqrt{1+4u}}\right]_0^R+2\int_0^R\frac{\sin u}{(1+4u)^{3/2}}du.$$<p>第 2 步：边界项 $=\frac{\sin R}{\sqrt{1+4R}}-0$，绝对值 $\le\frac1{\sqrt{1+4R}}\to0$。</p><p>第 3 步：剩余积分。$\left|\frac{\sin u}{(1+4u)^{3/2}}\right|\le(1+4u)^{-3/2}$，而 $\int_0^\infty(1+4u)^{-3/2}du=\left[-\frac12(1+4u)^{-1/2}\right]_0^\infty=\frac12$ 有限，由比较判别法它绝对收敛，所以 $R\to\infty$ 时有极限。</p><p>第 4 步：两部分都有极限，故原积分收敛。</p><p><b>(2)</b> 证 $\int_1^\infty\sin x\sin(x^2)dx$ 收敛。</p><p>第 1 步：积化和差，$\sin x\sin(x^2)=\frac12\left[\cos(x^2-x)-\cos(x^2+x)\right]$。只要两部分分别收敛即可。</p><p>第 2 步：第一部分，令 $u=x^2-x$。$x\ge1$ 时 $u'=2x-1\gt0$，$u$ 严格递增；$x=1\Rightarrow u=0$，$x\to\infty\Rightarrow u\to\infty$。又 $(2x-1)^2=4x^2-4x+1=4u+1$，且 $2x-1\gt0$，所以 $2x-1=\sqrt{1+4u}$，$dx=\frac{du}{\sqrt{1+4u}}$：</p>$$\int_1^R\cos(x^2-x)dx=\int_0^{R^2-R}\frac{\cos u}{\sqrt{1+4u}}du.$$<p>由 (1)，$R\to\infty$ 时收敛。</p><p>第 3 步：第二部分，令 $u=x^2+x$，同理 $(2x+1)^2=4u+1$，$dx=\frac{du}{\sqrt{1+4u}}$，$x=1\Rightarrow u=2$：</p>$$\int_1^R\cos(x^2+x)dx=\int_2^{R^2+R}\frac{\cos u}{\sqrt{1+4u}}du,$$<p>它是 (1) 中收敛积分去掉 $[0,2]$ 一段，也收敛。</p><p><b>结论：(1)、(2) 两个积分都收敛。</b></p>`}
],

{"id":R`x3-v1`,"lv":R`真题`,"src":R`2023秋电子系A卷10（答案PDF第7页；回忆版第2页T9）`,"stmt":R`令 $I_n=\int_0^{\pi/2}\sin^2(nt)/\sin t\,dt$，求lim Iₙ/ln n。`,"hints":[R`直接算 $I_n$ 难，先算相邻差 $I_{n+1}-I_n$，再用 Stolz 定理求 $\frac{I_n}{\ln n}$。`,R`$\sin^2A-\sin^2B=\sin(A+B)\sin(A-B)$，取 $A=(n+1)t$，$B=nt$：$\sin^2((n+1)t)-\sin^2(nt)=\sin((2n+1)t)\sin t$，分母 $\sin t$ 约掉。`,R`$I_{n+1}-I_n=\int_0^{\pi/2}\sin((2n+1)t)dt=\frac{1-\cos((2n+1)\pi/2)}{2n+1}=\frac1{2n+1}$。Stolz：$\frac{1/(2n+1)}{\ln(n+1)-\ln n}$，而 $\ln(1+\frac1n)\sim\frac1n$。`],"method":R`m-x3-audit`,"sol":R`<p><b>目标</b>：$I_n=\int_0^{\pi/2}\frac{\sin^2(nt)}{\sin t}dt$，求 $\lim_{n\to\infty}\frac{I_n}{\ln n}$。</p><p><b>第 1 步：相邻作差。</b>由 $\sin^2A-\sin^2B=\sin(A+B)\sin(A-B)$，取 $A=(n+1)t$，$B=nt$：</p>$$\sin^2((n+1)t)-\sin^2(nt)=\sin((2n+1)t)\sin t.$$<p>所以</p>$$I_{n+1}-I_n=\int_0^{\pi/2}\sin((2n+1)t)dt=\left[-\frac{\cos((2n+1)t)}{2n+1}\right]_0^{\pi/2}=\frac{1-\cos\frac{(2n+1)\pi}2}{2n+1}=\frac1{2n+1}.$$<p>（$\frac{(2n+1)\pi}2$ 是 $\frac\pi2$ 的奇数倍，余弦为 0。）</p><p><b>第 2 步：Stolz 定理。</b>取 $A_n=I_n$，$B_n=\ln n$。$B_n$ 严格递增且 $\to+\infty$，满足条件。</p>$$\frac{A_{n+1}-A_n}{B_{n+1}-B_n}=\frac{\frac1{2n+1}}{\ln\left(1+\frac1n\right)}.$$<p>因为 $\ln(1+\frac1n)=\frac1n+o(\frac1n)$，上式 $=\frac{n}{2n+1}\cdot\frac{1}{1+o(1)}\to\frac12$。</p><p><b>第 3 步：</b>由 Stolz，$\lim\frac{I_n}{\ln n}=\frac12$。</p><p><b>答案：$\frac12$。</b>（直观：$I_n=1+\frac13+\frac15+\dots+\frac1{2n-1}$，约为 $\frac12\ln n$。）</p>`}
],

{"id":R`x3-e1`,"lv":R`真题`,"src":R`2023秋期末6(2)（mathsdream原卷第2页）`,"stmt":R`已知∫₀∞sin t/t dt=π/2，计算 $\int_0^\infty(\sin x/x)^2dx$。`,"hints":[R`先说明收敛：$x\to0$ 时 $\frac{\sin x}x\to1$；$x\to\infty$ 时 $\left(\frac{\sin x}x\right)^2\le\frac1{x^2}$。求值：分部积分把 $\frac1{x^2}$ 降成 $\frac1x$，用上已知的 $\int_0^\infty\frac{\sin t}tdt$。`,R`在 $[\varepsilon,R]$ 上取 $u=\sin^2x$，$du=2\sin x\cos x\,dx=\sin2x\,dx$；$dv=\frac{dx}{x^2}$，$v=-\frac1x$。`,R`$\int_\varepsilon^R\frac{\sin^2x}{x^2}dx=\left[-\frac{\sin^2x}x\right]_\varepsilon^R+\int_\varepsilon^R\frac{\sin2x}xdx$；边界项都 $\to0$；令 $t=2x$，$\int\frac{\sin2x}xdx=\int\frac{\sin t}tdt\to\frac\pi2$。`],"method":R`m-x3-audit`,"sol":R`<p><b>已知</b>：$\int_0^\infty\frac{\sin t}tdt=\frac\pi2$。<b>目标</b>：求 $\int_0^\infty\left(\frac{\sin x}x\right)^2dx$。</p><p><b>第 1 步：收敛。</b>$x\to0^+$ 时 $\frac{\sin x}x\to1$，被积函数补值 1 后在 $[0,1]$ 上连续；$x\ge1$ 时 $0\le\frac{\sin^2x}{x^2}\le\frac1{x^2}$，$\int_1^\infty\frac{dx}{x^2}=1$，由比较判别法收敛。所以原积分（绝对）收敛。</p><p><b>第 2 步：在 $[\varepsilon,R]$ 上分部积分。</b>取 $u=\sin^2x$，$du=2\sin x\cos x\,dx=\sin2x\,dx$；$dv=\frac{dx}{x^2}$，$v=-\frac1x$：</p>$$\int_\varepsilon^R\frac{\sin^2x}{x^2}dx=\left[-\frac{\sin^2x}{x}\right]_\varepsilon^R+\int_\varepsilon^R\frac{\sin2x}{x}dx.$$<p><b>第 3 步：边界项。</b>$\left|\frac{\sin^2R}R\right|\le\frac1R\to0$；$\frac{\sin^2\varepsilon}\varepsilon\le\frac{\varepsilon^2}{\varepsilon}=\varepsilon\to0$（用 $|\sin\varepsilon|\le\varepsilon$）。</p><p><b>第 4 步：剩余积分。</b>令 $t=2x$，$dx=\frac{dt}2$，$\frac{\sin2x}x=\frac{2\sin t}{t}$，所以 $\frac{\sin2x}xdx=\frac{\sin t}tdt$：</p>$$\int_\varepsilon^R\frac{\sin2x}xdx=\int_{2\varepsilon}^{2R}\frac{\sin t}tdt\to\frac\pi2.$$<p><b>第 5 步：</b>令 $\varepsilon\to0^+$，$R\to\infty$：$\int_0^\infty\left(\frac{\sin x}x\right)^2dx=0+\frac\pi2$。</p><p><b>答案：$\frac\pi2$。</b></p>`}
]

"goal":R`补三类“含积分的函数”题：(1) 等式里有 $\int_0^x$，两边求导解出 $f$，最后代回原式检查；(2) 周期函数的原函数什么时候也是周期的；(3) 上下限都含 $x$ 的积分怎么求导、求极限（2025 第 6 题，主线）。延伸里涉及微分方程的部分属于“可能不考”的选做。`,

{"id":R`x4-s1`,"h":R`1. 积分方程：求导得到候选答案，最后必须代回`,"html":R`<p>这节解决：等式中出现 $\int_0^xf(t)dt$ 这种“未知函数的积分”时怎么求 $f$。</p><p><b>工具：微积分基本定理</b>。若 $f$ 连续，$F(x)=\int_0^xf(t)dt$ 可导且 $F'(x)=f(x)$。上下限都是函数时：</p>$$\frac{d}{dx}\int_{u(x)}^{v(x)}f(t)dt=f(v(x))v'(x)-f(u(x))u'(x).$$<p>（下限那项带减号，因为它等于 $F(v(x))-F(u(x))$ 再用链式法则。）</p><p><b>步骤</b>：</p><ol><li>令 $F(x)=\int_0^xf$，把方程改写成 $F$ 和 $F'=f$ 的关系；</li><li>两边求导，解出候选的 $f$；</li><li>代回原方程检查。原因：求导会丢掉常数（$F=G$ 与 $F=G+1$ 求导后一样），所以解出的只是“必要条件”。</li></ol><p>例：$\int_0^xf(t)dt=x^2$，求导得 $f(x)=2x$；代回 $\int_0^x2t\,dt=x^2$ ✓。但若方程是 $\int_0^xf=x^2+1$，求导也得 $2x$，代回 $x=0$ 时 $0\ne1$，说明无解。</p>`},
{"id":R`x4-s2`,"h":R`2. 周期函数的原函数：一般会“漂移”`,"html":R`<p>这节解决：$f$ 是周期函数，它的原函数 $F(x)=\int_0^xf$ 是不是周期函数？</p><p>设 $f$ 连续、周期为 $T\gt0$，记一个周期上的积分 $A=\int_0^Tf$。则</p>$$F(x+T)-F(x)=\int_x^{x+T}f(t)dt=A$$<p>（周期函数在任意一段长为 $T$ 的区间上积分都相同）。所以：</p><ul><li>$A=0$ 时 $F$ 是周期函数；</li><li>$A\ne0$ 时每过一个周期 $F$ 增加 $A$，像台阶一样往上走，叫“线性漂移”。</li></ul><p>例：$f(x)=1+\cos x$（周期 $2\pi$），$A=2\pi$，$F(x)=x+\sin x$ 不是周期函数。</p><p>修正：$G(x)=TF(x)-Ax$ 总是 $T$ 周期的，因为 $G(x+T)-G(x)=T\cdot A-A\cdot T=0$。上例中 $G=2\pi(x+\sin x)-2\pi x=2\pi\sin x$ ✓。</p>`},
{"id":R`x4-s3`,"h":R`3. 局部唯一性：用“$M\le cM$，$c\lt1$”推出 $M=0$`,"html":R`<p>这节解决：已知 $f(0)=f'(0)=0$ 和不等式 $|f''|\le|f|+|f'|$，怎么证明 $f$ 在 0 附近恒为 0。</p><p>思路：在小区间 $[-\delta,\delta]$ 上，令 $M=\max(|f|+|f'|)$（$f,f'$ 连续，最大值存在）。</p><ol><li>用中值定理：$f'(x)=f'(x)-f'(0)=f''(\xi)x$，所以 $|f'(x)|\le M|x|\le\delta M$；</li><li>再用一次：$|f(x)|=|f'(\eta)x|\le\delta\cdot\delta M=\delta^2M$；</li><li>于是 $|f|+|f'|\le(\delta+\delta^2)M$，取最大值得 $M\le(\delta+\delta^2)M$。</li></ol><p>取 $\delta=\frac14$，$\delta+\delta^2=\frac5{16}\lt1$，得 $(1-\frac5{16})M\le0$，又 $M\ge0$，所以 $M=0$。这个证明只用到 $f''$ 存在，不需要 $f''$ 连续。</p>`}

{"id":R`x4-c1`,"sec":R`x4-s1`,"q":R`从积分方程求导后，下一步必须检查：`,"opts":[R`原式回代与初值`,R`只看导数式`,R`任取积分常数`,R`去掉定义域`],"a":0,"ex":R`选“原式回代与初值”。求导只给出必要条件，会丢掉常数，例如 $\int_0^xf=x^2+1$ 求导得 $f=2x$，但代回 $x=0$ 不成立。容易误选“只看导数式”：导数式成立的函数不一定满足原积分方程。`},
{"id":R`x4-c2`,"sec":R`x4-s2`,"q":R`周期T的连续f，其原函数满足：`,"opts":[R`总周期T`,R`F(x+T)−F(x)=∫₀ᵀf`,R`一定不周期`,R`总是偶函数`],"a":1,"ex":R`选 $F(x+T)-F(x)=\int_0^Tf$。周期函数在任意长为 $T$ 的区间上积分都相等，所以原函数每过一个周期增加同一个量。容易误选“总周期 $T$”：只有当 $\int_0^Tf=0$ 时才对，例如 $f=1$ 周期任意，但 $F=x$ 不是周期函数。`},
{"id":R`x4-c3`,"sec":R`x4-s3`,"q":R`M≤cM，M≥0、c&lt;1能推出：`,"opts":[R`M任意`,R`M=0`,R`M=1`,R`M&lt;0`],"a":1,"ex":R`选 $M=0$。移项得 $(1-c)M\le0$，因为 $1-c\gt0$，所以 $M\le0$；再结合 $M\ge0$，只能 $M=0$。容易误选“$M$ 任意”：那是 $c=1$ 时的情形，$c\lt1$ 时不等式会把 $M$ 压到 0。`},
{"id":R`x4-c4`,"sec":R`x4-s1`,"q":R`双变限求导的下限项符号为：`,"opts":[R`加号`,R`减号`,R`无下限项`,R`由x正负改变`],"a":1,"ex":R`选“减号”。$\int_{u(x)}^{v(x)}f=F(v(x))-F(u(x))$，求导得 $f(v)v'-f(u)u'$，下限项前面是减号。容易误选“加号”：忘了 $\int_u^v=F(v)-F(u)$ 中 $F(u)$ 前的负号。`}

{"id":R`m-x4-audit`,"title":R`含积分的函数：做题清单`,"steps":[R`把题中的积分起名字：$F(x)=\int_0^xf$，写出 $F'=f$；检查被积函数连续（基本定理的条件）。上下限含 $x$ 时用 $f(v)v'-f(u)u'$。`,R`积分方程：求导 → 解出候选 → 代回原式并检查 $x=0$ 处的初值。周期题：先算一周期积分 $A=\int_0^Tf$，再写 $F(x+T)=F(x)+A$。`,R`唯一性题：在 $[-\delta,\delta]$ 上设 $M=\max(|f|+|f'|)$，用两次中值定理得 $M\le(\delta+\delta^2)M$，取 $\delta=\frac14$。易错：$M$ 必须是同一个区间上的最大值，并说明它存在（连续函数在闭区间上）。`]}

"problems":[
{"id":R`x4-p1`,"lv":R`真题`,"src":R`2025秋期末A卷6(1)(2)（PDF第2页）`,"stmt":R`对x>1，$F(x)=\int_x^{x^2}dt/\ln t$。判断单调性，并求x→∞与x→1⁺的极限。`,"hints":[R`单调性：对变上下限积分求导，$\frac{d}{dx}\int_x^{x^2}g(t)dt=g(x^2)\cdot2x-g(x)$。$x\to\infty$：找下界；$x\to1^+$：换元 $t=x^u$ 把积分区间固定成 $[1,2]$。`,R`$F'(x)=\frac{2x}{\ln(x^2)}-\frac1{\ln x}=\frac{x-1}{\ln x}\gt0$。在 $[x,x^2]$ 上 $\ln t\le2\ln x$，所以 $F(x)\ge\frac{x^2-x}{2\ln x}$。`,R`令 $t=x^u$（$1\le u\le2$），$dt=x^u\ln x\,du$，$\ln t=u\ln x$，所以 $F(x)=\int_1^2\frac{x^u}udu$。$x\to1^+$ 时 $|x^u-1|\le x^2-1\to0$，$F(x)\to\int_1^2\frac{du}u=\ln2$。`],"method":R`m-x4-audit`,"sol":R`<p><b>已知</b>：$x\gt1$，$F(x)=\int_x^{x^2}\frac{dt}{\ln t}$（$t\gt1$ 时 $\ln t\gt0$，被积函数连续）。</p><p><b>(1) 单调性。</b>由变限积分求导公式：</p>$$F'(x)=\frac{1}{\ln(x^2)}\cdot2x-\frac1{\ln x}\cdot1=\frac{2x}{2\ln x}-\frac1{\ln x}=\frac{x-1}{\ln x}.$$<p>$x\gt1$ 时分子、分母都正，$F'(x)\gt0$，所以 <b>$F$ 在 $(1,\infty)$ 上严格递增</b>。</p><p><b>(2) $x\to+\infty$。</b>$t\in[x,x^2]$ 时 $0\lt\ln t\le\ln x^2=2\ln x$，所以 $\frac1{\ln t}\ge\frac1{2\ln x}$，积分：</p>$$F(x)\ge\frac{x^2-x}{2\ln x}=\frac{x(x-1)}{2\ln x}\to+\infty$$<p>（$x$ 比 $\ln x$ 增长快）。所以 <b>$\lim_{x\to+\infty}F(x)=+\infty$</b>。</p><p><b>(3) $x\to1^+$。</b>换元 $t=x^u$，$u$ 从 1 到 2；$dt=x^u\ln x\,du$，$\ln t=u\ln x$：</p>$$F(x)=\int_1^2\frac{x^u\ln x}{u\ln x}du=\int_1^2\frac{x^u}{u}du.$$<p>当 $1\lt x$ 且 $u\in[1,2]$ 时 $0\le x^u-1\le x^2-1$，所以</p>$$\left|F(x)-\int_1^2\frac{du}u\right|=\int_1^2\frac{x^u-1}udu\le(x^2-1)\ln2\to0\quad(x\to1^+).$$<p>所以 <b>$\lim_{x\to1^+}F(x)=\ln2$</b>。</p>`},
{"id":R`x4-p2`,"lv":R`真题`,"src":R`2022秋期末电子系A卷3、5(2)（PDF第1–2页）`,"stmt":R`<p>(1) f在[0,∞)可微，$\int_0^xtf(t)dt=\frac x3\int_0^xf(t)dt$，x>0，求f。</p><p>(2) 连续2周期f，证明 $G(x)=2\int_0^xf(t)dt-x\int_0^2f(t)dt$ 也是2周期。</p>`,"hints":[R`(1) 令 $F(x)=\int_0^xf$，对原式两边求导，得到 $F$ 和 $F'$ 的方程。(2) 用周期函数原函数的漂移公式 $F(x+2)=F(x)+\int_0^2f$。`,R`(1) 左边求导 $xf(x)$；右边 $\frac13F(x)+\frac x3f(x)$。整理得 $2xF'(x)=F(x)$，即 $\left(\frac{F}{\sqrt x}\right)'=\frac{2xF'-F}{2x^{3/2}}=0$，所以 $F=C\sqrt x$。`,R`(1) 若 $C\ne0$，$f=F'=\frac{C}{2\sqrt x}$ 在 $0$ 附近无界，与 $f$ 在 $0$ 处可微（从而连续、有界）矛盾，故 $C=0$。(2) 记 $A=\int_0^2f$，$G(x+2)=2(F(x)+A)-(x+2)A$，展开化简。`],"method":R`m-x4-audit`,"sol":R`<p><b>(1)</b> 已知 $f$ 在 $[0,\infty)$ 上可微，$\int_0^xtf(t)dt=\frac x3\int_0^xf(t)dt$（$x\gt0$），求 $f$。</p><p>第 1 步：令 $F(x)=\int_0^xf(t)dt$，$f$ 连续，所以 $F'=f$。原式为 $\int_0^xtf(t)dt=\frac x3F(x)$。</p><p>第 2 步：两边对 $x$ 求导：</p>$$xf(x)=\frac13F(x)+\frac x3f(x)\ \Rightarrow\ \frac{2x}3f(x)=\frac13F(x)\ \Rightarrow\ 2xF'(x)=F(x).$$<p>第 3 步：解方程。在 $x\gt0$ 上</p>$$\left(\frac{F(x)}{\sqrt x}\right)'=\frac{F'\sqrt x-\frac{F}{2\sqrt x}}{x}=\frac{2xF'-F}{2x^{3/2}}=0,$$<p>所以 $F(x)=C\sqrt x$（$C$ 为常数），$f(x)=F'(x)=\frac{C}{2\sqrt x}$（$x\gt0$）。</p><p>第 4 步：定常数。$f$ 在 $0$ 处可微，从而在 $0$ 处连续，在 $0$ 附近有界。但若 $C\ne0$，$\frac{C}{2\sqrt x}\to\infty$（$x\to0^+$），矛盾。所以 $C=0$，$f(x)=0$（$x\gt0$），由连续性 $f(0)=0$。</p><p>第 5 步：回代。$f\equiv0$ 时两边都为 0 ✓。</p><p><b>答案：$f\equiv0$。</b></p><p><b>(2)</b> $f$ 连续、周期为 2，证 $G(x)=2\int_0^xf-x\int_0^2f$ 也以 2 为周期。</p><p>第 1 步：记 $F(x)=\int_0^xf$，$A=\int_0^2f$。由周期性，$\int_x^{x+2}f=\int_0^2f=A$，所以 $F(x+2)=F(x)+A$。</p><p>第 2 步：</p>$$G(x+2)=2F(x+2)-(x+2)A=2F(x)+2A-xA-2A=2F(x)-xA=G(x).$$<p><b>结论：$G$ 以 2 为周期。</b></p>`}
],

{"id":R`x4-v1`,"lv":R`真题`,"src":R`2022秋期末电子系A卷6（PDF第2页）`,"stmt":R`设f在(−1,1)二阶可导，f(0)=f′(0)=0，且|f″|≤|f|+|f′|。证明某个0邻域内f恒0。`,"hints":[R`思路：在小区间 $[-\delta,\delta]$ 上设 $M=\max(|f|+|f'|)$，用中值定理把 $|f'|$、$|f|$ 都用 $M$ 控制，得到 $M\le cM$ 且 $c\lt1$。`,R`取 $\delta=\frac14$。对 $|x|\le\delta$：$f'(x)=f'(x)-f'(0)=f''(\xi)x$，而 $|f''(\xi)|\le|f(\xi)|+|f'(\xi)|\le M$，所以 $|f'(x)|\le\delta M$。再 $f(x)=f(x)-f(0)=f'(\eta)x$，$|f(x)|\le\delta\cdot\delta M$。`,R`于是对每个 $|x|\le\delta$：$|f(x)|+|f'(x)|\le(\delta+\delta^2)M=\frac5{16}M$。取最大值得 $M\le\frac5{16}M$，所以 $\frac{11}{16}M\le0$，$M=0$。`],"method":R`m-x4-audit`,"sol":R`<p><b>已知</b>：$f$ 在 $(-1,1)$ 上二阶可导，$f(0)=f'(0)=0$，$|f''(x)|\le|f(x)|+|f'(x)|$。<b>要证</b>：$f$ 在 $0$ 的某邻域内恒为 0。</p><p><b>第 1 步：设最大值。</b>取 $\delta=\frac14$。$f$ 二阶可导，所以 $f$、$f'$ 都可导、都连续，$|f|+|f'|$ 在闭区间 $[-\delta,\delta]$ 上有最大值，记</p>$$M=\max_{|x|\le\delta}\big(|f(x)|+|f'(x)|\big)\ge0.$$<p><b>第 2 步：估计 $|f'|$。</b>对 $|x|\le\delta$，对 $f'$ 在 $0$ 与 $x$ 之间用 Lagrange 中值定理：$f'(x)=f'(0)+f''(\xi)x=f''(\xi)x$，$\xi$ 在 $0$ 与 $x$ 之间（所以 $|\xi|\le\delta$）。由题设 $|f''(\xi)|\le|f(\xi)|+|f'(\xi)|\le M$，所以</p>$$|f'(x)|\le M|x|\le\delta M.$$<p><b>第 3 步：估计 $|f|$。</b>同理 $f(x)=f(0)+f'(\eta)x=f'(\eta)x$，$|\eta|\le\delta$，由第 2 步 $|f'(\eta)|\le\delta M$，所以</p>$$|f(x)|\le\delta M\cdot\delta=\delta^2M.$$<p><b>第 4 步：</b>对每个 $|x|\le\delta$，$|f(x)|+|f'(x)|\le(\delta+\delta^2)M=\left(\frac14+\frac1{16}\right)M=\frac5{16}M$。取最大值，$M\le\frac5{16}M$，即 $\frac{11}{16}M\le0$。又 $M\ge0$，所以 $M=0$。</p><p><b>结论：在 $[-\frac14,\frac14]$ 上 $f\equiv0$。</b></p><p>注：整个证明只用了 $f''$ 存在和题给的不等式，不需要 $f''$ 连续。</p>`}
],

{"id":R`x4-e1`,"lv":R`延伸`,"src":R`2023秋电子系A卷12（答案PDF第8–9页、回忆版第1页T7）`,"stmt":R`<p><b>可能不考·ODE选做。</b>连续f满足 $f(x)=\cos x-\int_0^xe^{-t}f(x-t)dt$，求f。</p>`,"hints":[R`积分里是 $f(x-t)$，先换元 $u=x-t$ 让 $x$ 跑出积分号，再两边求导变成微分方程。`,R`$u=x-t$ 后 $\int_0^xe^{-t}f(x-t)dt=e^{-x}\int_0^xe^uf(u)du$。原式乘 $e^x$：$e^xf(x)=e^x\cos x-\int_0^xe^uf(u)du$。求导得 $f'+2f=\cos x-\sin x$；令 $x=0$ 得 $f(0)=1$。`,R`一阶线性方程，积分因子 $e^{2x}$；也可设特解 $A\cos x+B\sin x$，比较系数得 $A=\frac35$，$B=-\frac15$；通解加 $Ce^{-2x}$，由 $f(0)=1$ 得 $C=\frac25$。`],"method":R`m-x4-audit`,"sol":R`<p><b>（可能不考·ODE 选做）</b>已知 $f$ 连续，$f(x)=\cos x-\int_0^xe^{-t}f(x-t)dt$，求 $f$。</p><p><b>第 1 步：换元。</b>令 $u=x-t$，$t=0\Rightarrow u=x$，$t=x\Rightarrow u=0$，$dt=-du$：</p>$$\int_0^xe^{-t}f(x-t)dt=\int_0^xe^{-(x-u)}f(u)du=e^{-x}\int_0^xe^uf(u)du.$$<p>所以 $e^xf(x)=e^x\cos x-\int_0^xe^uf(u)du$。右边可导（$f$ 连续），所以 $f$ 可导。</p><p><b>第 2 步：求导。</b></p>$$e^xf+e^xf'=e^x\cos x-e^x\sin x-e^xf\ \Rightarrow\ f'+2f=\cos x-\sin x.$$<p>在原式中令 $x=0$：$f(0)=\cos0-0=1$。</p><p><b>第 3 步：解方程。</b>设特解 $f_p=A\cos x+B\sin x$，代入：$(-A\sin x+B\cos x)+2A\cos x+2B\sin x=\cos x-\sin x$。比较 $\cos x$：$2A+B=1$；比较 $\sin x$：$-A+2B=-1$。解得 $A=\frac35$，$B=-\frac15$。齐次解 $Ce^{-2x}$，所以 $f=Ce^{-2x}+\frac35\cos x-\frac15\sin x$。由 $f(0)=C+\frac35=1$ 得 $C=\frac25$。</p><p><b>第 4 步：回代检查。</b>由 $f'+2f=\cos x-\sin x$ 乘 $e^x$ 得 $(e^xf)'=(e^x\cos x)'-e^xf$，从 0 积到 $x$ 并用 $f(0)=1$，恰好还原第 1 步的等式，所以候选解满足原方程。</p><p><b>答案：$f(x)=\frac25e^{-2x}+\frac35\cos x-\frac15\sin x$。</b></p>`},
{"id":R`x4-e2`,"lv":R`选做`,"src":R`2021秋电子系答案 证明1与计算6（PDF第4–5页）`,"stmt":R`<p>(1) f∈C(0,∞)，对每个固定b>1，积分∫ₐᵃᵇf(x)dx不依赖a>0。证明xf(x)为常数。</p><p>(2) <b>可能不考·ODE选做。</b>连续f满足 $f(x)=\sin x+\int_0^x(t-x)f(t)dt$，求f。</p>`,"hints":[R`(1) “积分与 $a$ 无关”就是“对 $a$ 的导数为 0”。(2) 把 $\int_0^x(t-x)f(t)dt$ 拆成 $\int_0^xtf-x\int_0^xf$，再求导两次。`,R`(1) $\frac{d}{da}\int_a^{ab}f=bf(ab)-f(a)=0$。分别取 $a=1,b=x$（$x\gt1$）和 $a=x,b=\frac1x$（$0\lt x\lt1$）。(2) 一阶导 $f'=\cos x-\int_0^xf$，二阶导 $f''=-\sin x-f$；初值 $f(0)=0$，$f'(0)=1$。`,R`(2) $f''+f=-\sin x$ 是“共振”情形，特解试 $x(A\cos x+B\sin x)$，得 $\frac{x\cos x}2$。通解 $C_1\cos x+C_2\sin x+\frac{x\cos x}2$，由初值 $C_1=0$，$C_2+\frac12=1$。`],"method":R`m-x4-audit`,"sol":R`<p><b>(1)</b> 已知 $f$ 在 $(0,\infty)$ 上连续，对每个固定 $b\gt1$，$\int_a^{ab}f(x)dx$ 与 $a\gt0$ 无关。证 $xf(x)$ 为常数。</p><p>第 1 步：积分与 $a$ 无关，所以对 $a$ 求导为 0。由变限积分求导公式：</p>$$\frac{d}{da}\int_a^{ab}f(x)dx=f(ab)\cdot b-f(a)=0,\quad\text{即 }bf(ab)=f(a).$$<p>第 2 步：$x\gt1$ 时取 $a=1$、$b=x$：$xf(x)=f(1)$。</p><p>第 3 步：$0\lt x\lt1$ 时取 $a=x$、$b=\frac1x\gt1$：$\frac1xf(1)=f(x)$，即 $xf(x)=f(1)$。$x=1$ 时显然。</p><p>第 4 步：所以 $xf(x)\equiv f(1)=:c$，$f(x)=\frac cx$。回代：$\int_a^{ab}\frac cxdx=c\ln b$，确实与 $a$ 无关 ✓。</p><p><b>结论：$xf(x)$ 为常数。</b></p><p><b>(2)（可能不考·ODE 选做）</b>$f$ 连续，$f(x)=\sin x+\int_0^x(t-x)f(t)dt$，求 $f$。</p><p>第 1 步：拆开，$f(x)=\sin x+\int_0^xtf(t)dt-x\int_0^xf(t)dt$，右边可导，所以 $f$ 可导：</p>$$f'(x)=\cos x+xf(x)-\int_0^xf(t)dt-xf(x)=\cos x-\int_0^xf(t)dt.$$<p>右边又可导，所以 $f''(x)=-\sin x-f(x)$，即 $f''+f=-\sin x$。初值：$f(0)=0$，$f'(0)=1$。</p><p>第 2 步：特解。设 $f_p=\frac{x\cos x}2$：$f_p'=\frac{\cos x}2-\frac{x\sin x}2$，$f_p''=-\sin x-\frac{x\cos x}2$，所以 $f_p''+f_p=-\sin x$ ✓。</p><p>第 3 步：通解 $f=C_1\cos x+C_2\sin x+\frac{x\cos x}2$。$f(0)=C_1=0$；$f'(0)=C_2+\frac12=1$，$C_2=\frac12$。</p><p>第 4 步：回代。由 $f''+f=-\sin x$ 和两个初值，积分两次可还原原积分方程，所以候选是解。</p><p><b>答案：(2) $f(x)=\frac{\sin x+x\cos x}2$。</b></p>`}
]
},

"title":R`异班样题查漏：弧长与旋转曲面面积`,
"goal":R`补面积、体积之外的两个几何量：曲线的弧长、曲线旋转出的曲面面积。题目来自电子系卷和一份无年份的微积分 A 样题，本学期是否考还没确认，当作拓展练。主线约 30 分钟。`,
"sections":[
{"id":R`x5-s1`,"h":R`1. 弧长：把“速度的大小”积起来`,"html":R`<p>这节解决：一段弯曲的曲线有多长。</p><p>把曲线切成很多小段，每小段近似一条直线，长度 $\approx\sqrt{(\Delta x)^2+(\Delta y)^2}$。参数曲线 $(x(t),y(t))$ 上，$\Delta x\approx x'(t)\Delta t$，$\Delta y\approx y'(t)\Delta t$，所以弧长微元（记作 $ds$）为</p>$$ds=\sqrt{x'(t)^2+y'(t)^2}\,dt,\qquad L=\int_\alpha^\beta\sqrt{x'(t)^2+y'(t)^2}\,dt.$$<p>如果曲线写成 $y=f(x)$（$a\le x\le b$），把 $x$ 当参数：$L=\int_a^b\sqrt{1+f'(x)^2}\,dx$。</p><p>例：直线 $y=2x$，$0\le x\le1$，$L=\int_0^1\sqrt{1+4}\,dx=\sqrt5$，与两点距离 $\sqrt{1^2+2^2}$ 一致。</p><p>注意：积分下限要小于上限（$t$ 从小到大）；边界由几段组成时分别算再相加。</p>`},
{"id":R`x5-s2`,"h":R`2. 旋转曲面面积：周长 $2\pi\times$ 半径，再乘弧长微元`,"html":R`<p>这节解决：一条曲线绕 $x$ 轴转一圈扫出的曲面（像花瓶的外壁）面积是多少。</p><p>曲线上一小段长 $ds$，到 $x$ 轴的距离是 $|y|$，转一圈扫出一条窄带，面积约为“周长 × 宽” $=2\pi|y|\,ds$。所以</p>$$S=2\pi\int_\alpha^\beta|y(t)|\sqrt{x'(t)^2+y'(t)^2}\,dt.$$<p>半径是到轴的距离，所以写 $|y|$。曲线每一段只能扫过一次，否则会重复计算。</p><p>例：线段 $y=1$，$0\le x\le h$ 绕 $x$ 轴转出圆柱侧面，$S=2\pi\int_0^h1\cdot1\,dx=2\pi h$ ✓。</p><p>区别：</p><ul><li>体积（圆盘法）$V=\pi\int y^2dx$，乘的是 $dx$；</li><li>曲面面积乘的是 $ds$，不是 $dx$。</li></ul><p>这个公式只算侧面，不含两端的圆盘；题目问“封闭立体的表面积”时才另加端面。</p>`},
{"id":R`x5-s3`,"h":R`3. 同一段参数曲线：体积和曲面面积分别怎么列`,"html":R`<p>曲线由参数给出、要求它下方区域绕 $x$ 轴的体积时，先把 $dx$ 换成参数：$dx=x'(t)dt$。</p><p>若 $x(t)$ 在参数区间上单调（每个 $x$ 只对应一个点），且 $y\ge0$，则</p>$$V=\pi\int y(t)^2|x'(t)|\,dt.$$<p>加绝对值是因为 $x$ 可能随 $t$ 递减（参数从右往左走），这时直接用 $x'(t)dt$ 会得到负数。</p><p>对照：曲面用 $ds=\sqrt{x'^2+y'^2}dt$；体积用 $|dx|=|x'(t)|dt$。不能把 $dt$ 直接当成 $dx$。</p>`}
],

"concepts":[
{"id":R`x5-c1`,"sec":R`x5-s1`,"q":R`参数弧长的微元是：`,"opts":[R`|x′|dt`,R`|y′|dt`,R`√(x′²+y′²)dt`,R`(x′²+y′²)dt`],"a":2,"ex":R`选 $\sqrt{x'^2+y'^2}\,dt$：小段在水平、竖直方向分别移动 $x'dt$、$y'dt$，由勾股定理长度是 $\sqrt{x'^2+y'^2}dt$。容易误选 $(x'^2+y'^2)dt$：忘了开平方，那是长度的平方，单位都不对。`},
{"id":R`x5-c2`,"sec":R`x5-s2`,"q":R`绕x轴旋转的半径应是：`,"opts":[R`x`,R`|y|`,R`y′`,R`ds`],"a":1,"ex":R`选 $|y|$：绕 $x$ 轴转时，点 $(x,y)$ 画出的圆半径就是它到 $x$ 轴的距离 $|y|$。容易误选 $x$：$x$ 是点到 $y$ 轴的距离，那是绕 $y$ 轴旋转时的半径。`},
{"id":R`x5-c3`,"sec":R`x5-s2`,"q":R`旋转曲面面积公式是否自动含端面？`,"opts":[R`总包含两个端圆盘`,R`通常只算生成曲面，端面另核题意`,R`从来不允许端面`,R`只含上端面`],"a":1,"ex":R`选“通常只算生成曲面，端面另核题意”。公式 $2\pi\int|y|ds$ 只累加曲线扫出的侧面；若题目问封闭立体的全部表面积，再按几何加上两端圆盘 $\pi y^2$。容易误选“总包含两个端圆盘”：公式里没有端面这一项，自动加上会多算。`},
{"id":R`x5-c4`,"sec":R`x5-s3`,"q":R`参数体积V=π∫y²|x′|dt需要先确认：`,"opts":[R`y恒为1`,R`x沿该弧单调且不重复覆盖截面`,R`x′恒等于1`,R`参数必须等于x`],"a":1,"ex":R`选“$x$ 沿该弧单调且不重复覆盖截面”。体积是截面面积 $\pi y^2$ 沿 $x$ 方向累加，如果 $x$ 来回走，同一截面会被加两次（或抵消）。容易误选“参数必须等于 $x$”：参数可以是任意 $t$，只要用 $|x'(t)|dt$ 代替 $dx$ 即可。`}
],
"methods":[
{"id":R`m-x5-audit`,"title":R`弧长、旋转曲面、旋转体积：做题清单`,"steps":[R`先画草图，标出曲线的起点、终点、与旋转轴的位置；判断题目问的是弧长、曲面面积还是体积。`,R`弧长：$\int ds$，$ds=\sqrt{x'^2+y'^2}dt$ 或 $\sqrt{1+f'^2}dx$。曲面：$2\pi\int(\text{到轴距离})\,ds$。体积：$\pi\int(\text{半径})^2|dx|$。`,R`检查：参数是否单调、曲线有没有重复扫过；端点在轴上时端面半径为 0；题目若问封闭表面再加端面。易错：曲面面积里误用 $dx$ 代替 $ds$。`]}
],
"problems":[
{"id":R`x5-p1`,"lv":R`真题`,"src":R`2021电子系期末答案计算3（PDF第2–3页）`,"stmt":R`区域Ω由y=x²/2与y=x/2围成，求周长和面积。`,"hints":[R`先求两条曲线的交点，画图看哪条在上面。周长 = 直线段长 + 抛物线弧长；面积 = $\int(\text{上}-\text{下})dx$。`,R`$\frac{x^2}2=\frac x2\Rightarrow x=0$ 或 $1$，$[0,1]$ 上 $\frac x2\ge\frac{x^2}2$。直线段从 $(0,0)$ 到 $(1,\frac12)$，长 $\frac{\sqrt5}2$。抛物线 $y'=x$，弧长 $\int_0^1\sqrt{1+x^2}dx$。`,R`$\int\sqrt{1+x^2}dx=\frac12\left[x\sqrt{1+x^2}+\ln(x+\sqrt{1+x^2})\right]+C$，代入 $0,1$ 得 $\frac{\sqrt2+\ln(1+\sqrt2)}2$。面积 $\int_0^1\left(\frac x2-\frac{x^2}2\right)dx$。`],"method":R`m-x5-audit`,"sol":R`<p><b>目标</b>：$y=\frac{x^2}2$ 与 $y=\frac x2$ 围成区域的周长和面积。</p><p><b>第 1 步：交点。</b>$\frac{x^2}2=\frac x2\iff x(x-1)=0$，$x=0$ 或 $x=1$，交点 $(0,0)$、$(1,\frac12)$。在 $(0,1)$ 内 $x\gt x^2$，所以直线在上、抛物线在下。</p><p><b>第 2 步：面积。</b></p>$$A=\int_0^1\left(\frac x2-\frac{x^2}2\right)dx=\frac12\left(\frac12-\frac13\right)=\frac1{12}.$$<p><b>第 3 步：直线段长。</b>两点距离 $\sqrt{1^2+(\frac12)^2}=\frac{\sqrt5}2$。</p><p><b>第 4 步：抛物线弧长。</b>$y=\frac{x^2}2$，$y'=x$：</p>$$L=\int_0^1\sqrt{1+x^2}\,dx.$$<p>原函数（可用 $x=\sinh u$ 换元或分部积分得到，求导可验证）：$\int\sqrt{1+x^2}dx=\frac12\left[x\sqrt{1+x^2}+\ln\left(x+\sqrt{1+x^2}\right)\right]+C$。代入：</p>$$L=\frac12\left[\sqrt2+\ln(1+\sqrt2)\right]-\frac12[0+\ln1]=\frac{\sqrt2+\ln(1+\sqrt2)}2.$$<p><b>第 5 步：周长</b> $=\frac{\sqrt5}2+\frac{\sqrt2+\ln(1+\sqrt2)}2$。</p><p><b>答案：面积 $\frac1{12}$；周长 $\frac{\sqrt5+\sqrt2+\ln(1+\sqrt2)}2\approx2.266$。</b></p><p>易错：周长要算两条边界曲线各自的长度，不是积分两曲线的竖直距离。</p>`},
{"id":R`x5-p2`,"lv":R`真题`,"src":R`无年份微积分A期末样题 计算2（PDF第2页）`,"stmt":R`曲线x=1+√2 cos t，y=−1+√2 sin t，π/4≤t≤3π/4。求其与x轴围成区域绕x轴的体积，以及旋转生成曲面的面积。`,"hints":[R`这是圆心 $(1,-1)$、半径 $\sqrt2$ 的圆的一段弧。先算端点和 $y$ 的符号；体积用 $\pi\int y^2|x'|dt$，曲面用 $2\pi\int y\,ds$。`,R`$t=\frac\pi4$：$(2,0)$；$t=\frac{3\pi}4$：$(0,0)$；中间 $\sin t\ge\frac{\sqrt2}2$，所以 $y\ge0$。$x'=-\sqrt2\sin t\lt0$（$x$ 递减，单调），$|x'|=\sqrt2\sin t$；$x'^2+y'^2=2$，$ds=\sqrt2dt$。`,R`$V=\pi\sqrt2\int_{\pi/4}^{3\pi/4}(-1+\sqrt2\sin t)^2\sin t\,dt$，展开成 $\sin t-2\sqrt2\sin^2t+2\sin^3t$ 逐项积分。$S=2\pi\sqrt2\int_{\pi/4}^{3\pi/4}(-1+\sqrt2\sin t)dt$。`],"method":R`m-x5-audit`,"sol":R`<p><b>已知</b>：$x=1+\sqrt2\cos t$，$y=-1+\sqrt2\sin t$，$\frac\pi4\le t\le\frac{3\pi}4$。</p><p><b>第 1 步：认清曲线。</b>$(x-1)^2+(y+1)^2=2$，是圆心 $(1,-1)$、半径 $\sqrt2$ 的圆弧。端点：$t=\frac\pi4$ 时 $(2,0)$，$t=\frac{3\pi}4$ 时 $(0,0)$。在区间内 $\sin t\ge\frac{\sqrt2}2$，所以 $y\ge0$：这是 $x$ 轴上方的一段拱形。</p><p><b>第 2 步：导数。</b>$x'=-\sqrt2\sin t\lt0$，$x$ 从 2 单调减到 0，每个 $x$ 只对应弧上一点，$|x'|=\sqrt2\sin t$。$y'=\sqrt2\cos t$，$x'^2+y'^2=2$，$ds=\sqrt2\,dt$。</p><p><b>第 3 步：体积。</b>弧与 $x$ 轴围成的区域绕 $x$ 轴，圆盘法：</p>$$V=\pi\int y^2|dx|=\pi\sqrt2\int_{\pi/4}^{3\pi/4}(-1+\sqrt2\sin t)^2\sin t\,dt.$$<p>展开 $(-1+\sqrt2\sin t)^2\sin t=\sin t-2\sqrt2\sin^2t+2\sin^3t$，在 $[\frac\pi4,\frac{3\pi}4]$ 上：</p><ul><li>$\int\sin t\,dt=\left[-\cos t\right]=\frac{\sqrt2}2+\frac{\sqrt2}2=\sqrt2$；</li><li>$\int\sin^2t\,dt=\left[\frac t2-\frac{\sin2t}4\right]=\frac\pi4-\frac{-1-1}4=\frac\pi4+\frac12$；</li><li>$\int\sin^3t\,dt=\left[-\cos t+\frac{\cos^3t}3\right]=\sqrt2-\frac23\left(\frac{\sqrt2}2\right)^3=\sqrt2-\frac{\sqrt2}6=\frac{5\sqrt2}6$。</li></ul><p>合起来：$\sqrt2-2\sqrt2\left(\frac\pi4+\frac12\right)+2\cdot\frac{5\sqrt2}6=\frac{5\sqrt2}3-\frac{\sqrt2\pi}2$。所以</p>$$V=\pi\sqrt2\left(\frac{5\sqrt2}3-\frac{\sqrt2\pi}2\right)=\pi\left(\frac{10}3-\pi\right).$$<p><b>第 4 步：曲面面积。</b>$y\ge0$，半径就是 $y$：</p>$$S=2\pi\int_{\pi/4}^{3\pi/4}y\,ds=2\sqrt2\pi\int_{\pi/4}^{3\pi/4}(-1+\sqrt2\sin t)dt=2\sqrt2\pi\left(-\frac\pi2+\sqrt2\cdot\sqrt2\right)=2\sqrt2\pi\left(2-\frac\pi2\right).$$<p>两个端点都在 $x$ 轴上，端面半径为 0，不用另加。</p><p><b>答案：$V=\pi\left(\frac{10}3-\pi\right)\approx0.602$；$S=4\sqrt2\pi-\sqrt2\pi^2\approx3.814$。</b></p>`}
],

{"id":R`x5-v1`,"lv":R`真题`,"src":R`无年份微积分A期末样题 填空9（PDF第1页）`,"stmt":R`求悬链线y=(eˣ+e⁻ˣ)/2、|x|≤1的弧长。`,"hints":[R`曲线 $y=f(x)$ 的弧长 $L=\int\sqrt{1+f'(x)^2}dx$。这里 $f=\cosh x=\frac{e^x+e^{-x}}2$。`,R`$f'(x)=\frac{e^x-e^{-x}}2=\sinh x$。恒等式 $\cosh^2x-\sinh^2x=1$，所以 $1+\sinh^2x=\cosh^2x$。`,R`$\cosh x\gt0$，$\sqrt{1+f'^2}=\cosh x$，$L=\int_{-1}^1\cosh x\,dx=[\sinh x]_{-1}^1=2\sinh1$。`],"method":R`m-x5-audit`,"sol":R`<p><b>目标</b>：$y=\frac{e^x+e^{-x}}2$（记作 $\cosh x$），$-1\le x\le1$ 的弧长。</p><p><b>第 1 步：求导。</b>$y'=\frac{e^x-e^{-x}}2$（记作 $\sinh x$）。</p><p><b>第 2 步：化简根号。</b></p>$$1+y'^2=1+\frac{e^{2x}-2+e^{-2x}}4=\frac{e^{2x}+2+e^{-2x}}4=\left(\frac{e^x+e^{-x}}2\right)^2.$$<p>因为 $\frac{e^x+e^{-x}}2\gt0$，开方得 $\sqrt{1+y'^2}=\frac{e^x+e^{-x}}2$。</p><p><b>第 3 步：积分。</b></p>$$L=\int_{-1}^1\frac{e^x+e^{-x}}2dx=\left[\frac{e^x-e^{-x}}2\right]_{-1}^1=\frac{e-e^{-1}}2-\frac{e^{-1}-e}2=e-e^{-1}.$$<p><b>答案：$L=e-\frac1e\approx2.350$。</b></p>`}
],
"extensions":[
{"id":R`x5-e1`,"lv":R`延伸`,"src":R`自编：换旋转轴`,"stmt":R`同一条光滑曲线绕直线y=c旋转，写出曲面面积与圆盘/圆环体积应如何调整，并说明为何不能把y直接换成y−c后不看绝对值。`,"hints":[R`曲面：半径是曲线上点到直线 $y=c$ 的距离；体积：竖直切片绕 $y=c$ 转出的是圆盘或圆环。`,R`曲面面积 $S=2\pi\int|y-c|\,ds$。体积：对每个 $x$，切片上离轴最远的距离是外半径 $R(x)$，最近的距离是内半径 $r(x)$，$V=\pi\int(R^2-r^2)|dx|$。`,R`如果切片本身跨过直线 $y=c$（切片上有点在轴上），内半径 $r=0$；不能简单用两个端点到轴的距离相减。例：切片从 $y=-1$ 到 $y=2$ 绕 $y=0$，$R=2$，$r=0$。`],"method":R`m-x5-audit`,"sol":R`<p><b>问题</b>：曲线绕水平直线 $y=c$（而不是 $x$ 轴）旋转，公式怎么改？</p><p><b>(1) 曲面面积。</b>曲线上点 $(x,y)$ 到直线 $y=c$ 的距离是 $|y-c|$，这就是旋转半径。曲线每段只扫一次时</p>$$S=2\pi\int|y-c|\,ds,\qquad ds=\sqrt{x'^2+y'^2}dt.$$<p>必须带绝对值：曲线在轴下方时 $y-c\lt0$，不加绝对值会把面积算成负数、和上方部分互相抵消。</p><p><b>(2) 体积。</b>对区域在横坐标 $x$ 处的竖直切片：</p><ul><li>外半径 $R(x)$ = 切片上离 $y=c$ 最远的点的距离；</li><li>内半径 $r(x)$ = 最近的点的距离；如果切片跨过 $y=c$（包含轴上的点），$r(x)=0$。</li></ul>$$V=\pi\int\big(R(x)^2-r(x)^2\big)|dx|.$$<p><b>(3) 为什么不能只把 $y$ 换成 $y-c$。</b>例：切片从 $y=-1$ 到 $y=2$，绕 $y=0$ 旋转。正确：$R=2$，$r=0$，截面面积 $4\pi$。若机械地用两端距离 $|{-1}|=1$ 和 $2$ 当作内外半径，会得到 $\pi(4-1)=3\pi$，错误——因为切片穿过了轴，扫出的是实心圆盘而不是圆环。</p><p><b>结论：曲面 $S=2\pi\int|y-c|ds$；体积按每个切片的最远、最近距离取 $R,r$，切片跨轴时 $r=0$。</b></p>`}
],

"title":R`可能不考·异班拓展：ODE 的三种降阶换元`,
"goal":R`（可能不考，选做）补电子系卷和样题里出现过的几类微分方程：Euler 型、Bernoulli 型、齐次型，以及一个简单的方程组。它们都靠一个换元变成会解的方程。先做两道主线题，方程组放在延伸里。这些题源不能说明本学期一定考。`,
"sections":[
{"id":R`x6-s1`,"h":R`1. Euler 型方程：令 $x=e^t$，系数变成常数`,"html":R`<p>这节解决：$x^2y''+axy'+by=R(x)$ 这种“$y$ 的 $k$ 阶导前面乘 $x^k$”的方程（叫 Euler 方程）怎么解。</p><p>在 $x\gt0$ 上令 $x=e^t$（即 $t=\ln x$），把 $y$ 看成 $t$ 的函数 $z(t)=y(e^t)$。链式法则：</p><ul><li>$z'=\frac{dy}{dx}\cdot\frac{dx}{dt}=y'\cdot e^t=xy'$；</li><li>$$z''=\frac{d}{dt}(xy')=x\cdot y'+x\cdot xy''=xy'+x^2y''$$，所以 $x^2y''=z''-z'$。</li></ul><p>代入得常系数方程 $z''+(a-1)z'+bz=R(e^t)$，用特征方程解。</p><p>例：$x^2y''-2y=0$：$z''-z'-2z=0$，特征根 $r=2,-1$，$z=C_1e^{2t}+C_2e^{-t}$，换回 $y=C_1x^2+C_2x^{-1}$。代回验证：$y=x^2$ 时 $x^2\cdot2-2x^2=0$ ✓。</p><p>最后要把 $t$ 换回 $\ln x$，并注明 $x\gt0$（$x=0$ 处方程退化，解不能跨过）。</p>`},
{"id":R`x6-s2`,"h":R`2. Bernoulli 型方程：令 $z=y^{1-m}$ 变成线性方程`,"html":R`<p>这节解决：$y'+p(x)y=q(x)y^m$（$m\ne0,1$）怎么解。它不是线性的，因为有 $y^m$。</p><p>步骤：</p><ol><li><b>先检查 $y=0$</b>：当 $m\gt0$ 时，$y\equiv0$ 代入两边都是 0，是一个解。后面要除以 $y^m$，会把它丢掉，所以先记下来。</li><li>对 $y\ne0$，两边除以 $y^m$，令 $z=y^{1-m}$，则 $z'=(1-m)y^{-m}y'$，方程变成线性方程 $z'+(1-m)pz=(1-m)q$。</li><li>用积分因子解出 $z$，再反解 $y$，并排除分母为 0 的点。</li></ol><p>最常见的是 $m=2$：令 $z=\frac1y$，$z'=-\frac{y'}{y^2}$。</p><p>例：$y'+y=y^2$。$y=0$ 是解；令 $z=\frac1y$，得 $z'-z=-1$，解得 $z=1+Ce^x$，所以 $y=\frac1{1+Ce^x}$（在 $1+Ce^x\ne0$ 的区间上）。</p><p>注：$m$ 不是整数时（如 $y^{1/2}$），还要限制 $y\gt0$ 等使幂有定义的范围。</p>`},
{"id":R`x6-s3`,"h":R`3. 齐次型方程与简单方程组`,"html":R`<p><b>齐次型</b>：右边只依赖 $\frac yx$，即 $y'=F\left(\frac yx\right)$。在 $x\ne0$ 上令 $y=xu$，则 $y'=u+xu'$，方程变成</p>$$xu'=F(u)-u,$$<p>可以分离变量：$\frac{du}{F(u)-u}=\frac{dx}x$。除以 $F(u)-u$ 之前，先找使 $F(c)=c$ 的常数 $c$，它们给出直线解 $y=cx$。</p><p>例：$y'=\frac yx+1$：$xu'=1$，$u=\ln|x|+C$，$y=x\ln|x|+Cx$。</p><p><b>对称方程组</b>：$y'=y+2z$，$z'=2y+z$。两式相加、相减：令 $U=y+z$，$V=y-z$，得 $U'=3U$，$V'=-V$，两个方程互不相干（叫“解耦”），分别解得 $U=Ae^{3x}$，$V=Be^{-x}$，再由 $y=\frac{U+V}2$，$z=\frac{U-V}2$ 还原。</p>`}
],

{"id":R`x6-c1`,"sec":R`x6-s1`,"q":R`令t=ln x后，x²y″应写成：`,"opts":[R`z″`,R`z″−z′`,R`z″+z′`,R`z′`],"a":1,"ex":R`选 $z''-z'$。$z'=xy'$，再对 $t$ 求导：$\frac{d}{dt}(xy')=\frac{dx}{dt}y'+x\frac{dy'}{dt}=xy'+x^2y''$，所以 $x^2y''=z''-xy'=z''-z'$。容易误选 $z''$：忘了对 $xy'$ 求导时 $x$ 本身也随 $t$ 变化。`},
{"id":R`x6-c2`,"sec":R`x6-s2`,"q":R`令z=1/y前应单独检查：`,"opts":[R`y=0解`,R`x=1解`,R`所有常数都是解`,R`y必须为正`],"a":0,"ex":R`选“$y=0$ 解”。换元 $z=\frac1y$ 要求 $y\ne0$，除以 $y^2$ 时把 $y\equiv0$ 这个解丢了，必须单独代入原方程检查并补上。容易误选“$y$ 必须为正”：$m=2$ 时 $y$ 可正可负，只要不为 0；“必须为正”只在 $y^{1/2}$ 这类非整数幂时才需要。`},
{"id":R`x6-c3`,"sec":R`x6-s3`,"q":R`齐次一阶方程常用换元是：`,"opts":[R`y=xu`,R`y=eᵘ恒适用`,R`x=u²恒适用`,R`直接设y常数`],"a":0,"ex":R`选 $y=xu$：右边是 $\frac yx$ 的函数，令 $u=\frac yx$ 后方程只含 $x$ 和 $u$，且能分离变量。容易误选“直接设 $y$ 为常数”：那只能找到个别特解，不是通解。`},
{"id":R`x6-c4`,"sec":R`x6-s3`,"q":R`对称二元系统的和差换元有何作用？`,"opts":[R`随意删一个方程`,R`把耦合方程分成两个独立标量方程`,R`把所有解变成常数`,R`保证周期`],"a":1,"ex":R`选“把耦合方程分成两个独立标量方程”：$U=y+z$ 只满足 $U'=3U$，$V=y-z$ 只满足 $V'=-V$，各自用指数函数解，再还原 $y,z$。容易误选“随意删一个方程”：两个方程都要用到，和差换元只是换一组未知函数，信息没有减少。`}

"methods":[
{"id":R`m-x6-audit`,"title":R`三种换元解微分方程：做题清单`,"steps":[R`认类型：系数是 $x^2,x,1$ 的二阶方程 → Euler 型，令 $x=e^t$；有 $y^m$ 的一阶方程 → Bernoulli，令 $z=y^{1-m}$；右边是 $\frac yx$ 的函数 → 齐次型，令 $y=xu$；对称方程组 → 和差换元。`,R`换元前写出定义域（如 $x\gt0$）、检查 $y=0$ 或直线解 $y=cx$；换元后解线性方程（积分因子）或分离变量。`,R`把变量换回去（$t=\ln x$，$z=\frac1y$，$u=\frac yx$），代回原方程验一下，写清解成立的区间。易错：Bernoulli 型漏掉 $y=0$；解跨过 $x=0$ 或分母为 0 的点。`]}

"problems":[
{"id":R`x6-p1`,"lv":R`真题`,"src":R`2023秋电子系A卷4（答案PDF第2页）`,"stmt":R`在x>0上求 $x^2y″-xy′+4y=x\sin(\ln x)$ 的通解。`,"hints":[R`Euler 型方程，在 $x\gt0$ 上令 $x=e^t$，$z(t)=y(e^t)$，用 $xy'=z'$，$x^2y''=z''-z'$。`,R`代入得 $z''-2z'+4z=e^t\sin t$。特征方程 $r^2-2r+4=0$，$r=1\pm i\sqrt3$。特解试 $z_p=e^t(A\cos t+B\sin t)$。`,R`令 $z=e^tw$ 可得 $w''+3w=\sin t$，取 $w=\frac12\sin t$，所以 $z_p=\frac12e^t\sin t$。换回：$e^t=x$，$t=\ln x$。`],"method":R`m-x6-audit`,"sol":R`<p><b>目标</b>：在 $x\gt0$ 上解 $x^2y''-xy'+4y=x\sin(\ln x)$。</p><p><b>第 1 步：换元。</b>令 $x=e^t$，$z(t)=y(e^t)$，则 $xy'=z'$，$x^2y''=z''-z'$。代入：</p>$$(z''-z')-z'+4z=e^t\sin t\ \Rightarrow\ z''-2z'+4z=e^t\sin t.$$<p><b>第 2 步：齐次解。</b>特征方程 $r^2-2r+4=0$，$r=\frac{2\pm\sqrt{4-16}}2=1\pm i\sqrt3$，齐次通解 $z_h=e^t(C_1\cos\sqrt3t+C_2\sin\sqrt3t)$。</p><p><b>第 3 步：特解。</b>令 $z=e^tw$，则 $z'=e^t(w+w')$，$z''=e^t(w''+2w'+w)$，代入左边：</p>$$e^t\big[(w''+2w'+w)-2(w+w')+4w\big]=e^t(w''+3w).$$<p>所以只需 $w''+3w=\sin t$。试 $w=A\sin t$：$-A+3A=1$，$A=\frac12$。故 $z_p=\frac12e^t\sin t$。</p><p><b>第 4 步：换回 $x$。</b>$e^t=x$，$t=\ln x$：</p>$$y=x\left[C_1\cos(\sqrt3\ln x)+C_2\sin(\sqrt3\ln x)\right]+\frac x2\sin(\ln x),\quad x\gt0.$$<p><b>验算特解</b>：$y_p=\frac x2\sin(\ln x)$，$y_p'=\frac12\sin(\ln x)+\frac12\cos(\ln x)$，$y_p''=\frac1{2x}[\cos(\ln x)-\sin(\ln x)]$。左边 $=\frac x2(\cos-\sin)-\frac x2(\sin+\cos)+2x\sin=x\sin(\ln x)$ ✓。</p><p><b>答案如上（$C_1,C_2$ 为任意常数）。</b></p>`},
{"id":R`x6-p2`,"lv":R`真题`,"src":R`无年份微积分A期末样题 填空15（PDF第2页）`,"stmt":R`求 $y′-(6/x)y=-xy^2$ 的通解，并说明定义区间。`,"hints":[R`Bernoulli 型（$m=2$）：先检查 $y\equiv0$ 是解，再对 $y\ne0$ 令 $z=\frac1y$。`,R`两边除以 $-y^2$：$-\frac{y'}{y^2}+\frac6x\cdot\frac1y=x$，即 $z'+\frac6xz=x$。积分因子 $e^{\int6/x\,dx}=x^6$。`,R`$(x^6z)'=x^7$，$x^6z=\frac{x^8}8+C$，$z=\frac{x^2}8+\frac C{x^6}$，$y=\frac1z=\frac{8x^6}{x^8+8C}$；常数改名后写成 $\frac{8x^6}{x^8+C}$。`],"method":R`m-x6-audit`,"sol":R`<p><b>目标</b>：解 $y'-\frac6xy=-xy^2$，写出定义区间。</p><p><b>第 1 步：零解。</b>$y\equiv0$ 时左右都为 0，是解（在 $x\gt0$ 或 $x\lt0$ 上）。</p><p><b>第 2 步：换元。</b>对 $y\ne0$，令 $z=\frac1y$，$z'=-\frac{y'}{y^2}$。原方程两边除以 $-y^2$：</p>$$-\frac{y'}{y^2}+\frac6x\cdot\frac1y=x\ \Rightarrow\ z'+\frac6xz=x.$$<p><b>第 3 步：积分因子。</b>$\mu=e^{\int\frac6xdx}=x^6$（在 $x\gt0$ 或 $x\lt0$ 上都可用），乘上后左边是 $(x^6z)'$：</p>$$(x^6z)'=x^7\ \Rightarrow\ x^6z=\frac{x^8}8+C_1\ \Rightarrow\ z=\frac{x^2}8+\frac{C_1}{x^6}.$$<p><b>第 4 步：反解。</b>$y=\frac1z=\frac{8x^6}{x^8+8C_1}$，记 $C=8C_1$：</p>$$y=\frac{8x^6}{x^8+C}.$$<p>验算（$C=0$ 时 $y=\frac8{x^2}$）：$y'=-\frac{16}{x^3}$，左边 $-\frac{16}{x^3}-\frac{48}{x^3}=-\frac{64}{x^3}$，右边 $-x\cdot\frac{64}{x^4}=-\frac{64}{x^3}$ ✓。</p><p><b>第 5 步：定义区间。</b>原方程含 $\frac6x$，所以 $x\ne0$；解还要求分母 $x^8+C\ne0$。每个解取在一个不含 $x=0$、且 $x^8+C\ne0$ 的区间上（例如 $C\lt0$ 时还要避开 $x=\pm|C|^{1/8}$）。</p><p><b>答案：$y=\frac{8x^6}{x^8+C}$（$C$ 任意常数），以及 $y\equiv0$；解在不含 $x=0$ 和分母零点的区间上成立。</b></p>`}
],
"variants":[
{"id":R`x6-v1`,"lv":R`真题`,"src":R`2023秋电子系A卷11（答案PDF第7–8页）`,"stmt":R`在y≠0处求微分形式 $(1+2e^{x/y})dx+2e^{x/y}(1-x/y)dy=0$ 的积分曲线。`,"hints":[R`先试试左边是不是某个函数 $\Phi(x,y)$ 的全微分 $d\Phi$（这样积分曲线就是 $\Phi=C$）。$e^{x/y}$ 和 $(1-\frac xy)$ 一起出现，提示看 $d(ye^{x/y})$。`,R`$d(ye^{x/y})=e^{x/y}dy+ye^{x/y}\left(\frac{dx}y-\frac{x\,dy}{y^2}\right)=e^{x/y}dx+e^{x/y}\left(1-\frac xy\right)dy$。`,R`所以 $2e^{x/y}dx+2e^{x/y}(1-\frac xy)dy=d(2ye^{x/y})$，原式左边 $=dx+d(2ye^{x/y})=d(x+2ye^{x/y})$。`],"method":R`m-x6-audit`,"sol":R`<p><b>目标</b>：在 $y\ne0$ 处求 $(1+2e^{x/y})dx+2e^{x/y}\left(1-\frac xy\right)dy=0$ 的积分曲线。</p><p><b>第 1 步：计算 $d(ye^{x/y})$。</b>由乘积法则和 $d\left(\frac xy\right)=\frac{dx}y-\frac{x\,dy}{y^2}$：</p>$$d(ye^{x/y})=e^{x/y}dy+ye^{x/y}\left(\frac{dx}y-\frac{x\,dy}{y^2}\right)=e^{x/y}dx+e^{x/y}\left(1-\frac xy\right)dy.$$<p><b>第 2 步：凑全微分。</b>原式左边</p>$$=dx+2\left[e^{x/y}dx+e^{x/y}\left(1-\frac xy\right)dy\right]=dx+d(2ye^{x/y})=d\left(x+2ye^{x/y}\right).$$<p><b>第 3 步：</b>$d(x+2ye^{x/y})=0$ 说明沿积分曲线 $x+2ye^{x/y}$ 不变。</p><p><b>答案：积分曲线为 $x+2ye^{x/y}=C$（$y\ne0$，$C$ 为任意常数）。</b></p><p>另一做法：令 $u=\frac xy$ 化为可分离方程，但除以含 $u$ 的式子前要单独保留可能的常值解；凑全微分的方法不会漏解。</p>`}

"extensions":[
{"id":R`x6-e1`,"lv":R`延伸`,"src":R`无年份微积分A期末样题 填空10、11、14（PDF第1–2页）`,"stmt":R`<p>(1) 求x²y″−xy′−3y=0在x>0的通解。</p><p>(2) 求y′=y+2z、z′=2y+z的通解。</p><p>(3) 对y′=y/x+tan(y/x)，写出换元后的方程并保留直线解。</p>`,"hints":[R`(1) Euler 型，试 $y=x^r$ 或令 $x=e^t$；(2) 和差换元 $U=y+z$，$V=y-z$；(3) 齐次型，令 $y=xu$。`,R`(1) 代 $y=x^r$：$r(r-1)-r-3=0$，即 $r^2-2r-3=0$。(2) $U'=3U$，$V'=-V$。(3) $y'=u+xu'$，方程变为 $xu'=\tan u$。`,R`(1) $r=3,-1$。(2) $U=Ae^{3x}$，$V=Be^{-x}$，$y=\frac{U+V}2$，$z=\frac{U-V}2$。(3) 先记直线解 $u=k\pi$；其余 $\frac{\cos u}{\sin u}du=\frac{dx}x$，积分 $\ln|\sin u|=\ln|x|+C$。`],"method":R`m-x6-audit`,"sol":R`<p><b>(1)</b> $x^2y''-xy'-3y=0$，$x\gt0$。</p><p>试 $y=x^r$：$y'=rx^{r-1}$，$y''=r(r-1)x^{r-2}$，代入得 $[r(r-1)-r-3]x^r=0$，即 $r^2-2r-3=(r-3)(r+1)=0$，$r=3$ 或 $-1$。</p><p><b>答案：$y=C_1x^3+C_2x^{-1}$（$x\gt0$）。</b></p><p><b>(2)</b> $y'=y+2z$，$z'=2y+z$。</p><p>令 $U=y+z$，$V=y-z$。相加：$U'=3y+3z=3U$；相减：$V'=(y+2z)-(2y+z)=-y+z=-V$。所以 $U=Ae^{3x}$，$V=Be^{-x}$。还原 $y=\frac{U+V}2$，$z=\frac{U-V}2$，令 $C_1=\frac A2$，$C_2=\frac B2$：</p><p><b>答案：$y=C_1e^{3x}+C_2e^{-x}$，$z=C_1e^{3x}-C_2e^{-x}$。</b>（验算：$y+2z=3C_1e^{3x}-C_2e^{-x}=y'$ ✓）</p><p><b>(3)</b> $y'=\frac yx+\tan\frac yx$，$x\ne0$。</p><p>令 $y=xu$，$y'=u+xu'$，代入：$u+xu'=u+\tan u$，即</p>$$xu'=\tan u.$$<p>直线解：$\tan u=0$ 即 $u=k\pi$（$k$ 为整数），给出 $y=k\pi x$。</p><p>其余解（$\tan u\ne0$ 且有定义）：分离变量 $\frac{\cos u}{\sin u}du=\frac{dx}x$，积分得 $\ln|\sin u|=\ln|x|+C$，即 $\sin u=C_0x$（$C_0\ne0$）。</p><p><b>答案：$\sin\frac yx=C_0x$（$C_0=0$ 时正好对应直线解 $y=k\pi x$），在 $x\ne0$、$\tan\frac yx$ 有定义的区间上成立。</b></p>`}
],

"title":R`可能不考·异班拓展：ODE 解结构、周期与追及`,
"goal":R`（可能不考，选做）补两类“讲道理”的微分方程题：(1) 已知非齐次方程的几个特解，写出通解；(2) 周期系数的一阶线性方程，周期解只可能有 0 个、1 个或无穷多个。追及问题（追踪曲线）放在延伸。o1/o2 课练的是怎么解方程，这课练的是解的结构和证明。主线约 30 分钟。`,
"sections":[
{"id":R`x7-s1`,"h":R`1. 非齐次方程的解 = 一个特解 + 齐次方程的通解`,"html":R`<p>这节解决：知道非齐次线性方程的几个解，怎么写出全部解。</p><p>记 $L(y)=y''+P_1y'+P_2y$。它是线性的：$L(y_1-y_2)=L(y_1)-L(y_2)$。若 $L(y_1)=L(y_2)=Q$，则 $L(y_2-y_1)=Q-Q=0$，即<b>两个非齐次解之差是齐次方程 $L(y)=0$ 的解</b>。</p><p>所以：非齐次通解 = 某一个特解 $y_1$ + 齐次通解。二阶齐次方程的通解由两个“线性无关”的解 $u,v$（即 $u$ 不是 $v$ 的常数倍）组合而成：$C_1u+C_2v$。</p><p>已知三个非齐次解 $y_1,y_2,y_3$ 时，取 $u=y_2-y_1$、$v=y_3-y_1$，若它们线性无关，通解为</p>$$y=y_1+C_1(y_2-y_1)+C_2(y_3-y_1)=(1-C_1-C_2)y_1+C_1y_2+C_2y_3.$$<p>例：$y''+y=1$ 有解 $1$、$1+\cos x$、$1+\sin x$，差为 $\cos x,\sin x$，通解 $1+C_1\cos x+C_2\sin x$。</p><p>易错：两个非齐次解相加不是解（$L(y_1+y_2)=2Q\ne Q$）。</p>`},
{"id":R`x7-s2`,"h":R`2. 周期系数方程：周期解就是“走一圈回到原值”`,"html":R`<p>这节解决：$y'=a(x)y+b(x)$ 中 $a,b$ 都以 $T$ 为周期，问有几个以 $T$ 为周期的解。</p><p><b>第 1 步：写出解。</b>令 $A(x)=\int_0^xa$，由积分因子法，初值 $y(0)=c$ 的解是</p>$$y(x)=e^{A(x)}\left[c+\int_0^xe^{-A(t)}b(t)dt\right].$$<p>代入 $x=T$ 得 $y(T)=Mc+B$，其中 $M=e^{A(T)}\gt0$，$B=M\int_0^Te^{-A}b$ 都是与 $c$ 无关的常数。</p><p><b>第 2 步：周期 ⟺ $y(T)=y(0)$。</b>必要性显然。充分性：令 $w(x)=y(x+T)$，因为系数是 $T$ 周期的，$w$ 满足同一方程，且 $w(0)=y(T)=y(0)$；初值相同的解唯一，所以 $w\equiv y$，即 $y$ 是周期函数。</p><p><b>第 3 步：解方程 $Mc+B=c$，即 $(1-M)c=B$。</b></p><ul><li>$M\ne1$：唯一 $c=\frac B{1-M}$，恰一个周期解；</li><li>$M=1$，$B=0$：每个 $c$ 都行，所有解都周期；</li><li>$M=1$，$B\ne0$：无解，没有周期解。</li></ul>`},
{"id":R`x7-s3`,"h":R`3. 积分因子的另一个用法：证明不等式；几何条件列方程`,"html":R`<p><b>证不等式</b>：$(e^{-x}P)'=e^{-x}(P'-P)$。若 $P(0)=0$，$P(1)=1$，两边从 0 积到 1：左边 $=e^{-1}\cdot1-0=\frac1e$。所以 $\frac1e=\int_0^1e^{-x}(P'-P)dx\le\int_0^1|P'-P|dx$（因为 $0\lt e^{-x}\le1$）。</p><p><b>几何建模</b>：题目说“切线过某点”“切线截距是……”“始终朝向对方”，先用坐标把这句话写成等式。曲线 $y=y(x)$ 在点 $(x,y)$ 的切线方程是 $Y-y=y'(X-x)$；它与 $x$ 轴交点（令 $Y=0$）为 $X=x-\frac y{y'}$，与 $y$ 轴交点（令 $X=0$）为 $Y=y-xy'$。把条件代入就得到微分方程。</p><p>例：“切线与 $x$ 轴交点横坐标是 $\frac x2$” $\Rightarrow x-\frac y{y'}=\frac x2\Rightarrow xy'=2y$，解得 $y=Cx^2$。</p>`}
],

{"id":R`x7-c1`,"sec":R`x7-s1`,"q":R`两个同一非齐次方程解的差满足：`,"opts":[R`同一非齐次方程`,R`对应齐次方程`,R`零函数以外都不满足方程`,R`任意方程`],"a":1,"ex":R`选“对应齐次方程”。$L(y_1)=Q$，$L(y_2)=Q$，相减得 $L(y_1-y_2)=0$。容易误选“同一非齐次方程”：差的右端是 $Q-Q=0$，不是 $Q$（除非 $Q=0$）。`},
{"id":R`x7-c2`,"sec":R`x7-s1`,"q":R`三个特解构造二阶通解，还需两条差函数：`,"opts":[R`处处相等`,R`线性独立`,R`均为常数`,R`取值全正`],"a":1,"ex":R`选“线性独立”。二阶齐次方程的通解需要两个线性无关的解；若 $y_2-y_1$ 与 $y_3-y_1$ 成比例，$C_1,C_2$ 两个参数实际上只相当于一个，得不到全部解。容易误选“均为常数”：差函数是齐次方程的解，一般不是常数，题目也不需要它们是常数。`},
{"id":R`x7-c3`,"sec":R`x7-s2`,"q":R`周期解对应初值c的条件是：`,"opts":[R`y(T)=0`,R`y(T)=c`,R`y′(T)=0即可`,R`c必须0`],"a":1,"ex":R`选 $y(T)=c$：走一个周期后回到初值。再由“平移后的函数满足同一方程且初值相同 → 两者相同”得到处处周期。容易误选“$y'(T)=0$”：导数为 0 与周期性无关；周期需要函数值回到起点。`},
{"id":R`x7-c4`,"sec":R`x7-s2`,"q":R`若一周期初值映射为c↦c+1，则周期解个数为：`,"opts":[R`0`,R`1`,R`2`,R`无限`],"a":0,"ex":R`选 0。周期解要求 $c\mapsto c$ 的固定点，而 $c+1=c$ 无解，所以没有周期解。容易误选“无限”：只有映射是 $c\mapsto c$（即 $M=1$，$B=0$）时才所有解都周期。`}

{"id":R`m-x7-audit`,"title":R`解的结构、周期解与几何建模：做题清单`,"steps":[R`已知几个非齐次解：两两相减得齐次解；检查它们线性无关（比值不是常数）；通解 = 一个特解 + 齐次通解。`,R`周期解：用积分因子写出初值为 $c$ 的解，算 $y(T)=Mc+B$；周期 ⟺ $y(T)=c$（充分性用平移 + 初值唯一性）；按 $M\ne1$ / $M=1,B=0$ / $M=1,B\ne0$ 分三类。`,R`几何题：设点 $(x,y)$、切线方程 $Y-y=y'(X-x)$，把题目条件翻译成等式再化成微分方程；最后检查解是否满足原几何条件（如切线是否真与坐标轴相交）。`]}

"problems":[
{"id":R`x7-p1`,"lv":R`真题`,"src":R`2022秋期末电子系A卷8（PDF第2页）`,"stmt":R`三个函数y₁,y₂,y₃满足y″+P₁y′+P₂y=Q，系数连续，且(y₂−y₁)/(y₃−y₁)在所论区间有定义且不是常数。证明通解为(1−C₁−C₂)y₁+C₁y₂+C₂y₃。`,"hints":[R`把非齐次问题化成齐次问题：$u=y_2-y_1$、$v=y_3-y_1$ 都满足齐次方程 $y''+P_1y'+P_2y=0$。`,R`“$\frac uv$ 不是常数”说明 $u,v$ 线性无关。严格写法用 Wronski 行列式 $W=uv'-u'v$：若 $W\equiv0$，则 $\left(\frac uv\right)'=\frac{u'v-uv'}{v^2}=0$，比值为常数，矛盾；又 $W'=-P_1W$，所以 $W=W(x_0)e^{-\int_{x_0}^xP_1}$ 处处不为 0。`,R`任取齐次方程的解 $w$，在一点 $x_0$ 解方程组 $C_1u(x_0)+C_2v(x_0)=w(x_0)$，$C_1u'(x_0)+C_2v'(x_0)=w'(x_0)$（系数行列式 $=W(x_0)\ne0$，有解）；由初值唯一性 $w=C_1u+C_2v$。最后加回 $y_1$。`],"method":R`m-x7-audit`,"sol":R`<p><b>已知</b>：$y_1,y_2,y_3$ 都满足 $y''+P_1y'+P_2y=Q$（系数连续），$\frac{y_2-y_1}{y_3-y_1}$ 有定义且不是常数。<b>要证</b>：通解为 $(1-C_1-C_2)y_1+C_1y_2+C_2y_3$。</p><p><b>第 1 步：化成齐次。</b>令 $u=y_2-y_1$，$v=y_3-y_1$。由线性，$u''+P_1u'+P_2u=Q-Q=0$，$v$ 同理。所以 $u,v$ 是齐次方程的解，且 $v\ne0$（比值有定义）。</p><p><b>第 2 步：$u,v$ 的 Wronski 行列式处处非零。</b>令 $W=uv'-u'v$。求导并用方程：</p>$$W'=uv''-u''v=u(-P_1v'-P_2v)-(-P_1u'-P_2u)v=-P_1(uv'-u'v)=-P_1W,$$<p>所以 $W(x)=W(x_0)e^{-\int_{x_0}^xP_1}$：要么处处为 0，要么处处不为 0。若处处为 0，则 $\left(\frac uv\right)'=\frac{u'v-uv'}{v^2}=-\frac W{v^2}=0$，$\frac uv$ 为常数，与题设矛盾。故 $W$ 处处不为 0。</p><p><b>第 3 步：齐次通解。</b>任取齐次方程的解 $w$，固定一点 $x_0$。关于 $C_1,C_2$ 的方程组</p>$$C_1u(x_0)+C_2v(x_0)=w(x_0),\qquad C_1u'(x_0)+C_2v'(x_0)=w'(x_0)$$<p>的系数行列式为 $u(x_0)v'(x_0)-v(x_0)u'(x_0)=W(x_0)\ne0$，有唯一解。于是 $C_1u+C_2v$ 与 $w$ 是同一齐次方程的解，且在 $x_0$ 处函数值、导数值都相同，由初值问题解的唯一性，$w=C_1u+C_2v$。所以齐次通解为 $C_1u+C_2v$。</p><p><b>第 4 步：非齐次通解。</b>任一非齐次解 $y$ 满足 $y-y_1$ 是齐次解，所以</p>$$y=y_1+C_1(y_2-y_1)+C_2(y_3-y_1)=(1-C_1-C_2)y_1+C_1y_2+C_2y_3.$$<p>反过来，这种形式的函数都满足方程。<b>证毕。</b></p>`},
{"id":R`x7-p2`,"lv":R`真题`,"src":R`无年份微积分A期末样题 证明2（PDF第2页）`,"stmt":R`<p>a,b为2π周期连续函数。对y′=a(x)y+b(x)，分别给出无周期解、仅一个周期解、所有解周期的例子，并证明周期解个数只能为这三种情况。</p>`,"hints":[R`例子从最简单的找：$a,b$ 取常数。证明部分：用积分因子写出初值 $y(0)=c$ 的解，看“走一个周期后的值” $y(2\pi)$ 和 $c$ 的关系。`,R`例子：$(a,b)=(0,1)$ 时 $y=x+C$；$(a,b)=(-1,0)$ 时 $y=Ce^{-x}$；$(a,b)=(0,0)$ 时 $y=C$。一般情形令 $A(x)=\int_0^xa$，解为 $y=e^{A(x)}\left[c+\int_0^xe^{-A}b\right]$，所以 $y(2\pi)=Mc+B$，$M=e^{A(2\pi)}$。`,R`说明 $y$ 周期 $\iff y(2\pi)=c$（充分性：$y(x+2\pi)$ 也是解且初值相同，由唯一性等于 $y$）。于是周期解的初值满足 $(1-M)c=B$：$M\ne1$ 唯一解；$M=1,B=0$ 全体；$M=1,B\ne0$ 无解。`],"method":R`m-x7-audit`,"sol":R`<p><b>(1) 三个例子</b>（$T=2\pi$）。</p><ul><li>$a=0$，$b=1$：$y'=1$，$y=x+C$，每个解都随 $x$ 增大而增大，<b>没有周期解</b>。</li><li>$a=-1$，$b=0$：$y'=-y$，$y=Ce^{-x}$，只有 $C=0$ 时是周期函数，<b>恰一个周期解</b> $y\equiv0$。</li><li>$a=0$，$b=0$：$y'=0$，$y=C$，<b>所有解都周期</b>。</li></ul><p><b>(2) 一般情形只能是这三种。</b></p><p>第 1 步：写出解。令 $A(x)=\int_0^xa(t)dt$。方程乘积分因子 $e^{-A(x)}$：$(e^{-A}y)'=e^{-A}b$，从 0 积到 $x$，记 $c=y(0)$：</p>$$y(x)=e^{A(x)}\left[c+\int_0^xe^{-A(t)}b(t)dt\right].$$<p>第 2 步：令 $T=2\pi$，$M=e^{A(T)}\gt0$，$B=M\int_0^Te^{-A(t)}b(t)dt$，则 $y(T)=Mc+B$。$M,B$ 只由 $a,b$ 决定。</p><p>第 3 步：$y$ 是 $T$ 周期 $\iff y(T)=c$。必要性：周期函数满足 $y(T)=y(0)$。充分性：令 $w(x)=y(x+T)$，由 $a,b$ 的周期性，$w'(x)=a(x+T)y(x+T)+b(x+T)=a(x)w(x)+b(x)$，即 $w$ 满足同一方程；又 $w(0)=y(T)=c=y(0)$。一阶线性方程初值问题的解唯一，所以 $w\equiv y$，即 $y(x+T)=y(x)$。</p><p>第 4 步：周期解对应的初值 $c$ 满足 $Mc+B=c$，即 $(1-M)c=B$：</p><ul><li>$M\ne1$：$c=\frac B{1-M}$ 唯一，<b>恰一个</b>周期解；</li><li>$M=1$ 且 $B=0$：任意 $c$ 都满足，<b>所有解</b>都周期；</li><li>$M=1$ 且 $B\ne0$：$0=B$ 矛盾，<b>没有</b>周期解。</li></ul><p><b>结论：周期解的个数只能是 0、1 或无穷多（全部），三种情形都可能出现。</b></p>`}
],
"variants":[
{"id":R`x7-v1`,"lv":R`真题`,"src":R`2023秋电子系A卷3（答案PDF第2页）`,"stmt":R`P∈C¹[0,1]，P(0)=0、P(1)=1，证明∫₀¹|P′−P|dx≥1/e。`,"hints":[R`$P'-P$ 的形式提示积分因子 $e^{-x}$：$(e^{-x}P)'=e^{-x}(P'-P)$。`,R`从 0 积到 1：$\int_0^1e^{-x}(P'-P)dx=\left[e^{-x}P\right]_0^1=e^{-1}\cdot1-1\cdot0=\frac1e$。`,R`$\frac1e=\left|\int_0^1e^{-x}(P'-P)dx\right|\le\int_0^1e^{-x}|P'-P|dx\le\int_0^1|P'-P|dx$，最后一步用 $0\lt e^{-x}\le1$（$0\le x\le1$）。`],"method":R`m-x7-audit`,"sol":R`<p><b>已知</b>：$P\in C^1[0,1]$，$P(0)=0$，$P(1)=1$。<b>要证</b>：$\int_0^1|P'-P|dx\ge\frac1e$。</p><p><b>第 1 步：积分因子。</b>$(e^{-x}P(x))'=e^{-x}P'(x)-e^{-x}P(x)=e^{-x}(P'-P)$。</p><p><b>第 2 步：积分。</b>由 Newton–Leibniz 公式：</p>$$\int_0^1e^{-x}(P'-P)dx=\left[e^{-x}P(x)\right]_0^1=e^{-1}P(1)-e^0P(0)=\frac1e.$$<p><b>第 3 步：放缩。</b>由积分的绝对值不等式，以及 $0\le x\le1$ 时 $0\lt e^{-x}\le1$：</p>$$\frac1e=\left|\int_0^1e^{-x}(P'-P)dx\right|\le\int_0^1e^{-x}|P'-P|dx\le\int_0^1|P'-P|dx.$$<p><b>证毕。</b>（不需要知道 $P'-P$ 的正负。）</p>`}

{"id":R`x7-e1`,"lv":R`延伸`,"src":R`2022秋期末电子系A卷9(1)(2)（PDF第2页）`,"stmt":R`<p>船A从原点沿正y轴以速率v₀>0前进，船B同时从(−a,0)出发，a>0，速率v₁恒定且始终朝向A。写出B在x&lt;0部分的路径积分式；v₁>v₀时求追上时间。</p>`,"hints":[R`设 $t$ 时刻 A 在 $(0,v_0t)$，B 在 $(x,y)$，B 的路径为 $y=y(x)$。“始终朝向 A”= B 处切线经过 A；“速率 $v_1$”= 路程 $s=v_1t$。`,R`切线过 A：$v_0t=y-xy'$（切线与 $y$ 轴交点）。路程：$\frac{dt}{dx}=\frac{\sqrt{1+y'^2}}{v_1}$。对第一式求导：$v_0\frac{dt}{dx}=-xy''$，记 $k=\frac{v_0}{v_1}$，得 $-xy''=k\sqrt{1+y'^2}$，初值 $y(-a)=0$，$y'(-a)=0$。`,R`令 $p=y'$，$\frac{dp}{\sqrt{1+p^2}}=\frac{k\,dx}{-x}$，积分得 $\operatorname{arsinh}p=k\ln\frac a{-x}$。令 $u=\frac{-x}a$：$p=\frac{u^{-k}-u^k}2$。再积分得 $y=\frac a2\int_u^1(s^{-k}-s^k)ds$，令 $u\to0$ 得相遇高度 $\frac{ak}{1-k^2}$。`],"method":R`m-x7-audit`,"sol":R`<p><b>（可能不考·延伸）</b>设 $k=\frac{v_0}{v_1}$。</p><p><b>第 1 步：列方程。</b>$t$ 时刻 A 在 $(0,v_0t)$，B 在 $(x,y)$，$-a\le x\lt0$，B 的路径 $y=y(x)$。</p><ul><li>B 朝向 A：B 处切线 $Y-y=y'(X-x)$ 过 A，令 $X=0$：$v_0t=y-xy'$。</li><li>B 的速率为 $v_1$：已走路程 $v_1t=\int_{-a}^x\sqrt{1+y'^2}dx$，所以 $\frac{dt}{dx}=\frac{\sqrt{1+y'^2}}{v_1}$。</li></ul><p>对第一式求导：$v_0\frac{dt}{dx}=y'-y'-xy''=-xy''$，代入第二式：</p>$$-xy''=k\sqrt{1+y'^2},\qquad y(-a)=0,\ y'(-a)=0.$$<p>（初始时 A 在原点，B 在 $(-a,0)$，朝向 A 即沿 $x$ 轴，斜率 0。）</p><p><b>第 2 步：解斜率。</b>令 $p=y'$，分离变量：$\frac{dp}{\sqrt{1+p^2}}=k\frac{dx}{-x}$。积分（$x\lt0$），$\operatorname{arsinh}p=-k\ln(-x)+C$；由 $p(-a)=0$ 得 $C=k\ln a$：</p>$$\operatorname{arsinh}p=k\ln\frac{a}{-x}.$$<p>令 $u=\frac{-x}a\in(0,1]$，则 $p=\sinh(-k\ln u)=\frac{u^{-k}-u^k}2$。</p><p><b>第 3 步：路径积分式。</b>$x=-au$，$dx=-a\,du$，$y=\int_{-a}^xp\,dx=\int_1^up\cdot(-a)du$：</p>$$y=\frac a2\int_u^1\left(s^{-k}-s^k\right)ds.$$<p><b>第 4 步：追上时间（$v_1\gt v_0$，即 $k\lt1$）。</b>$k\lt1$ 时 $s^{-k}$ 在 0 附近可积，$u\to0^+$ 时</p>$$y\to\frac a2\left[\frac{s^{1-k}}{1-k}-\frac{s^{1+k}}{1+k}\right]_0^1=\frac a2\left(\frac1{1-k}-\frac1{1+k}\right)=\frac{ak}{1-k^2}.$$<p>又 $xy'=-au\cdot\frac{u^{-k}-u^k}2=-\frac a2(u^{1-k}-u^{1+k})\to0$，由 $v_0t=y-xy'$ 得相遇时 $v_0t_*=\frac{ak}{1-k^2}$，B 恰好到达 A 的位置。所以</p>$$t_*=\frac{ak}{v_0(1-k^2)}=\frac{a}{v_1(1-k^2)}=\frac{av_1}{v_1^2-v_0^2}.$$<p><b>答案：路径 $y=\frac a2\int_u^1(s^{-k}-s^k)ds$（$u=-\frac xa$）；追上时间 $t_*=\frac{av_1}{v_1^2-v_0^2}$。</b></p>`},
{"id":R`x7-e2`,"lv":R`选做`,"src":R`无年份微积分A样题 填空12、计算4（PDF第2页）`,"stmt":R`<p>(1) 二阶线性齐次方程y″+P(x)y′+Q(x)y=0有两个解x、x²，求P,Q（x≠0）。</p><p>(2) 曲线上每点的切线与x轴交点的横坐标是该点横坐标的一半，求正半轴上可写成y=y(x)的曲线族。</p>`,"hints":[R`(1) 把 $y=x$、$y=x^2$ 分别代入方程，得到关于 $P,Q$ 的两个方程。(2) 写出切线与 $x$ 轴交点的横坐标 $X=x-\frac y{y'}$，令它等于 $\frac x2$。`,R`(1) $y=x$：$P+xQ=0$；$y=x^2$：$2+2xP+x^2Q=0$。(2) $x-\frac y{y'}=\frac x2\Rightarrow xy'=2y$。`,R`(1) 由第一式 $Q=-\frac Px$，代入第二式得 $2+xP=0$。(2) $x\gt0$ 时 $\left(\frac y{x^2}\right)'=\frac{xy'-2y}{x^3}=0$，$y=Cx^2$；检查 $C=0$ 时切线就是 $x$ 轴，不满足“有唯一交点”。`],"method":R`m-x7-audit`,"sol":R`<p><b>(1)</b> $y''+P(x)y'+Q(x)y=0$ 有解 $x$、$x^2$，求 $P,Q$（$x\ne0$）。</p><p>代入 $y=x$（$y'=1$，$y''=0$）：$P+xQ=0$。代入 $y=x^2$（$y'=2x$，$y''=2$）：$2+2xP+x^2Q=0$。由第一式 $x^2Q=-xP$，代入第二式：$2+2xP-xP=0$，$P=-\frac2x$，$Q=-\frac Px=\frac2{x^2}$。</p><p><b>答案：$P=-\frac2x$，$Q=\frac2{x^2}$</b>，即方程 $x^2y''-2xy'+2y=0$（在 $x\gt0$ 或 $x\lt0$ 上分别讨论）。</p><p><b>(2)</b> 求 $x\gt0$ 上的曲线 $y=y(x)$，使每点切线与 $x$ 轴交点的横坐标等于该点横坐标的一半。</p><p>第 1 步：点 $(x,y)$ 处切线 $Y-y=y'(X-x)$，令 $Y=0$，当 $y'\ne0$ 时交点唯一：$X=x-\frac y{y'}$。</p><p>第 2 步：条件 $x-\frac y{y'}=\frac x2$，即 $\frac y{y'}=\frac x2$，$xy'=2y$。</p><p>第 3 步：$x\gt0$ 时 $\left(\frac y{x^2}\right)'=\frac{x^2y'-2xy}{x^4}=\frac{xy'-2y}{x^3}=0$，所以 $y=Cx^2$。</p><p>第 4 步：检查。$C\ne0$ 时 $y'=2Cx\ne0$，交点 $X=x-\frac{Cx^2}{2Cx}=\frac x2$ ✓。$C=0$ 时 $y\equiv0$，切线就是 $x$ 轴本身，没有唯一交点，不符合题意，排除。</p><p><b>答案：$y=Cx^2$（$C\ne0$，$x\gt0$）。</b></p>`}
],

"title":R`往年卷拓展：Gaussian 集中与 Laplace 渐近`,
"goal":R`2020 年一份期末卷第 7 题：估计 $\int_a^be^{nf(x)}dx$ 在 $n\to\infty$ 时的大小（Laplace 方法）。它把 Taylor 展开和反常积分 $\int e^{-u^2}=\sqrt\pi$ 结合起来：最大值点附近用二次函数上下夹住，远处用“比最大值低一个固定量”压成 0。属于高阶拓展，主线约 30 分钟。`,
"sections":[
{"id":R`x8-s1`,"h":R`1. 钟形曲线 $e^{-nBx^2}$ 的宽度约为 $\frac1{\sqrt n}$`,"html":R`<p>这节解决：$n$ 很大时，$e^{-nB(x-x_0)^2}$ 几乎只在 $x_0$ 附近不为 0，它的积分是多少。</p><p>已知 Gauss 积分 $\int_{-\infty}^{\infty}e^{-u^2}du=\sqrt\pi$。换元 $u=\sqrt{nB}(x-x_0)$，$dx=\frac{du}{\sqrt{nB}}$：</p>$$\int_{x_0-\delta}^{x_0+\delta}e^{-nB(x-x_0)^2}dx=\frac1{\sqrt{nB}}\int_{-\delta\sqrt{nB}}^{\delta\sqrt{nB}}e^{-u^2}du.$$<p>$n\to\infty$ 时右边积分区间变成整条实轴，积分 $\to\sqrt\pi$。所以这块积分约为 $\sqrt{\frac{\pi}{nB}}$，只要 $\delta\gt0$ 固定，$\delta$ 的大小不影响主项。</p><p>例：$B=1$，$n=100$：$\int_{-1}^1e^{-100x^2}dx\approx\sqrt{\pi/100}\approx0.1772$，曲线的“宽度”约 $\frac1{\sqrt{100}}=0.1$。</p>`},
{"id":R`x8-s2`,"h":R`2. 最大值点附近，$f$ 像一个开口向下的抛物线`,"html":R`<p>设 $f$ 在 $(a,b)$ 内的 $x_0$ 处取唯一最大值，且 $f''(x_0)=-A\lt0$（叫“非退化”极大点：二阶导严格负）。因为 $f'(x_0)=0$，Taylor 公式给出</p>$$f(x_0+h)=f(x_0)-\frac A2h^2+o(h^2)\quad(h\to0).$$<p>把 $o(h^2)$ 变成可用的不等式：任给 $0\lt\varepsilon\lt A$，存在 $\delta\gt0$，使 $|h|\le\delta$ 时</p>$$-\frac{A+\varepsilon}2h^2\le f(x_0+h)-f(x_0)\le-\frac{A-\varepsilon}2h^2.$$<p>于是 $e^{n(f-f(x_0))}$ 在近区被两个钟形曲线 $e^{-n\frac{A\pm\varepsilon}2h^2}$ 上下夹住，再用第 1 节的结论。</p>`},
{"id":R`x8-s3`,"h":R`3. 远离最大值点的部分：比最大值低一个固定的量 $\eta$`,"html":R`<p>去掉近区 $(x_0-\delta,x_0+\delta)$ 后，剩下的 $[a,x_0-\delta]\cup[x_0+\delta,b]$ 是闭区间，$f$ 在上面连续、有最大值；因为 $x_0$ 是<b>唯一</b>最大点，这个最大值严格小于 $f(x_0)$。记差为 $\eta\gt0$，即远区上 $f\le f(x_0)-\eta$。</p><p>所以远区 $e^{n(f-f(x_0))}\le e^{-n\eta}$，积分 $\le(b-a)e^{-n\eta}$。乘以 $\sqrt n$ 后仍 $\to0$（指数衰减比任何幂快）。</p><p>注意：只说“远处 $f\lt f(x_0)$”不够，若没有统一的 $\eta$，$f$ 可能越来越接近 $f(x_0)$，估计就失效了；闭区间上取最大值保证了 $\eta$ 存在。</p><p>最后的顺序：先固定 $\varepsilon$、$\delta$，令 $n\to\infty$；再令 $\varepsilon\to0$。</p>`}
],

{"id":R`x8-c1`,"sec":R`x8-s1`,"q":R`非退化二次极大点贡献的宽度量级为：`,"opts":[R`1/n`,R`1/√n`,R`n`,R`常数`],"a":1,"ex":R`选 $\frac1{\sqrt n}$。$e^{-nAh^2/2}$ 在 $nh^2$ 约为 1 时才显著不为 0，即 $|h|\approx\frac1{\sqrt n}$。容易误选 $\frac1n$：那是指数为 $-n|h|$（一次）时的宽度；这里指数是二次的。`},
{"id":R`x8-c2`,"sec":R`x8-s2`,"q":R`Laplace主项的曲率A应满足：`,"opts":[R`A>0`,R`A=0`,R`任意符号`,R`A必须1`],"a":0,"ex":R`选 $A\gt0$。$f''(x_0)=-A\lt0$ 才保证 $x_0$ 附近 $f$ 像开口向下的抛物线，积分主项 $\sqrt{2\pi/(nA)}$ 才有意义。容易误选 $A=0$：此时二阶项消失，宽度不再是 $\frac1{\sqrt n}$，公式里会出现除以 0（见延伸题 $e^{-nx^4}$）。`},
{"id":R`x8-c3`,"sec":R`x8-s3`,"q":R`远区指数间隙η来自：`,"opts":[R`任意猜测`,R`紧性与最大值唯一性`,R`只需f(x)不等于f(x₀)`,R`只需图像`],"a":1,"ex":R`选“紧性与最大值唯一性”：远区是闭区间，连续函数在上面取到最大值，而这个最大值不等于 $f(x_0)$（唯一性），所以严格更小，差是固定正数 $\eta$。容易误选“只需 $f(x)$ 不等于 $f(x_0)$”：逐点不等不保证有统一的间隙 $\eta$。`},
{"id":R`x8-c4`,"sec":R`x8-s3`,"q":R`近区夹逼后，最后应让什么趋0？`,"opts":[R`n`,R`A`,R`ε`,R`f(x₀)`],"a":2,"ex":R`选 $\varepsilon$。先固定 $\varepsilon$ 得到 $\sqrt{\frac{2\pi}{A+\varepsilon}}\le\liminf\le\limsup\le\sqrt{\frac{2\pi}{A-\varepsilon}}$，再令 $\varepsilon\to0$，上下界都趋于 $\sqrt{\frac{2\pi}A}$。容易误选 $n$：$n\to\infty$ 已在前一步取过，这一步要消去的是人为引入的 $\varepsilon$。`}
],
"methods":[
{"id":R`m-x8-audit`,"title":R`Laplace 方法：证明清单`,"steps":[R`归一化：令 $J_n=e^{-nf(x_0)}\int_a^be^{nf}$，写出最大点 $x_0$、$A=-f''(x_0)\gt0$，目标是 $\sqrt nJ_n\to\sqrt{2\pi/A}$。`,R`固定 $\varepsilon\in(0,A)$，选 $\delta$ 使近区二次夹逼成立；近区积分换元 $u=\sqrt{n(A\pm\varepsilon)/2}\,h$，用 $\int e^{-u^2}=\sqrt\pi$。远区由闭区间最大值得 $\eta\gt0$，贡献 $\le(b-a)e^{-n\eta}$。`,R`先令 $n\to\infty$ 得到 $\liminf$、$\limsup$ 的上下界，再令 $\varepsilon\to0$。易错：$f''(x_0)=0$ 时不能套这个公式；有两个同样高的最大点时两处贡献要相加。`]}
],
"problems":[
{"id":R`x8-p1`,"lv":R`真题`,"src":R`2020秋期末7(1)（原卷第2页）`,"stmt":R`B,δ>0，x₀∈R。利用∫R e⁻ᵘ²du=√π，证明 $\sqrt{Bn/\pi}\int_{x_0-\delta}^{x_0+\delta}e^{-nB(x-x_0)^2}dx\to1$。`,"hints":[R`换元 $u=\sqrt{nB}(x-x_0)$，把积分变成 $e^{-u^2}$ 的积分。`,R`$dx=\frac{du}{\sqrt{nB}}$，$x=x_0\pm\delta\Rightarrow u=\pm\delta\sqrt{nB}$。原式 $=\sqrt{\frac{Bn}\pi}\cdot\frac1{\sqrt{nB}}\int_{-\delta\sqrt{nB}}^{\delta\sqrt{nB}}e^{-u^2}du=\frac1{\sqrt\pi}\int_{-\delta\sqrt{nB}}^{\delta\sqrt{nB}}e^{-u^2}du$。`,R`$n\to\infty$ 时 $\delta\sqrt{nB}\to+\infty$，由反常积分定义 $\int_{-R}^Re^{-u^2}du\to\sqrt\pi$，所以原式 $\to\frac{\sqrt\pi}{\sqrt\pi}=1$。`],"method":R`m-x8-audit`,"sol":R`<p><b>已知</b>：$B,\delta\gt0$，$\int_{-\infty}^{\infty}e^{-u^2}du=\sqrt\pi$。<b>要证</b>：$\sqrt{\frac{Bn}\pi}\int_{x_0-\delta}^{x_0+\delta}e^{-nB(x-x_0)^2}dx\to1$。</p><p><b>第 1 步：换元。</b>令 $u=\sqrt{nB}(x-x_0)$，则 $dx=\frac{du}{\sqrt{nB}}$；$x=x_0-\delta\Rightarrow u=-\delta\sqrt{nB}$，$x=x_0+\delta\Rightarrow u=\delta\sqrt{nB}$。$nB(x-x_0)^2=u^2$。</p>$$\sqrt{\frac{Bn}\pi}\int_{x_0-\delta}^{x_0+\delta}e^{-nB(x-x_0)^2}dx=\sqrt{\frac{Bn}\pi}\cdot\frac1{\sqrt{nB}}\int_{-R_n}^{R_n}e^{-u^2}du=\frac1{\sqrt\pi}\int_{-R_n}^{R_n}e^{-u^2}du,$$<p>其中 $R_n=\delta\sqrt{nB}$。</p><p><b>第 2 步：取极限。</b>$n\to\infty$ 时 $R_n\to+\infty$。$\int_{-\infty}^\infty e^{-u^2}du$ 收敛（等于 $\sqrt\pi$），由反常积分的定义 $\int_{-R}^{R}e^{-u^2}du\to\sqrt\pi$（$R\to+\infty$），所以</p>$$\frac1{\sqrt\pi}\int_{-R_n}^{R_n}e^{-u^2}du\to\frac{\sqrt\pi}{\sqrt\pi}=1.$$<p><b>证毕。</b></p>`},
{"id":R`x8-p2`,"lv":R`真题`,"src":R`2020秋期末7(2)（原卷第2页）`,"stmt":R`f∈C²[a,b]，唯一最大点x₀∈(a,b)，f″(x₀)=−A&lt;0。证明 $\int_a^be^{nf(x)}dx\sim e^{nf(x_0)}\sqrt{2\pi/(nA)}$。`,"hints":[R`令 $J_n=e^{-nf(x_0)}\int_a^be^{nf(x)}dx$，目标 $\sqrt nJ_n\to\sqrt{\frac{2\pi}A}$。把 $[a,b]$ 分成近区 $[x_0-\delta,x_0+\delta]$ 和远区；近区用 Taylor 二次夹逼，远区用固定间隙 $\eta$。`,R`近区：$e^{-n\frac{A+\varepsilon}2h^2}\le e^{n(f(x_0+h)-f(x_0))}\le e^{-n\frac{A-\varepsilon}2h^2}$。由上一题（取 $B=\frac{A\pm\varepsilon}2$），$\sqrt n\int_{-\delta}^{\delta}e^{-nBh^2}dh\to\sqrt{\frac\pi B}=\sqrt{\frac{2\pi}{A\pm\varepsilon}}$。`,R`远区贡献 $\le\sqrt n(b-a)e^{-n\eta}\to0$。所以 $\sqrt{\frac{2\pi}{A+\varepsilon}}\le\liminf\sqrt nJ_n\le\limsup\sqrt nJ_n\le\sqrt{\frac{2\pi}{A-\varepsilon}}$，再令 $\varepsilon\to0$。`],"method":R`m-x8-audit`,"sol":R`<p><b>已知</b>：$f\in C^2[a,b]$，$x_0\in(a,b)$ 是唯一最大点，$f''(x_0)=-A\lt0$。<b>要证</b>：$\int_a^be^{nf(x)}dx\sim e^{nf(x_0)}\sqrt{\frac{2\pi}{nA}}$（$\sim$ 表示两者之比 $\to1$）。</p><p>令 $J_n=e^{-nf(x_0)}\int_a^be^{nf(x)}dx=\int_a^be^{n(f(x)-f(x_0))}dx$，只需证 $\sqrt nJ_n\to\sqrt{\frac{2\pi}A}$。</p><p><b>第 1 步：近区夹逼。</b>固定 $\varepsilon\in(0,A)$。$x_0$ 是内部最大点，$f'(x_0)=0$；由 Taylor 公式 $f(x_0+h)-f(x_0)=-\frac A2h^2+o(h^2)$，存在 $\delta\gt0$（且 $[x_0-\delta,x_0+\delta]\subset(a,b)$），使 $|h|\le\delta$ 时</p>$$-\frac{A+\varepsilon}2h^2\le f(x_0+h)-f(x_0)\le-\frac{A-\varepsilon}2h^2.$$<p>记近区积分 $N_n=\int_{-\delta}^{\delta}e^{n(f(x_0+h)-f(x_0))}dh$，则</p>$$\int_{-\delta}^{\delta}e^{-n\frac{A+\varepsilon}2h^2}dh\le N_n\le\int_{-\delta}^{\delta}e^{-n\frac{A-\varepsilon}2h^2}dh.$$<p>由上一题（$B=\frac{A\pm\varepsilon}2$，$\sqrt{\frac{Bn}\pi}\int\to1$ 即 $\sqrt n\int\to\sqrt{\frac\pi B}$）：</p>$$\sqrt n\int_{-\delta}^{\delta}e^{-n\frac{A\pm\varepsilon}2h^2}dh\to\sqrt{\frac{2\pi}{A\pm\varepsilon}}.$$<p><b>第 2 步：远区。</b>$K=[a,x_0-\delta]\cup[x_0+\delta,b]$ 是闭集，$f$ 在上面连续，取到最大值 $m$；因 $x_0\notin K$ 且 $x_0$ 是唯一最大点，$m\lt f(x_0)$。令 $\eta=f(x_0)-m\gt0$，则在 $K$ 上 $e^{n(f-f(x_0))}\le e^{-n\eta}$，远区积分 $F_n$ 满足</p>$$0\le\sqrt nF_n\le\sqrt n(b-a)e^{-n\eta}\to0.$$<p><b>第 3 步：合并。</b>$\sqrt nJ_n=\sqrt nN_n+\sqrt nF_n$，由前两步</p>$$\sqrt{\frac{2\pi}{A+\varepsilon}}\le\liminf_{n\to\infty}\sqrt nJ_n\le\limsup_{n\to\infty}\sqrt nJ_n\le\sqrt{\frac{2\pi}{A-\varepsilon}}.$$<p><b>第 4 步：</b>$\varepsilon\in(0,A)$ 任意，令 $\varepsilon\to0$，上下界都 $\to\sqrt{\frac{2\pi}A}$，所以 $\lim\sqrt nJ_n=\sqrt{\frac{2\pi}A}$。即</p>$$\int_a^be^{nf(x)}dx\sim e^{nf(x_0)}\sqrt{\frac{2\pi}{nA}}.$$<p><b>证毕。</b>条件的作用：“唯一最大点”给远区的 $\eta$；“$f''(x_0)\lt0$”给近区 $\frac1{\sqrt n}$ 的宽度。</p>`}

{"id":R`x8-v1`,"lv":R`变种`,"src":R`自编：归一化核验`,"stmt":R`固定α≥0，求 $\lim_{n\to\infty}\sqrt{n/(2\pi)}\int_{-1}^1e^{-n(x^2/2+\alpha x^4)}dx$。`,"hints":[R`写成 $\int_{-1}^1e^{nf(x)}dx$，$f(x)=-\frac{x^2}2-\alpha x^4$，套用上一题的 Laplace 公式。`,R`$\alpha\ge0$ 时 $f(x)\le0=f(0)$，等号只在 $x=0$，所以 $x_0=0$ 是唯一最大点（在区间内部）。$f''(x)=-1-12\alpha x^2$，$f''(0)=-1$，$A=1$。`,R`由公式 $\int_{-1}^1e^{nf}\sim e^{0}\sqrt{\frac{2\pi}{n\cdot1}}$，所以 $\sqrt{\frac n{2\pi}}\int_{-1}^1e^{nf}\to1$。`],"method":R`m-x8-audit`,"sol":R`<p><b>目标</b>：$\alpha\ge0$ 固定，求 $\lim\sqrt{\frac n{2\pi}}\int_{-1}^1e^{-n(x^2/2+\alpha x^4)}dx$。</p><p><b>第 1 步：</b>令 $f(x)=-\frac{x^2}2-\alpha x^4$，$f\in C^2[-1,1]$，被积函数为 $e^{nf(x)}$。</p><p><b>第 2 步：检查条件。</b>因为 $\alpha\ge0$，$f(x)\le0$，且 $f(x)=0\iff x=0$，所以 $x_0=0\in(-1,1)$ 是唯一最大点，$f(0)=0$。$f''(x)=-1-12\alpha x^2$，$f''(0)=-1$，即 $A=1\gt0$。</p><p><b>第 3 步：套用 Laplace 公式</b>（上一题）：</p>$$\int_{-1}^1e^{nf(x)}dx\sim e^{n\cdot0}\sqrt{\frac{2\pi}{n}}.$$<p>所以 $\sqrt{\frac n{2\pi}}\int_{-1}^1e^{nf}dx\to1$。</p><p><b>答案：极限为 1</b>（与 $\alpha$ 无关；$\alpha x^4$ 只影响更高阶的误差）。数值检验：$\alpha=2$，$n=10^4$ 时该量约为 $0.9994$。</p>`}
],
"extensions":[
{"id":R`x8-e1`,"lv":R`延伸`,"src":R`自编：假设失效时不能硬套`,"stmt":R`<p>(1) 计算lim n¹ᐟ⁴∫₋₁¹e⁻ⁿˣ⁴dx的积分表达式。</p><p>(2) 如果同高极大值有两个非退化内点，主项应怎样变化？</p>`,"hints":[R`(1) $f=-x^4$ 在 0 处 $f''(0)=0$，不是非退化极大，不能套 $\frac1{\sqrt n}$ 公式。看指数 $nx^4$：令它约为 1，宽度是 $n^{-1/4}$，于是换元 $u=n^{1/4}x$。(2) 两个最大点各取一个小邻域分别算。`,R`(1) $u=n^{1/4}x$，$dx=n^{-1/4}du$，$n^{1/4}\int_{-1}^1e^{-nx^4}dx=\int_{-n^{1/4}}^{n^{1/4}}e^{-u^4}du$。`,R`(1) $n\to\infty$ 时趋于 $\int_{-\infty}^\infty e^{-u^4}du$（收敛，约为 $1.813$）。(2) 两个不相交的小邻域各贡献 $e^{nM}\sqrt{\frac{2\pi}{nA_i}}$，远区仍有固定间隙，所以主项是两者之和。`],"method":R`m-x8-audit`,"sol":R`<p><b>(1)</b> 求 $\lim_{n\to\infty}n^{1/4}\int_{-1}^1e^{-nx^4}dx$。</p><p>第 1 步：换元 $u=n^{1/4}x$，$dx=n^{-1/4}du$，$nx^4=u^4$，$x=\pm1\Rightarrow u=\pm n^{1/4}$：</p>$$n^{1/4}\int_{-1}^1e^{-nx^4}dx=\int_{-n^{1/4}}^{n^{1/4}}e^{-u^4}du.$$<p>第 2 步：$\int_{-\infty}^\infty e^{-u^4}du$ 收敛（$|u|\ge1$ 时 $e^{-u^4}\le e^{-|u|}$，后者可积）。由反常积分定义，$n\to\infty$ 时上式 $\to\int_{-\infty}^{\infty}e^{-u^4}du$。</p><p><b>答案：极限为 $\int_{-\infty}^{\infty}e^{-u^4}du$</b>（有限正数，约 $1.8128$；可写成 $\frac12\Gamma(\frac14)$）。</p><p>说明：这里 $f(x)=-x^4$ 的 $f''(0)=0$，极大点退化，集中宽度是 $n^{-1/4}$ 而不是 $n^{-1/2}$，不能套用 $\sqrt{2\pi/(nA)}$。</p><p><b>(2)</b> 若 $f$ 在 $(a,b)$ 内有两个最大点 $x_1,x_2$，$f(x_1)=f(x_2)=M$，$f''(x_i)=-A_i\lt0$，其余点 $f\lt M$。</p><p>取两个不相交的小邻域分别做近区夹逼，各得贡献 $\sim e^{nM}\sqrt{\frac{2\pi}{nA_i}}$；去掉两个邻域后的闭集上仍有 $f\le M-\eta$，远区贡献可忽略。所以</p>$$\int_a^be^{nf(x)}dx\sim e^{nM}\sqrt{\frac{2\pi}n}\left(\frac1{\sqrt{A_1}}+\frac1{\sqrt{A_2}}\right).$$<p><b>答案：两个最大点的贡献相加</b>，不能只取其中一个。</p>`}

"title":R`可能不考·往年卷查漏：非线性变换后的级数`,
"goal":R`（可能不考，选做）补 2020 年卷的级数题：$\sum\ln(1+a_n)$ 什么时候和 $\sum a_n$ 同时收敛；以及交错级数套上 $\ln$ 后，平方项可能让级数发散。原资料从 $n=1$ 写起，但第 1 项是 $\ln0$，没有意义，这里改成从 $n=2$ 开始讨论。约 30 分钟，旧卷出现过不代表本学期一定考。`,
"sections":[
{"id":R`x9-s1`,"h":R`1. 正项级数：可以用“等价”比较`,"html":R`<p>这节解决：$a_n\gt0$、$a_n\to0$ 时，$\sum\ln(1+a_n)$ 和 $\sum a_n$ 的关系。</p><p>因为 $\lim_{t\to0}\frac{\ln(1+t)}t=1$，$n$ 足够大时 $\frac{\ln(1+a_n)}{a_n}$ 落在 $[\frac12,1]$ 内，即</p>$$\frac{a_n}2\le\ln(1+a_n)\le a_n.$$<p>（右边的不等式 $\ln(1+t)\le t$ 其实对所有 $t\gt-1$ 都成立。）由正项级数比较判别法，两个级数同时收敛或同时发散。</p><p>例：$a_n=\frac1{n^2}$ 时 $\sum\ln(1+\frac1{n^2})$ 收敛；$a_n=\frac1n$ 时 $\sum\ln(1+\frac1n)=\sum[\ln(n+1)-\ln n]=\ln(N+1)\to\infty$，发散。</p><p>注意：这个“等价就同敛散”只对<b>正项</b>（或从某项起同号）级数成立，变号级数不行（见下一节）。</p>`},
{"id":R`x9-s2`,"h":R`2. 交错级数套上 $\ln$：平方项可能导致发散`,"html":R`<p>这节解决：$t_n=\frac{(-1)^n}{\sqrt n}$ 时，$\sum t_n$ 收敛（交错级数判别法：绝对值单调减趋于 0），那 $\sum\ln(1+t_n)$ 呢？</p><p>把 $\ln$ 展开到二次：</p>$$\ln(1+t_n)=t_n-\frac{t_n^2}2+r_n,\qquad|r_n|\le C|t_n|^3.$$<p>逐项看三部分：</p><ul><li>$\sum t_n$：收敛；</li><li>$t_n^2=\frac1n$，$\sum\frac{t_n^2}2=\frac12\sum\frac1n$ 发散到 $+\infty$（平方把正负号消掉了，项全为正）；</li><li>$|r_n|\le Cn^{-3/2}$，$\sum r_n$ 绝对收敛。</li></ul><p>所以 $\sum\ln(1+t_n)$ 的部分和 = 收敛部分 − $\frac12\times$调和部分和 + 收敛部分 $\to-\infty$，<b>发散</b>。</p><p>结论：对变号级数做非线性变换（如取 $\ln$）可能改变敛散性，必须展开到“余项绝对可求和”的那一阶。</p>`},
{"id":R`x9-s3`,"h":R`3. 没有定义的项不能用“去掉有限项不影响”糊过去`,"html":R`<p>“改变或去掉有限项不影响级数敛散性”——这句话的前提是每一项都是实数。</p><p>原资料写 $\sum_{n=1}^\infty\ln\left(1+\frac{(-1)^n}{\sqrt n}\right)$，但 $n=1$ 时是 $\ln(1-1)=\ln0$，根本不是实数，整个式子从一开始就没有定义。</p><p>正确做法：明确说明“题目修正为从 $n=2$ 开始”，然后讨论 $\sum_{n\ge2}$。$n\ge2$ 时 $1+\frac{(-1)^n}{\sqrt n}\ge1-\frac1{\sqrt3}\gt0$，每项都有定义。</p>`}
],

{"id":R`x9-c1`,"sec":R`x9-s1`,"q":R`正项aₙ→0时，ln(1+aₙ)/aₙ趋于：`,"opts":[R`0`,R`1`,R`∞`,R`−1`],"a":1,"ex":R`选 1。这是重要极限 $\lim_{t\to0}\frac{\ln(1+t)}t=1$，令 $t=a_n\to0$ 即得。容易误选 0：把 $\ln(1+a_n)$ 看成比 $a_n$ 更小的高阶量，但实际上两者是同阶的等价量。`},
{"id":R`x9-c2`,"sec":R`x9-s2`,"q":R`tₙ=(−1)ⁿ/√n的平方项为：`,"opts":[R`(−1)ⁿ/n`,R`1/n`,R`1/n²`,R`0`],"a":1,"ex":R`选 $\frac1n$：$\left(\frac{(-1)^n}{\sqrt n}\right)^2=\frac{(-1)^{2n}}{n}=\frac1n$，平方消去了正负号。容易误选 $\frac{(-1)^n}n$：忘了 $(-1)^n$ 也要平方。正因为平方后恒正，它的和是发散的调和级数。`},
{"id":R`x9-c3`,"sec":R`x9-s2`,"q":R`∑|tₙ|³在本例中：`,"opts":[R`发散`,R`收敛`,R`通项不趋零`,R`无法判断`],"a":1,"ex":R`选“收敛”：$|t_n|^3=n^{-3/2}$，是 $p=\frac32\gt1$ 的 $p$ 级数，收敛。容易误选“发散”：和 $\sum t_n^2=\sum\frac1n$（$p=1$）混淆了。`},
{"id":R`x9-c4`,"sec":R`x9-s3`,"q":R`ln0作为一个首项，正确处理为：`,"opts":[R`直接等于0`,R`忽略且不说明`,R`明确修正起始下标后讨论尾项`,R`当成有限负数`],"a":2,"ex":R`选“明确修正起始下标后讨论尾项”。$\ln0$ 不是实数，不能当作某个有限值，只能先把题目改成从 $n=2$ 开始，并写明这是修正。容易误选“忽略且不说明”：“去掉有限项不影响敛散”只适用于本来有定义的项，悄悄删掉会掩盖题面错误。`}

{"id":R`m-x9-audit`,"title":R`非线性变换后的级数：做题清单`,"steps":[R`先检查每一项都有定义（如 $\ln$ 里要 $\gt0$）；有无定义的项就写明修正起始下标。`,R`正项（或从某项起同号）：用极限比较 $\frac{\ln(1+a_n)}{a_n}\to1$，两级数同敛散。`,R`变号：把 $\ln(1+t_n)$ 展开为 $t_n-\frac{t_n^2}2+r_n$，分别判断三部分；要说明 $|r_n|\le C|t_n|^3$ 且 $\sum|t_n|^3$ 收敛。易错：只看一阶等价 $\ln(1+t_n)\sim t_n$ 就下结论。`]}

"problems":[
{"id":R`x9-p1`,"lv":R`真题`,"src":R`2020秋期末5(1)（原卷第2页）`,"stmt":R`aₙ>0且aₙ→0。证明∑ln(1+aₙ)收敛当且仅当∑aₙ收敛。`,"hints":[R`正项级数比较判别法 + 重要极限 $\frac{\ln(1+t)}t\to1$（$t\to0$）。`,R`因为 $a_n\to0$，存在 $N$ 使 $n\ge N$ 时 $\frac{\ln(1+a_n)}{a_n}\ge\frac12$；又对 $t\gt0$ 有 $\ln(1+t)\le t$。所以 $\frac{a_n}2\le\ln(1+a_n)\le a_n$（$n\ge N$）。`,R`“$\Leftarrow$”：$0\lt\ln(1+a_n)\le a_n$，由比较判别法。“$\Rightarrow$”：$0\lt a_n\le2\ln(1+a_n)$。前 $N-1$ 项是有限个实数，不影响敛散。`],"method":R`m-x9-audit`,"sol":R`<p><b>已知</b>：$a_n\gt0$，$a_n\to0$。<b>要证</b>：$\sum\ln(1+a_n)$ 收敛 $\iff\sum a_n$ 收敛。</p><p><b>第 1 步：两边夹。</b>由 $\lim_{t\to0}\frac{\ln(1+t)}t=1$ 和 $a_n\to0$，得 $\frac{\ln(1+a_n)}{a_n}\to1$，所以存在 $N$，$n\ge N$ 时 $\frac{\ln(1+a_n)}{a_n}\ge\frac12$。又对 $t\gt0$，$\ln(1+t)\lt t$（令 $g(t)=t-\ln(1+t)$，$g(0)=0$，$g'=\frac t{1+t}\gt0$）。所以</p>$$0\lt\frac{a_n}2\le\ln(1+a_n)\le a_n\quad(n\ge N).$$<p>（$a_n\gt0$ 保证 $\ln(1+a_n)\gt0$，每项有定义且为正。）</p><p><b>第 2 步：“$\Leftarrow$”。</b>若 $\sum a_n$ 收敛，由 $0\lt\ln(1+a_n)\le a_n$ 和正项级数比较判别法，$\sum_{n\ge N}\ln(1+a_n)$ 收敛，加上前面有限项仍收敛。</p><p><b>第 3 步：“$\Rightarrow$”。</b>若 $\sum\ln(1+a_n)$ 收敛，由 $0\lt a_n\le2\ln(1+a_n)$（$n\ge N$），同理 $\sum a_n$ 收敛。</p><p><b>结论：两级数同敛散。证毕。</b></p>`},
{"id":R`x9-p2`,"lv":R`真题`,"src":R`2020秋期末5(2)（明确修正起始项，原卷第2页）`,"stmt":R`从n=2开始，讨论∑ln(1+(−1)ⁿ/√n)的敛散性。说明为何不能直接照原资料的n=1起点。`,"hints":[R`记 $t_n=\frac{(-1)^n}{\sqrt n}$。先说明 $n=1$ 时 $\ln0$ 无定义，所以从 $n=2$ 起讨论。然后把 $\ln(1+t_n)$ 展开到二次：$t_n-\frac{t_n^2}2+r_n$。`,R`$|t|\le\frac1{\sqrt2}$ 时，Taylor 余项满足 $|r|\le C|t|^3$（$C$ 是常数）。三部分：$\sum t_n$ 交错收敛；$\sum t_n^2=\sum\frac1n$ 发散；$\sum|r_n|\le C\sum n^{-3/2}$ 收敛。`,R`部分和 $S_N=\sum_{n=2}^Nt_n-\frac12\sum_{n=2}^N\frac1n+\sum_{n=2}^Nr_n$，第一、三项有有限极限，第二项 $\to+\infty$，所以 $S_N\to-\infty$。`],"method":R`m-x9-audit`,"sol":R`<p><b>题面修正</b>：原资料从 $n=1$ 开始，但第 1 项 $\ln(1+\frac{-1}{1})=\ln0$ 不是实数，原级数没有定义，不能用“去掉有限项不影响”处理。下面讨论修正后的 $\sum_{n=2}^\infty\ln\left(1+\frac{(-1)^n}{\sqrt n}\right)$。$n\ge2$ 时 $1+\frac{(-1)^n}{\sqrt n}\ge1-\frac1{\sqrt3}\gt0$，每项有定义。</p><p><b>第 1 步：展开。</b>记 $t_n=\frac{(-1)^n}{\sqrt n}$，$|t_n|\le\frac1{\sqrt2}$。由带余项的 Taylor 公式，在闭区间 $|t|\le\frac1{\sqrt2}$ 上（$1+t\ge1-\frac1{\sqrt2}\gt0$，$\ln(1+t)$ 的三阶导数有界）存在常数 $C$，使</p>$$\ln(1+t)=t-\frac{t^2}2+r(t),\qquad|r(t)|\le C|t|^3.$$<p>所以 $\ln(1+t_n)=t_n-\frac1{2n}+r_n$，$|r_n|\le Cn^{-3/2}$。</p><p><b>第 2 步：三部分分别判断。</b></p><ul><li>$\sum_{n\ge2}t_n=\sum\frac{(-1)^n}{\sqrt n}$：$\frac1{\sqrt n}$ 单调递减趋于 0，由交错级数判别法收敛。</li><li>$\sum_{n\ge2}\frac1{2n}$：调和级数，发散到 $+\infty$。</li><li>$\sum|r_n|\le C\sum n^{-3/2}$，$p=\frac32\gt1$，收敛，所以 $\sum r_n$ 绝对收敛。</li></ul><p><b>第 3 步：部分和。</b></p>$$S_N=\sum_{n=2}^N\ln(1+t_n)=\underbrace{\sum_{n=2}^Nt_n}_{\text{有极限}}-\underbrace{\frac12\sum_{n=2}^N\frac1n}_{\to+\infty}+\underbrace{\sum_{n=2}^Nr_n}_{\text{有极限}}\to-\infty.$$<p><b>结论：从 $n=2$ 开始的级数发散（部分和趋于 $-\infty$）。</b>注意 $\sum t_n$ 本身收敛，取 $\ln$ 后却发散。</p>`}
],
"variants":[
{"id":R`x9-v1`,"lv":R`变种`,"src":R`自编：同一交错首项的不同结果`,"stmt":R`从n=2开始，讨论∑ln(1+(−1)ⁿ/n)的收敛及绝对收敛。`,"hints":[R`$t_n=\frac{(-1)^n}n$，展开 $\ln(1+t_n)=t_n+r_n$，$|r_n|\le Ct_n^2=\frac C{n^2}$。这次一阶展开就够，因为 $\sum t_n^2$ 已经收敛。`,R`$\sum t_n$ 是交错调和级数，收敛；$\sum|r_n|\le C\sum\frac1{n^2}$ 收敛。所以 $\sum\ln(1+t_n)$ 收敛。`,R`绝对收敛？$\frac{|\ln(1+t_n)|}{1/n}\to1$，由正项极限比较，$\sum|\ln(1+t_n)|$ 与 $\sum\frac1n$ 同样发散。所以条件收敛。`],"method":R`m-x9-audit`,"sol":R`<p><b>目标</b>：讨论 $\sum_{n=2}^\infty\ln\left(1+\frac{(-1)^n}n\right)$ 是否收敛、是否绝对收敛。（$n\ge2$ 时 $1+\frac{(-1)^n}n\ge\frac23\gt0$，每项有定义。）</p><p><b>第 1 步：展开。</b>记 $t_n=\frac{(-1)^n}n$，$|t_n|\le\frac12$。在 $|t|\le\frac12$ 上存在常数 $C$ 使 $|\ln(1+t)-t|\le Ct^2$，所以 $\ln(1+t_n)=t_n+r_n$，$|r_n|\le\frac C{n^2}$。</p><p><b>第 2 步：收敛。</b>$\sum t_n=\sum\frac{(-1)^n}n$ 由交错级数判别法收敛；$\sum|r_n|\le C\sum\frac1{n^2}$ 收敛。两者相加，$\sum\ln(1+t_n)$ 收敛。</p><p><b>第 3 步：不绝对收敛。</b>$|\ln(1+t_n)|\gt0$，且 $\frac{|\ln(1+t_n)|}{1/n}=\left|\frac{\ln(1+t_n)}{t_n}\right|\to1$。由正项级数极限比较，$\sum|\ln(1+t_n)|$ 与 $\sum\frac1n$ 同敛散，发散。</p><p><b>结论：级数收敛，但不绝对收敛（条件收敛）。</b></p><p>（另法验证：$\left(1+\frac1{2k}\right)\left(1-\frac1{2k+1}\right)=\frac{2k+1}{2k}\cdot\frac{2k}{2k+1}=1$，相邻两项的和为 0，偶数项部分和恒为 0，奇数项部分和 $\to0$，级数和为 0。）</p>`}

{"id":R`x9-e1`,"lv":R`延伸`,"src":R`自编：变号级数的等价陷阱`,"stmt":R`给出aₙ/bₙ→1，但∑aₙ与∑bₙ敛散性不同的例子，并证明。`,"hints":[R`正项级数里“$\frac{a_n}{b_n}\to1$ 则同敛散”成立，所以反例必须用变号级数。借用上一题的现象：给收敛的交错级数加上一个“小但同号”的项。`,R`取 $b_n=\frac{(-1)^n}{\sqrt n}$，$a_n=b_n-\frac1{2n}$。则 $\frac{a_n}{b_n}=1-\frac{1/(2n)}{(-1)^n/\sqrt n}=1-\frac{(-1)^n}{2\sqrt n}\to1$。`,R`$\sum b_n$ 交错收敛；$\sum a_n=\sum b_n-\frac12\sum\frac1n$，部分和 $\to-\infty$，发散。`],"method":R`m-x9-audit`,"sol":R`<p><b>目标</b>：找 $a_n,b_n$，使 $\frac{a_n}{b_n}\to1$，但 $\sum a_n$ 与 $\sum b_n$ 一个收敛、一个发散。</p><p><b>构造</b>：$b_n=\frac{(-1)^n}{\sqrt n}$，$a_n=\frac{(-1)^n}{\sqrt n}-\frac1{2n}$（$n\ge1$）。</p><p><b>第 1 步：比值 $\to1$。</b></p>$$\frac{a_n}{b_n}=1-\frac{1/(2n)}{(-1)^n/\sqrt n}=1-\frac{(-1)^n\sqrt n}{2n}=1-\frac{(-1)^n}{2\sqrt n}\to1.$$<p><b>第 2 步：$\sum b_n$ 收敛。</b>$\frac1{\sqrt n}$ 单调递减趋于 0，由交错级数判别法收敛。</p><p><b>第 3 步：$\sum a_n$ 发散。</b>部分和</p>$$\sum_{n=1}^Na_n=\sum_{n=1}^Nb_n-\frac12\sum_{n=1}^N\frac1n,$$<p>前者有有限极限，后者 $\to+\infty$，所以 $\sum a_n$ 发散到 $-\infty$。</p><p><b>结论：这是所求反例。</b>它不违反比较判别法，因为比较判别法要求正项级数，而这里两列都变号。这也说明主线题中只保留一阶项 $\ln(1+t_n)\sim t_n$ 是不够的。</p>`}

"title":R`往年卷查漏：积分变换的前提与通法`,
"goal":R`补四件事：(1) 用对称换元“证明积分为 0”之前，必须先证积分收敛；(2) 经典积分 $\int_0^{\pi/2}\ln\sin x\,dx$；(3) 任何有理函数都能积出来的一般步骤；(4) 两类积分等式/不等式的证明。主线约 30 分钟，较长的证明放在延伸里。`,
"sections":[
{"id":R`x10-s1`,"h":R`1. 换元后“等于自己的相反数”≠ 积分为 0：先查收敛`,"html":R`<p>这节解决：看到 $I=\int_0^\infty f(x^{2024}+x^{-2024})\frac{\ln x}{1+x^2}dx$，令 $x=\frac1t$ 后得到 $I=-I$，能不能直接说 $I=0$？</p><p><b>不能直接说。</b>“$I=-I\Rightarrow I=0$”的前提是 $I$ 是一个有限的数。如果积分发散，$I$ 根本不是数，等式没有意义。</p><p>反例：$f(s)=s$。$x\to\infty$ 时被积函数约为 $\frac{x^{2024}\ln x}{x^2}=x^{2022}\ln x\to\infty$，积分发散。</p><p>正确步骤：</p><ol><li>先证明 $\int_0^\infty|\text{被积函数}|dx$ 有限（绝对收敛），这样换元才合法；</li><li>再做换元得 $I=-I$，从而 $I=0$。</li></ol><p>例如 $f$ 有界（$|f|\le M$）时，$|\text{被积函数}|\le M\frac{|\ln x|}{1+x^2}$，它在 $0$ 和 $\infty$ 两端都可积，所以前提成立。</p><p>易错：“对称截断 $\int_{1/R}^R$ 等于 0”也不够，反常积分要求两端<b>分别</b>收敛。</p>`},
{"id":R`x10-s2`,"h":R`2. 有理函数积分的一般步骤`,"html":R`<p>这节解决：任意 $\frac{P(x)}{Q(x)}$（多项式之比）怎么积分。</p><ol><li><b>长除法</b>：若分子次数 $\ge$ 分母次数，先除，得到“多项式 + 真分式”。</li><li><b>分解分母</b>：在实数范围内分成一次因子 $(x-a)^k$ 和不能再分的二次因子 $((x-p)^2+c)^k$（$c\gt0$）。</li><li><b>部分分式</b>：一次因子对应 $\frac{A}{(x-a)^j}$；二次因子对应 $\frac{Bx+D}{((x-p)^2+c)^j}$（分子是一次式）。</li><li><b>逐项积分</b>：<ul><li>$\int\frac{dx}{x-a}=\ln|x-a|$；$j\ge2$ 时 $\int\frac{dx}{(x-a)^j}=\frac{(x-a)^{1-j}}{1-j}$；</li><li>二次因子：令 $u=x-p$，分子拆成“分母的导数的倍数 + 常数”。导数部分积出 $\ln$ 或有理式；常数部分 $\int\frac{du}{(u^2+c)^j}$ 用降幂递推，最后到 $\frac1{\sqrt c}\arctan\frac u{\sqrt c}$。</li></ul></li></ol><p>例：$\frac{1}{x(x^2+1)}=\frac1x-\frac{x}{x^2+1}$，积分 $\ln|x|-\frac12\ln(x^2+1)+C$。</p>`},
{"id":R`x10-s3`,"h":R`3. 积分等式与不等式：上下限、方向照原样写`,"html":R`<p>这类题的常用工具：</p><ul><li><b>令 $F(u)=\int_0^uf$</b>，把“积分里套积分”变成 $F$ 的积分，再用换元、分部积分（例：$\int_0^1F(\sqrt x)dx$，令 $x=t^2$）。</li><li><b>平均值的单调性</b>：$f$ 递减时，$\frac{F(x)}x$（$f$ 在 $[0,x]$ 上的平均值）也递减，因为 $\left(\frac Fx\right)'=\frac{xf(x)-F(x)}{x^2}\le0$。</li><li><b>拼区间</b>：已知每个 $[x^2,x]$ 上的积分下界时，取 $x=\beta,\beta^2,\beta^4,\dots$，相邻区间首尾相接，可以拼成 $(0,\beta]$。</li></ul><p>写的时候注意：$\int_x^{x^2}$ 和 $\int_{x^2}^x$ 差一个负号；题目条件的方向一旦写反，结论可能完全不成立（见延伸题 e2 的辨正）。</p>`}
],

{"id":R`x10-c1`,"sec":R`x10-s1`,"q":R`倒数换元会使被积式变号，是否自动说明普通反常积分为0？`,"opts":[R`是`,R`否，先查两端收敛`,R`只要f连续就自动是`,R`对称截断为0就足够`],"a":1,"ex":R`选“否，先查两端收敛”。$I=-I$ 推出 $I=0$ 需要 $I$ 是有限数；若积分发散，这个推理无效（反例 $f(s)=s$）。容易误选“对称截断为 0 就足够”：$\int_{1/R}^R$ 为 0 只是主值意义，普通反常积分要求两端分别收敛。`},
{"id":R`x10-c2`,"sec":R`x10-s1`,"q":R`f(s)=s在本题中的作用是：`,"opts":[R`证明所有f都收敛`,R`给出仅连续不够的反例`,R`使积分恒0且绝对收敛`,R`可以删去定义域`],"a":1,"ex":R`选“给出仅连续不够的反例”：$f(s)=s$ 连续，但 $x\to\infty$ 时被积函数约为 $x^{2022}\ln x$，积分发散，说明只假设 $f$ 连续不能得出 $I=0$。容易误选“使积分恒 0 且绝对收敛”：恰恰相反，这个 $f$ 让积分发散。`},
{"id":R`x10-c3`,"sec":R`x10-s2`,"q":R`实不可约二次因子的分子应设：`,"opts":[R`只设常数`,R`次数小于2的一次式`,R`任意高次式`,R`不设分子`],"a":1,"ex":R`选“次数小于 2 的一次式” $Bx+D$。部分分式里分子的次数要比该因子低，二次因子就要配一次式，两个待定系数才够用。容易误选“只设常数”：比如 $\frac{x}{x^2+1}$ 就无法写成 $\frac{D}{x^2+1}$。`},
{"id":R`x10-c4`,"sec":R`x10-s3`,"q":R`记F=∫₀ˣf，若f连续递减，则F(x)/x：`,"opts":[R`递增`,R`递减或不增`,R`总常数`,R`无单调性`],"a":1,"ex":R`选“递减或不增”。$\left(\frac Fx\right)'=\frac{xf(x)-F(x)}{x^2}$，而 $f$ 递减时 $F(x)=\int_0^xf\ge\int_0^xf(x)dt=xf(x)$，所以导数 $\le0$。直观上：越往右平均进来的值越小，平均值下降。容易误选“递增”：把 $f$ 递减和平均值的变化方向弄反了。`}

"methods":[
{"id":R`m-x10-audit`,"title":R`积分技巧的前提与通法：做题清单`,"steps":[R`用对称性、换元得出“$I=-I$”或“$I=$ 某式”之前，先证明积分（绝对）收敛；瑕点和无穷远两端分别检查。`,R`有理函数：长除法 → 分解分母 → 部分分式（二次因子配一次式分子）→ 一次因子积成 $\ln$/幂，二次因子配方后拆成“导数项 + 常数项”，常数项降幂到 $\arctan$。`,R`积分恒等式：令 $F=\int_0^xf$，在有限区间 $[\varepsilon,1]$ 上换元、分部，写出边界项再令 $\varepsilon\to0$。易错：抄错上下限方向；在瑕点处直接代值。`]}
