        "html": "<p><b>这节解决什么：</b>以前的“向量”是 $\\mathbb R^n$ 里的一列数。可是多项式、矩阵也能相加、也能乘一个数，运算规律和列向量一模一样。线性空间就是把这些对象统一起来，以后讲基、维数、坐标时可以一次讲完。</p><p>本课对应教学日历第17讲“第五章 线性空间”，教材是《线性代数与几何（上）》第2版。后面几课是按日历提前预习，不代表课堂已经讲完。</p><p><b>定义要说清四样东西：</b></p><ol><li>一个集合 $V$（里面的元素叫“向量”）；</li><li>一个数域 $F$（能做加减乘除的一组数，本课一般是实数 $\\mathbb R$ 或复数 $\\mathbb C$）；</li><li>加法：两个向量相加还是 $V$ 里的向量；</li><li>数乘：$F$ 里的数乘一个向量还是 $V$ 里的向量。</li></ol><p>并且这两种运算要满足 8 条公理：加法交换、加法结合、有零向量、每个向量有负向量、$1\\cdot v=v$、$(ab)v=a(bv)$、$(a+b)v=av+bv$、$a(u+v)=au+av$。</p><p><b>常见例子（都用通常的加法和数乘）：</b></p><ul><li>$\\mathbb R^n$：零向量是 $(0,\\ldots,0)^T$。</li><li>$M_{m,n}(\\mathbb R)$：全体 $m\\times n$ 实矩阵，零向量是零矩阵。</li><li>$\\mathcal P_d$：次数不超过 $d$ 的实系数多项式，零向量是零多项式（每个系数都是 0）。例如 $\\mathcal P_2$ 里 $(1+t)+(2-3t+t^2)=3-2t+t^2$，$2\\cdot(1+t)=2+2t$。</li></ul><p><b>数域也要写：</b>同一个集合换数域，结果会变。例如复数集 $\\mathbb C$：看成 $\\mathbb R$ 上的空间，每个复数 $a+bi=a\\cdot1+b\\cdot i$，需要 $1,i$ 两个基向量，维数 2；看成 $\\mathbb C$ 上的空间，任一复数 $z=z\\cdot1$，只需 $1$ 一个，维数 1。</p>"

        "id": "sp1-s2",
        "h": "子空间判定的完整写法",
        "html": "<p><b>这节解决什么：</b>判断一个大空间里的子集本身是不是线性空间。直接验证 8 条公理太长，下面的判定定理把工作量缩成两步。</p><p><b>子空间：</b>$V$ 是数域 $F$ 上的线性空间，$W$ 是 $V$ 的非空子集。如果 $W$ 用 $V$ 原来的加法和数乘，自己也是线性空间，就叫 $W$ 是 $V$ 的子空间。</p><p><b>判定定理：</b>非空子集 $W$ 是子空间 $\\iff$ 对任意 $u,v\\in W$、任意 $a,b\\in F$，都有 $au+bv\\in W$（叫“对线性组合封闭”）。</p><p><b>为什么只要验这两件事：</b></p><ol><li>交换律、结合律、分配律这些等式在大空间 $V$ 里本来就成立，搬到 $W$ 里自然也成立。</li><li>真正可能出问题的是“算出来的结果跑出 $W$”。封闭性正好排除这一点。</li><li>零向量和负向量也会自动在 $W$ 里：取 $a=b=0$ 得 $0\\in W$；取 $a=-1,b=0$ 得 $-u\\in W$。</li></ol><p><b>考试写法（三行）：</b>① $0\\in W$，所以 $W$ 非空；② 任取 $u,v\\in W$，$a,b\\in F$，验证 $au+bv$ 满足 $W$ 的条件；③ 所以 $W$ 是子空间。</p><p><b>小例子：</b>$W=\\{(x,y)^T:x-2y=0\\}$。$0-2\\cdot0=0$，所以 $0\\in W$。若 $x_1-2y_1=0$、$x_2-2y_2=0$，则 $(ax_1+bx_2)-2(ay_1+by_2)=a\\cdot0+b\\cdot0=0$。所以 $W$ 是子空间。</p><p><b>常见判断：</b></p><ul><li>条件是“齐次线性方程”（右端是 0）：一般是子空间。</li><li>条件右端不是 0（如 $x+y=1$）：零向量代进去不满足，一句话否定。这种集合叫“仿射集合”，是子空间平移出去的结果。</li><li>“含零向量就是子空间”是错的。含零只说明非空，封闭性还要另外验证。</li></ul>"

        "html": "<p><b>这节解决什么：</b>两个子空间 $U,W$ 可以“合起来”（和）也可以“取公共部分”（交）。这里讲怎么具体算出它们的基。</p><p><b>定义：</b></p><ul><li><b>和</b>：$U+W=\\{u+w:u\\in U,\\ w\\in W\\}$，即“$U$ 中一个向量加 $W$ 中一个向量”能得到的全部向量。它是同时包含 $U$ 和 $W$ 的最小子空间。</li><li><b>交</b>：$U\\cap W$，同时属于 $U$ 和 $W$ 的向量。它也是子空间。</li></ul><p><b>求和的基：</b>若 $U=L(\\alpha_1,\\ldots,\\alpha_s)$，$W=L(\\beta_1,\\ldots,\\beta_t)$，则 $U+W=L(\\alpha_1,\\ldots,\\alpha_s,\\beta_1,\\ldots,\\beta_t)$。把这些向量排成矩阵的列，化成阶梯形，主元所在的列对应的原向量就是一组基（叫“极大无关组”）。</p><p><b>求交的基（分步）：</b></p><ol><li>设 $U$ 的基排成矩阵 $A$，$W$ 的基排成矩阵 $B$。</li><li>交中的向量 $v$ 既能写成 $v=A\\xi$，又能写成 $v=B\\eta$（$\\xi,\\eta$ 是系数列）。</li><li>解齐次方程组 $A\\xi=B\\eta$，即 $(A,\\,-B)\\begin{pmatrix}\\xi\\\\\\eta\\end{pmatrix}=0$。</li><li><b>易错：</b>解出来的 $(\\xi,\\eta)$ 只是系数，不是交里的向量。要再算 $v=A\\xi$ 才得到交的元素。</li></ol><p><b>小例子：</b>$\\mathbb R^3$ 中 $U=L(e_1,e_2)$（$xy$ 平面），$W=L(e_2,e_3)$（$yz$ 平面）。和：$e_1,e_2,e_2,e_3$ 去掉重复，基 $e_1,e_2,e_3$，$U+W=\\mathbb R^3$。交：$a e_1+b e_2=c e_2+d e_3$ 给 $a=d=0,\\ b=c$，所以 $U\\cap W=L(e_2)$（$y$ 轴）。</p><p><b>前提：</b>上面第 4 步要求 $A$、$B$ 的列各自是基（线性无关）。若给的是相关的生成组，算出的向量可能有零向量或彼此相关，要再去掉多余的。</p>"

        "html": "<p><b>这节解决什么：</b>和的维数不是简单相加，交的部分被算了两次，要扣掉一次。</p><p><b>维数公式：</b>$U,W$ 是有限维子空间，则 $$\\dim(U+W)=\\dim U+\\dim W-\\dim(U\\cap W).$$</p><p><b>数值例子：</b>上一节 $\\dim U=2$，$\\dim W=2$，$\\dim(U\\cap W)=1$，所以 $\\dim(U+W)=2+2-1=3$，与直接计算一致。</p><p><b>证明思路（分步）：</b></p><ol><li>取交的一组基 $\\gamma_1,\\ldots,\\gamma_k$（$k=\\dim(U\\cap W)$）。</li><li>把它扩充成 $U$ 的基 $\\gamma_1,\\ldots,\\gamma_k,\\alpha_1,\\ldots,\\alpha_p$，再扩充成 $W$ 的基 $\\gamma_1,\\ldots,\\gamma_k,\\beta_1,\\ldots,\\beta_q$。于是 $\\dim U=k+p$，$\\dim W=k+q$。</li><li>生成：$U+W$ 中每个向量是 $U$ 的元素加 $W$ 的元素，都能用 $\\gamma,\\alpha,\\beta$ 表示。</li><li>无关：设 $\\sum a_i\\gamma_i+\\sum b_i\\alpha_i+\\sum c_i\\beta_i=0$。移项得 $\\sum b_i\\alpha_i=-\\sum a_i\\gamma_i-\\sum c_i\\beta_i$。左边在 $U$ 中，右边在 $W$ 中，所以它在 $U\\cap W$ 中，可写成 $\\sum d_i\\gamma_i$。于是 $\\sum b_i\\alpha_i-\\sum d_i\\gamma_i=0$，由 $U$ 的基无关，所有 $b_i=0$。代回原式，只剩 $\\gamma,\\beta$，由 $W$ 的基无关，$a_i=c_i=0$。</li><li>所以 $\\gamma,\\alpha,\\beta$ 是 $U+W$ 的基，个数 $k+p+q=(k+p)+(k+q)-k$。</li></ol>"

        "html": "<p><b>这节解决什么：</b>解线性方程组 $Ax=b$ 的标准流程，以及怎样一眼看出无解。</p><p><b>记号：</b></p><ul><li><b>增广矩阵</b> $[A\\mid b]$：系数矩阵 $A$ 右边拼上常数列 $b$。</li><li><b>初等行变换</b>：交换两行；某行乘非零数；某行加上另一行的倍数。它们不改变方程组的解。</li><li><b>秩</b> $r(A)$：化成阶梯形后非零行的个数。</li><li><b>主元</b>：阶梯形每个非零行的第一个非零数；主元所在列的未知量叫主元变量，其余叫<b>自由变量</b>。</li></ul><p><b>判断规则：</b></p><ol><li>若出现一行 $[0\\ \\cdots\\ 0\\mid c]$ 且 $c\\ne0$，它表示 $0=c$，<b>无解</b>。此时 $r(A)\\lt r([A\\mid b])$。</li><li>没有这种行时 $r(A)=r([A\\mid b])$，<b>有解</b>，自由变量个数 $=n-r(A)$（$n$ 是未知量个数）。自由变量为 0 个时解唯一。</li></ol><p><b>小例子：</b>$x+y=2,\\ 2x+2y=5$。$[A\\mid b]=\\left(\\begin{array}{cc|c}1&1&2\\\\2&2&5\\end{array}\\right)\\xrightarrow{r_2-2r_1}\\left(\\begin{array}{cc|c}1&1&2\\\\0&0&1\\end{array}\\right)$，第二行是 $0=1$，无解。</p><p><b>注意：</b>只能做<b>行</b>变换。交换两列相当于交换两个未知量的位置，若要用，必须记下来，否则答案的顺序会错。</p>"

        "id": "ma1-s1",
        "h": "1. 矩阵乘法先查尺寸，再查顺序",
        "html": "<p><b>这节解决什么：</b>矩阵乘法和数的乘法有三个关键不同，做题时最常在这里丢分。</p><p><b>1. 尺寸：</b>$A$ 是 $m\\times n$、$B$ 是 $n\\times s$ 时才能算 $AB$（$A$ 的列数 = $B$ 的行数），结果是 $m\\times s$。</p><p><b>2. 顺序：</b>一般 $AB\\ne BA$。例：$A=\\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}$，$B=\\begin{pmatrix}0&0\\\\1&0\\end{pmatrix}$，$AB=\\begin{pmatrix}1&0\\\\0&0\\end{pmatrix}$，$BA=\\begin{pmatrix}0&0\\\\0&1\\end{pmatrix}$。转置要反序：$(AB)^T=B^TA^T$。</p><p><b>3. 零因子：</b>$AB=0$ 推不出 $A=0$ 或 $B=0$。例：$A=\\begin{pmatrix}0&1\\\\0&0\\end{pmatrix}$，$A^2=0$ 但 $A\\ne0$。</p><p><b>逆矩阵：</b>方阵 $A$ 若有 $C$ 使 $AC=CA=I$，称 $A$ 可逆，$C=A^{-1}$。对同阶方阵，只要验证一边 $AC=I$，另一边自动成立。</p><p><b>非方阵不行：</b>$A=(1\\ \\ 0)$（$1\\times2$），$B=\\begin{pmatrix}1\\\\0\\end{pmatrix}$（$2\\times1$）。$AB=(1)$ 是 1 阶单位阵，但 $BA=\\begin{pmatrix}1&0\\\\0&0\\end{pmatrix}$ 不是 2 阶单位阵。</p>"
      },
      {
        "id": "ma1-s2",
        "h": "2. 求逆：用题目给的多项式关系",
        "html": "<p><b>这节解决什么：</b>题目给出 $A$ 满足某个多项式等式（如 $A^2+3A+3I=0$），要求某个矩阵的逆。办法是凑出“某矩阵 × 另一矩阵 = $I$”。</p><p><b>步骤：</b></p><ol><li>要求 $(A-cI)^{-1}$，就把已知等式改写成 $(A-cI)\\,q(A)=dI$ 的形式（$q$ 是多项式，$d$ 是非零数）。常用做法：拿 $(A-cI)$ 去乘一个一次式 $(A+kI)$，展开后与已知等式比较。</li><li>两边除以 $d$：$(A-cI)\\cdot\\frac{q(A)}d=I$，所以 $(A-cI)^{-1}=\\frac{q(A)}d$。</li><li>$A$ 的多项式彼此可以交换顺序（都只含 $A$ 和 $I$），所以另一边乘积也是 $I$。</li></ol><p><b>小例子：</b>$A^2=2I$，求 $A^{-1}$：$A\\cdot\\frac12A=\\frac12A^2=I$，所以 $A^{-1}=\\frac12A$。</p><p><b>具体数字矩阵：</b>写 $[A\\mid I]$，只做行变换化成 $[I\\mid A^{-1}]$；两块要同时做同样的变换。</p><p><b>乘积的逆：</b>若 $A$、$B$ 是同阶可逆方阵，$(AB)^{-1}=B^{-1}A^{-1}$（顺序反过来）。验证：$(AB)(B^{-1}A^{-1})=A(BB^{-1})A^{-1}=AA^{-1}=I$。</p>"
      },
      {
        "id": "ma1-s3",
        "h": "3. 伴随与分块：结论附带条件",
        "html": "<p><b>这节解决什么：</b>伴随矩阵和分块矩阵的两个常考结论，都有使用条件。</p><p><b>伴随矩阵：</b>$A^*$ 的 $(i,j)$ 元是 $a_{ji}$ 的代数余子式 $A_{ji}$（注意下标对调）。基本等式 $$AA^*=A^*A=(\\det A)I.$$这里的星号是<b>伴随矩阵</b>，不是共轭转置。</p><p><b>小例子：</b>$A=\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}$，$A^*=\\begin{pmatrix}d&-b\\\\-c&a\\end{pmatrix}$，$AA^*=(ad-bc)I$。</p><p><b>伴随的秩（$n\\ge2$）：</b></p><ul><li>$r(A)=n$：$r(A^*)=n$；</li><li>$r(A)=n-1$：$r(A^*)=1$；</li><li>$r(A)\\le n-2$：$r(A^*)=0$（$A^*=0$）。</li></ul><p><b>Schur 补：</b>分块矩阵 $M=\\begin{pmatrix}B&C\\\\D&E\\end{pmatrix}$，若 $B$ 是可逆方阵，则 $$r(M)=r(B)+r(E-DB^{-1}C).$$$E-DB^{-1}C$ 叫 $B$ 的 Schur 补。它来自分块消元：用第一块行消去 $D$，再用第一块列消去 $C$（见延伸题）。</p><p><b>注意：</b>先检查块的尺寸能相乘、$B$ 可逆；分块乘法和普通矩阵乘法一样不能交换顺序，$DB^{-1}C$ 的顺序不能写成 $B^{-1}DC$。</p><p>知识依据：本课《第2章总结》第 1–3 页、《第4章总结》第 3 页。</p>"
      }
    ],

        "html": "<p><b>这节解决什么：</b>行列式的定义到底在加什么。考试常问“某一项在不在展开式里、前面是正号还是负号”。</p><p><b>定义：</b>$n$ 阶行列式是 $n!$ 项的和，每一项是从<b>每行取一个、每列取一个</b>元素相乘，再配一个正负号：$$\\det A=\\sum_{\\sigma}\\operatorname{sgn}(\\sigma)\\,a_{1\\sigma(1)}a_{2\\sigma(2)}\\cdots a_{n\\sigma(n)}.$$这里 $(\\sigma(1),\\ldots,\\sigma(n))$ 是列号组成的排列。</p><p><b>符号怎么定：</b></p><ol><li>把乘积里的因子按<b>行号</b>从小到大重新排（乘法可交换，不影响值）。</li><li>读出列号排列，数它的<b>逆序数</b>：前面的数比后面的数大，算一个逆序。</li><li>逆序数为偶数，符号 $+$；为奇数，符号 $-$。</li></ol><p><b>例：</b>$a_{21}a_{13}a_{32}a_{44}$ 按行号排成 $a_{13}a_{21}a_{32}a_{44}$，列号 $(3,1,2,4)$。逆序：$(3,1)$、$(3,2)$，共 2 个，偶数，符号 $+$。</p><p><b>不在展开式中的情况：</b>若列号有重复（某列取了两次），这个乘积根本不是展开式的一项。</p><p><b>特例：</b>对角矩阵、上（下）三角矩阵的行列式 = 对角元之积，因为其他项都含有 0。</p>"

        "id": "de1-s2",
        "h": "三种变换，三种账",
        "html": "<p><b>这节解决什么：</b>直接按定义展开要算 $n!$ 项（4 阶就是 24 项），太慢。用行变换先造出很多零，再展开或化成三角形。</p><p><b>三种行变换对行列式的影响：</b></p><ul><li><b>交换两行</b>：行列式变号（乘 $-1$）。</li><li><b>某一行乘数 $c$</b>：行列式乘 $c$。</li><li><b>把某行的 $c$ 倍加到另一行</b>：行列式<b>不变</b>。</li></ul><p>对列做同样的变换，效果完全一样（因为 $\\det A^T=\\det A$）。</p><p><b>小例子：</b>$\\begin{vmatrix}2&4\\\\1&3\\end{vmatrix}=6-4=2$。第一行提出 2：$2\\begin{vmatrix}1&2\\\\1&3\\end{vmatrix}=2\\cdot1=2$ ✓；第二行减第一行的 $\\frac12$：$\\begin{vmatrix}2&4\\\\0&1\\end{vmatrix}=2$ ✓（不变）。</p><p><b>常见错误：</b></p><ul><li>$\\det(cA)=c^n\\det A$，不是 $c\\det A$（每一行都乘了 $c$，共 $n$ 行）。</li><li>一般 $\\det(A+B)\\ne\\det A+\\det B$。行列式只能<b>对某一行</b>拆成两项之和（其他行保持不变）。</li></ul>"

        "id": "de1-s3",
        "h": "余子式先删，再加棋盘符号",
        "html": "<p><b>这节解决什么：</b>按一行（或一列）展开，把 $n$ 阶行列式化成若干 $n-1$ 阶行列式。</p><p><b>定义：</b></p><ul><li><b>余子式</b> $M_{ij}$：在原矩阵中删去第 $i$ 行、第 $j$ 列，剩下的 $n-1$ 阶行列式。</li><li><b>代数余子式</b> $A_{ij}=(-1)^{i+j}M_{ij}$（本页也记作 $C_{ij}$）。符号按棋盘排列：左上角 $+$，相邻位置交替变号。</li></ul><p><b>按第 $i$ 行展开：</b>$$\\det A=a_{i1}C_{i1}+a_{i2}C_{i2}+\\cdots+a_{in}C_{in}.$$选零最多的那一行（列）展开最省事。</p><p><b>小例子：</b>$\\begin{vmatrix}1&2&0\\\\3&4&0\\\\5&6&7\\end{vmatrix}$ 按第 3 列展开，只有 $a_{33}=7$ 非零：$7\\cdot(-1)^{3+3}\\begin{vmatrix}1&2\\\\3&4\\end{vmatrix}=7\\cdot(-2)=-14$。</p><p><b>“异行展开”为零：</b>用第 $j$ 行的元素配第 $i$ 行的代数余子式（$i\\ne j$）：$$\\sum_k a_{jk}C_{ik}=0.$$理由：这相当于把第 $i$ 行换成第 $j$ 行后再按第 $i$ 行展开，而那个新矩阵有两行相同，行列式为 0。合起来写成 $\\sum_ka_{jk}C_{ik}=\\delta_{ij}\\det A$（$\\delta_{ij}$：$i=j$ 时为 1，否则为 0）。</p><p><b>伴随矩阵：</b>$\\operatorname{adj}(A)$（也写 $A^*$）的第 $(j,i)$ 位置放 $C_{ij}$，即代数余子式矩阵的<b>转置</b>。</p>"

        "html": "<p><b>这节解决什么：</b>用坐标算长度、夹角，判断垂直，以及求一个向量在某方向上的投影。</p><p><b>点积（直角坐标系中）：</b>$u\\cdot v=u_1v_1+u_2v_2+u_3v_3$。长度 $\\|u\\|=\\sqrt{u\\cdot u}$。</p><p><b>夹角：</b>非零向量 $u,v$ 的夹角 $\\theta\\in[0,\\pi]$ 满足 $\\cos\\theta=\\dfrac{u\\cdot v}{\\|u\\|\\|v\\|}$。所以 $u\\perp v\\iff u\\cdot v=0$。</p><p><b>小例子：</b>$u=(1,0,1)$，$v=(1,1,0)$：$u\\cdot v=1$，$\\|u\\|=\\|v\\|=\\sqrt2$，$\\cos\\theta=\\frac12$，$\\theta=\\frac\\pi3$。</p><p><b>三种“投影”，别混：</b>（$n$ 是非零方向向量）</p><ul><li><b>有向投影（一个数，可正可负）</b>：$\\dfrac{u\\cdot n}{\\|n\\|}$；</li><li><b>投影长度（非负）</b>：$\\dfrac{|u\\cdot n|}{\\|n\\|}$；</li><li><b>投影向量</b>：$\\dfrac{u\\cdot n}{n\\cdot n}\\,n$。</li></ul><p>例：$u=(3,4,0)$ 在 $n=(0,-2,0)$ 方向：有向投影 $\\frac{-8}{2}=-4$，长度 4，投影向量 $\\frac{-8}{4}(0,-2,0)=(0,4,0)$。</p>"

        "html": "<p><b>这节解决什么：</b>求同时垂直于两个向量的方向（法向量），以及平行四边形、三角形的面积。</p><p><b>叉积（右手直角坐标系）：</b>$$u\\times v=(u_2v_3-u_3v_2,\\ u_3v_1-u_1v_3,\\ u_1v_2-u_2v_1).$$记法：写成行列式 $\\begin{vmatrix}i&j&k\\\\u_1&u_2&u_3\\\\v_1&v_2&v_3\\end{vmatrix}$ 按第一行展开。</p><p><b>性质：</b></p><ul><li>$u\\times v$ 同时垂直于 $u$ 和 $v$；</li><li>$v\\times u=-(u\\times v)$（交换顺序变号）；</li><li>$\\|u\\times v\\|=\\|u\\|\\|v\\|\\sin\\theta$，等于以 $u,v$ 为邻边的平行四边形面积；三角形面积再除以 2；</li><li>非零 $u,v$ 平行 $\\iff u\\times v=0$。（判断平行用叉积，判断垂直用点积，不要搞反。）</li></ul><p><b>小例子：</b>$u=(1,0,0)$，$v=(0,2,0)$：$u\\times v=(0\\cdot0-0\\cdot2,\\ 0\\cdot0-1\\cdot0,\\ 1\\cdot2-0\\cdot0)=(0,0,2)$，面积 2（正是 $1\\times2$ 的矩形）。</p><p><b>自检公式：</b>$\\|u\\times v\\|^2=\\|u\\|^2\\|v\\|^2-(u\\cdot v)^2$。</p>"

        "html": "<p><b>这节解决什么：</b>判断直线和平面、两条直线之间的位置关系。</p><p><b>两种写法：</b></p><ul><li>直线：$X=P+td$，$P$ 是直线上一点，$d\\ne0$ 是方向向量，$t$ 是实数参数。对称式 $\\frac{x-x_0}{d_1}=\\frac{y-y_0}{d_2}=\\frac{z-z_0}{d_3}$ 就是它的另一种写法。</li><li>平面：$n\\cdot X=c$，即 $n_1x+n_2y+n_3z=c$，$n\\ne0$ 是法向量（垂直于平面）。</li></ul><p><b>直线与平面：</b>把 $X=P+td$ 代入 $n\\cdot X=c$：$$t\\,(n\\cdot d)=c-n\\cdot P.$$</p><ul><li>$n\\cdot d\\ne0$：$t$ 唯一，<b>交于一点</b>；</li><li>$n\\cdot d=0$ 且 $c-n\\cdot P\\ne0$：无解，<b>平行不相交</b>；</li><li>$n\\cdot d=0$ 且 $c-n\\cdot P=0$：任意 $t$ 都成立，<b>直线在平面内</b>。</li></ul><p><b>小例子：</b>直线 $(t,0,1)$，平面 $z=1$：$n=(0,0,1)$，$d=(1,0,0)$，$n\\cdot d=0$；点 $(0,0,1)$ 满足 $z=1$，所以直线在平面内。</p><p><b>两条直线</b>（$X=P_1+td_1$，$X=P_2+sd_2$）：</p><ol><li>若 $d_1\\times d_2=0$（方向平行）：再看 $P_2-P_1$ 是否也平行于 $d_1$，是则重合，否则平行。</li><li>若 $d_1\\times d_2\\ne0$：算混合积 $[P_2-P_1,d_1,d_2]$。为 0 则共面，<b>相交</b>；不为 0 则<b>异面</b>。</li></ol><p>方向不平行不等于相交，空间里还可能异面。</p>"

        "html": "<p><b>这节解决什么：</b>线性映射可能作用在多项式、矩阵等抽象对象上。选好基以后，它就能用一个矩阵表示，计算就变成矩阵乘法。</p><p>后续预习：教学日历第22–23讲。知识依据：《第六章总结》第 1 页“一、线性变换的核与值域”。主线约30分钟：讲解 8 分钟、概念 4 分钟、两题 18 分钟。</p><p><b>线性映射：</b>$T:V\\to W$ 满足 $T(au+bv)=aT(u)+bT(v)$。</p><p><b>表示矩阵：</b>$V$ 的基 $\\mathcal B=(v_1,\\ldots,v_n)$，$W$ 的基 $\\mathcal C=(w_1,\\ldots,w_m)$。</p><ol><li>把每个基向量 $v_j$ 的像 $T(v_j)$ 用 $\\mathcal C$ 表示，得到坐标列 $[T(v_j)]_{\\mathcal C}$。</li><li>这些列依次排成矩阵 $A$（$m\\times n$，第 $j$ 列来自 $v_j$）。</li><li>于是对任意 $v$：$[T(v)]_{\\mathcal C}=A\\,[v]_{\\mathcal B}$。</li></ol><p><b>小例子：</b>$T:\\mathbb R^2\\to\\mathbb R^2$，$T(x,y)=(x+y,\\ 2y)$，标准基。$T(1,0)=(1,0)$，$T(0,1)=(1,2)$，所以 $A=\\begin{pmatrix}1&1\\\\0&2\\end{pmatrix}$。检验：$A(3,1)^T=(4,2)^T=T(3,1)$ ✓。</p><p>矩阵里的数是坐标，不一定就是原空间里的向量（例如多项式空间里，坐标 $(0,1,0)^T$ 代表多项式 $t$）。</p>"

        "html": "<p><b>这节解决什么：</b>一个线性映射“压扁”了哪些向量（核），“能到达”哪些向量（像）。</p><p><b>定义：</b></p><ul><li>核 $\\ker T=\\{v\\in V:T(v)=0\\}$（被映成零的向量）；</li><li>像 $\\operatorname{Im}T=\\{T(v):v\\in V\\}$（所有能得到的结果）。</li></ul><p>两者都是子空间。</p><p><b>用矩阵 $A$ 计算：</b></p><ul><li>核：解齐次方程 $Ax=0$，把解（坐标）翻译回 $V$ 中的向量。</li><li>像：把 $A$ 化成阶梯形找主元列，取<b>原矩阵 $A$</b> 中对应的列，再翻译回 $W$ 中的向量。（行变换会改变列向量本身，所以不能取化简后的列。）</li></ul><p><b>秩–零度公式：</b>$\\dim V=n$，$r(A)=r$，则 $$\\dim\\ker T=n-r,\\qquad\\dim\\operatorname{Im}T=r,\\qquad\\dim\\ker T+\\dim\\operatorname{Im}T=n.$$（证明思路：取核的基，扩充成 $V$ 的基，新加的那些基向量的像恰好是像空间的基。）</p><p><b>单射、满射：</b>单射 $\\iff\\ker T=\\{0\\}$；满射 $\\iff r=\\dim W$。只有 $\\dim V=\\dim W$ 时单射和满射才等价。</p><p><b>小例子：</b>上一节的 $A=\\begin{pmatrix}1&1\\\\0&2\\end{pmatrix}$ 秩 2，核只有零，像是整个 $\\mathbb R^2$，$0+2=2$ ✓。</p>"

        "html": "<p><b>这节解决什么：</b>找那些被矩阵 $A$ 作用后方向不变、只被拉伸的向量。用它们做基，矩阵会变成最简单的对角形。</p><p>后续预习：教学日历第24–25讲，依据《第六章总结》第 2–4 页。主线30分钟：讲解 8 分钟、概念 4 分钟、两题 18 分钟。</p><p><b>定义：</b>$A$ 是 $n$ 阶方阵（数域 $F=\\mathbb R$ 或 $\\mathbb C$）。若 $Av=\\lambda v$ 且 $v\\ne0$，称 $\\lambda$ 为<b>特征值</b>，$v$ 为属于 $\\lambda$ 的<b>特征向量</b>。</p><p><b>求法（两步）：</b></p><ol><li>解特征方程 $\\det(\\lambda I-A)=0$（左边叫特征多项式 $\\chi_A(\\lambda)$），得全部特征值。</li><li>对每个 $\\lambda$，解齐次方程 $(A-\\lambda I)v=0$。解空间 $E_\\lambda=\\ker(A-\\lambda I)$ 叫<b>特征空间</b>，其中的非零向量就是特征向量。</li></ol><p><b>小例子：</b>$A=\\begin{pmatrix}2&0\\\\0&5\\end{pmatrix}$：$\\det(\\lambda I-A)=(\\lambda-2)(\\lambda-5)$，特征值 2、5；$E_2=L(e_1)$，$E_5=L(e_2)$。</p><p><b>注意：</b>零向量满足 $A0=\\lambda0$，但不叫特征向量；特征值可以是 0（$0$ 是特征值 $\\iff A$ 不可逆）。</p>"

        "h": "矩阵和变量替换：交叉项要除以2",
        "html": "<p><b>这节解决什么：</b>像 $2x^2+4xy+3y^2$ 这样的二次多项式叫二次型。把它写成矩阵，就能用矩阵工具研究它的正负、化简它。</p><p>后续预习：教学日历第27–28讲，依据《第七章总结》第 1–3 页。主线30分钟：讲解 8 分钟、概念 4 分钟、两题 18 分钟。</p><p><b>矩阵写法：</b>实二次型 $q(x)=x^TAx$，$A$ 取实对称矩阵。</p><ul><li>$x_i^2$ 的系数 = $a_{ii}$；</li><li>$x_ix_j$（$i\\ne j$）的系数 = $a_{ij}+a_{ji}=2a_{ij}$，所以 $a_{ij}=$ 交叉项系数 $\\div2$。</li></ul><p><b>例：</b>$x^2+6xy+2y^2$ 的矩阵是 $\\begin{pmatrix}1&3\\\\3&2\\end{pmatrix}$。检验：$(x,y)\\begin{pmatrix}1&3\\\\3&2\\end{pmatrix}\\begin{pmatrix}x\\\\y\\end{pmatrix}=x^2+3xy+3xy+2y^2$ ✓。</p><p><b>换变量：</b>做可逆线性替换 $x=Py$（$P$ 可逆），代入：$$q=(Py)^TA(Py)=y^T(P^TAP)y.$$新矩阵 $P^TAP$ 与 $A$ 称为<b>合同</b>（课程总结写作“相合”）。</p><p><b>合同 ≠ 相似：</b>相似是 $P^{-1}AP$。只有 $P$ 是正交矩阵（$P^T=P^{-1}$）时两者一致。一般的合同变换会改变特征值、迹、行列式的值，但保持秩和正、负惯性指数（见第 3 节）。</p>"

        "html": "<p><b>这节解决什么：</b>用配方把二次型化成只有平方项的“标准形”。</p><p><b>情况 1：有平方项。</b>像中学配方一样，把含某个变量的项凑成完全平方。</p><p>例：$x^2+4xy+5y^2=(x+2y)^2+y^2$。令 $u=x+2y$，$v=y$，得 $u^2+v^2$。反解 $y=v$，$x=u-2v$，即 $\\begin{pmatrix}x\\\\y\\end{pmatrix}=\\begin{pmatrix}1&-2\\\\0&1\\end{pmatrix}\\begin{pmatrix}u\\\\v\\end{pmatrix}$，$\\det=1\\ne0$，替换可逆 ✓。</p><p><b>情况 2：只有交叉项</b>（如 $2xy$）。用和差替换 $x=\\frac{u+v}2$，$y=\\frac{u-v}2$（即 $u=x+y$，$v=x-y$）：$$2xy=2\\cdot\\frac{(u+v)(u-v)}4=\\frac{u^2-v^2}2.$$</p><p><b>必须检查：</b></p><ul><li>新旧变量的关系写成 $x=Py$，$P$ 可逆（行列式不为 0）。</li><li>不能把同一个线性式当成两个不同的新变量（那样替换不可逆）。</li></ul><p><b>标准形：</b>$d_1y_1^2+\\cdots+d_ny_n^2$。系数 $d_i$ 一般不是 $A$ 的特征值；只有用正交替换得到的标准形，系数才是特征值。算完可用 $P^TAP$ 是否等于 $\\operatorname{diag}(d_1,\\ldots,d_n)$ 来核对。</p>"

        "html": "<p><b>这节解决什么：</b>同一个二次型可以化成很多种标准形，但正项、负项、零项的个数不变。</p><p><b>惯性定律（实数域）：</b>标准形中正系数个数 $p$、负系数个数 $q$、零系数个数 $z$ 与选用哪个可逆替换无关。$p$ 叫正惯性指数，$q$ 叫负惯性指数，秩 $=p+q$。</p><p><b>规范形：</b>把每个非零项缩放 $u_i=\\sqrt{|d_i|}\\,y_i$，系数变成 $\\pm1$：$$u_1^2+\\cdots+u_p^2-u_{p+1}^2-\\cdots-u_{p+q}^2\\ (\\text{另有}\\ z\\ \\text{个零项}).$$</p><p><b>例：</b>$2u^2+v^2-w^2$：$p=2,q=1,z=0$，秩 3；令 $U=\\sqrt2u$ 得规范形 $U^2+v^2-w^2$。</p><p><b>判定：</b>两个实对称矩阵合同 $\\iff$ 惯性 $(p,q,z)$ 相同。</p><p><b>注意：</b></p><ul><li>零项不是“把变量删掉”，变量个数不变，只是那些方向上二次型取 0。</li><li>使 $q(x)=0$ 的向量不一定在 $A$ 的核里：$q=x^2-y^2$ 在 $(1,1)$ 处为 0，但 $A(1,1)^T=(1,-1)^T\\ne0$。</li><li>以上都在实数域。复数域中 $-y^2=(iy)^2$，只按秩分类，惯性没有意义。</li></ul>"

Object.assign(LESSONS, {"sy3":{"unit":"systems","n":3,"title":"Cramer 法则｜换的是列；分母为零时改用秩判断","goal":"对应教学日历第4讲。学完能做到：用 Cramer 法则写出唯一解（含 2、3 阶的完整计算）；知道公式为什么成立；系数行列式为零时，不再套公式，改用秩判断有无解。","sections":[{"id":"sy3-s1","h":"用列向量证明法则","html":"<p><b>这节解决什么：<\/b>方程个数等于未知量个数、系数行列式不为零时，Cramer 法则直接用行列式写出每个未知量，不用消元。<\/p><p><b>记号：<\/b>$A=[a_1,\\ldots,a_n]$ 是 $n$ 阶方阵，$a_j$ 是它的第 $j$ 列。$A_i(b)$ 表示把 $A$ 的<b>第 $i$ 列<\/b>换成右端列 $b$ 得到的矩阵。<\/p><p><b>Cramer 法则：<\/b>若 $\\det A\\ne0$，则 $Ax=b$ 有唯一解，且 $$x_i=\\frac{\\det A_i(b)}{\\det A},\\quad i=1,\\ldots,n.$$<\/p><p><b>为什么成立（分步）：<\/b><\/p><ol><li>$Ax=b$ 就是 $b=x_1a_1+x_2a_2+\\cdots+x_na_n$。<\/li><li>把它放进第 $i$ 列：$\\det A_i(b)=\\det[a_1,\\ldots,\\underbrace{\\textstyle\\sum_jx_ja_j}_{\\text{第}i\\text{列}},\\ldots,a_n]$。<\/li><li>行列式对某一列是线性的，可以拆成 $\\sum_jx_j\\det[a_1,\\ldots,a_j,\\ldots,a_n]$（第 $i$ 列位置放 $a_j$）。<\/li><li>当 $j\\ne i$ 时，矩阵里 $a_j$ 出现两次（原来的第 $j$ 列和第 $i$ 列），两列相同的行列式为 0。<\/li><li>只剩 $j=i$ 那一项：$\\det A_i(b)=x_i\\det A$，除以 $\\det A$ 即得公式。<\/li><\/ol><p><b>小例子：<\/b>$x+y=3,\\ x-y=1$。$\\det A=\\begin{vmatrix}1&1\\\\1&-1\\end{vmatrix}=-2$；$\\det A_1(b)=\\begin{vmatrix}3&1\\\\1&-1\\end{vmatrix}=-4$，$\\det A_2(b)=\\begin{vmatrix}1&3\\\\1&1\\end{vmatrix}=-2$。所以 $x=2,\\ y=1$。<\/p><p><b>什么时候用：<\/b>2、3 阶，或只要求某一个未知量时方便；阶数大时消元法计算量小得多。<\/p>"},{"id":"sy3-s2","h":"分母为零时，先停止用公式","html":"<p><b>这节解决什么：<\/b>含参数的题里，分母 $\\det A$ 可能在某些参数值等于 0，这时公式失效，必须换方法。<\/p><p><b>$\\det A=0$ 说明什么：<\/b>只说明“没有唯一解”，可能无解，也可能有无穷多解。<\/p><p><b>正确做法：<\/b>把这个参数值代回，写增广矩阵 $[A\\mid b]$（系数矩阵右边拼上常数列），做行变换，比较秩（$r(\\cdot)$ 表示秩，即阶梯形中非零行的个数）：<\/p><ul><li>$r(A)\\lt r([A\\mid b])$：出现 “$0=$ 非零数” 的矛盾行，<b>无解<\/b>；<\/li><li>$r(A)=r([A\\mid b])\\lt n$（$n$ 为未知量个数）：<b>无穷多解<\/b>，有 $n-r(A)$ 个自由参数。<\/li><\/ul><p><b>小例子：<\/b>$x+y=1,\\ 2x+2y=c$。$\\det A=0$。行变换得第二行 $0=c-2$。$c\\ne2$ 时无解；$c=2$ 时只剩一个方程，通解 $(1-s,s)$。<\/p><p><b>常见误区：<\/b>“分母为零、各分子也都为零，就有无穷多解”是错的。例如 $A$ 取 $2\\times2$ 零矩阵、$b=(1,0)^T$：$\\det A$ 和两个换列行列式都等于 0（换列后仍有一整列为 0），但第一个方程是 $0=1$，无解。<\/p>"}],"widget":null,"concepts":[{"id":"sy3-c1","sec":"sy3-s1","q":"Cramer 分子用什么矩阵？","opts":["用常数列替换对应未知量的行","用常数列替换对应未知量的列","加一个新列变成长方阵","删掉对应未知量的列"],"a":1,"ex":"选“用常数列替换对应未知量的列”。$x_i$ 是第 $i$ 列 $a_i$ 的系数，所以要换的是第 $i$ <b>列</b>。最容易误选“替换行”：行对应的是方程，不是未知量，换行后推导中“重复列为零”的论证就不成立了。"},{"id":"sy3-c2","sec":"sy3-s1","q":"展开 $\\det A_i(b)$ 时为何只有 $x_i$ 项留下？","opts":["其他系数一定为零","剩余项出现重复行","剩余项出现重复列","因为 b 是单位向量"],"a":2,"ex":"选“剩余项出现重复列”。把 $b=\\sum x_ja_j$ 放进第 $i$ 列再按列线性拆开，$j\\ne i$ 的那一项中 $a_j$ 既在第 $j$ 列又在第 $i$ 列，两列相同，行列式为 0。误选“其他系数一定为零”：$x_j$ 一般不为零，是它所乘的行列式为零。误选“重复行”：我们改的是列。"},{"id":"sy3-c3","sec":"sy3-s2","q":"$\\det A=0$ 时的一般判断是什么？","opts":["一定无解","一定有无穷多解","比较系数秩和增广秩","只要所有分子为零就相容"],"a":2,"ex":"选“比较系数秩和增广秩”。$\\det A=0$ 时可能无解也可能有无穷多解，要代回原方程组，算 $r(A)$ 与 $r([A\\mid b])$。误选“只要所有分子为零就相容”：零矩阵配 $b=(1,0)^T$ 时所有分子都是 0，却无解。"},{"id":"sy3-c4","sec":"sy3-s2","q":"系数矩阵是 2×3，适合直接套 Cramer 吗？","opts":["可以，对每行压缩","可以，先除以第一个主元","要先用消元等方法处理整个系统","只要右端非零就可以"],"a":2,"ex":"选“要先用消元等方法处理整个系统”。Cramer 法则要求系数矩阵是方阵（才有行列式）且行列式非零。$2\\times3$ 没有行列式，不能直接套用。其余选项都是在硬造一个方阵，没有依据。"}],"methods":[{"id":"m-sy3","title":"先算分母，换列之后代回","steps":["把方程按固定的未知量顺序写成 Ax=b，确认 A 是方阵。","先算分母 det A。对每个要求的 xᵢ，把第 i 列换成 b 算 det Aᵢ(b)，xᵢ = det Aᵢ(b) / det A。易错：换成了行，或换错位置。","含参数时，把使 det A=0 的参数值单独代回增广矩阵，比较秩判断无解或无穷多解；最后把解代回原方程验证。"]}],"problems":[{"id":"sy3-p1","lv":"练习","src":"自编同类练习","stmt":"<p>用 Cramer 法则解 $2x+y=5,\\ x+3y=5$，并代回验证。<\/p>","hints":["写 $A=\\begin{pmatrix}2&1\\\\1&3\\end{pmatrix}$，$b=(5,5)^T$，第 1 列对应 $x$，第 2 列对应 $y$。","$\\det A=2\\cdot3-1\\cdot1=5$。","$\\det A_1(b)=\\begin{vmatrix}5&1\\\\5&3\\end{vmatrix}$，$\\det A_2(b)=\\begin{vmatrix}2&5\\\\1&5\\end{vmatrix}$，分别除以 5。"],"method":"m-sy3","sol":"<p><b>写成矩阵：<\/b>$A=\\begin{pmatrix}2&1\\\\1&3\\end{pmatrix}$，$b=\\begin{pmatrix}5\\\\5\\end{pmatrix}$。<\/p><p><b>1. 分母：<\/b>$\\det A=2\\cdot3-1\\cdot1=5\\ne0$，所以有唯一解，可用 Cramer 法则。<\/p><p><b>2. 分子：<\/b><\/p><ul><li>第 1 列换成 $b$：$\\det A_1(b)=\\begin{vmatrix}5&1\\\\5&3\\end{vmatrix}=15-5=10$；<\/li><li>第 2 列换成 $b$：$\\det A_2(b)=\\begin{vmatrix}2&5\\\\1&5\\end{vmatrix}=10-5=5$。<\/li><\/ul><p><b>3. 解：<\/b>$x=\\frac{10}5=2$，$y=\\frac55=1$。<\/p><p><b>4. 验证：<\/b>$2\\cdot2+1=5$，$2+3\\cdot1=5$。<\/p><p><b>结论：$(x,y)=(2,1)$。<\/b><\/p>"},{"id":"sy3-p2","lv":"练习","src":"自编同类练习","stmt":"<p>讨论 $x+y=2,\\ 2x+ty=b$ 的解。分别处理 $t=2$ 与 $t\\ne2$。<\/p>","hints":["系数矩阵 $\\begin{pmatrix}1&1\\\\2&t\\end{pmatrix}$，行列式 $t-2$。分 $t\\ne2$（可用 Cramer）和 $t=2$（不能用）两种情况。","$t\\ne2$：$\\det A_1(b)=\\begin{vmatrix}2&1\\\\b&t\\end{vmatrix}=2t-b$，$\\det A_2(b)=\\begin{vmatrix}1&2\\\\2&b\\end{vmatrix}=b-4$。","$t=2$：第二个方程减去第一个方程的 2 倍，得 $0=b-4$。看 $b$ 是否等于 4。"],"method":"m-sy3","sol":"<p><b>写成矩阵：<\/b>$A=\\begin{pmatrix}1&1\\\\2&t\\end{pmatrix}$，右端 $(2,b)^T$。$\\det A=t-2$。<\/p><p><b>情况 1：$t\\ne2$。<\/b>$\\det A\\ne0$，唯一解。<\/p><ul><li>$\\det A_1=\\begin{vmatrix}2&1\\\\b&t\\end{vmatrix}=2t-b$，所以 $x=\\dfrac{2t-b}{t-2}$；<\/li><li>$\\det A_2=\\begin{vmatrix}1&2\\\\2&b\\end{vmatrix}=b-4$，所以 $y=\\dfrac{b-4}{t-2}$。<\/li><\/ul><p>验证：$x+y=\\frac{2t-b+b-4}{t-2}=\\frac{2(t-2)}{t-2}=2$；$2x+ty=\\frac{4t-2b+tb-4t}{t-2}=\\frac{b(t-2)}{t-2}=b$。<\/p><p><b>情况 2：$t=2$。<\/b>分母为零，改用消元。增广矩阵 $$\\left(\\begin{array}{cc|c}1&1&2\\\\2&2&b\\end{array}\\right)\\xrightarrow{r_2-2r_1}\\left(\\begin{array}{cc|c}1&1&2\\\\0&0&b-4\\end{array}\\right).$$<\/p><ul><li>$b\\ne4$：第二行是 $0=b-4\\ne0$，$r(A)=1\\lt r([A\\mid b])=2$，<b>无解<\/b>；<\/li><li>$b=4$：只剩 $x+y=2$，令 $y=s$，<b>通解 $(x,y)=(2-s,\\ s)$，$s\\in\\mathbb R$<\/b>，无穷多解。<\/li><\/ul><p><b>结论：$t\\ne2$ 时唯一解 $x=\\frac{2t-b}{t-2},\\ y=\\frac{b-4}{t-2}$；$t=2,b\\ne4$ 无解；$t=2,b=4$ 有无穷多解 $(2-s,s)$。<\/b><\/p>"}],"variants":[{"id":"sy3-v1","lv":"变种","src":"自编同类练习","stmt":"<p>设 $A$ 是可逆方阵。只用 Cramer 法则证明求解 $Ax=b$ 得到的第 $i$ 个分量是 $b$ 的线性函数。<\/p>","hints":["由 Cramer 法则 $x_i=\\det A_i(b)/\\det A$。分母 $\\det A$ 与 $b$ 无关，是一个固定的非零数。","分子 $\\det A_i(b)$ 中，只有第 $i$ 列是 $b$，其余列固定。行列式对一列是线性的。","写：$\\det A_i(\\alpha b+\\beta c)=\\alpha\\det A_i(b)+\\beta\\det A_i(c)$，两边同除以 $\\det A$。"],"method":"m-sy3","sol":"<p><b>要证：<\/b>记 $f_i(b)$ 为 $Ax=b$ 的解的第 $i$ 个分量，则对任意 $b,c$ 和数 $\\alpha,\\beta$，$f_i(\\alpha b+\\beta c)=\\alpha f_i(b)+\\beta f_i(c)$。<\/p><p><b>1.<\/b> $A$ 可逆，$\\det A\\ne0$，由 Cramer 法则 $f_i(b)=\\dfrac{\\det A_i(b)}{\\det A}$。<\/p><p><b>2.<\/b> $A_i(\\alpha b+\\beta c)$ 的第 $i$ 列是 $\\alpha b+\\beta c$，其他列与 $A$ 相同。行列式对第 $i$ 列线性（因为行列式对每一列都是线性的），所以 $$\\det A_i(\\alpha b+\\beta c)=\\alpha\\det A_i(b)+\\beta\\det A_i(c).$$<\/p><p><b>3.<\/b> 两边同除以固定的非零数 $\\det A$：$$f_i(\\alpha b+\\beta c)=\\alpha f_i(b)+\\beta f_i(c).$$<\/p><p><b>结论：解的每个分量都是 $b$ 的线性函数。<\/b>（这与 $x=A^{-1}b$ 一致：$x_i$ 是 $A^{-1}$ 第 $i$ 行与 $b$ 的乘积。）<\/p>"}],"extensions":[{"id":"sy3-e1","lv":"延伸","src":"自编同类练习","stmt":"<p>构造一个 2×2 系统，系数行列式和两个换列行列式都是零，但原方程组无解。<\/p>","hints":["要让三个行列式都为 0，最简单的是系数矩阵有两列都是零列。","取 $A$ 为 $2\\times2$ 零矩阵。把任一列换成 $b$ 后，另一列仍全为零，行列式为 0。","取 $b=(1,0)^T$，写出第一个方程 $0x+0y=1$，看它能否成立。"],"method":"m-sy3","sol":"<p><b>构造：<\/b>$A=\\begin{pmatrix}0&0\\\\0&0\\end{pmatrix}$，$b=\\begin{pmatrix}1\\\\0\\end{pmatrix}$，即方程组 $0x+0y=1,\\ 0x+0y=0$。<\/p><p><b>三个行列式：<\/b><\/p><ul><li>$\\det A=0$；<\/li><li>$\\det A_1(b)=\\begin{vmatrix}1&0\\\\0&0\\end{vmatrix}=0$（第 2 列全零）；<\/li><li>$\\det A_2(b)=\\begin{vmatrix}0&1\\\\0&0\\end{vmatrix}=0$（第 1 列全零）。<\/li><\/ul><p><b>但无解：<\/b>第一个方程要求 $0=1$，不可能成立。用秩说：$r(A)=0\\lt r([A\\mid b])=1$。<\/p><p><b>结论：<\/b><b>该系统三个行列式都为 0 但无解，所以“分子分母全为零 ⇒ 无穷多解”是错误推理。<\/b><\/p>"}]},"sp4":{"unit":"spaces","n":4,"title":"线性空间同构｜坐标就是一个同构","goal":"和“基、维数与坐标”一起学。学完能做到：说清“同构”要验证哪几件事；在两个同维空间之间按基写出一个同构及其逆映射；会用“维数不同”或“核里有非零向量”否定同构。","sections":[{"id":"sp4-s1","h":"同构是线性且双射","html":"<p><b>这节解决什么：<\/b>$\\mathcal P_2$ 里的 $a+bx+cx^2$ 和 $\\mathbb R^3$ 里的 $(a,b,c)^T$，加法、数乘的算法完全一样，只是“长相”不同。同构就是把“结构完全一样”说精确。<\/p><p><b>定义：<\/b>$V,W$ 是同一数域 $F$ 上的线性空间，映射 $T:V\\to W$。<\/p><ul><li><b>线性<\/b>：$T(u+v)=T(u)+T(v)$，$T(av)=aT(v)$（保持加法和数乘）。<\/li><li><b>单射<\/b>：不同的向量映到不同的像（$T(u)=T(v)\\Rightarrow u=v$）。<\/li><li><b>满射<\/b>：$W$ 的每个向量都是某个向量的像。<\/li><li><b>双射<\/b>：既单又满，因而有逆映射。<\/li><li><b>线性同构<\/b>：线性 + 双射。存在同构时称 $V$ 与 $W$ <b>同构<\/b>，记 $V\\cong W$。<\/li><\/ul><p><b>核：<\/b>$\\ker T=\\{v\\in V:T(v)=0\\}$，即被 $T$ 映成零的向量全体。<\/p><p><b>常用判法：<\/b><\/p><ol><li>线性映射 $T$ 是单射 $\\iff\\ker T=\\{0\\}$。理由：$T(u)=T(v)\\iff T(u-v)=0\\iff u-v\\in\\ker T$。<\/li><li>若 $\\dim V=\\dim W=n$（有限），则对线性映射 $T$：单射 $\\iff$ 满射。所以同维时只验一个即可。<\/li><li>同构把基映成基，所以同构的两个空间维数相同。维数不同就一定不同构。<\/li><\/ol><p><b>小例子：<\/b>$T:\\mathbb R^2\\to\\mathbb R^2$，$T(x,y)=(x+y,\\,x-y)$。线性显然。若 $T(x,y)=0$，则 $x+y=0,\\ x-y=0$，得 $x=y=0$，核只有零。同维，所以 $T$ 是同构。<\/p>"},{"id":"sp4-s2","h":"同维时，按对应基构造","html":"<p><b>这节解决什么：<\/b>给两个同维空间，怎样亲手造出一个同构。<\/p><p><b>构造方法：<\/b>取 $V$ 的有序基 $v_1,\\ldots,v_n$ 和 $W$ 的有序基 $w_1,\\ldots,w_n$，规定 $$T(a_1v_1+\\cdots+a_nv_n)=a_1w_1+\\cdots+a_nw_n.$$<\/p><ol><li><b>定义合理：<\/b>每个 $v$ 的系数 $a_i$（坐标）唯一，所以 $T(v)$ 只有一个值。<\/li><li><b>线性：<\/b>坐标对加法、数乘是线性的，所以 $T$ 线性。<\/li><li><b>可逆：<\/b>反方向 $S(\\sum a_iw_i)=\\sum a_iv_i$ 就是逆映射。<\/li><\/ol><p>结论：<b>同一数域上的两个有限维空间同构 $\\iff$ 维数相同。<\/b><\/p><p><b>坐标映射是同构：<\/b>取定 $V$ 的基 $\\mathcal B$，映射 $v\\mapsto[v]_{\\mathcal B}$ 是 $V\\to F^n$ 的同构。这就是为什么抽象空间的问题能变成列向量的计算。<\/p><p><b>小例子：<\/b>$\\mathcal P_2$ 取基 $(1,x,x^2)$，坐标映射把 $3-x+2x^2$ 送到 $(3,-1,2)^T$。$(1+x)+(2x^2)$ 的坐标 $(1,1,2)^T$ 恰好等于 $(1,1,0)^T+(0,0,2)^T$。<\/p><p><b>提醒：<\/b>两个坐标列一样，不代表两个向量一样，要先看是哪组基的坐标。例如 $(1,1)^T$ 在标准基下是向量 $(1,1)^T$，在基 $((1,1)^T,(1,-1)^T)$ 下却是 $(2,0)^T$。<\/p>"}],"widget":null,"concepts":[{"id":"sp4-c1","sec":"sp4-s1","q":"线性同构需要哪些条件？","opts":["只要线性","线性且双射","双射就足够","连续且有界"],"a":1,"ex":"选“线性且双射”。线性保证运算对应得上，双射保证一一对应（有逆）。误选“只要线性”：零映射 $T(v)=0$ 是线性的，但把所有向量压成一个点，不可逆。误选“双射就足够”：$\\mathbb R\\to\\mathbb R$，$x\\mapsto x^3$ 是双射，但 $(1+1)^3\\ne1^3+1^3$，不线性。"},{"id":"sp4-c2","sec":"sp4-s1","q":"同维有限空间中，线性映射核为零能推出什么？","opts":["单射且满射","只有单射","只有满射","不能确定"],"a":0,"ex":"选“单射且满射”。核为零 ⇒ 单射；再由秩–零度公式 $\\dim\\ker T+\\dim\\operatorname{Im}T=\\dim V$，得像空间维数 $=\\dim V=\\dim W$，像就是整个 $W$，所以满射。误选“只有单射”：这在两边维数不同时才可能，同维时单射自动给满射。"},{"id":"sp4-c3","sec":"sp4-s2","q":"$\\mathcal P_2(\\mathbb R)$ 同构于哪个通常空间？","opts":["$\\mathbb R^2$","$\\mathbb R^3$","$\\mathbb R^4$","$\\mathbb C$（作为实空间）"],"a":1,"ex":"选 $\\mathbb R^3$。$\\mathcal P_2$ 的基是 $1,x,x^2$，共 3 个，维数 3；同一数域上维数相同就同构。误选 $\\mathbb R^2$：最高次数是 2，但基还要算上常数 1，维数是 3。$\\mathbb C$ 作为实空间维数是 2，也不对。"},{"id":"sp4-c4","sec":"sp4-s2","q":"两个空间维数相同但数域不同，可以直接使用同维同构定理吗？","opts":["总可以","对象写成矩阵就可以","先指定同一个数域再比较维数","只比较集合元素数目"],"a":2,"ex":"选“先指定同一个数域再比较维数”。线性映射要求 $T(av)=aT(v)$，两边的 $a$ 必须取自同一个数域，否则“线性”无从谈起。例如 $\\mathbb C$ 作为 $\\mathbb C$ 上的空间维数 1，作为 $\\mathbb R$ 上的空间维数 2，单说“维数”就不明确。误选“只比较集合元素数目”：$\\mathbb R$ 与 $\\mathbb R^2$ 元素“一样多”，但维数不同，不同构。"}],"methods":[{"id":"m-sp4","title":"找基并为每个基向量指定像","steps":["写明数域（通常是 ℝ），并分别写出两边的一组基，比较维数。","维数不同：直接下结论“不同构”。维数相同：按“基向量 ↦ 基向量”定义映射，或验证给定映射。","验证给定映射：① 逐项检查 T(au+bv)=aT(u)+bT(v)；② 求核（解 T(v)=0），核只有 0 则单射，同维就是同构；或直接写出逆映射。易错：同维只说明“存在”同构，题目给的那个具体映射仍可能不是同构，要算核或像。"]}],"problems":[{"id":"sp4-p1","lv":"练习","src":"自编同类练习","stmt":"<p>把 $p(x)=a+bx+cx^2$ 映到 $(p(0),p(1),p(-1))$。证明这是 $\\mathcal P_2(\\mathbb R)\\to\\mathbb R^3$ 的线性同构，并写逆映射。<\/p>","hints":["线性：在某点取值满足 $(\\alpha p+\\beta q)(0)=\\alpha p(0)+\\beta q(0)$。双射：给定 $(u,v,w)$，看能否唯一解出 $a,b,c$。","$p(0)=a$，$p(1)=a+b+c$，$p(-1)=a-b+c$。令它们分别等于 $u,v,w$。","$a=u$；两式相减 $v-w=2b$；两式相加 $v+w=2a+2c$。所以 $b=\\frac{v-w}2$，$c=\\frac{v+w}2-u$。"],"method":"m-sp4","sol":"<p><b>已知：<\/b>$T(p)=(p(0),p(1),p(-1))^T$，$p=a+bx+cx^2\\in\\mathcal P_2(\\mathbb R)$。<b>要证：<\/b>$T$ 是同构，并求 $T^{-1}$。<\/p><p><b>1. 线性：<\/b>对 $p,q\\in\\mathcal P_2$，$\\alpha,\\beta\\in\\mathbb R$，在任一点 $x_0$ 有 $(\\alpha p+\\beta q)(x_0)=\\alpha p(x_0)+\\beta q(x_0)$。三个分量都如此，所以 $T(\\alpha p+\\beta q)=\\alpha T(p)+\\beta T(q)$。<\/p><p><b>2. 解方程：<\/b>$$p(0)=a,\\quad p(1)=a+b+c,\\quad p(-1)=a-b+c.$$任给 $(u,v,w)^T\\in\\mathbb R^3$，令 $T(p)=(u,v,w)^T$：<\/p><ul><li>$a=u$；<\/li><li>后两式相减：$2b=v-w$，$b=\\frac{v-w}2$；<\/li><li>后两式相加：$2a+2c=v+w$，$c=\\frac{v+w}2-u$。<\/li><\/ul><p><b>3. 双射：<\/b>对每个 $(u,v,w)^T$，解存在（满射）且唯一（单射）。<\/p><p><b>结论：$T$ 是线性同构，<\/b>$$T^{-1}(u,v,w)=u+\\frac{v-w}2\\,x+\\Bigl(\\frac{v+w}2-u\\Bigr)x^2.$$<\/p><p><b>验算：<\/b>取 $p=1+2x+3x^2$，$T(p)=(1,6,2)^T$。代入逆映射：$1+\\frac{6-2}2x+(\\frac{6+2}2-1)x^2=1+2x+3x^2$。<\/p>"},{"id":"sp4-p2","lv":"练习","src":"自编同类练习","stmt":"<p>给出所有实对称 $2\\times2$ 矩阵的空间到 $\\mathcal P_2(\\mathbb R)$ 的一个同构。<\/p>","hints":["实对称 $2\\times2$ 矩阵 $\\begin{pmatrix}a&b\\\\b&c\\end{pmatrix}$ 由 $a,b,c$ 三个数决定，维数 3；$\\mathcal P_2$ 也是 3 维。","让三个自由参数对应多项式的三个系数：$\\begin{pmatrix}a&b\\\\b&c\\end{pmatrix}\\mapsto a+bx+cx^2$。","验证线性（对应位置相加、数乘）；逆映射：$a+bx+cx^2\\mapsto\\begin{pmatrix}a&b\\\\b&c\\end{pmatrix}$。"],"method":"m-sp4","sol":"<p><b>记：<\/b>$S$ = 全体 $2\\times2$ 实对称矩阵，一般元素 $\\begin{pmatrix}a&b\\\\b&c\\end{pmatrix}$，$a,b,c$ 任意实数，所以 $\\dim S=3=\\dim\\mathcal P_2$。<\/p><p><b>1. 定义映射：<\/b>$$T\\begin{pmatrix}a&b\\\\b&c\\end{pmatrix}=a+bx+cx^2.$$<\/p><p><b>2. 线性：<\/b>$$T\\left(\\alpha\\begin{pmatrix}a&b\\\\b&c\\end{pmatrix}+\\beta\\begin{pmatrix}a'&b'\\\\b'&c'\\end{pmatrix}\\right)=(\\alpha a+\\beta a')+(\\alpha b+\\beta b')x+(\\alpha c+\\beta c')x^2,$$恰好等于 $\\alpha T(\\cdot)+\\beta T(\\cdot)$。<\/p><p><b>3. 逆映射：<\/b>定义 $U(a+bx+cx^2)=\\begin{pmatrix}a&b\\\\b&c\\end{pmatrix}$。$U\\circ T$ 和 $T\\circ U$ 都是恒等映射，所以 $T$ 是双射。<\/p><p><b>结论：$T:\\begin{pmatrix}a&b\\\\b&c\\end{pmatrix}\\mapsto a+bx+cx^2$ 是 $S$ 到 $\\mathcal P_2(\\mathbb R)$ 的线性同构。<\/b>（它就是“把 $S$ 的基 $E_{11},\\ E_{12}+E_{21},\\ E_{22}$ 依次送到 $1,x,x^2$”。）<\/p>"}],"variants":[{"id":"sp4-v1","lv":"变种","src":"自编同类练习","stmt":"<p>实上 $T:\\mathcal P_2\\to\\mathbb R^3$，$T(p)=(p(0),p(1),p(0)+p(1))$，是否同构？<\/p>","hints":["两边都是 3 维，但这只说明“存在”同构。要检查这个具体的 $T$：算它的核或看它的像。","像 $(u,v,w)$ 总满足 $w=u+v$，所以像不可能是整个 $\\mathbb R^3$。","找核里的非零元：要求 $p(0)=p(1)=0$，例如 $p=x(x-1)=x^2-x$。"],"method":"m-sp4","sol":"<p><b>结论：不是同构。<\/b>给出两个独立的理由，写一个就够。<\/p><p><b>理由 1（不满射）：<\/b>记 $T(p)=(u,v,w)^T$，则 $u=p(0),\\ v=p(1),\\ w=p(0)+p(1)=u+v$。所以每个像都满足 $w=u+v$。$(0,0,1)^T$ 不满足（$1\\ne0+0$），不在像中，$T$ 不是满射。<\/p><p><b>理由 2（不单射）：<\/b>取 $p=x(x-1)=x^2-x\\ne0$。$p(0)=0$，$p(1)=0$，所以 $T(p)=(0,0,0)^T$。核中有非零向量，$T$ 不是单射。<\/p><p><b>提醒：<\/b>$\\dim\\mathcal P_2=\\dim\\mathbb R^3=3$ 只说明“存在某个同构”（例如上一题的取值映射），不说明每个线性映射都是同构。<\/p>"}],"extensions":[]},"ma2":{"unit":"matrix","n":2,"title":"矩阵题补练｜初等矩阵、可交换矩阵与反射矩阵","goal":"三类常考的矩阵小题：① 左乘 / 右乘初等矩阵分别做什么行 / 列变换；② 求与对角矩阵可交换（$DX=XD$）的全部矩阵；③ 用 $uu^T$ 写出关于一条直线的反射矩阵并求逆。","sections":[{"id":"ma2-s1","h":"左乘作用在行，右乘作用在列","html":"<p><b>这节解决什么：<\/b>行变换、列变换都可以写成“乘一个矩阵”。记住谁在左边、谁在右边，考试里写 $PAQ$ 这类式子就不会乱。<\/p><p><b>记号：<\/b>$E_{ij}$ 表示第 $(i,j)$ 个位置为 1、其余全为 0 的矩阵。<\/p><p><b>规则：<\/b><\/p><ul><li><b>左乘<\/b> $(I+cE_{ij})A$：把 $A$ 的第 $j$ 行乘 $c$ 加到第 $i$ 行（改的是第 $i$ 行）。<\/li><li><b>右乘<\/b> $A(I+cE_{ij})$：把 $A$ 的第 $i$ 列乘 $c$ 加到第 $j$ 列（改的是第 $j$ 列）。<\/li><\/ul><p>口诀：<b>左行右列<\/b>。左乘时下标 $(i,j)$ 读作“目标行 $i$，来源行 $j$”；右乘时读作“来源列 $i$，目标列 $j$”。<\/p><p><b>小例子：<\/b>$A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$。<\/p><ul><li>$(I+2E_{12})A=\\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}=\\begin{pmatrix}7&10\\\\3&4\\end{pmatrix}$：第 1 行加上 2 倍第 2 行。<\/li><li>$A(I+2E_{12})=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}\\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}=\\begin{pmatrix}1&4\\\\3&10\\end{pmatrix}$：第 2 列加上 2 倍第 1 列。<\/li><\/ul><p>先做行变换 $P$、再做列变换 $Q$，结果写成 $PAQ$（矩阵乘法有结合律，先后顺序不影响结果）。<\/p>"},{"id":"ma2-s2","h":"对角元素不相等时，相交换会限制非对角元","html":"<p><b>这节解决什么：<\/b>“求所有与 $D$ 可交换的矩阵”是常见题，逐个元素比较就能做完。<\/p><p><b>记号：<\/b>$D=\\operatorname{diag}(d_1,\\ldots,d_n)$ 表示对角线为 $d_1,\\ldots,d_n$、其余为 0 的对角矩阵。$X$ 与 $D$ <b>可交换<\/b>指 $DX=XD$。<\/p><p><b>关键公式：<\/b><\/p><ol><li>$DX$ 的 $(i,j)$ 元 $=d_ix_{ij}$（左乘对角阵：第 $i$ 行整体乘 $d_i$）。<\/li><li>$XD$ 的 $(i,j)$ 元 $=x_{ij}d_j$（右乘对角阵：第 $j$ 列整体乘 $d_j$）。<\/li><li>所以 $(DX-XD)_{ij}=(d_i-d_j)x_{ij}$。<\/li><\/ol><p><b>结论：<\/b>$DX=XD\\iff$ 对每对 $(i,j)$，$(d_i-d_j)x_{ij}=0$。<\/p><ul><li>$d_i\\ne d_j$ 时必须 $x_{ij}=0$；<\/li><li>$d_i=d_j$ 时 $x_{ij}$ 任意。<\/li><\/ul><p>特别地，对角元两两不同时，$X$ 只能是对角矩阵。<\/p><p><b>小例子：<\/b>$D=\\operatorname{diag}(1,2)$。$d_1\\ne d_2$，所以 $x_{12}=x_{21}=0$，可交换的 $X$ 全是 $\\begin{pmatrix}a&0\\\\0&b\\end{pmatrix}$。<\/p>"},{"id":"ma2-s3","h":"单位向量给秩一投影","html":"<p><b>这节解决什么：<\/b>把平面（或空间）里“关于一条直线 / 平面做镜面反射”写成矩阵，并说明它的逆就是自己。<\/p><p><b>记号：<\/b>$u$ 是列向量，$u^Tu=\\|u\\|^2$ 是长度平方（一个数），$uu^T$ 是 $n\\times n$ 矩阵。$u^\\perp$ 表示与 $u$ 垂直的全部向量。<\/p><p><b>步骤：<\/b><\/p><ol><li>若 $\\|u\\|=1$（单位向量），令 $P=uu^T$。对任意 $x$，$Px=u(u^Tx)$ 是 $x$ 在 $u$ 方向上的投影。<\/li><li>$P^2=u(u^Tu)u^T=u\\cdot1\\cdot u^T=P$（投影两次等于投影一次）。<\/li><li>令 $H=I-2P$。$H^2=I-4P+4P^2=I-4P+4P=I$，所以 $H^{-1}=H$。<\/li><li>作用：$Hu=u-2u=-u$（沿 $u$ 方向反号）；若 $w\\perp u$，$Hw=w-2u(u^Tw)=w$（垂直方向不动）。这就是关于“与 $u$ 垂直的直线 / 平面”的反射。<\/li><\/ol><p><b>$u$ 不是单位向量时：<\/b>用 $P=\\dfrac{uu^T}{u^Tu}$，其余不变。<\/p><p><b>小例子：<\/b>$u=(0,1)^T$，$P=\\begin{pmatrix}0&0\\\\0&1\\end{pmatrix}$，$H=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$：关于 $x$ 轴的反射，$H^2=I$。<\/p>"}],"widget":null,"concepts":[{"id":"ma2-c1","sec":"ma2-s1","q":"右乘 $I+2E_{12}$ 的效果是什么？","opts":["第2行加到第1行","第2列加上2倍第1列","第1列加上2倍第2列","第1行乘2"],"a":1,"ex":"选“第2列加上2倍第1列”。右乘 $I+cE_{ij}$ 是“第 $i$ 列的 $c$ 倍加到第 $j$ 列”，这里 $i=1,j=2$。可用 $A=I$ 验证：$I(I+2E_{12})$ 的第 2 列是 $(2,1)^T$，即原第 2 列 $(0,1)^T$ 加上 2 倍第 1 列 $(1,0)^T$。最容易误选“第1列加上2倍第2列”：那是把左乘的读法用到了右乘。"},{"id":"ma2-c2","sec":"ma2-s1","q":"要先做行操作 P 再做列操作 Q，结果如何写？","opts":["QAP","APQ","PAQ","PQA"],"a":2,"ex":"选 $PAQ$。行变换乘在左边，列变换乘在右边，所以 $P$ 在 $A$ 左、$Q$ 在 $A$ 右。误选 $QAP$：把 $Q$ 放左边就变成了行变换。误选 $APQ$、$PQA$：两个都放在同一侧，等于做了两次列（行）变换。"},{"id":"ma2-c3","sec":"ma2-s2","q":"若 $D=\\operatorname{diag}(1,1,2)$，相交换的 X 中哪一个位置可以非零？","opts":["$x_{13}$","$x_{31}$","$x_{23}$","$x_{21}$"],"a":3,"ex":"选 $x_{21}$。条件是 $(d_i-d_j)x_{ij}=0$。$d_2-d_1=1-1=0$，所以 $x_{21}$ 可以任意；而 $x_{13},x_{31},x_{23}$ 都对应 $d$ 值 1 与 2，差不为 0，必须为 0。"},{"id":"ma2-c4","sec":"ma2-s3","q":"单位 $u$ 时 $I-2uu^T$ 的逆是什么？","opts":["自身","$I+2uu^T$","零矩阵","$uu^T$"],"a":0,"ex":"选“自身”。$P=uu^T$ 满足 $P^2=P$，所以 $(I-2P)^2=I-4P+4P=I$，逆矩阵就是它自己（反射两次回到原处）。误选 $I+2uu^T$：$(I-2P)(I+2P)=I-4P^2=I-4P\\ne I$。"}],"methods":[{"id":"m-ma2","title":"用元素或结构恒等式代替盲算","steps":["先认题型：行列变换（写初等矩阵）、可交换（逐元素比较）、还是 uuᵀ 这类低秩矩阵（用 P²=P）。","写出一般位置的关系：如 (DX−XD)ᵢⱼ=(dᵢ−dⱼ)xᵢⱼ，或 (uuᵀ)²=(uᵀu)uuᵀ。易错：右乘 I+cEᵢⱼ 改的是第 j 列，不是第 i 列。","最后验算：把结果真正乘一次，或检查 H²=I、DX=XD 是否成立。"]}],"problems":[{"id":"ma2-p1","lv":"练习","src":"自编同类练习","stmt":"<p>求与 $D=\\operatorname{diag}(1,1,2)$ 相交换的所有实三阶矩阵。<\/p>","hints":["设 $X=(x_{ij})$，用公式 $(DX-XD)_{ij}=(d_i-d_j)x_{ij}$，这里 $d_1=d_2=1,\\ d_3=2$。","$d_i\\ne d_j$ 的位置是 $(1,3),(3,1),(2,3),(3,2)$，这些 $x_{ij}$ 必须为 0。","其余位置 $(1,1),(1,2),(2,1),(2,2),(3,3)$ 任意，写成 $\\begin{pmatrix}a&b&0\\\\c&d&0\\\\0&0&e\\end{pmatrix}$，再乘一次验证。"],"method":"m-ma2","sol":"<p><b>已知：<\/b>$D=\\operatorname{diag}(1,1,2)$，即 $d_1=d_2=1,\\ d_3=2$。设 $X=(x_{ij})_{3\\times3}$。<\/p><p><b>1. 逐元素比较：<\/b>$(DX)_{ij}=d_ix_{ij}$，$(XD)_{ij}=x_{ij}d_j$，所以 $$DX=XD\\iff(d_i-d_j)x_{ij}=0\\ \\text{对所有}\\ i,j.$$<\/p><p><b>2. 分类：<\/b><\/p><ul><li>$d_i-d_j\\ne0$：$(i,j)=(1,3),(2,3),(3,1),(3,2)$（差为 $\\pm1$），必须 $x_{13}=x_{23}=x_{31}=x_{32}=0$；<\/li><li>$d_i-d_j=0$：$(1,1),(1,2),(2,1),(2,2),(3,3)$，对应元素任意。<\/li><\/ul><p><b>3. 验证充分性：<\/b>对 $X=\\begin{pmatrix}a&b&0\\\\c&d&0\\\\0&0&e\\end{pmatrix}$，$DX=\\begin{pmatrix}a&b&0\\\\c&d&0\\\\0&0&2e\\end{pmatrix}=XD$。<\/p><p><b>结论：与 $D$ 可交换的矩阵全体为 $\\begin{pmatrix}a&b&0\\\\c&d&0\\\\0&0&e\\end{pmatrix}$，$a,b,c,d,e\\in\\mathbb R$ 任意。<\/b><\/p>"},{"id":"ma2-p2","lv":"练习","src":"自编同类练习","stmt":"<p>令 $u=(1,2)^T$，令 $H$ 沿 $u$ 反号并固定垂直于 $u$ 的直线。用秩一投影写 $H$，求 $H^{-1}$。<\/p>","hints":["$u$ 不是单位向量，投影矩阵用 $P=\\dfrac{uu^T}{u^Tu}$，这里 $u^Tu=1+4=5$。","$uu^T=\\begin{pmatrix}1&2\\\\2&4\\end{pmatrix}$，$H=I-2P=I-\\frac25\\begin{pmatrix}1&2\\\\2&4\\end{pmatrix}$。","逐个元素算出 $H$；再用 $P^2=P$ 说明 $H^2=I$，所以 $H^{-1}=H$。"],"method":"m-ma2","sol":"<p><b>已知：<\/b>$u=(1,2)^T$。$H$ 把 $u$ 变成 $-u$，把与 $u$ 垂直的向量保持不变。<\/p><p><b>1. 投影矩阵：<\/b>$u^Tu=1^2+2^2=5$，$uu^T=\\begin{pmatrix}1\\\\2\\end{pmatrix}(1\\ \\ 2)=\\begin{pmatrix}1&2\\\\2&4\\end{pmatrix}$，所以 $$P=\\frac{uu^T}{u^Tu}=\\frac15\\begin{pmatrix}1&2\\\\2&4\\end{pmatrix}.$$<\/p><p><b>2. 反射矩阵：<\/b>$$H=I-2P=\\begin{pmatrix}1-\\frac25&-\\frac45\\\\-\\frac45&1-\\frac85\\end{pmatrix}=\\frac15\\begin{pmatrix}3&-4\\\\-4&-3\\end{pmatrix}.$$<\/p><p><b>3. 检查作用：<\/b>$Hu=\\frac15(3-8,\\ -4-6)^T=(-1,-2)^T=-u$；取 $w=(2,-1)^T\\perp u$，$Hw=\\frac15(6+4,\\ -8+3)^T=(2,-1)^T=w$。<\/p><p><b>4. 求逆：<\/b>$P^2=\\dfrac{u(u^Tu)u^T}{(u^Tu)^2}=\\dfrac{uu^T}{u^Tu}=P$，所以 $H^2=I-4P+4P^2=I$，$H^{-1}=H$。（直接验算：$\\frac1{25}\\begin{pmatrix}9+16&-12+12\\\\-12+12&16+9\\end{pmatrix}=I$。）<\/p><p><b>结论：$H=\\frac15\\begin{pmatrix}3&-4\\\\-4&-3\\end{pmatrix}$，$H^{-1}=H$。<\/b><\/p>"}],"variants":[{"id":"ma2-v1","lv":"变种","src":"自编同类练习","stmt":"<p>对三阶矩阵 A，第 3 行加上第 1 行的 2 倍，再把第 2 列的 3 倍减到第 1 列。写成 $PAQ$，指出 $P,Q$。<\/p>","hints":["行变换左乘、列变换右乘。左乘 $I+cE_{ij}$：第 $j$ 行的 $c$ 倍加到第 $i$ 行。","“第 3 行加上第 1 行的 2 倍”：目标行 3，来源行 1，$P=I+2E_{31}$。","右乘 $I+cE_{ij}$：第 $i$ 列的 $c$ 倍加到第 $j$ 列。“第 1 列减去第 2 列的 3 倍”：来源列 2，目标列 1，$c=-3$，所以 $Q=I-3E_{21}$。"],"method":"m-ma2","sol":"<p><b>1. 行变换：<\/b>“第 3 行加上第 1 行的 2 倍”。左乘 $I+cE_{ij}$ 是第 $j$ 行的 $c$ 倍加到第 $i$ 行，这里 $i=3$（目标），$j=1$（来源），$c=2$：$$P=I+2E_{31}=\\begin{pmatrix}1&0&0\\\\0&1&0\\\\2&0&1\\end{pmatrix}.$$<\/p><p><b>2. 列变换：<\/b>“第 1 列减去第 2 列的 3 倍”。右乘 $I+cE_{ij}$ 是第 $i$ 列的 $c$ 倍加到第 $j$ 列，这里 $i=2$（来源），$j=1$（目标），$c=-3$：$$Q=I-3E_{21}=\\begin{pmatrix}1&0&0\\\\-3&1&0\\\\0&0&1\\end{pmatrix}.$$<\/p><p><b>3. 检验：<\/b>$AQ$ 的第 1 列 $=A\\cdot(1,-3,0)^T=$（$A$ 的第 1 列）$-3$（$A$ 的第 2 列），正是所要的。<\/p><p><b>结论：结果为 $PAQ$，$P=I+2E_{31}$，$Q=I-3E_{21}$。<\/b><\/p>"}],"extensions":[]}});
LESSONS.sp1.variants.push(...[{"id":"sp1-ops","lv":"练习","src":"自编同类练习","stmt":"<p>(1) 给出实 $2\\times2$ 迹为零的矩阵空间的一组基。(2) 在 $\\mathbb R^2$ 固定 $w\\ne0$，定义 $u\\oplus v=u+v-w$，$\\lambda\\odot v=w+\\lambda(v-w)$。证明构成线性空间，写出零向量。<\/p>","hints":["(1) 迹为 0 即 $a_{11}+a_{22}=0$；(2) 想办法把奇怪的运算 ⊕、⊙ 变回普通的加法和数乘。","(1) 一般元素 $\\begin{pmatrix}a&b\\\\c&-a\\end{pmatrix}$；(2) 令 $T(v)=v-w$，计算 $T(u\\oplus v)$ 与 $T(\\lambda\\odot v)$。","(2) $T(u\\oplus v)=u+v-w-w=(u-w)+(v-w)=T(u)+T(v)$；$T(\\lambda\\odot v)=\\lambda(v-w)=\\lambda T(v)$。零向量是使 $T(\\theta)=0$ 的 $\\theta$。"],"sol":"<p><b>(1)<\/b> 迹为零的二阶实矩阵满足 $a_{22}=-a_{11}$，一般形式为 $$\\begin{pmatrix}a&b\\\\c&-a\\end{pmatrix}=a(E_{11}-E_{22})+bE_{12}+cE_{21},$$其中 $E_{ij}$ 表示 $(i,j)$ 位置为 1、其余为 0 的矩阵。若这个组合为零矩阵，看 $(1,1),(1,2),(2,1)$ 三个位置得 $a=b=c=0$，所以三者线性无关。<b>基为 $E_{11}-E_{22},\\ E_{12},\\ E_{21}$，维数 3。<\/b><\/p><p><b>(2)<\/b> 已知 $u\\oplus v=u+v-w$，$\\lambda\\odot v=w+\\lambda(v-w)$，其中 $w\\ne0$ 固定。<\/p><ol><li>定义 $T:\\mathbb R^2\\to\\mathbb R^2$，$T(v)=v-w$。它是双射，逆映射为 $T^{-1}(x)=x+w$。<\/li><li>$T(u\\oplus v)=(u+v-w)-w=(u-w)+(v-w)=T(u)+T(v)$。<\/li><li>$T(\\lambda\\odot v)=w+\\lambda(v-w)-w=\\lambda(v-w)=\\lambda T(v)$。<\/li><li>于是新运算下的每个等式，经 $T$ 都变成普通 $\\mathbb R^2$ 中的对应等式。例如验证分配律 $\\lambda\\odot(u\\oplus v)=(\\lambda\\odot u)\\oplus(\\lambda\\odot v)$：左边的像是 $\\lambda(T(u)+T(v))$，右边的像是 $\\lambda T(u)+\\lambda T(v)$，两者相等；$T$ 是单射，所以原来两边相等。其余公理同理。<\/li><li>零向量 $\\theta$ 要满足 $T(\\theta)=0$，所以 $\\theta=w$。检验：$v\\oplus w=v+w-w=v$。<\/li><\/ol><p><b>结论：$(\\mathbb R^2,\\oplus,\\odot)$ 是实线性空间，零向量是 $w$（不是 $(0,0)^T$）。<\/b><\/p>","method":"m-topic-space"}]);
LESSONS.sp1.methods.push(...[{"id":"m-topic-space","title":"换运算时按公理检验","steps":["先写清：数域、集合，以及题目实际给的加法 ⊕ 和数乘 ⊙（不要默认是普通运算）。","要证明是线性空间：找一个双射 T 把 ⊕ 变成普通加法、把 ⊙ 变成普通数乘，公理就能从普通空间搬过来。要否定：找一条公理，代入具体数字算出两边不等。","最后写出零向量是谁（往往不是普通的 0），以及所求的基或反例的具体数值。"]}]);
LESSONS.sp2.extensions.push(...[{"id":"sp2-basis","lv":"练习","src":"自编同类练习","stmt":"<p>令 $E$ 为 $\\mathbb R^3$ 的自然有序基。$B$ 的三向量是 $(1,0,0)^T$、$(2,1,0)^T$、$(0,1,1)^T$。证明构成基，写 $B=EP$ 中的矩阵 $P$，并将 $(2,1,3)^T$ 的 $B$ 坐标换为 $E$ 坐标。<\/p>","hints":["自然基 $E$ 下，向量的坐标就是它自己的分量。所以 $P$ 的列就是 $B$ 的三个向量。","$P=\\begin{pmatrix}1&2&0\\\\0&1&1\\\\0&0&1\\end{pmatrix}$ 是上三角矩阵，行列式等于对角元之积。","$[v]_E=P[v]_B=P(2,1,3)^T$，逐行计算。"],"sol":"<p><b>1. 写 $P$：<\/b>在自然基 $E=(e_1,e_2,e_3)$ 下，向量的坐标就是它的分量，所以 $B=EP$ 中 $P$ 的三列就是 $B$ 的三个向量：$$P=\\begin{pmatrix}1&2&0\\\\0&1&1\\\\0&0&1\\end{pmatrix}.$$<\/p><p><b>2. 是基：<\/b>$P$ 是上三角矩阵，$\\det P=1\\cdot1\\cdot1=1\\ne0$，所以三列线性无关；$\\mathbb R^3$ 维数为 3，三个无关向量构成基。<\/p><p><b>3. 换坐标：<\/b>旧坐标 = $P$ × 新坐标：$$[v]_E=P\\begin{pmatrix}2\\\\1\\\\3\\end{pmatrix}=\\begin{pmatrix}1\\cdot2+2\\cdot1+0\\cdot3\\\\0\\cdot2+1\\cdot1+1\\cdot3\\\\0+0+1\\cdot3\\end{pmatrix}=\\begin{pmatrix}4\\\\4\\\\3\\end{pmatrix}.$$<\/p><p><b>检验：<\/b>$2(1,0,0)^T+1\\cdot(2,1,0)^T+3(0,1,1)^T=(4,4,3)^T$。<\/p><p><b>结论：$P$ 如上，$[v]_E=(4,4,3)^T$。<\/b><\/p>","method":"m-topic-coordinate"},{"id":"sp2-shift","lv":"练习","src":"自编同类练习","stmt":"<p>令 $E=(1,x,x^2)$、$B=(1,2x+1,(2x+1)^2)$。求 $B=EP$ 的 $P$ 及 $f(x)=2x^2-2x+3$ 在 $B$ 下的坐标。<\/p>","hints":["$P$ 的第 $j$ 列是 $B$ 的第 $j$ 个多项式在 $(1,x,x^2)$ 下的系数。先展开 $(2x+1)^2$。","$(2x+1)^2=1+4x+4x^2$。求 $f$ 的新坐标：令 $t=2x+1$，则 $x=\\frac{t-1}2$，把 $f$ 写成 $t$ 的多项式。","$f=2\\cdot\\frac{(t-1)^2}4-2\\cdot\\frac{t-1}2+3=\\frac12(t^2-2t+1)-(t-1)+3$，整理 $t^2,t,1$ 的系数，最后用 $P$ 乘回去检查。"],"sol":"<p><b>已知：<\/b>$E=(1,x,x^2)$，$B=(1,\\ 2x+1,\\ (2x+1)^2)$，$f=3-2x+2x^2$。<\/p><p><b>1. 过渡矩阵：<\/b>$1\\to(1,0,0)^T$；$2x+1\\to(1,2,0)^T$；$(2x+1)^2=1+4x+4x^2\\to(1,4,4)^T$。按列排：$$P=\\begin{pmatrix}1&1&1\\\\0&2&4\\\\0&0&4\\end{pmatrix}.$$<\/p><p><b>2. 求新坐标：<\/b>令 $t=2x+1$，则 $x=\\frac{t-1}2$。代入：$$f=2\\cdot\\frac{(t-1)^2}{4}-2\\cdot\\frac{t-1}{2}+3=\\frac{t^2-2t+1}{2}-t+1+3=\\frac12t^2-2t+\\frac92.$$所以 $f=\\frac92\\cdot1-2\\cdot(2x+1)+\\frac12(2x+1)^2$，$[f]_B=(\\frac92,-2,\\frac12)^T$。<\/p><p><b>3. 检验（旧坐标 = $P$ × 新坐标）：<\/b>$$P\\begin{pmatrix}9/2\\\\-2\\\\1/2\\end{pmatrix}=\\begin{pmatrix}\\frac92-2+\\frac12\\\\-4+2\\\\2\\end{pmatrix}=\\begin{pmatrix}3\\\\-2\\\\2\\end{pmatrix},$$正是 $f$ 在 $E$ 下的系数 $(3,-2,2)^T$。<\/p><p><b>结论：$P$ 如上，$[f]_B=(9/2,-2,1/2)^T$。<\/b><\/p>","method":"m-topic-coordinate"},{"id":"sp2-matrix","lv":"练习","src":"自编同类练习","stmt":"<p>证明 $B=(E_{11}, E_{11}+E_{12}, E_{12}+E_{21}, E_{22})$ 是实 $2\\times2$ 矩阵空间的一组基，并求 $\\begin{pmatrix}3&2\\\\1&-2\\end{pmatrix}$ 的坐标。<\/p>","hints":["设 $aE_{11}+b(E_{11}+E_{12})+c(E_{12}+E_{21})+dE_{22}$，写出这个矩阵的四个元素。（$E_{ij}$：$(i,j)$ 位置为 1，其余为 0。）","组合等于 $\\begin{pmatrix}a+b&b+c\\\\c&d\\end{pmatrix}$。左下给 $c$，右下给 $d$。","令它等于目标矩阵：$c=1,\\ d=-2$，再由 $b+c=2$ 得 $b$，由 $a+b=3$ 得 $a$。"],"sol":"<p><b>记号：<\/b>$E_{ij}$ 是 $(i,j)$ 位置为 1、其余为 0 的 $2\\times2$ 矩阵。<\/p><p><b>1. 一般组合：<\/b>$$aE_{11}+b(E_{11}+E_{12})+c(E_{12}+E_{21})+dE_{22}=\\begin{pmatrix}a+b&b+c\\\\c&d\\end{pmatrix}.$$<\/p><p><b>2. 是基：<\/b>令它等于任意矩阵 $\\begin{pmatrix}p&q\\\\r&s\\end{pmatrix}$：$c=r$，$d=s$，$b=q-r$，$a=p-q+r$，总有唯一解。“总有解”说明生成，“解唯一”说明无关（取目标为零矩阵只有零解）。所以 $B$ 是基。<\/p><p><b>3. 坐标：<\/b>目标 $\\begin{pmatrix}3&2\\\\1&-2\\end{pmatrix}$：$c=1$，$d=-2$，$b=2-1=1$，$a=3-1=2$。<\/p><p><b>检验：<\/b>$2E_{11}+(E_{11}+E_{12})+(E_{12}+E_{21})-2E_{22}=\\begin{pmatrix}3&2\\\\1&-2\\end{pmatrix}$。<\/p><p><b>结论：坐标为 $(2,1,1,-2)^T$。<\/b><\/p>","method":"m-topic-coordinate"}]);
LESSONS.sp2.methods.push(...[{"id":"m-topic-coordinate","title":"把新基放在过渡矩阵的列中","steps":["写出“新基 = 旧基 × P”。P 的每一列是对应新基向量在旧基中的坐标。","求这些坐标：多项式就展开比较系数，列向量就解方程组。若旧基两两正交，第 i 个系数 = (向量, 第 i 个基向量) ÷ (该基向量长度的平方)。","检查方向：旧坐标 = P × 新坐标。用一个具体向量代回验证。"]}]);
LESSONS.sy3.problems.push(...[{"id":"sy3-system","lv":"练习","src":"自编同类练习","stmt":"<p>用 Cramer 法则解 $Ax=b$，其中 $A=\\begin{pmatrix}2&1&0\\\\0&3&2\\\\1&0&1\\end{pmatrix}$，$b=(3,-1,3)^T$。<\/p>","hints":["先算 $\\det A$，按第一行展开：$2\\begin{vmatrix}3&2\\\\0&1\\end{vmatrix}-1\\begin{vmatrix}0&2\\\\1&1\\end{vmatrix}+0$。","$\\det A=2\\cdot3-1\\cdot(-2)=8$。接着把第 1、2、3 列依次换成 $b=(3,-1,3)^T$。","$\\det A_1(b)=\\begin{vmatrix}3&1&0\\\\-1&3&2\\\\3&0&1\\end{vmatrix}$，按第一行展开 $=3(3-0)-1(-1-6)+0$。其余两个同样展开。"],"sol":"<p><b>已知：<\/b>$A=\\begin{pmatrix}2&1&0\\\\0&3&2\\\\1&0&1\\end{pmatrix}$，$b=(3,-1,3)^T$。<\/p><p><b>1. 分母（按第一行展开）：<\/b>$$\\det A=2\\begin{vmatrix}3&2\\\\0&1\\end{vmatrix}-1\\begin{vmatrix}0&2\\\\1&1\\end{vmatrix}+0=2\\cdot3-1\\cdot(0-2)=6+2=8.$$<\/p><p><b>2. 三个分子（都按第一行展开）：<\/b><\/p><ul><li>$\\det A_1(b)=\\begin{vmatrix}3&1&0\\\\-1&3&2\\\\3&0&1\\end{vmatrix}=3(3\\cdot1-2\\cdot0)-1\\bigl((-1)\\cdot1-2\\cdot3\\bigr)+0=9+7=16$；<\/li><li>$\\det A_2(b)=\\begin{vmatrix}2&3&0\\\\0&-1&2\\\\1&3&1\\end{vmatrix}=2\\bigl((-1)\\cdot1-2\\cdot3\\bigr)-3(0\\cdot1-2\\cdot1)+0=-14+6=-8$；<\/li><li>$\\det A_3(b)=\\begin{vmatrix}2&1&3\\\\0&3&-1\\\\1&0&3\\end{vmatrix}=2(9-0)-1\\bigl(0-(-1)\\cdot1\\bigr)+3(0-3)=18-1-9=8$。<\/li><\/ul><p><b>3. 解：<\/b>$x_1=\\frac{16}8=2$，$x_2=\\frac{-8}8=-1$，$x_3=\\frac88=1$。<\/p><p><b>4. 验证：<\/b>$2\\cdot2+(-1)=3$；$3\\cdot(-1)+2\\cdot1=-1$；$2+1=3$。全部成立。<\/p><p><b>结论：$x=(2,-1,1)^T$。<\/b><\/p>","method":"m-sy3"}]);
LESSONS.sy3.extensions.push(...[{"id":"sy3-chord","lv":"练习","src":"自编同类练习","stmt":"<p>点 $P=(2,t)$ 与 $A=(0,2)$、$B=(3,5)$ 共线。用坐标行列式求 $t$。<\/p>","hints":["三点共线 ⇔ 两个“从 $A$ 出发的位移向量” $\\overrightarrow{AP}$、$\\overrightarrow{AB}$ 平行（线性相关）。","$\\overrightarrow{AP}=(2-0,\\ t-2)=(2,t-2)$，$\\overrightarrow{AB}=(3,3)$。两向量相关 ⇔ 以它们为行的二阶行列式为 0。","$\\begin{vmatrix}2&t-2\\\\3&3\\end{vmatrix}=6-3(t-2)=12-3t$，令其为 0。"],"sol":"<p><b>思路：<\/b>$P,A,B$ 共线 $\\iff$ 向量 $\\overrightarrow{AP}$ 与 $\\overrightarrow{AB}$ 线性相关 $\\iff$ 以它们为行的二阶行列式等于 0。<\/p><p><b>1. 位移：<\/b>$\\overrightarrow{AP}=(2-0,\\ t-2)=(2,\\ t-2)$，$\\overrightarrow{AB}=(3-0,\\ 5-2)=(3,3)$。<\/p><p><b>2. 行列式：<\/b>$$\\begin{vmatrix}2&t-2\\\\3&3\\end{vmatrix}=2\\cdot3-3(t-2)=12-3t.$$<\/p><p><b>3.<\/b> 令 $12-3t=0$，得 $t=4$。<\/p><p><b>验证：<\/b>$\\overrightarrow{AP}=(2,2)=\\frac23(3,3)=\\frac23\\overrightarrow{AB}$，确实平行。<\/p><p><b>结论：$t=4$。<\/b>（$P$ 不必在线段 $AB$ 之间，只要在同一条直线上。）<\/p>","method":"m-sy3"},{"id":"sy3-intersection","lv":"练习","src":"自编同类练习","stmt":"<p>求实数 $b$，使 $x+y=3$、$2x-y=0$、$bx+3y=7$ 三直线共点。用含常数列的齐次形式，并检验充分性。<\/p>","hints":["把直线写成 $a x+b y+c\\cdot1=0$ 的形式。三直线有公共点 $(x_0,y_0)$ ⇔ 向量 $(x_0,y_0,1)^T$ 是齐次方程组的非零解。","系数矩阵 $\\begin{pmatrix}1&1&-3\\\\2&-1&0\\\\b&3&-7\\end{pmatrix}$ 有非零解 ⇒ 行列式为 0，按第一行展开。","行列式 $=1\\cdot(7-0)-1\\cdot(-14-0)+(-3)(6+b)=3-3b$，得 $b=1$。再验证 $b=1$ 时三条线确有公共点（前两条交于 $(1,2)$）。"],"sol":"<p><b>1. 改写成齐次形式：<\/b>三条直线写成 $$x+y-3\\cdot1=0,\\quad 2x-y+0\\cdot1=0,\\quad bx+3y-7\\cdot1=0.$$若它们有公共点 $(x_0,y_0)$，则 $(x_0,y_0,1)^T$ 是下面齐次方程组的解，并且是非零解（第三个分量为 1）：$$M\\begin{pmatrix}x\\\\y\\\\z\\end{pmatrix}=0,\\quad M=\\begin{pmatrix}1&1&-3\\\\2&-1&0\\\\b&3&-7\\end{pmatrix}.$$<\/p><p><b>2. 必要条件：<\/b>齐次方阵方程组有非零解 ⇒ $\\det M=0$。按第一行展开：$$\\det M=1\\cdot\\begin{vmatrix}-1&0\\\\3&-7\\end{vmatrix}-1\\cdot\\begin{vmatrix}2&0\\\\b&-7\\end{vmatrix}+(-3)\\begin{vmatrix}2&-1\\\\b&3\\end{vmatrix}=7+14-3(6+b)=3-3b.$$令 $3-3b=0$，得 $b=1$。<\/p><p><b>3. 充分性（必须检验）：<\/b>$\\det M=0$ 只说明有非零解，那个解的第三分量可能是 0，不一定对应一个点。所以直接检验：前两条 $x+y=3,\\ 2x-y=0$ 相加得 $3x=3$，交点 $(1,2)$；$b=1$ 时第三条 $1+3\\cdot2=7$ 成立。<\/p><p><b>结论：$b=1$，三直线共点于 $(1,2)$。<\/b><\/p>","method":"m-sy3"}]);
LESSONS.de2.extensions.push(...[{"id":"de2-border","lv":"练习","src":"自编同类练习","stmt":"<p>用倍加行变换求 $\\det\\begin{pmatrix}7&1&4\\\\2&2&0\\\\3&0&3\\end{pmatrix}$。<\/p>","hints":["第 2、3 行在第 2、3 列上已是对角形 $\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}$。想办法用它们把第一行第 2、3 列的数 1、4 消成 0。","$r_1-\\frac12r_2$ 消掉第 2 列的 1；$r_1-\\frac43r_3$ 消掉第 3 列的 4。这两步都不改变行列式。","第一行变为 $(7-1-4,\\ 0,\\ 0)=(2,0,0)$。按第一行展开：$2\\cdot\\begin{vmatrix}2&0\\\\0&3\\end{vmatrix}$。"],"sol":"<p><b>1. 消第一行：<\/b><\/p><ul><li>$r_1-\\frac12r_2$：$(7,1,4)-\\frac12(2,2,0)=(6,0,4)$；<\/li><li>再 $r_1-\\frac43r_3$：$(6,0,4)-\\frac43(3,0,3)=(2,0,0)$。<\/li><\/ul><p>两步都是“加另一行的倍数”，行列式不变：$$\\begin{vmatrix}7&1&4\\\\2&2&0\\\\3&0&3\\end{vmatrix}=\\begin{vmatrix}2&0&0\\\\2&2&0\\\\3&0&3\\end{vmatrix}.$$<\/p><p><b>2. 计算：<\/b>右边是下三角矩阵，等于对角元之积 $2\\cdot2\\cdot3=12$。<\/p><p><b>3. 检验（直接按第一行展开原式）：<\/b>$7(6-0)-1(6-0)+4(0-6)=42-6-24=12$ ✓。<\/p><p><b>结论：行列式为 12。<\/b><\/p>","method":"m-topic-de"}]);
LESSONS.de2.methods.push(...[{"id":"m-topic-de","title":"对角块造零","steps":["写明要用的“某行加另一行倍数”变换（不改变行列式）。","利用下方已是对角形的行，把第一行在这些列上的元素逐个消成 0。","第一行只剩一个非零元后按第一行展开，再乘下方对角元，并核对。"]}]);
LESSONS.ma2.extensions.push(...[{"id":"ma2-power","lv":"练习","src":"自编同类练习","stmt":"<p>令 $N=\\begin{pmatrix}0&2&0\\\\0&0&-1\\\\0&0&0\\end{pmatrix}$。不用行消元求 $(I-N)^{-1}$，给出逆矩阵条目。<\/p>","hints":["若 $N^k=0$，则 $(I-N)(I+N+\\cdots+N^{k-1})=I-N^k=I$，类似等比数列求和。先算 $N^2,N^3$。","$N=2E_{12}-E_{23}$，$N^2=(2E_{12})(-E_{23})=-2E_{13}$，$N^3=0$。（$E_{ij}E_{jk}=E_{ik}$，下标不衔接时乘积为 0。）","$(I-N)^{-1}=I+N+N^2$，把三个矩阵对应位置相加。"],"sol":"<p><b>思路：<\/b>类比 $\\frac1{1-x}=1+x+x^2+\\cdots$。若 $N^3=0$，则 $$(I-N)(I+N+N^2)=I+N+N^2-N-N^2-N^3=I-N^3=I.$$<\/p><p><b>1. 算幂：<\/b>$$N^2=\\begin{pmatrix}0&2&0\\\\0&0&-1\\\\0&0&0\\end{pmatrix}\\begin{pmatrix}0&2&0\\\\0&0&-1\\\\0&0&0\\end{pmatrix}=\\begin{pmatrix}0&0&-2\\\\0&0&0\\\\0&0&0\\end{pmatrix},$$（只有 $(1,3)$ 元非零：$2\\cdot(-1)=-2$。）$N^3=N^2N=0$（$N^2$ 唯一非零列在第 3 列，乘以 $N$ 的第 3 行全零）。<\/p><p><b>2. 求逆：<\/b>$$I+N+N^2=\\begin{pmatrix}1&2&-2\\\\0&1&-1\\\\0&0&1\\end{pmatrix}.$$左右两种乘法都给出 $I-N^3=I$（$N$ 与 $I+N+N^2$ 可交换），所以它是 $I-N$ 的逆。<\/p><p><b>3. 验算：<\/b>$(I-N)=\\begin{pmatrix}1&-2&0\\\\0&1&1\\\\0&0&1\\end{pmatrix}$，与上式相乘：第 1 行 $(1,\\ 2-2,\\ -2+2)=(1,0,0)$，第 2 行 $(0,1,-1+1)=(0,1,0)$，第 3 行 $(0,0,1)$。<\/p><p><b>结论：$(I-N)^{-1}=\\begin{pmatrix}1&2&-2\\\\0&1&-1\\\\0&0&1\\end{pmatrix}$。<\/b><\/p>","method":"m-ma2"}]);
LESSONS.sy1.extensions.push(...[{"id":"sy1-consistency","lv":"练习","src":"自编同类练习","stmt":"<p>令 $A=\\begin{pmatrix}1&0\\\\0&1\\\\1&-1\\end{pmatrix}$。判断对哪些 $(p,q,r)^T$，$Ax=(p,q,r)^T$ 有解，若有解是否唯一？<\/p>","hints":["写出三个方程：$x_1=p$，$x_2=q$，$x_1-x_2=r$。","前两个直接给出 $x$；第三个变成对右端的要求 $p-q=r$。","唯一性：齐次 $Ax=0$ 由前两行得 $x_1=x_2=0$，只有零解，所以有解时最多一个。"],"sol":"<p><b>1. 写方程：<\/b>$Ax=(p,q,r)^T$ 即 $$x_1=p,\\quad x_2=q,\\quad x_1-x_2=r.$$<\/p><p><b>2. 有解条件：<\/b>前两式确定 $x=(p,q)^T$，代入第三式需 $p-q=r$。<b>当且仅当 $r=p-q$ 时有解。<\/b><\/p><p><b>3. 唯一性：<\/b>齐次方程 $Ax=0$ 前两行给 $x_1=x_2=0$，只有零解（$r(A)=2=$ 未知量个数）。所以有解时<b>解唯一<\/b>，为 $x=(p,q)^T$。<\/p><p><b>例：<\/b>$(3,1,2)^T$ 满足 $3-1=2$，有唯一解 $(3,1)^T$；$(3,1,0)^T$ 不满足，无解。<\/p><p><b>提醒：<\/b>“列满秩”（秩 = 列数）只保证解最多一个，不保证每个右端都有解（3 个方程、2 个未知量，右端要满足约束）。<\/p>","method":"m-topic-systems"},{"id":"sy1-parameters","lv":"练习","src":"自编同类练习","stmt":"<p>讨论方程组 $x+y+z=a,\\ x+2y+z=3,\\ 2x+3y+2z=b$ 的相容性，并写相容时的通解。<\/p>","hints":["观察：第三个方程左边 $2x+3y+2z$ 正好是前两个左边之和。","所以必须 $b=a+3$，否则无解。成立时第三式多余，只解前两式：第二式减第一式得 $y=3-a$。","以 $z=t$ 为参数，$x=a-y-z=2a-3-t$。"],"sol":"<p><b>1. 消元：<\/b>$$\\left(\\begin{array}{ccc|c}1&1&1&a\\\\1&2&1&3\\\\2&3&2&b\\end{array}\\right)\\xrightarrow[r_3-2r_1]{r_2-r_1}\\left(\\begin{array}{ccc|c}1&1&1&a\\\\0&1&0&3-a\\\\0&1&0&b-2a\\end{array}\\right)\\xrightarrow{r_3-r_2}\\left(\\begin{array}{ccc|c}1&1&1&a\\\\0&1&0&3-a\\\\0&0&0&b-a-3\\end{array}\\right).$$<\/p><p><b>2. 相容性：<\/b>第三行是 $0=b-a-3$。<b>$b\\ne a+3$ 时无解；$b=a+3$ 时有解。<\/b><\/p><p><b>3. 通解（$b=a+3$）：<\/b>$r(A)=2$，自由变量 1 个，取 $z=t$。$y=3-a$；$x=a-y-z=a-(3-a)-t=2a-3-t$。$$\\begin{pmatrix}x\\\\y\\\\z\\end{pmatrix}=\\begin{pmatrix}2a-3\\\\3-a\\\\0\\end{pmatrix}+t\\begin{pmatrix}-1\\\\0\\\\1\\end{pmatrix},\\quad t\\in\\mathbb R.$$<\/p><p><b>4. 验证：<\/b>$x+y+z=2a-3-t+3-a+t=a$ ✓；$x+2y+z=2a-3-t+6-2a+t=3$ ✓；$2x+3y+2z=4a-6-2t+9-3a+2t=a+3=b$ ✓。<\/p>","method":"m-topic-systems"}]);
LESSONS.sy1.methods.push(...[{"id":"m-topic-systems","title":"看零行定相容，再写自由参数","steps":["分开看两件事：齐次方程 Ax=0 的解（决定解是否唯一），非齐次 Ax=b 是否有解。","消元后系数全为 0 的行，其右端必须为 0，这就给出参数的限制条件。","写出自由变量的参数表示，最后把通解代回原方程组每一条检验。"]}]);
LESSONS.ge1.extensions.push(...[{"id":"ge1-volume","lv":"练习","src":"自编同类练习","stmt":"<p>设 $u=(1,2,0),v=(0,1,1)$。分别判断 $w=(2,5,1)$ 与 $w'=(2,5,2)$ 是否和 $u,v$ 共面。若不共面，求平行六面体体积。<\/p>","hints":["先算 $u\\times v$，它是 $u,v$ 所在平面的法向量。","$u\\times v=(2\\cdot1-0\\cdot1,\\ 0\\cdot0-1\\cdot1,\\ 1\\cdot1-2\\cdot0)=(2,-1,1)$。分别与 $w$、$w'$ 点乘。","点积（混合积）为 0 则共面；不为 0 时，它的绝对值就是平行六面体体积。"],"sol":"<p><b>1. 法向量：<\/b>$u\\times v=(2\\cdot1-0\\cdot1,\\ 0\\cdot0-1\\cdot1,\\ 1\\cdot1-2\\cdot0)=(2,-1,1)$。<\/p><p><b>2. $w=(2,5,1)$：<\/b>$[u,v,w]=(2,-1,1)\\cdot(2,5,1)=4-5+1=0$，<b>共面<\/b>。（事实上 $w=2u+v$。）<\/p><p><b>3. $w'=(2,5,2)$：<\/b>$[u,v,w']=4-5+2=1\\ne0$，<b>不共面<\/b>，平行六面体体积 $|1|=$<b>$1$<\/b>。<\/p>","method":"m-topic-geo"}]);
LESSONS.ge1.methods.push(...[{"id":"m-topic-geo","title":"混合积判共面、求体积","steps":["判断 w 是否与 u、v 共面：先算 u×v（同时垂直于 u、v 的法向量）。","再算 (u×v)·w，即混合积。","混合积 = 0 则共面；≠ 0 则不共面，其绝对值就是平行六面体体积。"]}]);
LESSONS.ge2.extensions.push(...[{"id":"ge2-plane","lv":"练习","src":"自编同类练习","stmt":"<p>求平行平面 $2x+y-2z=6$ 与 $-6x-3y+6z=-30$ 的距离。说明为什么不能直接用原式右端的差。<\/p>","hints":["两个法向量 $(2,1,-2)$ 与 $(-6,-3,6)$ 成比例（差 $-3$ 倍），所以平行。先统一系数。","第二式两边除以 $-3$：$2x+y-2z=10$。","距离 $=\\frac{|10-6|}{\\|(2,1,-2)\\|}$，$\\|(2,1,-2)\\|=\\sqrt{4+1+4}=3$。"],"sol":"<p><b>1. 统一法向量：<\/b>第二式两边除以 $-3$：$2x+y-2z=10$。现在两平面为 $2x+y-2z=6$ 和 $2x+y-2z=10$，法向量都是 $n=(2,1,-2)$。<\/p><p><b>2. 距离：<\/b>$\\|n\\|=\\sqrt{4+1+4}=3$，$$\\text{距离}=\\frac{|10-6|}{3}=\\frac43.$$<\/p><p><b>3. 检验：<\/b>取第一个平面上的点 $(3,0,0)$，到第二个平面的距离 $\\frac{|2\\cdot3-10|}{3}=\\frac43$ ✓。<\/p><p><b>为什么不能直接用原式右端相减：<\/b>原来两式的法向量是 $(2,1,-2)$ 和 $(-6,-3,6)$，长度和方向都不同，右端 $6$ 与 $-30$ 不是在同一把“尺子”下量的。若直接算 $\\frac{|-30-6|}{3}=12$，就错了。<\/p><p><b>结论：距离为 $\\frac43$。<\/b><\/p>","method":"m-topic-planes"}]);

LESSONS.sp1.variants.push(
  {"id": "sp1-odd-operations", "lv": "变种", "src": "自编练习 · 运算检验", "stmt": "<p>在 $\\mathbb R$ 上令 $u\\oplus v=\\sqrt[3]{u^3+v^3}$，$\\lambda\\odot u=\\sqrt[3]{\\lambda}\\,u$。用 $T(u)=u^3$ 证明这是一维实线性空间，并写出零向量及 $2$ 在有序基 $(1)$ 中的坐标。若保留 $\\oplus$ 却改用普通数乘，给一个失败的公理和反例。</p>", "hints": ["用 $T(u)=u^3$ 把 ⊕、⊙ 翻译成普通运算，再搬公理。", "$T(u\\oplus v)=u^3+v^3=T(u)+T(v)$；$T(\\lambda\\odot u)=(\\sqrt[3]\\lambda\\,u)^3=\\lambda u^3=\\lambda T(u)$。求坐标就是解 $\\lambda\\odot1=2$。", "$\\lambda\\odot1=\\sqrt[3]\\lambda=2$，所以 $\\lambda=8$。改成普通数乘后，算 $(1+1)\\cdot1=2$ 与 $(1\\cdot1)\\oplus(1\\cdot1)=\\sqrt[3]{2}$，比较。"], "method": "m-topic-space", "sol": "<p><b>已知：</b>在 $\\mathbb R$ 上 $u\\oplus v=\\sqrt[3]{u^3+v^3}$，$\\lambda\\odot u=\\sqrt[3]\\lambda\\,u$。</p><p><b>1. 翻译成普通运算。</b>令 $T(u)=u^3$，它是 $\\mathbb R\\to\\mathbb R$ 的双射（逆为开立方）。计算：</p><ul><li>$T(u\\oplus v)=\\bigl(\\sqrt[3]{u^3+v^3}\\bigr)^3=u^3+v^3=T(u)+T(v)$；</li><li>$T(\\lambda\\odot u)=(\\sqrt[3]\\lambda\\,u)^3=\\lambda u^3=\\lambda T(u)$。</li></ul><p><b>2. 公理成立。</b>每条公理两边经 $T$ 后变成普通实数的等式。例如 $\\lambda\\odot(u\\oplus v)$ 的像是 $\\lambda(T(u)+T(v))$，$(\\lambda\\odot u)\\oplus(\\lambda\\odot v)$ 的像是 $\\lambda T(u)+\\lambda T(v)$，两者相等；$T$ 单射，所以原来两边相等。其他公理同样处理。零向量 $\\theta$ 满足 $T(\\theta)=0$，所以 $\\theta=0$。<b>它是实线性空间，零向量是 0。</b></p><p><b>3. 基与坐标。</b>对任意 $u$，$(u^3)\\odot1=\\sqrt[3]{u^3}\\cdot1=u$，并且这样的标量唯一（因为 $\\lambda\\odot1=\\sqrt[3]\\lambda$ 由 $\\lambda$ 唯一决定）。所以 $(1)$ 是一组基，<b>维数为 1</b>。$2=8\\odot1$（因为 $\\sqrt[3]8=2$），<b>2 的坐标是 $(8)$。</b></p><p><b>4. 改用普通数乘。</b>检验分配律 $(a+b)u=(au)\\oplus(bu)$，取 $a=b=1,\\ u=1$：左边 $(1+1)\\cdot1=2$；右边 $1\\oplus1=\\sqrt[3]{1+1}=\\sqrt[3]2\\ne2$。<b>“标量加法对数乘的分配律”不成立，不是线性空间。</b></p>"}
);
LESSONS.sp2.variants.push(
  {"id": "sp2-two-bases", "lv": "变种", "src": "自编练习 · 两个非标准有序基", "stmt": "<p>令 $\\mathcal B=((1,2)^T,(0,1)^T)$、$\\mathcal C=((2,1)^T,(1,1)^T)$。求 $P$ 使 $\\mathcal C=\\mathcal B P$。同一向量满足 $[v]_{\\mathcal B}=(3,-4)^T$，求 $[v]_{\\mathcal C}$，并在普通坐标中代回。</p>", "hints": ["$P$ 的第 $j$ 列是 $\\mathcal C$ 的第 $j$ 个向量在 $\\mathcal B$ 下的坐标。先求一般向量 $(x,y)^T$ 在 $\\mathcal B$ 下的坐标公式。", "$(x,y)^T=x(1,2)^T+(y-2x)(0,1)^T$，所以 $(2,1)^T$ 的坐标是 $(2,-3)^T$，$(1,1)^T$ 的坐标是 $(1,-1)^T$。", "旧坐标 = $P$ × 新坐标：设 $[v]_{\\mathcal C}=(s,t)^T$，解 $2s+t=3,\\ -3s-t=-4$。"], "method": "m-topic-coordinate", "sol": "<p><b>已知：</b>$\\mathcal B=((1,2)^T,(0,1)^T)$，$\\mathcal C=((2,1)^T,(1,1)^T)$，$[v]_{\\mathcal B}=(3,-4)^T$。</p><p><b>1. 在 $\\mathcal B$ 下求坐标的公式：</b>设 $(x,y)^T=a(1,2)^T+b(0,1)^T=(a,\\ 2a+b)^T$，得 $a=x$，$b=y-2x$。</p><p><b>2. 过渡矩阵 $P$：</b></p><ul><li>$(2,1)^T$：$a=2$，$b=1-4=-3$，坐标 $(2,-3)^T$；</li><li>$(1,1)^T$：$a=1$，$b=1-2=-1$，坐标 $(1,-1)^T$。</li></ul><p>按列排：$$P=\\begin{pmatrix}2&1\\\\-3&-1\\end{pmatrix},\\quad \\mathcal C=\\mathcal BP.$$</p><p><b>3. 新坐标：</b>由 $[v]_{\\mathcal B}=P[v]_{\\mathcal C}$，设 $[v]_{\\mathcal C}=(s,t)^T$：$$2s+t=3,\\qquad -3s-t=-4.$$两式相加得 $-s=-1$，$s=1$；代回 $t=3-2=1$。</p><p><b>4. 代回普通坐标：</b>用 $\\mathcal B$：$3(1,2)^T-4(0,1)^T=(3,2)^T$；用 $\\mathcal C$：$1\\cdot(2,1)^T+1\\cdot(1,1)^T=(3,2)^T$。两边一致。</p><p><b>结论：$P=\\begin{pmatrix}2&1\\\\-3&-1\\end{pmatrix}$，$[v]_{\\mathcal C}=(1,1)^T$，$v=(3,2)^T$。</b></p>"}
);
LESSONS.sp3.variants.push(
  {"id": "sp3-polynomial-intersection", "lv": "变种", "src": "自编练习 · 子空间的和与交（第18讲）", "stmt": "<p>在 $\\mathcal P_2(\\mathbb R)$ 中，设 $U=\\{p:p(0)=0\\}$、$W=\\{p:p(2)=0\\}$。求 $U\\cap W$ 与 $U+W$ 的基，并给出两个不同的分解 $p=u+w$ 来表示常数多项式 $1$。</p>", "hints": ["交：$p(0)=0$ 且 $p(2)=0$，由因式定理 $p$ 被 $t(t-2)$ 整除。和：看 $U$、$W$ 各含哪些简单多项式。", "$t,\\ t^2\\in U$，$t-2\\in W$。于是 $t-(t-2)=2\\in U+W$，常数也在和里。", "分解 1：$1=\\frac12t+\\bigl(1-\\frac12t\\bigr)$，检查 $\\frac12t$ 在 0 处为 0、$1-\\frac12t$ 在 2 处为 0。分解 2：给两项分别加、减交中元素 $r=t(t-2)$。"], "method": "m-sp3", "sol": "<p><b>已知：</b>$U=\\{p\\in\\mathcal P_2:p(0)=0\\}$，$W=\\{p\\in\\mathcal P_2:p(2)=0\\}$。</p><p><b>1. 交：</b>$p\\in U\\cap W\\iff p(0)=p(2)=0\\iff t$ 和 $t-2$ 都是因式 $\\iff p=c\\,t(t-2)$（$p$ 次数 ≤2，商只能是常数 $c$）。<b>交的基：$t(t-2)=t^2-2t$，维数 1。</b></p><p><b>2. 和：</b>$t,\\ t^2\\in U$；$t-2\\in W$。所以 $U+W$ 含 $t,\\ t^2$ 和 $t-(t-2)=2$，也就含 $1$。于是 $U+W\\supseteq L(1,t,t^2)=\\mathcal P_2$，<b>和的基可取 $1,t,t^2$，$U+W=\\mathcal P_2$。</b>（核对：$\\dim U=\\dim W=2$，$2+2-1=3$。）</p><p><b>3. 两种分解：</b></p><ul><li>$1=\\frac12t+\\bigl(1-\\frac12t\\bigr)$：$\\frac12t$ 在 0 处为 0，属于 $U$；$1-\\frac12t$ 在 2 处为 $1-1=0$，属于 $W$。</li><li>记 $r=t(t-2)$，它既在 $U$ 又在 $W$。$1=\\bigl(\\frac12t+r\\bigr)+\\bigl(1-\\frac12t-r\\bigr)$：第一项在 0 处为 0，第二项在 2 处为 0。</li></ul><p>$r\\ne0$，两种分解不同，所以 $\\mathcal P_2=U+W$ 但不是直和。</p>"}
);

/* ================= 状态与存储 ================= */
const IN_CLAUDE = false;
const LS_KEY = "la1-progress-v1";
const RECORD_PREFIX = LS_KEY + ":";
let db = null;
const chains = Object.create(null);
const state = Object.create(null);
function readProgress(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value && typeof value === "object" && !Array.isArray(value) ? value : null;
  } catch (e) { return null; }
}
function progressTime(record) {
  const time = Number(record?.updatedAt);
  return Number.isFinite(time) ? time : 0;
}
function adoptProgress(id, record, preferStored = false) {
  if (!record || typeof record !== "object" || Array.isArray(record)) return;
  const old = state[id];
  const time = progressTime(record);
  if (!old || time > progressTime(old) || (preferStored && time === progressTime(old))) state[id] = record;
}
function readLocalRecord(id) {
  if (!IN_CLAUDE) adoptProgress(id, readProgress(RECORD_PREFIX + id), true);
}
function readLocalProgress() {
  for (const [id, record] of Object.entries(readProgress(LS_KEY) || {})) adoptProgress(id, record);
  if (IN_CLAUDE) return;
  // 原进度键作为兼容来源。每次只写自己的题，旧标签页不会盖掉其他题。
  try {
    for (const key of Object.keys(localStorage)) {
      if (key.startsWith(RECORD_PREFIX)) readLocalRecord(key.slice(RECORD_PREFIX.length));
    }
  } catch (e) {}
}
readLocalProgress();
function cacheLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function putRecord(id, record) {
  state[id] = record;
  if (!IN_CLAUDE) {
    try { localStorage.setItem(RECORD_PREFIX + id, JSON.stringify(record)); } catch (e) {}
  }
  if (db) {
    chains[id] = (chains[id] || Promise.resolve()).then(() => db.doc("progress/" + id).set(record)).catch(() => {});
  }
}
function save(id, patch) {
  readLocalRecord(id);
  const old = state[id];
  putRecord(id, { ...old, ...patch, updatedAt: Math.max(Date.now(), progressTime(old) + 1) });
  if (IN_CLAUDE) cacheLocal();
  if (!Object.hasOwn(patch, "answer")) refreshNavProgress();
}
function setSync(on, text) {
  const el = document.getElementById("sync");
  el.classList.toggle("on", on);
  el.querySelector("span").textContent = text;
}

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* 行内公式比所在段落还宽时（手机上常见），改成可横向滑动的独立一行，避免撑宽整页 */
function fixWide(root) {
  root.querySelectorAll("mjx-container:not([display])").forEach(c => {
    c.classList.remove("wide-math");
    let host = c.parentElement;
    while (host && host !== root && getComputedStyle(host).display.startsWith("inline") && !/^(BUTTON)$/.test(host.tagName)) host = host.parentElement;
    if (host && host.clientWidth > 0 && c.getBoundingClientRect().width > host.clientWidth + 1) c.classList.add("wide-math");
  });
}
document.addEventListener("toggle", e => { if (e.target.open) fixWide(e.target); }, true);
let wideTimer;
window.addEventListener("resize", () => { clearTimeout(wideTimer); wideTimer = setTimeout(() => fixWide(document.getElementById("view")), 200); });
function typeset(el, after) {
  if (!el.isConnected) return;
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([el]).then(() => {
      if (!el.isConnected) return;
      fixWide(el);
      if (after) after();
    }).catch(() => {});
  } else {
    setTimeout(() => typeset(el, after), 300);
  }
}
function textOf(html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.replace(/\s+\n/g, "\n").trim(); }
function allItems(L) { return [...L.problems, ...L.variants, ...L.extensions]; }
function lessonStats(lid) {
  const L = LESSONS[lid];
  const items = allItems(L);
  const core = L.problems;
  const doneCore = core.filter(p => ["solved", "partial", "failed"].includes((state[p.id] || {}).status)).length;
  const concepts = L.concepts.filter(c => (state[c.id] || {}).picked != null).length;
  return { total: core.length + L.concepts.length, done: doneCore + concepts, finished: !!(state["lesson-" + lid] || {}).done, items };
}

/* ================= 导出 ================= */
function buildMarkdown() {
  let md = "# 线性代数期末冲刺：我的作答\n";
  for (const [lid, L] of Object.entries(LESSONS)) {
    md += `\n## 第 ${L.n} 课 ${textOf(L.title)}\n`;
    const wrongC = L.concepts.filter(c => state[c.id] && state[c.id].picked != null && state[c.id].picked !== c.a);
    if (wrongC.length) md += `\n概念题答错：${wrongC.map(c => c.id).join("、")}\n`;
    for (const p of allItems(L)) {
      const r = state[p.id] || {};
      if (!r.answer && !r.status) continue;
      md += `\n### ${p.id}（${p.lv} · ${p.src}）\n**题目**：${textOf(p.stmt)}\n\n**状态**：${statusLabel(r.status)}，用了 ${r.hints || 0} 层提示${r.sawSol ? "，看过解答" : ""}\n\n**我的作答**：\n${r.answer || "（未写）"}\n`;
      if (r.feedback) md += `\n**作答反馈**：\n${r.feedback}\n`;
    }
  }
  return md;
}

const META_KEY = "la1-meta-v1";

function mergeIn(obj) {

  if (!IN_CLAUDE) readLocalProgress();
  let added = 0, updated = 0, kept = 0;
  for (const [id, inc] of Object.entries(obj.state)) {

    readLocalRecord(id);
    const cur = state[id];
    if (!cur) { putRecord(id, inc); added++; }

}
function b64FromBytes(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

async function encodeCode(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) {
    const gz = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
    return "GW1z." + b64FromBytes(gz);
  }
  return "GW1." + b64FromBytes(bytes);
}
async function decodeCode(code) {
  code = code.replace(/\s+/g, "");
  let bytes;
  if (code.startsWith("GW1z.")) {
    if (!window.DecompressionStream) throw new Error("这个浏览器太旧，解不开压缩的同步码");
    bytes = new Uint8Array(await new Response(new Blob([bytesFromB64(code.slice(5))]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  } else if (code.startsWith("GW1.")) bytes = bytesFromB64(code.slice(4));
  else throw new Error("同步码应以 GW1 开头，请完整复制");
  return JSON.parse(new TextDecoder().decode(bytes));
}

const laGcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1;};

  let k=row;while(k<a.length&&a[k][col][0]===0)k++;if(k===a.length)continue;
  if(k!==row){[a[k],a[row]]=[a[row],a[k]];record(`交换 R${row+1} 与 R${k+1}`);}
  const pivot=a[row][col];if(pivot[0]!==pivot[1]){a[row]=a[row].map(x=>laDiv(x,pivot));record(`R${row+1} 除以 ${laText(pivot)}`);}

function projectionLab(mount){
 mount.innerHTML=`<div class="widget"><div class="ctrl">${[['ux',1],['uy',1],['vx',2],['vy',0]].map(([k,v])=>`<label for="pj-${k}">${k} <input id="pj-${k}" type="number" min="-4" max="4" value="${v}"></label>`).join('')}<button class="btn" id="pj-zero">测试u=0</button><button class="btn" id="pj-reset">重置</button></div><div id="pj-svg"></div><p class="readout" id="pj-out" aria-live="polite"></p><p class="small muted">在欧氏平面中把v分为span{u}上的投影p与垂直残差r。数值显示四舍五入；一般结论用内积定义证明。此处是正交分解演示，最小二乘补充见eu2。</p></div>`;
 const inputs=['ux','uy','vx','vy'].map(k=>mount.querySelector('#pj-'+k));
 function draw(){const out=mount.querySelector('#pj-out'),svg=mount.querySelector('#pj-svg');if(inputs.some(x=>x.value===''||!Number.isFinite(+x.value)||Math.abs(+x.value)>4)){out.textContent='每个分量请输入−4到4的有限实数。';svg.textContent='';return;}const[a,b,x,y]=inputs.map(x=>+x.value),norm=a*a+b*b;if(norm===0){out.textContent='u=0时span{u}={0}，投影p=0、残差r=v；不能除以u·u。';svg.textContent='零子空间没有非零方向向量。';return;}const t=(a*x+b*y)/norm,px=t*a,py=t*b,rx=x-px,ry=y-py,X=x=>200+30*x,Y=y=>200-30*y;const lineScale=5/Math.sqrt(norm);svg.innerHTML=`<svg viewBox="0 0 400 400" style="width:100%;max-width:400px" role="img" aria-label="正交投影和垂直残差"><path d="M20 200H380M200 20V380" stroke="var(--line)"/><line x1="${X(-a*lineScale)}" y1="${Y(-b*lineScale)}" x2="${X(a*lineScale)}" y2="${Y(b*lineScale)}" stroke="var(--muted)"/><path d="M200 200L${X(x)} ${Y(y)}" stroke="var(--ink)" stroke-width="3"/><path d="M200 200L${X(px)} ${Y(py)}L${X(x)} ${Y(y)}" stroke="var(--accent)" fill="none" stroke-width="3" stroke-dasharray="7 4"/><circle cx="${X(px)}" cy="${Y(py)}" r="5" fill="var(--accent)"/></svg>`;out.textContent=`p=(${px.toFixed(4)},${py.toFixed(4)})；r=(${rx.toFixed(4)},${ry.toFixed(4)})；u·r=${(a*rx+b*ry).toFixed(8)}；||v||²−||p||²−||r||²=${(x*x+y*y-px*px-py*py-rx*rx-ry*ry).toFixed(8)}`;}
 inputs.forEach(x=>x.oninput=draw);mount.querySelector('#pj-zero').onclick=()=>{inputs[0].value='0';inputs[1].value='0';draw();};mount.querySelector('#pj-reset').onclick=()=>{inputs.forEach((x,i)=>x.value=[1,1,2,0][i]);draw();};draw();
}
function spectralLab(mount){
 mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="eg-angle">旋转θ <input id="eg-angle" type="range" min="0" max="180" value="30"></label><label for="eg-a">λ₁ <input id="eg-a" type="number" min="-3" max="3" value="2"></label><label for="eg-b">λ₂ <input id="eg-b" type="number" min="-3" max="3" value="1"></label><button class="btn" id="eg-repeat">重特征值</button></div><div id="eg-svg"></div><p class="readout" id="eg-out" aria-live="polite"></p><p class="small muted">A=Q diag(λ₁,λ₂) Qᵀ。紫线与绿线是两条单位特征方向；浅色曲线是单位圆经过A后的像，允许负特征值及退化。重特征值时矩阵为λI，特征方向不唯一。</p></div>`;
 const angle=mount.querySelector('#eg-angle'),ai=mount.querySelector('#eg-a'),bi=mount.querySelector('#eg-b');
 function draw(){const a=Number(ai.value),b=Number(bi.value),out=mount.querySelector('#eg-out'),svg=mount.querySelector('#eg-svg');if(ai.value===''||bi.value===''||![a,b].every(Number.isFinite)||Math.abs(a)>3||Math.abs(b)>3){out.textContent='特征值请输入−3到3的有限实数。';svg.textContent='';return;}const th=+angle.value*Math.PI/180,c=Math.cos(th),s=Math.sin(th),A=a*c*c+b*s*s,B=(a-b)*c*s,D=a*s*s+b*c*c,X=x=>200+45*x,Y=y=>200-45*y;const pts=Array.from({length:181},(_,i)=>{const t=i*Math.PI/90,x=Math.cos(t),y=Math.sin(t);return X(A*x+B*y)+','+Y(B*x+D*y);}).join(' ');svg.innerHTML=`<svg viewBox="0 0 400 400" style="width:100%;max-width:400px" role="img" aria-label="实对称矩阵的特征方向"><path d="M20 200H380M200 20V380" stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="var(--muted)" stroke-width="2"/><path d="M${X(-c)} ${Y(-s)}L${X(c)} ${Y(s)}" stroke="var(--accent)" stroke-width="4"/><path d="M${X(s)} ${Y(-c)}L${X(-s)} ${Y(c)}" stroke="var(--good)" stroke-width="4"/></svg>`;out.textContent=`θ=${angle.value}°；A=[${A.toFixed(4)}, ${B.toFixed(4)}; ${B.toFixed(4)}, ${D.toFixed(4)}]；迹=${(a+b).toFixed(4)}，行列式=${(a*b).toFixed(4)}。${a===b?'重根：任何标准正交基都是特征基。':'两条特征方向正交。'}`;}
 angle.oninput=draw;ai.oninput=draw;bi.oninput=draw;mount.querySelector('#eg-repeat').onclick=()=>{bi.value=ai.value;draw();};draw();
}
function quadraticLab(mount){
 mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="qu-t">参数t <input id="qu-t" type="range" min="-3" max="3" step="0.25" value="1"></label><button class="btn" id="qu-boundary">令t=2</button></div><p>q=2x²+2txy+2y²+z²；顺序主子式：2、4−t²、4−t²。</p><div id="qu-svg"></div><p class="readout" id="qu-out" aria-live="polite"></p><p class="small muted">图在z=0截面上用射线颜色表示各单位圆方向的q符号；紫/红射线分别表示非负/负取值，定长射线不编码取值大小。一般分类依靠特征值2+t、2−t、1，而非从图形外观判断。</p></div>`;
 const slider=mount.querySelector('#qu-t');function draw(){const t=+slider.value,values=[2+t,2-t,1],pos=values.filter(v=>v>0).length,neg=values.filter(v=>v<0).length,zero=values.filter(v=>v===0).length,X=x=>180+115*x,Y=y=>180-115*y;let lines='';for(let i=0;i<72;i++){const a=i*Math.PI/36,x=Math.cos(a),y=Math.sin(a),q=2+2*t*x*y;lines+=`<line x1="180" y1="180" x2="${X(x)}" y2="${Y(y)}" stroke="${q<0?'var(--bad)':'var(--accent)'}" opacity="${q<0?1:0.25}"/>`;}mount.querySelector('#qu-svg').innerHTML=`<svg viewBox="0 0 360 360" style="width:100%;max-width:360px" role="img" aria-label="二次型在单位圆方向上的符号"><circle cx="180" cy="180" r="115" fill="none" stroke="var(--line)"/>${lines}<text x="20" y="330" fill="var(--ink)">方向(1,1)/√2：${2+t}；(1,−1)/√2：${2-t}</text></svg>`;mount.querySelector('#qu-out').textContent=`t=${t}；特征值${values.join('、')}；惯性(正,负,零)=(${pos},${neg},${zero})；${neg?'不定':zero?'非负但不正定（奇异）':'正定'}。`;}slider.oninput=draw;mount.querySelector('#qu-boundary').onclick=()=>{slider.value='2';draw();};draw();
}

function examClock(mount){
 const id='clock-'+currentView,total=7200;
 mount.innerHTML=`<div class="widget"><p class="small muted">本地计时，不会自动交卷；离开页面后仍按实际经过时间计算，暂停可停止累计。</p><div class="readout" id="exam-time" aria-live="off"></div><div class="row"><button class="btn primary" id="exam-toggle" type="button">开始计时</button><button class="btn" id="exam-reset" type="button">重置为120分钟</button></div></div>`;
 const storedClock=()=>({elapsed:0,startedAt:0,running:false,...state[id]});
 let clock=storedClock();
 const used=()=>Math.min(total,Math.max(0,clock.elapsed+(clock.running?(Date.now()-clock.startedAt)/1000:0)));
 function draw(){if(!mount.isConnected)return;clock=storedClock();const remain=Math.max(0,Math.ceil(total-used())),m=Math.floor(remain/60),s=remain%60;mount.querySelector('#exam-time').textContent=remain?`剩余 ${m}:${String(s).padStart(2,'0')} / 120:00`:'时间到。请先停止作答，再打开解答评分。';mount.querySelector('#exam-toggle').textContent=clock.running?'暂停计时':used()?'继续计时':'开始计时';}
 mount.querySelector('#exam-toggle').addEventListener('click',()=>{readLocalRecord(id);clock=storedClock();if(clock.running)clock={...clock,elapsed:used(),running:false,startedAt:0};else clock={...clock,running:true,startedAt:Date.now()};save(id,clock);draw();});
 mount.querySelector('#exam-reset').addEventListener('click',()=>{clock={elapsed:0,startedAt:0,running:false};save(id,clock);draw();});
 function tick(){if(!mount.isConnected)return;draw();setTimeout(tick,1000);}draw();setTimeout(tick,1000);
}

/* ================= 题源与选题核对 ================= */
function examMapRows() {
  return EXAM_MAP.map(([topic, cells, count, note]) => `<tr><th scope="row">${esc(topic)}${note ? `<div class="small muted">${esc(note)}</div>` : ""}</th>${cells.map(value => `<td class="yr">${value === null ? '<span title="该资料不完整，不能判断未出现">?</span>' : value ? '<span class="dot" title="已核到此考点"></span>' : '<span class="no" title="本份已核资料未出现">·</span>'}</td>`).join("")}<td>${count}/${cells.filter(x => x !== null).length}</td></tr>`).join("");
}
function viewExamAudit() {
  const levels = { exact: "原题已覆盖", method: "方法已覆盖", added: "本轮已补齐", partial: "部分题面待核", gap: "待补", unknown: "题面待核" };
  const counts = {};
  let questions = 0;
  for (const exam of EXAM_AUDIT) for (const q of exam.questions) { questions++; counts[q.level] = (counts[q.level] || 0) + 1; }
  const stats = Object.entries(levels).filter(([k]) => counts[k]).map(([k, label]) => label + " " + counts[k]).join(" · ");
  const papers = EXAM_AUDIT.map(exam => {
    const links = q => (q.refs || []).map(ref => {
      const target = ref.problemId ? "p-" + ref.problemId : ref.sectionId || ref.methodId;
      const route = ref.lessonId + (target ? "/" + target : "");
      return `<a href="#${esc(route)}">${esc(ref.problemId || ref.sectionId || ref.methodId || ref.lessonId)}</a>`;
    }).join("、");
    const rows = exam.questions.map(q => `<tr><th scope="row">${esc(q.id)}${q.page ? `<div class="small muted">${esc(q.page)}</div>` : ""}</th><td><p>${esc(q.summary)}</p><p class="small muted">${esc(q.topics.join("、"))}</p>${q.risk ? `<p class="callout warn">题面或参考解风险：${esc(q.risk)}</p>` : ""}</td><td><b>${levels[q.level] || esc(q.level)}</b><p>${links(q) || "暂无可靠定位"}</p>${q.note ? `<p class="small muted">${esc(q.note)}</p>` : ""}</td></tr>`).join("");
    return `<details class="block exam-audit"><summary><b>${esc(exam.label)}</b> · ${exam.questions.length} 条核对记录</summary><div class="prose"><p>${esc(exam.sourceNote)}</p><p class="small muted">${exam.inFrequency ? "计入考点地图；同卷多份文件只计一次。" : "仅核本轮所选训练题；未计算年度频率。"}</p><div class="table-wrap"><table><thead><tr><th>题号 / 页码</th><th>题意与考点摘要</th><th>当前页面覆盖与去向</th></tr></thead><tbody>${rows}</tbody></table></div></div></details>`;
  }).join("");
  return `<section class="stack"><span class="eyebrow">来源与覆盖审计</span><h1>题源与选题核对</h1><p class="lede">${esc(EXAM_AUDIT_META.scope)}</p><p>${EXAM_AUDIT.length} 组去重来源 · ${questions} 条题目 / 小问记录</p><p class="small">${esc(stats)}</p></section><section class="block prose"><p>“方法已覆盖”表示相应解题方法在课内已有讲解或训练，未必逐字收录该题。“原题已覆盖”指下列选题在课程中直接有对应训练，自编加问会注明。未列题目不代表未考，本页不是完整逐题覆盖所有外部卷的声明。</p><p>本轮未计算年度频率；相关旧卷与期中样题仅作参考，不用于预测本学期出题概率。${esc(EXAM_AUDIT_META.rangeNote)}</p></section>${papers}`;
}

render();
