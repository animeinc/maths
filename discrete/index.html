"problems":[
{"id":R`dplus2-p1`,"lv":R`真题`,"src":R`2015 秋期末 3；2016 手写回忆 5；2019晚年卷gcd同型`,"stmt":R`证明：k>2、n≥0时，F_k|F_n当且仅当k|n。并求gcd(F₉₉,F₂₀₂₃)。`,"hints":[R`先证明强gcd等式。`,R`gcd(99,2023)=gcd(99,43)=gcd(43,13)=gcd(13,4)=1。`,R`F_k=F_gcd(k,n)，利用k>2的严格增长。`],"sol":R`<p>强gcd等式由本课第一节给出，n=0时gcd(k,0)=k，且任意非零F_k都整除F₀=0，与k|0一致。n>0时，若k|n，gcd(F_k,F_n)=F_k，故整除。若F_k|F_n，则F_k=F_gcd(k,n)；因k>2且Fibonacci在指标≥2后严格增长，只能gcd(k,n)=k。另gcd(99,2023)=1，所以所求gcd=F₁=1。</p>`,"method":R`m-dplus2`},
{"id":R`dplus2-p2`,"lv":R`真题`,"src":R`2017 秋期末 4（Weinstein）`,"stmt":R`从F₁,…,F₂ₙ中选取n+1个不同下标对应的数，证明其中有一个数整除另一个。`,"hints":[R`把选取的下标分解成奇部×2^幂。`,R`奇部只有1,3,…,2n−1共n种。`,R`两个下标具有相同奇部，整除性再转到Fibonacci。`],"sol":R`<p>把每个选定下标j唯一写成u2ᵃ，u为奇数。u最多有n种取值，n+1个不同下标中两个奇部相同。设i=u2ᵃ、j=u2ᵇ且a<b，则i|j，故F_i|F_j。即使F₁=F₂数值相同，题目仍按不同下标选取；相等的正数当然互相整除。</p>`,"method":R`m-dplus2`},
{"id":R`dplus2-p3`,"lv":R`真题`,"src":R`2015 秋期末 9（英文转录）`,"stmt":R`求所有使F_n个位数字与n个位数字相同的非负整数n。`,"hints":[R`用相邻对在模10下找周期。`,R`首次回到(0,1)在60步，因此检查n=0,…,59即可。`,R`满足的余数有14个，工具可逐项核对。`],"sol":R`<p>递推模10的60步表可逐项复算，首次回到(0,1)在第60步；同时n mod10也以60为周期，所以完整解为</p>$$n\equiv0,1,5,13,17,25,29,30,35,37,41,49,53,55\pmod{60}.$$
<p>若只问正指标，排除n=0本身，但60、120等仍保留。用状态递推检查一个完整周期保证没有漏解，不是从少数项猜规律。</p>`,"method":R`m-dplus2`}
],

{"id":R`dplus2-v1`,"lv":R`变种`,"src":R`自编：强gcd可用于所有指标`,"stmt":R`求gcd(F₈₄,F₁₂₆)，并解释为什么F₂|F₃不能推出2|3。`,"hints":[R`gcd(84,126)=42。`,R`强gcd给F₄₂，无需计算两个大整数。`,R`F₂=1。`],"sol":R`<p>答案F₄₂=267914296。F₂=1整除所有整数，包括F₃=2；但2不整除3，所以反向整除判定必须保留k>2。</p>`,"method":R`m-dplus2`}

"title":R`数论补漏：筛法、平方同余与余数抽屉`,
"goal":R`补齐史灵生2019、2022卷中的独立方法：容斥筛素数、二次同余配方、按余数分类。30分钟主线做三题；RSA、欧拉函数方程等资料题作选做，不据异班题源推定本学期必考。`,
"sections":[
{"id":R`dplus3-s1`,"h":R`1. 容斥筛法：留下的不全是素数`,"html":R`<p>整数 $2\le n\lt99$ 若合数，必有不大于 $\sqrt{98}$ 的素因子，因此必被 $2,3,5,7$ 中一个整除。容斥先数 $1,\ldots,98$ 中不被这四个数整除的数。</p><p>这个剩余集合含1，却不含筛基素数2、3、5、7。所以“素数个数”还要<b>减1、加4</b>。交集是公倍数：筛基两两互素时用乘积，一般必须用最小公倍数。</p>`},
{"id":R`dplus3-s2`,"h":R`2. 平方同余：素数模与合数模不能混用`,"html":R`<p>先配方：$x^2-8x\equiv1\pmod m$ 等价于 $(x-4)^2\equiv17\pmod m$。模17时是平方为0；由素数整除乘积，$17\mid(x-4)^2$ 推出 $17\mid x-4$。</p><p>模8时原式直接化为 $x^2\equiv1$。奇数平方都为1模8，偶数平方为0或4，故有四个剩余类，不能套“至多两个根”。合数模有零因子，例如 $3\cdot2\equiv0\pmod6$，两个因子却均不为0模6。</p>`},
{"id":R`dplus3-s3`,"h":R`3. 余数抽屉：先看某类能否独自完成`,"html":R`<p>五个整数按模3分成三类。如果某类至少3个，取这类的3个就得到和为0模3。若每类至多2个，总共5个迫使三类都非空，于是每类取一个，余数和 $0+1+2\equiv0$。</p><p>不是所有余数题都只比较“物体数大于抽屉数”；有时需将“某抽屉太多”与“每抽屉都不太多”分情况。题目要求恰好取3个，不能用只保证任意非空子集的部分和定理代替。</p>`}
],

"problems":[
{"id":R`dplus3-p1`,"src":R`2019秋期末·史灵生 3（照片原卷）`,"stmt":R`用容斥筛法计算小于99的素数个数。`,"hints":[R`筛2、3、5、7的倍数；范围从1到98。`,R`单项个数49、32、19、14；两两交集16、9、7、6、4、2；三重交集3、2、1、0。`,R`筛后为98−114+44−6=22，再减1加4。`],"method":R`m-prime-sieve`,"sol":R`<p>记A_p为1到98内p的倍数。容斥得不被2、3、5、7整除的数有$98-(49+32+19+14)+(16+9+7+6+4+2)-(3+2+1+0)=22$个（四重交集为空）。其中1不是素数；2、3、5、7这4个素数被筛掉。每个其余合数必有上述筛基因子，已被删去。故素数共$22-1+4=25$个。</p>`,"lv":R`真题`},
{"id":R`dplus3-p2`,"src":R`2019秋期末·史灵生 4(a)(b)（照片原卷）`,"stmt":R`分别解 $x^2-8x\equiv1\pmod{17}$ 与 $x^2-8x\equiv1\pmod8$。`,"hints":[R`第一式配成(x−4)²≡0(mod17)。`,R`17是素数，因此x≡4(mod17)。`,R`模8时−8x消失；逐个奇偶剩余类检查平方。`],"method":R`m-square-congruence`,"sol":R`<p>模17：$(x-4)^2=x^2-8x+16\equiv17\equiv0$，由17为素数得$x\equiv4\pmod{17}$，反代$16-32=-16\equiv1$。</p><p>模8：等价于$x^2\equiv1$。若x=2k+1，则$x^2=4k(k+1)+1\equiv1$，因为k(k+1)为偶数。若x偶，平方模8为0或4。故全部解为$x\equiv1,3,5,7\pmod8$。</p>`,"lv":R`真题`},
{"id":R`dplus3-p3`,"src":R`2022秋期末·史灵生 2`,"stmt":R`证明：任给五个整数，可以选出其中三个，使其和被3整除。`,"hints":[R`按模3分成三类。`,R`某类有至少3个时，取同类三个。`,R`否则每类至多2个；五个数迫使三类都非空，各取一个。`],"method":R`m-residue-cases`,"sol":R`<p>若某余数类至少3个，取这类三个，余数和为3r，能被3整除。若各类至多2个，则三类都非空，否则总数最多4。于是从余数0、1、2类各取一个，其和余数为3，仍被3整除。两种情况覆盖所有分布，且都恰好选3个。</p>`,"lv":R`真题`}
],

{"id":R`dplus3-v1`,"src":R`2022秋期末·史灵生 4`,"stmt":R`设整数a,b,c,d满足 $a-c\mid ab+cd$，证明 $a-c\mid ad+bc$。`,"hints":[R`比较两个被整除表达式的差。`,R`$(ab+cd)-(ad+bc)=(a-c)(b-d)$。`,R`整除线性组合，不需要对a−c作除法。`],"method":R`m-residue-cases`,"sol":R`<p>由恒等式$ad+bc=(ab+cd)-(a-c)(b-d)$，右边两项都被a−c整除，故结论成立。论证未擅自约去a−c。若课程整除定义要求除数非零，则沿用题设隐含a−c非零；若采用0只整除0的约定，此恒等式对a=c仍直接成立。</p>`,"lv":R`变种`},
{"id":R`dplus3-v2`,"src":R`2024复习手稿第4页题4(1)–(3)（资料题，非2024原卷）`,"stmt":R`<p>(1) 证明a有模m乘法逆元当且仅当(a,m)=1，并叙述Euler定理。</p><p>(2) p、q为不同素数，N=pq，正整数d,e满足 $de\equiv1\pmod{\varphi(N)}$。证明对每个整数u，$u^{de}\equiv u\pmod N$，即使(u,N)不为1。</p>`,"hints":[R`(1)逆元给ax−my=1；反向用Bezout。`,R`(2)分别模p和模q：若p整除u直接成立，否则用Fermat。`,R`p−1与q−1都整除φ(N)=(p−1)(q−1)，最后用CRT合并。`],"method":R`m-square-congruence`,"sol":R`<p>(1) 有逆元即存在ax≡1(modm)，所以公因子必须整除1；反之由Bezout构造逆元。Euler定理为(a,m)=1时a^{φ(m)}≡1(modm)，证明见n2。</p><p>(2) 写de=1+k(p−1)(q−1)。模p：若p|u，则两边均0；若p不整除u，Fermat给u^{p−1}≡1，故u^{de}≡u。同理模q成立。因p、q互素，CRT推出模pq成立。不能对非单位u直接套Euler；必须逐素因子分情况。</p>`,"lv":R`变种`}
],
"extensions":[
{"id":R`dplus3-e1`,"src":R`2024复习手稿第4页补充（资料题）`,"stmt":R`求所有满足 $\varphi(n)=n/2$（n≥2）的n，以及满足 $\varphi(n)=n/3$（n≥6）的n。`,"hints":[R`用n/φ(n)=∏p/(p−1)，只与不同素因子有关。`,R`若目标比值为c，得∏p=c∏(p−1)。最大素因子若大于c，则左边含p而右边每个因子均小于p，不可能被p整除。`,R`c=2只可能素因子2；c=3只可能2、3，检查子集。`],"method":R`m-square-congruence`,"sol":R`<p>设n的不同素因子为p_i。第一式等价于$\prod p_i=2\prod(p_i-1)$。若最大素因子p>2，右端的2与各p_i−1均不被p整除，矛盾；故n只能为2^r，r≥1，反之都成立。</p><p>第二式为$\prod p_i=3\prod(p_i-1)$。同理最大素因子不超过3，只可能2、3。仅含2的比值为2，仅含3的比值为3/2，均不对；同时含2、3时比值为3。因此恰为$n=2^r3^s$，r,s≥1。</p>`,"lv":R`延伸`},
{"id":R`dplus3-e2`,"src":R`史灵生2019考前辅导 §3.2–3.4（自编合并核对）`,"stmt":R`<p>(1) 非完全平方的正整数n的平方根为何无理？</p><p>(2) 素数p、$0\lt k\lt p$时，证明p整除C(p,k)。</p><p>(3) $n\gt2$时，求$1\le a\lt n$且(a,n)=1的所有a之和。</p>`,"hints":[R`(1)最简分数平方后用素因子指数奇偶。`,R`(2)k! C(p,k)=p(p−1)…(p−k+1)，且p与k!互素。`,R`(3)将a与n−a配对，它们都与n互素；无固定点，因为n>2。`],"method":R`m-square-congruence`,"sol":R`<p>(1) 若√n=a/b为最简正分数，则a²=nb²。素因子分解表明每个素数在n中的指数都为偶数，n是完全平方，矛盾。</p><p>(2) 右端乘积被p整除而k!不被p整除，由Euclid引理，p整除C(p,k)。</p><p>(3) 映射a↦n−a置换所有可逆剩余类，每对和n。若a=n−a，则a=n/2，n>2时与n不互素，故无固定点。共φ(n)/2对，和为$n\varphi(n)/2$。</p>`,"lv":R`延伸`},
{"id":R`dplus3-e3`,"src":R`2024复习手稿第2–3页（资料题）`,"stmt":R`<p>(1) $ad-bc\equiv1\pmod m$，解 $ax+by\equiv1$、$cx+dy\equiv2\pmod m$。</p><p>(2) 求7模163的逆元，并解 $2x+3y\equiv5$、$3x+8y\equiv7\pmod{163}$。</p><p>(3) 求使 $2^d\equiv1\pmod{53}$ 的最小正整数d。</p>`,"hints":[R`(1) 第一式乘d、第二式乘b相减；另作消元求y。`,R`(2) 7×70=490≡1；消元得7x≡19，7y≡−1。`,R`(3) Fermat只给d整除52；再用2^26≡−1与2^4≠1排除真因子。`],"method":R`m-square-congruence`,"sol":R`<p>(1) 消元得$x\equiv d-2b$、$y\equiv2a-c\pmod m$。代回分别为ad−bc≡1和2(ad−bc)≡2，且齐次差方程同样消元给Δx=Δy=0，故解唯一。</p><p>(2) 7逆元为70，故$x\equiv19\cdot70\equiv26$、$y\equiv-70\equiv93\pmod{163}$。反代得到331≡5、822≡7；行列式7是单位，解唯一。</p><p>(3) 2^52≡1，最小阶d必整除52（对52除以d取余即可）。直接重复平方得2^13≡30、2^26≡−1，故d不整除26；52的其他真因子仅4，且2^4≡16≠1，故d=52。仅引用Fermat而不排除真因子不能证明最小性。</p>`,"lv":R`延伸`},
{"id":R`dplus3-e4`,"src":R`2024复习手稿第3页补充1（资料题）`,"stmt":R`证明有无穷多个正整数n，使 $n\mid2^n-8$。`,"hints":[R`取n=3p，其中p是大于3的素数。`,R`模p由Fermat有2^(3p)≡8；模3因为3p为奇数，2^(3p)≡2≡8。`,R`3和p互素，故3p整除该差。素数无穷给无穷多个n。`],"method":R`m-square-congruence`,"sol":R`<p>对每个素数p>3，取n=3p。Fermat的普遍形式给2^p≡2(modp)，立方得2^(3p)≡8(modp)。另一方面n为奇数，2^n≡−1≡2≡8(mod3)。因(3,p)=1，CRT或互素整除性推出3p|2^n−8。大于3的素数无穷，因此这样的n也无穷。不能随便取所有奇数n；证明依赖这族可控制的素因子。</p>`,"lv":R`延伸`},
{"id":R`dplus3-e5`,"src":R`三版史灵生考前辅导 §1 集合基础（资料补齐）`,"stmt":R`<p>(1) 证明(A∩B)∩C=A∩(B∩C)；A⊆B、C⊆D时A∪C⊆B∪D。</p><p>(2) 证明A与B的对称差等于(A∩B的补集)∪(A的补集∩B)。</p><p>(3) n元集合含指定元素x的子集共有多少？</p>`,"hints":[R`(1)任取元素，交就是同时属于，并就是至少属于一个。`,R`(2)对称差要求恰好属于A、B之一。`,R`(3)x已固定选取，其余n−1个元素各选或不选。`],"method":R`m-set-element`,"sol":R`<p>(1) 任取z，它属于左边交集当且仅当z同时属于A、B、C，这与属于右边等价。若z∈A∪C，则z∈A或z∈C，由包含条件得z∈B或z∈D，因此z∈B∪D。</p><p>(2) z恰属于A、B之一，等价于“z∈A且z不属于B，或z不属于A且z∈B”，即所述两个集合的并。无需假设集合有限。</p><p>(3) 含x的子集与其余n−1元集合的任意子集双射，故为2^(n−1)个；n≥1，因为x在原集合中。</p>`,"lv":R`延伸`},
{"id":R`dplus3-e6`,"lv":R`延伸`,"src":R`2024复习手稿第3页补充2（资料题，非2024原卷；高清及原解复核）`,"stmt":R`<p>设 $p$ 为奇素数，证明 $$\sum_{k=1}^{p-1}k^{2p-1}\equiv-\frac{p(p-1)}2\pmod{p^2}.$$</p><p>注意右端有负号；原页绿色推导也给出这一符号。此题来自复习手稿，不计入年度卷型频率。</p>`,"hints":[R`把 $k$ 与 $p-k$ 配成一对；$2p-1$ 为奇数，二项展开的常数项恰好抵消。`,R`模 $p^2$ 展开只保留含 $p$ 的一次项：$k^{2p-1}+(p-k)^{2p-1}\equiv(2p-1)p k^{2p-2}$。`,R`Fermat 给 $k^{2p-2}\equiv1\pmod p$。外面已有因子 $p$，故每对模 $p^2$ 同余于 $-p$；共有 $(p-1)/2$ 对。`],"method":R`m-square-congruence`,"sol":R`<p>令 $1\le k\le(p-1)/2$。因 $2p-1$ 为奇数，二项展开给 $$\begin{aligned}k^{2p-1}+(p-k)^{2p-1}&\equiv(2p-1)p k^{2p-2}\\&\equiv-p\pmod{p^2}.\end{aligned}$$ 第一行中二次及以上的 $p$ 因子均被模数 $p^2$ 消去；第二行用 $p\nmid k$ 及 Fermat：$k^{p-1}\equiv1\pmod p$，从而 $k^{2p-2}\equiv1\pmod p$，并且 $(2p-1)p\equiv-p\pmod{p^2}$。</p><p>这 $(p-1)/2$ 对恰好覆盖 $1,\ldots,p-1$，于是 $$\sum_{k=1}^{p-1}k^{2p-1}\equiv\frac{p-1}2(-p)=-\frac{p(p-1)}2\pmod{p^2}.$$</p><p>自检：$p=3$ 时 $1^5+2^5=33\equiv6\pmod9$，右端 $-3\equiv6$；若漏掉负号则错误。Fermat 本身只给模 $p$ 的结论，此处借助外乘的 $p$ 才能用于模 $p^2$，不能直接把模数提升。</p>`},
{"id":R`dplus3-e7`,"lv":R`延伸`,"src":R`2024复习手稿第3页补充3（资料题，非2024原卷；高清及原解复核）`,"stmt":R`<p>设 $x$ 为整数，$y,z,w$ 为正奇整数，证明 $$x^{\left(y^{\left(z^w\right)}\right)}\equiv x^{\left(y^z\right)}\pmod{17}.$$</p><p>幂塔按右结合解释，即 $x^{(y^{(z^w)})}$。原手稿写“$y,z,w$ 为奇数”；这里把正整数幂的定义域写明，以免负幂引入模逆元问题。此题属于复习资料，不计年度卷型频率。</p>`,"hints":[R`先从最上层开始：奇数 $z$ 满足 $z^2\equiv1\pmod4$，而 $w$ 为奇数，故 $z^w\equiv z\pmod4$。`,R`奇数 $y$ 满足 $y^4\equiv1\pmod{16}$。用上一步的指数模 $4$ 同余，推出 $y^{z^w}\equiv y^z\pmod{16}$。`,R`分情况：若 $17\mid x$，两边均为零；否则 Fermat 给 $x^{16}\equiv1\pmod{17}$，再使用两侧指数模 $16$ 同余。`],"method":R`m-square-congruence`,"sol":R`<p>对任意奇数 $a$，$a^2\equiv1\pmod8$，因而 $a^4\equiv1\pmod{16}$。又因 $w$ 为正奇数， $$z^w=z(z^2)^{(w-1)/2}\equiv z\pmod4.$$</p><p>令 $t=(z^w-z)/4$。由于 $z,w$ 为正奇整数，$t$ 是非负整数。因此 $$y^{z^w}=y^z(y^4)^t\equiv y^z\pmod{16}.$$ 记 $A=y^{z^w}$、$B=y^z$，则 $A,B$ 均为正整数，且 $16\mid A-B$。</p><p>若 $17\mid x$，正指数确保 $x^A\equiv x^B\equiv0\pmod{17}$。若 $17\nmid x$，由 Fermat 有 $x^{16}\equiv1\pmod{17}$；因 $A\equiv B\pmod{16}$，得 $x^A\equiv x^B\pmod{17}$。</p><p>这里依次使用模 $4$、模 $16$、模 $17$，每一层的指数周期不同。不能对整个幂塔各层一律模 $16$，也不能不分 $17\mid x$ 就直接套 Fermat。右端确为 $x^{y^z}$，没有 $w$，更不是 $((x^y)^z)^w$。</p>`}
]
},

"n":4,
"title":R`图论补漏：极端结构、交叉数与奇圈染色`,
"goal":R`用非邻点、分支、交叉边对等结构，把存在性题化成计数限制。30分钟主线做三道史灵生真题；Petersen、Kempe与Hamilton奇偶定理列选做，跨班题源不等于本学期必考。`,
"sections":[
{"id":R`dplus4-s1`,"h":R`1. “任三点有一边”：固定一点看非邻点`,"html":R`<p>若任意三点至少有一条边，则对任一点v，所有与v不相邻的点必须两两相邻，否则两非邻点连同v构成三点空图。这个“非邻点形成团”的结构比直接套平均度更容易控制。</p><p>另一方面，若图不连通，取一个分支大小a，则跨分支的a(n−a)条潜在边全缺。a在1到n−1之间时，a(n−a)≥n−1，故不连通简单图至多有C(n−1,2)条边。</p>`},
{"id":R`dplus4-s2`,"h":R`2. 直线图交叉：数的是边对，不是交点位置`,"html":R`<p>n个平面点无三点共线，画全部直线边。每个凸四边形恰贡献一对相交的对角线；反过来，两条无公共端点的线段在内部相交，四端点必构成凸四边形。因此凸四边形数等于交叉<b>边对</b>数q。</p><p>从每一对交叉边中任选一条删除，合计最多删q条边，剩下的画法没有交叉，故是简单平面图。即使多条对角线在同一位置相交，也要按每一对计数，不能把它们合成一个交点。</p>$$\binom n2-q\le3n-6\quad(n\ge3),\qquad q\ge\frac{(n-3)(n-4)}2.$$`},
{"id":R`dplus4-s3`,"h":R`3. 奇圈限制与换色：只证明需要的充分界`,"html":R`<p>若任两奇圈共享顶点，取一个最短奇圈C：它没有弦，否则弦把它分成两圈，其中一个是更短奇圈。C可3色，删C后没有奇圈，余图可用另外2色，故5色足够。</p><p>更一般的“每点至多k个奇圈”可用两色连通块换色。选做题只证 $\binom t2\gt k$ 时t色足够；参考资料声称此界总精确，不能在未给锐例时照抄为最优色数。</p>`}
],

{"id":R`m-crossing-delete`,"title":R`交叉数：每对删一边，再用平面界`,"steps":[R`说明交叉边对与所数几何对象的双射；数边对而非交点。`,R`为每对交叉边选一条删除，去重后删除条数不超过交叉对数。`,R`剩图可平面，代入e≤3v−6得到下界；只宣称已证的界。`]},

"problems":[
{"id":R`dplus4-p1`,"src":R`2019秋期末·史灵生 5（照片原卷）`,"stmt":R`一个城镇有2019人，任意三人中至少有两人相互认识。证明至少一人认识不少于1009人。`,"hints":[R`把人看作点，相识连边。`,R`任取v；若其度≥1009已完成，否则非邻点至少2018−1008=1010个。`,R`非邻点形成团，每个非邻点至少认识该团内其余1009人。`],"method":R`m-graph-extreme`,"sol":R`<p>任取v。若d(v)≥1009，直接成立。否则d(v)≤1008，v有至少1010个非邻点。任意两个这样的点必须相识，否则它们与v组成三人互不相识，违背题设。因此这些点形成至少1010点的团，其中每个点至少认识团内另外1009人。</p>`,"lv":R`真题`},
{"id":R`dplus4-p2`,"src":R`2022秋期末·史灵生 5`,"stmt":R`证明n点简单图若边数大于 $\binom{n-1}2$，必连通，并给出表明严格号不能改为≥的例子（n≥2）。`,"hints":[R`反证，取一个分支有a点，1≤a≤n−1。`,R`边数≤C(a,2)+C(n−a,2)=C(n,2)−a(n−a)。`,R`a(n−a)≥n−1；取K_(n−1)加孤立点取等。`],"method":R`m-graph-extreme`,"sol":R`<p>若不连通，取一个分支a点，跨它与其余n−a点没有边，故$e\le\binom n2-a(n-a)$。因$a(n-a)-(n-1)=(a-1)(n-a-1)\ge0$，得$e\le\binom n2-(n-1)=\binom{n-1}2$，与题设矛盾。</p><p>K_(n−1)与一个孤立点不连通且恰有C(n−1,2)边，所以不能改成≥。n=2时就是两个孤立点。</p>`,"lv":R`真题`},
{"id":R`dplus4-p3`,"src":R`2022秋期末·史灵生 7`,"stmt":R`平面上任取六个点，无三点共线。证明其中至少有三组四点构成凸四边形。`,"hints":[R`画出15条两两连线；凸四边形对应相交对角线。`,R`若凸四边形数q≤2，从每对交叉边中删一条，至少还剩13边且无交叉。`,R`六点简单平面图最多3×6−6=12边，矛盾。`],"method":R`m-crossing-delete`,"sol":R`<p>四点构成凸四边形当且仅当其中一对无公共端点的线段内部相交；对角线交叉的边对唯一。令这样的边对数为q。从每对交叉边中选一条删除，合计至多删q条，所得直线画法无交叉。该简单平面图有6点、至少15−q边，平面界给15−q≤12，故q≥3。</p><p>若三条对角线同点相交，仍是三对边，证明并不要求交点位置互不相同。</p>`,"lv":R`真题`}
],
"variants":[
{"id":R`dplus4-v1`,"src":R`2019秋期末·史灵生 7（原题问足够颜色数）`,"stmt":R`设有限简单图中任意两条奇圈都有公共顶点。证明5色足够。`,"hints":[R`若没有奇圈，二部图2色足够。`,R`否则取最短奇圈，它没有弦，故用3色。`,R`删去此圈顶点后若有奇圈则与原圈顶点不交，矛盾；余图用另外2色。`],"method":R`m-oddcycle-colour`,"sol":R`<p>无奇圈时图为二部图，2色即可。有奇圈时取最短奇圈C。若C有弦，两条弦路长度奇偶不同，弦和其中偶长路组成更短奇圈，矛盾，故C无弦，可正常3染色。G−V(C)没有奇圈，否则与C不交，故它是二部图。用与前3色不同的另外2色染余图，即得全图5色染法。跨两部分的边端点颜色集合不交，也合法。这是充分界，不声称对每个此类图最优。</p>`,"lv":R`变种`},
{"id":R`dplus4-v2`,"src":R`史灵生2019考前辅导 Problem 4.4 / 解析版4.3（资料题）`,"stmt":R`证明Petersen图没有Hamilton圈。可用其五角星内圈、五边形外圈及对应五条辐条的画法。`,"hints":[R`Hamilton圈跨内外两部分的辐条数必须为正偶数，因此是2或4。`,R`若用2条辐条，外五圈删一边成路径，要求两端外圈相邻；内星五圈路径端点内圈相邻，对应指标相差2，矛盾。`,R`若用4条辐条，由对称性可设仅第0条不用；外圈和内星中所取边被度2条件唯一迫出，形成两个5圈。`],"method":R`m-graph-extreme`,"sol":R`<p>编号外圈u_i（i模5相邻）、内圈v_i（i与i+2相邻），辐条u_iv_i。Hamilton圈跨割的辐条数为正偶数，故为2或4。</p><p>若用2条，内外各自都须是覆盖五点的路径。外圈路径删一边，其端点指标相差1；内星圈路径删一边，端点指标相差2。两端必须是相同两条辐条的指标，矛盾。</p><p>若用4条，由旋转设u_0v_0不用。度2强迫取外边u_0u_1、u_0u_4、u_2u_3；内边v_0v_2、v_0v_3、v_1v_4，连同其余四条辐条，恰形成两圈$u_0u_1v_1v_4u_4u_0$及$u_2u_3v_3v_0v_2u_2$，而非一个10圈。两种情况都不可能。</p>`,"lv":R`变种`},
{"id":R`dplus4-v3`,"src":R`2024复习手稿第5页与史灵生考前辅导图论基础（资料题合并）`,"stmt":R`<p>(1) 连通简单图n≥3、每点度≤2，证明它是路径或圈。</p><p>(2) 证明G与其补图至少一个连通。</p><p>(3) G有11点，证明G与补图不可能同时可平面。</p>`,"hints":[R`(1)若全2度为圈；否则从度1点沿未用边前进，不能分叉。`,R`(2)若G不连通，跨分支的补图边全部存在。`,R`(3)两图边数和C(11,2)=55，而两个简单平面图边数和至多2(3×11−6)=54。`],"method":R`m-graph-extreme`,"sol":R`<p>(1) 若每点2度，由g1得圈。否则连通且n≥3排除0度点，存在度1点。从它开始沿未用边走，度≤2使中间没有分叉，也不可能回到已走过点（回到起点违反其度1；回到其他点会使其度至少3）。故得到路径；若有未走到点，连通性迫使它接到路径某点，违反终止或度上界。因此路径覆盖全图。</p><p>(2) 若G连通已完成；若不连通，任两点分属不同分支时在补图相邻，同分支时可经另一个分支任一点作两步路，故补图连通。</p><p>(3) 若两图都平面，则各最多27边，总共最多54；但它们将K11的55条边恰分完，矛盾。因此至少一个非平面，不能由未超过界反推另一个一定平面。</p>`,"lv":R`变种`}
],
"extensions":[
{"id":R`dplus4-e1`,"src":R`史灵生2019考前辅导补充 Problem 2.9（只取可靠充分界）`,"stmt":R`若有限简单图每点至多位于k条不同简单奇圈上，证明：对任意正整数t，只要 $\binom t2\gt k$，就可用t色正常染色。不要据此断言这个界总是最优。`,"hints":[R`对顶点数归纳，删去v后t染色。缺一种邻色时直接填。`,R`否则看每对颜色a,b。如果其诱导子图有a邻点到b邻点的路径，取简单交替路径，与v组成奇圈。不同色对产生不同奇圈。`,R`色对总数>k，必有一对不存在这样的路径。把所有含a邻点的两色分支整体交换a,b，就空出a色。`],"method":R`m-oddcycle-colour`,"sol":R`<p>对点数归纳。G−v可t染色；若v的邻点未用尽颜色，直接填。否则对每对颜色a,b，若两色诱导子图中有一条连接v的a邻点与b邻点的路径，取其中简单路径P。P两端异色，长度为奇数，P加v及两条邻接边形成奇圈。不同色对产生不同圈，因为圈上除v外恰用这两色，故最多k个色对被这种圈阻挡。</p><p>由C(t,2)>k，选一对a,b未被阻挡。所有包含v的a色邻点的两色连通分支，都不含v的b色邻点，否则就有上述路径。把这些分支中a、b全交换，原染色仍合法，且v不再有a色邻点，可染a。归纳完成。</p>`,"lv":R`延伸`},
{"id":R`dplus4-e2`,"src":R`2019秋期末·史灵生 9（4分拓展题，自证奇偶定理）`,"stmt":R`是否存在自然数d，使每个有限简单d正则Hamilton图至少有两条不同Hamilton圈？给一个d并说明理由。`,"hints":[R`可取d=3。更强事实：所有点度均为奇数的图，每条固定边所处Hamilton圈数为偶数。`,R`固定有向首边u,v，以所有从u,v开头的Hamilton路径作辅助图顶点；把终点连回路径内部再反转尾段，称为旋转。`,R`对终点w，该辅助顶点度为d(w)−1−1_{wu是边}；它为奇数恰当路径可闭成固定边所处Hamilton圈。用握手奇偶。`],"method":R`m-graph-extreme`,"sol":R`<p>取d=3。先证奇度图的固定边uv所处Hamilton圈数为偶数。把所有以u,v开头的有向Hamilton路径P=(v_1=u,v_2=v,…,v_n=w)作辅助图顶点。对w与v_i的每条边（2≤i≤n−2），做旋转$(v_1,…,v_i,w,v_{n-1},…,v_{i+1})$。它保持首边，且逆旋转唯一，故辅助图为有限无向图。</p><p>这些旋转数为d(w)减去已用前驱边，再减去可能的wu边，即d(w)−1−1_{wu∈E}。d(w)奇数，所以辅助度为奇数当且仅当wu∈E。这样的路径恰一一对应含固定边uv的无向Hamilton圈：以u→v方向打开圈即可。</p><p>握手定理说明奇度辅助顶点个数为偶数，所以固定边所处Hamilton圈数为偶数。原图有一个Hamilton圈，选其任一边uv，该边至少属于两圈。故每个3正则Hamilton图至少两圈。d=2不行：单独一个圈是2正则，却只有一条Hamilton圈。此题为跨班选做，不要求主线30分钟掌握全部旋转证明。</p>`,"lv":R`延伸`},
{"id":R`dplus4-e3`,"src":R`2024复习手稿第8页题6(3)（资料题）`,"stmt":R`设G为n≥3的简单平面图，各边染黑或蓝。对每个面F，把相邻边异色的边界角数记c(F)，边界按行走次数计数（桥重复两次）。证明 $\sum_F c(F)\le4n-8$。`,"hints":[R`先看面边界长度ℓ：ℓ=2只可能同一桥来回，c=0；ℓ=3时异色变化数为偶数故≤2；ℓ≥4时c≤ℓ≤2ℓ−4。`,R`对所有面求和：∑c≤2∑ℓ−4f=4e−4f。`,R`非空有边图用n−e+f=1+分支数；空边图直接c总数0。`],"method":R`m-double-count`,"sol":R`<p>若无边，左边0，结论成立。否则每个面的边界总长度至少2。长度2时同一桥往返，两边颜色相同，c=0；长度3为三角形，沿闭边界的颜色变化次数为偶数，故c≤2；长度ℓ≥4时c≤ℓ≤2ℓ−4。因此统一有c(F)≤2ℓ(F)−4。</p><p>每边在所有面边界中共计两次，所以∑ℓ=2e，从而∑c≤4e−4f。设分支数为h≥1，Euler给n−e+f=1+h，故4e−4f=4n−4−4h≤4n−8。包括桥和非连通图；不能把面边界中的桥只计一次。</p>`,"lv":R`延伸`}
]
},

"sections":[
{"id":R`dplus5-s1`,"h":R`1. 走每条边与走每个点是不同问题`,"html":R`<p>Euler路要求每条边一次，靠度数奇偶；Hamilton路要求每个顶点一次，不能直接套Euler判据。在二部图中，每走一步就换颜色，因此偶数个点的Hamilton路两端异色，奇数个点时两端同色且位于数量多一的颜色类；Hamilton圈两色数量必相同。</p><p>格点按坐标和的奇偶染色，二维相邻、三维共面的相邻小方块都异色。奇偶条件是必要条件，通常不是任意图的充分条件。</p>`},
{"id":R`dplus5-s2`,"h":R`2. 闭行迹可以拆成边不交的简单圈`,"html":R`<p>若Euler闭行迹中重复某顶点，截出两次相遇间最短的闭段，它内部无重复点，因而是简单圈。删去这段，余下仍是闭行迹（可能为空）；重复进行。边每次只删一次，最终得到边不交圈分解。</p><p>这里“边不交”不要求顶点不交；两个三角形共一个顶点就是最简单的提醒。</p>`},
{"id":R`dplus5-s3`,"h":R`3. 对偶图的顶点是面，度数是面的边界长度`,"html":R`<p>固定平面嵌入，在每个面内放一个对偶顶点，每条原边连其两侧的面；两侧同面时成为对偶自环。对偶顶点的度等于对应面的边界长度，桥在边界上按两次计，自环也贡献2度。</p><p>二部图的每段闭走法长度都为偶数，所以每个面边界长度为偶数，对偶各点全偶度。对偶图连通（用连接两面内点的避顶点曲线，依次跨边给出对偶道路），故有Euler闭路。</p>`}
],

"problems":[
{"id":R`dplus5-p1`,"lv":R`真题`,"src":R`2015 秋期末 5（英文转录）；2019对偶题的方法补漏`,"stmt":R`<p>(1) 证明二部平面地图的对偶图有Euler闭路，桥和自环允许出现。</p><p>(2) 常规方格网（至少有两个相邻小方格）的对偶一定二部吗？说明边界度3点的作用。</p>`,"hints":[R`(1)对偶点的度等于原面边界长度。`,R`二部图闭走法长为偶，桥两侧算两次。`,R`(2)原图度3的边界非角点对应对偶的长3面边界闭走法，不能在二部图出现。`],"sol":R`<p>(1) 每个原面边界由闭走法组成，每段在二部图中为偶长，所以对应对偶度数为偶；桥贡献两次，对偶自环贡献2度，不影响结论。对偶连通，故由Euler定理有Euler闭路。</p><p>(2) 不一定。比如6×6点方格网有度3的非角边界点。绕该点的小圈依次跨过三条原边，在对偶中形成长3闭走法；二部图没有奇长闭走法，故该对偶不二部。不要把“原图二部⇒对偶Euler”误换成“原图二部⇒对偶也二部”。</p>`,"method":R`m-dplus5`},
{"id":R`dplus5-p2`,"lv":R`真题`,"src":R`2015 秋期末 6（27块奶酪）；6×6网格构造为补充练习`,"stmt":R`<p>(1) 3×3×3小方块从角块出发，每步共面相邻且不重访，能恰好走完27块并在中心结束吗？</p><p>(2) 6×6点方格网能否有Hamilton圈？给出实际构造路线。再判断能否从左上角出发、右下角结束走完所有点。</p>`,"hints":[R`(1)按三个坐标之和染色，所有角块同色，中心异色。`,R`走完27个点的路径首尾必须同色。`,R`(2)先走顶行，留第一列作返回通道；其余行在第2至6列蛇形，底行接第一列返回。`],"sol":R`<p>(1) 用坐标0、1、2标小方块。角块坐标和偶，中心(1,1,1)和奇。每步换色，27个点的路径有26步，首尾同色，故不可能。</p><p>(2) 可以。从(1,1)沿顶行走至(1,6)，在第2至6行的第2至6列交替左右蛇形，到(6,2)，再走(6,1)，沿第一列向上经(5,1),…,(2,1)回(1,1)。每个点恰访问一次，所连都是网格边，构成Hamilton圈。这里只给具体网格的构造，未把颜色平衡误当一般充分条件。</p><p>从左上到右下的Hamilton路不存在：36个点的Hamilton路有35条边，首尾必须异色；两个对角坐标和都为偶数，同色，矛盾。原2022题图为5×5小方格、36节点，不能误看成5×5节点。</p>`,"method":R`m-dplus5`},
{"id":R`dplus5-p3`,"lv":R`真题`,"src":R`2017 秋期末 5（英文转录）`,"stmt":R`证明一个Euler闭行迹的边可以分拆成若干边不交的简单圈。`,"hints":[R`若没有重复内部顶点，它本身就是圈。`,R`否则选择两次相遇间长度最短的闭段。`,R`截出的闭段是简单圈，删掉后接上余下行迹，按边数归纳。`],"sol":R`<p>对行迹边数归纳。非空闭行迹中选一个长度最短的非空闭段；若它内部有重复顶点，就可再截更短闭段，矛盾，故它是简单圈C。删掉该段，原行迹在同一顶点接续，余下仍为闭行迹且边数变少。对余下归纳分拆，再加C即可。每条边恰属于删除它的那一圈，故边不交；圈可以共享顶点。</p>`,"method":R`m-dplus5`}
],
"variants":[
{"id":R`dplus5-v1`,"lv":R`变种`,"src":R`2016 手写回忆 3(1)，标准重述`,"stmt":R`证明任意6人的相互认识关系中，总有两人的认识人数相同。`,"hints":[R`把认识关系画成6点简单无向图，度为0到5。`,R`度0与度5不可能同时出现。`,R`最多5种度，6个点用抽屉原理。`],"sol":R`<p>若有度0点，则无点度5，度只能为0,…,4；否则度只能为1,…,5。两种情况下至多5个抽屉放6个顶点，必有同度两点。不能直接说“6个点放6种度必相同”；要先排除0与5并存。</p>`,"method":R`m-dplus5`},
{"id":R`dplus5-v2`,"lv":R`真题`,"src":R`2018 秋期末回忆版 6`,"stmt":R`证明每个m边简单图包含至少m/2条边的二部子图。`,"hints":[R`任选顶点二染色，保留异色端点边。`,R`每条边被保留的概率1/2；期望边数m/2。`,R`某种划分的边数不少于平均值；也可取最大割再逐点翻色。`],"sol":R`<p>各点独立等概率染红蓝，每条边两端异色的概率为1/2。保留异色边后为二部子图，边数X满足E[X]=m/2。若每一种染色都少于m/2条，平均也会少于m/2，矛盾。故有一种达到至少m/2。确定性核对：取最大割，若某点跨割度小于同侧度，翻色会增加割边；故各点跨割度至少原度一半，求和得到同样结论。</p>`,"method":R`m-dplus5`}
],
"extensions":[
{"id":R`dplus5-e1`,"lv":R`延伸`,"src":R`2016 手写回忆 7的可辨题意重述；原上界符号不清`,"stmt":R`平面上n个不同点两两距离至少1。证明距离恰为1的点对不超过3n；n≥3时给更强界。`,"hints":[R`只连接距离恰1的点对，画成直线段。`,R`若两条边内部相交，对应凸四边形四边长之和严格小于两对角线长度之和的2倍，即小于4，必有一对距离<1。`,R`因此是简单平面图，n≥3时边数≤3n−6。`],"sol":R`<p>任一单位线段内部没有其他给定点，否则它距某端点小于1。若两条无共同端点的单位线段内部相交于P，四端点组成凸四边形。用严格三角不等式估其四条边，周长小于2(AP+BP+CP+DP)=4，所以某一边长小于1，矛盾。因此所有单位边构成无交叉简单平面嵌入。</p><p>n≥3时E≤3n−6<3n；n=1、2直接有E≤1≤3n。本题用几何条件保证可平面，再套边界，不能只因画在纸上就宣布平面。</p>`,"method":R`m-dplus5`}
]
},
"dplus6":{
"unit":R`past`,

"title":R`往年补漏：匹配、增广路与图上游戏`,
"goal":R`史灵生班往年资料补漏，概念与证明沿现有讲义衔接；不据跨班旧卷推定本学期必考。约30分钟完成讲解、概念与主线题，变种和延伸选做。`,
"sections":[
{"id":R`dplus6-s1`,"h":R`1. 两个匹配的对称差只剩交替结构`,"html":R`<p>两个匹配M、N的对称差中，每点度至多2，因此每个非平凡分支是交错路或偶交错圈。若两者都是完美匹配，每点度只能为0或2，只剩偶交错圈。因此无圈图至多一个完美匹配。</p><p>若匹配M存在从未匹配点出发、以未匹配点结束的交错路，翻转路上选边，会多一条匹配边。这样的路叫增广路；最大匹配不能有增广路。注意最大与极大不同。</p>`},
{"id":R`dplus6-s2`,"h":R`2. 不重访的顶点行走游戏：用最大匹配配对回应`,"html":R`<p>先手任选起点，后续轮流选未访问邻点，不能走的人输。若没有完美匹配，取一个最大匹配M及未匹配点v₀作开局。之后每逢后手选u，先手就选M中与u匹配的伙伴。</p><p>要证明这个回应永远合法，必须排除后手走到另一个未匹配点；否则当前路径正好是增广路，与最大性矛盾。还须说明匹配伙伴从未访问：此前除v₀外已访问顶点总成对出现。</p>`}
],

{"id":R`dplus6-c3`,"sec":R`dplus6-s2`,"q":R`游戏策略为什么必须取最大匹配而非只取极大匹配？`,"opts":[R`最大匹配更容易画`,R`极大匹配仍可能有较长增广路`,R`两者没区别`,R`极大匹配没有边`],"a":1,"ex":R`极大只排除直接加一条边，不能排除换边后增大。`},

],
"methods":[
{"id":R`m-dplus6`,"title":R`匹配策略：选最大，查增广，维护成对访问`,"steps":[R`先取最大匹配并找未匹配点，不能只随便取极大匹配。`,R`后手若到未匹配点，就把整条行走路径写成增广路并翻转反证。`,R`后手若到匹配点，用成对访问不变量证明伙伴未访问；有限游戏终止于后手无路。`]}
],
"problems":[
{"id":R`dplus6-p1`,"lv":R`真题`,"src":R`2015 秋期末 7；2019同题方法补漏`,"stmt":R`证明树至多有一个完美匹配。`,"hints":[R`假设有两个完美匹配M、N。`,R`取对称差；其中每个非孤立顶点度为2。`,R`有限2正则分支是圈，与树无圈矛盾。`],"sol":R`<p>若M≠N，对称差非空。任一顶点若两匹配选同一边，在对称差中度0；若选不同边，则度2。因此对称差的某个非空分支为圈，且两种匹配边交替，得到树中的圈，矛盾。结论是至多一个，不保证存在；三点路径就是没有完美匹配的树。</p>`,"method":R`m-dplus6`},
{"id":R`dplus6-p2`,"lv":R`真题`,"src":R`2017 秋期末 6（英文转录）`,"stmt":R`两人轮流在有限图中选不同顶点，首点任取，其后须与上一点相邻。不能选者输。证明图无完美匹配时先手必胜。`,"hints":[R`先手以最大匹配M的一个未匹配点开局。`,R`每次后手到匹配点u，先手取其M伙伴。`,R`后手若到了未匹配点，整个不重复路径就是增广路。`],"sol":R`<p>取最大匹配M，无完美匹配保证有未匹配起点v₀。先手选v₀。归纳假设此前除v₀外的访问点都按M边成对，且路径的M与非M边交替。</p><p>后手走到新点u。若u未匹配，则从v₀到u的不重复路径以非M边开始结束，是M增广路；翻转多一边，与最大性矛盾。故u匹配。其伙伴w不曾访问：若w已访问，它所在已访问匹配对还包括u，与u是新点矛盾。于是先手合法选w，恢复不变量。由于有限图不能无限访问新点，先手始终可回应，最终只能后手无路，故先手必胜。图不要求二部。</p>`,"method":R`m-dplus6`}
],
"variants":[
{"id":R`dplus6-v1`,"lv":R`变种`,"src":R`2016 手写回忆 2，路径图题意标准化`,"stmt":R`对有n个顶点的路径P_n，求完美匹配数与全部匹配数z_n（含空匹配）。`,"hints":[R`完美匹配若存在，端点边必选，删去两端点归纳。`,R`全部匹配按末点是否被末边匹配分类。`,R`z₀=1,z₁=1，z_n=z_(n−1)+z_(n−2)=F_(n+1)。`],"sol":R`<p>n为奇数时无完美匹配；n为偶数时端点强制配对，依次删去两个点，得到唯一完美匹配。空图n=0按惯例有一个空完美匹配。</p><p>全部匹配中，不选末边时末点孤立，剩P_(n−1)；选末边时删去末两点，剩P_(n−2)。故z_n=z_(n−1)+z_(n−2)，z₀=z₁=1，所以z_n=F_(n+1)。手记z(1)=1,z(2)=2与此一致。</p>`,"method":R`m-dplus6`},
{"id":R`dplus6-v2`,"lv":R`真题`,"src":R`2018 秋期末回忆版 7`,"stmt":R`简单二部图两侧各n个顶点，每点度至少n/2。证明有完美匹配。`,"hints":[R`对左侧任意S，按|S|≤n/2和|S|>n/2分类。`,R`S非空且小时，任取一点可得|N(S)|≥n/2。`,R`S大时若有右点不在N(S)，它只能连到左侧补集，度小于n/2，矛盾。`],"sol":R`<p>空S显然满足Hall。若0<|S|≤n/2，任取u∈S，有|N(S)|≥d(u)≥n/2≥|S|。若|S|>n/2，假设右侧b∉N(S)，则b只与n−|S| 小于 n/2个补集点相连，与最小度条件矛盾；故N(S)是整个右侧，|N(S)|=n≥|S|。所有S满足Hall，因而存在完美匹配。等号边界不能任意改为严格大于。</p>`,"method":R`m-dplus6`}
],

"sections":[
{"id":R`dplus7-s1`,"h":R`1. 部分和抽屉与小数部分抽屉`,"html":R`<p>已有整除题把部分和放进余数抽屉；实数逼近题把0,r,2r,…的小数部分放进[0,1)。两个小数部分接近，就表示某个非零整数倍qr接近一个整数p。</p><p>要证明1≤q≤N、误差<1/N，可把N+1个小数部分放入N个长1/N的半开区间，找同屉两点。原题更精确要求q 小于 n而误差≤1/n，少一个候选点，适合用单位圆的n个间隙。</p>`},
{"id":R`dplus7-s2`,"h":R`2. n个圆周间隙，总长为1`,"html":R`<p>考察n个点{x_j}={jr}，j=0,…,n−1，视[0,1)首尾相接。若两点重合，立刻得到某个q 为1至n−1的整数且qr为整数。否则按小数部分排序，n个相邻圆周间隙的和为1，至少一个≤1/n。</p><p>该间隙由两个不同指标i,j确定。普通间隙对应|(j−i)r−p|≤1/n；跨0的间隙同样对应某个整数p与有符号指标差。把指标差取正并相应改变p的符号，即q 为1至n−1的整数。这里圆周最后一个间隙不可漏掉。</p>`}
],

{"id":R`dplus7-p1`,"lv":R`真题`,"src":R`2015 秋期末 4（英文转录）`,"stmt":R`对任意实数r及整数n>1，证明存在整数p,q使q 为1至n−1的整数且|p−qr|≤1/n。`,"hints":[R`考虑{jr}，j=0,…,n−1，并保留指标。`,R`若重合，误差0；否则用n个圆周间隙总长1。`,R`最短间隙≤1/n。选其端点的指标差q，并调整整数部分。`],"sol":R`<p>若{ir}={jr}且i≠j，则(i−j)r为整数，取q=|i−j|即误差0。否则n个小数部分互异，在单位圆上有n个正间隙，总和1，故最短间隙d≤1/n。</p><p>其两个端点来自不同指标i,j。无论它是普通间隙还是跨0间隙，都存在整数h使|(i−j)r−h|=d。令q=|i−j|，并按i−j的符号令p=h或−h，则q 为1至n−1的整数且|qr−p|≤1/n，证毕。</p>`,"method":R`m-dplus7`},
{"id":R`dplus7-p2`,"lv":R`基础`,"src":R`自编：原结论的构造与边界`,"stmt":R`<p>(1) r=√2、n=6时，找一组满足原题的p,q。</p><p>(2) r=1/n时，说明原结论中的误差上界为什么不能统一改小于1/n。</p>`,"hints":[R`(1)试q=1,…,5，选最接近qr的整数。`,R`q=5时5√2接近7。`,R`(2)q/n距最近整数为min(q,n−q)/n。`],"sol":R`<p>(1) 取q=5,p=7，误差5√2−7≈0.071068<1/6。还可用平方比较给出严格核对：7<5√2<43/6，因为49<50<1849/36，所以误差<1/6。</p><p>(2) 对1≤q≤n−1，q/n距整数为min(q,n−q)/n≥1/n，且q=1可取等。因此≤不能统一替换为<。</p>`,"method":R`m-dplus7`}
],
"variants":[
{"id":R`dplus7-v1`,"lv":R`变种`,"src":R`自编：N+1点线段抽屉版`,"stmt":R`证明任意实数r、正整数N，都有整数p,q使1≤q≤N且|qr−p|<1/N。说明它与主线n版的区别。`,"hints":[R`使用N+1个小数部分{jr}，j=0,…,N。`,R`分成N个长度1/N的半开区间。`,R`同屉差严格小于1/N，但指标差允许等于N。`],"sol":R`<p>由抽屉原理两个小数部分在同一半开区间，差严格小于1/N，指标差q在1,…,N之间；补回整数部分得到p。本版允许q=N，因此能得到严格误差；主线要求q 小于 n，所以用n点圆周间隙，误差只能保证≤1/n。两种量词不能混拼。</p>`,"method":R`m-dplus7`}

"dplus8":{
"unit":R`past`,
"n":8,
"title":R`往年补漏：区组计数之后，怎样真正构造`,
"goal":R`史灵生班往年资料补漏，概念与证明沿现有讲义衔接；不据跨班旧卷推定本学期必考。约30分钟完成讲解、概念与主线题，变种和延伸选做。`,
"sections":[
{"id":R`dplus8-s1`,"h":R`1. 整除条件只证明必要，不等于安排存在`,"html":R`<p>若v人每组k人，每对恰共同出现λ次，数（固定人，另一个人，含这对的组）得r(k−1)=λ(v−1)，再数（人，组）得bk=vr。它们只给必要整数条件。</p><p>可行安排必须实际列出，或定义有限集合上的统一规则，并证明每一对恰出现规定次数。以下用模2、模3的向量规则，均只是初等有限计数，非先假设“设计一定存在”。</p>`},
{"id":R`dplus8-s2`,"h":R`2. 三种小型构造：二进制加法与模3直线`,"html":R`<p>七人用F₂³的七个非零向量标号，每组取{x,y,x+y}，不同两人决定唯一第三人。这给7个三人组。</p><p>九人用F₃²标号，四天分别按x固定以及y−mx固定（m=0,1,2）分成三条平行线，每条3人。</p><p>八人用F₂³全部向量标号，七天分别选非零a，用a·x=0和a·x=1分成两个四人组。不同两人差d≠0，它们同组恰在a·d=0时；这样的非零a恰有3个。</p>`}
],

{"id":R`m-dplus8`,"title":R`构造区组：先算参数，再给规则，再数每对`,"steps":[R`先用r(k−1)=λ(v−1)、bk=vr排除整数障碍，不能据此宣布可行。`,R`给明确的点标签、每日/每组规则，注明同一天是否分组覆盖所有人。`,R`固定任意两人，用差向量或唯一第三人证明共同出现次数，再核总组数。`]}

"problems":[
{"id":R`dplus8-p1`,"lv":R`真题`,"src":R`2015 秋期末 8（英文转录，open疑为once）`,"stmt":R`七人每天只选三人同行，一周七天，能使每对恰同行一次吗？给出安排并验证。`,"hints":[R`把七人标1到7，按三位二进制向量看待。`,R`每组{x,y,x XOR y}。`,R`七组可列为123、145、167、246、257、347、356。`],"sol":R`<p>可以。依次安排{1,2,3}、{1,4,5}、{1,6,7}、{2,4,6}、{2,5,7}、{3,4,7}、{3,5,6}。</p><p>按二进制向量，任意两人x≠y决定唯一第三人x+y，且该第三人非零并不同于x,y。因此每一对恰在一组三元组中。每组三对，共7·3=21=C(7,2)，无漏无重。原转录英文第8题有拼写疑误，这里明确按上下文“一周每对一次”作标准重述，不将其当无疑义原文引述。</p>`,"method":R`m-dplus8`},
{"id":R`dplus8-p2`,"lv":R`真题`,"src":R`2017 秋期末 8（英文转录）`,"stmt":R`九人每天分三组三人，四天中每对恰同组一次，能否安排？`,"hints":[R`标为(x,y)∈{0,1,2}²。`,R`第一天x固定，其余三天y−mx固定，m=0,1,2。`,R`同x的两点只在竖直日同组；不同x时有唯一斜率。`],"sol":R`<p>可以。九人标模3坐标。第一天按x分组，后三天分别按y、y−x、y−2x的值分组；每天三组，每组三人。</p><p>任意两点若x相同，则只在第一天同组；若x不同，由模3中非零数可逆，唯一m=(y₂−y₁)/(x₂−x₁)∈{0,1,2}使它们同线。故每对恰同组一次。共12个三人组，贡献36对，等于C(9,2)。</p>`,"method":R`m-dplus8`},
{"id":R`dplus8-p3`,"lv":R`真题`,"src":R`2016 手写回忆 8；2018 回忆版 8`,"stmt":R`八人每天分两组、每组四人。七天中能否使每对恰同组三次？`,"hints":[R`标为F₂³全部8个向量，包括0。`,R`每天选择一个非零a，按a·x的0、1值分组。`,R`两人差d≠0，同组条件a·d=0，其非零解a有3个。`],"sol":R`<p>可以。七天分别取a=001,010,011,100,101,110,111，每天按二进制内积a·x分为两组。每个非零线性函数在8点上0、1各取4次，所以每日合法分组。</p><p>固定不同x,y，令d=x+y≠0，同组当且仅当a·d=0。该齐次方程在三维二进制空间有4个解，其中一个是0，故七个非零a中恰有3个使两人同组。这比只核总对数84=3C(8,2)更强：它逐对保证恰三次。</p>`,"method":R`m-dplus8`}
],
"variants":[
{"id":R`dplus8-v1`,"lv":R`变种`,"src":R`自编：晚年11人同行题的必要性判定`,"stmt":R`11人每天选3人，若每对恰同行一次，能否安排？若每天选6人，要求每对恰同行一次呢？`,"hints":[R`每人参加次数必须满足r(k−1)=10。`,R`k=3时r=5，但组数b=11·5/3非整数。`,R`k=6时r=2，但b=22/6也非整数。`],"sol":R`<p>k=3时b=11·10/(3·2)=55/3非整数；k=6时b=11·10/(6·5)=11/3非整数。因此两种均不可能。这里整数障碍足以否定，不需要寻找实际排表。</p>`,"method":R`m-dplus8`}
],
"extensions":[
{"id":R`dplus8-e1`,"lv":R`延伸`,"src":R`2024小班手稿第9页第7(2)方法补漏，非官方原卷`,"stmt":R`设v>3的集合上有Steiner三元系：每对恰属于一个三人组。若要求每个三人组不为单色，证明至少需要3种颜色。`,"hints":[R`假设可用两色，红r点、蓝b点。`,R`每个非单色三元组恰含2个异色点对，且每个异色对只在一块出现。`,R`rb=2·v(v−1)/6，而rb≤v²/4，得v≤4；参数条件排除v=4。`],"sol":R`<p>三元系计数给组数B=v(v−1)/6，每点出现(v−1)/2次，故v为奇数；又v>3，所以v≥5。若存在无单色的红蓝染色，设两色数r,b，则每块恰含2个异色点对，所有异色点对恰各出现一次，因此rb=2B=v(v−1)/3。</p><p>但rb≤(r+b)²/4=v²/4，于是4v(v−1)≤3v²，即v≤4，矛盾。所以至少3色。这里只证明必要色数，不声称任意Steiner三元系都可3染。</p>`,"method":R`m-dplus8`},
{"id":R`dplus8-e2`,"lv":R`延伸`,"src":R`2024小班手稿第9页第7(3)，经原图核对重述`,"stmt":R`在v点Steiner三元系中，证明能取出至少(v−1)/6个两两不交的三人组。`,"hints":[R`取极大的一族不交组，共k组；余下集合Z大小z=v−3k。`,R`Z中任意两点的第三点必须在已覆盖点中，否则还能加一组。`,R`固定已覆盖点，含它且另两点在Z中的组至多z/2个；数Z中点对。`],"sol":R`<p>取包含组数尽可能多（取极大也足够）的两两不交组族，共k组，余集Z大小z=v−3k。若z=0，已有k=v/3≥(v−1)/6。</p><p>若z>0，Z内每对点的唯一三元组必须以已覆盖点作第三点。固定一个已覆盖点c，所有含c的三元组中除c外的点对互不重叠（否则某对{c,x}重复），故其中位于Z的点对至多z/2个。共有3k个已覆盖点，因此C(z,2)≤3k·z/2。除以z/2得z−1≤3k，即v−3k−1≤3k，故k≥(v−1)/6。</p>`,"method":R`m-dplus8`}
]
}
};

LESSONS.n2.extensions.push({"id":R`n2-e2`,
"lv":R`延伸`,
"src":R`课堂记录_2026-11-17.pdf 第 7–9 页`,
"stmt":R`<p>称正整点 $(x,y)$ 从原点可见，如果线段从原点到它之间没有其他整点。</p><p>(1) 证明可见当且仅当 $(x,y)=1$。</p><p>(2) 对任意正整数 n，证明存在连续的 $n\times n$ 整点方阵，其中每个点都不可见。</p>`,
"hints":[R`(1) 若 gcd=d>1，(x/d,y/d) 是中间整点。若 gcd=1，用 Bezout 处理任何中间点 λ(x,y)。`,
R`(2) 给每个位置 (i,j) 分配不同素数 pᵢⱼ；要求 X+i 与 Y+j 同时被 pᵢⱼ 整除。`,
R`对 X 解全部 X≡−i (mod pᵢⱼ)，对 Y 解全部 Y≡−j (mod pᵢⱼ)；所有模数两两互素，CRT 保证解存在，再加公倍数使 X,Y 为正。`],
"method":R`m-nt-congruence`,
"sol":R`<p>(1) 若 d=(x,y)>1，则 (x/d,y/d) 是线段内部整点。反之若 d=1，Bezout 给 ux+vy=1。若 0&lt;λ&lt;1 且 λx、λy 都是整数，则 λ=u(λx)+v(λy) 是整数，与 0&lt;λ&lt;1 矛盾，故可见。</p><p>(2) 对 1≤i,j≤n 选互不相同的素数 pᵢⱼ。由 CRT，可同时解 X≡−i (mod pᵢⱼ)；另一次 CRT 解 Y≡−j (mod pᵢⱼ)。给 X,Y 加模数乘积的足够大倍数，取到正数。于是对每个方阵点 (X+i,Y+j)，其两个坐标都被 pᵢⱼ>1 整除，gcd>1，故都不可见。</p><p>用的是 n² 个不同素数，不是为每行只选一个素数；否则不同列的余数条件可能冲突。课堂记录第 8–9 页展示了 n=2 的 2、3、5、7 构造。</p>`});

Object.assign(LESSONS, {"dc1":{"unit":"count-fund","n":1,"title":"集合、映射与计数｜先写出对象，再消去重复","goal":"从映射的左逆和右逆开始，练按纤维计数、带标号分配与去重。","sections":[{"id":"dc1-s1","h":"像、原像与左右逆","html":"<p>对 $f:X\\to Y$，纤维 $f^{-1}(\\{y\\})=\\{x:f(x)=y\\}$ 可能为空、单点或多点。每条纤维至多一元等价于单射，纤维都非空等价于满射。若 $g\\circ f=I_X$，则 $f$ 为单射；若 $f\\circ g=I_Y$，则 $f$ 为满射。<\/p><p>反过来，对非空有限集合，单射时可在像上定义逆，在像外任选一个固定的 $X$ 中元素补齐左逆。满射时从每个纤维选一元得到右逆。双射时左右逆相同且唯一。<\/p>"},{"id":"dc1-s2","h":"计数是先找分类，再加或乘","html":"<p>不交分类用加法。若第 $j$ 步的选择数不依赖前面的选择，按步骤相乘。数有限映射 $X\\to Y$，若 $|X|=n, |Y|=m$，共有 $m^n$ 个。若按每个像值的纤维大小 $n_i$ 分类，固定大小的一类为 $n!/\\prod_i n_i!$。<\/p><p>对有限映射 $p:E\\to B$，$\\lvert E\\rvert=\\sum_{b\\in B}\\lvert p^{-1}(\\{b\\})\\rvert$；换一个映射换一种分组，就得到双计数。先检查哪些标签有意义。<\/p>"},{"id":"dc1-s3","h":"无标号组与插板是不同模型","html":"<p>给不同的对象分组，先看组大小是否已指定、各组是否带标号。若有若干同大小组且同大小组彼此无标号，要除以其排列数。相反，对同类物品放入 $k$ 个有标号盒且允许空盒，计的是 $x_1+\\cdots+x_k=N$ 的非负整数解，用 $N$ 颗星、$k-1$ 块板，得 $\\binom{N+k-1}{k-1}$。<\/p>"}],"widget":null,"concepts":[{"id":"dc1-c1","sec":"dc1-s1","q":"$g\\circ f=I_X$ 可以推出什么？","opts":["f 满射","f 单射","g 单射","f 与 g 必为双射"],"a":1,"ex":"若 f(x)=f(y)，两边施加 g 即得 x=y。"},{"id":"dc1-c2","sec":"dc1-s1","q":"满射有哪些纤维？","opts":["每条非空","每条恰一元","每条都是空集","恰有一条非空"],"a":0,"ex":"任意一个目标值至少有一个原像。"},{"id":"dc1-c3","sec":"dc1-s2","q":"6 个不同物体任放到 3 个有标号盒，共多少？","opts":["$6^3$","$3^6$","$\\binom63$","$6!$"],"a":1,"ex":"给每个物体独立选择一个盒号。"},{"id":"dc1-c4","sec":"dc1-s3","q":"不同对象分入两个无标号的同大小组，哪一步产生重复？","opts":["选出第一组时，两组可互换","每组内部都必须排序","同一对象可以放两次","组大小相同就不能分"],"a":0,"ex":"把两组交换不产生新分组。"}],"methods":[{"id":"m-dc1","title":"明确对象、标签和纤维","steps":["写出对象集合以及要计数的映射。","注明是注入、满射、双射还是一般映射。","去标号前证明每个无标号对象出现同样多次。"]}],"problems":[{"id":"dc1-p1","lv":"练习","src":"自编同类练习","stmt":"<p>令 $X=\\{1,2\\},Y=\\{a,b,c\\}$，给定 $f(1)=a,f(2)=c$。判断单射和满射，数出所有左逆和右逆。<\/p>","hints":["画出三个目标的纤维。","左逆在 a、c 上的取值已固定。","右逆是否可能把某点送回 b？"],"method":"m-dc1","sol":"<p>$f$ 单射但对 $b$ 无原像，故不是满射。左逆满足 $g(a)=1,g(c)=2$，$g(b)$ 可为任一 $X$ 中元素，共两种。右逆无，因为不存在 $x$ 使 $f(x)=b$。<\/p>"},{"id":"dc1-p2","lv":"练习","src":"自编同类练习","stmt":"<p>8 个不同的同学分成大小为 2、3、3 的三个无标号小组，有多少种？<\/p>","hints":["唯一的 2 人组可先确定。","余下 6 人选 3 人。","两支 3 人组交换要除以 2。"],"method":"m-dc1","sol":"<p>答案 $\\binom82\\binom63/2=28\\cdot20/2=280$。唯一的二人组不与三人组互换，所以只除两个同大小组的排列。<\/p>"}],"variants":[{"id":"dc1-v1","lv":"变种","src":"自编同类练习","stmt":"<p>把 9 个相同球放到 4 个有标号盒，第一个盒至少 2 个，其余可空。有多少种？<\/p>","hints":["先把第一个盒的最低要求满足。","转成四个非负整数和为 7。","七颗星和三块板总共占几个位置？"],"method":"m-dc1","sol":"<p>预留 2 球后，用三块板分配 7 球，得 $\\binom{10}{3}=120$。<\/p>"}],"extensions":[{"id":"dc1-e1","lv":"延伸","src":"自编同类练习","stmt":"<p>若 $\\mathcal A$ 是 $[n]$ 的子集族，任意两个不同成员互不包含，证明 $\\sum_{S\\in\\mathcal A}1/\\binom n{|S|}\\le1$。<\/p>","hints":["对 [n] 的每个排列取所有前缀集合。","一条前缀链最多遇到一个成员。","固定 S 成为前缀所对应的排列数是多少？"],"method":"m-dc1","sol":"<p>长度 $|S|$ 的前缀恰是 $S$ 有 $|S|!(n-|S|)!$ 个排列。每个排列至多给 $\\mathcal A$ 中一个成员计数，累加不超过 $n!$。同除 $n!$ 即得 LYM 不等式。这也推出 Sperner 上界 $\\lvert\\mathcal A\\rvert\\le\\binom n{\\lfloor n/2\\rfloor}$。<\/p>"}]},"dc2":{"unit":"count-fund","n":2,"title":"递推与生成函数｜Fibonacci、Stirling 与 Catalan","goal":"用分类写递推，用形式生成函数回收系数，熟悉两类 Stirling 数和 Catalan 数。","sections":[{"id":"dc2-s1","h":"判断新元素如何加入","html":"<p>第二类 Stirling 数 $S(n,k)$ 数 $n$ 个不同元素分成 $k$ 个无标号非空块。最后一个元素要么独占一块，要么进入 $k$ 个已有块之一，故 $S(n,k)=S(n-1,k-1)+kS(n-1,k)$。第一类不带符号 Stirling 数 $c(n,k)$ 数有 $k$ 个圈的排列，最后一个元素可独立为一个圈或插在旧元素之后，第二项改为 $(n-1)c(n-1,k)$。<\/p><p>两者均有空对象初值 $S(0,0)=c(0,0)=1$，域外值为零；第二类乘 $k!$ 才给到 $k$ 个标号值的满射数。<\/p>"},{"id":"dc2-s2","h":"生成函数把下标平移变成乘 x","html":"<p>普通生成函数 $A(x)=\\sum_{n\\ge0}a_n x^n$ 可作为形式幂级数运算。将递推求和时先保留前几项。例如 $F_0=0,F_1=1,F_{n+2}=F_{n+1}+F_n$，得到 $(1-x-x^2)A(x)=x$。若齐次递推的特征根重复，匹配初值时要用 $r^n,nr^n$ 这样的不同解。<\/p>"},{"id":"dc2-s3","h":"合法括号在第一对匹配括号处分解","html":"<p>设 $C_n$ 数 $n$ 对合法括号，$C_0=1$。非空串唯一写成 $(u)v$，若 $u$ 含 $k$ 对，则 $v$ 有 $n-1-k$ 对。因此 $C_n=\\sum_{k=0}^{n-1}C_kC_{n-1-k}$。对应 $C(x)=1+xC(x)^2$，取常数项为 1 的形式幂级数解。也可把左括号看作上步，右括号看作下步，用反射原理得 $C_n=\\binom{2n}{n}-\\binom{2n}{n+1}$。<\/p>"}],"widget":null,"concepts":[{"id":"dc2-c1","sec":"dc2-s1","q":"第二类 Stirling 的第二项系数为何是 k？","opts":["在 k 个非空块中选一块","在 k 个元素里选一个","必须编号所有组","因为最后一个元素不能加入旧块"],"a":0,"ex":"最后元素进入某个已经存在的块。"},{"id":"dc2-c2","sec":"dc2-s1","q":"第一类不带符号 Stirling 数的第二项系数是什么？","opts":["$k$","$n$","$n-1$","$k-1$"],"a":2,"ex":"最后元素插在原有任一元素后面。"},{"id":"dc2-c3","sec":"dc2-s2","q":"递推求和时前两项怎么处理？","opts":["丢掉","先把求和起始下标对应的初值移出来","用极限逼近","约定它们都为 0"],"a":1,"ex":"初值决定生成函数分子的项。"},{"id":"dc2-c4","sec":"dc2-s3","q":"$C_0$ 取多少？","opts":["0","1","2","无定义"],"a":1,"ex":"空括号串恰有一个，可当作独立拼接的单位。"}],"methods":[{"id":"m-dc2","title":"明确分类互斥、给初值、再求系数","steps":["明确用什么划分对象，以及不同分组是否会重复。","按边界条件求最小几项检查递推。","写生成函数时逐项指明乘 x 或截掉初值的影响。"]}],"problems":[{"id":"dc2-p1","lv":"练习","src":"自编同类练习","stmt":"<p>分别求 $S(4,2)$ 与 $c(4,2)$，解释两者为何不同。<\/p>","hints":["第二类按 1+3 或 2+2 分组。","第一类对每一块还要安排循环顺序。","单个 k 元圈有 (k−1)! 种顺序。"],"method":"m-dc2","sol":"<p>第二类为 $4+3=7$；第一类中 1+3 型为 $4\\cdot2=8$，2+2 型是 $3$，共 $11$。同样大小的无标号组不能重复编号。<\/p>"},{"id":"dc2-p2","lv":"练习","src":"自编同类练习","stmt":"<p>设 $F_0=0,F_1=1,F_{n+2}=F_{n+1}+F_n$。推出生成函数并求 $F_6$。<\/p>","hints":["把递推乘 x 的对应幂后求和。","减去初值项 x。","系数从 0、1 逐项推出。"],"method":"m-dc2","sol":"<p>若 $A=\\sum_n F_nx^n$，则 $A-x=xA+x^2A$，得 $A=x/(1-x-x^2)$。由递推系数为 $0,1,1,2,3,5,8,\\ldots$，所以 $F_6=8$。<\/p>"}],"variants":[{"id":"dc2-v1","lv":"变种","src":"自编同类练习","stmt":"<p>不用通项公式，从第一对匹配括号的分解求 $C_1$、$C_2$、$C_3$、$C_4$。<\/p>","hints":["从空串 C₀=1 起步。","第 4 项的卷积有 4 项。","配对的首因子不含第一对括号。"],"method":"m-dc2","sol":"<p>递推得到 $C_1=1,C_2=2,C_3=5$，$C_4=1\\cdot5+1\\cdot2+2\\cdot1+5\\cdot1=14$。<\/p>"}],"extensions":[{"id":"dc2-e1","lv":"延伸","src":"自编同类练习","stmt":"<p>$a_0=1,a_1=4$ 且 $a_{n+2}=4a_{n+1}-4a_n$。求通项。<\/p>","hints":["特征根 2 重复。","可令 bₙ=aₙ/2ⁿ 消掉指数。","b 的相邻差恒定，由初值求出。"],"method":"m-dc2","sol":"<p>$b_n=a_n/2^n$ 满足 $b_{n+2}=2b_{n+1}-b_n$。$b_0=1,b_1=2$，故 $b_n=1+n$，答案 $a_n=(1+n)2^n$。这也说明重根项为何需要乘 $n$。<\/p>"}]},"n3":{"unit":"nt","n":3,"title":"初等数论补练｜因子函数、剩余系与乘法阶","goal":"分解质因数、计算因子函数，再用既约剩余系和乘法阶做幂的取模。","sections":[{"id":"n3-s1","h":"质因数独立，化乘积为逐个选指数","html":"<p>若 $n=\\prod p_i^{e_i}$，每个正因子由指数 $0\\le a_i\\le e_i$ 唯一决定。因子数 $\\tau(n)=\\prod(e_i+1)$，因子和 $\\sigma(n)=\\prod(1+p_i+\\cdots+p_i^{e_i})$。gcd 取逐质数较小指数，lcm 取较大指数。<\/p>"},{"id":"n3-s2","h":"数互素剩余，再讨论乘法","html":"<p>模 $n$ 的全剩余系每种剩余类一次，既约剩余系只选与 $n$ 互素的类。容斥得 $\\varphi(n)=n\\prod_{p\\mid n}(1-1/p)$。若 $\\gcd(a,n)=1$，乘 $a$ 会置换既约剩余类，乘起所有类并合法消去公共的可逆乘积，得到 $a^{\\varphi(n)}\\equiv1\\pmod n$。<\/p>"},{"id":"n3-s3","h":"最小正阶只在单位元上讨论","html":"<p>定义 $\\operatorname{ord}_n(a)$ 为 $a^k\\equiv1\\pmod n$ 的最小正指数。只对 $\\gcd(a,n)=1$ 的类有这个定义。将任一满足条件的指数除以最小正阶并取余，余数必须是零。因此阶整除 $\\varphi(n)$，可检查其因子而不用从 1 穷举到 $\\varphi(n)$。<\/p>"}],"widget":null,"concepts":[{"id":"n3-c1","sec":"n3-s1","q":"$p^5$ 有几个正因子？","opts":["5","6","10","32"],"a":1,"ex":"指数从 0 到 5。"},{"id":"n3-c2","sec":"n3-s2","q":"乘 a 置换模 n 的既约剩余类需要什么？","opts":["a 偶数","n 素数","a 与 n 互素","a 与 n 同奇偶"],"a":2,"ex":"可逆元左乘可逆，所以是双射。"},{"id":"n3-c3","sec":"n3-s2","q":"$\\varphi(p^k)$ 等于什么？","opts":["$p^k-p^{k-1}$","$p^{k-1}$","$p-1$","$p^k$"],"a":0,"ex":"删去 p 的倍数即可。"},{"id":"n3-c4","sec":"n3-s3","q":"最小正阶与 Euler 函数有什么关系？","opts":["任意情况下相等","阶整除 Euler 函数","Euler 函数总整除阶","阶为负数也是允许的"],"a":1,"ex":"用指数的带余除法。"}],"methods":[{"id":"m-n3","title":"先分解模数，再限定可逆类","steps":["列出质因数分解与各指数。","明确能否在模 n 下消去，必要时改用互素条件。","求阶时核最小性，检查所有可能的真因子。"]}],"problems":[{"id":"n3-p1","lv":"练习","src":"自编同类练习","stmt":"<p>求 360 的正因子数、正因子和，以及 $\\gcd(360,84)$ 和 $\\operatorname{lcm}(360,84)$。<\/p>","hints":["$360=2^3\\cdot3^2\\cdot5$。","因子积开后每个指数独立。","84 还含质数 7。"],"method":"m-n3","sol":"<p>$\\tau(360)=4\\cdot3\\cdot2=24$，$\\sigma(360)=15\\cdot13\\cdot6=1170$。由 $84=2^2\\cdot3\\cdot7$，得 gcd 为 12，lcm 为 2520。<\/p>"},{"id":"n3-p2","lv":"练习","src":"自编同类练习","stmt":"<p>求 $\\varphi(72)$，并求 $5^{2026}\\bmod72$，结果写为最小非负剩余。<\/p>","hints":["模数只含质因子 2 和 3。","用 Euler 定理把 2026 化为模 24 的指数。","模 72 计算 5²、5⁴、5⁸。"],"method":"m-n3","sol":"<p>$\\varphi(72)=72(1-1/2)(1-1/3)=24$，$2026\\equiv10\\pmod{24}$。$5^2\\equiv25$，$5^4\\equiv49$，$5^8\\equiv25$，故 $5^{10}\\equiv49\\pmod{72}$。<\/p>"}],"variants":[{"id":"n3-v1","lv":"变种","src":"自编同类练习","stmt":"<p>求 $\\operatorname{ord}_{15}(2)$。指数为 2026 时，$2^{2026}$ 除以 15 余几？<\/p>","hints":["$\\varphi(15)=8$。","可检查 1、2、4、8。","指数化为模实际阶。"],"method":"m-n3","sol":"<p>$2^4=16\\equiv1$，而 $2^1,2^2$ 不等于 1，故阶为 4。$2026\\equiv2\\pmod{4}$，余数为 4。<\/p>"}],"extensions":[]},"dg1":{"unit":"geometry-count","n":1,"title":"组合几何｜分格与单调子序列","goal":"把几何距离和子序列约束变成可计数的标签，练两种抽屉原理。","sections":[{"id":"dg1-s1","h":"分格前先算每个格子的直径","html":"<p>把 $s\\times s$ 的正方形分成 $k\\times k$ 个小格，给分界线指定唯一归属。每格内两点的距离至多 $\\sqrt2s/k$。若点超过 $k^2$ 个，至少一格有两个点。需要严格小于时要选更小的格径或检查等号情形。<\/p>"},{"id":"dg1-s2","h":"把最长递增和递减长度当作标签","html":"<p>对互不相同的 $x_1,\\ldots,x_N$，令 $I_i,D_i$ 为以第 $i$ 项结尾的最长递增、递减子序列长度。若 $i\\lt j$，当 $x_i\\lt x_j$ 有 $I_j\\ge I_i+1$，当 $x_i\\gt x_j$ 有 $D_j\\ge D_i+1$。所以二元标签不会相同。<\/p><p>若既没有长度 $r+1$ 的递增，也没有长度 $s+1$ 的递减子序列，标签最多 $rs$ 种。因此 $rs+1$ 项足够。这里子序列保留原先的相对次序，允许跳项。<\/p>"}],"widget":null,"concepts":[{"id":"dg1-c1","sec":"dg1-s1","q":"单位正方形分成 4 个等方格，同格两点最大距离是多少？","opts":["$1/4$","$1/2$","$\\sqrt2/2$","$\\sqrt2$"],"a":2,"ex":"每格边长一半，距最远的是相对顶点。"},{"id":"dg1-c2","sec":"dg1-s1","q":"分格有边界点时需要什么？","opts":["可以漏掉边界点","把边界点各指定到一个格子","边界点必须复制到多个格子","边界点都算在左上角"],"a":1,"ex":"要得到一个覆盖所有点的确定映射。"},{"id":"dg1-c3","sec":"dg1-s2","q":"若 $i\\lt j$ 且 $x_i\\lt x_j$，怎样利用以 $i$ 结尾的递增子序列？","opts":["在最前方加 j","在末尾加 j","必须接上相邻项 i+1","只能得到递减子序列"],"a":1,"ex":"保留原位置顺序并且值变大。"},{"id":"dg1-c4","sec":"dg1-s2","q":"若递增、递减长度均不超过 3，最多有几种标签？","opts":["3","6","9","27"],"a":2,"ex":"每个分量都取 1、2、3。"}],"methods":[{"id":"m-dg1","title":"选能控制目标的抽屉","steps":["先写两个对象落入同一抽屉推出什么。","核清抽屉数、放入对象数与边界归属。","子序列题用可以接续的最长长度作标签。"]}],"problems":[{"id":"dg1-p1","lv":"练习","src":"自编同类练习","stmt":"<p>单位正方形内任取 10 个点，证明两点距离不超过 $\\sqrt2/3$。<\/p>","hints":["目标距离是小正方形的对角线。","等分成 3×3。","每个点指定唯一归属后用抽屉。"],"method":"m-dg1","sol":"<p>9 个边长 $1/3$ 的格容纳 10 个点，有两点同格。其距离至多格子的对角线 $\\sqrt2/3$。<\/p>"},{"id":"dg1-p2","lv":"练习","src":"自编同类练习","stmt":"<p>证明任何 13 个互异实数组成的序列必有长度 4 的严格递增子序列，或长度 5 的严格递减子序列。<\/p>","hints":["为每个位置记两种最长长度。","若两类目标都没有，两分量分别不超过 3、4。","证明较后的同标签位置不可能存在。"],"method":"m-dg1","sol":"<p>反设两类都没有，标签只有 $3\\cdot4=12$ 种。若 $i\\lt j$，则 $x_i\\lt x_j$ 或 $x_i\\gt x_j$；前者使 $I_j\\gt I_i$，后者使 $D_j\\gt D_i$。标签全不同，容不下 13 项，矛盾。<\/p>"}],"variants":[{"id":"dg1-v1","lv":"变种","src":"自编同类练习","stmt":"<p>构造 12 个互异实数的序列，其最长递增长度为 3、最长递减长度为 4。<\/p>","hints":["把 12 个数分成三个递减块。","较后的块整体取更大的值。","检查递减不能跨块，递增每块最多取一个。"],"method":"m-dg1","sol":"<p>用 $4,3,2,1,\\ 8,7,6,5,\\ 12,11,10,9$。递增最多每块选一个，可选 $1,5,9$；递减不能跨块，每块长度 4。<\/p>"}],"extensions":[]},"code1":{"unit":"geometry-count","n":2,"title":"简单编码理论｜Hamming 距离入门（预习）","goal":"课程安排列有简单编码理论。以下为基础预习，课堂细节与实际作业范围待核。","sections":[{"id":"code1-s1","h":"码字之间要留多大间隔","html":"<p>二元字 $u,v$ 的 Hamming 距离 $d(u,v)$ 是不同位置的数量。每个位上的不同关系满足三角不等式，求和得到 $d(u,v)\\le d(u,w)+d(w,v)$。码的最小距离是不同码字距离的最小值。<\/p>"},{"id":"code1-s2","h":"检错与纠错看不同的半径","html":"<p>若 $d_{\\min}\\ge e+1$，至多 $e$ 个错误不会把一个码字变成另一个码字，因此一定可检测。若 $d_{\\min}\\ge2t+1$，半径 $t$ 的球互不相交，至多 $t$ 个错误可按唯一最近码字纠正。<\/p><p>例：$\\{000,111\\}$ 的最小距离为 3，可保证检两错或纠一错。若有两处错误却用一错模型强行解码，可能误纠。<\/p>"}],"widget":null,"concepts":[{"id":"code1-c1","sec":"code1-s1","q":"$d(0011,1010)$ 是多少？","opts":["1","2","3","4"],"a":1,"ex":"第1和第4位不同。"},{"id":"code1-c2","sec":"code1-s2","q":"最小距离为 4 可保证检测几处错误？","opts":["1","2","3","4"],"a":2,"ex":"严格少于最小距离。"},{"id":"code1-c3","sec":"code1-s2","q":"最小距离为 4 可保证纠正几处错误？","opts":["1","2","3","4"],"a":0,"ex":"要求 $2t+1\\le4$，最大整数 t 为 1。"},{"id":"code1-c4","sec":"code1-s2","q":"收到的字距两个码字都为 2，能唯一纠两错吗？","opts":["能，选编号较小的","能，重复读取","不能从距离唯一确定","当字是偶数长度就能"],"a":2,"ex":"两个码字都符合二错模型。"}],"methods":[{"id":"m-code1","title":"算距离，再决定保证","steps":["列出码字并计算不同码字的最小距离。","检错最多 d−1，纠错最多下取整 (d−1)/2。","用一个发生歧义的接收字检查界限。"]}],"problems":[{"id":"code1-p1","lv":"练习","src":"自编同类练习","stmt":"<p>对 $\\{0000,1111\\}$，求保证检错数和纠错数，并给一个二错歧义接收字。<\/p>","hints":["两码字四位全不同。","检错只需接收字不落在其他码字，纠错需要唯一。","选恰好两个 1。"],"method":"m-code1","sol":"<p>$d_{\\min}=4$，保证检三错、纠一错。$0011$ 离两个码字都为 2，二错时无法唯一确定。<\/p>"},{"id":"code1-p2","lv":"练习","src":"自编同类练习","stmt":"<p>所有三位二元偶校验字组成码。列出码字与最小距离，说明一错能否检测和纠正。<\/p>","hints":["偶校验指 1 的个数为偶数。","一个位翻转会改变奇偶性。","试 100 离哪些码字只差一位。"],"method":"m-code1","sol":"<p>码字为 $000,011,101,110$，不同码字相差 2 位。保证检一错，不保证纠一错，例如 $100$ 同时距 $000$ 与 $101$ 一位。<\/p>"}],"variants":[],"extensions":[]}});
LESSONS.count2.variants.push(...[{"id":"count2-v2","lv":"练习","src":"自编同类练习","stmt":"<p>二元变量 $X,Y$ 的联合概率按 $(0,0),(0,1),(1,0),(1,1)$ 依次为 $3/8,1/8,1/8,3/8$。求两边的边际分布，判断是否独立，并求 $\\operatorname{Var}(X+Y)$。<\/p>","hints":["边际概率沿联合表行列相加。","比较 P(X=1,Y=1) 与两个边际概率的乘积。","先算协方差，或者直接列 X+Y 的三点分布。"],"sol":"<p>两边各以概率 $1/2$ 取 1，但 $P(X=Y=1)=3/8\\ne1/4$，不独立。$\\operatorname{Cov}(X,Y)=3/8-1/4=1/8$，两边方差均为 $1/4$，故和的方差为 $3/4$。直接算也可：$X+Y$ 以概率 $3/8,1/4,3/8$ 取 0、1、2，均值为 1。<\/p>","method":"m-joint-table"}]);

LESSONS.count2.variants.push(
  {"id": "count2-ordered-collision", "lv": "变种", "src": "自编练习 · 有序试验与最小阈值", "stmt": "<p>每台终端独立、等概率地从 $24$ 个标签中选一个。求让“至少两台选了相同标签”的概率严格大于 $1/2$ 所需的最少台数。先用组合数写无碰撞的有利结果数，再验算阈值两侧。</p>", "hints": ["把终端编号。一次结果是按终端排列的标签序列。", "先选出 $k$ 个不同标签，再把这 $k$ 个标签一一分派给终端。", "无碰撞概率逐台乘 $(24-j)/24$。对 $k=6,7$ 比较它与 $1/2$，并说明单调性。"], "method": "m-prob-space", "sol": "<p>对 $1\\le k\\le24$，无碰撞的序列共 $\\binom{24}{k}k!$ 个，除以样本总数 $24^k$。只写 $\\binom{24}{k}$ 会漏掉同一组标签在终端间的 $k!$ 种分派。$k&gt;24$ 时无碰撞概率为零。</p><p>记 $Q_k$ 为无碰撞概率，$Q_{k+1}=Q_k(24-k)/24$，故碰撞概率随台数增加而不减。$Q_6=168245/331776&gt;1/2$，$Q_7=(18/24)Q_6=168245/442368&lt;1/2$，所以最少 $7$ 台。</p>"},
  {"id": "count2-weighted-outcomes", "lv": "变种", "src": "自编练习 · 非等概率样本", "stmt": "<p>一次巡检只会产生 $a,b,c,d$ 四种结果，概率分别为 $1/2,1/4,1/8,1/8$。系统甲在 $\\{a,c\\}$ 报警，乙在 $\\{a,b\\}$ 报警，丙在 $\\{b,c,d\\}$ 报警。求至少两套报警的概率和报警套数的期望。两者能否只用满足条件的结果个数计算？</p>", "hints": ["先逐个结果写下报警套数。", "$a,b,c$ 各触发两套，$d$ 只触发一套。", "事件概率加对应的概率权重；期望用报警套数乘结果权重再求和。"], "method": "m-prob-space", "sol": "<p>四种结果的报警套数依次为 $2,2,2,1$。因此 $\\Pr(X\\ge2)=1/2+1/4+1/8=7/8$，且 $\\mathbb E X=2(7/8)+1(1/8)=15/8$。用三个符合结果除以四会得到 $3/4$，相当于换成了等概率样本。</p><p>也可把各系统的报警指示变量相加。三套报警概率分别为 $5/8,3/4,1/2$，期望之和仍是 $15/8$，无需报警事件互相独立。</p>"}
);

/* ================= 状态与存储 ================= */
const IN_CLAUDE = !!(window.claude && window.claude.use);
const LS_KEY = "ls1-progress-v1";
const RECORD_PREFIX = LS_KEY + ":";
let db = null;
const chains = Object.create(null);
const state = Object.create(null);
function readProgress(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value && typeof value === "object" && !Array.isArray(value) ? value : null;
  } catch (e) { return null; }
}
function progressTime(record) {
  const time = Number(record?.updatedAt);
  return Number.isFinite(time) ? time : 0;
}
function adoptProgress(id, record, preferStored = false) {
  if (!record || typeof record !== "object" || Array.isArray(record)) return;
  const old = state[id];
  const time = progressTime(record);
  if (!old || time > progressTime(old) || (preferStored && time === progressTime(old))) state[id] = record;
}
function readLocalRecord(id) {
  if (!IN_CLAUDE) adoptProgress(id, readProgress(RECORD_PREFIX + id), true);
}
function readLocalProgress() {
  for (const [id, record] of Object.entries(readProgress(LS_KEY) || {})) adoptProgress(id, record);
  if (IN_CLAUDE) return;
  // 原进度键作为兼容来源。每次只写自己的题，旧标签页不会盖掉其他题。
  try {
    for (const key of Object.keys(localStorage)) {
      if (key.startsWith(RECORD_PREFIX)) readLocalRecord(key.slice(RECORD_PREFIX.length));
    }
  } catch (e) {}
}
readLocalProgress();
function cacheLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function putRecord(id, record) {
  state[id] = record;
  if (!IN_CLAUDE) {
    try { localStorage.setItem(RECORD_PREFIX + id, JSON.stringify(record)); } catch (e) {}
  }
  if (db) {
    chains[id] = (chains[id] || Promise.resolve()).then(() => db.doc("progress/" + id).set(record)).catch(() => {});
  }
}
function save(id, patch) {
  readLocalRecord(id);
  const old = state[id];
  putRecord(id, { ...old, ...patch, updatedAt: Math.max(Date.now(), progressTime(old) + 1) });
  if (IN_CLAUDE) cacheLocal();
  if (!Object.hasOwn(patch, "answer")) refreshNavProgress();
}
function setSync(on, text) {
  const el = document.getElementById("sync");
  el.classList.toggle("on", on);
  el.querySelector("span").textContent = text;
}
(async () => {
  if (!window.claude || !window.claude.use) return;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) return;
  setSync(false, "正在连接云端…");
  const timer = setTimeout(() => setSync(false, "云端暂时连不上，先存在本浏览器"), 10000);
  db.collection("progress").onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync(true, "已同步到云端"); }
    for (const d of snap.docs) {
      const cur = state[d.id];
      const inc = d.data();
      if (!cur || (inc.updatedAt || 0) >= (cur.updatedAt || 0)) state[d.id] = JSON.parse(JSON.stringify(inc));
    }
    cacheLocal();
    refreshNavProgress();
    syncVisible();
  }, () => { clearTimeout(timer); db = null; setSync(false, "云端不可用，存在本浏览器"); });
})();

function typeset(el, after) {

/* ================= 导出 ================= */
function buildMarkdown() {
  let md = "# 离散数学期末冲刺：我的作答\n";
  for (const [lid, L] of Object.entries(LESSONS)) {
    md += `\n## 第 ${L.n} 课 ${textOf(L.title)}\n`;
    const wrongC = L.concepts.filter(c => state[c.id] && state[c.id].picked != null && state[c.id].picked !== c.a);
    if (wrongC.length) md += `\n概念题答错：${wrongC.map(c => c.id).join("、")}\n`;
    for (const p of allItems(L)) {
      const r = state[p.id] || {};
      if (!r.answer && !r.status) continue;
      md += `\n### ${p.id}（${p.lv} · ${p.src}）\n**题目**：${textOf(p.stmt)}\n\n**状态**：${statusLabel(r.status)}，用了 ${r.hints || 0} 层提示${r.sawSol ? "，看过解答" : ""}\n\n**我的作答**：\n${r.answer || "（未写）"}\n`;
      if (r.feedback) md += `\n**AI 批改**：\n${r.feedback}\n`;
    }
  }
  return md;
}

const META_KEY = "ls1-meta-v1";
function getMeta() { try { return JSON.parse(localStorage.getItem(META_KEY) || "{}") || {}; } catch (e) { return {}; } }
function setMeta(p) { try { localStorage.setItem(META_KEY, JSON.stringify(Object.assign(getMeta(), p))); } catch (e) {} }

function mergeIn(obj) {
  if (!obj || obj.app !== "ls1" || !obj.state || typeof obj.state !== "object" || Array.isArray(obj.state)) throw new Error("不是这个页面导出的进度");
  if (!IN_CLAUDE) readLocalProgress();
  let added = 0, updated = 0, kept = 0;
  for (const [id, inc] of Object.entries(obj.state)) {
    if (!/^[A-Za-z0-9_-]{1,80}$/.test(id) || !inc || typeof inc !== "object" || Array.isArray(inc)) continue;
    readLocalRecord(id);
    const cur = state[id];
    if (!cur) { putRecord(id, inc); added++; }
    else if (progressTime(inc) > progressTime(cur)) { putRecord(id, inc); updated++; }
    else kept++;
  }
  if (IN_CLAUDE) cacheLocal();
  refreshNavProgress();
  return { added, updated, kept };
}

    return "GW1z." + b64FromBytes(gz);

}
async function decodeCode(code) {

    if (!window.DecompressionStream) throw new Error("这个浏览器太旧，解不开压缩的同步码");
    bytes = new Uint8Array(await new Response(new Blob([bytesFromB64(code.slice(5))]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  } else if (code.startsWith("GW1.")) bytes = bytesFromB64(code.slice(4));

}

  let out = "";

    out = text;
    save(id, { feedback: out, gradedAt: Date.now() });
    rerenderProb(id);
  } catch (err) {
    const code = err && err.code;
    if (code === "cancelled") { msg.textContent = ""; }

  let di = 0;
  const box = $("#crow", mount);
  function renderRows() {
    box.innerHTML = rows.map(([a, m], i) => `<div class="ctrl"><label>x ≡ <input type="number" data-i="${i}" data-k="0" value="${a}" aria-label="第 ${i + 1} 个余数"></label><label>(mod <input type="number" data-i="${i}" data-k="1" value="${m}" min="2" max="999" aria-label="第 ${i + 1} 个模数">)</label></div>`).join("");
    box.querySelectorAll("input").forEach(el => el.addEventListener("input", () => { rows[+el.dataset.i][+el.dataset.k] = Math.trunc(+el.value || 0); calc(); }));
    calc();
  }
  function calc() {
    const out = $("#cout", mount), tab = $("#ctab", mount);
    if (rows.some(([, m]) => !(m >= 2 && m <= 999))) { tab.innerHTML = ""; out.innerHTML = "<span>模数要在 2 到 999 之间。</span>"; return; }
    const bad = [];
    for (let i = 0; i < rows.length; i++) for (let j = i + 1; j < rows.length; j++) { const g = gcd(rows[i][1], rows[j][1]); if (g > 1) bad.push([i, j, g]); }
    if (!bad.length) {
      const M = rows.reduce((s, [, m]) => s * BigInt(m), 1n);
      let x = 0n;
      const tr = rows.map(([a, m]) => { const N = M / BigInt(m), Nm = Number(N % BigInt(m)), L = inv(Nm, m), Mi = N * BigInt(L); x += BigInt(mod(a, m)) * Mi; return `<tr><td>${m}</td><td>${mod(a, m)}</td><td>${N}</td><td>${Nm}</td><td>${L}</td><td>${Mi}</td></tr>`; }).join("");
      x %= M;
      tab.innerHTML = `<table><thead><tr><th>m<sub>i</sub></th><th>a<sub>i</sub></th><th>N<sub>i</sub> = M/m<sub>i</sub></th><th>N<sub>i</sub> mod m<sub>i</sub></th><th>L<sub>i</sub> = 逆元</th><th>M<sub>i</sub> = N<sub>i</sub>L<sub>i</sub></th></tr></thead><tbody>${tr}</tbody></table>`;
      out.innerHTML = `<span>M = <b>${M}</b></span><span>x ≡ Σ a<sub>i</sub>M<sub>i</sub> ≡ <b>${x}</b> (mod ${M})</span><span>验算：${rows.map(([, m]) => `${x} mod ${m} = ${Number(x % BigInt(m))}`).join("，")}</span>`;
      return;
    }
    // 模数不互素：逐个合并
    let [a0, m0] = [mod(rows[0][0], rows[0][1]), rows[0][1]], steps = [], ok = true;
    for (let i = 1; i < rows.length && ok; i++) {
      const [b, n] = [mod(rows[i][0], rows[i][1]), rows[i][1]], g = gcd(m0, n);
      if ((b - a0) % g) { steps.push(`合并第 ${i + 1} 个：gcd(${m0}, ${n}) = ${g} 不整除 ${b} − ${a0}，<b>无解</b>`); ok = false; break; }
      const n1 = n / g, m1 = m0 / g, c = (b - a0) / g;
      const t = n1 === 1 ? 0 : mod(c * inv(m1 % n1, n1), n1), l = m1 * n;
      if (l > 1e12) { steps.push("模数太大，停止合并。"); ok = false; break; }
      const na = mod(a0 + m0 * t, l);
      steps.push(`合并第 ${i + 1} 个：x = ${a0} + ${m0}t，${m0}t ≡ ${b - a0} (mod ${n})，t ≡ ${t} (mod ${n / g})，得 x ≡ ${na} (mod ${l})`);
      [a0, m0] = [na, l];
    }
    tab.innerHTML = `<div class="prose small"><p>模数不两两互素（${bad.map(([i, j, g]) => `m<sub>${i + 1}</sub>, m<sub>${j + 1}</sub> 的公因数 ${g}`).join("；")}），不能直接用 N、L、M 公式，改用逐个合并：</p><ol>${steps.map(s => `<li>${s}</li>`).join("")}</ol></div>`;
    out.innerHTML = ok ? `<span>x ≡ <b>${a0}</b> (mod ${m0})</span><span>验算：${rows.map(([, m]) => `${a0} mod ${m} = ${a0 % m}`).join("，")}</span>` : `<span>方程组<b>无解</b></span>`;
  }
  $("#cadd", mount).addEventListener("click", () => { if (rows.length < 5) { rows.push([1, [11, 13, 17, 19, 23][rows.length % 5]]); renderRows(); } });
  $("#cdel", mount).addEventListener("click", () => { if (rows.length > 2) { rows.pop(); renderRows(); } });
  $("#cdemo", mount).addEventListener("click", () => { di = (di + 1) % demos.length; rows = demos[di].map(r => r.slice()); renderRows(); });
  renderRows();
  typeset(mount);
}

/* ================= 交互工具：普吕弗编码 ================= */
function pruferPlay(mount) {
  mount.innerHTML = `<div class="widget">
    <div class="ctrl">
      <label for="pseq">普吕弗序列 <input id="pseq" type="text" value="2,2,1,1" style="width:12em" aria-label="普吕弗序列，用逗号分隔"></label>
      <label for="pn">n = <input id="pn" type="number" value="6" min="2" max="16" style="width:4.5em"></label>
      <button class="btn" id="prand" type="button">随机一棵</button>
    </div>
    <div class="ctrl"><label for="pstep">删叶步数 <input id="pstep" type="range" min="0" max="5" value="0"></label><b class="mono" id="pstepv"></b></div>
    <div id="psvg"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>这一步删去的叶 x<sub>i</sub></span><span><i style="background:var(--teal)"></i>它的邻点 y<sub>i</sub></span><span><i style="background:var(--line)"></i>已删去</span></div>
    <div class="table-wrap" id="ptab"></div>
    <div class="readout" id="pout"></div>
    <p class="small muted">表格从左往右读是编码（删最小的叶、记邻点），从右往左添边是还原。n 不填时取序列长度 + 2。</p>
  </div>`;
  const seqIn = $("#pseq", mount), nIn = $("#pn", mount), stepIn = $("#pstep", mount);
  let T = null;
  function decode(y, n) {
    const ys = y.concat([n]), used = new Set(), xs = [];
    for (let i = 0; i < n - 1; i++) {
      const ex = new Set([...used, ...ys.slice(i)]);
      let x = 1; while (ex.has(x)) x++;
      xs.push(x); used.add(x);
    }
    return { n, xs, ys, edges: xs.map((x, i) => [x, ys[i]]) };
  }
  function layout(t) {
    const adj = Array.from({ length: t.n + 1 }, () => []);
    t.edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
    const depth = Array(t.n + 1).fill(-1), order = [], par = Array(t.n + 1).fill(0);
    depth[t.n] = 0; const q = [t.n];
    while (q.length) { const v = q.shift(); order.push(v); adj[v].sort((a, b) => a - b).forEach(w => { if (depth[w] < 0) { depth[w] = depth[v] + 1; par[w] = v; q.push(w); } }); }
    // 叶子按 DFS 顺序排横坐标，内点取子节点平均
    const pos = {}, kids = v => adj[v].filter(w => w !== par[v] && depth[w] === depth[v] + 1);
    let cur = 0;
    (function dfs(v) { const ks = kids(v); if (!ks.length) { pos[v] = cur++; return; } ks.forEach(dfs); pos[v] = ks.reduce((s, w) => s + pos[w], 0) / ks.length; })(t.n);
    const D = Math.max(...depth.slice(1));
    return { x: pos, y: depth, W: Math.max(cur, 1), D };
  }
  function build() {
    const raw = seqIn.value.split(/[^0-9]+/).filter(Boolean).map(Number);
    let n = +nIn.value || raw.length + 2;
    const out = $("#pout", mount);
    if (n !== raw.length + 2) { n = raw.length + 2; nIn.value = n; }
    if (n < 2 || n > 16) { T = null; out.innerHTML = "<span>序列长度要在 0 到 14 之间（n 为 2–16）。</span>"; $("#psvg", mount).innerHTML = ""; $("#ptab", mount).innerHTML = ""; return; }
    if (raw.some(v => v < 1 || v > n)) { T = null; out.innerHTML = `<span>序列里的数都要在 1 到 ${n} 之间。</span>`; $("#psvg", mount).innerHTML = ""; $("#ptab", mount).innerHTML = ""; return; }
    T = decode(raw, n); T.L = layout(T);
    stepIn.max = n - 1; if (+stepIn.value > n - 1) stepIn.value = 0;
    const cnt = {}; raw.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
    const leaves = []; for (let v = 1; v <= n; v++) if (!cnt[v]) leaves.push(v);
    out.innerHTML = `<span>边：${T.edges.map(([a, b]) => Math.min(a, b) + "–" + Math.max(a, b)).join("，")}</span><span>叶（没在序列里出现的标号）：${leaves.join("、")}，共 ${leaves.length} 个</span><span>度数 = 1 + 出现次数：${Object.keys(cnt).map(v => `d(${v}) = ${1 + cnt[v]}`).join("，") || "全是叶"}</span>`;
    draw();
  }
  function draw() {
    if (!T) return;
    const k = +stepIn.value, n = T.n, { x, y, W, D } = T.L;
    $("#pstepv", mount).textContent = k === 0 ? "原树" : k <= n - 2 ? `第 ${k} 步：删 ${T.xs[k - 1]}，记 ${T.ys[k - 1]}` : `第 ${k} 步：删 ${T.xs[k - 1]}，只剩 ${n}`;
    const VW = 640, VH = 70 + 70 * D, px = v => 30 + (W === 1 ? (VW - 60) / 2 : x[v] / (W - 1) * (VW - 60)), py = v => 30 + y[v] * 70;
    const gone = new Set(T.xs.slice(0, Math.max(0, k - 1))), cx = k ? T.xs[k - 1] : null, cy = k ? T.ys[k - 1] : null;
    const edges = T.edges.map(([a, b], i) => { const del = i < k - 1, now = i === k - 1; return `<line x1="${px(a)}" y1="${py(a)}" x2="${px(b)}" y2="${py(b)}" style="stroke:var(${now ? "--accent" : del ? "--line" : "--ink"});stroke-width:${now ? 3.5 : 2}${del ? ";stroke-dasharray:4 4" : ""}"/>`; }).join("");
    const nodes = []; for (let v = 1; v <= n; v++) {
      const fill = v === cx ? "--accent" : v === cy ? "--teal" : gone.has(v) ? "--bg" : "--surface", ink = v === cx || v === cy ? "--accent-ink" : gone.has(v) ? "--muted" : "--ink";
      nodes.push(`<g><circle cx="${px(v)}" cy="${py(v)}" r="14" style="fill:var(${fill});stroke:var(${gone.has(v) ? "--line" : "--ink"});stroke-width:1.5"/><text x="${px(v)}" y="${py(v) + 4.5}" text-anchor="middle" style="fill:var(${ink});font:600 13px var(--f-mono)">${v}</text></g>`);
    }
    $("#psvg", mount).innerHTML = `<svg viewBox="0 0 ${VW} ${VH}" style="width:100%;max-height:360px;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="由普吕弗序列还原出的树">${edges}${nodes.join("")}</svg>`;
    const th = T.xs.map((_, i) => `<th style="text-align:center${i === k - 1 ? ";color:var(--accent)" : ""}">${i + 1}</th>`).join("");
    const row = (arr, lab) => `<tr><td>${lab}</td>${arr.map((v, i) => `<td style="text-align:center${i === k - 1 ? ";font-weight:700;color:var(--accent)" : i < k - 1 ? ";color:var(--muted)" : ""}">${v}</td>`).join("")}</tr>`;
    $("#ptab", mount).innerHTML = `<table><thead><tr><th>i</th>${th}</tr></thead><tbody>${row(T.xs, "x<sub>i</sub> 删去的叶")}${row(T.ys.map((v, i) => i === n - 2 ? v + "*" : v), "y<sub>i</sub> 邻点")}</tbody></table><p class="small muted">* 末项 y<sub>n−1</sub> = n 是补上的，不属于序列。</p>`;
  }
  seqIn.addEventListener("input", () => { nIn.value = ""; build(); });
  nIn.addEventListener("change", () => { const n = +nIn.value; if (n >= 2 && n <= 16) { const raw = seqIn.value.split(/[^0-9]+/).filter(Boolean).map(Number); while (raw.length < n - 2) raw.push(1); raw.length = n - 2; seqIn.value = raw.join(","); } build(); });
  stepIn.addEventListener("input", draw);
  $("#prand", mount).addEventListener("click", () => { const n = 6 + Math.floor(Math.random() * 5); seqIn.value = Array.from({ length: n - 2 }, () => 1 + Math.floor(Math.random() * n)).join(","); nIn.value = n; stepIn.value = 0; build(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  build();
}


/* ================= 交互工具：最便宜生成树 ================= */
function mstPlay(mount) {
  const nodes = { A: [55, 155], B: [175, 45], C: [230, 155], D: [175, 265], E: [415, 155], F: [345, 265], G: [545, 265], H: [545, 45] };
  const edges = [["A", "B", 9], ["A", "C", 5], ["A", "D", 2], ["B", "E", 2], ["B", "H", 7], ["C", "E", 3], ["C", "D", 8], ["C", "F", 6], ["D", "F", 4], ["E", "G", 2], ["E", "H", 6], ["F", "G", 1]];
  const key = e => e[0] + e[1];
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="mst-mode">算法 <select id="mst-mode"><option value="add">Kruskal：从轻到重加边</option><option value="delete">逆向：从重到轻删边</option></select></label></div>
    <div class="ctrl"><button class="btn" id="mst-prev" type="button">上一步</button><button class="btn" id="mst-next" type="button">下一步</button><button class="btn" id="mst-reset" type="button">重置</button></div>
    <div class="ctrl"><label for="mst-step">检查边数 <input id="mst-step" type="range" min="0" max="12" value="0"></label><b class="mono" id="mst-step-label"></b></div>
    <div id="mst-graph"></div>
    <div class="legend"><span><i style="background:var(--teal)"></i>已选 / 必须保留</span><span><i style="background:var(--accent)"></i>本步检查</span><span><i style="background:var(--line)"></i>虚线：跳过 / 已删除</span></div>
    <div class="readout" id="mst-out" aria-live="polite"></div>
    <div class="table-wrap" id="mst-table"></div>
    <p class="small muted">权相同按边名字母序检查。加边模式选满 7 条即可停；工具继续显示剩余边的成圈检查，方便核对。切换算法从第 0 步开始。</p>
  </div>`;
  const mode = $("#mst-mode", mount), slider = $("#mst-step", mount);
  let steps = [], ordered = [];
  function components(keys) {
    const parent = Object.fromEntries(Object.keys(nodes).map(v => [v, v]));
    function root(v) { while (parent[v] !== v) v = parent[v]; return v; }
    for (const e of edges) if (keys.has(key(e))) parent[root(e[0])] = root(e[1]);
    return { root, count: new Set(Object.keys(nodes).map(root)).size };
  }
  function rebuild() {
    const deleting = mode.value === "delete";
    ordered = edges.slice().sort((a, b) => (deleting ? b[2] - a[2] : a[2] - b[2]) || key(a).localeCompare(key(b)));
    const present = new Set(deleting ? edges.map(key) : []), kept = new Set(), removed = new Set();
    steps = [{ present: new Set(present), kept: new Set(), removed: new Set(), message: deleting ? "从完整图开始，检查删边后是否仍连通。" : "从空森林开始，检查边的两端是否属于不同分支。" }];
    for (const e of ordered) {
      const id = key(e);
      let message;
      if (deleting) {
        present.delete(id);
        if (components(present).count === 1) { removed.add(id); message = `删除 ${id}（权 ${e[2]}）：删后仍连通。`; }
        else { present.add(id); kept.add(id); message = `保留 ${id}（权 ${e[2]}）：它是当前图的桥，删后不连通。`; }
      } else {
        const c = components(present);
        if (c.root(e[0]) !== c.root(e[1])) { present.add(id); kept.add(id); message = `选入 ${id}（权 ${e[2]}）：连接两个不同分支。`; }
        else { removed.add(id); message = `跳过 ${id}（权 ${e[2]}）：两端已连通，加入会成圈。`; }
      }
      steps.push({ present: new Set(present), kept: new Set(kept), removed: new Set(removed), message });
    }
    slider.value = 0;
    draw();
  }
  function draw() {
    const k = +slider.value, s = steps[k], current = k ? key(ordered[k - 1]) : "", deleting = mode.value === "delete";
    $("#mst-step-label", mount).textContent = `${k} / ${ordered.length}`;
    $("#mst-prev", mount).disabled = k === 0;
    $("#mst-next", mount).disabled = k === ordered.length;
    const lines = edges.map(e => {
      const id = key(e), [x1, y1] = nodes[e[0]], [x2, y2] = nodes[e[1]], gone = s.removed.has(id);
      const color = id === current ? "--accent" : gone ? "--line" : s.kept.has(id) ? "--teal" : "--muted";
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 9;
      return `<g><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(${color});stroke-width:${id === current ? 4 : 2.5}${gone ? ";stroke-dasharray:6 5" : ""}"/><circle cx="${mx}" cy="${my}" r="11" style="fill:var(--bg)"/><text x="${mx}" y="${my + 4}" text-anchor="middle" style="fill:var(--ink);font:600 14px var(--f-mono)">${e[2]}</text></g>`;
    }).join("");
    const circles = Object.entries(nodes).map(([v, [x, y]]) => `<g><circle cx="${x}" cy="${y}" r="17" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.5"/><text x="${x}" y="${y + 5}" text-anchor="middle" style="fill:var(--ink);font:600 15px var(--f-mono)">${v}</text></g>`).join("");
    $("#mst-graph", mount).innerHTML = `<svg viewBox="0 0 600 310" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="2022 秋期末最便宜生成树原图，当前第 ${k} 步；边与判断详见下表">${lines}${circles}</svg>`;
    const total = edges.filter(e => s.present.has(key(e))).reduce((sum, e) => sum + e[2], 0);
    const done = s.present.size === 7 && components(s.present).count === 1;
    $("#mst-out", mount).innerHTML = `<span>${s.message}</span><span>${deleting ? "当前剩余" : "已选"} ${s.present.size} 条边，${components(s.present).count} 个分支，总权 ${total}${done ? "；已得到 MST，总权 20。" : "。"}</span>`;
    const rows = ordered.map((e, i) => `<tr${i === k - 1 ? ' style="font-weight:700;color:var(--accent)"' : ""}><td>${key(e)}</td><td>${e[2]}</td><td>${i >= k ? "待检查" : s.removed.has(key(e)) ? (deleting ? "删除：仍连通" : "跳过：成圈") : (deleting ? "保留：桥" : "选入：连接分支")}</td></tr>`).join("");
    $("#mst-table", mount).innerHTML = `<table><thead><tr><th>边</th><th>权</th><th>判断</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  slider.addEventListener("input", draw);
  mode.addEventListener("change", rebuild);
  $("#mst-prev", mount).addEventListener("click", () => { slider.value = Math.max(0, +slider.value - 1); draw(); });
  $("#mst-next", mount).addEventListener("click", () => { slider.value = Math.min(ordered.length, +slider.value + 1); draw(); });
  $("#mst-reset", mount).addEventListener("click", () => { slider.value = 0; draw(); });
  rebuild();
}


/* ================= 交互工具：Hall 邻点集合 ================= */
function hallPlay(mount) {
  const samples = {
    good: [[0, 1], [1, 2], [0, 2, 3], [2, 3]],
    bad: [[0, 1], [0, 1], [0, 1], [2, 3]],
    zero: [[], [], [], []]
  };
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="hall-case">例图 <select id="hall-case"><option value="good">有完美匹配</option><option value="bad">单点与全集检查通过，仍有缺口</option><option value="zero">零度正则图</option></select></label></div>
    <div class="ctrl" id="hall-subset">选左侧集合 S：${[0, 1, 2, 3].map(i => `<label><input type="checkbox" value="${i}"${i < 3 ? " checked" : ""}> a${i + 1}</label>`).join("")}</div>
    <div class="ctrl"><button class="btn" id="hall-find" type="button">寻找 Hall 缺口</button><label><input id="hall-matching" type="checkbox"> 显示一组最大匹配</label></div>
    <div id="hall-graph"></div><div class="readout" id="hall-out" aria-live="polite"></div>
    <p class="small muted">紫色点：S；青色点：邻点并集 N(S)。最大匹配用粗线标出。工具穷举全部 16 个左侧子集；同一个右点只数一次。</p>
  </div>`;
  const mode = $("#hall-case", mount), checks = [...mount.querySelectorAll("#hall-subset input")], show = $("#hall-matching", mount);
  let note = "";
  function neighbors(S) { return new Set(S.flatMap(i => samples[mode.value][i])); }
  function maximum() {
    let best = [];
    function visit(i, used, pairs) {
      if (i === 4) { if (pairs.length > best.length) best = pairs.slice(); return; }
      for (const j of samples[mode.value][i]) if (!used.has(j)) {
        used.add(j); pairs.push([i, j]); visit(i + 1, used, pairs); pairs.pop(); used.delete(j);
      }
      visit(i + 1, used, pairs);
    }
    visit(0, new Set(), []);
    return best;
  }
  function draw() {
    const S = checks.filter(c => c.checked).map(c => +c.value), N = neighbors(S), pairs = maximum();
    const good = N.size >= S.length, pairSet = new Set(pairs.map(([i, j]) => `${i}-${j}`));
    const lines = samples[mode.value].flatMap((ns, i) => ns.map(j => {
      const chosen = show.checked && pairSet.has(`${i}-${j}`), active = S.includes(i);
      return `<line x1="100" y1="${40 + 70 * i}" x2="480" y2="${40 + 70 * j}" style="stroke:var(${chosen ? "--teal" : active ? "--accent" : "--line"});stroke-width:${chosen ? 5 : active ? 2.5 : 1.5}"/>`;
    })).join("");
    const dots = [0, 1].flatMap(side => [0, 1, 2, 3].map(i => {
      const active = side ? N.has(i) : S.includes(i), x = side ? 480 : 100, y = 40 + 70 * i;
