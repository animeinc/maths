    { id: "n1-v2", lv: "变种", src: "自编", stmt: R`一个正整数除以 7 余 3，除以 11 余 5，除以 13 余 7。求满足条件的最小正整数。`,

      <p>(2) 第一个方程说 $x$ 是奇数，第二个说 $x$ 是偶数，矛盾。一般地，$\gcd(6,8)=2\nmid4-3$。</p>` }

  extensions: [
    { id: "n1-e1", lv: "延伸", src: "经典结论", stmt: R`设 $\gcd(m,n)=1$。用 CRT 证明 Euler 函数可乘：$\varphi(mn)=\varphi(m)\varphi(n)$。`,
      hints: [R`$\varphi(k)$ 是 $\mathbb Z_k$ 中与 $k$ 互素的剩余类个数。`, R`$\gcd(x,mn)=1\Leftrightarrow\gcd(x,m)=1$ 且 $\gcd(x,n)=1$。`, R`CRT 的双射 $\Phi:\mathbb Z_{mn}\to\mathbb Z_m\times\mathbb Z_n$ 把“与 $mn$ 互素的类”恰好映到“两个坐标都互素的对”。`],
      method: "m-crt-build", sol: R`<p>$\gcd(x,mn)=1$ 当且仅当 $x$ 与 $m$、$n$ 都没有公共素因子，即 $\gcd(x,m)=1$ 且 $\gcd(x,n)=1$。这个条件只依赖于 $x$ 模 $m$ 和模 $n$ 的余数。</p>

g1: {
  unit: "graph", n: 1, title: "图的基本结构与欧拉路",
  goal: "会用握手定理和“取最长道路”证明结论，会用分支计数估计边数，会判定欧拉路和欧拉圈。",
  sections: [
    { id: "g1-s1", h: "1. 基本概念与握手定理", html: R`
      <ul>
        <li>图 $G=(V,E)$，$E\subseteq\binom V2$（简单图：无自环、无重边）。$d(v)$ 为顶点 $v$ 的度。</li>
        <li>补图 $\overline G=(V,\binom V2\setminus E)$。诱导子图 $G[V_1]$ 要保留两端都在 $V_1$ 中的<b>全部</b>边，子图可以只保留一部分。</li>
        <li><b>道路</b>（walk）可以重复顶点；<b>简单道路</b>（path）顶点互不相同；<b>简单圈</b>（cycle）长度 $\ge3$，只有首尾重复。</li>
        <li>从 $x$ 到 $y$ 的<b>最短</b>道路一定是简单道路（有重复顶点就能剪掉一段）。</li>
      </ul>
      <p><b>握手定理</b>：$\sum_{v}d(v)=2e(G)$。每条边被两个端点各数一次。推论：<b>奇度顶点的个数是偶数</b>。</p>` },
    { id: "g1-s2", h: "2. 什么时候有圈；连通分支与边数", html: R`
      <ul>
        <li><b>每点度 $\ge2$ ⇒ 有圈</b>。证法：取最长的简单道路 $v_0,\dots,v_k$，$v_k$ 的另一个邻点 $x\ne v_{k-1}$ 必在路上（否则路能延长），$x=v_i$，$i\le k-2$，得到圈 $v_i,\dots,v_k,v_i$。</li>
        <li><b>至少一条边且全为偶度 ⇒ 有圈</b>（删去孤立点后每点度 $\ge2$）。</li>
        <li><b>$e(G)\ge|V(G)|$ ⇒ 有圈</b>（对 $n$ 归纳，每次删去一个度 $\le1$ 的点）。</li>
        <li>“$x,y$ 之间有道路”是等价关系，等价类的诱导子图是<b>连通分支</b>，个数记 $\beta_0(G)$。</li>
        <li><b>连通 ⇒ $e\ge n-1$</b>；一般地 $\beta_0(G)\ge n-e(G)$（对每个分支用 $e_i\ge n_i-1$ 再求和）。</li>
      </ul>
      <p>课上的糖果题（77 颗糖装袋，7 人或 11 人都能平分，至少 17 袋）就是把“袋”当成边、把“人”当成顶点，证明这个 18 点图连通，所以至少 17 条边。</p>` },
    { id: "g1-s3", h: "3. 欧拉路与欧拉圈", html: R`
      <p>允许重边。<b>欧拉路</b>：经过每条边恰好一次的道路；首尾相同叫<b>欧拉圈</b>。</p>
      <p><b>Euler 定理</b>：设 $G$ 连通。$G$ 有欧拉圈 ⇔ 奇度顶点有 0 个；$G$ 有欧拉路 ⇔ 奇度顶点有 0 或 2 个，且有 2 个时，欧拉路的两端就是这两个点。</p>
      <ul>
        <li><b>必要性</b>：每经过一次中间顶点，进边和出边配成一对，贡献 2 度；只有起点和终点各多出 1。</li>
        <li><b>充分性（全偶度）</b>：对边数归纳。取一个圈 $C$ 删去它的边，剩下每个分支仍全偶度，各有欧拉圈；每个分支都和 $C$ 有公共点，沿 $C$ 走，到公共点时插入该分支的欧拉圈。</li>
        <li><b>两个奇度点 $x,y$</b>：临时加一条边 $xy$，全偶度，取欧拉圈，再删掉这条边。</li>
      </ul>
      <p>七桥图的四块陆地度数为 $3,3,3,5$，有 4 个奇度点，所以没有欧拉路。<b>别忘了先检查连通</b>。</p>` }
  ],
  widget: null,
  concepts: [
    { id: "g1-c1", sec: "g1-s1", q: R`是否存在一个简单图，各顶点的度依次为 $3,3,2,2,1$？`,
      opts: [R`存在`, R`不存在：度数和是奇数`, R`不存在：度为 1 的点不能和度为 3 的点相邻`, R`要看顶点是否有标号`], a: 1,
      ex: R`$3+3+2+2+1=11$ 是奇数，与握手定理 $\sum d(v)=2e$ 矛盾。` },
    { id: "g1-c2", sec: "g1-s2", q: R`7 个顶点、4 条边的图至少有几个连通分支？`,
      opts: [R`1`, R`2`, R`3`, R`4`], a: 2,
      ex: R`$\beta_0\ge n-e=3$。一条 5 个顶点的简单道路加两个孤立点恰好 3 个分支。` },
    { id: "g1-c3", sec: "g1-s3", q: R`连通图 $G$ 恰有两个奇度顶点 $x,y$。下面正确的是：`,
      opts: [R`$G$ 有欧拉圈`, R`$G$ 有欧拉路，且它必以 $x,y$ 为两端`, R`$G$ 有欧拉路，可以从任意顶点出发`, R`$G$ 没有欧拉路`], a: 1,
      ex: R`必要性的配对论证说明：欧拉路首尾不同时，奇度点恰好是两端。` },
    { id: "g1-c4", sec: "g1-s2", q: R`用“取最长简单道路 $v_0,\dots,v_k$”证明有圈时，关键的一步是：`,
      opts: [R`$v_k$ 的所有邻点都在这条路上，否则能延长`, R`$v_0$ 的度最大`, R`最长路一定经过所有顶点`, R`$v_k$ 的度为 1`], a: 0,
      ex: R`这是“极端原理”：最长路的端点没有路外的邻点。再加上 $d(v_k)\ge2$，就能找到路上较远的邻点，围成圈。` }
  ],
  methods: [
    { id: "m-hand", title: "握手定理与按度数计数", steps: [
      R`$\sum d(v)=2e$：用来求边数、推出奇度点个数为偶数、否定不可能的度数序列。`,
      R`数“以某点为顶点的结构”时按顶点求和，例如角的个数 $S=\sum_v\binom{d(v)}2$。`,
      R`需要不等式时配合 Cauchy–Schwarz：$n\sum d_i^2\ge(\sum d_i)^2=4e^2$。`] },
    { id: "m-extremal", title: "极端原理：取最长 / 最短道路", steps: [
      R`要找圈、要找叶：取一条<b>最长</b>的简单道路，看端点的邻点。`,
      R`要证明道路是简单的、或两点距离性质：取<b>最短</b>道路，有重复就能剪短。`,
      R`写清楚“若 $x$ 不在路上，则路可延长，矛盾”。`] },
    { id: "m-comp", title: "连通分支与边数", steps: [
      R`把图拆成分支 $G_1,\dots,G_b$，每个分支连通 ⇒ $e_i\ge n_i-1$。`,
      R`求和得 $e\ge n-b$，即 $\beta_0\ge n-e$。`,
      R`证明“图连通”可以用：任取一个分支，用题目条件（整除、计数）说明它包含全部顶点。`] },
    { id: "m-euler", title: "判定欧拉路 / 欧拉圈", steps: [
      R`先检查连通（孤立点可以忽略）。`,
      R`数奇度顶点：0 个 ⇒ 欧拉圈；2 个 ⇒ 欧拉路，以这两点为端点；更多 ⇒ 都没有。`,
      R`“最少几笔画完”：$2k$ 个奇度点至少要 $k$ 笔，加 $k$ 条辅助边可以做到。`] }
  ],
  problems: [
    { id: "g1-p1", lv: "真题", src: "2022 秋期末 1(1)", stmt: R`设 $G$ 是 $n$ 个顶点的简单图，且共有 $m$ 个连通分支。求 $G$ 的边数的最小值。`,
      hints: [R`每个分支连通，边数至少比顶点数少 1。`, R`求和：$e=\sum e_i\ge\sum(n_i-1)=n-m$。`, R`构造取等：一条 $n-m+1$ 个顶点的简单道路加 $m-1$ 个孤立点。`],
      method: "m-comp", sol: R`<p>设分支 $G_i$ 有 $n_i$ 个顶点、$e_i$ 条边。$G_i$ 连通 ⇒ $e_i\ge n_i-1$。所以 $e(G)=\sum_{i=1}^me_i\ge\sum(n_i-1)=n-m$。</p>
      <p>取等：一条有 $n-m+1$ 个顶点的简单道路（$n-m$ 条边）加上 $m-1$ 个孤立点，恰有 $m$ 个分支。最小值为 $n-m$。</p>` },
    { id: "g1-p2", lv: "真题", src: "2022 秋期末 1(2)", stmt: R`设 $n$ 阶连通简单图 $G$ 中每个顶点的度都是 2。请确定 $G$。`,
      hints: [R`每点度 $\ge2$ ⇒ 有简单圈 $C$。`, R`$C$ 上每个顶点的两条边都已经在 $C$ 上了，所以没有边离开 $C$。`, R`连通 ⇒ $V(G)=V(C)$，$G$ 就是 $n$ 阶圈图 $C_n$（$n\ge3$）。`],
      method: "m-extremal", sol: R`<p>每点度为 2，由成圈条件 $G$ 中有简单圈 $C$。$C$ 上每个顶点在 $C$ 上已有两条边，而它的度恰为 2，所以 $C$ 上的顶点没有其他边。</p>
      <p>若 $V(C)\ne V(G)$，由连通性存在一条边连接 $C$ 内一点和 $C$ 外一点，矛盾。所以 $V(G)=V(C)$，$E(G)=E(C)$，$G=C_n$（简单图要求 $n\ge3$）。</p>` },
    { id: "g1-p3", lv: "基础", src: "课件 11-17 例", stmt: R`主人有 77 颗糖，先装成若干非空袋。不论来 7 个还是 11 个小朋友，都要能把糖整袋分完、每人一样多。最少要装多少袋？`,
      hints: [R`7 人分法记为 $X_1,\dots,X_7$（每人 11 颗），11 人分法记为 $Y_1,\dots,Y_{11}$（每人 7 颗）。每袋在两种分法中各属于一人：在 $X_i,Y_j$ 之间连一条边。`, R`取一个连通分支，含 $k$ 个 $X$ 点和 $\ell$ 个 $Y$ 点，两侧数糖：$11k=7\ell$。`, R`$7\mid k\le7$，$11\mid\ell\le11$，所以分支包含全部 18 点，图连通，至少 17 条边。构造：把 77 颗排成一列，在 7 的倍数和 11 的倍数处都切开。`],
      method: "m-comp", sol: R`<p><b>建图</b>：顶点 $X_1,\dots,X_7,Y_1,\dots,Y_{11}$，每袋糖对应一条边（连接它在两种分法里的归属），可能有重边。</p>
      <p><b>连通</b>：取一个分支，含 $k$ 个 $X$ 点、$\ell$ 个 $Y$ 点。分支里的边就是一些袋，从两侧数糖得 $11k=7\ell$。$k,\ell\ge1$，$\gcd(7,11)=1$ ⇒ $7\mid k$，$11\mid\ell$，所以 $k=7$，$\ell=11$。图连通。</p>
      <p><b>下界</b>：合并重边后仍是 18 点连通图，至少 17 条边，所以至少 17 袋。</p>
      <p><b>构造</b>：把糖排成一列，在 $11,22,\dots,66$ 和 $7,14,\dots,70$ 处切开，共 $6+10=16$ 个不同切点（7 和 11 的公倍数只有 77），得到 17 袋：$7,4,3,7,1,6,5,2,7,2,5,6,1,7,3,4,7$。最少 17 袋。</p>` },
    { id: "g1-p4", lv: "基础", src: "自编", stmt: R`完全图 $K_n$（$n\ge2$）什么时候有欧拉圈？什么时候有欧拉路但没有欧拉圈？`,
      hints: [R`$K_n$ 连通，每点度为 $n-1$。`, R`$n$ 奇数时全为偶度。`, R`$n$ 偶数时 $n$ 个点都是奇度，只有 $n=2$ 时奇度点恰 2 个。`],
      method: "m-euler", sol: R`<p>$K_n$ 连通，每点度 $n-1$。$n$ 为奇数时全为偶度，有欧拉圈。$n$ 为偶数时 $n$ 个顶点全是奇度：$n=2$ 时恰 2 个，有欧拉路（就是那一条边）而无欧拉圈；$n\ge4$ 时奇度点多于 2 个，欧拉路也没有。</p>` }
  ],
  variants: [
    { id: "g1-v1", lv: "变种", src: "2022 秋期末 6(1)", stmt: R`在简单图 $G$ 中，称有公共顶点的两条边 $AB$、$AC$ 构成一个“角”，$A$ 为角的顶点。设 $G$ 的各顶点度数为 $d_1,\dots,d_n$，求角的总数 $S$。`,
      hints: [R`按角的顶点分类计数。`, R`以 $v$ 为顶点的角，就是从 $v$ 的 $d(v)$ 条边中选 2 条。`, R`$S=\sum_i\binom{d_i}2$。`],
      method: "m-hand", sol: R`<p>每个角恰有一个顶点。以 $v_i$ 为顶点的角由 $v_i$ 的两条不同的边决定，共 $\binom{d_i}2$ 个。所以 $S=\sum_{i=1}^n\binom{d_i}2=\frac12\sum d_i(d_i-1)$。</p>` },
    { id: "g1-v2", lv: "变种", src: "一笔画", stmt: R`连通图 $G$ 恰有 $2k$ 个奇度顶点（$k\ge1$）。证明：$G$ 的边可以分成 $k$ 条边不重复的道路，且 $k$ 是最少的条数。`,
      hints: [R`下界：每条道路只让两端的度数“变奇”。`, R`把边分成 $t$ 条道路后，每个奇度点至少是一条道路的端点，而端点一共 $2t$ 个。`, R`上界：把奇度点两两配对，加 $k$ 条新边，得到全偶度连通图，取欧拉圈，再删掉新边，圈断成 $k$ 段。`],
      method: "m-euler", sol: R`<p><b>下界</b>：设边分成 $t$ 条边不重复的道路。顶点 $v$ 每次作为某条道路的中间点出现，贡献 2 度；只有作为某条道路的起点或终点时才贡献 1 度（一条闭合道路的首尾在同一点，合起来贡献 2）。所以 $v$ 是奇度点 ⇒ $v$ 是某条非闭合道路的端点。$t$ 条道路至多 $2t$ 个端点，故 $2t\ge2k$，$t\ge k$。</p>
      <p><b>上界</b>：把 $2k$ 个奇度点配成 $k$ 对，每对之间加一条新边（允许重边），得到连通的全偶度图 $G'$，取它的欧拉圈。每个奇度点恰是一条新边的端点，所以 $k$ 条新边两两没有公共顶点，在欧拉圈中互不相邻。删去这 $k$ 条新边，欧拉圈恰好断成 $k$ 段非空的道路，它们边不重复，覆盖 $G$ 的全部边。</p>` }
  ],
  extensions: [
    { id: "g1-e1", lv: "延伸", src: "课件 11-17 · Ramsey", stmt: R`证明：任意 6 个人中，或者有 3 人两两相识，或者有 3 人两两不相识。并说明 5 个人时结论不成立。`,

      method: "m-extremal", sol: R`<p>把认识的两人连蓝边、不认识的连紫边，得到 $K_6$ 的二染色。任取 $A$，它的 5 条边中至少 3 条同色（抽屉原理），不妨为蓝色，通向 $B,C,D$。若 $BC,BD,CD$ 中有一条蓝边，比如 $BC$，则 $A,B,C$ 两两相识；否则三条都是紫边，$B,C,D$ 两两不相识。</p>

    { id: "g1-e2", lv: "延伸", src: "经典结论", stmt: R`设简单图 $G$ 中每个顶点的度都 $\ge k$（$k\ge2$）。证明：$G$ 中有长度至少为 $k+1$ 的简单圈。`,

g2: {
  unit: "graph", n: 2, title: "树与普吕弗编码",
  goal: "熟记树的等价刻画；会手算普吕弗编码和还原（期末必考）；会用编码数树：Cayley 公式、指定度数、补全森林。",
  sections: [
    { id: "g2-s1", h: "1. 树的等价刻画", html: R`
      <p><b>树</b>：连通且无圈的简单图。森林：每个分支都是树。<b>叶</b>：度为 1 的点。对 $n$ 个顶点的图，下面几条互相等价：</p>
      <ul>
        <li>$T$ 是树（连通、无圈）；</li>
        <li>$T$ 连通，且删掉任何一条边都不连通（<b>极小连通</b>）；</li>
        <li>$T$ 无圈，且加上任何一条新边都产生圈（<b>极大无圈</b>）；</li>
        <li>$T$ 连通，且有 $n-1$ 条边；$T$ 无圈，且有 $n-1$ 条边；</li>
        <li>任意两点之间有且只有一条简单道路；</li>
        <li>$T$ 可以从一个点出发，每次添一个叶得到。</li>
      </ul>
      <p>$n\ge2$ 的树<b>至少有两个叶</b>：度数和 $2n-2$，若至多一个叶，则度数和 $\ge1+2(n-1)$。归纳证明树的命题时，标准动作是<b>删去一个叶</b>。</p>` },
    { id: "g2-s2", h: "2. 普吕弗编码：删最小的叶，记它的邻点", html: R`
      <p><b>编码</b>：设 $V(T)=[n]$，$n\ge2$。重复 $n-2$ 次：删去当前标号最小的叶 $x_i$，记下它的邻点 $y_i$。输出 $P(T)=(y_1,\dots,y_{n-2})$。（再删一次，最后剩下的一定是 $n$，所以 $y_{n-1}=n$ 不用记。）</p>
      <p><b>两个关键事实</b>：</p>
      <ul>
        <li><b>度数公式</b>：$d_T(v)=1+(v\text{ 在 }P(T)\text{ 中出现的次数})$。所以叶恰好是<b>没在序列里出现</b>的标号，叶数 $=n-|\{y_i\}|$。</li>
        <li><b>还原规则</b>：先补 $y_{n-1}=n$，再从左到右填 $x_i=\min\big([n]\setminus\{x_1,\dots,x_{i-1},y_i,\dots,y_{n-1}\}\big)$，即“排除左边已填的 $x$ 和下面从当前列到最右的 $y$，取剩下最小的”。边就是 $x_iy_i$。</li>
      </ul>
      <p>例（课件）：$n=6$，$P=(2,2,1,1)$。补 $y_5=6$，依次得 $x=(3,4,2,5,1)$，边 $23,24,12,15,16$。下面的工具可以输入任意序列，逐步看删叶过程。</p>` },
    { id: "g2-s3", h: "3. 用编码数树", html: R`
      <ul>
        <li><b>Cayley 公式</b>：编码是 $\{[n]\text{ 上的树}\}\to[n]^{n-2}$ 的双射，所以标号树有 $n^{n-2}$ 棵。$f(3)=3$，$f(4)=16$（12 条链 + 4 个星）。</li>
        <li><b>指定度数</b>：$d_T(i)=d_i$ ⇔ $i$ 在序列中恰出现 $d_i-1$ 次，树数 $=\frac{(n-2)!}{(d_1-1)!\cdots(d_n-1)!}$。</li>
        <li><b>只指定一个点的度</b>：例如 $[6]$ 上要求 $d(1)=4$：序列长 4，恰有 3 个 1，其余一个位置填非 1 的标号，$\binom41\cdot5=20$ 棵。</li>
        <li><b>补全森林</b>：$[n]$ 上的森林有 $k\ge2$ 个分支、大小 $s_1,\dots,s_k$，包含它的树有 $n^{k-2}s_1\cdots s_k$ 棵。特例：包含指定一条边的树有 $2n^{n-3}$ 棵。</li>
        <li><b>随机树</b>：独立均匀地抽 $Y_1,\dots,Y_{n-2}\in[n]$ 再还原，得到均匀分布的随机标号树。</li>
      </ul>` }
  ],

  problems: [
    { id: "g2-p1", lv: "基础", src: "自编", stmt: R`求顶点集为 $[7]$、边为 $14,24,35,45,56,67$ 的树的普吕弗序列。`,
      hints: [R`初始的叶：1、2、3、7。先删 1，记邻点 4。`, R`删 2 后，4 只剩邻点 5，变成叶。此时叶为 3、4、7。`, R`共做 $n-2=5$ 步。自检：$d(4)=3$、$d(5)=3$，各应出现 2 次。`],

    { id: "g2-p2", lv: "基础", src: "自编", stmt: R`顶点集为 $[7]$ 的树 $T$ 的普吕弗序列为 $(5,1,1,4,4)$。求 $T$ 的边。`,
      hints: [R`补 $y_6=7$。第 1 列排除 $\{5,1,4,7\}$，$x_1=2$。`, R`第 2 列排除 $\{2\}\cup\{1,4,7\}$，$x_2=3$；第 3 列排除 $\{2,3\}\cup\{1,4,7\}$，$x_3=5$。`, R`继续得 $x_4=1$，$x_5=6$，$x_6=4$。`],
      method: "m-prufer", sol: R`<p>补 $y_6=7$，逐列填：</p>
      <div class="table-wrap"><table><tbody><tr><td>$i$</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr><tr><td>$x_i$</td><td>2</td><td>3</td><td>5</td><td>1</td><td>6</td><td>4</td></tr><tr><td>$y_i$</td><td>5</td><td>1</td><td>1</td><td>4</td><td>4</td><td>7</td></tr></tbody></table></div>
      <p>边为 $25,13,15,14,46,47$。自检：$d(1)=3$，$d(4)=3$，$d(5)=2$，叶为 2、3、6、7；6 条边。</p>` },
    { id: "g2-p3", lv: "真题", src: "2022 秋期末 4", stmt: R`<p>考虑以 $[n]$ 为顶点集的树 $T$，$P(T)=(y_1,\dots,y_{n-2})$ 是它的普吕弗序列。</p><p>(1) 令 $Y=\{y_1,\dots,y_{n-2}\}$（作为集合）。证明：$T$ 的叶的数目等于 $n-|Y|$。</p><p>(2) 设 $n=2m$（$m\ge2$），已知 $P(T)=(1,2,\dots,m-1,1,2,\dots,m-1)$。请确定树 $T$。</p>`,
      hints: [R`(1) 用度数公式：$d(v)=1+v$ 在序列中出现的次数。`, R`(2) 先算 $m=3$：$P=(1,2,1,2)$，$n=6$，还原得边 $31,42,51,12,26$。`, R`一般地：前 $m-1$ 列填 $m,m+1,\dots,2m-2$；第 $m$ 列填 $2m-1$；之后填 $1,2,\dots,m-2$，最后一列填 $m-1$。`],
      method: "m-prufer", sol: R`<p><b>(1)</b> 编码过程中，$v$ 每被记一次邻点，就失去一条边；$v$ 自己最后要么作为某个 $x_i$ 被删（再失去 1 条边），要么是剩下的 $n$（与 $x_{n-1}$ 相连的那 1 条边）。所以 $d_T(v)=1+\#\{i:y_i=v\}$。$v$ 是叶 ⇔ $d_T(v)=1$ ⇔ $v\notin Y$，叶数为 $n-|Y|$。</p>
      <p><b>(2)</b> 补 $y_{n-1}=2m$，按还原规则：</p>
      <ul>
        <li>第 $i$ 列（$1\le i\le m-1$）：下方还有 $1,\dots,m-1$ 和 $2m$，左边已用 $m,\dots,m+i-2$，所以 $x_i=m+i-1$，边 $(m+i-1)\,i$。</li>
        <li>第 $m$ 列（$y=1$）：已用 $m,\dots,2m-2$，下方有 $1,\dots,m-1,2m$，所以 $x=2m-1$，边 $(2m-1)\,1$。</li>
        <li>第 $m+j-1$ 列（$y=j$，$2\le j\le m-1$）：下方只剩 $j,\dots,m-1,2m$，左边已用 $1,\dots,j-2$ 和 $m,\dots,2m-1$，所以 $x=j-1$，边 $(j-1)\,j$。</li>
        <li>最后一列（$y=2m$）：只剩 $m-1$ 没用，边 $(m-1)\,(2m)$。</li>
      </ul>
      <p>所以 $T$ 是：一条链 $1-2-\cdots-(m-1)$，每个 $i$ 挂一个叶 $m+i-1$；另外 $1$ 再挂叶 $2m-1$，$m-1$ 再挂叶 $2m$。共 $(m-1)+1+(m-2)+1=2m-1$ 条边。自检：$1,\dots,m-1$ 的度都是 3，其余 $m+1$ 个点是叶。$m=2$ 时是以 1 为中心的星形树。</p>` },
    { id: "g2-p4", lv: "真题", src: "2024 秋期末 5（课件 11-17）", stmt: R`给定 $n=3m+2$（$m$ 为正整数）。顶点集为 $[n]$ 的树 $T$ 的普吕弗序列为 $(1,1,1,2,2,2,\dots,m,m,m)$。请画出（描述）树 $T$。`,
      hints: [R`度数：$1,\dots,m$ 的度都是 4，其余 $2m+2$ 个点是叶。`, R`取 $m=3$，$n=11$：$x=(4,5,6,1,7,8,2,9,10,3)$。`, R`一般地：第一组填 $m+1,m+2,m+3$；第 $j$ 组（$2\le j\le m$）填 $j-1,\ m+2j,\ m+2j+1$；末列填 $m$。`],
      method: "m-prufer", sol: R`<p>补 $y_{3m+1}=n$。按三列一组还原：</p>
      <ul>
        <li>第一组（$y=1$）：下方始终有 $1,\dots,m$ 和 $n$，依次填 $m+1,m+2,m+3$。</li>
        <li>第 $j$ 组（$y=j$，$2\le j\le m$）：开始时左边已用 $1,\dots,j-2$ 和 $m+1,\dots,m+2j-1$，下方需排除 $j,\dots,m,n$，所以依次填 $j-1,\ m+2j,\ m+2j+1$。</li>
        <li>末列：除 $m$、$n$ 外都已用过，填 $m$，边 $m\,n$。</li>
      </ul>
      <p>所以 $T$ 是一条链 $1-2-\cdots-m$；$1$ 挂叶 $m+1,m+2,m+3$；$j$（$2\le j\le m$）挂叶 $m+2j$、$m+2j+1$；$m$ 再连 $n=3m+2$。自检：$1,\dots,m$ 的度都是 4，边数 $3+3(m-1)+1=3m+1=n-1$。$m=1$ 时是以 1 为中心、叶为 2、3、4、5 的星形树。</p>` }

  variants: [
    { id: "g2-v1", lv: "变种", src: "2022 秋作业 6 · 1(1)", stmt: R`设 $G$ 是连通的 $n$ 阶图，且边数为 $n-1$。证明：$G$ 是树。`,
      hints: [R`只需证无圈。反设有圈 $C$。`, R`删去 $C$ 上一条边 $e=xy$，$C$ 上剩下的边仍连接 $x,y$。`, R`得到 $n-2$ 条边的连通图，与“连通 ⇒ 至少 $n-1$ 条边”矛盾。`],

    { id: "g2-v2", lv: "变种", src: "2022 秋作业 6 · 1(2)", stmt: R`设 $T$ 是 $n$ 阶树（$n\ge2$），且恰好有两个度为 1 的顶点。证明：$T$ 是一条长为 $n-1$ 的简单道路。`,

      method: "m-tree", sol: R`<p>$\sum d(v)=2n-2$，两个叶贡献 2，其余 $n-2$ 个点每个度 $\ge2$（树中非叶点度 $\ge2$，$n\ge2$ 时没有度 0 的点），和恰为 $2n-4$，所以都恰为 2。</p>
      <p>取最长简单道路 $P=v_0,\dots,v_k$。端点的邻点都在路上；若 $v_0$ 有 $v_1$ 以外的邻点 $v_i$，就形成圈，矛盾，所以 $v_0$、$v_k$ 是叶，中间点在 $P$ 上已有 2 个邻点。若存在不在 $P$ 上的点，由连通性有一条边连接 $P$ 上的点和 $P$ 外的点，但 $P$ 上每个点的度都已用完，矛盾。所以 $V(T)=V(P)$，$k=n-1$，且 $T$ 的 $n-1$ 条边就是 $P$ 的边。</p>` },
    { id: "g2-v3", lv: "变种", src: "仿课件“指定度数”", stmt: R`顶点集为 $[7]$ 的标号树中，满足 $d(1)=3$ 且 $d(2)=3$ 的有多少棵？`,
      hints: [R`序列长 $5$。$d(1)=3$ ⇔ 1 出现 2 次；$d(2)=3$ ⇔ 2 出现 2 次。`, R`剩下 1 个位置填 $3,\dots,7$ 中的一个，5 种。`, R`排列数 $\frac{5!}{2!\,2!\,1!}=30$。`],
      method: "m-treecount", sol: R`<p>由度数公式，条件等价于：长为 5 的序列中 1 恰出现 2 次、2 恰出现 2 次，剩下一项属于 $\{3,4,5,6,7\}$。</p>
      <p>剩下那一项有 5 种选法，五项的排列有 $\frac{5!}{2!2!1!}=30$ 种。共 $5\times30=150$ 棵。</p>` }
  ],
  extensions: [
    { id: "g2-e1", lv: "延伸", src: "课件 11-17 · 补全森林特例", stmt: R`证明：顶点集为 $[n]$（$n\ge2$）的标号树中，包含指定边 $\{1,2\}$ 的有 $2n^{n-3}$ 棵。`,
      hints: [R`双计数：数“(树 $T$，$T$ 的一条边)”这样的对。`, R`每棵树有 $n-1$ 条边，共 $n^{n-2}(n-1)$ 对。`, R`由对称性，$\binom n2$ 条可能的边，每条被同样多的树包含。`],
      method: "m-treecount", sol: R`<p>数对 $(T,e)$，$T$ 是 $[n]$ 上的树，$e\in E(T)$。按树数：$n^{n-2}\cdot(n-1)$。按边数：对 $[n]$ 做标号置换会把含边 $\{1,2\}$ 的树一一变成含边 $\{a,b\}$ 的树，所以每条边被同样多（记为 $N$）的树包含，总数为 $\binom n2N$。</p>
      $$N=\frac{n^{n-2}(n-1)}{n(n-1)/2}=2n^{n-3}.$$
      <p>这和补全森林公式 $n^{k-2}s_1\cdots s_k$ 在 $k=n-1$、分支大小 $2,1,\dots,1$ 时的结果一致。</p>` },
    { id: "g2-e2", lv: "延伸", src: "经典结论", stmt: R`顶点集为 $[n]$（$n\ge3$）的标号树中，顶点 1 是叶的有多少棵？随机取一棵标号树，1 是叶的概率在 $n\to\infty$ 时趋于多少？`,
      hints: [R`1 是叶 ⇔ 1 不在普吕弗序列中出现。`, R`每一项都从 $n-1$ 个标号中选。`, R`概率 $\left(\frac{n-1}n\right)^{n-2}=\left(1-\frac1n\right)^{n-2}$。`],
      method: "m-treecount", sol: R`<p>由度数公式，1 是叶 ⇔ 1 不出现在序列中。长为 $n-2$、每项取自 $[n]\setminus\{1\}$ 的序列有 $(n-1)^{n-2}$ 个，所以这样的树有 $(n-1)^{n-2}$ 棵。</p>
      <p>概率为 $\frac{(n-1)^{n-2}}{n^{n-2}}=\left(1-\frac1n\right)^{n-2}\to e^{-1}$。</p>` }
  ]
},
/* ---------------- MST1 ---------------- */
mst1: {
  unit: "mst", n: 1, title: "最便宜生成树：贪心与交换",
  goal: "会用 Kruskal 手算最便宜生成树；能用换边证明贪心、逆向删边和唯一性。30 分钟先做概念题、基础题和真题，变种与延伸可留到复盘。",
  sections: [
    { id: "mst1-s1", h: "1. 目标是总权最小，不是最短路", html: R`
      <p>设 $G=(V,E)$ 是有限、连通、无向加权图，$|V|=n$。生成树 $T$ 包含全部顶点、连通且无圈，恰有 $n-1$ 条边。<b>最便宜生成树</b>（最小生成树，MST）使 $w(T)=\sum_{e\in T}w(e)$ 最小；它不保证任意两点间的道路最短。</p>
      <p><b>Kruskal 算法</b>：从空边集开始，按权从小到大检查每条边；两端在不同连通分支就加入，在同一分支就跳过（加入会成圈）。选满 $n-1$ 条即结束。并列权可任选先后，可能得到不同的最优树。负权、零权也适用；原图不连通时只能得到各分支的最小生成森林。</p>
      <p>下面使用 <b>2022 秋期末 5(2)</b> 的原图数据，可对比“从轻到重加边”和“从重到轻删边”。图示布局重绘，边和权重逐项核对原卷。本课按作业 7 提前补齐；11-17 课件尚未讲到此模块。</p>` },
    { id: "mst1-s2", h: "2. 为什么贪心正确：割与圈都靠换一条边", html: R`
      <p><b>割</b>：取非空真子集 $S\subset V$，跨割边的一端在 $S$、另一端在 $V\setminus S$。<b>割性质</b>：跨割的最轻边至少属于某棵 MST；若它严格轻于其他跨割边，就属于每棵 MST。</p>
      <p>证明：取 MST $T$。若最轻边 $e$ 不在 $T$，加上它产生唯一圈；该圈上有另一条跨割边 $f$，且 $w(e)\le w(f)$。换成 $T-f+e$ 仍是树、总权不增，所以也是 MST。严格小于时，假设 $e\notin T$ 就会得到更便宜的树，矛盾。</p>
      <p><b>Kruskal 的不变量</b>：已选森林 $F$ 始终包含于某棵 MST。准备加入 $e=uv$ 时，取 $u$ 所在的 $F$ 分支为 $S$，$e$ 是跨此割的最轻边。取包含 $F$ 的 MST 换边，删掉的跨割边 $f$ 不在 $F$，所以新树仍包含 $F+e$。由空集归纳到 $n-1$ 条边，算法输出最优树。</p>
      <p><b>圈性质</b>：一个圈中严格最重的边不属于任何 MST；若只是并列最重，至少存在一棵 MST 不含它。理由：若树含该边，删边形成割，原圈上有另一条不更重的边跨割，可交换。注意“至少一棵”和“每一棵”的区别。</p>` },
    { id: "mst1-s3", h: "3. 逆向删边、唯一性与变目标", html: R`
      <p><b>逆向删边</b>：按权从大到小检查；删后仍连通就删，否则保留。注意只在<b>当前图</b>里检查连通性。最后连通且每边都是桥，因此是树；正确性用圈上的换边说明，见变种题。</p>
      <p><b>唯一性</b>：所有边权互不相同 ⇒ MST 唯一；反过来不成立，如三角形边权 $1,1,2$ 的 MST 仍唯一。若有并列权，不能直接断言唯一或不唯一。</p>
      <p><b>检验一棵候选树</b>：$T$ 是 MST 当且仅当每条非树边 $e=uv$ 都满足 $w(e)\ge\max_{f\in P_T(u,v)}w(f)$。若每处都严格大于，则 MST 唯一；若有相等，就能换边得到另一棵 MST。</p>
      <p>前述判据的充分性：若所有非树边满足它，取任意其他树 $T'$，删去 $e=uv\in T'\setminus T$ 得割。原树 $T$ 的道路 $P_T(u,v)$ 上存在跨此割的边 $f\in T\setminus T'$，且 $w(f)\le w(e)$。用 $f$ 替换 $e$，逐步把 $T'$ 变成 $T$，总权不增。严格情形总权必下降。</p>
      <p>目标改为正权乘积时，对权取 $\log$；改为最大边权时，任一 MST 都是最小瓶颈生成树，但逆命题未必成立。细节放在延伸题。</p>` }
  ],
  widget: "mstPlay",
  concepts: [
    { id: "mst1-c1", sec: "mst1-s1", q: R`Kruskal 检查一条边 $uv$ 时，应该什么时候加入它？`,
      opts: [R`$u$ 或 $v$ 还没有出现过`, R`$u,v$ 在已选森林的不同分支`, R`它是原图唯一最轻边`, R`它让某个起点到 $v$ 的距离最短`], a: 1,
      ex: R`判断的是“加入会不会成圈”。两端即使都出现过，只要在不同分支，也应加入。` },
    { id: "mst1-c2", sec: "mst1-s2", q: R`一个圈中有两条边并列最重。关于其中一条 $e$，一定正确的是：`,
      opts: [R`$e$ 不在任何 MST 中`, R`$e$ 在每棵 MST 中`, R`存在一棵 MST 不含 $e$`, R`图没有 MST`], a: 2,
      ex: R`若某棵 MST 含 $e$，删 $e$ 后沿原圈可找一条不更重的替代边；交换得到不含 $e$ 的 MST。并列时不能说“任何 MST 都不含”。` },
    { id: "mst1-c3", sec: "mst1-s3", q: R`下面哪个推断正确？`,
      opts: [R`有两条同权边 ⇒ MST 不唯一`, R`边权全不同 ⇒ MST 唯一`, R`MST 唯一 ⇒ 边权全不同`, R`每个顶点挑一条最轻邻边就一定得到生成树`], a: 1,
      ex: R`边权全不同是充分条件。三角形边权 $1,1,2$ 是“有同权边但 MST 唯一”的反例；各点独立挑边还可能无法连通。` },
    { id: "mst1-c4", sec: "mst1-s1", q: R`连通图有 8 个顶点，Kruskal 已加入 6 条边而未成圈。此时已选边构成：`,
      opts: [R`一棵生成树`, R`恰有两个连通分支的森林`, R`可能有三个分支`, R`一定含原图最重边`], a: 1,
      ex: R`森林的分支数等于顶点数减边数，为 $8-6=2$；再接通两个分支才是生成树。` }
  ],
  methods: [
    { id: "m-mst-run", title: "手算 Kruskal：排序、分支、总权", steps: [
      R`列全边与权，按权升序；并列任取固定顺序。`,
      R`每检查一边，先看两端是否已由已选边连通；不同分支才加入。记录“选 / 成圈跳过”。`,
      R`选满 $n-1$ 条后核对覆盖所有点、连通无圈，并另算一次总权。`,
      R`要求唯一性时，逐条非树边比较它与树上对应道路的最大边权；全严格大于才唯一。`] },
    { id: "m-mst-swap", title: "证明贪心：加边成圈、删边成割", steps: [
      R`先写不变量：“存在一棵最优树包含已选边”，或“当前剩余图含某棵原图的 MST”。`,
      R`要加入 $e$：在最优树中加 $e$ 得唯一圈；要删 $e$：在树中删 $e$ 得两个分支。`,
      R`找跨同一割的替代边 $f$，说明换后仍为生成树，并比较 $w(e),w(f)$。`,
      R`交代不变量得以保持，以及终止时输出确实是树。并列权用不等式，唯一性证明才用严格不等式。`] }
  ],
  problems: [
    { id: "mst1-p1", lv: "基础", src: "自编", stmt: R`<p>无向图顶点为 $A,B,C,D$，边与权为 $AB:1,\ BC:2,\ AC:3,\ BD:4,\ CD:5$。用 Kruskal 求 MST 并判断是否唯一。</p>`,
      hints: [R`前两条边为 $AB,BC$，组成 $A-B-C$。`, R`$AC$ 虽然便宜，但会和 $AB,BC$ 成圈，跳过。`, R`用 $BD$ 接入 $D$；对非树边 $AC,CD$ 核对树上道路的最大权。`],
      method: "m-mst-run", sol: R`<p>依次选 $AB(1),BC(2)$，跳过成圈的 $AC(3)$，选 $BD(4)$，已有 $4-1=3$ 条边，停止。总权 $1+2+4=7$。</p><p>非树边 $AC$ 的权 $3\gt\max(1,2)=2$；$CD$ 的权 $5\gt\max(2,4)=4$，所以唯一。也可直接用“全图边权互异”判唯一。</p>` },
    { id: "mst1-p2", lv: "真题", src: "2022 秋期末 5(2)（原图转写为边表）", stmt: R`
      <p>求下列无向加权图的最便宜生成树。顶点为 $A,B,C,D,E,F,G,H$，原图的全部边与权如下：</p>
      <div class="table-wrap"><table><thead><tr><th>边</th><th>权</th><th>边</th><th>权</th><th>边</th><th>权</th></tr></thead><tbody>
      <tr><td>$AB$</td><td>9</td><td>$AC$</td><td>5</td><td>$AD$</td><td>2</td></tr>
      <tr><td>$BE$</td><td>2</td><td>$BH$</td><td>7</td><td>$CE$</td><td>3</td></tr>
      <tr><td>$CD$</td><td>8</td><td>$CF$</td><td>6</td><td>$DF$</td><td>4</td></tr>
      <tr><td>$EG$</td><td>2</td><td>$EH$</td><td>6</td><td>$FG$</td><td>1</td></tr>
      </tbody></table></div><p>先独立计算，再用上面的逐步工具核对。加问（自编）：此图的 MST 是否唯一？</p>`,
      hints: [R`升序开始：$FG(1)$；权为 2 的 $AD,BE,EG$ 均可加入。`, R`接着选 $CE(3),DF(4)$。$AC(5)$ 已在同一分支内，跳过。`, R`$CF(6)$ 成圈，跳过；$EH(6)$ 接入最后的顶点 $H$。共 7 条边。`],
      method: "m-mst-run", sol: R`
      <p>按权升序选入 $FG(1),AD(2),BE(2),EG(2),CE(3),DF(4)$。此时除 $H$ 外的七点已连通；$AC(5),CF(6)$ 都成圈，跳过。再选 $EH(6)$ 接入 $H$，得到</p>
      $$T=\{FG,AD,BE,EG,CE,DF,EH\},\qquad w(T)=1+2+2+2+3+4+6=20.$$
      <p><b>自检</b>：8 点、7 边，全连通。加问：非树边 $AC,CF,BH,CD,AB$ 的权与对应树上道路最大边权分别为 $5\gt4,6\gt3,7\gt6,8\gt4,9\gt4$（树上道路依次为 A–D–F–G–E–C、C–E–G–F、B–E–H、C–E–G–F–D、A–D–F–G–E–B），所以虽然有同权边，MST 仍唯一。</p>` }
  ],
  variants: [
    { id: "mst1-v1", lv: "变种", src: "2022 秋作业 7 · 作业1（教材练习 9.1.1）", stmt: R`<p>连通无向加权图中，把边按权从大到小逐条检查。若从当前图删掉该边后仍连通就删，否则保留。证明最后保留的边构成最便宜生成树。</p>`,
      hints: [R`不变量：当前图始终连通，并包含某棵原图的 MST。`, R`若当前边 $e$ 可删，则当前图中有一条不含 $e$ 的两端间道路。若 MST 含 $e$，删它得割，从该道路上选跨割边 $f$。`, R`$f$ 不可能是以前“删了就断开”的保留边（桥不会在后续删边时重新成圈）；所以尚未检查，$w(f)\le w(e)$。交换即可。`],
      method: "m-mst-swap", sol: R`
      <p>记当前图为 $H$。不变量为：$H$ 连通，且含某棵原图的 MST $T$。初始显然成立。当前检查 $e$：</p>
      <p>若删 $e$ 会断开，则保留，$H$ 不变。若可删且 $e\notin T$，直接删，不变量仍成立。若可删且 $e\in T$，在 $T-e$ 的两个分支间，从 $H-e$ 的一条连接道路中选跨割边 $f$，则 $T-e+f$ 是生成树。</p>
      <p>边 $e$ 位于 $H$ 的圈上，该圈上的 $f$ 不可能是以前被判定必须保留的边：那种边当时是桥，后来只删边，仍是桥。也不可能已被删除。因此 $f$ 尚未检查，降序检查给出 $w(f)\le w(e)$。于是 $T-e+f$ 总权不增，仍是 MST，且包含于删 $e$ 后的图，不变量保持。</p>
      <p>终止时图连通。每条保留边在被检查时都是桥，此后仍是桥，所以终图无圈，是生成树。它含一棵原图的 MST，故它自身就是该 MST。</p>` },
    { id: "mst1-v2", lv: "变种", src: "2022 秋作业 7 · 作业2（教材练习 9.2.3）", stmt: R`设 $G$ 连通且所有边权互不相同。证明其最便宜生成树唯一。`,
      hints: [R`反设有不同的 MST $T_1,T_2$。在对称差中取权最小的边 $e$。`, R`不妨 $e\in T_1\setminus T_2$。从 $T_1$ 删 $e$，得到一个割；$T_2$ 中连接 $e$ 两端的道路必经过该割。`, R`取道路上的跨割边 $f$。$f\notin T_1$，故在对称差中，$w(f)\gt w(e)$；在 $T_2$ 中换成更轻的 $e$。`],
      method: "m-mst-swap", sol: R`<p>若 $T_1\ne T_2$ 都为 MST，取 $T_1\triangle T_2$ 中最轻边 $e$，不妨 $e\in T_1\setminus T_2$。$T_1-e$ 给出割 $(S,V\setminus S)$；$T_2$ 中 $e$ 两端间的唯一路必有跨割边 $f$。</p><p>$T_1$ 中唯一跨此割的边是 $e$，所以 $f\in T_2\setminus T_1$。边权互异且 $e$ 是对称差最轻边，故 $w(e)\lt w(f)$。$T_2-f+e$ 仍是生成树而总权严格更小，与 $T_2$ 最优矛盾。因此唯一。</p>` }
  ],
  extensions: [
    { id: "mst1-e1", lv: "延伸", src: "2022 秋作业 7 · 作业3(a)（教材练习 9.2.4）", stmt: R`设连通图每条边的权 $c(e)\gt0$。如何求使 $\prod_{e\in T}c(e)$ 最小的生成树？说明理由。`,
      hints: [R`取严格递增的对数，把乘积变成和。`, R`令 $w(e)=\log c(e)$，则 $\log\prod c(e)=\sum w(e)$。`, R`对数保持边权的大小顺序，所以直接按原权运行 Kruskal 即可；$c(e)\lt1$ 也没问题。`],
      method: "m-mst-run", sol: R`<p>令 $w(e)=\log c(e)$。因为对数严格递增，最小化正数乘积等价于最小化 $\sum_{e\in T}w(e)$。在新权上运行 Kruskal 即可。对数不改变边的排序，所以直接按原权 $c(e)$ 运行 Kruskal，输出同时是一个最小乘积生成树。</p><p>$0\lt c(e)\lt1$ 时新权为负，Kruskal 仍适用。这里依靠生成树的贪心性质，不能对任意优化问题都说“严格递增变换保持最小总和”。</p>` },
    { id: "mst1-e2", lv: "延伸", src: "2022 秋作业 7 · 作业3(b)（教材练习 9.2.4）；反例为自编", stmt: R`<p>如何求使 $\max_{e\in T}c(e)$ 最小的生成树（最小瓶颈生成树）？证明任一 MST 都满足要求。最小瓶颈生成树一定是 MST 吗？</p>`,
      hints: [R`取 MST $T$ 的一条最重边 $e_*$，删它得到割。`, R`若某棵生成树所有边都严格轻于 $e_*$，它跨此割的边就可以替换 $e_*$，让总权更小。`, R`反例：三角形边权 $1,2,2$。三棵生成树的最大边权都是 2，但总权分别是 3、3、4。`],
      method: "m-mst-swap", sol: R`<p>先求一棵 MST $T$，设其最大边权为 $b=c(e_*)$。删去 $e_*$ 得割 $(S,V\setminus S)$。每条跨此割的边 $f$ 都满足 $c(f)\ge b$，否则 $T-e_*+f$ 的总权更小，与 MST 矛盾。任一生成树必跨此割，因此其最大边权至少为 $b$。$T$ 达到这个下界，故是最小瓶颈生成树。</p><p>逆命题不成立。三角形边权 $1,2,2$：任一生成树的瓶颈都是 2，但选择两条权为 2 的边，总权 4，大于最优总权 3。</p>` }
  ]
},
/* ---------------- H1 ---------------- */
h1: {
  unit: "mst", n: 2, title: "Hall 匹配：从邻点集合到完美匹配",
  goal: "会检查 Hall 条件、用数边证明正则二部图有完美匹配，能把棋盘或代表元问题翻译成二部图。30 分钟先做概念题、基础题与 2022 期末第 3 题；变种和延伸留作复盘。",
  sections: [
    { id: "h1-s1", h: "1. 匹配与 Hall 条件：检查所有子集", html: R`
      <p>本课图均为有限二部图 $G=(A\sqcup B,E)$，边只连接左右两侧。<b>匹配</b>是端点互不重复的一组边；覆盖 $A$ 是指 $A$ 中每个点恰好匹配一次；<b>完美匹配</b>覆盖全部顶点。$|A|=|B|$ 时，覆盖 $A$ 就等于完美匹配。</p>
      <p>对 $S\subseteq A$，定义 $N(S)=\{b\in B:\text{存在 }a\in S,\ ab\in E\}$。这是邻点的<b>并集</b>，同一个邻点只计一次。</p>
      <p><b>Hall 定理</b>：存在覆盖 $A$ 的匹配，当且仅当</p>
      $$\text{对所有 }S\subseteq A,\qquad |N(S)|\ge|S|.$$
      <p>必要性：$S$ 中各点必须分配到不同邻点。充分性并不只是贪心挑邻点，完整证明见延伸。空集条件自动成立。<b>仅检查单点、仅检查 $A$ 全集，都不够</b>；下面的缺口示例同时通过这两种检查，却没有完美匹配。</p>` },
    { id: "h1-s2", h: "2. 证明 Hall：从 S 发出的边数，两头夹", html: R`
      <p>最常用的情形：所有点的度数都为同一正整数 $d$。任取 $S\subseteq A$，从 $S$ 发出的边恰为 $d|S|$ 条，全部进入 $N(S)$；而 $N(S)$ 中各点的总度数合计 $d|N(S)|$，可能还包括来自 $A\setminus S$ 的边。因此</p>
      $$d|S|=e(S,N(S))\le d|N(S)|.$$
      <p>因为 $d\gt0$，可约掉 $d$，得到 Hall 条件。若左右等大，就有完美匹配。事实上正则且 $d\gt0$ 时，数全部边 $d|A|=d|B|$ 已可推出左右等大。</p>
      <p><b>度不完全相同也可用</b>：若左侧最小度 $\ge r$，右侧最大度 $\le r$，$r\gt0$，则 $r|S|\le e(S,N(S))\le r|N(S)|$，仍能覆盖 $A$。</p>
      <p><b>原卷条件提醒</b>：2022 秋期末 3(2) 写了“所有点同度”，没有明写 $d\gt0$。若允许 $d=0$ 且两侧非空，空边图就是反例。下面引用时明确补上正度条件，不在证明中悄悄除以零。</p>` },
    { id: "h1-s3", h: "3. 建模与作答格式", html: R`
      <ul><li><b>棋盘</b>：左侧是行，右侧是列，有棋子的格子对应一条边；“各选一个且不同行不同列”就是完美匹配。</li>
      <li><b>不同代表元</b>：给集合 $X_1,\dots,X_m$ 各选不同的 $x_i\in X_i$。左侧是集合编号，右侧是可选元素；Hall 条件是 $\left|\bigcup_{i\in I}X_i\right|\ge|I|$ 对所有编号子集 $I$ 成立。</li>
      <li><b>证明存在</b>：定义两侧与边 → 任取 $S$ → 用数边推出 $|N(S)|\ge|S|$ → 引 Hall → 翻译回题目。</li>
      <li><b>证明不存在</b>：只需找一个坏子集 $S$，使 $|N(S)|\lt|S|$，不必列出所有可能的匹配。</li></ul>
      <p>术语别混淆：<b>最大匹配</b>的边数最多；<b>极大匹配</b>只表示无法直接再加边，允许通过换边增大时它未必最大。</p>` }
  ],
  widget: "hallPlay",
  concepts: [
    { id: "h1-c1", sec: "h1-s1", q: R`为了证明存在覆盖 $A$ 的匹配，Hall 条件要检查：`,
      opts: [R`只检查每个单点`, R`只检查 $S=A$`, R`所有 $S\subseteq A$`, R`只检查度最小的顶点`], a: 2,
      ex: R`单点都有邻居、全部邻点也足够，仍可能有若干左点共用过少的邻点。必须对所有子集成立。` },
    { id: "h1-c2", sec: "h1-s1", q: R`若 $|A|=3,|B|=4$ 且 Hall 条件成立，一定得到：`,
      opts: [R`覆盖 $A$ 的 3 条匹配边`, R`覆盖全部 7 点的完美匹配`, R`4 条匹配边`, R`每条边都属于某个完美匹配`], a: 0,
      ex: R`定理保证覆盖 $A$。右侧多一个点，不可能全部被匹配；7 个点也不可能由两两配对覆盖。` },
    { id: "h1-c3", sec: "h1-s2", q: R`正则二部图证明中，为什么是 $e(S,N(S))\le d|N(S)|$，而不总取等号？`,
      opts: [R`因为有自环`, R`$N(S)$ 的一些边可能来自 $A\setminus S$`, R`因为每条边要算两次`, R`因为 $S$ 必为空集`], a: 1,
      ex: R`左边只计来自 $S$ 的边；右边计 $N(S)$ 的全部度数，包含可能来自其他左点的边。` },
    { id: "h1-c4", sec: "h1-s2", q: R`两侧各有 $n\ge1$ 个点、每点度为 0 的二部图：`,
      opts: [R`一定有完美匹配`, R`正则，所以可以约掉度数证明 Hall`, R`没有完美匹配，正则度的正性不可省`, R`不是二部图`], a: 2,
      ex: R`取任意左侧单点 $S$，有 $|N(S)|=0\lt1$。度为零时，$0|S|\le0|N(S)|$ 推不出 Hall 条件。` }
  ],
  methods: [
    { id: "m-hall", title: "Hall 存在性：任取子集，双向数边", steps: [
      R`明确左侧 $A$、右侧 $B$ 和边的含义；先确定目标是覆盖哪一侧。`,
      R`任取 $S\subseteq A$，把邻点并集记为 $N(S)$，不要重复计同一个邻点。`,
      R`从 $S$ 数边给下界，从 $N(S)$ 的总度给上界；例如 $r|S|\le e(S,N(S))\le r|N(S)|$，其中 $r\gt0$。`,
      R`得到所有子集的 Hall 条件，引用定理；若要完美匹配，再说明两侧等大。`] },
    { id: "m-hall-deficit", title: "找反例或求最大匹配：寻找邻点缺口", steps: [
      R`先找邻点高度重叠的一群左点，而非只找单个孤立点。`,
      R`写出具体 $S,N(S)$，计算缺口 $|S|-|N(S)|$；正缺口即否定覆盖 $A$。`,
      R`缺口为 $k$ 时，至少有 $k$ 个左点无法匹配；再构造达到此界的匹配，证明最大。`,
      R`注意“当前贪心方案失败”不等于无解；应换边，或给出真正的 Hall 坏子集。`] }
  ],
  problems: [
    { id: "h1-p1", lv: "基础", src: "自编", stmt: R`<p>给集合 $X_1=\{1,2\},X_2=\{2,3\},X_3=\{1,3,4\},X_4=\{3,4\}$ 各选一个互不相同的代表元。</p><p>若改成 $X_1=X_2=X_3=\{1,2\},X_4=\{3,4\}$，还能选出四个不同代表元吗？最多能选几个？</p>`,
      hints: [R`第一组可直接构造，不一定要逐个检查 16 个子集。`, R`第二组看前三个集合的并集。`, R`前三个集合争两个元素，至少一个无法分配；再尝试构造 3 个代表元。`],
      method: "m-hall-deficit", sol: R`<p>第一组可取 $(x_1,x_2,x_3,x_4)=(1,2,3,4)$，彼此不同且各在对应集合中。</p><p>第二组取编号子集 $I=\{1,2,3\}$，对应元素并集只有 $\{1,2\}$，有 $2\lt3$，违反 Hall。至少一个集合不能分配代表元。取 $x_1=1,x_2=2,x_4=3$ 达到 3 个，所以最多为 3。</p>` },
    { id: "h1-p2", lv: "真题", src: "2022 秋期末 3(1)(2)（第 (2) 问补明正度条件）", stmt: R`<p>(1) 叙述 Hall 匹配定理。</p><p>(2) 设 $G=(A\sqcup B,E)$ 是二部图，$|A|=|B|=n$，每个顶点的度都等于同一正整数 $d$。证明 $G$ 存在完美匹配。</p>`,
      hints: [R`(1) 必须说清“所有左侧子集”和“覆盖左侧”。`, R`(2) 任取 $S\subseteq A$，从左侧数出的边数是 $d|S|$。`, R`这些边全部进入 $N(S)$，所以 $d|S|\le d|N(S)|$，再用 $d\gt0$。`],
      method: "m-hall", sol: R`<p>(1) 有限二部图 $G=(A\sqcup B,E)$ 存在覆盖 $A$ 的匹配，当且仅当对每个 $S\subseteq A$ 都有 $|N(S)|\ge|S|$。</p><p>(2) 任取 $S\subseteq A$。$S$ 中各点的 $d$ 条邻边都进入 $N(S)$，且在按左端点计数时每条边只计一次，故 $d|S|=e(S,N(S))\le\sum_{b\in N(S)}d(b)=d|N(S)|$。约去正数 $d$，得到 Hall 条件。由定理有覆盖 $A$ 的匹配；因两侧同为 $n$ 点，该匹配也覆盖 $B$，故为完美匹配。</p><p>若 $n\ge1$ 而允许 $d=0$，结论为假。这里已显式补上原卷漏写的必要条件。</p>` },
    { id: "h1-p3", lv: "真题", src: "2022 秋期末 3(3)", stmt: R`在 $8\times8$ 棋盘放置 24 个兵，每个兵占一格，每行每列都恰有 3 个兵。证明可以选出 8 个兵，使它们彼此既不同行，也不同列。`,
      hints: [R`左侧 8 个行顶点，右侧 8 个列顶点；格子里有兵才连边。`, R`每个顶点度数都是 3，上一道题已经证明正则二部图的结论。`, R`若不用上一问，直接对行集合 $S$ 写 $3|S|\le3|N(S)|$。`],
      method: "m-hall", sol: R`<p>建立二部图：左侧是行 $r_1,\dots,r_8$，右侧是列 $c_1,\dots,c_8$；当第 $i$ 行、第 $j$ 列的格子有兵时连接 $r_ic_j$。每行每列恰有 3 个兵，故每个顶点度数为 3。</p><p>对任意行集合 $S$，其发出的 $3|S|$ 条边全部进入 $N(S)$，每个邻列至多接收 3 条，故 $3|S|\le3|N(S)|$。Hall 给出完美匹配，其中 8 条边对应 8 个兵。匹配边端点不重复，恰好说明所选兵不同行也不同列。</p>` }
  ],
  variants: [
    { id: "h1-v1", lv: "变种", src: "自编：正则数边的推广", stmt: R`二部图 $G=(A\sqcup B,E)$ 中，$|A|=10,|B|=12$，左侧每点度数至少为 4，右侧每点度数至多为 4。证明能选出 10 条端点互不重复的边。能否称它为完美匹配？`,
      hints: [R`不需要知道各点的精确度数。`, R`对 $S\subseteq A$，有 $4|S|\le e(S,N(S))\le4|N(S)|$。`, R`覆盖左侧的 10 条边只覆盖右侧 10 个点，右侧还有两个点。`],
      method: "m-hall", sol: R`<p>任取 $S\subseteq A$，左侧度数下界给 $e(S,N(S))\ge4|S|$，右侧度数上界给 $e(S,N(S))\le4|N(S)|$，所以 Hall 条件成立。存在覆盖 $A$ 的匹配，包含 10 条边。</p><p>这不是完美匹配：右侧有 12 个点，必有两个未覆盖。实际上两侧不等大时不可能有覆盖全部顶点的匹配。</p>` }
  ],
  extensions: [
    { id: "h1-e1", lv: "延伸", src: "Hall 定理的增广路证明", stmt: R`证明 Hall 条件的充分性。可从一个边数最大的匹配 $M$ 出发，反设左侧存在未匹配点 $a_0$。`,
      hints: [R`从 $a_0$ 出发，左到右走非匹配边，右到左走匹配边，找交错道路可达的左集合 $S$ 与右集合 $T$。`, R`若可达右点未匹配，翻转到它的交错道路，就增加一条匹配边。`, R`所以 $T$ 全被匹配，且它们的匹配伙伴恰为 $S\setminus\{a_0\}$；还应证明 $N(S)=T$。`],
      method: "m-hall-deficit", sol: R`<p>取最大匹配 $M$，若不覆盖 $A$，取未匹配左点 $a_0$。沿“左到右非匹配边、右到左匹配边”搜索，记可达左点为 $S$，可达右点为 $T$。</p><p>若 $T$ 有未匹配右点，取到它的一条最短交错道路，翻转沿路各边是否属于匹配，可得到多一条边的匹配，与最大性矛盾。因此 $T$ 全部匹配。</p><p>每个 $b\in T$ 的匹配伙伴可达，属于 $S\setminus\{a_0\}$；每个 $a\in S\setminus\{a_0\}$ 都是通过它的匹配边到达，故对应唯一的 $T$ 中伙伴。这给出双射，$|T|=|S|-1$。</p><p>又有 $N(S)=T$：非匹配邻边可以沿搜索到达；$S$ 中非起点的匹配邻点本就可达，起点没有匹配邻点。反向包含由可达右点必来自左邻点可知。于是 $|N(S)|=|S|-1$，与 Hall 条件矛盾。故 $M$ 覆盖 $A$。</p>` },
    { id: "h1-e2", lv: "延伸", src: "自编：正则图的完美匹配分解", stmt: R`证明：任意有限 $d$-正则二部图（$d\ge1$）的边集可分解为 $d$ 个两两不相交的完美匹配。`,
      hints: [R`先由数边得到两侧等大，再用 Hall 找一组完美匹配。`, R`删除这组匹配后，每个顶点都恰好少一条边。`, R`剩余图是 $(d-1)$-正则二部图，归纳；$d=1$ 时整个边集就是匹配。`],
      method: "m-hall", sol: R`<p>对 $d$ 归纳。$d=1$ 时每点只有一条邻边，所有边即构成完美匹配。设 $d\ge2$。由 $d|A|=|E|=d|B|$ 得两侧等大，由 Hall 的数边证明得到一组完美匹配 $M_1$。</p><p>删去 $M_1$ 后，每点恰少一条边，剩余图仍为二部图且为 $(d-1)$-正则。由归纳假设，其边集可分解成 $d-1$ 组完美匹配。加上 $M_1$，得到所需的 $d$ 组；每组覆盖所有顶点，各组边互不相交。</p>` }
  ]
},
/* ---------------- P1 ---------------- */
p1: {
  unit: "planar", n: 1, title: "平面图：Euler 公式与贪心染色",
  goal: "会数外部面、使用连通与非连通版本的 Euler 公式；会由面边计数排除平面性，并证明色数不超过最大度加一。30 分钟先做概念题、基础题和真题，变种与延伸选做。",
  sections: [
    { id: "p1-s1", h: "1. 平面嵌入与 Euler 公式", html: R`
      <p><b>可平面图</b>是能画在平面上且边只在公共端点相交的图；<b>平面嵌入</b>是这样的一种具体画法。一幅画有交叉，不代表这个抽象图不能重新画成无交叉图。</p>
      <p>记顶点数 $v$、边数 $e$、面数 $f$（<b>包括无界的外部面</b>），分支数为 $c$。对非空有限平面图，</p>
      $$v-e+f=1+c;\qquad\text{连通时 }v-e+f=2.$$
      <p><b>连通情形的证明</b>：树满足 $e=v-1,f=1$。若不是树，取圈上一条边删除，图仍连通，两个相邻面合并，$e,f$ 各减 1，$v-e+f$ 不变。反复删到树即得结论。非连通时可补 $c-1$ 条不相交的连分支边；这些边不分割面，再对连通图用公式。</p>
      <p><b>桥与圈边不同</b>：删除圈边会令 $f$ 减 1、$c$ 不变；删除桥会令 $c$ 加 1、$f$ 不变。下面图中的顶点位置固定，全部边都可无交叉地画出；试着删边，再亲自数面。</p>` },
    { id: "p1-s2", h: "2. 数面边：2e 等于各面边界长度之和", html: R`
      <p>每条边有两侧，因此 $\sum_F\deg(F)=2e$。这里按<b>边界行走的次数</b>计数：桥的两侧可能属于同一个面，但仍计两次。连通树只有一个面，边界长度为 $2e$。</p>
      <p>对<b>简单、可平面且 $v\ge3$</b> 的图，</p>
      $$e\le3v-6.$$
      <p>先证连通情形：每个面的边界长度至少为 3，所以 $3f\le2e$，与 $f=2-v+e$ 联立即得。若图不连通，先在分支间补边使其连通，再用该界，原来的边数更不会超过它。</p>
      <p>若还<b>不含三角形</b>，特别是简单二部可平面图，则面长至少为 4，得到</p>
      $$e\le2v-4\qquad(v\ge3).$$
      <p>不连通时补的连分支边不会产生新圈，所以仍保持无三角形。这些都是<b>必要条件</b>：超出上界即可判非平面；未超界只表示该检验没有排除它，不能直接判平面。例如把 $K_{3,3}$ 的一条边细分为两段，得到 $v=7,e=10$，满足 $e\le3v-6$，却仍非平面；细分点可沿两边的弧压回原边。</p>` },
    { id: "p1-s3", h: "3. 顶点染色：逐点贪心与删点归纳", html: R`
      <p><b>正常顶点染色</b>要求相邻顶点颜色不同，最少颜色数为 $\chi(G)$。2022 期末考的是适用于<b>任意有限简单图</b>的结论：</p>
      $$\chi(G)\le\Delta+1,\qquad\Delta=\max_x d(x).$$
      <p>证明：把顶点任意排序，依次用 $\Delta+1$ 种颜色染色。轮到某点时，已染色的邻点至多有 $\Delta$ 个，最多禁用 $\Delta$ 种颜色，至少还剩一种可用。每条边在后染色的端点处得到检查，因此最终相邻点颜色不同。</p>

g3: {
  unit: "graph", n: 3, title: "双计数：角、无 4-圈图与区组设计",
  goal: "会按讲义的“分类求和、换序求和”把同一个集合数两遍；会用角数夹出无 4-圈图的边数上界（2022 期末 6），会数区组设计中每个元素出现的次数（2022 期末 2(3)）。30 分钟先做概念题和两道真题，讲义作业题作变种与延伸。",
  sections: [
    { id: "g3-s1", h: "1. 讲义 1.2 节：分类求和与换序求和", html: R`
      <p>讲义的<b>离散 Fubini 定理</b>：$p:E\to B$ 是有限集之间的映射，$F_b=p^{-1}(\{b\})$，则对任意 $f:E\to\mathbb R$，</p>
      $$\sum_{e\in E}f(e)=\sum_{b\in B}\ \sum_{e\in E,\ p(e)=b}f(e).$$
      <p>这叫<b>按 $p(e)$ 的值分类求和</b>。取 $f\equiv1$，就是“总数 = 各类个数之和”。</p>
      <p>若 $E\subseteq A\times B$，用两个投影各分类一次，得到<b>换序求和</b>：</p>
      $$\sum_{a\in A}\ \sum_{b\in B,\ (a,b)\in E}f(a,b)=\sum_{b\in B}\ \sum_{a\in A,\ (a,b)\in E}f(a,b).$$
      <p>交换内外层求和时，<b>约束条件 $(a,b)\in E$ 照写</b>。例如 $\sum_{i\lt j}a_{ij}=\sum_{i=1}^{n-1}\sum_{j=i+1}^na_{ij}=\sum_{j=2}^n\sum_{i=1}^{j-1}a_{ij}$。</p>
      <p><b>双计数</b>就是 $f\equiv1$ 时的换序求和：先选好一个“配对集合” $E$，从 $A$ 这边数一次，从 $B$ 这边再数一次。握手定理就是对 $E=\{(v,e):v\in e\}$ 这样做：按顶点数得 $\sum d(v)$，按边数得 $2e(G)$。</p>` },
    { id: "g3-s2", h: "2. 数角：按顶点分类，再用 Cauchy–Schwarz", html: R`
      <p>2022 期末 6 的定义：两条有公共顶点的边 $AB,AC$ 构成一个<b>角</b>，$A$ 是角的<b>顶点</b>，$B,C$ 是角的<b>支点</b>。每个角由“顶点 + 两个支点”决定。</p>
      <p><b>按顶点分类</b>：以 $v_i$ 为顶点的角，就是从 $v_i$ 的 $d_i$ 条边中选 2 条，所以</p>
      $$S=\sum_{i=1}^n\binom{d_i}2=\frac12\sum_{i=1}^nd_i^2-E.$$
      <p>最后一步用了握手定理 $\sum d_i=2E$。再由 Cauchy–Schwarz $n\sum d_i^2\ge\left(\sum d_i\right)^2=4E^2$：</p>
      $$S\ge\frac{2E^2}{n}-E,$$
      <p>等号当且仅当所有 $d_i$ 相等（正则图）。<b>下界只由 $n,E$ 决定</b>，与图的具体形状无关，这是后面夹逼的一半。</p>` },
    { id: "g3-s3", h: "3. 换一种分类：按支点对数角，夹出无 4-圈图的边数", html: R`
      <p><b>按支点对分类</b>：以 $\{B,C\}$ 为支点的角，顶点 $A$ 必须同时与 $B,C$ 相邻。记 $c(B,C)=|N(B)\cap N(C)|$（公共邻点数），则</p>
      $$S=\sum_{\{B,C\}}c(B,C),$$
      <p>和式取遍 $\binom n2$ 个无序点对。两种分类数的是同一批角，结果相同。</p>
      <p><b>关键等价</b>（2022 期末 6(3)）：$G$ 无 4-圈 ⇔ 每个点对 $\{B,C\}$ 至多是一个角的支点，即 $c(B,C)\le1$。</p>
      <ul>
        <li>若 $c(B,C)\ge2$，取两个公共邻点 $A\ne A'$，则 $B,A,C,A'$ 是四个不同顶点，$BA,AC,CA',A'B$ 都是边，构成 4-圈。</li>
        <li>若有 4-圈 $v_1v_2v_3v_4$，则 $v_2,v_4$ 都是 $v_1,v_3$ 的公共邻点，$c(v_1,v_3)\ge2$。</li>
      </ul>
      <p>于是无 4-圈时 $S\le\binom n2$。和第 2 节下界合起来：</p>
      $$\frac{2E^2}{n}-E\le S\le\frac{n(n-1)}2.$$
      <p>这是关于 $E$ 的二次不等式 $4E^2-2nE-n^2(n-1)\le0$，取正根即得 $E\le\frac{1+\sqrt{4n-3}}{4}\,n$，量级约为 $\frac12n^{3/2}$。下面的工具可以点顶点加删边，同时看两种数法和上下界。</p>` }
  ],

    { id: "g3-p2", lv: "真题", src: "2022 秋期末 6(1)–(4)", stmt: R`<p>在简单图 $G$ 中，称两条有公共顶点的边 $AB,AC$ 构成一个角，$A$ 为角的顶点，$B,C$ 为角的支点。</p><p>(1) 设 $G$ 是 $n$ 阶图，各顶点的度为 $d_1,\dots,d_n$。用它们表示角的总数 $S$。</p><p>(2) 利用 $n(d_1^2+\cdots+d_n^2)\ge(d_1+\cdots+d_n)^2$，证明：若 $G$ 有 $E$ 条边，则 $S\ge\frac{2E^2}n-E$。</p><p>(3) 证明：$G$ 中没有长为 4 的圈，当且仅当对任何两个不同顶点 $B,C$，以 $B,C$ 为支点的角至多一个。</p><p>(4) 利用 (2)(3) 证明：若 $n$ 阶图 $G$ 没有长为 4 的圈，则 $E\le\frac{1+\sqrt{4n-3}}4\,n$。</p>`,
      hints: [R`(1)(2) 按角的顶点分类：$S=\sum\binom{d_i}2=\frac12\sum d_i^2-\frac12\sum d_i$，再代 $\sum d_i=2E$。`, R`(3) 以 $B,C$ 为支点的角对应 $B,C$ 的一个公共邻点。两个公共邻点 ⇔ 一个 4-圈的“对角”。`, R`(4) 按支点对分类得 $S\le\binom n2$；联立得 $4E^2-2nE-n^2(n-1)\le0$。`],
      method: "m-angle-bound", sol: R`<p><b>(1)</b> 每个角恰有一个顶点。以 $v_i$ 为顶点的角由 $v_i$ 的两条不同的边决定，共 $\binom{d_i}2$ 个，所以 $S=\sum_{i=1}^n\binom{d_i}2$。</p>
      <p><b>(2)</b> $S=\frac12\sum d_i^2-\frac12\sum d_i$，而 $\sum d_i=2E$。由题给不等式 $\sum d_i^2\ge\frac{4E^2}n$，所以 $S\ge\frac{2E^2}n-E$。</p>
      <p><b>(3)</b> 以 $B,C$ 为支点的角 $\leftrightarrow$ $B,C$ 的公共邻点 $A$（角为 $AB,AC$），所以这种角的个数是 $c(B,C)=|N(B)\cap N(C)|$。</p>
      <p>若某对 $B,C$ 有两个这样的角，顶点分别为 $A\ne A'$。$A,A'$ 与 $B,C$ 都相邻，在简单图中自然不等于 $B,C$；又 $B\ne C$，所以 $B,A,C,A'$ 互不相同，$BA,AC,CA',A'B$ 构成长为 4 的圈。反之，若有 4-圈 $v_1v_2v_3v_4$，则 $v_2v_1,v_2v_3$ 与 $v_4v_1,v_4v_3$ 是两个以 $v_1,v_3$ 为支点的不同角。两个方向的逆否合起来就是所求的等价。</p>
      <p><b>(4)</b> 每个角恰有一对支点，按支点对分类求和得 $S=\sum_{\{B,C\}}c(B,C)$。无 4-圈时由 (3) 每项 $\le1$，所以 $S\le\binom n2$。结合 (2)：</p>
      $$\frac{2E^2}n-E\le\frac{n(n-1)}2\iff4E^2-2nE-n^2(n-1)\le0.$$
      <p>二次函数开口向上，$E$ 不超过较大的根：</p>
      $$E\le\frac{2n+\sqrt{4n^2+16n^2(n-1)}}8=\frac{2n+2n\sqrt{4n-3}}8=\frac{1+\sqrt{4n-3}}4\,n.$$` },
    { id: "g3-p3", lv: "真题", src: "2022 秋期末 2(3)", stmt: R`设 $Y_1,\dots,Y_b$ 都是 $X=\{1,2,\dots,v\}$ 的 $k$ 元子集（$k\ge2$），满足：对 $X$ 中任何两个不同元素 $x,x'$，恰有 $\lambda$ 个 $Y_i$ 同时包含 $x$ 与 $x'$。问：每个元素 $x\in X$ 恰被多少个 $Y_i$ 包含？`,
      hints: [R`固定 $x$，设它属于 $r$ 个区组。要数的配对是 $(x',i)$：$x'\ne x$ 且 $\{x,x'\}\subseteq Y_i$。`, R`按 $x'$ 分类：$v-1$ 个 $x'$，每个对应 $\lambda$ 个 $i$。`, R`按 $i$ 分类：只有含 $x$ 的 $r$ 个区组有贡献，每个贡献 $k-1$ 个 $x'$。`],
      method: "m-double-count", sol: R`<p>固定 $x\in X$，设 $x$ 恰属于 $r_x$ 个 $Y_i$。数集合 $P=\{(x',i):x'\ne x,\ x,x'\in Y_i\}$。</p>
      <p>按 $x'$ 分类：$x'$ 有 $v-1$ 种取法，每种恰有 $\lambda$ 个 $i$，故 $|P|=\lambda(v-1)$。</p>
      <p>按 $i$ 分类：若 $x\notin Y_i$，没有贡献；若 $x\in Y_i$，$x'$ 取 $Y_i\setminus\{x\}$，有 $k-1$ 个。故 $|P|=r_x(k-1)$。</p>
      $$r_x=\frac{\lambda(v-1)}{k-1}.$$
      <p>它与 $x$ 无关。自检：Fano 平面 $v=7,k=3,\lambda=1$，每点在 $r=3$ 条“线”上。再数（元素，区组）配对得 $bk=vr$，所以 $b=7$。</p>` }
  ],
  variants: [
    { id: "g3-v1", lv: "变种", src: "自编：边数界的取整与构造", stmt: R`求 5 阶无 4-圈简单图的最大边数，并给出取到最大值的例子。`,
      hints: [R`代入 $n=5$：$E\le\frac{1+\sqrt{17}}4\cdot5\approx6.40$，边数是整数。`, R`试“蝴蝶图”：两个三角形共用一个顶点。`, R`验证无 4-圈：逐对检查公共邻点数不超过 1，或者直接看出每个圈都在某个三角形里。`],
      method: "m-angle-bound", sol: R`<p>由 2022 期末 6(4)，$E\le\frac{1+\sqrt{17}}4\cdot5\approx6.40$，所以 $E\le6$。</p><p>构造：中心 $c$ 与 $a,b,d,e$ 都相邻，另加边 $ab,de$，共 6 条边。中心与任一点的公共邻点只有该点的三角形同伴，$a,b$ 的公共邻点只有 $c$，$a,d$ 的公共邻点也只有 $c$，其余点对同理，每对的公共邻点都恰为 1 个，故无 4-圈。最大边数为 6。</p><p>此时 $S=\binom42+4\binom22=10=\binom52$，上界恰好取到。界不总是紧的：$n=7$ 时界给出 $E\le10$，而穷举可知最大值是 9。</p>` },
    { id: "g3-v2", lv: "变种", src: "讲义作业 6.5.1(1)(2)", stmt: R`<p>对 $n$ 阶图 $G$ 的两个顶点 $u,v$，若 $uv$ 不是边，就在 $u,v$ 之间画一条虚边。证明：由一条实边和一条虚边构成的角的数目是</p>$$D=\sum_{i=1}^nd_i(n-1-d_i).$$`,
      hints: [R`仍按角的顶点分类。`, R`顶点 $v_i$ 连出 $d_i$ 条实边和 $n-1-d_i$ 条虚边。`, R`一实一虚的角，就是从两类边中各选一条。`],
      method: "m-double-count", sol: R`<p>每个角恰有一个顶点。在 $v_i$ 处，实边有 $d_i$ 条，虚边有 $n-1-d_i$ 条（$v_i$ 与其余每个点之间恰有一条实边或虚边）。一实一虚的角由一条实边和一条虚边决定，共 $d_i(n-1-d_i)$ 个。对 $i$ 求和即得 $D$。</p>` }
  ],
  extensions: [
    { id: "g3-e1", lv: "延伸", src: "讲义作业 6.5.1(3)(4)", stmt: R`<p>沿用上题记号，令 $C=\sum\binom{d_i}2$ 为实角数。把 $K_n$ 的 $\binom n3$ 个三角形按边界上的实边数分类：三实边 $x$ 个，两实一虚 $y$ 个，一实两虚 $z$ 个。</p><p>(1) 证明 $3x+y=C$，$2y+2z=D$。</p><p>(2) 证明 $x\ge\frac{4E}{3n}\left(E-\frac{n^2}4\right)+\frac z3$。特别地，$E\gt n^2/4$ 时 $G$ 中有三角形。</p>`,
      hints: [R`每个角恰好落在一个三角形里（补上两支点之间的那条边）。数每类三角形里各有几个实角、几个一实一虚角。`, R`三实边三角形有 3 个实角；两实一虚有 1 个实角、2 个一实一虚角；一实两虚有 2 个一实一虚角。`, R`消去 $y$：$3x=C-\frac D2+z$。再算 $C-\frac D2=\sum d_i^2-nE$，用 Cauchy。`],
      method: "m-double-count", sol: R`<p><b>(1)</b> 每个角（实角或一实一虚角）由顶点和两个支点确定，恰位于 $K_n$ 的一个三角形中。按三角形分类求和：三实边三角形含 3 个实角；两实一虚三角形的两条实边交于一点，含 1 个实角和 2 个一实一虚角；一实两虚三角形含 0 个实角和 2 个一实一虚角；全虚三角形都不含。所以 $C=3x+y$，$D=2y+2z$。</p>
      <p><b>(2)</b> 由 (1)，$3x=C-y=C-\frac D2+z$。计算</p>
      $$C-\frac D2=\frac12\sum_i\left(d_i^2-d_i-(n-1)d_i+d_i^2\right)=\sum_id_i^2-\frac n2\sum_id_i=\sum_id_i^2-nE.$$
      <p>由 Cauchy–Schwarz $\sum d_i^2\ge4E^2/n$，得 $3x\ge\frac{4E^2}n-nE+z=\frac{4E}n\left(E-\frac{n^2}4\right)+z$，两边除以 3 即为所求。当 $E\gt n^2/4$ 时右端为正，$x\gt0$，即有三角形（Mantel 定理）。</p>` },
    { id: "g3-e2", lv: "延伸", src: "2022 期末 2(3) 的特例（讲义作业 6.8.7 背景）", stmt: R`$X$ 是 $v$ 元集。若一组 3 元子集使 $X$ 中任两个不同元素恰同属其中一个子集（施泰纳三元系），求每个元素所在的子集数 $r$ 与子集总数 $b$，并说明 $v\equiv1$ 或 $3\pmod 6$ 是必要条件。`,
      hints: [R`这是 $k=3,\lambda=1$ 的区组设计，直接套 $r=\lambda(v-1)/(k-1)$。`, R`再数（元素，子集）配对：$bk=vr$。`, R`$r,b$ 都必须是整数：$v$ 为奇数，且 $6\mid v(v-1)$。`],
      method: "m-double-count", sol: R`<p>由真题结论，$r=\frac{v-1}2$。数配对 $\{(x,i):x\in Y_i\}$：按 $x$ 得 $vr$，按 $i$ 得 $3b$，故 $b=\frac{v(v-1)}6$。</p><p>$r$ 为整数 ⇒ $v$ 为奇数；$b$ 为整数 ⇒ $3\mid v(v-1)$，即 $v\equiv0$ 或 $1\pmod3$。结合 $v$ 为奇数，得 $v\equiv1$ 或 $3\pmod6$。例如 $v=7$ 时 $r=3,b=7$（Fano 平面）。</p>` }
  ]
},

count1: {
  unit: "count", n: 1, title: "计数回顾：容斥、递推与抽屉原理",
  goal: "沿讲义 §1.4–1.6，把“有重叠”“能分类”“必存在”分清。30 分钟先做概念与三道主线题，变种和延伸留作回炉；记住容斥的坏事件、递推的初值、抽屉的映射。",
  sections: [
    { id: "count1-s1", h: "1. 容斥：先定义坏事件，再逐点核对系数", html: R`
      <p>讲义定理 1.4.1：有限集合 $A_1,\ldots,A_m$ 的并满足</p>
      $$\left|\bigcup_{i=1}^m A_i\right|=\sum_i|A_i|-\sum_{i\lt j}|A_i\cap A_j|+\cdots+(-1)^{m-1}|A_1\cap\cdots\cap A_m|.$$
      <p><b>讲义的证明路线</b>：交换求和，固定一个落在 $d\ge1$ 个集合中的元素，它被计入 $\binom d1-\binom d2+\cdots+(-1)^{d-1}\binom dd=1$ 次。因此没有漏计或重计。</p>
      <p>若要求“一个坏事件也不发生”，先数全集 $\Omega$，再减去并集。例 1.4.2 的错位排序：令 $A_i=\{\pi:\pi(i)=i\}$；指定 $k$ 个位置固定后，剩下 $(n-k)!$ 种排列，故</p>
      $$d_n=\sum_{k=0}^n(-1)^k\binom nk(n-k)!=n!\sum_{k=0}^n\frac{(-1)^k}{k!}.$$
      <p>约定 $d_0=1$（空排列一种），$d_1=0$。不要把“恰有 $k$ 个固定点”与“指定的 $k$ 个位置固定”混为一谈：后者允许其他位置也固定。</p>` },
    { id: "count1-s2", h: "2. 递推：分类必须不交且穷尽，初值也是答案", html: R`
      <p>讲义 §1.5 从 Fibonacci 的 $F_1=F_2=1$、$F_{n+1}=F_n+F_{n-1}$ 出发。作业 6.2.5(1) 问：$[n]$ 中不含相邻元素的子集有多少个（含空集）？记为 $a_n$。</p>
      <p>按是否取 $n$ 分类：不取有 $a_{n-1}$ 种；取 $n$ 就不能取 $n-1$，余下有 $a_{n-2}$ 种。两类不交且穷尽，所以</p>
      $$a_n=a_{n-1}+a_{n-2}\quad(n\ge2),\qquad a_0=1,\quad a_1=2,\qquad a_n=F_{n+2}.$$
      <p><b>只写递推式不够</b>：同一个递推，初值不同就有不同数列。若要通项，可按讲义解特征方程 $r^2=r+1$，但计数题先把分类和初值说明白。交互工具可将公式与实际枚举对照。</p>` },
    { id: "count1-s3", h: "3. 抽屉：把“必有”改写成有限集之间的映射", html: R`
      <p>讲义定理 1.6.1：多于 $mk$ 个物体放进 $m$ 个抽屉，必有一个抽屉至少装 $k+1$ 个。等价地，有限映射 $p:E\to B$（$B$ 非空）有一个原像集大小至少为 $\lceil|E|/|B|\rceil$。</p>
      <p>最难的一步通常是<b>选抽屉</b>。整除题优先考虑余数；“某段和”优先考虑部分和。讲义例 1.6.4：$n$ 个整数 $a_1,\ldots,a_n$ 中可选出非空的一组，其和被 $n$ 整除。沿讲义先看 $S_i=a_1+\cdots+a_i$：若某个余数为 0 即得；否则 $n$ 个部分和落入 $n-1$ 个非零余数抽屉，两者之差就是所求。</p>
      <p>也可把 $S_0=0$ 一起放进来：$n+1$ 个部分和进 $n$ 个余数抽屉。注意得到的甚至是<b>一段连续项</b>，并且两个下标必须不同，才能保证非空。</p>` }
  ],
  widget: "countPlay",
  concepts: [
    { id: "count1-c1", sec: "count1-s1", q: R`某元素同时落在三个坏事件里，在三集合并集的容斥式中，其总系数是：`, opts: [R`$3$`, R`$3-3=0$`, R`$3-3+1=1$`, R`$1-3+3=1$，所以三重交集应减去`], a: 2, ex: R`单集合项数到 3 次，两两交集减去 3 次，三重交集再加 1 次。容斥是按“指定哪些事件都发生”计数，不是直接按“恰好几个”计数。` },
    { id: "count1-c2", sec: "count1-s2", q: R`$[n]$ 的不含相邻元素子集数 $a_n$，正确的初值是：`, opts: [R`$a_0=0,a_1=1$`, R`$a_0=1,a_1=1$`, R`$a_0=1,a_1=2$`, R`$a_0=2,a_1=2$`], a: 2, ex: R`空集的子集只有空集，一种；$\{1\}$ 的合法子集是 $\varnothing,\{1\}$，两种。` },
    { id: "count1-c3", sec: "count1-s3", q: R`要保证某个抽屉至少装 4 个物体，5 个抽屉中最少放多少个物体？`, opts: [R`$15$`, R`$16$`, R`$19$`, R`$20$`], a: 1, ex: R`若每屉至多 3 个，总共至多 15 个；第 16 个迫使某屉达到 4 个。15 个可恰好每屉 3 个，不能保证。` },

  methods: [
    { id: "m-count-ie", title: "容斥：坏事件与交集", steps: [R`确定全集 $\Omega$，定义每一个坏事件 $A_i$，写清要数并集还是补集。`, R`固定 $k$ 个事件同时发生，先求其交集大小；若只与 $k$ 有关，再乘 $\binom mk$。`, R`并集从加开始，补集从全集开始交替加减；用小规模或逐点系数核对。`] },
    { id: "m-count-rec", title: "递推：最后一个对象去哪了", steps: [R`定义 $a_n$ 的对象与边界（是否含空集、位置是否成环）。`, R`按最后一个元素是否选取，或最后一段的形状，划分成不交且穷尽的类别。`, R`把每类与较小规模对象建立双射，写递推及适用范围，再列足够的初值。`] },
    { id: "m-count-pigeon", title: "抽屉：先构造映射", steps: [R`把待证“必存在”中的对象明确列出来；整除问题尝试部分和。`, R`给每个对象指定唯一抽屉（如模 $n$ 的余数），比较对象数与抽屉容量。`, R`把同屉的两个对象翻译回原题；检查下标不同、所选对象非空。`] }
  ],
  problems: [
    { id: "count1-p1", lv: "基础", src: "讲义例 1.4.2（特化 n=5）", stmt: R`五封不同的信放进对应的五个不同信封，每个信封一封，要求每封信都放错。求放法数，并说明容斥交集中的 $(5-k)!$ 为什么允许额外的信放对。`, hints: [R`全集是五个元素的排列，令 $A_i$ 为第 $i$ 封信放对。`, R`指定 $k$ 封信放对，剩余信与信封可任意双射，共 $(5-k)!$ 种。`, R`$d_5=120-5\cdot24+10\cdot6-10\cdot2+5-1$。`], method: "m-count-ie", sol: R`<p>由讲义例 1.4.2，$d_5=\sum_{k=0}^5(-1)^k\binom5k(5-k)!=120-120+60-20+5-1=44$。</p><p>交集 $A_{i_1}\cap\cdots\cap A_{i_k}$ 只要求指定的 $k$ 封信放对，没有要求其余放错，所以是 $(5-k)!$。额外放对造成的重复已由整个交替和抵消；若在交集里再限制“其余全错”，就改变了坏事件，不能套此容斥式。</p>` },
    { id: "count1-p2", lv: "基础", src: "讲义作业 6.2.5(1)", stmt: R`设 $a_n$ 是 $[n]$ 的不含相邻元素的子集数，含空集。求递推式及初值，用讲义的 Fibonacci 数表示 $a_n$，并计算 $a_6$。`, hints: [R`按是否选 $n$ 分类；选了 $n$，就不能选 $n-1$。`, R`不选 $n$ 是 $a_{n-1}$ 种；选 $n$ 是 $a_{n-2}$ 种。`, R`$a_0=1,a_1=2$；讲义约定 $F_1=F_2=1$，向后平移两位。`], method: "m-count-rec", sol: R`<p>当 $n\ge2$，不取 $n$ 的子集与 $[n-1]$ 的合法子集一一对应，取 $n$ 的子集删去 $n$ 后与 $[n-2]$ 的合法子集一一对应，故 $a_n=a_{n-1}+a_{n-2}$。初值 $a_0=1,a_1=2$。</p><p>$F_2=1,F_3=2$，且满足同一递推，由归纳法有 $a_n=F_{n+2}$。依次得 $1,2,3,5,8,13,21$，所以 $a_6=21$。也可按子集大小核对：$\sum_{r=0}^3\binom{6-r+1}{r}=1+6+10+4=21$（固定大小的双射见讲义作业 6.1.2）。</p>` },
    { id: "count1-p3", lv: "基础", src: "讲义例 1.6.4（Erdős）", stmt: R`证明：任意 $n\ge1$ 个整数中，存在非空的一组整数，其和能被 $n$ 整除。进一步说明能否保证选出的下标连续。`, hints: [R`按讲义令 $S_i=a_1+\cdots+a_i$。若某个 $S_i\equiv0\pmod n$，立即完成。`, R`否则 $n$ 个部分和只能落进 $1,\ldots,n-1$ 这 $n-1$ 个余数抽屉。`, R`同余的 $S_i,S_j$（$i\lt j$）相减；也可加入 $S_0=0$ 统一处理两种情况。`], method: "m-count-pigeon", sol: R`<p>令 $S_0=0$，$S_i=\sum_{r=1}^i a_r$。$S_0,\ldots,S_n$ 共 $n+1$ 个数，除以 $n$ 的余数只有 $n$ 种。由抽屉原理，存在 $0\le i\lt j\le n$ 使 $S_i\equiv S_j\pmod n$。于是 $n\mid S_j-S_i=a_{i+1}+\cdots+a_j$。</p><p>因 $i\lt j$，所取非空；下标还连续。此证明与讲义“先处理零余数，再找非零余数碰撞”一致，只是用 $S_0$ 合并了讨论。$n=1$ 时直接取唯一的一项，也包含在证明中。</p>` }
  ],
  variants: [
    { id: "count1-v1", lv: "变种", src: "讲义例 1.4.3（特化 n=5,m=3）", stmt: R`把五个不同物体放进三个有标号的盒子，每盒至少一个。求放法数。若三个盒子无标号，答案如何变化？`, hints: [R`有标号时是从 $[5]$ 到 $[3]$ 的满射；坏事件为某个指定盒子为空。`, R`$3^5-\binom31 2^5+\binom32 1^5$。`, R`满射保证三盒非空，因此给三个无标号组编号恰有 $3!$ 种。`], method: "m-count-ie", sol: R`<p>由容斥，有标号放法 $3^5-3\cdot2^5+3\cdot1^5-0^5=243-96+3=150$。无标号的分组数为 $150/3!=25$，也就是讲义 §1.5 的第二类 Stirling 数 $S(5,3)$。</p><p>能除以 $3!$ 的原因是每组非空且互不相交，每种分组都恰有 $3!$ 个编号方案；不能在允许空盒时不加检查地照除。</p>` },
    { id: "count1-v2", lv: "变种", src: "讲义作业 6.2.2（特化 n=100，素数 2、3、5）", stmt: R`在 $1,\ldots,100$ 中，有多少个整数与 $2,3,5$ 都互素？`, hints: [R`令 $A_p$ 是 $p$ 的倍数；求三个坏集合并集的补集。`, R`交集分别是 $6,10,15,30$ 的倍数，用向下取整。`, R`$100-(50+33+20)+(16+10+6)-3$。`], method: "m-count-ie", sol: R`<p>因 $2,3,5$ 两两互素，指定素数对应坏集合的交集就是其乘积的倍数。答案为</p>$$100-\left(\left\lfloor\frac{100}2\right\rfloor+\left\lfloor\frac{100}3\right\rfloor+\left\lfloor\frac{100}5\right\rfloor\right)+\left(\left\lfloor\frac{100}6\right\rfloor+\left\lfloor\frac{100}{10}\right\rfloor+\left\lfloor\frac{100}{15}\right\rfloor\right)-\left\lfloor\frac{100}{30}\right\rfloor=26.$$<p>核对：每 30 个数有 8 个与 30 互素，前三个整段贡献 24 个；91–100 中再有 91、97，共 26 个。</p>` }
  ],
  extensions: [
    { id: "count1-e1", lv: "延伸", src: "讲义作业 6.2.5(2)(3)", stmt: R`<p>(1) 记 $b_n$ 为 $[n]$ 的不含三个连续元素的子集数，求递推与初值，并算 $b_6$。</p><p>(2) 把 $1,\ldots,n$ 放在圆周上（$n\ge3$），首尾也相邻。记不含相邻元素的子集数为 $c_n$，用主线题的 $a_n$ 表示并算 $c_6$。</p>`, hints: [R`(1) 用 0/1 串表示子集，按结尾为 0、01、011 分类（短串另列初值）。`, R`$b_n=b_{n-1}+b_{n-2}+b_{n-3}$，$b_0=1,b_1=2,b_2=4$。`, R`(2) 按是否取顶点 1；取 1 时，2 与 n 都不能取。`], method: "m-count-rec", sol: R`<p>(1) 长度 $n\ge3$ 的合法串必以 0、01 或 011 之一结尾，删去相应后缀后是任意合法短串。这三类不交且穷尽，所以 $b_n=b_{n-1}+b_{n-2}+b_{n-3}$，初值 $1,2,4$，接着为 $7,13,24,44$，故 $b_6=44$。</p><p>(2) 不取 1 时剩下路径 $2,\ldots,n$，有 $a_{n-1}$ 种；取 1 时剩下路径 $3,\ldots,n-1$，有 $a_{n-3}$ 种。因此 $c_n=a_{n-1}+a_{n-3}=F_{n+1}+F_{n-1}$，$c_6=13+5=18$。$n=3$ 时第二条路径为空，仍由 $a_0=1$ 正确处理。</p>` }
  ]
},
count2: {"unit":R`count`,
"n":2,
"title":R`组合概率：样本空间、独立性与期望`,
"goal":R`沿讲义 §2.1–2.2，把计数转成概率；会分辨等可能与独立，会用指示变量数期望。30 分钟先做概念、硬币与生日主线，变种和延伸选做。`,
"sections":[{"id":R`count2-s1`,
"h":R`1. 有限概率空间：先说明哪些结果等可能`,
"html":R`<p>按讲义定义 2.1.1，有限概率空间是有限集合 $\Omega$ 及权重 $p_\omega\ge0$，且 $\sum_{\omega\in\Omega}p_\omega=1$；事件 $E\subseteq\Omega$ 的概率为 $P(E)=\sum_{\omega\in E}p_\omega$。只有均匀空间才可写 $P(E)=|E|/|\Omega|$。</p><p>独立投掷 $n$ 次公平硬币，具体的 0/1 串等可能，各为 $2^{-n}$；但“恰有 $k$ 次正面”这 $n+1$ 类结果不等可能。其概率是 $\binom nk/2^n$，因为对应的串有 $\binom nk$ 个。</p><p>讲义定理 2.1.6 是带权容斥：把集合大小换成概率，仍有 $P(A\cup B)=P(A)+P(B)-P(A\cap B)$。求“至少一次”通常先求补事件“一次也没有”。</p>`},
{"id":R`count2-s2`,
"h":R`2. 独立与互斥：一个说乘法，一个说不能同时发生`,
"html":R`<p>讲义 §2.3 的定义：$A,B$ 独立指 $P(A\cap B)=P(A)P(B)$。若 $P(B)\gt0$，条件概率 $P(A\mid B)=P(A\cap B)/P(B)$，独立等价于知道 $B$ 发生不改变 $A$ 的概率。</p><p>互斥指 $A\cap B=\varnothing$。两个正概率的互斥事件不独立，因为 $0\ne P(A)P(B)$。独立试验的联合结果按乘积权重赋概率，正是讲义例 2.1.2 的乘积空间。</p><p>一族事件两两独立，不一定整体独立；多事件相乘要有相应的联合独立条件。概率为 0 的事件不能直接放在条件概率的分母。</p>`},
{"id":R`count2-s3`,
"h":R`3. 期望：先把计数写成指示变量之和`,
"html":R`<p>讲义定义 2.2.1：随机变量是 $X:\Omega\to\mathbb R$，期望 $E[X]=\sum_\omega X(\omega)p_\omega$。交换有限求和得 $E[X+Y]=E[X]+E[Y]$，<b>此处不要求独立</b>。</p><p>事件 $A$ 的指示变量 $I_A$ 在 $A$ 发生时为 1，否则为 0，所以 $E[I_A]=P(A)$。若 $X$ 数的是满足某条件的对象个数，就写 $X=\sum_i I_i$，于是 $E[X]=\sum_iP(I_i=1)$。</p><p>生日问题：假设每人生日相互独立，且在 366 天上均匀。$k\le366$ 人无同生日的概率为 $\prod_{i=0}^{k-1}(1-i/366)$，并非“每一对不撞”的概率简单相乘。下方工具可比较精确生日概率和碰撞对数期望。</p>`}],

"problems":[{"id":R`count2-p1`,
"lv":R`基础`,
"src":R`讲义例 2.1.2(3)（特化 n=6）`,
"stmt":R`独立投掷公平硬币 6 次，求：(1) 恰有 3 次正面的概率；(2) 至少一次正面的概率；(3) 正面次数的期望。`,
"hints":[R`完整样本是长度 6 的 0/1 串，共 $2^6$ 个，等可能。`,
R`(1) 选 3 个正面位置；(2) 减去全反面这一种串。`,
R`(3) 写成 6 个“第 i 次为正面”指示变量之和。`],
"method":R`m-prob-space`,
"sol":R`<p>(1) $\binom63/2^6=20/64=5/16$。(2) $1-2^{-6}=63/64$。(3) $E[X]=\sum_{i=1}^6E[I_i]=6/2=3$。</p><p>“正面数为 0,1,\ldots,6”是 7 类不等可能结果，不能把 (1) 写成 $1/7$。期望计算只用线性性；独立性用于这个实验模型和二项计数。</p>`},
{"id":R`count2-p2`,
"lv":R`讲义作业`,
"src":R`讲义作业 6.3.1(1)(3)`,
"stmt":R`<p>假设一年 366 天，每个人的生日独立且均匀。记 $P_k$ 为 $k$ 人中存在同生日的两人的概率。</p><p>(1) 求 $P_k$；(2) 求使 $P_k\gt1/2$ 的最小正整数 $k$。</p>`,
"hints":[R`先数所有生日互异的补事件。`,
R`$k\le366$ 时无碰撞概率为 $366\cdot365\cdots(366-k+1)/366^k$；$k\gt366$ 时用抽屉原理。`,
R`逐项乘积比较 k=22 与 23；P_k 随 k 不减。`],
"method":R`m-prob-space`,
"sol":R`<p>$k\le366$ 时，$P_k=1-\prod_{i=0}^{k-1}(1-i/366)$；$k\gt366$ 时 $P_k=1$。</p><p>精确乘积给 $P_{22}\approx0.474751$、$P_{23}\approx0.506323$。增加一人不会消除已有碰撞，故 $P_k$ 单调不减，最小 $k=23$。计算假设必须说明：独立、366 天均匀；真实生日分布不在本题模型内。</p>`}],
"variants":[{"id":R`count2-v1`,
"lv":R`变种`,
"src":R`自编：指示变量与概率上界`,
"stmt":R`在上述 366 天模型下，23 人中同生日的无序人对数为 $X$。求 $E[X]$，并证明 $P(X\ge1)\le E[X]$。这个上界是否就是精确碰撞概率？`,
"hints":[R`把每对人的同生日事件记为一个指示变量。`,
R`共有 $\binom{23}2=253$ 对，每对概率 $1/366$。`,
R`逐点有 $1_{\{X\ge1\}}\le X$，取期望。`],
"method":R`m-prob-indicator`,
"sol":R`<p>$X=\sum_{i\lt j}I_{ij}$，所以 $E[X]=253/366\approx0.691257$。逐点 $1_{\{X\ge1\}}\le X$，得 $P(X\ge1)\le E[X]$。</p><p>它只是上界；精确概率约为 0.506323。若三人同生日，$X$ 一次贡献 3 对，而“至少一对”只贡献 1，所以不能把这两种量等同。指示变量之间不必独立。</p>`}],
"extensions":[{"id":R`count2-e1`,
"lv":R`延伸`,
"src":R`自编：讲义独立性定义的边界`,
"stmt":R`令 $U,V$ 是独立公平 0/1 位。事件 $A=\{U=0\}$、$B=\{V=0\}$、$C=\{U=V\}$ 是否两两独立？是否整体独立？`,
"hints":[R`列出 00、01、10、11 四个等可能结果。`,
R`三个事件概率均为 1/2，每对交集均只有 00。`,
R`三重交集概率为 1/4；若整体独立应为 1/8。`],
"method":R`m-prob-space`,
"sol":R`<p>$P(A)=P(B)=P(C)=1/2$，$P(A\cap B)=P(A\cap C)=P(B\cap C)=1/4$，故两两独立。但 $A\cap B\cap C=\{00\}$，概率 $1/4\ne(1/2)^3$，所以不整体独立。</p><p>本例说明：从每一对独立，不能直接把三个或更多事件的交集概率写成各自概率的乘积。</p>`}]},
count3: {"unit":R`count`,
"n":3,
"title":R`概率界：Markov、Chebyshev 与大数定律`,
"goal":R`沿讲义 §2.2，用非负性控制尾概率，再用独立乘积空间得到样本平均的集中。30 分钟主线做概念和两题；讲义 LLL 放延伸，先学会核验条件，不把它当普通独立公式。`,
"sections":[{"id":R`count3-s1`,
"h":R`1. Markov：把大值事件的每项压低到阈值`,
"html":R`<p>讲义定理 2.2.2：若 $X\ge0$，$a\gt0$，则 $P(X\ge a)\le E[X]/a$。因为逐点 $X\ge a1_{\{X\ge a\}}$，取期望即可。概率同时不超过 1，实际可取 $\min\{1,E[X]/a\}$。</p><p>两个条件都不能漏：$X$ 必须非负，阈值必须为正。等号要求损失处处为零（忽略零概率点）：在 $X\lt a$ 的部分只能取 0，在 $X\ge a$ 的部分只能取 $a$，即 $X$ 只取 $0,a$。</p>`},
{"id":R`count3-s2`,
"h":R`2. Chebyshev：对平方偏差使用 Markov`,
"html":R`<p>讲义定义方差 $\operatorname{Var}(X)=E[(X-\mu)^2]=E[X^2]-\mu^2$，其中 $\mu=E[X]$。对非负变量 $(X-\mu)^2$ 用 Markov，任意 $a\gt0$ 得</p>$$P(|X-\mu|\ge a)\le\frac{\operatorname{Var}(X)}{a^2}.$$
<p>讲义正文定理 2.2.3 写成严格尾事件 $|X-\mu|\gt\lambda\sqrt{\operatorname{Var}(X)}$ 的界。本课用上面的<b>不严格阈值版</b>，便于含方差为 0 的情形并讨论作业 6.3.3 的等号。不能把 $\gt$ 与 $\ge$ 的取等条件混用。</p>`},
{"id":R`count3-s3`,
"h":R`3. 大数定律：方差相加需要独立结构`,
"html":R`<p>按讲义的乘积空间，$X_1,\ldots,X_n$ 为同分布独立副本，均值为 $\mu$、方差为 $\sigma^2$。令 $\overline X_n=(X_1+\cdots+X_n)/n$，则</p>$$E[\overline X_n]=\mu,\qquad\operatorname{Var}(\overline X_n)=\frac{\sigma^2}{n},\qquad P(|\overline X_n-\mu|\ge\varepsilon)\le\frac{\sigma^2}{n\varepsilon^2}\longrightarrow0.$$
<p>期望线性不要求独立；方差相加需控制交叉项，讲义这里由独立乘积空间保证。大数定律说偏离概率趋零，不是某次样本平均必然等于均值，也不是前面偏多后面就必须补回来。</p>`}],
"widget":R`tailPlay`,
"concepts":[{"id":R`count3-c1`,
"sec":R`count3-s1`,
"q":R`Markov 直接应用需要：`,
"opts":[R`$X\ge0$ 且 $a\gt0$`,
R`$E[X]=0$`,
R`$X$ 独立于自己`,
R`$X$ 必为整数`],
"a":0,

"methods":[{"id":R`m-prob-tail`,
"title":R`尾概率：选非负变量和阈值`,
"steps":[R`要控制 X 的大值，检查 X≥0 后用 Markov；要控制偏离均值，换成 (X−μ)²。`,

{"id":R`m-prob-average`,
"title":R`样本平均：均值、方差、Chebyshev`,
"steps":[R`先说明样本是讲义乘积空间中的独立同分布副本，记均值 μ、方差 σ²。`,

"problems":[{"id":R`count3-p1`,
"lv":R`基础`,
"src":R`讲义例 2.2.6（定量化）`,
"stmt":R`独立投掷公平硬币 $n$ 次，记正面频率为 $\overline X_n$。用 Chebyshev 保证 $P(|\overline X_n-1/2|\ge0.05)\le0.05$，需要怎样的 $n$？这是否说明更小的 $n$ 一定不够？`,
"hints":[R`单次正面指示变量均值 1/2，方差 1/4。`,
R`频率的方差是 $1/(4n)$，偏离界 $1/(4n\cdot0.05^2)$。`,
R`解 $100/n\le0.05$；注意这是充分条件，不是精确最小样本数。`],
"method":R`m-prob-average`,
"sol":R`<p>$E[X_i]=1/2$，Var$(X_i)=1/4$。由独立性，Var$(\overline X_n)=1/(4n)$，故偏离概率不超过 $100/n$。取整数 $n\ge2000$ 即可保证不超过 0.05。</p><p>这是 Chebyshev 给出的充分条件；界可能偏松，更小的 $n$ 仍可能满足真实概率要求。工具可比较小规模二项分布的精确尾概率与上界。</p>`},
{"id":R`count3-p2`,
"lv":R`讲义作业`,
"src":R`讲义作业 6.3.3（Chebyshev 明确用 ≥阈值版）`,
"stmt":R`<p>(1) 设 $X\ge0,a\gt0$。求 $P(X\ge a)\le E[X]/a$ 的等号条件。</p><p>(2) 设 $\mu=E[X],a\gt0$。求 $P(|X-\mu|\ge a)\le\operatorname{Var}(X)/a^2$ 的等号条件，并给出非零方差的例子。</p>`,
"hints":[R`(1) 差值是 $E[X-a1_{X\ge a}]$，被积项处处非负。`,
R`等号要求正概率点上：$X\lt a$ 时 $X=0$，$X\ge a$ 时 $X=a$。`,
R`(2) 把 X 换成 $(X-\mu)^2$；取均值两侧对称的两个值可构造例子。`],
"method":R`m-prob-tail`,
"sol":R`<p>(1) 等号当且仅当 $X\in\{0,a\}$ 以概率 1 成立。因为尾部的 $X-a$ 和非尾部的 $X$ 都非负，其期望之和为 0 当且仅当它们在所有正概率点上为 0。</p><p>(2) 同理，等号当且仅当 $(X-\mu)^2\in\{0,a^2\}$ 以概率 1 成立，即 $X\in\{\mu-a,\mu,\mu+a\}$。同时 $E[X]=\mu$ 自动要求两侧的概率相等。例：$X=\pm1$ 各概率 1/2，取 $a=1,\mu=0$，两边均为 1。</p><p>若事件改为严格 $|X-\mu|\gt a$，这个例子左边变成 0；不能照用上述取等条件。此处特地说明与讲义正文的严格号差别。</p>`}],
"variants":[{"id":R`count3-v1`,
"lv":R`变种`,
"src":R`讲义作业 6.3.4`,
"stmt":R`有限概率空间上给定事件 $E_1,\ldots,E_r$。若 $F$ 表示至少 $m\ge1$ 个事件发生，证明 $P(F)\le\frac1m\sum_{i=1}^rP(E_i)$。需要事件独立吗？`,
"hints":[R`定义计数变量 $D=\sum_i1_{E_i}$。`,
R`$F=\{D\ge m\}$，且 $D\ge0$。`,
R`用 Markov 与期望线性；不需要方差，也不需要独立。`],
"method":R`m-prob-tail`,
"sol":R`<p>$D=\sum_{i=1}^r1_{E_i}$ 是发生事件的个数，$E[D]=\sum_iP(E_i)$。由 $F=\{D\ge m\}$ 及 Markov，$P(F)\le E[D]/m$，即所求。</p><p>不需要独立。$m=1$ 时得到并集上界；所有事件完全相同时，证明也成立。</p>`}],
"extensions":[{"id":R`count3-e1`,
"lv":R`延伸`,
"src":R`讲义定理 2.3.3：LLL 应用（自编模型）`,
"stmt":R`<p>一个布尔公式是若干个子句的合取，每个子句由 8 个不同变量的文字作“或”；每个变量最多出现在 4 个子句中。证明存在赋值使所有子句成立。</p><p>可用讲义 LLL：若坏事件的依赖图中，每个事件与所有非邻事件组成的事件族无关，且存在 $0\le x_i\lt1$ 使 $P(E_i)\le x_i\prod_{j\sim i}(1-x_j)$，则所有坏事件都不发生的概率为正。</p>`,
"hints":[R`独立均匀随机给每个变量赋 0/1。坏事件是某个子句不成立，概率 $2^{-8}$。`,
R`只要两个子句共享变量就连依赖边。每个子句最多与 $8(4-1)=24$ 个其他子句相邻。`,
R`统一取 $x_i=1/25$，验证 $1/256\le(1/25)(24/25)^{24}$。`],
"method":R`m-prob-space`,
"sol":R`<p>每个子句含 8 个不同变量，恰有一种局部赋值使八个文字全假，故坏事件概率为 $1/256$。把共享变量的子句连边，每个坏事件的度至多 24。非邻事件整体只依赖本子句之外的变量，因此与该坏事件组成讲义所要求的无关事件族，不只是两两独立。</p><p>取 $x_i=1/25$，有 $x_i\prod_{j\sim i}(1-x_j)\ge\frac1{25}(\frac{24}{25})^{24}\approx0.015017\gt1/256$。LLL 得所有子句同时成立的概率至少为 $(24/25)^r\gt0$（r 为子句数），因此存在满足赋值。</p><p>主线 30 分钟不要求重证 LLL；重点是“坏事件、依赖图、整族无关、代入参数”四步，不能把两两独立误作假设。</p>`}]},
n2: {"unit":R`nt`,
"n":2,
"title":R`数论回顾：Bezout、同余消去与 Euler`,
"goal":R`沿讲义第三章，用最大公约数决定可解性，用逆元处理同余，用 Euler 缩短幂次。30 分钟完成概念和两道主线；与 n1 的中国剩余定理衔接，先检查互素再消去。`,
"sections":[{"id":R`n2-s1`,
"h":R`1. 辗转相除与 Bezout：不仅求 gcd，还要会回代`,
"html":R`<p>讲义命题 3.1.4：若 $a=qb+r$，则 $(a,b)=(b,r)$，因为两对数的公因子集合相同。反复带余除法，最后一个非零余数就是最大公约数。</p><p>讲义定理 3.1.6：整数 $a,b$（不全为 0）存在整数 $u,v$ 使 $au+bv=(a,b)$。用相除等式逆向回代即可找到系数。例如 $252=198+54$，$198=3\cdot54+36$，$54=36+18$，故 $18=4\cdot252-5\cdot198$。</p><p>后果：$ax+by=c$ 有整数解当且仅当 $(a,b)\mid c$。必要性靠整除线性组合；充分性把 Bezout 等式乘 $c/(a,b)$。</p>`},
{"id":R`n2-s2`,
"h":R`2. 同余中不能随便约分，逆元存在恰好需要互素`,
"html":R`<p>讲义命题 3.2.2：由 $ab\equiv ac\pmod m$ 只能推出 $b\equiv c\pmod{m/(a,m)}$。只有 $(a,m)=1$ 才能保持模数 $m$ 不变。</p><p>令 $d=(a,m)$。同余方程 $ax\equiv b\pmod m$ 有解当且仅当 $d\mid b$；有解时先除以 $d$，得到模 $m/d$ 的互素方程，恰有一个剩余类。换回模 $m$，共有 $d$ 个不同解。逆元是 $b=1$ 的特例：$a^{-1}$ 存在当且仅当 $(a,m)=1$。</p><p>例如 $6x\equiv8\pmod{14}$，先除以 2 得 $3x\equiv4\pmod7$，逆元为 5，故 $x\equiv6\pmod7$，模 14 的解是 6、13。不能直接写 $x\equiv8/6$。</p>`},
{"id":R`n2-s3`,
"h":R`3. Euler：用可逆剩余类的置换证明`,
"html":R`<p>讲义定义 $\varphi(m)=\#\{1\le r\le m:(r,m)=1\}$，并由容斥得 $\varphi(m)=m\prod_{p\mid m}(1-1/p)$。讲义定理 3.2.8：若 $(a,m)=1$，则 $a^{\varphi(m)}\equiv1\pmod m$。</p><p>证明路线与讲义一致：乘以 $a$ 置换全部可逆剩余类，故它们的乘积乘上 $a^{\varphi(m)}$ 后不变；该乘积与 $m$ 互素，可以消去。素数 $p$ 给 Fermat 小定理 $a^{p-1}\equiv1\pmod p$（$p\nmid a$）；普遍版本 $a^p\equiv a\pmod p$ 不要求互素。</p><p><b>缩指数前检查互素</b>，例如 $2^{\varphi(8)}=16\not\equiv1\pmod8$。计算大幂还可用重复平方，工具用直接枚举核对一次同余方程的解。</p>`}],

"methods":[{"id":R`m-nt-gcd`,
"title":R`整除方程：gcd 与 Bezout`,
"steps":[R`用辗转相除求 d=gcd(a,b)，必要时保留每一步以便回代。`,

"problems":[{"id":R`n2-p1`,
"lv":R`基础`,
"src":R`自编：讲义 3.1.4、3.1.6`,
"stmt":R`求 $(252,198)$ 并表示成 $252u+198v$。据此给出 $252x+198y=90$ 的一组整数解。`,
"hints":[R`依次余数为 54、36、18、0。`,
R`$18=54-36=4\cdot54-198$。`,
R`$54=252-198$；最后把等式乘 5。`],
"method":R`m-nt-gcd`,
"sol":R`<p>辗转相除最后非零余数为 18，故 $(252,198)=18$。回代 $18=54-36=54-(198-3\cdot54)=4(252-198)-198=4\cdot252-5\cdot198$。</p><p>乘以 5 得 $90=20\cdot252-25\cdot198$，所以一组解为 $(x,y)=(20,-25)$。代回：$5040-4950=90$。</p>`},
{"id":R`n2-p2`,
"lv":R`基础`,
"src":R`自编：讲义 3.2.2–3.2.8`,
"stmt":R`<p>(1) 求 $6x\equiv8\pmod{14}$ 的全部模 14 解。</p><p>(2) 求 $7^{2026}$ 除以 40 的余数。</p>`,
"hints":[R`(1) gcd=2，先把系数、右端、模数同时除以 2。`,
R`$3^{-1}\equiv5\pmod7$，所以 x≡6 (mod 7)。`,
R`(2) $(7,40)=1$，$\varphi(40)=16$；也可先发现 $7^2\equiv9$、$7^4\equiv1$。`],
"method":R`m-nt-congruence`,
"sol":R`<p>(1) 缩成 $3x\equiv4\pmod7$，乘逆元 5 得 $x\equiv20\equiv6\pmod7$。所以模 14 的全部解是 $x\equiv6,13\pmod{14}$，直接代入都成立。</p><p>(2) $\varphi(40)=40(1-1/2)(1-1/5)=16$，$2026\equiv10\pmod{16}$，可算 $7^{10}$。更快地，$7^2=49\equiv9$，$7^4\equiv81\equiv1\pmod{40}$，$2026\equiv2\pmod4$，所以余数为 9。这里缩到 4 来自额外算出的周期，不是把 $\varphi(40)$ 误写成 4。</p>`}],
"variants":[{"id":R`n2-v1`,
"lv":R`变种`,
"src":R`讲义作业 6.4.1`,
"stmt":R`设正整数 $a,b,c$ 满足 $a\mid bc$ 且 $(a,b)=1$。证明 $a\mid c$。若删掉互素条件，结论是否仍成立？`,
"hints":[R`Bezout 给 au+bv=1。`,
R`两边乘 c：c=acu+bcv。`,
R`右侧两项都被 a 整除。反例可取 a=b=2,c=1。`],
"method":R`m-nt-gcd`,
"sol":R`<p>由 Bezout，存在整数 $u,v$ 使 $au+bv=1$。乘以 $c$ 得 $c=acu+bcv$，两项均被 $a$ 整除，所以 $a\mid c$。</p><p>互素条件不能删：$a=b=2,c=1$ 时 $2\mid2$，但 $2\nmid1$。同余式约分时的互素要求来自同一事实。</p>`}],
"extensions":[{"id":R`n2-e1`,
"lv":R`延伸`,
"src":R`讲义作业 6.4.4（特化 n=100）`,
"stmt":R`证明素数 $p$ 在 $n!$ 中的指数为 $v_p(n!)=\sum_{j\ge1}\lfloor n/p^j\rfloor$，并求 $100!$ 末尾连续 0 的个数。`,
"hints":[R`对每个 k，$v_p(k)=\sum_{j\ge1}1_{\{p^j\mid k\}}$。`,
R`对 k=1,…,n 求和并交换有限非零项的求和顺序。`,
R`每个 10 需一个 2 和一个 5；5 更少，算 20+4。`],
"method":R`m-nt-gcd`,
"sol":R`<p>$v_p(n!)=\sum_{k=1}^nv_p(k)=\sum_{k=1}^n\sum_{j\ge1}1_{\{p^j\mid k\}}=\sum_{j\ge1}\lfloor n/p^j\rfloor$。当 $p^j\gt n$ 后各项均为 0，换序没有无穷求和问题。</p><p>$v_5(100!)=20+4=24$；$v_2(100!)=50+25+12+6+3+1=97$。尾零数为二者较小值 24。</p>`}]},
h2: {"unit":R`mst`,
"n":3,
"title":R`完美匹配：交错圈、换边与唯一性`,
"goal":R`补齐 2022 秋期末第 7 题。把“找到第二个匹配”化成“找到交错圈”，再用删去强制配对归纳得到唯一匹配的边数上限。30 分钟主线完成概念、六圈与两问真题。`,
"sections":[{"id":R`h2-s1`,
"h":R`1. 交错圈：沿圈翻转，得到第二个完美匹配`,
"html":R`<p>设 $M$ 为图的一个完美匹配。若简单圈 $C$ 的边在 $M$ 与 $E\setminus M$ 中交替出现，称其为 <b>$M$-交错圈</b>。圈长必为偶数；在圈上删去匹配边，换入原来的非匹配边，得到 $M^{\ast}=M\triangle E(C)$。</p><p>圈外顶点的匹配不动；圈上每点仍恰接一条新匹配边，所以 $M^{\ast}$ 是不同的完美匹配。这里 $\triangle$ 是对称差，表示只保留恰在两个集合之一的元素。</p><p>反过来，两个不同完美匹配 $M,M^{\ast}$ 的对称差中，每点度为 0 或 2，因此非空部分分解成互不相交的偶圈，每个圈都由两种匹配边交替组成。故：<b>$M$ 唯一当且仅当不存在 $M$-交错圈。</b></p>`},
{"id":R`h2-s2`,
"h":R`2. 期末 7(1)：压缩匹配对，再找有向圈`,
"html":R`<p>二部图两侧记 $A=\{a_1,\ldots,a_n\}$、$B=\{b_1,\ldots,b_n\}$，并重编号使 $M=\{a_ib_i\}$。在下标 $[n]$ 上建有向图：若非匹配边 $b_i a_j$ 存在，就画 $i\to j$（$i\ne j$）。</p><p>若原图最小度至少 2，则每个 $b_i$ 除匹配邻点外还有一个邻点，所以有向图每点至少有一条出边。不断沿出边走，在有限顶点集中必遇到重复；取首个重复围出的有向简单圈 $i_1\to\cdots\to i_k\to i_1$。</p><p>展开成 $a_{i_1}b_{i_1}a_{i_2}b_{i_2}\cdots a_{i_k}b_{i_k}a_{i_1}$，匹配与非匹配边交替，且下标不同保证原图顶点也不同。注意不能只说“最小度 2 所以有圈”：普通圈未必相对给定 $M$ 交错。</p>`},
{"id":R`h2-s3`,
"h":R`3. 期末 7(2)：有度 1 就删对，否则翻交错圈`,
"html":R`<p>有完美匹配，所有顶点度至少 1。若没有度 1 的顶点，用上一节找到交错圈后翻转。否则选度 1 的顶点 $v$ 及它在 $M$ 中的伴点 $w$，删掉这对点及所有相接边。</p><p>二部图中 $d(v)=1$、$d(w)\le n$，公共边 $vw$ 只计一次，故至多删 $1+n-1=n$ 条边。若原边数 $E\gt n(n+1)/2$，剩下的 $(n-1)+(n-1)$ 图仍有</p>$$E'\gt\frac{n(n+1)}2-n=\frac{(n-1)n}2.$$
<p>其剩余匹配仍完美，可对规模 $n-1$ 归纳找第二个匹配，再加回 $vw$。这得到<b>唯一完美匹配的二部图至多有 $n(n+1)/2$ 条边</b>；该界能取到，见变种。</p>`}],

"title":R`匹配换边：对称差与交错圈`,
"steps":[R`固定一个完美匹配 M，明确每条圈边属于 M 还是其补集。`,

"title":R`边数迫使第二匹配：度 1 分支归纳`,
"steps":[R`有完美匹配先知最小度≥1；最小度≥2 时用有向压缩构造交错圈。`,

R`核对剩余边数仍超过规模 n−1 的阈值，归纳得到第二匹配后加回强制边。`]}],
"problems":[{"id":R`h2-p1`,
"lv":R`基础`,
"src":R`自编：六圈换边`,
"stmt":R`二部图两侧为 $A=\{a_1,a_2,a_3\}$、$B=\{b_1,b_2,b_3\}$。边为 $a_1b_1,a_2b_2,a_3b_3,a_2b_1,a_3b_2,a_1b_3$。给定 $M=\{a_1b_1,a_2b_2,a_3b_3\}$，找一个交错圈及第二个完美匹配。`,
"hints":[R`从 a₁ 沿匹配边到 b₁，再沿非匹配边到 a₂。`,
R`继续 a₂b₂a₃b₃a₁，形成六圈。`,
R`删三条对角匹配边，换进另外三条。`],
"method":R`m-match-flip`,
"sol":R`<p>交错圈为 $a_1b_1a_2b_2a_3b_3a_1$；沿圈匹配与非匹配边交替。翻转得 $M^{\ast}=\{a_2b_1,a_3b_2,a_1b_3\}$。</p><p>每个 $a_i,b_i$ 都恰出现一次，且所有边在给定边表中，因此确为不同的完美匹配。此图恰为六圈，共有两个完美匹配。</p>`},
{"id":R`h2-p2`,
"lv":R`真题`,
"src":R`2022 秋期末 7(1)(2)（艾颖华试卷）`,
"stmt":R`<p>设 $G=A\cup B$ 为有限简单二部图，$|A|=|B|=n$，$M$ 是它的一个完美匹配。</p><p>(1) 若每点度至少 2，证明有简单圈 $C$，其边在 $M$ 与 $M$ 补集中交替出现。</p><p>(2) 若边数 $E\gt n(n+1)/2$，证明有另一个不同于 $M$ 的完美匹配。原题提示：对 n 归纳，一种情形用 (1)。</p>`,
"hints":[R`(1) 令 M={aᵢbᵢ}，非匹配边 bᵢaⱼ 对应有向边 i→j；每点出度≥1。`,
R`(2) 最小度≥2 就沿 (1) 的圈翻转；否则存在度 1 点。`,
R`删去度 1 点及其匹配伴点，至多删 n 条边，剩余边数仍 > (n−1)n/2。`],
"method":R`m-match-induct`,
"sol":R`<p><b>(1)</b> 重编号使 $M=\{a_ib_i\}$。构造有向图 $D$：$i\to j$ 当且仅当 $b_i a_j\in E\setminus M$。每个 $b_i$ 度至少 2，故 $D$ 每点有出边。沿出边走必出现重复，截出有向简单圈 $i_1\to\cdots\to i_k\to i_1$。展开为 $a_{i_1}b_{i_1}\cdots a_{i_k}b_{i_k}a_{i_1}$ 即得简单交错圈。</p><p><b>(2)</b> 对 n 归纳，n=1 时前提 E>1 不可能，命题成立。设 n≥2。若每点度≥2，沿 (1) 的交错圈翻转得第二匹配。否则，由 M 完美知每点度≥1，可选度 1 点 v，令 w 为其唯一邻点（也是匹配伴点）。删去 v,w 后仍有完美匹配，至多删除 $d(v)+d(w)-1\le n$ 条边，所以剩余边数严格大于 $(n-1)n/2$。由归纳假设得到剩余图的第二个完美匹配，加回 vw 后与原 M 不同。</p><p>严格号不能改成 ≥，阈值处可只有唯一匹配，见变种。</p>`}],
"variants":[{"id":R`h2-v1`,
"lv":R`变种`,
"src":R`自编：真题 7(2) 阈值取等构造`,
"stmt":R`在 $A=\{a_1,\ldots,a_n\}$、$B=\{b_1,\ldots,b_n\}$ 间，规定 $a_i b_j$ 是边当且仅当 $i\le j$。求边数并证明完美匹配唯一。`,
"hints":[R`按 aᵢ 数边，其度为 n−i+1。`,
R`aₙ 只能与 bₙ 匹配；删掉这一对后仍为同形。`,
R`逐次强制匹配得到全部对角边。`],
"method":R`m-match-induct`,
"sol":R`<p>边数为 $n+(n-1)+\cdots+1=n(n+1)/2$。$a_n$ 只有邻点 $b_n$，这条边在每个完美匹配中都必须出现。删去它们后，规模 n−1 的图满足同样规则；归纳可知只能取全部 $a_ib_i$。</p><p>故真题阈值是紧的：等于阈值仍可唯一，超过阈值必不唯一。</p>`}],
"extensions":[{"id":R`h2-e1`,
"lv":R`延伸`,
"src":R`自编：唯一性与无环有向图`,
"stmt":R`对给定完美匹配 $M=\{a_ib_i\}$，仍把非匹配边 $b_i a_j$ 压缩为有向边 $i\to j$。证明 M 唯一当且仅当压缩有向图无有向圈，并据此给出边数上界的另一证明。`,
"hints":[R`有向圈展开成交错圈；反向也能压缩。`,
R`两个不同完美匹配的对称差中必有交错圈。`,
R`无环有向图有拓扑顺序，所有边只能向前，至多 $\binom n2$ 条；再加 n 条匹配边。`],
"method":R`m-match-flip`,
"sol":R`<p>压缩图的有向简单圈与原图的 M-交错圈互相对应。由对称差论证，存在第二个完美匹配当且仅当存在交错圈，因此 M 唯一当且仅当压缩图无有向圈。</p><p>有限无环有向图必有入度 0 点：否则不断逆向追入边得到有向圈。反复删入度 0 点得到拓扑顺序，每条边都从前指向后。每个无序点对至多贡献一条向前边，故非匹配边至多 $\binom n2$ 条，原图总边数至多 $n+\binom n2=n(n+1)/2$。这也解释了上三角构造为何取等。</p>`}]},
g4: {"unit":R`graph`,
"n":4,
"title":R`运输表消圈：保持行列和，减少正项`,
"goal":R`跟进 11 月 17 日下午课堂记录第 17–18 页：把非负运输表画成二部图，在偶圈上交替增减。会证明至多需要 s+t−1 条运输路线；区分“通用上界”与“全局最少”。30 分钟先做概念、算例与证明。`,
"sections":[{"id":R`g4-s1`,
"h":R`1. 从运输表到二部图：正项就是运输路线`,
"html":R`<p>课堂记录第 17 页：$s$ 个发货点 $R_1,\ldots,R_s$、$t$ 个收货点 $C_1,\ldots,C_t$，非负矩阵 $A=(a_{ij})$ 表示运量。行和是各点发货总量，列和是收货总量，调整时都要保持不变。</p><p>作二部图，顶点为全部行点与列点；$a_{ij}\gt0$ 时连边 $R_iC_j$，于是正项数就是边数 $E$。若 $E\ge s+t$，由图论“边数不少于顶点数则有圈”，支撑图中有简单圈。二部图的圈长为偶数，可沿圈交替标记 $+$ 与 $-$。</p><p>课堂的结论是：存在保持行列和的非负表，正项不超过 $s+t-1$。它是通用上界；记录提出的“尽量少”并不表示任意消圈顺序都会得到全局最小路线数，延伸题给反例。</p>`},
{"id":R`g4-s2`,
"h":R`2. 取 ε 为减号边最小运量，至少消去一条路线`,
"html":R`<p>沿一个偶圈交替标 $+$、$-$，取 $\varepsilon=\min\{a_{ij}:R_iC_j\text{ 是圈上的减号边}\}$。因圈上原有边均为正，$\varepsilon\gt0$。加号格加 $\varepsilon$，减号格减 $\varepsilon$，圈外不变。</p><p>圈上每个行点恰有一条加边和一条减边，行和不变；每个列点亦然，列和不变。减号项保持非负，至少一项降到 0；加号位置本来就正，所以不会新增路线。正项数严格减少，可能一次减少多条。</p><p>下方工具显示下一圈的正负标记与 ε；点击消一圈，对照前后行列和。路线数已经不超过 $s+t-1$ 时仍可能有圈，不能反向套用“多边必有圈”。</p>`},
{"id":R`g4-s3`,
"h":R`3. 有限步终止：最后的支撑是森林`,
"html":R`<p>每次正项数至少减 1，原表只有有限个格子，所以反复消圈必在有限步内停下。停下时支撑图无圈，是森林。保留全部 $s+t$ 个行列顶点，若有 $c$ 个连通分支（包括孤立点），则森林满足</p>$$E=(s+t)-c\le s+t-1.$$
<p>其实只要正项数达到 $s+t-1$ 就已完成课堂的上界要求；继续到森林可以得到更清楚的结构。没有给运输成本时，这不是最小费用算法；有单条路线容量上限时，增量还须额外受容量约束，本课只要求非负与行列和固定。</p>`}],

"problems":[{"id":R`g4-p1`,

"src":R`自编：课堂记录第 17–18 页的 2×2 算例`,
"stmt":R`设运输表 $A=\begin{pmatrix}4&1\\2&3\end{pmatrix}$。给 $(1,1),(2,2)$ 标加号，另两格标减号，求 ε 和调整后的表，并核对行列和及正项数。`,

"method":R`m-transport-cycle`,
"sol":R`<p>$\varepsilon=1$，得到 $A^{\ast}=\begin{pmatrix}5&0\\1&4\end{pmatrix}$。新旧行和均为 $(5,5)$，列和均为 $(6,4)$，所有格子非负。</p><p>正项数由 4 降为 3，正好达到 $s+t-1=3$。本例剩余支撑为树；选择相反正负方向也合法，但可能得到另一张表。</p>`},
{"id":R`g4-p2`,
"lv":R`课堂命题`,
"src":R`课堂记录_2026-11-17.pdf 第 17–18 页`,
"stmt":R`证明：任意非负 $s\times t$ 实矩阵（$s,t\ge1$），都可调整成行和、列和不变的非负矩阵，其正项至多 $s+t-1$ 个。`,
"hints":[R`正项对应行列二部图的边；只要正项数 ≥s+t，就有圈。`,
R`二部图圈为偶圈，交替增减，ε 取减号边最小值。`,
R`每步至少消一条正边，有限步达到阈值；或一直消到森林，再用 E=V−c。`],
"method":R`m-transport-cycle`,
"sol":R`<p>保留 $s+t$ 个行列顶点，把正项连成二部支撑图。若正项数至少 $s+t$，图中必有简单圈，且为偶圈。沿圈交替标正负，取减号位置的最小正项为 ε，分别加减 ε。</p><p>每个圈上行点、列点都一加一减，故全部行列和不变；减号格不为负，至少一格归零，其他加号格本来就正，故正项数严格减少。反复操作，每步减少非负整数个数且至少减 1，故有限步达到不超过 $s+t-1$。</p><p>亦可继续到支撑森林：若森林有 c 个分支，E=s+t−c≤s+t−1。全零表一开始已满足结论，孤立行列点不会破坏证明。</p>`}],
"variants":[{"id":R`g4-v1`,
"lv":R`变种`,
"src":R`自编：边数阈值的逆命题`,
"stmt":R`设 $s=t=3$，运输表 $A=\begin{pmatrix}1&1&0\\1&1&0\\0&0&2\end{pmatrix}$。(1) 正项是否已不超过 $s+t-1$？(2) 支撑图是否无圈？(3) 试消一圈，并说明为何正项可一次减少不止 1。`,

"sol":R`<p>(1) 正项为 5，已达到上界。(2) 左上四个正项组成四圈，故仍有圈，不能反推森林。</p><p>(3) 调整后可得 $\begin{pmatrix}2&0&0\\0&2&0\\0&0&2\end{pmatrix}$，行列和均保持 $(2,2,2)$。两条减号边同为最小值 1，因此正项由 5 一次降到 3。原支撑有两个分支（四圈与一条边），新支撑有三个分支。</p>`}],

R`森林有叶子，叶子唯一边的差值只能为 0；删边后继续。`],
"method":R`m-transport-cycle`,
"sol":R`<p>(1) A 的三条支撑边形成树，不能再在现有正边上消圈；但 $B=\begin{pmatrix}3&0\\0&2\end{pmatrix}$ 具有同样的行和、列和 $(3,2)$，正项只有 2 个。故消到森林保证通用上界，未必给全局最少正项数。</p><p>(2) 若 A、B 都支持在指定森林上，令边差为 A−B，则每个顶点相邻差值之和为 0。选叶点，其唯一相邻边的差值必须为 0；删去该边，继续对剩余森林归纳，所有差值均为 0，因此 A=B。这个唯一性只在指定森林支撑内成立，不能扩展到所有可能支撑。</p>`}]},
r1: {"unit":R`practice`,
"n":1,
"title":R`离散混合复盘：选工具与检查条件`,
"goal":R`30 分钟把章节打散：先辨认条件，再用计数、数论、Ramsey 和运输表四条路线。新课堂 R(3,3)=6 放入主线；变种、延伸选做。`,
"sections":[{"id":R`r1-s1`,
"h":R`1. 读题先抓三类信号`,
"html":R`<p>“多少个”先定对象与重数，尝试分类、容斥、递推；“必存在”先找映射、极端对象或概率为正；“保持某些总量”先建图，把总量对应到顶点，再找允许的换边。</p><p>不要在条件未核对前套公式：概率乘法要独立，Euler 缩指数要互素，平面边数界不能反推平面性，普通圈也未必相对给定匹配交错。</p>`},
{"id":R`r1-s2`,
"h":R`2. 新课堂小结：六个人与二染色三角形`,
"html":R`<p>课堂记录第 9–10 页把六个人的相识关系画成 K6 的红蓝边。任选 A，它连出的五条边至少三条同色，例如 AB、AC、AD 都红。若 B、C、D 间有红边，就与 A 构成红三角；否则 BCD 是蓝三角。这给出 R(3,3)≤6。</p><p>反向的五点构造要另外给：把 K5 的一个五圈染红，其余边染蓝，红蓝子图都是五圈，都无三角形。因此 R(3,3)≥6，合起来等于 6。</p>`},
{"id":R`r1-s3`,
"h":R`3. 收尾：先给保证，再问是否最优`,
"html":R`<p>最小生成树有总权最优的证明；运输表消圈只自动保证正项数的上界。上界取到是否必要、算法输出是否唯一、唯一支撑是否意味着全局唯一，这些是不同问题。每次使用结论时把“存在”“每个”“某个”“唯一”读清楚。</p>`}],

"methods":[{"id":R`m-discrete-triage`,
"title":R`混合题分诊：对象、条件、保证`,
"steps":[R`先写对象：排列/子集/随机变量/同余类/图/矩阵，各自的计数单位不能混。`,
R`圈定关键条件：独立、互素、简单、可平面、完美匹配或非负边际。`,
R`说明得到的是上界、构造、存在性还是唯一性；最后检查边界例子与逆命题。`]}],
"problems":[{"id":R`r1-p1`,
"lv":R`基础`,
"src":R`自编：两条路线各一问`,
"stmt":R`<p>(1) 四个元素的错位排序有多少个？若从所有排列均匀抽取，错位概率是多少？</p><p>(2) 同余式 $6x\equiv9\pmod{15}$ 应如何约分？给出全部模 15 解。</p>`,
"hints":[R`(1) 容斥；全集有 4!=24 个排列。`,
R`(2) gcd=3，系数、右端、模数一起除以 3。`,
R`化成 2x≡3 (mod 5)，乘逆元 3。`],
"method":R`m-discrete-triage`,
"sol":R`<p>(1) $d_4=24-24+12-4+1=9$，概率为 $9/24=3/8$。</p><p>(2) $2x\equiv3\pmod5$，得 $x\equiv4\pmod5$。模 15 的全部解为 4、9、14，共 3 个。不能只约掉系数却保持模数 15。</p>`},
{"id":R`r1-p2`,
"lv":R`课堂复盘`,
"src":R`课堂记录_2026-11-17.pdf 第 9–10 页（补下界构造）`,
"stmt":R`证明：任意六个人中，要么有三个人彼此相识，要么有三个人彼此不相识。再给五个人的关系图说明六人不能减为五人。`,
"hints":[R`用 K6 的红蓝染边表达相识/不相识。任选顶点 A。`,
R`A 至少连出三条同色边到 B,C,D，讨论 B,C,D 内是否有同色边。`,
R`五点反例取红色五圈，其余边为蓝色五圈。`],
"method":R`m-count-pigeon`,
"sol":R`<p>把相识边染红，不相识边染蓝。由抽屉原理，A 连出的五条边至少三条同色，不妨 AB、AC、AD 都红。若 B,C,D 中有红边，它与 A 构成红三角；否则三条边全蓝，BCD 是蓝三角。</p><p>在五点上，把一个 C5 的五条边染红，其余五条边染蓝。其补图也是 C5，红蓝都无三角形。因此五个人不够，结论中的六人是最少的。</p>`},
{"id":R`r1-p3`,
"lv":R`综合`,
"src":R`自编：新课堂运输表应用`,
"stmt":R`表 $A=\begin{pmatrix}2&1&1\\1&2&1\end{pmatrix}$ 表示两发货点、三收货点运量。保持行列和，沿左上四圈做一次消圈，把正项降到不超过 4 个。说明上界 4 的图论来源。`,
"hints":[R`左上 2×2 的对角加、非对角减。`,
R`ε=min{1,1}=1，两条减号边同时归零。`,
R`图有 2+3=5 个顶点，支撑森林至多 4 条边。`],
"method":R`m-transport-cycle`,
"sol":R`<p>调整得到 $\begin{pmatrix}3&0&1\\0&3&1\end{pmatrix}$，两张表的行和均为 (4,4)，列和均为 (3,3,2)。正项由 6 降为 4；新支撑是一棵五点四边的树。</p><p>一般正项对应行列二部图的边，若有圈就交替增减，最终得到森林，正项不超过 $2+3-1=4$。这里说明的是保证上界，未声称所有边际问题都恰好需要四条路线。</p>`}],
"variants":[{"id":R`r1-v1`,
"lv":R`变种`,
"src":R`自编：Hall 缺口与最小修复`,
"stmt":R`二部图 A={a1,a2,a3}、B={b1,b2,b3}，邻集分别为 {b1}、{b1}、{b2,b3}。求最大匹配大小，指出 Hall 缺口，并加一条边使其有完美匹配。`,
"hints":[R`S={a1,a2} 的邻集只有 b1。`,
R`所以至多匹配这两点中的一个；可取 a1b1、a3b2。`,
R`加入 a2b3，三点即可全匹配。`],
"method":R`m-hall-deficit`,
"sol":R`<p>S={a1,a2} 有 |N(S)|=1&lt;2，所以无完美匹配且最大匹配至多 2；{a1b1,a3b2} 达到 2。加入 a2b3 后，{a1b1,a2b3,a3b2} 是完美匹配，一条边已足够。零条边不够，故最少增加一条。</p>`}],
"extensions":[{"id":R`r1-e1`,
"lv":R`延伸`,
"src":R`自编：小反例审查错误推理`,
"stmt":R`分别给反例：(1) 两个事件互斥所以独立；(2) 图有偶圈所以任意指定完美匹配都能沿它翻转。`,
"hints":[R`(1) 用一次公平硬币的正面、反面。`,
R`(2) 取一个四圈，再给四圈每个顶点各接一个叶点。`,
R`指定匹配为四条叶边；原四圈不含任何匹配边。`],
"method":R`m-discrete-triage`,
"sol":R`<p>(1) 正面与反面互斥，各概率 1/2，交集概率 0≠1/4，因此不独立。</p><p>(2) 四圈每点接一个叶点，取四条叶边为 M。它覆盖八个顶点，是完美匹配；但原四圈的四条边都不在 M 中，沿圈不能“一删一加”保持每点恰配一次。普通偶圈未必是 M-交错圈。</p>`}]},

"duration":120,
"kind":R`mock`,
"sections":[{"id":R`dmock1-s1`,
"h":R`考试说明：120 分钟，100 分`,
"html":R`<p>本卷为自编模拟，不是往年原卷。六道大题分值为 15、15、20、20、15、15 分。建议用时 15、15、25、25、20、20 分钟；先完成能写出的部分，再回头补证明。计时工具不自动提交或锁住作答。</p><p>未特别说明的图均为有限简单无向图；二部图的两侧是不交顶点集。允许直接使用已学定理，但必须写明适用条件。计算过程、必要性与构造都计分。</p>`},
{"id":R`dmock1-s2`,
"h":R`作答后的复盘原则`,
"html":R`<p>首次模拟先不看提示。结束后逐题记录：建模/条件遗漏、公式或算法错误、计算错误、证明缺口、时间分配。完整解答给的是一种路线，等价且严谨的方法按同样要点给分。</p><p>每题评分点写在解答结尾。缺少论证时按相应步骤扣分；前面算错但后续方法正确，可按一致的错误数据给后续步骤分。最后选两道错题，隔一天只看题面重做。</p>`}],

"problems":[{"id":R`dmock1-p1`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 1 题 · 15 分`,
"stmt":R`<p>(1) 求长度 8 且不含相邻两个 1 的 0/1 串数（6 分）。若从全部长度 8 的串均匀抽取，满足条件的概率是多少（3 分）？</p><p>(2) 对独立公平 0/1 串，记 X 为相邻位置同时为 1 的对数，求 E[X]（6 分）。</p>`,
"hints":[R`按最后一位 0 或后缀 01 分类，初值 a0=1,a1=2。`,
R`数列到 a8=55；概率分母为 2^8。`,
R`共有 7 对相邻位置，每对同时为 1 的概率 1/4，期望线性即可。`],
"method":R`m-count-rec`,
"sol":R`<p>(1) aₙ=aₙ₋₁+aₙ₋₂，a₀=1,a₁=2，依次得 1,2,3,5,8,13,21,34,55，故串数 55，概率 55/256。</p><p>(2) 令 Iᵢ 表示位置 i,i+1 同为 1，则 X=ΣIᵢ，E[X]=7/4。相邻指示变量不独立，期望线性仍可用。</p><p>评分：分类递推与初值 4，算出 55 为 2；概率 3；定义指示变量 2，概率 1/4 为 2，相加得 7/4 为 2。</p>`,
"points":15},
{"id":R`dmock1-p2`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 2 题 · 15 分`,
"stmt":R`<p>(1) 求 $18x\equiv30\pmod{42}$ 的全部模 42 解（8 分）。</p><p>(2) 求 $\varphi(84)$ 与 $5^{2026}$ 除以 84 的余数（7 分）。</p>`,
"hints":[R`(1) gcd(18,42)=6，先缩成 3x≡5 (mod 7)。`,
R`3 的逆元为 5，x≡4 (mod 7)。`,
R`(2) φ(84)=24；重复平方可发现 5³≡41、5⁶≡1。`],
"method":R`m-nt-congruence`,
"sol":R`<p>(1) x≡4 (mod 7)，所以模 42 的全部解是 4、11、18、25、32、39，共 6 个。</p><p>(2) $\varphi(84)=84(1-1/2)(1-1/3)(1-1/7)=24$。又 $5^3\equiv41$，$5^6\equiv1\pmod{84}$，2026≡4 (mod 6)，所以余数 $5^4\equiv37$。</p><p>评分：(1) gcd 与可解性 2，缩模求解 3，列全六解 3；(2) φ 为 3，幂的合法化简与余数为 4。</p>`,
"points":15},
{"id":R`dmock1-p3`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 3 题 · 20 分`,
"stmt":R`<p>(1) [7] 上度数依次为 (3,2,2,1,1,1,2) 的标号树有多少棵（8 分）？</p><p>(2) 加权图边表为 AB:1，AC:4，BC:2，BD:5，CD:1，CE:3，DE:2，BE:6。求一棵 MST、总权，并证明唯一（12 分）。</p>`,
"hints":[R`(1) Prüfer 序列长度 5，各顶点出现次数为度减 1。`,
R`(2) Kruskal 选 AB、CD、BC、DE。`,
R`对每条非树边，把它与树上两端道路最大权比较，全部应严格大于。`],
"method":R`m-treecount`,
"sol":R`<p>(1) 出现次数为 (2,1,1,0,0,0,1)，共 $5!/2!=60$ 棵。</p><p>(2) T={AB,CD,BC,DE}，总权 1+1+2+2=6。非树边 AC、BD、CE、BE 的树上道路最大权均为 2，对应权 4、5、3、6 都严格更大，故换入任一非树边都会增权，T 为唯一 MST。</p><p>评分：度与编码重数对应 4，计数 4；正确四边 4，总权 2，逐条唯一性比较及结论 6。</p>`,
"points":20},
{"id":R`dmock1-p4`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 4 题 · 20 分`,
"stmt":R`<p>(1) A={a1,a2,a3,a4}，B={b1,b2,b3,b4}，各行邻集为 {b1,b2}、{b1,b2}、{b2,b3,b4}、{b3,b4}。给一个完美匹配及一个交错圈，翻转得到第二匹配（8 分）。</p><p>(2) 证明任意 4+4 简单二部图若有一个完美匹配且有 11 条边，该匹配不唯一；并给有 10 条边但匹配唯一的构造（12 分）。</p>`,
"hints":[R`(1) 对角匹配可用，前两行前两列形成四圈。`,
R`(2) 唯一匹配二部图的边数上界 n(n+1)/2，此处为 10；说明该上界的理由。`,
R`取 aᵢbⱼ 当且仅当 i≤j，逐次强制度 1 顶点的配对。`],
"method":R`m-match-induct`,
"sol":R`<p>(1) 取 M={a1b1,a2b2,a3b3,a4b4}。四圈 a1b1a2b2a1 相对 M 交错，翻转得 {a1b2,a2b1,a3b3,a4b4}。</p><p>(2) 对给定匹配 aᵢbᵢ，压缩非匹配边 bᵢaⱼ 为 i→j。若匹配唯一，压缩图不能有有向圈，否则展开交错圈后可翻转。无环有向图的拓扑顺序只允许向前边，至多 C(4,2)=6 条非匹配边，加 4 条匹配边至多 10，故 11 条必不唯一。上三角构造 i≤j 有 4+3+2+1=10 条边，a4b4 强制，递归可知只可能对角匹配。</p><p>评分：匹配与四圈、翻转各 4；上界论证 8，取等构造及唯一性 4。</p>`,
"points":20},
{"id":R`dmock1-p5`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 5 题 · 15 分`,
"stmt":R`<p>G 是 10 顶点的无三角形简单平面图，且连通。</p><p>(1) 求边数上界；若取等，面数及每个面的边界长度是多少（7 分）？</p><p>(2) 不引用更强染色定理，证明 G 可用 4 色染色（8 分）。</p>`,
"hints":[R`(1) 每个面边界长度至少 4，计重桥的两侧，4f≤2e，再用 Euler。`,
R`取等 e=16、f=8，所有面长度必须为 4。`,
R`(2) 任意子图仍无三角且平面；顶点数≥3 时平均度 <4，因此可删度≤3的点再归纳。`],
"method":R`m-planar-count`,
"sol":R`<p>(1) e≤2v−4=16。取等时 f=2−10+16=8，且 4f=2e，故每面边界长度均为 4（按边界游走计重）。</p><p>(2) 任意非空子图 H 若有至少 3 点，满足 e(H)≤2v(H)−4，平均度 <4，故存在度≤3的顶点；一两点时同样成立。不断删这样的点，逆序染回，每点至多已有 3 个染色邻点，所以 4 色足够。</p><p>评分：边数界推导 4，取等面数及面长 3；对子图使用条件 3，低度点 2，删点逆序染色 3。</p>`,
"points":15},
{"id":R`dmock1-p6`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 6 题 · 15 分`,
"stmt":R`简单图 G 有 9 个顶点、18 条边。证明 G 有 4-圈，并进一步证明至少有 9 个不同的 4-圈（按边集区分，不要求诱导）。`,
"hints":[R`角数 S=ΣC(dᵢ,2)≥2E²/n−E=54。`,
R`设 c(u,v) 为两点的公共邻点数，有 S=Σc(u,v)，点对共 36 对。`,
R`四圈数为 (1/2)ΣC(c(u,v),2)，每圈由两组对角点各计一次；对整数 c≥0，有 C(c,2)≥c−1。`],
"method":R`m-angle-bound`,
"sol":R`<p>握手与 Cauchy 给 S≥2·18²/9−18=54。无 4-圈则每对至多一个公共邻点，S≤C(9,2)=36，矛盾。</p><p>更精确地，任一公共邻点对与支点对组成一个四圈，而每个四圈有两组对角点，故 $N_4=\frac12\sum_{\{u,v\}}\binom{c(u,v)}2$。因 $\binom c2\ge c-1$ 对非负整数 c 成立，$N_4\ge\frac12(S-36)\ge9$。</p><p>评分：角数下界 4，存在性矛盾 3，四圈计数且除以 2 为 5，最后整数不等式与结论 3。</p>`,
"points":15}],
"variants":[],
"extensions":[]},

"problems":[{"id":R`dmock2-p1`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 2 · 第 1 题 · 15 分`,
"stmt":R`<p>从 [6] 到 [3] 均匀随机选一个映射。</p><p>(1) 满射有多少个，满射概率是多少（8 分）？若不区分三个非空原像组的标号，分组数是多少（3 分）？</p><p>(2) 求未被命中的值的个数期望，并据此给出不是满射的概率上界（4 分）。</p>`,
"hints":[R`坏事件为某个指定值未被命中，容斥求满射。`,
R`3⁶−3·2⁶+3=540；无标号非空组可除以3!。`,
R`每个值未命中概率(2/3)⁶，用三个指示变量相加。`],
"method":R`m-count-ie`,
"sol":R`<p>(1) 满射数 $3^6-3\cdot2^6+3=540$，概率 540/729=20/27。无标号分组数 540/3!=90，每种分组有恰好六种编号。</p><p>(2) 设空值数为 Z，则 E[Z]=3(2/3)⁶=64/243。由 Markov，P(Z≥1)≤64/243；真实概率是 1−20/27=7/27，稍小于该上界。</p><p>评分：容斥及计算 5，概率 3；除以 3! 与理由 3；指示变量期望 2，概率上界 2。</p>`,
"points":15},
{"id":R`dmock2-p2`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 2 · 第 2 题 · 15 分`,
"stmt":R`<p>(1) 求 $x\equiv4\pmod9$、$x\equiv7\pmod{12}$ 的全部整数解（8 分）。</p><p>(2) 用扩展 Euclid 求 28 在模 45 下的逆元，不能只猜结果（7 分）。</p>`,
"hints":[R`(1) 模数不互素，先检查差 7−4 被 gcd(9,12)=3 整除。`,
R`写 x=4+9k，得到 3k≡1 (mod 4)。`,
R`(2) 回代可得 1=5·45−8·28。`],
"method":R`m-crt-merge`,
"sol":R`<p>(1) 9k≡3 (mod 12)，同时除以 3 得 3k≡1 (mod 4)，故 k≡3 (mod 4)，所以 x≡31 (mod 36)。代回两式均成立，周期为 lcm(9,12)=36。</p><p>(2) 45=28+17，28=17+11，17=11+6，11=6+5，6=5+1。回代得 1=5·45−8·28，所以逆元为 −8≡37 (mod 45)，28·37=1036≡1。</p><p>评分：相容性与代入 2，缩模解 4，完整周期 2；相除链 3，回代 3，逆元规范化 1。</p>`,
"points":15},
{"id":R`dmock2-p3`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 2 · 第 3 题 · 20 分`,
"stmt":R`<p>(1) [6] 上恰有三个叶子的标号树有多少棵（10 分）？</p><p>(2) K4 的四条外围圈边权均为 1，两条对角线边权均为 2。求 MST 总权及不同 MST 的数目，并解释“有并列边权就不唯一”是否普遍成立（10 分）。</p>`,
"hints":[R`(1) 叶子是未出现在长度4的Prüfer序列中的标号；恰有三个不同标号出现。`,
R`先选三个非叶标号，再数长度4到这三个标号的满射。`,
R`(2) 仅用外围圈的三条边可得权3；任何含对角线的树权至少4。`],
"method":R`m-treecount`,
"sol":R`<p>(1) 选非叶标号 C(6,3)=20 种，序列使用三种标号且每种至少一次，共 3⁴−3·2⁴+3=36 种，所以总数 720。</p><p>(2) 最小总权为 3，MST 恰是四圈删掉一条边，故有 4 棵。并列权不普遍意味着不唯一：三角形权 1、1、2 时只有同时取两条权 1 边才最小，MST 唯一。</p><p>评分：叶与序列对应 4，满射计数 4，总数 2；总权与排除对角线 4，四棵计数 3，反例 3。</p>`,
"points":20},
{"id":R`dmock2-p4`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 2 · 第 4 题 · 20 分`,
"stmt":R`<p>A={a1,…,a5}、B={b1,…,b5}，边 aᵢbⱼ 当且仅当 j≤i。</p><p>(1) 求边数并证明完美匹配唯一（8 分）。</p><p>(2) 添加边 a1b5 后，写出相对原匹配的交错圈及第二个完美匹配（8 分），并用唯一匹配边数界复核（4 分）。</p>`,
"hints":[R`a1 只可匹配 b1，删去后二部图仍是同型。`,
R`新边与 b1a2、b2a3、b3a4、b4a5 连成十圈。`,
R`新图16条边，超过5·6/2=15。`],
"method":R`m-match-flip`,
"sol":R`<p>(1) 边数 1+2+3+4+5=15。a1b1 在每个完美匹配中强制出现，删去这一对后继续，故只能取全部对角边。</p><p>(2) 交错圈为 a1b1a2b2a3b3a4b4a5b5a1。翻转得到 {a1b5,a2b1,a3b2,a4b3,a5b4}，所有边均存在，且覆盖全部十点。新边数为 16>15，由唯一完美匹配二部图的边数界也知必有第二个匹配。</p><p>评分：边数 3，强制匹配归纳 5；交错圈 4，第二匹配 4；边数阈值及严格号 4。</p>`,
"points":20},
{"id":R`dmock2-p5`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 2 · 第 5 题 · 15 分`,
"stmt":R`<p>某简单平面图的一个嵌入有 12 个顶点、14 条边、3 个连通分支。</p><p>(1) 求面数，含外部面（5 分）。</p><p>(2) 分别说明删去一条桥、删去一条圈边时，面数如何变化（5 分）。</p><p>(3) 不引用四色定理，证明任意简单平面图都可用 6 色染色（5 分）。</p>`,
"hints":[R`(1) v−e+f=1+c。`,
R`(2) 删桥后 c 增1，删圈边后 c 不变；顶点保留。`,
R`(3) 任意子图仍平面且有度≤5的点，删点归纳再染回。`],
"method":R`m-planar-count`,
"sol":R`<p>(1) f=1+3−12+14=6。(2) 删桥后 e减1、c增1，f仍为6；删圈边后 e减1、c不变，f变5。</p><p>(3) 至少三点的简单平面图满足平均度≤6−12/v<6，存在度≤5点；一两点也成立。此条件对每个子图均适用，递归删低度点后逆序染回，每点至多禁用5种颜色，故6色足够。</p><p>评分：一般Euler公式及面数5；两类删边各2.5；子图低度点与逆序染色合5。</p>`,
"points":15},
{"id":R`dmock2-p6`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 2 · 第 6 题 · 15 分`,
"stmt":R`设 10 元集 X 的若干个三元子集 Y1,…,Yb 满足：每对不同元素恰好同属两个 Yi。允许区组按编号区分。证明每个元素出现次数相同，并求这个次数及 b。`,
"hints":[R`固定 x，数配对 (x′,i)，要求 x′≠x 且 x,x′ 同在 Yi。`,
R`按 x′ 数为2·9，按含 x 的区组数为2rₓ。`,
R`再数 (元素,区组) 关联，3b=10r。`],
"method":R`m-double-count`,
"sol":R`<p>固定 x，设 rₓ 个区组含 x。关联集合 (x′,i) 按 x′ 数共有 9·2=18 个，按含 x 的区组数每组贡献 2 个，因此 2rₓ=18，rₓ=9，与 x 无关。</p><p>再数所有 (x,i) 且 x∈Yi 的关联，按元素数为10·9，按区组数为3b，所以 b=30。这是由给定条件导出的必要计数，没有据整除条件单独断言任意参数都能构造设计。</p><p>评分：固定元素的对象定义3，两种计数及 r=9 为7，关联总计及 b=30 为5。</p>`,
"points":15}],
"variants":[],
"extensions":[]},

"problems":[{"id":R`dmock3-p1`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 3 · 第 1 题 · 15 分`,
"stmt":R`<p>X1、X2、X3 独立且均匀取 {0,1,2,3,4}，记 S=X1+X2+X3。</p><p>(1) 求 P(S=10)（8 分）。</p><p>(2) 求 E[S]、Var(S)，并用 Chebyshev 给出 P(S≥10) 的上界（7 分）。</p>`,
"hints":[R`(1) 先数非负解 x1+x2+x3=10，再容斥排除某项≥5。`,
R`C(12,2)−3C(7,2)+3C(2,2)=6；总等可能样本125个。`,
R`(2) 单次均值2、方差2，和均值6、方差6；S≥10蕴含|S−6|≥4。`],
"method":R`m-prob-tail`,
"sol":R`<p>(1) 合法整数解共66−63+3=6，故概率6/125。也可列为(4,4,2)的三种排列和(4,3,3)的三种排列。</p><p>(2) E[Xi]=2，E[Xi²]=6，故Var(Xi)=2。独立性给E[S]=6、Var(S)=6。P(S≥10)≤P(|S−6|≥4)≤6/16=3/8。该界不要求精确分布求和，真实概率还可更小。</p><p>评分：容斥建模与计数6，概率2；均值方差4，事件包含及概率界3。</p>`,
"points":15},
{"id":R`dmock3-p2`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 3 · 第 2 题 · 15 分`,
"stmt":R`<p>(1) 求 $x^2\equiv1\pmod{15}$ 的全部模 15 解（7 分）。</p><p>(2) 推广证明：若 p、q 是不同奇素数，则 $x^2\equiv1\pmod{pq}$ 恰有四个模 pq 解（8 分）。</p>`,
"hints":[R`分别模3和模5，每边都有±1两种根。`,
R`四种符号组合用 CRT 合并，模15得1、4、11、14。`,
R`对任意奇素数，p|(x−1)(x+1)给x≡±1；两个根不同，CRT保证四种组合互异。`],
"method":R`m-crt`,
"sol":R`<p>(1) 模3为±1、模5为±1，CRT的四种组合给 x≡1、4、11、14 (mod15)，直接平方均余1。</p><p>(2) 素数整除乘积必整除其中一因子，所以模p只能为±1，因p为奇数二者不同；模q同理。p、q互素，每个二元符号组合由CRT对应唯一模pq剩余类，四种组合不同，故恰有四解。奇素数条件不能直接略去。</p><p>评分：分模根与列全解7；素数因子推理3，奇数根互异2，CRT唯一且恰四解3。</p>`,
"points":15},
{"id":R`dmock3-p3`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 3 · 第 3 题 · 20 分`,
"stmt":R`<p>(1) [8] 上包含指定边 {1,2} 的标号树有多少棵？请用对称性与双计数推导，不直接引用指定边计数公式（10 分）。</p><p>(2) 五点图由五圈全部边（每条权2）及三条弦 AC、BD、CE（每条权3）组成。求 MST 总权及不同 MST 的数目（10 分）。</p>`,

"src":R`课堂记录_2026-11-17.pdf 第 7–9 页`,

"hints":[R`(1) 若 gcd=d>1，(x/d,y/d) 是中间整点。若 gcd=1，用 Bezout 处理任何中间点 λ(x,y)。`,
R`(2) 给每个位置 (i,j) 分配不同素数 pᵢⱼ；要求 X+i 与 Y+j 同时被 pᵢⱼ 整除。`,
R`对 X 解全部 X≡−i (mod pᵢⱼ)，对 Y 解全部 Y≡−j (mod pᵢⱼ)；所有模数两两互素，CRT 保证解存在，再加公倍数使 X,Y 为正。`],
