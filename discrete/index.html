    })).join("");
    $("#hall-graph", mount).innerHTML = `<svg viewBox="0 0 580 290" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="Hall 二部图；左侧集合与右侧邻点的完整计数见下方">${lines}${dots}</svg>`;
    const names = (xs, prefix) => xs.length ? `{${xs.map(i => prefix + (i + 1)).join(", ")}}` : "空集";
    $("#hall-out", mount).innerHTML = `<span>S = ${names(S, "a")}，N(S) = ${names([...N].sort(), "b")}</span><span>|S| = ${S.length}，|N(S)| = ${N.size}；此子集${good ? "满足条件（还不能据此断言全部满足）" : `违反 Hall，缺口为 ${S.length - N.size}` }。</span><span>全图最大匹配 ${pairs.length} 条${pairs.length === 4 ? "，可覆盖全部顶点。" : `，至少 ${4 - pairs.length} 个左点无法匹配。`}${show.checked ? " 所示匹配：" + pairs.map(([i, j]) => `a${i + 1}–b${j + 1}`).join("，") : ""}</span>${note ? `<span>${note}</span>` : ""}`;
  }
  $("#hall-find", mount).addEventListener("click", () => {
    let worst = [], deficit = 0;
    for (let mask = 0; mask < 16; mask++) {
      const S = [0, 1, 2, 3].filter(i => mask & (1 << i)), d = S.length - neighbors(S).size;
      if (d > deficit) { deficit = d; worst = S; }
    }
    note = deficit ? `已检查 16 个子集，最大缺口 ${deficit}，上图已选出一个坏子集。` : "已检查全部 16 个子集，都满足 Hall 条件；存在完美匹配。";
    if (deficit) checks.forEach((c, i) => { c.checked = worst.includes(i); });
    draw();
  });
  mode.addEventListener("change", () => { note = ""; show.checked = false; draw(); });
  checks.forEach(c => c.addEventListener("change", () => { note = ""; draw(); }));
  show.addEventListener("change", draw);
  draw();
}


/* ================= 交互工具：平面图删边与数面 ================= */
function planarPlay(mount) {
  const points = { A: [65, 245], B: [535, 245], C: [300, 35], D: [300, 165] };
  const edges = ["AB", "AC", "AD", "BC", "BD", "CD"];
  const presets = { full: edges, tree: ["AB", "AC", "AD"], split: ["AB"], empty: [] };
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="plane-preset">图形 <select id="plane-preset"><option value="full">完整 K4</option><option value="tree">一棵树</option><option value="split">一条边与两个孤立点</option><option value="empty">四个孤立点</option><option value="custom">自选边</option></select></label></div>
    <div class="ctrl" id="plane-edges">保留边：${edges.map(e => `<label><input type="checkbox" value="${e}" checked> ${e}</label>`).join("")}</div>
    <div id="plane-graph"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>在圈上的边</span><span><i style="background:var(--teal)"></i>桥</span></div>
    <div class="readout" id="plane-count"></div>
    <div class="ctrl"><label for="plane-answer">面数（含外部面） <input id="plane-answer" type="number" min="1" max="4" step="1" style="width:4em"></label><button class="btn" id="plane-check" type="button">核对面数</button></div>
    <div class="readout" id="plane-result" aria-live="polite"></div>
    <p class="small muted">四个顶点始终保留。删去圈边会合并两个面；删去桥会增加分支，面数不变。无界区域也算一个面。</p>
  </div>`;
  const mode = $("#plane-preset", mount), checks = [...mount.querySelectorAll("#plane-edges input")], answer = $("#plane-answer", mount);
  function components(es) {
    const parent = { A: "A", B: "B", C: "C", D: "D" };
    function root(x) { while (x !== parent[x]) x = parent[x]; return x; }
    for (const e of es) parent[root(e[0])] = root(e[1]);
    return new Set(Object.keys(points).map(root)).size;
  }
  function selected() { return checks.filter(c => c.checked).map(c => c.value); }
  function draw() {
    const es = selected(), c = components(es);
    const lines = es.map(e => {
      const [x1, y1] = points[e[0]], [x2, y2] = points[e[1]], bridge = components(es.filter(f => f !== e)) > c;
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(${bridge ? "--teal" : "--accent"});stroke-width:3"/>`;
    }).join("");
    const nodes = Object.entries(points).map(([v, [x, y]]) => `<g><circle cx="${x}" cy="${y}" r="17" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.5"/><text x="${x}" y="${y + 5}" text-anchor="middle" style="fill:var(--ink);font:600 15px var(--f-mono)">${v}</text></g>`).join("");
    $("#plane-graph", mount).innerHTML = `<svg viewBox="0 0 600 285" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="四个顶点的无交叉平面嵌入，当前有 ${es.length} 条边、${c} 个分支；青色是桥">${lines}${nodes}</svg>`;
    $("#plane-count", mount).innerHTML = `<span>v = 4，e = ${es.length}，c = ${c}。</span><span>先数图中有界区域，再加上外部面；非连通时使用 v−e+f = 1+c。</span>`;
    answer.value = "";
    $("#plane-result", mount).textContent = "";
  }
  checks.forEach(c => c.addEventListener("change", () => { mode.value = "custom"; draw(); }));
  mode.addEventListener("change", () => {
    if (presets[mode.value]) checks.forEach(c => { c.checked = presets[mode.value].includes(c.value); });
    draw();
  });
  answer.addEventListener("input", () => { $("#plane-result", mount).textContent = ""; });
  $("#plane-check", mount).addEventListener("click", () => {
    const es = selected(), c = components(es), f = 1 + c - 4 + es.length, guess = Number(answer.value);
    $("#plane-result", mount).textContent = !answer.value || !Number.isInteger(guess) || guess < 1 ? "先输入一个正整数面数，再核对。" : `${guess === f ? "正确。" : "再数一次："}面数 f = 1+${c}−4+${es.length} = ${f}（含外部面）；4−${es.length}+${f} = ${1 + c} = 1+c。`;
  });
  draw();
}


/* ================= 交互工具：角的双计数与无 4-圈 ================= */
function anglePlay(mount) {
  const ring = (n, r, cx, cy, start) => Array.from({ length: n }, (_, i) => [cx + r * Math.cos(start + 2 * Math.PI * i / n), cy + r * Math.sin(start + 2 * Math.PI * i / n)]);
  const top = -Math.PI / 2;
  const presets = {
    bowtie: { label: "蝴蝶图（5 点 6 边）", pos: [[300, 150], [170, 60], [170, 240], [430, 60], [430, 240]], edges: [[0, 1], [0, 2], [1, 2], [0, 3], [0, 4], [3, 4]] },
    petersen: { label: "Petersen 图（10 点 3-正则）", pos: ring(5, 130, 300, 155, top).concat(ring(5, 62, 300, 155, top)), edges: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 0], [0, 5], [1, 6], [2, 7], [3, 8], [4, 9], [5, 7], [7, 9], [9, 6], [6, 8], [8, 5]] },
    cube: { label: "立方体图（8 点，有 4-圈）", pos: [[150, 60], [330, 60], [330, 240], [150, 240], [230, 120], [450, 120], [450, 280], [230, 280]].map(([x, y]) => [x, y - 15]), edges: [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]] },
    c5: { label: "五边形 C5", pos: ring(5, 120, 300, 155, top), edges: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 0]] },
    k4: { label: "完全图 K4", pos: ring(4, 115, 300, 150, top), edges: [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]] },
    empty: { label: "6 个孤立点（自己连边）", pos: ring(6, 120, 300, 150, top), edges: [] }
  };
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="ang-preset">例图 <select id="ang-preset">${Object.entries(presets).map(([k, p]) => `<option value="${k}">${p.label}</option>`).join("")}</select></label><button class="btn" id="ang-clear" type="button">清空边</button></div>
    <div id="ang-graph"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>已选中的顶点</span><span><i style="background:var(--bad)"></i>找到的一个 4-圈</span></div>
    <div class="readout" id="ang-out" aria-live="polite"></div>
    <div class="table-wrap" id="ang-table"></div>
    <p class="small muted">先点一个顶点，再点另一个顶点：两点之间没有边就加上，有边就删掉。表格只列公共邻点数至少 2 的点对（它们就是 4-圈的“对角”）。</p>
  </div>`;
  const sel = $("#ang-preset", mount);
  let pos = [], edges = new Set(), picked = -1;
  const key = (a, b) => a < b ? a + "-" + b : b + "-" + a;
  function load() {
    const p = presets[sel.value];
    pos = p.pos; edges = new Set(p.edges.map(([a, b]) => key(a, b))); picked = -1; draw();
  }
  function draw() {
    const n = pos.length, adj = Array.from({ length: n }, () => new Set());
    for (const k of edges) { const [a, b] = k.split("-").map(Number); adj[a].add(b); adj[b].add(a); }
    const deg = adj.map(s => s.size), E = edges.size;
    const S = deg.reduce((t, d) => t + d * (d - 1) / 2, 0);
    let S2 = 0, bad = [], cycle = null;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const common = [...adj[i]].filter(x => adj[j].has(x));
      S2 += common.length;
      if (common.length >= 2) { bad.push([i, j, common]); if (!cycle) cycle = [i, common[0], j, common[1]]; }
    }
    const onCycle = new Set();
    if (cycle) for (let t = 0; t < 4; t++) onCycle.add(key(cycle[t], cycle[(t + 1) % 4]));
    const lines = [...edges].map(k => {
      const [a, b] = k.split("-").map(Number), hit = onCycle.has(k);
      return `<line x1="${pos[a][0].toFixed(1)}" y1="${pos[a][1].toFixed(1)}" x2="${pos[b][0].toFixed(1)}" y2="${pos[b][1].toFixed(1)}" style="stroke:var(${hit ? "--bad" : "--muted"});stroke-width:${hit ? 4 : 2.2}"/>`;
    }).join("");
    const dots = pos.map(([x, y], i) => `<g data-v="${i}" role="button" tabindex="0" aria-label="顶点 ${i + 1}，度 ${deg[i]}" style="cursor:pointer"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="22" style="fill:var(${i === picked ? "--accent" : "--surface"});stroke:var(--ink);stroke-width:1.5"/><text x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="middle" style="fill:var(${i === picked ? "--accent-ink" : "--ink"});font:600 14px var(--f-mono);pointer-events:none">${i + 1}</text></g>`).join("");
    $("#ang-graph", mount).innerHTML = `<svg viewBox="0 0 600 310" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="${n} 个顶点、${E} 条边的图${cycle ? "，红色标出一个 4-圈" : "，没有 4-圈"}">${lines}${dots}</svg>`;
    const low = 2 * E * E / n - E, pairs = n * (n - 1) / 2, bound = n * (1 + Math.sqrt(4 * n - 3)) / 4;
    $("#ang-out", mount).innerHTML = `<span>n = ${n}，E = ${E}，度数 (${deg.join(", ")})</span>`
      + `<span>按顶点数：S = Σ C(dᵢ,2) = <b>${S}</b>；按支点对数：Σ c(B,C) = <b>${S2}</b>${S === S2 ? "，两种数法一致" : ""}。</span>`
      + `<span>下界 2E²/n − E = ${low.toFixed(2)} ≤ S${Math.abs(low - S) < 1e-9 ? "（取等：正则图）" : ""}。</span>`
      + (cycle ? `<span>有 4-圈：${cycle.map(v => v + 1).join("–")}–${cycle[0] + 1}；共有 ${bad.length} 个点对的公共邻点数 ≥ 2，所以上界 S ≤ C(n,2) 不再适用。</span>`
        : `<span>无 4-圈：每对至多 1 个公共邻点，S = ${S} ≤ C(n,2) = ${pairs}；边数 E = ${E} ≤ n(1+√(4n−3))/4 = ${bound.toFixed(2)}。</span>`)
      + (picked >= 0 ? `<span>已选顶点 ${picked + 1}，再点另一个顶点加边或删边。</span>` : "");
    $("#ang-table", mount).innerHTML = bad.length ? `<table><thead><tr><th>点对 {B, C}</th><th>公共邻点</th><th>c(B,C)</th></tr></thead><tbody>${bad.slice(0, 12).map(([i, j, c]) => `<tr><td>{${i + 1}, ${j + 1}}</td><td>${c.map(v => v + 1).join(", ")}</td><td class="mono">${c.length}</td></tr>`).join("")}</tbody></table>${bad.length > 12 ? `<p class="small muted">另有 ${bad.length - 12} 对未列出。</p>` : ""}` : "";
  }
  function pick(v) {
    if (picked < 0) picked = v;
    else if (picked === v) picked = -1;
    else { const k = key(picked, v); if (edges.has(k)) edges.delete(k); else edges.add(k); picked = -1; }
    draw();
  }
  const graph = $("#ang-graph", mount);
  graph.addEventListener("click", ev => { const g = ev.target.closest("[data-v]"); if (g) pick(+g.dataset.v); });
  graph.addEventListener("keydown", ev => { const g = ev.target.closest("[data-v]"); if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); pick(+g.dataset.v); } });
  sel.addEventListener("change", load);
  $("#ang-clear", mount).addEventListener("click", () => { edges = new Set(); picked = -1; draw(); });
  load();
}


/* ================= 交互工具：计数公式与穷举 ================= */
function countPlay(mount) {
  mount.innerHTML = `<div class="widget"><div class="ctrl"><label for="cnt-mode">对象 <select id="cnt-mode"><option value="derange">错位排序</option><option value="subsets">不含相邻元素的子集</option><option value="onto">到三个标号盒的满射</option></select></label><label for="cnt-n">规模 n <input id="cnt-n" type="range" min="0" max="8" step="1" value="5"></label><output id="cnt-size" for="cnt-n"></output></div><div class="readout" id="cnt-out" aria-live="polite"></div><div class="table-wrap" id="cnt-table"></div><p class="small muted" id="cnt-note"></p><p class="small" id="cnt-list" style="overflow-wrap:anywhere"></p></div>`;
  const mode = $("#cnt-mode", mount), slider = $("#cnt-n", mount);
  const fact = n => { let a = 1; for (let i = 2; i <= n; i++) a *= i; return a; };
  const choose = (n, k) => fact(n) / fact(k) / fact(n - k);
  function update() {
    const n = +slider.value, kind = mode.value;
    $("#cnt-size", mount).textContent = n;
    let count = 0, samples = [], rows = [], answer = 0, expression = "", note = "";
    const record = text => { count++; if (samples.length < 12) samples.push(text); };
    if (kind === "derange") {
      // 穷举全部排列；固定点检验与容斥公式分别计算。
      function visit(a, used) {
        if (a.length === n) { if (a.every((v, i) => v !== i + 1)) record(a.length ? "(" + a.join(",") + ")" : "空排列"); return; }
        for (let v = 1; v <= n; v++) if (!(used & (1 << (v - 1)))) visit(a.concat(v), used | (1 << (v - 1)));
      }
      visit([], 0);
      for (let k = 0; k <= n; k++) {
        const term = (k % 2 ? -1 : 1) * choose(n, k) * fact(n - k);
        answer += term; rows.push([k, choose(n, k), fact(n - k), term]);
      }
      expression = "错位排序：容斥交替和";
      rows = [["固定位置数 k", "选位置", "剩余排列", "带符号贡献"], ...rows];
      note = "交集只固定指定位置，其余允许固定；n=0 时空排列一种。";
    } else if (kind === "subsets") {
      for (let bits = 0; bits < 2 ** n; bits++) if (!(bits & (bits << 1))) {
        const a = Array.from({ length: n }, (_, i) => i + 1).filter(i => bits & (1 << (i - 1)));
        record(a.length ? "{" + a.join(",") + "}" : "∅");
      }
      const a = [1, 2]; for (let i = 2; i <= n; i++) a[i] = a[i - 1] + a[i - 2];
      answer = a[n]; expression = "不含相邻元素：递推与位掩码枚举";
      rows = [["规模", "不取末位", "取末位", "总数"]];
      for (let i = 0; i <= n; i++) rows.push([i, i >= 2 ? a[i - 1] : "初值", i >= 2 ? a[i - 2] : "初值", a[i]]);
      note = "编号排成路径，首尾不相邻；空集计入，a₀=1、a₁=2。";
    } else {
      for (let code = 0; code < 3 ** n; code++) {
        let c = code, seen = 0, a = [];
        for (let i = 0; i < n; i++) { const v = c % 3; c = Math.floor(c / 3); seen |= 1 << v; a.push(v + 1); }
        if (seen === 7) record("(" + a.join(",") + ")");
      }
      for (let k = 0; k <= 3; k++) {
        const power = (3 - k) ** n, term = (k % 2 ? -1 : 1) * choose(3, k) * power;
        answer += term; rows.push([k, choose(3, k), power, term]);
      }
      expression = "到三个标号盒的满射：空盒容斥";
      rows = [["指定空盒数 k", "选盒", "交集大小", "带符号贡献"], ...rows];
      note = "元组第 i 项是物体 i 的盒号。n=0 时从空集到空集有一个映射，故交集计数约定 0⁰=1；到三个盒的满射仍为 0。";
    }
    $("#cnt-out", mount).textContent = expression + "；公式值 = " + answer + "；独立枚举 = " + count + (answer === count ? " ✓ 一致" : " ✗ 不一致");
    $("#cnt-table", mount).innerHTML = "<table><thead><tr>" + rows[0].map(x => "<th>" + x + "</th>").join("") + "</tr></thead><tbody>" + rows.slice(1).map(row => "<tr>" + row.map(x => "<td>" + x + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
    $("#cnt-note", mount).textContent = note;
    $("#cnt-list", mount).textContent = count ? "合法对象示例（最多显示 12 个）：" + samples.join("；") + (count > 12 ? "；……" : "") : "没有合法对象。";
  }
  mode.addEventListener("change", update); slider.addEventListener("input", update); update();
}

/* 组合概率：精确生日概率；沿讲义 366 天均匀独立模型。 */
function birthdayPlay(mount) {
  mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="birth-k">人数 k <input id="birth-k" type="range" min="1" max="80" value="23" step="1"></label><output id="birth-size" for="birth-k"></output></div><div class="readout" id="birth-out" aria-live="polite"></div><div id="birth-bars"></div><div class="table-wrap" id="birth-table"></div><p class="small muted">蓝色为至少一对同生日的精确概率；紫色为碰撞对数期望给出的上界（截到 1）。期望是“对数”，与概率不同。模型固定为 366 天、每人独立均匀。</p></div>`;
  const kInput=$("#birth-k",mount);

    const ks=[...new Set([1,22,23,k])].sort((a,b)=>a-b);
    $("#birth-table",mount).innerHTML='<table><thead><tr><th>人数</th><th>精确碰撞概率</th><th>是否大于 1/2</th></tr></thead><tbody>'+ks.map(j=>`<tr><td>${j}</td><td>${exact(j).toFixed(6)}</td><td>${exact(j)>.5?'是':'否'}</td></tr>`).join('')+'</tbody></table>';
  }
  kInput.addEventListener('input',draw);draw();
}
/* 概率界：二项分布精确求和与 Chebyshev 界，支持严格/非严格阈值。 */
function tailPlay(mount) {
  mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="tail-n">硬币次数 n <input id="tail-n" type="range" min="2" max="40" step="1" value="20"></label><output id="tail-size" for="tail-n"></output><label for="tail-eps">偏离阈值 <select id="tail-eps"><option value="0.1">0.1</option><option value="0.2" selected>0.2</option><option value="0.3">0.3</option></select></label><label><input type="checkbox" id="tail-strict">使用严格 &gt;（默认 ≥）</label></div><div id="tail-graph"></div><div class="readout" id="tail-out" aria-live="polite"></div><p class="small muted">红柱属于偏离事件，蓝柱不属于。精确值由二项概率逐项相加，不靠随机模拟。切换严格号时，恰在阈值上的柱子会改变归属；Chebyshev 上界对两种尾事件都成立。</p></div>`;

 const mode=mount.querySelector('#bd-mode'),pop=x=>{let z=0;while(x){z+=x&1;x>>=1;}return z;};
 function draw(){let days=[],v=0,target=1;if(mode.value==='fano'){v=7;const seen=new Set();for(let x=1;x<=7;x++)for(let y=x+1;y<=7;y++){const a=[x,y,x^y].sort((a,b)=>a-b),k=a.join(',');if(!seen.has(k)){seen.add(k);days.push([a]);}}}else if(mode.value==='affine'){v=9;for(let slope=-1;slope<=2;slope++){const groups=[[],[],[]];for(let x=0;x<3;x++)for(let y=0;y<3;y++){const b=slope===-1?x:((y-slope*x)%3+3)%3;groups[b].push(1+3*x+y);}days.push(groups);}}else{v=8;target=3;for(let a=1;a<8;a++){const groups=[[],[]];for(let x=0;x<8;x++)groups[pop(a&x)%2].push(x+1);days.push(groups);}}
 const counts=Array.from({length:v},()=>Array(v).fill(0));for(const groups of days)for(const g of groups)for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){const a=Math.min(g[i],g[j])-1,b=Math.max(g[i],g[j])-1;counts[a][b]++;}const vals=[];for(let i=0;i<v;i++)for(let j=i+1;j<v;j++)vals.push(counts[i][j]);const ok=vals.every(x=>x===target);mount.querySelector('#bd-out').textContent=`${v}人，${days.length}天；每对同组次数范围${Math.min(...vals)}–${Math.max(...vals)}；目标${target}；${ok?'逐对核对一致 ✓':'请检查'}`;mount.querySelector('#bd-table').innerHTML='<table><thead><tr><th>天</th><th>分组</th></tr></thead><tbody>'+days.map((g,i)=>`<tr><td>${i+1}</td><td>${g.map(x=>'{'+x.join(',')+'}').join('；')}</td></tr>`).join('')+'</tbody></table>';}
 mode.addEventListener('change',draw);draw();
}

function quadraticResidues(mount){
 const cases={p17:{label:'2019：x²−8x≡1 (mod17)',m:17,f:x=>x*x-8*x-1},p8:{label:'2019：x²−8x≡1 (mod8)',m:8,f:x=>x*x-8*x-1},p6:{label:'辅导：x²≡5x (mod6)',m:6,f:x=>x*x-5*x},p23:{label:'辅导：x²≡4 (mod23)',m:23,f:x=>x*x-4},zero9:{label:'反例：x²≡0 (mod9)',m:9,f:x=>x*x}};
 mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="qr-case">方程 <select id="qr-case">${Object.entries(cases).map(([k,c])=>`<option value="${k}">${c.label}</option>`).join('')}</select></label></div><div class="readout" id="qr-out" aria-live="polite"></div><div class="table-wrap" id="qr-table"></div><p class="small muted">逐个枚举0到m−1是完整剩余类核对，不依赖随机试根。合数模可能有多于两个根，也可能平方为0而原数不为0。</p></div>`;
 const sel=mount.querySelector('#qr-case');function draw(){const c=cases[sel.value],rows=Array.from({length:c.m},(_,x)=>[x,((c.f(x)%c.m)+c.m)%c.m]),roots=rows.filter(r=>r[1]===0).map(r=>r[0]);mount.querySelector('#qr-out').textContent='模数m='+c.m+'；全部解：'+(roots.length?roots.join('，'):'无解')+'；解数='+roots.length;mount.querySelector('#qr-table').innerHTML='<table><thead><tr><th>x</th><th>原式左边−右边 (mod m)</th><th>是否解</th></tr></thead><tbody>'+rows.map(([x,r])=>`<tr><td>${x}</td><td>${r}</td><td>${r===0?'✓':'—'}</td></tr>`).join('')+'</tbody></table>';}
 sel.addEventListener('change',draw);draw();
}
function crossingAudit(mount){
 const presets={nested:{label:'六点：三个凸四边形',pts:[[0,0],[10,0],[0,10],[1,1],[4,1],[1,4]]},convex:{label:'六点全部凸位置',pts:[[0,2],[1,0],[4,0],[5,2],[4,4],[1,4]]},five:{label:'五点凸位置',pts:[[0,2],[2,0],[5,1],[4,4],[1,5]]}};
 mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="cross-preset">点集 <select id="cross-preset">${Object.entries(presets).map(([k,p])=>`<option value="${k}">${p.label}</option>`).join('')}</select></label><button type="button" class="btn" id="cross-next">换一组凸四边形</button></div><div id="cross-svg"></div><div class="readout" id="cross-out" aria-live="polite"></div><p class="small muted">灰线为全部直线边，紫线标出当前凸四边形的两条对角线。程序按线段交叉边对穷举；即使多条线同点交，也按边对分别计数。图示不声称一般n的下界总可取到。</p></div>`;
 const sel=mount.querySelector('#cross-preset');let picked=0;
 const orient=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
 const hits=(a,b,c,d)=>orient(a,b,c)*orient(a,b,d)<0&&orient(c,d,a)*orient(c,d,b)<0;
 function draw(){const ps=presets[sel.value].pts,n=ps.length,quads=[];for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++){for(const [i,j,k,l]of[[a,b,c,d],[a,c,b,d],[a,d,b,c]])if(hits(ps[i],ps[j],ps[k],ps[l]))quads.push({vertices:[a,b,c,d],edges:[[i,j],[k,l]]});}picked%=quads.length;const q=quads[picked],maxX=Math.max(...ps.map(p=>p[0])),maxY=Math.max(...ps.map(p=>p[1])),X=x=>45+x/maxX*500,Y=y=>270-y/maxY*240;let edges='';for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)edges+=`<line x1="${X(ps[a][0])}" y1="${Y(ps[a][1])}" x2="${X(ps[b][0])}" y2="${Y(ps[b][1])}" stroke="var(--muted)" opacity="0.45"/>`;for(const[a,b]of q.edges)edges+=`<line x1="${X(ps[a][0])}" y1="${Y(ps[a][1])}" x2="${X(ps[b][0])}" y2="${Y(ps[b][1])}" stroke="var(--accent)" stroke-width="4"/>`;mount.querySelector('#cross-svg').innerHTML=`<svg viewBox="0 0 600 310" role="img" aria-label="点集全部连线与当前相交对角线" style="width:100%;height:auto;display:block">${edges}${ps.map((p,i)=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5" fill="var(--ink)"/><text x="${X(p[0])+7}" y="${Y(p[1])-7}" fill="var(--ink)" font-size="16">${i+1}</text>`).join('')}</svg>`;const bound=(n-3)*(n-4)/2;mount.querySelector('#cross-out').textContent=`n=${n}；交叉边对=凸四边形数=${quads.length}；平面删边下界=${bound}；当前第${picked+1}组：${q.vertices.map(v=>v+1).join('、')}`;}
 sel.addEventListener('change',()=>{picked=0;draw();});mount.querySelector('#cross-next').addEventListener('click',()=>{picked++;draw();});draw();
}

/* ================= 往年卷逐题核对 ================= */
function examMapRows() {
  return EXAM_MAP.map(([topic, cells, count, note]) => `<tr><th scope="row">${esc(topic)}${note ? `<div class="small muted">${esc(note)}</div>` : ""}</th>${cells.map(value => `<td class="yr">${value === null ? '<span title="该资料不完整，不能判断未出现">?</span>' : value ? '<span class="dot" title="已核到此考点"></span>' : '<span class="no" title="本份已核资料未出现">·</span>'}</td>`).join("")}<td>${count}/${cells.filter(x => x !== null).length}</td></tr>`).join("");
}
function viewExamAudit() {
  const levels = { exact: "原题已覆盖", method: "方法已覆盖", added: "本轮已补齐", partial: "部分题面待核", gap: "待补", unknown: "题面待核" };
  const counts = {};
  let questions = 0;
  for (const exam of EXAM_AUDIT) for (const q of exam.questions) { questions++; counts[q.level] = (counts[q.level] || 0) + 1; }
  const stats = Object.entries(levels).filter(([k]) => counts[k]).map(([k, label]) => label + " " + counts[k]).join(" · ");
  const papers = EXAM_AUDIT.map(exam => {
    const links = q => (q.refs || []).map(ref => {
      const target = ref.problemId ? "p-" + ref.problemId : ref.sectionId || ref.methodId;
      const route = ref.lessonId + (target ? "/" + target : "");
      return `<a href="#${esc(route)}">${esc(ref.problemId || ref.sectionId || ref.methodId || ref.lessonId)}</a>`;
    }).join("、");
    const rows = exam.questions.map(q => `<tr><th scope="row">${esc(q.id)}${q.page ? `<div class="small muted">${esc(q.page)}</div>` : ""}</th><td><p>${esc(q.summary)}</p><p class="small muted">${esc(q.topics.join("、"))}</p>${q.risk ? `<p class="callout warn">题面或参考解风险：${esc(q.risk)}</p>` : ""}</td><td><b>${levels[q.level] || esc(q.level)}</b><p>${links(q) || "暂无可靠定位"}</p>${q.note ? `<p class="small muted">${esc(q.note)}</p>` : ""}</td></tr>`).join("");
    return `<details class="block exam-audit"><summary><b>${esc(exam.label)}</b> · ${exam.questions.length} 条核对记录</summary><div class="prose"><p>${esc(exam.sourceNote)}</p><p class="small muted">${exam.inFrequency ? "计入考点地图；同卷多份文件只计一次。" : "补充核对资料，未作为一套独立年度试卷计频。"}</p><div class="table-wrap"><table><thead><tr><th>题号 / 页码</th><th>题意与考点摘要</th><th>当前页面覆盖与去向</th></tr></thead><tbody>${rows}</tbody></table></div></div></details>`;
  }).join("");
  return `<section class="stack"><span class="eyebrow">来源与覆盖审计</span><h1>往年卷逐题核对</h1><p class="lede">${esc(EXAM_AUDIT_META.scope)}</p><p>${EXAM_AUDIT.length} 组去重来源 · ${questions} 条题目 / 小问记录</p><p class="small">${esc(stats)}</p></section><section class="block prose"><p>“方法已覆盖”表示相应解题方法在课内已有讲解或训练，未必逐字收录该题。“本轮已补齐”可点击定位新增课或题。模糊题面与来源条件问题保留待核标记，不把未知记成没考。</p><p>地图中的次数只描述目前核到的资料；跨班卷型、转录与回忆来源会明确注明，不用于预测本学期出题概率。${esc(EXAM_AUDIT_META.rangeNote)}</p></section>${papers}`;
}

render();
