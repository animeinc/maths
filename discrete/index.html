"lv":R`延伸`,
"src":R`课堂记录_2026-11-17.pdf 第 7–9 页`,
"stmt":R`<p>称正整点 $(x,y)$ 从原点可见，如果线段从原点到它之间没有其他整点。</p><p>(1) 证明可见当且仅当 $(x,y)=1$。</p><p>(2) 对任意正整数 n，证明存在连续的 $n\times n$ 整点方阵，其中每个点都不可见。</p>`,
"hints":[R`(1) 若 $d=(x,y)\gt1$，点 $(x/d,y/d)$ 是线段上的中间整点。若 $d=1$，设中间点是 $\lambda(x,y)$（$0\lt\lambda\lt1$），用 Bezout $ux+vy=1$ 推出 $\lambda$ 是整数，矛盾。`,
R`(2) 方阵位置 $(i,j)$（$1\le i,j\le n$）共 $n^2$ 个，给每个位置分配不同的素数 $p_{ij}$，要求 $p_{ij}\mid X+i$ 且 $p_{ij}\mid Y+j$。`,
R`对 $X$ 解全部 $X\equiv-i\pmod{p_{ij}}$，对 $Y$ 解全部 $Y\equiv-j\pmod{p_{ij}}$；模数是不同素数、两两互素，CRT 保证有解，再加模数乘积的倍数使 $X,Y$ 为正。`],
"method":R`m-nt-congruence`,
"sol":R`<p><b>(1) 可见 ⇔ $(x,y)=1$。</b></p><ul><li>若 $d=(x,y)\gt1$：$(x/d,y/d)$ 是正整点，且等于 $\frac1d(x,y)$，在原点与 $(x,y)$ 之间，所以不可见。</li><li>若 $d=1$：由 Bezout，有整数 $u,v$ 使 $ux+vy=1$。设线段内部某点 $\lambda(x,y)$（$0\lt\lambda\lt1$）是整点，即 $\lambda x,\lambda y$ 都是整数。则 $\lambda=\lambda(ux+vy)=u(\lambda x)+v(\lambda y)$ 是整数，与 $0\lt\lambda\lt1$ 矛盾。所以没有中间整点，可见。</li></ul><p><b>(2) 构造全不可见的方阵。</b></p><ol><li>对 $1\le i,j\le n$ 选 $n^2$ 个互不相同的素数 $p_{ij}$。</li><li>解方程组 $X\equiv-i\pmod{p_{ij}}$（对所有 $i,j$）：模数两两互素，由 CRT 有解。同样解 $Y\equiv-j\pmod{p_{ij}}$。</li><li>给 $X,Y$ 加上 $\prod p_{ij}$ 的足够大倍数，使它们为正。</li><li>于是对每个方阵点 $(X+i,Y+j)$，两个坐标都被 $p_{ij}\gt1$ 整除，$\gcd\gt1$，由 (1) 不可见。</li></ol><p><b>注意：</b>必须用 $n^2$ 个不同素数（每个位置一个），不能每行只用一个素数，否则同一行不同列对 $Y$ 的余数要求会互相冲突。课堂记录第 8–9 页给出了 $n=2$ 时用 2、3、5、7 的具体构造。</p>`});

Object.assign(LESSONS, {"dc1":{"unit":"count-fund","n":1,"title":"集合、映射与计数｜先写出对象，再消去重复","goal":"弄清单射、满射与左逆、右逆的关系；会按“每个目标值有几个原像”来分类计数；会处理分组时的去重和“插板法”。","sections":[{"id":"dc1-s1","h":"像、原像与左右逆","html":"<p><b>这节解决什么：<\/b>判断一个映射是不是单射、满射，并知道它什么时候“能倒回去”（有左逆或右逆）。后面所有计数题都是在数某种映射，所以先把这些词弄清楚。<\/p><p><b>记号：<\/b>映射 $f:X\\to Y$ 把 $X$ 中每个元素送到 $Y$ 中一个元素。对 $y\\in Y$，它的<b>原像集<\/b>（课上也叫<b>纤维<\/b>）是 $f^{-1}(\\{y\\})=\\{x\\in X: f(x)=y\\}$，即“所有被送到 $y$ 的元素”。纤维可能是空集、一个点或多个点。<\/p><ul><li><b>单射<\/b>：不同元素的像不同。等价于：每条纤维<b>至多<\/b>一个元素。<\/li><li><b>满射<\/b>：$Y$ 中每个元素都被取到。等价于：每条纤维<b>至少<\/b>一个元素（非空）。<\/li><li><b>双射<\/b>：既单又满，每条纤维恰好一个元素。<\/li><\/ul><p><b>左逆、右逆：<\/b>$I_X$ 表示 $X$ 上的恒等映射（$I_X(x)=x$）。若 $g:Y\\to X$ 满足 $g\\circ f=I_X$（先 $f$ 后 $g$ 回到原处），称 $g$ 是 $f$ 的<b>左逆<\/b>；若 $f\\circ g=I_Y$，称 $g$ 是 $f$ 的<b>右逆<\/b>。<\/p><ol><li>有左逆 ⇒ 单射：若 $f(x)=f(x')$，两边作用 $g$ 得 $x=g(f(x))=g(f(x'))=x'$。<\/li><li>有右逆 ⇒ 满射：任给 $y$，令 $x=g(y)$，则 $f(x)=f(g(y))=y$，所以 $y$ 被取到。<\/li><li>反过来（$X$ 非空）：单射时，在像 $f(X)$ 上令 $g(y)=$ 那个唯一原像，像外的 $y$ 随便送到 $X$ 中某个元素，就得到左逆。满射时，从每条纤维里挑一个元素作 $g(y)$，就得到右逆。<\/li><li>双射时左逆、右逆都存在，且相等、唯一，就是逆映射 $f^{-1}$。<\/li><\/ol><p><b>小例子：<\/b>$X=\\{1,2\\}$，$Y=\\{a,b,c\\}$，$f(1)=a, f(2)=b$。纤维：$a$ 对应 $\\{1\\}$，$b$ 对应 $\\{2\\}$，$c$ 对应空集。所以 $f$ 是单射、不是满射；它有左逆（$g(a)=1,g(b)=2$，$g(c)$ 任取），没有右逆。<\/p>"},{"id":"dc1-s2","h":"计数是先找分类，再加或乘","html":"<p><b>这节解决什么：<\/b>计数的两条基本规则，以及“换一种分组方式数同一个集合”（双计数）。<\/p><ul><li><b>加法原理<\/b>：把要数的对象分成互不相交的几类，总数 = 各类数目之和。<\/li><li><b>乘法原理<\/b>：对象由若干步选择决定，第 $j$ 步有 $m_j$ 种选法，且 $m_j$ 不依赖前面选了什么，则总数 = $m_1m_2\\cdots$。<\/li><\/ul><p><b>数映射：<\/b>若 $|X|=n$，$|Y|=m$（$|X|$ 表示集合元素个数），则映射 $X\\to Y$ 共 $m^n$ 个（因为 $X$ 中每个元素独立地选 $m$ 个像之一）。例：$|X|=3,|Y|=2$ 时有 $2^3=8$ 个映射。<\/p><p><b>按纤维大小细分：<\/b>设 $Y=\\{y_1,\\dots,y_m\\}$，规定 $y_i$ 的纤维恰有 $n_i$ 个元素（$n_1+\\cdots+n_m=n$），这样的映射有 $\\dfrac{n!}{n_1!\\,n_2!\\cdots n_m!}$ 个（多项式系数：把 $n$ 个元素排成一列，前 $n_1$ 个送到 $y_1$，接下来 $n_2$ 个送到 $y_2$……每组内部顺序无关，所以除以各 $n_i!$）。例：$n=3$，要求 $y_1$ 的纤维 2 个、$y_2$ 的纤维 1 个，有 $3!/(2!\\,1!)=3$ 个。<\/p><p><b>双计数：<\/b>对任意映射 $p:E\\to B$（$E,B$ 有限），每个 $e\\in E$ 恰落在一条纤维里，所以 $$|E|=\\sum_{b\\in B}|p^{-1}(\\{b\\})|.$$ 同一个集合 $E$ 用两种不同映射分组各数一次，两个结果必须相等，这就是双计数。例：图中所有“（顶点，与它相连的边）”对组成 $E$；按顶点分组得 $\\sum\\deg v$，按边分组每条边贡献 2，得 $2|E(G)|$。<\/p><p>易错：计数前先问“哪些标签有意义”——盒子有没有编号、组与组能不能区分，答案会差一个倍数。<\/p>"},{"id":"dc1-s3","h":"无标号组与插板是不同模型","html":"<p><b>这节解决什么：<\/b>两类最常见的模型容易混：“不同的人分组”与“相同的球放进盒子”。<\/p><p><b>模型一：不同对象分组。<\/b>先看两件事：(1) 每组大小是否给定；(2) 组有没有编号（标号）。做法：先当作组有编号依次选人，再看有没有重复。若有 $r$ 个<b>大小相同且没有编号<\/b>的组，它们互换不产生新分法，所以要除以 $r!$。例：4 人分成两组每组 2 人（组不编号）：先算 $\\binom42=6$（选第一组），两组可互换，答案 $6/2=3$。验证：$\\{12|34\\},\\{13|24\\},\\{14|23\\}$，确实 3 种。<\/p><p><b>模型二：相同物品放有编号盒子（插板法）。<\/b>$N$ 个相同的球放进 $k$ 个有编号的盒子、允许空盒，等价于数方程 $x_1+\\cdots+x_k=N$ 的非负整数解（$x_i$ 是第 $i$ 盒的球数）。把 $N$ 个球画成 $N$ 颗星，用 $k-1$ 块板隔开：$N+k-1$ 个位置中选 $k-1$ 个放板，共 $$\\binom{N+k-1}{k-1}$$ 种。例：$N=3,k=2$ 时 $\\binom41=4$，即 $(0,3),(1,2),(2,1),(3,0)$。<\/p><p>若要求某盒至少 $a$ 个，先往该盒放 $a$ 个，再对剩下的球用插板法。<\/p>"}],"widget":null,"concepts":[{"id":"dc1-c1","sec":"dc1-s1","q":"$g\\circ f=I_X$ 可以推出什么？","opts":["f 满射","f 单射","g 单射","f 与 g 必为双射"],"a":1,"ex":"选“f 单射”。设 $f(x)=f(y)$，两边作用 $g$：$x=g(f(x))=g(f(y))=y$，所以 $f$ 单射。易错选“f 满射”：满射要的是 $f\\circ g=I_Y$（右逆），方向反了；例如 $f:\\{1\\}\\to\\{a,b\\}$ 有左逆但不是满射。$g$ 也不一定单射（上例中 $g$ 把 $a,b$ 都送到 1）。"},{"id":"dc1-c2","sec":"dc1-s1","q":"满射有哪些纤维？","opts":["每条非空","每条恰一元","每条都是空集","恰有一条非空"],"a":0,"ex":"选“每条非空”。满射的意思是每个目标值 $y$ 至少有一个原像，也就是纤维 $f^{-1}(\\{y\\})$ 非空；纤维可以有多个元素。易错选“每条恰一元”：那是双射（既单又满）的条件，比满射更强。"},{"id":"dc1-c3","sec":"dc1-s2","q":"6 个不同物体任放到 3 个有标号盒，共多少？","opts":["$6^3$","$3^6$","$\\binom63$","$6!$"],"a":1,"ex":"选 $3^6$。每个物体独立选 3 个盒子之一，6 个物体共 $3\\times3\\times\\cdots\\times3=3^6=729$ 种（相当于数映射“物体→盒子”，$m^n$ 中 $m=3,n=6$）。易错选 $6^3$：把底数和指数弄反了，底数应是“每个物体的选择数”。"},{"id":"dc1-c4","sec":"dc1-s3","q":"不同对象分入两个无标号的同大小组，哪一步产生重复？","opts":["选出第一组时，两组可互换","每组内部都必须排序","同一对象可以放两次","组大小相同就不能分"],"a":0,"ex":"选第一项。按“先选第一组、剩下为第二组”数时，同一种分法 $\\{A|B\\}$ 会被数两次（先选 $A$ 或先选 $B$），因为两组大小相同又没编号，可以互换。所以要除以 2。其他选项：组内不需排序；同一对象不能放两次；组大小相同当然可以分。"}],"methods":[{"id":"m-dc1","title":"明确对象、标签和纤维","steps":["写清楚：在数什么对象？它对应哪个映射（谁送到谁）？","判断映射类型：一般映射、单射、满射还是双射；盒子/组有没有编号。","先按“有编号”数（加法、乘法原理），再检查重复：每个真正的对象是否被重复数了同样多次 $r$ 次，是就除以 $r$。","相同物品放有编号盒子：用插板法 $\\binom{N+k-1}{k-1}$；有“至少”条件先预放。","易错：只有当同大小的组之间没有编号时才除以排列数；大小不同的组本来就能区分，不要除。"]}],"problems":[{"id":"dc1-p1","lv":"练习","src":"自编同类练习","stmt":"<p>令 $X=\\{1,2\\},Y=\\{a,b,c\\}$，给定 $f(1)=a,f(2)=c$。判断单射和满射，数出所有左逆和右逆。<\/p>","hints":["画出 $Y$ 中三个元素 $a,b,c$ 各自的纤维（原像集），用“纤维至多一个⇔单射、全部非空⇔满射”判断。","左逆 $g$ 必须满足 $g(f(x))=x$，所以 $g(a)=1$、$g(c)=2$ 已被固定；只有 $g(b)$ 可以自由选。","右逆要求 $f(g(y))=y$ 对所有 $y$ 成立；取 $y=b$，需要某个 $x$ 使 $f(x)=b$——存在吗？"],"method":"m-dc1","sol":"<p><b>已知：<\/b>$X=\\{1,2\\}$，$Y=\\{a,b,c\\}$，$f(1)=a$，$f(2)=c$。<\/p><p><b>第 1 步：写纤维。<\/b>$f^{-1}(\\{a\\})=\\{1\\}$，$f^{-1}(\\{b\\})=\\varnothing$，$f^{-1}(\\{c\\})=\\{2\\}$。<\/p><p><b>第 2 步：判断。<\/b>每条纤维至多一个元素，所以 $f$ 是单射；$b$ 的纤维是空集，所以 $f$ 不是满射。<\/p><p><b>第 3 步：数左逆。<\/b>左逆 $g:Y\\to X$ 要满足 $g(f(1))=1$、$g(f(2))=2$，即 $g(a)=1$，$g(c)=2$。$g(b)$ 不受约束（因为 $b$ 不是任何元素的像），可以取 1 或 2，共 2 种：<\/p>$$g_1:\\ a\\mapsto1,\\ b\\mapsto1,\\ c\\mapsto2;\\qquad g_2:\\ a\\mapsto1,\\ b\\mapsto2,\\ c\\mapsto2.$$<p><b>第 4 步：数右逆。<\/b>右逆 $h:Y\\to X$ 要满足 $f(h(y))=y$ 对每个 $y$ 成立。取 $y=b$：需要 $f(h(b))=b$，但 $f$ 的值只有 $a,c$，不可能等于 $b$。所以没有右逆（与“有右逆⇒满射”一致）。<\/p><p><b>结论：$f$ 单射、非满射；左逆恰有 2 个，右逆 0 个。<\/b><\/p>"},{"id":"dc1-p2","lv":"练习","src":"自编同类练习","stmt":"<p>8 个不同的同学分成大小为 2、3、3 的三个无标号小组，有多少种？<\/p>","hints":["三组大小是 2、3、3。大小为 2 的组只有一个，能和别的组区分；两个 3 人组大小相同、没编号，会重复。","先选 2 人组：$\\binom82$；再从剩下 6 人中选一个 3 人组：$\\binom63$，剩下 3 人自动成组。","上一步把“先选 $A$ 后剩 $B$”和“先选 $B$ 后剩 $A$”当成了两种，所以要除以 $2!$：$\\binom82\\binom63/2$。"],"method":"m-dc1","sol":"<p><b>目标：<\/b>8 个不同的人分成大小 2、3、3 的三组，组不编号。<\/p><p><b>第 1 步：选 2 人组。<\/b>2 人组只有一个，从 8 人中选 2 人：$\\binom82=28$ 种。<\/p><p><b>第 2 步：分剩下 6 人。<\/b>从 6 人中选 3 人组成“第一个”3 人组：$\\binom63=20$ 种；剩下 3 人自动是另一组。<\/p><p><b>第 3 步：去重。<\/b>两个 3 人组大小相同、没有编号，第 2 步中选 $\\{A\\}$ 剩 $\\{B\\}$ 与选 $\\{B\\}$ 剩 $\\{A\\}$ 是同一种分法，每种分法恰好被数了 $2!=2$ 次。2 人组大小不同，不会与 3 人组混淆，不用再除。<\/p>$$\\frac{\\binom82\\binom63}{2!}=\\frac{28\\times20}{2}=280.$$<p><b>答：280 种。<\/b><\/p><p>检验思路：若三组都有编号（如 A 组 2 人、B 组 3 人、C 组 3 人），则是 $\\frac{8!}{2!\\,3!\\,3!}=560$，恰好是 280 的 2 倍。<\/p>"}],"variants":[{"id":"dc1-v1","lv":"变种","src":"自编同类练习","stmt":"<p>把 9 个相同球放到 4 个有标号盒，第一个盒至少 2 个，其余可空。有多少种？<\/p>","hints":["相同的球放进有编号的盒子 = 数 $x_1+x_2+x_3+x_4=9$ 的整数解，其中 $x_1\\ge2$，其余 $\\ge0$。用插板法。","先往第一个盒放 2 个球，令 $y_1=x_1-2\\ge0$，问题变成 $y_1+x_2+x_3+x_4=7$ 的非负整数解。","7 颗星和 3 块板共 10 个位置，选 3 个放板：$\\binom{10}{3}$。"],"method":"m-dc1","sol":"<p><b>建模：<\/b>设第 $i$ 个盒放 $x_i$ 个球，要数 $x_1+x_2+x_3+x_4=9$，$x_1\\ge2$，$x_2,x_3,x_4\\ge0$ 的整数解个数。<\/p><p><b>第 1 步：去掉下界。<\/b>令 $y_1=x_1-2$，则 $y_1\\ge0$，方程变为 $y_1+x_2+x_3+x_4=7$。（相当于先往第一个盒放 2 个球。）这是一一对应，解数不变。<\/p><p><b>第 2 步：插板。<\/b>7 个球排成一排，用 3 块板分成 4 段（第 $i$ 段的球数就是第 $i$ 盒的球数，段可以空）。共有 $7+3=10$ 个位置，从中选 3 个放板：<\/p>$$\\binom{10}{3}=\\frac{10\\cdot9\\cdot8}{3\\cdot2\\cdot1}=120.$$<p><b>答：120 种。<\/b><\/p>"}],"extensions":[{"id":"dc1-e1","lv":"延伸","src":"自编同类练习","stmt":"<p>若 $\\mathcal A$ 是 $[n]$ 的子集族，任意两个不同成员互不包含，证明 $\\sum_{S\\in\\mathcal A}1/\\binom n{|S|}\\le1$。<\/p>","hints":["用双计数：数 $[n]=\\{1,\\dots,n\\}$ 的所有 $n!$ 个排列。每个排列 $\\pi=(\\pi_1,\\dots,\\pi_n)$ 给出一条“前缀链” $\\varnothing\\subset\\{\\pi_1\\}\\subset\\{\\pi_1,\\pi_2\\}\\subset\\cdots\\subset[n]$。","链中任意两个集合一个包含另一个，而 $\\mathcal A$ 中任意两个成员互不包含，所以一条前缀链最多含 $\\mathcal A$ 的一个成员。","固定 $S$（$|S|=k$），使 $S$ 恰是前 $k$ 项组成的集合的排列数为 $k!(n-k)!$（前 $k$ 位排 $S$，后面排其余）。对 $S\\in\\mathcal A$ 求和，总和 $\\le n!$。"],"method":"m-dc1","sol":"<p><b>要证：<\/b>$\\mathcal A$ 是 $[n]=\\{1,\\dots,n\\}$ 的子集族，任意两个不同成员互不包含（称为反链），则 $\\sum_{S\\in\\mathcal A}\\dfrac{1}{\\binom{n}{|S|}}\\le1$。<\/p><p><b>第 1 步：定义要双计数的集合。<\/b>令 $E=\\{(\\pi,S):\\pi$ 是 $[n]$ 的排列，$S\\in\\mathcal A$，且 $S=\\{\\pi_1,\\dots,\\pi_{|S|}\\}\\}$，即 $S$ 恰好是 $\\pi$ 的前 $|S|$ 项组成的集合（称 $S$ 是 $\\pi$ 的前缀集）。<\/p><p><b>第 2 步：按 $S$ 分组数。<\/b>固定 $S$，$|S|=k$。$\\pi$ 的前 $k$ 位必须是 $S$ 的元素的某个排列（$k!$ 种），后 $n-k$ 位是其余元素的排列（$(n-k)!$ 种），所以这样的 $\\pi$ 有 $k!(n-k)!$ 个。故 $|E|=\\sum_{S\\in\\mathcal A}|S|!\\,(n-|S|)!$。<\/p><p><b>第 3 步：按 $\\pi$ 分组数。<\/b>固定 $\\pi$，它的前缀集 $\\{\\pi_1\\}\\subset\\{\\pi_1,\\pi_2\\}\\subset\\cdots$ 两两有包含关系。$\\mathcal A$ 中两个不同成员互不包含，所以至多一个成员是 $\\pi$ 的前缀集。因此每个 $\\pi$ 至多贡献 1，$|E|\\le n!$。<\/p><p><b>第 4 步：比较。<\/b>$$\\sum_{S\\in\\mathcal A}|S|!\\,(n-|S|)!\\le n!.$$ 两边同除以 $n!$，并用 $\\dfrac{k!(n-k)!}{n!}=\\dfrac1{\\binom nk}$，得 $$\\sum_{S\\in\\mathcal A}\\frac1{\\binom n{|S|}}\\le1.$$<\/p><p><b>结论得证（这叫 LYM 不等式）。<\/b>推论：因为每个 $\\binom n{|S|}\\le\\binom n{\\lfloor n/2\\rfloor}$，左边 $\\ge|\\mathcal A|/\\binom n{\\lfloor n/2\\rfloor}$，所以 $|\\mathcal A|\\le\\binom n{\\lfloor n/2\\rfloor}$（Sperner 定理）。<\/p>"}]},"dc2":{"unit":"count-fund","n":2,"title":"递推与生成函数｜Fibonacci、Stirling 与 Catalan","goal":"学会“看最后一个元素怎么放”来写递推；会用生成函数（把数列打包成幂级数）求系数；认识两类 Stirling 数和 Catalan 数。","sections":[{"id":"dc2-s1","h":"判断新元素如何加入","html":"<p><b>这节解决什么：<\/b>很多计数没有直接公式，但“规模 $n$ 的答案”可以用“规模 $n-1$ 的答案”表示，这就是递推。写递推的通用办法：<b>看第 $n$ 个（最后一个）元素放在哪里<\/b>，把情况分成互不重叠的几类。<\/p><p><b>第二类 Stirling 数 $S(n,k)$：<\/b>把 $n$ 个不同元素分成 $k$ 个<b>非空<\/b>、<b>没有编号<\/b>的块（子集）的方法数。例：$\\{1,2,3\\}$ 分成 2 块：$\\{1\\}\\{2,3\\}$、$\\{2\\}\\{1,3\\}$、$\\{3\\}\\{1,2\\}$，所以 $S(3,2)=3$。<\/p><p>看元素 $n$：<\/p><ol><li>它自己单独成一块：其余 $n-1$ 个元素分成 $k-1$ 块，有 $S(n-1,k-1)$ 种。<\/li><li>它不单独：先把其余 $n-1$ 个元素分成 $k$ 块（$S(n-1,k)$ 种），再把 $n$ 放进这 $k$ 块之一（$k$ 种）。<\/li><\/ol>$$S(n,k)=S(n-1,k-1)+k\\,S(n-1,k).$$<p><b>第一类（无符号）Stirling 数 $c(n,k)$：<\/b>$n$ 个元素的排列中，恰好分解成 $k$ 个圈（轮换）的个数。一个圈如 $(1\\,3\\,2)$ 表示 $1\\to3\\to2\\to1$；同一个圈转一转写法不同但是同一个圈，所以 $m$ 个元素排成一个圈有 $(m-1)!$ 种。看元素 $n$：<\/p><ol><li>自己成一个圈（不动点）：$c(n-1,k-1)$ 种。<\/li><li>插进已有的圈：把它插在某个旧元素 $j$ 的后面（即改成 $j\\to n\\to\\cdots$），旧元素有 $n-1$ 个可选：$(n-1)c(n-1,k)$ 种。<\/li><\/ol>$$c(n,k)=c(n-1,k-1)+(n-1)\\,c(n-1,k).$$<p><b>初值：<\/b>$S(0,0)=c(0,0)=1$（空集分成 0 块恰有 1 种：什么都不做）；$n\\ge1$ 时 $S(n,0)=c(n,0)=0$；$k\\gt n$ 时为 0。<\/p><p><b>与满射的关系：<\/b>$n$ 元集到 $k$ 元集的满射数 $=k!\\,S(n,k)$（先分成 $k$ 块，再给块分配 $k$ 个不同的像值，$k!$ 种）。例：$3$ 元到 $2$ 元满射 $=2!\\cdot3=6$，验证：总映射 $2^3=8$ 减去两个常值映射，得 6。<\/p>"},{"id":"dc2-s2","h":"生成函数把下标平移变成乘 x","html":"<p><b>这节解决什么：<\/b>递推只能一项一项算；生成函数能把整个数列“打包”，通过解代数方程得到通项或系数。<\/p><p><b>定义：<\/b>数列 $a_0,a_1,a_2,\\dots$ 的（普通）生成函数是 $$A(x)=\\sum_{n\\ge0}a_nx^n=a_0+a_1x+a_2x^2+\\cdots.$$ 这里 $x$ 只是记号，不用管收敛，只按多项式那样加、乘、比较系数（称为形式幂级数）。<\/p><p><b>关键技巧：乘 $x$ = 下标右移一位。<\/b>$xA(x)=a_0x+a_1x^2+\\cdots$，即 $x^n$ 的系数变成 $a_{n-1}$。<\/p><p><b>例：Fibonacci。<\/b>$F_0=0,F_1=1,F_{n+2}=F_{n+1}+F_n$。<\/p><ol><li>递推对 $n\\ge0$ 成立，两边乘 $x^{n+2}$ 再对 $n\\ge0$ 求和：$\\sum_{n\\ge0}F_{n+2}x^{n+2}=\\sum_{n\\ge0}F_{n+1}x^{n+2}+\\sum_{n\\ge0}F_nx^{n+2}$。<\/li><li>左边 $=A(x)-F_0-F_1x=A(x)-x$（缺了前两项，要减掉）。<\/li><li>右边第一项 $=x\\,(A(x)-F_0)=xA(x)$，第二项 $=x^2A(x)$。<\/li><li>所以 $A-x=xA+x^2A$，即 $(1-x-x^2)A(x)=x$，$A(x)=\\dfrac{x}{1-x-x^2}$。<\/li><\/ol><p><b>特征根法（常系数线性递推）：<\/b>对 $a_{n+2}=pa_{n+1}+qa_n$，解 $r^2=pr+q$。两个不同根 $r_1,r_2$ 时通项 $a_n=\\alpha r_1^n+\\beta r_2^n$；<b>重根<\/b> $r$ 时通项 $a_n=(\\alpha+\\beta n)r^n$。$\\alpha,\\beta$ 由 $a_0,a_1$ 两个初值解出。例：$a_{n+2}=5a_{n+1}-6a_n$，根 2、3，$a_n=\\alpha2^n+\\beta3^n$。<\/p>"},{"id":"dc2-s3","h":"合法括号在第一对匹配括号处分解","html":"<p><b>这节解决什么：<\/b>Catalan 数是期末常见的“卷积型递推”，学会“按第一对匹配括号分解”。<\/p><p><b>定义：<\/b>$C_n$ = 由 $n$ 个“(”和 $n$ 个“)”组成的<b>合法<\/b>括号串的个数（合法：从左往右读，任何时刻右括号数不超过左括号数）。约定 $C_0=1$（空串）。例：$n=2$ 时有 $(())$ 和 $()()$，$C_2=2$。<\/p><p><b>分解：<\/b>非空合法串的第一个字符一定是“(”，找到和它配对的“)”，串就唯一地写成 $(u)v$，其中 $u,v$ 都是合法串（可以为空）。若 $u$ 有 $k$ 对括号，则 $v$ 有 $n-1-k$ 对（总共 $n$ 对，减去最外面这一对）。$k$ 从 0 到 $n-1$，按乘法、加法原理：<\/p>$$C_n=\\sum_{k=0}^{n-1}C_k\\,C_{n-1-k}\\quad(n\\ge1).$$<p>例：$C_3=C_0C_2+C_1C_1+C_2C_0=2+1+2=5$。<\/p><p><b>生成函数：<\/b>$C(x)=\\sum C_nx^n$ 满足 $C(x)=1+x\\,C(x)^2$（常数项 1 对应空串，$x$ 对应最外层那一对，$C(x)^2$ 对应 $u$ 和 $v$）。<\/p><p><b>通项（反射原理）：<\/b>把“(”看作向上走一步，“)”看作向下走一步，合法串 = 从 0 出发、不走到 0 以下、最后回到 0 的路径。所有 $n$ 上 $n$ 下的路径有 $\\binom{2n}{n}$ 条；走到 $-1$ 以下的“坏路径”，把第一次碰到 $-1$ 之后的部分上下翻转，一一对应于终点为 $-2$ 的路径，共 $\\binom{2n}{n+1}$ 条。所以 $$C_n=\\binom{2n}{n}-\\binom{2n}{n+1}=\\frac1{n+1}\\binom{2n}{n}.$$ 检验：$n=3$ 时 $20-15=5$。<\/p>"}],"widget":null,"concepts":[{"id":"dc2-c1","sec":"dc2-s1","q":"第二类 Stirling 的第二项系数为何是 k？","opts":["在 k 个非空块中选一块","在 k 个元素里选一个","必须编号所有组","因为最后一个元素不能加入旧块"],"a":0,"ex":"选“在 k 个非空块中选一块”。第二项对应“元素 $n$ 不单独成块”：先把其余 $n-1$ 个元素分成 $k$ 块，再把 $n$ 放进其中一块，有 $k$ 种放法。易错选“因为最后一个元素不能加入旧块”：恰好相反，第二项就是加入旧块的情形；“单独成块”是第一项 $S(n-1,k-1)$。"},{"id":"dc2-c2","sec":"dc2-s1","q":"第一类不带符号 Stirling 数的第二项系数是什么？","opts":["$k$","$n$","$n-1$","$k-1$"],"a":2,"ex":"选 $n-1$。元素 $n$ 插入已有圈时，是把它放在某个旧元素 $j$ 的后面（$j\\to n\\to$ 原来 $j$ 的后继），旧元素有 $n-1$ 个，所以系数 $n-1$。易错选 $k$（照搬第二类 Stirling）：第二类只关心放进哪一块，而圈里还有顺序，放在不同元素后面得到不同的排列。"},{"id":"dc2-c3","sec":"dc2-s2","q":"递推求和时前两项怎么处理？","opts":["丢掉","先把求和起始下标对应的初值移出来","用极限逼近","约定它们都为 0"],"a":1,"ex":"选“把初值移出来”。递推只对 $n\\ge2$（或类似范围）成立，求和后左边 $\\sum F_{n+2}x^{n+2}$ 少了 $F_0+F_1x$ 两项，必须写成 $A(x)-F_0-F_1x$。这些初值正好决定了生成函数的分子（Fibonacci 的分子 $x$ 就来自 $F_1x$）。易错选“约定它们都为 0”：会得到 $A=0$ 之类的错误结果。"},{"id":"dc2-c4","sec":"dc2-s3","q":"$C_0$ 取多少？","opts":["0","1","2","无定义"],"a":1,"ex":"选 1。空括号串（什么都没有）是唯一的长度为 0 的合法串，所以 $C_0=1$。递推 $C_n=\\sum C_kC_{n-1-k}$ 中，$u$ 或 $v$ 为空的情形要用到 $C_0$；若取 $C_0=0$，会得到 $C_1=C_0C_0=0$，显然错（$C_1=1$，即“()”）。"}],"methods":[{"id":"m-dc2","title":"明确分类互斥、给初值、再求系数","steps":["定分类：看“最后一个元素”（或第一对括号、第一步）有哪几种去处，确认各类互不重叠、合起来是全部。","写递推，并写清楚初值（如 $S(0,0)=1$、$C_0=1$）和适用范围（$n\\ge1$ 还是 $n\\ge2$）。","用小的 $n$ 手工列举检验递推，例如 $S(3,2)=3$、$C_3=5$。","用生成函数时：递推两边乘 $x^{n}$ 的对应幂求和，左边补上/减去缺的初值项，再解出 $A(x)$。","线性递推求通项：解特征方程；重根 $r$ 用 $(\\alpha+\\beta n)r^n$，再用两个初值定 $\\alpha,\\beta$。"]}],"problems":[{"id":"dc2-p1","lv":"练习","src":"自编同类练习","stmt":"<p>分别求 $S(4,2)$ 与 $c(4,2)$，解释两者为何不同。<\/p>","hints":["$S(4,2)$：把 4 个元素分成 2 个非空块，块大小只能是 $1+3$ 或 $2+2$，分别数。也可用递推 $S(4,2)=S(3,1)+2S(3,2)$。","$c(4,2)$：排列分成 2 个圈，圈的大小同样是 $1+3$ 或 $2+2$；但每个大小为 $m$ 的圈有 $(m-1)!$ 种内部顺序。","$1+3$ 型：选单点 4 种 × 3 元圈 $(3-1)!=2$ 种 $=8$；$2+2$ 型：分成两对 3 种 × 每个 2 元圈只有 1 种 $=3$。"],"method":"m-dc2","sol":"<p><b>求 $S(4,2)$（分成 2 个无编号非空块）：<\/b><\/p><ul><li>$1+3$ 型：选出单独成块的那个元素，4 种。<\/li><li>$2+2$ 型：$\\binom42=6$ 种选法选出一块，但两块大小相同、无编号，每种分法被数两次，$6/2=3$ 种。<\/li><\/ul><p>所以 $S(4,2)=4+3=7$。用递推检验：$S(4,2)=S(3,1)+2S(3,2)=1+2\\times3=7$。✓<\/p><p><b>求 $c(4,2)$（恰有 2 个圈的排列）：<\/b><\/p><ul><li>$1+3$ 型：选不动点 4 种；剩下 3 个元素排成一个圈有 $(3-1)!=2$ 种（如 $(a\\,b\\,c)$ 与 $(a\\,c\\,b)$）。共 $4\\times2=8$。<\/li><li>$2+2$ 型：先分成两对，3 种；每个 2 元圈只有 $(2-1)!=1$ 种。共 $3$。<\/li><\/ul><p>所以 $c(4,2)=8+3=11$。用递推检验：$c(4,2)=c(3,1)+3c(3,2)=2+3\\times3=11$。✓<\/p><p><b>为什么不同：<\/b>两者分组方式一样，但第一类 Stirling 数还要算每块<b>内部排成圈的顺序<\/b>：大小为 3 的块排成圈有 2 种，所以 $1+3$ 型多出一个因子 2（4 变成 8）；大小 1、2 的块只有 1 种圈序，不变。<\/p><p><b>答：$S(4,2)=7$，$c(4,2)=11$。<\/b><\/p>"},{"id":"dc2-p2","lv":"练习","src":"自编同类练习","stmt":"<p>设 $F_0=0,F_1=1,F_{n+2}=F_{n+1}+F_n$。推出生成函数并求 $F_6$。<\/p>","hints":["设 $A(x)=\\sum_{n\\ge0}F_nx^n$。把递推 $F_{n+2}=F_{n+1}+F_n$ 两边乘 $x^{n+2}$，对 $n\\ge0$ 求和。","左边 $=A(x)-F_0-F_1x=A(x)-x$；右边 $=x(A(x)-F_0)+x^2A(x)=xA+x^2A$。","解得 $A=\\dfrac{x}{1-x-x^2}$。求 $F_6$ 直接用递推：$F_2=1,F_3=2,F_4=3,F_5=5,F_6=?$"],"method":"m-dc2","sol":"<p><b>第 1 步：设生成函数。<\/b>$A(x)=\\sum_{n\\ge0}F_nx^n$。<\/p><p><b>第 2 步：递推乘幂求和。<\/b>对 $n\\ge0$，$F_{n+2}x^{n+2}=F_{n+1}x^{n+2}+F_nx^{n+2}$，求和：<\/p>$$\\sum_{n\\ge0}F_{n+2}x^{n+2}=x\\sum_{n\\ge0}F_{n+1}x^{n+1}+x^2\\sum_{n\\ge0}F_nx^n.$$<p><b>第 3 步：用 $A$ 表示各项。<\/b><\/p><ul><li>左边是 $A$ 去掉 $n=0,1$ 两项：$A-F_0-F_1x=A-x$。<\/li><li>$\\sum_{n\\ge0}F_{n+1}x^{n+1}=A-F_0=A$，所以第一项是 $xA$。<\/li><li>第二项是 $x^2A$。<\/li><\/ul><p><b>第 4 步：解方程。<\/b>$A-x=xA+x^2A$，即 $(1-x-x^2)A=x$，<\/p>$$A(x)=\\frac{x}{1-x-x^2}.$$<p><b>第 5 步：求 $F_6$。<\/b>由递推：$F_2=1+0=1$，$F_3=1+1=2$，$F_4=2+1=3$，$F_5=3+2=5$，$F_6=5+3=8$。（也可展开 $x/(1-x-x^2)=x+x^2+2x^3+3x^4+5x^5+8x^6+\\cdots$ 读 $x^6$ 系数。）<\/p><p><b>答：$A(x)=\\dfrac{x}{1-x-x^2}$，$F_6=8$。<\/b><\/p>"}],"variants":[{"id":"dc2-v1","lv":"变种","src":"自编同类练习","stmt":"<p>不用通项公式，从第一对匹配括号的分解求 $C_1$、$C_2$、$C_3$、$C_4$。<\/p>","hints":["用递推 $C_n=\\sum_{k=0}^{n-1}C_kC_{n-1-k}$，从 $C_0=1$ 开始依次算。","$C_1=C_0C_0$，$C_2=C_0C_1+C_1C_0$，$C_3=C_0C_2+C_1C_1+C_2C_0$。","$C_4=C_0C_3+C_1C_2+C_2C_1+C_3C_0$，共 4 项，$k$ 是第一对括号内部的括号对数。"],"method":"m-dc2","sol":"<p><b>依据：<\/b>非空合法串唯一写成 $(u)v$，$u$ 有 $k$ 对、$v$ 有 $n-1-k$ 对，所以 $C_n=\\sum_{k=0}^{n-1}C_kC_{n-1-k}$，$C_0=1$。<\/p><ul><li>$C_1=C_0C_0=1$（即 $()$）。<\/li><li>$C_2=C_0C_1+C_1C_0=1+1=2$（$()()$ 与 $(())$）。<\/li><li>$C_3=C_0C_2+C_1C_1+C_2C_0=2+1+2=5$。<\/li><li>$C_4=C_0C_3+C_1C_2+C_2C_1+C_3C_0=5+2+2+5=14$。<\/li><\/ul><p><b>答：$C_1=1,\\ C_2=2,\\ C_3=5,\\ C_4=14$。<\/b>检验：$\\frac1{5}\\binom84=70/5=14$。✓<\/p>"}],"extensions":[{"id":"dc2-e1","lv":"延伸","src":"自编同类练习","stmt":"<p>$a_0=1,a_1=4$ 且 $a_{n+2}=4a_{n+1}-4a_n$。求通项。<\/p>","hints":["这是常系数线性递推，特征方程 $r^2=4r-4$，即 $(r-2)^2=0$，重根 $r=2$。","重根时通项形如 $a_n=(\\alpha+\\beta n)2^n$。或者令 $b_n=a_n/2^n$，递推变成 $b_{n+2}=2b_{n+1}-b_n$。","$b_{n+2}-b_{n+1}=b_{n+1}-b_n$，所以 $b_n$ 是等差数列；$b_0=1$，$b_1=4/2=2$，公差 1。"],"method":"m-dc2","sol":"<p><b>第 1 步：特征方程。<\/b>$r^2=4r-4\\iff(r-2)^2=0$，重根 $r=2$。<\/p><p><b>第 2 步：消去指数。<\/b>令 $b_n=a_n/2^n$，即 $a_n=2^nb_n$，代入递推：$2^{n+2}b_{n+2}=4\\cdot2^{n+1}b_{n+1}-4\\cdot2^nb_n$，两边除以 $2^{n+2}$ 得<\/p>$$b_{n+2}=2b_{n+1}-b_n,\\quad\\text{即}\\quad b_{n+2}-b_{n+1}=b_{n+1}-b_n.$$<p>所以 $b_n$ 相邻两项差为常数，是等差数列。<\/p><p><b>第 3 步：用初值。<\/b>$b_0=a_0/1=1$，$b_1=a_1/2=2$，公差 $1$，所以 $b_n=1+n$。<\/p><p><b>第 4 步：写答案并检验。<\/b>$a_n=(n+1)2^n$。检验：$a_2=4a_1-4a_0=16-4=12$，公式给 $3\\times4=12$。✓<\/p><p><b>答：$a_n=(n+1)2^n$。<\/b>这也说明了重根时为什么通项要多一个 $n$ 倍的项：只用 $\\alpha2^n$ 一项无法同时满足两个初值。<\/p>"}]},"n3":{"unit":"nt","n":3,"title":"初等数论补练｜因子函数、剩余系与乘法阶","goal":"会由质因数分解求因子个数、因子和、gcd 与 lcm；会算 Euler 函数 $\\varphi(n)$；会用 Euler 定理和“乘法阶”把大指数的幂化小再取模。","sections":[{"id":"n3-s1","h":"质因数独立，化乘积为逐个选指数","html":"<p><b>这节解决什么：<\/b>知道 $n$ 的质因数分解后，它的所有正因子都能“按指数”一一列出，于是因子个数、因子之和、gcd、lcm 都能直接算。<\/p><p><b>原理：<\/b>设 $n=p_1^{e_1}p_2^{e_2}\\cdots p_r^{e_r}$（$p_i$ 是不同质数）。$n$ 的每个正因子 $d$ 都唯一地写成 $d=p_1^{a_1}\\cdots p_r^{a_r}$，其中 $0\\le a_i\\le e_i$。每个指数 $a_i$ 独立地有 $e_i+1$ 种取法。<\/p><ul><li><b>因子个数<\/b> $\\tau(n)=(e_1+1)(e_2+1)\\cdots(e_r+1)$。<\/li><li><b>因子和<\/b> $\\sigma(n)=\\prod_i(1+p_i+p_i^2+\\cdots+p_i^{e_i})$（把右边乘开，每一项恰好是一个因子）。<\/li><li><b>gcd<\/b>：每个质数取两数中<b>较小<\/b>的指数；<b>lcm<\/b>：取<b>较大<\/b>的指数。<\/li><\/ul><p><b>小例子：<\/b>$12=2^2\\cdot3$。$\\tau(12)=(2+1)(1+1)=6$（因子 1,2,3,4,6,12）；$\\sigma(12)=(1+2+4)(1+3)=7\\times4=28$，验证 $1+2+3+4+6+12=28$。✓<\/p>"},{"id":"n3-s2","h":"数互素剩余，再讨论乘法","html":"<p><b>这节解决什么：<\/b>计算 $a^k \\bmod n$ 当 $k$ 很大时怎么办——Euler 定理告诉我们指数可以按 $\\varphi(n)$ 取余。<\/p><p><b>记号：<\/b>$a\\equiv b\\pmod n$ 表示 $n\\mid a-b$。“模 $n$ 的剩余类”就是除以 $n$ 余数相同的整数归成一类，共 $n$ 类。<b>完全剩余系<\/b>：每类各取一个代表，如 $\\{0,1,\\dots,n-1\\}$。<b>既约剩余系<\/b>：只取与 $n$ 互素的那些类，例如模 8 的既约剩余系是 $\\{1,3,5,7\\}$。<\/p><p><b>Euler 函数<\/b> $\\varphi(n)$ = $1,\\dots,n$ 中与 $n$ 互素的个数 = 既约剩余系的大小。用容斥可得 $$\\varphi(n)=n\\prod_{p\\mid n}\\Bigl(1-\\frac1p\\Bigr).$$ 例：$\\varphi(12)=12\\cdot\\frac12\\cdot\\frac23=4$（即 1,5,7,11）。特别地 $\\varphi(p^k)=p^k-p^{k-1}$。<\/p><p><b>Euler 定理：<\/b>若 $\\gcd(a,n)=1$，则 $a^{\\varphi(n)}\\equiv1\\pmod n$。证明思路：<\/p><ol><li>设既约剩余系为 $r_1,\\dots,r_m$（$m=\\varphi(n)$）。<\/li><li>因为 $a$ 与 $n$ 互素，$ar_1,\\dots,ar_m$ 也都与 $n$ 互素且两两不同余（若 $ar_i\\equiv ar_j$，乘 $a$ 的逆得 $r_i\\equiv r_j$），所以它们只是 $r_1,\\dots,r_m$ 换了个顺序。<\/li><li>两组全部相乘：$a^m r_1\\cdots r_m\\equiv r_1\\cdots r_m\\pmod n$。<\/li><li>$r_1\\cdots r_m$ 与 $n$ 互素，可以两边约掉，得 $a^m\\equiv1$。<\/li><\/ol><p><b>用法：<\/b>$\\gcd(a,n)=1$ 时，$a^k\\equiv a^{k\\bmod\\varphi(n)}\\pmod n$。例：$3^{10}\\bmod 8$：$\\varphi(8)=4$，$10\\equiv2\\pmod4$，所以 $3^{10}\\equiv3^2=9\\equiv1$。<\/p>"},{"id":"n3-s3","h":"最小正阶只在单位元上讨论","html":"<p><b>这节解决什么：<\/b>$\\varphi(n)$ 不一定是让 $a^k\\equiv1$ 的最小指数。最小的那个叫“阶”，用它化简指数更彻底。<\/p><p><b>定义：<\/b>设 $\\gcd(a,n)=1$。使 $a^k\\equiv1\\pmod n$ 的<b>最小正整数<\/b> $k$ 叫 $a$ 模 $n$ 的<b>阶<\/b>，记作 $\\operatorname{ord}_n(a)$。（若 $\\gcd(a,n)\\gt1$，$a^k$ 永远不会 $\\equiv1$，阶无定义。）<\/p><p><b>关键性质：<\/b>若 $a^t\\equiv1$，则 $\\operatorname{ord}_n(a)\\mid t$。<\/p><ol><li>设 $d=\\operatorname{ord}_n(a)$，带余除法 $t=qd+s$，$0\\le s\\lt d$。<\/li><li>$1\\equiv a^t=(a^d)^q a^s\\equiv a^s$。<\/li><li>若 $s\\gt0$，就和“$d$ 最小”矛盾，所以 $s=0$，$d\\mid t$。<\/li><\/ol><p>由 Euler 定理 $a^{\\varphi(n)}\\equiv1$，所以<b>阶整除 $\\varphi(n)$<\/b>。求阶时只需检查 $\\varphi(n)$ 的因子，从小到大试。<\/p><p><b>例：<\/b>求 $\\operatorname{ord}_7(2)$。$\\varphi(7)=6$，因子 1,2,3,6。$2^1=2$，$2^2=4$，$2^3=8\\equiv1$，所以阶为 3。于是 $2^{100}\\equiv2^{100\\bmod3}=2^1=2\\pmod7$。<\/p>"}],"widget":null,"concepts":[{"id":"n3-c1","sec":"n3-s1","q":"$p^5$ 有几个正因子？","opts":["5","6","10","32"],"a":1,"ex":"选 6。$p^5$ 的因子是 $p^0,p^1,\\dots,p^5$，指数 0 到 5 共 6 个，即 $\\tau(p^5)=5+1$。易错选 5：忘了指数 0（因子 1）。"},{"id":"n3-c2","sec":"n3-s2","q":"乘 a 置换模 n 的既约剩余类需要什么？","opts":["a 偶数","n 素数","a 与 n 互素","a 与 n 同奇偶"],"a":2,"ex":"选“a 与 n 互素”。互素时 $a$ 有模 $n$ 的逆元，若 $ar_i\\equiv ar_j$ 可两边乘逆得 $r_i\\equiv r_j$，所以乘 $a$ 把既约剩余类一一对应地打乱顺序。易错选“n 素数”：这是充分但不必要，比如 $n=8,a=3$ 也行；而 $a$ 不与 $n$ 互素时（如 $n=8,a=2$）乘 2 会把 1 和 5 都送到 2，不再是一一对应。"},{"id":"n3-c3","sec":"n3-s2","q":"$\\varphi(p^k)$ 等于什么？","opts":["$p^k-p^{k-1}$","$p^{k-1}$","$p-1$","$p^k$"],"a":0,"ex":"选 $p^k-p^{k-1}$。$1,\\dots,p^k$ 中与 $p^k$ 不互素的恰是 $p$ 的倍数，共 $p^k/p=p^{k-1}$ 个，删掉即得。例 $\\varphi(8)=8-4=4$。易错选 $p-1$：那只是 $k=1$（$n$ 为素数）时的值。"},{"id":"n3-c4","sec":"n3-s3","q":"最小正阶与 Euler 函数有什么关系？","opts":["任意情况下相等","阶整除 Euler 函数","Euler 函数总整除阶","阶为负数也是允许的"],"a":1,"ex":"选“阶整除 Euler 函数”。因为 $a^{\\varphi(n)}\\equiv1$，而任何使 $a^t\\equiv1$ 的 $t$ 都被阶整除（带余除法，余数只能是 0）。易错选“任意情况下相等”：例如 $\\operatorname{ord}_7(2)=3$，但 $\\varphi(7)=6$，阶可以是 $\\varphi(n)$ 的真因子。"}],"methods":[{"id":"m-n3","title":"先分解模数，再限定可逆类","steps":["先把模数（和题中的数）分解质因数，写出每个质数的指数。","因子个数/因子和/gcd/lcm：按“每个质数的指数独立选”套公式。","大指数取模：先确认 $\\gcd(a,n)=1$（否则不能用 Euler 定理，也不能随便约分）。","算 $\\varphi(n)$，把指数对 $\\varphi(n)$ 取余；想更小就求阶：只试 $\\varphi(n)$ 的因子，从小到大。","最后用反复平方（$a^2,a^4,a^8,\\dots$）算小指数的幂，每步都取模。"]}],"problems":[{"id":"n3-p1","lv":"练习","src":"自编同类练习","stmt":"<p>求 360 的正因子数、正因子和，以及 $\\gcd(360,84)$ 和 $\\operatorname{lcm}(360,84)$。<\/p>","hints":["先分解：$360=2^3\\cdot3^2\\cdot5$，$84=2^2\\cdot3\\cdot7$。","$\\tau=(3+1)(2+1)(1+1)$；$\\sigma=(1+2+4+8)(1+3+9)(1+5)$。","gcd 每个质数取较小指数：$2^2\\cdot3^1\\cdot5^0\\cdot7^0$；lcm 取较大指数：$2^3\\cdot3^2\\cdot5\\cdot7$。"],"method":"m-n3","sol":"<p><b>第 1 步：分解。<\/b>$360=2^3\\cdot3^2\\cdot5$，$84=2^2\\cdot3\\cdot7$。<\/p><p><b>第 2 步：因子个数。<\/b>$\\tau(360)=(3+1)(2+1)(1+1)=4\\cdot3\\cdot2=24$。<\/p><p><b>第 3 步：因子和。<\/b>$$\\sigma(360)=(1+2+4+8)(1+3+9)(1+5)=15\\cdot13\\cdot6=1170.$$<\/p><p><b>第 4 步：gcd 与 lcm。<\/b>把两个数写成同一组质数的幂：$360=2^3\\,3^2\\,5^1\\,7^0$，$84=2^2\\,3^1\\,5^0\\,7^1$。<\/p><ul><li>$\\gcd=2^{\\min(3,2)}3^{\\min(2,1)}5^{0}7^{0}=4\\cdot3=12$。<\/li><li>$\\operatorname{lcm}=2^3\\cdot3^2\\cdot5\\cdot7=8\\cdot9\\cdot35=2520$。<\/li><\/ul><p>检验：$\\gcd\\times\\operatorname{lcm}=12\\times2520=30240=360\\times84$。✓<\/p><p><b>答：$\\tau(360)=24$，$\\sigma(360)=1170$，$\\gcd=12$，$\\operatorname{lcm}=2520$。<\/b><\/p>"},{"id":"n3-p2","lv":"练习","src":"自编同类练习","stmt":"<p>求 $\\varphi(72)$，并求 $5^{2026}\\bmod72$，结果写为最小非负剩余。<\/p>","hints":["$72=2^3\\cdot3^2$，用 $\\varphi(n)=n\\prod(1-1/p)$；再确认 $\\gcd(5,72)=1$，可以用 Euler 定理。","$\\varphi(72)=24$，所以 $5^{24}\\equiv1$，指数 $2026$ 对 24 取余：$2026=24\\times84+10$。","只需算 $5^{10}\\bmod72$：$5^2=25$，$5^4=625\\equiv49$，$5^8\\equiv49^2=2401\\equiv25$，$5^{10}=5^8\\cdot5^2\\equiv25\\cdot25$。"],"method":"m-n3","sol":"<p><b>第 1 步：求 $\\varphi(72)$。<\/b>$72=2^3\\cdot3^2$，<\/p>$$\\varphi(72)=72\\Bigl(1-\\frac12\\Bigr)\\Bigl(1-\\frac13\\Bigr)=72\\cdot\\frac12\\cdot\\frac23=24.$$<p><b>第 2 步：化简指数。<\/b>$\\gcd(5,72)=1$，由 Euler 定理 $5^{24}\\equiv1\\pmod{72}$。$2026=24\\times84+10$，所以 $$5^{2026}=(5^{24})^{84}\\cdot5^{10}\\equiv5^{10}\\pmod{72}.$$<\/p><p><b>第 3 步：反复平方。<\/b><\/p><ul><li>$5^2=25$。<\/li><li>$5^4=25^2=625=72\\times8+49\\equiv49$。<\/li><li>$5^8\\equiv49^2=2401=72\\times33+25\\equiv25$。<\/li><li>$5^{10}=5^8\\cdot5^2\\equiv25\\times25=625\\equiv49$。<\/li><\/ul><p><b>答：$\\varphi(72)=24$，$5^{2026}\\equiv49\\pmod{72}$。<\/b><\/p><p>补充：其实 $5^6=5^4\\cdot5^2\\equiv49\\times25=1225=72\\times17+1\\equiv1$，即 $\\operatorname{ord}_{72}(5)=6$；$2026\\equiv4\\pmod6$，$5^4\\equiv49$，结果一致。<\/p>"}],"variants":[{"id":"n3-v1","lv":"变种","src":"自编同类练习","stmt":"<p>求 $\\operatorname{ord}_{15}(2)$。指数为 2026 时，$2^{2026}$ 除以 15 余几？<\/p>","hints":["$\\gcd(2,15)=1$，$\\varphi(15)=15(1-\\frac13)(1-\\frac15)=8$，阶是 8 的因子：只可能是 1、2、4、8。","依次算 $2^1,2^2,2^4\\bmod15$，第一个等于 1 的就是阶。","$2^4=16\\equiv1$，阶为 4；再把 2026 对 4 取余：$2026=4\\times506+2$。"],"method":"m-n3","sol":"<p><b>第 1 步：可能的阶。<\/b>$\\gcd(2,15)=1$，$\\varphi(15)=15\\cdot\\frac23\\cdot\\frac45=8$，阶整除 8，只能是 1、2、4、8。<\/p><p><b>第 2 步：逐个试。<\/b>$2^1=2\\not\\equiv1$，$2^2=4\\not\\equiv1$，$2^4=16\\equiv1\\pmod{15}$。所以 $\\operatorname{ord}_{15}(2)=4$。<\/p><p><b>第 3 步：化简指数。<\/b>$2026=4\\times506+2$，$$2^{2026}=(2^4)^{506}\\cdot2^2\\equiv1\\cdot4=4\\pmod{15}.$$<\/p><p><b>答：$\\operatorname{ord}_{15}(2)=4$，$2^{2026}$ 除以 15 余 4。<\/b><\/p>"}],"extensions":[]},"dg1":{"unit":"geometry-count","n":1,"title":"组合几何｜分格与单调子序列","goal":"学会两种抽屉原理的用法：几何题把区域切成小格当抽屉；子序列题给每一项贴一个“（最长递增长度, 最长递减长度）”标签当抽屉。","sections":[{"id":"dg1-s1","h":"分格前先算每个格子的直径","html":"<p><b>这节解决什么：<\/b>“区域里放很多点，证明必有两点很近”这类题。工具是<b>抽屉原理<\/b>：把多于 $m$ 个物体放进 $m$ 个抽屉，必有一个抽屉至少有 2 个物体。<\/p><p><b>做法：<\/b><\/p><ol><li>把边长 $s$ 的正方形横竖各等分 $k$ 份，得到 $k^2$ 个边长 $s/k$ 的小正方形（小格）作为抽屉。<\/li><li>分界线上的点会同时属于两个格子，要事先规定它只归一个格子（比如归左边、下边的格），这样每个点恰好进一个抽屉。<\/li><li>同一小格内两点的距离不超过小格的对角线 $\\sqrt2\\,s/k$（格内最远的两点是相对的两个顶点）。<\/li><li>若点数 $\\gt k^2$，必有两点在同一格，它们的距离 $\\le\\sqrt2\\,s/k$。<\/li><\/ol><p><b>例：<\/b>单位正方形（$s=1$）放 5 个点，分成 $2\\times2$ 个格，必有两点距离 $\\le\\sqrt2/2\\approx0.707$。<\/p><p>易错：题目要“严格小于”时，要检查等号能不能取到（两点恰好在小格两个对角顶点），必要时换更细的分法。<\/p>"},{"id":"dg1-s2","h":"把最长递增和递减长度当作标签","html":"<p><b>这节解决什么：<\/b>Erdős–Szekeres 定理：足够长的数列里一定有较长的递增或递减子序列。<\/p><p><b>记号：<\/b><b>子序列<\/b>是从原序列中按原来顺序挑出若干项（可以跳着挑），例如 $3,1,4,1,5$ 中 $3,4,5$ 是子序列。<b>严格递增<\/b>指后一项比前一项大。<\/p><p><b>标签：<\/b>对互不相同的实数 $x_1,\\dots,x_N$，定义<\/p><ul><li>$I_i$ = 以第 $i$ 项<b>结尾<\/b>的最长递增子序列的长度；<\/li><li>$D_i$ = 以第 $i$ 项<b>结尾<\/b>的最长递减子序列的长度。<\/li><\/ul><p>给第 $i$ 项贴标签 $(I_i,D_i)$。例：序列 $3,1,2$：第 1 项标签 $(1,1)$；第 2 项 1 比 3 小，标签 $(1,2)$；第 3 项 2 可以接在 1 后面递增，也可接在 3 后面递减，标签 $(2,2)$。<\/p><p><b>关键：不同位置的标签一定不同。<\/b>设 $i\\lt j$：<\/p><ol><li>若 $x_i\\lt x_j$：把 $x_j$ 接在“以 $x_i$ 结尾的最长递增子序列”后面，得到更长的递增子序列，所以 $I_j\\ge I_i+1$。<\/li><li>若 $x_i\\gt x_j$：同理接在递减子序列后面，$D_j\\ge D_i+1$。<\/li><\/ol><p>两种情况下标签都不同（数互不相同，只有这两种情况）。<\/p><p><b>结论：<\/b>若既没有长度 $r+1$ 的递增子序列，也没有长度 $s+1$ 的递减子序列，则 $1\\le I_i\\le r$，$1\\le D_i\\le s$，标签最多 $rs$ 种，于是 $N\\le rs$。所以<b>任何 $rs+1$ 个互不相同的数，必有长 $r+1$ 的递增或长 $s+1$ 的递减子序列<\/b>。<\/p>"}],"widget":null,"concepts":[{"id":"dg1-c1","sec":"dg1-s1","q":"单位正方形分成 4 个等方格，同格两点最大距离是多少？","opts":["$1/4$","$1/2$","$\\sqrt2/2$","$\\sqrt2$"],"a":2,"ex":"选 $\\sqrt2/2$。4 个等格每格边长 $1/2$，格内最远的两点是对角顶点，距离 $\\sqrt{(1/2)^2+(1/2)^2}=\\sqrt2/2$。易错选 $1/2$：那是边长，忽略了沿对角线方向的距离更长。"},{"id":"dg1-c2","sec":"dg1-s1","q":"分格有边界点时需要什么？","opts":["可以漏掉边界点","把边界点各指定到一个格子","边界点必须复制到多个格子","边界点都算在左上角"],"a":1,"ex":"选“把边界点各指定到一个格子”。抽屉原理要求每个点恰好进一个抽屉；不规定的话，分界线上的点可能被数两次或漏掉。易错选“边界点必须复制到多个格子”：复制会让点数变多，抽屉原理的计数就不成立了。"},{"id":"dg1-c3","sec":"dg1-s2","q":"若 $i\\lt j$ 且 $x_i\\lt x_j$，怎样利用以 $i$ 结尾的递增子序列？","opts":["在最前方加 j","在末尾加 j","必须接上相邻项 i+1","只能得到递减子序列"],"a":1,"ex":"选“在末尾加 j”。$i\\lt j$ 说明 $x_j$ 在 $x_i$ 后面，$x_i\\lt x_j$ 说明值变大，所以把 $x_j$ 接到以 $x_i$ 结尾的递增子序列<b>末尾<\/b>，仍是递增子序列，长度加 1。易错选“必须接上相邻项 i+1”：子序列允许跳项，不要求相邻。"},{"id":"dg1-c4","sec":"dg1-s2","q":"若递增、递减长度均不超过 3，最多有几种标签？","opts":["3","6","9","27"],"a":2,"ex":"选 9。标签 $(I,D)$ 的两个分量各自只能取 1、2、3，共 $3\\times3=9$ 种。所以 10 个互不相同的数必有长 4 的递增或递减子序列。易错选 27 或 6：标签只有两个分量，是乘法 $3\\times3$，不是 $3^3$ 或 $3+3$。"}],"methods":[{"id":"m-dg1","title":"选能控制目标的抽屉","steps":["想清楚：两个对象落在同一个抽屉里，能推出题目要的结论吗？（几何：同格⇒距离小；序列：同标签⇒矛盾。）","数清抽屉个数 $m$ 与对象个数，确认对象数 $\\gt m$；几何题规定好边界点的归属。","子序列题：用标签 $(I_i,D_i)$（以第 $i$ 项结尾的最长递增、递减长度），证明不同位置标签不同。","反证写法：“假设没有长 $r+1$ 递增、也没有长 $s+1$ 递减，则标签至多 $rs$ 种，与项数 $\\gt rs$ 矛盾。”","易错：构造反例时要分别检查最长递增和最长递减的长度，不能只看一种。"]}],"problems":[{"id":"dg1-p1","lv":"练习","src":"自编同类练习","stmt":"<p>单位正方形内任取 10 个点，证明两点距离不超过 $\\sqrt2/3$。<\/p>","hints":["目标距离 $\\sqrt2/3$ 正好是边长 $1/3$ 的小正方形的对角线长。","把单位正方形等分成 $3\\times3=9$ 个小正方形，每个边长 $1/3$，边界点规定归属。","10 个点放进 9 个格，由抽屉原理必有一格有 2 个点；同格两点距离不超过对角线 $\\sqrt{(1/3)^2+(1/3)^2}$。"],"method":"m-dg1","sol":"<p><b>证明：<\/b><\/p><p><b>第 1 步：分格。<\/b>把单位正方形的每条边三等分，连线得到 9 个边长为 $\\frac13$ 的小正方形。分界线上的点规定只属于其中一个相邻小正方形，这样每个点恰好属于一个小正方形。<\/p><p><b>第 2 步：抽屉原理。<\/b>10 个点放入 9 个小正方形，$10\\gt9$，所以至少有一个小正方形含有两个点 $P,Q$。<\/p><p><b>第 3 步：估计距离。<\/b>小正方形内任意两点的距离不超过它的对角线长：$$|PQ|\\le\\sqrt{\\Bigl(\\tfrac13\\Bigr)^2+\\Bigl(\\tfrac13\\Bigr)^2}=\\frac{\\sqrt2}{3}.$$<\/p><p><b>所以必有两点距离不超过 $\\sqrt2/3$。<\/b><\/p>"},{"id":"dg1-p2","lv":"练习","src":"自编同类练习","stmt":"<p>证明任何 13 个互异实数组成的序列必有长度 4 的严格递增子序列，或长度 5 的严格递减子序列。<\/p>","hints":["对每个位置 $i$ 定义标签 $(I_i,D_i)$：以 $x_i$ 结尾的最长严格递增、严格递减子序列的长度。","反证：若没有长 4 的递增子序列，则 $I_i\\le3$；若没有长 5 的递减子序列，则 $D_i\\le4$。标签至多 $3\\times4=12$ 种。","证明任意 $i\\lt j$ 标签不同：若 $x_i\\lt x_j$ 则 $I_j\\ge I_i+1$；若 $x_i\\gt x_j$ 则 $D_j\\ge D_i+1$。13 项需要 13 个不同标签，矛盾。"],"method":"m-dg1","sol":"<p><b>要证：<\/b>13 个互不相同的实数 $x_1,\\dots,x_{13}$ 中，必有长 4 的严格递增子序列或长 5 的严格递减子序列。<\/p><p><b>第 1 步：定义标签。<\/b>对每个 $i$，令 $I_i$ 为以 $x_i$ 结尾的最长严格递增子序列的长度，$D_i$ 为以 $x_i$ 结尾的最长严格递减子序列的长度（只含 $x_i$ 本身时长度为 1，所以 $I_i,D_i\\ge1$）。<\/p><p><b>第 2 步：不同位置标签不同。<\/b>任取 $i\\lt j$。因为数互不相同，只有两种情况：<\/p><ul><li>$x_i\\lt x_j$：在以 $x_i$ 结尾的最长递增子序列末尾添上 $x_j$，得到以 $x_j$ 结尾、长 $I_i+1$ 的递增子序列，所以 $I_j\\ge I_i+1\\gt I_i$。<\/li><li>$x_i\\gt x_j$：同理 $D_j\\ge D_i+1\\gt D_i$。<\/li><\/ul><p>所以 $(I_i,D_i)\\ne(I_j,D_j)$。<\/p><p><b>第 3 步：反证。<\/b>假设既没有长 4 的递增子序列，也没有长 5 的递减子序列。则 $I_i\\in\\{1,2,3\\}$，$D_i\\in\\{1,2,3,4\\}$，标签至多 $3\\times4=12$ 种。但 13 个位置的标签两两不同，需要 13 种，矛盾。<\/p><p><b>结论：必有长 4 的严格递增子序列或长 5 的严格递减子序列。<\/b><\/p>"}],"variants":[{"id":"dg1-v1","lv":"变种","src":"自编同类练习","stmt":"<p>构造 12 个互异实数的序列，其最长递增长度为 3、最长递减长度为 4。<\/p>","hints":["目标：最长递增恰为 3、最长递减恰为 4，且共 $3\\times4=12$ 项，说明上一题的 13 是最优的。","把 12 个数分成 3 块，每块 4 个数<b>内部递减<\/b>；后面的块整体比前面的块大。","例如 $4,3,2,1,\\ 8,7,6,5,\\ 12,11,10,9$。检查：递减子序列不能跨块（跨块值变大），递增子序列每块最多取一个。"],"method":"m-dg1","sol":"<p><b>构造：<\/b>$$4,3,2,1,\\quad 8,7,6,5,\\quad 12,11,10,9.$$<\/p><p><b>验证最长递增长度 = 3：<\/b><\/p><ul><li>同一块内是递减的，所以一个递增子序列在每块中至多取 1 项；共 3 块，长度 $\\le3$。<\/li><li>$1,5,9$ 是长 3 的递增子序列，所以最长恰为 3。<\/li><\/ul><p><b>验证最长递减长度 = 4：<\/b><\/p><ul><li>后面块的每个数都比前面块的每个数大，所以递减子序列不能从一块跳到后一块，只能在一块内，长度 $\\le4$。<\/li><li>$4,3,2,1$ 是长 4 的递减子序列，所以最长恰为 4。<\/li><\/ul><p><b>所以该序列满足要求。<\/b>它说明 Erdős–Szekeres 定理中的 $rs+1$ 不能改小为 $rs$。<\/p>"}],"extensions":[]},"code1":{"unit":"geometry-count","n":2,"title":"简单编码理论｜Hamming 距离入门（预习）","goal":"课程安排里列有“简单编码理论”。这里是入门预习：会算 Hamming 距离，会由最小距离判断能检出几个错、纠正几个错。课堂具体要求以老师讲的为准。","sections":[{"id":"code1-s1","h":"码字之间要留多大间隔","html":"<p><b>这节解决什么：<\/b>传输 0/1 串时可能有位出错。为了发现或改正错误，只用一部分串作为“合法消息”（码字），并让码字之间“差得足够远”。“差多远”用 Hamming 距离衡量。<\/p><p><b>定义：<\/b><\/p><ul><li><b>字<\/b>：长度为 $n$ 的 0/1 串，如 $0110$。<\/li><li><b>Hamming 距离<\/b> $d(u,v)$：$u,v$ 对应位置上不同的位数。例：$d(0110,0011)$：第 2 位 1 vs 0 不同，第 4 位 0 vs 1 不同，其余相同，所以距离为 2。<\/li><li><b>码<\/b>：一组选定的字（码字）。<b>最小距离<\/b> $d_{\\min}$：所有不同码字两两距离中的最小值。<\/li><\/ul><p><b>三角不等式：<\/b>$d(u,v)\\le d(u,w)+d(w,v)$。理由：逐位看，若 $u,v$ 在某位不同，则 $w$ 在这一位要么和 $u$ 不同、要么和 $v$ 不同，所以这一位在右边至少被数一次；对所有位求和即得。<\/p>"},{"id":"code1-s2","h":"检错与纠错看不同的半径","html":"<p><b>这节解决什么：<\/b>知道 $d_{\\min}$ 后，判断这个码能保证<b>检出<\/b>多少个错误、<b>纠正<\/b>多少个错误。<\/p><p><b>模型：<\/b>发送码字 $c$，收到字 $r$，出错位数就是 $d(c,r)$。<\/p><ul><li><b>检错<\/b>：只要求发现“出错了”。若 $d_{\\min}\\ge e+1$，出错 $1\\sim e$ 位后 $r$ 离 $c$ 的距离在 $1$ 到 $e$ 之间，而其他码字离 $c$ 至少 $e+1$，所以 $r$ 不可能恰好是另一个码字，接收方发现 $r$ 不是码字，即检出错误。<b>可保证检出 $d_{\\min}-1$ 个错。<\/b><\/li><li><b>纠错<\/b>：把 $r$ 改成离它最近的码字。若 $d_{\\min}\\ge2t+1$，以每个码字为中心、半径 $t$ 的“球”（距离 $\\le t$ 的所有字）互不相交（否则由三角不等式两码字距离 $\\le2t$），所以出错 $\\le t$ 位时最近的码字唯一、就是 $c$。<b>可保证纠正 $\\lfloor(d_{\\min}-1)/2\\rfloor$ 个错<\/b>（$\\lfloor\\cdot\\rfloor$ 表示向下取整）。<\/li><\/ul><p><b>例：<\/b>重复码 $\\{000,111\\}$，$d_{\\min}=3$：可检 2 个错，或纠 1 个错。发 $000$ 错一位收到 $010$，离 $000$ 距离 1、离 $111$ 距离 2，纠成 $000$，正确。但若错两位收到 $110$，会被纠成 $111$——纠错能力只保证 1 位。<\/p>"}],"widget":null,"concepts":[{"id":"code1-c1","sec":"code1-s1","q":"$d(0011,1010)$ 是多少？","opts":["1","2","3","4"],"a":1,"ex":"选 2。逐位比较 $0011$ 与 $1010$：第 1 位 0/1 不同，第 2 位 0/0 相同，第 3 位 1/1 相同，第 4 位 1/0 不同，共 2 位不同。易错选 3 或 1：通常是逐位对比时错位，建议上下对齐写出来比较。"},{"id":"code1-c2","sec":"code1-s2","q":"最小距离为 4 可保证检测几处错误？","opts":["1","2","3","4"],"a":2,"ex":"选 3。可检错数 $=d_{\\min}-1=3$：错 3 位以内，收到的字离原码字距离 1~3，不可能是另一个码字（它们距离至少 4）。易错选 4：错 4 位可能正好把一个码字变成另一个码字，就检不出来了。"},{"id":"code1-c3","sec":"code1-s2","q":"最小距离为 4 可保证纠正几处错误？","opts":["1","2","3","4"],"a":0,"ex":"选 1。要 $2t+1\\le4$，$t\\le1.5$，最大整数 $t=1$，即 $\\lfloor(4-1)/2\\rfloor=1$。易错选 2：错 2 位时收到的字可能离两个码字都是 2（例如 $0000$ 和 $1111$ 之间的 $0011$），无法确定改成哪个。"},{"id":"code1-c4","sec":"code1-s2","q":"收到的字距两个码字都为 2，能唯一纠两错吗？","opts":["能，选编号较小的","能，重复读取","不能从距离唯一确定","当字是偶数长度就能"],"a":2,"ex":"选“不能从距离唯一确定”。纠错按“最近的码字”来改，而这里两个码字一样近，都可能是发出的那一个，没有依据选其中一个。易错选“能，选编号较小的”：这只是随便猜，猜错的概率是一半，不算纠正。"}],"methods":[{"id":"m-code1","title":"算距离，再决定保证","steps":["列出所有码字，两两计算 Hamming 距离（上下对齐逐位比较），取最小值得 $d_{\\min}$。","保证检错数 $=d_{\\min}-1$；保证纠错数 $=\\lfloor(d_{\\min}-1)/2\\rfloor$。","要说明“不能再多”时，构造一个具体的收到字：它离两个码字一样近（纠错失败），或者它本身就是另一个码字（检错失败）。"]}],"problems":[{"id":"code1-p1","lv":"练习","src":"自编同类练习","stmt":"<p>对 $\\{0000,1111\\}$，求保证检错数和纠错数，并给一个二错歧义接收字。<\/p>","hints":["两个码字 $0000$ 与 $1111$ 四位全不同，$d_{\\min}=4$。","套公式：检错 $d_{\\min}-1$，纠错 $\\lfloor(d_{\\min}-1)/2\\rfloor$。","歧义字：取恰好两个 1 的字，如 $0011$，算它到两个码字的距离。"],"method":"m-code1","sol":"<p><b>第 1 步：最小距离。<\/b>只有两个码字，$d(0000,1111)=4$，所以 $d_{\\min}=4$。<\/p><p><b>第 2 步：检错。<\/b>保证检错数 $=d_{\\min}-1=3$。理由：错 1~3 位后收到的字含 1~3 个与原码字不同的位，不会恰好变成另一个码字。<\/p><p><b>第 3 步：纠错。<\/b>保证纠错数 $=\\lfloor(4-1)/2\\rfloor=1$。理由：错 1 位时，收到的字离原码字距离 1，离另一个码字距离 3，最近的码字唯一。<\/p><p><b>第 4 步：二错歧义的例子。<\/b>收到 $0011$：$d(0011,0000)=2$，$d(0011,1111)=2$。它可能是 $0000$ 错了后两位，也可能是 $1111$ 错了前两位，无法唯一纠正。<\/p><p><b>答：保证检 3 个错、纠 1 个错；$0011$ 是二错歧义接收字。<\/b><\/p>"},{"id":"code1-p2","lv":"练习","src":"自编同类练习","stmt":"<p>所有三位二元偶校验字组成码。列出码字与最小距离，说明一错能否检测和纠正。<\/p>","hints":["“偶校验”指字中 1 的个数为偶数。长度 3 的字共 8 个，把 1 的个数为 0 或 2 的挑出来。","任意两个不同的偶数重量字至少差 2 位（差 1 位会改变 1 的个数的奇偶）。一位翻转后 1 的个数变奇数，所以能检出。","纠错要 $d_{\\min}\\ge3$；看收到 $100$ 时，离它距离 1 的码字有几个。"],"method":"m-code1","sol":"<p><b>第 1 步：列码字。<\/b>长度 3、1 的个数为偶数（0 或 2）：$000,011,101,110$，共 4 个。<\/p><p><b>第 2 步：最小距离。<\/b>两两计算：$d(000,011)=d(000,101)=d(000,110)=2$，$d(011,101)=d(011,110)=d(101,110)=2$。所以 $d_{\\min}=2$。<\/p><p><b>第 3 步：一错能否检出。<\/b>$d_{\\min}-1=1$，能保证检出 1 个错。直观理由：翻转一位会使 1 的个数奇偶改变，收到的字是奇数个 1，一定不是码字。<\/p><p><b>第 4 步：一错能否纠正。<\/b>$\\lfloor(2-1)/2\\rfloor=0$，不能保证纠正。反例：收到 $100$，它离 $000$ 距离 1（第 1 位错），离 $110$ 距离 1（第 2 位错），离 $101$ 也是距离 1（第 3 位错），有多个同样近的码字，无法确定原码字。<\/p><p><b>答：码字 $000,011,101,110$，$d_{\\min}=2$；能检出一个错，但不能纠正一个错。<\/b><\/p>"}],"variants":[],"extensions":[]}});
LESSONS.count2.variants.push(...[{"id":"count2-v2","lv":"练习","src":"自编同类练习","stmt":"<p>二元变量 $X,Y$ 的联合概率按 $(0,0),(0,1),(1,0),(1,1)$ 依次为 $3/8,1/8,1/8,3/8$。求两边的边际分布，判断是否独立，并求 $\\operatorname{Var}(X+Y)$。<\/p>","hints":["列 2×2 表：行 $X=0,1$，列 $Y=0,1$。边际 = 行和、列和。","$P(X=1)=P(Y=1)=\\frac12$；比较 $P(X=1,Y=1)=\\frac38$ 与 $\\frac12\\cdot\\frac12=\\frac14$。","$\\operatorname{Cov}(X,Y)=E[XY]-E[X]E[Y]=\\frac38-\\frac14$；$\\operatorname{Var}(X+Y)=\\operatorname{Var}X+\\operatorname{Var}Y+2\\operatorname{Cov}(X,Y)$。"],"sol":"<p><b>第 1 步：边际分布。<\/b>$P(X=0)=\\frac38+\\frac18=\\frac12$，$P(X=1)=\\frac18+\\frac38=\\frac12$；同理 $P(Y=0)=P(Y=1)=\\frac12$。<\/p><p><b>第 2 步：独立吗？<\/b>$P(X=1,Y=1)=\\frac38$，而 $P(X=1)P(Y=1)=\\frac14$，不相等，所以<b>不独立<\/b>。<\/p><p><b>第 3 步：方差。<\/b>$X,Y$ 都是 0/1 变量，$E[X]=E[Y]=\\frac12$，$\\operatorname{Var}X=E[X^2]-(E[X])^2=\\frac12-\\frac14=\\frac14$，$\\operatorname{Var}Y=\\frac14$。$E[XY]=P(X=1,Y=1)=\\frac38$，所以 $\\operatorname{Cov}(X,Y)=\\frac38-\\frac14=\\frac18$。<\/p>$$\\operatorname{Var}(X+Y)=\\frac14+\\frac14+2\\cdot\\frac18=\\frac34.$$<p><b>检验（直接列分布）：<\/b>$X+Y$ 取 0、1、2 的概率为 $\\frac38,\\frac14,\\frac38$，均值 $0+\\frac14+\\frac34=1$，方差 $\\frac38(0-1)^2+\\frac14\\cdot0+\\frac38(2-1)^2=\\frac34$。✓<\/p><p><b>答：两边边际都是 $P(0)=P(1)=\\frac12$；不独立；$\\operatorname{Var}(X+Y)=\\frac34$。<\/b><\/p>","method":"m-joint-table"}]);
LESSONS.count2.methods.push(...[{"id":"m-joint-table","title":"由联合分布读边际与协方差","steps":["把联合分布列成表：行是 $X$ 的取值，列是 $Y$ 的取值，格子里是 $P(X=x,Y=y)$。","边际分布：$P(X=x)$ 是这一行的和，$P(Y=y)$ 是这一列的和。","判断独立：检查每一格是否都等于“行边际 × 列边际”；有一格不等就不独立。","求 $\\operatorname{Var}(X+Y)=\\operatorname{Var}X+\\operatorname{Var}Y+2\\operatorname{Cov}(X,Y)$，其中 $\\operatorname{Cov}(X,Y)=E[XY]-E[X]E[Y]$；或者直接列出 $X+Y$ 的分布来算。"]}]);

LESSONS.count2.variants.push(
  {"id": "count2-ordered-collision", "lv": "变种", "src": "自编练习 · 有序试验与最小阈值", "stmt": "<p>每台终端独立、等概率地从 $24$ 个标签中选一个。求让“至少两台选了相同标签”的概率严格大于 $1/2$ 所需的最少台数。先用组合数写无碰撞的有利结果数，再验算阈值两侧。</p>", "hints": ["给终端编号 $1,\\dots,k$。一次结果是一个长 $k$ 的标签序列，共 $24^k$ 个，等可能。", "无碰撞（标签两两不同）的序列：先选 $k$ 个不同标签 $\\binom{24}k$，再分给 $k$ 台终端 $k!$ 种，共 $\\binom{24}k k!=24\\cdot23\\cdots(24-k+1)$。", "无碰撞概率 $Q_k$ 满足 $Q_{k+1}=Q_k\\cdot\\frac{24-k}{24}$。算 $Q_6$ 和 $Q_7$ 与 $\\frac12$ 比较。"], "method": "m-prob-space", "sol": "<p><b>第 1 步：样本空间。<\/b>终端编号 $1,\\dots,k$，一次结果是标签序列 $(t_1,\\dots,t_k)$，共 $24^k$ 个，等可能。<\/p><p><b>第 2 步：无碰撞的序列数。<\/b>$1\\le k\\le24$ 时，先选出 $k$ 个不同标签（$\\binom{24}k$ 种），再把它们一一分给 $k$ 台终端（$k!$ 种），共 $\\binom{24}kk!$ 个。只写 $\\binom{24}k$ 会漏掉分派的 $k!$ 种。$k\\gt24$ 时无碰撞不可能。<\/p><p>所以无碰撞概率 $$Q_k=\\frac{\\binom{24}{k}k!}{24^k}=\\frac{24\\cdot23\\cdots(25-k)}{24^k},\\qquad Q_{k+1}=Q_k\\cdot\\frac{24-k}{24}.$$ 后者说明 $Q_k$ 随 $k$ 不增，碰撞概率 $1-Q_k$ 不减。<\/p><p><b>第 3 步：阈值两侧。<\/b>$$Q_6=\\frac{24\\cdot23\\cdot22\\cdot21\\cdot20\\cdot19}{24^6}=\\frac{168245}{331776}\\approx0.5071\\gt\\frac12,$$ $$Q_7=Q_6\\cdot\\frac{18}{24}=\\frac{168245}{442368}\\approx0.3803\\lt\\frac12.$$ 所以 6 台时碰撞概率 $\\approx0.493\\lt\\frac12$，7 台时 $\\approx0.620\\gt\\frac12$。<\/p><p><b>答：最少 7 台。<\/b><\/p>"},
  {"id": "count2-weighted-outcomes", "lv": "变种", "src": "自编练习 · 非等概率样本", "stmt": "<p>一次巡检只会产生 $a,b,c,d$ 四种结果，概率分别为 $1/2,1/4,1/8,1/8$。系统甲在 $\\{a,c\\}$ 报警，乙在 $\\{a,b\\}$ 报警，丙在 $\\{b,c,d\\}$ 报警。求至少两套报警的概率和报警套数的期望。两者能否只用满足条件的结果个数计算？</p>", "hints": ["四种结果不等可能，要用概率加权。先对每个结果写出有几套系统报警。", "$a$：甲、乙报警（2 套）；$b$：乙、丙（2 套）；$c$：甲、丙（2 套）；$d$：只有丙（1 套）。", "$P(X\\ge2)=P(a)+P(b)+P(c)$；$E[X]=\\sum(\\text{报警套数})\\times(\\text{概率})$。"], "method": "m-prob-space", "sol": "<p><b>第 1 步：逐个结果数报警套数 $X$。<\/b><\/p><ul><li>$a$（概率 $\\frac12$）：甲、乙报警，$X=2$。<\/li><li>$b$（概率 $\\frac14$）：乙、丙报警，$X=2$。<\/li><li>$c$（概率 $\\frac18$）：甲、丙报警，$X=2$。<\/li><li>$d$（概率 $\\frac18$）：只有丙，$X=1$。<\/li><\/ul><p><b>第 2 步：至少两套。<\/b>$$P(X\\ge2)=\\frac12+\\frac14+\\frac18=\\frac78.$$<\/p><p><b>第 3 步：期望。<\/b>$$E[X]=2\\cdot\\frac12+2\\cdot\\frac14+2\\cdot\\frac18+1\\cdot\\frac18=\\frac{14}8+\\frac18=\\frac{15}8.$$<\/p><p><b>第 4 步：能否只数个数？<\/b>不能。若用“满足条件的结果个数 / 4”，会得到 $P(X\\ge2)=\\frac34$，这等于假设四种结果等可能，与题设矛盾。<\/p><p><b>另一种算期望的方法：<\/b>令 $I_{\\text{甲}},I_{\\text{乙}},I_{\\text{丙}}$ 为三套系统的报警指示变量，$P(I_{\\text{甲}}=1)=P(\\{a,c\\})=\\frac58$，$P(I_{\\text{乙}}=1)=P(\\{a,b\\})=\\frac34$，$P(I_{\\text{丙}}=1)=P(\\{b,c,d\\})=\\frac12$，$E[X]=\\frac58+\\frac34+\\frac12=\\frac{15}8$，一致（不需要三者独立）。<\/p><p><b>答：$P(X\\ge2)=\\frac78$，$E[X]=\\frac{15}8$；不能只用结果个数。<\/b><\/p>"}
);
LESSONS.g3.variants.push(
  {"id": "g3-triangle-types", "lv": "变种", "src": "自编练习 · 实边与虚边的双计数", "stmt": "<p>从 $K_{3,3}$ 出发，在同一侧任选两个顶点加一条边，把未出现的边标为虚边。把每组 3 个顶点按其中的实边数分为 $0,1,2,3$ 四类。不逐组枚举，求各类个数，并用同侧新加的边核对实三角形数。</p>", "hints": ["先定义“角”：取顶点 $v$ 和另外两点 $u,w$，记作角 $u$–$v$–$w$。$vu,vw$ 都是实边叫<b>两实角</b>，一实一虚叫<b>混合角</b>。度为 $d$ 的点（共 $6$ 点，其余 $5$ 点里 $d$ 个实邻点、$5-d$ 个虚邻点）有 $\\binom d2$ 个两实角、$d(5-d)$ 个混合角。先写出 $6$ 个点的度数，别忘了新加的边。", "度数是 $4,4,3,3,3,3$：两实角 $2\\binom42+4\\binom32=24$，混合角 $2\\cdot4\\cdot1+4\\cdot3\\cdot2=32$。再看一个三点组含几个两实角、几个混合角：$3$ 条实边 $\\to(3,0)$，$2$ 条 $\\to(1,2)$，$1$ 条 $\\to(0,2)$，$0$ 条 $\\to(0,0)$。", "设实边数为 $3,2,1$ 的组各有 $x,y,z$ 个：$3x+y=24$，$2y+2z=32$。$K_{3,3}$ 是二部图没有三角形，实三角形必含新边，第三点只能是对侧 $3$ 个点，$x=3$。解出 $y,z$，再用总数 $\\binom63=20$ 求 $0$ 实边的组数。"], "method": "m-double-count", "sol": "<p><b>这题在做什么</b>：$6$ 个点共有 $\\binom63=20$ 个三点组，每组里 $3$ 对点有的是实边、有的是虚边。逐组列 $20$ 组容易漏，改成用“角”从两个方向数同一批对象（双计数），列方程求解。</p><p><b>术语</b>：取一个顶点 $v$ 和另外两点 $u,w$，叫以 $v$ 为顶点的角 $u$–$v$–$w$。$vu,vw$ 都是实边叫<b>两实角</b>；一条实、一条虚叫<b>混合角</b>。每个三点组恰含 $3$ 个角（三个点各当一次顶点）。</p><p><b>第 1 步：度数。</b>设两侧为 $\\{a_1,a_2,a_3\\}$ 与 $\\{b_1,b_2,b_3\\}$，新边为 $a_1a_2$。$a_1,a_2$ 各连 $3$ 个 $b$ 再加对方，度为 $4$；其余 $4$ 点度为 $3$。共 $9+1=10$ 条实边，核对：度数和 $2\\cdot4+4\\cdot3=20=2\\times10$。</p><p><b>第 2 步：按顶点数角。</b>度为 $d$ 的点，从 $d$ 个实邻点里选 $2$ 个得两实角 $\\binom d2$ 个；一个实邻点配一个虚邻点得混合角 $d(5-d)$ 个。$$\\text{两实角}=2\\binom42+4\\binom32=12+12=24,$$ $$\\text{混合角}=2\\cdot4\\cdot1+4\\cdot3\\cdot2=8+24=32.$$</p><p><b>第 3 步：按三点组数角。</b>设实边数为 $3,2,1,0$ 的组分别有 $x,y,z,w$ 个。</p><ul><li>$3$ 条实边：三个角都是两实角，贡献 $3$ 个两实角、$0$ 个混合角。</li><li>$2$ 条实边（$u$–$v$–$w$ 实，$uw$ 虚）：在 $v$ 处是两实角；在 $u$ 处 $uv$ 实、$uw$ 虚，是混合角；$w$ 处同理。贡献 $1$ 个两实角、$2$ 个混合角。</li><li>$1$ 条实边 $uv$：$u$ 处、$v$ 处各是混合角，$w$ 处两条虚边不算。贡献 $0$ 个两实角、$2$ 个混合角。</li><li>$0$ 条实边：什么都不贡献。</li></ul><p>两种数法相等：$$3x+y=24,\\qquad 2y+2z=32.$$</p><p><b>第 4 步：直接求 $x$。</b>$K_{3,3}$ 是二部图，同侧之间没有边，所以没有三角形；实三角形必须用到新边 $a_1a_2$，第三点要同时与 $a_1,a_2$ 相邻，只能是 $b_1,b_2,b_3$（$a_3$ 与 $a_1,a_2$ 都不相邻）。所以 $x=3$。</p><p><b>第 5 步：解方程。</b>$y=24-3\\cdot3=15$；$z=16-15=1$；$w=20-3-15-1=1$。</p><p><b>核对</b>：$0$ 实边的组只能是 $\\{b_1,b_2,b_3\\}$，$1$ 个；$1$ 实边的组只能是 $\\{a_1,a_2,a_3\\}$（只有 $a_1a_2$），$1$ 个。与计算一致。</p><p><b>答</b>：实边数为 $0,1,2,3$ 的三点组分别有 $1,1,15,3$ 个。</p><p><b>易错</b>：只列 $3x+y=24$ 一个方程解不出 $y,z$，必须再数混合角；两实边的组除了 $1$ 个两实角还有 $2$ 个混合角，别漏；度数要算上新加的那条边。</p>"}
);
LESSONS.g1.variants.push(
  {"id": "g1-deletion-cycle", "lv": "变种", "src": "自编练习 · 删点与最长路", "stmt": "<p>某简单图有 $9$ 个顶点和 $19$ 条边。证明它含一个最小度至少为 $3$ 的非空诱导子图，再证明原图含长度至少为 $4$ 的简单圈。</p>", "hints": ["第一问：只要当前图里还有度 $\\le2$ 的顶点，就把它连同它的边删掉。想一想：如果 $9$ 个点全被删光，每一步最多带走几条边？", "每条边只在它的两个端点中先被删的那个被删时消失一次，$9$ 步最多带走 $9\\times2=18$ 条，少于 $19$，所以删不光。停下时剩下的诱导子图里每个点的度都 $\\ge3$。", "第二问：在剩下的子图里取一条最长简单路 $v_0,\\ldots,v_k$。$v_0$ 的邻点必须都在路上（否则能把路延长）。$v_0$ 至少有 $3$ 个邻点，取下标最大的 $v_j$，则 $j\\ge3$，$v_0,v_1,\\ldots,v_j,v_0$ 就是长度 $\\ge4$ 的圈。"], "method": "m-extremal", "sol": "<p><b>这题在做什么</b>：$9$ 个点却有 $19$ 条边，图比较“密”。第一问用“反复删低度点”找出一块每点度都不小的子图，第二问在这块子图里用“取最长路”造出长圈。</p><p><b>术语</b>：<b>诱导子图</b>＝取一部分顶点，并保留它们之间原有的全部边。<b>最小度</b>＝图中各顶点度数的最小值。<b>简单圈</b>的顶点两两不同，<b>长度</b>是圈上的边数。</p><p><b>(1) 第 1 步：操作。</b>只要当前图里还有度 $\\le2$ 的顶点，就删掉它及与它相连的边。每次删完，剩下的仍是原图（由剩余顶点决定）的诱导子图。</p><p><b>第 2 步：反证。</b>假设一直删到一个点都不剩。每条边会在它的两个端点中先被删的那个被删时随之消失，所以每条边恰好被带走一次；每一步删掉的顶点当时度 $\\le2$，最多带走 $2$ 条边。$9$ 步至多带走 $9\\times2=18\\lt19$ 条，矛盾。</p><p><b>第 3 步：结论。</b>所以过程停在一个非空的诱导子图 $H$。停下的原因是 $H$ 里已没有度 $\\le2$ 的点，即 $H$ 的最小度 $\\ge3$。</p><p>数值感觉：其实最后一个点被删时度为 $0$，倒数第二个至多为 $1$，最多带走 $7\\times2+1+0=15$ 条；用粗略的 $18$ 已经够用。</p><p><b>(2) 第 1 步：取最长路。</b>在 $H$ 中取一条最长的简单路 $P:\\ v_0,v_1,\\ldots,v_k$（顶点两两不同）。</p><p><b>第 2 步：端点的邻点都在路上。</b>若 $v_0$ 在 $H$ 中有不在 $P$ 上的邻点 $u$，则 $u,v_0,v_1,\\ldots,v_k$ 是更长的简单路，与“最长”矛盾。</p><p><b>第 3 步：找最远的邻点。</b>$v_0$ 在 $H$ 中度 $\\ge3$，即至少有 $3$ 个不同邻点，它们都在 $\\{v_1,\\ldots,v_k\\}$ 中。设其中下标最大的是 $v_j$。$3$ 个不同的正整数下标中最大的至少是 $3$，所以 $j\\ge3$。</p><p><b>第 4 步：成圈。</b>沿路从 $v_0$ 走到 $v_j$，再用边 $v_jv_0$ 回来：$v_0,v_1,\\ldots,v_j,v_0$ 各点不同，是简单圈，长度为 $j+1\\ge4$。$H$ 是原图的子图，所以原图也含这个圈。</p><p><b>答</b>：(1) 反复删度 $\\le2$ 的点最多带走 $18$ 条边，不可能删光，剩下的非空诱导子图最小度 $\\ge3$；(2) 在其中取最长路，端点的 $\\ge3$ 个邻点全在路上，最远的一个给出长度 $\\ge4$ 的简单圈。</p><p><b>易错</b>：第二问要在 $H$ 里而不是原图里取最长路（原图可能有度 $1$ 的点，端点只有一个邻点就造不出圈）；圈长是 $j+1$ 条边，不是 $j$。</p>"}
);

/* ================= 状态与存储 ================= */
const IN_CLAUDE = !!(window.claude && window.claude.use);
const LS_KEY = "ls1-progress-v1";
const RECORD_PREFIX = LS_KEY + ":";
let db = null;
const chains = Object.create(null);
const state = Object.create(null);
function readProgress(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value && typeof value === "object" && !Array.isArray(value) ? value : null;
  } catch (e) { return null; }
}
function progressTime(record) {
  const time = Number(record?.updatedAt);
  return Number.isFinite(time) ? time : 0;
}
function adoptProgress(id, record, preferStored = false) {
  if (!record || typeof record !== "object" || Array.isArray(record)) return;
  const old = state[id];
  const time = progressTime(record);
  if (!old || time > progressTime(old) || (preferStored && time === progressTime(old))) state[id] = record;
}
function readLocalRecord(id) {
  if (!IN_CLAUDE) adoptProgress(id, readProgress(RECORD_PREFIX + id), true);
}
function readLocalProgress() {
  for (const [id, record] of Object.entries(readProgress(LS_KEY) || {})) adoptProgress(id, record);
  if (IN_CLAUDE) return;
  // 原进度键作为兼容来源。每次只写自己的题，旧标签页不会盖掉其他题。
  try {
    for (const key of Object.keys(localStorage)) {
      if (key.startsWith(RECORD_PREFIX)) readLocalRecord(key.slice(RECORD_PREFIX.length));
    }
  } catch (e) {}
}
readLocalProgress();
function cacheLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function putRecord(id, record) {
  state[id] = record;
  if (!IN_CLAUDE) {
    try { localStorage.setItem(RECORD_PREFIX + id, JSON.stringify(record)); } catch (e) {}
  }
  if (db) {
    chains[id] = (chains[id] || Promise.resolve()).then(() => db.doc("progress/" + id).set(record)).catch(() => {});
  }
}
function save(id, patch) {
  readLocalRecord(id);
  const old = state[id];
  putRecord(id, { ...old, ...patch, updatedAt: Math.max(Date.now(), progressTime(old) + 1) });
  if (IN_CLAUDE) cacheLocal();
  if (!Object.hasOwn(patch, "answer")) refreshNavProgress();
}
function setSync(on, text) {
  const el = document.getElementById("sync");
  el.classList.toggle("on", on);
  el.querySelector("span").textContent = text;
}
(async () => {
  if (!window.claude || !window.claude.use) return;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) return;
  setSync(false, "正在连接云端…");
  const timer = setTimeout(() => setSync(false, "云端暂时连不上，先存在本浏览器"), 10000);
  db.collection("progress").onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync(true, "已同步到云端"); }
    for (const d of snap.docs) {
      const cur = state[d.id];
      const inc = d.data();
      if (!cur || (inc.updatedAt || 0) >= (cur.updatedAt || 0)) state[d.id] = JSON.parse(JSON.stringify(inc));
    }
    cacheLocal();
    refreshNavProgress();
    syncVisible();
  }, () => { clearTimeout(timer); db = null; setSync(false, "云端不可用，存在本浏览器"); });
})();

/* ================= 工具函数 ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* 行内公式比所在段落还宽时（手机上常见），改成可横向滑动的独立一行，避免撑宽整页 */
function fixWide(root) {
  root.querySelectorAll("mjx-container:not([display])").forEach(c => {
    c.classList.remove("wide-math");
    let host = c.parentElement;
    while (host && host !== root && getComputedStyle(host).display.startsWith("inline") && !/^(BUTTON)$/.test(host.tagName)) host = host.parentElement;
    if (host && host.clientWidth > 0 && c.getBoundingClientRect().width > host.clientWidth + 1) c.classList.add("wide-math");
  });
}
document.addEventListener("toggle", e => { if (e.target.open) fixWide(e.target); }, true);
let wideTimer;
window.addEventListener("resize", () => { clearTimeout(wideTimer); wideTimer = setTimeout(() => fixWide(document.getElementById("view")), 200); });
function typeset(el, after) {
  if (!el.isConnected) return;
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([el]).then(() => {
      if (!el.isConnected) return;
      fixWide(el);
      if (after) after();
    }).catch(() => {});
  } else {
    setTimeout(() => typeset(el, after), 300);
  }
}
function textOf(html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.replace(/\s+\n/g, "\n").trim(); }
function allItems(L) { return [...L.problems, ...L.variants, ...L.extensions]; }
function lessonStats(lid) {
  const L = LESSONS[lid];
  const items = allItems(L);
  const core = L.problems;
  const doneCore = core.filter(p => ["solved", "partial", "failed"].includes((state[p.id] || {}).status)).length;
  const concepts = L.concepts.filter(c => (state[c.id] || {}).picked != null).length;
  return { total: core.length + L.concepts.length, done: doneCore + concepts, finished: !!(state["lesson-" + lid] || {}).done, items };
}
const methodById = {};
for (const L of Object.values(LESSONS)) for (const m of L.methods) methodById[m.id] = m;

/* ================= 导航 ================= */
function renderNav() {
  const nav = $("#nav");
  let h = `<span class="grp">总览</span><a href="#home" data-v="home"><span>考点与日程</span></a><a href="#exams" data-v="exams"><span>往年卷逐题核对</span></a><a href="#sheet" data-v="sheet"><span>速查表</span></a><a href="#export" data-v="export"><span>进度与同步</span></a>`;
  for (const u of UNITS) {
    h += `<span class="grp">${esc(u.title)}</span>`;
    if (u.soon) { h += `<a class="soon"><span>待生成</span></a>`; continue; }
    for (const lid of u.lessons) {
      const L = LESSONS[lid];
      h += `<a href="#${lid}" data-v="${lid}"><span>第 ${L.n} 课</span><span class="pc" data-pc="${lid}"></span></a>`;
    }
  }
  nav.innerHTML = h;
  refreshNavProgress();
}
function refreshNavProgress() {

/* ================= 交互工具：中国剩余定理 ================= */
function crtCalc(mount) {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
  const inv = (a, m) => { let [r0, r1, s0, s1] = [((a % m) + m) % m, m, 1, 0]; while (r1) { const q = Math.floor(r0 / r1); [r0, r1] = [r1, r0 - q * r1]; [s0, s1] = [s1, s0 - q * s1]; } return r0 === 1 ? ((s0 % m) + m) % m : null; };
  const mod = (a, m) => ((a % m) + m) % m;
  let rows = [[2, 3], [3, 5], [2, 7]];
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><span>输入 $x\\equiv a_i\\pmod{m_i}$，模数 2–999，至多 5 个方程。</span></div>
    <div id="crow" class="crt-rows"></div>
    <div class="ctrl"><button class="btn" id="cadd" type="button">＋ 加一个方程</button><button class="btn" id="cdel" type="button">－ 删最后一个</button><button class="btn" id="cdemo" type="button">换成例题</button></div>
    <div class="table-wrap" id="ctab"></div>
    <div class="readout" id="cout"></div>
  </div>`;
  const demos = [[[2, 3], [3, 5], [2, 7]], [[2, 3], [3, 4], [1, 5]], [[3, 7], [5, 11], [7, 13]], [[3, 6], [5, 8]], [[3, 6], [4, 8]]];
  let di = 0;
  const box = $("#crow", mount);
  function renderRows() {
    box.innerHTML = rows.map(([a, m], i) => `<div class="ctrl"><label>x ≡ <input type="number" data-i="${i}" data-k="0" value="${a}" aria-label="第 ${i + 1} 个余数"></label><label>(mod <input type="number" data-i="${i}" data-k="1" value="${m}" min="2" max="999" aria-label="第 ${i + 1} 个模数">)</label></div>`).join("");
    box.querySelectorAll("input").forEach(el => el.addEventListener("input", () => { rows[+el.dataset.i][+el.dataset.k] = Math.trunc(+el.value || 0); calc(); }));
    calc();
  }
  function calc() {
    const out = $("#cout", mount), tab = $("#ctab", mount);
    if (rows.some(([, m]) => !(m >= 2 && m <= 999))) { tab.innerHTML = ""; out.innerHTML = "<span>模数要在 2 到 999 之间。</span>"; return; }
    const bad = [];
    for (let i = 0; i < rows.length; i++) for (let j = i + 1; j < rows.length; j++) { const g = gcd(rows[i][1], rows[j][1]); if (g > 1) bad.push([i, j, g]); }
    if (!bad.length) {
      const M = rows.reduce((s, [, m]) => s * BigInt(m), 1n);
      let x = 0n;
      const tr = rows.map(([a, m]) => { const N = M / BigInt(m), Nm = Number(N % BigInt(m)), L = inv(Nm, m), Mi = N * BigInt(L); x += BigInt(mod(a, m)) * Mi; return `<tr><td>${m}</td><td>${mod(a, m)}</td><td>${N}</td><td>${Nm}</td><td>${L}</td><td>${Mi}</td></tr>`; }).join("");
      x %= M;
      tab.innerHTML = `<table><thead><tr><th>m<sub>i</sub></th><th>a<sub>i</sub></th><th>N<sub>i</sub> = M/m<sub>i</sub></th><th>N<sub>i</sub> mod m<sub>i</sub></th><th>L<sub>i</sub> = 逆元</th><th>M<sub>i</sub> = N<sub>i</sub>L<sub>i</sub></th></tr></thead><tbody>${tr}</tbody></table>`;
      out.innerHTML = `<span>M = <b>${M}</b></span><span>x ≡ Σ a<sub>i</sub>M<sub>i</sub> ≡ <b>${x}</b> (mod ${M})</span><span>验算：${rows.map(([, m]) => `${x} mod ${m} = ${Number(x % BigInt(m))}`).join("，")}</span>`;
      return;
    }
    // 模数不互素：逐个合并
    let [a0, m0] = [mod(rows[0][0], rows[0][1]), rows[0][1]], steps = [], ok = true;
    for (let i = 1; i < rows.length && ok; i++) {
      const [b, n] = [mod(rows[i][0], rows[i][1]), rows[i][1]], g = gcd(m0, n);
      if ((b - a0) % g) { steps.push(`合并第 ${i + 1} 个：gcd(${m0}, ${n}) = ${g} 不整除 ${b} − ${a0}，<b>无解</b>`); ok = false; break; }
      const n1 = n / g, m1 = m0 / g, c = (b - a0) / g;
      const t = n1 === 1 ? 0 : mod(c * inv(m1 % n1, n1), n1), l = m1 * n;
      if (l > 1e12) { steps.push("模数太大，停止合并。"); ok = false; break; }
      const na = mod(a0 + m0 * t, l);
      steps.push(`合并第 ${i + 1} 个：x = ${a0} + ${m0}t，${m0}t ≡ ${b - a0} (mod ${n})，t ≡ ${t} (mod ${n / g})，得 x ≡ ${na} (mod ${l})`);
      [a0, m0] = [na, l];
    }
    tab.innerHTML = `<div class="prose small"><p>模数不两两互素（${bad.map(([i, j, g]) => `m<sub>${i + 1}</sub>, m<sub>${j + 1}</sub> 的公因数 ${g}`).join("；")}），不能直接用 N、L、M 公式，改用逐个合并：</p><ol>${steps.map(s => `<li>${s}</li>`).join("")}</ol></div>`;
    out.innerHTML = ok ? `<span>x ≡ <b>${a0}</b> (mod ${m0})</span><span>验算：${rows.map(([, m]) => `${a0} mod ${m} = ${a0 % m}`).join("，")}</span>` : `<span>方程组<b>无解</b></span>`;
  }
  $("#cadd", mount).addEventListener("click", () => { if (rows.length < 5) { rows.push([1, [11, 13, 17, 19, 23][rows.length % 5]]); renderRows(); } });
  $("#cdel", mount).addEventListener("click", () => { if (rows.length > 2) { rows.pop(); renderRows(); } });
  $("#cdemo", mount).addEventListener("click", () => { di = (di + 1) % demos.length; rows = demos[di].map(r => r.slice()); renderRows(); });
  renderRows();
  typeset(mount);
}

/* ================= 交互工具：普吕弗编码 ================= */
function pruferPlay(mount) {
  mount.innerHTML = `<div class="widget">
    <div class="ctrl">
      <label for="pseq">普吕弗序列 <input id="pseq" type="text" value="2,2,1,1" style="width:12em" aria-label="普吕弗序列，用逗号分隔"></label>
      <label for="pn">n = <input id="pn" type="number" value="6" min="2" max="16" style="width:4.5em"></label>
      <button class="btn" id="prand" type="button">随机一棵</button>
    </div>
    <div class="ctrl"><label for="pstep">删叶步数 <input id="pstep" type="range" min="0" max="5" value="0"></label><b class="mono" id="pstepv"></b></div>
    <div id="psvg"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>这一步删去的叶 x<sub>i</sub></span><span><i style="background:var(--teal)"></i>它的邻点 y<sub>i</sub></span><span><i style="background:var(--line)"></i>已删去</span></div>
    <div class="table-wrap" id="ptab"></div>
    <div class="readout" id="pout"></div>
    <p class="small muted">表格从左往右读是编码（删最小的叶、记邻点），从右往左添边是还原。n 不填时取序列长度 + 2。</p>
  </div>`;
  const seqIn = $("#pseq", mount), nIn = $("#pn", mount), stepIn = $("#pstep", mount);
  let T = null;
  function decode(y, n) {
    const ys = y.concat([n]), used = new Set(), xs = [];
    for (let i = 0; i < n - 1; i++) {
      const ex = new Set([...used, ...ys.slice(i)]);
      let x = 1; while (ex.has(x)) x++;
      xs.push(x); used.add(x);
    }
    return { n, xs, ys, edges: xs.map((x, i) => [x, ys[i]]) };
  }
  function layout(t) {
    const adj = Array.from({ length: t.n + 1 }, () => []);
    t.edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
    const depth = Array(t.n + 1).fill(-1), order = [], par = Array(t.n + 1).fill(0);
    depth[t.n] = 0; const q = [t.n];
    while (q.length) { const v = q.shift(); order.push(v); adj[v].sort((a, b) => a - b).forEach(w => { if (depth[w] < 0) { depth[w] = depth[v] + 1; par[w] = v; q.push(w); } }); }
    // 叶子按 DFS 顺序排横坐标，内点取子节点平均
    const pos = {}, kids = v => adj[v].filter(w => w !== par[v] && depth[w] === depth[v] + 1);
    let cur = 0;
    (function dfs(v) { const ks = kids(v); if (!ks.length) { pos[v] = cur++; return; } ks.forEach(dfs); pos[v] = ks.reduce((s, w) => s + pos[w], 0) / ks.length; })(t.n);
    const D = Math.max(...depth.slice(1));
    return { x: pos, y: depth, W: Math.max(cur, 1), D };
  }
  function build() {
    const raw = seqIn.value.split(/[^0-9]+/).filter(Boolean).map(Number);
    let n = +nIn.value || raw.length + 2;
    const out = $("#pout", mount);
    if (n !== raw.length + 2) { n = raw.length + 2; nIn.value = n; }
    if (n < 2 || n > 16) { T = null; out.innerHTML = "<span>序列长度要在 0 到 14 之间（n 为 2–16）。</span>"; $("#psvg", mount).innerHTML = ""; $("#ptab", mount).innerHTML = ""; return; }
    if (raw.some(v => v < 1 || v > n)) { T = null; out.innerHTML = `<span>序列里的数都要在 1 到 ${n} 之间。</span>`; $("#psvg", mount).innerHTML = ""; $("#ptab", mount).innerHTML = ""; return; }
    T = decode(raw, n); T.L = layout(T);
    stepIn.max = n - 1; if (+stepIn.value > n - 1) stepIn.value = 0;
    const cnt = {}; raw.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
    const leaves = []; for (let v = 1; v <= n; v++) if (!cnt[v]) leaves.push(v);
    out.innerHTML = `<span>边：${T.edges.map(([a, b]) => Math.min(a, b) + "–" + Math.max(a, b)).join("，")}</span><span>叶（没在序列里出现的标号）：${leaves.join("、")}，共 ${leaves.length} 个</span><span>度数 = 1 + 出现次数：${Object.keys(cnt).map(v => `d(${v}) = ${1 + cnt[v]}`).join("，") || "全是叶"}</span>`;

    const VW = 640, VH = 70 + 70 * D, px = v => 30 + (W === 1 ? (VW - 60) / 2 : x[v] / (W - 1) * (VW - 60)), py = v => 30 + y[v] * 70;

    const row = (arr, lab) => `<tr><td>${lab}</td>${arr.map((v, i) => `<td style="text-align:center${i === k - 1 ? ";font-weight:700;color:var(--accent)" : i < k - 1 ? ";color:var(--muted)" : ""}">${v}</td>`).join("")}</tr>`;
    $("#ptab", mount).innerHTML = `<table><thead><tr><th>i</th>${th}</tr></thead><tbody>${row(T.xs, "x<sub>i</sub> 删去的叶")}${row(T.ys.map((v, i) => i === n - 2 ? v + "*" : v), "y<sub>i</sub> 邻点")}</tbody></table><p class="small muted">* 末项 y<sub>n−1</sub> = n 是补上的，不属于序列。</p>`;

  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
