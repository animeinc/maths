const IN_CLAUDE = !!(window.claude && window.claude.use);
const LS_KEY = "ls1-progress-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { state = {}; }
let db = null;
const chains = {};
function cacheLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function save(id, patch) {
  state[id] = Object.assign({}, state[id] || {}, patch, { updatedAt: Date.now() });
  cacheLocal();
  refreshNavProgress();
  if (!db) return;
  const body = JSON.parse(JSON.stringify(state[id]));
  chains[id] = (chains[id] || Promise.resolve()).then(() => db.doc("progress/" + id).set(body)).catch(() => {});
}
function setSync(on, text) {
  const el = document.getElementById("sync");
  el.classList.toggle("on", on);
  el.querySelector("span").textContent = text;
}
(async () => {
  if (!window.claude || !window.claude.use) return;
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) return;
  setSync(false, "正在连接云端…");
  const timer = setTimeout(() => setSync(false, "云端暂时连不上，先存在本浏览器"), 10000);
  db.collection("progress").onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync(true, "已同步到云端"); }
    for (const d of snap.docs) {
      const cur = state[d.id];
      const inc = d.data();
      if (!cur || (inc.updatedAt || 0) >= (cur.updatedAt || 0)) state[d.id] = JSON.parse(JSON.stringify(inc));
    }
    cacheLocal();
    refreshNavProgress();
    syncVisible();
  }, () => { clearTimeout(timer); db = null; setSync(false, "云端不可用，存在本浏览器"); });
})();

/* ================= 工具函数 ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* 行内公式比所在段落还宽时（手机上常见），改成可横向滑动的独立一行，避免撑宽整页 */
function fixWide(root) {
  root.querySelectorAll("mjx-container:not([display])").forEach(c => {
    c.classList.remove("wide-math");
    let host = c.parentElement;
    while (host && host !== root && getComputedStyle(host).display.startsWith("inline") && !/^(BUTTON)$/.test(host.tagName)) host = host.parentElement;
    if (host && host.clientWidth > 0 && c.getBoundingClientRect().width > host.clientWidth + 1) c.classList.add("wide-math");
  });
}
document.addEventListener("toggle", e => { if (e.target.open) fixWide(e.target); }, true);
let wideTimer;
window.addEventListener("resize", () => { clearTimeout(wideTimer); wideTimer = setTimeout(() => fixWide(document.getElementById("view")), 200); });
function typeset(el) {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([el]).then(() => fixWide(el)).catch(() => {});
  } else {
    setTimeout(() => typeset(el), 300);
  }
}
function textOf(html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.replace(/\s+\n/g, "\n").trim(); }
function allItems(L) { return [...L.problems, ...L.variants, ...L.extensions]; }
function lessonStats(lid) {
  const L = LESSONS[lid];
  const items = allItems(L);
  const core = L.problems;
  const doneCore = core.filter(p => ["solved", "partial", "failed"].includes((state[p.id] || {}).status)).length;
  const concepts = L.concepts.filter(c => (state[c.id] || {}).picked != null).length;
  return { total: core.length + L.concepts.length, done: doneCore + concepts, finished: !!(state["lesson-" + lid] || {}).done, items };
}
const methodById = {};
for (const L of Object.values(LESSONS)) for (const m of L.methods) methodById[m.id] = m;

function refreshNavProgress() {

  });
  document.querySelectorAll("[data-lp]").forEach(el => {
    const s = lessonStats(el.dataset.lp);
    el.style.width = Math.round(100 * s.done / Math.max(1, s.total)) + "%";
  });
}
function markNav(v) {

  const nav = $("#nav");

}

/* ================= 导出 ================= */
function buildMarkdown() {
  let md = "# 离散数学期末冲刺：我的作答\n";
  for (const [lid, L] of Object.entries(LESSONS)) {
    md += `\n## 第 ${L.n} 课 ${textOf(L.title)}\n`;
    const wrongC = L.concepts.filter(c => state[c.id] && state[c.id].picked != null && state[c.id].picked !== c.a);
    if (wrongC.length) md += `\n概念题答错：${wrongC.map(c => c.id).join("、")}\n`;
    for (const p of allItems(L)) {
      const r = state[p.id] || {};
      if (!r.answer && !r.status) continue;
      md += `\n### ${p.id}（${p.lv} · ${p.src}）\n**题目**：${textOf(p.stmt)}\n\n**状态**：${statusLabel(r.status)}，用了 ${r.hints || 0} 层提示${r.sawSol ? "，看过解答" : ""}\n\n**我的作答**：\n${r.answer || "（未写）"}\n`;
      if (r.feedback) md += `\n**AI 批改**：\n${r.feedback}\n`;
    }
  }
  return md;
}
/* ---------- 跨设备同步：文件 + 同步码，按每条记录的修改时间合并 ---------- */
const META_KEY = "ls1-meta-v1";
function getMeta() { try { return JSON.parse(localStorage.getItem(META_KEY) || "{}") || {}; } catch (e) { return {}; } }
function setMeta(p) { try { localStorage.setItem(META_KEY, JSON.stringify(Object.assign(getMeta(), p))); } catch (e) {} }
function snapshot() { return { app: "ls1", v: 1, exportedAt: Date.now(), state }; }
function putRecord(id, rec) {
  state[id] = JSON.parse(JSON.stringify(rec));
  if (db) { const body = state[id]; chains[id] = (chains[id] || Promise.resolve()).then(() => db.doc("progress/" + id).set(body)).catch(() => {}); }
}
function mergeIn(obj) {
  if (!obj || obj.app !== "ls1" || typeof obj.state !== "object") throw new Error("不是这个页面导出的进度");
  let added = 0, updated = 0, kept = 0;
  for (const [id, inc] of Object.entries(obj.state)) {
    if (!/^[A-Za-z0-9_-]{1,80}$/.test(id) || !inc || typeof inc !== "object") continue;
    const cur = state[id];
    if (!cur) { putRecord(id, inc); added++; }
    else if ((inc.updatedAt || 0) > (cur.updatedAt || 0)) { putRecord(id, inc); updated++; }
    else kept++;
  }
  cacheLocal(); refreshNavProgress();
  return { added, updated, kept };

function crtCalc(mount) {

  const mod = (a, m) => ((a % m) + m) % m;
  let rows = [[2, 3], [3, 5], [2, 7]];
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><span>输入 $x\\equiv a_i\\pmod{m_i}$，模数 2–999，至多 5 个方程。</span></div>
    <div id="crow" class="crt-rows"></div>
    <div class="ctrl"><button class="btn" id="cadd" type="button">＋ 加一个方程</button><button class="btn" id="cdel" type="button">－ 删最后一个</button><button class="btn" id="cdemo" type="button">换成例题</button></div>
    <div class="table-wrap" id="ctab"></div>
    <div class="readout" id="cout"></div>
  </div>`;
  const demos = [[[2, 3], [3, 5], [2, 7]], [[2, 3], [3, 4], [1, 5]], [[3, 7], [5, 11], [7, 13]], [[3, 6], [5, 8]], [[3, 6], [4, 8]]];
  let di = 0;
  const box = $("#crow", mount);
  function renderRows() {
    box.innerHTML = rows.map(([a, m], i) => `<div class="ctrl"><label>x ≡ <input type="number" data-i="${i}" data-k="0" value="${a}" aria-label="第 ${i + 1} 个余数"></label><label>(mod <input type="number" data-i="${i}" data-k="1" value="${m}" min="2" max="999" aria-label="第 ${i + 1} 个模数">)</label></div>`).join("");
    box.querySelectorAll("input").forEach(el => el.addEventListener("input", () => { rows[+el.dataset.i][+el.dataset.k] = Math.trunc(+el.value || 0); calc(); }));
    calc();
  }
  function calc() {
    const out = $("#cout", mount), tab = $("#ctab", mount);
    if (rows.some(([, m]) => !(m >= 2 && m <= 999))) { tab.innerHTML = ""; out.innerHTML = "<span>模数要在 2 到 999 之间。</span>"; return; }
    const bad = [];
    for (let i = 0; i < rows.length; i++) for (let j = i + 1; j < rows.length; j++) { const g = gcd(rows[i][1], rows[j][1]); if (g > 1) bad.push([i, j, g]); }
    if (!bad.length) {
      const M = rows.reduce((s, [, m]) => s * BigInt(m), 1n);
      let x = 0n;
      const tr = rows.map(([a, m]) => { const N = M / BigInt(m), Nm = Number(N % BigInt(m)), L = inv(Nm, m), Mi = N * BigInt(L); x += BigInt(mod(a, m)) * Mi; return `<tr><td>${m}</td><td>${mod(a, m)}</td><td>${N}</td><td>${Nm}</td><td>${L}</td><td>${Mi}</td></tr>`; }).join("");
      x %= M;
      tab.innerHTML = `<table><thead><tr><th>m<sub>i</sub></th><th>a<sub>i</sub></th><th>N<sub>i</sub> = M/m<sub>i</sub></th><th>N<sub>i</sub> mod m<sub>i</sub></th><th>L<sub>i</sub> = 逆元</th><th>M<sub>i</sub> = N<sub>i</sub>L<sub>i</sub></th></tr></thead><tbody>${tr}</tbody></table>`;
      out.innerHTML = `<span>M = <b>${M}</b></span><span>x ≡ Σ a<sub>i</sub>M<sub>i</sub> ≡ <b>${x}</b> (mod ${M})</span><span>验算：${rows.map(([, m]) => `${x} mod ${m} = ${Number(x % BigInt(m))}`).join("，")}</span>`;
      return;
    }
    // 模数不互素：逐个合并
    let [a0, m0] = [mod(rows[0][0], rows[0][1]), rows[0][1]], steps = [], ok = true;
    for (let i = 1; i < rows.length && ok; i++) {
      const [b, n] = [mod(rows[i][0], rows[i][1]), rows[i][1]], g = gcd(m0, n);
      if ((b - a0) % g) { steps.push(`合并第 ${i + 1} 个：gcd(${m0}, ${n}) = ${g} 不整除 ${b} − ${a0}，<b>无解</b>`); ok = false; break; }
      const n1 = n / g, m1 = m0 / g, c = (b - a0) / g;
      const t = n1 === 1 ? 0 : mod(c * inv(m1 % n1, n1), n1), l = m1 * n;
      if (l > 1e12) { steps.push("模数太大，停止合并。"); ok = false; break; }
      const na = mod(a0 + m0 * t, l);
      steps.push(`合并第 ${i + 1} 个：x = ${a0} + ${m0}t，${m0}t ≡ ${b - a0} (mod ${n})，t ≡ ${t} (mod ${n / g})，得 x ≡ ${na} (mod ${l})`);
      [a0, m0] = [na, l];
    }
    tab.innerHTML = `<div class="prose small"><p>模数不两两互素（${bad.map(([i, j, g]) => `m<sub>${i + 1}</sub>, m<sub>${j + 1}</sub> 的公因数 ${g}`).join("；")}），不能直接用 N、L、M 公式，改用逐个合并：</p><ol>${steps.map(s => `<li>${s}</li>`).join("")}</ol></div>`;
    out.innerHTML = ok ? `<span>x ≡ <b>${a0}</b> (mod ${m0})</span><span>验算：${rows.map(([, m]) => `${a0} mod ${m} = ${a0 % m}`).join("，")}</span>` : `<span>方程组<b>无解</b></span>`;
  }
  $("#cadd", mount).addEventListener("click", () => { if (rows.length < 5) { rows.push([1, [11, 13, 17, 19, 23][rows.length % 5]]); renderRows(); } });
  $("#cdel", mount).addEventListener("click", () => { if (rows.length > 2) { rows.pop(); renderRows(); } });
  $("#cdemo", mount).addEventListener("click", () => { di = (di + 1) % demos.length; rows = demos[di].map(r => r.slice()); renderRows(); });
  renderRows();
  typeset(mount);
}

/* ================= 交互工具：普吕弗编码 ================= */
function pruferPlay(mount) {
  mount.innerHTML = `<div class="widget">
    <div class="ctrl">
      <label for="pseq">普吕弗序列 <input id="pseq" type="text" value="2,2,1,1" style="width:12em" aria-label="普吕弗序列，用逗号分隔"></label>
      <label for="pn">n = <input id="pn" type="number" value="6" min="2" max="16" style="width:4.5em"></label>
      <button class="btn" id="prand" type="button">随机一棵</button>
    </div>
    <div class="ctrl"><label for="pstep">删叶步数 <input id="pstep" type="range" min="0" max="5" value="0"></label><b class="mono" id="pstepv"></b></div>
    <div id="psvg"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>这一步删去的叶 x<sub>i</sub></span><span><i style="background:var(--teal)"></i>它的邻点 y<sub>i</sub></span><span><i style="background:var(--line)"></i>已删去</span></div>
    <div class="table-wrap" id="ptab"></div>
    <div class="readout" id="pout"></div>
    <p class="small muted">表格从左往右读是编码（删最小的叶、记邻点），从右往左添边是还原。n 不填时取序列长度 + 2。</p>
  </div>`;
  const seqIn = $("#pseq", mount), nIn = $("#pn", mount), stepIn = $("#pstep", mount);
  let T = null;
  function decode(y, n) {
    const ys = y.concat([n]), used = new Set(), xs = [];
    for (let i = 0; i < n - 1; i++) {
      const ex = new Set([...used, ...ys.slice(i)]);
      let x = 1; while (ex.has(x)) x++;
      xs.push(x); used.add(x);
    }
    return { n, xs, ys, edges: xs.map((x, i) => [x, ys[i]]) };
  }
  function layout(t) {
    const adj = Array.from({ length: t.n + 1 }, () => []);
    t.edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
    const depth = Array(t.n + 1).fill(-1), order = [], par = Array(t.n + 1).fill(0);
    depth[t.n] = 0; const q = [t.n];
    while (q.length) { const v = q.shift(); order.push(v); adj[v].sort((a, b) => a - b).forEach(w => { if (depth[w] < 0) { depth[w] = depth[v] + 1; par[w] = v; q.push(w); } }); }
    // 叶子按 DFS 顺序排横坐标，内点取子节点平均
    const pos = {}, kids = v => adj[v].filter(w => w !== par[v] && depth[w] === depth[v] + 1);
    let cur = 0;
    (function dfs(v) { const ks = kids(v); if (!ks.length) { pos[v] = cur++; return; } ks.forEach(dfs); pos[v] = ks.reduce((s, w) => s + pos[w], 0) / ks.length; })(t.n);
    const D = Math.max(...depth.slice(1));
    return { x: pos, y: depth, W: Math.max(cur, 1), D };
  }
  function build() {
    const raw = seqIn.value.split(/[^0-9]+/).filter(Boolean).map(Number);
    let n = +nIn.value || raw.length + 2;
    const out = $("#pout", mount);
    if (n !== raw.length + 2) { n = raw.length + 2; nIn.value = n; }
    if (n < 2 || n > 16) { T = null; out.innerHTML = "<span>序列长度要在 0 到 14 之间（n 为 2–16）。</span>"; $("#psvg", mount).innerHTML = ""; $("#ptab", mount).innerHTML = ""; return; }
    if (raw.some(v => v < 1 || v > n)) { T = null; out.innerHTML = `<span>序列里的数都要在 1 到 ${n} 之间。</span>`; $("#psvg", mount).innerHTML = ""; $("#ptab", mount).innerHTML = ""; return; }
    T = decode(raw, n); T.L = layout(T);
    stepIn.max = n - 1; if (+stepIn.value > n - 1) stepIn.value = 0;
    const cnt = {}; raw.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
    const leaves = []; for (let v = 1; v <= n; v++) if (!cnt[v]) leaves.push(v);
    out.innerHTML = `<span>边：${T.edges.map(([a, b]) => Math.min(a, b) + "–" + Math.max(a, b)).join("，")}</span><span>叶（没在序列里出现的标号）：${leaves.join("、")}，共 ${leaves.length} 个</span><span>度数 = 1 + 出现次数：${Object.keys(cnt).map(v => `d(${v}) = ${1 + cnt[v]}`).join("，") || "全是叶"}</span>`;
    draw();
  }
  function draw() {
    if (!T) return;
    const k = +stepIn.value, n = T.n, { x, y, W, D } = T.L;
    $("#pstepv", mount).textContent = k === 0 ? "原树" : k <= n - 2 ? `第 ${k} 步：删 ${T.xs[k - 1]}，记 ${T.ys[k - 1]}` : `第 ${k} 步：删 ${T.xs[k - 1]}，只剩 ${n}`;
    const VW = 640, VH = 70 + 70 * D, px = v => 30 + (W === 1 ? (VW - 60) / 2 : x[v] / (W - 1) * (VW - 60)), py = v => 30 + y[v] * 70;
    const gone = new Set(T.xs.slice(0, Math.max(0, k - 1))), cx = k ? T.xs[k - 1] : null, cy = k ? T.ys[k - 1] : null;
    const edges = T.edges.map(([a, b], i) => { const del = i < k - 1, now = i === k - 1; return `<line x1="${px(a)}" y1="${py(a)}" x2="${px(b)}" y2="${py(b)}" style="stroke:var(${now ? "--accent" : del ? "--line" : "--ink"});stroke-width:${now ? 3.5 : 2}${del ? ";stroke-dasharray:4 4" : ""}"/>`; }).join("");
    const nodes = []; for (let v = 1; v <= n; v++) {
      const fill = v === cx ? "--accent" : v === cy ? "--teal" : gone.has(v) ? "--bg" : "--surface", ink = v === cx || v === cy ? "--accent-ink" : gone.has(v) ? "--muted" : "--ink";
      nodes.push(`<g><circle cx="${px(v)}" cy="${py(v)}" r="14" style="fill:var(${fill});stroke:var(${gone.has(v) ? "--line" : "--ink"});stroke-width:1.5"/><text x="${px(v)}" y="${py(v) + 4.5}" text-anchor="middle" style="fill:var(${ink});font:600 13px var(--f-mono)">${v}</text></g>`);
    }
    $("#psvg", mount).innerHTML = `<svg viewBox="0 0 ${VW} ${VH}" style="width:100%;max-height:360px;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="由普吕弗序列还原出的树">${edges}${nodes.join("")}</svg>`;
    const th = T.xs.map((_, i) => `<th style="text-align:center${i === k - 1 ? ";color:var(--accent)" : ""}">${i + 1}</th>`).join("");
    const row = (arr, lab) => `<tr><td>${lab}</td>${arr.map((v, i) => `<td style="text-align:center${i === k - 1 ? ";font-weight:700;color:var(--accent)" : i < k - 1 ? ";color:var(--muted)" : ""}">${v}</td>`).join("")}</tr>`;
    $("#ptab", mount).innerHTML = `<table><thead><tr><th>i</th>${th}</tr></thead><tbody>${row(T.xs, "x<sub>i</sub> 删去的叶")}${row(T.ys.map((v, i) => i === n - 2 ? v + "*" : v), "y<sub>i</sub> 邻点")}</tbody></table><p class="small muted">* 末项 y<sub>n−1</sub> = n 是补上的，不属于序列。</p>`;
  }
  seqIn.addEventListener("input", () => { nIn.value = ""; build(); });
  nIn.addEventListener("change", () => { const n = +nIn.value; if (n >= 2 && n <= 16) { const raw = seqIn.value.split(/[^0-9]+/).filter(Boolean).map(Number); while (raw.length < n - 2) raw.push(1); raw.length = n - 2; seqIn.value = raw.join(","); } build(); });
  stepIn.addEventListener("input", draw);
  $("#prand", mount).addEventListener("click", () => { const n = 6 + Math.floor(Math.random() * 5); seqIn.value = Array.from({ length: n - 2 }, () => 1 + Math.floor(Math.random() * n)).join(","); nIn.value = n; stepIn.value = 0; build(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  build();
}


/* ================= 交互工具：最便宜生成树 ================= */
function mstPlay(mount) {
  const nodes = { A: [55, 155], B: [175, 45], C: [230, 155], D: [175, 265], E: [415, 155], F: [345, 265], G: [545, 265], H: [545, 45] };
  const edges = [["A", "B", 9], ["A", "C", 5], ["A", "D", 2], ["B", "E", 2], ["B", "H", 7], ["C", "E", 3], ["C", "D", 8], ["C", "F", 6], ["D", "F", 4], ["E", "G", 2], ["E", "H", 6], ["F", "G", 1]];
  const key = e => e[0] + e[1];
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="mst-mode">算法 <select id="mst-mode"><option value="add">Kruskal：从轻到重加边</option><option value="delete">逆向：从重到轻删边</option></select></label></div>
    <div class="ctrl"><button class="btn" id="mst-prev" type="button">上一步</button><button class="btn" id="mst-next" type="button">下一步</button><button class="btn" id="mst-reset" type="button">重置</button></div>
    <div class="ctrl"><label for="mst-step">检查边数 <input id="mst-step" type="range" min="0" max="12" value="0"></label><b class="mono" id="mst-step-label"></b></div>
    <div id="mst-graph"></div>
    <div class="legend"><span><i style="background:var(--teal)"></i>已选 / 必须保留</span><span><i style="background:var(--accent)"></i>本步检查</span><span><i style="background:var(--line)"></i>虚线：跳过 / 已删除</span></div>
    <div class="readout" id="mst-out" aria-live="polite"></div>
    <div class="table-wrap" id="mst-table"></div>
    <p class="small muted">权相同按边名字母序检查。加边模式选满 7 条即可停；工具继续显示剩余边的成圈检查，方便核对。切换算法从第 0 步开始。</p>
  </div>`;
  const mode = $("#mst-mode", mount), slider = $("#mst-step", mount);
  let steps = [], ordered = [];
  function components(keys) {
    const parent = Object.fromEntries(Object.keys(nodes).map(v => [v, v]));
    function root(v) { while (parent[v] !== v) v = parent[v]; return v; }
    for (const e of edges) if (keys.has(key(e))) parent[root(e[0])] = root(e[1]);
    return { root, count: new Set(Object.keys(nodes).map(root)).size };
  }
  function rebuild() {
    const deleting = mode.value === "delete";
    ordered = edges.slice().sort((a, b) => (deleting ? b[2] - a[2] : a[2] - b[2]) || key(a).localeCompare(key(b)));
    const present = new Set(deleting ? edges.map(key) : []), kept = new Set(), removed = new Set();
    steps = [{ present: new Set(present), kept: new Set(), removed: new Set(), message: deleting ? "从完整图开始，检查删边后是否仍连通。" : "从空森林开始，检查边的两端是否属于不同分支。" }];
    for (const e of ordered) {
      const id = key(e);
      let message;
      if (deleting) {
        present.delete(id);
        if (components(present).count === 1) { removed.add(id); message = `删除 ${id}（权 ${e[2]}）：删后仍连通。`; }
        else { present.add(id); kept.add(id); message = `保留 ${id}（权 ${e[2]}）：它是当前图的桥，删后不连通。`; }
      } else {
        const c = components(present);
        if (c.root(e[0]) !== c.root(e[1])) { present.add(id); kept.add(id); message = `选入 ${id}（权 ${e[2]}）：连接两个不同分支。`; }
        else { removed.add(id); message = `跳过 ${id}（权 ${e[2]}）：两端已连通，加入会成圈。`; }
      }
      steps.push({ present: new Set(present), kept: new Set(kept), removed: new Set(removed), message });
    }
    slider.value = 0;
    draw();
  }
  function draw() {
    const k = +slider.value, s = steps[k], current = k ? key(ordered[k - 1]) : "", deleting = mode.value === "delete";
    $("#mst-step-label", mount).textContent = `${k} / ${ordered.length}`;
    $("#mst-prev", mount).disabled = k === 0;
    $("#mst-next", mount).disabled = k === ordered.length;
    const lines = edges.map(e => {
      const id = key(e), [x1, y1] = nodes[e[0]], [x2, y2] = nodes[e[1]], gone = s.removed.has(id);
      const color = id === current ? "--accent" : gone ? "--line" : s.kept.has(id) ? "--teal" : "--muted";
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 9;
      return `<g><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(${color});stroke-width:${id === current ? 4 : 2.5}${gone ? ";stroke-dasharray:6 5" : ""}"/><circle cx="${mx}" cy="${my}" r="11" style="fill:var(--bg)"/><text x="${mx}" y="${my + 4}" text-anchor="middle" style="fill:var(--ink);font:600 14px var(--f-mono)">${e[2]}</text></g>`;
    }).join("");
    const circles = Object.entries(nodes).map(([v, [x, y]]) => `<g><circle cx="${x}" cy="${y}" r="17" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.5"/><text x="${x}" y="${y + 5}" text-anchor="middle" style="fill:var(--ink);font:600 15px var(--f-mono)">${v}</text></g>`).join("");
    $("#mst-graph", mount).innerHTML = `<svg viewBox="0 0 600 310" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="2022 秋期末最便宜生成树原图，当前第 ${k} 步；边与判断详见下表">${lines}${circles}</svg>`;
    const total = edges.filter(e => s.present.has(key(e))).reduce((sum, e) => sum + e[2], 0);
    const done = s.present.size === 7 && components(s.present).count === 1;
    $("#mst-out", mount).innerHTML = `<span>${s.message}</span><span>${deleting ? "当前剩余" : "已选"} ${s.present.size} 条边，${components(s.present).count} 个分支，总权 ${total}${done ? "；已得到 MST，总权 20。" : "。"}</span>`;
    const rows = ordered.map((e, i) => `<tr${i === k - 1 ? ' style="font-weight:700;color:var(--accent)"' : ""}><td>${key(e)}</td><td>${e[2]}</td><td>${i >= k ? "待检查" : s.removed.has(key(e)) ? (deleting ? "删除：仍连通" : "跳过：成圈") : (deleting ? "保留：桥" : "选入：连接分支")}</td></tr>`).join("");
    $("#mst-table", mount).innerHTML = `<table><thead><tr><th>边</th><th>权</th><th>判断</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  slider.addEventListener("input", draw);
  mode.addEventListener("change", rebuild);
  $("#mst-prev", mount).addEventListener("click", () => { slider.value = Math.max(0, +slider.value - 1); draw(); });
  $("#mst-next", mount).addEventListener("click", () => { slider.value = Math.min(ordered.length, +slider.value + 1); draw(); });
  $("#mst-reset", mount).addEventListener("click", () => { slider.value = 0; draw(); });
  rebuild();
}


/* ================= 交互工具：Hall 邻点集合 ================= */
function hallPlay(mount) {
  const samples = {
    good: [[0, 1], [1, 2], [0, 2, 3], [2, 3]],
    bad: [[0, 1], [0, 1], [0, 1], [2, 3]],
    zero: [[], [], [], []]
  };
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="hall-case">例图 <select id="hall-case"><option value="good">有完美匹配</option><option value="bad">单点与全集检查通过，仍有缺口</option><option value="zero">零度正则图</option></select></label></div>
    <div class="ctrl" id="hall-subset">选左侧集合 S：${[0, 1, 2, 3].map(i => `<label><input type="checkbox" value="${i}"${i < 3 ? " checked" : ""}> a${i + 1}</label>`).join("")}</div>
    <div class="ctrl"><button class="btn" id="hall-find" type="button">寻找 Hall 缺口</button><label><input id="hall-matching" type="checkbox"> 显示一组最大匹配</label></div>
    <div id="hall-graph"></div><div class="readout" id="hall-out" aria-live="polite"></div>
    <p class="small muted">紫色点：S；青色点：邻点并集 N(S)。最大匹配用粗线标出。工具穷举全部 16 个左侧子集；同一个右点只数一次。</p>
  </div>`;
  const mode = $("#hall-case", mount), checks = [...mount.querySelectorAll("#hall-subset input")], show = $("#hall-matching", mount);
  let note = "";
  function neighbors(S) { return new Set(S.flatMap(i => samples[mode.value][i])); }
  function maximum() {
    let best = [];
    function visit(i, used, pairs) {
      if (i === 4) { if (pairs.length > best.length) best = pairs.slice(); return; }
      for (const j of samples[mode.value][i]) if (!used.has(j)) {
        used.add(j); pairs.push([i, j]); visit(i + 1, used, pairs); pairs.pop(); used.delete(j);
      }
      visit(i + 1, used, pairs);
    }
    visit(0, new Set(), []);
    return best;
  }
  function draw() {
    const S = checks.filter(c => c.checked).map(c => +c.value), N = neighbors(S), pairs = maximum();
    const good = N.size >= S.length, pairSet = new Set(pairs.map(([i, j]) => `${i}-${j}`));
    const lines = samples[mode.value].flatMap((ns, i) => ns.map(j => {
      const chosen = show.checked && pairSet.has(`${i}-${j}`), active = S.includes(i);
      return `<line x1="100" y1="${40 + 70 * i}" x2="480" y2="${40 + 70 * j}" style="stroke:var(${chosen ? "--teal" : active ? "--accent" : "--line"});stroke-width:${chosen ? 5 : active ? 2.5 : 1.5}"/>`;
    })).join("");
    const dots = [0, 1].flatMap(side => [0, 1, 2, 3].map(i => {
      const active = side ? N.has(i) : S.includes(i), x = side ? 480 : 100, y = 40 + 70 * i;
      return `<g><circle cx="${x}" cy="${y}" r="20" style="fill:var(${active ? (side ? "--teal" : "--accent") : "--surface"});stroke:var(--ink);stroke-width:1.3"/><text x="${x}" y="${y + 5}" text-anchor="middle" style="fill:var(${active ? "--accent-ink" : "--ink"});font:600 15px var(--f-mono)">${side ? "b" : "a"}${i + 1}</text></g>`;
    })).join("");
    $("#hall-graph", mount).innerHTML = `<svg viewBox="0 0 580 290" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="Hall 二部图；左侧集合与右侧邻点的完整计数见下方">${lines}${dots}</svg>`;
    const names = (xs, prefix) => xs.length ? `{${xs.map(i => prefix + (i + 1)).join(", ")}}` : "空集";
    $("#hall-out", mount).innerHTML = `<span>S = ${names(S, "a")}，N(S) = ${names([...N].sort(), "b")}</span><span>|S| = ${S.length}，|N(S)| = ${N.size}；此子集${good ? "满足条件（还不能据此断言全部满足）" : `违反 Hall，缺口为 ${S.length - N.size}` }。</span><span>全图最大匹配 ${pairs.length} 条${pairs.length === 4 ? "，可覆盖全部顶点。" : `，至少 ${4 - pairs.length} 个左点无法匹配。`}${show.checked ? " 所示匹配：" + pairs.map(([i, j]) => `a${i + 1}–b${j + 1}`).join("，") : ""}</span>${note ? `<span>${note}</span>` : ""}`;
  }
  $("#hall-find", mount).addEventListener("click", () => {
    let worst = [], deficit = 0;
    for (let mask = 0; mask < 16; mask++) {
      const S = [0, 1, 2, 3].filter(i => mask & (1 << i)), d = S.length - neighbors(S).size;
      if (d > deficit) { deficit = d; worst = S; }
    }
    note = deficit ? `已检查 16 个子集，最大缺口 ${deficit}，上图已选出一个坏子集。` : "已检查全部 16 个子集，都满足 Hall 条件；存在完美匹配。";
    if (deficit) checks.forEach((c, i) => { c.checked = worst.includes(i); });
    draw();
  });
  mode.addEventListener("change", () => { note = ""; show.checked = false; draw(); });
  checks.forEach(c => c.addEventListener("change", () => { note = ""; draw(); }));
  show.addEventListener("change", draw);
  draw();
}


/* ================= 交互工具：平面图删边与数面 ================= */
function planarPlay(mount) {
  const points = { A: [65, 245], B: [535, 245], C: [300, 35], D: [300, 165] };
  const edges = ["AB", "AC", "AD", "BC", "BD", "CD"];
  const presets = { full: edges, tree: ["AB", "AC", "AD"], split: ["AB"], empty: [] };
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="plane-preset">图形 <select id="plane-preset"><option value="full">完整 K4</option><option value="tree">一棵树</option><option value="split">一条边与两个孤立点</option><option value="empty">四个孤立点</option><option value="custom">自选边</option></select></label></div>
    <div class="ctrl" id="plane-edges">保留边：${edges.map(e => `<label><input type="checkbox" value="${e}" checked> ${e}</label>`).join("")}</div>
    <div id="plane-graph"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>在圈上的边</span><span><i style="background:var(--teal)"></i>桥</span></div>
    <div class="readout" id="plane-count"></div>
    <div class="ctrl"><label for="plane-answer">面数（含外部面） <input id="plane-answer" type="number" min="1" max="4" step="1" style="width:4em"></label><button class="btn" id="plane-check" type="button">核对面数</button></div>
    <div class="readout" id="plane-result" aria-live="polite"></div>
    <p class="small muted">四个顶点始终保留。删去圈边会合并两个面；删去桥会增加分支，面数不变。无界区域也算一个面。</p>
  </div>`;
  const mode = $("#plane-preset", mount), checks = [...mount.querySelectorAll("#plane-edges input")], answer = $("#plane-answer", mount);
  function components(es) {
    const parent = { A: "A", B: "B", C: "C", D: "D" };
    function root(x) { while (x !== parent[x]) x = parent[x]; return x; }
    for (const e of es) parent[root(e[0])] = root(e[1]);
    return new Set(Object.keys(points).map(root)).size;
  }
  function selected() { return checks.filter(c => c.checked).map(c => c.value); }
  function draw() {
    const es = selected(), c = components(es);
    const lines = es.map(e => {
      const [x1, y1] = points[e[0]], [x2, y2] = points[e[1]], bridge = components(es.filter(f => f !== e)) > c;
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(${bridge ? "--teal" : "--accent"});stroke-width:3"/>`;
    }).join("");
    const nodes = Object.entries(points).map(([v, [x, y]]) => `<g><circle cx="${x}" cy="${y}" r="17" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.5"/><text x="${x}" y="${y + 5}" text-anchor="middle" style="fill:var(--ink);font:600 15px var(--f-mono)">${v}</text></g>`).join("");
    $("#plane-graph", mount).innerHTML = `<svg viewBox="0 0 600 285" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="四个顶点的无交叉平面嵌入，当前有 ${es.length} 条边、${c} 个分支；青色是桥">${lines}${nodes}</svg>`;
    $("#plane-count", mount).innerHTML = `<span>v = 4，e = ${es.length}，c = ${c}。</span><span>先数图中有界区域，再加上外部面；非连通时使用 v−e+f = 1+c。</span>`;
    answer.value = "";
    $("#plane-result", mount).textContent = "";
  }
  checks.forEach(c => c.addEventListener("change", () => { mode.value = "custom"; draw(); }));
  mode.addEventListener("change", () => {
    if (presets[mode.value]) checks.forEach(c => { c.checked = presets[mode.value].includes(c.value); });
    draw();
  });
  answer.addEventListener("input", () => { $("#plane-result", mount).textContent = ""; });
  $("#plane-check", mount).addEventListener("click", () => {
    const es = selected(), c = components(es), f = 1 + c - 4 + es.length, guess = Number(answer.value);
    $("#plane-result", mount).textContent = !answer.value || !Number.isInteger(guess) || guess < 1 ? "先输入一个正整数面数，再核对。" : `${guess === f ? "正确。" : "再数一次："}面数 f = 1+${c}−4+${es.length} = ${f}（含外部面）；4−${es.length}+${f} = ${1 + c} = 1+c。`;
  });
  draw();
}


/* ================= 交互工具：角的双计数与无 4-圈 ================= */
function anglePlay(mount) {
  const ring = (n, r, cx, cy, start) => Array.from({ length: n }, (_, i) => [cx + r * Math.cos(start + 2 * Math.PI * i / n), cy + r * Math.sin(start + 2 * Math.PI * i / n)]);
  const top = -Math.PI / 2;
  const presets = {
    bowtie: { label: "蝴蝶图（5 点 6 边）", pos: [[300, 150], [170, 60], [170, 240], [430, 60], [430, 240]], edges: [[0, 1], [0, 2], [1, 2], [0, 3], [0, 4], [3, 4]] },
    petersen: { label: "Petersen 图（10 点 3-正则）", pos: ring(5, 130, 300, 155, top).concat(ring(5, 62, 300, 155, top)), edges: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 0], [0, 5], [1, 6], [2, 7], [3, 8], [4, 9], [5, 7], [7, 9], [9, 6], [6, 8], [8, 5]] },
    cube: { label: "立方体图（8 点，有 4-圈）", pos: [[150, 60], [330, 60], [330, 240], [150, 240], [230, 120], [450, 120], [450, 280], [230, 280]].map(([x, y]) => [x, y - 15]), edges: [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]] },
    c5: { label: "五边形 C5", pos: ring(5, 120, 300, 155, top), edges: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 0]] },
    k4: { label: "完全图 K4", pos: ring(4, 115, 300, 150, top), edges: [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]] },
    empty: { label: "6 个孤立点（自己连边）", pos: ring(6, 120, 300, 150, top), edges: [] }
  };
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="ang-preset">例图 <select id="ang-preset">${Object.entries(presets).map(([k, p]) => `<option value="${k}">${p.label}</option>`).join("")}</select></label><button class="btn" id="ang-clear" type="button">清空边</button></div>
    <div id="ang-graph"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>已选中的顶点</span><span><i style="background:var(--bad)"></i>找到的一个 4-圈</span></div>
    <div class="readout" id="ang-out" aria-live="polite"></div>
    <div class="table-wrap" id="ang-table"></div>
    <p class="small muted">先点一个顶点，再点另一个顶点：两点之间没有边就加上，有边就删掉。表格只列公共邻点数至少 2 的点对（它们就是 4-圈的“对角”）。</p>
  </div>`;
  const sel = $("#ang-preset", mount);
  let pos = [], edges = new Set(), picked = -1;
  const key = (a, b) => a < b ? a + "-" + b : b + "-" + a;
  function load() {
    const p = presets[sel.value];
    pos = p.pos; edges = new Set(p.edges.map(([a, b]) => key(a, b))); picked = -1; draw();
  }
  function draw() {
    const n = pos.length, adj = Array.from({ length: n }, () => new Set());
    for (const k of edges) { const [a, b] = k.split("-").map(Number); adj[a].add(b); adj[b].add(a); }
    const deg = adj.map(s => s.size), E = edges.size;
    const S = deg.reduce((t, d) => t + d * (d - 1) / 2, 0);
    let S2 = 0, bad = [], cycle = null;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const common = [...adj[i]].filter(x => adj[j].has(x));
      S2 += common.length;
      if (common.length >= 2) { bad.push([i, j, common]); if (!cycle) cycle = [i, common[0], j, common[1]]; }
    }
    const onCycle = new Set();
    if (cycle) for (let t = 0; t < 4; t++) onCycle.add(key(cycle[t], cycle[(t + 1) % 4]));
    const lines = [...edges].map(k => {
      const [a, b] = k.split("-").map(Number), hit = onCycle.has(k);
      return `<line x1="${pos[a][0].toFixed(1)}" y1="${pos[a][1].toFixed(1)}" x2="${pos[b][0].toFixed(1)}" y2="${pos[b][1].toFixed(1)}" style="stroke:var(${hit ? "--bad" : "--muted"});stroke-width:${hit ? 4 : 2.2}"/>`;
    }).join("");
    const dots = pos.map(([x, y], i) => `<g data-v="${i}" role="button" tabindex="0" aria-label="顶点 ${i + 1}，度 ${deg[i]}" style="cursor:pointer"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="22" style="fill:var(${i === picked ? "--accent" : "--surface"});stroke:var(--ink);stroke-width:1.5"/><text x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="middle" style="fill:var(${i === picked ? "--accent-ink" : "--ink"});font:600 14px var(--f-mono);pointer-events:none">${i + 1}</text></g>`).join("");
    $("#ang-graph", mount).innerHTML = `<svg viewBox="0 0 600 310" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="${n} 个顶点、${E} 条边的图${cycle ? "，红色标出一个 4-圈" : "，没有 4-圈"}">${lines}${dots}</svg>`;
    const low = 2 * E * E / n - E, pairs = n * (n - 1) / 2, bound = n * (1 + Math.sqrt(4 * n - 3)) / 4;
    $("#ang-out", mount).innerHTML = `<span>n = ${n}，E = ${E}，度数 (${deg.join(", ")})</span>`
      + `<span>按顶点数：S = Σ C(dᵢ,2) = <b>${S}</b>；按支点对数：Σ c(B,C) = <b>${S2}</b>${S === S2 ? "，两种数法一致" : ""}。</span>`
      + `<span>下界 2E²/n − E = ${low.toFixed(2)} ≤ S${Math.abs(low - S) < 1e-9 ? "（取等：正则图）" : ""}。</span>`
      + (cycle ? `<span>有 4-圈：${cycle.map(v => v + 1).join("–")}–${cycle[0] + 1}；共有 ${bad.length} 个点对的公共邻点数 ≥ 2，所以上界 S ≤ C(n,2) 不再适用。</span>`
        : `<span>无 4-圈：每对至多 1 个公共邻点，S = ${S} ≤ C(n,2) = ${pairs}；边数 E = ${E} ≤ n(1+√(4n−3))/4 = ${bound.toFixed(2)}。</span>`)
      + (picked >= 0 ? `<span>已选顶点 ${picked + 1}，再点另一个顶点加边或删边。</span>` : "");
    $("#ang-table", mount).innerHTML = bad.length ? `<table><thead><tr><th>点对 {B, C}</th><th>公共邻点</th><th>c(B,C)</th></tr></thead><tbody>${bad.slice(0, 12).map(([i, j, c]) => `<tr><td>{${i + 1}, ${j + 1}}</td><td>${c.map(v => v + 1).join(", ")}</td><td class="mono">${c.length}</td></tr>`).join("")}</tbody></table>${bad.length > 12 ? `<p class="small muted">另有 ${bad.length - 12} 对未列出。</p>` : ""}` : "";
  }
  function pick(v) {
    if (picked < 0) picked = v;
    else if (picked === v) picked = -1;
    else { const k = key(picked, v); if (edges.has(k)) edges.delete(k); else edges.add(k); picked = -1; }
    draw();
  }
  const graph = $("#ang-graph", mount);
  graph.addEventListener("click", ev => { const g = ev.target.closest("[data-v]"); if (g) pick(+g.dataset.v); });
  graph.addEventListener("keydown", ev => { const g = ev.target.closest("[data-v]"); if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); pick(+g.dataset.v); } });
  sel.addEventListener("change", load);
  $("#ang-clear", mount).addEventListener("click", () => { edges = new Set(); picked = -1; draw(); });
  load();
}


/* ================= 交互工具：计数公式与穷举 ================= */
function countPlay(mount) {
  mount.innerHTML = `<div class="widget"><div class="ctrl"><label for="cnt-mode">对象 <select id="cnt-mode"><option value="derange">错位排序</option><option value="subsets">不含相邻元素的子集</option><option value="onto">到三个标号盒的满射</option></select></label><label for="cnt-n">规模 n <input id="cnt-n" type="range" min="0" max="8" step="1" value="5"></label><output id="cnt-size" for="cnt-n"></output></div><div class="readout" id="cnt-out" aria-live="polite"></div><div class="table-wrap" id="cnt-table"></div><p class="small muted" id="cnt-note"></p><p class="small" id="cnt-list" style="overflow-wrap:anywhere"></p></div>`;
  const mode = $("#cnt-mode", mount), slider = $("#cnt-n", mount);
  const fact = n => { let a = 1; for (let i = 2; i <= n; i++) a *= i; return a; };
  const choose = (n, k) => fact(n) / fact(k) / fact(n - k);
  function update() {
    const n = +slider.value, kind = mode.value;
    $("#cnt-size", mount).textContent = n;
    let count = 0, samples = [], rows = [], answer = 0, expression = "", note = "";
    const record = text => { count++; if (samples.length < 12) samples.push(text); };
    if (kind === "derange") {
      // 穷举全部排列；固定点检验与容斥公式分别计算。
      function visit(a, used) {
        if (a.length === n) { if (a.every((v, i) => v !== i + 1)) record(a.length ? "(" + a.join(",") + ")" : "空排列"); return; }
        for (let v = 1; v <= n; v++) if (!(used & (1 << (v - 1)))) visit(a.concat(v), used | (1 << (v - 1)));
      }
      visit([], 0);
      for (let k = 0; k <= n; k++) {
        const term = (k % 2 ? -1 : 1) * choose(n, k) * fact(n - k);
        answer += term; rows.push([k, choose(n, k), fact(n - k), term]);
      }
      expression = "错位排序：容斥交替和";
      rows = [["固定位置数 k", "选位置", "剩余排列", "带符号贡献"], ...rows];
      note = "交集只固定指定位置，其余允许固定；n=0 时空排列一种。";
    } else if (kind === "subsets") {
      for (let bits = 0; bits < 2 ** n; bits++) if (!(bits & (bits << 1))) {
        const a = Array.from({ length: n }, (_, i) => i + 1).filter(i => bits & (1 << (i - 1)));
        record(a.length ? "{" + a.join(",") + "}" : "∅");
      }
      const a = [1, 2]; for (let i = 2; i <= n; i++) a[i] = a[i - 1] + a[i - 2];
      answer = a[n]; expression = "不含相邻元素：递推与位掩码枚举";
      rows = [["规模", "不取末位", "取末位", "总数"]];
      for (let i = 0; i <= n; i++) rows.push([i, i >= 2 ? a[i - 1] : "初值", i >= 2 ? a[i - 2] : "初值", a[i]]);
      note = "编号排成路径，首尾不相邻；空集计入，a₀=1、a₁=2。";
    } else {
      for (let code = 0; code < 3 ** n; code++) {
        let c = code, seen = 0, a = [];
        for (let i = 0; i < n; i++) { const v = c % 3; c = Math.floor(c / 3); seen |= 1 << v; a.push(v + 1); }
        if (seen === 7) record("(" + a.join(",") + ")");
      }
      for (let k = 0; k <= 3; k++) {
        const power = (3 - k) ** n, term = (k % 2 ? -1 : 1) * choose(3, k) * power;
        answer += term; rows.push([k, choose(3, k), power, term]);
      }
      expression = "到三个标号盒的满射：空盒容斥";
      rows = [["指定空盒数 k", "选盒", "交集大小", "带符号贡献"], ...rows];
      note = "元组第 i 项是物体 i 的盒号。n=0 时从空集到空集有一个映射，故交集计数约定 0⁰=1；到三个盒的满射仍为 0。";
    }
    $("#cnt-out", mount).textContent = expression + "；公式值 = " + answer + "；独立枚举 = " + count + (answer === count ? " ✓ 一致" : " ✗ 不一致");
    $("#cnt-table", mount).innerHTML = "<table><thead><tr>" + rows[0].map(x => "<th>" + x + "</th>").join("") + "</tr></thead><tbody>" + rows.slice(1).map(row => "<tr>" + row.map(x => "<td>" + x + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
    $("#cnt-note", mount).textContent = note;
    $("#cnt-list", mount).textContent = count ? "合法对象示例（最多显示 12 个）：" + samples.join("；") + (count > 12 ? "；……" : "") : "没有合法对象。";
  }
  mode.addEventListener("change", update); slider.addEventListener("input", update); update();
}

/* 组合概率：精确生日概率；沿讲义 366 天均匀独立模型。 */
function birthdayPlay(mount) {
  mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="birth-k">人数 k <input id="birth-k" type="range" min="1" max="80" value="23" step="1"></label><output id="birth-size" for="birth-k"></output></div><div class="readout" id="birth-out" aria-live="polite"></div><div id="birth-bars"></div><div class="table-wrap" id="birth-table"></div><p class="small muted">蓝色为至少一对同生日的精确概率；紫色为碰撞对数期望给出的上界（截到 1）。期望是“对数”，与概率不同。模型固定为 366 天、每人独立均匀。</p></div>`;
  const kInput=$("#birth-k",mount);
  const exact=k=>{let q=1;for(let i=0;i<k;i++)q*=1-i/366;return 1-q;};
  function draw(){
    const k=+kInput.value,p=exact(k),mean=k*(k-1)/(2*366),bound=Math.min(1,mean);
    $("#birth-size",mount).textContent=k;
    $("#birth-out",mount).textContent=`k=${k}；碰撞概率=${p.toFixed(6)}；同生日人对数期望=${mean.toFixed(6)}；上界=${bound.toFixed(6)}`;
    $("#birth-bars",mount).innerHTML=`<svg viewBox="0 0 560 70" style="width:100%;display:block" role="img" aria-label="精确概率与并集上界比较"><rect x="0" y="5" width="${p*550}" height="20" fill="var(--teal)"/><rect x="0" y="40" width="${bound*550}" height="20" fill="var(--accent)"/></svg>`;
    const ks=[...new Set([1,22,23,k])].sort((a,b)=>a-b);
    $("#birth-table",mount).innerHTML='<table><thead><tr><th>人数</th><th>精确碰撞概率</th><th>是否大于 1/2</th></tr></thead><tbody>'+ks.map(j=>`<tr><td>${j}</td><td>${exact(j).toFixed(6)}</td><td>${exact(j)>.5?'是':'否'}</td></tr>`).join('')+'</tbody></table>';
  }
  kInput.addEventListener('input',draw);draw();
}
/* 概率界：二项分布精确求和与 Chebyshev 界，支持严格/非严格阈值。 */
function tailPlay(mount) {
  mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="tail-n">硬币次数 n <input id="tail-n" type="range" min="2" max="40" step="1" value="20"></label><output id="tail-size" for="tail-n"></output><label for="tail-eps">偏离阈值 <select id="tail-eps"><option value="0.1">0.1</option><option value="0.2" selected>0.2</option><option value="0.3">0.3</option></select></label><label><input type="checkbox" id="tail-strict">使用严格 &gt;（默认 ≥）</label></div><div id="tail-graph"></div><div class="readout" id="tail-out" aria-live="polite"></div><p class="small muted">红柱属于偏离事件，蓝柱不属于。精确值由二项概率逐项相加，不靠随机模拟。切换严格号时，恰在阈值上的柱子会改变归属；Chebyshev 上界对两种尾事件都成立。</p></div>`;
  const nInput=$("#tail-n",mount),epsInput=$("#tail-eps",mount),strict=$("#tail-strict",mount);
  function draw(){
    const n=+nInput.value,eps=+epsInput.value,probs=[2**(-n)];
    for(let k=1;k<=n;k++)probs[k]=probs[k-1]*(n-k+1)/k;
    const tail=k=>strict.checked?Math.abs(k/n-.5)>eps+1e-12:Math.abs(k/n-.5)>=eps-1e-12;
    const exact=probs.reduce((s,p,k)=>s+(tail(k)?p:0),0),raw=1/(4*n*eps*eps),bound=Math.min(1,raw),max=Math.max(...probs),bar=520/(n+1);
    $("#tail-size",mount).textContent=n;
    $("#tail-graph",mount).innerHTML=`<svg viewBox="0 0 560 180" style="width:100%;display:block" role="img" aria-label="公平硬币正面次数的二项分布，红色表示尾事件">${probs.map((p,k)=>`<rect x="${20+k*bar}" y="${150-130*p/max}" width="${Math.max(1,bar-1)}" height="${130*p/max}" fill="${tail(k)?'var(--bad)':'var(--teal)'}"/>`).join('')}<path d="M20,150H540" stroke="var(--muted)"/><text x="20" y="174" fill="var(--ink)" font-size="14">0</text><text x="525" y="174" fill="var(--ink)" font-size="14">${n}</text></svg>`;
    $("#tail-out",mount).textContent=`n=${n}，ε=${eps}，事件 |频率−1/2|${strict.checked?'>':'≥'}ε；精确概率=${exact.toFixed(6)}；Chebyshev 原界=${raw.toFixed(6)}，截到 1 后=${bound.toFixed(6)}`;
  }
  nInput.addEventListener('input',draw);epsInput.addEventListener('change',draw);strict.addEventListener('change',draw);draw();
}
/* 数论：扩展欧几里得与同余枚举（输入范围保证精确整数运算）。 */
function euclidPlay(mount){
  mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="eg-a">系数 a <input id="eg-a" type="number" min="1" max="1000" step="1" value="252" style="width:6em"></label><label for="eg-m">模数 m <input id="eg-m" type="number" min="2" max="1000" step="1" value="198" style="width:6em"></label><label for="eg-b">右端 b <input id="eg-b" type="number" min="-1000" max="1000" step="1" value="90" style="width:6em"></label></div><div class="readout" id="eg-out" aria-live="polite"></div><div class="table-wrap" id="eg-table"></div><p class="small" id="eg-sol" style="overflow-wrap:anywhere"></p><p class="small muted">计算 a·x≡b (mod m)。相除表求 gcd，扩展算法给 Bezout 系数；枚举 x=0,…,m−1 独立核对解数。输入 a=6,m=14,b=8 可看约分后模数变化。</p></div>`;
  const controls=['a','m','b'].map(k=>$("#eg-"+k,mount));
  function draw(){
    const [a,m,b]=controls.map(e=>Number(e.value));
    if(!Number.isInteger(a)||a<1||a>1000||!Number.isInteger(m)||m<2||m>1000||!Number.isInteger(b)||Math.abs(b)>1000){$("#eg-out",mount).textContent='请输入整数：a 为 1–1000，m 为 2–1000，b 为 −1000–1000。';$("#eg-table",mount).innerHTML='';$("#eg-sol",mount).textContent='';return;}
    let r0=a,r1=m,s0=1,s1=0,t0=0,t1=1,rows=[];
    while(r1){const q=Math.floor(r0/r1),r=r0-q*r1;rows.push([r0,q,r1,r]);[r0,r1]=[r1,r];[s0,s1]=[s1,s0-q*s1];[t0,t1]=[t1,t0-q*t1];}
    const d=r0,solutions=[];for(let x=0;x<m;x++)if(((a*x-b)%m+m)%m===0)solutions.push(x);
    const solvable=b%d===0,mod=m/d,base=solvable?((s0*(b/d))%mod+mod)%mod:null;
    $("#eg-out",mount).textContent=`gcd(${a},${m})=${d}；${a}×(${s0})+${m}×(${t0})=${d}；${solvable?'gcd 整除右端，有解':'gcd 不整除右端，无解'}`;
    $("#eg-table",mount).innerHTML='<table><thead><tr><th>被除数</th><th>商</th><th>除数</th><th>余数</th></tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    $("#eg-sol",mount).textContent=solvable?`缩模解：x≡${base} (mod ${mod})；模 ${m} 下共有 ${d} 个解。枚举核对 ${solutions.length} 个：`+solutions.slice(0,24).join('，')+(solutions.length>24?'，……':''):`独立枚举也找到 ${solutions.length} 个解。`;
  }
  controls.forEach(e=>e.addEventListener('input',draw));draw();
}
/* 匹配：n=3 图的全部完美匹配，切换匹配观察对称差。 */
function alternatingPlay(mount){
  mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="alt-preset">例图 <select id="alt-preset"><option value="cycle">六圈：两个完美匹配</option><option value="tri">上三角：阈值处唯一</option><option value="complete">K3,3：超过阈值</option></select></label><button class="btn" type="button" id="alt-next">换到另一匹配</button></div><div id="alt-graph"></div><div class="table-wrap" id="alt-matrix"></div><div class="readout" id="alt-out" aria-live="polite"></div><p class="small muted">紫色实线为当前匹配，青色虚线为其余边。点矩阵中的格子加删边；匹配由 3! 个排列全部枚举。存在第二匹配等价于相对当前匹配存在交错圈；边数超过 6 是充分条件，等于 6 时可能唯一也可能不唯一。</p></div>`;
  const presets={cycle:[[0,0],[1,1],[2,2],[1,0],[2,1],[0,2]],tri:[[0,0],[0,1],[0,2],[1,1],[1,2],[2,2]],complete:Array.from({length:9},(_,k)=>[Math.floor(k/3),k%3])};
  const permutations=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
  let edges=new Set(),matches=[],idx=0;
  const key=(a,b)=>a+'-'+b;
  function draw(){
    matches=permutations.filter(p=>p.every((b,a)=>edges.has(key(a,b))));idx=matches.length?idx%matches.length:0;
    const M=matches[idx],lines=[...edges].map(k=>{const[a,b]=k.split('-').map(Number),chosen=M&&M[a]===b;return `<line x1="${100+a*180}" y1="55" x2="${100+b*180}" y2="205" stroke="${chosen?'var(--accent)':'var(--teal)'}" stroke-width="${chosen?5:2}" ${chosen?'':'stroke-dasharray="6 4"'}/>`;}).join('');
    $("#alt-graph",mount).innerHTML=`<svg viewBox="0 0 560 255" style="width:100%;display:block" role="img" aria-label="三加三二部图与当前完美匹配">${lines}${Array.from({length:3},(_,i)=>`<circle cx="${100+i*180}" cy="55" r="16" fill="var(--surface)" stroke="var(--ink)"/><circle cx="${100+i*180}" cy="205" r="16" fill="var(--surface)" stroke="var(--ink)"/><text x="${100+i*180}" y="27" text-anchor="middle" fill="var(--ink)" font-size="17">a${i+1}</text><text x="${100+i*180}" y="243" text-anchor="middle" fill="var(--ink)" font-size="17">b${i+1}</text>`).join('')}</svg>`;
    $("#alt-matrix",mount).innerHTML='<table><thead><tr><th>加删边</th><th>b1</th><th>b2</th><th>b3</th></tr></thead><tbody>'+Array.from({length:3},(_,a)=>`<tr><th>a${a+1}</th>${Array.from({length:3},(_,b)=>`<td><button class="btn" type="button" data-alt-e="${key(a,b)}" aria-label="边 a${a+1} b${b+1}" aria-pressed="${edges.has(key(a,b))}">${edges.has(key(a,b))?(M&&M[a]===b?'匹配':'有边'):'无边'}</button></td>`).join('')}</tr>`).join('')+'</tbody></table>';
    $("#alt-next",mount).disabled=matches.length<2;
    $("#alt-out",mount).textContent=`n=3，边数 E=${edges.size}，阈值 n(n+1)/2=6；完美匹配共 ${matches.length} 个。`+(M?`当前 ${idx+1}：`+M.map((b,a)=>`a${a+1}–b${b+1}`).join('，'):'当前没有完美匹配，不能使用真题以给定完美匹配为前提的结论。');
  }
  function load(){edges=new Set(presets[$("#alt-preset",mount).value].map(([a,b])=>key(a,b)));idx=0;draw();}
  $("#alt-preset",mount).addEventListener('change',load);
  $("#alt-next",mount).addEventListener('click',()=>{idx++;draw();});
  $("#alt-matrix",mount).addEventListener('click',ev=>{const button=ev.target.closest('[data-alt-e]');if(!button)return;const k=button.dataset.altE;if(edges.has(k))edges.delete(k);else edges.add(k);idx=0;draw();});load();
}

function examClock(mount){
 const id='clock-'+currentView,total=7200;
 mount.innerHTML=`<div class="widget"><p class="small muted">本地计时，不会自动交卷；离开页面后仍按实际经过时间计算，暂停可停止累计。</p><div class="readout" id="exam-time" aria-live="off"></div><div class="row"><button class="btn primary" id="exam-toggle" type="button">开始计时</button><button class="btn" id="exam-reset" type="button">重置为120分钟</button></div></div>`;
 let clock={elapsed:0,startedAt:0,running:false,...(state[id]||{})};
 const used=()=>Math.min(total,Math.max(0,clock.elapsed+(clock.running?(Date.now()-clock.startedAt)/1000:0)));
 function draw(){if(!mount.isConnected)return;const remain=Math.max(0,Math.ceil(total-used())),m=Math.floor(remain/60),s=remain%60;mount.querySelector('#exam-time').textContent=remain?`剩余 ${m}:${String(s).padStart(2,'0')} / 120:00`:'时间到。请先停止作答，再打开解答评分。';mount.querySelector('#exam-toggle').textContent=clock.running?'暂停计时':used()?'继续计时':'开始计时';}
 mount.querySelector('#exam-toggle').addEventListener('click',()=>{if(clock.running)clock={...clock,elapsed:used(),running:false,startedAt:0};else clock={...clock,running:true,startedAt:Date.now()};save(id,clock);draw();});
 mount.querySelector('#exam-reset').addEventListener('click',()=>{clock={elapsed:0,startedAt:0,running:false};save(id,clock);draw();});
 function tick(){if(!mount.isConnected)return;draw();setTimeout(tick,1000);}draw();setTimeout(tick,1000);
}

/* 课堂运输表：支撑图的偶圈消去；所有预设为小整数，行列和逐步核对。 */
function transportPlay(mount) {
  mount.innerHTML=`<div class="widget"><div class="ctrl"><label for="tr-preset">运输表 <select id="tr-preset"><option value="dense">3×3 全正表</option><option value="smallcycle">5 条边但仍有四圈</option><option value="forest">已经是树</option><option value="zero">全零表</option></select></label><button class="btn" type="button" id="tr-step">消一圈</button><button class="btn" type="button" id="tr-all">消到森林</button><button class="btn" type="button" id="tr-reset">重置</button></div><div class="table-wrap" id="tr-table"></div><div class="readout" id="tr-out" aria-live="polite"></div><p class="small" id="tr-cycle"></p><div class="table-wrap" id="tr-history"></div><p class="small muted">圈中加号格加 ε，减号格减 ε；ε 取减号格的最小正值。正项为运输路线，行列和固定。到达森林保证上界，不声称得到全局最少路线数，也没有引入运输费用。</p></div>`;
  const presets={dense:[[4,2,1],[1,3,2],[2,1,4]],smallcycle:[[1,1,0],[1,1,0],[0,0,2]],forest:[[3,0,0],[1,4,0],[0,2,5]],zero:[[0,0,0],[0,0,0],[0,0,0]]};
  let A=[],initialRows=[],initialCols=[],history=[];
  const rows=M=>M.map(r=>r.reduce((a,b)=>a+b,0)),cols=M=>M[0].map((_,j)=>M.reduce((s,r)=>s+r[j],0));
  const edge=(u,v)=>u<3?[u,v-3]:[v,u-3];
  function support(){
    const adj=Array.from({length:6},()=>[]);let E=0;
    for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(A[i][j]>0){adj[i].push(j+3);adj[j+3].push(i);E++;}
    const visited=new Set();let components=0;
    for(let i=0;i<6;i++)if(!visited.has(i)){components++;const stack=[i];visited.add(i);while(stack.length){const v=stack.pop();for(const w of adj[v])if(!visited.has(w)){visited.add(w);stack.push(w);}}}
    const color=Array(6).fill(0),parent=Array(6).fill(-1);let cycle=null;
    function dfs(v){color[v]=1;for(const w of adj[v]){if(w===parent[v])continue;if(color[w]===0){parent[w]=v;if(dfs(w))return true;}else if(color[w]===1){const path=[v];let u=v;while(u!==w){u=parent[u];path.push(u);}cycle=path.map((x,k)=>edge(x,path[(k+1)%path.length]));return true;}}color[v]=2;return false;}
    for(let i=0;i<6&&!cycle;i++)if(color[i]===0)dfs(i);
    const eps=cycle?Math.min(...cycle.filter((_,k)=>k%2===1).map(([i,j])=>A[i][j])):0;
    return {E,components,cycle,eps};
  }
  function apply(){const s=support();if(!s.cycle)return false;const before=s.E;for(let k=0;k<s.cycle.length;k++){const[i,j]=s.cycle[k];A[i][j]+=(k%2?-1:1)*s.eps;}history.push({step:history.length+1,eps:s.eps,before,after:support().E});return true;}
  function draw(){
    const s=support(),r=rows(A),c=cols(A),signs=new Map(s.cycle?s.cycle.map(([i,j],k)=>[i+'-'+j,k%2?'−':'+']):[]),ok=r.every((x,i)=>x===initialRows[i])&&c.every((x,i)=>x===initialCols[i])&&A.every(row=>row.every(x=>x>=0));
    $("#tr-table",mount).innerHTML='<table><thead><tr><th>运量</th><th>C1</th><th>C2</th><th>C3</th><th>行和</th></tr></thead><tbody>'+A.map((row,i)=>`<tr><th>R${i+1}</th>${row.map((x,j)=>{const sign=signs.get(i+'-'+j);return `<td style="${sign?'background:var(--accent-soft);font-weight:700':''}">${x}${sign?' '+sign:''}</td>`;}).join('')}<td>${r[i]}</td></tr>`).join('')+`<tr><th>列和</th>${c.map(x=>'<td>'+x+'</td>').join('')}<td>${r.reduce((a,b)=>a+b,0)}</td></tr></tbody></table>`;
    $("#tr-out",mount).textContent=`步骤 ${history.length}；正项 E=${s.E}，顶点 V=6，分支 c=${s.components}；${s.cycle?'支撑有圈':'支撑为森林，E=V−c='+ (6-s.components)}；行列和与非负性 ${ok?'✓ 全部保持':'✗ 检查失败'}`;
    $("#tr-cycle",mount).textContent=s.cycle?'下一圈：'+s.cycle.map(([i,j],k)=>`R${i+1}C${j+1}(${k%2?'−':'+'})`).join(' → ')+`；ε=${s.eps}。`:'没有可消的圈；包括孤立行列点在内，森林公式仍成立。';
    $("#tr-step",mount).disabled=!s.cycle;$("#tr-all",mount).disabled=!s.cycle;
    $("#tr-history",mount).innerHTML=history.length?'<table><thead><tr><th>步</th><th>ε</th><th>正项数</th></tr></thead><tbody>'+history.map(h=>`<tr><td>${h.step}</td><td>${h.eps}</td><td>${h.before} → ${h.after}</td></tr>`).join('')+'</tbody></table>':'';
  }
  function load(){A=presets[$("#tr-preset",mount).value].map(row=>row.slice());initialRows=rows(A);initialCols=cols(A);history=[];draw();}
  $("#tr-preset",mount).addEventListener('change',load);$("#tr-reset",mount).addEventListener('click',load);
  $("#tr-step",mount).addEventListener('click',()=>{apply();draw();});
  $("#tr-all",mount).addEventListener('click',()=>{while(apply()){}draw();});load();
}

renderNav();
render();
