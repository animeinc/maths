  sections: [
    { id: "n1-s1", h: "1. 定理：取模映射是双射", html: R`<p><b>这节解决什么：</b>“一个数除以 3 余 2、除以 5 余 3、除以 7 余 2，求这个数”——这类方程组什么时候有解、有几个解。</p><p><b>记号：</b>$a\equiv b\pmod m$ 表示 $m\mid a-b$（$a,b$ 除以 $m$ 余数相同）。$\mathbb Z_m$ 表示模 $m$ 的全部 $m$ 个剩余类，$[x]_m$ 表示 $x$ 所在的类。“两两互素”指任意两个模数的最大公因数都是 1。</p><p><b>中国剩余定理（CRT）：</b>设 $m_1,\dots,m_r\ge2$ <b>两两互素</b>，$M=m_1m_2\cdots m_r$。则对任意 $a_1,\dots,a_r$，方程组 $$x\equiv a_i\pmod{m_i}\quad(i=1,\dots,r)$$ 有解，且解在模 $M$ 下<b>唯一</b>（所有解恰好构成一个模 $M$ 的剩余类）。</p><p><b>课上的说法：</b>映射 $\Phi:\mathbb Z_M\to\mathbb Z_{m_1}\times\cdots\times\mathbb Z_{m_r}$，$[x]_M\mapsto([x]_{m_1},\dots,[x]_{m_r})$（把 $x$ 变成它除以各 $m_i$ 的余数组）是双射（课上还说它保持加法和乘法，称为“环同构”）。证明：</p><ol><li><b>单射</b>：若 $x,y$ 的余数组相同，则每个 $m_i\mid x-y$。因为 $m_i$ 两两互素，它们的乘积 $M\mid x-y$，即 $[x]_M=[y]_M$。（课上用素因子说明：$M$ 的每个素因子的幂只出现在某一个 $m_i$ 里。）</li><li><b>满射</b>：两边都恰有 $M$ 个元素，单射的映射必然也是满射。</li></ol><p>满射就是“有解”，单射就是“模 $M$ 唯一”。</p><p><b>互素不能省：</b>$4\mid12$ 且 $6\mid12$，但 $4\times6=24\nmid12$。</p>` },
    { id: "n1-s2", h: "2. 构造解：N、L、M 三步", html: R`<p><b>这节解决什么：</b>把 CRT 的“有解”变成具体算法。</p><p><b>三步法：</b></p><ol><li>$N_i=M/m_i$（除 $m_i$ 以外所有模数的乘积）。它被其他每个 $m_j$ 整除。</li><li>求 $L_i$，使 $N_iL_i\equiv1\pmod{m_i}$（$L_i$ 叫 $N_i$ 模 $m_i$ 的<b>逆元</b>）。因为 $\gcd(N_i,m_i)=1$，逆元存在；模数小时先把 $N_i$ 模 $m_i$ 约小再试 $1,2,\dots$，模数大时用辗转相除求 $N_iL_i+m_iq_i=1$。</li><li>$M_i=N_iL_i$。它满足 $M_i\equiv1\pmod{m_i}$、$M_i\equiv0\pmod{m_j}$（$j\ne i$）。所以 $$x\equiv a_1M_1+a_2M_2+\cdots+a_rM_r\pmod M.$$ （模 $m_i$ 看，只有第 $i$ 项留下 $a_i\cdot1$。）</li></ol><p><b>孙子歌：</b>模 3、5、7，$M=105$。$N_1=35\equiv2\pmod3$，逆元 $L_1=2$，$M_1=70$；$N_2=21\equiv1\pmod5$，$M_2=21$；$N_3=15\equiv1\pmod7$，$M_3=15$。所以 $x\equiv70a+21b+15c\pmod{105}$。口诀：“三人同行七十稀，五树梅花廿一枝，七子团圆正半月，除百零五便得知。”</p><p><b>模数不互素</b>（课外但常用）：$x\equiv a\pmod m$、$x\equiv b\pmod n$ 有解 $\iff\gcd(m,n)\mid a-b$；有解时在模 $\operatorname{lcm}(m,n)$（最小公倍数）下唯一。做法：代入 $x=a+mt$，解关于 $t$ 的一次同余 $mt\equiv b-a\pmod n$。例：$x\equiv1\pmod4$，$x\equiv3\pmod6$：$\gcd=2\mid2$，有解；$4t\equiv2\pmod6\Rightarrow2t\equiv1\pmod3\Rightarrow t\equiv2$，$x=9$，模 12 唯一。</p><p><b>省事的观察：</b>余数比模数都小同一个数时可直接合并，例如 $x\equiv-6\pmod{11}$ 且 $x\equiv-6\pmod{13}$ ⇒ $x\equiv-6\pmod{143}$（$x+6$ 同时被 11、13 整除）。</p>` },

    { id: "n1-p3", lv: "基础", src: "课件 11-17 例", stmt: R`称第一象限的整点 $P=(u,v)$ 从原点看不可见，若开线段 $OP$ 上还有整点。证明：任给正整数 $n$，存在正整数 $X,Y$，使 $n\times n$ 方阵中的每个整点 $(X+i,Y+j)$（$0\le i,j\lt n$）从原点看都不可见。`,

      method: "m-crt-build", sol: R`<p><b>引理：</b>若 $g=\gcd(u,v)\gt1$，则点 $Q=(u/g,v/g)$ 的坐标是正整数，且 $Q=\frac1gP$ 在开线段 $OP$ 上（$0\lt\frac1g\lt1$），所以 $P$ 不可见。</p><p><b>构造：</b></p><ol><li>取 $n^2$ 个互不相同的素数 $p_{ij}$（$0\le i,j\lt n$），素数有无穷多个，所以能取到。</li><li>考虑两组方程 $$X\equiv-i\pmod{p_{ij}},\qquad Y\equiv-j\pmod{p_{ij}}\qquad(0\le i,j\lt n).$$ 每组的模数是不同的素数，两两互素，由 CRT 各自有解。</li><li>解加上 $\prod p_{ij}$ 的足够大倍数仍是解，所以可取 $X,Y$ 为正整数。</li></ol><p><b>验证：</b>对每个 $(i,j)$，$p_{ij}\mid X+i$ 且 $p_{ij}\mid Y+j$，所以 $\gcd(X+i,Y+j)\ge p_{ij}\gt1$，由引理点 $(X+i,Y+j)$ 不可见。</p><p><b>结论得证。</b></p>` }
  ],
  variants: [
    { id: "n1-v1", lv: "变种", src: "仿课件例", stmt: R`证明：对任意正整数 $n$，存在 $n$ 个连续正整数，其中每一个都能被某个大于 1 的完全平方数整除。`,
      hints: [R`第 $i$ 个数 $x+i$ 要被某个平方数整除：给它配一个素数 $p_i$，要求 $p_i^2\mid x+i$。`, R`写成同余式：$x\equiv-i\pmod{p_i^2}$，$i=1,\dots,n$。`, R`不同素数的平方两两互素，CRT 给出解 $x$；加 $\prod p_i^2$ 的倍数使 $x$ 为正。`],
      method: "m-crt-build", sol: R`<p><b>构造：</b>取 $n$ 个不同的素数 $p_1,\dots,p_n$（如前 $n$ 个素数）。考虑方程组 $$x\equiv-i\pmod{p_i^2},\quad i=1,\dots,n.$$</p><p><b>有解：</b>$p_i\ne p_j$ 时 $\gcd(p_i^2,p_j^2)=1$，模数两两互素，由 CRT 存在解；加上 $\prod p_i^2$ 的倍数可使 $x$ 为正整数。</p><p><b>验证：</b>对每个 $i$，$p_i^2\mid x+i$，而 $p_i^2\gt1$ 是完全平方数。所以 $x+1,x+2,\dots,x+n$ 这 $n$ 个连续正整数都满足要求。</p><p><b>结论得证。</b>例：$n=2$，$x\equiv-1\pmod4$，$x\equiv-2\pmod9$，得 $x\equiv7\pmod{36}$，即 $8=4\cdot2$，$9=9\cdot1$。</p>` },
    { id: "n1-v2", lv: "变种", src: "自编", stmt: R`一个正整数除以 7 余 3，除以 11 余 5，除以 13 余 7。求满足条件的最小正整数。`,
      hints: [R`看余数和模数的差：$3=7-4$，$5=11-6$，$7=13-6$。后两个都是“比模数少 6”。`, R`所以 $x\equiv-6\pmod{11}$ 且 $x\equiv-6\pmod{13}$，合并成 $x\equiv-6\pmod{143}$，写成 $x=143k-6$。`, R`代入模 7：$143\equiv3\pmod7$，解 $3k-6\equiv3\pmod7$。`],
      method: "m-crt-merge", sol: R`<p><b>第 1 步：合并后两个方程。</b>$x\equiv5\pmod{11}$ 即 $x\equiv-6\pmod{11}$；$x\equiv7\pmod{13}$ 即 $x\equiv-6\pmod{13}$。所以 $11\mid x+6$ 且 $13\mid x+6$，11、13 互素，得 $143\mid x+6$，即 $x=143k-6$。</p><p><b>第 2 步：代入第一个方程。</b>$143=7\times20+3\equiv3\pmod7$，所以 $3k-6\equiv3\pmod7$，$3k\equiv9\pmod7$，两边乘 3 的逆元（$3\times5=15\equiv1$，逆元是 5）或直接约去 3（$\gcd(3,7)=1$）得 $k\equiv3\pmod7$。</p><p><b>第 3 步：</b>取 $k=3$，$x=429-6=423$；通解 $x\equiv423\pmod{1001}$（$1001=7\times11\times13$）。</p><p><b>验算：</b>$423=7\cdot60+3=11\cdot38+5=13\cdot32+7$。✓</p><p><b>答：最小正整数为 423。</b></p>` },
    { id: "n1-v3", lv: "变种", src: "模数不互素", stmt: R`(1) 解 $x\equiv3\pmod6$，$x\equiv5\pmod8$。(2) 说明 $x\equiv3\pmod6$，$x\equiv4\pmod8$ 无解。`,
      hints: [R`$\gcd(6,8)=2$。有解的条件是 $2\mid$ 余数之差：(1) 中 $5-3=2$，(2) 中 $4-3=1$。`, R`(1) 代入 $x=3+6t$，第二个方程变成 $6t\equiv2\pmod8$。`, R`两边和模数同除以 2：$3t\equiv1\pmod4$，$3\times3=9\equiv1$，所以 $t\equiv3\pmod4$。`],
      method: "m-crt-merge", sol: R`<p><b>(1)</b> $\gcd(6,8)=2$，$2\mid5-3$，有解，且模 $\operatorname{lcm}(6,8)=24$ 唯一。</p><ol><li>由第一个方程 $x=3+6t$（$t$ 为整数）。</li><li>代入第二个：$3+6t\equiv5\pmod8$，即 $6t\equiv2\pmod8$。</li><li>$8\mid6t-2\iff4\mid3t-1$，即 $3t\equiv1\pmod4$；$3\times3=9\equiv1$，所以 $t\equiv3\pmod4$。</li><li>取 $t=3$：$x=3+18=21$。</li></ol><p>验算：$21=6\cdot3+3$，$21=8\cdot2+5$。✓ <b>答：$x\equiv21\pmod{24}$。</b></p><p><b>(2)</b> $x\equiv3\pmod6$ 说明 $x$ 是奇数（$x=6k+3$）；$x\equiv4\pmod8$ 说明 $x$ 是偶数（$x=8l+4$）。矛盾，<b>无解</b>。一般判据：$\gcd(6,8)=2\nmid4-3$。</p>` }
  ],
  extensions: [
    { id: "n1-e1", lv: "延伸", src: "经典结论", stmt: R`设 $\gcd(m,n)=1$。用 CRT 证明 Euler 函数可乘：$\varphi(mn)=\varphi(m)\varphi(n)$。`,
      hints: [R`$\varphi(k)$ 是 $\mathbb Z_k$ 中与 $k$ 互素的剩余类个数。先说明：$\gcd(x,mn)=1\iff\gcd(x,m)=1$ 且 $\gcd(x,n)=1$。`, R`CRT 的双射 $\Phi:\mathbb Z_{mn}\to\mathbb Z_m\times\mathbb Z_n$，$[x]\mapsto([x]_m,[x]_n)$。$\gcd(x,m)=1$ 只与 $x$ 模 $m$ 的余数有关。`, R`所以 $\Phi$ 把“与 $mn$ 互素的类”一一对应到“两个坐标分别与 $m$、$n$ 互素的数对”，后者有 $\varphi(m)\cdot\varphi(n)$ 个。`],
      method: "m-crt-build", sol: R`<p><b>要证：</b>$\gcd(m,n)=1$ 时 $\varphi(mn)=\varphi(m)\varphi(n)$。</p><p><b>第 1 步：互素条件拆开。</b>$\gcd(x,mn)\gt1$ ⇔ 有素数 $p$ 同时整除 $x$ 和 $mn$ ⇔ 有素数 $p$ 整除 $x$ 且整除 $m$ 或 $n$（素数整除乘积必整除其一）。所以 $$\gcd(x,mn)=1\iff\gcd(x,m)=1\ \text{且}\ \gcd(x,n)=1.$$</p><p><b>第 2 步：只看余数。</b>$\gcd(x,m)=\gcd(x\bmod m,\,m)$，所以“$\gcd(x,m)=1$”只取决于 $[x]_m$；同理对 $n$。</p><p><b>第 3 步：用 CRT 双射。</b>$\Phi:\mathbb Z_{mn}\to\mathbb Z_m\times\mathbb Z_n$，$[x]_{mn}\mapsto([x]_m,[x]_n)$ 是双射（$m,n$ 互素）。由前两步，$\Phi$ 把集合 $$A=\{[x]_{mn}:\gcd(x,mn)=1\}$$ 一一映到 $$B=\{([a]_m,[b]_n):\gcd(a,m)=1,\ \gcd(b,n)=1\}.$$</p><p><b>第 4 步：数个数。</b>$|A|=\varphi(mn)$；$B$ 的第一坐标有 $\varphi(m)$ 种、第二坐标有 $\varphi(n)$ 种，$|B|=\varphi(m)\varphi(n)$。双射保持个数，得证。</p><p>例：$\varphi(15)=\varphi(3)\varphi(5)=2\times4=8$（即 1,2,4,7,8,11,13,14）。</p>` },
    { id: "n1-e2", lv: "延伸", src: "自编", stmt: R`同余方程 $x^2\equiv1\pmod{105}$ 在 $\{0,1,\dots,104\}$ 中有几个解？`,
      hints: [R`由 CRT，$x^2\equiv1\pmod{105}$ ⇔ 模 3、模 5、模 7 下各自成立；而且 $x$ 模 105 与 $(x\bmod3,x\bmod5,x\bmod7)$ 一一对应。`, R`对奇素数 $p$：$x^2\equiv1\pmod p\iff p\mid(x-1)(x+1)\iff x\equiv1$ 或 $x\equiv-1\pmod p$，这两个不同，恰 2 个解。`, R`模 3、5、7 各有 2 个解，组合起来共 $2\times2\times2$ 个。`],
      method: "m-crt", sol: R`<p><b>第 1 步：拆成三个模数。</b>$105=3\cdot5\cdot7$ 两两互素，所以 $105\mid x^2-1\iff3,5,7$ 都整除 $x^2-1$。</p><p><b>第 2 步：每个素数模下的解。</b>对奇素数 $p$，$p\mid x^2-1=(x-1)(x+1)$ ⇔ $p\mid x-1$ 或 $p\mid x+1$（素数整除乘积必整除其一）⇔ $x\equiv1$ 或 $x\equiv-1\pmod p$。$p\gt2$ 时 $1\not\equiv-1$，恰 2 个解。</p><p><b>第 3 步：组合。</b>由 CRT，模 105 的每个类对应唯一的余数组 $(x\bmod3,x\bmod5,x\bmod7)$。每个坐标独立地有 2 种选择，共 $2^3=8$ 个余数组，对应 $\{0,\dots,104\}$ 中 8 个解。</p><p>具体是：$1,29,34,41,64,71,76,104$。（如 $29^2=841=8\times105+1$。）</p><p><b>答：8 个。</b></p>` }
  ]
},
/* ---------------- G1 ---------------- */
g1: {
  unit: "graph", n: 1, title: "图的基本结构与欧拉路",
  goal: "学会三件事：用握手定理（度数和 = 2 × 边数）算边数、排除不可能的度数；用“取最长道路”找圈；数奇度顶点判断能不能一笔画（欧拉路）。",
  sections: [
    { id: "g1-s1", h: "1. 基本概念与握手定理", html: R`
      <p><b>这节解决什么</b>：图论题第一步总是把题目翻译成“点和边”。先把最常用的几个词和一个万能等式（握手定理）弄熟。</p>
      <ul>
        <li><b>图</b> $G=(V,E)$：$V$ 是顶点集合，$E$ 是边的集合，每条边是两个不同顶点组成的无序对 $\{u,v\}$（写成 $uv$）。$\binom V2$ 表示“$V$ 中所有二元子集”，所以 $E\subseteq\binom V2$。这样的图叫<b>简单图</b>：没有自环（自己连自己），也没有重边（两点间连两条）。</li>
        <li><b>度</b> $d(v)$：和顶点 $v$ 相连的边数。<b>邻点</b>：和 $v$ 有边相连的点。$e(G)$ 表示边数，$n=|V|$ 表示顶点数。</li>
        <li><b>补图</b> $\overline G$：顶点不变，原来有边的地方去掉、原来没边的地方连上。例：$G$ 是 4 个点上的一条线 $1\text{-}2\text{-}3\text{-}4$（3 条边），则 $\overline G$ 有 $\binom42-3=3$ 条边：$13,14,24$。</li>
        <li><b>子图</b>：从 $G$ 里取一部分点和一部分边。<b>诱导子图</b> $G[V_1]$：只选定点集 $V_1$，两端都在 $V_1$ 里的边<b>必须全部保留</b>。</li>
        <li><b>道路</b>（walk）$v_0v_1\cdots v_k$：相邻两点有边，允许重复顶点；$k$ 叫长度（边数）。<b>简单道路</b>（path）：顶点互不相同。<b>简单圈</b>（cycle）：$v_0v_1\cdots v_kv_0$，长度 $\ge3$，除首尾外顶点不重复。</li>
        <li>从 $x$ 到 $y$ 的<b>最短</b>道路一定是简单道路：若某顶点出现两次，把两次之间那一段删掉，道路变短，矛盾。</li>
      </ul>
      <p><b>握手定理</b>：$$\sum_{v\in V}d(v)=2e(G).$$ 理由：每条边 $uv$ 在 $d(u)$ 里数一次、在 $d(v)$ 里又数一次，共被数 2 次。</p>
      <p><b>推论</b>：奇度顶点（度是奇数的点）的个数一定是偶数。因为偶度点的度数和是偶数，总和 $2e$ 也是偶数，所以奇度点的度数和必须是偶数，而奇数个奇数相加是奇数。</p>
      <p>例：度数 $3,3,2,2,2$ 的图有 $(3+3+2+2+2)/2=6$ 条边；度数 $3,2,2,2,2$ 的图不存在（和为 11，是奇数）。</p>` },
    { id: "g1-s2", h: "2. 什么时候有圈；连通分支与边数", html: R`
      <p><b>这节解决什么</b>：怎样说明“图里一定有圈”，以及“$n$ 个点至少要多少条边才能连成一片”。</p>
      <p><b>结论 1：每点度 $\ge2$ ⇒ 有圈。</b>证明用“取最长”的思路（叫<b>极端原理</b>：取一个最大或最小的对象，它往往自带好性质）：</p>
      <ol>
        <li>取一条最长的简单道路 $v_0,v_1,\dots,v_k$（有限图里一定存在最长的）。</li>
        <li>$d(v_k)\ge2$，所以 $v_k$ 除了 $v_{k-1}$ 还有另一个邻点 $x$。</li>
        <li>若 $x$ 不在路上，把 $x$ 接到末尾得到更长的简单道路，矛盾。所以 $x=v_i$ 且 $i\le k-2$。</li>
        <li>于是 $v_i,v_{i+1},\dots,v_k,v_i$ 是一个圈（长度 $k-i+1\ge3$）。</li>
      </ol>
      <p><b>结论 2</b>：至少有一条边、每点度都是偶数 ⇒ 有圈（删掉孤立点后每点度 $\ge2$，用结论 1）。</p>
      <p><b>结论 3</b>：$e(G)\ge|V(G)|$ ⇒ 有圈。思路：若有度 $\le1$ 的点，删掉它，边最多少 1 条、点少 1 个，条件“边数 $\ge$ 点数”仍成立；一直删，最后要么所有点度 $\ge2$（用结论 1），要么点删光了但边数还 $\ge$ 点数，这不可能。</p>
      <p><b>连通分支</b>：若 $x$ 到 $y$ 有道路就说它们“连通”。这是一个等价关系（自反、对称、传递），把顶点分成若干类，每一类连同其中的边叫一个<b>连通分支</b>，分支个数记作 $\beta_0(G)$。只有一个分支的图叫<b>连通图</b>。</p>
      <p><b>结论 4</b>：连通图满足 $e\ge n-1$；一般图满足 $$\beta_0(G)\ge n-e(G).$$ 理由：第 $i$ 个分支有 $n_i$ 个点、$e_i$ 条边，它连通所以 $e_i\ge n_i-1$；对 $i=1,\dots,\beta_0$ 求和得 $e\ge n-\beta_0$。</p>
      <p>例：10 个点 6 条边的图至少有 $10-6=4$ 个分支。</p>
      <p>课上的糖果题（77 颗糖装袋，7 人或 11 人都能平分，至少 17 袋）就是：把“人”当顶点、把“袋”当边，证明这个 18 个点的图连通，所以至少 17 条边（见例题 g1-p3）。</p>` },
    { id: "g1-s3", h: "3. 欧拉路与欧拉圈（一笔画）", html: R`
      <p><b>这节解决什么</b>：一幅图能不能“一笔画”——笔不离纸、每条边恰好画一次。答案只需数奇度顶点。</p>
      <p>本节允许重边（两点之间可以有多条边）。<b>欧拉路</b>：经过每条边恰好一次的道路；起点和终点相同时叫<b>欧拉圈</b>。</p>
      <p><b>Euler 定理</b>：设 $G$ 连通（孤立点不算）。</p>
      <ul>
        <li>$G$ 有欧拉圈 ⇔ 奇度顶点有 0 个；</li>
        <li>$G$ 有欧拉路 ⇔ 奇度顶点有 0 个或 2 个；有 2 个时，欧拉路必须从其中一个出发、到另一个结束。</li>
      </ul>
      <p><b>为什么必要</b>：沿欧拉路走，每次“路过”一个中间顶点，都是进一条边、出一条边，给这个点贡献 2 度。只有起点多出一条“出”、终点多出一条“进”。所以起点、终点以外的点都是偶度；起点 = 终点时全是偶度。</p>
      <p><b>为什么充分（全偶度时）</b>，对边数归纳：</p>
      <ol>
        <li>全偶度且有边 ⇒ 有圈 $C$（上一节结论 2）。</li>
        <li>删去 $C$ 的边，每个点的度减少 0 或 2，仍全是偶度；剩下的每个分支边数更少，由归纳假设各有欧拉圈。</li>
        <li>原图连通，所以每个剩余分支都和 $C$ 有公共点。沿 $C$ 走，第一次到达某分支的公共点时，先绕该分支的欧拉圈一圈再继续，拼成整个图的欧拉圈。</li>
      </ol>
      <p><b>恰有两个奇度点 $x,y$ 时</b>：临时加一条边 $xy$，全图变成全偶度，取欧拉圈，再把这条边删掉，圈断开成从 $x$ 到 $y$ 的欧拉路。</p>
      <p>例：哥尼斯堡七桥图的四块陆地度数为 $3,3,3,5$，4 个奇度点，所以没有欧拉路。正方形加一条对角线：两个对角点度 3、另两点度 2，恰 2 个奇度点，能一笔画，必须从一个度 3 的点出发。</p>
      <p><b>易错</b>：别忘了先检查连通。两个互不相连的三角形全是偶度，但没有欧拉圈。</p>` }
  ],
  widget: null,
  concepts: [
    { id: "g1-c1", sec: "g1-s1", q: R`是否存在一个简单图，各顶点的度依次为 $3,3,2,2,1$？`,
      opts: [R`存在`, R`不存在：度数和是奇数`, R`不存在：度为 1 的点不能和度为 3 的点相邻`, R`要看顶点是否有标号`], a: 1,
      ex: R`$3+3+2+2+1=11$ 是奇数，而握手定理说度数和 $=2e$ 一定是偶数，所以不存在。“度为 1 的点不能和度为 3 的点相邻”是错的，没有这种规则；标号也与存在性无关。` },
    { id: "g1-c2", sec: "g1-s2", q: R`7 个顶点、4 条边的图至少有几个连通分支？`,
      opts: [R`1`, R`2`, R`3`, R`4`], a: 2,
      ex: R`由 $\beta_0\ge n-e=7-4=3$，至少 3 个；并且能取到：一条含 5 个顶点的简单道路（4 条边）加 2 个孤立点，恰好 3 个分支。选 1 或 2 是忘了“连通需要至少 $n-1$ 条边”，4 条边最多把 5 个点连在一起。` },
    { id: "g1-c3", sec: "g1-s3", q: R`连通图 $G$ 恰有两个奇度顶点 $x,y$。下面正确的是：`,
      opts: [R`$G$ 有欧拉圈`, R`$G$ 有欧拉路，且它必以 $x,y$ 为两端`, R`$G$ 有欧拉路，可以从任意顶点出发`, R`$G$ 没有欧拉路`], a: 1,
      ex: R`由 Euler 定理有欧拉路；必要性的配对论证说明，起点和终点以外的点都是偶度，所以两个奇度点只能是两端。最容易误选“从任意顶点出发”：从偶度点出发，最后无法把奇度点的边用完。欧拉圈要求 0 个奇度点，也不对。` },
    { id: "g1-c4", sec: "g1-s2", q: R`用“取最长简单道路 $v_0,\dots,v_k$”证明有圈时，关键的一步是：`,
      opts: [R`$v_k$ 的所有邻点都在这条路上，否则能延长`, R`$v_0$ 的度最大`, R`最长路一定经过所有顶点`, R`$v_k$ 的度为 1`], a: 0,
      ex: R`这就是极端原理：最长路的端点不可能有路外的邻点，否则接上去路更长。再加上 $d(v_k)\ge2$，$v_k$ 在路上还有一个不相邻的邻点，围成圈。“最长路经过所有顶点”是错的，例如两个分支的图；“$v_k$ 的度为 1”恰好与条件度 $\ge2$ 相反。` }
  ],
  methods: [
    { id: "m-hand", title: "握手定理与按度数计数", steps: [
      R`写出 $\sum d(v)=2e$：可用来求边数、说明奇度点个数为偶数、否定不可能的度数序列（和为奇数就不存在）。`,
      R`数“以某个点为中心的结构”时按中心点分类求和，例如角（共顶点的两条边）的个数 $S=\sum_v\binom{d(v)}2$。`,
      R`需要不等式时配合 Cauchy–Schwarz：$n\sum d_i^2\ge(\sum d_i)^2=4e^2$。`,
      R`易错：度数和是偶数只是必要条件，不能单凭它说图存在。`] },
    { id: "m-extremal", title: "极端原理：取最长 / 最短道路", steps: [
      R`要找圈、找度为 1 的点：取一条<b>最长</b>的简单道路，盯住端点的邻点。`,
      R`要说明道路可以是简单的、或讨论两点距离：取<b>最短</b>道路，有重复顶点就能剪短。`,
      R`答卷写法：“若 $x$ 不在路上，则把 $x$ 接到末端得到更长的简单道路，与最长性矛盾。”`] },
    { id: "m-comp", title: "连通分支与边数", steps: [
      R`把图拆成分支 $G_1,\dots,G_b$，第 $i$ 个分支有 $n_i$ 点、$e_i$ 边，连通 ⇒ $e_i\ge n_i-1$。`,
      R`求和得 $e\ge n-b$，即 $\beta_0\ge n-e$。`,
      R`要证“图连通”：任取一个分支，用题目条件（整除、计数）说明它必须包含全部顶点。`,
      R`求最小值时别忘了给出取等的构造。`] },
    { id: "m-euler", title: "判定欧拉路 / 欧拉圈", steps: [
      R`先检查连通（孤立点可以忽略）。`,
      R`数奇度顶点：0 个 ⇒ 有欧拉圈；2 个 ⇒ 有欧拉路，以这两点为两端；4 个及以上 ⇒ 都没有。`,
      R`“最少几笔画完”：有 $2k$ 个奇度点时至少 $k$ 笔；奇度点两两配对加 $k$ 条辅助边可以做到 $k$ 笔。`] }
  ],
  problems: [
    { id: "g1-p1", lv: "真题", src: "2022 秋期末 1(1)", stmt: R`设 $G$ 是 $n$ 个顶点的简单图，且共有 $m$ 个连通分支。求 $G$ 的边数的最小值。`,
      hints: [R`用“连通图边数至少为顶点数减 1”，对每个分支分别用。`, R`设第 $i$ 个分支有 $n_i$ 点、$e_i$ 边，则 $e=\sum e_i\ge\sum(n_i-1)=n-m$。`, R`再构造一个恰好 $n-m$ 条边、$m$ 个分支的图：一条含 $n-m+1$ 个顶点的简单道路，加上 $m-1$ 个孤立点。`],
      method: "m-comp", sol: R`<p><b>已知</b>：$G$ 有 $n$ 个顶点、$m$ 个连通分支 $G_1,\dots,G_m$。<b>求</b>：$e(G)$ 的最小值。</p>
      <p><b>下界</b>：设 $G_i$ 有 $n_i$ 个顶点、$e_i$ 条边，则 $\sum_{i=1}^m n_i=n$。$G_i$ 连通，所以 $e_i\ge n_i-1$（连通图边数至少为顶点数减 1）。求和：$$e(G)=\sum_{i=1}^me_i\ge\sum_{i=1}^m(n_i-1)=n-m.$$</p>
      <p><b>取等</b>：取一条有 $n-m+1$ 个顶点的简单道路，它有 $n-m$ 条边且连通；再加上 $m-1$ 个孤立点。顶点共 $(n-m+1)+(m-1)=n$ 个，分支共 $1+(m-1)=m$ 个，边数 $n-m$。</p>
      <p><b>所以边数的最小值为 $n-m$。</b></p>` },
    { id: "g1-p2", lv: "真题", src: "2022 秋期末 1(2)", stmt: R`设 $n$ 阶连通简单图 $G$ 中每个顶点的度都是 2。请确定 $G$。`,
      hints: [R`先用“每点度 $\ge2$ ⇒ 有圈”找到一个简单圈 $C$。`, R`$C$ 上每个顶点在 $C$ 里已经用掉了 2 条边，而它的度恰好是 2，所以没有边从 $C$ 伸出去。`, R`若还有 $C$ 外的点，由连通性必有一条边连接 $C$ 内外，矛盾；所以 $G=C$，即 $n$ 阶圈 $C_n$（$n\ge3$）。`],
      method: "m-extremal", sol: R`<p><b>已知</b>：$G$ 连通、简单，每点度为 2。<b>要证</b>：$G$ 是圈 $C_n$。</p>
      <p><b>第 1 步</b>：每点度 $\ge2$，所以 $G$ 中有简单圈 $C$（取最长简单道路，端点的另一个邻点必在路上，围成圈）。</p>
      <p><b>第 2 步</b>：$C$ 上每个顶点 $v$ 在 $C$ 中已有 2 条边，而 $d(v)=2$，所以 $v$ 的边全在 $C$ 上，$C$ 上的点没有通往 $C$ 外的边。</p>
      <p><b>第 3 步</b>：若 $V(C)\ne V(G)$，由于 $G$ 连通，从 $C$ 上一点到 $C$ 外一点有道路，这条道路上必有一条边一端在 $C$ 上、另一端在 $C$ 外，与第 2 步矛盾。所以 $V(G)=V(C)$；又每点的两条边都在 $C$ 上，$E(G)=E(C)$。</p>
      <p><b>结论：$G$ 就是 $n$ 个顶点的圈 $C_n$（简单图要求 $n\ge3$）。</b></p>` },
    { id: "g1-p3", lv: "基础", src: "课件 11-17 例", stmt: R`主人有 77 颗糖，先装成若干非空袋。不论来 7 个还是 11 个小朋友，都要能把糖整袋分完、每人一样多。最少要装多少袋？`,
      hints: [R`建图：7 人分法的 7 个人记为 $X_1,\dots,X_7$（每人 11 颗），11 人分法的 11 个人记为 $Y_1,\dots,Y_{11}$（每人 7 颗）。每袋糖在两种分法中各分给一个人，就在这两个人 $X_i,Y_j$ 之间连一条边。`, R`取任意一个连通分支，设含 $k$ 个 $X$ 点、$\ell$ 个 $Y$ 点。这个分支里的袋子从 $X$ 一侧数共 $11k$ 颗，从 $Y$ 一侧数共 $7\ell$ 颗，所以 $11k=7\ell$。`, R`由 $\gcd(7,11)=1$ 得 $7\mid k$，又 $1\le k\le7$，所以 $k=7$，同理 $\ell=11$：图连通，18 个点至少 17 条边。构造：把 77 颗糖排成一列，在 7 的倍数和 11 的倍数处都切开。`],
      method: "m-comp", sol: R`<p><b>建图</b>：顶点为 $X_1,\dots,X_7$（7 人分法中的 7 个人，每人应得 11 颗）和 $Y_1,\dots,Y_{11}$（11 人分法中的 11 个人，每人应得 7 颗），共 18 个点。每袋糖在 7 人分法里归某个 $X_i$，在 11 人分法里归某个 $Y_j$，就画一条边 $X_iY_j$（可能有重边）。袋数 = 边数。</p>
      <p><b>证明图连通</b>：任取一个连通分支，设它含 $k$ 个 $X$ 点、$\ell$ 个 $Y$ 点（每个点都至少有一袋，所以 $k,\ell\ge1$）。这个分支里的边（袋）恰好是这 $k$ 个 $X$ 拿到的全部袋，也恰好是这 $\ell$ 个 $Y$ 拿到的全部袋（因为每袋的两个端点在同一分支）。数这些袋里的糖：$$11k=7\ell.$$ 因为 $\gcd(7,11)=1$，所以 $7\mid k$；又 $1\le k\le7$，得 $k=7$，进而 $\ell=11$。即这个分支包含全部 18 个点，图连通。</p>
      <p><b>下界</b>：把重边合并后仍是 18 个点的连通图，至少 $18-1=17$ 条边，所以至少 17 袋。</p>
      <p><b>构造</b>：把 77 颗糖排成一列，在第 $7,14,\dots,70$ 颗后面（10 个切点）和第 $11,22,\dots,66$ 颗后面（6 个切点）切开。7 和 11 在 77 以内的公倍数只有 77 本身，所以这 16 个切点互不相同，切出 17 袋，大小依次为 $$7,4,3,7,1,6,5,2,7,2,5,6,1,7,3,4,7$$（和为 77）。按每 7 颗一段整袋分给 11 人，或每 11 颗一段分给 7 人，都可行。</p>
      <p><b>答：最少 17 袋。</b></p>` },
    { id: "g1-p4", lv: "基础", src: "自编", stmt: R`完全图 $K_n$（$n\ge2$）什么时候有欧拉圈？什么时候有欧拉路但没有欧拉圈？`,
      hints: [R`用 Euler 定理：先看连通，再数奇度顶点。`, R`$K_n$ 中每个点和其余 $n-1$ 个点相连，度为 $n-1$。`, R`$n$ 奇数时 $n-1$ 是偶数，全为偶度；$n$ 偶数时 $n$ 个点全是奇度，只有 $n=2$ 时奇度点恰为 2 个。`],
      method: "m-euler", sol: R`<p>$K_n$（完全图：任意两点之间都有边）连通，每点度为 $n-1$。</p>
      <p><b>$n$ 为奇数</b>：$n-1$ 为偶数，0 个奇度点，有欧拉圈。例如 $K_3$ 是三角形，$K_5$ 能一笔画回到起点。</p>
      <p><b>$n$ 为偶数</b>：$n-1$ 为奇数，$n$ 个点全是奇度。</p>
      <ul><li>$n=2$：恰 2 个奇度点，有欧拉路（就是那一条边），没有欧拉圈。</li><li>$n\ge4$：奇度点有 $n\ge4$ 个，既没有欧拉圈也没有欧拉路。</li></ul>
      <p><b>结论：$n$ 奇数时有欧拉圈；只有 $n=2$ 时有欧拉路而无欧拉圈；$n\ge4$ 为偶数时两者都没有。</b></p>` }
  ],
  variants: [
    { id: "g1-v1", lv: "变种", src: "2022 秋期末 6(1)", stmt: R`在简单图 $G$ 中，称有公共顶点的两条边 $AB$、$AC$ 构成一个“角”，$A$ 为角的顶点。设 $G$ 的各顶点度数为 $d_1,\dots,d_n$，求角的总数 $S$。`,
      hints: [R`按“角的顶点是谁”分类计数，各类相加。`, R`以 $v_i$ 为顶点的角，就是从 $v_i$ 的 $d_i$ 条边中任选 2 条。`, R`所以以 $v_i$ 为顶点的角有 $\binom{d_i}2$ 个，$S=\sum_i\binom{d_i}2$。`],
      method: "m-hand", sol: R`<p>每个角恰有一个顶点（两条边的公共端点；简单图里两条不同的边至多一个公共端点）。按顶点分类：</p>
      <p>以 $v_i$ 为顶点的角由 $v_i$ 的两条不同的边决定，共 $\binom{d_i}2=\frac{d_i(d_i-1)}2$ 个。各类互不重叠，相加：$$S=\sum_{i=1}^n\binom{d_i}2=\frac12\sum_{i=1}^n d_i(d_i-1).$$</p>
      <p>小例子检验：三角形 $d_i=2,2,2$，$S=1+1+1=3$，确实三个角。</p>
      <p><b>答：$S=\sum_{i=1}^n\binom{d_i}2$。</b></p>` },
    { id: "g1-v2", lv: "变种", src: "一笔画", stmt: R`连通图 $G$ 恰有 $2k$ 个奇度顶点（$k\ge1$）。证明：$G$ 的边可以分成 $k$ 条边不重复的道路，且 $k$ 是最少的条数。`,
      hints: [R`分两半证：下界“至少 $k$ 条”看奇度点必须当道路端点；上界“$k$ 条够用”用欧拉圈。`, R`下界：一个点在某条道路中间出现一次贡献 2 度，只有当道路端点时贡献 1 度，所以奇度点一定是某条道路的端点；$t$ 条道路共 $2t$ 个端点，$2t\ge2k$。`, R`上界：把 $2k$ 个奇度点两两配对、每对加一条新边，全图变成全偶度连通图，取欧拉圈；再删去这 $k$ 条新边，欧拉圈断成 $k$ 段。`],
      method: "m-euler", sol: R`<p><b>下界：至少 $k$ 条</b>。设 $G$ 的边被分成 $t$ 条边不重复的道路。看任意一个顶点 $v$ 的度：</p>
      <ul><li>$v$ 每在某条道路的<b>中间</b>出现一次，用掉它的 2 条边（进一条、出一条），贡献 2 度；</li><li>$v$ 是某条非闭合道路的<b>起点或终点</b>时，贡献 1 度；闭合道路的首尾在同一点，合起来贡献 2 度。</li></ul>
      <p>所以若 $d(v)$ 是奇数，$v$ 一定是某条非闭合道路的端点。$t$ 条道路至多 $2t$ 个端点，故 $2t\ge2k$，$t\ge k$。</p>
      <p><b>上界：$k$ 条够用</b>。把 $2k$ 个奇度点配成 $k$ 对，每对之间加一条新边（允许重边），得图 $G'$。每个奇度点度数加 1 变偶，其他点不变，所以 $G'$ 连通且全偶度，有欧拉圈。</p>
      <p>每个奇度点恰是一条新边的端点，因此 $k$ 条新边两两没有公共顶点，在欧拉圈中任意两条新边不会紧挨着。删去这 $k$ 条新边，欧拉圈恰好断成 $k$ 段非空的道路，它们边不重复，合起来正好是 $G$ 的全部边。</p>
      <p><b>所以最少条数恰为 $k$。</b></p>` }
  ],
  extensions: [
    { id: "g1-e1", lv: "延伸", src: "课件 11-17 · Ramsey", stmt: R`证明：任意 6 个人中，或者有 3 人两两相识，或者有 3 人两两不相识。并说明 5 个人时结论不成立。`,
      hints: [R`把 6 个人看成 $K_6$ 的顶点，相识连蓝边、不相识连紫边（每条边恰一种颜色）。任取一个人 $A$，用抽屉原理看它的 5 条边。`, R`$A$ 的 5 条边分两色，至少 3 条同色，不妨蓝色，通向 $B,C,D$。再看 $BC,BD,CD$：有一条蓝就与 $A$ 组成蓝三角形；否则三条都紫。`, R`5 人反例：$1\text{-}2\text{-}3\text{-}4\text{-}5\text{-}1$ 围成一圈，相邻的人相识，其余不相识。相识关系是五边形，不相识关系 $1\text{-}3\text{-}5\text{-}2\text{-}4\text{-}1$ 也是五边形，都没有三角形。`],
      method: "m-extremal", sol: R`<p><b>建模</b>：6 个人为 $K_6$ 的顶点，两人相识连蓝边，不相识连紫边。要证：有同色三角形（三条边同色的三点）。</p>
      <p><b>第 1 步</b>：任取一人 $A$，他有 5 条边，分成两种颜色，由抽屉原理至少 $\lceil5/2\rceil=3$ 条同色。不妨设是蓝色，通向 $B,C,D$（紫色同理）。</p>
      <p><b>第 2 步</b>：看 $B,C,D$ 之间的三条边 $BC,BD,CD$。</p>
      <ul><li>若其中有一条是蓝色，比如 $BC$，则 $AB,AC,BC$ 全蓝，$A,B,C$ 两两相识。</li><li>否则 $BC,BD,CD$ 全紫，$B,C,D$ 两两不相识。</li></ul>
      <p><b>5 人时反例</b>：编号 1–5 围成一圈，$1\text{-}2,2\text{-}3,3\text{-}4,4\text{-}5,5\text{-}1$ 这 5 对相识，其余 5 对不相识。相识关系是五边形 $C_5$，没有三角形；不相识关系是 $1\text{-}3\text{-}5\text{-}2\text{-}4\text{-}1$，也是五边形，没有三角形。</p>
      <p><b>结论：6 人必有同色三角形，5 人不一定。</b>（这说明 Ramsey 数 $R(3,3)=6$。）</p>` },
    { id: "g1-e2", lv: "延伸", src: "经典结论", stmt: R`设简单图 $G$ 中每个顶点的度都 $\ge k$（$k\ge2$）。证明：$G$ 中有长度至少为 $k+1$ 的简单圈。`,
      hints: [R`极端原理：取最长的简单道路 $v_0,v_1,\dots,v_\ell$，看末端 $v_\ell$。`, R`$v_\ell$ 的所有邻点都在路上（否则能延长），而且至少有 $k$ 个，它们的下标都在 $0,\dots,\ell-1$ 中且互不相同。`, R`取 $v_\ell$ 的邻点中下标最小的 $v_i$。$k$ 个不同下标都 $\le\ell-1$，最小的满足 $i\le\ell-k$。圈 $v_i,v_{i+1},\dots,v_\ell,v_i$ 长度为 $\ell-i+1\ge k+1$。`],
      method: "m-extremal", sol: R`<p><b>第 1 步</b>：取 $G$ 中最长的简单道路 $P=v_0v_1\cdots v_\ell$。</p>
      <p><b>第 2 步</b>：若 $v_\ell$ 有不在 $P$ 上的邻点 $x$，则 $v_0\cdots v_\ell x$ 是更长的简单道路，矛盾。所以 $v_\ell$ 的全部邻点都在 $\{v_0,\dots,v_{\ell-1}\}$ 中，且至少有 $d(v_\ell)\ge k$ 个。</p>
      <p><b>第 3 步</b>：这些邻点的下标是 $\{0,1,\dots,\ell-1\}$ 中至少 $k$ 个不同的数。设其中最小的是 $i$。由于至少 $k$ 个不同的整数都在 $[i,\ell-1]$ 中，有 $\ell-1-i+1\ge k$，即 $i\le\ell-k$。</p>
      <p><b>第 4 步</b>：$v_i,v_{i+1},\dots,v_\ell,v_i$ 是简单圈（$v_iv_\ell$ 是边，路上各点不同），长度为 $$\ell-i+1\ge\ell-(\ell-k)+1=k+1.$$</p>
      <p><b>所以 $G$ 中有长度至少 $k+1$ 的简单圈。</b></p>` }
  ]
},

g2: {
  unit: "graph", n: 2, title: "树与普吕弗编码",
  goal: "记住“树”的几种等价说法；会手算普吕弗编码和还原（期末必考）；会用编码数树：Cayley 公式 $n^{n-2}$、指定度数、含指定边。",
  sections: [
    { id: "g2-s1", h: "1. 树的等价刻画", html: R`
      <p><b>这节解决什么</b>：树是“刚好连通、一条多余边都没有”的图。证明题里经常要说明某个图是树，或者用树的性质，所以要熟悉它的几种等价说法，挑最好用的那条。</p>
      <p><b>树</b>：连通且没有圈的简单图。<b>森林</b>：每个连通分支都是树（可以不连通）。<b>叶</b>：度为 1 的点。</p>
      <p>对有 $n$ 个顶点的图 $T$，下面几条<b>互相等价</b>（满足一条就满足全部）：</p>
      <ol>
        <li>$T$ 是树（连通、无圈）；</li>
        <li>$T$ 连通，但删掉任何一条边就不连通（<b>极小连通</b>）；</li>
        <li>$T$ 无圈，但加上任何一条新边就出现圈（<b>极大无圈</b>）；</li>
        <li>$T$ 连通，且恰有 $n-1$ 条边；</li>
        <li>$T$ 无圈，且恰有 $n-1$ 条边；</li>
        <li>任意两点之间有且只有一条简单道路；</li>
        <li>$T$ 可以从一个点出发，每次添一个新点并连一条边（新点就是新的叶）得到。</li>
      </ol>
      <p>例：5 个点、4 条边、连通的图一定是树（第 4 条）；5 个点、4 条边但有一个三角形的图一定不连通（否则由第 4 条它是树，没有圈）。</p>
      <p><b>$n\ge2$ 的树至少有两个叶</b>。理由：树有 $n-1$ 条边，度数和为 $2n-2$。树连通且 $n\ge2$，所以没有度 0 的点。若至多一个叶，其余至少 $n-1$ 个点度 $\ge2$，度数和 $\ge1+2(n-1)=2n-1\gt2n-2$，矛盾。</p>
      <p>用归纳法证明关于树的命题时，标准动作是<b>删去一个叶</b>：剩下的仍是树，点数少 1。</p>` },
    { id: "g2-s2", h: "2. 普吕弗编码：删最小的叶，记它的邻点", html: R`
      <p><b>这节解决什么</b>：把一棵标号树变成一串数字（编码），也能从数字串还原出树。这是期末必考的手算题，也是下一节“数树”的工具。</p>
      <p>记号：$[n]=\{1,2,\dots,n\}$。下面的树顶点集都是 $[n]$，$n\ge2$。</p>
      <p><b>编码（树 → 序列）</b>：重复 $n-2$ 次：在当前的树里找<b>标号最小的叶</b> $x_i$，记下<b>它唯一的邻点</b> $y_i$，然后把 $x_i$ 删掉。得到的 $P(T)=(y_1,\dots,y_{n-2})$ 叫普吕弗序列。（若再删一次，剩下的一定是边 $\{x_{n-1},n\}$，所以 $y_{n-1}=n$ 总成立，不用记。）</p>
      <p>小例子：$[4]$ 上的树，边为 $12,23,34$（一条链）。叶是 1 和 4，最小的是 1，记邻点 2，删 1；现在叶是 2 和 4，删 2，记邻点 3。$P=(2,3)$。</p>
      <p><b>两个关键事实</b>：</p>
      <ul>
        <li><b>度数公式</b>：$$d_T(v)=1+(v\text{ 在 }P(T)\text{ 中出现的次数}).$$ 所以叶恰好是<b>没在序列里出现</b>的标号，叶数 $=n-(\text{序列中不同标号的个数})$。上面的链：2、3 各出现 1 次，度都是 2；1、4 没出现，是叶。</li>
        <li><b>还原（序列 → 树）</b>：先在末尾补 $y_{n-1}=n$，排成两行，从左到右逐列填 $x_i$：$$x_i=\min\Big([n]\setminus\big(\{x_1,\dots,x_{i-1}\}\cup\{y_i,y_{i+1},\dots,y_{n-1}\}\big)\Big).$$ 白话：<b>排除左边已经填过的 $x$，再排除下面这一列及其右边所有的 $y$，剩下的标号里取最小的</b>。每列给出一条边 $x_iy_i$。</li>
      </ul>
      <p>例（课件）：$n=6$，$P=(2,2,1,1)$。补 $y_5=6$：</p>
      <ul>
        <li>第 1 列：排除 $y$ 的 $\{2,1,6\}$，剩 $\{3,4,5\}$，$x_1=3$；</li>
        <li>第 2 列：排除 $\{3\}$ 和 $\{2,1,6\}$，$x_2=4$；</li>
        <li>第 3 列：排除 $\{3,4\}$ 和 $\{1,6\}$（2 已不在右边），$x_3=2$；</li>
        <li>第 4 列：排除 $\{3,4,2\}$ 和 $\{1,6\}$，$x_4=5$；</li>
        <li>第 5 列：排除 $\{3,4,2,5\}$ 和 $\{6\}$，$x_5=1$。</li>
      </ul>
      <p>边为 $23,24,12,15,16$。下面的工具可以输入任意序列，逐步看删叶过程。</p>` },
    { id: "g2-s3", h: "3. 用编码数树", html: R`
      <p><b>这节解决什么</b>：编码是树与序列之间的一一对应，所以“数满足某条件的树”可以改成“数满足对应条件的序列”，后者是普通的排列组合。</p>
      <ul>
        <li><b>Cayley 公式</b>：编码给出“$[n]$ 上的树”与“长为 $n-2$、每项取自 $[n]$ 的序列”（共 $n^{n-2}$ 个）之间的双射（一一对应），所以 $[n]$ 上的标号树共 $$n^{n-2}\text{ 棵}.$$ 检验：$n=3$ 时 $3^1=3$（以 1、2 或 3 为中间点的三条链）；$n=4$ 时 $4^2=16$（12 条链 + 4 个星形）。</li>
        <li><b>指定全部度数</b>：$d_T(i)=d_i$ ⇔ $i$ 在序列中恰出现 $d_i-1$ 次。这样的序列是多重集排列，树数为 $$\frac{(n-2)!}{(d_1-1)!\,(d_2-1)!\cdots(d_n-1)!}.$$ 例：$[5]$ 上 $d(1)=3,d(2)=2$，其余为叶：序列含两个 1、一个 2，$3!/(2!\,1!)=3$ 棵。</li>
        <li><b>只指定一个点的度</b>：例如 $[6]$ 上要求 $d(1)=4$：序列长 4，1 恰出现 3 次。选 1 不出现的那个位置有 $\binom41=4$ 种，该位置填 2–6 中的一个有 5 种，共 $4\times5=20$ 棵。</li>
        <li><b>补全森林</b>：$[n]$ 上一个森林有 $k\ge2$ 个分支、大小分别为 $s_1,\dots,s_k$，包含它（把它补成树）的树有 $n^{k-2}s_1s_2\cdots s_k$ 棵。特例：包含指定一条边的树有 $2n^{n-3}$ 棵（见延伸题）。</li>
        <li><b>随机树</b>：独立均匀地抽 $Y_1,\dots,Y_{n-2}\in[n]$ 再还原，就得到在所有 $n^{n-2}$ 棵树中均匀随机的一棵。</li>
      </ul>` }
  ],

  problems: [
    { id: "g2-p1", lv: "基础", src: "自编", stmt: R`求顶点集为 $[7]$、边为 $14,24,35,45,56,67$ 的树的普吕弗序列。`,

      method: "m-prufer", sol: R`<p><b>度数</b>：$d(1)=d(2)=d(3)=d(7)=1$，$d(4)=3$（邻点 1、2、5），$d(5)=3$（邻点 3、4、6），$d(6)=2$。初始叶为 $\{1,2,3,7\}$。</p>

    { id: "g2-p2", lv: "基础", src: "自编", stmt: R`顶点集为 $[7]$ 的树 $T$ 的普吕弗序列为 $(5,1,1,4,4)$。求 $T$ 的边。`,
      hints: [R`用还原规则：先补 $y_6=7$，写成 $y=(5,1,1,4,4,7)$，逐列填 $x_i$ = 排除“左边已填的 $x$”和“这一列及右边的 $y$”后的最小标号。`, R`第 1 列排除 $\{5,1,4,7\}$，得 $x_1=2$；第 2 列排除 $\{2\}\cup\{1,4,7\}$，得 $x_2=3$。`, R`第 3 列排除 $\{2,3\}\cup\{1,4,7\}$，得 $x_3=5$；继续得 $x_4=1$，$x_5=6$，$x_6=4$。`],
      method: "m-prufer", sol: R`<p>补 $y_6=7$，得 $y=(5,1,1,4,4,7)$。逐列计算：</p>
      <ul>
        <li>第 1 列：右边的 $y$ 为 $\{5,1,4,7\}$，左边无 $x$，剩 $\{2,3,6\}$，$x_1=2$。</li>

        <li>第 4 列：右边 $y$ 为 $\{4,7\}$，已用 $\{2,3,5\}$，剩 $\{1,6\}$，$x_4=1$。</li>
        <li>第 5 列：右边 $y$ 为 $\{4,7\}$，已用 $\{2,3,5,1\}$，剩 $\{6\}$，$x_5=6$。</li>
        <li>第 6 列：右边 $y$ 为 $\{7\}$，已用 $\{2,3,5,1,6\}$，剩 $\{4\}$，$x_6=4$。</li>
      </ul>

      <p>自检：$d(1)=3$（1 出现 2 次）、$d(4)=3$（出现 2 次）、$d(5)=2$（出现 1 次），叶为 2、3、6、7；共 6 条边。</p>` },
    { id: "g2-p3", lv: "真题", src: "2022 秋期末 4", stmt: R`<p>考虑以 $[n]$ 为顶点集的树 $T$，$P(T)=(y_1,\dots,y_{n-2})$ 是它的普吕弗序列。</p><p>(1) 令 $Y=\{y_1,\dots,y_{n-2}\}$（作为集合）。证明：$T$ 的叶的数目等于 $n-|Y|$。</p><p>(2) 设 $n=2m$（$m\ge2$），已知 $P(T)=(1,2,\dots,m-1,1,2,\dots,m-1)$。请确定树 $T$。</p>`,
      hints: [R`(1) 先证度数公式 $d(v)=1+(v$ 在序列中出现的次数$)$：看编码过程中 $v$ 的边是怎样一条条被删掉的。`, R`(2) 先算小例子 $m=3$：$P=(1,2,1,2)$，$n=6$，补 $y_5=6$，还原得 $x=(3,4,5,1,2)$，边 $31,42,51,12,26$。`, R`一般地：前 $m-1$ 列依次填 $m,m+1,\dots,2m-2$；第 $m$ 列填 $2m-1$；之后依次填 $1,2,\dots,m-2$；最后一列填 $m-1$（与 $2m$ 相连）。`],
      method: "m-prufer", sol: R`<p><b>(1)</b> 要证：$d_T(v)=1+\#\{i:y_i=v\}$。</p>
      <p>编码时每一步删掉一条边（被删叶与它的邻点之间的边）。对固定的点 $v$：每当 $v$ 被记为 $y_i$，就删掉 $v$ 的一条边。$v$ 剩下的最后一条边：若 $v$ 在某一步作为最小叶 $x_i$ 被删，这时它恰好剩 1 条边；若 $v$ 一直没被删，它就在最后剩下的那条边里。总之 $v$ 的边 = 被记作 $y$ 的次数 + 1。</p>
      <p>所以 $v$ 是叶 ⇔ $d_T(v)=1$ ⇔ $v$ 在序列中出现 0 次 ⇔ $v\notin Y$。<b>叶数 $=|[n]\setminus Y|=n-|Y|$。</b></p>
      <p><b>(2)</b> 补 $y_{n-1}=2m$，序列为 $(1,\dots,m-1,\ 1,\dots,m-1,\ 2m)$，共 $2m-1$ 列。按还原规则：</p>
      <ul>
        <li>第 $i$ 列（$1\le i\le m-1$，$y_i=i$）：右边的 $y$ 含全部 $1,\dots,m-1$ 和 $2m$；左边已用 $m,\dots,m+i-2$。最小可用的是 $m+i-1$，<b>边 $\{i,\ m+i-1\}$</b>。</li>
        <li>第 $m$ 列（$y=1$）：右边的 $y$ 含 $1,\dots,m-1,2m$；已用 $m,\dots,2m-2$。只剩 $2m-1$，<b>边 $\{1,\ 2m-1\}$</b>。</li>
        <li>第 $m+j-1$ 列（$y=j$，$2\le j\le m-1$）：右边的 $y$ 只剩 $j,\dots,m-1,2m$；已用 $1,\dots,j-2$ 和 $m,\dots,2m-1$。最小可用的是 $j-1$，<b>边 $\{j-1,\ j\}$</b>。</li>
        <li>最后一列（$y=2m$）：只剩 $m-1$ 没用过，<b>边 $\{m-1,\ 2m\}$</b>。</li>
      </ul>
      <p><b>所以 $T$ 是</b>：一条链 $1-2-\cdots-(m-1)$；每个 $i$（$1\le i\le m-1$）挂一个叶 $m+i-1$；$1$ 另外再挂叶 $2m-1$；$m-1$ 另外再连 $2m$。</p>
      <p>自检：边数 $(m-1)+1+(m-2)+1=2m-1=n-1$ ✓；$1,\dots,m-1$ 各在序列中出现 2 次，度都是 3 ✓。$m=3$ 时就是提示里的边 $13,24,15,12,26$。$m=2$ 时 $n=4$，$P=(1,1)$，是以 1 为中心的星形树。</p>` },
    { id: "g2-p4", lv: "真题", src: "2024 秋期末 5（课件 11-17）", stmt: R`给定 $n=3m+2$（$m$ 为正整数）。顶点集为 $[n]$ 的树 $T$ 的普吕弗序列为 $(1,1,1,2,2,2,\dots,m,m,m)$。请画出（描述）树 $T$。`,
      hints: [R`先用度数公式：$1,\dots,m$ 各出现 3 次，度都是 4；其余 $n-m=2m+2$ 个点是叶。`, R`算小例子 $m=3$，$n=11$：补 $y_{10}=11$，还原得 $x=(4,5,6,1,7,8,2,9,10,3)$。`, R`一般地三列一组：第一组（$y=1$）填 $m+1,m+2,m+3$；第 $j$ 组（$y=j$，$2\le j\le m$）填 $j-1,\ m+2j,\ m+2j+1$；最后一列填 $m$，与 $n$ 相连。`],
      method: "m-prufer", sol: R`<p><b>度数</b>：$1,\dots,m$ 各出现 3 次，度都是 $1+3=4$；其余 $2m+2$ 个点都是叶。</p>
      <p>补 $y_{3m+1}=n$。还原时按三列一组：</p>
      <ul>
        <li><b>第一组</b>（三列 $y=1$）：右边的 $y$ 始终含 $1,\dots,m$ 和 $n$，所以依次填最小的可用标号 $m+1,m+2,m+3$。边 $\{1,m+1\},\{1,m+2\},\{1,m+3\}$。</li>
        <li><b>第 $j$ 组</b>（三列 $y=j$，$2\le j\le m$）：开始时左边已用 $1,\dots,j-2$ 和 $m+1,\dots,m+2j-1$。第一列：右边 $y$ 含 $j,\dots,m,n$，而 $j-1$ 已不在右边且没用过，所以填 $j-1$（边 $\{j-1,j\}$）；后两列：$\le m$ 的都不能用，填 $m+2j$、$m+2j+1$（边 $\{j,m+2j\},\{j,m+2j+1\}$）。</li>

      <p>以 $m=3$（$n=11$）为例：</p>

      <p><b>所以 $T$ 是</b>：一条链 $1-2-\cdots-m$；$1$ 挂三个叶 $m+1,m+2,m+3$；每个 $j$（$2\le j\le m$）挂两个叶 $m+2j$、$m+2j+1$；$m$ 再连叶 $n=3m+2$。</p>
      <p>自检：$1,\dots,m$ 的度都是 4 ✓；边数 $3+3(m-1)+1=3m+1=n-1$ ✓。$m=1$ 时是以 1 为中心、叶为 2、3、4、5 的星形树。</p>` }

      method: "m-tree", sol: R`<p><b>第 1 步（度数）</b>：树有 $n-1$ 条边，$\sum d(v)=2n-2$。$n\ge2$ 且连通，没有度 0 的点，所以非叶点度 $\ge2$。两个叶贡献 2，其余 $n-2$ 个点度数和为 $2n-4$，每个 $\ge2$，所以<b>都恰为 2</b>。</p>
      <p><b>第 2 步（最长路）</b>：取最长简单道路 $P=v_0v_1\cdots v_k$。$v_0$ 的邻点都在 $P$ 上（否则可延长）；若 $v_0$ 除 $v_1$ 外还有邻点 $v_i$，则 $v_0v_1\cdots v_iv_0$ 是圈，与树无圈矛盾。所以 $d(v_0)=1$，同理 $d(v_k)=1$。中间点 $v_1,\dots,v_{k-1}$ 在 $P$ 上已有 2 个邻点，度恰为 2，没有别的边。</p>

    { id: "g2-v3", lv: "变种", src: "仿课件“指定度数”", stmt: R`顶点集为 $[7]$ 的标号树中，满足 $d(1)=3$ 且 $d(2)=3$ 的有多少棵？`,

      method: "m-treecount", sol: R`<p>由度数公式，$d(1)=3$ ⇔ 1 在序列中恰出现 2 次；$d(2)=3$ ⇔ 2 恰出现 2 次。序列长为 $7-2=5$，所以剩下的 1 项不是 1 也不是 2，属于 $\{3,4,5,6,7\}$，有 5 种选法。</p>
      <p>选定这一项（记为 $c$）后，序列由“两个 1、两个 2、一个 $c$”排列而成，排列数为 $$\frac{5!}{2!\,2!\,1!}=\frac{120}{4}=30.$$</p>

  ],
  extensions: [
    { id: "g2-e1", lv: "延伸", src: "课件 11-17 · 补全森林特例", stmt: R`证明：顶点集为 $[n]$（$n\ge2$）的标号树中，包含指定边 $\{1,2\}$ 的有 $2n^{n-3}$ 棵。`,

      method: "m-treecount", sol: R`<p>数集合 $\{(T,e):T\text{ 是 }[n]\text{ 上的树},\ e\in E(T)\}$ 的大小。</p>
      <p><b>按树数</b>：共 $n^{n-2}$ 棵树（Cayley），每棵 $n-1$ 条边，共 $n^{n-2}(n-1)$ 对。</p>
      <p><b>按边数</b>：任取一条可能的边 $\{a,b\}$。把标号 1 与 $a$ 互换、2 与 $b$ 互换（一个置换），含边 $\{1,2\}$ 的树就一一变成含边 $\{a,b\}$ 的树，所以每条边被同样多的树包含，记这个数为 $N$。可能的边有 $\binom n2$ 条，总数为 $\binom n2N$。</p>

mst1: {
  unit: "mst", n: 1, title: "最便宜生成树：贪心与交换",
  goal: "会用 Kruskal 算法（从轻到重加边，不成圈就要）手算最便宜生成树；会用“换一条边”的论证证明贪心正确、证明唯一性。先做概念题、基础题和真题，变种与延伸选做。",
  sections: [
    { id: "mst1-s1", h: "1. 目标是总权最小，不是最短路", html: R`
      <p><b>这节解决什么</b>：要用最少的总花费把所有城市连通（比如铺光缆），每条可铺的线路有不同费用。这就是“最便宜生成树”问题，答案可以用一个很简单的贪心算法求出。</p>
      <p><b>记号</b>：$G=(V,E)$ 是有限、连通的无向图，$|V|=n$，每条边 $e$ 有一个权 $w(e)$（费用）。</p>
      <ul>
        <li><b>生成树</b> $T$：包含 $G$ 的全部顶点、连通且无圈的子图，恰有 $n-1$ 条边。</li>
        <li><b>最便宜生成树</b>（也叫最小生成树，简称 MST）：使总权 $w(T)=\sum_{e\in T}w(e)$ 最小的生成树。</li>
        <li>注意：MST 只管<b>总权</b>最小，不保证树上任意两点间的道路是最短路。</li>
      </ul>
      <p><b>Kruskal 算法</b>：</p>
      <ol>
        <li>把所有边按权从小到大排好（同权的随便排一个顺序）。</li>
        <li>从空边集开始，依次检查每条边 $uv$：若 $u,v$ 在当前已选边中<b>还不连通</b>（属于不同分支），就加入；若已经连通，加入会成圈，跳过。</li>
        <li>选满 $n-1$ 条边就停。</li>
      </ol>
      <p>小例子：三角形 $ABC$，$AB:1,BC:2,AC:3$。先选 $AB$，再选 $BC$，已有 $3-1=2$ 条，停。MST $=\{AB,BC\}$，总权 3。</p>
      <p>补充：同权边先后顺序不同，可能得到不同的最优树（总权相同）；权为负或 0 也照样适用。原图不连通时，只能得到每个分支各一棵的“最小生成森林”。</p>
      <p>下面的工具用的是 <b>2022 秋期末 5(2)</b> 的原题数据（边和权已逐项核对原卷，图的位置是重画的），可以对比“从轻到重加边”和“从重到轻删边”。</p>` },
    { id: "mst1-s2", h: "2. 为什么贪心正确：割与圈都靠换一条边", html: R`
      <p><b>这节解决什么</b>：贪心算法“每步只挑眼前最便宜的”为什么能得到全局最优？关键工具是“换一条边”：往树里加一条边会出现一个圈，从树里删一条边会把树断成两块。</p>
      <p><b>割</b>：把顶点分成两堆，$S$ 和 $V\setminus S$（都非空）。一端在 $S$、另一端在 $V\setminus S$ 的边叫<b>跨割边</b>。任何生成树都必须至少用一条跨割边，否则两堆连不起来。</p>
      <p><b>割性质</b>：对任意一个割，跨割边中最轻的那条 $e$ 一定属于某棵 MST；若 $e$ 严格比其他跨割边都轻，它属于<b>每一棵</b> MST。</p>
      <p>证明（换边）：</p>
      <ol>
        <li>任取一棵 MST $T$。若 $e\in T$，结论成立。</li>
        <li>若 $e=uv\notin T$，往 $T$ 里加 $e$：$T$ 中 $u$ 到 $v$ 有唯一道路，与 $e$ 合起来形成唯一的圈。</li>
        <li>$u,v$ 在割的两侧，所以这条道路必须过一次割，路上有一条跨割边 $f\ne e$，且 $w(e)\le w(f)$（$e$ 最轻）。</li>
        <li>$T-f+e$（删 $f$、加 $e$）仍连通、仍有 $n-1$ 条边，是生成树，总权变化 $w(e)-w(f)\le0$，所以它也是 MST，并且含 $e$。</li>
        <li>若 $e$ 严格最轻，则第 4 步总权严格下降，与 $T$ 最优矛盾，所以 $e$ 本来就在每棵 MST 里。</li>
      </ol>
      <p><b>Kruskal 为什么对</b>：证明“已选的边集 $F$ 始终包含在某棵 MST 里”。准备加入 $e=uv$ 时，取 $S$ 为 $u$ 在 $F$ 中所在的分支。之前比 $e$ 轻的边要么已选、要么因成圈被跳过（两端在同一分支，不跨这个割），所以 $e$ 是跨这个割的最轻边。用上面的换边：被换掉的 $f$ 跨割，而 $F$ 的边都不跨割，所以新树仍包含 $F$ 和 $e$。从空集开始一直归纳到 $n-1$ 条边，输出的就是 MST。</p>
      <p><b>圈性质</b>：一个圈中<b>严格</b>最重的边不属于任何 MST；若只是并列最重，至少有一棵 MST 不含它。理由：若某棵 MST 含该边，删去它把树分成两块（一个割），原圈的其余部分必有另一条边跨这个割，且不比它重，换过去即可。注意“至少一棵”和“每一棵”的区别。</p>` },
    { id: "mst1-s3", h: "3. 逆向删边、唯一性与检验", html: R`
      <p><b>这节解决什么</b>：MST 的另一种算法；什么时候 MST 唯一；拿到一棵树怎么检查它是不是 MST。</p>
      <p><b>逆向删边算法</b>：按权从大到小检查每条边；若从<b>当前图</b>删掉它后仍连通，就删；否则保留。最后剩下的图连通，且每条边都是“删了就断”的边（叫<b>桥</b>），所以无圈，是生成树。正确性证明见变种题 mst1-v1。</p>
      <p><b>唯一性</b>：所有边权互不相同 ⇒ MST 唯一（证明见 mst1-v2）。反过来不成立：三角形边权 $1,1,2$ 有同权边，但 MST 只有 $\{1,1\}$ 那一棵。所以有同权边时，不能直接下结论，要具体检验。</p>
      <p><b>检验一棵候选树 $T$</b>：对每条不在 $T$ 中的边 $e=uv$（<b>非树边</b>），找出 $T$ 中从 $u$ 到 $v$ 的唯一道路 $P_T(u,v)$，比较：</p>
      <ul>
        <li>若每条非树边都满足 $w(e)\ge P_T(u,v)$ 上的最大边权，则 $T$ 是 MST；</li>
        <li>若每处都是严格大于，则 MST 唯一；</li>
        <li>若某处相等，把 $e$ 换进来、把道路上那条等重的边换出去，得到另一棵同样便宜的 MST。</li>
      </ul>
      <p>例：三角形 $AB:1,BC:2,AC:3$，$T=\{AB,BC\}$。非树边 $AC$ 的权 3，$T$ 中 $A$ 到 $C$ 的道路 $A\text{-}B\text{-}C$ 最大边权 2，$3\gt2$，所以 $T$ 是唯一的 MST。</p>
      <p>其他目标：要让<b>边权乘积</b>最小（权都正），对权取对数变成和，Kruskal 照用；要让<b>最大边权</b>最小（最小瓶颈生成树），任一 MST 都满足，但反过来不一定。详见延伸题。</p>` }
  ],
  widget: "mstPlay",
  concepts: [
    { id: "mst1-c1", sec: "mst1-s1", q: R`Kruskal 检查一条边 $uv$ 时，应该什么时候加入它？`,
      opts: [R`$u$ 或 $v$ 还没有出现过`, R`$u,v$ 在已选森林的不同分支`, R`它是原图唯一最轻边`, R`它让某个起点到 $v$ 的距离最短`], a: 1,
      ex: R`判断标准只有一个：加入会不会成圈，即 $u,v$ 是否已经连通。最容易误选“$u$ 或 $v$ 还没出现过”：两端都已出现、但分属两个不同分支时，这条边也必须加入（否则两块连不上）。“距离最短”是最短路问题的思路，与 MST 无关。` },
    { id: "mst1-c2", sec: "mst1-s2", q: R`一个圈中有两条边并列最重。关于其中一条 $e$，一定正确的是：`,
      opts: [R`$e$ 不在任何 MST 中`, R`$e$ 在每棵 MST 中`, R`存在一棵 MST 不含 $e$`, R`图没有 MST`], a: 2,
      ex: R`若某棵 MST 含 $e$，删 $e$ 得割，原圈上另有一条跨割边且不比 $e$ 重，换过去得到不含 $e$ 的 MST，所以“存在一棵不含 $e$”。误选“不在任何 MST 中”：那需要 $e$ 严格最重；并列时，另一条同重边可能被换掉而 $e$ 留下。例：三角形边权 $1,2,2$，两棵 MST 各含一条权 2 的边。` },
    { id: "mst1-c3", sec: "mst1-s3", q: R`下面哪个推断正确？`,
      opts: [R`有两条同权边 ⇒ MST 不唯一`, R`边权全不同 ⇒ MST 唯一`, R`MST 唯一 ⇒ 边权全不同`, R`每个顶点挑一条最轻邻边就一定得到生成树`], a: 1,
      ex: R`边权全不同是 MST 唯一的充分条件。第一、三项都被同一个反例否定：三角形边权 $1,1,2$ 有同权边，MST 却唯一。第四项：各点独立挑最轻邻边，挑出的边可能不连通（例如 4 个点 $AB:1,CD:1$，其他边很重，只会挑出 $AB,CD$ 两块）。` },
    { id: "mst1-c4", sec: "mst1-s1", q: R`连通图有 8 个顶点，Kruskal 已加入 6 条边而未成圈。此时已选边构成：`,
      opts: [R`一棵生成树`, R`恰有两个连通分支的森林`, R`可能有三个分支`, R`一定含原图最重边`], a: 1,
      ex: R`无圈的图（森林）每个分支都是树，分支 $i$ 有 $n_i-1$ 条边，所以分支数 $=$ 顶点数 $-$ 边数 $=8-6=2$（把没碰过的孤立点也算作分支）。生成树需要 $8-1=7$ 条边，还差一条，所以不是生成树；“三个分支”与公式矛盾。` }
  ],
  methods: [
    { id: "m-mst-run", title: "手算 Kruskal：排序、分支、总权", steps: [
      R`列出所有边和权，按权从小到大排好；同权的随便定一个顺序。`,

    { id: "m-mst-swap", title: "证明贪心：加边成圈、删边成割", steps: [

      R`最后说明不变量保持、算法终止时输出确实是树。易错：有并列权时用 $\le$；只有证唯一性时才用严格 $\lt$。`] }

  problems: [
    { id: "mst1-p1", lv: "基础", src: "自编", stmt: R`<p>无向图顶点为 $A,B,C,D$，边与权为 $AB:1,\ BC:2,\ AC:3,\ BD:4,\ CD:5$。用 Kruskal 求 MST 并判断是否唯一。</p>`,
      hints: [R`按权排序：$AB(1),BC(2),AC(3),BD(4),CD(5)$，逐条看两端是否已连通。`, R`前两条 $AB,BC$ 都选，组成 $A-B-C$。$AC$ 虽然便宜，但 $A,C$ 已经连通，会成圈，跳过。`, R`选 $BD(4)$ 接入 $D$，已有 3 条边，停。唯一性：全图边权互不相同；或逐条比较非树边 $AC,CD$ 与树上道路的最大权。`],
      method: "m-mst-run", sol: R`<p>$n=4$，需要 3 条边。按权从小到大检查：</p>
      <div class="table-wrap"><table><thead><tr><th>边</th><th>权</th><th>两端已连通？</th><th>操作</th><th>当前分支</th></tr></thead><tbody>

      <tr><td>$AC$</td><td>3</td><td>是</td><td>跳过</td><td>不变</td></tr>

      </tbody></table></div>
      <p>已有 3 条边，停止。<b>MST $=\{AB,BC,BD\}$，总权 $1+2+4=7$。</b></p>
      <p><b>唯一性</b>：非树边 $AC$：树上 $A\text{-}B\text{-}C$ 的最大权为 $\max(1,2)=2$，$3\gt2$；非树边 $CD$：树上 $C\text{-}B\text{-}D$ 的最大权为 $\max(2,4)=4$，$5\gt4$。全部严格大于，<b>MST 唯一</b>。（也可直接用“全图边权互不相同 ⇒ 唯一”。）</p>` },
    { id: "mst1-p2", lv: "真题", src: "2022 秋期末 5(2)（原图转写为边表）", stmt: R`
      <p>求下列无向加权图的最便宜生成树。顶点为 $A,B,C,D,E,F,G,H$，原图的全部边与权如下：</p>
      <div class="table-wrap"><table><thead><tr><th>边</th><th>权</th><th>边</th><th>权</th><th>边</th><th>权</th></tr></thead><tbody>
      <tr><td>$AB$</td><td>9</td><td>$AC$</td><td>5</td><td>$AD$</td><td>2</td></tr>
      <tr><td>$BE$</td><td>2</td><td>$BH$</td><td>7</td><td>$CE$</td><td>3</td></tr>
      <tr><td>$CD$</td><td>8</td><td>$CF$</td><td>6</td><td>$DF$</td><td>4</td></tr>
      <tr><td>$EG$</td><td>2</td><td>$EH$</td><td>6</td><td>$FG$</td><td>1</td></tr>
      </tbody></table></div><p>先独立计算，再用上面的逐步工具核对。加问（自编）：此图的 MST 是否唯一？</p>`,
      hints: [R`8 个顶点要选 7 条边。先把 12 条边按权排序：$FG(1)$；$AD,BE,EG(2)$；$CE(3)$；$DF(4)$；$AC(5)$；$CF,EH(6)$；$BH(7)$；$CD(8)$；$AB(9)$。`, R`$FG$、三条权 2 的边都能选（不成圈）；接着选 $CE(3)$、$DF(4)$，这时 $A,B,C,D,E,F,G$ 已连成一块。`, R`$AC(5)$、$CF(6)$ 两端已连通，跳过；$EH(6)$ 接入最后的 $H$，选满 7 条。`],
      method: "m-mst-run", sol: R`
      <p>需要 $8-1=7$ 条边。按权从小到大检查：</p>
      <div class="table-wrap"><table><thead><tr><th>边</th><th>权</th><th>操作</th><th>选入后的分支（单点省略）</th></tr></thead><tbody>
      <tr><td>$FG$</td><td>1</td><td>选入</td><td>$\{F,G\}$</td></tr>
      <tr><td>$AD$</td><td>2</td><td>选入</td><td>$\{F,G\},\{A,D\}$</td></tr>
      <tr><td>$BE$</td><td>2</td><td>选入</td><td>$\{F,G\},\{A,D\},\{B,E\}$</td></tr>
      <tr><td>$EG$</td><td>2</td><td>选入</td><td>$\{B,E,F,G\},\{A,D\}$</td></tr>
      <tr><td>$CE$</td><td>3</td><td>选入</td><td>$\{B,C,E,F,G\},\{A,D\}$</td></tr>
      <tr><td>$DF$</td><td>4</td><td>选入</td><td>$\{A,B,C,D,E,F,G\}$</td></tr>
      <tr><td>$AC$</td><td>5</td><td>成圈，跳过</td><td>不变</td></tr>
      <tr><td>$CF$</td><td>6</td><td>成圈，跳过</td><td>不变</td></tr>
      <tr><td>$EH$</td><td>6</td><td>选入</td><td>全部 8 点</td></tr>
      </tbody></table></div>
      <p>已选 7 条，停止：</p>
      $$T=\{FG,AD,BE,EG,CE,DF,EH\},\qquad w(T)=1+2+2+2+3+4+6=20.$$
      <p><b>答：最便宜生成树为 $T$，总权 20。</b></p>
      <p><b>加问（唯一性）</b>：逐条非树边比较“它的权”与“树上连接其两端的道路的最大边权”：</p>
      <ul>
        <li>$AC(5)$：树上道路 $A\text{-}D\text{-}F\text{-}G\text{-}E\text{-}C$，边权 $2,4,1,2,3$，最大 4，$5\gt4$；</li>
        <li>$CF(6)$：$C\text{-}E\text{-}G\text{-}F$，边权 $3,2,1$，最大 3，$6\gt3$；</li>
        <li>$BH(7)$：$B\text{-}E\text{-}H$，边权 $2,6$，最大 6，$7\gt6$；</li>
        <li>$CD(8)$：$C\text{-}E\text{-}G\text{-}F\text{-}D$，边权 $3,2,1,4$，最大 4，$8\gt4$；</li>
        <li>$AB(9)$：$A\text{-}D\text{-}F\text{-}G\text{-}E\text{-}B$，边权 $2,4,1,2,2$，最大 4，$9\gt4$。</li>
      </ul>
      <p>全部严格大于，<b>MST 唯一</b>（虽然图中有同权边）。</p>` }
  ],
  variants: [
    { id: "mst1-v1", lv: "变种", src: "2022 秋作业 7 · 作业1（教材练习 9.1.1）", stmt: R`<p>连通无向加权图中，把边按权从大到小逐条检查。若从当前图删掉该边后仍连通就删，否则保留。证明最后保留的边构成最便宜生成树。</p>`,
      hints: [R`用不变量：“当前图 $H$ 连通，并且包含原图的某棵 MST $T$”。每检查一条边，证明它仍成立。`, R`难点是“$e$ 可删且 $e\in T$”：删 $e$ 把 $T$ 分成两块（一个割）；$e$ 可删说明 $H-e$ 中还有连接 $e$ 两端的道路，这条道路上有一条跨割边 $f$。`, R`说明 $f$ 还没被检查过：它在 $H$ 的一个圈上，所以不是以前保留下来的“桥”，也没被删掉。降序检查 ⇒ $w(f)\le w(e)$，于是 $T-e+f$ 仍是 MST。`],
      method: "m-mst-swap", sol: R`
      <p>记当前图为 $H$。<b>不变量</b>：$H$ 连通，且包含原图的某棵 MST $T$。开始时 $H=G$，成立。现在检查边 $e=uv$，分三种情况：</p>
      <ol>
        <li><b>删 $e$ 会断开</b>：保留 $e$，$H$ 不变，不变量成立。</li>
        <li><b>可删且 $e\notin T$</b>：删掉后 $H-e$ 仍连通，仍包含 $T$，成立。</li>
        <li><b>可删且 $e\in T$</b>：$T-e$ 分成两块，形成割 $(S,V\setminus S)$，$u,v$ 在两侧。因为 $e$ 可删，$H-e$ 中有一条 $u$ 到 $v$ 的道路，它必跨过割，取其上一条跨割边 $f$，则 $T'=T-e+f$ 是生成树。</li>
      </ol>
      <p>第 3 种情况下比较 $w(f)$ 与 $w(e)$：道路加上 $e$ 构成 $H$ 中的圈，$f$ 在这个圈上，所以 $f$ 在 $H$ 中不是桥。以前被保留的边当时都是桥，之后只删边不加边，它们一直是桥，所以 $f$ 不是以前保留的边；$f$ 在 $H$ 中，也没被删过。因此 $f$ 还没被检查，而检查顺序是从大到小，故 $w(f)\le w(e)$。于是 $w(T')\le w(T)$，$T'$ 也是 MST，且 $T'\subseteq H-e$，不变量保持。</p>
      <p><b>终止时</b>：$H$ 连通；每条保留边在被检查时是桥，此后仍是桥，所以 $H$ 无圈，是生成树。它包含某棵 MST，而生成树都恰有 $n-1$ 条边，所以 <b>$H$ 就是那棵 MST</b>。</p>` },
    { id: "mst1-v2", lv: "变种", src: "2022 秋作业 7 · 作业2（教材练习 9.2.3）", stmt: R`设 $G$ 连通且所有边权互不相同。证明其最便宜生成树唯一。`,
      hints: [R`反证：设有两棵不同的 MST $T_1,T_2$。看只属于其中一棵的边（对称差 $T_1\triangle T_2$），取其中权最小的边 $e$。`, R`不妨 $e\in T_1\setminus T_2$。从 $T_1$ 删 $e$ 得到一个割；$T_2$ 中连接 $e$ 两端的道路必经过该割，取其上的跨割边 $f$。`, R`$T_1$ 中跨这个割的只有 $e$，所以 $f\notin T_1$，$f$ 在对称差中，故 $w(f)\gt w(e)$（权互不相同）。$T_2-f+e$ 更便宜，矛盾。`],
      method: "m-mst-swap", sol: R`<p><b>反设</b> $T_1\ne T_2$ 都是 MST。对称差 $T_1\triangle T_2=(T_1\setminus T_2)\cup(T_2\setminus T_1)$ 非空，取其中权最小的边 $e$，不妨 $e=uv\in T_1\setminus T_2$。</p>
      <p><b>第 1 步</b>：$T_1-e$ 分成两块，给出割 $(S,V\setminus S)$，$u\in S$，$v\notin S$。$T_1$ 中跨这个割的边只有 $e$。</p>
      <p><b>第 2 步</b>：$T_2$ 中 $u$ 到 $v$ 的唯一道路必跨过割，取其上一条跨割边 $f$。$f\in T_2$；$f\ne e$（因 $e\notin T_2$），而 $T_1$ 中跨割的只有 $e$，所以 $f\notin T_1$。即 $f\in T_2\setminus T_1$，在对称差中。</p>
      <p><b>第 3 步</b>：$e$ 是对称差中最轻的，边权互不相同，所以 $w(e)\lt w(f)$。$T_2-f+e$ 连通（$e$ 重新连接了被 $f$ 断开的两块）且有 $n-1$ 条边，是生成树，总权 $w(T_2)-w(f)+w(e)\lt w(T_2)$，与 $T_2$ 是 MST 矛盾。</p>
      <p><b>所以 MST 唯一。</b></p>` }
  ],
  extensions: [
    { id: "mst1-e1", lv: "延伸", src: "2022 秋作业 7 · 作业3(a)（教材练习 9.2.4）", stmt: R`设连通图每条边的权 $c(e)\gt0$。如何求使 $\prod_{e\in T}c(e)$ 最小的生成树？说明理由。`,
      hints: [R`用对数把乘积变成和：$\log$ 严格递增，$\log\prod=\sum\log$。`, R`令 $w(e)=\log c(e)$，则 $\log\prod_{e\in T}c(e)=\sum_{e\in T}w(e)$，最小化乘积 ⇔ 最小化新权的总和 ⇔ 求新权下的 MST。`, R`Kruskal 只用到边权的大小顺序，而 $\log$ 不改变顺序，所以直接按原权 $c(e)$ 跑 Kruskal 即可；$c(e)\lt1$ 时新权为负，也没问题。`],
      method: "m-mst-run", sol: R`<p><b>做法</b>：直接按原权 $c(e)$ 从小到大运行 Kruskal，输出的树就使乘积最小。</p>
      <p><b>理由</b>：</p>
      <ol>
        <li>令 $w(e)=\log c(e)$（$c(e)\gt0$，有定义）。对任一生成树 $T$，$\log\prod_{e\in T}c(e)=\sum_{e\in T}w(e)$。</li>
        <li>$\log$ 严格递增，所以乘积最小 ⇔ $\sum_{e\in T}w(e)$ 最小 ⇔ $T$ 是权 $w$ 下的 MST。</li>
        <li>Kruskal 只看边的大小顺序；$c(e_1)\lt c(e_2)\iff w(e_1)\lt w(e_2)$，顺序相同，所以按 $c$ 运行和按 $w$ 运行选出的边一样。</li>
        <li>$0\lt c(e)\lt1$ 时 $w(e)\lt0$，Kruskal 对负权同样正确。</li>
      </ol>
      <p>注意：这里能“只看顺序”，靠的是 MST 的贪心性质；不要推广成“任何优化问题做严格递增变换都不变”。</p>` },
    { id: "mst1-e2", lv: "延伸", src: "2022 秋作业 7 · 作业3(b)（教材练习 9.2.4）；反例为自编", stmt: R`<p>如何求使 $\max_{e\in T}c(e)$ 最小的生成树（最小瓶颈生成树）？证明任一 MST 都满足要求。最小瓶颈生成树一定是 MST 吗？</p>`,
      hints: [R`取 MST $T$ 中最重的一条边 $e_*$，权为 $b$。删去它，$T$ 分成两块，得到一个割。`, R`证明所有跨这个割的边权都 $\ge b$：若某跨割边 $f$ 更轻，$T-e_*+f$ 总权更小，与 MST 矛盾。任何生成树都要用一条跨割边，所以它的最大边权 $\ge b$。`, R`反例找一个“瓶颈一样但总和不同”的图：三角形边权 $1,2,2$，三棵生成树最大边权都是 2，总权却是 3、3、4。`],
      method: "m-mst-swap", sol: R`<p><b>做法</b>：求一棵 MST 即可。</p>
      <p><b>证明</b>：设 $T$ 是 MST，其中最重的边是 $e_*$，$b=c(e_*)$。</p>
      <ol>
        <li>从 $T$ 删 $e_*$，分成两块，得割 $(S,V\setminus S)$。</li>
        <li>每条跨此割的边 $f$ 都满足 $c(f)\ge b$：否则 $T-e_*+f$ 是生成树且总权更小，与 $T$ 是 MST 矛盾。</li>
        <li>任一生成树 $T'$ 必含一条跨此割的边（否则 $S$ 与 $V\setminus S$ 不连通），所以 $\max_{e\in T'}c(e)\ge b$。</li>
        <li>$T$ 的最大边权恰为 $b$，达到下界，所以 <b>$T$ 是最小瓶颈生成树</b>。</li>
      </ol>
      <p><b>逆命题不成立</b>：三角形 $ABC$，$c(AB)=1$，$c(BC)=c(AC)=2$。三棵生成树 $\{AB,BC\},\{AB,AC\},\{BC,AC\}$ 的最大边权都是 2，都是最小瓶颈生成树；但 $\{BC,AC\}$ 总权 4，大于最优总权 3，不是 MST。<b>所以最小瓶颈生成树不一定是 MST。</b></p>` }
  ]
},

h1: {
  unit: "mst", n: 2, title: "Hall 匹配：从邻点集合到完美匹配",
  goal: "会检查 Hall 条件（每一群左侧点的邻居总数都不少于这群点的个数）；会用数边证明正则二部图有完美匹配；能把棋盘、选代表元问题翻译成二部图。先做概念题、基础题与 2022 期末第 3 题，变种和延伸选做。",
  sections: [
    { id: "h1-s1", h: "1. 匹配与 Hall 条件：检查所有子集", html: R`
      <p><b>这节解决什么</b>：有一群人（左侧）和一群工作（右侧），每人只会做其中几项。能不能给每人安排一项、且不同人做不同的工作？Hall 定理给出一个能检查的充要条件。</p>
      <p><b>记号</b>：</p>
      <ul>
        <li><b>二部图</b> $G=(A\sqcup B,E)$：顶点分成左侧 $A$ 和右侧 $B$ 两部分（$\sqcup$ 表示不相交的并），每条边都一端在 $A$、一端在 $B$。</li>
        <li><b>匹配</b>：一组边，任意两条没有公共端点（每个点至多被用一次）。</li>
        <li><b>覆盖 $A$ 的匹配</b>：$A$ 中每个点都恰被匹配一次。<b>完美匹配</b>：所有顶点都被匹配。$|A|=|B|$ 时两者是一回事。</li>
        <li><b>邻点集</b>：对 $S\subseteq A$，$N(S)=\{b\in B:\ b\text{ 至少与 }S\text{ 中一个点相邻}\}$。它是邻点的<b>并集</b>，同一个邻点只算一次。</li>
      </ul>
      <p><b>Hall 定理</b>：存在覆盖 $A$ 的匹配，当且仅当</p>
      $$\text{对所有 }S\subseteq A,\qquad |N(S)|\ge|S|.$$
      <p><b>必要性很直观</b>：$S$ 里的点要分到互不相同的邻居，邻居总数当然不能少于 $|S|$。<b>充分性</b>（条件成立就一定能配）不显然，不能靠“随手贪心”，完整证明见延伸题 h1-e1。$S=\varnothing$ 时条件自动成立。</p>
      <p><b>例</b>：左侧 $a_1,a_2,a_3$，右侧 $b_1,b_2,b_3$；$a_1,a_2$ 都只与 $b_1$ 相邻，$a_3$ 与 $b_1,b_2,b_3$ 都相邻。单点检查：每个 $a_i$ 都有邻点；全集检查：$|N(A)|=3\ge3$。但 $S=\{a_1,a_2\}$ 时 $N(S)=\{b_1\}$，$1\lt2$，所以没有完美匹配。<b>只检查单点、只检查全集都不够。</b></p>` },
    { id: "h1-s2", h: "2. 证明 Hall 条件：从 S 发出的边数，两头夹", html: R`
      <p><b>这节解决什么</b>：考试中最常见的用法——各点度数相同的二部图一定有完美匹配。证明方法是“数从 $S$ 出发的边”，从两边估计。</p>
      <p>记 $e(S,N(S))$ 为一端在 $S$、另一端在 $N(S)$ 的边数。设每个点的度都是同一个正整数 $d$（叫 <b>$d$-正则</b>）。任取 $S\subseteq A$：</p>
      <ol>
        <li><b>从左边数</b>：$S$ 中每点有 $d$ 条边，这些边的另一端都在 $N(S)$ 里（$N(S)$ 的定义），所以 $e(S,N(S))=d|S|$。</li>
        <li><b>从右边数</b>：$N(S)$ 中每点也只有 $d$ 条边，其中一部分可能连向 $A\setminus S$，不算在内，所以 $e(S,N(S))\le d|N(S)|$。</li>
        <li>合起来 $d|S|\le d|N(S)|$，因为 $d\gt0$，两边除以 $d$ 得 $|S|\le|N(S)|$。</li>
      </ol>
      <p>所以 Hall 条件成立，有覆盖 $A$ 的匹配。又数全部边：$d|A|=|E|=d|B|$，所以 $|A|=|B|$，这个匹配就是完美匹配。</p>
      <p>数值例：$3\times3$ 的二部图，每点度 2（比如 $a_i$ 连 $b_i$ 和 $b_{i+1}$，下标模 3）。取 $S=\{a_1,a_2\}$：从左数 $2\times2=4$ 条边，$N(S)=\{b_1,b_2,b_3\}$，$4\le2\times3=6$，$|S|=2\le3$。</p>
      <p><b>度不完全相同也可以</b>：若左侧每点度 $\ge r$、右侧每点度 $\le r$（$r\gt0$），同样有 $r|S|\le e(S,N(S))\le r|N(S)|$，仍能覆盖 $A$。</p>
      <p><b>注意 $d\gt0$</b>：2022 秋期末 3(2) 原卷写“所有点同度”，没有写 $d\gt0$。若 $d=0$（没有边）且两侧非空，显然没有完美匹配，而且第 3 步不能除以 0。所以本课引用时补上“$d$ 为正整数”。</p>` },
    { id: "h1-s3", h: "3. 建模与作答格式", html: R`
      <p><b>这节解决什么</b>：题目通常不会直接给二部图，要自己把问题翻译过去，然后按固定格式写证明。</p>
      <ul><li><b>棋盘</b>：左侧是行，右侧是列，第 $i$ 行第 $j$ 列有棋子就连边 $r_ic_j$。“选出若干棋子，互不同行也不同列”就是一个匹配。</li>
      <li><b>不同代表元</b>：给集合 $X_1,\dots,X_m$ 各选一个元素 $x_i\in X_i$，要求互不相同。左侧是集合编号 $1,\dots,m$，右侧是元素，$x\in X_i$ 就连边。Hall 条件变成：对任意编号子集 $I$，$\left|\bigcup_{i\in I}X_i\right|\ge|I|$（任意几个集合合起来的元素个数不少于集合个数）。</li>
      <li><b>证明存在</b>的答卷顺序：定义两侧与边 → 任取 $S$ → 用数边推出 $|N(S)|\ge|S|$ → 引用 Hall 定理 → 翻译回题目。</li>
      <li><b>证明不存在</b>：只需找一个“坏子集” $S$，使 $|N(S)|\lt|S|$，不必列举所有可能的匹配。</li></ul>
      <p>术语区分：<b>最大匹配</b>是边数最多的匹配；<b>极大匹配</b>只表示“不能直接再加一条边”，但可能通过调整别的边变得更大，所以极大不一定最大。例：路 $a_1-b_1-a_2-b_2$ 中，只选中间边 $b_1a_2$ 是极大匹配（1 条边），但 $\{a_1b_1,a_2b_2\}$ 有 2 条边。</p>` }
  ],
  widget: "hallPlay",
  concepts: [
    { id: "h1-c1", sec: "h1-s1", q: R`为了证明存在覆盖 $A$ 的匹配，Hall 条件要检查：`,
      opts: [R`只检查每个单点`, R`只检查 $S=A$`, R`所有 $S\subseteq A$`, R`只检查度最小的顶点`], a: 2,
      ex: R`定理要求对所有子集成立。只查单点或只查全集都会漏：第 1 节的例子中每个点都有邻居、全集也够，但 $\{a_1,a_2\}$ 两人只有一个共同邻居 $b_1$，配不成。问题往往出在“一小群点挤同一批邻点”。` },
    { id: "h1-c2", sec: "h1-s1", q: R`若 $|A|=3,|B|=4$ 且 Hall 条件成立，一定得到：`,
      opts: [R`覆盖 $A$ 的 3 条匹配边`, R`覆盖全部 7 点的完美匹配`, R`4 条匹配边`, R`每条边都属于某个完美匹配`], a: 0,
      ex: R`Hall 定理保证的是覆盖 $A$，即 3 条匹配边。误选“完美匹配”：一条边覆盖两个点，7 个点是奇数，不可能全部覆盖；右侧 4 个点中必有 1 个没被匹配。4 条匹配边需要左侧 4 个点，也不可能。` },
    { id: "h1-c3", sec: "h1-s2", q: R`正则二部图证明中，为什么是 $e(S,N(S))\le d|N(S)|$，而不总取等号？`,
      opts: [R`因为有自环`, R`$N(S)$ 的一些边可能来自 $A\setminus S$`, R`因为每条边要算两次`, R`因为 $S$ 必为空集`], a: 1,
      ex: R`$d|N(S)|$ 是 $N(S)$ 中所有点的度数之和，包含连向 $S$ 以外左点的边；而 $e(S,N(S))$ 只数一端在 $S$ 的边，所以可能更少。二部图没有自环；这里每条边只数一次，不是两次。` },
    { id: "h1-c4", sec: "h1-s2", q: R`两侧各有 $n\ge1$ 个点、每点度为 0 的二部图：`,
      opts: [R`一定有完美匹配`, R`正则，所以可以约掉度数证明 Hall`, R`没有完美匹配，正则度的正性不可省`, R`不是二部图`], a: 2,
      ex: R`取任一左点 $S=\{a\}$，$N(S)=\varnothing$，$0\lt1$，Hall 条件不成立，没有完美匹配。误选“可以约掉度数”：$0\cdot|S|\le0\cdot|N(S)|$ 恒成立，但不能除以 0，推不出 $|S|\le|N(S)|$。所以定理里“$d$ 为正整数”不能省。` }
  ],
  methods: [
    { id: "m-hall", title: "Hall 存在性：任取子集，双向数边", steps: [
      R`写清楚左侧 $A$、右侧 $B$ 各是什么、什么时候连边；确定目标是覆盖哪一侧。`,
      R`任取 $S\subseteq A$，记邻点并集为 $N(S)$（同一个邻点只算一次）。`,
      R`从 $S$ 数边给下界、从 $N(S)$ 的总度数给上界：$r|S|\le e(S,N(S))\le r|N(S)|$，其中 $r\gt0$，约去 $r$。`,
      R`写“由 Hall 定理，存在覆盖 $A$ 的匹配”；要完美匹配，再说明 $|A|=|B|$；最后翻译回原题。`] },
    { id: "m-hall-deficit", title: "找反例或求最大匹配：寻找邻点缺口", steps: [
      R`找一群邻点高度重叠的左点（几个点只认同几个邻居），而不只是找单个孤立点。`,
      R`写出具体的 $S$ 和 $N(S)$，计算缺口 $|S|-|N(S)|$；缺口为正就说明不能覆盖 $A$。`,
      R`缺口为 $k$ 时，$S$ 中至少 $k$ 个点配不上；再构造一个只差 $k$ 个的匹配，证明它最大。`,
      R`易错：自己贪心配失败不等于无解；要么调整重配，要么给出真正的坏子集。`] }
  ],
  problems: [
    { id: "h1-p1", lv: "基础", src: "自编", stmt: R`<p>给集合 $X_1=\{1,2\},X_2=\{2,3\},X_3=\{1,3,4\},X_4=\{3,4\}$ 各选一个互不相同的代表元。</p><p>若改成 $X_1=X_2=X_3=\{1,2\},X_4=\{3,4\}$，还能选出四个不同代表元吗？最多能选几个？</p>`,
      hints: [R`第一组：能直接写出一组答案就证明了存在，不必检查 Hall 条件的 16 个子集。`, R`第二组：找邻点重叠的几个集合，看 $X_1\cup X_2\cup X_3$ 有几个元素。`, R`三个集合只有 2 个元素可分，至少一个集合分不到；再构造选出 3 个代表元的方案，说明 3 是最大值。`],
      method: "m-hall-deficit", sol: R`<p><b>第一组</b>：取 $x_1=1\in X_1$，$x_2=2\in X_2$，$x_3=3\in X_3$，$x_4=4\in X_4$，四个数互不相同。<b>能选出。</b></p>
      <p><b>第二组</b>：取编号子集 $I=\{1,2,3\}$，$X_1\cup X_2\cup X_3=\{1,2\}$，只有 2 个元素，$2\lt3$，违反 Hall 条件。这三个集合的代表元都只能从 $\{1,2\}$ 中选，至多 2 个能选到不同的数，<b>所以选不出四个不同代表元</b>，至少一个集合分不到。</p>
      <p><b>最多几个</b>：上面说明 $X_1,X_2,X_3$ 中至多 2 个有代表元，加上 $X_4$ 至多 3 个。构造：$x_1=1,x_2=2,x_4=3$，三个不同。<b>最多为 3 个。</b></p>` },
    { id: "h1-p2", lv: "真题", src: "2022 秋期末 3(1)(2)（第 (2) 问补明正度条件）", stmt: R`<p>(1) 叙述 Hall 匹配定理。</p><p>(2) 设 $G=(A\sqcup B,E)$ 是二部图，$|A|=|B|=n$，每个顶点的度都等于同一正整数 $d$。证明 $G$ 存在完美匹配。</p>`,
      hints: [R`(1) 叙述时必须说清两点：条件是“对 $A$ 的所有子集 $S$”，结论是“存在覆盖 $A$ 的匹配”。`, R`(2) 任取 $S\subseteq A$，从左侧数：$S$ 中每点 $d$ 条边，全都通向 $N(S)$，共 $d|S|$ 条。`, R`从右侧数：$N(S)$ 的度数总和是 $d|N(S)|$，至少包含上面那 $d|S|$ 条边，所以 $d|S|\le d|N(S)|$；再用 $d\gt0$ 约去 $d$，引用 Hall，并用 $|A|=|B|$ 得完美匹配。`],
      method: "m-hall", sol: R`<p><b>(1)</b> 设 $G=(A\sqcup B,E)$ 是有限二部图。$G$ 中存在覆盖 $A$ 的匹配，当且仅当对每个 $S\subseteq A$，都有 $|N(S)|\ge|S|$，其中 $N(S)$ 是 $S$ 中顶点在 $B$ 中的邻点全体。</p>
      <p><b>(2)</b> 任取 $S\subseteq A$，数集合 $E(S)=\{$一端在 $S$ 的边$\}$。</p>
      <ul>
        <li>按左端点数：$S$ 中每点恰有 $d$ 条边，二部图中每条边恰有一个左端点，所以 $|E(S)|=d|S|$。</li>
        <li>这些边的右端点都在 $N(S)$ 中（$N(S)$ 的定义），所以 $E(S)$ 包含于“以 $N(S)$ 中点为端点的边”，后者共 $\sum_{b\in N(S)}d(b)=d|N(S)|$ 条。因此 $|E(S)|\le d|N(S)|$。</li>
      </ul>
      <p>得 $d|S|\le d|N(S)|$。因为 $d\gt0$，两边除以 $d$：$|S|\le|N(S)|$。$S$ 任意，Hall 条件成立，由 Hall 定理存在覆盖 $A$ 的匹配 $M$。$M$ 有 $n$ 条边，覆盖 $B$ 中 $n$ 个不同的点，而 $|B|=n$，所以 $M$ 也覆盖 $B$。</p>
      <p><b>所以 $G$ 存在完美匹配。</b></p>
      <p>说明：若允许 $d=0$ 且 $n\ge1$，图没有边，结论不成立；原卷漏写了“正”，这里已补上。</p>` },
    { id: "h1-p3", lv: "真题", src: "2022 秋期末 3(3)", stmt: R`在 $8\times8$ 棋盘放置 24 个兵，每个兵占一格，每行每列都恰有 3 个兵。证明可以选出 8 个兵，使它们彼此既不同行，也不同列。`,
      hints: [R`建二部图：左侧 8 个点代表 8 行，右侧 8 个点代表 8 列；第 $i$ 行第 $j$ 列有兵就连边 $r_ic_j$。`, R`每行恰 3 个兵、每列恰 3 个兵 ⇒ 每个顶点度数都是 3，正好是上一问 $d=3,n=8$ 的情形。`, R`由上一问得完美匹配（8 条边）。每条边对应一个兵，匹配边端点互不相同 ⇒ 这 8 个兵不同行、不同列。`],
      method: "m-hall", sol: R`<p><b>建图</b>：左侧顶点 $r_1,\dots,r_8$（8 行），右侧顶点 $c_1,\dots,c_8$（8 列）。若第 $i$ 行第 $j$ 列的格子有兵，连边 $r_ic_j$。一格至多一个兵，所以没有重边；边与兵一一对应，共 24 条。</p>
      <p><b>度数</b>：$d(r_i)$ = 第 $i$ 行的兵数 = 3；$d(c_j)$ = 第 $j$ 列的兵数 = 3。所以这是两侧各 8 点的 3-正则二部图。</p>
      <p><b>Hall 条件</b>：任取行集合 $S$，从 $S$ 发出的边共 $3|S|$ 条，都通向 $N(S)$；$N(S)$ 中每列至多接收 3 条边，所以 $3|S|\le3|N(S)|$，即 $|S|\le|N(S)|$。由 Hall 定理（即上一问 $d=3,n=8$），存在完美匹配 $M$，共 8 条边。</p>
      <p><b>翻译回来</b>：$M$ 的 8 条边对应 8 个兵。匹配中任意两条边没有公共的行顶点，也没有公共的列顶点，所以<b>这 8 个兵两两不同行、不同列</b>。</p>` }
  ],
  variants: [
    { id: "h1-v1", lv: "变种", src: "自编：正则数边的推广", stmt: R`二部图 $G=(A\sqcup B,E)$ 中，$|A|=10,|B|=12$，左侧每点度数至少为 4，右侧每点度数至多为 4。证明能选出 10 条端点互不重复的边。能否称它为完美匹配？`,
      hints: [R`目标是覆盖 $A$ 的匹配，用 Hall 定理；不需要知道每个点的确切度数，只用上下界。`, R`任取 $S\subseteq A$：从左数 $e(S,N(S))\ge4|S|$（每点至少 4 条）；从右数 $e(S,N(S))\le4|N(S)|$（每点至多 4 条）。`, R`约去 4 得 Hall 条件，覆盖 $A$ 的匹配有 10 条边。但它只覆盖右侧 12 个点中的 10 个。`],
      method: "m-hall", sol: R`<p>任取 $S\subseteq A$，记 $e(S,N(S))$ 为一端在 $S$ 的边数（它们的另一端都在 $N(S)$）。</p>
      <ul><li>左侧每点度 $\ge4$：$e(S,N(S))\ge4|S|$。</li><li>右侧每点度 $\le4$，这些边都落在 $N(S)$ 的点上：$e(S,N(S))\le\sum_{b\in N(S)}d(b)\le4|N(S)|$。</li></ul>
      <p>所以 $4|S|\le4|N(S)|$，$|S|\le|N(S)|$。由 Hall 定理存在覆盖 $A$ 的匹配，它有 $|A|=10$ 条端点互不重复的边。</p>
      <p><b>不是完美匹配</b>：这 10 条边只覆盖右侧 10 个点，右侧还有 2 个点未被覆盖。实际上 $|A|\ne|B|$ 时，任何匹配都不可能覆盖全部顶点。</p>` }
  ],
  extensions: [
    { id: "h1-e1", lv: "延伸", src: "Hall 定理的增广路证明", stmt: R`证明 Hall 条件的充分性。可从一个边数最大的匹配 $M$ 出发，反设左侧存在未匹配点 $a_0$。`,
      hints: [R`交错道路：从 $a_0$ 出发，左→右走不在 $M$ 中的边，右→左走 $M$ 中的边。记能这样走到的左点集合为 $S$（含 $a_0$），右点集合为 $T$。`, R`若 $T$ 中有某个右点没被 $M$ 匹配，把从 $a_0$ 到它的交错道路上的边“在 $M$ 中的去掉、不在的加进来”，匹配多一条边，矛盾。所以 $T$ 中每点都被匹配，且它的伙伴在 $S$ 里。`, R`证明 $|T|=|S|-1$（$T$ 与 $S\setminus\{a_0\}$ 通过 $M$ 一一对应），以及 $N(S)=T$。于是 $|N(S)|=|S|-1\lt|S|$，与 Hall 条件矛盾。`],
      method: "m-hall-deficit", sol: R`<p>设 Hall 条件成立。取边数最大的匹配 $M$，反设它不覆盖 $A$，取一个未匹配的左点 $a_0$。</p>
      <p><b>交错道路</b>：从 $a_0$ 出发，从左到右只走不在 $M$ 中的边，从右到左只走 $M$ 中的边。记能这样到达的左点集合为 $S$（含 $a_0$），右点集合为 $T$。</p>
      <p><b>第 1 步：$T$ 中每点都被匹配</b>。若某个 $b\in T$ 未被匹配，取从 $a_0$ 到 $b$ 的交错道路 $a_0b_1a_1b_2\cdots b$。它的边交替“不在 $M$ / 在 $M$”，首尾两条都不在 $M$ 中，所以不在 $M$ 的边比在 $M$ 的多一条。把这条道路上的边属于 $M$ 与否全部翻转，首尾 $a_0$、$b$ 原本都未匹配，翻转后仍是匹配，且多一条边，与 $M$ 最大矛盾。</p>
      <p><b>第 2 步：$|T|=|S|-1$</b>。每个 $b\in T$ 的匹配伙伴 $a$ 可从 $b$ 沿 $M$ 边到达，所以 $a\in S$，且 $a\ne a_0$（$a_0$ 未匹配）。反过来，每个 $a\in S\setminus\{a_0\}$ 都是从某个 $b\in T$ 沿 $M$ 边到达的，即 $a$ 的伙伴在 $T$ 中。匹配是一一的，所以 $T$ 与 $S\setminus\{a_0\}$ 一一对应，$|T|=|S|-1$。</p>
      <p><b>第 3 步：$N(S)=T$</b>。$T\subseteq N(S)$：每个 $T$ 中的点都是从 $S$ 中某点沿一条边到达的。$N(S)\subseteq T$：设 $a\in S$，$b$ 是 $a$ 的邻点。若边 $ab\notin M$，从 $a$ 走这条边可到达 $b$，$b\in T$；若 $ab\in M$，则 $a\ne a_0$，由第 2 步 $a$ 的伙伴 $b$ 在 $T$ 中。</p>
      <p>于是 $|N(S)|=|T|=|S|-1\lt|S|$，与 Hall 条件矛盾。<b>所以 $M$ 覆盖 $A$，充分性得证。</b></p>` },
    { id: "h1-e2", lv: "延伸", src: "自编：正则图的完美匹配分解", stmt: R`证明：任意有限 $d$-正则二部图（$d\ge1$）的边集可分解为 $d$ 个两两不相交的完美匹配。`,
      hints: [R`对 $d$ 归纳。先用数边得 $|A|=|B|$，再由本课真题的 Hall 论证取出一个完美匹配 $M_1$。`, R`删去 $M_1$ 的边：每个顶点恰好被 $M_1$ 用了一条边，所以每点度数恰好减 1。`, R`剩下的是 $(d-1)$-正则二部图，用归纳假设分解成 $d-1$ 个完美匹配；$d=1$ 时整个边集本身就是完美匹配。`],
      method: "m-hall", sol: R`<p>对 $d$ 归纳。</p>
      <p><b>$d=1$</b>：每点恰有一条边，任意两条边没有公共端点（否则公共端点度 $\ge2$），所以全部边构成一个匹配，且覆盖所有点，是完美匹配。</p>
      <p><b>$d\ge2$</b>：设结论对 $d-1$ 成立。数全部边：$d|A|=|E|=d|B|$，所以 $|A|=|B|$。由 h1-p2 的论证（任取 $S$，$d|S|\le d|N(S)|$）和 Hall 定理，存在完美匹配 $M_1$。</p>
      <p>删去 $M_1$ 的边，得到图 $G'$。$M_1$ 覆盖每个顶点恰一次，所以每个顶点的度恰好减 1，$G'$ 是 $(d-1)$-正则二部图，且 $d-1\ge1$。由归纳假设，$G'$ 的边集可分解为 $d-1$ 个两两不相交的完美匹配 $M_2,\dots,M_d$。</p>
      <p>$M_1$ 与它们的边也不相交（已被删去），合起来就是 $G$ 的边集。<b>所以 $G$ 的边集可分解为 $d$ 个两两不相交的完美匹配。</b></p>` }
  ]
},
/* ---------------- P1 ---------------- */
p1: {
  unit: "planar", n: 1, title: "平面图：Euler 公式与贪心染色",
  goal: "会数面（别漏外部面），会用连通和不连通两个版本的 Euler 公式；会用边数上界 $e\\le3v-6$、$e\\le2v-4$ 证明某图画不到平面上；会证明“色数 ≤ 最大度 + 1”。先做概念题、基础题和真题，变种与延伸选做。",
  sections: [
    { id: "p1-s1", h: "1. 平面嵌入与 Euler 公式", html: R`
      <p><b>这节解决什么</b>：一张图能不能画在纸上而边不交叉？能画的话，点数、边数、“被边围出的区域数”之间有一个固定关系，这就是 Euler 公式。</p>
      <ul>
        <li><b>可平面图</b>：能画在平面上、使边只在公共端点处相交的图。这样的一种具体画法叫<b>平面嵌入</b>（平面图）。注意：某一幅画有交叉，不代表这个图不可平面，也许换个画法就没有交叉了（例如 $K_4$ 常被画成带交叉的正方形加两条对角线，但把一条对角线绕到外面就没有交叉）。</li>
        <li><b>面</b>：平面嵌入把平面切成若干块区域，每块叫一个面。最外面那块无界的区域叫<b>外部面</b>，<b>也要算</b>。</li>
        <li>记号：顶点数 $v$，边数 $e$，面数 $f$，连通分支数 $c$。</li>
      </ul>
      <p><b>Euler 公式</b>：对非空有限平面图，</p>
      $$v-e+f=1+c;\qquad\text{连通时}(c=1)\quad v-e+f=2.$$
      <p>例：三角形 $v=3,e=3$，有内部、外部 2 个面，$3-3+2=2$ ✓。正方形加一条对角线：$v=4,e=5$，内部被分成 2 块，加外部面 $f=3$，$4-5+3=2$ ✓。</p>
      <p><b>连通情形的证明</b>：</p>
      <ol>
        <li>若图是树：$e=v-1$，没有圈，不围出任何有界区域，$f=1$。$v-(v-1)+1=2$ ✓。</li>
        <li>若不是树，它有圈。删去圈上一条边：图仍连通，而这条边两侧原来是两个不同的面，现在合并成一个，所以 $e$ 和 $f$ 各减 1，$v-e+f$ 不变。</li>
        <li>反复删，直到变成树（生成树），由第 1 步值为 2，所以原图的值也是 2。</li>
      </ol>
      <p><b>不连通时</b>：在 $c$ 个分支之间补 $c-1$ 条边把它们连起来（可以画得不交叉）。这些新边不围出新区域，$f$ 不变，$e$ 增加 $c-1$，图变连通：$v-(e+c-1)+f=2$，即 $v-e+f=1+c$。</p>
      <p><b>删圈边与删桥不同</b>：删圈上的边，$f$ 减 1、$c$ 不变；删<b>桥</b>（删了就断开的边），$f$ 不变、$c$ 加 1。两种情况 $v-e+f-c$ 都不变。下面的图顶点位置固定、全部边都画得不交叉，可以试着删边，自己数面。</p>` },
    { id: "p1-s2", h: "2. 数面边：各面边界长度之和等于 2e", html: R`
      <p><b>这节解决什么</b>：把 Euler 公式和“每个面至少被 3 条边围住”结合起来，得到平面图边数的上界。边太多的图就不可能是平面图——这是证明“不可平面”的主要工具。</p>
      <p><b>面的度</b> $\deg(F)$：沿面 $F$ 的边界走一圈经过的边数。<b>每条边有两侧</b>，每一侧属于某个面，所以</p>
      $$\sum_F\deg(F)=2e.$$
      <p>桥的两侧属于同一个面，在这个面的边界上被走两次，也计 2 次。例：一条有 3 条边的路（4 个点），只有外部面，边界长度 $2\times3=6$。</p>
      <p><b>定理 1</b>：简单可平面图，$v\ge3$，则 $$e\le3v-6.$$</p>
      <ol>
        <li>先设图连通。简单图没有自环和重边，$v\ge3$ 时每个面的边界长度至少为 3（围一个面至少要三角形；若图是树，唯一面的长度 $2e\ge4$）。</li>
        <li>所以 $2e=\sum\deg(F)\ge3f$，即 $f\le\frac{2e}3$。</li>
        <li>代入 Euler：$2=v-e+f\le v-e+\frac{2e}3=v-\frac e3$，整理得 $e\le3v-6$。</li>
        <li>不连通时，先在分支之间补边连通（不交叉、仍简单），补完的图满足 $e'\le3v-6$，原来的 $e\lt e'$ 更满足。</li>
      </ol>
      <p><b>定理 2</b>：若还<b>没有三角形</b>（例如二部图），每个面边界长度至少为 4，同样推导（$2e\ge4f$）得 $$e\le2v-4\qquad(v\ge3).$$ 不连通时补的边连接不同分支，不在任何圈上，不会产生三角形。</p>
      <p>例：$K_5$ 有 $v=5,e=10$，而 $3v-6=9$，$10\gt9$，所以 $K_5$ 不可平面。</p>
      <p><b>易错</b>：这两个上界都只是<b>必要条件</b>。超过上界 ⇒ 一定不可平面；不超过 ⇒ 什么也不能说。例如把 $K_{3,3}$ 的一条边中间加一个点（分成两段），得到 $v=7,e=10\le3\cdot7-6=15$，但它仍不可平面（如果它能平面地画出，把中间点去掉、两段并成一条边，$K_{3,3}$ 也能平面画出）。</p>` },
    { id: "p1-s3", h: "3. 顶点染色：逐点贪心与删点归纳", html: R`
      <p><b>这节解决什么</b>：给每个顶点涂颜色，相邻的点颜色必须不同，最少需要几种颜色？我们证明一个对所有图都成立的上界。</p>
      <p><b>正常顶点染色</b>：相邻顶点颜色不同的染色。所需的最少颜色数叫<b>色数</b>，记 $\chi(G)$。例：三角形 $\chi=3$；正方形（4-圈）$\chi=2$（对角同色）。</p>
      <p>2022 期末考的是适用于<b>任意有限简单图</b>的结论（不需要平面）：</p>
      $$\chi(G)\le\Delta+1,\qquad\Delta=\max_x d(x)\ (\text{最大度}).$$
      <p><b>证明（贪心染色）</b>：</p>
      <ol>
        <li>准备 $\Delta+1$ 种颜色，把顶点任意排成一列，一个一个染。</li>
        <li>轮到某个点时，它的邻点中已染色的至多 $\Delta$ 个（它总共至多 $\Delta$ 个邻点），所以最多有 $\Delta$ 种颜色不能用，$\Delta+1$ 种里至少剩一种，就用它。</li>
        <li>对任意一条边，后染的那个端点在染色时已经避开了先染端点的颜色，所以每条边两端颜色不同。</li>
      </ol>
      <p>例：5-圈 $\Delta=2$，用 3 色足够（5-圈奇数长，确实需要 3 色）。</p>
      <p><b>平面图的更好结果</b>：简单平面图 $v\ge3$ 时 $e\le3v-6$，平均度 $\frac{2e}v\le6-\frac{12}v\lt6$，所以一定有一个度 $\le5$ 的顶点。删掉它后仍是平面图，可以反复这样删，再倒过来用 6 色染回去。完整证明见延伸题。</p>
      <p><b>易错</b>：别把“当前这个点的度”和“整张图的最大度”混淆；最大度大也不代表色数大，例如有 100 个叶子的星形树 $\Delta=100$，但只需 2 色（中心一色，叶子一色）。</p>` }
  ],

    { id: "p1-c4", sec: "p1-s3", q: R`最大度为 $\Delta$ 的简单图，用 $\Delta+1$ 色依次贪心染色时，关键理由是：`,

  problems: [
    { id: "p1-p1", lv: "基础", src: "自编", stmt: R`分别求下列平面嵌入的面数（包括外部面）：(1) 立方体图，$v=8,e=12$；(2) 一棵 7 点树；(3) 两个互不相交的三角形。并求 (2) 唯一面的边界长度。`,
      hints: [R`用 Euler 公式，先确定每个图连通与否：前两个连通（$c=1$），第三个有 2 个分支（$c=2$）。`, R`(2) 树的边数为 $v-1=6$；(3) 两个三角形共 $v=6$、$e=6$。连通用 $f=2-v+e$，不连通用 $f=1+c-v+e$。`, R`(2) 的边界长度：树的每条边两侧都在同一个面上，绕一圈每条边走 2 次，长度 $=2e$。`],
      method: "m-planar-count", sol: R`<p><b>(1)</b> 立方体图连通，$v=8,e=12$：$$f=2-v+e=2-8+12=6.$$ 可画成大正方形套小正方形，四角相连：5 个有界面 + 1 个外部面。</p>
      <p><b>(2)</b> 7 点树连通，$e=7-1=6$：$$f=2-7+6=1.$$ 唯一的面是外部面。每条边都是桥，两侧都属于这个面，边界长度 $=2e=12$。</p>
      <p><b>(3)</b> 两个三角形：$v=6,e=6,c=2$：$$f=1+c-v+e=1+2-6+6=3.$$ 并排画出：两个三角形内部各一个面，外加一个公共外部面。</p>
      <p><b>答：(1) 6 个面；(2) 1 个面，边界长度 12；(3) 3 个面。</b></p>` },
    { id: "p1-p2", lv: "真题", src: "2022 秋期末 2(1)(2)", stmt: R`<p>(1) 叙述平面图的 Euler 公式。</p><p>(2) 设简单图 $G$ 每个顶点的度都不超过 $\Delta$，证明 $\chi(G)\le\Delta+1$。</p>`,
      hints: [R`(1) 叙述时写清三点：图连通（或写一般版本）、各字母的含义、面数包括外部面。`, R`(2) 用贪心染色：把顶点任意排成 $x_1,\dots,x_n$，准备 $\Delta+1$ 种颜色，依次给每个点选一种与已染色邻点都不同的颜色。`, R`关键句：“$x_i$ 至多 $\Delta$ 个邻点，其中已染色的至多 $\Delta$ 个，至多禁用 $\Delta$ 种颜色，所以 $\Delta+1$ 种颜色中至少一种可用。”最后检查每条边两端颜色不同。`],
      method: "m-color-greedy", sol: R`<p><b>(1)</b> 设有限连通平面图的顶点数、边数、面数分别为 $v,e,f$（面数包括无界的外部面），则 $$v-e+f=2.$$ 一般地，若平面图有 $c$ 个连通分支，则 $v-e+f=1+c$。</p>
      <p><b>(2)</b> <b>要证</b>：能用 $\Delta+1$ 种颜色给 $G$ 正常染色。</p>
      <p>把顶点任意排成 $x_1,x_2,\dots,x_n$，准备颜色 $1,2,\dots,\Delta+1$。按 $i=1,2,\dots,n$ 的顺序给 $x_i$ 染色：选一种与 $x_i$ 的<b>已染色</b>邻点颜色都不同的颜色。</p>
      <p><b>总能选到</b>：$d(x_i)\le\Delta$，所以 $x_i$ 的已染色邻点至多 $\Delta$ 个，它们至多用了 $\Delta$ 种不同颜色。$\Delta+1$ 种颜色中至少还剩 1 种可用。</p>
      <p><b>是正常染色</b>：任取一条边 $x_ix_j$，不妨 $i\lt j$。给 $x_j$ 染色时 $x_i$ 已染色且是 $x_j$ 的邻点，所以 $x_j$ 的颜色与 $x_i$ 不同。</p>
      <p><b>所以 $\chi(G)\le\Delta+1$。</b>（第 (2) 问不需要 $G$ 是平面图。）</p>` }
  ],
  variants: [
    { id: "p1-v1", lv: "变种", src: "经典例题", stmt: R`分别证明 $K_5$ 和 $K_{3,3}$ 不可平面。再说明为何不能用一般的 $e\le3v-6$ 直接排除 $K_{3,3}$。`,
      hints: [R`反证法：假设可平面，代入边数上界找矛盾。先数：$K_5$ 有 5 点、$\binom52=10$ 边；$K_{3,3}$ 有 6 点、$3\times3=9$ 边。`, R`$K_5$ 用 $e\le3v-6$：$10\le9$？$K_{3,3}$ 是二部图，没有三角形（三角形是奇圈），可用更强的 $e\le2v-4$。`, R`$K_{3,3}$ 用一般界：$9\le12$，没矛盾，所以证不出来；用更强界：$9\le8$，矛盾。`],
      method: "m-planar-count", sol: R`<p><b>$K_5$</b>：$v=5$，$e=\binom52=10$。若 $K_5$ 可平面，它是简单图且 $v\ge3$，应有 $e\le3v-6=9$，但 $10\gt9$，矛盾。<b>所以 $K_5$ 不可平面。</b></p>
      <p><b>$K_{3,3}$</b>：$v=6$，$e=3\times3=9$。$K_{3,3}$ 是二部图，二部图中每个圈长度都是偶数，所以没有三角形。若它可平面，应有 $e\le2v-4=8$，但 $9\gt8$，矛盾。<b>所以 $K_{3,3}$ 不可平面。</b></p>
      <p><b>为什么一般界不够</b>：对 $K_{3,3}$，$3v-6=12$，$e=9\le12$，不等式成立，推不出矛盾。而“满足上界”又不能说明可平面，所以这条路走不通，必须利用“无三角形”这个额外条件，换成更强的 $e\le2v-4$。</p>` },
    { id: "p1-v2", lv: "变种", src: "自编：Euler 与面边双计数", stmt: R`某连通简单平面图有 12 个顶点、21 条边，每个面（包括外部面）的边界长度都是 3 或 4。求三边面和四边面的数目。`,
      hints: [R`先用 Euler 公式（连通）求总面数：$f=2-v+e$。`, R`设三边面 $t$ 个、四边面 $q$ 个，第一个方程 $t+q=f$。`, R`第二个方程用面边双计数：$3t+4q=2e=42$（注意是 $2e$，不是 $e$）。解二元一次方程组。`],
      method: "m-planar-count", sol: R`<p><b>总面数</b>：图连通，$f=2-v+e=2-12+21=11$。</p>
      <p><b>列方程</b>：设三边面 $t$ 个、四边面 $q$ 个。</p>
      <ul><li>面数：$t+q=11$；</li><li>每条边两侧各属于一个面，各面边界长度之和为 $2e$：$3t+4q=2\times21=42$。</li></ul>
      <p><b>解</b>：第二式减去第一式的 3 倍：$(3t+4q)-3(t+q)=42-33$，即 $q=9$；代回 $t=11-9=2$。</p>
      <p><b>答：三边面 2 个，四边面 9 个。</b></p>
      <p>自检：$2+9=11$ ✓，$3\times2+4\times9=6+36=42=2e$ ✓。</p>` }
  ],
  extensions: [
    { id: "p1-e1", lv: "延伸", src: "经典结论：简单平面图六色定理", stmt: R`只用 Euler 边数界和归纳法，证明任意有限简单可平面图都能用至多 6 种颜色正常染色。`,
      hints: [R`对顶点数 $v$ 归纳。$v\le2$ 时直接成立（每点一色即可）。$v\ge3$ 时用 $e\le3v-6$。`, R`度数和 $2e\le6v-12\lt6v$，所以不可能每点度都 $\ge6$，存在度 $\le5$ 的顶点 $x$。删掉 $x$ 后仍是简单可平面图。`, R`剩余图由归纳假设可 6 色染色；把 $x$ 加回来，它至多 5 个邻点，至多禁用 5 种颜色，剩下至少 1 种给 $x$。`],
      method: "m-color-greedy", sol: R`<p>对顶点数 $v$ 归纳。</p>
      <p><b>起始</b>：$v\le2$ 时，每个点用一种不同颜色，至多 2 色，成立。</p>
      <p><b>归纳步</b>：设 $v\ge3$，且结论对所有顶点数更少的简单可平面图成立。</p>
      <ol>
        <li><b>找小度点</b>：由 $e\le3v-6$，度数和 $\sum d(x)=2e\le6v-12\lt6v$。若每个点度都 $\ge6$，度数和 $\ge6v$，矛盾。所以存在顶点 $x$ 满足 $d(x)\le5$。</li>
        <li><b>删点</b>：$G-x$ 是 $G$ 的子图，仍是简单、可平面的（把 $G$ 的平面画法去掉 $x$ 及其边即可），顶点数 $v-1$。由归纳假设，$G-x$ 可用至多 6 种颜色正常染色。</li>
        <li><b>染回</b>：$x$ 至多 5 个邻点，至多用了 5 种颜色，6 种颜色中至少剩一种，给 $x$ 染上。$x$ 与邻点颜色都不同，其余边在 $G-x$ 中已经满足。</li>
      </ol>
      <p><b>所以任意有限简单可平面图都能 6 色正常染色。</b>（证明中没有用到连通性：$e\le3v-6$ 对不连通的情形也成立。）</p>` }

/* ---------------- G3 ---------------- */
g3: {
  unit: "graph", n: 3, title: "双计数：角、无 4-圈图与区组设计",
  goal: "学会“同一堆东西用两种方式数，两个结果相等”（双计数）；用它算角数、推出无 4-圈图的边数上界（2022 期末 6），以及区组设计里每个元素出现几次（2022 期末 2(3)）。先做概念题和两道真题，变种和延伸选做。",
  sections: [
    { id: "g3-s1", h: "1. 讲义 1.2 节：分类求和与换序求和", html: R`
      <p><b>这节解决什么</b>：很多计数题直接数很难，但如果把要数的东西按两种不同方式分组，两边各算一次，就得到一个等式，从中能解出想要的量。这就是<b>双计数</b>。</p>
      <p><b>例子先行</b>：一个班 4 个学生、3 门选修课，下表中 1 表示“该生选了该课”。</p>
      <div class="table-wrap"><table><thead><tr><th></th><th>课 A</th><th>课 B</th><th>课 C</th><th>行和</th></tr></thead><tbody>
      <tr><td>甲</td><td>1</td><td>1</td><td>0</td><td>2</td></tr><tr><td>乙</td><td>1</td><td>0</td><td>1</td><td>2</td></tr><tr><td>丙</td><td>0</td><td>1</td><td>1</td><td>2</td></tr><tr><td>丁</td><td>1</td><td>1</td><td>1</td><td>3</td></tr>
      <tr><td>列和</td><td>3</td><td>3</td><td>3</td><td>9</td></tr></tbody></table></div>
      <p>表里 1 的总个数，按行加是 $2+2+2+3=9$，按列加是 $3+3+3=9$。双计数就是“行和之和 = 列和之和”。</p>
      <p><b>一般形式（讲义的离散 Fubini 定理）</b>：$p:E\to B$ 是有限集之间的映射，对任意函数 $f:E\to\mathbb R$，</p>
      $$\sum_{e\in E}f(e)=\sum_{b\in B}\ \sum_{e\in E,\ p(e)=b}f(e).$$
      <p>意思是：把 $E$ 中元素按“$p(e)$ 等于哪个 $b$”分成若干类，先在每类内求和，再把各类加起来。取 $f\equiv1$ 就是“总数 = 各类个数之和”。</p>
      <p><b>换序求和</b>：若 $E\subseteq A\times B$（$E$ 是一些有序对 $(a,b)$ 的集合，相当于上表中所有“1”的位置），按 $a$ 分类和按 $b$ 分类各做一次：</p>
      $$\sum_{a\in A}\ \sum_{b:\,(a,b)\in E}f(a,b)=\sum_{b\in B}\ \sum_{a:\,(a,b)\in E}f(a,b).$$
      <p>交换内外层时，<b>约束条件 $(a,b)\in E$ 照写</b>。例：$\sum_{i\lt j}a_{ij}=\sum_{i=1}^{n-1}\sum_{j=i+1}^na_{ij}=\sum_{j=2}^n\sum_{i=1}^{j-1}a_{ij}$（约束都是 $1\le i\lt j\le n$）。</p>
      <p><b>握手定理就是双计数</b>：数集合 $\{(v,e):v\text{ 是边 }e\text{ 的端点}\}$。按顶点数得 $\sum_v d(v)$；按边数，每条边 2 个端点，得 $2e(G)$。</p>` },
    { id: "g3-s2", h: "2. 数角：按顶点分类，再用 Cauchy–Schwarz", html: R`
      <p><b>这节解决什么</b>：给“角”下定义并算出它的个数，再得到一个只依赖点数 $n$ 和边数 $E$ 的下界。</p>
      <p>2022 期末 6 的定义：两条有公共顶点的边 $AB,AC$ 构成一个<b>角</b>，公共点 $A$ 是角的<b>顶点</b>，另两端 $B,C$ 是角的<b>支点</b>。</p>
      <p><b>按顶点分类</b>：以 $v_i$ 为顶点的角，就是从 $v_i$ 的 $d_i$ 条边中选 2 条，有 $\binom{d_i}2$ 个，所以</p>
      $$S=\sum_{i=1}^n\binom{d_i}2=\sum_{i=1}^n\frac{d_i^2-d_i}2=\frac12\sum_{i=1}^nd_i^2-E.$$
      <p>最后一步用了握手定理 $\sum d_i=2E$。例：正方形（4-圈）每点度 2，$S=4\binom22=4$，确实 4 个角。</p>
      <p><b>Cauchy–Schwarz 不等式</b>（这里用的形式）：$n\sum d_i^2\ge\left(\sum d_i\right)^2$，等号当且仅当所有 $d_i$ 相等。代入 $\sum d_i=2E$ 得 $\sum d_i^2\ge4E^2/n$，于是</p>
      $$S\ge\frac{2E^2}{n}-E.$$
      <p>等号当且仅当所有度相等（这种图叫<b>正则图</b>）。这个下界只依赖 $n,E$，是下一节“夹逼”的一半。</p>` },
    { id: "g3-s3", h: "3. 换一种分类：按支点对数角，夹出无 4-圈图的边数", html: R`
      <p><b>这节解决什么</b>：同一批角按“支点对”再数一次，配合“没有 4-圈”这个条件得到上界；上下界一夹，就推出边数不能太多。</p>
      <p><b>按支点对分类</b>：以 $\{B,C\}$ 为支点的角，顶点 $A$ 必须同时与 $B$、$C$ 相邻。记 $N(B)$ 为 $B$ 的邻点集合，$c(B,C)=|N(B)\cap N(C)|$ 为 $B,C$ 的<b>公共邻点数</b>，则</p>
      $$S=\sum_{\{B,C\}}c(B,C),$$
      <p>和式取遍全部 $\binom n2$ 个无序点对。例：正方形 $v_1v_2v_3v_4$ 中，$c(v_1,v_3)=2$（公共邻点 $v_2,v_4$），$c(v_2,v_4)=2$，相邻点对的公共邻点数为 0，合计 $4$，与按顶点数的结果一致。</p>
      <p><b>关键等价</b>（2022 期末 6(3)）：$G$ 无 4-圈 ⇔ 每个点对 $\{B,C\}$ 满足 $c(B,C)\le1$。</p>
      <ul>
        <li>若 $c(B,C)\ge2$，取两个公共邻点 $A\ne A'$，则 $B,A,C,A'$ 是四个不同顶点，$BA,AC,CA',A'B$ 都是边，构成 4-圈。</li>
        <li>若有 4-圈 $v_1v_2v_3v_4$，则 $v_2,v_4$ 都是 $v_1,v_3$ 的公共邻点，$c(v_1,v_3)\ge2$。</li>
      </ul>
      <p>于是无 4-圈时 $S\le\binom n2$（每对至多贡献 1）。和第 2 节下界合起来：</p>
      $$\frac{2E^2}{n}-E\le S\le\frac{n(n-1)}2.$$
      <p>两边乘 $2n$ 整理得 $4E^2-2nE-n^2(n-1)\le0$，这是 $E$ 的二次不等式，$E$ 不超过正根：$E\le\frac{1+\sqrt{4n-3}}{4}\,n$。$n$ 很大时约为 $\frac12n^{3/2}$，远小于完全图的 $\frac12n^2$。下面的工具可以点顶点加删边，同时看两种数法和上下界。</p>` }
  ],

    { id: "g3-c1", sec: "g3-s1", q: R`按讲义的换序求和，$\sum_{i=1}^{n}\sum_{j=1}^{i}a_{ij}$ 等于：`,
      opts: [R`$\sum_{j=1}^{n}\sum_{i=1}^{j}a_{ij}$`, R`$\sum_{j=1}^{n}\sum_{i=j}^{n}a_{ij}$`, R`$\sum_{j=1}^{n}\sum_{i=1}^{n}a_{ij}$`, R`$\sum_{i=1}^{n}\sum_{j=i}^{n}a_{ij}$`], a: 1,

  problems: [
    { id: "g3-p1", lv: "基础", src: "自编（讲义 1.2 节例题风格）", stmt: R`<p>(1) 某班 20 名学生，每人恰参加 3 个社团，每个社团恰有 5 名成员。共有几个社团？</p><p>(2) Petersen 图有 10 个顶点、每点度为 3，且没有 4-圈。求它的角数 $S$，并验证 $S\ge2E^2/n-E$ 与 $S\le\binom n2$。</p>`,
      hints: [R`(1) 双计数：数配对（学生，社团），要求该学生在该社团里。(2) 用 $S=\sum\binom{d_i}2$。`, R`(1) 按学生数：$20\times3$；按社团数：每个社团 5 人，$5c$。(2) 握手定理 $E=10\cdot3/2$。`, R`(1) $60=5c$。(2) $E=15$，$S=10\binom32=30$；下界 $2\cdot15^2/10-15$；上界 $\binom{10}2=45$。`],
      method: "m-double-count", sol: R`<p><b>(1)</b> 设社团数为 $c$。数集合 $\{(s,T):\text{学生 }s\text{ 在社团 }T\text{ 中}\}$：</p>
      <ul><li>按学生分类：20 人每人 3 个社团，共 $20\times3=60$；</li><li>按社团分类：每个社团 5 人，共 $5c$。</li></ul>
      <p>$5c=60$，<b>共 12 个社团</b>。</p>
      <p><b>(2)</b> 由握手定理 $E=\frac{10\times3}2=15$。每点度 3，$S=10\times\binom32=10\times3=30$。</p>
      <ul><li>下界：$\frac{2E^2}n-E=\frac{2\times225}{10}-15=45-15=30$，与 $S$ 相等。取等是因为 Petersen 图是 3-正则的（所有度相等）。</li><li>上界：$\binom{10}2=45\ge30$，符合“无 4-圈 ⇒ $S\le\binom n2$”。</li></ul>
      <p>再看边数界：$\frac{1+\sqrt{37}}4\times10\approx\frac{1+6.08}4\times10\approx17.7$，确实 $15\le17.7$。<b>答：$S=30$，两个不等式都成立，下界取等。</b></p>` },
    { id: "g3-p2", lv: "真题", src: "2022 秋期末 6(1)–(4)", stmt: R`<p>在简单图 $G$ 中，称两条有公共顶点的边 $AB,AC$ 构成一个角，$A$ 为角的顶点，$B,C$ 为角的支点。</p><p>(1) 设 $G$ 是 $n$ 阶图，各顶点的度为 $d_1,\dots,d_n$。用它们表示角的总数 $S$。</p><p>(2) 利用 $n(d_1^2+\cdots+d_n^2)\ge(d_1+\cdots+d_n)^2$，证明：若 $G$ 有 $E$ 条边，则 $S\ge\frac{2E^2}n-E$。</p><p>(3) 证明：$G$ 中没有长为 4 的圈，当且仅当对任何两个不同顶点 $B,C$，以 $B,C$ 为支点的角至多一个。</p><p>(4) 利用 (2)(3) 证明：若 $n$ 阶图 $G$ 没有长为 4 的圈，则 $E\le\frac{1+\sqrt{4n-3}}4\,n$。</p>`,
      hints: [R`(1)(2) 按角的顶点分类：$S=\sum\binom{d_i}2=\frac12\sum d_i^2-\frac12\sum d_i$，再代入握手定理 $\sum d_i=2E$ 和题给不等式。`, R`(3) 以 $B,C$ 为支点的角 ↔ $B,C$ 的一个公共邻点。两个公共邻点 $A,A'$ 恰好给出 4-圈 $BACA'$；反过来，4-圈的一对“对角”有两个公共邻点。`, R`(4) 按支点对分类：$S=\sum_{\{B,C\}}c(B,C)\le\binom n2$。与 (2) 联立：$\frac{2E^2}n-E\le\frac{n(n-1)}2$，乘 $2n$ 得 $4E^2-2nE-n^2(n-1)\le0$，用求根公式。`],
      method: "m-angle-bound", sol: R`<p><b>(1)</b> 每个角恰有一个顶点。以 $v_i$ 为顶点的角由 $v_i$ 的两条不同的边决定，共 $\binom{d_i}2$ 个。按顶点分类求和：$$S=\sum_{i=1}^n\binom{d_i}2.$$</p>
      <p><b>(2)</b> $S=\sum\frac{d_i^2-d_i}2=\frac12\sum d_i^2-\frac12\sum d_i$。由握手定理 $\sum d_i=2E$，所以 $S=\frac12\sum d_i^2-E$。由题给不等式，$\sum d_i^2\ge\frac{(\sum d_i)^2}n=\frac{4E^2}n$。所以 $$S\ge\frac12\cdot\frac{4E^2}n-E=\frac{2E^2}n-E.$$</p>
      <p><b>(3)</b> 以 $B,C$ 为支点的角，就是两条边 $AB,AC$，其中 $A$ 是 $B,C$ 的公共邻点。所以这种角的个数等于公共邻点数 $c(B,C)$。</p>
      <p>（⇐，用逆否：有 4-圈 ⇒ 某对有两个角）若有 4-圈 $v_1v_2v_3v_4$，则 $v_2$ 和 $v_4$ 都与 $v_1,v_3$ 相邻，角 $\{v_2v_1,v_2v_3\}$ 与 $\{v_4v_1,v_4v_3\}$ 是两个以 $v_1,v_3$ 为支点的不同角。</p>
      <p>（⇒，用逆否：某对有两个角 ⇒ 有 4-圈）若某对 $B\ne C$ 有两个角，顶点分别为 $A\ne A'$。简单图无自环，$A$ 与 $B$ 相邻所以 $A\ne B$，同理 $A,A'\notin\{B,C\}$，四点 $B,A,C,A'$ 互不相同，$BA,AC,CA',A'B$ 都是边，构成长为 4 的圈。</p>
      <p>两方向合起来：<b>无 4-圈 ⇔ 每对支点至多一个角</b>。</p>
      <p><b>(4)</b> 每个角恰有一对支点，按支点对分类求和：$S=\sum_{\{B,C\}}c(B,C)$，共 $\binom n2$ 项。无 4-圈时由 (3) 每项 $\le1$，所以 $S\le\binom n2=\frac{n(n-1)}2$。结合 (2)：</p>
      $$\frac{2E^2}n-E\le\frac{n(n-1)}2.$$
      <p>两边乘 $2n\gt0$：$4E^2-2nE\le n^2(n-1)$，即 $4E^2-2nE-n^2(n-1)\le0$。左边是开口向上的二次函数，所以 $E$ 不超过较大的根：</p>
      $$E\le\frac{2n+\sqrt{4n^2+16n^2(n-1)}}8=\frac{2n+2n\sqrt{1+4(n-1)}}8=\frac{1+\sqrt{4n-3}}4\,n.$$
      <p><b>证毕。</b></p>` },
    { id: "g3-p3", lv: "真题", src: "2022 秋期末 2(3)", stmt: R`设 $Y_1,\dots,Y_b$ 都是 $X=\{1,2,\dots,v\}$ 的 $k$ 元子集（$k\ge2$），满足：对 $X$ 中任何两个不同元素 $x,x'$，恰有 $\lambda$ 个 $Y_i$ 同时包含 $x$ 与 $x'$。问：每个元素 $x\in X$ 恰被多少个 $Y_i$ 包含？`,
      hints: [R`双计数。固定 $x$，设它属于 $r$ 个 $Y_i$。要数的配对是 $(x',i)$：$x'\ne x$ 且 $x,x'$ 都在 $Y_i$ 中。`, R`按 $x'$ 分类：$x'$ 有 $v-1$ 种，每种对应恰好 $\lambda$ 个 $i$，共 $\lambda(v-1)$。`, R`按 $i$ 分类：只有含 $x$ 的那 $r$ 个 $Y_i$ 有贡献，每个贡献 $k-1$ 个 $x'$，共 $r(k-1)$。令两者相等。`],
      method: "m-double-count", sol: R`<p>固定 $x\in X$，设 $x$ 恰属于 $r_x$ 个 $Y_i$。数集合 $$P=\{(x',i):x'\ne x,\ \ x\in Y_i,\ \ x'\in Y_i\}.$$</p>
      <p><b>按 $x'$ 分类</b>：$x'$ 可取 $X\setminus\{x\}$ 中任一元素，共 $v-1$ 种；对每个 $x'$，同时包含 $x,x'$ 的 $Y_i$ 恰有 $\lambda$ 个（题设）。所以 $|P|=\lambda(v-1)$。</p>
      <p><b>按 $i$ 分类</b>：若 $x\notin Y_i$，这个 $i$ 没有贡献；若 $x\in Y_i$（共 $r_x$ 个这样的 $i$），$x'$ 可取 $Y_i\setminus\{x\}$ 中任一个，有 $k-1$ 个。所以 $|P|=r_x(k-1)$。</p>
      <p>两种数法相等，$k\ge2$ 时可除以 $k-1$：$$r_x=\frac{\lambda(v-1)}{k-1}.$$</p>
      <p><b>答：每个元素恰被 $\frac{\lambda(v-1)}{k-1}$ 个 $Y_i$ 包含（与 $x$ 无关）。</b></p>
      <p>检验：Fano 平面 $v=7,k=3,\lambda=1$，$r=\frac{6}{2}=3$，每点在 3 条“线”上。再数（元素，区组）配对得 $bk=vr$，即 $3b=21$，$b=7$。</p>` }
  ],
  variants: [
    { id: "g3-v1", lv: "变种", src: "自编：边数界的取整与构造", stmt: R`求 5 阶无 4-圈简单图的最大边数，并给出取到最大值的例子。`,
      hints: [R`先用上一题的边数界：代入 $n=5$，$E\le\frac{1+\sqrt{17}}4\cdot5\approx6.40$，边数是整数，所以 $E\le6$。`, R`再构造一个 6 条边的例子：试“蝴蝶图”——两个三角形共用一个顶点。`, R`验证无 4-圈：逐个点对检查公共邻点数 $\le1$。`],
      method: "m-angle-bound", sol: R`<p><b>上界</b>：由 2022 期末 6(4)，$E\le\frac{1+\sqrt{17}}4\cdot5\approx\frac{1+4.123}4\cdot5\approx6.40$。$E$ 是整数，所以 $E\le6$。</p>
      <p><b>构造</b>：中心 $c$ 与 $a,b,d,e$ 都相邻，再加边 $ab$、$de$（两个三角形 $cab$、$cde$ 共用顶点 $c$），共 6 条边。逐类检查公共邻点：</p>
      <ul><li>$\{c,a\}$：$a$ 的邻点是 $c,b$，公共邻点只有 $b$；$\{c,b\},\{c,d\},\{c,e\}$ 同理各 1 个。</li><li>$\{a,b\}$：公共邻点只有 $c$；$\{d,e\}$ 同理。</li><li>$\{a,d\}$ 等跨三角形的点对：公共邻点只有 $c$。</li></ul>
      <p>每对至多 1 个公共邻点，由 (3) 无 4-圈。<b>答：最大边数为 6。</b></p>
      <p>此时 $S=\binom42+4\binom22=6+4=10=\binom52$，上界恰好取到。注意这个界不总是能取到：$n=7$ 时界给出 $E\le\lfloor10.5\rfloor=10$，而实际最大值是 9。</p>` },
    { id: "g3-v2", lv: "变种", src: "讲义作业 6.5.1(1)(2)", stmt: R`<p>对 $n$ 阶图 $G$ 的两个顶点 $u,v$，若 $uv$ 不是边，就在 $u,v$ 之间画一条虚边。证明：由一条实边和一条虚边构成的角的数目是</p>$$D=\sum_{i=1}^nd_i(n-1-d_i).$$`,
      hints: [R`和真题 (1) 一样，按角的顶点分类。`, R`顶点 $v_i$ 和其余 $n-1$ 个点之间各有一条实边或虚边：实边 $d_i$ 条，虚边 $n-1-d_i$ 条。`, R`一实一虚的角，就是从实边里选一条、从虚边里选一条：$d_i(n-1-d_i)$ 个。`],
      method: "m-double-count", sol: R`<p>每个角恰有一个顶点，按顶点分类。</p>
      <p>在 $v_i$ 处：$v_i$ 与其余 $n-1$ 个点之间各恰有一条边（实或虚）。实边 $d_i$ 条，所以虚边 $n-1-d_i$ 条。一实一虚的角由“一条实边 + 一条虚边”决定，由乘法原理共 $d_i(n-1-d_i)$ 个。</p>
      <p>对 $i$ 求和：<b>$D=\sum_{i=1}^nd_i(n-1-d_i)$</b>。</p>
      <p>检验：三个点、一条实边 $12$：$d=(1,1,0)$，$D=1\cdot1+1\cdot1+0=2$。确实：在点 1 处有实边 12 与虚边 13，在点 2 处有实边 21 与虚边 23。</p>` }
  ],
  extensions: [
    { id: "g3-e1", lv: "延伸", src: "讲义作业 6.5.1(3)(4)", stmt: R`<p>沿用上题记号，令 $C=\sum\binom{d_i}2$ 为实角数。把 $K_n$ 的 $\binom n3$ 个三角形按边界上的实边数分类：三实边 $x$ 个，两实一虚 $y$ 个，一实两虚 $z$ 个。</p><p>(1) 证明 $3x+y=C$，$2y+2z=D$。</p><p>(2) 证明 $x\ge\frac{4E}{3n}\left(E-\frac{n^2}4\right)+\frac z3$。特别地，$E\gt n^2/4$ 时 $G$ 中有三角形。</p>`,
      hints: [R`每个角（两条边）连同它两支点之间的那条边，恰好组成 $K_n$ 的一个三角形。所以按“角所在的三角形”分类求和。`, R`三实边三角形含 3 个实角；两实一虚含 1 个实角、2 个一实一虚角；一实两虚含 0 个实角、2 个一实一虚角。`, R`由 (1) 消去 $y$：$3x=C-\frac D2+z$。再算 $C-\frac D2=\sum d_i^2-nE$，用 Cauchy–Schwarz $\sum d_i^2\ge4E^2/n$。`],
      method: "m-double-count", sol: R`<p><b>(1)</b> 每个角由顶点和两个支点这三个点确定，恰位于 $K_n$ 的一个三角形中。按三角形分类数角：</p>
      <ul><li>三实边三角形：3 个角都是实角；</li><li>两实一虚：两条实边交于一点，形成 1 个实角；另两个角各含一实一虚，共 2 个一实一虚角；</li><li>一实两虚：0 个实角，2 个一实一虚角（实边两端各一个）；</li><li>三虚边：都不算。</li></ul>
      <p>所以 <b>$C=3x+y$，$D=2y+2z$</b>。</p>
      <p><b>(2)</b> 由 (1)：$y=\frac D2-z$，代入得 $3x=C-y=C-\frac D2+z$。计算：</p>
      $$C-\frac D2=\frac12\sum_i\left(d_i^2-d_i-(n-1)d_i+d_i^2\right)=\frac12\sum_i(2d_i^2-nd_i)=\sum_id_i^2-\frac n2\cdot2E=\sum_id_i^2-nE.$$
      <p>由 Cauchy–Schwarz $\sum d_i^2\ge\frac{4E^2}n$：$$3x\ge\frac{4E^2}n-nE+z=\frac{4E}n\left(E-\frac{n^2}4\right)+z.$$ 两边除以 3 即为所求。</p>
      <p>当 $E\gt n^2/4$ 时右端第一项为正，$z\ge0$，所以 $x\gt0$，<b>$G$ 中有三角形</b>（这就是 Mantel 定理）。</p>` },
    { id: "g3-e2", lv: "延伸", src: "2022 期末 2(3) 的特例（讲义作业 6.8.7 背景）", stmt: R`$X$ 是 $v$ 元集。若一组 3 元子集使 $X$ 中任两个不同元素恰同属其中一个子集（施泰纳三元系），求每个元素所在的子集数 $r$ 与子集总数 $b$，并说明 $v\equiv1$ 或 $3\pmod 6$ 是必要条件。`,
      hints: [R`这是 $k=3,\lambda=1$ 的区组设计，直接套真题结论 $r=\lambda(v-1)/(k-1)$。`, R`再数（元素，子集）配对：按元素 $vr$，按子集 $3b$，所以 $b=vr/3$。`, R`$r=\frac{v-1}2$ 是整数 ⇒ $v$ 奇；$b=\frac{v(v-1)}6$ 是整数 ⇒ $3\mid v(v-1)$。两者合起来看 $v$ 模 6 的余数。`],
      method: "m-double-count", sol: R`<p><b>求 $r$</b>：由真题 g3-p3 的结论，$k=3,\lambda=1$，$r=\frac{1\cdot(v-1)}{3-1}=\frac{v-1}2$。</p>
      <p><b>求 $b$</b>：数配对 $\{(x,i):x\in Y_i\}$。按元素分类：$v$ 个元素各在 $r$ 个子集中，共 $vr$；按子集分类：$b$ 个子集各 3 个元素，共 $3b$。所以 $b=\frac{vr}3=\frac{v(v-1)}6$。</p>
      <p><b>必要条件</b>：$r$ 是整数 ⇒ $v-1$ 偶 ⇒ $v$ 奇，即 $v\equiv1,3,5\pmod6$。$b$ 是整数 ⇒ $3\mid v(v-1)$ ⇒ $v\equiv0$ 或 $1\pmod3$。$v\equiv5\pmod6$ 时 $v\equiv2\pmod3$，被排除。<b>所以 $v\equiv1$ 或 $3\pmod6$。</b></p>
      <p>例：$v=7$ 时 $r=3$，$b=7$（Fano 平面）；$v=3$ 时 $r=1,b=1$（只有一个子集 $X$ 本身）。</p>` }
  ]
