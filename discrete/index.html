count1: {
  unit: "count", n: 1, title: "计数回顾：容斥、递推与抽屉原理",
  goal: "对应讲义 §1.4–1.6 的三种计数工具：有重叠时用容斥原理，能按情况拆分时用递推，要证“一定存在”时用抽屉原理。30 分钟建议：先做 4 道概念题和 3 道基础题，变种和延伸题留到复习时再做。",
  sections: [
    { id: "count1-s1", h: "1. 容斥：先定义坏事件，再逐点核对系数", html: R`<p><b>这节解决什么：</b>要数“满足至少一个条件”或“一个条件都不满足”的对象，而各条件互相重叠，直接相加会重复。容斥原理告诉你怎样加加减减才恰好不重不漏。</p><p><b>记号：</b>$|A|$ 是集合 $A$ 的元素个数；$\bigcup$ 是并（至少属于一个），$\cap$ 是交（同时属于）。我们常把不想要的情况叫“坏事件”$A_1,\dots,A_m$。</p><p><b>公式（讲义定理 1.4.1）：</b></p>$$\left|\bigcup_{i=1}^m A_i\right|=\sum_i|A_i|-\sum_{i\lt j}|A_i\cap A_j|+\sum_{i\lt j\lt k}|A_i\cap A_j\cap A_k|-\cdots+(-1)^{m-1}|A_1\cap\cdots\cap A_m|.$$<p>两个集合时就是 $|A\cup B|=|A|+|B|-|A\cap B|$。例：1~10 中是 2 或 3 的倍数的数：$5+3-1=7$（2,3,4,6,8,9,10）。</p><p><b>为什么对：</b>固定一个恰好属于 $d\ge1$ 个集合的元素，它在右边被计入 $\binom d1-\binom d2+\binom d3-\cdots=1$ 次（这个和等于 $1-(1-1)^d=1$）。所以每个元素恰好数一次。</p><p><b>“一个坏事件都不发生”</b>的个数 = 全集个数 − 并集个数。</p><p><b>例：错位排列（讲义例 1.4.2）。</b>$n$ 封信全部放错的方法数记为 $d_n$。令 $A_i$ = “第 $i$ 封信放对”的排列。指定某 $k$ 封信放对，其余 $n-k$ 封随便放，有 $(n-k)!$ 种；这样的 $k$ 封信有 $\binom nk$ 种选法。所以</p>$$d_n=\sum_{k=0}^n(-1)^k\binom nk(n-k)!=n!\sum_{k=0}^n\frac{(-1)^k}{k!}.$$<p>例：$d_3=6-3\cdot2+3\cdot1-1=2$（即 231、312）。约定 $d_0=1$，$d_1=0$。</p><p>易错：交集 $A_{i_1}\cap\cdots\cap A_{i_k}$ 的意思是“指定的这 $k$ 封放对，其他的<b>放对放错都行</b>”，不是“恰好 $k$ 封放对”。</p>` },
    { id: "count1-s2", h: "2. 递推：分类必须不交且穷尽，初值也是答案", html: R`<p><b>这节解决什么：</b>没有直接公式时，把规模 $n$ 的问题拆成规模更小的同类问题，写成递推式。</p><p><b>要点：</b>分类必须<b>互不重叠</b>（不交）且<b>覆盖全部情况</b>（穷尽）；还要写出<b>初值</b>，否则递推式确定不了数列。</p><p><b>例（作业 6.2.5(1)）：</b>$[n]=\{1,2,\dots,n\}$ 中不含相邻两数的子集（含空集）有多少个？记为 $a_n$。</p><ol><li>不选 $n$：只需在 $[n-1]$ 中选，$a_{n-1}$ 种。</li><li>选 $n$：则 $n-1$ 不能选，剩下在 $[n-2]$ 中选，$a_{n-2}$ 种。</li></ol>$$a_n=a_{n-1}+a_{n-2}\ (n\ge2),\qquad a_0=1,\ a_1=2.$$<p>初值：$[0]$ 是空集，只有空子集 1 种；$[1]$ 有 $\varnothing,\{1\}$ 2 种。依次 $1,2,3,5,8,13,\dots$。讲义的 Fibonacci 数约定 $F_1=F_2=1$，$F_{n+1}=F_n+F_{n-1}$，于是 $a_n=F_{n+2}$。</p><p>检验 $n=3$：$\varnothing,\{1\},\{2\},\{3\},\{1,3\}$ 共 5 个 $=a_3$。✓</p><p>同一个递推式配不同初值是不同数列，所以答卷里初值必须写。求通项可以解特征方程 $r^2=r+1$。页面下方的交互工具可以把公式结果和实际枚举对照。</p>` },
    { id: "count1-s3", h: "3. 抽屉：把“必有”改写成有限集之间的映射", html: R`<p><b>这节解决什么：</b>证明“一定存在某种情况”，不需要找到它，只需数一数。</p><p><b>抽屉原理（讲义定理 1.6.1）：</b>把多于 $mk$ 个物体放进 $m$ 个抽屉，必有一个抽屉至少装 $k+1$ 个。（反证：若每个抽屉至多 $k$ 个，总数至多 $mk$。）用映射说：有限映射 $p:E\to B$，必有一个 $b$ 的原像至少有 $\lceil|E|/|B|\rceil$ 个（$\lceil\cdot\rceil$ 是向上取整）。例：13 个人中必有两人同月生日（13 个物体，12 个抽屉）。</p><p><b>难点是选抽屉。</b>经验：整除问题用“除以 $n$ 的余数”当抽屉；“某几项之和”问题用部分和。</p><p><b>例（讲义例 1.6.4）：</b>任意 $n$ 个整数 $a_1,\dots,a_n$，总能选出非空的一组，其和被 $n$ 整除。</p><ol><li>令部分和 $S_0=0$，$S_i=a_1+\cdots+a_i$（$i=1,\dots,n$），共 $n+1$ 个数。</li><li>它们除以 $n$ 的余数只有 $0,1,\dots,n-1$ 共 $n$ 种（$n$ 个抽屉）。</li><li>必有两个 $S_i,S_j$（$i\lt j$）余数相同，于是 $n\mid S_j-S_i=a_{i+1}+\cdots+a_j$。</li></ol><p>因为 $i\lt j$，选出的组非空，而且是<b>连续</b>的一段。讲义的写法是先看 $S_1,\dots,S_n$ 有没有余数 0，没有再在 $n-1$ 个非零余数中找碰撞；加入 $S_0$ 把两种情况合在一起。</p>` }
  ],
  widget: "countPlay",
  concepts: [
    { id: "count1-c1", sec: "count1-s1", q: R`某元素同时落在三个坏事件里，在三集合并集的容斥式中，其总系数是：`, opts: [R`$3$`, R`$3-3=0$`, R`$3-3+1=1$`, R`$1-3+3=1$，所以三重交集应减去`], a: 2, ex: R`选“$3-3+1=1$”。该元素在单集合项 $\sum|A_i|$ 中被数 3 次；在两两交集项中，它属于 $\binom32=3$ 个两两交集，被减 3 次；在三重交集中被加 1 次。合计 $3-3+1=1$，恰好数一次。易错选最后一项：它把三重交集的符号说反了——三重交集是<b>加</b>回来的，正因为加了这 1 次总数才是 1。` },
    { id: "count1-c2", sec: "count1-s2", q: R`$[n]$ 的不含相邻元素子集数 $a_n$，正确的初值是：`, opts: [R`$a_0=0,a_1=1$`, R`$a_0=1,a_1=1$`, R`$a_0=1,a_1=2$`, R`$a_0=2,a_1=2$`], a: 2, ex: R`选 $a_0=1,a_1=2$。$[0]$ 是空集，它的子集只有空集本身，且空集不含相邻元素，所以 $a_0=1$；$[1]=\{1\}$ 的子集 $\varnothing,\{1\}$ 都合法，$a_1=2$。易错选 $a_0=0$：忘了“空集也算一种”。检验：$a_2=a_1+a_0=3$，确实是 $\varnothing,\{1\},\{2\}$。` },
    { id: "count1-c3", sec: "count1-s3", q: R`要保证某个抽屉至少装 4 个物体，5 个抽屉中最少放多少个物体？`, opts: [R`$15$`, R`$16$`, R`$19$`, R`$20$`], a: 1, ex: R`选 16。若每个抽屉至多 3 个，5 个抽屉至多 $5\times3=15$ 个，所以放 16 个时必有一屉 $\ge4$。易错选 15：15 个可以恰好每屉 3 个，没有任何一屉达到 4，不能保证。` },
    { id: "count1-c4", sec: "count1-s3", q: R`对 $n$ 个整数用部分和证明整除性，加入 $S_0=0$ 后，物体数与抽屉数分别是：`, opts: [R`$n,n$`, R`$n+1,n$`, R`$n,n-1$（包括零余数）`, R`$n+1,n+1$`], a: 1, ex: R`选“$n+1,n$”。物体是 $S_0,S_1,\dots,S_n$ 共 $n+1$ 个；抽屉是除以 $n$ 的余数 $0,\dots,n-1$ 共 $n$ 个。易错选“$n,n-1$”：那是不加 $S_0$ 时“已经排除了余数 0”之后的情形，括号里写“包括零余数”是错的。` }
  ],
  methods: [
    { id: "m-count-ie", title: "容斥：坏事件与交集", steps: [R`写出全集 $\Omega$（在数什么），定义每个坏事件 $A_i$，说清要数的是并集（至少一个坏）还是补集（一个都不坏）。`,R`算“指定 $k$ 个坏事件同时发生”的交集大小；若它只与 $k$ 有关，乘上 $\binom mk$。`,R`套公式：并集从 $\sum|A_i|$ 开始正负交替；补集从 $|\Omega|$ 开始正负交替。`,R`用小例子检验（如 $d_3=2$）。易错：交集只要求指定的事件发生，其他事件发不发生都行。`] },
    { id: "m-count-rec", title: "递推：最后一个对象去哪了", steps: [R`定义 $a_n$：数的是什么，边界怎么算（含不含空集，首尾是否相邻）。`,R`看最后一个元素（选或不选，或最后一段的形状）分类，确认各类不重叠、合起来是全部。`,R`每一类都和更小规模的对象一一对应，写出递推式和它成立的 $n$ 的范围。`,R`写出足够多的初值（递推用到前几项就写几个），并用 $n=3$ 之类小情况手工检验。`] },
    { id: "m-count-pigeon", title: "抽屉：先构造映射", steps: [R`把要证“必存在”的东西翻译成：哪些物体、要找两个满足什么关系的物体。`,R`选抽屉：整除问题用余数，区间和问题用部分和 $S_0,\dots,S_n$；给每个物体指定唯一的抽屉。`,R`比较物体数和抽屉数（物体多于抽屉），用抽屉原理得到同屉的两个物体。`,R`把“同屉”翻译回原题（如 $S_j-S_i$ 被 $n$ 整除），检查下标不同、所选对象非空。`] }
  ],
  problems: [
    { id: "count1-p1", lv: "基础", src: "讲义例 1.4.2（特化 n=5）", stmt: R`五封不同的信放进对应的五个不同信封，每个信封一封，要求每封信都放错。求放法数，并说明容斥交集中的 $(5-k)!$ 为什么允许额外的信放对。`, hints: [R`用容斥。全集是 5 封信的所有排列（$5!=120$ 种）；令 $A_i$ = “第 $i$ 封信放对”，要数的是 $A_1,\dots,A_5$ 都不发生。`, R`指定某 $k$ 封信放对，其余 $5-k$ 封随便放，有 $(5-k)!$ 种；指定哪 $k$ 封有 $\binom5k$ 种。`, R`$d_5=\binom50 5!-\binom51 4!+\binom52 3!-\binom53 2!+\binom54 1!-\binom55 0!=120-120+60-20+5-1$。`], method: "m-count-ie", sol: R`<p><b>设：</b>全集 $\Omega$ = 5 封信的所有放法，$|\Omega|=5!=120$。$A_i$ = 第 $i$ 封信放对的放法。所求 = $|\Omega|-|A_1\cup\cdots\cup A_5|$。</p><p><b>第 1 步：交集大小。</b>指定 $k$ 封信放对后，其余 $5-k$ 封信放进其余 $5-k$ 个信封，任意放，共 $(5-k)!$ 种。指定的 $k$ 封有 $\binom5k$ 种选法。</p><p><b>第 2 步：容斥。</b></p>$$d_5=\sum_{k=0}^5(-1)^k\binom5k(5-k)!=120-5\cdot24+10\cdot6-10\cdot2+5\cdot1-1\cdot1.$$<p>逐项：$120-120+60-20+5-1=44$。</p><p><b>第 3 步：说明 $(5-k)!$。</b>交集 $A_{i_1}\cap\cdots\cap A_{i_k}$ 的定义只要求“这 $k$ 封放对”，没有要求其余放错，所以其余 $5-k$ 封随便放，是 $(5-k)!$。其余信也放对造成的重复计数，正是由公式里正负交替的各项互相抵消的（每个放法最终恰被数一次，见讲解一节的系数论证）。如果在交集里再要求“其余全错”，坏事件的含义就变了，不能再套这个公式。</p><p><b>答：44 种。</b></p>` },
    { id: "count1-p2", lv: "基础", src: "讲义作业 6.2.5(1)", stmt: R`设 $a_n$ 是 $[n]$ 的不含相邻元素的子集数，含空集。求递推式及初值，用讲义的 Fibonacci 数表示 $a_n$，并计算 $a_6$。`, hints: [R`按“选不选 $n$”分两类；选了 $n$ 就不能选 $n-1$。`, R`不选 $n$：$a_{n-1}$ 种；选 $n$：去掉 $n$ 后是 $[n-2]$ 的合法子集，$a_{n-2}$ 种。所以 $a_n=a_{n-1}+a_{n-2}$。`, R`初值 $a_0=1,a_1=2$；而 $F_2=1,F_3=2$，同一递推，所以 $a_n=F_{n+2}$。依次算到 $a_6$。`], method: "m-count-rec", sol: R`<p><b>第 1 步：递推。</b>设 $n\ge2$，把 $[n]$ 的合法子集分两类：</p><ul><li>不含 $n$：它就是 $[n-1]$ 的合法子集，反之亦然，共 $a_{n-1}$ 个。</li><li>含 $n$：则不含 $n-1$；删去 $n$ 后是 $[n-2]$ 的合法子集；反过来 $[n-2]$ 的合法子集加上 $n$ 也合法。一一对应，共 $a_{n-2}$ 个。</li></ul><p>两类不重叠、合起来是全部，所以 $a_n=a_{n-1}+a_{n-2}$（$n\ge2$）。</p><p><b>第 2 步：初值。</b>$a_0=1$（只有空集），$a_1=2$（$\varnothing,\{1\}$）。</p><p><b>第 3 步：用 Fibonacci 表示。</b>讲义 $F_1=F_2=1$，$F_3=2$。数列 $F_{n+2}$ 满足同一递推，且 $F_2=1=a_0$，$F_3=2=a_1$，由归纳法 $a_n=F_{n+2}$。</p><p><b>第 4 步：算 $a_6$。</b>$a_0,\dots,a_6=1,2,3,5,8,13,21$，所以 $a_6=21$（$=F_8$）。</p><p><b>检验：</b>按子集大小 $r$ 数：从 $[6]$ 中选 $r$ 个两两不相邻的数有 $\binom{6-r+1}{r}$ 种，$r=0,1,2,3$ 分别是 $1,6,10,4$，和为 21。✓</p><p><b>答：$a_n=a_{n-1}+a_{n-2}$，$a_0=1,a_1=2$，$a_n=F_{n+2}$，$a_6=21$。</b></p>` },
    { id: "count1-p3", lv: "基础", src: "讲义例 1.6.4（Erdős）", stmt: R`证明：任意 $n\ge1$ 个整数中，存在非空的一组整数，其和能被 $n$ 整除。进一步说明能否保证选出的下标连续。`, hints: [R`用部分和：令 $S_0=0$，$S_i=a_1+\cdots+a_i$。区间和 $a_{i+1}+\cdots+a_j=S_j-S_i$。`, R`$S_0,\dots,S_n$ 共 $n+1$ 个数，除以 $n$ 的余数只有 $n$ 种，用抽屉原理找两个余数相同的。`, R`若 $S_i\equiv S_j\pmod n$，$i\lt j$，则 $n\mid S_j-S_i=a_{i+1}+\cdots+a_j$，这一组非空且下标连续。`], method: "m-count-pigeon", sol: R`<p><b>要证：</b>任意整数 $a_1,\dots,a_n$（$n\ge1$）中，存在非空的一组，其和被 $n$ 整除；并且可以选成下标连续的一段。</p><p><b>第 1 步：构造物体。</b>令 $S_0=0$，$S_i=a_1+a_2+\cdots+a_i$（$1\le i\le n$）。共 $n+1$ 个整数。</p><p><b>第 2 步：抽屉。</b>按除以 $n$ 的余数分类，余数只能是 $0,1,\dots,n-1$，共 $n$ 个抽屉。$n+1\gt n$，由抽屉原理，存在 $0\le i\lt j\le n$ 使 $S_i\equiv S_j\pmod n$。</p><p><b>第 3 步：翻译回原题。</b>$$n\mid S_j-S_i=a_{i+1}+a_{i+2}+\cdots+a_j.$$ 因为 $i\lt j$，这组至少有一项，非空；下标 $i+1,\dots,j$ 是连续的。</p><p><b>结论：存在这样的一组，而且总能选成连续的一段。</b></p><p>说明：讲义写法是先看 $S_1,\dots,S_n$ 中有无余数 0（有则直接取前若干项），没有再在 $n-1$ 个非零余数里找碰撞；加入 $S_0$ 只是把两种情况合并。$n=1$ 时任何整数都被 1 整除，结论显然。</p>` }
  ],
  variants: [
    { id: "count1-v1", lv: "变种", src: "讲义例 1.4.3（特化 n=5,m=3）", stmt: R`把五个不同物体放进三个有标号的盒子，每盒至少一个。求放法数。若三个盒子无标号，答案如何变化？`, hints: [R`有编号的盒子、每盒非空 = 从 5 个物体到 3 个盒子的满射。用容斥，坏事件 $A_i$ = “第 $i$ 个盒子空”。`, R`指定 $k$ 个盒子空，物体只能放进其余 $3-k$ 个盒子，有 $(3-k)^5$ 种。所以答案 $3^5-\binom31 2^5+\binom32 1^5-\binom33 0^5$。`, R`盒子无编号时：每种分法（3 个非空组）给组编号有 $3!$ 种方式且结果互不相同，所以除以 $3!$。`], method: "m-count-ie", sol: R`<p><b>有编号：</b>全集是所有放法 $3^5=243$ 种。$A_i$ = 第 $i$ 盒为空。指定 $k$ 个盒为空，每个物体只能选剩下的 $3-k$ 个盒，有 $(3-k)^5$ 种。由容斥，</p>$$3^5-\binom31 2^5+\binom32 1^5-\binom33 0^5=243-96+3-0=150.$$<p><b>无编号：</b>每一种“分成 3 个非空无编号组”的方法，给三组贴上盒号 1,2,3 有 $3!=6$ 种方式，而且得到的 6 种有编号放法互不相同（因为三组非空且互不相交，不会贴出同样的结果）。所以无编号分法数 $=150/6=25$，这就是第二类 Stirling 数 $S(5,3)$。</p><p>注意：如果允许空盒，两个空盒互换贴号得到同一个放法，就不能简单除以 $3!$。</p><p><b>答：有编号 150 种，无编号 25 种。</b></p>` },
    { id: "count1-v2", lv: "变种", src: "讲义作业 6.2.2（特化 n=100，素数 2、3、5）", stmt: R`在 $1,\ldots,100$ 中，有多少个整数与 $2,3,5$ 都互素？`, hints: [R`用容斥：令 $A_2,A_3,A_5$ 分别是 1~100 中 2、3、5 的倍数，所求是 $100-|A_2\cup A_3\cup A_5|$。`, R`$|A_p|=\lfloor100/p\rfloor$；因为 2,3,5 两两互素，$A_2\cap A_3$ 就是 6 的倍数，依此类推（10、15、30 的倍数）。`, R`$100-(50+33+20)+(16+10+6)-3$。`], method: "m-count-ie", sol: R`<p><b>设：</b>$A_p$ = $\{1,\dots,100\}$ 中 $p$ 的倍数，$|A_p|=\lfloor100/p\rfloor$（向下取整）。与 2,3,5 都互素 = 不在 $A_2\cup A_3\cup A_5$ 中。</p><p><b>第 1 步：单个。</b>$|A_2|=50$，$|A_3|=33$，$|A_5|=20$，和为 103。</p><p><b>第 2 步：两两交。</b>既是 2 又是 3 的倍数 ⇔ 是 6 的倍数（2,3 互素）。$|A_2\cap A_3|=\lfloor100/6\rfloor=16$，$|A_2\cap A_5|=\lfloor100/10\rfloor=10$，$|A_3\cap A_5|=\lfloor100/15\rfloor=6$，和为 32。</p><p><b>第 3 步：三个都交。</b>$|A_2\cap A_3\cap A_5|=\lfloor100/30\rfloor=3$。</p><p><b>第 4 步：容斥。</b>$$100-103+32-3=26.$$</p><p><b>检验：</b>1~30 中与 30 互素的有 $\varphi(30)=8$ 个，1~90 共 24 个；91~100 中与 30 互素的是 91、97，共 26。✓</p><p><b>答：26 个。</b></p>` }
  ],
  extensions: [
    { id: "count1-e1", lv: "延伸", src: "讲义作业 6.2.5(2)(3)", stmt: R`<p>(1) 记 $b_n$ 为 $[n]$ 的不含三个连续元素的子集数，求递推与初值，并算 $b_6$。</p><p>(2) 把 $1,\ldots,n$ 放在圆周上（$n\ge3$），首尾也相邻。记不含相邻元素的子集数为 $c_n$，用主线题的 $a_n$ 表示并算 $c_6$。</p>`, hints: [R`(1) 把子集写成长度 $n$ 的 0/1 串（第 $i$ 位为 1 表示选 $i$），“不含三个连续元素” = 串中没有 111。按结尾是 0、01、011 分三类。`, R`(1) 删去结尾得到更短的合法串：$b_n=b_{n-1}+b_{n-2}+b_{n-3}$（$n\ge3$），$b_0=1,b_1=2,b_2=4$。(2) 圆周上按“选不选 1”分类。`, R`(2) 不选 1：剩下 $2,\dots,n$ 排成一条线，$a_{n-1}$ 种；选 1：则 2 和 $n$ 都不能选，剩下 $3,\dots,n-1$ 一条线，$a_{n-3}$ 种。`], method: "m-count-rec", sol: R`<p><b>(1)</b> 把子集写成 0/1 串，要求不含连续三个 1。设 $n\ge3$，合法串按末尾分类：</p><ul><li>以 0 结尾：去掉末尾 0 后是长 $n-1$ 的任意合法串，$b_{n-1}$ 种；</li><li>以 01 结尾：去掉后是长 $n-2$ 的合法串，$b_{n-2}$ 种；</li><li>以 011 结尾：去掉后是长 $n-3$ 的合法串，$b_{n-3}$ 种。</li></ul><p>末尾不能是 111，所以以 1 结尾的合法串末尾一定是 01 或 011（或串太短），三类不重叠且覆盖全部。故 $$b_n=b_{n-1}+b_{n-2}+b_{n-3}\ (n\ge3),\quad b_0=1,\ b_1=2,\ b_2=4.$$ 依次：$b_3=4+2+1=7$，$b_4=7+4+2=13$，$b_5=13+7+4=24$，$b_6=24+13+7=44$。（检验 $b_3$：8 个串去掉 111，得 7。✓）</p><p><b>(2)</b> 圆周上 $1,\dots,n$（$n\ge3$），$n$ 与 1 相邻。按是否选 1 分类：</p><ul><li>不选 1：其余 $2,\dots,n$ 是一条线上的 $n-1$ 个点（2 与 $n$ 不相邻，因为它们之间隔着 1），合法选法 $a_{n-1}$ 种。</li><li>选 1：2 与 $n$ 都不能选，剩下 $3,\dots,n-1$ 是一条线上的 $n-3$ 个点，$a_{n-3}$ 种。</li></ul><p>所以 $c_n=a_{n-1}+a_{n-3}=F_{n+1}+F_{n-1}$。$c_6=a_5+a_3=13+5=18$。$n=3$ 时第二类剩下 0 个点，$a_0=1$（只选 1），仍然正确：$c_3=a_2+a_0=3+1=4$（$\varnothing,\{1\},\{2\},\{3\}$）。✓</p><p><b>答：(1) $b_6=44$；(2) $c_n=a_{n-1}+a_{n-3}$，$c_6=18$。</b></p>` }
  ]
},
count2: {"unit":R`count`,
"n":2,
"title":R`组合概率：样本空间、独立性与期望`,
"goal":R`对应讲义 §2.1–2.3：把计数变成概率；分清“等可能”“独立”“互斥”；会用指示变量（0/1 变量）求期望。30 分钟建议：先做概念题、硬币题和生日题，变种和延伸选做。`,
"sections":[{"id":R`count2-s1`,
"h":R`1. 有限概率空间：先说明哪些结果等可能`,
"html":R`<p><b>这节解决什么：</b>概率题的第一步是说清“一次试验的所有可能结果是什么、各自概率多少”，之后求概率就是加权计数。</p><p><b>有限概率空间（讲义定义 2.1.1）：</b>一个有限集合 $\Omega$（所有可能结果，叫样本空间），每个结果 $\omega$ 有权重 $p_\omega\ge0$，且所有权重之和为 1。<b>事件</b> $E$ 是 $\Omega$ 的子集，它的概率是 $P(E)=\sum_{\omega\in E}p_\omega$。</p><p>只有当所有结果<b>等可能</b>（均匀空间）时，才能写 $P(E)=|E|/|\Omega|$。</p><p><b>例：</b>公平硬币独立掷 3 次，$\Omega$ 是 8 个 0/1 串（1 表示正面），每个概率 $1/8$。“恰 2 次正面”对应 $110,101,011$ 三个串，概率 $3/8$。注意：“正面次数为 0,1,2,3”这 4 类<b>不是</b>等可能的，不能说恰 2 次的概率是 $1/4$。一般地，掷 $n$ 次恰 $k$ 次正面的概率是 $\binom nk/2^n$。</p><p><b>带权容斥（讲义定理 2.1.6）：</b>把集合大小换成概率，容斥公式照样成立，例如 $P(A\cup B)=P(A)+P(B)-P(A\cap B)$。</p><p><b>技巧：</b>求“至少一次”常用补事件：$P(\text{至少一次})=1-P(\text{一次也没有})$。</p>`},
{"id":R`count2-s2`,
"h":R`2. 独立与互斥：一个说乘法，一个说不能同时发生`,
"html":R`<p><b>这节解决什么：</b>“独立”和“互斥”是两个完全不同的概念，常被混淆。</p><ul><li><b>独立</b>（讲义 §2.3）：$P(A\cap B)=P(A)P(B)$。直观意思：知道 $B$ 发生，不改变 $A$ 发生的概率。</li><li><b>条件概率</b>：若 $P(B)\gt0$，$P(A\mid B)=\dfrac{P(A\cap B)}{P(B)}$，读作“已知 $B$ 发生时 $A$ 的概率”。独立等价于 $P(A\mid B)=P(A)$。分母必须为正。</li><li><b>互斥</b>：$A\cap B=\varnothing$，两件事不能同时发生。</li></ul><p><b>两者的关系：</b>若 $P(A),P(B)\gt0$ 且互斥，则 $P(A\cap B)=0\ne P(A)P(B)$，所以<b>一定不独立</b>（知道 $B$ 发生，$A$ 就不可能发生了，概率被改变）。例：掷一个骰子，$A$=“出 1”，$B$=“出 2”，互斥，但 $P(A\mid B)=0\ne1/6$。</p><p>独立重复试验（如连续掷硬币）的联合结果，按各次概率相乘赋权，这就是讲义例 2.1.2 的乘积空间。</p><p><b>易错：</b>三个以上事件，“每两个独立”（两两独立）不保证“整体独立”（三个一起的交集概率等于三者乘积）。见本课延伸题。</p>`},
{"id":R`count2-s3`,
"h":R`3. 期望：先把计数写成指示变量之和`,
"html":R`<p><b>这节解决什么：</b>求“平均有多少个”的问题。把要数的个数拆成很多个 0/1 变量之和，期望就能逐个相加，即使它们互相不独立。</p><p><b>随机变量与期望（讲义定义 2.2.1）：</b>随机变量 $X$ 就是给每个结果 $\omega$ 一个实数 $X(\omega)$。期望 $E[X]=\sum_\omega X(\omega)p_\omega$（按概率加权的平均值）。</p><p><b>线性性：</b>$E[X+Y]=E[X]+E[Y]$。理由：$\sum_\omega(X(\omega)+Y(\omega))p_\omega$ 拆成两个和即可，<b>不需要独立</b>。</p><p><b>指示变量：</b>事件 $A$ 的指示变量 $I_A$ 在 $A$ 发生时取 1，否则取 0。于是 $E[I_A]=1\cdot P(A)+0=P(A)$。若 $X$ = “满足条件的对象个数”，写成 $X=\sum_iI_i$（$I_i$ 表示第 $i$ 个对象满足条件），则 $$E[X]=\sum_iP(\text{第 }i\text{ 个对象满足条件}).$$</p><p><b>例：</b>掷 3 次硬币，正面次数 $X=I_1+I_2+I_3$，$E[X]=3\times\frac12=1.5$。</p><p><b>生日问题：</b>假设每人生日独立、在 366 天中均匀。$k\le366$ 人生日两两不同的概率：第 1 人随意，第 2 人避开 1 天，第 3 人避开 2 天……$$\prod_{i=0}^{k-1}\Bigl(1-\frac{i}{366}\Bigr).$$ 注意这<b>不是</b>把“每一对不同生日”的概率 $(365/366)$ 连乘 $\binom k2$ 次——各对之间不独立。下方工具可以比较精确的碰撞概率和“同生日人对数”的期望。</p>`}],
"widget":R`birthdayPlay`,
"concepts":[{"id":R`count2-c1`,
"sec":R`count2-s1`,
"q":R`公平硬币独立投掷 3 次，恰有 2 次正面的概率是：`,
"opts":[R`$1/4$`,
R`$3/8$`,
R`$1/2$`,
R`$1/8$`],
"a":1,
"ex":R`选 $3/8$。8 个等可能的串中，恰 2 次正面要从 3 个位置中选 2 个放正面，$\binom32=3$ 个（110、101、011），概率 $3/8$。易错选 $1/4$：把“正面次数为 0,1,2,3”当成 4 个等可能结果，但它们分别对应 1、3、3、1 个串，并不等可能。`},
{"id":R`count2-c2`,
"sec":R`count2-s2`,
"q":R`若 $P(A),P(B)\gt0$ 且 $A,B$ 互斥，则：`,
"opts":[R`一定独立`,
R`不可能独立`,
R`一定互为补事件`,
R`条件概率 P(A|B) 不存在`],
"a":1,
"ex":R`选“不可能独立”。互斥 ⇒ $P(A\cap B)=0$，而 $P(A)P(B)\gt0$，两者不等，所以不独立。易错选“条件概率 P(A|B) 不存在”：$P(B)\gt0$，条件概率存在，且 $P(A\mid B)=0/P(B)=0$。也不一定互为补事件（例：骰子出 1 与出 2 互斥，但并起来不是全部）。`},
{"id":R`count2-c3`,
"sec":R`count2-s3`,
"q":R`使用 $E[X+Y]=E[X]+E[Y]$ 时：`,
"opts":[R`必须独立`,
R`必须等可能`,
R`无需独立`,
R`必须同分布`],
"a":2,
"ex":R`选“无需独立”。$E[X+Y]=\sum_\omega(X(\omega)+Y(\omega))p_\omega=\sum X(\omega)p_\omega+\sum Y(\omega)p_\omega$，只是把有限和拆开，用不到独立。易错选“必须独立”：需要独立的是 $E[XY]=E[X]E[Y]$ 和方差相加 $\operatorname{Var}(X+Y)=\operatorname{Var}X+\operatorname{Var}Y$，不是期望相加。`},
{"id":R`count2-c4`,
"sec":R`count2-s3`,
"q":R`366 天生日模型中，$k$ 人的同生日“人对数”期望是：`,

R`$\binom k2/366$`,

R`$366^{-k}$`],
"a":1,
"ex":R`选 $\binom k2/366$。共 $\binom k2$ 个无序人对，每对生日相同的概率是 $1/366$（第二人的生日恰好等于第一人的），把这些指示变量相加取期望即得。易错选“$P(\text{至少一对同生日})$”：期望数的是“有几对”，三人同生日时一次就贡献 3 对，而“至少一对”只算一次，两者不同。`}],
"methods":[{"id":R`m-prob-space`,
"title":R`概率建模：先空间，再事件`,
"steps":[R`写明一次完整试验的结果是什么（$\Omega$），哪些结果等可能；不要把“恰有几次”这类不同大小的类别当成等可能。`,R`把题目条件写成事件；“至少一次”先求补事件“一次也没有”；多个事件的并用容斥或 $P(\bigcup A_i)\le\sum P(A_i)$。`,R`要把概率相乘时，写明依据（独立）；用条件概率前检查分母 $\gt0$。`,R`易错：结果不等可能时不能用“有利个数/总个数”，要把各结果的概率加起来。`]},
{"id":R`m-prob-indicator`,
"title":R`期望计数：指示变量求和`,
"steps":[R`给要数的对象编号，对每个对象定义指示变量 $I_i$（满足条件取 1，否则取 0），写 $X=\sum I_i$。`,
R`逐个算 $P(I_i=1)$，用线性性 $E[X]=\sum P(I_i=1)$；不需要各 $I_i$ 独立。`,
R`区分“个数的期望”和“至少一个的概率”；要概率上界时用 $P(X\ge1)\le E[X]$（Markov 不等式）。`]}],
"problems":[{"id":R`count2-p1`,
"lv":R`基础`,
"src":R`讲义例 2.1.2(3)（特化 n=6）`,
"stmt":R`独立投掷公平硬币 6 次，求：(1) 恰有 3 次正面的概率；(2) 至少一次正面的概率；(3) 正面次数的期望。`,
"hints":[R`样本空间：长 6 的 0/1 串，共 $2^6=64$ 个，等可能。`,
R`(1) 选 3 个位置放正面：$\binom63$ 个串；(2) 补事件“全反面”只有 1 个串。`,
R`(3) 令 $I_i$ = “第 $i$ 次正面”的指示变量，正面次数 $X=I_1+\cdots+I_6$，$E[I_i]=1/2$。`],
"method":R`m-prob-space`,
"sol":R`<p><b>模型：</b>$\Omega$ = 长度 6 的 0/1 串（1 表示正面），共 $2^6=64$ 个；硬币公平且各次独立，所以每个串概率 $1/64$。</p><p><b>(1)</b> 恰 3 次正面：从 6 个位置选 3 个放 1，$\binom63=20$ 个串。$$P=\frac{20}{64}=\frac5{16}.$$</p><p><b>(2)</b> 补事件“一次正面都没有”只有 $000000$ 一个串，概率 $1/64$。$$P(\text{至少一次正面})=1-\frac1{64}=\frac{63}{64}.$$</p><p><b>(3)</b> 令 $I_i=1$ 当第 $i$ 次是正面，否则 0。正面次数 $X=I_1+\cdots+I_6$，$E[I_i]=P(\text{第 }i\text{ 次正面})=\frac12$。由线性性 $$E[X]=6\times\frac12=3.$$</p><p><b>答：(1) $5/16$；(2) $63/64$；(3) 3。</b></p><p>易错：“正面数为 $0,1,\dots,6$”是 7 类结果，但不等可能，(1) 不能写成 $1/7$。</p>`},
{"id":R`count2-p2`,
"lv":R`讲义作业`,
"src":R`讲义作业 6.3.1(1)(3)`,
"stmt":R`<p>假设一年 366 天，每个人的生日独立且均匀。记 $P_k$ 为 $k$ 人中存在同生日的两人的概率。</p><p>(1) 求 $P_k$；(2) 求使 $P_k\gt1/2$ 的最小正整数 $k$。</p>`,
"hints":[R`先求补事件“$k$ 个人生日两两不同”的概率；$k\gt366$ 时由抽屉原理必有人同生日。`,
R`$k\le366$ 时，依次安排每人的生日：$P(\text{全不同})=\dfrac{366\cdot365\cdots(366-k+1)}{366^k}=\prod_{i=0}^{k-1}\Bigl(1-\dfrac i{366}\Bigr)$。`,
R`算出 $P_{22}\approx0.4748\lt\frac12$，$P_{23}\approx0.5063\gt\frac12$；再说明 $P_k$ 随 $k$ 不减，所以 23 是最小的。`],
"method":R`m-prob-space`,
"sol":R`<p><b>模型：</b>每人生日在 366 天中均匀、互相独立，所以 $k$ 人的生日序列共 $366^k$ 种，等可能。</p><p><b>(1) 第 1 步：补事件。</b>$k\le366$ 时，生日两两不同的序列数：第 1 人 366 种，第 2 人 365 种，……，第 $k$ 人 $366-k+1$ 种，共 $366\cdot365\cdots(366-k+1)$ 种。所以</p>$$P_k=1-\frac{366\cdot365\cdots(366-k+1)}{366^k}=1-\prod_{i=0}^{k-1}\Bigl(1-\frac{i}{366}\Bigr)\quad(k\le366).$$<p>$k\gt366$ 时，人数多于天数，由抽屉原理必有两人同生日，$P_k=1$。</p><p><b>(2) 第 2 步：数值。</b>精确计算乘积得 $P_{22}\approx0.474751\lt\frac12$，$P_{23}\approx0.506323\gt\frac12$。</p><p><b>第 3 步：单调性。</b>设 $Q_k=1-P_k$ 为无碰撞概率，$Q_{k+1}=Q_k\cdot\frac{366-k}{366}\le Q_k$，所以 $P_k$ 随 $k$ 不减。因此 $k\le22$ 时 $P_k\le P_{22}\lt\frac12$。</p><p><b>答：(1) 如上式；(2) 最小 $k=23$。</b>（结论依赖“独立、366 天均匀”的假设。）</p>`}],
"variants":[{"id":R`count2-v1`,
"lv":R`变种`,
"src":R`自编：指示变量与概率上界`,
"stmt":R`在上述 366 天模型下，23 人中同生日的无序人对数为 $X$。求 $E[X]$，并证明 $P(X\ge1)\le E[X]$。这个上界是否就是精确碰撞概率？`,
"hints":[R`给每个无序人对 $\{i,j\}$ 一个指示变量 $I_{ij}$（两人同生日取 1），$X=\sum_{i\lt j}I_{ij}$。`,
R`共 $\binom{23}2=253$ 对，每对同生日概率 $1/366$，所以 $E[X]=253/366$。`,
R`对每个结果都有 $\mathbf 1_{\{X\ge1\}}\le X$（$X=0$ 时两边都是 0；$X\ge1$ 时左边是 1），两边取期望。`],
"method":R`m-prob-indicator`,
"sol":R`<p><b>第 1 步：拆成指示变量。</b>对每对 $i\lt j$，令 $I_{ij}=1$ 若第 $i,j$ 人同生日，否则 0。则 $X=\sum_{i\lt j}I_{ij}$。</p><p><b>第 2 步：每对的概率。</b>无论第 $i$ 人生日是哪天，第 $j$ 人恰好同一天的概率是 $1/366$，所以 $E[I_{ij}]=1/366$。</p><p><b>第 3 步：线性性。</b>共 $\binom{23}2=253$ 对，$$E[X]=\frac{253}{366}\approx0.691257.$$（各 $I_{ij}$ 之间不独立，但线性性不需要独立。）</p><p><b>第 4 步：证明上界。</b>令 $\mathbf 1_{\{X\ge1\}}$ 为事件“$X\ge1$”的指示变量。对每个结果：若 $X=0$，两边都是 0；若 $X\ge1$，左边是 1，右边 $\ge1$。所以 $\mathbf 1_{\{X\ge1\}}\le X$ 处处成立，两边取期望得 $P(X\ge1)\le E[X]$。</p><p><b>第 5 步：比较。</b>精确的碰撞概率是 $P_{23}\approx0.506323$，比上界 0.691 小，所以上界不是精确值。原因：例如三人同生日时，$X$ 一下贡献 3 对，而“至少一对”这个事件只算一次。</p><p><b>答：$E[X]=253/366\approx0.691$；$P(X\ge1)\le E[X]$ 成立，但它只是上界，不是精确概率。</b></p>`}],
"extensions":[{"id":R`count2-e1`,
"lv":R`延伸`,
"src":R`自编：讲义独立性定义的边界`,
"stmt":R`令 $U,V$ 是独立公平 0/1 位。事件 $A=\{U=0\}$、$B=\{V=0\}$、$C=\{U=V\}$ 是否两两独立？是否整体独立？`,
"hints":[R`$U,V$ 独立公平，所以 $00,01,10,11$ 四个结果各概率 $\frac14$。写出 $A,B,C$ 各包含哪些结果。`,
R`$A=\{00,01\}$，$B=\{00,10\}$，$C=\{00,11\}$，每个概率 $\frac12$；任意两个的交集都是 $\{00\}$。`,
R`两两独立：检查 $\frac14=\frac12\cdot\frac12$。整体独立还要求 $P(A\cap B\cap C)=\frac18$，而实际是 $\frac14$。`],
"method":R`m-prob-space`,
"sol":R`<p><b>第 1 步：样本空间。</b>结果 $UV\in\{00,01,10,11\}$，各概率 $\frac14$。</p><p><b>第 2 步：写出事件。</b>$A=\{U=0\}=\{00,01\}$，$B=\{V=0\}=\{00,10\}$，$C=\{U=V\}=\{00,11\}$。各概率 $\frac12$。</p><p><b>第 3 步：两两独立。</b>$A\cap B=\{00\}$，$A\cap C=\{00\}$，$B\cap C=\{00\}$，概率都是 $\frac14=\frac12\cdot\frac12$。所以每两个都独立。</p><p><b>第 4 步：整体独立？</b>整体独立除了两两条件，还要求 $P(A\cap B\cap C)=P(A)P(B)P(C)=\frac18$。但 $A\cap B\cap C=\{00\}$，概率 $\frac14\ne\frac18$。所以<b>不整体独立</b>。直观上：知道 $A,B$ 都发生（$U=V=0$），$C$ 就必然发生了。</p><p><b>答：两两独立，但不整体独立。</b>因此不能由“每两个独立”就把三个事件交集的概率写成三个概率之积。</p>`}]},
count3: {"unit":R`count`,
"n":3,
"title":R`概率界：Markov、Chebyshev 与大数定律`,
"goal":R`对应讲义 §2.2–2.3：只知道期望或方差时，怎样估计“取很大值”或“偏离均值很远”的概率（Markov、Chebyshev 不等式），以及由此得到的大数定律。30 分钟建议：先做概念题和两道基础题；局部引理（LLL）放在延伸题，重点是学会逐条核对条件。`,
"sections":[{"id":R`count3-s1`,
"h":R`1. Markov：把大值事件的每项压低到阈值`,
"html":R`<p><b>这节解决什么：</b>不知道分布、只知道平均值时，能不能说“取很大值的可能性很小”？Markov 不等式说：能，只要变量非负。</p><p><b>Markov 不等式（讲义定理 2.2.2）：</b>若随机变量 $X\ge0$（每个结果上都非负），$a\gt0$，则 $$P(X\ge a)\le\frac{E[X]}{a}.$$</p><p><b>证明（三步）：</b></p><ol><li>记 $\mathbf 1_{\{X\ge a\}}$ 为事件“$X\ge a$”的指示变量。</li><li>逐点比较：若 $X\ge a$，左边 $a\cdot1=a\le X$；若 $X\lt a$，左边 $0\le X$（这里用到 $X\ge0$）。所以 $X\ge a\mathbf 1_{\{X\ge a\}}$ 处处成立。</li><li>两边取期望：$E[X]\ge a\,P(X\ge a)$，再除以 $a$。</li></ol><p><b>例：</b>某班平均分 60（分数非负），则 $P(\text{分数}\ge90)\le60/90=2/3$。若算出的界大于 1，就没信息，取 $\min\{1,E[X]/a\}$。</p><p><b>等号何时成立：</b>第 2 步中两处“$\le$”都要取等（零概率的点不管）：$X\lt a$ 时 $X=0$，$X\ge a$ 时 $X=a$。也就是 $X$ 只取 $0$ 和 $a$ 两个值。</p><p>易错：$X$ 可取负值时不能用（负值会把期望拉低，界就不成立了）。</p>`},
{"id":R`count3-s2`,
"h":R`2. Chebyshev：对平方偏差使用 Markov`,
"html":R`<p><b>这节解决什么：</b>估计 $X$ 偏离平均值 $\mu$ 超过 $a$ 的概率。办法是把 Markov 用在非负的“平方偏差”上。</p><p><b>方差：</b>$\mu=E[X]$，$\operatorname{Var}(X)=E[(X-\mu)^2]=E[X^2]-\mu^2$，衡量 $X$ 离均值有多散。例：$X$ 等可能取 $0,2$，则 $\mu=1$，$\operatorname{Var}=\frac12(1)+\frac12(1)=1$。</p><p><b>Chebyshev 不等式：</b>对任意 $a\gt0$，$$P(|X-\mu|\ge a)\le\frac{\operatorname{Var}(X)}{a^2}.$$</p><p><b>证明：</b>$|X-\mu|\ge a\iff(X-\mu)^2\ge a^2$。对非负变量 $Y=(X-\mu)^2$ 和阈值 $a^2$ 用 Markov：$P(Y\ge a^2)\le E[Y]/a^2=\operatorname{Var}(X)/a^2$。</p><p><b>例：</b>$E[X]=50$，$\operatorname{Var}(X)=25$，则 $P(|X-50|\ge10)\le25/100=0.25$。</p><p><b>关于 $\ge$ 与 $\gt$：</b>讲义正文定理 2.2.3 写的是严格不等号 $|X-\mu|\gt\lambda\sqrt{\operatorname{Var}(X)}$ 的形式。本课用上面的“$\ge a$”版本，方便讨论方差为 0 的情形和作业 6.3.3 的取等条件。两种写法的取等条件不同，不要混用。</p>`},
{"id":R`count3-s3`,
"h":R`3. 大数定律：方差相加需要独立结构`,
"html":R`<p><b>这节解决什么：</b>为什么“试验次数越多，频率越接近概率”？弱大数定律用 Chebyshev 给出定量的说法。</p><p><b>设定：</b>$X_1,\dots,X_n$ 独立、同分布（按讲义的乘积空间），每个均值 $\mu$、方差 $\sigma^2$。样本平均 $\overline X_n=\dfrac{X_1+\cdots+X_n}{n}$。</p><ol><li>期望：$E[\overline X_n]=\frac1n(n\mu)=\mu$（线性性，不需独立）。</li><li>方差：独立时 $\operatorname{Var}(X_1+\cdots+X_n)=n\sigma^2$（交叉项 $\operatorname{Cov}(X_i,X_j)=0$ 靠独立保证）；除以 $n$ 时方差除以 $n^2$，所以 $\operatorname{Var}(\overline X_n)=\sigma^2/n$。</li><li>对 $\overline X_n$ 用 Chebyshev：任意 $\varepsilon\gt0$，$$P(|\overline X_n-\mu|\ge\varepsilon)\le\frac{\sigma^2}{n\varepsilon^2}\xrightarrow{n\to\infty}0.$$</li></ol><p><b>例：</b>公平硬币 $\mu=\frac12$，$\sigma^2=\frac14$。掷 $n=10000$ 次，频率偏离 $0.5$ 至少 $0.05$ 的概率 $\le\frac{0.25}{10000\times0.0025}=0.01$。</p><p><b>正确理解：</b>它说的是“偏离超过固定 $\varepsilon$ 的<b>概率</b>趋于 0”。它不说某次平均一定等于 $\mu$，也不说“前面正面多了，后面就会多出反面来补”（各次独立，硬币没有记忆）。</p>`}],
"widget":R`tailPlay`,
"concepts":[{"id":R`count3-c1`,
"sec":R`count3-s1`,
"q":R`Markov 直接应用需要：`,
"opts":[R`$X\ge0$ 且 $a\gt0$`,
R`$E[X]=0$`,
R`$X$ 独立于自己`,
R`$X$ 必为整数`],
"a":0,
"ex":R`选“$X\ge0$ 且 $a\gt0$”。证明中的逐点不等式 $X\ge a\mathbf 1_{\{X\ge a\}}$ 在 $X\lt a$ 的地方需要 $X\ge0$；最后要除以 $a$，所以 $a\gt0$。易错选“$E[X]=0$”：Markov 对任何非负 $X$ 都成立，不需要期望为 0（非负且期望为 0 的变量几乎只取 0，用 Markov 也没意义）。`},
{"id":R`count3-c2`,
"sec":R`count3-s2`,
"q":R`若 $E[X]=3$、Var(X)=4，则 $P(|X-3|\ge4)$ 的 Chebyshev 上界为：`,
"opts":[R`$1/2$`,
R`$1/4$`,
R`$1/16$`,
R`$4$`],
"a":1,
"ex":R`选 $1/4$。Chebyshev：$P(|X-\mu|\ge a)\le\operatorname{Var}(X)/a^2=4/4^2=1/4$。易错选 $4$：那是直接用方差除以 1 或忘了除以阈值；选 $1/16$ 则是把方差也平方了（$4/4^2$ 中只有阈值要平方）。`},
{"id":R`count3-c3`,
"sec":R`count3-s3`,
"q":R`独立同分布样本的方差为 $\sigma^2$，样本平均的方差是：`,
"opts":[R`$n\sigma^2$`,
R`$\sigma^2$`,
R`$\sigma^2/n$`,
R`$\sigma^2/n^2$`],
"a":2,
"ex":R`选 $\sigma^2/n$。独立时 $\operatorname{Var}(X_1+\cdots+X_n)=n\sigma^2$；样本平均是和除以 $n$，而 $\operatorname{Var}(cY)=c^2\operatorname{Var}(Y)$，所以再除以 $n^2$：$n\sigma^2/n^2=\sigma^2/n$。易错选 $\sigma^2/n^2$：忘了和的方差先变成 $n\sigma^2$。`},
{"id":R`count3-c4`,
"sec":R`count3-s3`,
"q":R`大数定律保证的是：`,
"opts":[R`样本平均每一步都靠近均值`,
R`偏离固定正阈值的概率趋于 0`,
R`每一条无限样本序列都收敛`,

"a":1,
"ex":R`选“偏离固定正阈值的概率趋于 0”。由 Chebyshev，$P(|\overline X_n-\mu|\ge\varepsilon)\le\sigma^2/(n\varepsilon^2)\to0$，这就是本课（讲义）的大数定律。易错选“每一步都靠近均值”：样本平均可以时近时远，大数定律只说远离的概率越来越小；“每条样本序列都收敛”是更强的结论（强大数定律），本课不讲，且也只是“概率 1”而非每一条。`}],
"methods":[{"id":R`m-prob-tail`,
"title":R`尾概率：选非负变量和阈值`,
"steps":[R`要控制 $X$ 取大值：先确认 $X\ge0$，用 Markov $P(X\ge a)\le E[X]/a$。`,R`要控制偏离均值：用 Chebyshev $P(|X-\mu|\ge a)\le\operatorname{Var}(X)/a^2$，阈值记得平方。`,R`看清事件里是 $\ge$ 还是 $\gt$；若算出的界大于 1，结论是“无信息”，取 $\min\{1,\cdot\}$。`,R`问等号条件时，回到证明中的逐点不等式，看哪里“丢了东西”，要求那里处处取等。`]},
{"id":R`m-prob-average`,
"title":R`样本平均：均值、方差、Chebyshev`,
"steps":[R`写明 $X_1,\dots,X_n$ 独立同分布，记单次的均值 $\mu$、方差 $\sigma^2$（0/1 变量：$\mu=p$，$\sigma^2=p(1-p)$）。`,
R`样本平均：$E[\overline X_n]=\mu$，$\operatorname{Var}(\overline X_n)=\sigma^2/n$（期望除以 $n$，方差除以 $n^2$ 再乘 $n$）。`,
R`用 Chebyshev：$P(|\overline X_n-\mu|\ge\varepsilon)\le\sigma^2/(n\varepsilon^2)$；要它 $\le\delta$，解 $n\ge\sigma^2/(\delta\varepsilon^2)$ 并向上取整。`]}],
"problems":[{"id":R`count3-p1`,
"lv":R`基础`,
"src":R`讲义例 2.2.6（定量化）`,
"stmt":R`独立投掷公平硬币 $n$ 次，记正面频率为 $\overline X_n$。用 Chebyshev 保证 $P(|\overline X_n-1/2|\ge0.05)\le0.05$，需要怎样的 $n$？这是否说明更小的 $n$ 一定不够？`,
"hints":[R`令 $X_i$ = 第 $i$ 次正面的指示变量，$\overline X_n=\frac1n\sum X_i$。单次 $\mu=\frac12$，$\sigma^2=\frac12\cdot\frac12=\frac14$。`,
R`$\operatorname{Var}(\overline X_n)=\frac{1}{4n}$，Chebyshev 给 $P(|\overline X_n-\frac12|\ge0.05)\le\dfrac{1/(4n)}{0.05^2}=\dfrac{100}{n}$。`,
R`要 $\dfrac{100}n\le0.05$，即 $n\ge2000$。最后说明这只是“够用”的条件，不是“最少”。`],
"method":R`m-prob-average`,
"sol":R`<p><b>第 1 步：单次的均值和方差。</b>令 $X_i=1$ 若第 $i$ 次正面，否则 0。$E[X_i]=\frac12$，$E[X_i^2]=E[X_i]=\frac12$，$\operatorname{Var}(X_i)=\frac12-\frac14=\frac14$。</p><p><b>第 2 步：频率的方差。</b>$\overline X_n=\frac1n\sum_{i=1}^nX_i$。各次独立，$\operatorname{Var}(\sum X_i)=\frac n4$，所以 $\operatorname{Var}(\overline X_n)=\frac{n/4}{n^2}=\frac1{4n}$，且 $E[\overline X_n]=\frac12$。</p><p><b>第 3 步：Chebyshev。</b>$$P\Bigl(\bigl|\overline X_n-\tfrac12\bigr|\ge0.05\Bigr)\le\frac{1/(4n)}{0.05^2}=\frac{1}{4n\times0.0025}=\frac{100}{n}.$$</p><p><b>第 4 步：解不等式。</b>要 $\frac{100}n\le0.05$，即 $n\ge\frac{100}{0.05}=2000$。所以 $n\ge2000$ 时一定满足要求。</p><p><b>第 5 步：是否“更小的 $n$ 一定不够”？</b>不是。Chebyshev 只给出上界，通常比真实概率大很多（偏松）。$n\ge2000$ 是<b>充分</b>条件；更小的 $n$ 真实的偏离概率也可能已经 $\le0.05$（用二项分布精确计算：$n=450$ 时真实概率约 $0.034$，已经小于 $0.05$）。</p><p><b>答：取 $n\ge2000$ 即可保证；但这不说明更小的 $n$ 不行。</b></p>`},
{"id":R`count3-p2`,
"lv":R`讲义作业`,
"src":R`讲义作业 6.3.3（Chebyshev 明确用 ≥阈值版）`,
"stmt":R`<p>(1) 设 $X\ge0,a\gt0$。求 $P(X\ge a)\le E[X]/a$ 的等号条件。</p><p>(2) 设 $\mu=E[X],a\gt0$。求 $P(|X-\mu|\ge a)\le\operatorname{Var}(X)/a^2$ 的等号条件，并给出非零方差的例子。</p>`,
"hints":[R`(1) 回顾证明：$E[X]-aP(X\ge a)=E[X-a\mathbf 1_{\{X\ge a\}}]$，被平均的量 $X-a\mathbf 1_{\{X\ge a\}}$ 处处 $\ge0$。等号 ⇔ 它在每个正概率结果上都是 0。`,
R`在 $X\lt a$ 的结果上它等于 $X$，要为 0；在 $X\ge a$ 的结果上它等于 $X-a$，要为 0。所以 $X$ 只取 $0$ 或 $a$。`,
R`(2) 对 $Y=(X-\mu)^2$ 与阈值 $a^2$ 套 (1)：$Y\in\{0,a^2\}$，即 $X\in\{\mu-a,\mu,\mu+a\}$。例子：$X=\pm1$ 各概率 $\frac12$，$a=1$。`],
"method":R`m-prob-tail`,
"sol":R`<p><b>(1) Markov 的等号条件。</b></p><p>令 $Z=X-a\mathbf 1_{\{X\ge a\}}$。在 $X\lt a$ 的结果上 $Z=X\ge0$；在 $X\ge a$ 的结果上 $Z=X-a\ge0$。所以 $Z\ge0$ 处处成立，且 $$E[Z]=E[X]-aP(X\ge a).$$ 等号 $P(X\ge a)=E[X]/a$ ⇔ $E[Z]=0$ ⇔ （因为 $Z\ge0$）$Z$ 在每个概率为正的结果上都等于 0 ⇔ 在这些结果上：$X\lt a$ 时 $X=0$，$X\ge a$ 时 $X=a$。</p><p><b>结论：等号成立当且仅当 $X$ 以概率 1 只取 $0$ 和 $a$ 两个值。</b></p><p><b>(2) Chebyshev 的等号条件。</b></p><p>Chebyshev 就是对 $Y=(X-\mu)^2\ge0$、阈值 $a^2$ 用 Markov，所以由 (1)：等号 ⇔ $Y$ 以概率 1 只取 $0$ 与 $a^2$ ⇔ $X$ 以概率 1 只取 $\mu-a,\ \mu,\ \mu+a$。再由 $E[X]=\mu$：$(\mu-a)p_-+\mu p_0+(\mu+a)p_+=\mu$，得 $p_-=p_+$，即两侧概率相等（这一点是自动满足的）。</p><p><b>非零方差的例子：</b>$X=1$ 与 $X=-1$ 各概率 $\frac12$，$\mu=0$，$\operatorname{Var}(X)=1$，取 $a=1$：左边 $P(|X|\ge1)=1$，右边 $1/1^2=1$，相等。✓</p><p><b>注意：</b>若事件写成严格的 $|X-\mu|\gt a$，同一个例子左边变成 0，就不取等了。所以讲义正文的“$\gt$”版本不能直接套用这里的取等条件。</p>`}],
"variants":[{"id":R`count3-v1`,
"lv":R`变种`,
"src":R`讲义作业 6.3.4`,
"stmt":R`有限概率空间上给定事件 $E_1,\ldots,E_r$。若 $F$ 表示至少 $m\ge1$ 个事件发生，证明 $P(F)\le\frac1m\sum_{i=1}^rP(E_i)$。需要事件独立吗？`,
"hints":[R`定义计数变量 $D=\sum_{i=1}^r\mathbf 1_{E_i}$（发生了几个事件），它非负。`,
R`“至少 $m$ 个事件发生” 就是 $F=\{D\ge m\}$；由线性性 $E[D]=\sum_iP(E_i)$。`,
R`对 $D$ 和阈值 $m\gt0$ 用 Markov：$P(D\ge m)\le E[D]/m$。整个过程只用了线性性。`],
"method":R`m-prob-tail`,
"sol":R`<p><b>第 1 步：定义计数变量。</b>令 $D=\sum_{i=1}^r\mathbf 1_{E_i}$，它表示 $E_1,\dots,E_r$ 中发生了几个。显然 $D\ge0$。</p><p><b>第 2 步：期望。</b>由线性性，$E[D]=\sum_{i=1}^rE[\mathbf 1_{E_i}]=\sum_{i=1}^rP(E_i)$。</p><p><b>第 3 步：Markov。</b>$F$ = “至少 $m$ 个发生” = $\{D\ge m\}$，$m\ge1\gt0$，由 Markov $$P(F)=P(D\ge m)\le\frac{E[D]}{m}=\frac1m\sum_{i=1}^rP(E_i).$$</p><p><b>第 4 步：需要独立吗？</b>不需要。证明只用了期望的线性性和 Markov，两者都不要求独立。</p><p><b>结论得证。</b>特例 $m=1$ 就是并集上界 $P(\bigcup E_i)\le\sum P(E_i)$。</p>`}],
"extensions":[{"id":R`count3-e1`,
"lv":R`延伸`,
"src":R`讲义定理 2.3.3：LLL 应用（自编模型）`,
"stmt":R`<p>一个布尔公式是若干个子句的合取，每个子句由 8 个不同变量的文字作“或”；每个变量最多出现在 4 个子句中。证明存在赋值使所有子句成立。</p><p>可用讲义 LLL：若坏事件的依赖图中，每个事件与所有非邻事件组成的事件族无关，且存在 $0\le x_i\lt1$ 使 $P(E_i)\le x_i\prod_{j\sim i}(1-x_j)$，则所有坏事件都不发生的概率为正。</p>`,
"hints":[R`随机赋值：每个变量独立、等概率取 0 或 1。坏事件 $E_i$ = 第 $i$ 个子句为假；子句是 8 个文字的“或”，为假要求 8 个文字全假，概率 $2^{-8}=\frac1{256}$。`,
R`依赖图：两个子句有公共变量就连边。一个子句有 8 个变量，每个变量至多再出现在 $4-1=3$ 个别的子句里，所以度数 $\le8\times3=24$。`,
R`取所有 $x_i=\frac1{25}$，验证 $\frac1{256}\le\frac1{25}\bigl(\frac{24}{25}\bigr)^{24}\approx0.0150$，再由 LLL 得概率 $\ge(24/25)^r\gt0$。`],
"method":R`m-prob-space`,
"sol":R`<p><b>第 1 步：概率模型与坏事件。</b>每个变量独立、等概率取 0 或 1。设共有 $r$ 个子句，$E_i$ = “第 $i$ 个子句不成立”。子句是 8 个不同变量的文字之“或”，不成立 ⇔ 8 个文字全为假，只有一种局部赋值，所以 $P(E_i)=2^{-8}=\frac1{256}$。</p><p><b>第 2 步：依赖图。</b>两个子句有公共变量就连边。第 $i$ 个子句有 8 个变量，每个变量最多出现在 4 个子句中，即除本子句外至多 3 个，所以与 $E_i$ 相邻的事件至多 $8\times3=24$ 个。</p><p><b>第 3 步：核对 LLL 的独立条件。</b>与 $E_i$ 不相邻的子句都不含 $E_i$ 的变量，所以这些事件整体只由别的变量决定；而 $E_i$ 只由自己的 8 个变量决定，各变量独立赋值，因此 $E_i$ 与“所有非邻事件组成的族”无关。（这比两两独立强，正是讲义要求的。）</p><p><b>第 4 步：代入参数。</b>取 $x_i=\frac1{25}$。由于邻居至多 24 个，$$x_i\prod_{j\sim i}(1-x_j)\ge\frac1{25}\Bigl(\frac{24}{25}\Bigr)^{24}\approx0.04\times0.3754\approx0.01502\gt\frac1{256}\approx0.00391.$$</p><p><b>第 5 步：结论。</b>由 LLL，所有坏事件都不发生的概率 $\ge\prod_i(1-x_i)=(24/25)^r\gt0$。概率为正说明至少存在一种赋值使所有子句同时成立。</p><p><b>结论：存在满足所有子句的赋值。</b>（主线复习不要求重证 LLL，重点是四步：定坏事件、画依赖图、核独立条件、代参数。）</p>`}]},
n2: {"unit":R`nt`,
"n":2,
"title":R`数论回顾：Bezout、同余消去与 Euler`,
"goal":R`对应讲义第三章：用最大公约数判断方程有没有整数解；用逆元解同余方程（并知道什么时候不能约分）；用 Euler 定理把大指数变小。30 分钟建议：先做概念题和两道基础题。它和 n1 的中国剩余定理衔接——做任何“约分/求逆”前先检查互素。`,
"sections":[{"id":R`n2-s1`,
"h":R`1. 辗转相除与 Bezout：不仅求 gcd，还要会回代`,
"html":R`<p><b>这节解决什么：</b>求两个数的最大公约数，并把它写成这两个数的整数组合；由此判断 $ax+by=c$ 有没有整数解。</p><p><b>记号：</b>讲义用 $(a,b)$ 表示 $a,b$ 的最大公约数（即 $\gcd(a,b)$）。$a\mid b$ 表示 $a$ 整除 $b$。</p><p><b>辗转相除（讲义命题 3.1.4）：</b>若 $a=qb+r$，则 $(a,b)=(b,r)$。理由：$d$ 整除 $a,b$ ⇔ $d$ 整除 $b,r$（因为 $r=a-qb$，$a=qb+r$），两对数的公因子完全相同。反复做带余除法，余数越来越小，最后一个非零余数就是最大公约数。</p><p><b>Bezout 定理（讲义定理 3.1.6）：</b>$a,b$ 不全为 0 时，存在整数 $u,v$ 使 $au+bv=(a,b)$。求 $u,v$ 的办法是把辗转相除的等式倒过来代。</p><p><b>例：</b>求 $(252,198)$。</p><ol><li>$252=1\cdot198+54$</li><li>$198=3\cdot54+36$</li><li>$54=1\cdot36+18$</li><li>$36=2\cdot18$，余数 0，所以 $(252,198)=18$。</li></ol><p>倒代：$18=54-36=54-(198-3\cdot54)=4\cdot54-198=4(252-198)-198=4\cdot252-5\cdot198$。</p><p><b>推论：</b>$ax+by=c$ 有整数解 ⇔ $(a,b)\mid c$。（必要：左边总被 $(a,b)$ 整除；充分：把 Bezout 等式乘以 $c/(a,b)$。）例：$18x+30y=7$ 无解，因为 $(18,30)=6\nmid7$。</p>`},
{"id":R`n2-s2`,
"h":R`2. 同余中不能随便约分，逆元存在恰好需要互素`,
"html":R`<p><b>这节解决什么：</b>解 $ax\equiv b\pmod m$。关键：同余式两边<b>不能随便约分</b>。</p><p><b>约分规则（讲义命题 3.2.2）：</b>由 $ab\equiv ac\pmod m$ 只能推出 $b\equiv c\pmod{m/(a,m)}$，模数要除以 $(a,m)$。只有 $(a,m)=1$ 时模数才不变。例：$2\cdot1\equiv2\cdot4\pmod6$（$2\equiv8$），但 $1\not\equiv4\pmod6$；正确的是 $1\equiv4\pmod3$。</p><p><b>逆元：</b>若 $aa'\equiv1\pmod m$，称 $a'$ 是 $a$ 模 $m$ 的逆元，记 $a^{-1}$。它存在 ⇔ $(a,m)=1$（由 Bezout，$au+mv=1$ 给出 $u$ 就是逆元）。有逆元时，$ax\equiv b$ 两边乘 $a^{-1}$ 得 $x\equiv a^{-1}b$。</p><p><b>一般的一次同余方程：</b>令 $d=(a,m)$。</p><ol><li>若 $d\nmid b$，无解。</li><li>若 $d\mid b$，把 $a,b,m$ 同除以 $d$，得到 $\frac adx\equiv\frac bd\pmod{\frac md}$，此时系数与模数互素，用逆元解出唯一的 $x_0\pmod{m/d}$。</li><li>回到模 $m$：$x\equiv x_0,\ x_0+\frac md,\ \dots,\ x_0+(d-1)\frac md$，共 $d$ 个解。</li></ol><p><b>例：</b>$6x\equiv8\pmod{14}$。$d=2\mid8$，同除得 $3x\equiv4\pmod7$。$3\times5=15\equiv1$，逆元 5，$x\equiv20\equiv6\pmod7$。模 14 的解：$6,13$。不能写 $x\equiv8/6$。</p>`},
{"id":R`n2-s3`,
"h":R`3. Euler：用可逆剩余类的置换证明`,
"html":R`<p><b>这节解决什么：</b>算 $a^k\bmod m$（$k$ 很大）时，把指数变小。</p><p><b>Euler 函数：</b>$\varphi(m)$ = $1,\dots,m$ 中与 $m$ 互素的数的个数。由容斥，$\varphi(m)=m\prod_{p\mid m}(1-\frac1p)$（$p$ 取遍 $m$ 的不同素因子）。例：$\varphi(40)=40\cdot\frac12\cdot\frac45=16$。</p><p><b>Euler 定理（讲义定理 3.2.8）：</b>若 $(a,m)=1$，则 $a^{\varphi(m)}\equiv1\pmod m$。</p><p><b>证明思路：</b></p><ol><li>设与 $m$ 互素的剩余类为 $r_1,\dots,r_{\varphi(m)}$。</li><li>$(a,m)=1$ 时，$ar_1,\dots,ar_{\varphi(m)}$ 仍与 $m$ 互素且两两不同余（可乘 $a^{-1}$ 还原），所以只是原来那些类换了顺序。</li><li>全部相乘：$a^{\varphi(m)}\prod r_i\equiv\prod r_i$。$\prod r_i$ 与 $m$ 互素，可以约去，得 $a^{\varphi(m)}\equiv1$。</li></ol><p><b>特例 Fermat 小定理：</b>$p$ 素数、$p\nmid a$ 时 $a^{p-1}\equiv1\pmod p$；另一种写法 $a^p\equiv a\pmod p$ 对所有整数 $a$ 成立（$p\mid a$ 时两边都是 0）。</p><p><b>用法：</b>$(a,m)=1$ 时 $a^k\equiv a^{k\bmod\varphi(m)}$。例：$3^{100}\bmod 10$：$\varphi(10)=4$，$100\equiv0\pmod4$，所以 $3^{100}\equiv1$。</p><p><b>一定先检查互素：</b>$2^{\varphi(8)}=2^4=16\equiv0\not\equiv1\pmod8$。大指数也可用“反复平方”：依次算 $a^2,a^4,a^8,\dots$，每步取模。下方工具可用直接枚举核对一次同余方程的解。</p>`}],
"widget":R`euclidPlay`,
"concepts":[{"id":R`n2-c1`,
"sec":R`n2-s1`,
"q":R`方程 $18x+30y=7$ 的整数解情况是：`,
"opts":[R`有唯一解`,
R`有无穷多解`,
R`无解`,
R`只由 x 的奇偶性决定`],
"a":2,
"ex":R`选“无解”。$(18,30)=6$，左边 $18x+30y$ 对任何整数 $x,y$ 都是 6 的倍数，而 7 不是 6 的倍数，所以无解。易错选“有无穷多解”：只有当 $(a,b)\mid c$ 时才有解（那时确实有无穷多个）。`},
{"id":R`n2-c2`,
"sec":R`n2-s2`,
"q":R`由 $6x\equiv6y\pmod{15}$ 一定能推出：`,
"opts":[R`$x\equiv y\pmod{15}$`,
R`$x\equiv y\pmod5$`,
R`$x=y$`,
R`$x\equiv y\pmod3$`],
"a":1,
"ex":R`选 $x\equiv y\pmod5$。$15\mid6(x-y)$，而 $(6,15)=3$，约去 3 得 $5\mid2(x-y)$，又 $(2,5)=1$，所以 $5\mid x-y$。正确模数是 $15/(6,15)=5$。易错选“$x\equiv y\pmod{15}$”：直接约掉 6 是错的，反例 $x=5,y=0$：$30\equiv0\pmod{15}$ 但 $5\not\equiv0\pmod{15}$。`},
{"id":R`n2-c3`,
"sec":R`n2-s2`,
"q":R`$6x\equiv8\pmod{14}$ 在模 14 下有几个解？`,
"opts":[R`$0$`,
R`$1$`,
R`$2$`,
R`$7$`],
"a":2,
"ex":R`选 2。$(6,14)=2$ 整除 8，所以有解，且恰有 $d=2$ 个模 14 的解。同除以 2 得 $3x\equiv4\pmod7$，$x\equiv6\pmod7$，回到模 14 是 $x\equiv6,13$。易错选 1：忘了模 7 的一个解在模 14 下分裂成 2 个。`},
{"id":R`n2-c4`,
"sec":R`n2-s3`,
"q":R`使用 $a^{\varphi(m)}\equiv1\pmod m$ 必须检查：`,
"opts":[R`$a\gt m$`,
R`$m$ 必为素数`,
R`$(a,m)=1$`,
R`$a$ 必为奇数`],
"a":2,
"ex":R`选 $(a,m)=1$。Euler 定理的证明要用 $a$ 有逆元（乘 $a$ 是对既约剩余类的重排）。$m$ 可以是合数，$a$ 也可以是偶数（如 $2^{\varphi(9)}=2^6=64\equiv1\pmod9$）。易错选“$m$ 必为素数”：那是 Fermat 小定理的情形，Euler 定理是它的推广。反例提醒：$(2,8)\ne1$，$2^4\equiv0\pmod8$。`}],
"methods":[{"id":R`m-nt-gcd`,
"title":R`整除方程：gcd 与 Bezout`,
"steps":[R`用辗转相除求 $d=(a,b)$，把每一步等式 $a=qb+r$ 都写下来，留着回代。`,R`判断 $ax+by=c$：先看 $d\mid c$ 是否成立；不成立直接写“无解”。`,R`从倒数第二个等式开始，逐步把余数用前面的数替换，得到 $au+bv=d$。`,R`两边乘 $c/d$ 得到一组解，并代回验算。`]},
{"id":R`m-nt-congruence`,
"title":R`同余：先 gcd，后逆元，最后还原模数`,
"steps":[R`解 $ax\equiv b\pmod m$：先求 $d=(a,m)$；若 $d\nmid b$，写“无解”。`,R`若 $d\mid b$：$a,b,m$ 一起除以 $d$，在模 $m/d$ 下求 $a/d$ 的逆元（试乘或 Bezout），得 $x_0$。`,R`回到模 $m$：解为 $x_0+k\cdot\frac md$，$k=0,1,\dots,d-1$，共 $d$ 个；代回验算。`,R`算大幂 $a^k\bmod m$：先确认 $(a,m)=1$，再把 $k$ 对 $\varphi(m)$（或已发现的更小周期）取余，用反复平方算。易错：不互素时不能用 Euler 定理缩指数。`]}],
"problems":[{"id":R`n2-p1`,
"lv":R`基础`,
"src":R`自编：讲义 3.1.4、3.1.6`,
"stmt":R`求 $(252,198)$ 并表示成 $252u+198v$。据此给出 $252x+198y=90$ 的一组整数解。`,
"hints":[R`辗转相除：$252=198+54$，$198=3\cdot54+36$，$54=36+18$，$36=2\cdot18$。余数依次 54、36、18、0。`,
R`倒代：$18=54-36$，再把 $36=198-3\cdot54$ 代入，得 $18=4\cdot54-198$。`,
R`再把 $54=252-198$ 代入，得 $18=4\cdot252-5\cdot198$；两边乘 5 得到 90。`],
"method":R`m-nt-gcd`,
"sol":R`<p><b>第 1 步：辗转相除。</b></p><ul><li>$252=1\cdot198+54$</li><li>$198=3\cdot54+36$</li><li>$54=1\cdot36+18$</li><li>$36=2\cdot18+0$</li></ul><p>最后一个非零余数是 18，所以 $(252,198)=18$。</p><p><b>第 2 步：倒代。</b>$$18=54-36=54-(198-3\cdot54)=4\cdot54-198=4(252-198)-198=4\cdot252-5\cdot198.$$ 检验：$1008-990=18$。✓</p><p><b>第 3 步：解 $252x+198y=90$。</b>$90=5\times18$，$18\mid90$，有解。把上式乘 5：$90=20\cdot252-25\cdot198$。所以一组解 $(x,y)=(20,-25)$。</p><p><b>验算：</b>$252\times20-198\times25=5040-4950=90$。✓</p><p><b>答：$(252,198)=18=4\cdot252-5\cdot198$；一组解 $(x,y)=(20,-25)$。</b></p>`},
{"id":R`n2-p2`,
"lv":R`基础`,
"src":R`自编：讲义 3.2.2–3.2.8`,
"stmt":R`<p>(1) 求 $6x\equiv8\pmod{14}$ 的全部模 14 解。</p><p>(2) 求 $7^{2026}$ 除以 40 的余数。</p>`,
"hints":[R`(1) $(6,14)=2$，$2\mid8$，有解。把 $6,8,14$ 同时除以 2，得 $3x\equiv4\pmod7$。`,
R`(1) $3\times5=15\equiv1\pmod7$，逆元是 5，$x\equiv5\times4=20\equiv6\pmod7$；回到模 14 有 2 个解。(2) $(7,40)=1$，可用 Euler。`,
R`(2) 先试小周期：$7^2=49\equiv9$，$7^4\equiv9^2=81\equiv1\pmod{40}$；$2026=4\times506+2$。`],
"method":R`m-nt-congruence`,
"sol":R`<p><b>(1)</b></p><ol><li>$d=(6,14)=2$，$2\mid8$，有解，且模 14 下恰有 2 个解。</li><li>同除以 2：$3x\equiv4\pmod7$。</li><li>$3\times5=15\equiv1\pmod7$，所以 $3^{-1}\equiv5$。两边乘 5：$x\equiv20\equiv6\pmod7$。</li><li>回到模 14：$x\equiv6$ 或 $x\equiv6+7=13\pmod{14}$。</li></ol><p>验算：$6\times6=36=2\times14+8$ ✓；$6\times13=78=5\times14+8$ ✓。<b>答：$x\equiv6,13\pmod{14}$。</b></p><p><b>(2)</b></p><ol><li>$(7,40)=1$，$\varphi(40)=40\cdot\frac12\cdot\frac45=16$，由 Euler 定理 $7^{16}\equiv1$。</li><li>其实周期更短：$7^2=49\equiv9\pmod{40}$，$7^4\equiv9^2=81\equiv1\pmod{40}$。（$\operatorname{ord}_{40}(7)=4$，它整除 16，与 Euler 定理一致。）</li><li>$2026=4\times506+2$，所以 $7^{2026}=(7^4)^{506}\cdot7^2\equiv1\cdot9=9\pmod{40}$。</li></ol><p>（用 $\varphi(40)=16$ 也可以：$2026\equiv10\pmod{16}$，$7^{10}=(7^4)^2\cdot7^2\equiv9$，结果相同。）</p><p><b>答：余数为 9。</b></p>`}],
"variants":[{"id":R`n2-v1`,
"lv":R`变种`,
"src":R`讲义作业 6.4.1`,
"stmt":R`设正整数 $a,b,c$ 满足 $a\mid bc$ 且 $(a,b)=1$。证明 $a\mid c$。若删掉互素条件，结论是否仍成立？`,
"hints":[R`$(a,b)=1$，由 Bezout 存在整数 $u,v$ 使 $au+bv=1$。`,
R`两边乘 $c$：$c=acu+bcv$。`,
R`$a\mid acu$ 显然；$a\mid bc$ 是已知，所以 $a\mid bcv$。两项之和也被 $a$ 整除。反例考虑 $a=b=2$，$c=1$。`],
"method":R`m-nt-gcd`,
"sol":R`<p><b>要证：</b>$a\mid bc$，$(a,b)=1$ ⇒ $a\mid c$。</p><p><b>第 1 步：</b>由 Bezout，存在整数 $u,v$ 使 $au+bv=1$。</p><p><b>第 2 步：</b>两边乘 $c$：$c=acu+bcv$。</p><p><b>第 3 步：</b>$a\mid acu$（含因子 $a$）；$a\mid bc$（已知），所以 $a\mid bcv$。两个都被 $a$ 整除的数之和仍被 $a$ 整除，故 $a\mid c$。<b>证毕。</b></p><p><b>删去互素条件不成立：</b>取 $a=b=2$，$c=1$，$2\mid2\cdot1$，但 $2\nmid1$。</p><p>这也解释了同余约分为什么要互素：$ab\equiv ac\pmod m$ 即 $m\mid a(b-c)$，只有 $(a,m)=1$ 时才能推出 $m\mid b-c$。</p>`}],
"extensions":[{"id":R`n2-e1`,
"lv":R`延伸`,
"src":R`讲义作业 6.4.4（特化 n=100）`,
"stmt":R`证明素数 $p$ 在 $n!$ 中的指数为 $v_p(n!)=\sum_{j\ge1}\lfloor n/p^j\rfloor$，并求 $100!$ 末尾连续 0 的个数。`,
"hints":[R`$v_p(k)$ 表示 $k$ 的分解中 $p$ 的指数。写成 $v_p(k)=\sum_{j\ge1}\mathbf 1_{\{p^j\mid k\}}$（$p,p^2,\dots$ 中有几个整除 $k$）。例：$v_2(12)=2$，因为 $2\mid12$、$4\mid12$、$8\nmid12$。`,
R`$v_p(n!)=\sum_{k=1}^nv_p(k)$，交换求和次序：$\sum_{j\ge1}\#\{1\le k\le n:p^j\mid k\}=\sum_{j\ge1}\lfloor n/p^j\rfloor$。`,
R`末尾的 0 的个数 = $10=2\times5$ 的个数 = $\min(v_2,v_5)$。$v_5(100!)=\lfloor100/5\rfloor+\lfloor100/25\rfloor=20+4$。`],
"method":R`m-nt-gcd`,
"sol":R`<p><b>第 1 步：拆指数。</b>记 $v_p(k)$ 为 $k$ 中素数 $p$ 的指数。$p^j\mid k$ 恰对 $j=1,\dots,v_p(k)$ 成立，所以 $$v_p(k)=\sum_{j\ge1}\mathbf 1_{\{p^j\mid k\}}.$$</p><p><b>第 2 步：求和并交换次序。</b>$n!=1\cdot2\cdots n$，所以 $$v_p(n!)=\sum_{k=1}^nv_p(k)=\sum_{k=1}^n\sum_{j\ge1}\mathbf 1_{\{p^j\mid k\}}=\sum_{j\ge1}\#\{1\le k\le n:\ p^j\mid k\}=\sum_{j\ge1}\Bigl\lfloor\frac n{p^j}\Bigr\rfloor.$$ （$1\sim n$ 中 $p^j$ 的倍数有 $\lfloor n/p^j\rfloor$ 个。$p^j\gt n$ 后各项都是 0，实际是有限和，交换次序没问题。）</p><p><b>第 3 步：$100!$ 的末尾 0。</b>每个末尾 0 对应一个因子 $10=2\times5$，个数为 $\min(v_2(100!),v_5(100!))$。</p><ul><li>$v_5(100!)=\lfloor100/5\rfloor+\lfloor100/25\rfloor+\lfloor100/125\rfloor=20+4+0=24$。</li><li>$v_2(100!)=50+25+12+6+3+1=97$。</li></ul><p><b>答：公式得证；$100!$ 末尾有 24 个 0。</b></p>`}]},
h2: {"unit":R`mst`,
"n":3,
"title":R`完美匹配：交错圈、换边与唯一性`,
"goal":R`对应 2022 秋期末第 7 题。核心想法：要找“第二个完美匹配”，就去找一个“匹配边和非匹配边轮流出现的圈”（交错圈），沿圈把两类边对调；再用“删掉被迫配对的一对点”做归纳，得到唯一完美匹配时边数的上限。主线：概念题、六圈例题、两问真题。`,
"sections":[{"id":R`h2-s1`,
"h":R`1. 交错圈：沿圈翻转，得到第二个完美匹配`,
"html":R`<p><b>这节解决什么</b>：已经有一个完美匹配 $M$，怎样判断还有没有别的完美匹配？答案：看有没有“交错圈”。</p>
<p><b>回顾</b>：<b>完美匹配</b>是一组边，使每个顶点恰好是其中一条边的端点。下面 $M$ 是固定的一个完美匹配，$M$ 中的边叫<b>匹配边</b>，不在 $M$ 中的边叫<b>非匹配边</b>。</p>
<p><b>$M$-交错圈</b>：一个简单圈 $C$，沿着它走，匹配边和非匹配边轮流出现。因为两类边轮流，圈长一定是偶数。</p>
<p><b>翻转</b>：把 $C$ 上的匹配边全部去掉，把 $C$ 上的非匹配边全部加进来，得到 $$M^{\ast}=M\triangle E(C).$$ 这里 $\triangle$ 是<b>对称差</b>：$X\triangle Y$ 表示恰好属于 $X,Y$ 之一的元素（属于两者的、两者都不属于的都去掉）。</p>
<p><b>为什么 $M^{\ast}$ 还是完美匹配</b>：圈外的顶点，匹配边不变；圈上每个顶点原来恰连一条匹配边（在圈上）和一条非匹配圈边，翻转后旧的去掉、新的加入，仍恰好一条。而 $M^{\ast}\ne M$，所以得到了第二个完美匹配。</p>
<p>小例子：正方形 $a_1b_1a_2b_2$（边 $a_1b_1,b_1a_2,a_2b_2,b_2a_1$），$M=\{a_1b_1,a_2b_2\}$。整个正方形就是交错圈，翻转得 $M^{\ast}=\{b_1a_2,b_2a_1\}$。</p>
<p><b>反过来</b>：若 $M,M^{\ast}$ 是两个不同的完美匹配，看 $M\triangle M^{\ast}$：每个顶点在 $M$ 中一条边、在 $M^{\ast}$ 中一条边，若这两条相同就都不在对称差里（度 0），若不同就度 2。度都是 0 或 2 的图由若干互不相交的圈组成，每个圈上 $M$ 的边和 $M^{\ast}$ 的边轮流出现，所以是 $M$-交错圈。</p>
<p><b>结论：$M$ 是唯一的完美匹配 ⇔ 不存在 $M$-交错圈。</b></p>`},
{"id":R`h2-s2`,
"h":R`2. 期末 7(1)：把匹配对缩成一个点，再找有向圈`,
"html":R`<p><b>这节解决什么</b>：证明“每点度至少 2 ⇒ 存在 $M$-交错圈”。难点是普通的圈不一定交错，要设计一个辅助图，让“圈”自动交错。</p>
<p><b>编号</b>：二部图两侧 $A=\{a_1,\ldots,a_n\}$、$B=\{b_1,\ldots,b_n\}$，重新编号使 $M=\{a_1b_1,a_2b_2,\dots,a_nb_n\}$（$a_i$ 和 $b_i$ 是一对）。</p>
<p><b>辅助有向图</b> $D$：顶点是下标 $1,\dots,n$（每个下标代表一对 $a_ib_i$）。若非匹配边 $b_ia_j$ 存在（$i\ne j$），就画一条有向边 $i\to j$。含义：“从第 $i$ 对的 $b_i$ 出发，可以走一条非匹配边到第 $j$ 对的 $a_j$，再沿匹配边到 $b_j$”。</p>
<p><b>步骤</b>：</p>
<ol>
<li>每个 $b_i$ 度 $\ge2$，除了匹配邻点 $a_i$ 外还有另一个邻点 $a_j$（$j\ne i$），所以 $D$ 中每个点至少有一条出边。</li>
<li>从任一点出发，一直沿出边走：$i_1\to i_2\to i_3\to\cdots$。只有 $n$ 个点，一定会走到之前到过的点。取第一次重复，截出一个有向简单圈 $i_1\to i_2\to\cdots\to i_k\to i_1$（$k\ge2$）。</li>
<li>把它展开回原图：$$a_{i_1}\,b_{i_1}\,a_{i_2}\,b_{i_2}\cdots a_{i_k}\,b_{i_k}\,a_{i_1}.$$ 其中 $a_{i_t}b_{i_t}$ 是匹配边，$b_{i_t}a_{i_{t+1}}$ 是非匹配边，轮流出现；下标 $i_1,\dots,i_k$ 互不相同，所以顶点互不相同，是简单圈。</li>
</ol>
<p>例：上面的正方形中 $b_1a_2$、$b_2a_1$ 都是非匹配边，$D$ 中有 $1\to2\to1$，展开得 $a_1b_1a_2b_2a_1$。</p>
<p><b>易错</b>：不能只说“最小度 $\ge2$ 所以有圈”。图中有圈，但普通的圈可能连续用两条非匹配边，不一定相对 $M$ 交错。</p>`},
{"id":R`h2-s3`,
"h":R`3. 期末 7(2)：有度 1 的点就删掉这一对，否则翻转交错圈`,
"html":R`<p><b>这节解决什么</b>：证明“边数 $E\gt\frac{n(n+1)}2$ ⇒ 完美匹配不唯一”。思路是对 $n$ 归纳，分两种情况。</p>
<p>有完美匹配，所以每个顶点至少连一条边，度 $\ge1$。</p>
<ul>
<li><b>情况 1：没有度 1 的点</b>（每点度 $\ge2$）：由上一节找到交错圈，翻转得第二个完美匹配。</li>
<li><b>情况 2：有度 1 的点 $v$</b>：$v$ 唯一的边必须是匹配边（$v$ 要被匹配），设它在 $M$ 中的伙伴是 $w$。这一对是“被迫”配的。删掉 $v,w$ 以及和它们相连的所有边。</li>
</ul>
<p><b>情况 2 删了多少边</b>：$d(v)=1$；$w$ 在另一侧，那一侧只有 $n$ 个点，所以 $d(w)\le n$；边 $vw$ 被数了两次要减 1。共删 $d(v)+d(w)-1\le1+n-1=n$ 条边。剩下的图两侧各 $n-1$ 个点，仍有完美匹配 $M\setminus\{vw\}$，边数</p>
$$E'\ge E-n\gt\frac{n(n+1)}2-n=\frac{(n-1)n}2.$$
<p>这正是规模 $n-1$ 时的条件，由归纳假设，剩下的图有另一个完美匹配，加回 $vw$ 就得到原图中与 $M$ 不同的完美匹配。</p>
<p>数值例：$n=3$ 时阈值 $\frac{3\times4}2=6$，所以两侧各 3 点、有完美匹配、边数 $\ge7$ 的二部图一定有两个以上完美匹配。</p>
<p>换句话说：<b>完美匹配唯一的二部图至多有 $n(n+1)/2$ 条边</b>；这个界能取到，见变种 h2-v1。</p>`}],

"sol":R`<p><b>分类</b>：匹配边 $a_1b_1,a_2b_2,a_3b_3$；非匹配边 $a_2b_1,a_3b_2,a_1b_3$。</p>

{"id":R`h2-p2`,
"lv":R`真题`,
"src":R`2022 秋期末 7(1)(2)（艾颖华试卷）`,
"stmt":R`<p>设 $G=A\cup B$ 为有限简单二部图，$|A|=|B|=n$，$M$ 是它的一个完美匹配。</p><p>(1) 若每点度至少 2，证明有简单圈 $C$，其边在 $M$ 与 $M$ 补集中交替出现。</p><p>(2) 若边数 $E\gt n(n+1)/2$，证明有另一个不同于 $M$ 的完美匹配。原题提示：对 n 归纳，一种情形用 (1)。</p>`,
"hints":[R`(1) 重编号使 $M=\{a_ib_i\}$。造有向图：非匹配边 $b_ia_j$ 对应有向边 $i\to j$。每个 $b_i$ 度 $\ge2$，所以每个点至少一条出边，沿出边走必然回到走过的点。`,
R`(2) 对 $n$ 归纳，分两种情况：每点度 $\ge2$ 时，沿 (1) 的交错圈翻转；否则存在度为 1 的点 $v$，它的唯一邻点 $w$ 就是它的匹配伙伴。`,
R`删去 $v,w$：至多删 $d(v)+d(w)-1\le n$ 条边，剩余 $E'\gt\frac{n(n+1)}2-n=\frac{(n-1)n}2$，剩余图仍有完美匹配 $M\setminus\{vw\}$，用归纳假设，再加回 $vw$。`],
"method":R`m-match-induct`,
"sol":R`<p><b>(1)</b> 重新编号使 $A=\{a_1,\dots,a_n\}$，$B=\{b_1,\dots,b_n\}$，$M=\{a_ib_i:1\le i\le n\}$。</p>
<p>构造有向图 $D$：顶点集 $\{1,\dots,n\}$，当且仅当 $b_ia_j\in E\setminus M$（$i\ne j$）时有有向边 $i\to j$。</p>
<p>每个 $b_i$ 度 $\ge2$，除匹配邻点 $a_i$ 外还有邻点 $a_j$（$j\ne i$），所以 $D$ 中每点出度 $\ge1$。从任一点出发沿出边一直走，$D$ 只有 $n$ 个点，必会重复；取第一次重复的点，截出有向简单圈 $i_1\to i_2\to\cdots\to i_k\to i_1$（$k\ge2$）。</p>
<p>令 $C=a_{i_1}b_{i_1}a_{i_2}b_{i_2}\cdots a_{i_k}b_{i_k}a_{i_1}$。其中 $a_{i_t}b_{i_t}\in M$，$b_{i_t}a_{i_{t+1}}\in E\setminus M$（下标 $i_{k+1}=i_1$），两类边交替；$i_1,\dots,i_k$ 互不相同，所以 $C$ 的顶点互不相同。<b>$C$ 即所求的交错简单圈。</b></p>
<p><b>(2)</b> 对 $n$ 归纳。</p>
<p><b>$n=1$</b>：$\frac{n(n+1)}2=1$，而两侧各 1 点的简单图至多 1 条边，前提 $E\gt1$ 不可能成立，命题自动成立。</p>
<p><b>$n\ge2$</b>：设命题对 $n-1$ 成立。$M$ 是完美匹配，所以每点度 $\ge1$。</p>
<ul>
<li><b>情况 1：每点度 $\ge2$</b>。由 (1) 有 $M$-交错圈 $C$，令 $M^{\ast}=M\triangle E(C)$。圈上每点仍恰有一条 $M^{\ast}$ 边，圈外不变，所以 $M^{\ast}$ 是完美匹配且 $M^{\ast}\ne M$。</li>
<li><b>情况 2：存在度 1 的点 $v$</b>。$v$ 必须被 $M$ 匹配，所以它唯一的边 $vw\in M$。删去 $v,w$ 及相连的边得到 $G'$，两侧各 $n-1$ 点，$M'=M\setminus\{vw\}$ 是 $G'$ 的完美匹配。删去的边数为 $d(v)+d(w)-1\le1+n-1=n$（$w$ 的邻点都在另一侧，至多 $n$ 个）。所以 $$E(G')\ge E-n\gt\frac{n(n+1)}2-n=\frac{(n-1)n}2.$$ 由归纳假设，$G'$ 有完美匹配 $M''\ne M'$。则 $M''\cup\{vw\}$ 是 $G$ 的完美匹配，且与 $M=M'\cup\{vw\}$ 不同。</li>
</ul>
<p><b>所以 $G$ 有不同于 $M$ 的完美匹配。</b></p>
<p>注：条件中的严格不等号不能改成 $\ge$：边数恰好等于 $n(n+1)/2$ 时可能只有唯一的完美匹配，见变种。</p>`}],
"variants":[{"id":R`h2-v1`,
"lv":R`变种`,
"src":R`自编：真题 7(2) 阈值取等构造`,
"stmt":R`在 $A=\{a_1,\ldots,a_n\}$、$B=\{b_1,\ldots,b_n\}$ 间，规定 $a_i b_j$ 是边当且仅当 $i\le j$。求边数并证明完美匹配唯一。`,
"hints":[R`按 $a_i$ 数边：$a_i$ 的邻点是 $b_i,b_{i+1},\dots,b_n$，度为 $n-i+1$。求和。`,
R`找被迫的配对：$b_1$ 只与 $a_1$ 相邻（只有 $i\le1$ 的 $a_i$），所以每个完美匹配都必须含 $a_1b_1$。`,
R`删去 $a_1,b_1$ 后，剩下的图是同样规则、规模 $n-1$ 的图；对 $n$ 归纳，完美匹配只能是 $\{a_1b_1,\dots,a_nb_n\}$。`],
"method":R`m-match-induct`,
"sol":R`<p><b>边数</b>：$a_i$ 的邻点为 $b_i,\dots,b_n$，度为 $n-i+1$。所以 $$E=\sum_{i=1}^n(n-i+1)=n+(n-1)+\cdots+1=\frac{n(n+1)}2.$$</p>
<p><b>唯一性</b>（对 $n$ 归纳）：$n=1$ 时只有一条边，显然。设 $n\ge2$。$b_1$ 的邻点只有满足 $i\le1$ 的 $a_i$，即只有 $a_1$，所以任何完美匹配中 $b_1$ 都只能配 $a_1$，必含边 $a_1b_1$。删去 $a_1,b_1$ 后，剩下 $a_2,\dots,a_n$ 与 $b_2,\dots,b_n$ 之间的边仍按“$i\le j$ 才有边”的规则，是规模 $n-1$ 的同类图，由归纳假设其完美匹配唯一，为 $\{a_2b_2,\dots,a_nb_n\}$。</p>
<p><b>所以完美匹配唯一，为 $\{a_ib_i:1\le i\le n\}$，边数为 $\frac{n(n+1)}2$。</b></p>
<p>这说明真题的阈值是紧的：边数等于 $\frac{n(n+1)}2$ 时仍可能唯一，超过才一定不唯一。例：$n=3$ 时边为 $a_1b_1,a_1b_2,a_1b_3,a_2b_2,a_2b_3,a_3b_3$，共 6 条。</p>`}],
"extensions":[{"id":R`h2-e1`,
"lv":R`延伸`,
"src":R`自编：唯一性与无环有向图`,
"stmt":R`对给定完美匹配 $M=\{a_ib_i\}$，仍把非匹配边 $b_i a_j$ 压缩为有向边 $i\to j$。证明 M 唯一当且仅当压缩有向图无有向圈，并据此给出边数上界的另一证明。`,
"hints":[R`有向圈 ⇔ 交错圈：有向圈按 (1) 的方式展开成交错圈；反过来，交错圈上依次读出各匹配对的下标，就得到有向圈。再用“$M$ 唯一 ⇔ 无交错圈”。`,
R`无有向圈的有向图（无环有向图）一定有入度为 0 的点；反复删掉入度 0 的点，得到一个顺序，使所有有向边都从前指向后（拓扑顺序）。`,
R`每个无序下标对 $\{i,j\}$ 至多一条“向前”的有向边，所以非匹配边至多 $\binom n2$ 条，再加 $n$ 条匹配边：总数 $\le\binom n2+n=\frac{n(n+1)}2$。`],
"method":R`m-match-flip`,
"sol":R`<p><b>第 1 步：有向圈 ⇔ 交错圈</b>。若 $D$ 有有向简单圈 $i_1\to\cdots\to i_k\to i_1$，展开为 $a_{i_1}b_{i_1}\cdots a_{i_k}b_{i_k}a_{i_1}$，是 $M$-交错圈（同真题 (1)）。反过来，设 $C$ 是 $M$-交错圈，沿 $C$ 从某个 $a_{i_1}$ 先走匹配边到 $b_{i_1}$，再走非匹配边到某个 $a_{i_2}$，再走匹配边到 $b_{i_2}$……，依次读出的下标给出 $D$ 中的有向圈 $i_1\to i_2\to\cdots\to i_1$。</p>
<p>由第 1 节，$M$ 唯一 ⇔ 无 $M$-交错圈 ⇔ <b>$D$ 无有向圈</b>。</p>
<p><b>第 2 步：无环有向图有拓扑顺序</b>。有限无环有向图一定有入度 0 的点：否则从任一点出发不断逆着入边往回走，有限步内必重复，得到有向圈，矛盾。取一个入度 0 的点排在第一个，删掉它后剩下的仍无环，再取入度 0 的点排第二……得到顺序 $\pi_1,\dots,\pi_n$，所有有向边都从排在前的点指向排在后的点。</p>
<p><b>第 3 步：数边</b>。$G$ 是简单图，对每个有序对 $(i,j)$ 至多一条边 $b_ia_j$，即至多一条 $i\to j$。在拓扑顺序下只有“从前指向后”的边，每个无序对 $\{i,j\}$ 至多贡献一条，所以非匹配边至多 $\binom n2$ 条。加上 $n$ 条匹配边：$$E\le\binom n2+n=\frac{n(n-1)}2+n=\frac{n(n+1)}2.$$</p>
<p><b>所以完美匹配唯一 ⇒ $E\le\frac{n(n+1)}2$</b>，与真题 (2) 等价（逆否）。变种中的上三角构造对应拓扑顺序 $1,2,\dots,n$ 下所有“向前”的边都取到，所以取等。</p>`}]},
g4: {"unit":R`graph`,
"n":4,
"title":R`运输表消圈：保持行列和，减少正项`,
"goal":R`对应 11 月 17 日下午课堂记录第 17–18 页：把运输表画成二部图，沿偶圈交替加减运量，在不改变行和、列和的前提下减少运输路线。要会证明“至多需要 $s+t-1$ 条路线”，并分清“一定能做到的上界”和“真正的最少条数”。30 分钟建议：先做概念题、算例和证明题。`,
"sections":[{"id":R`g4-s1`,
"h":R`1. 从运输表到二部图：正项就是运输路线`,
"html":R`<p><b>这节解决什么：</b>有 $s$ 个仓库给 $t$ 个商店送货，每个仓库发出的总量、每个商店收到的总量都已定。问：能不能只用少数几条“仓库→商店”路线完成？课堂结论是：总能做到不超过 $s+t-1$ 条。</p><p><b>运输表：</b>非负矩阵 $A=(a_{ij})$，$a_{ij}$ 是仓库 $R_i$ 运给商店 $C_j$ 的量。第 $i$ 行之和 = $R_i$ 的发货总量（<b>行和</b>），第 $j$ 列之和 = $C_j$ 的收货总量（<b>列和</b>）。调整时行和、列和都不许变，所有数也不能变负。$a_{ij}\gt0$ 的格子叫<b>正项</b>，一个正项就是一条实际使用的路线。</p><p><b>画成二部图：</b>左边放 $s$ 个行点 $R_1,\dots,R_s$，右边放 $t$ 个列点 $C_1,\dots,C_t$；$a_{ij}\gt0$ 时连边 $R_iC_j$。这张图叫<b>支撑图</b>，它的边数 $E$ = 正项个数，顶点数 = $s+t$。</p><p><b>例：</b>$A=\begin{pmatrix}4&1\\2&3\end{pmatrix}$，4 个格子都是正的，支撑图是 $R_1C_1,R_1C_2,R_2C_1,R_2C_2$ 四条边，组成一个圈 $R_1C_1R_2C_2R_1$。</p><p><b>两个图论事实：</b></p><ol><li>若边数 $\ge$ 顶点数，即 $E\ge s+t$，图中一定有圈（无圈的图是森林，边数 = 顶点数 − 连通分支数 $\lt$ 顶点数）。</li><li>二部图中的圈长度一定是偶数（圈上行点、列点交替出现），所以可以沿圈交替标 $+$、$-$。</li></ol><p><b>注意：</b>$s+t-1$ 是“一定能做到”的上界。课堂说“尽量少”，但任意顺序消圈不一定得到真正最少的路线数，延伸题有反例。</p>`},
{"id":R`g4-s2`,
"h":R`2. 取 ε 为减号边最小运量，至少消去一条路线`,
"html":R`<p><b>这节解决什么：</b>具体怎么在一个圈上调整，才能保证行列和不变、不出负数、并且至少去掉一条路线。</p><p><b>操作步骤：</b></p><ol><li>在支撑图中找一个圈，沿圈交替给边标 $+$、$-$。</li><li>取 $\varepsilon$ = 所有标 $-$ 的边上运量的最小值。因为圈上的边都是正项，$\varepsilon\gt0$。</li><li>标 $+$ 的格子加 $\varepsilon$，标 $-$ 的格子减 $\varepsilon$，圈外格子不动。</li></ol><p><b>为什么行列和不变：</b>圈每经过一个顶点，都是一条边进、一条边出，而相邻两条边一 $+$ 一 $-$。所以圈上每个行点（每一行）恰好一格 $+\varepsilon$、一格 $-\varepsilon$，行和不变；列同理。</p><p><b>为什么正项严格减少：</b>$-$ 格减去 $\varepsilon$ 后仍 $\ge0$（$\varepsilon$ 是最小值），且取到最小值的那格变成 0；$+$ 格原来就是正的，不会新增正项。所以正项数至少减 1；若有几个 $-$ 格同时等于 $\varepsilon$，会一次减少好几个。</p><p><b>例：</b>$A=\begin{pmatrix}4&1\\2&3\end{pmatrix}$，给 $(1,1),(2,2)$ 标 $+$，$(1,2),(2,1)$ 标 $-$，$\varepsilon=\min\{1,2\}=1$，得 $\begin{pmatrix}5&0\\1&4\end{pmatrix}$：行和仍 $5,5$，列和仍 $6,4$，正项从 4 个变成 3 个。</p><p>下方工具会显示下一圈的正负标记与 $\varepsilon$，点击可消一圈，对照前后行列和。</p><p>易错：正项已经 $\le s+t-1$ 时，图中仍可能有圈（“边多必有圈”反过来不成立）。</p>`},
{"id":R`g4-s3`,
"h":R`3. 有限步终止：最后的支撑是森林`,
"html":R`<p><b>这节解决什么：</b>证明反复消圈一定会停下，并且停下时路线数 $\le s+t-1$。</p><ol><li><b>会停：</b>每次消圈正项数至少减 1，而正项数是非负整数（至多 $st$），所以有限步后一定无法再消，也就是支撑图中没有圈了。</li><li><b>停下时是森林：</b>没有圈的图叫<b>森林</b>（若干棵树）。保留全部 $s+t$ 个顶点（没有边的行点、列点算作单独的分支，称孤立点），设有 $c\ge1$ 个连通分支。森林满足“边数 = 顶点数 − 分支数”： $$E=(s+t)-c\le s+t-1.$$</li></ol><p><b>例：</b>上节得到的 $\begin{pmatrix}5&0\\1&4\end{pmatrix}$ 有 3 条边 $R_1C_1,R_2C_1,R_2C_2$，是一棵树（$c=1$），$E=4-1=3=s+t-1$。</p><p><b>补充说明：</b>只要正项数降到 $s+t-1$ 就已达到课堂要求；继续消到森林能看清结构。这里没有运费，所以不是“最小费用”算法；若每条路线有容量上限，加的 $\varepsilon$ 还要受容量限制，本课不考虑。</p>`}],
"widget":R`transportPlay`,
"concepts":[{"id":R`g4-c1`,
"sec":R`g4-s1`,
"q":R`把 $s\times t$ 非负表画成行列二部图，正项数对应：`,
"opts":[R`顶点数`,
R`边数`,
R`连通分支数`,
R`匹配数`],
"a":1,
"ex":R`选“边数”。每个正项 $a_{ij}\gt0$ 对应一条边 $R_iC_j$，所以正项数 = 边数。易错选“顶点数”：顶点是行点和列点，共 $s+t$ 个，与表中数值无关。`},
{"id":R`g4-c2`,
"sec":R`g4-s2`,
"q":R`ε 应取哪一组数的最小值？`,
"opts":[R`所有格子（包括 0）`,
R`圈上减号边的正运量`,
R`所有行和`,
R`所有加号边的运量`],
"a":1,
"ex":R`选“圈上减号边的正运量”。减号边要减去 $\varepsilon$，为了不出现负数，$\varepsilon$ 不能超过任何一条减号边的运量；取它们的最小值，又能保证至少一条边恰好减到 0。易错选“所有加号边的运量”：加号边是加 $\varepsilon$，不会变负，与 $\varepsilon$ 的上限无关。选“所有格子（包括 0）”会得到 $\varepsilon=0$，等于什么都没做。`},
{"id":R`g4-c3`,
"sec":R`g4-s2`,
"q":R`每次圈调整后，必定成立的是：`,
"opts":[R`每个格子值不变`,
R`行和、列和不变，正项数严格减少`,
R`每条边成本都减少`,
R`总正项数恰好减少 1`],
"a":1,
"ex":R`选“行和、列和不变，正项数严格减少”。每行、每列在圈上恰好一加一减，所以和不变；至少一条减号边归零且不新增正项，所以正项严格减少。易错选“总正项数恰好减少 1”：若有几条减号边的运量同时等于最小值，它们会同时归零，一次减少不止 1（见变种题）。`},
{"id":R`g4-c4`,
"sec":R`g4-s3`,
"q":R`正项数不超过 $s+t-1$ 能否推出支撑图无圈？`,
"opts":[R`能，这是等价条件`,
R`不能，少边图也可能含圈`,
R`只要行列和为正就能`,
R`只要 s=t 就能`],
"a":1,
"ex":R`选“不能，少边图也可能含圈”。“$E\ge s+t$ ⇒ 有圈”只是充分条件，反过来不成立。反例：$s=t=3$，左上 $2\times2$ 四个正项组成一个四圈，再加右下一个正项，共 $E=5=s+t-1$，但有圈。易错选“能，这是等价条件”：森林的边数等于 $s+t-c$，而 $E\le s+t-1$ 的图不一定是森林。`}],
"methods":[{"id":R`m-transport-cycle`,
"title":R`运输表：二部图偶圈增减`,
"steps":[R`画图：行点、列点分两侧，每个正项连一条边；在图里找一个圈（必是偶圈）。`,R`沿圈交替标 $+$、$-$；$\varepsilon$ = 减号格运量的最小值。`,R`加号格加 $\varepsilon$，减号格减 $\varepsilon$，其余不变；写出新表。`,R`核对：每行每列的和与原来相同；没有负数；至少一个减号格变成 0。`,R`重复，直到正项数 $\le s+t-1$（或支撑图无圈，再用 $E=s+t-c$）。易错：正项少不代表无圈；消到森林也不一定是全局最少。`]}],
"problems":[{"id":R`g4-p1`,
"lv":R`基础`,
"src":R`自编：课堂记录第 17–18 页的 2×2 算例`,
"stmt":R`设运输表 $A=\begin{pmatrix}4&1\\2&3\end{pmatrix}$。给 $(1,1),(2,2)$ 标加号，另两格标减号，求 ε 和调整后的表，并核对行列和及正项数。`,
"hints":[R`四个格子都是正项，支撑图就是四圈 $R_1C_1R_2C_2R_1$。题目已给定：$(1,1),(2,2)$ 是加号，$(1,2),(2,1)$ 是减号。`,
R`减号格的运量是 $a_{12}=1$、$a_{21}=2$，所以 $\varepsilon=\min\{1,2\}=1$。`,
R`新表：$a_{11}=4+1$，$a_{12}=1-1$，$a_{21}=2-1$，$a_{22}=3+1$。再算行和（原来 $5,5$）和列和（原来 $6,4$）。`],
"method":R`m-transport-cycle`,
"sol":R`<p><b>第 1 步：求 $\varepsilon$。</b>减号格是 $(1,2)$ 和 $(2,1)$，运量 1 和 2，$\varepsilon=\min\{1,2\}=1$。</p><p><b>第 2 步：调整。</b>$$A^\ast=\begin{pmatrix}4+1&1-1\\2-1&3+1\end{pmatrix}=\begin{pmatrix}5&0\\1&4\end{pmatrix}.$$</p><p><b>第 3 步：核对。</b></p><ul><li>行和：原来 $4+1=5$，$2+3=5$；现在 $5+0=5$，$1+4=5$。不变。</li><li>列和：原来 $4+2=6$，$1+3=4$；现在 $5+1=6$，$0+4=4$。不变。</li><li>所有格子 $\ge0$。</li></ul><p><b>第 4 步：正项数。</b>由 4 个降到 3 个，正好等于 $s+t-1=2+2-1=3$。新支撑图 $R_1C_1,R_2C_1,R_2C_2$ 是一棵树。</p><p><b>答：$\varepsilon=1$，$A^\ast=\begin{pmatrix}5&0\\1&4\end{pmatrix}$，行和 $(5,5)$、列和 $(6,4)$ 不变，正项数 $4\to3$。</b></p><p>补充：若把正负方向反过来（$(1,2),(2,1)$ 加，$(1,1),(2,2)$ 减），$\varepsilon=\min\{4,3\}=3$，得 $\begin{pmatrix}1&4\\5&0\end{pmatrix}$，也合法，只是结果不同。</p>`},
{"id":R`g4-p2`,
"lv":R`课堂命题`,
"src":R`课堂记录_2026-11-17.pdf 第 17–18 页`,
"stmt":R`证明：任意非负 $s\times t$ 实矩阵（$s,t\ge1$），都可调整成行和、列和不变的非负矩阵，其正项至多 $s+t-1$ 个。`,
"hints":[R`把正项看成行列二部图的边：顶点 $s+t$ 个。若正项数 $E\ge s+t$，图中必有圈，且是偶圈。`,
R`沿圈交替标 $+$、$-$，$\varepsilon$ 取减号格的最小值；加减后行列和不变、无负数、正项数至少减 1。`,
R`正项数是非负整数，每步至少减 1，有限步后 $E\le s+t-1$；或者一直做到支撑图无圈（森林），用 $E=(s+t)-c\le s+t-1$。`],
"method":R`m-transport-cycle`,
"sol":R`<p><b>要证：</b>任意非负 $s\times t$ 矩阵 $A$（$s,t\ge1$），都能调整成行和、列和不变的非负矩阵，其正项至多 $s+t-1$ 个。</p><p><b>第 1 步：建图。</b>以 $R_1,\dots,R_s,C_1,\dots,C_t$ 为顶点（共 $s+t$ 个），$a_{ij}\gt0$ 时连边 $R_iC_j$。正项数 = 边数 $E$。</p><p><b>第 2 步：一次调整。</b>设 $E\ge s+t$。边数不少于顶点数的图必有圈（森林的边数 $=$ 顶点数 $-$ 分支数 $\lt$ 顶点数）。二部图的圈是偶圈，沿圈交替标 $+$、$-$，令 $\varepsilon$ 为减号格中的最小值，$\varepsilon\gt0$。加号格加 $\varepsilon$，减号格减 $\varepsilon$。</p><ul><li>行列和不变：圈上每个顶点恰连一条加号边、一条减号边，所以每行、每列一加一减。</li><li>非负：减号格减去的不超过它本身。</li><li>正项严格减少：取到最小值的减号格变成 0；加号格本来就是正的，不新增正项。</li></ul><p><b>第 3 步：有限步终止。</b>只要 $E\ge s+t$ 就可以再做一次，而每次 $E$ 至少减 1，$E$ 是非负整数，所以有限步后得到 $E\le s+t-1$ 的表。它的行列和与 $A$ 相同，且非负。</p><p><b>结论得证。</b></p><p>另一种收尾：一直消到支撑图无圈，此时是有 $c\ge1$ 个分支的森林（孤立的行点、列点也算分支），$E=(s+t)-c\le s+t-1$。全零矩阵一开始 $E=0$，结论直接成立。</p>`}],
"variants":[{"id":R`g4-v1`,
"lv":R`变种`,
"src":R`自编：边数阈值的逆命题`,
"stmt":R`设 $s=t=3$，运输表 $A=\begin{pmatrix}1&1&0\\1&1&0\\0&0&2\end{pmatrix}$。(1) 正项是否已不超过 $s+t-1$？(2) 支撑图是否无圈？(3) 试消一圈，并说明为何正项可一次减少不止 1。`,
"hints":[R`数正项：左上 4 个加右下 1 个，共 5 个；$s+t-1=3+3-1=5$。`,
R`画图：$R_1,R_2,C_1,C_2$ 四点之间的 4 条边组成一个四圈 $R_1C_1R_2C_2R_1$；$R_3C_3$ 是单独一条边。`,
R`在四圈上：$(1,1),(2,2)$ 标加号，$(1,2),(2,1)$ 标减号，$\varepsilon=\min\{1,1\}=1$，两条减号边同时归零。`],
"method":R`m-transport-cycle`,
"sol":R`<p><b>(1)</b> 正项有 $a_{11},a_{12},a_{21},a_{22},a_{33}$ 共 5 个，$s+t-1=5$，已经不超过上界。</p><p><b>(2)</b> 支撑图中 $R_1C_1,C_1R_2,R_2C_2,C_2R_1$ 组成四圈，所以<b>仍有圈</b>，不是森林。这说明“正项 $\le s+t-1$”不能推出“无圈”。</p><p><b>(3)</b> 在四圈上 $(1,1),(2,2)$ 标 $+$，$(1,2),(2,1)$ 标 $-$，$\varepsilon=\min\{1,1\}=1$：</p>$$\begin{pmatrix}1&1&0\\1&1&0\\0&0&2\end{pmatrix}\longrightarrow\begin{pmatrix}2&0&0\\0&2&0\\0&0&2\end{pmatrix}.$$<p>核对：行和都是 $(2,2,2)$，列和都是 $(2,2,2)$，不变。两条减号边的运量都等于最小值 1，所以同时归零，正项数从 5 一次降到 3。</p><p>分支数：原支撑图有 2 个分支（四圈那块、$R_3C_3$），但有圈，所以边数 $5$ 比森林公式给的 $6-2=4$ 多；新支撑图是 3 条互不相连的边，是森林，3 个分支，$E=6-3=3$。✓</p><p><b>答：(1) 是，正项 5 个；(2) 不是森林，有四圈；(3) 一次消圈后正项 $5\to3$，因为两条减号边同时达到最小值。</b></p>`}],
"extensions":[{"id":R`g4-e1`,
"lv":R`延伸`,
"src":R`自编：森林不代表全局最少`,
"stmt":R`<p>(1) 表 $A=\begin{pmatrix}1&2\\2&0\end{pmatrix}$ 的支撑是否为森林？它的正项数是否为同行列和表中的最小值？</p><p>(2) 证明：若限制所有非零项都落在一张指定森林的边上，且给定行列和，那么可行表至多一个。</p>`,
"hints":[R`(1) 画图：$R_1C_1,R_1C_2,R_2C_1$ 三条边连成一条路（树），无圈。行和 $(3,2)$，列和 $(3,2)$。试试对角矩阵 $\begin{pmatrix}3&0\\0&2\end{pmatrix}$。`,
R`(2) 设 $A,B$ 都可行且非零项都在指定森林的边上。令 $D=A-B$，则 $D$ 也只在森林的边上非零，且每行和、每列和都是 0。`,
R`森林中有叶子（度为 1 的顶点）。叶子只连一条边，该行（或列）和为 0 迫使这条边上 $D$ 的值为 0；删掉这条边，对剩下的森林重复。`],
"method":R`m-transport-cycle`,
"sol":R`<p><b>(1)</b> $A=\begin{pmatrix}1&2\\2&0\end{pmatrix}$ 的支撑边 $R_1C_1,R_1C_2,R_2C_1$ 构成路 $C_2R_1C_1R_2$，是一棵树，没有圈，不能再消。行和 $(3,2)$，列和 $(3,2)$。</p><p>但 $B=\begin{pmatrix}3&0\\0&2\end{pmatrix}$ 也非负，行和 $(3,2)$、列和 $(3,2)$ 相同，正项只有 2 个 $\lt3$。所以 $A$ 的支撑虽是森林，正项数却<b>不是</b>最小值。结论：消圈到森林只保证“$\le s+t-1$”这个通用上界，不保证全局最少。</p><p><b>(2) 要证：</b>给定行列和与一张森林 $T$，非零项都在 $T$ 的边上的可行表至多一个。</p><ol><li>设 $A,B$ 都满足条件，令 $D=A-B$。$D$ 只在 $T$ 的边上可能非零，且 $D$ 的每行和、每列和都是 0（$A,B$ 的行列和相同）。</li><li>若 $T$ 还有边，取 $T$ 中一个叶子 $v$（有边的森林一定有度为 1 的顶点），它只连一条边 $e$。$v$ 对应的那一行（或列）中，只有 $e$ 这一格可能非零，而这一行和为 0，所以 $D_e=0$。</li><li>从 $T$ 中删去 $e$，剩下的仍是森林，$D$ 仍只在剩下的边上非零、行列和仍为 0。重复第 2 步。</li><li>有限步后所有边都被删掉，$D$ 的每个格子都是 0，即 $A=B$。</li></ol><p><b>结论得证。</b>注意：唯一性只在“指定这张森林”时成立；换一张森林可能得到另一个可行表，如 (1) 中的 $A$ 与 $B$。</p>`}]},
r1: {"unit":R`practice`,
"n":1,
"title":R`离散混合复盘：选工具与检查条件`,
"goal":R`把前面各章混在一起练：读题后先判断该用哪种工具（计数、数论、Ramsey 与抽屉原理、运输表/匹配），再检查这个工具需要的条件是否满足。新课的 $R(3,3)=6$ 是主线内容；变种和延伸题选做。`,
"sections":[{"id":R`r1-s1`,
"h":R`1. 读题先抓三类信号`,
"html":R`<p><b>这节解决什么：</b>考试题不会告诉你属于哪一章。先看题目问的是什么，再决定工具。</p><ul><li><b>问“有多少个”</b>：先说清数的是什么对象、哪些算同一个；然后试分类相加、容斥、递推。例：错位排列 → 容斥。</li><li><b>问“一定存在”</b>：找抽屉（映射）、看最大/最小的对象（极端原理），或者证明随机选取时概率 $\gt0$。例：六人必有三人互识或互不识 → 抽屉原理。</li><li><b>“保持某些总量不变”</b>：画图，把总量对应到顶点，再找允许的调整（如运输表的偶圈）。</li></ul><p><b>套公式前先核对条件</b>（常见的“条件陷阱”）：</p><ul><li>概率相乘 $P(A\cap B)=P(A)P(B)$ 需要独立；</li><li>Euler 定理缩指数需要底数与模数互素；</li><li>平面图边数界 $e\le3v-6$ 只是必要条件，满足它不代表图可平面；</li><li>匹配题里，一个普通的圈未必是相对给定匹配的交错圈（边交替属于、不属于匹配）。</li></ul>`},
{"id":R`r1-s2`,
"h":R`2. 新课堂小结：六个人与二染色三角形`,
"html":R`<p><b>这节解决什么：</b>课堂记录第 9–10 页的经典题：任意 6 个人中，必有 3 人两两认识，或 3 人两两不认识。这就是 Ramsey 数 $R(3,3)=6$（$R(3,3)$ 是“保证出现同色三角形的最少人数”）。</p><p><b>建模：</b>6 个人是完全图 $K_6$ 的 6 个顶点（$K_n$：$n$ 个点两两连边）。认识的两人之间的边染红，不认识的染蓝。要证：一定有三条边全同色的三角形（<b>单色三角形</b>）。</p><p><b>上界 $R(3,3)\le6$：</b></p><ol><li>任取一点 $A$，它连出 5 条边，只有 2 种颜色，由抽屉原理至少 3 条同色。不妨 $AB,AC,AD$ 都红。</li><li>看 $B,C,D$ 之间的三条边：若有一条红，比如 $BC$，则 $ABC$ 是红三角形。</li><li>若三条都不红，就全是蓝的，$BCD$ 是蓝三角形。</li></ol><p><b>下界 $R(3,3)\ge6$（5 个人不够）：</b>要给出一个反例。把 $K_5$ 的五个点排成五边形，五条边（一个五圈）染红，五条对角线染蓝。红边构成五圈，蓝边也构成一个五圈（五角星），五圈里没有三角形，所以没有单色三角形。</p><p>上下界合起来 $R(3,3)=6$。</p>`},
{"id":R`r1-s3`,
"h":R`3. 收尾：先给保证，再问是否最优`,
"html":R`<p><b>这节解决什么：</b>分清一个结论到底保证了什么。</p><ul><li>最小生成树算法（Kruskal 等）有“总权最小”的证明，输出确实是最优的。</li><li>运输表消圈只保证“正项数 $\le s+t-1$”这个<b>上界</b>，不保证正项数全局最少，也不保证结果唯一。</li></ul><p>读结论时注意这些词的区别：<b>存在</b>（至少有一个）、<b>每个</b>（全部都满足）、<b>某个</b>（其中一个）、<b>唯一</b>（恰好一个）、<b>上界</b>（不超过）与<b>最优</b>（取到最小）。例：“消圈后正项 $\le s+t-1$”不能说成“消圈后正项最少”。</p>`}],
"widget":null,
"concepts":[{"id":R`r1-c1`,
"sec":R`r1-s1`,
"q":R`哪一种计算直接需要互素条件？`,
"opts":[R`期望线性相加`,
R`Euler 定理缩短指数`,
R`握手定理`,
R`平面 Euler 公式`],
"a":1,
"ex":R`选“Euler 定理缩短指数”。$a^{\varphi(m)}\equiv1\pmod m$ 要求 $(a,m)=1$；反例 $2^{\varphi(8)}=16\equiv0\pmod8$。易错选“期望线性相加”：$E[X+Y]=E[X]+E[Y]$ 什么条件都不需要（连独立都不要），更谈不上互素。握手定理和平面 Euler 公式也与互素无关。`},
{"id":R`r1-c2`,
"sec":R`r1-s1`,
"q":R`已知图满足 e≤3v−6，可以直接断言什么？`,
"opts":[R`必为平面图`,
R`不能据此断言可平面`,
R`必连通`,
R`必为三角剖分`],
"a":1,
"ex":R`选“不能据此断言可平面”。$e\le3v-6$ 是简单平面图（$v\ge3$）的<b>必要</b>条件：平面图一定满足它，但满足它的图不一定是平面图。反例：$K_{3,3}$ 有 $v=6,e=9\le12$，却不是平面图。易错选“必为平面图”：把必要条件当成了充分条件。`},
{"id":R`r1-c3`,
"sec":R`r1-s2`,
"q":R`六个人模型任选一人，五条相接边至少几条同色？`,
"opts":[R`2`,
R`3`,
R`4`,
R`5`],
"a":1,
"ex":R`选 3。5 条边分到 2 种颜色，若每种颜色至多 2 条，总共至多 4 条，矛盾；所以某种颜色至少 $\lceil5/2\rceil=3$ 条。易错选 2：$2+2=4\lt5$，2 条不够分完 5 条边。也不能选 4，例如 3 红 2 蓝就没有 4 条同色。`},
{"id":R`r1-c4`,
"sec":R`r1-s3`,
"q":R`运输表消到支撑森林后，必可声称：`,
"opts":[R`全局路线数最少`,
R`运输费用最低`,
R`行列和保持，正项不超过行点数加列点数减 1`,
R`任意同边际表与它相同`],
"a":2,
"ex":R`选第三项。消圈每一步都保持行列和，最终支撑是森林，边数 $=(s+t)-c\le s+t-1$。易错选“全局路线数最少”：消圈只给通用上界，例如 $\begin{pmatrix}1&2\\2&0\end{pmatrix}$ 支撑是树（3 个正项），但同边际的 $\begin{pmatrix}3&0\\0&2\end{pmatrix}$ 只有 2 个正项。题中也没有运费，谈不上“费用最低”；同边际的表也不唯一。`}],
"methods":[{"id":R`m-discrete-triage`,
"title":R`混合题分诊：对象、条件、保证`,
"steps":[R`写清对象：排列、子集、随机变量、同余类、图还是矩阵？每种对象的计数单位不能混。`,R`判断题型：数个数（分类/容斥/递推）、证存在（抽屉/极端/概率）、保持总量（建图调整）。`,R`圈出工具需要的条件并逐一核对：独立？互素？简单图？可平面？完美匹配？非负、行列和固定？`,R`写结论时说清是上界、构造、存在性还是唯一性；最后用一个小例子或反例检查（特别是逆命题是否成立）。`]}],
"problems":[{"id":R`r1-p1`,
"lv":R`基础`,
"src":R`自编：两条路线各一问`,
"stmt":R`<p>(1) 四个元素的错位排序有多少个？若从所有排列均匀抽取，错位概率是多少？</p><p>(2) 同余式 $6x\equiv9\pmod{15}$ 应如何约分？给出全部模 15 解。</p>`,
"hints":[R`(1) 用容斥：全集 $4!=24$ 个排列，$A_i$=“第 $i$ 个元素在原位”，指定 $k$ 个在原位有 $(4-k)!$ 种。(2) 先求 $\gcd(6,15)$。`,
R`(1) $d_4=\binom40 4!-\binom41 3!+\binom42 2!-\binom43 1!+\binom44 0!$。(2) $\gcd(6,15)=3$，$3\mid9$，把 6、9、15 一起除以 3。`,
R`(2) 得 $2x\equiv3\pmod5$；$2\times3=6\equiv1$，逆元 3，$x\equiv9\equiv4\pmod5$；回到模 15 有 3 个解。`],
"method":R`m-discrete-triage`,
"sol":R`<p><b>(1)</b> 全集为 4 个元素的全部排列，$4!=24$ 个。$A_i$ = “第 $i$ 个元素在原位”。指定 $k$ 个元素在原位，其余任意排，有 $(4-k)!$ 种。由容斥：</p>$$d_4=24-\binom41\cdot6+\binom42\cdot2-\binom43\cdot1+\binom44\cdot1=24-24+12-4+1=9.$$<p>均匀抽取时，错位排列的概率 $=\dfrac9{24}=\dfrac38$。</p><p><b>(2)</b></p><ol><li>$d=\gcd(6,15)=3$，$3\mid9$，有解，模 15 下共 3 个解。</li><li>系数、右端、<b>模数</b>一起除以 3：$2x\equiv3\pmod5$。</li><li>$2\times3=6\equiv1\pmod5$，逆元 3；两边乘 3：$x\equiv9\equiv4\pmod5$。</li><li>回到模 15：$x\equiv4,\ 4+5=9,\ 4+10=14\pmod{15}$。</li></ol><p>验算：$6\times4=24\equiv9$，$6\times9=54\equiv9$，$6\times14=84\equiv9\pmod{15}$。✓</p><p><b>答：(1) $d_4=9$，概率 $3/8$；(2) $x\equiv4,9,14\pmod{15}$。</b>易错：只约掉系数而保持模数 15 不变，会漏解或出错。</p>`},
{"id":R`r1-p2`,
"lv":R`课堂复盘`,
"src":R`课堂记录_2026-11-17.pdf 第 9–10 页（补下界构造）`,
"stmt":R`证明：任意六个人中，要么有三个人彼此相识，要么有三个人彼此不相识。再给五个人的关系图说明六人不能减为五人。`,
"hints":[R`建模：6 人是 $K_6$ 的顶点，相识的边染红、不相识的染蓝。任选一个人 $A$，看他连出的 5 条边。`,
R`5 条边 2 种颜色，至少 3 条同色，不妨 $AB,AC,AD$ 都红。再看 $B,C,D$ 两两之间的 3 条边：有红边或全是蓝边。`,
R`五人反例：五个人围成一圈，相邻的相识（红色五圈），不相邻的不相识（蓝色也是五圈），检查没有单色三角形。`],
"method":R`m-count-pigeon`,
"sol":R`<p><b>建模：</b>6 个人作为 $K_6$ 的顶点，两人相识则连红边，不相识则连蓝边。“三人彼此相识”= 红三角形，“三人彼此不相识”= 蓝三角形。</p><p><b>第 1 步：抽屉原理。</b>任取一人 $A$，他与其余 5 人连 5 条边，只有 2 种颜色，所以至少 3 条同色（若每色至多 2 条，总数至多 4）。不妨设 $AB,AC,AD$ 都是红色（蓝色同理）。</p><p><b>第 2 步：分情况。</b></p><ul><li>若 $BC,BD,CD$ 中有一条红边，比如 $BC$，则 $A,B,C$ 两两红边，是红三角形（三人彼此相识）。</li><li>否则 $BC,BD,CD$ 全是蓝边，$B,C,D$ 是蓝三角形（三人彼此不相识）。</li></ul><p>两种情况都得到所需的三个人。</p><p><b>第 3 步：五人不够。</b>五个人 $P_1,\dots,P_5$ 围成一圈，相邻两人（$P_1P_2,P_2P_3,P_3P_4,P_4P_5,P_5P_1$）相识，其余（$P_1P_3,P_1P_4,P_2P_4,P_2P_5,P_3P_5$）不相识。红边是五圈 $P_1P_2P_3P_4P_5$，蓝边是五圈 $P_1P_3P_5P_2P_4$；五圈中任意三点至少有两点不相邻，所以红、蓝都没有三角形。</p><p><b>结论：任意六人中必有三人两两相识或两两不相识；五人时不一定，六是最少人数，即 $R(3,3)=6$。</b></p>`},
{"id":R`r1-p3`,
"lv":R`综合`,
"src":R`自编：新课堂运输表应用`,
"stmt":R`表 $A=\begin{pmatrix}2&1&1\\1&2&1\end{pmatrix}$ 表示两发货点、三收货点运量。保持行列和，沿左上四圈做一次消圈，把正项降到不超过 4 个。说明上界 4 的图论来源。`,
"hints":[R`左上 $2\times2$ 四个正项构成四圈 $R_1C_1R_2C_2R_1$。对角 $(1,1),(2,2)$ 标加号，$(1,2),(2,1)$ 标减号。`,
R`减号格的值都是 1，$\varepsilon=\min\{1,1\}=1$，两个减号格同时变成 0。`,
R`新表的行和应仍为 $(4,4)$、列和仍为 $(3,3,2)$；顶点 $2+3=5$ 个，森林至多 $5-1=4$ 条边。`],
"method":R`m-transport-cycle`,
"sol":R`<p><b>第 1 步：找圈。</b>原表 6 个格子都是正项。左上四格对应边 $R_1C_1,R_1C_2,R_2C_1,R_2C_2$，组成四圈。</p><p><b>第 2 步：标号与 $\varepsilon$。</b>$(1,1),(2,2)$ 标 $+$，$(1,2),(2,1)$ 标 $-$；$\varepsilon=\min\{a_{12},a_{21}\}=\min\{1,1\}=1$。</p><p><b>第 3 步：调整。</b>$$\begin{pmatrix}2&1&1\\1&2&1\end{pmatrix}\longrightarrow\begin{pmatrix}3&0&1\\0&3&1\end{pmatrix}.$$</p><p><b>第 4 步：核对。</b>行和：$3+0+1=4$，$0+3+1=4$，与原来 $(4,4)$ 相同；列和：$3,3,2$，与原来相同；无负数。正项由 6 个降为 4 个（两条减号边同时归零）。</p><p><b>第 5 步：上界 4 的来源。</b>正项对应二部图（$2$ 个行点 $+3$ 个列点 $=5$ 个顶点）的边。有圈就能交替加减消掉至少一条边，最终支撑图是森林，边数 $=5-c\le5-1=4$。本题新支撑 $R_1C_1,R_1C_3,R_2C_3,R_2C_2$ 连通无圈，是一棵 5 点 4 边的树。</p><p><b>答：调整后为 $\begin{pmatrix}3&0&1\\0&3&1\end{pmatrix}$，正项 4 个。</b>这里说明的是“一定能做到 $\le4$”，并不是说所有同类问题都恰好需要 4 条路线。</p>`}],
"variants":[{"id":R`r1-v1`,
"lv":R`变种`,
"src":R`自编：Hall 缺口与最小修复`,
"stmt":R`二部图 A={a1,a2,a3}、B={b1,b2,b3}，邻集分别为 {b1}、{b1}、{b2,b3}。求最大匹配大小，指出 Hall 缺口，并加一条边使其有完美匹配。`,
"hints":[R`Hall 定理：$A$ 侧能全部匹配 ⇔ 对每个 $S\subseteq A$，$|N(S)|\ge|S|$（$N(S)$ 是 $S$ 的所有邻居）。找一个违反它的 $S$。`,
R`$S=\{a_1,a_2\}$ 的邻居只有 $b_1$，$|N(S)|=1\lt2$，所以 $a_1,a_2$ 至多有一个能被匹配，最大匹配 $\le2$；找一个大小 2 的匹配。`,
R`加边要让 $a_1,a_2$ 中一个能连到 $b_1$ 以外的点，例如加 $a_2b_3$，再写出完美匹配。`],
"method":R`m-hall-deficit`,
"sol":R`<p><b>第 1 步：Hall 缺口。</b>取 $S=\{a_1,a_2\}$，$N(S)=\{b_1\}$，$|N(S)|=1\lt|S|=2$。这就是缺口：$a_1,a_2$ 只能抢同一个 $b_1$，至多一个被匹配。所以没有完美匹配，最大匹配 $\le3-1=2$。</p><p><b>第 2 步：最大匹配。</b>$\{a_1b_1,\ a_3b_2\}$ 是大小 2 的匹配，达到上界，所以<b>最大匹配大小为 2</b>。</p><p><b>第 3 步：加边修复。</b>加入边 $a_2b_3$。此时 $\{a_1b_1,\ a_2b_3,\ a_3b_2\}$ 是完美匹配（三条边两两无公共顶点，覆盖全部 6 个点）。不加边时没有完美匹配，所以最少加 1 条边。</p><p><b>答：最大匹配 2；Hall 缺口在 $S=\{a_1,a_2\}$；加边 $a_2b_3$ 后有完美匹配。</b></p>`}],
"extensions":[{"id":R`r1-e1`,
"lv":R`延伸`,
"src":R`自编：小反例审查错误推理`,
"stmt":R`分别给反例：(1) 两个事件互斥所以独立；(2) 图有偶圈所以任意指定完美匹配都能沿它翻转。`,
"hints":[R`(1) 掷一次公平硬币，$A$=“正面”，$B$=“反面”。算 $P(A\cap B)$ 与 $P(A)P(B)$。`,
R`(2) 交错圈：圈上的边交替“属于匹配 $M$”和“不属于 $M$”。构造一个偶圈，使它的边全都不在 $M$ 里：取四圈，每个顶点再接一个新的叶点。`,
R`令 $M$ = 四条叶边，它是完美匹配；四圈上的边都不在 $M$ 中，所以不是交错圈。`],
"method":R`m-discrete-triage`,
"sol":R`<p><b>(1)</b> 掷一次公平硬币，$A$=“正面”，$B$=“反面”。$A\cap B=\varnothing$，互斥。$P(A)=P(B)=\frac12$，$P(A\cap B)=0\ne\frac14=P(A)P(B)$，所以<b>不独立</b>。（正概率的互斥事件一定不独立：知道一个发生，另一个就不可能发生。）</p><p><b>(2)</b> 构造：四圈 $v_1v_2v_3v_4v_1$，每个 $v_i$ 再接一个叶点 $u_i$（共 8 个顶点）。令 $M=\{v_1u_1,v_2u_2,v_3u_3,v_4u_4\}$，它覆盖全部 8 个点、无公共顶点，是完美匹配。</p><p>“沿圈翻转”指把圈上属于 $M$ 的边删掉、不属于的加进来，这要求圈是 $M$-交错圈。但四圈的 4 条边都不在 $M$ 中：若全部加进去，每个 $v_i$ 会被匹配两次（$v_iu_i$ 和圈边），不再是匹配。所以有偶圈不代表能翻转指定匹配。</p><p><b>答：(1) 硬币正、反面互斥但不独立；(2) 上述“四圈接叶点”的图与匹配 $M$ 是反例。</b></p>`}]},

"problems":[{"id":R`dmock1-p1`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 1 题 · 15 分`,
"stmt":R`<p>(1) 求长度 8 且不含相邻两个 1 的 0/1 串数（6 分）。若从全部长度 8 的串均匀抽取，满足条件的概率是多少（3 分）？</p><p>(2) 对独立公平 0/1 串，记 X 为相邻位置同时为 1 的对数，求 E[X]（6 分）。</p>`,
"hints":[R`(1) 设 $a_n$ 为长度 $n$ 且没有相邻两个 1 的串数，按最后一位分类写递推；(2) 把 $X$ 拆成若干个 0/1 指示变量之和，用期望的线性性。`,
R`(1) 最后一位是 0：前面 $n-1$ 位任意合法，$a_{n-1}$ 个；最后一位是 1：倒数第二位必须是 0，前面 $n-2$ 位合法，$a_{n-2}$ 个。所以 $a_n=a_{n-1}+a_{n-2}$，$a_0=1$（空串），$a_1=2$。`,
R`(1) 依次算 $a_2=3,a_3=5,\dots$ 直到 $a_8$，概率 $=a_8/2^8$。(2) 长度 8 有 7 对相邻位置，令 $I_i=1$ 当且仅当第 $i,i+1$ 位都是 1，$P(I_i=1)=\frac12\cdot\frac12$。`],
"method":R`m-count-rec`,
"sol":R`<p><b>(1)</b> 设 $a_n$ 为长度 $n$、不含相邻两个 1 的 0/1 串个数。按最后一位分类：</p>
<ul><li>最后一位为 0：前 $n-1$ 位是任意合法串，有 $a_{n-1}$ 个；</li><li>最后一位为 1：第 $n-1$ 位必须为 0（否则相邻两个 1），前 $n-2$ 位是任意合法串，有 $a_{n-2}$ 个。</li></ul>
<p>两类不重叠，所以 $a_n=a_{n-1}+a_{n-2}$（$n\ge2$）。初值 $a_0=1$（空串），$a_1=2$（"0" 和 "1"）。依次计算：</p>
$$a_2=3,\ a_3=5,\ a_4=8,\ a_5=13,\ a_6=21,\ a_7=34,\ a_8=55.$$
<p>长度 8 的串共 $2^8=256$ 个，等可能。<b>满足条件的串有 55 个，概率为 $\frac{55}{256}$。</b></p>
<p><b>(2)</b> 对 $i=1,\dots,7$，令 $I_i=1$ 若第 $i$ 位和第 $i+1$ 位都是 1，否则 $I_i=0$。则 $X=I_1+\cdots+I_7$。各位独立且为 1 的概率 $\frac12$，所以 $E[I_i]=P(I_i=1)=\frac12\cdot\frac12=\frac14$。由期望的线性性：$$E[X]=\sum_{i=1}^7E[I_i]=7\times\frac14=\frac74.$$</p>
<p>注：相邻的 $I_i,I_{i+1}$ 共用一位，不独立，但期望的线性性不需要独立。<b>答：$E[X]=\frac74$。</b></p>
<p>评分：分类递推与初值 4，算出 55 得 2；概率 3；定义指示变量 2，算出 $\frac14$ 得 2，相加得 $\frac74$ 得 2。</p>`,
"points":15},
{"id":R`dmock1-p2`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 2 题 · 15 分`,
"stmt":R`<p>(1) 求 $18x\equiv30\pmod{42}$ 的全部模 42 解（8 分）。</p><p>(2) 求 $\varphi(84)$ 与 $5^{2026}$ 除以 84 的余数（7 分）。</p>`,
"hints":[R`(1) 线性同余 $ax\equiv b\pmod m$ 有解 ⇔ $d=\gcd(a,m)\mid b$，有解时模 $m$ 恰有 $d$ 个解。(2) 用 $\varphi$ 的公式，再找 5 模 84 的一个小周期。`,
R`(1) $\gcd(18,42)=6$，$6\mid30$。三项同除以 6：$3x\equiv5\pmod7$；3 模 7 的逆元是 5（$3\times5=15\equiv1$），所以 $x\equiv25\equiv4\pmod7$。`,
R`(1) 模 42 的解是 $4+7k$，$k=0,\dots,5$。(2) $84=2^2\cdot3\cdot7$，$\varphi(84)=24$；逐次平方：$5^2=25$，$5^3\equiv41$，$5^6\equiv41^2\equiv1\pmod{84}$，再把 2026 对 6 取余。`],
"method":R`m-nt-congruence`,
"sol":R`<p><b>(1)</b> $\gcd(18,42)=6$，且 $6\mid30$，所以有解，且模 42 恰有 6 个解。同除以 6（同余式两边与模数同除以公因子）：$$3x\equiv5\pmod7.$$ 3 模 7 的逆元是 5（因为 $3\times5=15=2\times7+1$）。两边乘 5：$x\equiv25\equiv4\pmod7$。</p>
<p>模 42 的解为 $x=4+7k$（$k=0,1,\dots,5$）：<b>$x\equiv4,11,18,25,32,39\pmod{42}$，共 6 个。</b></p>
<p>验算：$18\times4=72=42+30$ ✓。</p>
<p><b>(2)</b> $84=2^2\times3\times7$，$$\varphi(84)=84\left(1-\tfrac12\right)\left(1-\tfrac13\right)\left(1-\tfrac17\right)=84\times\tfrac12\times\tfrac23\times\tfrac67=24.$$</p>
<p>$\gcd(5,84)=1$。计算 5 的小次幂模 84：</p>
<ul><li>$5^2=25$；</li><li>$5^3=125=84+41\equiv41$；</li><li>$5^6=(5^3)^2\equiv41^2=1681=20\times84+1\equiv1\pmod{84}$。</li></ul>
<p>$2026=6\times337+4$，所以 $5^{2026}=(5^6)^{337}\cdot5^4\equiv5^4\pmod{84}$。$5^4=625=7\times84+37$。</p>
<p><b>答：$\varphi(84)=24$，$5^{2026}$ 除以 84 余 37。</b>（也可用 Euler 定理 $5^{24}\equiv1$ 把指数化为 $2026\bmod24=10$，$5^{10}=(5^6)(5^4)\equiv37$，结果相同。）</p>
<p>评分：(1) gcd 与可解性 2，化简求出 $x\equiv4\pmod7$ 得 3，列全六个解 3；(2) $\varphi$ 3 分，幂的化简与余数 4 分。</p>`,
"points":15},
{"id":R`dmock1-p3`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 3 题 · 20 分`,
"stmt":R`<p>(1) [7] 上度数依次为 (3,2,2,1,1,1,2) 的标号树有多少棵（8 分）？</p><p>(2) 加权图边表为 AB:1，AC:4，BC:2，BD:5，CD:1，CE:3，DE:2，BE:6。求一棵 MST、总权，并证明唯一（12 分）。</p>`,
"hints":[R`(1) 用普吕弗编码：树 ↔ 长为 $n-2=5$ 的序列，顶点 $i$ 出现 $d_i-1$ 次。(2) 用 Kruskal：按权从小到大，不成圈就选。`,
R`(1) 出现次数为 $(2,1,1,0,0,0,1)$，和为 5，数多重集排列。(2) 排序：$AB(1),CD(1),BC(2),DE(2),CE(3),AC(4),BD(5),BE(6)$，前四条都不成圈。`,
R`(1) $\frac{5!}{2!\,1!\,1!\,1!}$。(2) 唯一性：对每条非树边 $AC,BD,CE,BE$，找它两端在树上的道路，比较道路上的最大边权；全部严格小于该非树边的权，MST 就唯一。`],
"method":R`m-treecount`,
"sol":R`<p><b>(1)</b> 先检查：度数和 $3+2+2+1+1+1+2=12=2\times6$，与 7 点树的边数 6 吻合。由普吕弗编码，$[7]$ 上的树与长度 5 的序列一一对应，且顶点 $i$ 在序列中出现 $d_i-1$ 次。出现次数为 $$(3-1,2-1,2-1,0,0,0,2-1)=(2,1,1,0,0,0,1),$$ 即序列由两个 1、一个 2、一个 3、一个 7 组成。这种序列的个数为 $$\frac{5!}{2!\,1!\,1!\,1!}=\frac{120}{2}=60.$$ <b>答：60 棵。</b></p>
<p><b>(2)</b> 5 个顶点需 4 条边。Kruskal：</p>
<ul><li>$AB(1)$：选，分支 $\{A,B\}$；</li><li>$CD(1)$：选，分支 $\{A,B\},\{C,D\}$；</li><li>$BC(2)$：选，分支 $\{A,B,C,D\}$；</li><li>$DE(2)$：选，全部连通，已有 4 条，停止。</li></ul>
<p><b>MST $T=\{AB,CD,BC,DE\}$，总权 $1+1+2+2=6$。</b></p>
<p><b>唯一性</b>：逐条非树边与树上道路比较：</p>
<ul><li>$AC(4)$：树上 $A\text{-}B\text{-}C$，最大权 2，$4\gt2$；</li><li>$BD(5)$：$B\text{-}C\text{-}D$，最大权 2，$5\gt2$；</li><li>$CE(3)$：$C\text{-}D\text{-}E$，最大权 2，$3\gt2$；</li><li>$BE(6)$：$B\text{-}C\text{-}D\text{-}E$，最大权 2，$6\gt2$。</li></ul>
<p>每条非树边都严格重于它在树上对应道路的每一条边。任取另一棵生成树 $T'\ne T$，它含某条非树边 $e$；对 $T'$ 逐次用 $T$ 的道路边替换非树边，每次总权严格下降，所以 $w(T')\gt w(T)$。<b>故 $T$ 是唯一的 MST。</b></p>
<p>评分：度数与出现次数的对应 4，计数 4；正确四条边 4，总权 2，逐条比较与唯一性结论 6。</p>`,
"points":20},
{"id":R`dmock1-p4`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 4 题 · 20 分`,
"stmt":R`<p>(1) A={a1,a2,a3,a4}，B={b1,b2,b3,b4}，各行邻集为 {b1,b2}、{b1,b2}、{b2,b3,b4}、{b3,b4}。给一个完美匹配及一个交错圈，翻转得到第二匹配（8 分）。</p><p>(2) 证明任意 4+4 简单二部图若有一个完美匹配且有 11 条边，该匹配不唯一；并给有 10 条边但匹配唯一的构造（12 分）。</p>`,
"hints":[R`(1) 先试对角匹配 $a_ib_i$；交错圈是匹配边与非匹配边轮流出现的圈。(2) 用“唯一完美匹配的二部图至多 $\frac{n(n+1)}2$ 条边”，$n=4$ 时是 10。`,
R`(1) $a_1,a_2$ 都与 $b_1,b_2$ 相邻，$a_1b_1a_2b_2a_1$ 是四圈，且匹配边 $a_1b_1,a_2b_2$ 与非匹配边 $b_1a_2,b_2a_1$ 轮流。(2) 把非匹配边 $b_ia_j$ 看成有向边 $i\to j$，匹配唯一 ⇔ 这个有向图没有有向圈。`,
R`(2) 无有向圈 ⇒ 有拓扑顺序，所有有向边都“向前”，至多 $\binom42=6$ 条，加 4 条匹配边至多 10 条，所以 11 条必不唯一。构造：$a_ib_j$ 是边当且仅当 $i\le j$，共 $4+3+2+1=10$ 条。`],
"method":R`m-match-induct`,
"sol":R`<p><b>(1)</b> 取 $M=\{a_1b_1,a_2b_2,a_3b_3,a_4b_4\}$，检查都是边：$b_1\in N(a_1)$，$b_2\in N(a_2)$，$b_3\in N(a_3)$，$b_4\in N(a_4)$ ✓，且每点恰用一次，是完美匹配。</p>
<p>交错圈：$a_1\xrightarrow{M}b_1\xrightarrow{\text{非}}a_2\xrightarrow{M}b_2\xrightarrow{\text{非}}a_1$，用到的非匹配边 $a_2b_1,a_1b_2$ 都存在。翻转：$$M^{\ast}=\{a_1b_2,\ a_2b_1,\ a_3b_3,\ a_4b_4\},$$ 每点恰出现一次，是第二个完美匹配。</p>
<p><b>(2) 上界</b>：设 $G$ 有完美匹配，编号使 $M=\{a_ib_i\}$。对每条非匹配边 $b_ia_j$（$i\ne j$）画有向边 $i\to j$，得有向图 $D$（4 个点）。</p>
<ol><li>若 $D$ 有有向圈 $i_1\to\cdots\to i_k\to i_1$，展开为 $a_{i_1}b_{i_1}a_{i_2}b_{i_2}\cdots a_{i_k}b_{i_k}a_{i_1}$，是 $M$-交错圈，翻转得到另一个完美匹配。所以若 $M$ 唯一，$D$ 无有向圈。</li>
<li>无有向圈的有限有向图有入度为 0 的点（否则逆着入边一直走必重复，得有向圈）；反复取出入度 0 的点，得到一个顺序，所有有向边都从前指向后。</li>
<li>简单图中每个有序对 $(i,j)$ 至多一条边 $b_ia_j$；在这个顺序下只能有“向前”的边，所以每个无序对至多 1 条，非匹配边 $\le\binom42=6$。总边数 $\le6+4=10$。</li></ol>
<p>所以 11 条边时 $M$ 一定不唯一。</p>
<p><b>构造</b>：$a_ib_j$ 为边当且仅当 $i\le j$，边数 $4+3+2+1=10$。$a_4$ 只与 $b_4$ 相邻，任何完美匹配必含 $a_4b_4$；去掉后 $a_3$ 只剩 $b_3$，必含 $a_3b_3$；依次得 $a_2b_2$、$a_1b_1$。所以完美匹配唯一，为 $\{a_ib_i\}$。</p>
<p>评分：(1) 匹配与交错圈 4，翻转 4；(2) 上界论证 8，构造及唯一性 4。</p>`,
"points":20},
{"id":R`dmock1-p5`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 5 题 · 15 分`,
"stmt":R`<p>G 是 10 顶点的无三角形简单平面图，且连通。</p><p>(1) 求边数上界；若取等，面数及每个面的边界长度是多少（7 分）？</p><p>(2) 不引用更强染色定理，证明 G 可用 4 色染色（8 分）。</p>`,
"hints":[R`(1) 无三角形 ⇒ 每个面边界长度 $\ge4$；用面边双计数 $\sum\deg(F)=2e$ 和 Euler 公式。(2) 找一个度很小的点，删掉后归纳。`,
R`(1) $4f\le2e$，代入 $f=2-v+e$ 得 $e\le2v-4=16$。取等时 $f=2-10+16=8$，而 $\sum\deg(F)=32=4\times8$ 且每个 $\ge4$，所以全都恰为 4。`,
R`(2) 子图仍无三角形、可平面，满足 $e\le2v-4$（$v\ge3$），平均度 $\frac{2e}v\le4-\frac8v\lt4$，所以有度 $\le3$ 的点。删去它，剩余图归纳 4 色，再染回：至多 3 个邻点禁用 3 色。`],
"method":R`m-planar-count`,
"sol":R`<p><b>(1)</b> $G$ 简单、无三角形、连通，$v=10\ge3$，所以每个面的边界长度（按绕边界走的边数计，桥计两次）至少为 4。由面边双计数 $\sum_F\deg(F)=2e$ 得 $4f\le2e$，即 $f\le\frac e2$。代入 Euler 公式 $v-e+f=2$：$$2=v-e+f\le v-e+\frac e2=v-\frac e2\ \Rightarrow\ e\le2v-4=16.$$</p>
<p>取等 $e=16$ 时，$f=2-v+e=2-10+16=8$。此时 $\sum_F\deg(F)=2e=32=4\times8$，而 8 个面每个 $\ge4$，所以<b>每个面的边界长度都恰为 4</b>。<b>答：$e\le16$；取等时 8 个面，每面边界长 4。</b></p>
<p><b>(2)</b> 证明更一般的命题：任何无三角形的简单可平面图都可 4 色正常染色。对顶点数 $v$ 归纳。</p>
<ul><li>$v\le4$：每点一种颜色即可。</li><li>$v\ge5$：由 (1) 的推导（不连通时先补边，补的边不产生三角形），$e\le2v-4$，度数和 $2e\le4v-8\lt4v$，所以存在顶点 $x$ 满足 $d(x)\le3$（否则度数和 $\ge4v$）。$G-x$ 仍无三角形、可平面，由归纳假设可 4 色染色。$x$ 至多 3 个邻点，至多禁用 3 种颜色，4 种中至少剩一种给 $x$。</li></ul>
<p><b>所以 $G$ 可用 4 色染色。</b></p>
<p>评分：边数界推导 4，取等时面数及面长 3；说明子图仍满足条件 3，找出度 $\le3$ 的点 2，删点后染回 3。</p>`,
"points":15},
{"id":R`dmock1-p6`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 1 · 第 6 题 · 15 分`,
"stmt":R`简单图 G 有 9 个顶点、18 条边。证明 G 有 4-圈，并进一步证明至少有 9 个不同的 4-圈（按边集区分，不要求诱导）。`,
"hints":[R`用“角”双计数（两条有公共端点的边叫一个角）：按顶点数 $S=\sum\binom{d_i}2$，按支点对数 $S=\sum_{\{u,v\}}c(u,v)$，$c(u,v)$ 是 $u,v$ 的公共邻点数。`,
R`下界：$S\ge\frac{2E^2}n-E=\frac{2\times324}9-18=54$。点对只有 $\binom92=36$ 个；若无 4-圈则每对 $c\le1$，$S\le36$，矛盾。`,
R`数 4-圈：点对 $\{u,v\}$ 的两个公共邻点给出一个 4-圈，每个 4-圈有两组对角各算一次，所以 $N_4=\frac12\sum\binom{c(u,v)}2$；再用整数不等式 $\binom c2\ge c-1$。`],
"method":R`m-angle-bound`,
"sol":R`<p>称两条有公共端点的边为一个<b>角</b>，记角数为 $S$；对点对 $\{u,v\}$，记 $c(u,v)$ 为其公共邻点数。</p>
<p><b>第 1 步（下界）</b>：按角的顶点分类，$S=\sum_i\binom{d_i}2=\frac12\sum d_i^2-E$。由 Cauchy–Schwarz，$\sum d_i^2\ge\frac{(\sum d_i)^2}n=\frac{(2E)^2}n$，所以 $$S\ge\frac{2E^2}n-E=\frac{2\times18^2}9-18=72-18=54.$$</p>
<p><b>第 2 步（存在 4-圈）</b>：按角的两个支点分类，$S=\sum_{\{u,v\}}c(u,v)$，共 $\binom92=36$ 个点对。若 $G$ 无 4-圈，则每对 $c(u,v)\le1$（两个公共邻点 $a,b$ 就给出 4-圈 $u\,a\,v\,b$），$S\le36\lt54$，矛盾。所以 $G$ 有 4-圈。</p>
<p><b>第 3 步（计数）</b>：对点对 $\{u,v\}$，任选它的两个公共邻点 $\{a,b\}$，得到 4-圈 $u\,a\,v\,b$。反过来，每个 4-圈 $u\,a\,v\,b$ 有两组对角点 $\{u,v\}$ 和 $\{a,b\}$，恰被这样得到两次。所以 4-圈个数 $$N_4=\frac12\sum_{\{u,v\}}\binom{c(u,v)}2.$$</p>
<p>对非负整数 $c$，$\binom c2\ge c-1$（$c=0$：$0\ge-1$；$c\ge1$：$\frac{c(c-1)}2-(c-1)=\frac{(c-1)(c-2)}2\ge0$）。所以 $$N_4\ge\frac12\sum_{\{u,v\}}(c(u,v)-1)=\frac12(S-36)\ge\frac12(54-36)=9.$$</p>
<p><b>结论：$G$ 有 4-圈，且至少有 9 个不同的 4-圈。</b></p>
<p>评分：角数下界 4，存在性矛盾 3，4-圈计数式（含除以 2）5，整数不等式与结论 3。</p>`,
"points":15}],

"problems":[{"id":R`dmock2-p1`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 2 · 第 1 题 · 15 分`,
"stmt":R`<p>从 [6] 到 [3] 均匀随机选一个映射。</p><p>(1) 满射有多少个，满射概率是多少（8 分）？若不区分三个非空原像组的标号，分组数是多少（3 分）？</p><p>(2) 求未被命中的值的个数期望，并据此给出不是满射的概率上界（4 分）。</p>`,
"hints":[R`(1) 用容斥原理：记 $E_j$ 为“值 $j$ 没被任何元素映到”，满射 = 三个坏事件都不发生。(2) 把“没被命中的值的个数”拆成三个指示变量之和。`,
R`(1) $|E_j|=2^6$（6 个元素都只能映到另两个值），$|E_j\cap E_k|=1^6$，$|E_1\cap E_2\cap E_3|=0$。满射数 $=3^6-\binom31 2^6+\binom32 1^6$。无标号分组：每种分组恰对应 $3!$ 个满射。`,
R`(2) 值 $j$ 没被命中的概率 $\left(\frac23\right)^6$，所以 $E[Z]=3\left(\frac23\right)^6$。再用 Markov 不等式 $P(Z\ge1)\le E[Z]$（$Z$ 是非负整数）。`],
"method":R`m-count-ie`,
"sol":R`<p><b>(1)</b> 映射共 $3^6=729$ 个，等可能。记 $E_j$（$j=1,2,3$）为“值 $j$ 不在像中”。</p>
<ul><li>$|E_j|=2^6=64$（每个元素只能映到另外两个值）；</li><li>$|E_j\cap E_k|=1^6=1$（全映到剩下那一个值）；</li><li>$|E_1\cap E_2\cap E_3|=0$。</li></ul>
<p>由容斥原理，满射数 $$3^6-3\times64+3\times1-0=729-192+3=540.$$ <b>满射有 540 个，概率 $\frac{540}{729}=\frac{20}{27}$。</b></p>
<p>无标号分组：一个满射把 [6] 分成 3 个非空组（各值的原像）并给组贴上标号 1、2、3。反过来，每种无标号分组，给 3 个组贴标号有 $3!=6$ 种方式，各对应一个不同的满射。所以<b>分组数 $=540/6=90$</b>（即第二类 Stirling 数 $S(6,3)=90$）。</p>
<p><b>(2)</b> 设 $Z$ 为没被命中的值的个数，$Z=I_1+I_2+I_3$，$I_j=1$ 当且仅当值 $j$ 没被命中。$P(I_j=1)=\left(\frac23\right)^6=\frac{64}{729}$（6 个元素独立地各避开 $j$）。由期望的线性性：$$E[Z]=3\times\frac{64}{729}=\frac{64}{243}.$$</p>
<p>“不是满射”就是 $Z\ge1$。$Z$ 取非负整数，所以 $P(Z\ge1)\le E[Z]$（Markov 不等式），<b>即不是满射的概率 $\le\frac{64}{243}$</b>。核对：真实值为 $1-\frac{20}{27}=\frac7{27}=\frac{63}{243}$，确实略小于上界。</p>
<p>评分：容斥及计算 5，概率 3；除以 $3!$ 及理由 3；指示变量求期望 2，概率上界 2。</p>`,
"points":15},
{"id":R`dmock2-p2`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 2 · 第 2 题 · 15 分`,
"stmt":R`<p>(1) 求 $x\equiv4\pmod9$、$x\equiv7\pmod{12}$ 的全部整数解（8 分）。</p><p>(2) 用扩展 Euclid 求 28 在模 45 下的逆元，不能只猜结果（7 分）。</p>`,
"hints":[R`(1) 模数 9 和 12 不互素，不能直接套中国剩余定理。先查相容性：两个余数之差要被 $\gcd(9,12)=3$ 整除。(2) 对 45 和 28 做辗转相除，再倒着代回。`,
R`(1) 由第一式写 $x=4+9k$，代入第二式：$9k\equiv3\pmod{12}$，三项同除以 3 得 $3k\equiv1\pmod4$。(2) $45=1\cdot28+17$，$28=1\cdot17+11$，$17=1\cdot11+6$，$11=1\cdot6+5$，$6=1\cdot5+1$。`,
R`(1) $3\times3=9\equiv1\pmod4$，所以 $k\equiv3\pmod4$，$k=3+4t$，$x=31+36t$。(2) 从 $1=6-5$ 开始，把 5、6、11、17 依次用上一行代掉，最后写成 $1=u\cdot45+v\cdot28$，$v$ 就是逆元（取模 45 的正代表）。`],
"method":R`m-crt-merge`,
"sol":R`<p><b>(1)</b> $\gcd(9,12)=3$，$7-4=3$ 被 3 整除，方程组相容。由第一式 $x=4+9k$（$k\in\mathbb Z$），代入第二式：$$4+9k\equiv7\pmod{12}\iff9k\equiv3\pmod{12}.$$ 两边和模数同除以 3：$3k\equiv1\pmod4$。因 $3\times3=9\equiv1\pmod4$，两边乘 3 得 $k\equiv3\pmod4$。令 $k=3+4t$：$$x=4+9(3+4t)=31+36t.$$</p>
<p>验算：$31=3\times9+4$ ✓，$31=2\times12+7$ ✓。<b>全部解为 $x\equiv31\pmod{36}$</b>（$36=\operatorname{lcm}(9,12)$）。</p>
<p><b>(2)</b> 辗转相除：</p>
$$\begin{aligned}45&=1\cdot28+17\\28&=1\cdot17+11\\17&=1\cdot11+6\\11&=1\cdot6+5\\6&=1\cdot5+1\end{aligned}$$
<p>倒着代回（每步把较小的余数用上一行表示）：</p>
$$\begin{aligned}1&=6-5=6-(11-6)=2\cdot6-11\\&=2(17-11)-11=2\cdot17-3\cdot11\\&=2\cdot17-3(28-17)=5\cdot17-3\cdot28\\&=5(45-28)-3\cdot28=5\cdot45-8\cdot28.\end{aligned}$$
<p>所以 $-8\cdot28\equiv1\pmod{45}$，逆元为 $-8\equiv37\pmod{45}$。验算：$28\times37=1036=23\times45+1$ ✓。<b>答：28 模 45 的逆元为 37。</b></p>
<p>评分：(1) 相容性与代入 2，化简求解 4，写出完整周期 2；(2) 相除链 3，回代 3，化成正代表 1。</p>`,
"points":15},
{"id":R`dmock2-p3`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 2 · 第 3 题 · 20 分`,
"stmt":R`<p>(1) [6] 上恰有三个叶子的标号树有多少棵（10 分）？</p><p>(2) K4 的四条外围圈边权均为 1，两条对角线边权均为 2。求 MST 总权及不同 MST 的数目，并解释“有并列边权就不唯一”是否普遍成立（10 分）。</p>`,
"hints":[R`(1) 用普吕弗序列（长 $6-2=4$）：叶子 = 没在序列中出现的标号。恰 3 个叶子 ⇔ 序列中恰好出现 3 个不同标号。(2) 生成树要 3 条边，先看只用权 1 的边能不能做到。`,
R`(1) 先选哪 3 个标号是非叶：$\binom63$ 种；再数“长度 4、每项取自这 3 个标号、3 个都至少出现一次”的序列，即 4 元集到 3 元集的满射数 $3^4-3\cdot2^4+3$。`,
R`(2) 外围四圈任取 3 条边就是一条经过全部 4 点的路，权 3；含对角线（权 2）的树至少 $2+1+1=4$。所以 MST 就是“四圈删一条边”，数一数有几种删法。`],
"method":R`m-treecount`,
"sol":R`<p><b>(1)</b> 由普吕弗编码，$[6]$ 上的树 ↔ 长度 4、每项取自 $[6]$ 的序列，且叶子恰是不在序列中出现的标号。恰 3 个叶子 ⇔ 序列中恰好出现 $6-3=3$ 个不同标号。</p>
<ul><li>选出这 3 个出现的标号：$\binom63=20$ 种；</li><li>长度 4、只用这 3 个标号且每个至少一次的序列，就是 4 元集到 3 元集的满射，由容斥：$3^4-3\times2^4+3\times1=81-48+3=36$ 种。</li></ul>
<p><b>共 $20\times36=720$ 棵。</b></p>
<p><b>(2)</b> 生成树有 3 条边。外围四圈的任意 3 条边构成一条经过全部 4 个点的路，是生成树，权 $1+1+1=3$。含对角线的生成树权至少 $2+1+1=4\gt3$。所以 <b>MST 总权为 3</b>，MST 恰是“外围四圈删去一条边”，删法有 4 种，<b>共 4 棵不同的 MST</b>。</p>
<p>“有并列边权就不唯一”<b>不普遍成立</b>：三角形边权 $1,1,2$ 有并列边权，但最小总权 2 只能由两条权 1 的边取到，MST 唯一。并列权只是“可能不唯一”。</p>
<p>评分：叶子与序列的对应 4，满射计数 4，总数 2；总权及排除对角线 4，4 棵的计数 3，反例 3。</p>`,
"points":20},
{"id":R`dmock2-p4`,
"lv":R`自编模拟`,
"src":R`自编模拟卷 2 · 第 4 题 · 20 分`,
"stmt":R`<p>A={a1,…,a5}、B={b1,…,b5}，边 aᵢbⱼ 当且仅当 j≤i。</p><p>(1) 求边数并证明完美匹配唯一（8 分）。</p><p>(2) 添加边 a1b5 后，写出相对原匹配的交错圈及第二个完美匹配（8 分），并用唯一匹配边数界复核（4 分）。</p>`,
"hints":[R`(1) $a_i$ 的邻点是 $b_1,\dots,b_i$，度为 $i$。找“只有一个邻点”的点，它的配对是被迫的。(2) 交错圈 = 匹配边、非匹配边轮流出现的圈。`,
R`(1) $a_1$ 只与 $b_1$ 相邻，必配 $a_1b_1$；删去这一对后剩下的图是同样规则的 $4+4$ 图，归纳。(2) 原匹配是 $\{a_ib_i\}$；非匹配边 $b_1a_2,b_2a_3,b_3a_4,b_4a_5$ 都存在，再加上新边 $b_5a_1$。`,
R`(2) 圈 $a_1b_1a_2b_2a_3b_3a_4b_4a_5b_5a_1$，翻转得 $\{a_1b_5,a_2b_1,a_3b_2,a_4b_3,a_5b_4\}$。复核：新图 16 条边，而唯一完美匹配的二部图至多 $\frac{5\cdot6}2=15$ 条。`],
"method":R`m-match-flip`,
"sol":R`<p><b>(1)</b> $a_i$ 的邻点为 $b_1,\dots,b_i$，度为 $i$，边数 $1+2+3+4+5=15$。</p>
<p>唯一性（对规模归纳）：$a_1$ 只有邻点 $b_1$，任何完美匹配必含 $a_1b_1$。删去 $a_1,b_1$ 后，$a_2,\dots,a_5$ 与 $b_2,\dots,b_5$ 之间仍是“$j\le i$ 才有边”，同型而规模减 1；同理必含 $a_2b_2$，……，依次得到全部 $a_ib_i$。<b>所以完美匹配唯一，为 $M=\{a_ib_i\}$。</b></p>
<p><b>(2)</b> 加边 $a_1b_5$ 后，取圈 $$a_1\xrightarrow{M}b_1\to a_2\xrightarrow{M}b_2\to a_3\xrightarrow{M}b_3\to a_4\xrightarrow{M}b_4\to a_5\xrightarrow{M}b_5\to a_1.$$ 非匹配边 $b_1a_2,b_2a_3,b_3a_4,b_4a_5$ 都满足 $j\le i$，存在；$b_5a_1$ 是新边。匹配边与非匹配边交替，10 个顶点各不相同，是 $M$-交错圈。翻转得 $$M^{\ast}=\{a_1b_5,\ a_2b_1,\ a_3b_2,\ a_4b_3,\ a_5b_4\},$$ 每个顶点恰出现一次，<b>是第二个完美匹配</b>。</p>
<p><b>复核</b>：新图有 16 条边，$16\gt\frac{5\times6}2=15$。由“完美匹配唯一的 $n+n$ 二部图至多 $\frac{n(n+1)}2$ 条边”，新图的完美匹配一定不唯一，与上面一致。(1) 中 15 条边恰好等于界，说明界是严格不等号才保证不唯一。</p>
<p>评分：边数 3，强制配对归纳 5；交错圈 4，第二个匹配 4；边数界及严格号 4。</p>`,
"points":20},
{"id":R`dmock2-p5`,

"stmt":R`<p>某简单平面图的一个嵌入有 12 个顶点、14 条边、3 个连通分支。</p><p>(1) 求面数，含外部面（5 分）。</p><p>(2) 分别说明删去一条桥、删去一条圈边时，面数如何变化（5 分）。</p><p>(3) 不引用四色定理，证明任意简单平面图都可用 6 色染色（5 分）。</p>`,
"hints":[R`(1) 不连通，用一般版 Euler 公式 $v-e+f=1+c$。(2) 删边后 $v$ 不变、$e$ 减 1，再看 $c$ 怎么变，代回公式。(3) 找度 $\le5$ 的点，删点归纳。`,
R`(1) $f=1+c-v+e$。(2) 桥：删了会断开，$c$ 加 1；圈边：删了仍连通，$c$ 不变。`,
R`(3) $v\ge3$ 时 $e\le3v-6$，度数和 $2e\lt6v$，所以有度 $\le5$ 的点；删掉后归纳用 6 色染好，再染回：至多 5 个邻点，至多禁 5 色。`],
"method":R`m-planar-count`,
"sol":R`<p><b>(1)</b> 由 $v-e+f=1+c$：$$f=1+c-v+e=1+3-12+14=6.$$ <b>共 6 个面（含外部面）。</b></p>
<p><b>(2)</b> 删一条边后 $v=12$ 不变，$e=13$。</p>
<ul><li><b>删桥</b>：图多断开一处，$c=4$，$f=1+4-12+13=6$，<b>面数不变</b>（桥两侧本是同一个面）。</li><li><b>删圈边</b>：仍连通，$c=3$，$f=1+3-12+13=5$，<b>面数减 1</b>（这条边两侧的两个面合并）。</li></ul>
<p><b>(3)</b> 对顶点数 $v$ 归纳。$v\le6$ 时每点一色即可。设 $v\ge7$：简单平面图满足 $e\le3v-6$（不连通时先补边连通再用），度数和 $2e\le6v-12\lt6v$，所以有顶点 $x$，$d(x)\le5$。$G-x$ 仍是简单平面图，由归纳假设可 6 色正常染色；$x$ 至多 5 个邻点，至多禁用 5 种颜色，6 种中至少剩 1 种给 $x$。<b>所以任意简单平面图可 6 色染色。</b></p>
<p>评分：一般 Euler 公式及面数 5；两种删边各 2.5；找低度点与删点染回共 5。</p>`,

{"id":R`dmock2-p6`,
