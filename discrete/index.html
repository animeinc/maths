        <li>补图 $\overline G=(V,\binom V2\setminus E)$。诱导子图 $G[V_1]$ 要保留两端都在 $V_1$ 中的<b>全部</b>边，子图可以只保留一部分。</li>
        <li><b>道路</b>（walk）可以重复顶点；<b>简单道路</b>（path）顶点互不相同；<b>简单圈</b>（cycle）长度 $\ge3$，只有首尾重复。</li>
        <li>从 $x$ 到 $y$ 的<b>最短</b>道路一定是简单道路（有重复顶点就能剪掉一段）。</li>
      </ul>
      <p><b>握手定理</b>：$\sum_{v}d(v)=2e(G)$。每条边被两个端点各数一次。推论：<b>奇度顶点的个数是偶数</b>。</p>` },
    { id: "g1-s2", h: "2. 什么时候有圈；连通分支与边数", html: R`
      <ul>
        <li><b>每点度 $\ge2$ ⇒ 有圈</b>。证法：取最长的简单道路 $v_0,\dots,v_k$，$v_k$ 的另一个邻点 $x\ne v_{k-1}$ 必在路上（否则路能延长），$x=v_i$，$i\le k-2$，得到圈 $v_i,\dots,v_k,v_i$。</li>
        <li><b>至少一条边且全为偶度 ⇒ 有圈</b>（删去孤立点后每点度 $\ge2$）。</li>
        <li><b>$e(G)\ge|V(G)|$ ⇒ 有圈</b>（对 $n$ 归纳，每次删去一个度 $\le1$ 的点）。</li>
        <li>“$x,y$ 之间有道路”是等价关系，等价类的诱导子图是<b>连通分支</b>，个数记 $\beta_0(G)$。</li>
        <li><b>连通 ⇒ $e\ge n-1$</b>；一般地 $\beta_0(G)\ge n-e(G)$（对每个分支用 $e_i\ge n_i-1$ 再求和）。</li>
      </ul>
      <p>课上的糖果题（77 颗糖装袋，7 人或 11 人都能平分，至少 17 袋）就是把“袋”当成边、把“人”当成顶点，证明这个 18 点图连通，所以至少 17 条边。</p>` },
    { id: "g1-s3", h: "3. 欧拉路与欧拉圈", html: R`
      <p>允许重边。<b>欧拉路</b>：经过每条边恰好一次的道路；首尾相同叫<b>欧拉圈</b>。</p>
      <p><b>Euler 定理</b>：设 $G$ 连通。$G$ 有欧拉圈 ⇔ 奇度顶点有 0 个；$G$ 有欧拉路 ⇔ 奇度顶点有 0 或 2 个，且有 2 个时，欧拉路的两端就是这两个点。</p>
      <ul>
        <li><b>必要性</b>：每经过一次中间顶点，进边和出边配成一对，贡献 2 度；只有起点和终点各多出 1。</li>
        <li><b>充分性（全偶度）</b>：对边数归纳。取一个圈 $C$ 删去它的边，剩下每个分支仍全偶度，各有欧拉圈；每个分支都和 $C$ 有公共点，沿 $C$ 走，到公共点时插入该分支的欧拉圈。</li>
        <li><b>两个奇度点 $x,y$</b>：临时加一条边 $xy$，全偶度，取欧拉圈，再删掉这条边。</li>
      </ul>
      <p>七桥图的四块陆地度数为 $3,3,3,5$，有 4 个奇度点，所以没有欧拉路。<b>别忘了先检查连通</b>。</p>` }
  ],
  widget: null,
  concepts: [
    { id: "g1-c1", sec: "g1-s1", q: R`是否存在一个简单图，各顶点的度依次为 $3,3,2,2,1$？`,
      opts: [R`存在`, R`不存在：度数和是奇数`, R`不存在：度为 1 的点不能和度为 3 的点相邻`, R`要看顶点是否有标号`], a: 1,
      ex: R`$3+3+2+2+1=11$ 是奇数，与握手定理 $\sum d(v)=2e$ 矛盾。` },
    { id: "g1-c2", sec: "g1-s2", q: R`7 个顶点、4 条边的图至少有几个连通分支？`,
      opts: [R`1`, R`2`, R`3`, R`4`], a: 2,
      ex: R`$\beta_0\ge n-e=3$。一条 5 个顶点的简单道路加两个孤立点恰好 3 个分支。` },
    { id: "g1-c3", sec: "g1-s3", q: R`连通图 $G$ 恰有两个奇度顶点 $x,y$。下面正确的是：`,
      opts: [R`$G$ 有欧拉圈`, R`$G$ 有欧拉路，且它必以 $x,y$ 为两端`, R`$G$ 有欧拉路，可以从任意顶点出发`, R`$G$ 没有欧拉路`], a: 1,

    { id: "g1-c4", sec: "g1-s2", q: R`用“取最长简单道路 $v_0,\dots,v_k$”证明有圈时，关键的一步是：`,
      opts: [R`$v_k$ 的所有邻点都在这条路上，否则能延长`, R`$v_0$ 的度最大`, R`最长路一定经过所有顶点`, R`$v_k$ 的度为 1`], a: 0,
      ex: R`这是“极端原理”：最长路的端点没有路外的邻点。再加上 $d(v_k)\ge2$，就能找到路上较远的邻点，围成圈。` }
  ],
  methods: [
    { id: "m-hand", title: "握手定理与按度数计数", steps: [
      R`$\sum d(v)=2e$：用来求边数、推出奇度点个数为偶数、否定不可能的度数序列。`,
      R`数“以某点为顶点的结构”时按顶点求和，例如角的个数 $S=\sum_v\binom{d(v)}2$。`,
      R`需要不等式时配合 Cauchy–Schwarz：$n\sum d_i^2\ge(\sum d_i)^2=4e^2$。`] },
    { id: "m-extremal", title: "极端原理：取最长 / 最短道路", steps: [

    { id: "m-comp", title: "连通分支与边数", steps: [
      R`把图拆成分支 $G_1,\dots,G_b$，每个分支连通 ⇒ $e_i\ge n_i-1$。`,

    { id: "m-euler", title: "判定欧拉路 / 欧拉圈", steps: [
      R`先检查连通（孤立点可以忽略）。`,

      R`“最少几笔画完”：$2k$ 个奇度点至少要 $k$ 笔，加 $k$ 条辅助边可以做到。`] }

  problems: [
    { id: "g1-p1", lv: "真题", src: "2022 秋期末 1(1)", stmt: R`设 $G$ 是 $n$ 个顶点的简单图，且共有 $m$ 个连通分支。求 $G$ 的边数的最小值。`,
      hints: [R`每个分支连通，边数至少比顶点数少 1。`, R`求和：$e=\sum e_i\ge\sum(n_i-1)=n-m$。`, R`构造取等：一条 $n-m+1$ 个顶点的简单道路加 $m-1$ 个孤立点。`],
      method: "m-comp", sol: R`<p>设分支 $G_i$ 有 $n_i$ 个顶点、$e_i$ 条边。$G_i$ 连通 ⇒ $e_i\ge n_i-1$。所以 $e(G)=\sum_{i=1}^me_i\ge\sum(n_i-1)=n-m$。</p>
      <p>取等：一条有 $n-m+1$ 个顶点的简单道路（$n-m$ 条边）加上 $m-1$ 个孤立点，恰有 $m$ 个分支。最小值为 $n-m$。</p>` },
    { id: "g1-p2", lv: "真题", src: "2022 秋期末 1(2)", stmt: R`设 $n$ 阶连通简单图 $G$ 中每个顶点的度都是 2。请确定 $G$。`,
      hints: [R`每点度 $\ge2$ ⇒ 有简单圈 $C$。`, R`$C$ 上每个顶点的两条边都已经在 $C$ 上了，所以没有边离开 $C$。`, R`连通 ⇒ $V(G)=V(C)$，$G$ 就是 $n$ 阶圈图 $C_n$（$n\ge3$）。`],
      method: "m-extremal", sol: R`<p>每点度为 2，由成圈条件 $G$ 中有简单圈 $C$。$C$ 上每个顶点在 $C$ 上已有两条边，而它的度恰为 2，所以 $C$ 上的顶点没有其他边。</p>
      <p>若 $V(C)\ne V(G)$，由连通性存在一条边连接 $C$ 内一点和 $C$ 外一点，矛盾。所以 $V(G)=V(C)$，$E(G)=E(C)$，$G=C_n$（简单图要求 $n\ge3$）。</p>` },
    { id: "g1-p3", lv: "基础", src: "课件 11-17 例", stmt: R`主人有 77 颗糖，先装成若干非空袋。不论来 7 个还是 11 个小朋友，都要能把糖整袋分完、每人一样多。最少要装多少袋？`,
      hints: [R`7 人分法记为 $X_1,\dots,X_7$（每人 11 颗），11 人分法记为 $Y_1,\dots,Y_{11}$（每人 7 颗）。每袋在两种分法中各属于一人：在 $X_i,Y_j$ 之间连一条边。`, R`取一个连通分支，含 $k$ 个 $X$ 点和 $\ell$ 个 $Y$ 点，两侧数糖：$11k=7\ell$。`, R`$7\mid k\le7$，$11\mid\ell\le11$，所以分支包含全部 18 点，图连通，至少 17 条边。构造：把 77 颗排成一列，在 7 的倍数和 11 的倍数处都切开。`],
      method: "m-comp", sol: R`<p><b>建图</b>：顶点 $X_1,\dots,X_7,Y_1,\dots,Y_{11}$，每袋糖对应一条边（连接它在两种分法里的归属），可能有重边。</p>
      <p><b>连通</b>：取一个分支，含 $k$ 个 $X$ 点、$\ell$ 个 $Y$ 点。分支里的边就是一些袋，从两侧数糖得 $11k=7\ell$。$k,\ell\ge1$，$\gcd(7,11)=1$ ⇒ $7\mid k$，$11\mid\ell$，所以 $k=7$，$\ell=11$。图连通。</p>
      <p><b>下界</b>：合并重边后仍是 18 点连通图，至少 17 条边，所以至少 17 袋。</p>
      <p><b>构造</b>：把糖排成一列，在 $11,22,\dots,66$ 和 $7,14,\dots,70$ 处切开，共 $6+10=16$ 个不同切点（7 和 11 的公倍数只有 77），得到 17 袋：$7,4,3,7,1,6,5,2,7,2,5,6,1,7,3,4,7$。最少 17 袋。</p>` },
    { id: "g1-p4", lv: "基础", src: "自编", stmt: R`完全图 $K_n$（$n\ge2$）什么时候有欧拉圈？什么时候有欧拉路但没有欧拉圈？`,
      hints: [R`$K_n$ 连通，每点度为 $n-1$。`, R`$n$ 奇数时全为偶度。`, R`$n$ 偶数时 $n$ 个点都是奇度，只有 $n=2$ 时奇度点恰 2 个。`],
      method: "m-euler", sol: R`<p>$K_n$ 连通，每点度 $n-1$。$n$ 为奇数时全为偶度，有欧拉圈。$n$ 为偶数时 $n$ 个顶点全是奇度：$n=2$ 时恰 2 个，有欧拉路（就是那一条边）而无欧拉圈；$n\ge4$ 时奇度点多于 2 个，欧拉路也没有。</p>` }
  ],
  variants: [
    { id: "g1-v1", lv: "变种", src: "2022 秋期末 6(1)", stmt: R`在简单图 $G$ 中，称有公共顶点的两条边 $AB$、$AC$ 构成一个“角”，$A$ 为角的顶点。设 $G$ 的各顶点度数为 $d_1,\dots,d_n$，求角的总数 $S$。`,
      hints: [R`按角的顶点分类计数。`, R`以 $v$ 为顶点的角，就是从 $v$ 的 $d(v)$ 条边中选 2 条。`, R`$S=\sum_i\binom{d_i}2$。`],
      method: "m-hand", sol: R`<p>每个角恰有一个顶点。以 $v_i$ 为顶点的角由 $v_i$ 的两条不同的边决定，共 $\binom{d_i}2$ 个。所以 $S=\sum_{i=1}^n\binom{d_i}2=\frac12\sum d_i(d_i-1)$。</p>` },
    { id: "g1-v2", lv: "变种", src: "一笔画", stmt: R`连通图 $G$ 恰有 $2k$ 个奇度顶点（$k\ge1$）。证明：$G$ 的边可以分成 $k$ 条边不重复的道路，且 $k$ 是最少的条数。`,
      hints: [R`下界：每条道路只让两端的度数“变奇”。`, R`把边分成 $t$ 条道路后，每个奇度点至少是一条道路的端点，而端点一共 $2t$ 个。`, R`上界：把奇度点两两配对，加 $k$ 条新边，得到全偶度连通图，取欧拉圈，再删掉新边，圈断成 $k$ 段。`],
      method: "m-euler", sol: R`<p><b>下界</b>：设边分成 $t$ 条边不重复的道路。顶点 $v$ 每次作为某条道路的中间点出现，贡献 2 度；只有作为某条道路的起点或终点时才贡献 1 度（一条闭合道路的首尾在同一点，合起来贡献 2）。所以 $v$ 是奇度点 ⇒ $v$ 是某条非闭合道路的端点。$t$ 条道路至多 $2t$ 个端点，故 $2t\ge2k$，$t\ge k$。</p>
      <p><b>上界</b>：把 $2k$ 个奇度点配成 $k$ 对，每对之间加一条新边（允许重边），得到连通的全偶度图 $G'$，取它的欧拉圈。每个奇度点恰是一条新边的端点，所以 $k$ 条新边两两没有公共顶点，在欧拉圈中互不相邻。删去这 $k$ 条新边，欧拉圈恰好断成 $k$ 段非空的道路，它们边不重复，覆盖 $G$ 的全部边。</p>` }
  ],
  extensions: [
    { id: "g1-e1", lv: "延伸", src: "课件 11-17 · Ramsey", stmt: R`证明：任意 6 个人中，或者有 3 人两两相识，或者有 3 人两两不相识。并说明 5 个人时结论不成立。`,
      hints: [R`把 $K_6$ 的边染两色（相识 / 不相识）。任取一点 $A$，它的 5 条边中至少 3 条同色，设通向 $B,C,D$。`, R`看 $BC,BD,CD$：若有一条和这三条同色，就和 $A$ 组成同色三角形；否则 $B,C,D$ 两两之间都是另一色。`, R`5 人：把 $K_5$ 的边分成一个五边形 $C_5$ 和它的补图（也是五边形）。`],
      method: "m-extremal", sol: R`<p>把认识的两人连蓝边、不认识的连紫边，得到 $K_6$ 的二染色。任取 $A$，它的 5 条边中至少 3 条同色（抽屉原理），不妨为蓝色，通向 $B,C,D$。若 $BC,BD,CD$ 中有一条蓝边，比如 $BC$，则 $A,B,C$ 两两相识；否则三条都是紫边，$B,C,D$ 两两不相识。</p>
      <p>5 人反例：$1\text{-}2\text{-}3\text{-}4\text{-}5\text{-}1$ 相邻的人相识，其余不相识。相识关系是 $C_5$，不相识关系也是一个五边形 $1\text{-}3\text{-}5\text{-}2\text{-}4\text{-}1$，都没有三角形。</p>` },
    { id: "g1-e2", lv: "延伸", src: "经典结论", stmt: R`设简单图 $G$ 中每个顶点的度都 $\ge k$（$k\ge2$）。证明：$G$ 中有长度至少为 $k+1$ 的简单圈。`,
      hints: [R`取最长的简单道路 $v_0,v_1,\dots,v_\ell$。`, R`$v_\ell$ 的所有邻点都在路上，而且至少有 $k$ 个。`, R`取 $v_\ell$ 的邻点中下标最小的 $v_i$，则 $i\le\ell-k$。圈 $v_i,v_{i+1},\dots,v_\ell,v_i$ 的长度为 $\ell-i+1\ge k+1$。`],
      method: "m-extremal", sol: R`<p>取最长的简单道路 $v_0,\dots,v_\ell$。若 $v_\ell$ 有不在路上的邻点，路可延长，矛盾；所以 $v_\ell$ 的 $\ge k$ 个邻点都在 $\{v_0,\dots,v_{\ell-1}\}$ 中。</p>
      <p>这些邻点的下标互不相同且 $\le\ell-1$，其中最小的下标 $i$ 满足 $i\le\ell-k$。于是 $v_i,v_{i+1},\dots,v_\ell,v_i$ 是简单圈，长度 $\ell-i+1\ge k+1$。</p>` }
  ]
},

g2: {
  unit: "graph", n: 2, title: "树与普吕弗编码",
  goal: "熟记树的等价刻画；会手算普吕弗编码和还原（期末必考）；会用编码数树：Cayley 公式、指定度数、补全森林。",
  sections: [
    { id: "g2-s1", h: "1. 树的等价刻画", html: R`
      <p><b>树</b>：连通且无圈的简单图。森林：每个分支都是树。<b>叶</b>：度为 1 的点。对 $n$ 个顶点的图，下面几条互相等价：</p>
      <ul>
        <li>$T$ 是树（连通、无圈）；</li>
        <li>$T$ 连通，且删掉任何一条边都不连通（<b>极小连通</b>）；</li>
        <li>$T$ 无圈，且加上任何一条新边都产生圈（<b>极大无圈</b>）；</li>
        <li>$T$ 连通，且有 $n-1$ 条边；$T$ 无圈，且有 $n-1$ 条边；</li>
        <li>任意两点之间有且只有一条简单道路；</li>
        <li>$T$ 可以从一个点出发，每次添一个叶得到。</li>
      </ul>
      <p>$n\ge2$ 的树<b>至少有两个叶</b>：度数和 $2n-2$，若至多一个叶，则度数和 $\ge1+2(n-1)$。归纳证明树的命题时，标准动作是<b>删去一个叶</b>。</p>` },
    { id: "g2-s2", h: "2. 普吕弗编码：删最小的叶，记它的邻点", html: R`
      <p><b>编码</b>：设 $V(T)=[n]$，$n\ge2$。重复 $n-2$ 次：删去当前标号最小的叶 $x_i$，记下它的邻点 $y_i$。输出 $P(T)=(y_1,\dots,y_{n-2})$。（再删一次，最后剩下的一定是 $n$，所以 $y_{n-1}=n$ 不用记。）</p>
      <p><b>两个关键事实</b>：</p>
      <ul>
        <li><b>度数公式</b>：$d_T(v)=1+(v\text{ 在 }P(T)\text{ 中出现的次数})$。所以叶恰好是<b>没在序列里出现</b>的标号，叶数 $=n-|\{y_i\}|$。</li>
        <li><b>还原规则</b>：先补 $y_{n-1}=n$，再从左到右填 $x_i=\min\big([n]\setminus\{x_1,\dots,x_{i-1},y_i,\dots,y_{n-1}\}\big)$，即“排除左边已填的 $x$ 和下面从当前列到最右的 $y$，取剩下最小的”。边就是 $x_iy_i$。</li>
      </ul>
      <p>例（课件）：$n=6$，$P=(2,2,1,1)$。补 $y_5=6$，依次得 $x=(3,4,2,5,1)$，边 $23,24,12,15,16$。下面的工具可以输入任意序列，逐步看删叶过程。</p>` },
    { id: "g2-s3", h: "3. 用编码数树", html: R`
      <ul>
        <li><b>Cayley 公式</b>：编码是 $\{[n]\text{ 上的树}\}\to[n]^{n-2}$ 的双射，所以标号树有 $n^{n-2}$ 棵。$f(3)=3$，$f(4)=16$（12 条链 + 4 个星）。</li>
        <li><b>指定度数</b>：$d_T(i)=d_i$ ⇔ $i$ 在序列中恰出现 $d_i-1$ 次，树数 $=\frac{(n-2)!}{(d_1-1)!\cdots(d_n-1)!}$。</li>
        <li><b>只指定一个点的度</b>：例如 $[6]$ 上要求 $d(1)=4$：序列长 4，恰有 3 个 1，其余一个位置填非 1 的标号，$\binom41\cdot5=20$ 棵。</li>
        <li><b>补全森林</b>：$[n]$ 上的森林有 $k\ge2$ 个分支、大小 $s_1,\dots,s_k$，包含它的树有 $n^{k-2}s_1\cdots s_k$ 棵。特例：包含指定一条边的树有 $2n^{n-3}$ 棵。</li>
        <li><b>随机树</b>：独立均匀地抽 $Y_1,\dots,Y_{n-2}\in[n]$ 再还原，得到均匀分布的随机标号树。</li>
      </ul>` }
  ],

    { id: "g2-p3", lv: "真题", src: "2022 秋期末 4", stmt: R`<p>考虑以 $[n]$ 为顶点集的树 $T$，$P(T)=(y_1,\dots,y_{n-2})$ 是它的普吕弗序列。</p><p>(1) 令 $Y=\{y_1,\dots,y_{n-2}\}$（作为集合）。证明：$T$ 的叶的数目等于 $n-|Y|$。</p><p>(2) 设 $n=2m$（$m\ge2$），已知 $P(T)=(1,2,\dots,m-1,1,2,\dots,m-1)$。请确定树 $T$。</p>`,
      hints: [R`(1) 用度数公式：$d(v)=1+v$ 在序列中出现的次数。`, R`(2) 先算 $m=3$：$P=(1,2,1,2)$，$n=6$，还原得边 $31,42,51,12,26$。`, R`一般地：前 $m-1$ 列填 $m,m+1,\dots,2m-2$；第 $m$ 列填 $2m-1$；之后填 $1,2,\dots,m-2$，最后一列填 $m-1$。`],
      method: "m-prufer", sol: R`<p><b>(1)</b> 编码过程中，$v$ 每被记一次邻点，就失去一条边；$v$ 自己最后要么作为某个 $x_i$ 被删（再失去 1 条边），要么是剩下的 $n$（与 $x_{n-1}$ 相连的那 1 条边）。所以 $d_T(v)=1+\#\{i:y_i=v\}$。$v$ 是叶 ⇔ $d_T(v)=1$ ⇔ $v\notin Y$，叶数为 $n-|Y|$。</p>
      <p><b>(2)</b> 补 $y_{n-1}=2m$，按还原规则：</p>

      </ul>
      <p>所以 $T$ 是：一条链 $1-2-\cdots-(m-1)$，每个 $i$ 挂一个叶 $m+i-1$；另外 $1$ 再挂叶 $2m-1$，$m-1$ 再挂叶 $2m$。共 $(m-1)+1+(m-2)+1=2m-1$ 条边。自检：$1,\dots,m-1$ 的度都是 3，其余 $m+1$ 个点是叶。$m=2$ 时是以 1 为中心的星形树。</p>` },
    { id: "g2-p4", lv: "真题", src: "2024 秋期末 5（课件 11-17）", stmt: R`给定 $n=3m+2$（$m$ 为正整数）。顶点集为 $[n]$ 的树 $T$ 的普吕弗序列为 $(1,1,1,2,2,2,\dots,m,m,m)$。请画出（描述）树 $T$。`,

      method: "m-prufer", sol: R`<p>补 $y_{3m+1}=n$。按三列一组还原：</p>

        <li>第一组（$y=1$）：下方始终有 $1,\dots,m$ 和 $n$，依次填 $m+1,m+2,m+3$。</li>
        <li>第 $j$ 组（$y=j$，$2\le j\le m$）：开始时左边已用 $1,\dots,j-2$ 和 $m+1,\dots,m+2j-1$，下方需排除 $j,\dots,m,n$，所以依次填 $j-1,\ m+2j,\ m+2j+1$。</li>
        <li>末列：除 $m$、$n$ 外都已用过，填 $m$，边 $m\,n$。</li>

      <p>所以 $T$ 是一条链 $1-2-\cdots-m$；$1$ 挂叶 $m+1,m+2,m+3$；$j$（$2\le j\le m$）挂叶 $m+2j$、$m+2j+1$；$m$ 再连 $n=3m+2$。自检：$1,\dots,m$ 的度都是 4，边数 $3+3(m-1)+1=3m+1=n-1$。$m=1$ 时是以 1 为中心、叶为 2、3、4、5 的星形树。</p>` }

/* ---------------- MST1 ---------------- */
mst1: {
  unit: "mst", n: 1, title: "最便宜生成树：贪心与交换",
  goal: "会用 Kruskal 手算最便宜生成树；能用换边证明贪心、逆向删边和唯一性。30 分钟先做概念题、基础题和真题，变种与延伸可留到复盘。",
  sections: [
    { id: "mst1-s1", h: "1. 目标是总权最小，不是最短路", html: R`
      <p>设 $G=(V,E)$ 是有限、连通、无向加权图，$|V|=n$。生成树 $T$ 包含全部顶点、连通且无圈，恰有 $n-1$ 条边。<b>最便宜生成树</b>（最小生成树，MST）使 $w(T)=\sum_{e\in T}w(e)$ 最小；它不保证任意两点间的道路最短。</p>
      <p><b>Kruskal 算法</b>：从空边集开始，按权从小到大检查每条边；两端在不同连通分支就加入，在同一分支就跳过（加入会成圈）。选满 $n-1$ 条即结束。并列权可任选先后，可能得到不同的最优树。负权、零权也适用；原图不连通时只能得到各分支的最小生成森林。</p>
      <p>下面使用 <b>2022 秋期末 5(2)</b> 的原图数据，可对比“从轻到重加边”和“从重到轻删边”。图示布局重绘，边和权重逐项核对原卷。本课按作业 7 提前补齐；11-17 课件尚未讲到此模块。</p>` },
    { id: "mst1-s2", h: "2. 为什么贪心正确：割与圈都靠换一条边", html: R`
      <p><b>割</b>：取非空真子集 $S\subset V$，跨割边的一端在 $S$、另一端在 $V\setminus S$。<b>割性质</b>：跨割的最轻边至少属于某棵 MST；若它严格轻于其他跨割边，就属于每棵 MST。</p>
      <p>证明：取 MST $T$。若最轻边 $e$ 不在 $T$，加上它产生唯一圈；该圈上有另一条跨割边 $f$，且 $w(e)\le w(f)$。换成 $T-f+e$ 仍是树、总权不增，所以也是 MST。严格小于时，假设 $e\notin T$ 就会得到更便宜的树，矛盾。</p>
      <p><b>Kruskal 的不变量</b>：已选森林 $F$ 始终包含于某棵 MST。准备加入 $e=uv$ 时，取 $u$ 所在的 $F$ 分支为 $S$，$e$ 是跨此割的最轻边。取包含 $F$ 的 MST 换边，删掉的跨割边 $f$ 不在 $F$，所以新树仍包含 $F+e$。由空集归纳到 $n-1$ 条边，算法输出最优树。</p>
      <p><b>圈性质</b>：一个圈中严格最重的边不属于任何 MST；若只是并列最重，至少存在一棵 MST 不含它。理由：若树含该边，删边形成割，原圈上有另一条不更重的边跨割，可交换。注意“至少一棵”和“每一棵”的区别。</p>` },
    { id: "mst1-s3", h: "3. 逆向删边、唯一性与变目标", html: R`
      <p><b>逆向删边</b>：按权从大到小检查；删后仍连通就删，否则保留。注意只在<b>当前图</b>里检查连通性。最后连通且每边都是桥，因此是树；正确性用圈上的换边说明，见变种题。</p>
      <p><b>唯一性</b>：所有边权互不相同 ⇒ MST 唯一；反过来不成立，如三角形边权 $1,1,2$ 的 MST 仍唯一。若有并列权，不能直接断言唯一或不唯一。</p>
      <p><b>检验一棵候选树</b>：$T$ 是 MST 当且仅当每条非树边 $e=uv$ 都满足 $w(e)\ge\max_{f\in P_T(u,v)}w(f)$。若每处都严格大于，则 MST 唯一；若有相等，就能换边得到另一棵 MST。</p>
      <p>前述判据的充分性：若所有非树边满足它，取任意其他树 $T'$，删去 $e=uv\in T'\setminus T$ 得割。原树 $T$ 的道路 $P_T(u,v)$ 上存在跨此割的边 $f\in T\setminus T'$，且 $w(f)\le w(e)$。用 $f$ 替换 $e$，逐步把 $T'$ 变成 $T$，总权不增。严格情形总权必下降。</p>
      <p>目标改为正权乘积时，对权取 $\log$；改为最大边权时，任一 MST 都是最小瓶颈生成树，但逆命题未必成立。细节放在延伸题。</p>` }
  ],

  problems: [
    { id: "mst1-p1", lv: "基础", src: "自编", stmt: R`<p>无向图顶点为 $A,B,C,D$，边与权为 $AB:1,\ BC:2,\ AC:3,\ BD:4,\ CD:5$。用 Kruskal 求 MST 并判断是否唯一。</p>`,

      method: "m-mst-run", sol: R`<p>依次选 $AB(1),BC(2)$，跳过成圈的 $AC(3)$，选 $BD(4)$，已有 $4-1=3$ 条边，停止。总权 $1+2+4=7$。</p><p>非树边 $AC$ 的权 $3\gt\max(1,2)=2$；$CD$ 的权 $5\gt\max(2,4)=4$，所以唯一。也可直接用“全图边权互异”判唯一。</p>` },
    { id: "mst1-p2", lv: "真题", src: "2022 秋期末 5(2)（原图转写为边表）", stmt: R`
      <p>求下列无向加权图的最便宜生成树。顶点为 $A,B,C,D,E,F,G,H$，原图的全部边与权如下：</p>
      <div class="table-wrap"><table><thead><tr><th>边</th><th>权</th><th>边</th><th>权</th><th>边</th><th>权</th></tr></thead><tbody>

      <tr><td>$EG$</td><td>2</td><td>$EH$</td><td>6</td><td>$FG$</td><td>1</td></tr>
      </tbody></table></div><p>先独立计算，再用上面的逐步工具核对。加问（自编）：此图的 MST 是否唯一？</p>`,
      hints: [R`升序开始：$FG(1)$；权为 2 的 $AD,BE,EG$ 均可加入。`, R`接着选 $CE(3),DF(4)$。$AC(5)$ 已在同一分支内，跳过。`, R`$CF(6)$ 成圈，跳过；$EH(6)$ 接入最后的顶点 $H$。共 7 条边。`],

      <p>按权升序选入 $FG(1),AD(2),BE(2),EG(2),CE(3),DF(4)$。此时除 $H$ 外的七点已连通；$AC(5),CF(6)$ 都成圈，跳过。再选 $EH(6)$ 接入 $H$，得到</p>
      $$T=\{FG,AD,BE,EG,CE,DF,EH\},\qquad w(T)=1+2+2+2+3+4+6=20.$$
      <p><b>自检</b>：8 点、7 边，全连通。加问：非树边 $AC,CF,BH,CD,AB$ 的权与对应树上道路最大边权分别为 $5\gt4,6\gt4,7\gt6,8\gt4,9\gt4$，所以虽然有同权边，MST 仍唯一。</p>` }

  variants: [
    { id: "mst1-v1", lv: "变种", src: "2022 秋作业 7 · 作业1（教材练习 9.1.1）", stmt: R`<p>连通无向加权图中，把边按权从大到小逐条检查。若从当前图删掉该边后仍连通就删，否则保留。证明最后保留的边构成最便宜生成树。</p>`,
      hints: [R`不变量：当前图始终连通，并包含某棵原图的 MST。`, R`若当前边 $e$ 可删，则当前图中有一条不含 $e$ 的两端间道路。若 MST 含 $e$，删它得割，从该道路上选跨割边 $f$。`, R`$f$ 不可能是以前“删了就断开”的保留边（桥不会在后续删边时重新成圈）；所以尚未检查，$w(f)\le w(e)$。交换即可。`],
      method: "m-mst-swap", sol: R`
      <p>记当前图为 $H$。不变量为：$H$ 连通，且含某棵原图的 MST $T$。初始显然成立。当前检查 $e$：</p>
      <p>若删 $e$ 会断开，则保留，$H$ 不变。若可删且 $e\notin T$，直接删，不变量仍成立。若可删且 $e\in T$，在 $T-e$ 的两个分支间，从 $H-e$ 的一条连接道路中选跨割边 $f$，则 $T-e+f$ 是生成树。</p>
      <p>边 $e$ 位于 $H$ 的圈上，该圈上的 $f$ 不可能是以前被判定必须保留的边：那种边当时是桥，后来只删边，仍是桥。也不可能已被删除。因此 $f$ 尚未检查，降序检查给出 $w(f)\le w(e)$。于是 $T-e+f$ 总权不增，仍是 MST，且包含于删 $e$ 后的图，不变量保持。</p>
      <p>终止时图连通。每条保留边在被检查时都是桥，此后仍是桥，所以终图无圈，是生成树。它含一棵原图的 MST，故它自身就是该 MST。</p>` },
    { id: "mst1-v2", lv: "变种", src: "2022 秋作业 7 · 作业2（教材练习 9.2.3）", stmt: R`设 $G$ 连通且所有边权互不相同。证明其最便宜生成树唯一。`,
      hints: [R`反设有不同的 MST $T_1,T_2$。在对称差中取权最小的边 $e$。`, R`不妨 $e\in T_1\setminus T_2$。从 $T_1$ 删 $e$，得到一个割；$T_2$ 中连接 $e$ 两端的道路必经过该割。`, R`取道路上的跨割边 $f$。$f\notin T_1$，故在对称差中，$w(f)\gt w(e)$；在 $T_2$ 中换成更轻的 $e$。`],
      method: "m-mst-swap", sol: R`<p>若 $T_1\ne T_2$ 都为 MST，取 $T_1\triangle T_2$ 中最轻边 $e$，不妨 $e\in T_1\setminus T_2$。$T_1-e$ 给出割 $(S,V\setminus S)$；$T_2$ 中 $e$ 两端间的唯一路必有跨割边 $f$。</p><p>$T_1$ 中唯一跨此割的边是 $e$，所以 $f\in T_2\setminus T_1$。边权互异且 $e$ 是对称差最轻边，故 $w(e)\lt w(f)$。$T_2-f+e$ 仍是生成树而总权严格更小，与 $T_2$ 最优矛盾。因此唯一。</p>` }

  extensions: [
    { id: "mst1-e1", lv: "延伸", src: "2022 秋作业 7 · 作业3(a)（教材练习 9.2.4）", stmt: R`设连通图每条边的权 $c(e)\gt0$。如何求使 $\prod_{e\in T}c(e)$ 最小的生成树？说明理由。`,
      hints: [R`取严格递增的对数，把乘积变成和。`, R`令 $w(e)=\log c(e)$，则 $\log\prod c(e)=\sum w(e)$。`, R`对数保持边权的大小顺序，所以直接按原权运行 Kruskal 即可；$c(e)\lt1$ 也没问题。`],
      method: "m-mst-run", sol: R`<p>令 $w(e)=\log c(e)$。因为对数严格递增，最小化正数乘积等价于最小化 $\sum_{e\in T}w(e)$。在新权上运行 Kruskal 即可。对数不改变边的排序，所以直接按原权 $c(e)$ 运行 Kruskal，输出同时是一个最小乘积生成树。</p><p>$0\lt c(e)\lt1$ 时新权为负，Kruskal 仍适用。这里依靠生成树的贪心性质，不能对任意优化问题都说“严格递增变换保持最小总和”。</p>` },
    { id: "mst1-e2", lv: "延伸", src: "2022 秋作业 7 · 作业3(b)（教材练习 9.2.4）；反例为自编", stmt: R`<p>如何求使 $\max_{e\in T}c(e)$ 最小的生成树（最小瓶颈生成树）？证明任一 MST 都满足要求。最小瓶颈生成树一定是 MST 吗？</p>`,
      hints: [R`取 MST $T$ 的一条最重边 $e_*$，删它得到割。`, R`若某棵生成树所有边都严格轻于 $e_*$，它跨此割的边就可以替换 $e_*$，让总权更小。`, R`反例：三角形边权 $1,2,2$。三棵生成树的最大边权都是 2，但总权分别是 3、3、4。`],
      method: "m-mst-swap", sol: R`<p>先求一棵 MST $T$，设其最大边权为 $b=c(e_*)$。删去 $e_*$ 得割 $(S,V\setminus S)$。每条跨此割的边 $f$ 都满足 $c(f)\ge b$，否则 $T-e_*+f$ 的总权更小，与 MST 矛盾。任一生成树必跨此割，因此其最大边权至少为 $b$。$T$ 达到这个下界，故是最小瓶颈生成树。</p><p>逆命题不成立。三角形边权 $1,2,2$：任一生成树的瓶颈都是 2，但选择两条权为 2 的边，总权 4，大于最优总权 3。</p>` }
  ]
},

h1: {
  unit: "mst", n: 2, title: "Hall 匹配：从邻点集合到完美匹配",
  goal: "会检查 Hall 条件、用数边证明正则二部图有完美匹配，能把棋盘或代表元问题翻译成二部图。30 分钟先做概念题、基础题与 2022 期末第 3 题；变种和延伸留作复盘。",
  sections: [
    { id: "h1-s1", h: "1. 匹配与 Hall 条件：检查所有子集", html: R`
      <p>本课图均为有限二部图 $G=(A\sqcup B,E)$，边只连接左右两侧。<b>匹配</b>是端点互不重复的一组边；覆盖 $A$ 是指 $A$ 中每个点恰好匹配一次；<b>完美匹配</b>覆盖全部顶点。$|A|=|B|$ 时，覆盖 $A$ 就等于完美匹配。</p>
      <p>对 $S\subseteq A$，定义 $N(S)=\{b\in B:\text{存在 }a\in S,\ ab\in E\}$。这是邻点的<b>并集</b>，同一个邻点只计一次。</p>
      <p><b>Hall 定理</b>：存在覆盖 $A$ 的匹配，当且仅当</p>
      $$\text{对所有 }S\subseteq A,\qquad |N(S)|\ge|S|.$$
      <p>必要性：$S$ 中各点必须分配到不同邻点。充分性并不只是贪心挑邻点，完整证明见延伸。空集条件自动成立。<b>仅检查单点、仅检查 $A$ 全集，都不够</b>；下面的缺口示例同时通过这两种检查，却没有完美匹配。</p>` },
    { id: "h1-s2", h: "2. 证明 Hall：从 S 发出的边数，两头夹", html: R`
      <p>最常用的情形：所有点的度数都为同一正整数 $d$。任取 $S\subseteq A$，从 $S$ 发出的边恰为 $d|S|$ 条，全部进入 $N(S)$；而 $N(S)$ 中各点的总度数合计 $d|N(S)|$，可能还包括来自 $A\setminus S$ 的边。因此</p>
      $$d|S|=e(S,N(S))\le d|N(S)|.$$
      <p>因为 $d\gt0$，可约掉 $d$，得到 Hall 条件。若左右等大，就有完美匹配。事实上正则且 $d\gt0$ 时，数全部边 $d|A|=d|B|$ 已可推出左右等大。</p>
      <p><b>度不完全相同也可用</b>：若左侧最小度 $\ge r$，右侧最大度 $\le r$，$r\gt0$，则 $r|S|\le e(S,N(S))\le r|N(S)|$，仍能覆盖 $A$。</p>
      <p><b>原卷条件提醒</b>：2022 秋期末 3(2) 写了“所有点同度”，没有明写 $d\gt0$。若允许 $d=0$ 且两侧非空，空边图就是反例。下面引用时明确补上正度条件，不在证明中悄悄除以零。</p>` },
    { id: "h1-s3", h: "3. 建模与作答格式", html: R`
      <ul><li><b>棋盘</b>：左侧是行，右侧是列，有棋子的格子对应一条边；“各选一个且不同行不同列”就是完美匹配。</li>
      <li><b>不同代表元</b>：给集合 $X_1,\dots,X_m$ 各选不同的 $x_i\in X_i$。左侧是集合编号，右侧是可选元素；Hall 条件是 $\left|\bigcup_{i\in I}X_i\right|\ge|I|$ 对所有编号子集 $I$ 成立。</li>
      <li><b>证明存在</b>：定义两侧与边 → 任取 $S$ → 用数边推出 $|N(S)|\ge|S|$ → 引 Hall → 翻译回题目。</li>
      <li><b>证明不存在</b>：只需找一个坏子集 $S$，使 $|N(S)|\lt|S|$，不必列出所有可能的匹配。</li></ul>
      <p>术语别混淆：<b>最大匹配</b>的边数最多；<b>极大匹配</b>只表示无法直接再加边，允许通过换边增大时它未必最大。</p>` }
  ],
  widget: "hallPlay",
  concepts: [
    { id: "h1-c1", sec: "h1-s1", q: R`为了证明存在覆盖 $A$ 的匹配，Hall 条件要检查：`,
      opts: [R`只检查每个单点`, R`只检查 $S=A$`, R`所有 $S\subseteq A$`, R`只检查度最小的顶点`], a: 2,
      ex: R`单点都有邻居、全部邻点也足够，仍可能有若干左点共用过少的邻点。必须对所有子集成立。` },
    { id: "h1-c2", sec: "h1-s1", q: R`若 $|A|=3,|B|=4$ 且 Hall 条件成立，一定得到：`,
      opts: [R`覆盖 $A$ 的 3 条匹配边`, R`覆盖全部 7 点的完美匹配`, R`4 条匹配边`, R`每条边都属于某个完美匹配`], a: 0,
      ex: R`定理保证覆盖 $A$。右侧多一个点，不可能全部被匹配；7 个点也不可能由两两配对覆盖。` },
    { id: "h1-c3", sec: "h1-s2", q: R`正则二部图证明中，为什么是 $e(S,N(S))\le d|N(S)|$，而不总取等号？`,
      opts: [R`因为有自环`, R`$N(S)$ 的一些边可能来自 $A\setminus S$`, R`因为每条边要算两次`, R`因为 $S$ 必为空集`], a: 1,

  methods: [
    { id: "m-hall", title: "Hall 存在性：任取子集，双向数边", steps: [

      R`任取 $S\subseteq A$，把邻点并集记为 $N(S)$，不要重复计同一个邻点。`,
      R`从 $S$ 数边给下界，从 $N(S)$ 的总度给上界；例如 $r|S|\le e(S,N(S))\le r|N(S)|$，其中 $r\gt0$。`,
      R`得到所有子集的 Hall 条件，引用定理；若要完美匹配，再说明两侧等大。`] },
    { id: "m-hall-deficit", title: "找反例或求最大匹配：寻找邻点缺口", steps: [

      R`写出具体 $S,N(S)$，计算缺口 $|S|-|N(S)|$；正缺口即否定覆盖 $A$。`,
      R`缺口为 $k$ 时，至少有 $k$ 个左点无法匹配；再构造达到此界的匹配，证明最大。`,

  problems: [
    { id: "h1-p1", lv: "基础", src: "自编", stmt: R`<p>给集合 $X_1=\{1,2\},X_2=\{2,3\},X_3=\{1,3,4\},X_4=\{3,4\}$ 各选一个互不相同的代表元。</p><p>若改成 $X_1=X_2=X_3=\{1,2\},X_4=\{3,4\}$，还能选出四个不同代表元吗？最多能选几个？</p>`,
      hints: [R`第一组可直接构造，不一定要逐个检查 16 个子集。`, R`第二组看前三个集合的并集。`, R`前三个集合争两个元素，至少一个无法分配；再尝试构造 3 个代表元。`],
      method: "m-hall-deficit", sol: R`<p>第一组可取 $(x_1,x_2,x_3,x_4)=(1,2,3,4)$，彼此不同且各在对应集合中。</p><p>第二组取编号子集 $I=\{1,2,3\}$，对应元素并集只有 $\{1,2\}$，有 $2\lt3$，违反 Hall。至少一个集合不能分配代表元。取 $x_1=1,x_2=2,x_4=3$ 达到 3 个，所以最多为 3。</p>` },
    { id: "h1-p2", lv: "真题", src: "2022 秋期末 3(1)(2)（第 (2) 问补明正度条件）", stmt: R`<p>(1) 叙述 Hall 匹配定理。</p><p>(2) 设 $G=(A\sqcup B,E)$ 是二部图，$|A|=|B|=n$，每个顶点的度都等于同一正整数 $d$。证明 $G$ 存在完美匹配。</p>`,
      hints: [R`(1) 必须说清“所有左侧子集”和“覆盖左侧”。`, R`(2) 任取 $S\subseteq A$，从左侧数出的边数是 $d|S|$。`, R`这些边全部进入 $N(S)$，所以 $d|S|\le d|N(S)|$，再用 $d\gt0$。`],
      method: "m-hall", sol: R`<p>(1) 有限二部图 $G=(A\sqcup B,E)$ 存在覆盖 $A$ 的匹配，当且仅当对每个 $S\subseteq A$ 都有 $|N(S)|\ge|S|$。</p><p>(2) 任取 $S\subseteq A$。$S$ 中各点的 $d$ 条邻边都进入 $N(S)$，且在按左端点计数时每条边只计一次，故 $d|S|=e(S,N(S))\le\sum_{b\in N(S)}d(b)=d|N(S)|$。约去正数 $d$，得到 Hall 条件。由定理有覆盖 $A$ 的匹配；因两侧同为 $n$ 点，该匹配也覆盖 $B$，故为完美匹配。</p><p>若 $n\ge1$ 而允许 $d=0$，结论为假。这里已显式补上原卷漏写的必要条件。</p>` },
    { id: "h1-p3", lv: "真题", src: "2022 秋期末 3(3)", stmt: R`在 $8\times8$ 棋盘放置 24 个兵，每个兵占一格，每行每列都恰有 3 个兵。证明可以选出 8 个兵，使它们彼此既不同行，也不同列。`,
      hints: [R`左侧 8 个行顶点，右侧 8 个列顶点；格子里有兵才连边。`, R`每个顶点度数都是 3，上一道题已经证明正则二部图的结论。`, R`若不用上一问，直接对行集合 $S$ 写 $3|S|\le3|N(S)|$。`],
      method: "m-hall", sol: R`<p>建立二部图：左侧是行 $r_1,\dots,r_8$，右侧是列 $c_1,\dots,c_8$；当第 $i$ 行、第 $j$ 列的格子有兵时连接 $r_ic_j$。每行每列恰有 3 个兵，故每个顶点度数为 3。</p><p>对任意行集合 $S$，其发出的 $3|S|$ 条边全部进入 $N(S)$，每个邻列至多接收 3 条，故 $3|S|\le3|N(S)|$。Hall 给出完美匹配，其中 8 条边对应 8 个兵。匹配边端点不重复，恰好说明所选兵不同行也不同列。</p>` }
  ],
  variants: [
    { id: "h1-v1", lv: "变种", src: "自编：正则数边的推广", stmt: R`二部图 $G=(A\sqcup B,E)$ 中，$|A|=10,|B|=12$，左侧每点度数至少为 4，右侧每点度数至多为 4。证明能选出 10 条端点互不重复的边。能否称它为完美匹配？`,
      hints: [R`不需要知道各点的精确度数。`, R`对 $S\subseteq A$，有 $4|S|\le e(S,N(S))\le4|N(S)|$。`, R`覆盖左侧的 10 条边只覆盖右侧 10 个点，右侧还有两个点。`],
      method: "m-hall", sol: R`<p>任取 $S\subseteq A$，左侧度数下界给 $e(S,N(S))\ge4|S|$，右侧度数上界给 $e(S,N(S))\le4|N(S)|$，所以 Hall 条件成立。存在覆盖 $A$ 的匹配，包含 10 条边。</p><p>这不是完美匹配：右侧有 12 个点，必有两个未覆盖。实际上两侧不等大时不可能有覆盖全部顶点的匹配。</p>` }
  ],
  extensions: [
    { id: "h1-e1", lv: "延伸", src: "Hall 定理的增广路证明", stmt: R`证明 Hall 条件的充分性。可从一个边数最大的匹配 $M$ 出发，反设左侧存在未匹配点 $a_0$。`,
      hints: [R`从 $a_0$ 出发，左到右走非匹配边，右到左走匹配边，找交错道路可达的左集合 $S$ 与右集合 $T$。`, R`若可达右点未匹配，翻转到它的交错道路，就增加一条匹配边。`, R`所以 $T$ 全被匹配，且它们的匹配伙伴恰为 $S\setminus\{a_0\}$；还应证明 $N(S)=T$。`],
      method: "m-hall-deficit", sol: R`<p>取最大匹配 $M$，若不覆盖 $A$，取未匹配左点 $a_0$。沿“左到右非匹配边、右到左匹配边”搜索，记可达左点为 $S$，可达右点为 $T$。</p><p>若 $T$ 有未匹配右点，取到它的一条最短交错道路，翻转沿路各边是否属于匹配，可得到多一条边的匹配，与最大性矛盾。因此 $T$ 全部匹配。</p><p>每个 $b\in T$ 的匹配伙伴可达，属于 $S\setminus\{a_0\}$；每个 $a\in S\setminus\{a_0\}$ 都是通过它的匹配边到达，故对应唯一的 $T$ 中伙伴。这给出双射，$|T|=|S|-1$。</p><p>又有 $N(S)=T$：非匹配邻边可以沿搜索到达；$S$ 中非起点的匹配邻点本就可达，起点没有匹配邻点。反向包含由可达右点必来自左邻点可知。于是 $|N(S)|=|S|-1$，与 Hall 条件矛盾。故 $M$ 覆盖 $A$。</p>` },
    { id: "h1-e2", lv: "延伸", src: "自编：正则图的完美匹配分解", stmt: R`证明：任意有限 $d$-正则二部图（$d\ge1$）的边集可分解为 $d$ 个两两不相交的完美匹配。`,
      hints: [R`先由数边得到两侧等大，再用 Hall 找一组完美匹配。`, R`删除这组匹配后，每个顶点都恰好少一条边。`, R`剩余图是 $(d-1)$-正则二部图，归纳；$d=1$ 时整个边集就是匹配。`],
      method: "m-hall", sol: R`<p>对 $d$ 归纳。$d=1$ 时每点只有一条邻边，所有边即构成完美匹配。设 $d\ge2$。由 $d|A|=|E|=d|B|$ 得两侧等大，由 Hall 的数边证明得到一组完美匹配 $M_1$。</p><p>删去 $M_1$ 后，每点恰少一条边，剩余图仍为二部图且为 $(d-1)$-正则。由归纳假设，其边集可分解成 $d-1$ 组完美匹配。加上 $M_1$，得到所需的 $d$ 组；每组覆盖所有顶点，各组边互不相交。</p>` }
  ]
},

p1: {
  unit: "planar", n: 1, title: "平面图：Euler 公式与贪心染色",
  goal: "会数外部面、使用连通与非连通版本的 Euler 公式；会由面边计数排除平面性，并证明色数不超过最大度加一。30 分钟先做概念题、基础题和真题，变种与延伸选做。",
  sections: [
    { id: "p1-s1", h: "1. 平面嵌入与 Euler 公式", html: R`
      <p><b>可平面图</b>是能画在平面上且边只在公共端点相交的图；<b>平面嵌入</b>是这样的一种具体画法。一幅画有交叉，不代表这个抽象图不能重新画成无交叉图。</p>
      <p>记顶点数 $v$、边数 $e$、面数 $f$（<b>包括无界的外部面</b>），分支数为 $c$。对非空有限平面图，</p>
      $$v-e+f=1+c;\qquad\text{连通时 }v-e+f=2.$$
      <p><b>连通情形的证明</b>：树满足 $e=v-1,f=1$。若不是树，取圈上一条边删除，图仍连通，两个相邻面合并，$e,f$ 各减 1，$v-e+f$ 不变。反复删到树即得结论。非连通时可补 $c-1$ 条不相交的连分支边；这些边不分割面，再对连通图用公式。</p>
      <p><b>桥与圈边不同</b>：删除圈边会令 $f$ 减 1、$c$ 不变；删除桥会令 $c$ 加 1、$f$ 不变。下面图中的顶点位置固定，全部边都可无交叉地画出；试着删边，再亲自数面。</p>` },
    { id: "p1-s2", h: "2. 数面边：2e 等于各面边界长度之和", html: R`
      <p>每条边有两侧，因此 $\sum_F\deg(F)=2e$。这里按<b>边界行走的次数</b>计数：桥的两侧可能属于同一个面，但仍计两次。连通树只有一个面，边界长度为 $2e$。</p>
      <p>对<b>简单、可平面且 $v\ge3$</b> 的图，</p>
      $$e\le3v-6.$$
      <p>先证连通情形：每个面的边界长度至少为 3，所以 $3f\le2e$，与 $f=2-v+e$ 联立即得。若图不连通，先在分支间补边使其连通，再用该界，原来的边数更不会超过它。</p>
      <p>若还<b>不含三角形</b>，特别是简单二部可平面图，则面长至少为 4，得到</p>
      $$e\le2v-4\qquad(v\ge3).$$
      <p>不连通时补的连分支边不会产生新圈，所以仍保持无三角形。这些都是<b>必要条件</b>：超出上界即可判非平面；未超界只表示该检验没有排除它，不能直接判平面。例如把 $K_{3,3}$ 的一条边细分为两段，得到 $v=7,e=10$，满足 $e\le3v-6$，却仍非平面；细分点可沿两边的弧压回原边。</p>` },
    { id: "p1-s3", h: "3. 顶点染色：逐点贪心与删点归纳", html: R`
      <p><b>正常顶点染色</b>要求相邻顶点颜色不同，最少颜色数为 $\chi(G)$。2022 期末考的是适用于<b>任意有限简单图</b>的结论：</p>
      $$\chi(G)\le\Delta+1,\qquad\Delta=\max_x d(x).$$
      <p>证明：把顶点任意排序，依次用 $\Delta+1$ 种颜色染色。轮到某点时，已染色的邻点至多有 $\Delta$ 个，最多禁用 $\Delta$ 种颜色，至少还剩一种可用。每条边在后染色的端点处得到检查，因此最终相邻点颜色不同。</p>
      <p>平面图还能用平均度：简单平面图 $v\ge3$ 时 $2e/v\lt6$，所以至少有一个度不超过 5 的顶点。每个子图仍可平面，故可反复删低度点，再倒序用 6 色染回。完整归纳放在延伸题。</p>
      <p>不要把“当前这个顶点的度”与“整张图的最大度”混淆；高最大度也不代表色数一定高，例如有任意多个叶子的星形树只需 2 色。</p>` }
  ],
  widget: "planarPlay",
  concepts: [

  problems: [
    { id: "p1-p1", lv: "基础", src: "自编", stmt: R`分别求下列平面嵌入的面数（包括外部面）：(1) 立方体图，$v=8,e=12$；(2) 一棵 7 点树；(3) 两个互不相交的三角形。并求 (2) 唯一面的边界长度。`,
      hints: [R`前两个图连通，第三个有 2 个分支。`, R`树的边数为 $v-1$，而两个三角形有 $v=e=6$。`, R`树的每条边都要沿两个方向出现在同一个面的边界行走中。`],
      method: "m-planar-count", sol: R`<p>(1) 立方体图连通，$f=2-v+e=2-8+12=6$。平面画法中有 5 个有界面和 1 个外部面。</p><p>(2) 树有 $e=6,c=1$，故 $f=2-7+6=1$；唯一面是外部面，边界长度 $2e=12$。</p><p>(3) 两个三角形有 $v=6,e=6,c=2$，所以 $f=1+2-6+6=3$。可并排画出：两个内部面加一个共用外部面。</p>` },
    { id: "p1-p2", lv: "真题", src: "2022 秋期末 2(1)(2)", stmt: R`<p>(1) 叙述平面图的 Euler 公式。</p><p>(2) 设简单图 $G$ 每个顶点的度都不超过 $\Delta$，证明 $\chi(G)\le\Delta+1$。</p>`,
      hints: [R`(1) 记得说明连通性，以及面数包含外部面。`, R`(2) 将顶点任意排序，用 $\Delta+1$ 种颜色依次染色。`, R`当前顶点至多有 $\Delta$ 个已染色邻点，它们最多禁用 $\Delta$ 种颜色。`],
      method: "m-color-greedy", sol: R`<p>(1) 对有限连通平面图，若顶点、边、面数分别为 $v,e,f$，其中包括外部面，则 $v-e+f=2$。一般非空平面图若有 $c$ 个分支，则 $v-e+f=1+c$。</p><p>(2) 把顶点排成 $x_1,\dots,x_n$，准备 $\Delta+1$ 种颜色。依次给 $x_i$ 选一种不同于它已染色邻点的颜色。因为 $x_i$ 总邻点数至多为 $\Delta$，已染色邻点最多禁用 $\Delta$ 种颜色，总有一种颜色可选。</p><p>最终对任意边 $x_ix_j$，不妨 $i\lt j$，在给 $x_j$ 染色时已避开 $x_i$ 的颜色，故是正常染色。因此 $\chi(G)\le\Delta+1$。第 (2) 问不需要平面性假设。</p>` }

    { id: "p1-v1", lv: "变种", src: "经典例题", stmt: R`分别证明 $K_5$ 和 $K_{3,3}$ 不可平面。再说明为何不能用一般的 $e\le3v-6$ 直接排除 $K_{3,3}$。`,

      method: "m-planar-count", sol: R`<p>若 $K_5$ 可平面，由简单平面图的界应有 $10\le3\cdot5-6=9$，矛盾。</p><p>若 $K_{3,3}$ 可平面，由它是简单二部图，应有 $9\le2\cdot6-4=8$，矛盾。</p><p>只用一般界时，$K_{3,3}$ 的 $e=9\le3\cdot6-6=12$，检验通过，但这不是平面性的证明。选用“二部 / 无三角形”的额外条件才能得到本题需要的矛盾。</p>` },
    { id: "p1-v2", lv: "变种", src: "自编：Euler 与面边双计数", stmt: R`某连通简单平面图有 12 个顶点、21 条边，每个面（包括外部面）的边界长度都是 3 或 4。求三边面和四边面的数目。`,
      hints: [R`先由 Euler 公式求总面数 $f$。`, R`设三边面、四边面数分别为 $t,q$，则 $t+q=f$。`, R`面边总次数为 $3t+4q=2e=42$，不是 $e$。`],
      method: "m-planar-count", sol: R`<p>连通，所以 $f=2-12+21=11$。设两类面数为 $t,q$，则 $t+q=11$，又由每条边计两侧得 $3t+4q=42$。</p><p>用第二式减去第一式的 3 倍，得 $q=9$；于是 $t=2$。自检：$2+9=11$，$3\cdot2+4\cdot9=42=2e$。</p>` }
  ],
  extensions: [
    { id: "p1-e1", lv: "延伸", src: "经典结论：简单平面图六色定理", stmt: R`只用 Euler 边数界和归纳法，证明任意有限简单可平面图都能用至多 6 种颜色正常染色。`,
      hints: [R`$v\le2$ 时直接成立。$v\ge3$ 时由 $e\le3v-6$ 得平均度严格小于 6。`, R`因此存在度不超过 5 的顶点 $x$，删掉它后仍是简单可平面图。`, R`剩余图由归纳假设能 6 色染色，再把 $x$ 染回；邻点至多禁用 5 色。`],
      method: "m-color-greedy", sol: R`<p>按顶点数归纳。顶点数不超过 2 时显然成立。设 $v\ge3$，由 $2e\le6v-12\lt6v$，图中必有顶点 $x$ 满足 $d(x)\le5$，否则度数和至少为 $6v$。</p><p>删去 $x$ 后仍为简单可平面图，由归纳假设可用至多 6 色正常染色。再给 $x$ 染色，其至多 5 个邻点最多禁用 5 色，尚有一种可选。故原图也能 6 色染色。证明不要求原图连通。</p>` }

let samplePromise = null;

const SAMPLE_MSG = { not_granted: "你没有允许这一页调用 Claude，批改功能已关闭。可以回到对话里让 Claude 批改。", sampling_disabled: "这个账号暂时不能在页面里调用 Claude。", rate_limited: "调用太频繁了，过一会儿再试。", session_expired: "登录过期了，刷新后再试。", refused: "这次没有得到批改结果，换个写法再试。", empty_completion: "没有得到批改结果，再试一次。" };
async function gradeProb(id, btn) {
  const p = findProb(id);
  const ta = document.getElementById("ans-" + id);
  const msg = document.querySelector(`[data-gmsg="${id}"]`);
  const answer = (ta.value || "").trim();
  if (!answer) { msg.textContent = "先写一点作答再批改。"; return; }
  save(id, { answer: ta.value });
  const sample = await getSample();
  if (!sample) { msg.textContent = "这里调用不了 Claude。作答已保存，回到对话里说“批改我的离散作答”即可。"; return; }
  btn.disabled = true;
  msg.textContent = "批改中，通常要 10–40 秒…";
  const prompt = `你是清华大学《离散数学》的阅卷助教，批改一道期末复习题。\n\n【题目】\n${textOf(p.stmt)}\n\n【参考解答】\n${textOf(p.sol)}\n\n【学生作答】\n${answer}\n\n请按以下格式用中文回答，简洁，公式用 $...$：\n得分：x/10\n问题：逐条列出逻辑漏洞或计算错误（特别检查：中值点或极值点的存在依据、介值定理是否在自变量区间上使用、o(·) 运算是否合法、需要证明的存在性是否证明了、特殊情形是否漏掉）。没有问题就写“无”。\n建议：一条最关键的改进建议。`;
  let out = "";
  try {
    const { text } = await sample(prompt, { cache: false, onText: ({ text }) => { out = text; msg.textContent = "批改中…"; } });
    out = text;
    save(id, { feedback: out, gradedAt: Date.now() });
    rerenderProb(id);
  } catch (err) {
    const code = err && err.code;
    if (code === "cancelled") { msg.textContent = ""; }
    else msg.textContent = SAMPLE_MSG[code] || "批改中断了，稍后再试。";
    if (err && err.text) { save(id, { feedback: err.text + "\n（批改中断）" }); rerenderProb(id); }
  } finally {
    const b = document.querySelector(`[data-grade="${id}"]`);
    if (b) b.disabled = false;
  }
}

/* ================= 交互工具：中国剩余定理 ================= */
function crtCalc(mount) {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
  const inv = (a, m) => { let [r0, r1, s0, s1] = [((a % m) + m) % m, m, 1, 0]; while (r1) { const q = Math.floor(r0 / r1); [r0, r1] = [r1, r0 - q * r1]; [s0, s1] = [s1, s0 - q * s1]; } return r0 === 1 ? ((s0 % m) + m) % m : null; };
  const mod = (a, m) => ((a % m) + m) % m;
  let rows = [[2, 3], [3, 5], [2, 7]];
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><span>输入 $x\\equiv a_i\\pmod{m_i}$，模数 2–999，至多 5 个方程。</span></div>
    <div id="crow" class="crt-rows"></div>
    <div class="ctrl"><button class="btn" id="cadd" type="button">＋ 加一个方程</button><button class="btn" id="cdel" type="button">－ 删最后一个</button><button class="btn" id="cdemo" type="button">换成例题</button></div>
    <div class="table-wrap" id="ctab"></div>
    <div class="readout" id="cout"></div>
  </div>`;
  const demos = [[[2, 3], [3, 5], [2, 7]], [[2, 3], [3, 4], [1, 5]], [[3, 7], [5, 11], [7, 13]], [[3, 6], [5, 8]], [[3, 6], [4, 8]]];
  let di = 0;
  const box = $("#crow", mount);
  function renderRows() {
    box.innerHTML = rows.map(([a, m], i) => `<div class="ctrl"><label>x ≡ <input type="number" data-i="${i}" data-k="0" value="${a}" aria-label="第 ${i + 1} 个余数"></label><label>(mod <input type="number" data-i="${i}" data-k="1" value="${m}" min="2" max="999" aria-label="第 ${i + 1} 个模数">)</label></div>`).join("");
    box.querySelectorAll("input").forEach(el => el.addEventListener("input", () => { rows[+el.dataset.i][+el.dataset.k] = Math.trunc(+el.value || 0); calc(); }));
    calc();
  }
  function calc() {
    const out = $("#cout", mount), tab = $("#ctab", mount);
    if (rows.some(([, m]) => !(m >= 2 && m <= 999))) { tab.innerHTML = ""; out.innerHTML = "<span>模数要在 2 到 999 之间。</span>"; return; }
    const bad = [];
    for (let i = 0; i < rows.length; i++) for (let j = i + 1; j < rows.length; j++) { const g = gcd(rows[i][1], rows[j][1]); if (g > 1) bad.push([i, j, g]); }
    if (!bad.length) {
      const M = rows.reduce((s, [, m]) => s * BigInt(m), 1n);
      let x = 0n;
      const tr = rows.map(([a, m]) => { const N = M / BigInt(m), Nm = Number(N % BigInt(m)), L = inv(Nm, m), Mi = N * BigInt(L); x += BigInt(mod(a, m)) * Mi; return `<tr><td>${m}</td><td>${mod(a, m)}</td><td>${N}</td><td>${Nm}</td><td>${L}</td><td>${Mi}</td></tr>`; }).join("");
      x %= M;
      tab.innerHTML = `<table><thead><tr><th>m<sub>i</sub></th><th>a<sub>i</sub></th><th>N<sub>i</sub> = M/m<sub>i</sub></th><th>N<sub>i</sub> mod m<sub>i</sub></th><th>L<sub>i</sub> = 逆元</th><th>M<sub>i</sub> = N<sub>i</sub>L<sub>i</sub></th></tr></thead><tbody>${tr}</tbody></table>`;
      out.innerHTML = `<span>M = <b>${M}</b></span><span>x ≡ Σ a<sub>i</sub>M<sub>i</sub> ≡ <b>${x}</b> (mod ${M})</span><span>验算：${rows.map(([, m]) => `${x} mod ${m} = ${Number(x % BigInt(m))}`).join("，")}</span>`;
      return;
    }
    // 模数不互素：逐个合并
    let [a0, m0] = [mod(rows[0][0], rows[0][1]), rows[0][1]], steps = [], ok = true;
    for (let i = 1; i < rows.length && ok; i++) {
      const [b, n] = [mod(rows[i][0], rows[i][1]), rows[i][1]], g = gcd(m0, n);
      if ((b - a0) % g) { steps.push(`合并第 ${i + 1} 个：gcd(${m0}, ${n}) = ${g} 不整除 ${b} − ${a0}，<b>无解</b>`); ok = false; break; }
      const n1 = n / g, m1 = m0 / g, c = (b - a0) / g;
      const t = n1 === 1 ? 0 : mod(c * inv(m1 % n1, n1), n1), l = m1 * n;
      if (l > 1e12) { steps.push("模数太大，停止合并。"); ok = false; break; }
      const na = mod(a0 + m0 * t, l);
      steps.push(`合并第 ${i + 1} 个：x = ${a0} + ${m0}t，${m0}t ≡ ${b - a0} (mod ${n})，t ≡ ${t} (mod ${n / g})，得 x ≡ ${na} (mod ${l})`);
      [a0, m0] = [na, l];
    }
    tab.innerHTML = `<div class="prose small"><p>模数不两两互素（${bad.map(([i, j, g]) => `m<sub>${i + 1}</sub>, m<sub>${j + 1}</sub> 的公因数 ${g}`).join("；")}），不能直接用 N、L、M 公式，改用逐个合并：</p><ol>${steps.map(s => `<li>${s}</li>`).join("")}</ol></div>`;
    out.innerHTML = ok ? `<span>x ≡ <b>${a0}</b> (mod ${m0})</span><span>验算：${rows.map(([, m]) => `${a0} mod ${m} = ${a0 % m}`).join("，")}</span>` : `<span>方程组<b>无解</b></span>`;
  }
  $("#cadd", mount).addEventListener("click", () => { if (rows.length < 5) { rows.push([1, [11, 13, 17, 19, 23][rows.length % 5]]); renderRows(); } });
  $("#cdel", mount).addEventListener("click", () => { if (rows.length > 2) { rows.pop(); renderRows(); } });
  $("#cdemo", mount).addEventListener("click", () => { di = (di + 1) % demos.length; rows = demos[di].map(r => r.slice()); renderRows(); });
  renderRows();
  typeset(mount);
}

      <label for="pn">n = <input id="pn" type="number" value="6" min="2" max="16" style="width:4.5em"></label>

    <div class="legend"><span><i style="background:var(--accent)"></i>这一步删去的叶 x<sub>i</sub></span><span><i style="background:var(--teal)"></i>它的邻点 y<sub>i</sub></span><span><i style="background:var(--line)"></i>已删去</span></div>
    <div class="table-wrap" id="ptab"></div>
    <div class="readout" id="pout"></div>
    <p class="small muted">表格从左往右读是编码（删最小的叶、记邻点），从右往左添边是还原。n 不填时取序列长度 + 2。</p>
  </div>`;
  const seqIn = $("#pseq", mount), nIn = $("#pn", mount), stepIn = $("#pstep", mount);
  let T = null;
  function decode(y, n) {
    const ys = y.concat([n]), used = new Set(), xs = [];
    for (let i = 0; i < n - 1; i++) {
      const ex = new Set([...used, ...ys.slice(i)]);
      let x = 1; while (ex.has(x)) x++;
      xs.push(x); used.add(x);
    }
    return { n, xs, ys, edges: xs.map((x, i) => [x, ys[i]]) };
  }
  function layout(t) {
    const adj = Array.from({ length: t.n + 1 }, () => []);
    t.edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
    const depth = Array(t.n + 1).fill(-1), order = [], par = Array(t.n + 1).fill(0);
    depth[t.n] = 0; const q = [t.n];
    while (q.length) { const v = q.shift(); order.push(v); adj[v].sort((a, b) => a - b).forEach(w => { if (depth[w] < 0) { depth[w] = depth[v] + 1; par[w] = v; q.push(w); } }); }
    // 叶子按 DFS 顺序排横坐标，内点取子节点平均
    const pos = {}, kids = v => adj[v].filter(w => w !== par[v] && depth[w] === depth[v] + 1);
    let cur = 0;
    (function dfs(v) { const ks = kids(v); if (!ks.length) { pos[v] = cur++; return; } ks.forEach(dfs); pos[v] = ks.reduce((s, w) => s + pos[w], 0) / ks.length; })(t.n);
    const D = Math.max(...depth.slice(1));
    return { x: pos, y: depth, W: Math.max(cur, 1), D };
  }
  function build() {
    const raw = seqIn.value.split(/[^0-9]+/).filter(Boolean).map(Number);
    let n = +nIn.value || raw.length + 2;
    const out = $("#pout", mount);
    if (n !== raw.length + 2) { n = raw.length + 2; nIn.value = n; }
    if (n < 2 || n > 16) { T = null; out.innerHTML = "<span>序列长度要在 0 到 14 之间（n 为 2–16）。</span>"; $("#psvg", mount).innerHTML = ""; $("#ptab", mount).innerHTML = ""; return; }
    if (raw.some(v => v < 1 || v > n)) { T = null; out.innerHTML = `<span>序列里的数都要在 1 到 ${n} 之间。</span>`; $("#psvg", mount).innerHTML = ""; $("#ptab", mount).innerHTML = ""; return; }
    T = decode(raw, n); T.L = layout(T);
    stepIn.max = n - 1; if (+stepIn.value > n - 1) stepIn.value = 0;
    const cnt = {}; raw.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
    const leaves = []; for (let v = 1; v <= n; v++) if (!cnt[v]) leaves.push(v);
    out.innerHTML = `<span>边：${T.edges.map(([a, b]) => Math.min(a, b) + "–" + Math.max(a, b)).join("，")}</span><span>叶（没在序列里出现的标号）：${leaves.join("、")}，共 ${leaves.length} 个</span><span>度数 = 1 + 出现次数：${Object.keys(cnt).map(v => `d(${v}) = ${1 + cnt[v]}`).join("，") || "全是叶"}</span>`;
    draw();
  }
  function draw() {
    if (!T) return;
    const k = +stepIn.value, n = T.n, { x, y, W, D } = T.L;
    $("#pstepv", mount).textContent = k === 0 ? "原树" : k <= n - 2 ? `第 ${k} 步：删 ${T.xs[k - 1]}，记 ${T.ys[k - 1]}` : `第 ${k} 步：删 ${T.xs[k - 1]}，只剩 ${n}`;
    const VW = 640, VH = 70 + 70 * D, px = v => 30 + (W === 1 ? (VW - 60) / 2 : x[v] / (W - 1) * (VW - 60)), py = v => 30 + y[v] * 70;
    const gone = new Set(T.xs.slice(0, Math.max(0, k - 1))), cx = k ? T.xs[k - 1] : null, cy = k ? T.ys[k - 1] : null;
    const edges = T.edges.map(([a, b], i) => { const del = i < k - 1, now = i === k - 1; return `<line x1="${px(a)}" y1="${py(a)}" x2="${px(b)}" y2="${py(b)}" style="stroke:var(${now ? "--accent" : del ? "--line" : "--ink"});stroke-width:${now ? 3.5 : 2}${del ? ";stroke-dasharray:4 4" : ""}"/>`; }).join("");
    const nodes = []; for (let v = 1; v <= n; v++) {
      const fill = v === cx ? "--accent" : v === cy ? "--teal" : gone.has(v) ? "--bg" : "--surface", ink = v === cx || v === cy ? "--accent-ink" : gone.has(v) ? "--muted" : "--ink";
      nodes.push(`<g><circle cx="${px(v)}" cy="${py(v)}" r="14" style="fill:var(${fill});stroke:var(${gone.has(v) ? "--line" : "--ink"});stroke-width:1.5"/><text x="${px(v)}" y="${py(v) + 4.5}" text-anchor="middle" style="fill:var(${ink});font:600 13px var(--f-mono)">${v}</text></g>`);
    }
    $("#psvg", mount).innerHTML = `<svg viewBox="0 0 ${VW} ${VH}" style="width:100%;max-height:360px;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="由普吕弗序列还原出的树">${edges}${nodes.join("")}</svg>`;
    const th = T.xs.map((_, i) => `<th style="text-align:center${i === k - 1 ? ";color:var(--accent)" : ""}">${i + 1}</th>`).join("");
    const row = (arr, lab) => `<tr><td>${lab}</td>${arr.map((v, i) => `<td style="text-align:center${i === k - 1 ? ";font-weight:700;color:var(--accent)" : i < k - 1 ? ";color:var(--muted)" : ""}">${v}</td>`).join("")}</tr>`;
    $("#ptab", mount).innerHTML = `<table><thead><tr><th>i</th>${th}</tr></thead><tbody>${row(T.xs, "x<sub>i</sub> 删去的叶")}${row(T.ys.map((v, i) => i === n - 2 ? v + "*" : v), "y<sub>i</sub> 邻点")}</tbody></table><p class="small muted">* 末项 y<sub>n−1</sub> = n 是补上的，不属于序列。</p>`;
  }
  seqIn.addEventListener("input", () => { nIn.value = ""; build(); });
  nIn.addEventListener("change", () => { const n = +nIn.value; if (n >= 2 && n <= 16) { const raw = seqIn.value.split(/[^0-9]+/).filter(Boolean).map(Number); while (raw.length < n - 2) raw.push(1); raw.length = n - 2; seqIn.value = raw.join(","); } build(); });
  stepIn.addEventListener("input", draw);
  $("#prand", mount).addEventListener("click", () => { const n = 6 + Math.floor(Math.random() * 5); seqIn.value = Array.from({ length: n - 2 }, () => 1 + Math.floor(Math.random() * n)).join(","); nIn.value = n; stepIn.value = 0; build(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  build();
}


/* ================= 交互工具：最便宜生成树 ================= */
function mstPlay(mount) {
  const nodes = { A: [55, 155], B: [175, 45], C: [230, 155], D: [175, 265], E: [415, 155], F: [345, 265], G: [545, 265], H: [545, 45] };
  const edges = [["A", "B", 9], ["A", "C", 5], ["A", "D", 2], ["B", "E", 2], ["B", "H", 7], ["C", "E", 3], ["C", "D", 8], ["C", "F", 6], ["D", "F", 4], ["E", "G", 2], ["E", "H", 6], ["F", "G", 1]];
  const key = e => e[0] + e[1];
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="mst-mode">算法 <select id="mst-mode"><option value="add">Kruskal：从轻到重加边</option><option value="delete">逆向：从重到轻删边</option></select></label></div>
    <div class="ctrl"><button class="btn" id="mst-prev" type="button">上一步</button><button class="btn" id="mst-next" type="button">下一步</button><button class="btn" id="mst-reset" type="button">重置</button></div>
    <div class="ctrl"><label for="mst-step">检查边数 <input id="mst-step" type="range" min="0" max="12" value="0"></label><b class="mono" id="mst-step-label"></b></div>
    <div id="mst-graph"></div>
    <div class="legend"><span><i style="background:var(--teal)"></i>已选 / 必须保留</span><span><i style="background:var(--accent)"></i>本步检查</span><span><i style="background:var(--line)"></i>虚线：跳过 / 已删除</span></div>
    <div class="readout" id="mst-out" aria-live="polite"></div>
    <div class="table-wrap" id="mst-table"></div>
    <p class="small muted">权相同按边名字母序检查。加边模式选满 7 条即可停；工具继续显示剩余边的成圈检查，方便核对。切换算法从第 0 步开始。</p>
  </div>`;
  const mode = $("#mst-mode", mount), slider = $("#mst-step", mount);
  let steps = [], ordered = [];
  function components(keys) {
    const parent = Object.fromEntries(Object.keys(nodes).map(v => [v, v]));
    function root(v) { while (parent[v] !== v) v = parent[v]; return v; }
    for (const e of edges) if (keys.has(key(e))) parent[root(e[0])] = root(e[1]);
    return { root, count: new Set(Object.keys(nodes).map(root)).size };
  }
  function rebuild() {
    const deleting = mode.value === "delete";
    ordered = edges.slice().sort((a, b) => (deleting ? b[2] - a[2] : a[2] - b[2]) || key(a).localeCompare(key(b)));
    const present = new Set(deleting ? edges.map(key) : []), kept = new Set(), removed = new Set();
    steps = [{ present: new Set(present), kept: new Set(), removed: new Set(), message: deleting ? "从完整图开始，检查删边后是否仍连通。" : "从空森林开始，检查边的两端是否属于不同分支。" }];
    for (const e of ordered) {
      const id = key(e);
      let message;
      if (deleting) {
        present.delete(id);
        if (components(present).count === 1) { removed.add(id); message = `删除 ${id}（权 ${e[2]}）：删后仍连通。`; }
        else { present.add(id); kept.add(id); message = `保留 ${id}（权 ${e[2]}）：它是当前图的桥，删后不连通。`; }
      } else {
        const c = components(present);
        if (c.root(e[0]) !== c.root(e[1])) { present.add(id); kept.add(id); message = `选入 ${id}（权 ${e[2]}）：连接两个不同分支。`; }
        else { removed.add(id); message = `跳过 ${id}（权 ${e[2]}）：两端已连通，加入会成圈。`; }
      }
      steps.push({ present: new Set(present), kept: new Set(kept), removed: new Set(removed), message });
    }
    slider.value = 0;
    draw();
  }
  function draw() {
    const k = +slider.value, s = steps[k], current = k ? key(ordered[k - 1]) : "", deleting = mode.value === "delete";
    $("#mst-step-label", mount).textContent = `${k} / ${ordered.length}`;
    $("#mst-prev", mount).disabled = k === 0;
    $("#mst-next", mount).disabled = k === ordered.length;
    const lines = edges.map(e => {
      const id = key(e), [x1, y1] = nodes[e[0]], [x2, y2] = nodes[e[1]], gone = s.removed.has(id);
      const color = id === current ? "--accent" : gone ? "--line" : s.kept.has(id) ? "--teal" : "--muted";
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 9;
      return `<g><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(${color});stroke-width:${id === current ? 4 : 2.5}${gone ? ";stroke-dasharray:6 5" : ""}"/><circle cx="${mx}" cy="${my}" r="11" style="fill:var(--bg)"/><text x="${mx}" y="${my + 4}" text-anchor="middle" style="fill:var(--ink);font:600 14px var(--f-mono)">${e[2]}</text></g>`;
    }).join("");
    const circles = Object.entries(nodes).map(([v, [x, y]]) => `<g><circle cx="${x}" cy="${y}" r="17" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.5"/><text x="${x}" y="${y + 5}" text-anchor="middle" style="fill:var(--ink);font:600 15px var(--f-mono)">${v}</text></g>`).join("");
    $("#mst-graph", mount).innerHTML = `<svg viewBox="0 0 600 310" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="2022 秋期末最便宜生成树原图，当前第 ${k} 步；边与判断详见下表">${lines}${circles}</svg>`;
    const total = edges.filter(e => s.present.has(key(e))).reduce((sum, e) => sum + e[2], 0);
    const done = s.present.size === 7 && components(s.present).count === 1;
    $("#mst-out", mount).innerHTML = `<span>${s.message}</span><span>${deleting ? "当前剩余" : "已选"} ${s.present.size} 条边，${components(s.present).count} 个分支，总权 ${total}${done ? "；已得到 MST，总权 20。" : "。"}</span>`;
    const rows = ordered.map((e, i) => `<tr${i === k - 1 ? ' style="font-weight:700;color:var(--accent)"' : ""}><td>${key(e)}</td><td>${e[2]}</td><td>${i >= k ? "待检查" : s.removed.has(key(e)) ? (deleting ? "删除：仍连通" : "跳过：成圈") : (deleting ? "保留：桥" : "选入：连接分支")}</td></tr>`).join("");
    $("#mst-table", mount).innerHTML = `<table><thead><tr><th>边</th><th>权</th><th>判断</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  slider.addEventListener("input", draw);
  mode.addEventListener("change", rebuild);
  $("#mst-prev", mount).addEventListener("click", () => { slider.value = Math.max(0, +slider.value - 1); draw(); });
  $("#mst-next", mount).addEventListener("click", () => { slider.value = Math.min(ordered.length, +slider.value + 1); draw(); });
  $("#mst-reset", mount).addEventListener("click", () => { slider.value = 0; draw(); });
  rebuild();
}


/* ================= 交互工具：Hall 邻点集合 ================= */
function hallPlay(mount) {
  const samples = {
    good: [[0, 1], [1, 2], [0, 2, 3], [2, 3]],
    bad: [[0, 1], [0, 1], [0, 1], [2, 3]],
    zero: [[], [], [], []]
  };
  mount.innerHTML = `<div class="widget">
    <div class="ctrl"><label for="hall-case">例图 <select id="hall-case"><option value="good">有完美匹配</option><option value="bad">单点与全集检查通过，仍有缺口</option><option value="zero">零度正则图</option></select></label></div>
    <div class="ctrl" id="hall-subset">选左侧集合 S：${[0, 1, 2, 3].map(i => `<label><input type="checkbox" value="${i}"${i < 3 ? " checked" : ""}> a${i + 1}</label>`).join("")}</div>
    <div class="ctrl"><button class="btn" id="hall-find" type="button">寻找 Hall 缺口</button><label><input id="hall-matching" type="checkbox"> 显示一组最大匹配</label></div>
    <div id="hall-graph"></div><div class="readout" id="hall-out" aria-live="polite"></div>
    <p class="small muted">紫色点：S；青色点：邻点并集 N(S)。最大匹配用粗线标出。工具穷举全部 16 个左侧子集；同一个右点只数一次。</p>
  </div>`;
  const mode = $("#hall-case", mount), checks = [...mount.querySelectorAll("#hall-subset input")], show = $("#hall-matching", mount);
  let note = "";
  function neighbors(S) { return new Set(S.flatMap(i => samples[mode.value][i])); }
  function maximum() {
    let best = [];
    function visit(i, used, pairs) {
      if (i === 4) { if (pairs.length > best.length) best = pairs.slice(); return; }
      for (const j of samples[mode.value][i]) if (!used.has(j)) {
        used.add(j); pairs.push([i, j]); visit(i + 1, used, pairs); pairs.pop(); used.delete(j);
      }
      visit(i + 1, used, pairs);
    }
    visit(0, new Set(), []);
    return best;
  }
  function draw() {
    const S = checks.filter(c => c.checked).map(c => +c.value), N = neighbors(S), pairs = maximum();
    const good = N.size >= S.length, pairSet = new Set(pairs.map(([i, j]) => `${i}-${j}`));
    const lines = samples[mode.value].flatMap((ns, i) => ns.map(j => {
      const chosen = show.checked && pairSet.has(`${i}-${j}`), active = S.includes(i);
      return `<line x1="100" y1="${40 + 70 * i}" x2="480" y2="${40 + 70 * j}" style="stroke:var(${chosen ? "--teal" : active ? "--accent" : "--line"});stroke-width:${chosen ? 5 : active ? 2.5 : 1.5}"/>`;
    })).join("");
    const dots = [0, 1].flatMap(side => [0, 1, 2, 3].map(i => {
      const active = side ? N.has(i) : S.includes(i), x = side ? 480 : 100, y = 40 + 70 * i;
      return `<g><circle cx="${x}" cy="${y}" r="20" style="fill:var(${active ? (side ? "--teal" : "--accent") : "--surface"});stroke:var(--ink);stroke-width:1.3"/><text x="${x}" y="${y + 5}" text-anchor="middle" style="fill:var(${active ? "--accent-ink" : "--ink"});font:600 15px var(--f-mono)">${side ? "b" : "a"}${i + 1}</text></g>`;
    })).join("");
    $("#hall-graph", mount).innerHTML = `<svg viewBox="0 0 580 290" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="Hall 二部图；左侧集合与右侧邻点的完整计数见下方">${lines}${dots}</svg>`;
    const names = (xs, prefix) => xs.length ? `{${xs.map(i => prefix + (i + 1)).join(", ")}}` : "空集";
    $("#hall-out", mount).innerHTML = `<span>S = ${names(S, "a")}，N(S) = ${names([...N].sort(), "b")}</span><span>|S| = ${S.length}，|N(S)| = ${N.size}；此子集${good ? "满足条件（还不能据此断言全部满足）" : `违反 Hall，缺口为 ${S.length - N.size}` }。</span><span>全图最大匹配 ${pairs.length} 条${pairs.length === 4 ? "，可覆盖全部顶点。" : `，至少 ${4 - pairs.length} 个左点无法匹配。`}${show.checked ? " 所示匹配：" + pairs.map(([i, j]) => `a${i + 1}–b${j + 1}`).join("，") : ""}</span>${note ? `<span>${note}</span>` : ""}`;
  }
  $("#hall-find", mount).addEventListener("click", () => {
    let worst = [], deficit = 0;
    for (let mask = 0; mask < 16; mask++) {
      const S = [0, 1, 2, 3].filter(i => mask & (1 << i)), d = S.length - neighbors(S).size;
      if (d > deficit) { deficit = d; worst = S; }
    }
    note = deficit ? `已检查 16 个子集，最大缺口 ${deficit}，上图已选出一个坏子集。` : "已检查全部 16 个子集，都满足 Hall 条件；存在完美匹配。";
    if (deficit) checks.forEach((c, i) => { c.checked = worst.includes(i); });
    draw();
  });
  mode.addEventListener("change", () => { note = ""; show.checked = false; draw(); });
  checks.forEach(c => c.addEventListener("change", () => { note = ""; draw(); }));
  show.addEventListener("change", draw);
  draw();
}


/* ================= 交互工具：平面图删边与数面 ================= */
function planarPlay(mount) {

    const nodes = Object.entries(points).map(([v, [x, y]]) => `<g><circle cx="${x}" cy="${y}" r="17" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.5"/><text x="${x}" y="${y + 5}" text-anchor="middle" style="fill:var(--ink);font:600 15px var(--f-mono)">${v}</text></g>`).join("");
    $("#plane-graph", mount).innerHTML = `<svg viewBox="0 0 600 285" style="width:100%;display:block;background:var(--bg);border-radius:6px" role="img" aria-label="四个顶点的无交叉平面嵌入，当前有 ${es.length} 条边、${c} 个分支；青色是桥">${lines}${nodes}</svg>`;
    $("#plane-count", mount).innerHTML = `<span>v = 4，e = ${es.length}，c = ${c}。</span><span>先数图中有界区域，再加上外部面；非连通时使用 v−e+f = 1+c。</span>`;
    answer.value = "";
    $("#plane-result", mount).textContent = "";
  }
  checks.forEach(c => c.addEventListener("change", () => { mode.value = "custom"; draw(); }));
  mode.addEventListener("change", () => {
    if (presets[mode.value]) checks.forEach(c => { c.checked = presets[mode.value].includes(c.value); });
    draw();
  });
  answer.addEventListener("input", () => { $("#plane-result", mount).textContent = ""; });
  $("#plane-check", mount).addEventListener("click", () => {
    const es = selected(), c = components(es), f = 1 + c - 4 + es.length, guess = Number(answer.value);
    $("#plane-result", mount).textContent = !answer.value || !Number.isInteger(guess) || guess < 1 ? "先输入一个正整数面数，再核对。" : `${guess === f ? "正确。" : "再数一次："}面数 f = 1+${c}−4+${es.length} = ${f}（含外部面）；4−${es.length}+${f} = ${1 + c} = 1+c。`;
  });
  draw();
}


renderNav();
render();
</script>
</body>
</html>
